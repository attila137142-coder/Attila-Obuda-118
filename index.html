<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Attila Közlekedés V10 Unified Transit Engine</title>

<style>
body{
    margin:0;
    background:#0b0f14;
    color:#00ff88;
    font-family:monospace;
}
header{
    background:#111824;
    padding:10px;
    display:flex;
    justify-content:space-between;
    border-bottom:2px solid #00ff88;
}
#clock{font-size:20px;font-weight:bold;}
.container{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 50px);}
.sidebar{border-right:1px solid #1f2a3a;padding:10px;overflow:auto;}
.main{padding:10px;overflow:auto;}
input,button{
    width:100%;
    padding:8px;
    margin-top:6px;
    background:#0f1722;
    color:#00ff88;
    border:1px solid #00ff88;
}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;}
th,td{border:1px solid #1f2a3a;padding:6px;}
th{background:#111824;}
.highlight{color:#ffcc00;}
.small{font-size:11px;color:#7CFFB2;}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

<body>

<header>
<div>🚆 Attila Közlekedés V10 Unified Transit Engine</div>
<div id="clock">--:--:--</div>
</header>

<div class="container">

<div class="sidebar">
<h3>GTFS Loader</h3>
<input type="file" id="zipFile" accept=".zip">

<h3>Stop Search</h3>
<input type="text" id="search" placeholder="Stop name...">
<button onclick="searchStops()">Search</button>

<div id="stopList"></div>
</div>

<div class="main">
<h3>Dispatcher Board</h3>
<div id="board" class="small">GTFS nincs betöltve.</div>
</div>

</div>

<script>

// CLOCK
setInterval(()=> {
 document.getElementById("clock").innerText = new Date().toLocaleTimeString();
},1000);

// DATA
let gtfs = {stops:[],stopTimes:[]};

// ZIP LOAD
document.getElementById("zipFile").addEventListener("change", async e=>{
 const file=e.target.files[0];
 if(!file)return;

 const zip=await JSZip.loadAsync(file);

 const read=async (n)=>{
  const f=zip.file(n);
  if(!f)return[];
  const t=await f.async("string");
  return parseCSV(t);
 };

 gtfs.stops=await read("stops.txt");
 gtfs.stopTimes=await read("stop_times.txt");

 document.getElementById("board").innerHTML="GTFS betöltve ✔ Stops: "+gtfs.stops.length;
});

// SAFE CSV PARSER
function parseCSV(text){
 const lines=text.split("\n").filter(x=>x.trim());
 if(lines.length<2)return[];
 const headers=lines[0].split(",");
 return lines.slice(1).map(l=>{
  const cols=l.split(",");
  let o={};
  headers.forEach((h,i)=>o[h?.trim()]=cols[i]);
  return o;
 });
}

// SEARCH
function searchStops(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=document.getElementById("stopList");
 list.innerHTML="";

 gtfs.stops.filter(s=>(s.stop_name||"").toLowerCase().includes(q))
 .slice(0,40)
 .forEach(s=>{
  const d=document.createElement("div");
  d.className="small";
  d.style.padding="6px";
  d.style.borderBottom="1px solid #1f2a3a";
  d.style.cursor="pointer";
  d.innerHTML="🚏 "+s.stop_name;
  d.onclick=()=>openStop(s.stop_id,s.stop_name);
  list.appendChild(d);
 });
}

// STOP VIEW
function openStop(id,name){
 const board=document.getElementById("board");
 const rows=gtfs.stopTimes.filter(t=>t.stop_id===id).slice(0,60);

 board.innerHTML=`
 <h3>🚏 ${name}</h3>
 <table>
 <tr><th>Departure</th><th>Trip</th><th>Seq</th></tr>
 ${rows.map(r=>`
 <tr>
 <td class="highlight">${r.departure_time||"--"}</td>
 <td>${r.trip_id||""}</td>
 <td>${r.stop_sequence||""}</td>
 </tr>`).join("")}
 </table>`;
}

</script>

</body>
</html>
