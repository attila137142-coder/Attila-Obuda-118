<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V6 MULTI CORE DISPATCH</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#0b0f14;
  color:#fff;
}

#topbar{
  padding:10px;
  background:#111827;
  display:flex;
  gap:10px;
}

input{
  flex:1;
  padding:10px;
  border-radius:8px;
  border:none;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#22c55e;
  cursor:pointer;
}

.stop{
  padding:10px;
  border-bottom:1px solid #222;
}
</style>
</head>

<body>

<div id="topbar">
  <input id="q" placeholder="Megálló / járat keresés...">
  <button onclick="searchAll()">KERESÉS</button>
</div>

<div id="results"></div>

<script>
/* =========================
   🔐 CONFIG (IDE KÉSŐBB API-K)
========================= */
const CONFIG = {
  BKK: { enabled: true },
  MAV: { enabled: true },
  VOLAN: { enabled: true }
};

/* =========================
   🧠 UNIFIED STORAGE
========================= */
let DB = {
  stops: []
};

/* =========================
   🌐 MOCK MULTI SOURCE LOAD
   (itt később API lesz)
========================= */
async function loadAllSources(){

  // 🔵 BKK
  const bkkStops = [
    {id:"BKK_001", name:"Deák Ferenc tér", lat:47.4979, lon:19.05, provider:"BKK"},
    {id:"BKK_002", name:"Kálvin tér", lat:47.489, lon:19.061, provider:"BKK"}
  ];

  // 🟢 MÁV
  const mavStops = [
    {id:"MAV_101", name:"Budapest-Keleti", lat:47.5009, lon:19.083, provider:"MÁV"}
  ];

  // 🟡 VOLÁN
  const volanStops = [
    {id:"VOL_201", name:"Budapest Népliget autóbusz-pályaudvar", lat:47.476, lon:19.099, provider:"VOLÁN"}
  ];

  DB.stops = [...bkkStops, ...mavStops, ...volanStops];

  console.log("MULTI CORE LOADED:", DB.stops.length);
}

/* =========================
   🔍 GLOBAL SEARCH ENGINE
========================= */
function searchAll(){
  const q = document.getElementById("q").value.toLowerCase();

  const results = DB.stops.filter(s =>
    s.name.toLowerCase().includes(q) ||
    s.id.toLowerCase().includes(q)
  );

  render(results);
}

/* =========================
   🖥 RENDER
========================= */
function render(list){
  const box = document.getElementById("results");
  box.innerHTML = "";

  list.forEach(s=>{
    const div = document.createElement("div");
    div.className = "stop";

    div.innerHTML = `
      <b>${s.name}</b><br>
      <small>${s.provider}</small><br>
      ID: ${s.id}<br>
      📍 ${s.lat}, ${s.lon}
    `;

    box.appendChild(div);
  });
}

/* =========================
   🚀 INIT
========================= */
loadAllSources();
</script>

</body>
</html>
