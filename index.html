<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attila Multi GTFS V2</title>

<style>

body{
font-family:Arial;
background:#e9f0f5;
padding:15px;
}

.box{

background:white;
padding:20px;
border-radius:15px;
max-width:800px;
margin:auto;
box-shadow:0 3px 10px #999;

}

input{

width:100%;
padding:12px;
font-size:18px;
border-radius:8px;
border:2px solid #555;

}


button{

margin-top:10px;
padding:12px 25px;
font-size:18px;
background:#0066cc;
color:white;
border:0;
border-radius:8px;

}


.stop{

background:#f7f7f7;
margin-top:15px;
padding:15px;
border-left:7px solid #0066cc;
border-radius:10px;

}


.bus{
color:green;
}

.hev{
color:#aa5500;
}

.time{

font-size:18px;
font-weight:bold;

}


</style>

</head>


<body>


<div class="box">


<h2>
🚏 Attila Multi-Stop GTFS V2
</h2>


<p>
GTFS ID-k vagy megálló nevek:
</p>


<input id="search"
placeholder="F00436,008939,044192">


<button onclick="searchGTFS()">
🔎 Keresés
</button>


<div id="result"></div>


</div>



<script>


// ============================
// MINI GTFS DATABASE
// később JSON fájlba tehető
// ============================


const GTFS = {


"F00436":{

name:"Minta megálló F00436",
type:"bus",
routes:[
["160","21:45"],
["243","21:52"]
]

},


"008939":{

name:"160 busz megálló",
type:"bus",
routes:[
["160","21:45"]
]

},


"044192":{

name:"243 busz megálló",
type:"bus",
routes:[
["243","21:52"]
]

},


"09183208":{

name:"HÉV megálló",
type:"hev",
routes:[
["H8 HÉV","22:03"]
]

}


};




// ============================
// KERESŐ MOTOR
// ============================


function searchGTFS(){


let text =
document.getElementById("search").value;



let ids =
text
.split(/[,; ]+/)
.map(x=>x.trim())
.filter(x=>x);



let html="";


html+=
"<h3>Találatok: "+ids.length+" db</h3>";



ids.forEach(id=>{


let stop=GTFS[id];



if(stop){


let icon =
stop.type==="hev"
?"🚆"
:"🚌";



html+=`

<div class="stop">


<h3>
${icon} ${stop.name}
</h3>


GTFS ID:
<b>${id}</b>


<br><br>


Indulások:


${

stop.routes.map(r=>

`
<div class="time">
${r[1]} → ${r[0]}
</div>

`

).join("")

}


</div>


`;



}

else{


html+=`

<div class="stop">

❌ Nincs adat:

<b>${id}</b>

<br>

Ezt a stop ID-t még be kell tölteni a GTFS adatbázisba.

</div>

`;

}



});



document.getElementById(
"result"
).innerHTML=html;



}



</script>


</body>
</html>
