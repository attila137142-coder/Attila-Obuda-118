<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FUTÁR V5 Hibrid Helyadat + Börzsöny Core</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0b0f14;
    color:#d7e1ea;
}

#topbar{
    padding:10px;
    background:#111826;
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
}

input, button {
    padding:8px;
    border-radius:6px;
    border:1px solid #2b3a4a;
    background:#0f1722;
    color:#d7e1ea;
}

button {
    cursor:pointer;
    background:#1f6feb;
    border:none;
}

button:hover { background:#2b7fff; }

#layout {
    display:grid;
    grid-template-columns: 360px 1fr;
    height: calc(100vh - 60px);
}

#panel {
    padding:10px;
    overflow:auto;
    background:#0f1722;
    border-right:1px solid #1f2a38;
}

#map {
    height:100%;
    width:100%;
}

.card {
    background:#111826;
    padding:10px;
    margin-bottom:10px;
    border-radius:8px;
    border:1px solid #1f2a38;
}

.small {
    font-size:12px;
    opacity:0.8;
}
</style>
</head>

<body>

<div id="topbar">
    <button onclick="getGPS()">📍 Saját GPS</button>
    <input id="city" placeholder="Város" />
    <input id="street" placeholder="Utca" />
    <input id="house" placeholder="Házszám" />
    <button onclick="searchAddress()">🔎 Keresés</button>
</div>

<div id="layout">
    <div id="panel">
        <div class="card">
            <b>📡 Saját pozíció</b>
            <div id="gpsOut" class="small">Nincs adat</div>
        </div>

        <div class="card">
            <b>🏠 Cím adatok</b>
            <div id="addrOut" class="small">Nincs keresés</div>
        </div>

        <div class="card">
            <b>🧭 Terep koordináta</b>
            <div id="coordOut" class="small">-</div>
        </div>

        <div class="card">
            <b>🚍 FUTÁR Hibrid státusz</b>
            <div class="small">
                Rendszer: LIVE CORE<br>
                Térkép: ACTIVE<br>
                Börzsöny mód: ON
            </div>
        </div>
    </div>

    <div id="map"></div>
</div>

<script>
let map = L.map('map').setView([47.4979, 19.0402], 10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
}).addTo(map);

let marker;

function setMarker(lat, lon, text){
    if(marker) map.removeLayer(marker);
    marker = L.marker([lat, lon]).addTo(map)
        .bindPopup(text)
        .openPopup();

    map.setView([lat, lon], 15);
    document.getElementById("coordOut").innerHTML =
        "Lat: " + lat + "<br>Lon: " + lon;
}

// 📍 GPS lekérés
function getGPS(){
    navigator.geolocation.getCurrentPosition(async (pos)=>{
        let lat = pos.coords.latitude;
        let lon = pos.coords.longitude;

        document.getElementById("gpsOut").innerHTML =
            "Lat: " + lat + "<br>Lon: " + lon +
            "<br>Pontosság: " + pos.coords.accuracy + " m";

        setMarker(lat, lon, "Saját pozíció");

        // reverse geocode
        let url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`;
        let res = await fetch(url);
        let data = await res.json();

        document.getElementById("addrOut").innerHTML =
            data.display_name || "Nincs cím adat";

    }, ()=>{
        alert("GPS nem elérhető (böngésző engedély kell)");
    });
}

// 🏠 cím keresés
async function searchAddress(){
    let city = document.getElementById("city").value;
    let street = document.getElementById("street").value;
    let house = document.getElementById("house").value;

    let query = `${city} ${street} ${house}`;

    let url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;

    let res = await fetch(url);
    let data = await res.json();

    if(data.length > 0){
        let lat = data[0].lat;
        let lon = data[0].lon;

        document.getElementById("addrOut").innerHTML =
            data[0].display_name;

        setMarker(lat, lon, "Keresett cím");
    } else {
        alert("Nincs találat");
    }
}

// 🗺️ térkép kattintás
map.on('click', function(e){
    setMarker(e.latlng.lat, e.latlng.lng, "Térképpont");
});
</script>

</body>
</html>
