<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🚦 FUTÁR V4.1 STABLE ENGINE</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#060a10;
  color:#d7e1ea;
}

header{
  background:#0f1621;
  padding:10px;
  display:flex;
  justify-content:space-between;
  border-bottom:2px solid #1f2a3a;
}

#clock{
  font-size:20px;
  font-weight:bold;
  color:#00e5ff;
}

.container{
  display:grid;
  grid-template-columns:360px 1fr;
  height:calc(100vh - 50px);
}

.panel{
  background:#0f1621;
  padding:10px;
  border-right:1px solid #1f2a3a;
  overflow:auto;
}

.main{
  padding:10px;
  overflow:auto;
}

input,button{
  width:100%;
  padding:8px;
  margin-top:6px;
  background:#111826;
  border:1px solid #2b3b52;
  color:white;
}

button{
  background:#1e88e5;
  font-weight:bold;
  cursor:pointer;
}

.bigClock{
  font-size:40px;
  text-align:center;
  padding:10px;
  margin-bottom:10px;
  background:#0f1621;
  border:1px solid #1f2a3a;
  color:#00e5ff;
  font-weight:bold;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

td,th{
  border:1px solid #2b3b52;
  padding:6px;
  font-size:12px;
}

th{
  background:#111826;
  color:#4dd0e1;
}

.badge{
  background:#1e88e5;
  padding:2px 6px;
  border-radius:4px;
}

.green{color:#00e676;font-weight:bold;}
.yellow{color:#ffeb3b;font-weight:bold;}
.red{color:#ff5252;font-weight:bold;}

.stopItem{
  padding:6px;
  border-bottom:1px solid #1f2a3a;
  cursor:pointer;
}
.stopItem:hover{background:#111826;}
</style>
</head>

<body>

<header>
<div>🚦 FUTÁR V4.1 STABLE GTFS ENGINE</div>
<div id="clock"></div>
</header>

<div class="container">

<div class="panel">

<div class="bigClock" id="bigClock">00:00:00</div>

<h3>📦 GTFS ZIP</h3>
<input type="file" id="zip"/>
<button onclick="loadGTFS()">LOAD GTFS</button>

<hr/>

<h3>🔍 STOP SEARCH</h3>
<input id="search" oninput="searchStops()"/>
<div id="results"></div>

</div>

<div class="main">

<h2>🚏 STOP VIEW</h2>
<div id="stopInfo">Nincs kiválasztva</div>

<table>
<thead>
<tr>
<th>Járat</th>
<th>Irány</th>
<th>Indulás</th>
<th>Státusz</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>

</div>

<script>

let GTFS={
  stops:[],
  routes:[],
  trips:[],
  stopTimes:[]
};

let LIVE=false;

// CLOCK
setInterval(()=>{
  const now=new Date();
  document.getElementById("clock").innerText=
    now.toLocaleTimeString();

  document.getElementById("bigClock").innerText=
    now.toLocaleTimeString();
},1000);

// -------------------- GTFS LOAD --------------------
async function loadGTFS(){
  const file=document.getElementById("zip").files[0];
  if(!file) return alert("Nincs ZIP!");

  const zip=await JSZip.loadAsync(file);

  GTFS.stops=parseCSV(await zip.file("stops.txt").async("string"));
  GTFS.routes=parseCSV(await zip.file("routes.txt").async("string"));
  GTFS.trips=parseCSV(await zip.file("trips.txt").async("string"));
  GTFS.stopTimes=parseCSV(await zip.file("stop_times.txt").async("string"));

  alert("GTFS betöltve ✔");
}

// -------------------- ROBUST CSV PARSER --------------------
function parseCSV(text){
  const lines=text.replace(/\r/g,"")
    .split("\n")
    .filter(l=>l.trim().length>0);

  const headers=lines[0].split(",");

  return lines.slice(1).map(line=>{

    const values=line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g)||[];

    const obj={};

    headers.forEach((h,i)=>{
      obj[h.trim()]=(values[i]||"").replace(/"/g,"").trim();
    });

    return obj;
  });
}

// -------------------- SEARCH --------------------
function searchStops(){
  const q=document.getElementById("search").value.toLowerCase();

  const res=GTFS.stops.filter(s=>
    (s.stop_name||"").toLowerCase().includes(q)
  );

  document.getElementById("results").innerHTML=
    res.slice(0,40).map(s=>`
      <div class="stopItem"
           onclick="selectStop('${s.stop_id}','${s.stop_name}')">
        🚏 ${s.stop_name}
      </div>
    `).join("");
}

// -------------------- STOP SELECT --------------------
function selectStop(id,name){

  document.getElementById("stopInfo").innerHTML=
    `<h3>🚏 ${name}</h3><span class="badge">${id}</span>`;

  const base=GTFS.stopTimes.filter(t=>
    (t.stop_id||"").trim()===id
  );

  render(base);
}

// -------------------- RENDER --------------------
function render(list){

  document.getElementById("table").innerHTML=
    list.slice(0,30).map(t=>{

      const trip=GTFS.trips.find(x=>x.trip_id===t.trip_id);
      const route=GTFS.routes.find(r=>r.route_id===trip?.route_id);

      const line=route?.route_short_name||"?";
      const dir=trip?.trip_headsign||t.stop_headsign||"→ ?";

      let status="🟢 ON TIME";

      if(LIVE){
        const d=Math.floor(Math.random()*6-2);
        if(d>2) status="🟡 DELAYED";
        else if(d<0) status="🔵 EARLY";
      }

      return `
        <tr>
          <td><span class="badge">${line}</span></td>
          <td>${dir}</td>
          <td>${t.arrival_time||"-"}</td>
          <td class="${
            status.includes("DELAYED")?"yellow":
            status.includes("EARLY")?"red":"green"
          }">
            ${status}
          </td>
        </tr>
      `;
    }).join("");
}

</script>

</body>
</html>
