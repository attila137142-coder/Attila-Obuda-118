<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>SLOPE ENGINE V1.1</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
  body { margin:0; font-family:Arial; background:#111; color:#fff; }
  #map { height: 55vh; }
  #panel { padding:10px; }
  input, button { padding:10px; margin:5px; font-size:14px; }
  table { width:100%; font-size:12px; border-collapse: collapse; }
  td, th { border:1px solid #444; padding:4px; }
</style>
</head>
<body>

<div id="map"></div>

<div id="panel">
  <input id="street" placeholder="Pl: Hegyalja út">
  <button onclick="searchStreet()">UTCA KERESÉS</button>
  <button onclick="calcSlope()">MEREDESÉG</button>

  <table id="table">
    <tr>
      <th>Szakasz</th>
      <th>Hossz (m)</th>
      <th>Δh (m)</th>
      <th>Meredekség (%)</th>
    </tr>
  </table>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map = L.map('map').setView([47.4979, 19.0402], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

let road = null;
let segments = [];

async function searchStreet() {
  let name = document.getElementById("street").value;

  let url = `https://nominatim.openstreetmap.org/search?format=json&q=${name}, Budapest`;

  let res = await fetch(url);
  let data = await res.json();

  if (data.length == 0) {
    alert("Nincs találat!");
    return;
  }

  let place = data[0];

  map.setView([place.lat, place.lon], 16);

  // Overpass API – utca lekérés
  let overpass = `
  [out:json];
  way["name"="${name}"](47.3,18.9,47.7,19.3);
  out geom;
  `;

  let res2 = await fetch("https://overpass-api.de/api/interpreter", {
    method: "POST",
    body: overpass
  });

  let osm = await res2.json();

  if (osm.elements.length == 0) {
    alert("Utca nincs OSM-ben így!");
    return;
  }

  let coords = osm.elements[0].geometry.map(p => [p.lat, p.lon]);

  if (road) map.removeLayer(road);

  road = L.polyline(coords, {color:"cyan"}).addTo(map);

  window.coords = coords;

  alert("Utca betöltve!");
}

function getElevation(lat, lon) {
  // DEM helyett ideiglenes (később API!)
  return 100 + Math.sin(lat*20)*15 + Math.cos(lon*20)*15;
}

function calcSlope() {
  if (!window.coords) {
    alert("Előbb keress utcát!");
    return;
  }

  segments = [];

  for (let i=0; i<coords.length-1; i++) {

    let [lat1, lon1] = coords[i];
    let [lat2, lon2] = coords[i+1];

    let h1 = getElevation(lat1, lon1);
    let h2 = getElevation(lat2, lon2);

    let dist = map.distance([lat1, lon1],[lat2, lon2]);

    let slope = ((h2-h1)/dist)*100;

    drawSegment(lat1, lon1, lat2, lon2, slope);
    addRow(dist, h2-h1, slope);
  }
}

function drawSegment(lat1, lon1, lat2, lon2, slope) {
  let color = "green";
  if (slope > 5) color = "orange";
  if (slope > 10) color = "red";

  L.polyline([[lat1,lon1],[lat2,lon2]], {
    color: color,
    weight: 5
  }).addTo(map);
}

function addRow(dist, dh, slope) {
  let table = document.getElementById("table");

  let row = table.insertRow();

  row.innerHTML = `
    <td>Szakasz</td>
    <td>${dist.toFixed(1)}</td>
    <td>${dh.toFixed(1)}</td>
    <td>${slope.toFixed(2)}</td>
  `;
}
</script>

</body>
</html>
