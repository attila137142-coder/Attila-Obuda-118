<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V7.3 FULL DISPATCH CENTER</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0f14;
  color:#e6f1ff;
  display:flex;
  height:100vh;
}

#sidebar{
  width:420px;
  background:#0f172a;
  overflow:auto;
  border-right:1px solid #1f2937;
}

#map{
  flex:1;
}

.header{
  padding:10px;
  background:#111827;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
}

.panel{
  padding:10px;
  border-bottom:1px solid #1f2937;
}

button{
  width:100%;
  padding:8px;
  margin-top:5px;
  background:#1d4ed8;
  color:white;
  border:none;
  border-radius:6px;
}

input{
  width:100%;
  padding:8px;
  border-radius:6px;
  border:none;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:4px 0;
  border-bottom:1px solid #1f2937;
}

.bad{color:#ff4d4d;}
.warn{color:#ffcc00;}
.ok{color:#00ff99;}
</style>
</head>

<body>

<div id="sidebar">

<div class="header">
🚍 V7.3 DISPATCH CENTER
<div id="clock"></div>
</div>

<div class="panel">
<input type="file" id="zip">
<button onclick="loadAll()">GTFS LOAD (BKK + VOLÁN)</button>
</div>

<div class="panel">
<input id="search" placeholder="Megálló keresés...">
<button onclick="searchStop()">KERESÉS</button>
</div>

<div class="panel">
<h3>🧠 NEXT DEPARTURES</h3>
<div id="board"></div>
</div>

<div class="panel">
<h3>📡 ENGINE STATUS</h3>
<div id="status">
GTFS: WAITING...<br>
MODE: V7.3 FULL DISPATCH<br>
</div>
</div>

</div>

<div id="map"></div>

<script>

// ================= MAP =================
const map = L.map('map').setView([47.5,19.05],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'OSM'
}).addTo(map);

// ================= STATE =================
let stops = [];
let departures = {};
let selectedStop = null;

// ================= CLOCK =================
setInterval(()=>{
  document.getElementById("clock").innerText =
    new Date().toLocaleTimeString();
},1000);

// ================= TIME ENGINE =================
function timeToSec(t){
  let [h,m,s] = t.split(":").map(Number);
  return h*3600 + m*60 + s;
}

function getNext(list){
  let now = new Date();
  let sec = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();

  return list
    .map(d=>({...d,sec:timeToSec(d.time)}))
    .filter(d=>d.sec>=sec)
    .sort((a,b)=>a.sec-b.sec)
    .slice(0,10);
}

// ================= LOAD GTFS =================
async function loadAll(){

  const file = document.getElementById("zip").files[0];
  const zip = await JSZip.loadAsync(file);

  stops = [];
  departures = {};

  for(let p in zip.files){

    let name = p.split("/").pop().toLowerCase();
    let content = await zip.files[p].async("string");

    if(name==="stops.txt"){
      stops = Papa.parse(content,{header:true}).data;
    }

    if(name==="stop_times.txt"){
      let rows = Papa.parse(content,{header:true}).data;

      rows.forEach(r=>{
        if(!departures[r.stop_id]) departures[r.stop_id]=[];
        departures[r.stop_id].push({
          trip:r.trip_id,
          time:r.departure_time
        });
      });
    }
  }

  renderMap();
  updateStatus();
}

// ================= MAP =================
function renderMap(){

  stops.forEach(s=>{
    if(!s.stop_lat) return;

    L.circleMarker([s.stop_lat,s.stop_lon],{
      radius:4,
      color:"#00ffff"
    }).addTo(map)
    .on("click",()=>{
      selectedStop=s;
      renderBoard(s);
    });
  });
}

// ================= BOARD =================
function renderBoard(stop){

  let list = departures[stop.stop_id] || [];
  let next = getNext(list);

  let html = "";

  next.forEach(d=>{
    let st = d.sec < Date.now()/1000 ? "bad" : "ok";

    html += `
      <div class="row">
        <div>${d.trip}</div>
        <div class="${st}">${d.time}</div>
      </div>
    `;
  });

  document.getElementById("board").innerHTML =
    `<b>${stop.stop_name}</b><br><br>` + html;
}

// ================= SEARCH =================
function searchStop(){

  let q = document.getElementById("search").value.toLowerCase();

  let found = stops.find(s=>
    s.stop_name && s.stop_name.toLowerCase().includes(q)
  );

  if(found){
    map.setView([found.stop_lat,found.stop_lon],14);
    renderBoard(found);
  }
}

// ================= STATUS =================
function updateStatus(){
  document.getElementById("status").innerHTML = `
  GTFS: LOADED ✔<br>
  STOPS: ${stops.length}<br>
  MODE: V7.3 FULL DISPATCH ACTIVE<br>
  `;
}

</script>

</body>
</html>
