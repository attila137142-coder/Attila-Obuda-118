<script>

const map = L.map('map').setView([47.52, 18.97], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

function distance(latlngs){
  let d = 0;
  for(let i=1;i<latlngs.length;i++){
    d += map.distance(latlngs[i-1], latlngs[i]);
  }
  return d;
}

function fakeElevation(latlng){
  return Math.sin(latlng[0]*10) * 50 + 200;
}

function slope(latlngs){
  let h1 = fakeElevation(latlngs[0]);
  let h2 = fakeElevation(latlngs[latlngs.length-1]);
  let d = distance(latlngs);
  return ((h2 - h1) / d * 100).toFixed(2);
}

fetch("budai.geojson")
.then(r => r.json())
.then(data => {

  L.geoJSON(data, {

    style: {
      color: "green",
      weight: 4
    },

    onEachFeature: function(feature, layer) {

      // 🔥 KULCS FIX: minden feature-re külön számolunk
      if (!feature.geometry) return;

      let coordsRaw = feature.geometry.coordinates;

      // MultiLineString fix
      let coords = [];

      if (feature.geometry.type === "LineString") {
        coords = coordsRaw.map(c => [c[1], c[0]]);
      }

      if (feature.geometry.type === "MultiLineString") {
        coordsRaw.forEach(line => {
          line.forEach(c => coords.push([c[1], c[0]]));
        });
      }

      let d = (distance(coords)/1000).toFixed(2);
      let s = slope(coords);

      layer.bindPopup(
        "🌲 Turistaút<br><br>" +
        "📏 " + d + " km<br>" +
        "⛰️ " + s + "%"
      );

      // 🔥 EZ A FONTOS FIX
      layer.on("click", function(e){
        L.popup()
          .setLatLng(e.latlng)
          .setContent(
            "🌲 Szakasz<br>" +
            "📏 " + d + " km<br>" +
            "⛰️ " + s + "%"
          )
          .openOn(map);
      });

    }

  }).addTo(map);

});

</script>
