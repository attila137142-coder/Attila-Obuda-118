<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V5 GITHUB STABLE</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0f14;
  color: #e6e6e6;
}

header {
  padding: 10px;
  background: #111826;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.clock {
  color: #4dd0e1;
  font-weight: bold;
}

button {
  background: #1f2a3a;
  border: none;
  color: white;
  padding: 8px 12px;
  cursor: pointer;
  border-radius: 6px;
}

.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: calc(100vh - 50px);
}

.panel {
  padding: 10px;
  overflow: auto;
}

.map {
  background: #0f1722;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #666;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 8px;
  border-bottom: 1px solid #1f2a3a;
  font-size: 13px;
}

th {
  color: #90caf9;
  text-align: left;
}

.ok { color: #b0bec5; }
.late { color: #ff5252; }
</style>
</head>

<body>

<header>
  <div>🚍 FUTÁR V5 GITHUB SAFE</div>
  <div class="clock" id="clock">--:--:--</div>
  <button onclick="addRow()">🔄 Frissítés</button>
</header>

<div class="container">

  <div class="panel map">
    🗺️ TÉRKÉP HELY (később Leaflet)
  </div>

  <div class="panel">
    <h3>🚏 Élő indulások</h3>

    <table>
      <thead>
        <tr>
          <th>Járat</th>
          <th>Megálló</th>
          <th>Indulás</th>
          <th>Késés</th>
        </tr>
      </thead>

      <tbody id="table">
        <tr>
          <td>34</td>
          <td>Békásmegyer</td>
          <td>12:05</td>
          <td class="ok">0p</td>
        </tr>
      </tbody>
    </table>

  </div>

</div>

<script>

// CLOCK (SAFE)
setInterval(() => {
  const el = document.getElementById("clock");
  if (el) el.innerText = new Date().toLocaleTimeString();
}, 1000);

// SAFE ADD ROW (NO CRASH EVER)
function addRow() {
  const table = document.getElementById("table");

  if (!table) return;

  const row = document.createElement("tr");

  const delay = Math.floor(Math.random() * 6);

  let color = "ok";
  if (delay > 3) color = "late";

  row.innerHTML = `
    <td>TEST</td>
    <td>Auto</td>
    <td>--:--</td>
    <td class="${color}">${delay}p</td>
  `;

  table.appendChild(row);
}

</script>

</body>
</html>
