<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<title>V10 GTFS Stable Engine</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{font-family:Arial;background:#0f172a;color:#e2e8f0;padding:20px}
button{padding:10px;margin:5px;cursor:pointer}
.box{background:#111827;padding:10px;margin-top:10px;border-radius:10px}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{border:1px solid #334155;padding:6px;font-size:12px}
.bad{color:#f87171}
.ok{color:#4ade80}
</style>
</head>
<body>

<h2>🚀 V10 GTFS STABLE ENGINE</h2>

<input type="file" id="file" />
<button onclick="loadGTFS()">GTFS betöltés</button>

<div class="box" id="status">Várakozás...</div>
<div class="box" id="log"></div>

<h3>📦 ZIP fájlok</h3>
<div class="box" id="files"></div>

<h3>🚏 Megállók (első 20)</h3>
<table id="stopsTable"></table>

<script>
let zipData;

function log(msg){
  document.getElementById('log').innerHTML += msg+"<br>";
}

function setStatus(msg, ok=true){
  document.getElementById('status').innerHTML = ok ? "<span class='ok'>"+msg+"</span>" : "<span class='bad'>"+msg+"</span>";
}

async function loadGTFS(){
  const file = document.getElementById('file').files[0];
  if(!file){alert("Nincs fájl!");return;}

  log("📦 ZIP betöltés...");

  const arrayBuffer = await file.arrayBuffer();
  log("ZIP méret: " + arrayBuffer.byteLength);

  if(arrayBuffer.byteLength < 50000){
    setStatus("❌ Gyanúsan kicsi ZIP (nem GTFS)",false);
    return;
  }

  const zip = await JSZip.loadAsync(arrayBuffer);
  zipData = zip;

  const fileList = Object.keys(zip.files);
  document.getElementById('files').innerHTML = fileList.map(f=>"• "+f).join("<br>");

  log("📂 Fájlok száma: " + fileList.length);

  const stopsFile = fileList.find(f=>f.toLowerCase().includes("stops.txt"));
  const routesFile = fileList.find(f=>f.toLowerCase().includes("routes.txt"));
  const tripsFile = fileList.find(f=>f.toLowerCase().includes("trips.txt"));

  if(!stopsFile || !routesFile || !tripsFile){
    setStatus("❌ Hiányzó GTFS fájlok",false);
    log("Hiány: stops/routes/trips");
    return;
  }

  const stopsText = await zip.file(stopsFile).async("string");
  const lines = stopsText.split("\n");

  log("🚏 stops sorok: " + lines.length);

  let html = "<tr><th>ID</th><th>Név</th></tr>";

  for(let i=1;i<Math.min(20,lines.length);i++){
    const parts = lines[i].split(",");
    if(parts.length>2){
      html += `<tr><td>${parts[0]}</td><td>${parts[2]}</td></tr>`;
    }
  }

  document.getElementById('stopsTable').innerHTML = html;

  setStatus("✅ GTFS betöltve OK");

  log("🧠 Routes file: " + routesFile);
  log("🧠 Trips file: " + tripsFile);
}
</script>

</body>
</html>
