/* ---------------------------------------------------------

   --------------------------------------------------------- */

function delayHTML(delay){

  if(delay===null ||
     delay===undefined ||
     !Number.isFinite(Number(delay))){

    return '<span class="noData">NINCS ADAT</span>';
  }

  delay=Number(delay);

  if(delay>0){

    const sec=Math.round(delay);
    const min=Math.floor(sec/60);
    const s=String(sec%60).padStart(2,'0');

    return `
      <span class="delayLate">
        🔵 KÉSÉS +${min}:${s}
      </span>
    `;
  }

  if(delay<0){

    const sec=Math.round(Math.abs(delay));
    const min=Math.floor(sec/60);
    const s=String(sec%60).padStart(2,'0');

    return `
      <span class="delayEarly">
        🔴 SIETÉS −${min}:${s}
      </span>
    `;
  }

  return `
    <span class="delayOK">
      🟢 0:00 MENETREND SZERINT
    </span>
  `;
}

/* ---------------------------------------------------------
   PROTOBUF.JS BETÖLTÉS
   --------------------------------------------------------- */

let bkkProtoReady=null;

async function loadBKKProto(){

  if(window.protobuf){
    return window.protobuf;
  }

  if(bkkProtoReady){
    return bkkProtoReady;
  }

  bkkProtoReady=new Promise((resolve,reject)=>{

    const old=document.querySelector(
      'script[data-attila-protobuf="1"]'
    );

    if(old){

      const check=setInterval(()=>{

        if(window.protobuf){

          clearInterval(check);
          resolve(window.protobuf);

        }

      },50);

      setTimeout(()=>{
        clearInterval(check);

        if(!window.protobuf){
          reject(
            new Error('protobuf.js betöltési időtúllépés')
          );
        }

      },10000);

      return;
    }

    const s=document.createElement('script');

    s.dataset.attilaProtobuf='1';

    s.src=
      'https://cdn.jsdelivr.net/npm/protobufjs@7.4.0/dist/protobuf.min.js';

    s.onload=()=>{

      if(window.protobuf){
        resolve(window.protobuf);
      }else{
        reject(
          new Error('protobuf.js nem érhető el')
        );
      }

    };

    s.onerror=()=>{

      reject(
        new Error('protobuf.js betöltése sikertelen')
      );

    };

    document.head.appendChild(s);

  });

  return bkkProtoReady;
}


/* ---------------------------------------------------------
   PROTOBUF ROOT
   --------------------------------------------------------- */

let bkkRoot=null;

async function getBKKRoot(){

  const protobuf=await loadBKKProto();

  if(bkkRoot){
    return bkkRoot;
  }

  bkkRoot=protobuf.Root.fromJSON({
    nested:{
      transit_realtime:{
        nested:BKK_PROTO
      }
    }
  });

  return bkkRoot;
}

function getBKKKey(){

function bkkStopName(stopId){

  if(!stopId){
    return 'NINCS ADAT';
  }

  const id=String(stopId);

  const arr=D.BKK?.stops || [];

  const st=arr.find(x=>
    String(x.stop_id)===id
  );

  if(!st){
    return 'NINCS ADAT';
  }

  return st.stop_name ||
         st.name ||
         'NINCS ADAT';
}


/* ---------------------------------------------------------
   BKK GTFS ROUTE KERESÉS
   --------------------------------------------------------- */

function bkkRouteName(routeId){

  if(!routeId){
    return 'NINCS ADAT';
  }

  const id=String(routeId);

  const arr=D.BKK?.routes || [];

  const r=arr.find(x=>
    String(x.route_id)===id
  );

  if(!r){
    return id;
  }

  return r.route_short_name ||
         r.route_long_name ||
         id;
}


/* ---------------------------------------------------------
   BKK ROUTE TÍPUS
   --------------------------------------------------------- */

function bkkRouteType(routeId){

  if(!routeId){
    return 'NINCS ADAT';
  }

  const id=String(routeId);

  const arr=D.BKK?.routes || [];

  const r=arr.find(x=>
    String(x.route_id)===id
  );

  if(!r){
    return 'NINCS ADAT';
  }

  const t=
    r.route_type!==undefined
      ? Number(r.route_type)
      : null;

  if(t===3){
    return 'BUSZ';
  }

  if(t===0){
    return 'VILLAMOS';
  }

  if(t===1){
    return 'METRÓ';
  }

  if(t===4){
    return 'HÉV';
  }

  if(t===11){
    return 'TROLIBUSZ';
  }

  return 'NINCS ADAT';
}

/* ---------------------------------------------------------
   TRIP UPDATE TÁROLÓ
   --------------------------------------------------------- */

const bkkUpdates=new Map();


/* ---------------------------------------------------------
   TRIPUPDATE FELDOLGOZÁS
   --------------------------------------------------------- */

function parseBKKTripUpdates(feed){

  bkkUpdates.clear();

  if(!feed || !feed.entity){
    return;
  }

  for(const entity of feed.entity){

    const tu=entity.tripUpdate;

    if(!tu){
      continue;
    }

    const trip=tu.trip || {};

    const tripId=
      trip.tripId ||
      '';

    if(!tripId){
      continue;
    }

    const info={

      tripId,

      routeId:
        trip.routeId || '',

      tripDelay:
        Number.isFinite(Number(tu.delay))
          ? Number(tu.delay)
          : null,

      vehicleId:
        tu.vehicle?.id ||
        '',

      vehicleLabel:
        tu.vehicle?.label ||
        '',

      bySequence:new Map(),

      byStopId:new Map()

    };


    const updates=
      tu.stopTimeUpdate || [];


    for(const st of updates){

      let delay=null;

      if(st.arrival &&
         Number.isFinite(
           Number(st.arrival.delay)
         )){

        delay=
          Number(st.arrival.delay);

      }else
      if(st.departure &&
         Number.isFinite(
           Number(st.departure.delay)
         )){

        delay=
          Number(st.departure.delay);

      }


      if(delay===null){
        continue;
      }


      const seq=
        Number(st.stopSequence);


      if(
        Number.isFinite(seq) &&
        seq>0
      ){

        info.bySequence.set(
          seq,
          delay
        );

      }


      if(st.stopId){

        info.byStopId.set(
          String(st.stopId),
          delay
        );

      }

    }


    bkkUpdates.set(
      tripId,
      info
    );

  }
}


/* ---------------------------------------------------------
   PONTOS DELAY KERESÉSE
   --------------------------------------------------------- */

function getBKKDelay(
  tripId,
  stopSequence,
  stopId
){

  const info=
    bkkUpdates.get(
      String(tripId || '')
    );

  if(!info){
    return null;
  }


  /* 1. pontos megállási sorrend */

  const seq=
    Number(stopSequence);

  if(
    Number.isFinite(seq) &&
    info.bySequence.has(seq)
  ){

    return info.bySequence.get(seq);

  }


  /* 2. pontos GTFS stop ID */

  if(stopId){

    const sid=
      String(stopId);

    if(info.byStopId.has(sid)){

      return info.byStopId.get(sid);

    }

  }


  /* 3. trip szintű fallback */

  if(
    info.tripDelay!==null &&
    Number.isFinite(info.tripDelay)
  ){

    return info.tripDelay;

  }


  return null;
}


/* ---------------------------------------------------------
   BKK JÁRMŰ NORMALIZÁLÁS
   --------------------------------------------------------- */

function normalizeBKKVehicle(v){

  const pos=
    v.position || {};

  const trip=
    v.trip || {};

  const vd=
    v.vehicle || {};


  const routeId=
    trip.routeId || '';


  const tripId=
    trip.tripId || '';


  const stopId=
    v.stopId || '';


  const sequence=
    Number(v.currentStopSequence);


  const lat=
    Number(pos.latitude);


  const lon=
    Number(pos.longitude);


  const validGPS=
    Number.isFinite(lat) &&
    Number.isFinite(lon);


  const delay=
    getBKKDelay(
      tripId,
      sequence,
      stopId
    );


  return {

    provider:'BKK',

    service:'BKV / BKK',


    id:
      vd.id ||
      '',


    label:
      vd.label ||
      '',


    plate:
      vd.licensePlate ||
      '',


    forgalmi:
      bkkForgalmi(vd),


    type:
      bkkVehicleType(routeId),


    route_id:
      routeId,


    route:
      bkkRouteName(routeId),


    route_type:
      bkkRouteType(routeId),


    trip_id:
      tripId,


    lat:
      validGPS
        ? lat
        : null,


    lon:
      validGPS
        ? lon
        : null,


    bearing:
      Number.isFinite(
        Number(pos.bearing)
      )
      ? Number(pos.bearing)
      : null,


    speed:
      Number.isFinite(
        Number(pos.speed)
      )
      ? Number(pos.speed)
      : null,


    current_stop_sequence:
      Number.isFinite(sequence)
        ? sequence
        : null,


    stop_id:
      stopId,


    currentStop:
      bkkStopName(stopId),


    currentStopId:
      stopId || 'NINCS ADAT',


    delay:


      delay,


    timestamp:
      v.timestamp || null,


    current_status:
      v.currentStatus !== undefined
        ? Number(v.currentStatus)
        : null

  };
}

/* ---------------------------------------------------------
   JÁRMŰ KERESŐ
   --------------------------------------------------------- */

function vehicleSearch(){

  const q=
    String(
      S.search || ''
    )
    .trim()
    .toLowerCase();


  const provider=
    $('vehicleProvider')?.value ||
    'ALL';


  const type=
    $('vehicleType')?.value ||
    'ALL';


  const line=
    String(
      $('vehicleLine')?.value ||
      ''
    )
    .trim()
    .toLowerCase();


  const list=
    vehicles.filter(v=>{

      if(
        provider!=='ALL' &&
        String(v.provider)!==provider
      ){
        return false;
      }


      if(
        type!=='ALL' &&
        typeof vehicleTypeMatch==='function' &&
        !vehicleTypeMatch(v,type)
      ){
        return false;
      }


      if(
        line &&
        !String(
          v.route || ''
        )
        .toLowerCase()
        .includes(line) &&
        !String(
          v.route_id || ''
        )
        .toLowerCase()
        .includes(line)
      ){
        return false;
      }


      if(
        q &&
        !vehicleSearchText(v)
          .includes(q)
      ){
        return false;
      }


      return true;

    });


  const box=
    $('vehicleResults');


  if(!box){
    return;
  }


  if(!list.length){

    box.innerHTML=`

      <div class="empty">

        Nincs találat.

      </div>

    `;

    return;
  }


  box.innerHTML=
    list.map(vehicleCard).join('');
}


/* ---------------------------------------------------------
   BKK REALTIME
   --------------------------------------------------------- */

let bkkLoading=false;

let bkkTimer=null;


async function bkkRT(){

  if(bkkLoading){
    return;
  }


  bkkLoading=true;


  try{

    const key=
      getBKKKey();


    if(!key){

      if($('bkkStatus')){

        $('bkkStatus').innerHTML=
          '🔵 BKK: API KULCS HIÁNYZIK';

      }

      return;
    }


    const root=
      await getBKKRoot();


    const VP=
      root.lookupType(
        'transit_realtime.FeedMessage'
      );


    const vehicleURL=
      BKK_VEHICLE_URL+
      '?key='+
      encodeURIComponent(key);


    const tripURL=
      BKK_TRIP_URL+
      '?key='+
      encodeURIComponent(key);


    const [
      vehicleResponse,
      tripResponse
    ]=
      await Promise.all([

        fetch(
          vehicleURL,
          {
            cache:'no-store'
          }
        ),

        fetch(
          tripURL,
          {
            cache:'no-store'
          }
        )

      ]);


    if(!vehicleResponse.ok){

      throw new Error(
        'BKK VehiclePositions HTTP '+
        vehicleResponse.status
      );

    }


    if(!tripResponse.ok){

      throw new Error(
        'BKK TripUpdates HTTP '+
        tripResponse.status
      );

    }


    const [
      vehicleBuffer,
      tripBuffer
    ]=
      await Promise.all([

        vehicleResponse.arrayBuffer(),

        tripResponse.arrayBuffer()

      ]);


    const vehicleFeed=
      VP.decode(
        new Uint8Array(vehicleBuffer)
      );


    const tripFeed=
      VP.decode(
        new Uint8Array(tripBuffer)
      );


    /*
      ELŐSZÖR TripUpdates!
      Így a járművek normalizálásakor
      már rendelkezésre áll a késés.
    */

    parseBKKTripUpdates(
      tripFeed
    );


    const nextVehicles=[];


    for(
      const entity
      of (
        vehicleFeed.entity || []
      )
    ){

      if(
        entity.isDeleted ||
        !entity.vehicle
      ){
        continue;
      }


      const v=
        normalizeBKKVehicle(
          entity.vehicle
        );


      if(!v.id && !v.label){
        continue;
      }


      nextVehicles.push(v);

    }


    /*
      CSAK a BKK tömböt cseréljük.
      MÁV / VOLÁN / GYV megmarad.
    */

    vehiclesBKK=
      nextVehicles;


    rebuildVehicles();


    vehicleSearch();


    if(
      typeof drawVehicles==='function'
    ){

      drawVehicles();

    }


    if($('bkkStatus')){

      $('bkkStatus').innerHTML=
        `🔵 BKK REALTIME OK —
         ${nextVehicles.length} jármű`;

    }


    if($('status')){

      $('status').textContent=
        `BKK realtime: ${nextVehicles.length}`;

    }


  }catch(err){

    console.error(
      'BKK REALTIME HIBA:',
      err
    );


    if($('bkkStatus')){

      $('bkkStatus').innerHTML=
        '🔴 BKK REALTIME HIBA: '+
        (
          err.message ||
          'ismeretlen hiba'
        );

    }

  }finally{

    bkkLoading=false;


    /*
      NEM setInterval!
      Az előző lekérésnek előbb
      teljesen be kell fejeződnie.
    */

    if(bkkTimer){

      clearTimeout(bkkTimer);

    }


    bkkTimer=
      setTimeout(
        bkkRT,
        15000
      );

  }

}


/* ---------------------------------------------------------
   BKK LEÁLLÍTÁS
   --------------------------------------------------------- */

function stopBKKRealtime(){

  if(bkkTimer){

    clearTimeout(
      bkkTimer
    );

    bkkTimer=null;

  }

}


/* ---------------------------------------------------------
   BKK INDÍTÁS
   --------------------------------------------------------- */

function startBKKRealtime(){

  if(bkkTimer){

    clearTimeout(
      bkkTimer
    );

    bkkTimer=null;

  }


  bkkRT();

}


/* ---------------------------------------------------------
   BKK KÉZI FRISSÍTÉS
   --------------------------------------------------------- */

window.refreshBKK=
  function(){

    if(bkkTimer){

      clearTimeout(
        bkkTimer
      );

      bkkTimer=null;

    }

    bkkRT();

  };


/* ---------------------------------------------------------
   TÉRKÉPI BKV MARKER SZÍN
   --------------------------------------------------------- */

function getVehicleColor(v){

  switch(
    String(
      v.provider ||
      ''
    ).toUpperCase()
  ){

    case 'BKK':
    case 'BKV':
      return '#1976d2';

    case 'VOLAN':
    case 'VOLÁN':
      return '#f57c00';

    case 'HEV':
    case 'HÉV':
      return '#2e7d32';

    case 'MAV':
    case 'MÁV':
      return '#795548';

    case 'GYV':
    case 'GYERMEKVASUT':
      return '#8e24aa';

    default:
      return '#757575';

  }

}


/* ---------------------------------------------------------
   SZÍNES JÁRMŰ MARKER
   --------------------------------------------------------- */

function vehicleMarkerHTML(v){

  const color=
    getVehicleColor(v);


  const text=
    v.route ||
    v.label ||
    v.id ||
    '?';


  return `

    <div style="
      width:42px;
      height:42px;
      border-radius:50%;
      background:${color};
      border:3px solid white;
      box-shadow:
        0 2px 7px
        rgba(0,0,0,.55);

      display:flex;
      align-items:center;
      justify-content:center;

      color:white;
      font-weight:900;
      font-size:12px;

      overflow:hidden;
      text-align:center;
    ">
      ${text}
    </div>

  `;
}


/* ---------------------------------------------------------
   SZÍNES LEAFLET IKON
   --------------------------------------------------------- */

function vehicleIcon(v){

  const color=
    getVehicleColor(v);


  return L.divIcon({

    className:
      'attilaVehicleIcon',

    html:`

      <div style="
        width:42px;
        height:42px;

        border-radius:50%;

        background:${color};

        border:
          3px solid white;

        box-shadow:
          0 2px 8px
          rgba(0,0,0,.6);

        display:flex;
        align-items:center;
        justify-content:center;

        color:white;

        font-weight:900;
        font-size:11px;

        text-align:center;

        overflow:hidden;
      ">

        ${
          v.route ||
          v.label ||
          v.id ||
          '?'
        }

      </div>

    `,

    iconSize:[
      42,
      42
    ],

    iconAnchor:[
      21,
      21
    ],

    popupAnchor:[
      0,
      -22
    ]

  });

}


/* ---------------------------------------------------------
   SZÍNES DRAWVEHICLES
   --------------------------------------------------------- */

function drawVehicles(){

  if(
    typeof vehicleLayer==='undefined' ||
    !vehicleLayer
  ){
    return;
  }


  vehicleLayer.clearLayers();


  let count=0;


  for(
    const v
    of vehicles
  ){

    if(
      !Number.isFinite(v.lat) ||
      !Number.isFinite(v.lon)
    ){
      continue;
    }


    const marker=
      L.marker(
        [
          v.lat,
          v.lon
        ],
        {
          icon:
            vehicleIcon(v)
        }
      );


    marker.bindPopup(
      vehicleCard(v),
      {
        maxWidth:420
      }
    );


    marker.addTo(
      vehicleLayer
    );


    count++;

  }


  if($('vehicleMapStatus')){

    $('vehicleMapStatus').innerHTML=
      `TÉRKÉPEN: ${count} jármű`;

  }

}
