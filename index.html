<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FUTÁR V7 OFFLINE GTFS CORE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; background:#0b0f14; color:white; }
#map { height:70vh; }
#panel { height:30vh; background:#0f1722; padding:10px; overflow:auto; }

input {
  width:100%;
  padding:10px;
  background:#1b2636;
  border:none;
  color:white;
}

.card {
  background:#182233;
  margin:6px 0;
  padding:8px;
  border-radius:6px;
  cursor:pointer;
}
.small { font-size:12px; opacity:0.7; }
</style>
</head>

<body>

<div id="map"></div>

<div id="panel">
  <input id="search" placeholder="🔎 GTFS megálló keresés..."/>
  <div id="results">GTFS V7 READY</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// ================= MAP =================
const map = L.map('map').setView([47.4979,19.0402],13);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',{
  attribution:'&copy; OpenStreetMap'
}).addTo(map);

// ================= OFFLINE STORAGE =================
const DB_NAME = "futar_v7";
let db;

function openDB(){
  return new Promise((res)=>{
    const req = indexedDB.open(DB_NAME,1);
    req.onupgradeneeded = e=>{
      db = e.target.result;
      db.createObjectStore("gtfs");
    };
    req.onsuccess = e=>{
      db = e.target.result;
      res();
    };
  });
}

function saveGTFS(key,data){
  const tx = db.transaction("gtfs","readwrite");
  tx.objectStore("gtfs").put(data,key);
}

function loadGTFS(key){
  return new Promise(res=>{
    const tx = db.transaction("gtfs","readonly");
    const req = tx.objectStore("gtfs").get(key);
    req.onsuccess = ()=>res(req.result);
  });
}

// ================= MINI GTFS PARSER (DEMO + REAL READY) =================
let stops = [];

// CSV parser (light)
function parseCSV(text){
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",");
  return lines.slice(1).map(l=>{
    const obj = {};
    l.split(",").forEach((v,i)=>obj[headers[i]]=v);
    return obj;
  });
}

// ================= LOAD GTFS =================
async function loadDemoGTFS(){
  // később ZIP-ből jön
  const demo = [
    {stop_id:"1", stop_name:"Deák Ferenc tér", stop_lat:47.4975, stop_lon:19.0540},
    {stop_id:"2", stop_name:"Kálvin tér", stop_lat:47.4893, stop_lon:19.0619},
    {stop_id:"3", stop_name:"Blaha Lujza tér", stop_lat:47.4970, stop_lon:19.0707},
    {stop_id:"4", stop_name:"Nyugati pályaudvar", stop_lat:47.5100, stop_lon:19.0560}
  ];

  stops = demo;

  saveGTFS("stops", stops);
  renderStops();
}

// ================= RENDER =================
let markers = [];

function renderStops(){
  markers.forEach(m=>map.removeLayer(m));
  markers = [];

  stops.forEach(s=>{
    const m = L.marker([s.stop_lat,s.stop_lon])
      .addTo(map)
      .bindPopup(`<b>${s.stop_name}</b>`);

    markers.push(m);
  });
}

// ================= SEARCH =================
document.getElementById("search").addEventListener("input",(e)=>{
  const q = e.target.value.toLowerCase();

  const res = stops.filter(s=>
    s.stop_name.toLowerCase().includes(q)
  );

  document.getElementById("results").innerHTML =
    res.map(r=>`
      <div class="card" onclick="goto(${r.stop_lat},${r.stop_lon})">
        🚏 ${r.stop_name}<div class="small">${r.stop_id}</div>
      </div>
    `).join("") || "Nincs találat";
});

function goto(lat,lon){
  map.setView([lat,lon],16);
}

// ================= INIT =================
(async ()=>{
  await openDB();

  const cached = await loadGTFS("stops");

  if(cached){
    stops = cached;
    renderStops();
  } else {
    await loadDemoGTFS();
  }
})();
</script>

</body>
</html>
