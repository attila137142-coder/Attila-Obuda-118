<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>ATTILA DISPATCH V7.5 – GTFS STABLE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{margin:0;display:flex;font-family:Arial;}
#sidebar{width:360px;border-right:1px solid #ccc;overflow:auto;}
#map{flex:1;height:100vh;}

.matrix{
  background:black;
  color:#00ff66;
  font-family:monospace;
  padding:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #003300;
  padding:6px;
}

.blink{animation:blink 1s infinite;}
@keyframes blink{50%{opacity:0.2;}}
</style>
</head>

<body>

<div id="sidebar">
<h3>🟢 DISPATCH V7.5</h3>
<input id="search" placeholder="Keresés...">
<div id="list"></div>
<div id="panel">Válassz megállót</div>
</div>

<div id="map"></div>

<script>

// ===== MAP =====
const map = L.map('map').setView([47.6,19.05],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// ===== STOPS (ALAP LISTA) =====
const STOPS=[
 {name:"Békásmegyer",lat:47.598,lon:19.054},
 {name:"Flórián tér",lat:47.542,lon:19.042},
 {name:"Batthyány tér",lat:47.506,lon:19.039}
];

// ===== GTFS =====
let GTFS={stops:[],trips:[],stop_times:[],routes:[]};

// ===== CSV PARSER (STABIL) =====
function parseCSV(text){
  const lines = text.split("\n").filter(l=>l.trim());
  const headers = lines[0].split(",");

  return lines.slice(1).map(line=>{
    const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);

    let obj = {};
    headers.forEach((h,i)=>{
      obj[h] = values[i]?.replace(/"/g,"");
    });

    return obj;
  });
}

// ===== GTFS LOAD =====
async function loadGTFS(){
  try{
    const [a,b,c,d]=await Promise.all([
      fetch("/stops.txt").then(r=>r.text()),
      fetch("/trips.txt").then(r=>r.text()),
      fetch("/stop_times.txt").then(r=>r.text()),
      fetch("/routes.txt").then(r=>r.text())
    ]);

    GTFS.stops=parseCSV(a);
    GTFS.trips=parseCSV(b);
    GTFS.stop_times=parseCSV(c);
    GTFS.routes=parseCSV(d);

    console.log("GTFS OK:", GTFS.stops.length);

  }catch(e){
    console.error("GTFS HIBA:", e);
  }
}

// ===== STOP ID =====
function findStopId(stop){
  const s = GTFS.stops.find(x =>
    x.stop_name.toLowerCase().trim() === stop.name.toLowerCase().trim()
  );
  return s?.stop_id;
}

// ===== DEPARTURES =====
function getDepartures(stop){

  if(!GTFS.stop_times.length){
    return [{route:"--", headsign:"Nincs adat", time:"--"}];
  }

  const id = findStopId(stop);
  if(!id) return [];

  return GTFS.stop_times
    .filter(x=>x.stop_id===id)
    .slice(0,50)
    .map(st=>{
      const trip=GTFS.trips.find(t=>t.trip_id===st.trip_id);
      const route=GTFS.routes.find(r=>r.route_id===trip?.route_id);

      return {
        route:route?.route_short_name || trip?.route_id || "?",
        headsign:trip?.trip_headsign || "?",
        time:st.departure_time
      };
    })
    .slice(0,15);
}

// ===== MATRIX =====
function showMatrix(stop){

 let html=`<div class="matrix">`;
 html+=`<h3>${stop.name}</h3>`;

 const deps=getDepartures(stop);

 if(deps.length){

  deps.forEach((d,i)=>{
    html+=`
    <div class="row">
      <div>${d.route}</div>
      <div>${d.headsign}</div>
      <div class="${i<2?'blink':''}">
        ${d.time}
      </div>
    </div>`;
  });

 }else{
  html+=`⚠️ nincs adat`;
 }

 html+=`</div>`;
 document.getElementById("panel").innerHTML=html;
}

// ===== LIST =====
function render(list=STOPS){
 const c=document.getElementById("list");
 c.innerHTML="";
 list.forEach(s=>{
  const d=document.createElement("div");
  d.innerHTML="📍 "+s.name;
  d.onclick=()=>showMatrix(s);
  c.appendChild(d);
 });
}

// ===== SEARCH =====
document.getElementById("search").oninput=e=>{
 const q=e.target.value.toLowerCase();
 render(STOPS.filter(s=>s.name.toLowerCase().includes(q)));
};

// ===== MAP =====
STOPS.forEach(s=>{
 L.marker([s.lat,s.lon]).addTo(map)
  .on("click",()=>showMatrix(s));
});

// ===== INIT =====
render();
loadGTFS();

</script>

</body>
</html>
