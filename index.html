<!DOCTYPE html>

<style>

body{
margin:0;
background:#0b0f14;
font-family:Arial,sans-serif;
color:white;
overflow:hidden;
}

/* HEADER */

header{
height:72px;
background:#111826;
border-bottom:2px solid #00ffaa;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
box-sizing:border-box;
}

.logo{
font-size:24px;
font-weight:bold;
color:#00ffaa;
}

.topbox{
text-align:right;
}

#clockbox{
font-size:30px;
font-weight:bold;
color:#00ffaa;
}

#datebox{
font-size:13px;
color:#b7c7dc;
}

/* MAIN */

.main{
display:grid;
grid-template-columns:320px 1fr;
height:calc(100vh - 72px);
}

/* SIDEBAR */

.sidebar{
background:#131d2b;
overflow-y:auto;
padding:12px;
border-right:2px solid #223044;
}

/* VIEWER */

.viewer{
position:relative;
background:black;
overflow:hidden;
}

iframe{
width:100%;
height:100%;
border:none;
background:white;
}

/* SECTION */

.section{
margin-bottom:24px;
}

.section h2{
color:#00ffaa;
font-size:16px;
border-bottom:1px solid #223044;
padding-bottom:6px;
}

/* GRID */

.grid{
display:grid;
gap:10px;
}

/* INPUT */

input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#1a2433;
color:white;
font-size:15px;
box-sizing:border-box;
}

/* BUTTON */

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-size:14px;
cursor:pointer;
color:white;
text-align:left;
transition:0.2s;
}

button:hover{
transform:scale(1.02);
opacity:0.92;
}

/* COLORS */

.bkk{background:#23405c;}
.volan{background:#5b371a;}
.mav{background:#24476b;}
.aev{background:#35522f;}
.live{background:#214232;}
.map{background:#41295e;}
.search{background:#4f3414;}

/* STATUS */

.statusbar{
position:absolute;
bottom:0;
left:0;
right:0;
height:40px;
background:#111826dd;
border-top:1px solid #223044;
display:flex;
align-items:center;
padding-left:15px;
font-size:13px;
color:#00ffaa;
}

/* HOL A BUSZOM */

.distancePanel{
background:#101925;
padding:12px;
border-radius:10px;
border:1px solid #233044;
}

.distanceValue{
font-size:28px;
font-weight:bold;
color:#00ffaa;
margin-top:5px;
}

/* MOBILE */

@media(max-width:900px){

.main{
grid-template-columns:1fr;
}

.sidebar{
height:50vh;
}

.viewer{
height:50vh;
}

.logo{
font-size:18px;
}

#clockbox{
font-size:20px;
}

}

</style>
</head>

<script>

/* CLOCK */

function updateClock(){

const now = new Date();

document.getElementById("clockbox").innerHTML =
now.toLocaleTimeString('hu-HU');

document.getElementById("datebox").innerHTML =
now.toLocaleDateString('hu-HU',{
year:'numeric',
month:'long',
day:'numeric',
weekday:'long'
});

}

setInterval(updateClock,1000);
updateClock();

/* IFRAME */

function openPage(url){

document.getElementById("frame").src = url;

document.getElementById("statusbar").innerHTML =
"📡 BETÖLTVE: " + url;

}

/* EXTERNAL */

function openExternal(url){

window.open(url,'_blank');

document.getElementById("statusbar").innerHTML =
"🌐 KÜLSŐ MEGNYITÁS: " + url;

}

/* BKK */

function openBKKStop(){

let id =
document.getElementById("bkkInput").value;

if(!id){
alert("Adj meg BKK stop ID-t!");
return;
}

let url =
"https://realtimenext.hu/embed/bkv/stops/"
+ id +
"/schedule";

openPage(url);

}

/* VOLÁN */

function openVolanStop(){

let id =
document.getElementById("volanInput").value;

if(!id){
alert("Adj meg VOLÁN stop ID-t!");
return;
}

if(!id.includes("_")){
id = id + "_0";
}

let url =
"https://utas.hu/stop/hkir_" + id;

openExternal(url);

}

/* MÁV */

function openMAV(){

let id =
document.getElementById("mavInput").value;

if(!id){
alert("Adj meg MÁV állomáskódot!");
return;
}

let url =
"https://www.google.com/search?q="
+ encodeURIComponent(id + " MÁV állomás");

openExternal(url);

}

/* ÁEV */

function openAEV(){

let q =
document.getElementById("aevInput").value;

if(!q){
alert("Adj meg ÁEV keresést!");
return;
}

window.open(
"https://www.google.com/search?q="
+ encodeURIComponent(q + " erdei vasút"),
'_blank'
);

}

/* ENTER SUPPORT */

document.getElementById("bkkInput")
.addEventListener("keypress",function(e){

if(e.key==="Enter"){
openBKKStop();
}

});

document.getElementById("volanInput")
.addEventListener("keypress",function(e){

if(e.key==="Enter"){
openVolanStop();
}

});

document.getElementById("mavInput")
.addEventListener("keypress",function(e){

if(e.key==="Enter"){
openMAV();
}

});

document.getElementById("aevInput")
.addEventListener("keypress",function(e){

if(e.key==="Enter"){
openAEV();
}

});

/* HOL A BUSZOM */

function getLocation(){

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(showPosition);

}else{

alert("GPS nem támogatott");

}

}

function showPosition(position){

const lat = position.coords.latitude;
const lon = position.coords.longitude;

/* Példa jármű pozíció */

const busLat = 47.59658;
const busLon = 19.04446;

const distance =
calcDistance(lat,lon,busLat,busLon);

document.getElementById("distanceValue").innerHTML =
distance.toFixed(2) + " km";

document.getElementById("distanceText").innerHTML =
"📍 Saját helyzet: "
+ lat.toFixed(5)
+ ", "
+ lon.toFixed(5);

}

function calcDistance(lat1, lon1, lat2, lon2){

const R = 6371;

const dLat = deg2rad(lat2-lat1);
const dLon = deg2rad(lon2-lon1);

const a =

Math.sin(dLat/2) *
Math.sin(dLat/2)

+

Math.cos(deg2rad(lat1))
*
Math.cos(deg2rad(lat2))
*
Math.sin(dLon/2)
*
Math.sin(dLon/2);

const c =
2 * Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);

return R * c;

}

function deg2rad(deg){

return deg * (Math.PI/180);

}

</script>
