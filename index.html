<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<title>V5 Dispatcher Core</title>

<style>
body {
  margin:0;
  font-family: Arial;
  display:flex;
  height:100vh;
}

/* LEFT PANEL */
#panel {
  width:350px;
  background:#0b3d2e;
  color:white;
  padding:10px;
  overflow:hidden;
}

.row {
  display:flex;
  justify-content:space-between;
  padding:6px;
  border-bottom:1px solid rgba(255,255,255,0.1);
  font-size:14px;
}

.green { color:#7CFF7C; }
.red { color:#ff4d4d; font-weight:bold; }
.blue { color:#4da6ff; font-weight:bold; }

/* MAP */
#map {
  flex:1;
  background:#e6e6e6;
  position:relative;
}

/* STOP */
.stop {
  position:absolute;
  width:10px;
  height:10px;
  background:green;
  border-radius:50%;
}

/* VEHICLE */
.vehicle {
  position:absolute;
  width:14px;
  height:14px;
  background:red;
  border-radius:50%;
}
</style>
</head>

<body>

<!-- LEFT PANEL -->
<div id="panel">
  <h3>🚏 Megálló indulások</h3>
  <div id="list"></div>
</div>

<!-- MAP -->
<div id="map"></div>

<script>

/* =========================
   MOCK ADATOK (GTFS + RT)
========================= */

let stops = [
  {name:"Deák tér", x:200, y:200},
  {name:"Kálvin tér", x:300, y:260}
];

let vehicles = [
  {id:"B1", x:100, y:100, dx:1, dy:0.5, delay:120},
  {id:"B2", x:250, y:150, dx:-0.3, dy:1, delay:-90}
];

/* =========================
   PANEL LOGIKA
========================= */

function format(delaySec){
  const abs = Math.abs(delaySec || 0);
  const m = Math.floor(abs/60);
  const s = abs%60;

  if(delaySec < 0) return `<span class="red">🔴 -${m}:${s.toString().padStart(2,'0')}</span>`;
  if(delaySec > 0) return `<span class="blue">🔵 +${m}:${s.toString().padStart(2,'0')}</span>`;
  return `<span class="green">🟢 ON TIME</span>`;
}

function updateList(){
  let html = "";

  for(let i=0;i<15;i++){
    let v = vehicles[i % vehicles.length];

    html += `
      <div class="row">
        <div>12A → Rákospalota</div>
        <div>${format(v.delay)}</div>
      </div>
    `;
  }

  document.getElementById("list").innerHTML = html;
}

/* =========================
   MAP RENDER (SIMPLIFIED)
========================= */

function draw(){
  const map = document.getElementById("map");
  map.innerHTML = "";

  /* stops */
  stops.forEach(s=>{
    let d = document.createElement("div");
    d.className = "stop";
    d.style.left = s.x+"px";
    d.style.top = s.y+"px";
    map.appendChild(d);
  });

  /* vehicles */
  vehicles.forEach(v=>{
    let d = document.createElement("div");
    d.className = "vehicle";
    d.style.left = v.x+"px";
    d.style.top = v.y+"px";
    map.appendChild(d);
  });
}

/* =========================
   ANIMÁCIÓ (LIVE MOVE)
========================= */

function tick(){
  vehicles.forEach(v=>{
    v.x += v.dx;
    v.y += v.dy;

    if(v.x < 0 || v.x > 500) v.dx *= -1;
    if(v.y < 0 || v.y > 500) v.dy *= -1;

    // delay random simulation
    v.delay += (Math.random()*10 - 5);
  });

  updateList();
  draw();
}

setInterval(tick, 1000);

updateList();
draw();

</script>

</body>
</html>
