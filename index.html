<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V11 REAL DISPATCH AI</title>

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:#e2e8f0;
}

header {
    background:#111827;
    padding:15px;
    font-size:20px;
    font-weight:bold;
    text-align:center;
    color:#38bdf8;
}

.container {
    display:flex;
    flex-direction:column;
    height:100vh;
}

.panel {
    padding:10px;
    border-bottom:1px solid #1f2937;
}

input, button {
    padding:10px;
    margin:5px 0;
    width:100%;
    border-radius:8px;
    border:none;
}

input {
    background:#1f2937;
    color:white;
}

button {
    background:#38bdf8;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

button:hover {
    background:#0ea5e9;
}

#map {
    flex:1;
    background:#0b1220;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:#64748b;
}

.log {
    height:160px;
    overflow:auto;
    background:#0b1220;
    font-size:12px;
    padding:8px;
    border-top:1px solid #1f2937;
}

.badge {
    display:inline-block;
    padding:3px 8px;
    background:#1f2937;
    border-radius:6px;
    margin-right:5px;
    font-size:11px;
}
</style>
</head>

<body>

<header>
🚦 V11 REAL DISPATCH AI ENGINE
</header>

<div class="container">

<!-- SEARCH PANEL -->
<div class="panel">
    <div class="badge">GTFS SEARCH</div>
    <input id="search" placeholder="Megálló / város / GTFS ID (pl: Nád utca)">
    <button onclick="searchStop()">KERESÉS</button>
</div>

<!-- CONTROL PANEL -->
<div class="panel">
    <div class="badge">DISPATCH CORE</div>
    <button onclick="runDispatcher()">INDÍTÁS (REAL DISPATCH)</button>
    <button onclick="simulateDelay()">DELAY SIMULATION</button>
</div>

<!-- MAP AREA -->
<div id="map">
🗺️ V11 MAP ENGINE PLACEHOLDER<br>
(ide jön a real térkép + GPS + GTFS layer)
</div>

<!-- LOG -->
<div class="log" id="log"></div>

</div>

<script>

// -----------------------------
// V11 CORE MEMORY
// -----------------------------
let GTFS_DB = {
    stops: [
        {id:"005546847", name:"Hűvösvölgy"},
        {id:"005546862", name:"Hárs hegy"},
        {id:"005546896", name:"Szépjuhászné"},
        {id:"SKANZEN", name:"Skanzen"},
        {id:"NAD", name:"Nád utca"}
    ]
};

let CACHE = {};

// -----------------------------
// LOG SYSTEM
// -----------------------------
function log(msg){
    const el = document.getElementById("log");
    el.innerHTML += msg + "<br>";
    el.scrollTop = el.scrollHeight;
}

// -----------------------------
// SEARCH ENGINE (FIXED V11)
// -----------------------------
function searchStop(){
    let q = document.getElementById("search").value.toLowerCase();

    log("🔎 Keresés: " + q);

    let results = GTFS_DB.stops.filter(s =>
        s.name.toLowerCase().includes(q) ||
        s.id.toLowerCase().includes(q)
    );

    if(results.length === 0){
        log("❌ Nincs találat → fallback AI keresés aktiv");
        fallbackSearch(q);
        return;
    }

    results.forEach(r=>{
        log("✅ TALÁLAT: " + r.name + " (" + r.id + ")");
    });
}

// -----------------------------
// FALLBACK AI LOGIC
// -----------------------------
function fallbackSearch(q){
    log("🧠 V11 AI fallback aktiv...");

    // simple fuzzy logic
    if(q.includes("skanzen")){
        log("➡️ Átirányítás: Skanzen → HÉV kapcsolat keresés");
    } else if(q.includes("nád")){
        log("➡️ Nád utca → helyettesített stop mapping aktiv");
    } else {
        log("⚠️ nincs mapping → manuális dispatcher mód");
    }
}

// -----------------------------
// DISPATCH ENGINE
// -----------------------------
function runDispatcher(){
    log("🚦 DISPATCH START");

    let plan = {
        route: "AUTO",
        status: "OPTIMIZING",
        confidence: 0.87
    };

    log("🧠 route: " + plan.route);
    log("⚡ status: " + plan.status);
    log("📊 confidence: " + plan.confidence);

    log("✔️ DISPATCH READY");
}

// -----------------------------
// DELAY SIMULATION
// -----------------------------
function simulateDelay(){
    log("⏱️ Delay simulation aktiv...");

    let delay = Math.floor(Math.random()*20);

    log("🚨 késés: " + delay + " perc");

    if(delay > 10){
        log("⚠️ alternatív útvonal keresés...");
    }
}

log("🚀 V11 REAL DISPATCH AI loaded");

</script>

</body>
</html>
