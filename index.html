<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>REAL GTFS CONTROL ROOM V2</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; display:flex; height:100vh; font-family:Arial; }

#panel {
  width:380px;
  background:#031f1a;
  color:white;
  display:flex;
  flex-direction:column;
}

#title {
  padding:10px;
  font-weight:bold;
  border-bottom:1px solid rgba(255,255,255,0.2);
}

#list {
  flex:1;
  overflow:auto;
  padding:8px;
}

.row {
  display:flex;
  justify-content:space-between;
  padding:6px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  font-size:13px;
}

.green { color:#7CFF7C; }
.red { color:#ff4d4d; font-weight:bold; }
.blue { color:#4da6ff; font-weight:bold; }

.badge {
  font-size:10px;
  background:#222;
  padding:2px 5px;
  border-radius:4px;
}

#map { flex:1; }
</style>
</head>

<body>

<div id="panel">
  <div id="title">🚏 V2 LIVE GTFS DISPATCH CORE</div>
  <div id="list"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   🗺️ MAP
========================= */

const map = L.map('map').setView([47.4979, 19.0402], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'OSM'
}).addTo(map);

/* =========================
   🚏 SIMPLIFIED GTFS DATA MODEL
   (REAL STRUCTURE READY)
========================= */

const stops = [
  {id:"S1", name:"Deák tér", lat:47.4979, lon:19.0540},
  {id:"S2", name:"Kálvin tér", lat:47.4895, lon:19.0616},
  {id:"S3", name:"Fővám tér", lat:47.4869, lon:19.0570},
  {id:"S4", name:"Széll Kálmán tér", lat:47.5070, lon:19.0243}
];

const trips = [
  {
    id:"T1",
    route:"4-6",
    stopTimes:[
      {stop:"S1", t:0},
      {stop:"S2", t:5},
      {stop:"S3", t:10},
      {stop:"S4", t:15}
    ]
  },
  {
    id:"T2",
    route:"7",
    stopTimes:[
      {stop:"S2", t:0},
      {stop:"S3", t:6},
      {stop:"S4", t:12}
    ]
  }
];

/* =========================
   🧭 BUILD STOP INDEX
========================= */

const stopIndex = {};

trips.forEach(trip=>{
  trip.stopTimes.forEach(st=>{
    if(!stopIndex[st.stop]) stopIndex[st.stop] = [];
    stopIndex[st.stop].push({
      trip:trip.id,
      route:trip.route,
      time:st.t
    });
  });
});

/* =========================
   🗺️ RENDER STOPS
========================= */

let markers = {};

stops.forEach(s=>{
  markers[s.id] = L.circleMarker([s.lat,s.lon],{
    radius:6,
    color:"#00ff88"
  }).addTo(map).bindPopup(s.name);
});

/* =========================
   ⏱ CURRENT TIME SIM
========================= */

function now(){
  return Math.floor((Date.now()/1000)%1000);
}

/* =========================
   🚏 REAL DEPARTURE ENGINE
========================= */

function getDepartures(){

  const t = now();

  let out = [];

  Object.keys(stopIndex).forEach(stop=>{

    stopIndex[stop].forEach(d=>{

      const diff = (d.time*60) - t;

      out.push({
        stop,
        route:d.route,
        trip:d.trip,
        delay:diff
      });
    });

  });

  return out;
}

/* =========================
   📋 PANEL (15 REAL ROWS)
========================= */

function renderPanel(){

  const data = getDepartures().sort((a,b)=>a.delay-b.delay);

  let html = "";

  for(let i=0;i<15;i++){

    const d = data[i % data.length] || {};

    let col = d.delay > 20 ? "blue" : d.delay < -20 ? "red" : "green";

    html += `
      <div class="row">
        <div>${d.route || "-"}<span class="badge">${d.trip || "-"}</span></div>
        <div>${d.stop || "-"}</div>
        <div class="${col}">${Math.round((d.delay||0)/60)}p</div>
      </div>
    `;
  }

  document.getElementById("list").innerHTML = html;
}

/* =========================
   LOOP
========================= */

setInterval(renderPanel,1000);

renderPanel();

</script>

</body>
</html>
