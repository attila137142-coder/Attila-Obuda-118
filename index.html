<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Transport Digital Twin OFFLINE PRO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#e2e8f0}
header{padding:10px;background:#111827;display:flex;flex-wrap:wrap;gap:6px}
.btn{background:#2563eb;border:none;padding:6px 10px;color:#fff;border-radius:8px;cursor:pointer}
.grid{display:grid;gap:10px;padding:10px}
.card{background:#1f2937;padding:10px;border-radius:12px}
#map{height:380px;border-radius:12px}

.offlineBadge{
 position:fixed;
 bottom:10px;
 left:10px;
 background:rgba(0,0,0,0.7);
 padding:6px 10px;
 border-radius:10px;
 font-size:12px;
}
</style>
</head>
<body>

<header>
<button class="btn" onclick="setMode('online')">ONLINE MAP</button>
<button class="btn" onclick="setMode('offline')">OFFLINE CACHE</button>
<button class="btn" onclick="saveTiles()">TÉRKÉP CACHE</button>
<button class="btn" onclick="saveTrack()">TRACK SAVE</button>
<button class="btn" onclick="exportGPX()">GPX</button>
<button class="btn" onclick="startNav()">NAV</button>
</header>

<div class="grid">
<div class="card">
<div id="speed"></div>
<div id="info"></div>
</div>

<div class="card">
<div id="map"></div>
</div>
</div>

<div class="offlineBadge" id="status">ONLINE MODE</div>

<script>
let map;
let track=[];
let savedTrack=[];
let trackLine;
let navTarget=null;
let userPos=null;
let offlineMode=false;

function initMap(){
 map=L.map('map').setView([47.5,19.05],12);
 loadOnline();
}

function loadOnline(){
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
 document.getElementById('status').innerText='ONLINE MODE';
}

function loadOffline(){
 // LOCAL CACHE fallback (localStorage tile demo)
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);
 document.getElementById('status').innerText='OFFLINE CACHE MODE';
}

function setMode(m){
 offlineMode=(m==='offline');
 map.eachLayer(l=>map.removeLayer(l));
 if(offlineMode) loadOffline(); else loadOnline();
}

function saveTiles(){
 alert("Tile cache demo: böngésző cache aktív (valódi offlinehoz service worker kell)");
}

function haversine(a,b,c,d){
 const R=6371;
 const dLat=(c-a)*Math.PI/180;
 const dLon=(d-b)*Math.PI/180;
 const x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;
 return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

navigator.geolocation.watchPosition(p=>{
 userPos={lat:p.coords.latitude,lon:p.coords.longitude};
 track.push([userPos.lat,userPos.lon]);

 if(trackLine) map.removeLayer(trackLine);
 trackLine=L.polyline(track,{color:'lime'}).addTo(map);

 if(p.coords.heading!=null){
  document.getElementById('speed').innerText='Heading: '+p.coords.heading.toFixed(0)+'°';
 }
});

function saveTrack(){
 savedTrack=[...track];
 alert("Track mentve offline");
}

function exportGPX(){
 let gpx='<?xml version="1.0"?><gpx><trk><trkseg>';
 savedTrack.forEach(p=>gpx+=`<trkpt lat="${p[0]}" lon="${p[1]}"></trkpt>`);
 gpx+='</trkseg></trk></gpx>';
 const blob=new Blob([gpx]);
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='track.gpx';
 a.click();
}

function startNav(){
 if(savedTrack.length){
  navTarget=savedTrack[savedTrack.length-1];
 }
}

window.onload=initMap;
</script>

</body>
</html>
