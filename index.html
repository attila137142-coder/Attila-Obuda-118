<script>
const CONFIG = {
  gtfsStaticUrl: "https://example.com/static",
  gtfsRtUrl: "https://example.com/realtime",
  refreshInterval: 15000
};

const state = {
  stops: 0,
  vehicles: 0,
  departures: 0,
  lastUpdate: null
};

function render() {
  const el = document.getElementById("log");

  el.innerHTML = `
    🚍 FUTÁR V5 STATUS\n
    ----------------------\n
    🟦 Stops: ${state.stops}\n
    🚍 Vehicles: ${state.vehicles}\n
    ⏱ Departures: ${state.departures}\n
    🕒 Last update: ${state.lastUpdate}\n
  `;
}

async function fakeFetch() {
  // később GTFS helyére kerül
  return {
    vehicles: Math.floor(Math.random() * 50),
    departures: Math.floor(Math.random() * 120),
    stops: 1500
  };
}

async function tick() {
  const data = await fakeFetch();

  state.stops = data.stops;
  state.vehicles = data.vehicles;
  state.departures = data.departures;
  state.lastUpdate = new Date().toLocaleTimeString();

  render();
}

function start() {
  tick();
  setInterval(tick, CONFIG.refreshInterval);
}

start();
</script>
