<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Óbuda–Szentendre GTFS CORE V1</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; display:flex; height:100vh; font-family:Arial; }

#panel {
  width:360px;
  background:#031a17;
  color:white;
  display:flex;
  flex-direction:column;
}

#header {
  padding:10px;
  font-weight:bold;
  border-bottom:1px solid rgba(255,255,255,0.2);
}

#upload {
  margin:8px;
}

#list {
  flex:1;
  overflow:auto;
  padding:8px;
}

.row {
  display:flex;
  justify-content:space-between;
  padding:6px;
  font-size:13px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.badge {
  font-size:10px;
  background:#222;
  padding:2px 5px;
  border-radius:4px;
}

.green { color:#7CFF7C; }
.red { color:#ff4d4d; }
.blue { color:#4da6ff; }

#map { flex:1; }
</style>
</head>

<body>

<div id="panel">
  <div id="header">🚍 Óbuda–Szentendre GTFS CORE V1</div>

  <input type="file" id="upload" accept=".zip">

  <div id="list"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>

/* 🗺️ MAP */
const map = L.map('map').setView([47.57,19.05],11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'OSM'
}).addTo(map);

/* 💾 CACHE */
function openDB(){
  return new Promise(r=>{
    const req = indexedDB.open("gtfs_core_v1",1);
    req.onupgradeneeded = e=>{
      e.target.result.createObjectStore("data");
    };
    req.onsuccess = ()=>r(req.result);
  });
}

async function save(k,v){
  const db = await openDB();
  db.transaction("data","readwrite").objectStore("data").put(v,k);
}

async function load(k){
  const db = await openDB();
  return new Promise(r=>{
    const req = db.transaction("data").objectStore("data").get(k);
    req.onsuccess = ()=>r(req.result);
  });
}

/* 📦 DATA */
let STOPS=[], TRIPS=[], STOP_TIMES=[];

/* 📥 IMPORT GTFS ZIP */
document.getElementById("upload").onchange = async e=>{

  const zip = await JSZip.loadAsync(e.target.files[0]);

  STOPS = parse(await zip.file("stops.txt").async("string"));
  TRIPS = parse(await zip.file("trips.txt").async("string"));
  STOP_TIMES = parse(await zip.file("stop_times.txt").async("string"));

  await save("stops",STOPS);
  await save("trips",TRIPS);
  await save("stop_times",STOP_TIMES);

  init();
};

/* CSV PARSE */
function parse(t){

  const lines = t.trim().split("\n");
  const h = lines[0].split(",");

  return lines.slice(1).map(l=>{
    const o={};
    l.split(",").forEach((v,i)=>o[h[i]]=v);
    return o;
  });
}

/* 🧭 GRAPH */
function build(){

  const g={};

  STOP_TIMES.forEach(s=>{
    if(!g[s.stop_id]) g[s.stop_id]=[];
    g[s.stop_id].push(s);
  });

  return g;
}

/* 📋 PANEL */
function panel(graph){

  let html="";

  Object.keys(graph).slice(0,15).forEach(k=>{

    const d=graph[k][0];

    html+=`
      <div class="row">
        <div>${d.trip_id}<span class="badge">GTFS</span></div>
        <div>${d.stop_id}</div>
        <div class="green">${d.departure_time}</div>
      </div>
    `;
  });

  document.getElementById("list").innerHTML=html;
}

/* 🗺️ STOPS */
let markers={};

function draw(){

  STOPS.forEach(s=>{

    if(!s.stop_lat) return;

    if(!markers[s.stop_id]){

      markers[s.stop_id]=L.circleMarker([s.stop_lat,s.stop_lon],{
        radius:6,
        color:"#00ff88"
      }).addTo(map).bindPopup(s.stop_name);
    }
  });
}

/* INIT */
async function init(){

  const cached = await load("stops");

  if(cached){
    STOPS=cached;
    TRIPS=await load("trips")||[];
    STOP_TIMES=await load("stop_times")||[];
  }

  const graph=build();

  draw();
  panel(graph);
}

</script>

</body>
</html>
