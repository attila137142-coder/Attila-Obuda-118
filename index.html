<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>GTFS TAKARÍTÓ PRO V3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{
    background:#0b1220;
    color:#d1d5db;
    font-family:Arial;
    padding:20px;
}

h1{color:#38bdf8}

.panel{
    background:#111827;
    border:1px solid #1f2937;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
}

button{
    padding:10px 14px;
    border-radius:8px;
    border:none;
    margin:5px;
    cursor:pointer;
    font-weight:bold;
}

#log{
    background:#000;
    padding:10px;
    height:220px;
    overflow:auto;
    white-space:pre-wrap;
    font-family:monospace;
}

.ok{color:#22c55e}
.warn{color:#facc15}
.err{color:#ef4444}
.info{color:#38bdf8}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:6px;
    margin-top:10px;
    font-weight:bold;
}
.green{background:#14532d;color:#22c55e}
.yellow{background:#3b2f0b;color:#facc15}
.red{background:#3b0b0b;color:#ef4444}
</style>
</head>

<body>

<h1>🚍 GTFS TAKARÍTÓ PRO V3</h1>

<div class="panel">
<input type="file" id="zipFile" accept=".zip">
<button onclick="loadZip()">📦 ZIP betöltés</button>
<button onclick="runCheck()">🧠 VALIDÁLÁS INDÍTÁSA</button>
<button onclick="downloadClean()">⬇ EXPORT CLEAN ZIP</button>
</div>

<div class="panel">
<h3>📊 DISZPÉCSER ÁLLAPOT</h3>
<div id="status" class="badge yellow">VÁRAKOZÁS...</div>
</div>

<div class="panel">
<h3>📡 LOG (LIVE)</h3>
<div id="log">Rendszer indítás...\n</div>
</div>

<div class="panel">
<h3>📁 FÁJL AUDIT</h3>
<ul id="files"></ul>
</div>

<script>
let zip = new JSZip();
let loaded = false;

function log(msg, cls=""){
    const el = document.getElementById("log");
    el.innerHTML += "\n" + msg;
    el.scrollTop = el.scrollHeight;
}

function setStatus(text, type){
    const el = document.getElementById("status");
    el.innerText = text;
    el.className = "badge " + type;
}

function loadZip(){
    const file = document.getElementById("zipFile").files[0];
    if(!file) return alert("Nincs ZIP kiválasztva!");

    zip = new JSZip();
    document.getElementById("files").innerHTML = "";

    zip.loadAsync(file).then(()=>{
        loaded = true;
        log("📦 ZIP betöltve: " + file.name, "info");
        listFiles();
    });
}

function listFiles(){
    const list = document.getElementById("files");
    list.innerHTML = "";

    zip.forEach((path)=>{
        const li = document.createElement("li");
        li.textContent = path;
        list.appendChild(li);
    });
}

function runCheck(){
    if(!loaded) return alert("Előbb tölts be ZIP-et!");

    log("🧠 VALIDÁLÁS INDUL...", "info");

    let files = [];
    zip.forEach((p)=>files.push(p));

    const hasCalendar = files.includes("calendar.txt");
    const hasDates = files.includes("calendar_dates.txt");

    // MODE DETECTION
    if(hasCalendar && hasDates){
        setStatus("CLASSIC GTFS MODE", "green");
        log("🟢 MODE: CLASSIC (teljes menetrend rendszer)");
    }
    else if(!hasCalendar && hasDates){
        setStatus("DATES-ONLY GTFS MODE", "yellow");
        log("🟡 MODE: DATES-ONLY (modern GTFS)");
    }
    else if(!hasCalendar && !hasDates){
        setStatus("BROKEN GTFS FEED", "red");
        log("🔴 MODE: BROKEN (nincs időmenetrend adat)");
    }

    // service_id check
    if(files.includes("trips.txt")){
        log("🚍 trips.txt OK");
    }

    if(!hasCalendar){
        log("⚠ calendar.txt hiányzik (nem mindig hiba!)", "warn");
    }

    if(!hasDates){
        log("⚠ calendar_dates.txt hiányzik (kritikus lehet)", "warn");
    }

    log("✔ VALIDÁLÁS KÉSZ");
}

function downloadClean(){
    if(!loaded) return;

    zip.generateAsync({type:"blob"}).then(blob=>{
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "GTFS_V3_CLEAN.zip";
        a.click();
    });
}
</script>

</body>
</html>
