<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BKK GTFS IMPORTER V1</title>

<style>
body{
margin:0;
font-family:Arial;
background:#05070d;
color:#00ffcc;
}

header{
padding:12px;
text-align:center;
background:#0b1220;
border-bottom:2px solid #00ffcc;
font-weight:bold;
}

.container{
display:grid;
grid-template-columns:1fr 1fr;
height:calc(100vh - 50px);
}

.panel{
padding:10px;
overflow:auto;
background:#0b1220;
border-right:1px solid #00ffcc33;
}

input,button{
width:100%;
padding:10px;
margin-top:5px;
background:#05070d;
border:1px solid #00ffcc;
color:#00ffcc;
}

pre{
white-space:pre-wrap;
font-size:12px;
}
</style>
</head>

<body>

<header>
🚍 BKK GTFS IMPORTER V1 // ZIP → JSON ENGINE
</header>

<div class="container">

<div class="panel">
<h3>📦 GTFS ZIP feltöltés</h3>

<input type="file" id="file" accept=".zip">
<button onclick="loadGTFS()">IMPORT</button>

<h3>📊 Output</h3>
<pre id="out">Nincs adat</pre>
</div>

<div class="panel">
<h3>🧠 Parsed Data</h3>
<div id="data"></div>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>

/*
========================
GTFS STORAGE
========================
*/

let GTFS = {
stops:[],
routes:[],
trips:[]
};

/*
========================
CSV PARSER (LIGHT)
========================
*/

function parseCSV(text){

let lines = text.split("\n").filter(l=>l.trim()!=="");

let headers = lines[0].split(",");

let rows = [];

for(let i=1;i<lines.length;i++){

let obj = {};
let cols = lines[i].split(",");

headers.forEach((h,idx)=>{
obj[h.trim()] = (cols[idx]||"").trim();
});

rows.push(obj);
}

return rows;
}

/*
========================
IMPORT ENGINE
========================
*/

async function loadGTFS(){

let file = document.getElementById("file").files[0];

if(!file){
alert("Nincs fájl!");
return;
}

let zip = await JSZip.loadAsync(file);

/*
========================
stops.txt
========================
*/

if(zip.file("stops.txt")){
let txt = await zip.file("stops.txt").async("string");
GTFS.stops = parseCSV(txt);
}

/*
========================
routes.txt
========================
*/

if(zip.file("routes.txt")){
let txt = await zip.file("routes.txt").async("string");
GTFS.routes = parseCSV(txt);
}

/*
========================
trips.txt
========================
*/

if(zip.file("trips.txt")){
let txt = await zip.file("trips.txt").async("string");
GTFS.trips = parseCSV(txt);
}

document.getElementById("out").innerText =
JSON.stringify(GTFS,null,2);

document.getElementById("data").innerHTML = `
✔ Stops: ${GTFS.stops.length}<br>
✔ Routes: ${GTFS.routes.length}<br>
✔ Trips: ${GTFS.trips.length}
`;

}

</script>

</body>
</html>
