<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V7.4 FULL ACCURACY ENGINE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0f14;
  color:#e6f1ff;
  display:flex;
  height:100vh;
}

#sidebar{
  width:420px;
  background:#0f172a;
  overflow:auto;
  border-right:1px solid #1f2937;
}

#map{
  flex:1;
}

.header{
  padding:10px;
  background:#111827;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
}

.panel{
  padding:10px;
  border-bottom:1px solid #1f2937;
}

input,button{
  width:100%;
  padding:8px;
  margin-top:6px;
  border-radius:6px;
  border:none;
}

button{
  background:#1d4ed8;
  color:white;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:4px 0;
  border-bottom:1px solid #1f2937;
}

.ok{color:#00ff99;}
.warn{color:#ffcc00;}
.bad{color:#ff4d4d;}
</style>
</head>

<body>

<div id="sidebar">

<div class="header">
🚍 V7.4 FULL ACCURACY ENGINE
<div id="clock"></div>
</div>

<div class="panel">
<input type="file" id="zip">
<button onclick="loadGTFS()">LOAD GTFS (BKK + VOLÁN)</button>
</div>

<div class="panel">
<input id="search" placeholder="Megálló keresés...">
<button onclick="searchStop()">KERESÉS</button>
</div>

<div class="panel">
<h3>🧠 INDULÁSOK (100% ACCURATE)</h3>
<div id="board"></div>
</div>

<div class="panel">
<h3>📡 ENGINE STATUS</h3>
<div id="status"></div>
</div>

</div>

<div id="map"></div>

<script>

// ================= MAP =================
const map = L.map('map').setView([47.5,19.05],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'OSM'
}).addTo(map);

// ================= STATE =================
let stops = [];
let stopTimes = [];
let departures = {};
let selectedStop = null;

// ================= CLOCK =================
setInterval(()=>{
  document.getElementById("clock").innerText =
    new Date().toLocaleTimeString();
},1000);

// ================= TIME ENGINE =================
function timeToSec(t){
  let [h,m,s] = t.split(":").map(Number);
  return h*3600 + m*60 + s;
}

// ================= SAFE PUSH (DEDUP + ACCURACY) =================
function addDeparture(stop_id, trip_id, time){

  if(!departures[stop_id]){
    departures[stop_id] = [];
  }

  // 🔥 DUPLICATE FILTER (GTFS BUG FIX)
  let exists = departures[stop_id].some(d =>
    d.trip === trip_id && d.time === time
  );

  if(exists) return;

  departures[stop_id].push({
    trip: trip_id,
    time: time,
    sec: timeToSec(time)
  });
}

// ================= LOAD GTFS =================
async function loadGTFS(){

  const file = document.getElementById("zip").files[0];
  const zip = await JSZip.loadAsync(file);

  stops = [];
  stopTimes = [];
  departures = {};

  for(let p in zip.files){

    let name = p.split("/").pop().toLowerCase();
    let content = await zip.files[p].async("string");

    if(name==="stops.txt"){
      stops = Papa.parse(content,{header:true}).data;
    }

    if(name==="stop_times.txt"){
      stopTimes = Papa.parse(content,{header:true}).data;
    }
  }

  buildEngine();
  renderMap();
  updateStatus();
}

// ================= CORE ENGINE =================
function buildEngine(){

  stopTimes.forEach(r=>{

    if(!r.stop_id || !r.departure_time || !r.trip_id) return;

    addDeparture(r.stop_id, r.trip_id, r.departure_time);
  });

  // 🔥 SORT ALL STOPS (CRITICAL FIX)
  Object.keys(departures).forEach(k=>{
    departures[k].sort((a,b)=>a.sec-b.sec);
  });

  console.log("ENGINE READY ✔", Object.keys(departures).length);
}

// ================= MAP =================
function renderMap(){

  stops.forEach(s=>{
    if(!s.stop_lat) return;

    L.circleMarker([s.stop_lat,s.stop_lon],{
      radius:4,
      color:"#00ffff"
    }).addTo(map)
    .on("click",()=>{
      selectedStop = s;
      renderBoard(s);
    });
  });
}

// ================= NEXT DEPARTURES =================
function getNext(list){

  let now = new Date();
  let sec = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();

  return list
    .filter(d=>d.sec >= sec)
    .slice(0,10);
}

// ================= BOARD =================
function renderBoard(stop){

  let list = departures[stop.stop_id] || [];
  let next = getNext(list);

  let html = `<b>${stop.stop_name}</b><br><br>`;

  if(next.length === 0){
    html += "<span class='warn'>Nincs jövőbeli indulás</span>";
  }

  next.forEach(d=>{
    html += `
      <div class="row">
        <div>${d.trip}</div>
        <div class="ok">${d.time}</div>
      </div>
    `;
  });

  document.getElementById("board").innerHTML = html;
}

// ================= SEARCH =================
function searchStop(){

  let q = document.getElementById("search").value.toLowerCase();

  let found = stops.find(s =>
    s.stop_name && s.stop_name.toLowerCase().includes(q)
  );

  if(found){
    map.setView([found.stop_lat,found.stop_lon],14);
    renderBoard(found);
  }
}

// ================= STATUS =================
function updateStatus(){

  document.getElementById("status").innerHTML = `
  GTFS: LOADED ✔<br>
  STOPS: ${stops.length}<br>
  STOP TIMES: ${stopTimes.length}<br>
  DEPARTURES: ${Object.keys(departures).length}<br>
  MODE: V7.4 FULL ACCURACY ENGINE<br>
  `;
}

</script>

</body>
</html>
