<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V5 UI CORE</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
🚀 FUTÁR V5 CONTROL ROOM // STABLE UI
</header>

<div class="grid">

  <div class="panel left">
    <h2>🚏 MEGÁLLÓ KERESŐ</h2>
    <input id="stop" placeholder="pl. Deák tér / Nád utca">
    <button onclick="search()">KERESÉS</button>

    <div id="result"></div>
  </div>

  <div class="panel right">
    <h2>🛰 INDULÁSOK (LIVE SIM)</h2>

    <table>
      <thead>
        <tr>
          <th>Járat</th>
          <th>Irány</th>
          <th>Indul</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="table"></tbody>
    </table>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
