<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUTÁR_V5_3_CONTROL_ROOM</title>
<style>
body{margin:0;background:#060a10;color:#d7e1ea;font-family:Arial}
header{padding:10px;background:#0f1621;border-bottom:2px solid #1f2a3a}
.bigClock{font-size:72px;font-weight:bold;color:#00ff00;text-align:center;
background:#000;border:2px solid #00aa00;padding:15px;margin:10px}
.grid{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 120px)}
.panel,.main{padding:10px;overflow:auto}
.panel{background:#0f1621;border-right:1px solid #1f2a3a}
.card{border:1px solid #1f2a3a;padding:8px;margin-bottom:8px}
input{width:100%;padding:8px}
table{width:100%;border-collapse:collapse}
td,th{border:1px solid #2b3b52;padding:6px}
</style>
</head>
<body>
<header><h2>🚦 FUTÁR V5.3 CONTROL ROOM</h2></header>
<div class="bigClock" id="clock">00:00:00</div>
<div class="grid">
<div class="panel">
<div class="card">
<h3>📍 Helyzetem</h3>
<div id="gps">GPS: betöltés...</div>
<div id="addr">Cím: ...</div>
<div id="acc">Pontosság: ...</div>
</div>
<div class="card">
<h3>🔍 Megálló kereső</h3>
<input placeholder="Megálló neve">
</div>
</div>
<div class="main">
<h3>🚏 Megálló adatai</h3>
<p>GTFS ID, koordináták, légvonal távolság és indulások helye.</p>
<table>
<tr><th>Járat</th><th>Irány</th><th>Indulás</th></tr>
</table>
</div>
</div>
<script>
setInterval(()=>{
 document.getElementById('clock').textContent =
 new Date().toLocaleTimeString('hu-HU');
},1000);
