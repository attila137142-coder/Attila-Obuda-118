<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>BKK LIGHT PRO GTFS ENGINE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{font-family:Arial;margin:0;background:#0f172a;color:#e2e8f0}
header{padding:16px;background:#111827;display:flex;gap:10px;align-items:center}
button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;background:#22c55e;color:#000;font-weight:bold}
button.secondary{background:#38bdf8}
.container{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 60px)}
.sidebar{padding:12px;background:#111827;overflow:auto}
.main{padding:12px;overflow:auto}
input{width:100%;padding:8px;margin:6px 0;border-radius:6px;border:1px solid #334155;background:#0b1220;color:white}
.table{width:100%;border-collapse:collapse;margin-top:10px}
.table th,.table td{border:1px solid #334155;padding:6px;text-align:center;font-size:13px}
.table th{background:#1f2937}
.badge{padding:2px 6px;border-radius:6px;background:#1d4ed8;color:white;font-size:11px}
.title{font-size:18px;font-weight:bold;margin:8px 0}
.small{font-size:12px;opacity:0.8}
</style>
</head>
<body>

<header>
<button onclick="loadDemo()">📥 DEMO GTFS</button>
<button class="secondary" onclick="exportZip()">📦 ZIP GENERÁLÁS</button>
<span class="small">BKK LIGHT PRO GTFS ENGINE</span>
</header>

<div class="container">

<div class="sidebar">
<div class="title">🔎 Megálló kereső</div>
<input id="search" placeholder="pl. Óbuda..." oninput="renderStops()">
<div id="stopList"></div>
</div>

<div class="main">
<div class="title">🚍 Megállós menetrend</div>
<div id="timetable">Válassz megállót...</div>
</div>

</div>

<script>

let gtfs = {
  stops: [],
  stop_times: [],
  trips: [],
  routes: []
};

function loadDemo(){
  gtfs.stops = [
    {id:"1",name:"Központ"},
    {id:"2",name:"Óbuda"},
    {id:"3",name:"Békásmegyer"}
  ];

  gtfs.stop_times = [
    {trip:"T1",stop:"1",time:"08:00"},
    {trip:"T1",stop:"2",time:"08:10"},
    {trip:"T1",stop:"3",time:"08:20"},

    {trip:"T2",stop:"3",time:"09:00"},
    {trip:"T2",stop:"2",time:"09:10"},
    {trip:"T2",stop:"1",time:"09:20"}
  ];

  gtfs.trips = [
    {id:"T1",head:"Békásmegyer"},
    {id:"T2",head:"Központ"}
  ];

  renderStops();
}

function renderStops(){
  const q = document.getElementById("search").value.toLowerCase();
  const list = document.getElementById("stopList");
  list.innerHTML = "";

  gtfs.stops
    .filter(s => s.name.toLowerCase().includes(q))
    .forEach(s => {
      const div = document.createElement("div");
      div.innerHTML = `<span class='badge'>STOP</span> ${s.name}`;
      div.style.cursor="pointer";
      div.style.padding="6px";
      div.onclick = () => showTimetable(s.id, s.name);
      list.appendChild(div);
    });
}

function showTimetable(stopId, stopName){

  const rows = gtfs.stop_times
    .filter(st => st.stop === stopId)
    .map(st => {
      const trip = gtfs.trips.find(t => t.id === st.trip);
      return `<tr><td>${st.time}</td><td>${trip ? trip.head : "?"}</td><td>${st.trip}</td></tr>`;
    });

  document.getElementById("timetable").innerHTML = `
    <div class='title'>📍 ${stopName}</div>
    <table class='table'>
      <tr><th>Idő</th><th>Hová</th><th>Járat</th></tr>
      ${rows.join("")}
    </table>
  `;
}

function exportZip(){

  const zip = new JSZip();

  zip.file("stops.txt", "stop_id,stop_name\n" + gtfs.stops.map(s=>`${s.id},${s.name}`).join("\n"));

  zip.file("stop_times.txt", "trip_id,stop_id,time\n" +
    gtfs.stop_times.map(s=>`${s.trip},${s.stop},${s.time}`).join("\n"));

  zip.file("trips.txt", "trip_id,headsign\n" +
    gtfs.trips.map(t=>`${t.id},${t.head}`).join("\n"));

  zip.generateAsync({type:"blob"}).then(content=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(content);
    a.download="bkk_light_pro.zip";
    a.click();

    loadDemo();
    
  });
}

</script>

</body>
</html>
