<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TURISTA V5 PRO MAP ENGINE</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b0f14;
  color:#e6e6e6;
}

header {
  padding:10px;
  background:#111826;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.container {
  display:grid;
  grid-template-columns: 1fr 350px;
  height: calc(100vh - 50px);
}

#map {
  height:100%;
  width:100%;
}

.sidebar {
  padding:10px;
  overflow:auto;
  background:#0f1722;
}

.card {
  background:#111826;
  padding:10px;
  margin-bottom:10px;
  border-left:3px solid #4dd0e1;
  cursor:pointer;
}

.card:hover {
  background:#162033;
}

.small {
  font-size:12px;
  color:#aaa;
}
</style>
</head>

<body>

<header>
  <div>🥾 TURISTA V5 PRO MAP ENGINE</div>
  <div id="status">READY</div>
</header>

<div class="container">

  <div id="map"></div>

  <div class="sidebar">

    <h3>⛰ Útvonalak</h3>

    <div class="card" onclick="flyToRoute(0)">
      <b>Hármashatár-hegy kör</b><br>
      <span class="small">6.2 km · +420 m</span>
    </div>

    <div class="card" onclick="flyToRoute(1)">
      <b>Dobogókő túra</b><br>
      <span class="small">8.5 km · +510 m</span>
    </div>

    <div class="card" onclick="flyToRoute(2)">
      <b>Prédikálószék útvonal</b><br>
      <span class="small">11.3 km · +780 m</span>
    </div>

    <h3>📍 POI</h3>
    <div id="poiList"></div>

  </div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// 🧠 MAP INIT (Budapest)
const map = L.map('map').setView([47.4979, 19.0402], 11);

// OpenStreetMap layer
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

// 🥾 ROUTES (mock but structured like real system)
const routes = [
  {
    name: "Hármashatár-hegy",
    coords: [
      [47.5390, 18.9610],
      [47.5450, 18.9700],
      [47.5520, 18.9800]
    ],
    color: "#4dd0e1"
  },
  {
    name: "Dobogókő",
    coords: [
      [47.7250, 18.9000],
      [47.7300, 18.9200],
      [47.7400, 18.9400]
    ],
    color: "#ffb74d"
  },
  {
    name: "Prédikálószék",
    coords: [
      [47.7650, 18.9300],
      [47.7700, 18.9500],
      [47.7800, 18.9700]
    ],
    color: "#ef5350"
  }
];

// draw routes
routes.forEach(r => {
  L.polyline(r.coords, {
    color: r.color,
    weight: 4
  }).addTo(map).bindPopup(r.name);
});

// 🧭 POI SYSTEM
const pois = [
  {
    name: "Lajos-forrás",
    coords: [47.7255, 18.9350]
  },
  {
    name: "Julianus-kilátó",
    coords: [47.5550, 18.9700]
  },
  {
    name: "Dobogókő kilátó",
    coords: [47.7250, 18.9000]
  }
];

const poiMarkers = [];

pois.forEach(p => {
  const m = L.marker(p.coords)
    .addTo(map)
    .bindPopup("📍 " + p.name);

  poiMarkers.push(m);
});

// 📍 5KM RADIUS ENGINE
let radiusCircle = null;

function showRadius(center) {

  if (radiusCircle) {
    map.removeLayer(radiusCircle);
  }

  radiusCircle = L.circle(center, {
    radius: 5000,
    color: "#4dd0e1",
    fillOpacity: 0.1
  }).addTo(map);
}

// click map → POI radius
map.on("click", e => {
  showRadius(e.latlng);
});

// 🧭 FLY TO ROUTE
function flyToRoute(index) {
  const r = routes[index];
  map.flyTo(r.coords[0], 13);
  showRadius(r.coords[0]);
}

// 🧾 POI LIST UI
const poiList = document.getElementById("poiList");

pois.forEach(p => {
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = "📍 " + p.name;
  div.onclick = () => {
    map.flyTo(p.coords, 14);
    showRadius(p.coords);
  };
  poiList.appendChild(div);
});

</script>

</body>
</html>
