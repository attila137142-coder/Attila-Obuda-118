<!DOCTYPE html>
  <div>🚍 FUTÁR V5 STABLE CORE</div>
  <div class="clock" id="clock">--:--:--</div>
  <button class="btn" id="refreshBtn">🔄 Frissítés</button>
</header>

<div class="container">

  <div class="panel map">
    🗺️ LIVE TÉRKÉP HELYE (GTFS / BKK / MÁV / VOLÁN)
  </div>

  <div class="panel">
    <h3>🚏 Élő indulások</h3>

    <div id="errorBox" class="error"></div>

    <table>
      <thead>
        <tr>
          <th>Járat</th>
          <th>Megálló</th>
          <th>Indulás</th>
          <th>Késés</th>
        </tr>
      </thead>
      <tbody id="table">
        <tr>
          <td>🚌 34</td>
          <td>Békásmegyer H</td>
          <td>12:05</td>
          <td class="ok">0p</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<script>
(function () {
  "use strict";

  function setClock() {
    const el = document.getElementById("clock");
    if (!el) return;
    el.innerText = new Date().toLocaleTimeString();
  }

  function safeAppendRow() {
    const table = document.getElementById("table");
    const errorBox = document.getElementById("errorBox");

    try {
      if (!table) throw new Error("Table not found");

      const row = document.createElement("tr");
      row.innerHTML = `
        <td>🚍 TEST</td>
        <td>Auto Update</td>
        <td>--:--</td>
        <td class="ok">0p</td>
      `;

      table.appendChild(row);

      if (errorBox) errorBox.innerText = "";

    } catch (err) {
      if (errorBox) errorBox.innerText = "Hiba: " + err.message;
    }
  }

  function init() {
    setClock();
    setInterval(setClock, 1000);

    const btn = document.getElementById("refreshBtn");
    if (btn) {
      btn.addEventListener("click", safeAppendRow);
    }
  }

  document.addEventListener("DOMContentLoaded", init);

})();
</script>

</body>
</html>
