<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V5 – OSM DEBUG FIX</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; background:#0b0f14; color:white; }
header { padding:10px; background:#111827; font-weight:bold; }
#map { height:90vh; }

.panel {
    position:absolute;
    top:60px;
    left:10px;
    z-index:999;
    background:#111827;
    padding:10px;
    width:320px;
    border-radius:8px;
}

button { width:100%; padding:8px; margin-top:5px; cursor:pointer; }

#status {
    font-size:12px;
    margin-top:8px;
    color:#93c5fd;
    white-space:pre-line;
}
</style>
</head>

<body>

<header>🧭 FUTÁR V5 – OSM DEBUG FIX VERSION</header>

<div class="panel">
<button onclick="load()">🚶‍♂️ Turistaút betöltése</button>
<div id="status">Idle</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([47.52, 19.03], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:"OSM"
}).addTo(map);

// ------------------------------
function log(msg){
    document.getElementById("status").innerText = msg;
}

// ------------------------------
// FALLBACK DEMO (ha API halott)
const fallback = [
    [[47.57,19.04],[47.55,19.03],[47.54,19.02]],
    [[47.50,18.96],[47.51,18.97],[47.52,18.98]]
];

// ------------------------------
async function load(){

    log("Loading Overpass API...");

    try {

        const query = `
        [out:json][timeout:10];
        (
          way["highway"~"path|footway|track"](47.45,18.85,47.60,19.20);
        );
        out geom;
        `;

        const url = "https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query);

        const res = await fetch(url);

        log("Response received... parsing JSON");

        const data = await res.json();

        log(
            "OK\nElements: " + (data.elements?.length || 0)
        );

        if(!data.elements || data.elements.length === 0){
            throw new Error("EMPTY DATA");
        }

        let count = 0;

        data.elements.forEach(el => {

            if(!el.geometry) return;

            const line = el.geometry.map(p => [p.lat, p.lon]);

            L.polyline(line, {
                color: "green",
                weight: 3
            }).addTo(map);

            count++;
        });

        log("Rendered OSM paths: " + count);

    } catch(e){

        console.error(e);

        log(
`ERROR ❌ Overpass failed

Reason: ${e.message}

→ switching to FALLBACK DEMO`
        );

        // fallback rajz
        fallback.forEach(line => {
            L.polyline(line, {
                color:"orange",
                weight:3
            }).addTo(map);
        });

        log("FALLBACK MAP LOADED ✔️ (demo paths)");
    }
}

</script>

</body>
</html>
