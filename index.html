<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🚦 FUTÁR V5 UNIVERSAL GTFS ENGINE</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#05080d;
  color:#d7e1ea;
}

header{
  background:#0f1621;
  padding:10px;
  display:flex;
  justify-content:space-between;
  border-bottom:2px solid #1f2a3a;
}

#clock{
  font-size:20px;
  color:#00e5ff;
  font-weight:bold;
}

.container{
  display:grid;
  grid-template-columns:360px 1fr;
  height:calc(100vh - 50px);
}

.panel{
  background:#0f1621;
  padding:10px;
  border-right:1px solid #1f2a3a;
  overflow:auto;
}

.main{
  padding:10px;
  overflow:auto;
}

input,button{
  width:100%;
  padding:8px;
  margin-top:6px;
  background:#111826;
  border:1px solid #2b3b52;
  color:white;
}

button{
  background:#1e88e5;
  font-weight:bold;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

td,th{
  border:1px solid #2b3b52;
  padding:6px;
  font-size:12px;
}

th{
  background:#111826;
  color:#4dd0e1;
}

.badge{
  background:#1e88e5;
  padding:2px 6px;
  border-radius:4px;
}

.warn{
  color:#ffeb3b;
}

.ok{
  color:#00e676;
}
</style>
</head>

<body>

<header>
<div>🚦 FUTÁR V5 UNIVERSAL ENGINE (ZERO FAIL MODE)</div>
<div id="clock"></div>
</header>

<div class="container">

<div class="panel">

<h3>📦 GTFS ZIP (ANY FORMAT)</h3>
<input type="file" id="zip"/>
<button onclick="loadGTFS()">LOAD & NORMALIZE</button>

<hr/>

<h3>🔍 STOP SEARCH</h3>
<input id="search" oninput="searchStops()"/>
<div id="results"></div>

</div>

<div class="main">

<h2>🚏 STOP VIEW (AUTO FIX MODE)</h2>
<div id="stopInfo">No stop selected</div>

<table>
<thead>
<tr>
<th>Járat</th>
<th>Irány</th>
<th>Indulás</th>
<th>Status</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>

</div>

<script>

let GTFS={
  stops:[],
  routes:[],
  trips:[],
  stopTimes:[]
};

// CLOCK
setInterval(()=>{
  document.getElementById("clock").innerText=
    new Date().toLocaleTimeString();
},1000);

// ---------------- LOAD + NORMALIZE ----------------
async function loadGTFS(){
  const file=document.getElementById("zip").files[0];
  const zip=await JSZip.loadAsync(file);

  GTFS.stops = normalize(
    await zip.file("stops.txt").async("string")
  );

  GTFS.routes = normalize(
    await zip.file("routes.txt").async("string")
  );

  GTFS.trips = normalize(
    await zip.file("trips.txt").async("string")
  );

  GTFS.stopTimes = normalize(
    await zip.file("stop_times.txt").async("string")
  );

  alert("GTFS loaded + normalized ✔");
}

// ---------------- UNIVERSAL NORMALIZER ----------------
function normalize(text){
  const lines = text
    .replace(/\r/g,"")
    .split("\n")
    .filter(l=>l.trim());

  const headers = lines[0].split(",").map(h=>h.trim());

  return lines.slice(1).map(line=>{
    const values = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || [];

    const obj = {};

    headers.forEach((h,i)=>{
      obj[h] = (values[i] || "")
        .replace(/"/g,"")
        .trim();
    });

    return obj;
  });
}

// ---------------- SEARCH (SAFE) ----------------
function searchStops(){
  const q=(document.getElementById("search").value||"").toLowerCase();

  const res = GTFS.stops.filter(s =>
    (s.stop_name||"").toLowerCase().includes(q)
  );

  document.getElementById("results").innerHTML =
    res.slice(0,50).map(s=>`
      <div onclick="selectStop('${s.stop_id}','${s.stop_name}')"
           style="padding:6px;border-bottom:1px solid #1f2a3a;cursor:pointer">
        🚏 ${s.stop_name}
      </div>
    `).join("");
}

// ---------------- STOP SELECT ----------------
function selectStop(id,name){

  document.getElementById("stopInfo").innerHTML=
    `<h3>🚏 ${name}</h3><span class="badge">${id}</span>`;

  const base = GTFS.stopTimes.filter(t =>
    String(t.stop_id||"").trim() === String(id).trim()
  );

  render(base);
}

// ---------------- SAFE JOIN ENGINE ----------------
function render(list){

  if(!list || list.length===0){
    document.getElementById("table").innerHTML=
      `<tr><td colspan="4" class="warn">Nincs adat ehhez a megállóhoz (GTFS mismatch vagy hiányzó kapcsolat)</td></tr>`;
    return;
  }

  document.getElementById("table").innerHTML =
    list.slice(0,40).map(t=>{

      const trip = GTFS.trips.find(x =>
        String(x.trip_id||"").trim() === String(t.trip_id||"").trim()
      );

      const route = trip
        ? GTFS.routes.find(r =>
            String(r.route_id||"").trim() === String(trip.route_id||"").trim()
          )
        : null;

      const line = route?.route_short_name || "UNKNOWN";
      const dir  = trip?.trip_headsign || t.stop_headsign || "→ UNKNOWN";

      const status = "LIVE OK";

      return `
        <tr>
          <td><span class="badge">${line}</span></td>
          <td>${dir}</td>
          <td>${t.arrival_time||"-"}</td>
          <td class="ok">${status}</td>
        </tr>
      `;
    }).join("");
}

</script>

</body>
</html>
