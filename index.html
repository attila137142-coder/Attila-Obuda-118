<script>

// ==========================
// GTFS ADATBÁZIS
// ==========================
let GTFS = {
    stops:[]
};

// ==========================
// GTFS PARSER JAVÍTOTT
// ==========================
function parseGTFS(text){

    const lines = text.split(/\r?\n/);

    for(let i=1;i<lines.length;i++){

        const line = lines[i].trim();

        if(!line) continue;

        const parts = line.split(",");

        if(parts.length < 5) continue;

        const lat = parseFloat(parts[3]);
        const lon = parseFloat(parts[4]);

        if(isNaN(lat) || isNaN(lon)) continue;

        let name = (parts[2] || "")
            .replace(/^"/,"")
            .replace(/"$/,"")
            .trim();

        if(!name) continue;

        if(name.includes("�")) continue;

        GTFS.stops.push({
            id: parts[0],
            name,
            lat,
            lon
        });
    }
}

// ==========================
// KERESÉS
// ==========================
function searchStops(){

    const q =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    if(!q){
        document.getElementById("results").innerHTML="";
        return;
    }

    const res = GTFS.stops.filter(s =>
        s.name &&
        s.name.toLowerCase().includes(q)
    );

    document.getElementById("results").innerHTML =
        res.slice(0,50).map(r => `
            <div
                style="
                    padding:8px;
                    margin-bottom:2px;
                    background:#0b0f14;
                    border-left:3px solid #00ff9d;
                    cursor:pointer;
                "
                onclick="selectStop('${r.name.replace(/'/g,'')}')">

                <b>${r.name}</b><br>
                <small>ID: ${r.id}</small>

            </div>
        `).join("");
}

// ==========================
// STOP KIJELÖLÉS
// ==========================
function selectStop(name){

    const stop =
        GTFS.stops.find(s => s.name === name);

    if(!stop) return;

    document.getElementById("stopBoard").innerHTML = `

        <div style="font-size:22px">
            📍 ${stop.name}
        </div>

        <hr>

        <div>ID: ${stop.id}</div>
        <div>Lat: ${stop.lat}</div>
        <div>Lon: ${stop.lon}</div>

    `;
}

// ==========================
// GPS
// ==========================
function getLocation(){

    if(!navigator.geolocation){
        alert("GPS nem támogatott");
        return;
    }

    navigator.geolocation.getCurrentPosition(

        async pos => {

            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;

            document.getElementById("coords").innerHTML =
                `${lat.toFixed(6)}, ${lon.toFixed(6)}`;

            try{

                const r = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`
                );

                const d = await r.json();

                document.getElementById("address").innerText =
                    d.display_name || "Nincs cím";

            }catch(e){

                document.getElementById("address").innerText =
                    "Cím nem elérhető";

            }

            calculateNearestStops(lat,lon);

        },

        err => {

            alert("GPS hiba");

        }

    );
}

// ==========================
// TÁVOLSÁG
// ==========================
function dist(lat1, lon1, lat2, lon2){

    const R = 6371000;

    const dLat =
        (lat2-lat1) * Math.PI/180;

    const dLon =
        (lon2-lon1) * Math.PI/180;

    const a =
        Math.sin(dLat/2)**2 +
        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.sin(dLon/2)**2;

    return R * 2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );
}

// ==========================
// LEGKÖZELEBBI MEGÁLLÓK
// ==========================
function calculateNearestStops(lat,lon){

    if(!GTFS.stops.length){

        document.getElementById("nearStops")
            .innerHTML =
            "Nincs GTFS betöltve";

        return;
    }

    const nearest =
        GTFS.stops
        .map(s => ({
            ...s,
            d: dist(
                lat,
                lon,
                s.lat,
                s.lon
            )
        }))
        .sort((a,b)=>a.d-b.d)
        .slice(0,10);

    document.getElementById("nearStops").innerHTML =
        nearest.map(s => `

            <div
                style="
                    padding:8px;
                    margin-bottom:4px;
                    background:#111826;
                "
                onclick="selectStop('${s.name.replace(/'/g,'')}')">

                <b>${s.name}</b><br>

                <small>
                    ${Math.round(s.d)} m
                </small>

            </div>

        `).join("");
}

// ==========================
// ÓRA
// ==========================
setInterval(() => {

    document.getElementById("clock").innerText =
        new Date().toLocaleTimeString("hu-HU");

},1000);

</script>
