<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V5 SMART ZONE ENGINE v2</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#0b0f14;
    color:#e6f1ff;
}

.header{
    background:#111827;
    padding:12px;
    display:flex;
    justify-content:space-between;
    font-weight:bold;
}

.clock{color:#00ff99;}

.container{
    padding:10px;
    display:grid;
    gap:10px;
}

.panel{
    background:#111827;
    border:1px solid #1f2937;
    border-radius:10px;
    padding:10px;
}

input{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:none;
}

button{
    width:100%;
    padding:10px;
    margin-top:8px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
}

.tag{
    display:inline-block;
    padding:3px 8px;
    border-radius:6px;
    font-size:12px;
    margin:2px;
}

.budapest{background:#1e3a8a;}
.pest{background:#065f46;}
.zala{background:#7c2d12;}
.near{background:#374151;}
.ok{color:#00ff99;}
.warn{color:#ffcc00;}
</style>
</head>

<body>

<div class="header">
🚍 FUTÁR V5 SMART ZONE ENGINE v2
<div class="clock" id="clock"></div>
</div>

<div class="container">

<div class="panel">
<h3>🌍 Okos kereső (országos + zónás)</h3>
<input id="q" placeholder="pl. Tahitótfalu / Zalaegerszeg / Oktogon">
<button onclick="search()">Keresés</button>
<div id="out"></div>
</div>

<div class="panel">
<h3>🧠 Zóna rendszer</h3>
<div>
<span class="tag budapest">BUDAPEST CORE</span>
<span class="tag pest">PEST AGGLO</span>
<span class="tag zala">ZALA REGION</span>
<span class="tag near">NEARBY LOGIC</span>
</div>
</div>

<div class="panel">
<h3>📡 TALÁLATOK</h3>
<div id="results"></div>
</div>

</div>

<script>

/* ======================
   🧠 ZONE DATABASE
====================== */

const database = [
    {name:"Budapest", zone:"BUDAPEST CORE", type:"city"},
    {name:"Oktogon", zone:"BUDAPEST CORE", type:"stop"},
    {name:"Blaha Lujza tér", zone:"BUDAPEST CORE", type:"stop"},

    {name:"Tahitótfalu", zone:"PEST AGGLO", type:"town"},
    {name:"Vác", zone:"PEST AGGLO", type:"city"},
    {name:"Érd", zone:"PEST AGGLO", type:"city"},

    {name:"Zalaegerszeg", zone:"ZALA REGION", type:"city"},
    {name:"Keszthely", zone:"ZALA REGION", type:"city"},
    {name:"Nagykanizsa", zone:"ZALA REGION", type:"city"}
];

/* ======================
   ⏰ CLOCK
====================== */
setInterval(()=>{
    document.getElementById("clock").innerText =
        new Date().toLocaleTimeString();
},1000);

/* ======================
   🔎 SMART SEARCH
====================== */
function search(){
    let q = document.getElementById("q").value.toLowerCase();

    let matches = database.filter(d =>
        d.name.toLowerCase().includes(q)
    );

    let out = document.getElementById("results");
    let html = "";

    if(matches.length === 0){

        // 🚨 SMART FALLBACK (NEARBY LOGIC)
        html += "<p class='warn'>⚠ Nincs pontos találat – közeli zónák aktiválva</p>";

        database.forEach(d=>{
            if(d.zone.includes("PEST") || d.zone.includes("BUDAPEST")){
                html += `<p>🟢 ${d.name} <small>(${d.zone})</small></p>`;
            }
        });

        out.innerHTML = html;
        return;
    }

    matches.forEach(m=>{
        html += `<p class='ok'>✔ ${m.name} <small>(${m.zone})</small></p>`;
    });

    out.innerHTML = html;
}

</script>

</body>
</html>
