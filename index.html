<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
background:#070b10;
font-family:Arial,sans-serif;
color:white;
overflow:auto;
}

/* HEADER */

header{
position:sticky;
top:0;
z-index:999;
height:68px;
background:#101826;
border-bottom:2px solid #00ffaa;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 12px;
}

.logo{
font-size:18px;
font-weight:bold;
color:#00ffaa;
}

#clock{
font-size:20px;
font-weight:bold;
color:#00ffaa;
}

#date{
font-size:11px;
color:#b7c7dc;
text-align:right;
}

/* MAIN */

.main{
padding:10px;
display:grid;
gap:16px;
}

/* SECTION */

.section{
background:#101925;
border:1px solid #233044;
border-radius:12px;
padding:12px;
}

/* TITLE */

.section h2{
margin:0 0 12px 0;
font-size:15px;
color:#00ffaa;
border-bottom:1px solid #233044;
padding-bottom:8px;
}

/* GRID */

.grid{
display:grid;
gap:8px;
}

/* BUTTON */

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-size:14px;
font-weight:bold;
cursor:pointer;
color:white;
text-align:left;
transition:0.2s;
}

button:hover{
transform:scale(1.01);
opacity:0.95;
}

/* COLORS */

.live{background:#1f6feb;}
.station{background:#4d2032;}
.map{background:#52307a;}
.mav{background:#24476b;}
.volan{background:#5a3615;}
.special{background:#234d36;}
.search{background:#553914;}

/* INPUT */

input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#182334;
color:white;
font-size:14px;
}

/* STATUS */

.status{
position:sticky;
bottom:0;
background:#101826;
border-top:1px solid #233044;
padding:10px;
font-size:12px;
color:#00ffaa;
}

/* MOBILE */

@media(max-width:700px){

.logo{
font-size:15px;
}

#clock{
font-size:16px;
}

button{
font-size:13px;
padding:13px;
}

}

</style>
</head>

<script>

/* CLOCK */

function updateClock(){

const now = new Date();

document.getElementById("clock").innerHTML =
now.toLocaleTimeString('hu-HU');

document.getElementById("date").innerHTML =
now.toLocaleDateString('hu-HU',{
year:'numeric',
month:'short',
day:'numeric',
weekday:'short'
});

}

setInterval(updateClock,1000);
updateClock();

/* OPEN */

function openExternal(url){

window.open(url,'_blank');

document.getElementById("statusbar").innerHTML =
"🌐 KÜLSŐ MEGNYITÁS: " + url;

}

/* BKK */

function openBKKStop(){

let id =
document.getElementById("bkkInput").value.trim();

if(!id){
alert("Adj meg BKK stop ID-t!");
return;
}

let url =
"https://realtimenext.hu/embed/bkv/stops/"
+ id +
"/schedule";

window.open(url,'_blank');

}

/* VOLAN */

function openVolanStop(){

let id =
document.getElementById("volanInput").value.trim();

if(!id){
alert("Adj meg VOLÁN stop ID-t!");
return;
}

if(!id.includes("_")){
id = id + "_0";
}

window.open(
"https://utas.hu/stop/hkir_" + id,
'_blank'
);

}

/* GPS */

function getLocation(){

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(

function(pos){

document.getElementById("statusbar").innerHTML =
"📍 GPS: "
+ pos.coords.latitude.toFixed(5)
+ " | "
+ pos.coords.longitude.toFixed(5);

},

function(){

alert("GPS engedély szükséges");

}

);

}else{

alert("GPS nem támogatott");

}

}

/* TOP */

function scrollToTop(){

window.scrollTo({
top:0,
behavior:'smooth'
});

}

</script>
