<!DOCTYPE html><html lang="hu"><head><meta charset="UTF-8"><title>CONTROL ROOM V3</title><style>body { margin:0; font-family:Arial; background:#06090f; color:#00ff9d; }header { padding:12px; background:#0f1722; }.grid { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:45vh 45vh; gap:8px; padding:8px; }.panel { background:#0c121b; border:1px solid #00ff9d22; overflow:auto; }h3 { margin:0; padding:8px; background:#111c2a; }.content { padding:8px; font-size:12px; }.ok { color:#00ff9d; }.err { color:#ff4d4d; }button { padding:6px; background:#00ff9d; border:none; cursor:pointer; }</style></head><body><header>🚦 CONTROL ROOM V3 // LIVE BACKEND CONNECTED<button onclick="load()">REFRESH</button></header><div class="grid"><div class="panel"><h3>🚌 JÁRMŰVEK (LIVE)</h3><div class="content" id="v">loading...</div></div><div class="panel"><h3>📊 VONAL ADATOK</h3><div class="content" id="l">loading...</div></div><div class="panel"><h3>🗺️ MAP</h3><iframe src="https://futar.bkk.hu/" style="width:100%;height:100%;border:0;"></iframe></div><div class="panel"><h3>🧠 SYSTEM STATUS</h3><div class="content" id="s"></div></div></div><script>async function load() {    const v = await fetch("http://localhost:3000/api/vehicles").then(r=>r.json());    const l = await fetch("http://localhost:3000/api/lines").then(r=>r.json());    const s = await fetch("http://localhost:3000/api/health").then(r=>r.json());    document.getElementById("v").innerText =        v.ok ? v.data.slice(0,1200) : "ERROR";    document.getElementById("l").innerText =        l.ok ? l.data.slice(0,1200) : "ERROR";    document.getElementById("s").innerHTML =        `<div class="ok">${s.status}</div><br>${s.system}`;}load();</script></body></html>
