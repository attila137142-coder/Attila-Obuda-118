<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>FUTÁR CONTROL ROOM V11 REAL MOBILE</title>

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

body{
margin:0;
background:#070b10;
font-family:Arial,sans-serif;
color:white;
}

header{
position:sticky;
top:0;
z-index:9999;
height:76px;
background:#101826;
border-bottom:2px solid #00ffaa;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 14px;
}

.logo{font-size:16px;font-weight:bold;color:#00ffaa;}

.top{text-align:right;}

#clock{font-size:18px;color:#00ffaa;font-weight:bold;}
#date{font-size:11px;color:#b8c7da;}

.main{padding:12px;display:grid;gap:16px;}

.section{
background:#101925;
border:1px solid #223246;
border-radius:14px;
padding:14px;
}

.section h2{
margin:0 0 12px 0;
font-size:14px;
color:#00ffaa;
border-bottom:1px solid #233246;
padding-bottom:8px;
}

.grid{display:grid;gap:10px;}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:13px;
font-weight:bold;
cursor:pointer;
color:white;
text-align:left;
}

.live{background:#1f6feb;}
.station{background:#4d2032;}
.mav{background:#24476b;}
.gpsbtn{background:#5a3d13;}
.aev{background:#2f5d35;}

input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
background:#182334;
color:white;
}

.status{
position:sticky;
bottom:0;
background:#101826;
border-top:1px solid #233246;
padding:10px;
font-size:12px;
color:#00ffaa;
}

</style>

</head>

<body>

<header>
<div class="logo">🚦 FUTÁR CONTROL ROOM V11</div>
<div class="top">
<div id="clock">--:--:--</div>
<div id="date"></div>
</div>
</header>

<div class="main">

<!-- KASSAI DÁNIEL -->
<div class="section">
<h2>📡 KASSAI DÁNIEL MENETREND</h2>

<div class="grid">

<button class="live" onclick="openURL('https://online.winmenetrend.hu/')">📡 FŐ MENETRENDSZER</button>

<button class="live" onclick="openURL('https://online.winmenetrend.hu/budapest/latest/lines')">🚍 VALÓS INDULÁSOK</button>

<button class="live" onclick="openURL('https://futar.bkk.hu/')">🚌 FUTÁR LIVE</button>

</div>
</div>

<!-- MEGÁLLÓ MENETREND -->
<div class="section">
<h2>📜 MEGÁLLÓ MENETREND (KASSAI MM)</h2>

<div class="grid">

<input id="stopInput" placeholder="Stop ID (pl: 005546847)">

<button class="gpsbtn" onclick="openStop()">🚏 MEGÁLLÓ MEGNYITÁS</button>

</div>
</div>

<!-- BKK / VOLÁN -->
<div class="section">
<h2>🔎 GYORSKERESŐ</h2>

<div class="grid">

<input id="bkk" placeholder="BKK stop ID">
<button class="gpsbtn" onclick="openBKK()">🚏 BKK STOP</button>

<input id="volan" placeholder="VOLÁN ID">
<button class="gpsbtn" onclick="openVOLAN()">🚌 VOLÁN STOP</button>

</div>
</div>

<!-- GYERMEKVASÚT -->
<div class="section">
<h2>🚂 GYERMEKVASÚT ÁLLOMÁSOK</h2>

<div class="grid">

<button class="aev" onclick="openURL('https://jegy.mav.hu/menetrend/allomas?005546847')">Hűvösvölgy</button>
<button class="aev" onclick="openURL('https://jegy.mav.hu/menetrend/allomas?005546854')">Hárs-hegy</button>
<button class="aev" onclick="openURL('https://jegy.mav.hu/menetrend/allomas?005546862')">Szépjuhászné</button>
<button class="aev" onclick="openURL('https://jegy.mav.hu/menetrend/allomas?005546870')">János-hegy</button>
<button class="aev" onclick="openURL('https://jegy.mav.hu/menetrend/allomas?005546888')">Virágvölgy</button>
<button class="aev" onclick="openURL('https://jegy.mav.hu/menetrend/allomas?005546896')">Csillebérc</button>
<button class="aev" onclick="openURL('https://jegy.mav.hu/menetrend/allomas?005546912')">Széchenyi-hegy</button>

</div>
</div>

</div>

<div class="status" id="status">🟢 READY</div>

<script>

/* CLOCK */
function clock(){
let d=new Date();
document.getElementById("clock").innerText=d.toLocaleTimeString('hu-HU');
document.getElementById("date").innerText=d.toLocaleDateString('hu-HU');
}
setInterval(clock,1000);clock();

/* SAFE OPEN (IPHONE FIX) */
function openURL(url){
window.location.href=url;
document.getElementById("status").innerText="🌐 "+url;
}

/* KASSAI MM */
function openStop(){
let id=document.getElementById("stopInput").value.trim();
if(!id){alert("Adj meg Stop ID-t");return;}
openURL("https://jegy.mav.hu/menetrend/allomas?"+id);
}

/* BKK */
function openBKK(){
let id=document.getElementById("bkk").value.trim();
if(!id){alert("Adj BKK ID-t");return;}
openURL("https://realtimenext.hu/embed/bkv/stops/"+id+"/schedule");
}

/* VOLÁN */
function openVOLAN(){
let id=document.getElementById("volan").value.trim();
if(!id){alert("Adj VOLÁN ID-t");return;}
if(!id.includes("_")) id+="_0";
openURL("https://utas.hu/stop/hkir_"+id);
}

</script>

</body>
</html>
