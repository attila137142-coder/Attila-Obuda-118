let STOPS=[], STOP_TIMES=[], TRIPS=[], ROUTES=[], VEHICLES=[];
let MY={lat:null,lon:null};
let trackingInterval=null;

// 📏 DISTANCE (méter)
function dist(a,b,c,d){
  const R=6371000;
  const toRad=x=>x*Math.PI/180;
  let dLat=toRad(c-a);
  let dLon=toRad(d-b);
  let A=Math.sin(dLat/2)**2+
    Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(A),Math.sqrt(1-A));
}

// 📍 HELYZET
function getLocation(){
  navigator.geolocation.getCurrentPosition(pos=>{
    MY.lat=pos.coords.latitude;
    MY.lon=pos.coords.longitude;

    document.getElementById('me').innerHTML=`
    <div class='card'>
      📍 ${MY.lat.toFixed(6)}, ${MY.lon.toFixed(6)}
    </div>`;
  });
}

// 📦 GTFS LOAD
async function loadZIP(){
  let f=document.getElementById('zipInput').files[0];
  if(!f) return alert('Nincs ZIP');
  let zip=await JSZip.loadAsync(f);

  let sf=Object.keys(zip.files).find(x=>x.includes('stops.txt'));
  let t=await zip.file(sf).async('string');
  let L=t.split('\n'); let h=L[0].split(',');
