<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>GTFS STREAMING ENGINE V5</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body { margin:0; font-family:Arial; background:#0b1220; color:white; }
#map { height:70vh; }
.panel { padding:10px; background:#111a2e; }
pre { font-size:12px; white-space:pre-wrap; height:200px; overflow:auto; }
button { padding:8px; margin:5px; }
</style>
</head>

<body>

<div class="panel">
<h2>🚆 GTFS STREAMING ENGINE V5</h2>

<input type="file" id="zip" accept=".zip">
<button onclick="load()">LOAD ZIP</button>
<button onclick="build()">BUILD STREAM</button>

<div id="status">READY</div>
<pre id="log"></pre>
</div>

<div id="map"></div>

<script>

const map = L.map('map').setView([47.5,19.05],9);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'OSM'
}).addTo(map);

// ---------------- STATE ----------------
let stops = [];
let streamStops = [];

// ---------------- LOG ----------------
function log(t){
    document.getElementById("log").innerText += t + "\n";
}

function setStatus(t){
    document.getElementById("status").innerText = t;
}

// ---------------- ZIP LOAD ----------------
async function load(){

    const file = document.getElementById("zip").files[0];

    const zip = await JSZip.loadAsync(file);

    log("📦 ZIP LOADED");

    for(let path in zip.files){

        let name = path.toLowerCase().split("/").pop();

        if(name !== "stops.txt") continue;

        log("✔ STREAMING stops.txt...");

        const text = await zip.files[path].async("string");

        // ---------------- STREAM PARSE ----------------
        Papa.parse(text, {
            header:true,
            skipEmptyLines:true,
            worker:true,

            step: function(row){

                let s = row.data;

                if(!s.stop_lat || !s.stop_lon) return;

                let stop = {
                    name: s.stop_name,
                    lat: parseFloat(s.stop_lat),
                    lon: parseFloat(s.stop_lon)
                };

                streamStops.push(stop);

                // LIVE RENDER (streaming effect)
                if(streamStops.length % 200 === 0){
                    renderPartial();
                    log("STREAMED: " + streamStops.length);
                }
            },

            complete: function(){
                log("✔ STREAM COMPLETE");
                setStatus("STREAM READY ✔");
            }
        });
    }
}

// ---------------- BUILD (optional full finalize) ----------------
function build(){
    log("=== FINAL BUILD ===");
    stops = streamStops;
    log("TOTAL STOPS: " + stops.length);
    renderFull();
}

// ---------------- LIVE RENDER ----------------
function renderPartial(){

    map.eachLayer(l=>{
        if(l instanceof L.CircleMarker) map.removeLayer(l);
    });

    streamStops.slice(-2000).forEach(s=>{

        L.circleMarker([s.lat,s.lon],{
            radius:3,
            color:"cyan"
        }).addTo(map);
    });
}

// ---------------- FULL RENDER ----------------
function renderFull(){

    map.eachLayer(l=>{
        if(l instanceof L.CircleMarker) map.removeLayer(l);
    });

    stops.forEach(s=>{
        L.circleMarker([s.lat,s.lon],{
            radius:3,
            color:"cyan"
        }).addTo(map);
    });
}

</script>

</body>
</html>
