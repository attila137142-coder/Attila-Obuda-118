<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V11.3 DISPATCH TABLE ENGINE</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:#e5e7eb;
}

header{
    background:#111827;
    padding:14px;
    text-align:center;
    font-weight:bold;
    color:#38bdf8;
}

.container{
    display:flex;
    height:100vh;
}

/* LEFT SIDE */
.left{
    width:65%;
    display:flex;
    flex-direction:column;
    border-right:1px solid #1f2937;
}

.panel{
    padding:10px;
    border-bottom:1px solid #1f2937;
}

input,button{
    width:100%;
    padding:10px;
    margin-top:6px;
    border-radius:8px;
    border:none;
}

input{
    background:#1f2937;
    color:white;
}

button{
    background:#38bdf8;
    font-weight:bold;
}

/* TABLE */
.table{
    flex:1;
    overflow:auto;
    padding:10px;
}

.row{
    background:#0f172a;
    padding:10px;
    margin-bottom:8px;
    border-radius:10px;
    border:1px solid #1f2937;
}

.row:hover{
    background:#111827;
}

/* RIGHT SIDE */
.right{
    width:35%;
    display:flex;
    flex-direction:column;
}

.log{
    flex:1;
    padding:10px;
    font-size:12px;
    overflow:auto;
    background:#0a0f1a;
}
.badge{
    display:inline-block;
    padding:2px 6px;
    background:#1f2937;
    border-radius:6px;
    font-size:11px;
}
</style>
</head>

<body>

<header>
🚦 V11.3 VALÓDI DISZPÁCSOLÓ TÁBLÁZAT MOTOR
</header>

<div class="container">

<!-- LEFT -->
<div class="left">

<div class="panel">
<input id="q" placeholder="Megálló / GTFS ID / Skanzen / Királyrét / stb">
<button onclick="search()">KERESÉS</button>
<button onclick="loadDepartures()">INDULÁSI TÁBLA BETÖLTÉS</button>
</div>

<div class="table" id="table"></div>

</div>

<!-- RIGHT -->
<div class="right">

<div class="log" id="log"></div>

</div>

</div>

<script>

// ---------------- LOG ----------------
function log(m){
    let el=document.getElementById("log");
    el.innerHTML+=m+"<br>";
    el.scrollTop=el.scrollHeight;
}

// ---------------- GTFS STOP DB ----------------
let STOPS=[
    {id:"SKANZEN",name:"Skanzen"},
    {id:"KIRALYRET",name:"Királyrét"},
    {id:"TAHITOTFALU",name:"Tahitótfalu"},
    {id:"HIDFO",name:"Hídfő"},
    {id:"NAD",name:"Nád utca"}
];

// ---------------- VEHICLE LAYER ----------------
let VEHICLE_DB={
    "T1":{
        type:"Volvo 7900",
        plate:"ABC-123",
        fleet:"F12"
    },
    "T2":{
        type:"Stadler HÉV",
        plate:"HEV-045",
        fleet:"H03"
    }
};

// ---------------- DEPARTURES ----------------
let departures=[
    {time:"08:10",trip:"T1"},
    {time:"08:22",trip:"T2"},
    {time:"08:35",trip:"T1"}
];

// ---------------- NORMALIZE ----------------
function norm(s){
    return s.toLowerCase()
    .replaceAll("á","a")
    .replaceAll("é","e")
    .replaceAll("í","i")
    .replaceAll("ó","o")
    .replaceAll("ö","o")
    .replaceAll("ő","o")
    .replaceAll("ú","u")
    .replaceAll("ü","u");
}

// ---------------- SEARCH ----------------
function search(){
    let q=document.getElementById("q").value;
    log("🔎 Keresés: "+q);

    let nq=norm(q);

    let res=STOPS.filter(s=>norm(s.name).includes(nq)||norm(s.id).includes(nq));

    if(res.length==0){
        log("❌ nincs találat → fallback");
        return;
    }

    res.forEach(r=>{
        log("✅ "+r.name+" ("+r.id+")");
    });
}

// ---------------- RENDER TABLE ----------------
function loadDepartures(){

    let el=document.getElementById("table");
    el.innerHTML="";

    log("🚦 indulási tábla betöltés...");

    departures.forEach(d=>{

        let v=VEHICLE_DB[d.trip]||{
            type:"N/A",
            plate:"N/A",
            fleet:"N/A"
        };

        let div=document.createElement("div");
        div.className="row";

        div.innerHTML=`
            🕒 <b>${d.time}</b><br>
            🚌 ${v.type}<br>
            🚏 Rendszám: ${v.plate}<br>
            🔢 Forda: ${v.fleet}<br>
            <span class="badge">TRIP: ${d.trip}</span>
        `;

        el.appendChild(div);
    });

    log("✔️ tábla kész");
}

log("🚀 V11.3 DISPATCH TABLE ENGINE READY");

</script>

</body>
</html>
