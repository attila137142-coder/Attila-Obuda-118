<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>SLOPE V3.1 FIX</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
body { margin:0; background:#111; color:#fff; font-family:Arial;}
#map { height:50vh;}
#panel { padding:10px;}
input,button { padding:10px; margin:5px;}
#results div { cursor:pointer; padding:5px; border-bottom:1px solid #333;}
table { width:100%; font-size:12px; border-collapse:collapse;}
td,th { border:1px solid #444; padding:4px;}
</style>
</head>
<body>

<div id="map"></div>

<div id="panel">
<input id="street" placeholder="pl: Hegyalja út">
<button onclick="search()">KERESÉS</button>
<button onclick="calc()">MEREDESÉG</button>

<div id="results"></div>

<table id="tbl">
<tr><th>#</th><th>Hossz (m)</th><th>Δh (m)</th><th>%</th></tr>
</table>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map = L.map('map').setView([47.4979,19.0402],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let coords = [];
let line;

// 🔍 KERESÉS
async function search(){
  let q = street.value;
  let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q},Budapest&limit=5`);
  let data = await res.json();

  results.innerHTML="";
  data.forEach(p=>{
    let d=document.createElement("div");
    d.innerText=p.display_name;
    d.onclick=()=>load(p);
    results.appendChild(d);
  });
}

// 📍 UTCA BETÖLTÉS – FIX név alapú
async function load(p){
  map.setView([p.lat,p.lon],16);

  let name = p.display_name.split(",")[0];

  let q = `
  [out:json];
  way["name"="${name}"]["highway"](around:1000,${p.lat},${p.lon});
  out geom;
  `;

  let res = await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:q});
  let data = await res.json();

  if(data.elements.length==0){
    alert("Nem található pontos utca!");
    return;
  }

  coords = data.elements[0].geometry.map(p=>[p.lat,p.lon]);

  if(line) map.removeLayer(line);
  line = L.polyline(coords,{color:"cyan"}).addTo(map);

  alert("Utca OK!");
}

// ⛰️ MAGASSÁG – LIMITÁLT (nem hal el)
async function getElev(points){

  // max 100 pont
  let sample = points.filter((_,i)=> i%3===0);

  let res = await fetch("https://api.open-elevation.com/api/v1/lookup",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      locations: sample.map(p=>({latitude:p[0],longitude:p[1]}))
    })
  });

  let data = await res.json();

  // visszaskálázás
  let elev=[];
  let j=0;
  for(let i=0;i<points.length;i++){
    if(i%3===0){
      elev.push(data.results[j].elevation);
      j++;
    } else {
      elev.push(elev[elev.length-1]);
    }
  }

  return elev;
}

// 📊 SZÁMÍTÁS – FIX
async function calc(){

  if(coords.length==0){
    alert("Nincs utca!");
    return;
  }

  let elev = await getElev(coords);

  tbl.innerHTML="<tr><th>#</th><th>m</th><th>Δh</th><th>%</th></tr>";

  for(let i=0;i<coords.length-1;i++){

    let p1=coords[i];
    let p2=coords[i+1];

    let d = map.distance(p1,p2);
    let dh = elev[i+1]-elev[i];
    let slope = (dh/d)*100;

    // RAJZ
    let c="green";
    if(slope>5) c="orange";
    if(slope>10) c="red";

    L.polyline([p1,p2],{color:c,weight:5}).addTo(map);

    let r = tbl.insertRow();
    r.innerHTML=`
      <td>${i}</td>
      <td>${d.toFixed(1)}</td>
      <td>${dh.toFixed(1)}</td>
      <td>${slope.toFixed(2)}</td>
    `;
  }

  alert("KÉSZ ✔ (MOST MÁR LESZ %)");
}
</script>

</body>
</html>
