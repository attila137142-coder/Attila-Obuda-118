<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V6 HYBRID MASTER DISPATCHER</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#0b0f14;
    color:#e6e6e6;
}

header{
    padding:10px;
    background:#111826;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid #1f2a3a;
}

#clock{
    font-weight:bold;
    color:#00ff99;
}

button{
    background:#1f6feb;
    border:none;
    padding:8px 12px;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#2b7fff;
}

.container{
    display:grid;
    grid-template-columns: 1fr 1fr;
    height:calc(100vh - 50px);
}

#map{
    height:100%;
    width:100%;
}

.panel{
    padding:10px;
    overflow:auto;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border-radius:6px;
    border:none;
}

.table{
    width:100%;
    border-collapse:collapse;
}

.table td, .table th{
    border-bottom:1px solid #1f2a3a;
    padding:6px;
    font-size:13px;
}

.badge{
    padding:2px 6px;
    border-radius:4px;
    font-size:12px;
}

.live{
    background:#00ff99;
    color:#000;
}

.delay{
    background:#ff3b3b;
}

.ok{
    background:#2b7fff;
}

#extraPanel{
    display:none;
    background:#0f1722;
    padding:10px;
    border-top:1px solid #1f2a3a;
}
</style>
</head>

<body>

<header>
    <div>🚍 FUTÁR V6 HYBRID MASTER</div>
    <div id="clock"></div>
    <button onclick="togglePanel()">KÜLÖN GOMB ⚙️</button>
</header>

<div class="container">

    <div id="map"></div>

    <div class="panel">

        <input placeholder="GTFS keresés (megálló / járat / CSV zóna)" oninput="search(this.value)">

        <table class="table">
            <tr><th>Járat</th><th>Hely</th><th>Késés</th></tr>
            <tr><td>🚍 7E</td><td>Nád utca</td><td><span class="badge live">LIVE</span></td></tr>
            <tr><td>🚍 105</td><td>Batthyány tér</td><td><span class="badge ok">+1p</span></td></tr>
            <tr><td>🚍 178</td><td>Flórián tér</td><td><span class="badge delay">+6p</span></td></tr>
        </table>

        <div id="extraPanel">
            <h3>⚙️ EXTRA DISPATCH PANEL</h3>
            <p>GTFS feed status: <b>CONNECTED (SIM)</b></p>
            <p>MÁV / VOLÁN / HÉV integráció: READY</p>
            <p>Realtime engine: OFFLINE DEMO MODE</p>
        </div>

    </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map = L.map('map').setView([47.4979, 19.0402], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: 'OSM'
}).addTo(map);

L.marker([47.4979, 19.0402]).addTo(map)
    .bindPopup("🚏 Budapest központ DISPATCH")
    .openPopup();

// óra
function updateClock(){
    document.getElementById("clock").innerText =
        new Date().toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

// toggle panel
function togglePanel(){
    let p = document.getElementById("extraPanel");
    p.style.display = (p.style.display === "block") ? "none" : "block";
}

// fake search
function search(q){
    console.log("GTFS keresés:", q);
}
</script>

</body>
</html>
