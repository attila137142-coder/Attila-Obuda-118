<style>

</style>

</head>


<body>


<div class="header">

🚦 ATTILA KÖZLEKEDÉS CONTROL

<br>

RealTimeNext Multi-Link + GTFS Connector V1.1 FIX

</div>



<!-- ÓRA -->


<div class="box">


<div class="title">
🕒 Dátum és pontos idő
</div>


<div id="clock" class="value">
Betöltés...
</div>


</div>





<!-- HELYADATOK -->


<div class="box">


<div class="title">
📍 Helyadataim
</div>


<div class="value">

GPS állapot:

<span id="gpsStatus">
Indítás...
</span>

</div>



<div class="value">

GPS pontosság:

<span id="accuracy">
-
</span>

</div>



<div class="value">

GPS minőség:

<span id="gpsQuality">
-
</span>

</div>



<div class="value">

Szélesség:

<span id="lat">
-
</span>

</div>


<div class="value">

Hosszúság:

<span id="lon">
-
</span>

</div>



<div class="value">

🚗 Sebesség:

<span id="speed">
0 km/h
</span>

</div>



<hr>



<div class="value">

🏙 Város:

<span id="city">
-
</span>

</div>



<div class="value">

🏠 Utca:

<span id="street">
-
</span>

</div>



<div class="value">

🔢 Házszám:

<span id="house">
-
</span>

</div>



</div>






<script>


// =============================
// ÓRA
// =============================


function updateClock(){

let d=new Date();


document.getElementById("clock").innerHTML =

d.toLocaleDateString("hu-HU")
+
" "
+
d.toLocaleTimeString("hu-HU");


}


setInterval(updateClock,1000);

updateClock();





// =============================
// GPS
// =============================


if(navigator.geolocation){


navigator.geolocation.watchPosition(

function(pos){


let lat=pos.coords.latitude;

let lon=pos.coords.longitude;



document.getElementById("gpsStatus").innerHTML=
"<span class='ok'>AKTÍV</span>";



document.getElementById("lat").innerHTML=
lat.toFixed(6);



document.getElementById("lon").innerHTML=
lon.toFixed(6);




let acc=
pos.coords.accuracy;



document.getElementById("accuracy").innerHTML=
Math.round(acc)+" méter";




// GPS minőség


let quality="";


if(acc<=20){

quality="⭐ KIVÁLÓ";

}

else if(acc<=100){

quality="🟢 JÓ";

}

else if(acc<=500){

quality="🟡 GYENGE";

}

else{

quality="🔴 HÁLÓZATI HELYZET";

}



document.getElementById("gpsQuality").innerHTML=
quality;





// sebesség


if(pos.coords.speed!==null){

let kmh=
pos.coords.speed*3.6;


document.getElementById("speed").innerHTML=
kmh.toFixed(1)+" km/h";


}

else{

document.getElementById("speed").innerHTML=
"0 km/h";

}





// címkeresés indítása

reverseGeo(lat,lon);



},


function(){


document.getElementById("gpsStatus").innerHTML=
"<span class='bad'>NINCS GPS</span>";


},


{

enableHighAccuracy:true,

maximumAge:1000,

timeout:10000

}



);


}

else{


document.getElementById("gpsStatus").innerHTML=
"Nincs GPS támogatás";


}






// =============================
// REVERSE GEOCODE
// =============================


async function reverseGeo(lat,lon){


try{


let url=

"https://nominatim.openstreetmap.org/reverse?format=json&lat="
+
lat
+
"&lon="
+
lon
+
"&zoom=18&addressdetails=1";



let response=
await fetch(url);



let data=
await response.json();



if(data.address){


document.getElementById("city").innerHTML=
data.address.city ||
data.address.town ||
data.address.village ||
"-";



document.getElementById("street").innerHTML=
data.address.road ||
"-";



document.getElementById("house").innerHTML=
data.address.house_number ||
"-";


}


}

catch(e){


console.log("Címkeresési hiba",e);


}


}

<!-- =================================================
 REALTIMENEXT MULTI-LINK + GTFS CONNECTOR V1.1 FIX
 2. RÉSZ
================================================= -->



<!-- GTFS MULTI LINK PANEL -->


<div class="box">


<div class="title">

</div>

<!-- INDULÁSI TÁBLA -->


<div class="box">


<div class="title">

📋 Közös indulási tábla

</div>



<table>


<thead>

<tr>

<th>Idő</th>

<th>Járat</th>

<th>GTFS megálló</th>

<th>Állapot</th>

</tr>

</thead>



<tbody id="departureTable">


<tr>

<td colspan="4">

Nincs adat

</td>

</tr>


</tbody>


</table>



</div>









<script>


// ==========================================
// GTFS MULTI LINK MOTOR V1.1
// ==========================================



function loadMultiGTFS(){



let raw =
document.getElementById("gtfsInput").value;



// tisztítás

let stops = raw

.split(/[\s,;]+/)

.map(x=>x.trim())

.filter(x=>x.length>0);




if(stops.length===0){


alert(
"Adj meg GTFS megálló számot!"
);


return;


}




let linkHTML="";




stops.forEach(function(stop){



let url =

"https://realtimenext.hu/embed/bkv/stops/"

+
encodeURIComponent(stop)

+
"/schedule";





linkHTML +=


"<div style='margin-bottom:12px'>"

+

"🚌 GTFS: <b>"

+

stop

+

"</b><br>"

+

"<a href='"

+

url

+

"' target='_blank'>"

+

"RealTimeNext megnyitás"

+

"</a>"

+

"</div>";





});





document.getElementById("links").innerHTML=
linkHTML;





createStatusTable(stops);



}









// ==========================================
// INDULÁSI TÁBLA
// ==========================================



function createStatusTable(stops){



let html="";





stops.forEach(function(stop,index){



let d=new Date();



d.setMinutes(
d.getMinutes()+((index+1)*5)
);




let time =

d.toLocaleTimeString(

"hu-HU",

{

hour:"2-digit",

minute:"2-digit"

}

);





html +=


"<tr>"

+

"<td>"+time+"</td>"

+

"<td>"

+

(jaratNev(index))

+

"</td>"

+

"<td>"

+

stop

+

"</td>"

+

"<td class='warn'>"

+

"KAPCSOLAT KÉSZ"

+

"<br>NINCS REALTIME ADAT"

+

"</td>"

+

"</tr>";



});





document.getElementById(
"departureTable"
)
.innerHTML=html;



}






// példa járat megnevezés

function jaratNev(i){



if(i===0){

return "160";

}


if(i===1){

return "243";

}


if(i===2){

return "HÉV";

}


return "Járat";



}




</script>
