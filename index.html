<script>

let feeds = [];
let parsed = 0;
let totalFiles = 0;

let stops = [];
let trips = [];
let routes = [];
let stopTimes = [];

// ---------------- ROUTER ----------------
function routeFile(name){
    name = name.toLowerCase();

    if(name.includes("stops")) return "stops";
    if(name.includes("stop_times")) return "stop_times";
    if(name.includes("trips")) return "trips";
    if(name.includes("routes")) return "routes";

    return "unknown";
}

// ---------------- LOAD ----------------
function loadFiles(){

    const files = document.getElementById("files").files;

    if(!files.length){
        alert("Nincs file!");
        return;
    }

    feeds = [];
    parsed = 0;
    totalFiles = files.length;

    debug("Loading " + totalFiles + " files...");

    for(let f of files){

        const type = routeFile(f.name);

        Papa.parse(f,{
            header:true,
            skipEmptyLines:true,
            complete:(r)=>{

                parsed++;

                debug("Loaded: " + f.name + " → " + type);

                if(type === "stops") stops = r.data;
                if(type === "stop_times") stopTimes = r.data;
                if(type === "trips") trips = r.data;
                if(type === "routes") routes = r.data;

                checkReady();
            }
        });
    }
}

// ---------------- READY CHECK ----------------
function checkReady(){

    debug(`Progress: ${parsed}/${totalFiles}`);

    if(parsed === totalFiles){
        debug("ALL FILES LOADED ✔");
        document.getElementById("status").innerText = "READY TO BUILD ✔";
    }
}

// ---------------- BUILD GUARD ----------------
function build(){

    if(parsed !== totalFiles){
        alert("⛔ Még nem töltődött be minden GTFS file!");
        return;
    }

    debug("=== BUILD START ===");

    debug("STOPS: " + stops.length);
    debug("TRIPS: " + trips.length);
    debug("ROUTES: " + routes.length);
    debug("STOP_TIMES: " + stopTimes.length);

    if(stops.length === 0){
        alert("❌ NINCS stops.txt!");
        return;
    }

    let valid = stops
        .map(s=>({

            id: s.stop_id || s.id,
            name: s.stop_name || s.name,

            lat: parseFloat(s.stop_lat || s.lat),
            lon: parseFloat(s.stop_lon || s.lon)

        }))
        .filter(s=>!isNaN(s.lat) && !isNaN(s.lon));

    debug("VALID STOPS: " + valid.length);

    render(valid);
}

// ---------------- DEBUG ----------------
function debug(t){
    document.getElementById("debug").innerText += t + "\n";
}

</script>
