<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ATTILA KÖZLEKEDÉS CONTROL V1.2</title>

<style>

body{
    margin:0;
    background:#101820;
    color:white;
    font-family:Arial, sans-serif;
}

.header{
    background:#0b2638;
    padding:15px;
    text-align:center;
}

.title{
    font-size:24px;
    font-weight:bold;
}

.clock{
    margin-top:10px;
    font-size:42px;
    font-weight:bold;
    color:#00ff55;
    text-shadow:0 0 15px #00ff55;
}

.date{
    color:#9cffb0;
    font-size:18px;
}


.panel{
    margin:15px;
    padding:15px;
    background:#162c3a;
    border-radius:12px;
}


input{
    width:95%;
    padding:14px;
    font-size:18px;
    border-radius:10px;
    border:none;
}


button{
    margin-top:10px;
    padding:12px 20px;
    font-size:16px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    background:#00aa55;
    color:white;
}


.result{
    margin-top:12px;
    padding:12px;
    border-radius:10px;
    background:#213d4d;
}


.bkk{
    border-left:8px solid #00aa55;
}

.volan{
    border-left:8px solid #ffaa00;
}

.mav{
    border-left:8px solid #0088ff;
}


.small{
    color:#b7d7e8;
    font-size:14px;
}


</style>

</head>


<body>


<div class="header">

<div class="title">
🚦 ATTILA KÖZLEKEDÉS CONTROL
</div>

<div>
RealTimeNext Multi-Service Connector V1.2
</div>


<div class="clock" id="clock">
00:00:00
</div>

<div class="date" id="date">
-
</div>


</div>



<div class="panel">

<h2>
🔍 Megálló / Állomás kereső
</h2>


<input id="search"
placeholder="Megálló név vagy GTFS szám...">


<br>

<button onclick="searchStop()">
🔎 Keresés
</button>


</div>




<div class="panel">

<h2>
🔗 Szolgáltató felismerő
</h2>


<div id="results">

Várakozás keresésre...

</div>


</div>




<script>


// =====================
// DIGITÁLIS ÓRA
// =====================


function updateClock(){

let now=new Date();


document.getElementById("clock").innerHTML =
now.toLocaleTimeString("hu-HU");


document.getElementById("date").innerHTML =
now.toLocaleDateString("hu-HU");

}


setInterval(updateClock,1000);
updateClock();




// =====================
// MINTA GTFS ADATBÁZIS
// KÉSŐBB GTFS ZIP-BŐL TÖLTHETŐ
// =====================


const stops=[


{
id:"008939",
name:"BKK példa megálló",
type:"BKK"
},


{
id:"779017",
name:"VOLÁN példa megálló",
type:"VOLAN"
},


{
id:"hkir_779053_2",
name:"Tahitótfalu, hídfő",
type:"VOLAN_UTAS"
},


{
id:"005540253",
name:"MÁV példa állomás",
type:"MAV"
}


];





// =====================
// SZOLGÁLTATÓ FELISMERŐ
// =====================


function detectProvider(id){


id=id.trim();


if(id.startsWith("hkir_")){

return "VOLÁN / UTAS";

}


if(id.startsWith("0055")){

return "MÁV";

}


if(id.length>=6){

return "VOLÁN";

}


return "BKK";


}






// =====================
// KERESÉS
// =====================


function searchStop(){


let q=document
.getElementById("search")
.value
.toLowerCase()
.trim();


let html="";


let found=stops.filter(s=>

s.id.toLowerCase().includes(q)
||
s.name.toLowerCase().includes(q)

);



if(found.length==0){

html=
`
<div class="result">
❌ Nincs találat<br>
<span class="small">
GTFS adatbázis betöltés szükséges
</span>
</div>
`;

}


found.forEach(s=>{


let provider=detectProvider(s.id);



let css="";


if(provider.includes("BKK"))
css="bkk";


if(provider.includes("VOLÁN"))
css="volan";


if(provider.includes("MÁV"))
css="mav";



html+=`

<div class="result ${css}">

<b>${provider}</b><br><br>

📍 ${s.name}<br>

🔢 GTFS:
${s.id}

<br><br>

Állapot:
🟢 Felismerve


</div>


`;



});



document.getElementById("results").innerHTML=html;



}



</script>


</body>
</html>
