<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<title>V11 GTFS REAL TIMETABLE ENGINE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{font-family:Arial;background:#0f172a;color:#e2e8f0;padding:20px}
button{padding:10px;margin:5px;cursor:pointer}
.box{background:#111827;padding:10px;margin-top:10px;border-radius:10px;overflow:auto}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #334155;padding:6px;font-size:12px}
.ok{color:#4ade80}
.bad{color:#f87171}
</style>
</head>
<body>

<h2>🚀 V11 GTFS REAL TIMETABLE ENGINE</h2>

<button onclick="pickGTFS()">📦 GTFS betöltés / újrahasználás</button>
<button onclick="reloadLast()">♻️ Utolsó GTFS újranyitás</button>

<div class="box" id="status">Várakozás...</div>
<div class="box" id="log"></div>

<h3>📦 ZIP tartalom</h3>
<div class="box" id="files"></div>

<h3>🚏 Megállók</h3>
<table id="stopsTable"></table>

<script>
let zipData;
let lastFileHandle = null;

function log(msg){
  document.getElementById('log').innerHTML += msg+"<br>";
}

function setStatus(msg, ok=true){
  document.getElementById('status').innerHTML = ok ? 
  "<span class='ok'>"+msg+"</span>" : 
  "<span class='bad'>"+msg+"</span>";
}

// 💾 IndexedDB simple store
async function saveHandle(handle){
  const db = await indexedDB.open("gtfsDB",1);
  db.onupgradeneeded = ()=> db.result.createObjectStore("files");
  db.onsuccess = ()=>{
    const tx = db.result.transaction("files","readwrite");
    tx.objectStore("files").put(handle,"last");
  };
}

async function loadHandle(){
  return new Promise(res=>{
    const req = indexedDB.open("gtfsDB",1);
    req.onsuccess = ()=>{
      const tx = req.result.transaction("files");
      const store = tx.objectStore("files");
      const getReq = store.get("last");
      getReq.onsuccess = ()=> res(getReq.result);
    };
  });
}

// 📦 File picker (új GTFS)
async function pickGTFS(){

  if(window.showOpenFilePicker){
    const [handle] = await window.showOpenFilePicker({
      types:[{description:"GTFS ZIP",accept:{"application/zip":[".zip"]}}]
    });

    lastFileHandle = handle;
    await saveHandle(handle);

    const file = await handle.getFile();
    await processGTFS(file);
  } else {
    alert("Browser nem támogatja File System API-t");
  }
}

// ♻️ reload last file
async function reloadLast(){
  const handle = await loadHandle();
  if(!handle){alert("Nincs mentett GTFS");return;}

  const file = await handle.getFile();
  await processGTFS(file);
}

// 🧠 GTFS processor
async function processGTFS(file){

  log("📦 betöltés...");

  const buffer = await file.arrayBuffer();
  log("ZIP méret: " + buffer.byteLength);

  if(buffer.byteLength < 50000){
    setStatus("❌ Hibás ZIP",false);
    return;
  }

  const zip = await JSZip.loadAsync(buffer);
  zipData = zip;

  const files = Object.keys(zip.files);
  document.getElementById('files').innerHTML = files.map(f=>"• "+f).join("<br>");

  const stopsFile = files.find(f=>f.toLowerCase().includes("stops.txt"));
  if(!stopsFile){setStatus("❌ nincs stops.txt",false);return;}

  const text = await zip.file(stopsFile).async("string");

  const lines = text.split(/\r?\n/).filter(l=>l.length);
  const headers = lines[0].split(",");

  const idI = headers.indexOf("stop_id");
  const nameI = headers.indexOf("stop_name");
  const latI = headers.indexOf("stop_lat");
  const lonI = headers.indexOf("stop_lon");

  let html = "<tr><th>ID</th><th>Név</th><th>Lat</th><th>Lon</th></tr>";

  for(let i=1;i<Math.min(30,lines.length);i++){
    const p = lines[i].split(",");
    html += `<tr>
      <td>${p[idI]}</td>
      <td>${p[nameI]}</td>
      <td>${p[latI]}</td>
      <td>${p[lonI]}</td>
    </tr>`;
  }

  document.getElementById('stopsTable').innerHTML = html;

  setStatus("✅ GTFS betöltve + mentve (V11 READY)");
}
</script>

</body>
</html>
