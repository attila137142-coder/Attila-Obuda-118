<!DOCTYPE html><html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FUTÁR V5 HYBRID CORE</title><style>body {  margin: 0;  font-family: Arial, sans-serif;  background: #0b0f14;  color: #e6e6e6;}header {  background: #111826;  padding: 12px;  display: flex;  justify-content: space-between;  align-items: center;}.clock {  font-size: 18px;  font-weight: bold;  color: #00ff99;}.container {  display: grid;  grid-template-columns: 1fr 1fr;  gap: 10px;  padding: 10px;}.panel {  background: #141c2a;  padding: 10px;  border-radius: 8px;}input, button, select {  padding: 8px;  margin-top: 5px;  width: 100%;  background: #0b0f14;  color: #fff;  border: 1px solid #2a3a55;}button {  cursor: pointer;}.status {  margin-top: 10px;  padding: 10px;  background: #0d1420;  border-left: 4px solid #00ff99;}.bad {  border-left-color: #ff5555;}.warn {  border-left-color: #ffaa00;}</style></head><body><header>  <div>🚦 FUTÁR V5 HYBRID CORE</div>  <div class="clock" id="clock"></div></header><div class="container">  <div class="panel">    <h3>🔎 Keresés (járat / stop / rendszer)</h3>    <input id="search" placeholder="pl. 243, Kelenföld, MÁV..." />    <h4>🎛️ Elfogadási mód</h4>    <select id="mode">      <option value="bkv">Csak BKV / BKK</option>      <option value="volan">Csak VOLÁN</option>      <option value="mav">Csak MÁV</option>      <option value="hybrid">BKV + VOLÁN (HYBRID)</option>      <option value="full">MIND (BKV + VOLÁN + MÁV)</option>    </select>    <button onclick="runSearch()">ENTER / KERESÉS</button>    <div id="result" class="status">Készen áll...</div>  </div>  <div class="panel">    <h3>📡 LIVE DISPATCH PANEL</h3>    <div id="dispatch">      🚍 Nincs aktív lekérdezés<br>      ⏱ Várakozás...    </div>  </div></div><script>function updateClock() {  const now = new Date();  document.getElementById("clock").innerText =    now.toLocaleTimeString("hu-HU");}setInterval(updateClock, 1000);updateClock();function runSearch() {  const q = document.getElementById("search").value;  const mode = document.getElementById("mode").value;  let msg = "";  let cls = "status";  if (!q) {    msg = "⚠ Adj meg keresési értéket!";    cls += " warn";  } else {    if (mode === "bkv") {      msg = "🚇 BKV/BKK hálózat aktív lekérdezés: " + q;    }    if (mode === "volan") {      msg = "🚌 VOLÁN helyközi rendszer: " + q;    }    if (mode === "mav") {      msg = "🚆 MÁV vasúti rendszer: " + q;    }    if (mode === "hybrid") {      msg = "🔀 HYBRID (BKV + VOLÁN): " + q;    }    if (mode === "full") {      msg = "🌐 FULL NETWORK (BKV + VOLÁN + MÁV): " + q;    }    cls += " good";  }  const res = document.getElementById("result");  res.className = cls;  res.innerText = msg;  document.getElementById("dispatch").innerHTML =    "📡 Feldolgozás alatt...<br>🔍 " + q + "<br>🎛 Mód: " + mode;}</script></body></html>
