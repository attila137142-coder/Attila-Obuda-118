<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🚦 FUTÁR V4.5 DISPATCHER ALPHA</title>

<style>
body{
    margin:0;
    background:#08131a;
    color:#e6edf3;
    font-family:Arial,Helvetica,sans-serif;
}
header{
    background:#121922;
    border-bottom:3px solid #1f6feb;
    padding:12px;
}
h1{
    margin:0;
    font-size:24px;
}
.panel{
    margin:10px;
    background:#161b22;
    border-radius:10px;
    padding:12px;
}
input{
    width:100%;
    padding:12px;
    background:#0f141a;
    border:1px solid #2b3542;
    color:white;
    border-radius:8px;
}
table{
    width:100%;
    border-collapse:collapse;
}
th{
    background:#121922;
    padding:10px;
    text-align:left;
    font-size:13px;
}
td{
    padding:8px;
    border-top:1px solid #25303d;
    font-size:13px;
}
.good{color:#4cd137;}
.bad{color:#ff5b5b;}
.warn{color:#f1c40f;}
.live{
    color:#4cd137;
    font-weight:bold;
}
.schedule{
    color:#58a6ff;
}
</style>
</head>

<body>

<header>
<h1>🚦 FUTÁR V4.5 GTFS MULTI-INDEX ALPHA</h1>
<div>BKK + HÉV + MÁV + VOLÁN</div>
</header>

<div class="panel">
<input type="text"
placeholder="🔎 Megálló keresése (pl: Nád utca, Örs, Szob)">
</div>

<div class="panel">

<h3>🚍 DISPATCHER INDULÁSI TÁBLA</h3>

<table>
<thead>
<tr>
<th>Járat</th>
<th>Irány</th>
<th>Indul</th>
<th>Késés</th>
<th>Rendszám</th>
<th>Forda</th>
<th>Járműtípus</th>
<th>Státusz</th>
</tr>
</thead>

<tbody id="dispatcher">
</tbody>

</table>

</div>

<script>

const rows = [

{
route:"85",
dir:"Örs vezér tere",
time:"14:32",
delay:"+2",
plate:"SGX-552",
forda:"F12",
vehicle:"🚌 Citaro 005",
status:"LIVE"
},

{
route:"85E",
dir:"KÖKI",
time:"14:35",
delay:"+1",
plate:"BPI-234",
forda:"F15",
vehicle:"🚌 MAN Lion's City",
status:"LIVE"
},

{
route:"32",
dir:"Árpád híd",
time:"14:41",
delay:"—",
plate:"—",
forda:"—",
vehicle:"🚌 Solaris Urbino",
status:"MENETREND"
},

{
route:"H5",
dir:"Batthyány tér",
time:"14:48",
delay:"+3",
plate:"—",
forda:"—",
vehicle:"🚆 MXA HÉV",
status:"LIVE"
},

{
route:"S70",
dir:"Nyugati",
time:"15:02",
delay:"—",
plate:"—",
forda:"—",
vehicle:"🚄 FLIRT 415",
status:"MENETREND"
},

{
route:"880",
dir:"Vác",
time:"15:11",
delay:"+1",
plate:"—",
forda:"—",
vehicle:"🚌 Credobus Econell",
status:"LIVE"
}

];

function render(){

const tbody=document.getElementById("dispatcher");
tbody.innerHTML="";

rows.forEach(r=>{

let cls="schedule";

if(r.status==="LIVE")
    cls="live";

tbody.innerHTML += `
<tr>
<td>${r.route}</td>
<td>${r.dir}</td>
<td>${r.time}</td>
<td>${r.delay}</td>
<td>${r.plate}</td>
<td>${r.forda}</td>
<td>${r.vehicle}</td>
<td class="${cls}">${r.status}</td>
</tr>
`;

});

}

render();

</script>

</body>
</html>
