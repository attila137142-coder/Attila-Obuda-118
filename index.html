<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Attila Közlekedés Control Center V10.0 CORE
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
font-family:
Segoe UI,
Arial,
sans-serif;

background:#101820;

color:white;

overflow:hidden;

}


/* FEJLÉC */

.header{

height:70px;

background:#182b3a;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 25px;

border-bottom:
2px solid #00a8ff;

}


.logo{

font-size:24px;

font-weight:bold;

}


.version{

font-size:14px;

color:#8ee8ff;

}



/* FŐ ELRENDEZÉS */

.main{

display:grid;

grid-template-columns:
260px 1fr 300px;

height:
calc(100vh - 70px);

}



/* BAL MENÜ */

.menu{

background:#111;

padding:15px;

border-right:
1px solid #333;

}


.menu h3{

color:#00a8ff;

}


button{

width:100%;

margin:
6px 0;

padding:12px;

background:#203040;

border:none;

color:white;

border-radius:6px;

cursor:pointer;

}


button:hover{

background:#005f8f;

}



/* KÖZÉPSŐ TERÜLET */

.center{

display:flex;

flex-direction:column;

}



/* TÉRKÉP HELY */

.map{

flex:1;

background:#263238;

display:flex;

align-items:center;

justify-content:center;

font-size:30px;

color:#aaa;

}



/* ALSÓ ÁLLAPOT */

.status{

height:160px;

background:#0c1218;

padding:15px;

overflow:auto;

}



/* JOBB PANEL */

.right{

background:#141414;

padding:15px;

border-left:
1px solid #333;

}


.panel{

background:#202020;

padding:12px;

margin-bottom:12px;

border-radius:8px;

}


.ok{

color:#00ff88;

}


.wait{

color:#ffd000;

}



</style>

</head>


<body>


<header class="header">

<div class="logo">
🚦 ATTILA KÖZLEKEDÉS CONTROL CENTER
</div>


<div class="version">

V10.0 CORE STABLE

</div>


</header>



<div class="main">


<!-- BAL MENÜ -->

<div class="menu">

<h3>MODULOK</h3>


<button>
🌍 Térkép
</button>


<button>
🚌 GTFS Adatbázis
</button>


<button>
📡 RealTime Engine
</button>


<button>
🌦 Időjárás
</button>


<button>
📄 PDF Kezelő
</button>


<button>
⚙ Beállítások
</button>


</div>
