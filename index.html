<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>V8 STABLE HYBRID ENGINE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
body { margin:0; font-family:Arial; background:#111; color:#fff;}
#map { height:55vh;}
#panel { padding:10px;}
input,button { padding:10px; margin:5px;}
#results div { padding:6px; border-bottom:1px solid #333; cursor:pointer;}
#results div:hover { background:#333;}
table { width:100%; font-size:12px; border-collapse:collapse;}
td,th { border:1px solid #444; padding:4px;}
</style>
</head>
<body>

<div id="map"></div>

<div id="panel">

<input id="street" placeholder="utca / turista út">
<button onclick="search()">KERESÉS</button>
<button onclick="calcRoute()">ROUTE SLOPE</button>
<button onclick="clearClicks()">CLICK RESET</button>

<div id="results"></div>

<table id="tbl">
<tr><th>#</th><th>m</th><th>Δh</th><th>%</th></tr>
</table>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map = L.map('map').setView([47.4979,19.0402],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

let coords = [];
let routeLine = null;

let clickPts = [];
let clickLine = null;

// =====================
// 🔍 SEARCH
// =====================
async function search(){

  let q = street.value;

  let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q},Hungary&limit=5`);
  let data = await res.json();

  results.innerHTML="";

  data.forEach(p=>{
    let d=document.createElement("div");
    d.innerText=p.display_name;
    d.onclick=()=>loadRoute(p);
    results.appendChild(d);
  });

  await loadRoute(data[0]);
}

// =====================
// 🧭 ROUTE LOAD
// =====================
async function loadRoute(p){

  map.setView([p.lat,p.lon],15);

  let q = `
  [out:json];
  (
    way["highway"~"primary|secondary|tertiary|residential|service"](around:1500,${p.lat},${p.lon});
    way["highway"~"path|footway|track"](around:1500,${p.lat},${p.lon});
  );
  out geom;
  `;

  let res = await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:q});
  let data = await res.json();

  coords = [];

  data.elements.forEach(el=>{
    if(el.geometry){
      el.geometry.forEach(p=>{
        coords.push([p.lat,p.lon]);
      });
    }
  });

  if(routeLine) map.removeLayer(routeLine);

  routeLine = L.polyline(coords,{color:"cyan",weight:4}).addTo(map);

  await calcRoute();
}

// =====================
// ⛰️ ROUTE SLOPE
// =====================
async function calcRoute(){

  if(coords.length<2) return;

  let elev = await getElev(coords);

  tbl.innerHTML="<tr><th>#</th><th>m</th><th>Δh</th><th>%</th></tr>";

  for(let i=0;i<coords.length-1;i++){

    let p1=coords[i];
    let p2=coords[i+1];

    let d = map.distance(p1,p2);
    let dh = elev[i+1]-elev[i];
    let slope = (dh/d)*100;

    let c="green";
    if(slope>5) c="orange";
    if(slope>10) c="red";

    L.polyline([p1,p2],{color:c,weight:4}).addTo(map);

    let r = tbl.insertRow();
    r.innerHTML=`<td>${i}</td><td>${d.toFixed(1)}</td><td>${dh.toFixed(1)}</td><td>${slope.toFixed(2)}</td>`;
  }
}

// =====================
// 🖱 CLICK MODE
// =====================
map.on("click",async e=>{

  let p=[e.latlng.lat,e.latlng.lng];
  clickPts.push(p);

  L.marker(p).addTo(map);

  if(clickPts.length==2){
    let elev = await getElev(clickPts);

    let d = map.distance(clickPts[0],clickPts[1]);
    let dh = elev[1]-elev[0];
    let slope = (dh/d)*100;

    if(clickLine) map.removeLayer(clickLine);

    clickLine = L.polyline(clickPts,{
      color: slope>10?"red":slope>5?"orange":"green",
      weight:6
    }).addTo(map);

    alert(`Slope: ${slope.toFixed(2)} %`);

    clickPts=[];
  }
});

// =====================
// ⛰️ ELEVATION
// =====================
async function getElev(points){

  let res = await fetch("https://api.open-elevation.com/api/v1/lookup",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      locations: points.map(p=>({latitude:p[0],longitude:p[1]}))
    })
  });

  let data = await res.json();
  return data.results.map(r=>r.elevation);
}

// =====================
function clearClicks(){
  clickPts=[];
  alert("reset");
}
</script>

</body>
</html>
