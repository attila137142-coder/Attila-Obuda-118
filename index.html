<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Attila Desktop Weather Clock V2.2 STABLE CLEAN
</title>


<style>


*{
box-sizing:border-box;
}



html,
body{

margin:0;

padding:0;

width:100%;

min-height:100vh;

background:#050505;

color:white;

font-family:
"Segoe UI",
Arial,
sans-serif;

overflow-x:hidden;

}



/* ===============================
   FŐ KIJELZŐ
================================ */


.clockBox{


position:fixed;


top:15px;


right:15px;



width:390px;


max-width:95vw;



background:

linear-gradient(

145deg,

#111111,

#020202

);



border:

3px solid #00ff55;



border-radius:18px;



padding:18px;



box-shadow:

0 0 30px

rgba(0,255,80,0.45);



}



/* CÍM */


.title{


text-align:center;


color:#00ff55;


font-size:18px;


font-weight:bold;


letter-spacing:2px;


line-height:1.4;


}



/* ÓRA */


.clock{


margin-top:10px;


text-align:center;


color:#00ff55;


font-size:58px;


font-weight:900;


letter-spacing:3px;



text-shadow:

0 0 15px #00ff55;


}



/* NAP */


.weekday{


text-align:center;


color:#ffe066;


font-size:22px;


font-weight:bold;


margin-top:5px;


}



/* DÁTUM */


.date{


text-align:center;


color:#ff9900;


font-size:28px;


font-weight:900;


margin-top:5px;



text-shadow:

0 0 10px

rgba(255,150,0,.8);


}



.line{


height:2px;


background:#333;


margin:

15px 0;


}




/* PANELEK */


.panel{


background:

rgba(255,255,255,0.07);



border:

1px solid #333;



border-radius:12px;



padding:12px;



margin-bottom:12px;



}



.panelTitle{


color:#00ffff;


font-size:18px;


font-weight:bold;


margin-bottom:8px;


}



.data{


font-size:18px;


line-height:1.6;


color:white;


}



.temperature{


text-align:center;


font-size:42px;


font-weight:bold;


color:#66ff66;



text-shadow:

0 0 10px

rgba(100,255,100,.6);


}



.gps{


color:#00ff88;


}



/* ===============================
   MOBIL NÉZET
================================ */


@media(max-width:600px){


.clockBox{


position:relative;


top:10px;


right:auto;


margin:auto;



width:95vw;



}



.clock{


font-size:48px;


}



.date{


font-size:24px;


}


}


</style>


</head>



<body>


<div class="clockBox">



<div class="title">

🚦 ATTILA DESKTOP WEATHER CLOCK V2.2 STABLE

</div>



<div id="clock" class="clock">

00:00:00

</div>



<div id="weekday" class="weekday">

HÉTFŐ

</div>



<div id="date" class="date">

2026. JÚLIUS 27.

</div>


<div class="line"></div>
