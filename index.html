<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Attila Közlekedés - MÁV VOLÁN Live Panel V1
</title>


<style>

body{
    margin:0;
    background:#101820;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}


.header{
    background:#07110b;
    padding:15px;
    font-size:24px;
    font-weight:bold;
    text-align:center;
}


.panel{

    padding:20px;
    display:flex;
    flex-wrap:wrap;
    gap:15px;

}


.box{

    background:#16232e;
    border-radius:12px;
    padding:15px;
    width:300px;

    box-shadow:0 0 10px #000;

}


h2{

    margin-top:0;

}


button{

    width:100%;
    margin:6px 0;
    padding:12px;

    border:none;
    border-radius:8px;

    color:white;
    font-size:16px;

    cursor:pointer;

}


.mav{

background:#0057b8;

}


.gysev{

background:#008000;

}


.volan{

background:#c98b00;

}


.control{

background:#333;

}


/* lebegő ablak */


#viewer{

display:none;

position:fixed;

top:50px;
left:50px;

width:900px;
height:600px;

background:white;

border:4px solid #00ff88;

border-radius:12px;

z-index:9999;

box-shadow:0 0 30px black;

overflow:hidden;

}



#viewerHeader{

background:#07110b;

height:45px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 10px;

}


#viewer iframe{

width:100%;
height:calc(100% - 45px);

border:0;

}



.big{

width:1450px!important;

height:950px!important;

}



@media(max-width:800px){

#viewer{

top:0;
left:0;

width:100%;
height:100%;

border-radius:0;

}

.big{

width:100%!important;
height:100%!important;

}

}



</style>

</head>



<body>


<div class="header">

🚦 Attila Közlekedés  
<br>
🚆 MÁV - GYSEV - 🚌 VOLÁN Élő Információ

</div>



<div class="panel">



<div class="box">

<h2>🚆 MÁV VONATINFO</h2>


<button class="mav"
onclick="openPage('https://kozlekedesiklub.hu/vonatinfo/')">

🚆 Közlekedési Klub Vonatinfo

</button>



<button class="mav"
onclick="openPage('https://mavplusz.hu/#/')">

🚄 MÁV+

</button>



<button class="mav"
onclick="openPage('https://holavonat.is/')">

📍 Hol a vonat?

</button>



<button class="mav"
onclick="openPage('https://megisholavonat.info/hu')">

🔎 Mégis hol a vonat?

</button>



<button class="mav"
onclick="openPage('https://vonatterkep.hu/')">

🗺 Vonattérkép

</button>



<button class="mav"
onclick="openPage('https://ittavonat.eu/')">

🚉 Itt a vonat

</button>



<button class="mav"
onclick="openPage('https://traintrack.hu/')">

📡 TrainTrack

</button>


<button class="mav"
onclick="openPage('https://kodbazis.hu/holavonat?fbclid')">

💻 Kódbázis Holavonat

</button>


<button class="mav"
onclick="openPage('https://vonatterkep.info/')">

🗺 Vonattérkép INFO

</button>


</div>





<div class="box">

<h2>🟢 GYSEV</h2>


<button class="gysev"
onclick="openPage('https://www.gysev.hu/app/allomasi_ut.html?p_all_kod=5538-55&p_m=1')">

🚉 GYSEV Állomási út

</button>


</div>






<div class="box">

<h2>🚌 VOLÁN</h2>


<button class="volan"
onclick="openPage('https://utas.hu/?map=9/47.82045/18.91772')">

🚌 UTAS.hu Busz térkép

</button>


</div>





<div class="box">

<h2>🛠 Ablak vezérlés</h2>


<button class="control"
onclick="bigWindow()">

🔍 Nagyítás +60%

</button>


<button class="control"
onclick="closeWindow()">

❌ Bezárás

</button>


</div>



</div>





<div id="viewer">


<div id="viewerHeader">


<span>
🚆 Élő közlekedési ablak
</span>


<button onclick="closeWindow()">

❌

</button>


</div>


<iframe id="frame"></iframe>


</div>





<script>



function openPage(url){


let v=document.getElementById("viewer");

let f=document.getElementById("frame");


f.src=url;


v.style.display="block";


}



function closeWindow(){


let v=document.getElementById("viewer");

let f=document.getElementById("frame");


v.style.display="none";

f.src="";


}



function bigWindow(){


let v=document.getElementById("viewer");


v.classList.toggle("big");


}



</script>



</body>
</html>
