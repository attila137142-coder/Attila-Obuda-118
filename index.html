<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V5 – OSM TURISTA FIX</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; background:#0b0f14; color:white; }
header { padding:10px; background:#111827; font-weight:bold; }
#map { height:90vh; }

.panel {
    position:absolute;
    top:60px;
    left:10px;
    z-index:999;
    background:#111827;
    padding:10px;
    width:300px;
    border-radius:8px;
}

button { width:100%; padding:8px; margin-top:5px; cursor:pointer; }

#status { font-size:12px; margin-top:8px; color:#93c5fd; }
</style>
</head>

<body>

<header>🧭 FUTÁR V5 – OSM TURISTA FIX (WORKING VERSION)</header>

<div class="panel">
<button onclick="load()">🚶‍♂️ Turistaút betöltése</button>
<div id="status">Idle</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([47.52, 19.03], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:"OSM"
}).addTo(map);

function color(len){
    if(len < 10) return "green";
    if(len < 30) return "yellow";
    if(len < 60) return "orange";
    return "red";
}

async function load(){

    document.getElementById("status").innerText = "Loading...";

    const query = `
    [out:json];
    (
      way["highway"~"path|footway|track"](47.45,18.85,47.60,19.20);
    );
    out geom;
    `;

    const url = "https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query);

    const res = await fetch(url);
    const data = await res.json();

    document.getElementById("status").innerText =
        "Elements: " + data.elements.length;

    console.log(data);

    let count = 0;

    data.elements.forEach(el => {

        if(!el.geometry) return;

        const line = el.geometry.map(p => [p.lat, p.lon]);

        L.polyline(line,{
            color: "green",
            weight: 3
        }).addTo(map);

        count++;
    });

    document.getElementById("status").innerText =
        "Rendered: " + count + " paths ✔️";
}

</script>

</body>
</html>
