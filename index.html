<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Budai Trail Engine v2</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; font-family: Arial; }
#map { height:100vh; width:100%; }

.panel{
  position:absolute;
  top:10px;
  left:10px;
  z-index:9999;
  background:white;
  padding:10px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.3);
  max-width:300px;
  font-size:13px;
}

.seg{
  background:#f5f5f5;
  padding:5px;
  margin-top:5px;
  border-radius:5px;
  border-left:4px solid green;
}
</style>
</head>

<body>

<div class="panel">
<b>🌲 Budai Trail Engine v2</b><br><br>
📏 szakasz + ⛰️ meredekség + 🧭 logika<br><br>
<div id="info">Kattints egy szakaszra</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// =====================
// MAP
// =====================

const map = L.map('map').setView([47.52, 18.97], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

// =====================
// SEGMENT ANALYTICS
// =====================

function distance(latlngs){
  let d = 0;
  for(let i=1;i<latlngs.length;i++){
    d += map.distance(latlngs[i-1], latlngs[i]);
  }
  return d;
}

// 🔥 egyszerűsített „hegy modell”
function fakeElevation(latlng){
  return Math.sin(latlng[0]*10) * 50 + 200;
}

function slope(latlngs){
  let h1 = fakeElevation(latlngs[0]);
  let h2 = fakeElevation(latlngs[latlngs.length-1]);
  let d = distance(latlngs);

  return ((h2 - h1) / d * 100).toFixed(2);
}

// =====================
// GEOJSON BETÖLTÉS
// =====================

fetch("budai.geojson")
.then(r => r.json())
.then(data => {

  const layer = L.geoJSON(data, {

    style:{
      color:"green",
      weight:4
    },

    onEachFeature:function(feature, layer){

      let coords = feature.geometry.coordinates[0]
        .map(c => [c[1], c[0]]);

      let d = (distance(coords)/1000).toFixed(2);
      let s = slope(coords);

      layer.bindPopup(
        "🌲 Turistaút<br><br>" +
        "📏 Távolság: " + d + " km<br>" +
        "⛰️ Meredekség: " + s + "%"
      );

      layer.on("click", function(){

        document.getElementById("info").innerHTML =
        "<div class='seg'>" +
        "📏 " + d + " km<br>" +
        "⛰️ " + s + "%<br>" +
        "🧭 szakasz elemzés kész" +
        "</div>";

      });

    }

  }).addTo(map);

  map.fitBounds(layer.getBounds());

});

</script>

</body>
</html>
