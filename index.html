<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <title>V5 – REAL GTFS + POI + ROUTING ENGINE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin:0; font-family: Arial; overflow:hidden; }

    #map { height:100vh; width:100%; position:absolute; z-index:0; }

    .panel {
      position:absolute;
      top:10px;
      left:10px;
      z-index:9999;
      width:360px;
      background:white;
      padding:12px;
      border-radius:12px;
      box-shadow:0 2px 14px rgba(0,0,0,0.25);
    }

    input, button {
      width:100%;
      padding:8px;
      margin:5px 0;
      font-size:14px;
    }

    .box { font-size:12px; padding:6px; border-bottom:1px solid #eee; cursor:pointer; }

    .sectionTitle { font-size:12px; font-weight:bold; margin-top:8px; }
  </style>
</head>
<body>

<div class="panel">
  <h3>🟢 V5 GTFS + POI + ROUTING</h3>

  <div id="gps">📍 GPS...</div>
  <div id="speed">🚀 Sebesség...</div>

  <input id="query" placeholder="POI / megálló / útvonal cél" oninput="autoSuggest()" />
  <div id="suggest"></div>

  <button onclick="searchPOI()">🔎 POI keresés</button>
  <button onclick="nearbyPOI()">📍 Környék POI</button>
  <button onclick="gtfsStops()">🚌 GTFS megállók (DEMO)</button>
  <button onclick="routePlan()">🟣 Útvonal tervezés</button>

  <div class="sectionTitle">Eredmények</div>
  <div id="out"></div>
</div>

<div id="map"></div>

<script>

let map = L.map('map').setView([47.4979,19.0402],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© OSM'
}).addTo(map);

let userMarker;
let lastPos;

// GPS
navigator.geolocation.watchPosition(p=>{
  const lat=p.coords.latitude;
  const lon=p.coords.longitude;
  const sp=p.coords.speed||0;

  document.getElementById("gps").innerHTML=`📍 ${lat.toFixed(6)}, ${lon.toFixed(6)}`;
  document.getElementById("speed").innerHTML=`🚀 ${(sp*3.6).toFixed(2)} km/h`;

  if(!userMarker){
    userMarker=L.marker([lat,lon]).addTo(map).bindPopup("TE");
  } else userMarker.setLatLng([lat,lon]);

  lastPos={lat,lon};
});

// DIST
function dist(a,b){
  const R=6371000;
  const t=x=>x*Math.PI/180;
  const dLat=t(b.lat-a.lat);
  const dLon=t(b.lon-a.lon);
  const x=Math.sin(dLat/2)**2+
    Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// POI SEARCH
async function searchPOI(){
  const q=document.getElementById("query").value;
  const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=10`);
  const d=await r.json();
  render(d);
}

// NEARBY POI
async function nearbyPOI(){
  if(!lastPos) return;

  const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=15&viewbox=${lastPos.lon-0.02},${lastPos.lat+0.02},${lastPos.lon+0.02},${lastPos.lat-0.02}&bounded=1`);
  const d=await r.json();
  render(d);
}

// GTFS DEMO (BKK MOCK)
function gtfsStops(){
  const stops=[
    {name:"Deák Ferenc tér",lat:47.4972,lon:19.0540},
    {name:"Kálvin tér",lat:47.4891,lon:19.0614},
    {name:"Széll Kálmán tér",lat:47.5079,lon:19.0242}
  ];

  render(stops);
}

// ROUTING (OSRM DEMO)
async function routePlan(){
  if(!lastPos) return;

  const target=prompt("Cél koordináta (lat,lon)");
  if(!target) return;

  const [lat,lon]=target.split(",").map(Number);

  const url=`https://router.project-osrm.org/route/v1/walking/${lastPos.lon},${lastPos.lat};${lon},${lat}?overview=false`;

  const r=await fetch(url);
  const d=await r.json();

  const dist=d.routes[0].distance;
  const dur=d.routes[0].duration;

  document.getElementById("out").innerHTML=`
    🟣 Útvonal kész<br>
    📏 ${dist.toFixed(0)} m<br>
    ⏱ ${Math.round(dur/60)} perc (gyalog)
  `;
}

// RENDER
function render(list){
  let html="";

  list.forEach(p=>{
    const lat=+p.lat;
    const lon=+p.lon;

    const d=lastPos?dist(lastPos,{lat,lon}):0;

    html+=`<div class='box'>📍 ${p.name||p.display_name}<br>📏 ${d.toFixed(0)} m</div>`;

    L.circleMarker([lat,lon]).addTo(map);
  });

  document.getElementById("out").innerHTML=html;
}

// AUTOSUGGEST
async function autoSuggest(){
  const q=document.getElementById("query").value;
  if(q.length<2) return;

  const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=5`);
  const d=await r.json();

  document.getElementById("suggest").innerHTML=
    d.map(x=>`<div class='box' onclick="pick('${x.display_name}')">📍 ${x.display_name}</div>`).join("");
}

function pick(v){
  document.getElementById("query").value=v;
  document.getElementById("suggest").innerHTML="";
  searchPOI();
}

</script>

</body>
</html>
