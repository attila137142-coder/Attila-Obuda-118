<!-- ==============================
     ATTILA KÖZLEKEDÉS CONTROL
     LED CLOCK PANEL V1.4
================================ -->

<div class="time-panel">

    <div id="dateDisplay" class="date-led">
        2026. JÚLIUS 13. HÉTFŐ
    </div>

    <div id="clockDisplay" class="clock-led">
        22:45:08
    </div>

</div>


<style>

.time-panel{

    width:100%;
    max-width:520px;

    margin:20px auto;

    padding:18px 25px;

    background:
    linear-gradient(
        145deg,
        #07110b,
        #020402
    );

    border:3px solid #1aff66;

    border-radius:18px;

    box-shadow:

    0 0 15px rgba(0,255,80,0.35),
    inset 0 0 20px rgba(0,255,80,0.15);

    text-align:center;

}


/* DÁTUM */

.date-led{

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    font-size:34px;

    font-weight:900;

    letter-spacing:3px;

    color:#ff9900;


    text-shadow:

    0 0 8px rgba(255,153,0,0.8),
    0 0 18px rgba(255,153,0,0.45);

    margin-bottom:12px;

}


/* ÓRA */

.clock-led{

    font-family:
    "Courier New",
    monospace;


    font-size:82px;

    font-weight:900;

    letter-spacing:6px;


    color:#00ff66;


    text-shadow:

    0 0 8px #00ff66,
    0 0 18px rgba(0,255,100,0.8),
    0 0 35px rgba(0,255,100,0.45);


    animation:
    greenPulse 1s infinite;

}


/* FINOM LED LÉLEGZÉS */

@keyframes greenPulse{

    0%{

        opacity:1;

    }


    50%{

        opacity:0.88;

    }


    100%{

        opacity:1;

    }

}



</style>



<script>

function updateClock(){

    let now=new Date();


    let napok=[
    "VASÁRNAP",
    "HÉTFŐ",
    "KEDD",
    "SZERDA",
    "CSÜTÖRTÖK",
    "PÉNTEK",
    "SZOMBAT"
    ];


    let ev=now.getFullYear();

    let honap=String(
        now.getMonth()+1
    ).padStart(2,"0");


    let nap=String(
        now.getDate()
    ).padStart(2,"0");


    document.getElementById(
        "dateDisplay"
    ).innerHTML=
    ev+
    ". "+
    honap+
    ". "+
    nap+
    " "+
    napok[now.getDay()];



    let ora=
    String(now.getHours())
    .padStart(2,"0");


    let perc=
    String(now.getMinutes())
    .padStart(2,"0");


    let mp=
    String(now.getSeconds())
    .padStart(2,"0");



    document.getElementById(
        "clockDisplay"
    ).innerHTML=

    ora+
    ":"+
    perc+
    ":"+
    mp;

}



setInterval(
    updateClock,
    1000
);


updateClock();


</script>
