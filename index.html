<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V5 LIVE DISPATCH</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
 margin:0;
 font-family:Arial;
 background:#0b1220;
 color:#e2e8f0;
}

#map{height:45vh;}

.container{padding:12px;}

input{
 width:100%;
 padding:12px;
 border:none;
 border-radius:8px;
 font-size:16px;
}

button{
 margin-top:10px;
 padding:10px;
 background:#22c55e;
 border:none;
 border-radius:8px;
 font-weight:bold;
 cursor:pointer;
}

.card{
 background:#1e293b;
 padding:10px;
 margin-top:10px;
 border-radius:10px;
}

.row{
 padding:4px 0;
 border-bottom:1px solid #334155;
}

.badge{
 padding:4px 8px;
 border-radius:6px;
 font-size:12px;
 background:#38bdf8;
 color:black;
}

.vehicle{
 font-weight:bold;
 color:#22c55e;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="container">

<h2>🚍 FUTÁR V5 LIVE DISPATCH</h2>

<input id="input" placeholder="keresés (BKK / VOLÁN / MÁV / stop)">
<button onclick="run()">LIVE INDÍTÁS</button>

<div id="out"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ---------------- MAP ----------------
const map=L.map('map').setView([47.4979,19.0402],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 attribution:'OSM'
}).addTo(map);

let marker;

// ---------------- USER GPS ----------------
let userLat=47.4979;
let userLon=19.0402;

navigator.geolocation?.getCurrentPosition(p=>{
 userLat=p.coords.latitude;
 userLon=p.coords.longitude;
});

// ---------------- STOP DATA ----------------
const STOPS=[
 {name:"Nád utca", type:"BKK", lat:47.594072, lon:19.048469},
 {name:"Flórián tér", type:"BKK", lat:47.542896, lon:19.042252},
 {name:"Batthyány tér", type:"BKK", lat:47.506002, lon:19.039456},

 {name:"Szentendre", type:"VOLÁN", lat:47.660403, lon:19.075408},
 {name:"Vác", type:"VOLÁN", lat:47.781930, lon:19.129643},

 {name:"Szob", type:"MÁV", lat:47.821319, lon:18.862602},

 {name:"Dobogókő", type:"TOUR", lat:47.719118, lon:18.897577}
];

// ---------------- DIST ----------------
function dist(a,b,c,d){
 const R=6371;
 const dLat=(c-a)*Math.PI/180;
 const dLon=(d-b)*Math.PI/180;

 const x=
 Math.sin(dLat/2)**2+
 Math.cos(a*Math.PI/180)*
 Math.cos(c*Math.PI/180)*
 Math.sin(dLon/2)**2;

 return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ---------------- VEHICLE SIMULATION ----------------
function simulateVehicles(){

 return STOPS.map((s,i)=>{

  let offset = (Date.now()/10000 + i*10) % 1;

  return {
   name:s.name,
   type:s.type,
   lat:s.lat + offset*0.01,
   lon:s.lon + offset*0.01,
   speed:30 + Math.random()*40
  };

 });

}

// ---------------- MATRIX ----------------
function matrix(data){

 return data.map(v=>{

  let d=dist(userLat,userLon,v.lat,v.lon).toFixed(2);

  return `
  <div class="row">
  🚍 <span class="vehicle">${v.type}</span>
  | ${v.name}
  | ${d} km
  | ${v.speed.toFixed(0)} km/h
  </div>
  `;

 }).join("");

}

// ---------------- MAIN ----------------
function run(){

 let input=document.getElementById("input").value.toUpperCase();

 let vehicles=simulateVehicles();

 if(input){
  vehicles=vehicles.filter(v=>
   v.name.toUpperCase().includes(input) ||
   v.type.toUpperCase().includes(input)
  );
 }

 let center=vehicles[0];

 if(marker) map.removeLayer(marker);

 marker=L.marker([center.lat,center.lon])
 .addTo(map)
 .bindPopup(center.name)
 .openPopup();

 map.setView([center.lat,center.lon],11);

 let html=`

 <div class="card">
 <h3>🚍 LIVE MATRIX</h3>
 ${matrix(vehicles)}
 </div>

 <div class="card">
 📍 CENTER: ${center.name}<br>
 TYPE: ${center.type}<br>
 SPEED MODE: LIVE SIMULATION
 </div>

 <div class="card">
 🧠 ENGINE STATUS:<br>
 LIVE DISPATCH V5 ACTIVE<br>
 SMART RADAR + MOVING VEHICLES
 </div>

 `;

 document.getElementById("out").innerHTML=html;
}

// auto refresh
setInterval(()=>run(),5000);

</script>

</body>
</html>
