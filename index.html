/* =========================================================
   TÁVOLSÁG
   ========================================================= */

function haversine(
 a,
 b,
 c,
 d
){

 const R=6371;

 const rad=
  x=>x*Math.PI/180;

 const dLat=
  rad(c-a);

 const dLon=
  rad(d-b);

 const x=
  Math.sin(dLat/2)**2+
  Math.cos(rad(a))*
  Math.cos(rad(c))*
  Math.sin(dLon/2)**2;

 return R*
  2*
  Math.atan2(
   Math.sqrt(x),
   Math.sqrt(1-x)
  );

}

/* =========================================================
   GTFS MEGÁLLÓ
   ========================================================= */

function findNearestStop(
 lat,
 lon
){

 if(
  !gtfsStops.length ||
  !Number.isFinite(lat) ||
  !Number.isFinite(lon)
 )
  return null;


 let best=null;

 let bestDistance=Infinity;


 for(
  const s of gtfsStops
 ){

  const d=
   haversine(
    lat,
    lon,
    s.lat,
    s.lon
   );


  if(d<bestDistance){

   bestDistance=d;

   best={
    ...s,
    distanceKm:d
   };

  }

 }


 return best;

}


/* =========================================================
   CSV
   ========================================================= */

function parseCsv(text){

 const rows=[];

 let row=[];

 let cell="";

 let quote=false;


 for(
  let i=0;
  i<text.length;
  i++
 ){

  const ch=text[i];


  if(ch==='"'){

   if(
    quote &&
    text[i+1]==='"'
   ){

    cell+='"';

    i++;

   }else{

    quote=!quote;

   }

  }

  else if(
   ch==="," &&
   !quote
  ){

   row.push(cell);

   cell="";

  }

  else if(
   (
    ch==="\n" ||
    ch==="\r"
   ) &&
   !quote
  ){

   if(
    ch==="\r" &&
    text[i+1]==="\n"
   )
    i++;


   row.push(cell);

   cell="";


   if(
    row.some(
     x=>x!==""
    )
   )
    rows.push(row);


   row=[];

  }

  else{

   cell+=ch;

  }

 }


 row.push(cell);


 if(
  row.some(
   x=>x!==""
  )
 )
  rows.push(row);


 if(!rows.length)
  return [];


 const header=
  rows[0].map(
   x=>x.trim()
  );


 return rows
  .slice(1)
  .map(r=>
   Object.fromEntries(
    header.map(
     (h,i)=>
      [h,r[i]??""]
    )
   )
  );

}


/* =========================================================
   GTFS
   ========================================================= */

async function fetchGtfsZip(url){

 const r=
  await fetch(
   url,
   {
    cache:"no-store"
   }
  );


 if(!r.ok)
  throw new Error(
   "HTTP "+r.status
  );


 const buffer=
  await r.arrayBuffer();


 if(
  buffer.byteLength<1000
 )
  throw new Error(
   "GTFS túl kicsi: "+
   buffer.byteLength+
   " byte"
  );


 return JSZip.loadAsync(
  buffer
 );

}


async function loadBkkGtfs(){

 const urls=[
  GTFS_URL,
  GTFS_FALLBACK_URL
 ];


 let lastError=null;


 for(
  const url of urls
 ){

  try{

   logLine(
    "GTFS betöltés: "+
    url
   );


   const zip=
    await fetchGtfsZip(
     url
    );


   const stopsFile=
    zip.file(
     "stops.txt"
    );

   const routesFile=
    zip.file(
     "routes.txt"
    );


   if(
    !stopsFile ||
    !routesFile
   )
    throw new Error(
     "stops.txt/routes.txt hiányzik"
    );


   const [
    stopsText,
    routesText
   ]=
    await Promise.all([
     stopsFile.async("text"),
     routesFile.async("text")
    ]);


   const stops=
    parseCsv(stopsText);

   const routes=
    parseCsv(routesText);


   if(
    !stops.length ||
    !routes.length
   )
    throw new Error(
     "Üres GTFS: "+
     stops.length+
     " megálló, "+
     routes.length+
     " vonal"
    );


   gtfsStops=[];

   gtfsStopsById.clear();

   gtfsRoutes.clear();


   for(
    const s of stops
   ){

    const lat=
     Number(s.stop_lat);

    const lon=
     Number(s.stop_lon);


    if(
     !s.stop_id ||
     !Number.isFinite(lat) ||
     !Number.isFinite(lon)
    )
     continue;


    const stop={
     id:s.stop_id,
     name:s.stop_name||"",
     lat,
     lon
    };


    gtfsStops.push(stop);

    gtfsStopsById.set(
     stop.id,
     stop
    );

   }


   for(
    const r of routes
   ){

    if(!r.route_id)
     continue;


    gtfsRoutes.set(
     String(r.route_id),
     {
      id:String(r.route_id),
      shortName:
       r.route_short_name||"",
      longName:
       r.route_long_name||""
     }
    );

   }


   /*
    * FIX:
    * 0/0 GTFS nem lehet sikeres betöltés.
    */

   if(
    !gtfsStops.length ||
    !gtfsRoutes.size
   )
    throw new Error(
     "Érvénytelen GTFS: "+
     gtfsStops.length+
     " megálló, "+
     gtfsRoutes.size+
     " vonal"
    );


   gtfsLoaded=true;


   $("gtfsBadge").textContent=
    "GTFS: "+
    gtfsStops.length+
    " megálló / "+
    gtfsRoutes.size+
    " vonal";


   $("gtfsBadge")
    .className=
     "badge ok";


   logLine(
    "BKK GTFS betöltve: "+
    gtfsStops.length+
    " megálló, "+
    gtfsRoutes.size+
    " vonal."
   );


   return true;

  }

  catch(e){

   lastError=e;

   logLine(
    "GTFS hiba: "+
    e.message
   );

  }

 }


 gtfsLoaded=false;


 $("gtfsBadge").textContent=
  "GTFS: NINCS ADAT";


 $("gtfsBadge")
  .className=
   "badge err";


 logLine(
  "GTFS nem tölthető be: "+
  (
   lastError?.message||
   "ismeretlen hiba"
  )
 );


 return false;

}


/* =========================================================
   PROTOBUF

async function loadProto(){

 if(protoRoot)
  return protoRoot;


 const r=
  await fetch(
   PROTO_URL,
   {
    cache:"no-store"
   }
  );


 if(!r.ok)
  throw new Error(
   "proto HTTP "+
   r.status
  );


 protoRoot=
  await protobuf
   .parse(
    await r.text()
   )
   .root;


 return protoRoot;

}


function apiUrl(url){

 const key=getKey();


 if(!key)
  throw new Error(
   "Nincs BKK API-kulcs."
  );


 return (
  url+
  (
   url.includes("?")
    ? "&"
    : "?"
  )+
  "key="+
  encodeURIComponent(key)
 );

}


async function fetchBinary(url){

 const response=
  await fetch(
   apiUrl(url),
   {
    cache:"no-store"
   }
  );


 const buffer=
  await response.arrayBuffer();


 if(!response.ok)
  throw new Error(
   "HTTP "+
   response.status
  );


 if(!buffer.byteLength)
  throw new Error(
   "0 byte válasz"
  );


 return buffer;

}


function messageType(){

 return protoRoot.lookupType(
  "transit_realtime.FeedMessage"
 );

}


function decodeFeed(buffer){

 const type=
  messageType();


 const message=
  type.decode(
   new Uint8Array(buffer)
  );


 return type.toObject(
  message,
  {
   longs:Number,
   enums:String,
   defaults:false
  }
 );

}


function feedEntities(feed){

 return Array.isArray(feed.entity)
  ? feed.entity
  : [];

}


/* =========================================================

function extractVehicleEntity(e){

 const vp=e.vehicle||{};

 const position=
  vp.position||{};

 const trip=
  vp.trip||{};

 const vehicle=
  vp.vehicle||{};


 const routeId=

   trip.routeId??""
  );


 const route=
  gtfsRoutes.get(
   routeId
  );


 const lat=
  num(position.latitude);

 const lon=
  num(position.longitude);


 return {

  source:"BKK GTFS-RT",

  provider:"BKK",

  vehicleId:
   String(
    vehicle.id??
    e.id??
    ""
   ),

  label:
   vehicle.label??
   null,

  licensePlate:
   vehicle.licensePlate??
   null,

  /*
   * NEM TALÁLUNK KI FORGALMI SZÁMOT.
   */
  forgalmi:null,

  /*
   * BKK-nál itt nincs FORDA.
   */
  forda:null,

  /*
   * NEM TALÁLUNK KI TÍPUST.
   */
  vehicleType:null,

  blockId:null,

  blockVehicleNumber:null,

  lowFloor:null,

  routeId,

  routeShortName:
   route?.shortName||
   String(
    trip.routeId??""
   ),

  tripId:
   String(
    trip.tripId??""
   ),

  directionId:
   trip.directionId??
   null,

  stopId:
   vp.stopId??
   null,

  stopSequence:
   num(
    vp.currentStopSequence
   ),

  lat,

  lon,

  speedKmh:
   Number.isFinite(

   )
    ? Number(position.speed)*3.6
    : null,

  bearing:
   num(position.bearing),

  /*
   * A késést nem a VehiclePositionből
   * kitaláljuk.
   */
  delaySeconds:null,

  futarMatched:false,

  nearestStop:null,

  gpsDistanceKm:null,

  marker:null

 };

}


function parseVehicleFeed(
 buffer
){

 const feed=
  decodeFeed(buffer);


 const out=[];


 for(
  const entity of
  feedEntities(feed)
 ){

  if(!entity.vehicle)
   continue;


  const v=
   extractVehicleEntity(
    entity
   );


  if(
   v.vehicleId ||
   Number.isFinite(v.lat)
  )
   out.push(v);

 }


 return out;

}


/* =========================================================
   VALÓDI MEZŐ KERESÉSE
   ========================================================= */

function explicitField(
 obj,
 names
){

 if(
  !obj ||
  typeof obj!=="object"
 )
  return null;


 for(
  const name of names
 ){

  if(
   obj[name]!==undefined &&
   obj[name]!==null &&
   obj[name]!==""
  )
   return obj[name];

 }


 if(
  obj.vehicle &&
  obj.vehicle!==obj
 )
  return explicitField(
   obj.vehicle,
   names
  );


 return null;

}


function explicitDeepField(
 obj,
 names,
 depth=0
){

 if(
  !obj ||
  typeof obj!=="object" ||
  depth>6
 )
  return null;


 const direct=
  explicitField(
   obj,
   names
  );


 if(direct!==null)
  return direct;


 for(
  const key of
  Object.keys(obj)
 ){

  if(
   key==="references"
  )
   continue;


  const child=
   obj[key];


  if(
   child &&
   typeof child==="object"
  ){

   const found=
    explicitDeepField(
     child,
     names,
     depth+1
    );


   if(found!==null)
    return found;

  }

 }


 return null;

}


/* =========================================================
   FUTÁR NORMALIZÁLÁS
   ========================================================= */

function normalizeFutarVehicle(
 obj
){

 const location=
  obj.location??
  obj.position??
  obj.vehicle?.location??
  obj.vehicle?.position??
  {};


 const lat=
  num(
   location.lat??
   location.latitude
  );


 const lon=
  num(
   location.lon??
   location.longitude
  );


 const rawSpeed=
  explicitDeepField(
   obj,
   ["speed"]
  );


 const speed=
  Number(rawSpeed);


 let speedKmh=null;


 if(
  Number.isFinite(speed)
 )
  speedKmh=
   speed*3.6;

 else if(
  Number.isFinite(
   num(location.speed)
  )
 )
  speedKmh=
   num(location.speed)*3.6;


 return {

  vehicleId:
   String(
    explicitDeepField(
     obj,
     ["vehicleId","id"]
    )??""
   ),

  label:
   explicitDeepField(
    obj,
    ["label"]
   ),

  licensePlate:

    ]
   ),

  /*

   */
  forda:null,

  vehicleType:
   explicitDeepField(

    [
     "vehicleType",
     "vehicle_type",
     "vehicleTypeName",
     "vehicle_type_name",
     "vehicleModel",
     "vehicle_model",
     "vehicleModelName",
     "vehicle_model_name",
     "modelName",

     "model"
    ]
   ),

  blockId:

    )??
    obj.trip?.routeId??

/* =========================================================
   FUTÁR REKORDOK FELKUTATÁSA
   ========================================================= */

function collectObjects(
 node,
 out=[],
 depth=0
){

 if(
  !node ||
  typeof node!=="object" ||
  depth>7
 )
  return out;


 if(Array.isArray(node)){

  for(
   const item of node
  )
   collectObjects(
    item,
    out,
    depth+1
   );

  return out;

 }


 out.push(node);


 for(
  const key of
  Object.keys(node)
 ){

  if(
   key==="references"
  )
   continue;


  const value=
   node[key];


  if(
   value &&
   typeof value==="object"
  )
   collectObjects(
    value,
    out,
    depth+1
   );

 }


 return out;

}


function extractFutarVehicles(
 json
){

 const objects=
  collectObjects(
   json,
   []
  );


 const seen=new Set();

 const out=[];


 for(
  const object of objects
 ){

  const v=
   normalizeFutarVehicle(
    object
   );


  if(
   !v.vehicleId &&
   !Number.isFinite(v.lat)
  )
   continue;


  const key=
   v.vehicleId+
   "|"+
   v.lat+
   "|"+
   v.lon+
   "|"+
   v.tripId;


  if(
   seen.has(key)
  )
   continue;


  seen.add(key);

  out.push(v);

 }


 return out;

}


/* =========================================================
   FUTÁR ↔ BKK MATCH
   ========================================================= */

function sameId(a,b){

 return String(a||"")
  .replace(
   /^BKK_/i,
   ""
  ) ===
  String(b||"")
  .replace(
   /^BKK_/i,
   ""
  );

}


function matchFutar(
 vehicle,
 futar
){

 return (

  futar.find(
   x=>
    x.vehicleId &&
    vehicle.vehicleId &&
    sameId(
     x.vehicleId,
     vehicle.vehicleId
    )
  )

  ||

  futar.find(
   x=>
    x.tripId &&
    vehicle.tripId &&
    sameId(
     x.tripId,
     vehicle.tripId
    )
  )

  ||

  futar.find(
   x=>
    x.licensePlate &&
    vehicle.licensePlate &&
    String(
     x.licensePlate
    )===
    String(
     vehicle.licensePlate
    )
  )

  ||

  null

 );

}


/* =========================================================
   FUTÁR BETÖLTÉS
   ========================================================= */

async function loadFutarVehicles(
 fallback=false
){

 try{

  const lat=
   myPos?.lat??
   47.4979;

  const lon=
   myPos?.lon??
   19.0402;


  const url=
   FUTAR_URL+
   "?version=3"+
   "&appVersion="+
   encodeURIComponent(
    "AttilaKozlekedes-FIX6"
   )+
   "&lat="+
   encodeURIComponent(lat)+
   "&lon="+
   encodeURIComponent(lon)+
   "&latSpan=0.30"+
   "&lonSpan=0.50"+
   "&includeReferences=true";


  const response=
   await fetch(
    apiUrl(url),
    {
     cache:"no-store"
    }
   );


  const json=
   await response.json();


  if(!response.ok)
   throw new Error(
    "HTTP "+
    response.status
   );


  const futar=
   extractFutarVehicles(
    json
   )
   .filter(
    x=>
     x.vehicleId ||
     (
      Number.isFinite(x.lat) &&
      Number.isFinite(x.lon)
     )
   );


  futarVehicleCache.clear();


  for(
   const v of futar
  ){

   futarVehicleCache.set(
    v.vehicleId||
    Math.random(),
    v
   );

  }


  let matched=0;


  for(
   const vehicle of
   vehicleData
  ){

   const f=
    matchFutar(
     vehicle,
     futar
    );


   if(!f)
    continue;


   matched++;


   vehicle.futarMatched=true;


   const fields=[
    "label",
    "licensePlate",
    "forgalmi",
    "vehicleType",
    "blockId",
    "blockVehicleNumber",
    "lowFloor"
   ];


   for(
    const field of fields
   ){

    if(
     f[field]!==null &&
     f[field]!==undefined &&
     f[field]!==""
    )
     vehicle[field]=f[field];

   }


   if(
    !vehicle.routeId &&
    f.routeId
   )
    vehicle.routeId=
     f.routeId;


   if(
    !vehicle.tripId &&
    f.tripId
   )
    vehicle.tripId=
     f.tripId;


   if(
    Number.isFinite(f.lat) &&
    Number.isFinite(f.lon)
   ){

    vehicle.lat=f.lat;

    vehicle.lon=f.lon;

   }


   if(
    f.speedKmh!==null
   )
    vehicle.speedKmh=
     f.speedKmh;


   if(
    f.bearing!==null
   )
    vehicle.bearing=
     f.bearing;


   if(f.stopId)
    vehicle.stopId=
     f.stopId;


   if(
    f.stopSequence!==null
   )
    vehicle.stopSequence=
     f.stopSequence;

  }


  /*
   * Csak akkor legyen FUTÁR fallback,
   * ha a BKK VehiclePositions tényleg
   * nem jött meg.
   */

  if(
   fallback &&
   !lastVehicleFetchOK
  ){

   for(
    const f of futar
   ){

    const vehicle={

     ...f,

     source:"BKK FUTÁR",

     provider:"BKK",

     routeShortName:
      gtfsRoutes.get(
       f.routeId
      )?.shortName||
      f.routeId,

     delaySeconds:null,

     futarMatched:true,

     nearestStop:null,

     gpsDistanceKm:null,

     marker:null

    };


    vehicleData.push(
     vehicle
    );

   }

  }


  $("futarHttp")
   .textContent=
    "200";


  $("futarCount")
   .textContent=
    futar.length;


  $("futarMatched")
   .textContent=
    matched;


  $("futarTime")
   .textContent=
    nowText();


  setBadge(
   "futarBadge",
   "FUTÁR: OK",
   true
  );


  lastFutarFetchOK=true;


  refreshStaticVehicleFields();

  updateVehicleDistances();

  renderVehicles();

  refreshMarkers();


  logLine(
   "FUTÁR: "+
   futar.length+
   " valódi rekord feldolgozva."
  );


  return true;

 }

 catch(e){

  $("futarHttp")
   .textContent=
    (
     String(e.message)
      .match(/HTTP \d+/)
     ||
     ["HIBA"]
    )[0];


  setBadge(
   "futarBadge",
   "FUTÁR: HIBA",
   false
  );


  lastFutarFetchOK=false;


  logLine(
   "FUTÁR hiba: "+
   e.message
  );


  return false;

 }

}


/* =========================================================
   TRIPUPDATE – VALÓDI KÉSÉS / SIETÉS
   ========================================================= */

function applyDelayToVehicle(
 vehicle
){

 const keys=[
  vehicle.tripId,
  vehicle.vehicleId
 ]
 .filter(Boolean)
 .map(String);


 for(
  const key of keys
 ){

  if(
   vehicleDelayMap.has(key)
  )
   return vehicleDelayMap.get(key);

 }


 if(
  vehicle.tripId &&
  tripDelayMap.has(
   vehicle.tripId
  )
 )
  return tripDelayMap.get(
   vehicle.tripId
  );


 return null;

}


function parseTripUpdates(
 buffer
){

 const feed=
  decodeFeed(buffer);


 tripDelayMap.clear();

 tripDelaySeqMap.clear();

 tripDelayTripMap.clear();

 vehicleDelayMap.clear();


 for(
  const entity of
  feedEntities(feed)
 ){

  const update=
   entity.tripUpdate;


  if(!update)
   continue;


  const tripId=
   String(
    update.trip?.tripId??
    ""
   );


  const vehicleId=
   String(
    update.vehicle?.id??
    ""
   );


  let best=null;


  for(
   const stop of
   (
    update.stopTimeUpdate||
    []
   )
  ){

   const delay=
    stop.arrival?.delay??
    stop.departure?.delay;


   if(
    delay===undefined ||
    delay===null
   )
    continue;


   const seconds=
    Number(delay);


   if(
    !Number.isFinite(seconds)
   )
    continue;


   best=seconds;


   if(tripId)
    tripDelayMap.set(
     tripId,
     seconds
    );


   if(
    tripId &&
    stop.stopSequence!==undefined
   )
    tripDelaySeqMap.set(
     tripId+
     "|"+
     stop.stopSequence,
     seconds
    );


   if(
    tripId &&
    stop.stopId
   )
    tripDelayTripMap.set(
     tripId+
     "|"+
     stop.stopId,
     seconds
    );

  }


  if(
   vehicleId &&
   best!==null
  )
   vehicleDelayMap.set(
    vehicleId,
    best
   );


  if(
   tripId &&
   best!==null
  )
   vehicleDelayMap.set(
    tripId,
    best
   );

 }


 return feedEntities(
  feed
 ).length;

}


async function fetchTripUpdates(){

 try{

  const buffer=
   await fetchBinary(
    TRIP_UPDATES_URL
   );


  const count=
   parseTripUpdates(
    buffer
   );


  for(
   const vehicle of
   vehicleData
  ){

   vehicle.delaySeconds=
    applyDelayToVehicle(
     vehicle
    );

  }


  lastTripFetchOK=true;


  logLine(
   "TripUpdates: "+
   count+
   " valódi rekord."
  );


  return true;

 }

 catch(e){

  lastTripFetchOK=false;


  /*
   * FONTOS:
   * Hiba esetén nem írunk be 0 késést.
   */
  for(
   const vehicle of
   vehicleData
  )
   vehicle.delaySeconds=null;


  logLine(
   "TripUpdates hiba: "+
   e.message
  );


  return false;

 }

}


/* =========================================================
   STATIKUS ADATOK FRISSÍTÉSE
   ========================================================= */

function refreshStaticVehicleFields(){

 for(
  const vehicle of
  vehicleData
 ){

  const stop=
   vehicle.stopId
    ? gtfsStopsById.get(
       String(vehicle.stopId)
      )
    : null;


  vehicle.nearestStop=
   stop
    ? {
       ...stop,
       distanceKm:0
      }
    : null;


  if(
   !vehicle.nearestStop &&
   Number.isFinite(vehicle.lat) &&
   Number.isFinite(vehicle.lon)
  )
   vehicle.nearestStop=
    findNearestStop(
     vehicle.lat,
     vehicle.lon
    );


  if(
   !vehicle.routeShortName &&
   vehicle.routeId
  )
   vehicle.routeShortName=
    gtfsRoutes.get(
     String(vehicle.routeId)
    )?.shortName||
    "";

 }

}


function updateVehicleDistances(){

 for(
  const vehicle of
  vehicleData
 ){

  if(
   myPos &&
   Number.isFinite(vehicle.lat) &&
   Number.isFinite(vehicle.lon)
  ){

   vehicle.gpsDistanceKm=
    haversine(
     myPos.lat,
     myPos.lon,
     vehicle.lat,
     vehicle.lon
    );

  }else{

   vehicle.gpsDistanceKm=null;

  }


  if(
   Number.isFinite(vehicle.lat) &&
   Number.isFinite(vehicle.lon)
  ){

   const stop=
    findNearestStop(
     vehicle.lat,
     vehicle.lon
    );


   if(stop)
    vehicle.nearestStop=
     stop;

  }

 }


 if(myPos){

  const stop=
   findNearestStop(
    myPos.lat,
    myPos.lon
   );


  $("gpsStop").textContent=
   stop
    ? stop.name+
      " | "+
      stop.id
    : "NINCS ADAT";

 }

}


/* =========================================================
   KÉSÉS KIÍRÁSA
   ========================================================= */

function delayText(
 seconds
){

 if(
  seconds===null ||
  seconds===undefined ||
  !Number.isFinite(
   Number(seconds)
  )
 )
  return '<span class="delay">NINCS ADAT</span>';


 seconds=
  Math.round(
   Number(seconds)
  );


 if(seconds===0)
  return '<span class="delay zero">🟢 0:00</span>';


 const sign=
  seconds<0
   ? "−"
   : "+";


 const absolute=
  Math.abs(seconds);


 const minutes=
  Math.floor(
   absolute/60
  );


 const sec=
  String(
   absolute%60
  )
  .padStart(
   2,
   "0"
  );


 return (
  '<span class="delay '+
  (
   seconds<0
    ? "early"
    : "late"
  )+
  '">'+
  (
   seconds<0
    ? "🔴 SIETÉS "
    : "🔵 KÉSÉS "
  )+
  sign+
  minutes+
  ":"+
  sec+
  "</span>"
 );

}

 return (

  " | GTFS: "+
  esc(stop.id)+
  " | "+
  distance

/* =========================================================
   SZŰRÉS
   ========================================================= */

function applyFilters(
 ignoreRadius=false
){

 const universal=
  $("universalSearch")
   .value
   .trim()
   .toLowerCase();


 const route=
  $("routeSearch")
   .value
   .trim()
   .toLowerCase();


 const plate=
  $("plateSearch")
   .value
   .trim()
   .toLowerCase();


 return vehicleData.filter(
  vehicle=>{

   const text=[
    vehicle.routeId,
    vehicle.routeShortName,
    vehicle.label,
    vehicle.forda,
    vehicle.licensePlate,
    vehicle.forgalmi,
    vehicle.vehicleType,
    vehicle.vehicleId,
    vehicle.tripId,
    vehicle.stopId,
    vehicle.nearestStop?.name,
    vehicle.source,
    vehicle.provider
   ]
   .join(" ")
   .toLowerCase();


   if(
    universal &&
    !text.includes(
     universal
    )
   )
    return false;


   if(
    route &&
    !String(
     vehicle.routeShortName||
     vehicle.routeId||
     ""
    )
    .toLowerCase()
    .includes(route)
   )
    return false;


   if(
    plate &&
    !String(
     vehicle.licensePlate||
     ""
    )
    .toLowerCase()
    .includes(plate) &&
    !String(
     vehicle.forgalmi||
     ""
    )
    .toLowerCase()
    .includes(plate)
   )
    return false;


   if(
    !ignoreRadius &&
    radiusMode!==Infinity
   ){

    if(
     !Number.isFinite(
      vehicle.gpsDistanceKm
     )
    )
     return false;


    if(
     vehicle.gpsDistanceKm>
     radiusMode
    )
     return false;

   }


   return true;

  }
 );

}

       </div>

      </div>


      <div class="line">

        JÁRAT:
       </span>

       ${routeDisplay(
        vehicle

      </div>


      <div class="line">

       <span class="key">
        RENDSZÁM:
       </span>

       ${val(
        vehicle.licensePlate
       )}

       ·

       <span class="key">
        FORGALMI:
       </span>

       )}

      </div>


      <div class="line">

       <span class="key">
        MEGÁLLÓ:

       ${stopDisplay(

        vehicle.speedKmh!==null &&
        vehicle.speedKmh!==undefined

         : "NINCS ADAT"
       }

       ·

      </div>

     </div>

   `
   )
   .join("")
   ||
   '<div class="small">NINCS ADAT</div>';


 document
  .querySelectorAll(
   ".vehicle"
  )
  .forEach(
   element=>{

    element.onclick=
     ()=>{

      const vehicle=
       vehicleData[

         element.dataset.index

       ];


      if(!vehicle)
       return;


      if(
       Number.isFinite(
        vehicle.lat
       ) &&
       Number.isFinite(
        vehicle.lon
       )
      ){

       map.setView(
        [
         vehicle.lat,
         vehicle.lon
        ],
        16
       );


       if(vehicle.marker)
        vehicle.marker
         .openPopup();

      }

     };

   }
  );

}


/* =========================================================
   RADIUS
   ========================================================= */

function setRadius(
 value
){

 radiusMode=
  value==="all"
   ? Infinity
   : Number(value);


 document
  .querySelectorAll(
   ".radius button"
  )
  .forEach(
   button=>{
    button.classList.toggle(
     "active",
     button.dataset.radius===
      String(value)
    );
   }
  );


 renderVehicles();

 refreshMarkers();

}

/* =========================================================
   BKK FEED TESZT
   ========================================================= */

async function testFeed(){

 const key=
  getKey();


 if(!key){

  logLine(
   "Nincs BKK API-kulcs. A valódi BKK feedhez szükséges."
  );

  setBadge(
   "feedBadge",
   "BKK: NINCS KULCS",
   false
  );

  return;

 }


 try{

  await loadProto();


  logLine(
   "BKK VehiclePositions lekérés..."
  );


  const buffer=
   await fetchBinary(
    VEHICLE_URL
   );


  const vehicles=
   parseVehicleFeed(
    buffer
   );


  /*
   * FONTOS:
   * 0 jármű nem sikeres adat.
   */

  if(!vehicles.length)
   throw new Error(
    "A feed dekódolható, de 0 járművet tartalmaz."
   );


  vehicleData=
   vehicles;


  lastVehicleFetchOK=true;


  $("feedHttp")
   .textContent=
    "200";


  $("feedBytes")
   .textContent=
    buffer.byteLength
     .toLocaleString(
      "hu-HU"
     );


  $("feedCount")
   .textContent=
    vehicles.length;


  $("feedTime")
   .textContent=
    nowText();


  setBadge(
   "feedBadge",
   "BKK: OK",
   true
  );


  logLine(
   "BKK VehiclePositions: "+
   vehicles.length+
   " valódi jármű."
  );

 }

 catch(e){

  lastVehicleFetchOK=false;


  $("feedHttp")
   .textContent=
    (
     String(e.message)
      .match(/HTTP \d+/)
     ||
     ["HIBA"]
    )[0];


  setBadge(
   "feedBadge",
   "BKK: HIBA",
   false
  );


  logLine(
   "VehiclePositions hiba: "+
   e.message
  );


  if(
   String(
    e.message
   ).includes(
    "HTTP 401"
   )
  ){

   logLine(
    "401: a BKK GTFS-RT végpont nem fogadta el az API-kulcsot."
   );

   logLine(
    "Kitalált járműadat NEM kerül a listába."
   );

  }

 }


 /*
  * FUTÁR valódi fallback.
  */

 await loadFutarVehicles(
  !lastVehicleFetchOK
 );


 /*
  * TripUpdates csak akkor,
  * ha volt valódi BKK feed.
  */

 if(lastVehicleFetchOK)
  await fetchTripUpdates();


 refreshStaticVehicleFields();

 updateVehicleDistances();

 renderVehicles();

 refreshMarkers();

}


/* =========================================================
   GPS
   ========================================================= */

function startGPS(){

 if(
  !navigator.geolocation
 ){

  logLine(
   "A böngésző nem ad geolocation API-t."
  );

  return;

 }


 if(
  gpsWatchId!==null
 )
  return;


 gpsWatchId=
  navigator.geolocation
   .watchPosition(

    position=>{

     myPos={

      lat:
       position.coords.latitude,

      lon:
       position.coords.longitude,

      accuracy:
       position.coords.accuracy

     };


     $("gpsLat")
      .textContent=
       myPos.lat.toFixed(6);


     $("gpsLon")
      .textContent=
       myPos.lon.toFixed(6);


     $("gpsAcc")
      .textContent=
       Math.round(
        myPos.accuracy
       )+
       " m";


     setBadge(
      "gpsBadge",
      "GPS: OK",
      true
     );


     if(!myMarker){

      myMarker=
       L.circleMarker(
        [
         myPos.lat,
         myPos.lon
        ],
        {
         radius:7
        }
       );

     }


     myMarker
      .setLatLng(
       [
        myPos.lat,
        myPos.lon
       ]
      )
      .addTo(map);


     updateVehicleDistances();

     renderVehicles();

     refreshMarkers();

    },

    error=>{

     setBadge(
      "gpsBadge",
      "GPS: NINCS ADAT",
      false
     );


     logLine(
      "GPS hiba: "+
      error.message
     );

    },

    {
     enableHighAccuracy:true,
     maximumAge:5000,
     timeout:15000
    }

   );

}

 );


 testFeed();


 autoTimer=
  setInterval(
   testFeed,
   10000
  );

}
