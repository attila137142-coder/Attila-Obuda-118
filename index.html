<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V10 OFFLINE DISPATCHER</title>

<link rel="manifest" href="data:application/manifest+json,{
  \"name\":\"FUTÁR V10\",
  \"short_name\":\"FUTARV10\",
  \"start_url\":\".\",
  \"display\":\"standalone\",
  \"background_color\":\"#0b1017\",
  \"theme_color\":\"#00ffaa\"
}"/>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1017;
    color:#e6f2ff;
}

header{
    height:60px;
    background:#111826;
    border-bottom:2px solid #00ffaa;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}

.logo{
    color:#00ffaa;
    font-weight:bold;
}

.main{
    display:grid;
    grid-template-columns:360px 1fr;
    height:calc(100vh - 60px);
}

.panel{
    background:#131d2b;
    padding:10px;
    overflow:auto;
}

.card{
    background:#111826;
    border:1px solid #1f2a3a;
    padding:10px;
    margin-bottom:10px;
    border-radius:8px;
}

button{
    width:100%;
    margin-top:6px;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#1f6feb;
    color:white;
}

button:hover{background:#2d7fff;}

input{
    width:100%;
    padding:10px;
    margin-top:6px;
    border-radius:8px;
    border:none;
    background:#0f1722;
    color:white;
}

#map{height:100%; width:100%;}
.small{font-size:12px; opacity:0.85;}
</style>
</head>

<body>

<header>
<div class="logo">🚦 FUTÁR V10 OFFLINE DISPATCHER</div>
<div id="gpsinfo">GPS: OFF</div>
</header>

<div class="main">

<!-- PANEL -->
<div class="panel">

<div class="card">
<b>🧭 TÚRA QUICK</b>
<button onclick="go([47.9270,18.9610],'Királyrét')">Királyrét</button>
<button onclick="go([47.9370,18.8720],'Nagybörzsöny')">Nagybörzsöny</button>
<button onclick="go([47.9167,18.9000],'Csóványos')">Csóványos</button>
</div>

<div class="card">
<b>🚏 MEGÁLLÓ KERESŐ</b>
<input id="q" placeholder="BKK / VOLÁN / MÁV / kisvasút">
<button onclick="search()">Keresés</button>
<div id="results" class="small"></div>
</div>

<div class="card">
<b>🚨 VÉSZ MÓD</b>
<button onclick="sos()">SOS KOORDINÁTA</button>
<div id="sos" class="small"></div>
</div>

<div class="card">
<b>📍 TRACK</b>
<div id="dist">0 m</div>
<button onclick="toggleTrack()">TRACK ON/OFF</button>
</div>

</div>

<!-- MAP -->
<div id="map"></div>

</div>

<script>

/* =========================
   🗺️ MAP INIT
========================= */

let map = L.map('map').setView([47.5,19.0],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19
}).addTo(map);

let gpsMarker;
let tracking=false;
let track=[];
let polyline;
let total=0;

/* =========================
   📡 GPS LIVE
========================= */

navigator.geolocation.watchPosition(pos=>{

    let lat=pos.coords.latitude;
    let lon=pos.coords.longitude;

    document.getElementById("gpsinfo").innerText=
    `GPS: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;

    if(!gpsMarker){
        gpsMarker=L.marker([lat,lon]).addTo(map);
    }else{
        gpsMarker.setLatLng([lat,lon]);
    }

    if(tracking){
        if(track.length>0){
            total+=map.distance(track[track.length-1],[lat,lon]);
        }
        track.push([lat,lon]);

        if(polyline) map.removeLayer(polyline);
        polyline=L.polyline(track,{color:'cyan'}).addTo(map);

        document.getElementById("dist").innerText=
        total.toFixed(0)+" m";
    }

},()=>{},{
    enableHighAccuracy:true
});

/* =========================
   🧭 TÚRA UGRÁS
========================= */

function go(coord,name){
    map.setView(coord,14);
    L.marker(coord).addTo(map).bindPopup(name).openPopup();
}

/* =========================
   🚏 MEGÁLLÓ DB (demo + bővíthető GTFS)
========================= */

const stops=[
 {n:"Batthyány tér (BKK)",c:[47.506,19.039]},
 {n:"Vác (MÁV)",c:[47.777,19.136]},
 {n:"Szob (VOLÁN)",c:[47.821,18.866]},
 {n:"Királyrét kisvasút",c:[47.927,18.961]}
];

function search(){

 let q=document.getElementById("q").value.toLowerCase();
 let res=stops.filter(s=>s.n.toLowerCase().includes(q));

 document.getElementById("results").innerHTML=
 res.map(r=>`<div onclick="go(${r.c},'${r.n}')">🚏 ${r.n}</div>`).join("");

}

/* =========================
   🚨 SOS
========================= */

function sos(){

 if(!gpsMarker) return;

 let p=gpsMarker.getLatLng();

 let msg=
`🚨 FUTÁR V10 SOS
Lat:${p.lat}
Lon:${p.lng}
https://maps.google.com/?q=${p.lat},${p.lng}`;

 navigator.clipboard.writeText(msg);

 document.getElementById("sos").innerText=msg;

 alert("SOS kimásolva!");
}

/* =========================
   🧭 TRACK
========================= */

function toggleTrack(){
 tracking=!tracking;
}

</script>

</body>
</html>
