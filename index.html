<script>


function openURL(url){

window.open(url,'_blank');

}



function ora(){

let d=new Date();

document.getElementById("clock").innerHTML=
d.toLocaleTimeString("hu-HU");


document.getElementById("date").innerHTML=
d.toLocaleDateString("hu-HU");

}

setInterval(ora,1000);
ora();





let helyek=[


{
nev:"Békásmegyer HÉV",
tipus:"BKK H5",
kod:"09183208"
},


{
nev:"Szentendre HÉV",
tipus:"BKK",
kod:"09183208"
},


{
nev:"Hűvösvölgy",
tipus:"GYV",
kod:"005546847"
},


{
nev:"Hárs-hegy",
tipus:"GYV",
kod:"005546854"
},


{
nev:"Szépjuhászné",
tipus:"GYV",
kod:"005546862"
},


{
nev:"Szob",
tipus:"MÁV",
kod:"005510504"
}


];





function betolt(){

let l=document.getElementById("lista");

helyek.forEach(x=>{

l.innerHTML+=`

<div class="item">

<b>${x.nev}</b><br>

<span class="small">
${x.tipus} | ${x.kod}
</span>

</div>

`;

});


}


function keres(){

let s=document.getElementById("search").value.toLowerCase();

let t=document.getElementById("talalat");

t.innerHTML="";


helyek
.filter(x=>x.nev.toLowerCase().includes(s))
.forEach(x=>{

t.innerHTML+=`

<div class="item">
${x.nev}<br>
${x.tipus}<br>
${x.kod}
</div>

`;

});


}



betolt();


</script>
