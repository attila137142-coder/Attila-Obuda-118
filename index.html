<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FUTÁR V5 SAFE RECOVERY BUILD</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{margin:0;font-family:Arial;background:#0b0f14;color:#e6f1ff;}
header{padding:10px;background:#111826;display:flex;justify-content:space-between;}
.container{display:grid;grid-template-columns:360px 1fr;height:calc(100vh - 50px);}
.sidebar{padding:10px;overflow:auto;background:#0f1622;}
.main{display:flex;flex-direction:column;}
#map{height:60%;}
.board{height:40%;overflow:auto;padding:10px;}
button,input{width:100%;padding:10px;margin:5px 0;}
button{background:#1f6feb;color:white;border:none;}
.row{display:grid;grid-template-columns:80px 1fr 80px 100px 80px;padding:6px;border-bottom:1px solid #222;font-size:12px;}
.ok{color:#2ecc71}.warn{color:#ffcc00}.bad{color:#ff4d4d}
.card{background:#1a2433;padding:10px;margin-top:10px;font-size:12px;}
</style>
</head>

<body>

<header>
<div>🚇 FUTÁR V5 SAFE RECOVERY</div>
<div id="clock"></div>
</header>

<div class="container">

<div class="sidebar">
<input type="file" id="file"/>
<button onclick="load()">GTFS LOAD</button>

<div class="card" id="brain"></div>
<div class="card" id="ops"></div>
</div>

<div class="main">
<div id="map"></div>
<div class="board" id="board"></div>
</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>

setInterval(()=>document.getElementById("clock").innerText=new Date().toLocaleTimeString(),1000);

const map=L.map("map").setView([47.4979,19.0402],12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

let STATE={gtfs:null,vehicles:[],stops:[]};
let markers={};

function brain(){
return {mode:"SAFE",msg:"Recovery mode active"};
}

function render(){
document.getElementById("brain").innerHTML="BRAIN: "+brain().mode;

document.getElementById("ops").innerHTML=
"VEHICLES: "+STATE.vehicles.length;

let b=document.getElementById("board");
b.innerHTML="";

STATE.vehicles.forEach(v=>{
b.innerHTML+=`
<div class="row">
<div>${v.id}</div>
<div>LIVE</div>
<div>${Math.round(v.speed)}</div>
<div class="ok">OK</div>
<div>ETA</div>
</div>`;
});
}

function move(){
STATE.vehicles.forEach(v=>{
v.lat+=(Math.random()-0.5)*0.002;
v.lng+=(Math.random()-0.5)*0.002;

if(!markers[v.id]){
markers[v.id]=L.marker([v.lat,v.lng]).addTo(map);
}else markers[v.id].setLatLng([v.lat,v.lng]);
});
}

async function load(){
const f=document.getElementById("file").files[0];
if(!f)return alert("no file");

const zip=await JSZip.loadAsync(f);
const read=async n=>Papa.parse(await zip.file(n).async("string"),{header:true}).data;

const trips=await read("trips.txt");

STATE.vehicles=trips.slice(0,10).map(t=>({
id:t.trip_id,
lat:47.5+Math.random()*0.1,
lng:19+Math.random()*0.1,
speed:20+Math.random()*40
}));

render();
}

setInterval(()=>{
if(STATE.vehicles.length){
move();
render();
}
},1500);

</script>

</body>
</html>
