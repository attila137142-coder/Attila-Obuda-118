<script>


console.log(
"GPS CORE kész"
);

// ==================================================
// ATTILA HYBRID WEATHER ENGINE V1.0 STABLE FIX
// MODUL 02
// REVERSE GEOCODING ENGINE
// GPS -> CÍM
// ==================================================


console.log(
"GEOCODING ENGINE indul..."
);



// utolsó lekért pont

let lastGeoLat = null;

let lastGeoLon = null;



let geoTimer = null;



// ------------------------------
// CÍM LEKÉRÉS
// OPENSTREETMAP NOMINATIM
// ------------------------------


async function getAddress(

lat,

lon

){



// túl gyakori lekérés ellen védelem


if(

lastGeoLat !== null

&&

Math.abs(lastGeoLat-lat)<0.00005

&&

Math.abs(lastGeoLon-lon)<0.00005

){

return;

}



lastGeoLat = lat;

lastGeoLon = lon;




try{



let url =


"https://nominatim.openstreetmap.org/reverse?format=json&lat="

+

lat

+

"&lon="

+

lon

+

"&zoom=18&addressdetails=1&accept-language=hu";





let response =

await fetch(url);




let data =

await response.json();




if(!data.address){

return;

}



let address =

data.address;





// ------------------------------
// CÍM MEZŐK
// ------------------------------



let country =

address.country

||

"--";




let postcode =

address.postcode

||

"--";




let city =


address.city

||

address.town

||

address.village

||

address.municipality

||

"--";




let street =


address.road

||

address.pedestrian

||

address.cycleway

||

"--";




let house =


address.house_number

||

"--";







// ------------------------------
// KIÍRÁS
// ------------------------------


document.getElementById(
"country"
).innerHTML =

country;



document.getElementById(
"zip"
).innerHTML =

postcode;



document.getElementById(
"city"
).innerHTML =

city;



document.getElementById(
"street"
).innerHTML =

street;



document.getElementById(
"houseNumber"
).innerHTML =

house;




console.log(

"Cím:",

country,

postcode,

city,

street,

house

);



}

catch(error){



console.log(

"Reverse geocoding hiba:",

error

);



}



}






// ------------------------------
// GPS KAPCSOLÁS
// ------------------------------
// A processGPS már létezik
// ezért kibővítjük


let oldProcessGPS =

processGPS;



processGPS =

function(position){



oldProcessGPS(position);




clearTimeout(
geoTimer
);



geoTimer =

setTimeout(

()=>{


getAddress(

position.coords.latitude,

position.coords.longitude

);


},

1500

);



};







// ------------------------------
// RENDSZER INDÍTÁS
// ------------------------------


console.log(

"GEOCODING ENGINE kész"

);
