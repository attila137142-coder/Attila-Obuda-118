<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FUTÁR V6 Leaflet Core</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b0f14;
  color:#fff;
}

#map {
  height: 70vh;
  width: 100%;
}

#panel {
  height: 30vh;
  overflow:auto;
  padding:10px;
  background:#111826;
  border-top:2px solid #1f2a3a;
}

.input {
  width: 100%;
  padding:10px;
  border:none;
  outline:none;
  background:#1a2433;
  color:white;
  margin-bottom:8px;
}

.card {
  background:#1a2433;
  padding:8px;
  margin-bottom:6px;
  border-radius:6px;
  font-size:13px;
}

.badge {
  background:#00c853;
  padding:2px 6px;
  border-radius:4px;
  font-size:11px;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="panel">
  <input class="input" id="search" placeholder="🔎 Megálló / járat keresés..."/>
  <div id="info">Betöltés...</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// 🌍 MAP INIT
const map = L.map('map').setView([47.4979, 19.0402], 13);

// 🗺️ Tile layer (lightweight)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

// 📍 DEMO GTFS STOPOK (később JSON/GTFS-ből jön)
const stops = [
  {name:"Deák Ferenc tér", lat:47.4975, lon:19.0540},
  {name:"Kálvin tér", lat:47.4893, lon:19.0619},
  {name:"Blaha Lujza tér", lat:47.4970, lon:19.0707},
  {name:"Nyugati pályaudvar", lat:47.5100, lon:19.0560}
];

let markers = [];

stops.forEach(s => {
  const m = L.marker([s.lat, s.lon]).addTo(map)
    .bindPopup(`<b>${s.name}</b>`);
  markers.push({m, s});
});

// 🚍 SIMULÁLT JÁRMŰ
let bus = L.marker([47.4979, 19.0402]).addTo(map);

let t = 0;
setInterval(() => {
  t += 0.001;

  const lat = 47.4979 + Math.sin(t) * 0.01;
  const lon = 19.0402 + Math.cos(t) * 0.02;

  bus.setLatLng([lat, lon]);
}, 500);

// 🔎 KERESŐ
document.getElementById("search").addEventListener("input", (e) => {
  const q = e.target.value.toLowerCase();

  const results = stops.filter(s => s.name.toLowerCase().includes(q));

  document.getElementById("info").innerHTML =
    results.map(r =>
      `<div class="card">
        🚏 <b>${r.name}</b><br>
        <span class="badge">STOP</span>
      </div>`
    ).join("") || "Nincs találat";
});

// 📊 DISPATCHER INFO
document.getElementById("info").innerHTML = `
<div class="card">
🟢 FUTÁR Leaflet Core aktív<br>
📡 GTFS modul: DEMO<br>
🚍 Live vehicle: SIMULATED<br>
</div>
`;

</script>

</body>
</html>
