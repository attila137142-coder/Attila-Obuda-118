<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V5 STOP SEARCH ENGINE</title>

<style>
body{
margin:0;
font-family:Arial;
background:#05070d;
color:#00ffcc;
}

header{
padding:15px;
text-align:center;
background:#0b1220;
border-bottom:2px solid #00ffcc;
font-weight:bold;
}

.container{
display:grid;
grid-template-columns:1fr 2fr;
gap:10px;
padding:10px;
}

.panel{
background:#0b1220;
border:1px solid #00ffcc;
border-radius:6px;
padding:10px;
min-height:400px;
}

input{
width:100%;
padding:12px;
background:#05070d;
border:1px solid #00ffcc;
color:#00ffcc;
font-size:14px;
}

button{
width:100%;
padding:10px;
margin-top:5px;
background:#00ffcc;
border:none;
font-weight:bold;
cursor:pointer;
}

.list{
margin-top:10px;
max-height:300px;
overflow:auto;
border-top:1px solid #00ffcc33;
}

.item{
padding:8px;
border-bottom:1px solid #00ffcc22;
cursor:pointer;
}

.item:hover{
background:#00ffcc11;
}

.badge{
padding:2px 6px;
border:1px solid #00ffcc;
font-size:11px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td,th{
border-bottom:1px solid #00ffcc33;
padding:6px;
font-size:13px;
text-align:left;
}
</style>
</head>

<body>

<header>
🚍 FUTÁR V5 STOP SEARCH ENGINE // DISPATCH LEVEL
</header>

<div class="container">

<!-- SEARCH -->
<div class="panel">
<h3>🚏 Megálló kereső</h3>

<input id="search" placeholder="Írj be pl. Nád utca / Deák tér">

<button onclick="searchStops()">KERESÉS</button>

<div class="list" id="suggestions"></div>
</div>

<!-- RESULTS -->
<div class="panel">
<h3>🛰 Indulások</h3>

<div id="selected"></div>

<table>
<thead>
<tr>
<th>Járat</th>
<th>Irány</th>
<th>Ford</th>
<th>Idő</th>
</tr>
</thead>

<tbody id="table"></tbody>
</table>

</div>

</div>

<script>

/*
========================
GTFS STOP INDEX (PRO)
========================
*/

const stops = [
"Deák tér",
"Blaha Lujza tér",
"Óbuda",
"Kelenföld",
"Déli pályaudvar",
"Nád utca",
"Batthyány tér",
"Keleti pályaudvar"
];

/*
========================
GTFS TRIPS + STOP_TIMES
========================
*/

const data = {
"Nád utca":[
  {route:"7E", dir:"Blaha Lujza tér", vehicle:"F-102 / BPO-778", min:2, sec:15, status:"SIET"},
  {route:"9", dir:"Óbuda", vehicle:"F-205 / BPO-441", min:4, sec:40, status:"OK"}
],

"Deák tér":[
  {route:"47", dir:"Kelenföld", vehicle:"F-311 / JLN-229", min:1, sec:10, status:"SIET"},
  {route:"M2", dir:"Déli pályaudvar", vehicle:"METRO-02", min:6, sec:55, status:"KESÉS"}
],

"Kelenföld":[
  {route:"M4", dir:"Keleti pályaudvar", vehicle:"METRO-04", min:3, sec:20, status:"OK"}
]
};

/*
========================
NORMALIZER (GTFS STYLE)
========================
*/

function norm(str){
return str.toLowerCase()
.normalize("NFD")
.replace(/\p{Diacritic}/gu,"");
}

/*
========================
TYPEAHEAD SEARCH
========================
*/

function searchStops(){
let val = document.getElementById("search").value;

let box = document.getElementById("suggestions");
box.innerHTML="";

if(!val) return;

let found = stops.filter(s =>
norm(s).includes(norm(val))
);

found.forEach(f=>{
let div = document.createElement("div");
div.className="item";
div.innerHTML = "🚏 "+f;

div.onclick = ()=>selectStop(f);

box.appendChild(div);
});
}

/*
========================
SELECT STOP
========================
*/

function selectStop(name){

document.getElementById("selected").innerHTML =
"🚏 Kiválasztva: <b>"+name+"</b>";

let t = document.getElementById("table");
t.innerHTML="";

let trips = data[name];

if(!trips){
t.innerHTML = "<tr><td colspan='4'>❌ nincs GTFS adat</td></tr>";
return;
}

trips.forEach(d=>{

let status =
d.status==="SIET" ? "🔴 SIET" :
d.status==="KESÉS" ? "🔵 KÉSÉS" :
"🟢 OK";

t.innerHTML += `
<tr>
<td>${d.route}</td>
<td>${d.dir}</td>
<td>${d.vehicle}</td>
<td>${d.min}p ${d.sec}s (${status})</td>
</tr>
`;
});
}

/*
========================
ENTER SUPPORT
========================
*/

document.getElementById("search")
.addEventListener("keydown", function(e){
if(e.key==="Enter") searchStops();
});

</script>

</body>
</html>
