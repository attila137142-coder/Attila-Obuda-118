// =====================================
// ALAP VEZÉRLÉS
// =====================================



function openPanel(id){



let panelek =

document.querySelectorAll(".panel");



panelek.forEach(

p => p.classList.remove("active")

);



document

.getElementById(id)

.classList.add("active");



}



</script>
<script>


// =====================================
// PDF TÁR + ÉRVÉNYESSÉG FIGYELŐ V1
// =====================================



const PDF_ADATOK = [



{
nev:"160-as busz menetrend",

jarat:"160",

fajl:"pdf/160.pdf",

tol:"2026-07-01",

ig:"2026-08-31"

},



{
nev:"243-as busz menetrend",

jarat:"243",

fajl:"pdf/243.pdf",

tol:"2026-07-01",

ig:"2026-08-31"

},



{
nev:"917 éjszakai járat menetrend",

jarat:"917",

fajl:"pdf/917.pdf",

tol:"2026-07-01",

ig:"2026-08-31"

}



];







// dátum különbség napokban

function datumSzamitas(vegDatum){


let ma = new Date();


let veg = new Date(vegDatum);



let kulonbseg =

veg - ma;



return Math.ceil(

kulonbseg /

(1000*60*60*24)

);



}








function pdfListaBetoltes(){



let lista =

document.getElementById(
"pdfLista"
);



if(!lista) return;



lista.innerHTML="";





PDF_ADATOK.forEach(pdf=>{



let napok =

datumSzamitas(pdf.ig);



let allapot;

let osztaly;





if(napok < 0){



allapot =
"🔴 LEJÁRT";

osztaly =
"red";



}

else if(napok <=30){



allapot =
"🟡 HAMAROSAN LEJÁR";

osztaly =
"yellow";


}

else{


allapot =
"🟢 AKTUÁLIS";

osztaly =
"green";


}







lista.innerHTML +=



`


<div class="card">


<h3>

${pdf.nev}

</h3>




Járat:

<b>

${pdf.jarat}

</b>



<br><br>




Érvényesség:

<br>


${pdf.tol}

-

${pdf.ig}



<br><br>



Állapot:


<span class="${osztaly}">

${allapot}

</span>



<br><br>



${

napok >= 0

?

"Hátralévő idő: "

+ napok

+" nap"

:

"Új PDF szükséges!"

}



<br><br>



<button onclick="pdfMegnyitas('${pdf.fajl}')">


📄 PDF MEGNYITÁS


</button>



</div>


`;



});



}










function pdfMegnyitas(fajl){



window.open(

fajl,

"_blank"

);



}








// induláskor betöltés

pdfListaBetoltes();





</script>

// ékezet eltávolítás

function ekezetNelkul(szoveg){


return szoveg

.toLowerCase()

.normalize("NFD")

.replace(
/[\u0300-\u036f]/g,
""
);


}









function keresMegallo(){



let mezo =

document.getElementById(
"keresoInput"
);



let eredmeny =

document.getElementById(
"talalatok"
);




if(!mezo || !eredmeny)

return;






let keres =

mezo.value.trim();




eredmeny.innerHTML="";





if(keres.length < 2){


return;


}







let tiszta =

ekezetNelkul(keres);







let talalatok =

MEGALLO_ADATOK.filter(

m =>

ekezetNelkul(m.nev)

.includes(tiszta)

);







if(talalatok.length===0){



eredmeny.innerHTML =


`

<div class="card">


❌ Nincs találat


</div>


`;

return;


}









talalatok.forEach(m=>{



let ikon =

m.tipus==="éjszakai"

?

"🌙"

:

"🚌";







eredmeny.innerHTML +=


`

<div class="card">


<h3>

🚏 ${m.nev}

</h3>



GTFS stop_id:

<b>

${m.kod}

</b>



<br><br>



Járat:

${ikon}

<b>

${m.jarat}

</b>




<br><br>



Típus:

${m.tipus}



</div>


`;



});




}



</script>
