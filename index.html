<script>


// =====================================
// URL MEGNYITÓ
// =====================================


function openURL(url){


let win = window.open(

url,

"_blank"

);


if(win){

win.focus();

}


}






// =====================================
// ZOOM MOTOR
// =====================================


function zoomSet(value){


document.querySelector(
".dispatch-wall"
).style.transform=

"scale("+value+")";

}





// =====================================
// FULLSCREEN
// =====================================


function fullscreenMode(){


let elem=document.documentElement;



if(elem.requestFullscreen){

elem.requestFullscreen();


}



}



</script>

<script>



// =====================================
// MINTA GTFS ADATOK
// (később ZIP/JSON loaderhez kapcsolható)
// =====================================



const GTFS_DATA=[



{

route:"2430",

line:"243",

name:"Nád utca",

stop:"F00457",

lat:"47.597930",

lon:"19.050940",

provider:"BKK"

},



{

route:"2430",

line:"243",

name:"Békásmegyer",

stop:"008436",

lat:"47.597000",

lon:"19.044000",

provider:"BKK"

},



{

route:"70",

line:"70",

name:"Budapest-Nyugati",

stop:"005540253",

lat:"47.510000",

lon:"19.056000",

provider:"MÁV"

}



];








function gtfsFind(){


let q=document
.getElementById("gtfsSearch")
.value
.toLowerCase()
.trim();




let result=GTFS_DATA.filter(item=>


item.name.toLowerCase().includes(q)

||

item.stop.toLowerCase().includes(q)

||

item.route.toLowerCase().includes(q)

||

item.line.toLowerCase().includes(q)


);






let box=document
.getElementById("gtfsResult");





if(result.length===0){


box.innerHTML=

"❌ Nincs találat";


return;


}





let html="";



result.forEach(r=>{


html+=`

<div>

🚍 <b>${r.provider}</b>

<br>


Vonal:
<b>${r.line}</b>

<br>


Route ID:

<b>${r.route}</b>

<br>


📍 ${r.name}

<br>


GTFS STOP ID:

<b>${r.stop}</b>

<br>


🌍

${r.lat},

${r.lon}


<br>


<button onclick="openURL(
'https://realtimenext.hu/embed/bkv/stops/${r.stop}/schedule'
)">

📡 RealTimeNext

</button>



<hr>


</div>


`;



});




box.innerHTML=html;



}



</script>
