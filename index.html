<script>

"use strict";


/* =========================================================
   VALÓDI BKK / GTFS-RT FORRÁSOK
========================================================= */

const VEHICLE_URL =
"https://go.bkk.hu/api/query/v1/ws/gtfs-rt/full/VehiclePositions.pb";

const TRIP_URL =
"https://go.bkk.hu/api/query/v1/ws/gtfs-rt/full/TripUpdates.pb";

const FUTAR_URL =
"https://go.bkk.hu/api/query/v1/ws/otp/api/where/vehicles-for-location.json";

const PROTO_URL =
"https://raw.githubusercontent.com/google/transit/master/gtfs-realtime/proto/gtfs-realtime.proto";

const GTFS_URL =
"https://go.bkk.hu/api/static/v1/public-gtfs/budapest_gtfs.zip";


/* =========================================================
   ÁLLAPOT
========================================================= */

let protoRoot = null;

let vehicleData = [];

let markers = [];

let myPos = null;

let autoTimer = null;

const gtfsRoutes = new Map();

const tripDelay = new Map();

const tripDelaySeqMap = new Map();

const futarVehicleCache = new Map();


/* =========================================================
   TÉRKÉP
========================================================= */

const map =
L.map("map").setView(
  [47.4979,19.0402],
  11
);


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    attribution:"© OpenStreetMap"

).addTo(map);


/* =========================================================
   SEGÉDFÜGGVÉNYEK
========================================================= */

const $ =
id => document.getElementById(id);


const num =
v => {

  const n = Number(v);

  return Number.isFinite(n)
    ? n
    : null;

};


const val =
v => {

  return (
    v === null ||
    v === undefined ||
    v === ""
  )
    ? "NINCS ADAT"
    : String(v);

};


function log(s){

  const d =
    new Date()
      .toLocaleTimeString("hu-HU");

  $("log").textContent =

}


function key(){

  return (
    localStorage.getItem(
      "attila_bkk_api_key"
    ) ||
    $("key").value.trim()
  );

}


function setBadge(
  id,

){

  e.textContent = text;

  e.className =

}


/* =========================================================
   TÁVOLSÁG
========================================================= */

function distanceKm(a,b){

  const R = 6371;

  const p = Math.PI / 180;

  const dLat =
    (b.lat-a.lat) * p;

  const dLon =
    (b.lon-a.lon) * p;

  const x =
    Math.sin(dLat/2)**2 +
    Math.cos(a.lat*p) *
    Math.cos(b.lat*p) *
    Math.sin(dLon/2)**2;

  return (
    R *
    2 *
    Math.atan2(
      Math.sqrt(x),
      Math.sqrt(1-x)
    )
  );

}


/* =========================================================
   KÉSÉS / SIETÉS
   FONTOS:
   0 != null
========================================================= */

function delayText(seconds){

  /*
    NULL:
    nincs megbízható adat
  */

  if(
    seconds === null ||
    seconds === undefined ||
    !Number.isFinite(
      Number(seconds)
    )
  ){

    return "<span>NINCS ADAT</span>";

  }


  const s =
    Math.trunc(
      Number(seconds)
    );


  /*
    VALÓDI 0:
    EZ NEM NINCS ADAT!
  */

  if(s === 0){

    return `
      <span class="delay0">
        🟢 00:00
      </span>
    `;

  }


  const sign =
    s > 0
      ? "+"
      : "−";


  const a =
    Math.abs(s);


  const m =
    Math.floor(a / 60);


  const sec =
    a % 60;


  if(s > 0){

    return `
      <span class="late">
        🔵 KÉSÉS
        ${sign}${m}:${String(sec).padStart(2,"0")}
      </span>
    `;

  }


  return `
    <span class="early">
      🔴 SIETÉS
      ${sign}${m}:${String(sec).padStart(2,"0")}
    </span>
  `;

}


/* =========================================================
   VALÓDI TRIPUPDATE KÉSÉS
========================================================= */

function resolveVehicleDelay(item){

  const tripId =
    String(item.tripId || "");


  if(!tripId){

    return null;

  }


  /*
    1. Megállószintű TripUpdate
  */

  if(
    Number.isFinite(
      item.stopSequence
    )
  ){

    const arr =
      tripDelaySeqMap.get(
        tripId
      );


    if(
      Array.isArray(arr) &&
      arr.length
    ){

      let best = null;

      let bestDiff =
        Infinity;


      for(
        const x of arr
      ){

        const diff =
          Math.abs(
            x.seq -
            Number(
              item.stopSequence
            )
          );


        if(
          diff <
          bestDiff
        ){

          bestDiff = diff;

          best = x;

        }

      }


      if(
        best &&
        bestDiff <= 3 &&
        Number.isFinite(
          best.delay
        )
      ){

        /*
          FONTOS:
          best.delay lehet 0.
          A 0-át NEM szabad null-ra
          alakítani.
        */

        return best.delay;

      }

    }

  }


  /*
    2. Trip-szintű tartalék
  */

  const fallback =
    tripDelay.get(
      tripId
    );


  if(
    Number.isFinite(
      fallback
    )
  ){

    /*
      A 0 itt is valódi adat.
    */

    return fallback;

  }


  /*
    3. Nincs megbízható adat
  */

  return null;

}


/* =========================================================
   PROTOBUF
========================================================= */

async function loadProto(){

  if(protoRoot){

    return;

  }


  protoRoot =
    await protobuf.load(
      PROTO_URL
    );


  log(
    "GTFS-RT protobuf betöltve."
  );

}


/* =========================================================
   BINÁRIS LETÖLTÉS
========================================================= */

async function fetchBinary(url){

  const k = key();


  if(!k){

    throw new Error(
      "Nincs BKK API-kulcs."
    );

  }


  const res =
    await fetch(
      url +
      "?key=" +
      encodeURIComponent(k),
      {
        cache:"no-store"
      }
    );


  const buffer =
    await res.arrayBuffer();


  if(!res.ok){

    throw new Error(
      "HTTP " +
      res.status
    );

  }


  if(!buffer.byteLength){

    throw new Error(
      "üres válasz"
    );

  }


  return {
    res,
    buffer
  };

}


/* =========================================================
   VEHICLEPOSITIONS
========================================================= */

function parseVehicleFeed(buffer){

  if(!protoRoot){

    throw new Error(
      "protobuf nincs betöltve"
    );

  }


  const FeedMessage =
    protoRoot.lookupType(
      "transit_realtime.FeedMessage"
    );


  const feed =
    FeedMessage.decode(
      new Uint8Array(buffer)
    );


  const out = [];


  for(
    const entity of
    (feed.entity || [])
  ){

    const v =
      entity.vehicle;


    if(!v){

      continue;

    }


    const pos =
      v.position;


    const trip =
      v.trip;


    const vehicle =
      v.vehicle;


    const lat =
      num(
        pos?.latitude
      );


    const lon =
      num(
        pos?.longitude
      );


    if(
      !Number.isFinite(lat) ||
      !Number.isFinite(lon)
    ){

      continue;

    }


    const speedMs =
      num(
        pos?.speed
      );


    const speedKmh =
      Number.isFinite(speedMs)
        ? speedMs * 3.6
        : null;


    const routeId =
      String(
        trip?.routeId || ""
      );


    const stopId =
      String(
        v.stopId || ""
      );


    const stopSequence =
      v.currentStopSequence !== null &&
      v.currentStopSequence !== undefined
        ? Number(
            v.currentStopSequence
          )
        : null;


    const item = {

      source:
        "BKK GTFS-RT",

      provider:
        "BKK",

      vehicleId:
        String(
          vehicle?.id || ""
        ),

      label:
        String(
          vehicle?.label || ""
        ),

      licensePlate:
        String(
          vehicle?.licensePlate || ""
        ),

      routeId:

        routeId,

      routeShortName:

        gtfsRoutes.get(
          routeId
        ) || "",

      tripId:

        String(
          trip?.tripId || ""
        ),

      directionId:

        trip?.directionId !== null &&
        trip?.directionId !== undefined
          ? String(
              trip.directionId
            )
          : "",

      stopId:

        stopId,

      stopSequence:

        stopSequence,

      lat:

        lat,

      lon:

        lon,

      speedKmh:

        speedKmh,

      bearing:

        num(
          pos?.bearing
        ),

      delaySeconds:

        null,

      forgalmi:

        null,

      forda:

        null,

      vehicleType:

        null,

      futarMatched:

        false,

      nearestStop:

        null,

      gpsDistanceKm:

        myPos
          ? distanceKm(
              myPos,
              {
                lat,
                lon
              }
            )
          : null,

      marker:

        null

    };


    out.push(
      item
    );

  }


  return out;

}


/* =========================================================
   TRIPUPDATE FELDOLGOZÁS
========================================================= */

function parseTripUpdates(buffer){

  const FeedMessage =
    protoRoot.lookupType(
      "transit_realtime.FeedMessage"
    );


  const feed =
    FeedMessage.decode(
      new Uint8Array(buffer)
    );


  tripDelay.clear();

  tripDelaySeqMap.clear();


  for(
    const entity of
    (feed.entity || [])
  ){

    const tu =
      entity.tripUpdate;


    if(!tu){

      continue;

    }


    const tid =
      String(
        tu.trip?.tripId || ""
      );


    if(!tid){

      continue;

    }


    let tripLevel =
      null;


    const arr = [];


    for(
      const stu of
      (tu.stopTimeUpdate || [])
    ){

      const seq =
        stu.stopSequence != null
          ? Number(
              stu.stopSequence
            )
          : null;


      let d = null;


      if(
        stu.arrival?.delay != null
      ){

        d =
          Number(
            stu.arrival.delay
          );

      }
      else if(
        stu.departure?.delay != null
      ){

        d =
          Number(
            stu.departure.delay
          );

      }


      if(
        Number.isFinite(d)
      ){

        if(
          Number.isFinite(seq)
        ){

          arr.push({
            seq,
            delay:d
          });

        }


        if(
          tripLevel === null
        ){

          tripLevel =
            d;

        }

      }

    }


    if(arr.length){

      tripDelaySeqMap.set(
        tid,
        arr
      );

    }


    if(
      Number.isFinite(
        tripLevel
      )
    ){

      tripDelay.set(
        tid,
        tripLevel
      );

    }

  }


  log(
    "TripUpdate: " +
    tripDelay.size +
    " trip-szintű és " +
    tripDelaySeqMap.size +
    " megálló-szintű adat."
  );

}


/* =========================================================
   KÉSÉS ALKALMAZÁSA
========================================================= */

function applyDelays(){

  for(
    const item of
    vehicleData
  ){

    item.delaySeconds =
      resolveVehicleDelay(
        item
      );

  }

}


/* =========================================================
   FUTÁR
========================================================= */

function sameId(a,b){

  return (
    a &&
    b &&
    String(a).trim() !== "" &&
    String(a).trim() ===
    String(b).trim()
  );

}


function matchFutarToVehicle(fv){

  /*
    FONTOS:
    nincs útvonal + pozíció alapú
    találgatás.
  */

  return (

    vehicleData.find(
      v =>
        sameId(
          v.vehicleId,
          fv.vehicleId
        )
    )

    ||

    vehicleData.find(
      v =>
        sameId(
          v.tripId,
          fv.tripId
        )
    )

    ||

    vehicleData.find(
      v =>
        sameId(
          v.licensePlate,
          fv.licensePlate
        )
    )

    ||

    null

  );

}


/* =========================================================
   EXPLICIT FUTÁR MEZŐ
========================================================= */

function explicitField(
  o,
  names
){

  for(
    const n of names
  ){

    if(
      o &&
      o[n] !== undefined &&
      o[n] !== null &&
      o[n] !== ""
    ){

      return o[n];

    }


    if(
      o?.vehicle &&
      o.vehicle[n] !== undefined &&
      o.vehicle[n] !== null &&
      o.vehicle[n] !== ""
    ){

      return o.vehicle[n];

    }

  }


  return null;

}


/* =========================================================
   FUTÁR NORMALIZÁLÁS
========================================================= */

function normalizeFutarVehicle(obj){

  const p =
    obj?.position ||
    obj?.vehicle?.position ||
    {};


  const lat =
    num(
      explicitField(
        obj,
        [
          "lat",
          "latitude"
        ]
      )
    )
    ??
    num(
      p.latitude
    );


  const lon =
    num(
      explicitField(
        obj,
        [
          "lon",
          "lng",
          "longitude"
        ]
      )
    )
    ??
    num(
      p.longitude
    );


  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lon)
  ){

    return null;

  }


  return {

    vehicleId:

      String(
        explicitField(
          obj,
          [
            "vehicleId",
            "vehicle_id",
            "id"
          ]
        ) || ""
      ),

    tripId:

      String(
        explicitField(
          obj,
          [
            "tripId",
            "trip_id"
          ]
        ) || ""
      ),

    licensePlate:

      String(
        explicitField(
          obj,
          [
            "licensePlate",
            "license_plate",
            "plate"
          ]
        ) || ""
      ),

    label:

      String(
        explicitField(
          obj,
          [
            "label",
            "vehicleLabel",
            "vehicle_label"
          ]
        ) || ""
      ),


    /*
      FORGALMI:
      csak explicit valódi mező.
    */

    forgalmi:

      explicitField(
        obj,
        [
          "forgalmi",
          "forgalmiSzam",
          "forgalmi_szam",
          "fleetNumber",
          "fleetNo",
          "fleet_number",
          "vehicleNumber",
          "vehicle_number",
          "internalNumber",
          "internal_number",
          "fleetId",
          "fleet_id"
        ]
      ),


    /*
      BKK-nál nincs FORDA
    */

    forda:

      null,


    vehicleType:

      explicitField(
        obj,
        [
          "vehicleType",
          "vehicle_type",
          "vehicleTypeName",
          "vehicle_type_name",
          "vehicleModel",
          "vehicle_model",
          "vehicleModelName",
          "vehicle_model_name",
          "modelName",
          "model_name",
          "model"
        ]
      ),


    lat:

      lat,

    lon:

      lon,


    speedKmh:

      num(
        explicitField(
          obj,
          [
            "speed"
          ]
        )
      )
      ??
      (
        Number.isFinite(
          num(p.speed)
        )
          ? num(p.speed) * 3.6
          : null
      ),


    bearing:

      num(
        explicitField(
          obj,
          [
            "bearing"
          ]
        )
      )
      ??
      num(
        p.bearing
      ),


    stopId:

      String(
        explicitField(
          obj,
          [
            "stopId",
            "stop_id"
          ]
        ) || ""
      ),


    stopSequence:

      num(
        explicitField(
          obj,
          [
            "stopSequence",
            "stop_sequence"
          ]
        )
      )

  };

}


/* =========================================================
   FUTÁR JÁRMŰTÖMBÖK
========================================================= */

function findCandidateVehicleArrays(json){

  const a = [];


  for(
    const x of [

      json?.data?.list,

      json?.data?.entry,

      json?.list,

      json?.entry,

      json?.data?.vehicles,

      json?.vehicles

    ]
  ){

    if(
      Array.isArray(x)
    ){

      a.push(x);

    }

  }


  return a;

}


/* =========================================================
   FUTÁR BETÖLTÉS
========================================================= */

async function loadFutarVehicles(){

  const k =
    key();


  if(!k){

    return false;

  }


  try{

    const c =
      myPos
        ? {
            lat:myPos.lat,
            lon:myPos.lon,
            latSpan:.45,
            lonSpan:.70
          }
        : {
            lat:47.4979,
            lon:19.0402,
            latSpan:.55,
            lonSpan:.85
          };


    const u =
      FUTAR_URL +

      "?key=" +
      encodeURIComponent(k) +

      "&version=1" +

      "&appVersion=1" +

      "&lat=" +
      c.lat +

      "&lon=" +
      c.lon +

      "&latSpan=" +
      c.latSpan +

      "&lonSpan=" +
      c.lonSpan +

      "&includeReferences=true";


    const r =
      await fetch(
        u,
        {
          cache:"no-store"
        }
      );


    if(!r.ok){

      throw new Error(
        "FUTÁR HTTP " +
        r.status
      );

    }


    const json =
      await r.json();


    const raw =
      findCandidateVehicleArrays(
        json
      ).flat();


    futarVehicleCache.clear();


    for(
      const o of raw
    ){

      const f =
        normalizeFutarVehicle(
          o
        );


      if(!f){

        continue;

      }


      const cacheKey =
        f.vehicleId ||
        f.tripId ||
        f.licensePlate;


      if(cacheKey){

        futarVehicleCache.set(
          cacheKey,
          f
        );

      }

    }


    let n = 0;


    for(
      const f of
      futarVehicleCache.values()
    ){

      const v =
        matchFutarToVehicle(
          f
        );


      if(!v){

        continue;

      }


      n++;


      v.futarMatched =
        true;


      if(
        f.licensePlate
      ){

        v.licensePlate =
          f.licensePlate;

      }


      /*
        FORGALMI csak valódi
        explicit mezőből.
      */

      if(
        f.forgalmi !== null &&
        f.forgalmi !== undefined &&
        f.forgalmi !== ""
      ){

        v.forgalmi =
          String(
            f.forgalmi
          );

      }


      /*
        JÁRMŰTÍPUS csak explicit
        valódi forrásból.
      */

      if(
        f.vehicleType !== null &&
        f.vehicleType !== undefined &&
        f.vehicleType !== ""
      ){

        v.vehicleType =
          String(
            f.vehicleType
          );

      }


      if(
        !v.label &&
        f.label
      ){

        v.label =
          f.label;

      }


      if(
        !Number.isFinite(
          v.speedKmh
        ) &&
        Number.isFinite(
          f.speedKmh
        )
      ){

        v.speedKmh =
          f.speedKmh;

      }


      if(
        !v.bearing &&
        Number.isFinite(
          f.bearing
        )
      ){

        v.bearing =
          f.bearing;

      }

    }


    $("fmatched").textContent =
      n;


    log(
      "FUTÁR egyezés: " +
      n
    );


    return true;

  }
  catch(e){

    log(
      "FUTÁR: " +
      e.message
    );


    return false;

  }

}


/* =========================================================
   FŐ FRISSÍTÉS
========================================================= */

async function testFeed(){

  try{

    setBadge(
      "rtBadge",
      "GTFS-RT: BETÖLTÉS…",
      "warn"
    );


    await loadProto();


    const {
      buffer
    } =
      await fetchBinary(
        VEHICLE_URL
      );


    const parsed =
      parseVehicleFeed(
        buffer
      );


    /*
      Csak sikeres dekódolás után
      cseréljük le a járműlistát.
    */

    vehicleData =
      parsed;


    /*
      Ha a TripUpdate még nincs
      betöltve, itt null marad.
    */

    applyDelays();


    await loadFutarVehicles();


    render();


    setBadge(
      "rtBadge",
      "GTFS-RT: OK " +
      vehicleData.length,
      "ok"
    );


    $("updated").textContent =
      new Date()
        .toLocaleTimeString(
          "hu-HU"
        );


    log(
      "Valódi GTFS-RT járművek: " +
      vehicleData.length
    );


    /*
      TripUpdate külön betöltése
    */

    try{

      const t =
        await fetchBinary(
          TRIP_URL
        );


      parseTripUpdates(
        t.buffer
      );


      /*
        Újra alkalmazzuk a valódi
        késéseket.

        0 továbbra is 0.
      */

      applyDelays();


      render();

    }
    catch(e){

      log(
        "TripUpdate: " +
        e.message
      );

    }

  }
  catch(e){

    setBadge(
      "rtBadge",
      "GTFS-RT: HIBA",
      "bad"
    );


    log(
      "GTFS-RT: " +
      e.message
    );

  }

}


/* =========================================================
   GPS
========================================================= */

function startGPS(){

  if(
    !navigator.geolocation
  ){

    setBadge(
      "gpsBadge",
      "GPS: nincs",
      "bad"
    );

    return;

  }


  navigator.geolocation.watchPosition(

    p => {

      myPos = {

        lat:
          p.coords.latitude,

        lon:
          p.coords.longitude

      };


      setBadge(
        "gpsBadge",
        "GPS: OK ±" +
        Math.round(
          p.coords.accuracy
        ) +
        " m",
        "ok"
      );


      for(
        const v of
        vehicleData
      ){

        v.gpsDistanceKm =
          distanceKm(
            myPos,
            v
          );

      }


      render();

    },


    e => {

      setBadge(
        "gpsBadge",
        "GPS: " +
        e.message,
        "bad"
      );

    },


    {
      enableHighAccuracy:true,
      maximumAge:5000,
      timeout:15000
    }

  );

}

/* =========================================================
   MEGJELENÍTÉS
========================================================= */

function render(){

  const q =
    $("search")
      .value
      .trim()
      .toLowerCase();


  const list =
    vehicleData.filter(
      v => {

        if(!q){

          return true;

        }


        return [

          v.routeId,

          v.routeShortName,

          v.label,

          v.licensePlate,

          v.forgalmi,

          v.vehicleType,

          v.vehicleId,

          v.tripId,

          v.stopId,

          v.source

        ]
        .some(
          x =>
            String(
              x || ""
            )
            .toLowerCase()
            .includes(q)
        );

      }
    );


  $("total").textContent =
    vehicleData.length;


  $("shown").textContent =
    list.length;


  $("list").innerHTML =
    list
      .map(card)
      .join("");


  $("list")
    .querySelectorAll(".card")
    .forEach(
      c => {

        c.onclick =
        () => {

          const v =
            vehicleData.find(
              x =>
                x.vehicleId ===
                c.dataset.id
            );


          if(v){

            map.setView(
              [
                v.lat,
                v.lon
              ],
              15
            );


            if(v.marker){

              v.marker.openPopup();

            }

          }

        };

      }
    );


  markers.forEach(
    m =>
      map.removeLayer(m)
  );


  markers = [];


  for(
    const v of list
  ){

    const m =
      L.circleMarker(
        [
          v.lat,
          v.lon
        ],
        {
          radius:7
        }
      )
      .addTo(map)
      .bindPopup(
        popup(v)
      );


    v.marker =
      m;


    markers.push(
      m
    );

  }

}
