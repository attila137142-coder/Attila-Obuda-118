<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>
Attila Közlekedés V11 - Real Location + 10 km Körzetfigyelő CORE V1
</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

body{
    margin:0;
    background:#081018;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.header{
    background:#102438;
    padding:15px;
    font-size:20px;
    font-weight:bold;
}

.panel{
    padding:12px;
    background:#132b40;
    margin:10px;
    border-radius:15px;
}

.data{
    line-height:1.7;
}

.ok{
    color:#00ff88;
    font-weight:bold;
}

.warn{
    color:#ffd000;
}

button{
    background:#0066ff;
    color:white;
    border:0;
    padding:12px;
    border-radius:10px;
    font-size:16px;
}

#map{
    height:55vh;
    margin:10px;
    border-radius:15px;
}

</style>

</head>

<body>

<div class="header">
🚦 Attila Közlekedés V11
<br>
📍 Real Location + 10 km Körzetfigyelő CORE V1
</div>


<div class="panel data">

<div id="gps">
GPS állapot:
<span class="warn">
Várakozás...
</span>
</div>

<hr>

🌍 Ország:
<div id="country">-</div>

📮 Irányítószám:
<div id="postcode">-</div>

🏙 Város:
<div id="city">-</div>

🏠 Utca:
<div id="street">-</div>

🚪 Házszám:
<div id="house">-</div>

<hr>

📌 Koordináta:

<div id="coords">
-
</div>

🎯 Pontosság:

<div id="accuracy">
-
</div>

</div>


<div class="panel data">

📅 Dátum:
<div id="date">
-
</div>

⏰ Idő:
<div id="time">
-
</div>

📆 Hét száma:
<div id="week">
-
</div>

🔢 Év napja:
<div id="yearday">
-
</div>

</div>


<div class="panel">

<button onclick="startGPS()">
📡 GPS INDÍTÁS
</button>

</div>


<div id="map"></div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


let map;

let marker;

let circle;



function initMap(){

map=L.map('map')
.setView([47.5,19.05],12);


L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}
).addTo(map);

}



function updateClock(){

let now=new Date();


document.getElementById("date").innerHTML =
now.toLocaleDateString("hu-HU");


document.getElementById("time").innerHTML =
now.toLocaleTimeString("hu-HU");


document.getElementById("week").innerHTML =
getWeek(now)+" . hét";


document.getElementById("yearday").innerHTML =
getYearDay(now)+" . nap";

}



function getWeek(date){

let d=new Date(
Date.UTC(
date.getFullYear(),
date.getMonth(),
date.getDate()
));

let dayNum=d.getUTCDay()||7;

d.setUTCDate(
d.getUTCDate()+4-dayNum
);

let yearStart=
new Date(
Date.UTC(
d.getUTCFullYear(),
0,
1
));

return Math.ceil(
(((d-yearStart)/86400000)+1)/7
);

}



function getYearDay(date){

let start=
new Date(
date.getFullYear(),
0,
0
);

return Math.floor(
(date-start)/86400000
);

}



async function getAddress(lat,lon){

try{


let url=
"https://nominatim.openstreetmap.org/reverse?format=json&lat="
+lat+
"&lon="+lon+
"&zoom=18&addressdetails=1";


let response=
await fetch(url);


let data=
await response.json();


let a=data.address;


document.getElementById("country").innerHTML=
a.country || "-";


document.getElementById("postcode").innerHTML=
a.postcode || "-";


document.getElementById("city").innerHTML=
a.city ||
a.town ||
a.village ||
"-";


document.getElementById("street").innerHTML=
a.road || "-";


document.getElementById("house").innerHTML=
a.house_number || "-";


}
catch(e){

console.log(e);

}

}





function startGPS(){


if(!navigator.geolocation){

alert("A készülék nem támogat GPS-t");

return;

}



navigator.geolocation.watchPosition(

function(pos){


let lat=
pos.coords.latitude;


let lon=
pos.coords.longitude;


let acc=
Math.round(pos.coords.accuracy);



document.getElementById("gps").innerHTML=
"GPS állapot: <span class='ok'>🟢 AKTÍV</span>";


document.getElementById("coords").innerHTML=
lat.toFixed(8)+
"<br>"+
lon.toFixed(8);


document.getElementById("accuracy").innerHTML=
"± "+acc+" méter";



if(!marker){


marker=L.marker(
[lat,lon]
)
.addTo(map)
.bindPopup(
"📍 Saját helyzet"
);


circle=L.circle(
[lat,lon],
{
radius:10000
}
)
.addTo(map);


}
else{


marker.setLatLng([lat,lon]);

circle.setLatLng([lat,lon]);


}



map.setView(
[lat,lon],
13
);



getAddress(lat,lon);



},


function(error){

document.getElementById("gps").innerHTML=
"GPS hiba: "+error.message;


},


{
enableHighAccuracy:true,
maximumAge:5000,
timeout:10000
}


);


}



initMap();

updateClock();

setInterval(
updateClock,
1000
);


</script>


</body>
</html>
