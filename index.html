<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Control Room V3.2 REAL</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f0f;
  color: white;
}

header {
  padding: 12px;
  background: #111;
  border-bottom: 1px solid #333;
}

#container {
  display: flex;
  height: calc(100vh - 50px);
}

#left {
  flex: 3;
  padding: 10px;
}

#right {
  flex: 1;
  border-left: 1px solid #333;
  padding: 10px;
  font-size: 12px;
  background: #0b0b0b;
}

input, button {
  padding: 8px;
  margin-bottom: 10px;
  width: 100%;
}

.row {
  display: flex;
  justify-content: space-between;
  padding: 8px;
  margin-bottom: 6px;
  background: #1a1a1a;
  border-left: 5px solid #444;
}

.row.fast { border-left-color: red; }
.row.ok { border-left-color: yellow; }
.row.delay { border-left-color: deepskyblue; }

small { opacity: 0.7; }
</style>
</head>

<body>

<header>
🚏 CONTROL ROOM V3.2 — REALISTIC ENGINE
</header>

<div id="container">

<div id="left">
<input id="stopInput" placeholder="Megálló (pl. Nád utca / Magnólia utca)">
<button onclick="loadStop()">Indítás</button>
<div id="board"></div>
</div>

<div id="right">
<b>DEBUG</b>
<pre id="log"></pre>
</div>

</div>

<script>

// =====================
// LOG
// =====================
function log(msg) {
  document.getElementById("log").innerText += msg + "\n";
}

// =====================
// STOPS (BŐVÍTVE)
// =====================
const STOPS = [
  { id: "S1", name: "Nád utca" },
  { id: "S2", name: "Magnólia utca" },
  { id: "S3", name: "Flórián tér" }
];

// =====================
// TRIPS (STABILIZÁLT)
// =====================
const TRIPS = [
  { id: "T1", route: "34", direction: "Aquincum", vehicle: "BUS-1001" },
  { id: "T2", route: "134", direction: "Újpest", vehicle: "BUS-1002" },
  { id: "T3", route: "106", direction: "Gellért tér", vehicle: "BUS-1003" }
];

// =====================
// STOP TIMES
// =====================
const STOP_TIMES = [
  { stop_id: "S1", trip_id: "T1", time: "12:10:00" },
  { stop_id: "S1", trip_id: "T2", time: "12:14:30" },
  { stop_id: "S2", trip_id: "T3", time: "12:18:00" }
];

// =====================
// STOP FIND
// =====================
function findStop(name) {
  return STOPS.find(s =>
    s.name.toLowerCase().includes(name.toLowerCase())
  );
}

// =====================
// REALISTIC DELAY ENGINE
// =====================
function calcDelay(timeStr) {

  const [h, m, s] = timeStr.split(":").map(Number);

  const now = new Date();
  const target = new Date();
  target.setHours(h, m, s, 0);

  const diffMin = Math.floor((target - now) / 60000);

  return diffMin;
}

// =====================
// STATUS ENGINE (REALISTIC)
// =====================
function getStatus(diffMin) {

  // 🔴 early (rare)
  if (diffMin < -2) {
    return { text: "SIET " + Math.abs(diffMin) + "p", cls: "fast" };
  }

  // 🟡 near time window
  if (diffMin <= 3) {
    return { text: "IDŐBEN", cls: "ok" };
  }

  // 🔵 delay
  return { text: "KÉSÉS +" + diffMin + "p", cls: "delay" };
}

// =====================
// BUILD (CLEAN GTFS LOGIC)
// =====================
function buildDepartures(stopId) {

  log("⚙️ building for " + stopId);

  return STOP_TIMES
    .filter(st => st.stop_id === stopId)
    .map(st => {

      const trip = TRIPS.find(t => t.id === st.trip_id);

      if (!trip) {
        log("⚠️ missing trip " + st.trip_id);
        return null;
      }

      const diff = calcDelay(st.time);
      const status = getStatus(diff);

      return {
        route: trip.route,
        direction: trip.direction,
        time: st.time,
        vehicle: trip.vehicle,
        status: status.text,
        cls: status.cls
      };
    })
    .filter(Boolean)
    .slice(0, 15);
}

// =====================
// RENDER
// =====================
function renderBoard(data) {

  const board = document.getElementById("board");
  board.innerHTML = "";

  data.forEach(d => {

    const row = document.createElement("div");
    row.className = "row " + d.cls;

    row.innerHTML = `
      <div><b>${d.route}</b></div>
      <div>${d.direction}</div>
      <div>${d.time}</div>
      <div>${d.status}</div>
      <div><small>${d.vehicle}</small></div>
    `;

    board.appendChild(row);
  });
}

// =====================
// MAIN
// =====================
function loadStop() {

  const val = document.getElementById("stopInput").value;

  log("🔎 " + val);

  const stop = findStop(val);

  if (!stop) {
    log("❌ STOP NOT FOUND");
    return;
  }

  const data = buildDepartures(stop.id);

  renderBoard(data);
}

log("🟢 V3.2 REAL READY");

</script>

</body>
</html>
