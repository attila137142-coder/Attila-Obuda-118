<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>FUTÁR V6 CONTROL ROOM</title>

<style>
body {
  margin:0;
  background:#070b10;
  color:#00ff88;
  font-family:Arial;
  overflow:hidden;
}

#top {
  position:fixed;
  top:0; left:0; right:0;
  height:60px;
  background:#111;
  display:flex;
  align-items:center;
  padding:10px;
  gap:20px;
  border-bottom:2px solid #0f0;
}

#map {
  position:absolute;
  top:60px;
  left:0;
  right:0;
  bottom:0;
  background:#05080c;
}

.bus {
  width:12px;
  height:12px;
  background:lime;
  border-radius:50%;
  position:absolute;
  box-shadow:0 0 10px lime;
}

.stop {
  width:8px;
  height:8px;
  background:red;
  border-radius:50%;
  position:absolute;
}

#panel {
  position:fixed;
  bottom:10px;
  left:10px;
  background:#111;
  padding:10px;
  border:1px solid #0f0;
  width:260px;
}

#ai {
  color:orange;
}
</style>
</head>

<body>

<div id="top">
  <div>🚍 FUTÁR V6 CONTROL ROOM</div>
  <button onclick="spawnBus()">Spawn Bus</button>
  <div id="status">READY</div>
</div>

<canvas id="map"></canvas>

<div id="panel">
  <div id="gps">GPS: --</div>
  <div id="speed">Speed: --</div>
  <div id="delay">Delay: --</div>
  <div id="ai">AI: --</div>
</div>

<script>

// =========================
// CANVAS MAP
// =========================
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.onresize = resize;
resize();

// =========================
// SIM WORLD (GTFS STYLE STOPS)
// =========================
const stops = [
  {x:100,y:120},
  {x:300,y:200},
  {x:500,y:350},
  {x:700,y:420},
  {x:900,y:300}
];

// =========================
// BUSES
// =========================
let buses = [];

function spawnBus(){
  buses.push({
    i:0,
    t:0,
    speed:1.5 + Math.random(),
    delay:0,
    history:[]
  });
}

// =========================
// DRAW
// =========================
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // stops
  for(let s of stops){
    ctx.fillStyle="red";
    ctx.fillRect(s.x,s.y,6,6);
  }

  // buses
  for(let b of buses){
    const a = stops[b.i];
    const c = stops[Math.min(b.i+1, stops.length-1)];

    const x = a.x + (c.x - a.x)*b.t;
    const y = a.y + (c.y - a.y)*b.t;

    ctx.fillStyle="lime";
    ctx.beginPath();
    ctx.arc(x,y,6,0,Math.PI*2);
    ctx.fill();

    b._pos = {x,y};
  }
}

// =========================
// ENGINE LOOP
// =========================
function update(){

  for(let b of buses){

    const next = stops[b.i+1];
    if(!next) continue;

    b.t += 0.01 * b.speed;

    if(b.t >= 1){
      b.t = 0;
      b.i++;
    }

    // delay simulation
    const baseSpeed = 1.2;
    const delayFactor = baseSpeed - b.speed;

    b.delay = delayFactor * 100;
    b.history.push(b.delay);
    if(b.history.length > 20) b.history.shift();

    const avg = b.history.reduce((a,b)=>a+b,0)/b.history.length;

    b.ai = avg + (b.speed < 1 ? 80 : 0);
  }

  updatePanel();
}

// =========================
// DISPATCH PANEL
// =========================
function updatePanel(){
  if(buses.length === 0){
    document.getElementById("status").innerText="NO BUSES";
    return;
  }

  const b = buses[0];

  document.getElementById("speed").innerText =
    "Speed: " + b.speed.toFixed(2);

  document.getElementById("delay").innerText =
    "Delay: " + Math.round(b.delay) + " sec";

  document.getElementById("ai").innerText =
    "AI: " + Math.round(b.ai) + " congestion";
}

// =========================
// GPS (optional user tracking)
// =========================
navigator.geolocation.watchPosition(p=>{
  document.getElementById("gps").innerText =
    `GPS: ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;
});

// =========================
// MAIN LOOP
// =========================
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
