<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>V7 TERRAIN DIFFICULTY MAP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
body { margin:0; font-family:Arial; background:#111; color:#fff;}
#map { height:100vh;}
</style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map = L.map('map').setView([47.5,19.1],11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  opacity:0.7
}).addTo(map);

// ------------------------
// 🔥 GRID SETTINGS
// ------------------------
const step = 0.003; // ~300m (demo)

let layers = [];

// ------------------------
// ⛰️ ELEVATION
// ------------------------
async function getElevation(lat,lon){

  let res = await fetch("https://api.open-elevation.com/api/v1/lookup",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      locations:[{latitude:lat,longitude:lon}]
    })
  });

  let data = await res.json();
  return data.results[0].elevation;
}

// ------------------------
// 🧠 TERRAIN SCORE
// ------------------------
function score(slope){

  if(slope < 2) return "#00ff6a";
  if(slope < 5) return "#ffd000";
  if(slope < 10) return "#ff7a00";
  return "#ff1e1e";
}

// ------------------------
// 🗺️ GRID GENERATION
// ------------------------
async function buildTerrain(){

  let bounds = map.getBounds();

  for(let lat = bounds.getSouth(); lat < bounds.getNorth(); lat += step){
    for(let lon = bounds.getWest(); lon < bounds.getEast(); lon += step){

      let h1 = await getElevation(lat,lon);
      let h2 = await getElevation(lat+step,lon+step);

      let dist = map.distance([lat,lon],[lat+step,lon+step]);
      let slope = ((h2-h1)/dist)*100;

      let color = score(Math.abs(slope));

      let cell = L.rectangle(
        [[lat,lon],[lat+step,lon+step]],
        {
          color:color,
          weight:0,
          fillOpacity:0.5
        }
      ).addTo(map);

      layers.push(cell);
    }
  }

  alert("TERRAIN MAP kész ✔");
}

// auto start
buildTerrain();
</script>

</body>
</html>
