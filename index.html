<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Börzsöny Water Network Loader</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }
#map { height: 85vh; }

.panel {
  padding:10px;
  background:#f4f4f4;
}

button { padding:6px; }
</style>
</head>

<body>

<div class="panel">
💧 <button onclick="loadWater()">OSM VÍZ BETÖLTÉS</button>
🔍 <input id="q" placeholder="keresés forrásokra">
<button onclick="search()">Keres</button>
<div id="info"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- cluster -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script>

/////////////////////////////////////////////////////
// 🗺️ MAP
/////////////////////////////////////////////////////

const map = L.map('map').setView([47.95,18.90],12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OSM'
}).addTo(map);

let clusterGroup = L.markerClusterGroup();
map.addLayer(clusterGroup);

let waterData = [];

/////////////////////////////////////////////////////
// 🌍 OSM LIVE FETCH (VALÓS ADAT)
/////////////////////////////////////////////////////

async function loadWater(){

  document.getElementById("info").innerText="⏳ OSM betöltés...";

  const query = `
  [out:json][timeout:25];
  area["name"="Börzsöny"]->.a;
  (
    node["natural"="spring"](area.a);
    node["amenity"="drinking_water"](area.a);
  );
  out body;
  `;

  const url="https://overpass-api.de/api/interpreter?data="+encodeURIComponent(query);

  const res = await fetch(url);
  const data = await res.json();

  waterData = data.elements;

  render();

  document.getElementById("info").innerText=
    `💧 Betöltve: ${waterData.length} forrás`;

}

/////////////////////////////////////////////////////
// 🧠 SIMPLE CLUSTER RENDER
/////////////////////////////////////////////////////

function render(){

  clusterGroup.clearLayers();

  waterData.forEach(p=>{

    const marker = L.circleMarker([p.lat,p.lon],{
      radius:6,
      color:"blue"
    });

    marker.bindPopup(`
      💧 <b>${p.tags?.name || "Ismeretlen forrás"}</b><br>
      🆔 OSM: ${p.id}<br>
      🌿 ${p.tags?.natural || p.tags?.amenity || ""}
    `);

    clusterGroup.addLayer(marker);
  });

}

/////////////////////////////////////////////////////
// 🔍 SEARCH (LOCAL FILTER)
/////////////////////////////////////////////////////

function search(){

  const q=document.getElementById("q").value.toLowerCase();

  const filtered = waterData.filter(p=>{
    const name=(p.tags?.name || "").toLowerCase();
    return name.includes(q);
  });

  clusterGroup.clearLayers();

  filtered.forEach(p=>{

    const marker=L.circleMarker([p.lat,p.lon],{
      radius:7,
      color:"green"
    });

    marker.bindPopup(p.tags?.name || "forrás");

    clusterGroup.addLayer(marker);
  });

  document.getElementById("info").innerText=
    `🔍 találat: ${filtered.length}`;
}

/////////////////////////////////////////////////////

</script>

</body>
</html>
