</div>

<div class="panel">


<h2>

🔎 Online kereső

</h2>


<input

id="linkKereso"

placeholder="Keresés: Nád utca, BKK, MÁV..."

oninput="linkKereses()"


>



</div>








<div class="panel">


<h2>

🚍 Gyors kapcsolatok

</h2>



<div id="linkLista">


</div>



</div>









<script>


// =====================================
// ONLINE LINK MOTOR ALAP
// =====================================



let ONLINE_LINKEK=[];






function linkMegnyitas(url){



window.open(

url,

"_blank"

);


}





function linkKereses(){



let keres =

document

.getElementById(
"linkKereso"
)

.value

.toLowerCase();




let elemek =

document.querySelectorAll(
".linkElem"
);




elemek.forEach(e=>{



if(
e.innerText
.toLowerCase()
.includes(keres)

)

{


e.style.display="block";


}

else{


e.style.display="none";


}



});



}






function linkListaRajz(){



let hely =

document.getElementById(
"linkLista"
);



hely.innerHTML="";





ONLINE_LINKEK.forEach(l=>{



hely.innerHTML +=


`

<div class="card linkElem">


<button onclick="linkMegnyitas('${l.url}')">


🌐 ${l.nev}


</button>



<div class="small">


${l.tipus}


</div>



</div>


`;



});



}



</script>
