<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>V6 Route Animation Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; display:flex; height:100vh; font-family:Arial; }
#sidebar { width:360px; padding:10px; overflow:auto; border-right:1px solid #ccc; }
#map { flex:1; }
.stop { padding:6px; border-bottom:1px solid #eee; cursor:pointer; }
.stop:hover { background:#f2f2f2; }
button { width:100%; padding:8px; margin-top:8px; }
</style>
</head>

<body>

<div id="sidebar">
<h3>🚆 V6 ROUTE ENGINE</h3>
<div id="list"></div>
</div>

<div id="map"></div>

<script>

const map = L.map('map').setView([47.5,19.05],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// ================= SAMPLE GTFS-LIKE DATA =================
const STOPS = [
  {id:"A", name:"Budapest", lat:47.4979, lon:19.0402},
  {id:"B", name:"Szentendre", lat:47.6611, lon:19.0756},
  {id:"C", name:"Tahitótfalu", lat:47.7517, lon:19.0782},
  {id:"D", name:"Vác", lat:47.7819, lon:19.1296}
];

const STOP_TIMES = [
  {trip:"T1", stop:"A", time:"08:00:00"},
  {trip:"T1", stop:"B", time:"08:25:00"},
  {trip:"T1", stop:"C", time:"08:45:00"},
  {trip:"T1", stop:"D", time:"09:10:00"}
];

const TRIPS = {
  "T1": { route:"BKK-150", head:"Vác felé" }
};

// ================= CORE =================
let ACTIVE = [];

function timeToSec(t){
  const p = t.split(":");
  return (+p[0])*3600 + (+p[1])*60 + (+p[2]);
}

function interpolate(a,b,t){
  return [
    a[0] + (b[0]-a[0])*t,
    a[1] + (b[1]-a[1])*t
  ];
}

// ================= BUILD ROUTE =================
function buildRoute(tripId){

  const times = STOP_TIMES
    .filter(t=>t.trip===tripId)
    .map(t=>{
      const s = STOPS.find(x=>x.id===t.stop);
      return {
        ...t,
        sec: timeToSec(t.time),
        pos:[s.lat,s.lon]
      };
    })
    .sort((a,b)=>a.sec-b.sec);

  return times;
}

// ================= START VEHICLE =================
function startTrip(tripId){

  ACTIVE.push({
    tripId,
    route: buildRoute(tripId),
    index:0,
    progress:0
  });
}

// ================= ANIMATION =================
function update(){

  ACTIVE.forEach(v=>{

    const r = v.route;
    const a = r[v.index];
    const b = r[v.index+1];

    if(!a || !b) return;

    v.progress += 0.02;

    const pos = interpolate(a.pos,b.pos,v.progress);

    L.circleMarker(pos,{
      radius:6,
      color:"red"
    }).addTo(map)
    .bindPopup(`
      🚌 ${TRIPS[v.tripId].route}<br>
      ➜ ${TRIPS[v.tripId].head}
    `);

    if(v.progress>=1){
      v.progress=0;
      v.index++;
    }

  });
}

// ================= LOOP =================
setInterval(()=>{

  map.eachLayer(l=>{
    if(l instanceof L.CircleMarker) map.removeLayer(l);
  });

  update();

}, 400);

// ================= UI =================
function renderStops(){

  const list = document.getElementById("list");
  list.innerHTML="";

  STOPS.forEach(s=>{

    const div = document.createElement("div");
    div.className="stop";
    div.innerHTML = `<b>${s.name}</b><br>${s.id}`;

    div.onclick = ()=>{
      map.setView([s.lat,s.lon],13);
      startTrip("T1");
    };

    list.appendChild(div);
  });
}

renderStops();

</script>

</body>
</html>
