<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>GTFS CONTROL ROOM V12 FIX</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; display:flex; height:100vh; font-family:Arial; }

#panel {
  width:380px;
  background:#04251d;
  color:white;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

#title {
  padding:10px;
  font-weight:bold;
  border-bottom:1px solid rgba(255,255,255,0.2);
}

#list {
  overflow:auto;
  flex:1;
  padding:8px;
}

.row {
  display:flex;
  justify-content:space-between;
  padding:6px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  font-size:13px;
}

.green { color:#7CFF7C; }
.red { color:#ff4d4d; font-weight:bold; }
.blue { color:#4da6ff; font-weight:bold; }

.badge {
  font-size:10px;
  padding:2px 5px;
  background:#222;
  border-radius:4px;
  margin-left:4px;
}

#map { flex:1; }
</style>
</head>

<body>

<div id="panel">
  <div id="title">🚏 V12 GTFS DISPATCH CORE (STABLE)</div>
  <div id="list"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   🗺️ MAP INIT (FIXED)
========================= */

const map = L.map('map', {
  zoomControl:true,
  preferCanvas:true
}).setView([47.4979, 19.0402], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'OSM'
}).addTo(map);

/* =========================
   🚏 STOPS (EXTENDED BUDAPEST)
========================= */

const stops = [
  "Deák tér","Kálvin tér","Fővám tér","Blaha Lujza tér",
  "Széll Kálmán tér","Újpest","Kőbánya","Budaörs",
  "Szentendre","Csepel","Rákospalota","Déli","Keleti"
];

/* =========================
   🚍 REAL ROUTE POOL (NO 5 BUS LIMIT!)
========================= */

const routes = [
  "4-6","7","9","12A","14","17","19","23","24","30","33",
  "40","40B","47","48","49","50","51","54","55",
  "66","72","73","78","85","85E","89","90","100E","105","106"
];

/* =========================
   🚍 VEHICLES
========================= */

let vehicles = routes.map(r=>{
  return {
    route:r,
    lat:47.2 + Math.random()*0.5,
    lon:18.8 + Math.random()*0.5,
    dlat:0.0002 + Math.random()*0.0003,
    dlon:0.0002 + Math.random()*0.0003,
    delay:(Math.random()*120-60)
  };
});

let markers = {};

/* =========================
   🧠 SAFE FORMAT ENGINE
========================= */

function format(d){
  d = d || 0;

  const m = Math.floor(Math.abs(d)/60);
  const s = Math.abs(d)%60;

  if(d > 20) return `<span class="blue">🔵 +${m}:${s.toString().padStart(2,'0')}</span>`;
  if(d < -20) return `<span class="red">🔴 -${m}:${s.toString().padStart(2,'0')}</span>`;
  return `<span class="green">🟢 ON TIME</span>`;
}

/* =========================
   🚏 FIXED 15 ROW PANEL (NO FLICKER)
========================= */

function renderPanel(){

  let html = "";

  for(let i=0;i<15;i++){

    const v = vehicles[i % vehicles.length];

    html += `
      <div class="row">
        <div>
          ${v.route}
          <span class="badge">GTFS</span>
        </div>
        <div>${format(v.delay)}</div>
      </div>
    `;
  }

  document.getElementById("list").innerHTML = html;
}

/* =========================
   🚍 STABLE VEHICLE UPDATE
========================= */

function updateVehicles(){

  vehicles.forEach(v=>{

    v.lat += v.dlat;
    v.lon += v.dlon;

    // bounce (no drift bug!)
    if(v.lat < 47.1 || v.lat > 47.7) v.dlat *= -1;
    if(v.lon < 18.7 || v.lon > 19.4) v.dlon *= -1;

    if(!markers[v.route]){
      markers[v.route] = L.circleMarker([v.lat,v.lon],{
        radius:7,
        color:"red"
      }).addTo(map).bindPopup(v.route);
    } else {
      markers[v.route].setLatLng([v.lat,v.lon]);
    }

    if(v.delay > 20) markers[v.route].setStyle({color:"blue"});
    else if(v.delay < -20) markers[v.route].setStyle({color:"red"});
    else markers[v.route].setStyle({color:"green"});

    v.delay += (Math.random()*4 - 2);
  });
}

/* =========================
   LOOP (FIXED RENDER ORDER)
========================= */

function tick(){
  updateVehicles();
  renderPanel();   // <- FONTOS: mindig utoljára
}

setInterval(tick, 1000);

tick();

</script>

</body>
</html>
