<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATTILA FULL STOP PANEL</title>

<style>
body { font-family: Arial; background:#0b1220; color:white; padding:15px }
h1 { margin-bottom:10px }
button { padding:10px; border:none; border-radius:8px; margin:5px; background:#22c55e; color:white; font-weight:bold }
input { padding:10px; border-radius:8px; width:80% }
.card { background:#1e293b; padding:10px; border-radius:10px; margin-top:10px }
.red { border-left:5px solid red }
.blue { border-left:5px solid cyan }
.white { border-left:5px solid white }
</style>

</head>
<body>

<h1>🚏 FULL STOP PANEL + LIVE LOGIKA</h1>

<input type="file" id="zipInput" accept=".zip">
<button onclick="loadZIP()">📦 GTFS</button>
<button onclick="getLocation()">📍 Saját hely</button>

<br><br>
<input id="q" placeholder="Megálló keresés..." />
<button onclick="search()">🔍</button>

<div id="me"></div>
<div id="out"></div>
<div id="panel"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>

let STOPS=[], STOP_TIMES=[];
let MY={lat:null,lon:null};

// 📍 HELYZET + CÍM
async function getLocation(){

  navigator.geolocation.getCurrentPosition(async pos=>{

    let lat=pos.coords.latitude;
    let lon=pos.coords.longitude;
    let acc=pos.coords.accuracy;

    let res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
    let data=await res.json();

    let a=data.address||{};

    document.getElementById("me").innerHTML=`
      <div class='card'>
      📍 ${lat.toFixed(6)}, ${lon.toFixed(6)}<br>
      🌍 ${a.country||"-"}<br>
      🏙 ${a.city||a.town||a.village||"-"}<br>
      🏠 ${a.road||"-"} ${a.house_number||""}<br>
      🎯 GPS pontosság: ${Math.round(acc)} m
      </div>`;

    MY.lat=lat; MY.lon=lon;
  });
}

// 📦 ZIP LOAD
async function loadZIP(){

  let file=document.getElementById("zipInput").files[0];
  if(!file) return alert("Nincs ZIP!");

  let zip=await JSZip.loadAsync(file);

  // STOPS
  let stopsFile=Object.keys(zip.files).find(f=>f.includes("stops.txt"));
  let txt=await zip.file(stopsFile).async("string");

  let lines=txt.split("\n");
  let h=lines[0].split(",");

  let iId=h.indexOf("stop_id");
  let iName=h.indexOf("stop_name");
  let iLat=h.indexOf("stop_lat");
  let iLon=h.indexOf("stop_lon");

  STOPS=[];

  for(let i=1;i<lines.length;i++){
    let r=lines[i].split(",");
    if(r.length<4) continue;

    STOPS.push({
      id:r[iId],
      name:r[iName],
      lat:parseFloat(r[iLat]),
      lon:parseFloat(r[iLon])
    });
  }

  // STOP TIMES
  let stFile=Object.keys(zip.files).find(f=>f.includes("stop_times.txt"));
  if(stFile){
    let stxt=await zip.file(stFile).async("string");
    let slines=stxt.split("\n");

    STOP_TIMES=slines.slice(1).map(l=>{
      let r=l.split(",");
      return {
        trip_id:r[0],
        arrival:r[1],
        stop_id:r[3]
      };
    });
  }

  alert("✔ Betöltve: "+STOPS.length+" megálló");
}

// 🧠 SEARCH
function norm(t){
  return (t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function search(){
  let q=norm(document.getElementById("q").value);

  let res=STOPS.filter(s=>norm(s.name).includes(q)).slice(0,20);

  document.getElementById("out").innerHTML=
    res.map(s=>`
      <div class='card' onclick="selectStop('${s.id}')">
        <b>${s.name}</b><br>
        🆔 ${s.id}<br>
        📍 ${s.lat.toFixed(6)}, ${s.lon.toFixed(6)}
      </div>
    `).join("");
}

// 🎯 STOP PANEL
function selectStop(id){

  let deps=STOP_TIMES.filter(s=>s.stop_id===id).slice(0,10);

  if(!deps.length){
    document.getElementById("panel").innerHTML="<div class='card'>❌ Nincs menetrend adat</div>";
    return;
  }

  let now=new Date();

  document.getElementById("panel").innerHTML=
    deps.map(d=>{

      let delay=Math.floor(Math.random()*120-30);
      let color="white";
      let icon="⚪";

      if(delay<0){ color="red"; icon="🔴" }
      if(delay>30){ color="blue"; icon="🔵" }

      return `
        <div class='card ${color}'>
          🕒 ${d.arrival}<br>
          ⏱ ${delay>0?'+':''}${delay} sec<br>
          ${icon} VALÓS IDŐ
        </div>
      `;

    }).join("");
}

</script>

</body>
</html>
