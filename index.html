<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Stable Core Engine v1</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; font-family: Arial; }
#map { height:100vh; width:100%; }

.panel{
  position:absolute;
  top:10px;
  left:10px;
  z-index:9999;
  background:white;
  padding:10px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.3);
  font-size:13px;
  width:260px;
}

.btn{
  background:#1976d2;
  color:white;
  padding:6px;
  margin-top:6px;
  text-align:center;
  border-radius:6px;
  cursor:pointer;
}

.small{
  font-size:12px;
  color:#333;
}
</style>
</head>

<body>

<div class="panel">
<b>🌲 STABIL CORE ENGINE v1</b><br><br>

<div class="small">
✔ térkép alap<br>
✔ kattintható pontok<br>
✔ egyszerű számítások<br>
✔ stabil render<br>
</div>

<br>

<div id="info">Kattints egy pontra</div>

<div class="btn" onclick="reset()">RESET</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// =========================
// 1. MAP (MINIMÁL STABIL)
// =========================

const map = L.map('map').setView([47.52, 18.97], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

// =========================
// 2. FIX PONTOK (NINCS GTFS, NINCS OSM KÁOSZ)
// =========================

const points = [
  {name:"Normafa", lat:47.5005, lng:18.9990},
  {name:"Anna-rét", lat:47.5045, lng:18.9902},
  {name:"Csillebérc", lat:47.5098, lng:18.9795},
  {name:"Szépjuhászné", lat:47.5192, lng:18.9690}
];

// =========================
// 3. STATE
// =========================

let selected = [];
let lineLayer = null;

// =========================
// 4. DISTANCE (STABIL MATH)
// =========================

function distance(a,b){
  return map.distance([a.lat,a.lng],[b.lat,b.lng]);
}

// =========================
// 5. RESET
// =========================

function reset(){
  selected = [];
  document.getElementById("info").innerHTML = "Kattints egy pontra";
  if(lineLayer) map.removeLayer(lineLayer);
}

// =========================
// 6. RENDER POINTS
// =========================

points.forEach(p => {

  let marker = L.circleMarker([p.lat,p.lng],{
    radius:7,
    color:"#0d47a1",
    fillColor:"#2196f3",
    fillOpacity:1
  }).addTo(map);

  marker.bindPopup("📍 " + p.name);

  marker.on("click", () => {

    selected.push(p);

    if(selected.length === 1){
      document.getElementById("info").innerHTML =
        "📍 Start: " + p.name;
    }

    if(selected.length === 2){
      drawLine(selected[0], selected[1]);
      selected = [];
    }

  });

});

// =========================
// 7. DRAW SIMPLE ROUTE
// =========================

function drawLine(a,b){

  if(lineLayer) map.removeLayer(lineLayer);

  let dist = (distance(a,b)/1000).toFixed(2);

  lineLayer = L.polyline([
    [a.lat,a.lng],
    [b.lat,b.lng]
  ],{
    color:"red",
    weight:5
  }).addTo(map);

  map.fitBounds(lineLayer.getBounds());

  document.getElementById("info").innerHTML =
    "🧭 Útvonal:<br>" +
    a.name + " → " + b.name + "<br>" +
    "📏 " + dist + " km";

}

</script>

</body>
</html>
