<script>
"use strict";


/* =========================================================
   ATTILA KÖZLEKEDÉS – BKK VADÁSZ FIX14
   ========================================================= */

const VP_URL =
"https://go.bkk.hu/api/query/v1/ws/gtfs-rt/full/VehiclePositions.pb";

const TU_URL =
"https://go.bkk.hu/api/query/v1/ws/gtfs-rt/full/TripUpdates.pb";

const GTFS_URL =
"https://go.bkk.hu/api/static/v1/public-gtfs/budapest_gtfs.zip";

const FUTAR_URL =
"https://go.bkk.hu/api/query/v1/ws/otp/api/where/vehicles-for-location.json";

const TRIP_DETAILS_URL =
"https://go.bkk.hu/api/query/v1/ws/otp/api/where/trip-details.json";

const VEHICLE_FOR_TRIP_URL =
"https://go.bkk.hu/api/query/v1/ws/otp/api/where/vehicle-for-trip.json";

const PROTO_URL =
"https://raw.githubusercontent.com/google/transit/master/gtfs-realtime/proto/gtfs-realtime.proto";


/* ---------------------------------------------------------
   ÁLLAPOT
--------------------------------------------------------- */

let apiKey =
localStorage.getItem("attila_bkk_api_key") || "";

let vehicles = [];

let filteredVehicles = [];

let gtfsStopsById = new Map();

let gtfsRoutesById = new Map();

let gtfsTripsById = new Map();

let gtfsLoaded = false;

let protoRoot = null;

let autoTimer = null;

let gpsWatch = null;

let ownGPS = null;

let radiusMode = "all";

let lineAllMode = false;

let map = null;

let gpsMarker = null;

const vehicleMarkers = new Map();

const tripDelayMap = new Map();

const tripStopDelayMap = new Map();

const tripSeqDelayMap = new Map();

const metadataCache = new Map();

const vehicleTripCache = new Map();

const metadataTime = new Map();

const logBox =
document.getElementById("log");


/* ---------------------------------------------------------
   SEGÉD
--------------------------------------------------------- */

function log(msg){

  const now =
    new Date().toLocaleTimeString("hu-HU");

  logBox.textContent +=
    "[" + now + "] " + msg + "\n";

  logBox.scrollTop =
    logBox.scrollHeight;
}


function setBadge(id,text,state){

  const el =
    document.getElementById(id);

  el.textContent =
    text;

  el.className =
    "badge " + (state || "wait");
}


function esc(v){

  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function clean(v){

  if(
    v === null ||
    v === undefined ||
    v === ""
  ){
    return "NINCS ADAT";
  }

  return String(v);
}


function numberOrNull(v){

  if(
    v === null ||
    v === undefined ||
    v === ""
  ){
    return null;
  }

  const n =
    Number(v);

  return Number.isFinite(n)
    ? n
    : null;
}


function haversine(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const p1 =
    lat1 * Math.PI / 180;

  const p2 =
    lat2 * Math.PI / 180;

  const dp =
    (lat2-lat1) *
    Math.PI / 180;

  const dl =
    (lon2-lon1) *
    Math.PI / 180;

  const a =
    Math.sin(dp/2)**2 +
    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dl/2)**2;

  return 2 * R *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );
}


function formatDistance(m){

  if(
    m === null ||
    !Number.isFinite(m)
  ){
    return "NINCS ADAT";
  }

  if(m < 1000){
    return Math.round(m) + " m";
  }

  return (
    (m/1000).toFixed(2)
    .replace(".",",")
    + " km"
  );
}


function formatGPSDistance(m){

  if(
    m === null ||
    !Number.isFinite(m)
  ){
    return "NINCS ADAT";
  }

  return (
    (m/1000).toFixed(2)
    .replace(".",",")
    + " km"
  );
}


function formatDelay(seconds){

  if(
    seconds === null ||
    seconds === undefined ||
    !Number.isFinite(Number(seconds))
  ){
    return {
      text:"NINCS ADAT",
      cls:"no-data"
    };
  }

  const s =
    Math.round(Number(seconds));

  if(s === 0){

    return {
      text:"0:00",
      cls:"delay-zero"
    };

  }

  const abs =
    Math.abs(s);

  const min =
    Math.floor(abs/60);

  const sec =
    abs % 60;

  const text =
    min +
    ":" +
    String(sec).padStart(2,"0");

  if(s < 0){

    return {
      text:"SIETÉS −" + text,
      cls:"delay-early"
    };

  }

  return {
    text:"KÉSÉS +" + text,
    cls:"delay-late"
  };
}


/* ---------------------------------------------------------
   FETCH
--------------------------------------------------------- */

function buildUrl(base){

  const key =
    document.getElementById("apiKey").value.trim();

  if(!key){
    return base;
  }

  const sep =
    base.includes("?") ? "&" : "?";

  return (
    base +
    sep +
    "key=" +
    encodeURIComponent(key)
  );
}


async function fetchArrayBuffer(url){

  const headers = {
    "Accept":
      "application/octet-stream"
  };

  const key =
    document.getElementById("apiKey").value.trim();

  if(key){

    headers["X-API-Key"] =
      key;

  }

  const r =
    await fetch(
      buildUrl(url),
      {
        cache:"no-store",
        headers
      }
    );

  if(!r.ok){

    throw new Error(
      "HTTP " +
      r.status
    );

  }

  return await r.arrayBuffer();
}


async function fetchJSON(url){

  const headers = {
    "Accept":"application/json"
  };

  const key =
    document.getElementById("apiKey").value.trim();

  if(key){

    headers["X-API-Key"] =
      key;

  }

  const r =
    await fetch(
      buildUrl(url),
      {
        cache:"no-store",
        headers
      }
    );

  if(!r.ok){

    throw new Error(
      "HTTP " + r.status
    );

  }

  return await r.json();
}


/* ---------------------------------------------------------
   GTFS
--------------------------------------------------------- */

function parseCSV(text){

  const rows = [];

  let row = [];

  let cell = "";

  let quoted = false;

  for(let i=0;i<text.length;i++){

    const c =
      text[i];

    if(c === '"'){

      if(
        quoted &&
        text[i+1] === '"'
      ){

        cell += '"';
        i++;

      }else{

        quoted =
          !quoted;

      }

      continue;
    }

    if(c === "," && !quoted){

      row.push(cell);
      cell = "";
      continue;

    }

    if(
      (c === "\n" || c === "\r") &&
      !quoted
    ){

      if(c === "\r" &&
         text[i+1] === "\n"){

        i++;

      }

      row.push(cell);
      cell = "";

      if(row.some(x => x !== "")){
        rows.push(row);
      }

      row = [];

      continue;
    }

    cell += c;
  }

  if(cell !== "" || row.length){

    row.push(cell);

    if(row.some(x => x !== "")){
      rows.push(row);
    }

  }

  if(!rows.length){
    return [];
  }

  const head =
    rows[0];

  return rows
    .slice(1)
    .map(r => {

      const o = {};

      head.forEach(
        (h,i) =>
          o[h] =
          r[i] ?? ""
      );

      return o;

    });
}


async function loadGTFS(){

  try{

    log(
      "GTFS betöltés indul..."
    );

    const buf =
      await fetchArrayBuffer(
        GTFS_URL
      );

    const zip =
      await JSZip.loadAsync(buf);

    const stopsText =
      await zip
        .file("stops.txt")
        .async("text");

    const routesText =
      await zip
        .file("routes.txt")
        .async("text");

    const tripsFile =
      zip.file("trips.txt");

    const stops =
      parseCSV(stopsText);

    const routes =
      parseCSV(routesText);

    gtfsStopsById.clear();

    gtfsRoutesById.clear();

    gtfsTripsById.clear();

    for(const s of stops){

      if(
        s.stop_id &&
        s.stop_lat &&
        s.stop_lon
      ){

        gtfsStopsById.set(
          String(s.stop_id),
          {
            id:String(s.stop_id),
            name:s.stop_name || "",
            lat:Number(s.stop_lat),
            lon:Number(s.stop_lon)
          }
        );

      }

    }

    for(const r of routes){

      gtfsRoutesById.set(
        String(r.route_id),
        r
      );

    }

    if(tripsFile){

      const tripsText =
        await tripsFile.async("text");

      const trips =
        parseCSV(tripsText);

      for(const t of trips){

        if(t.trip_id){

          gtfsTripsById.set(
            String(t.trip_id),
            t
          );

        }

      }

    }

    gtfsLoaded = true;

    setBadge(
      "gtfsBadge",
      "GTFS: " +
      gtfsStopsById.size +
      " megálló / " +
      gtfsRoutesById.size +
      " járat",
      "ok"
    );

    log(
      "GTFS OK: " +
      gtfsStopsById.size +
      " megálló / " +
      gtfsRoutesById.size +
      " járat"
    );

  }catch(e){

    gtfsLoaded = false;

    setBadge(
      "gtfsBadge",
      "GTFS: HIBA",
      "err"
    );

    log(
      "GTFS HIBA: " +
      e.message
    );

  }

}


/* ---------------------------------------------------------
   PROTO
--------------------------------------------------------- */

async function loadProto(){

  if(protoRoot){
    return protoRoot;
  }

  log(
    "GTFS-RT proto betöltés..."
  );

  protoRoot =
    await protobuf
      .load(PROTO_URL);

  return protoRoot;
}


/* ---------------------------------------------------------
   TRIPUPDATE DELAY
--------------------------------------------------------- */

function parseTripUpdates(buffer){

  tripDelayMap.clear();

  tripStopDelayMap.clear();

  tripSeqDelayMap.clear();

  try{

    const root =
      protoRoot.lookupType(
        "transit_realtime.FeedMessage"
      );

    const feed =
      root.decode(
        new Uint8Array(buffer)
      );

    let count = 0;

    for(
      const entity
      of (feed.entity || [])
    ){

      const tu =
        entity.tripUpdate;

      if(!tu){
        continue;
      }

      const trip =
        tu.trip;

      const tripId =
        trip &&
        trip.tripId
          ? String(trip.tripId)
          : "";

      if(!tripId){
        continue;
      }

      for(
        const stu
        of (tu.stopTimeUpdate || [])
      ){

        let delay = null;

        if(
          stu.departure &&
          stu.departure.delay !== undefined
        ){

          delay =
            Number(
              stu.departure.delay
            );

        }else if(
          stu.arrival &&
          stu.arrival.delay !== undefined
        ){

          delay =
            Number(
              stu.arrival.delay
            );

        }

        if(
          delay === null ||
          !Number.isFinite(delay)
        ){
          continue;
        }

        const stopId =
          stu.stopId !== undefined
            ? String(stu.stopId)
            : "";

        const seq =
          stu.stopSequence !== undefined
            ? Number(stu.stopSequence)
            : null;

        if(stopId){

          tripStopDelayMap.set(
            tripId +
            "|" +
            stopId,
            delay
          );

        }

        if(
          seq !== null &&
          Number.isFinite(seq)
        ){

          tripSeqDelayMap.set(
            tripId +
            "|" +
            seq,
            delay
          );

        }

        /*
          Első valódi stop-time update
          csak tartalék.
          Nem gyártunk 0-t.
        */

        if(
          !tripDelayMap.has(tripId)
        ){

          tripDelayMap.set(
            tripId,
            delay
          );

        }

        count++;

      }

    }

    setBadge(
      "tuBadge",
      "TripUpdates: " +
      count,
      "ok"
    );

    log(
      "TripUpdates: " +
      count +
      " valódi stop-time delay"
    );

  }catch(e){

    setBadge(
      "tuBadge",
      "TripUpdates: HIBA",
      "err"
    );

    log(
      "TripUpdates HIBA: " +
      e.message
    );

  }
}


function getVehicleDelay(v){

  const tripId =
    cleanRaw(v.tripId);

  if(tripId === ""){
    return null;
  }

  const stopId =
    cleanRaw(v.stopId);

  if(stopId){

    const k =
      tripId +
      "|" +
      stopId;

    if(
      tripStopDelayMap.has(k)
    ){

      return tripStopDelayMap.get(k);

    }

  }

  const seq =
    numberOrNull(
      v.stopSequence
    );

  if(seq !== null){

    const k =
      tripId +
      "|" +
      seq;

    if(
      tripSeqDelayMap.has(k)
    ){

      return tripSeqDelayMap.get(k);

    }

  }

  if(
    tripDelayMap.has(tripId)
  ){

    return tripDelayMap.get(tripId);

  }

  return null;
}


function cleanRaw(v){

  if(
    v === null ||
    v === undefined ||
    v === "NINCS ADAT"
  ){
    return "";
  }

  return String(v);
}

/* ---------------------------------------------------------
   REKURZÍV METAADAT-FELDOLGOZÁS
--------------------------------------------------------- */

function walkObjects(value, callback, seen){

  if(
    value === null ||
    value === undefined
  ){
    return;
  }

  if(!seen){
    seen = new WeakSet();
  }

  if(
    typeof value === "object"
  ){

    if(seen.has(value)){
      return;
    }

    seen.add(value);

  }

  callback(value);

  if(Array.isArray(value)){

    for(
      const item of value
    ){

      walkObjects(
        item,
        callback,
        seen
      );

    }

    return;
  }

  if(typeof value === "object"){

    for(
      const key of Object.keys(value)
    ){

      walkObjects(
        value[key],
        callback,
        seen
      );

    }

  }

}


function firstExplicit(obj,names){

  let result = "";

  walkObjects(
    obj,
    x => {

      if(result){
        return;
      }

      if(
        !x ||
        typeof x !== "object" ||
        Array.isArray(x)
      ){
        return;
      }

      for(
        const n of names
      ){

        if(
          Object.prototype
            .hasOwnProperty
            .call(x,n)
        ){

          const v =
            x[n];

          if(
            v !== null &&
            v !== undefined &&
            String(v).trim() !== ""
          ){

            result =
              String(v);

            return;

          }

        }

      }

    }
  );

  return result;
}


/* ---------------------------------------------------------
   FUTÁR REFERENCES
--------------------------------------------------------- */

function collectReferenceVehicles(data){

  const map =
    new Map();

  walkObjects(
    data,
    obj => {

      if(
        !obj ||
        typeof obj !== "object" ||
        Array.isArray(obj)
      ){
        return;
      }

      /*
       * Csak olyan objektumot fogadunk el,
       * amelynek a szerkezete járműre utal.
       */

      const id =
        obj.id !== undefined
          ? String(obj.id)
          : "";

      if(!id){
        return;
      }

      const looksVehicle =
        obj.licensePlate !== undefined ||
        obj.licencePlate !== undefined ||
        obj.fleetNumber !== undefined ||
        obj.fleetNo !== undefined ||
        obj.vehicleType !== undefined ||
        obj.vehicleTypeId !== undefined ||
        obj.vehicleNumber !== undefined ||
        obj.vehicleNo !== undefined ||
        obj.forgalmi !== undefined ||
        obj.forgalmiSzam !== undefined;

      if(!looksVehicle){
        return;
      }

      map.set(
        id,
        obj
      );

    }
  );

  return map;
}


function mergeFutarVehicle(v, ref){

  if(!ref){
    return;
  }

  const forgalmi =
    firstExplicit(
      ref,
      [
        "forgalmi",
        "forgalmiSzam",
        "forgalmi_szam",
        "forgalmiNumber",
        "forgalmi_number",
        "fleetNumber",
        "fleetNo",
        "fleet_number",
        "vehicleNumber",
        "vehicle_number",
        "vehicleNo",
        "carNumber",
        "car_number",
        "circulationNumber",
        "circulation_number"
      ]
    );

  const type =
    firstExplicit(
      ref,
      [
        "vehicleType",
        "vehicle_type",
        "vehicleTypeName",
        "vehicle_type_name",
        "typeName",
        "type",
        "model"
      ]
    );

  const plate =
    firstExplicit(
      ref,
      [
        "licensePlate",
        "licencePlate",
        "plate",
        "registration"
      ]
    );

  if(
    forgalmi &&
    !v.forgalmi
  ){

    v.forgalmi =
      forgalmi;

  }

  if(
    type &&
    !v.vehicleType
  ){

    v.vehicleType =
      type;

  }

  if(
    plate &&
    !v.licensePlate
  ){

    v.licensePlate =
      plate;

  }

}

  try{

      await fetchJSON(

      collectReferenceVehicles(
        data

     * próbálunk explicit FUTÁR rekordot
     * találni.
     */

    walkObjects(
      data,
      obj => {

        if(
          !obj ||
          typeof obj !== "object" ||
          Array.isArray(obj)
        ){
          return;
        }

        const lat =
          numberOrNull(
            obj.lat ??
            obj.latitude
          );

        const lon =
          numberOrNull(
            obj.lon ??
            obj.lng ??
            obj.longitude
          );

        if(
          lat === null ||
          lon === null
        ){
          return;
        }

        const id =
          firstExplicit(
            obj,
            [
              "vehicleId",
              "vehicle_id"
            ]
          );

        ){

          mergeFutarVehicle(

              "vehicleNo",
              "carNumber",
              "car_number",
              "circulationNumber",
              "circulation_number"
            ]
          );

        const type =
          firstExplicit(
            obj,
            [
              "vehicleType",
              "vehicle_type",
              "vehicleTypeName",
              "vehicle_type_name",
              "typeName",
              "type",
              "model"
            ]
          );

        const direction =
          firstExplicit(
            obj,
            [
              "tripHeadsign",
              "trip_headsign",
              "headsign",
              "destination",
              "destinationName",
              "destination_name",
              "directionName",
              "direction_name",
              "direction"
            ]
          );

        if(
          forgalmi &&
          !target.forgalmi
        ){

          target.forgalmi =
            forgalmi;

        }

        if(
          type &&
          !target.vehicleType
        ){

          target.vehicleType =
            type;

        }

        if(
          direction &&
          !target.direction
        ){

          target.direction =
            direction;

          target.headsign =
            target.headsign ||
            direction;

        }

        const block =
          firstExplicit(
            obj,
            [
              "blockId",
              "block_id",
              "block",
              "blockCode",
              "block_code"
            ]
          );

        if(
          block &&
          !target.block
        ){

          target.block =
            block;

        }

      }
    );

    setBadge(
      "futarBadge",
      "FUTÁR: " +
      records,
      records
        ? "ok"
        : "wait"
    );

    log(
      "FUTÁR: " +
      records +
      " járműhöz talált valódi rekord"
    );

    return data;

  }catch(e){

    setBadge(
      "futarBadge",
      "FUTÁR: HIBA",
      "err"
    );

    log(
      "FUTÁR HIBA: " +
      e.message
    );

    return null;

  }

async function fetchTripMetadata(tripId){

  if(!tripId){
    return null;
  }

  const now =
    Date.now();

  if(
    metadataCache.has(tripId) &&
    now -
    (metadataTime.get(tripId)||0)
    < 60000
  ){

    return metadataCache.get(tripId);

  }

  try{

    const url =
      TRIP_DETAILS_URL +
      "?tripId=" +
      encodeURIComponent(tripId);

    const data =
      await fetchJSON(url);

    metadataCache.set(
      tripId,
      data
    );

    metadataTime.set(
      tripId,
      now
    );

    return data;

  }catch(e){

    /*
     * Nem írunk hibás adatot a járműre.
     */

    return null;

  }

}


async function fetchVehicleTripMetadata(
  tripId,
  vehicleId
){

  const key =
    tripId +
    "|" +
    vehicleId;

  if(
    vehicleTripCache.has(key)
  ){

    return vehicleTripCache.get(key);

  }

  try{

    let url =
      VEHICLE_FOR_TRIP_URL +
      "?tripId=" +
      encodeURIComponent(tripId);

    const data =
      await fetchJSON(url);

    vehicleTripCache.set(
      key,
      data
    );

    return data;

  }catch(e){

    return null;

  }

}

              "destination",
              "destinationName",
              "destination_name",
              "directionName",
              "direction_name",

          );

   STOP ADAT
--------------------------------------------------------- */

function getStop(v){

  if(!v.stopId){
    return null;
  }

  return gtfsStopsById.get(
    String(v.stopId)
  ) || null;
}


function getStopDistance(v){

  const stop =
    getStop(v);

  if(!stop){
    return null;
  }

  return haversine(
    v.lat,
    v.lon,
    stop.lat,
    stop.lon
  );

}


function getOwnGPSDistance(v){

  if(!ownGPS){
    return null;
  }

  return haversine(
    ownGPS.lat,
    ownGPS.lon,
    v.lat,
    v.lon
  );

}


/* ---------------------------------------------------------
   JÁRAT
--------------------------------------------------------- */

function getRouteDisplay(v){

  const route =
    gtfsRoutesById.get(
      String(v.routeId)
    );

  if(
    route &&
    route.route_short_name
  ){

    return route.route_short_name;

  }

  if(
    route &&
    route.route_long_name
  ){

    return route.route_long_name;

  }

  /*
   * Csak valós realtime route_id.
   */

  return v.routeId || "NINCS ADAT";
}


function getRouteClass(v){

  const r =
    String(v.routeId || "")
      .toLowerCase();

  if(
    r.includes("hev") ||
    r.startsWith("h")
  ){

    return "hev";

  }

  return "bkk";
}

function renderMap(){

  if(!map){
    return;
  }

  const activeIds =
    new Set(
      filteredVehicles
        .map(
          v =>
            String(
              v.vehicleId ||
              v.entityId ||
              v.id
            )
        )
    );

   * Régi marker törlése,
   * ha már nem szerepel a jelenlegi listában.
   */

  for(
    const [id,marker]
    of vehicleMarkers
  ){

    if(
      !activeIds.has(id)
    ){

      map.removeLayer(marker);

      vehicleMarkers.delete(id);

    }

  }

  /*
   * MINDEN jelenleg megjelenített
   * jármű bekerül a térképre.
   */

  for(
    const v
    of filteredVehicles
  ){

    if(
      !Number.isFinite(v.lat) ||
      !Number.isFinite(v.lon)
    ){
      continue;
    }

    const id =
      String(
        v.vehicleId ||
        v.entityId ||
        v.id
      );

    const route =
      getRouteDisplay(v);

    const routeClass =
      getRouteClass(v);

    const delay =
      formatDelay(
        v.delay
      );

    let delayClass = "";

    if(
      delay.cls ===
      "delay-late"
    ){

      delayClass =
        "delay";

    }else if(
      delay.cls ===
      "delay-early"
    ){

      delayClass =
        "early";

    }else if(
      delay.cls ===
      "delay-zero"
    ){

      delayClass =
        "zero";

    }

    const html =
      '<div class="map-marker ' +
      routeClass +
      ' ' +
      delayClass +
      '">' +
      esc(route) +
      '</div>';

    const icon =
      L.divIcon({

        className:"",
        html,
        iconSize:[40,40],
        iconAnchor:[20,20],
        popupAnchor:[0,-20]

      });

    let marker =
      vehicleMarkers.get(id);

    if(!marker){

      marker =
        L.marker(
          [v.lat,v.lon],
          {icon}
        ).addTo(map);

      vehicleMarkers.set(
        id,
        marker
      );

    }else{

      marker.setLatLng(
        [v.lat,v.lon]
      );

      marker.setIcon(
        icon
      );

    }

    const stop =
      getStop(v);

    const popup =
      "<b>" +
      esc(route) +
      "</b><br>" +

      "Rendszám: " +
      esc(clean(v.licensePlate)) +
      "<br>" +

      "Jármű ID: " +
      esc(clean(v.vehicleId)) +
      "<br>" +

      "Megálló: " +
      esc(
        stop
          ? stop.name
          : "NINCS ADAT"
      ) +
      "<br>" +

      "STOP ID: " +
      esc(clean(v.stopId)) +
      "<br>" +

      "Jármű–megálló: " +
      esc(
        formatDistance(
          getStopDistance(v)
        )
      ) +
      "<br>" +

      "Irány: " +
      esc(
        clean(
          v.direction ||
          v.headsign
        )
      ) +
      "<br>" +

      "Késés: " +
      '<span class="' +
      delay.cls +
      '">' +
      esc(delay.text) +
      "</span>";

    marker.bindPopup(
      popup
    );

  }

  document.getElementById(
    "mapCount"
  ).textContent =
    "Térképen: " +
    filteredVehicles.filter(
      v =>
        Number.isFinite(v.lat) &&
        Number.isFinite(v.lon)
    ).length;

}

/* ---------------------------------------------------------
   SZŰRÉS
--------------------------------------------------------- */

function applyFilters(){

  const universal =
    document
      .getElementById(
        "universalSearch"
      )
      .value
      .trim()
      .toLowerCase();

  const route =
    document
      .getElementById(
        "routeSearch"
      )
      .value
      .trim()
      .toLowerCase();

  const plate =
    document
      .getElementById(
        "plateSearch"
      )
      .value
      .trim()
      .toLowerCase();


  filteredVehicles =
    vehicles.filter(v => {

      const routeText =
        getRouteDisplay(v)
          .toLowerCase();

      const plateText =
        String(
          v.licensePlate || ""
        ).toLowerCase();

      const idText =
        String(
          v.vehicleId || ""
        ).toLowerCase();

      const tripText =
        String(
          v.tripId || ""
        ).toLowerCase();

      const stop =
        getStop(v);

      const stopText =
        stop
          ? String(stop.name)
              .toLowerCase()
          : "";

      if(
        universal &&
        !(
          routeText.includes(universal) ||
          plateText.includes(universal) ||
          idText.includes(universal) ||
          tripText.includes(universal) ||
          stopText.includes(universal)
        )
      ){

        return false;

      }


      if(
        route &&
        !routeText.includes(route)
      ){

        return false;

      }


      if(
        plate &&
        !plateText.includes(plate)
      ){

        return false;

      }


      if(
        radiusMode !== "all" &&
        ownGPS
      ){

        const d =
          getOwnGPSDistance(v);

        if(
          d === null ||
          d >
          Number(radiusMode) * 1000
        ){

          return false;

        }

      }


      return true;

    });


  document.getElementById(
    "vehicleCount"
  ).textContent =
    "Járművek: " +
    filteredVehicles.length;


  document.getElementById(
    "vehicleList"
  ).innerHTML =
    filteredVehicles
      .map(vehicleCard)
      .join("");


  renderMap();

}


/* ---------------------------------------------------------
   FRISSÍTÉS
--------------------------------------------------------- */

let refreshing = false;

async function refreshAll(){

  if(refreshing){
    return;
  }

  refreshing = true;

  try{

    log(
      "Realtime frissítés indul..."
    );

    /*
     * FONTOS SORREND:
     *
     * 1. VehiclePositions
     * 2. TripUpdates
     * 3. FUTÁR
     * 4. Meta
     */

    const vpPromise =
      fetchVehiclePositions();

    const tuPromise =
      (async() => {

        try{

          await loadProto();

          const buf =
            await fetchArrayBuffer(
              TU_URL
            );

          parseTripUpdates(
            buf
          );

        }catch(e){

          setBadge(
            "tuBadge",
            "TripUpdates: HIBA",
            "err"
          );

          log(
            "TripUpdates HIBA: " +
            e.message
          );

        }

      })();


    await Promise.all([
      vpPromise,
      tuPromise
    ]);


    for(
      const v
      of vehicles
    ){

      v.delay =
        getVehicleDelay(v);

    }


    await fetchFutar();

    /*
     * GTFS + FUTÁR után metadata.
     */

    await enrichMetadata();


    for(
      const v
      of vehicles
    ){

      v.delay =
        getVehicleDelay(v);

      applyGTFSMetadata(v);

    }


    applyFilters();

    log(
      "FIX14 frissítés kész – " +
      vehicles.length +
      " jármű."
    );

  }finally{

    refreshing = false;

  }

}


/* ---------------------------------------------------------
   GPS
--------------------------------------------------------- */

function updateGPS(lat,lon){

  ownGPS = {
    lat,
    lon
  };

  setBadge(
    "gpsBadge",
    "GPS: OK",
    "ok"
  );

  if(gpsMarker){

    gpsMarker.setLatLng(
      [lat,lon]
    );

  }else{

    const icon =
      L.divIcon({

        className:"",
        html:
          '<div class="gps-marker"></div>',

        iconSize:[20,20],
        iconAnchor:[10,10]

      });

    gpsMarker =
      L.marker(
        [lat,lon],
        {icon}
      ).addTo(map);

  }

  applyFilters();

}


function startGPS(){

  if(
    !navigator.geolocation
  ){

    setBadge(
      "gpsBadge",
      "GPS: NEM ELÉRHETŐ",
      "err"
    );

    log(
      "A böngésző nem támogatja a GPS-t."
    );

    return;

  }

  if(gpsWatch !== null){

    navigator.geolocation.clearWatch(
      gpsWatch
    );

  }

  gpsWatch =
    navigator.geolocation.watchPosition(

      pos => {

        updateGPS(
          pos.coords.latitude,
          pos.coords.longitude
        );

      },

      err => {

        setBadge(
          "gpsBadge",
          "GPS: HIBA",
          "err"
        );

        log(
          "GPS HIBA: " +
          err.message
        );

      },

      {
        enableHighAccuracy:true,
        maximumAge:5000,
        timeout:15000
      }

    );

}


/* ---------------------------------------------------------
   MEGÁLLÓKERESŐ
--------------------------------------------------------- */

let stopSearchTimer = null;


function searchStops(){

  const q =
    document
      .getElementById(
        "stopSearch"
      )
      .value
      .trim()
      .toLowerCase();

  const box =
    document.getElementById(
      "stopResults"
    );

  if(q.length < 2){

    box.innerHTML = "";

    return;

  }

  const found = [];

  for(
    const stop
    of gtfsStopsById.values()
  ){

    if(
      String(stop.name)
        .toLowerCase()
        .includes(q) ||

      String(stop.id)
        .toLowerCase()
        .includes(q)
    ){

      let distance = null;

      if(ownGPS){

        distance =
          haversine(
            ownGPS.lat,
            ownGPS.lon,
            stop.lat,
            stop.lon
          );

      }

      found.push({
        stop,
        distance
      });

    }

    if(found.length >= 30){
      break;
    }

  }


  found.sort(
    (a,b) => {

      if(
        a.distance === null
      ){
        return 0;
      }

      if(
        b.distance === null
      ){
        return 0;
      }

      return (
        a.distance -
        b.distance
      );

    }
  );


  box.innerHTML =
    found.map(
      x => `

      <div class="stop-card">

        <div class="stop-name">
          ${esc(x.stop.name)}
        </div>

        <div>
          GTFS:
          <b>${esc(x.stop.id)}</b>
        </div>

        <div>
          GPS távolság:
          <b>
            ${esc(
              formatDistance(
                x.distance
              )
            )}
          </b>
        </div>

      </div>

      `
    ).join("");

}


/* ---------------------------------------------------------
   MAP GOMBOK
--------------------------------------------------------- */

function showGPSOnMap(){

  if(!ownGPS){
    startGPS();
    return;
  }

  map.setView(
    [
      ownGPS.lat,
      ownGPS.lon
    ],
    14
  );

}


function showVehiclesOnMap(){

  const valid =
    filteredVehicles.filter(
      v =>
        Number.isFinite(v.lat) &&
        Number.isFinite(v.lon)
    );

  if(!valid.length){
    return;
  }

  const bounds =
    L.latLngBounds(
      valid.map(
        v => [v.lat,v.lon]
      )
    );

  map.fitBounds(
    bounds,
    {
      padding:[35,35]
    }
  );

}


function fullscreenMap(){

  const mapEl =
    document.getElementById(
      "map"
    );

  mapEl.classList.add(
    "fullscreen-map"
  );

  document.getElementById(
    "mapBack"
  ).style.display =
    "block";

  setTimeout(
    () => map.invalidateSize(),
    150
  );

}


function exitFullscreenMap(){

  const mapEl =
    document.getElementById(
      "map"
    );

  mapEl.classList.remove(
    "fullscreen-map"
  );

  document.getElementById(
    "mapBack"
  ).style.display =
    "none";

  setTimeout(
    () => map.invalidateSize(),
    150
  );

}
