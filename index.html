<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<title>ATTILA DISPATCHER V2.1 PATCH</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/rbush@3.0.1/rbush.min.js"></script>

<style>
body { margin:0; font-family:Arial; background:#0b1220; color:white; }
#map { height:70vh; }
.panel { padding:10px; background:#111a2e; }
button { padding:8px; margin:5px; }
.legend span { margin-right:10px; }
</style>
</head>

<body>

<div class="panel">
<h2>🚆 ATTILA DISPATCHER V2.1 PATCH</h2>

<input type="file" id="file">
<button onclick="load()">GTFS LOAD</button>
<button onclick="build()">BUILD ENGINE</button>
<button onclick="toggleDebug()">DEBUG TOGGLE</button>

<div class="legend">
<span style="color:cyan">● BKK</span>
<span style="color:green">● VOLÁN</span>
<span style="color:orange">● HÉV</span>
<span style="color:yellow">● TOURIST</span>
</div>

<span id="status">READY</span>
</div>

<div id="map"></div>

<script>

// ---------------- MAP ----------------
const map = L.map('map').setView([47.5, 19.0], 10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'OSM'
}).addTo(map);

// ---------------- DATA ----------------
let stops=[];
let tree=new RBush();
let nodes=[];
let debug=false;

// ---------------- FEED TYPE DETECTION ----------------
function detectFeed(s){
    let name=(s.stop_name||"").toLowerCase();

    if(name.includes("hév")||name.includes("szentendre")) return "HEV";
    if(name.includes("volán")||name.includes("busz")) return "VOLAN";
    if(name.includes("vasút")) return "MAV";
    return "BKK";
}

// ---------------- LOAD ----------------
function load(){
    const f=document.getElementById("file").files[0];
    if(!f) return alert("nincs file");

    Papa.parse(f,{
        header:true,
        complete:(r)=>{

            stops=r.data
            .filter(s=>s.stop_lat&&s.stop_lon)
            .map(s=>({
                id:s.stop_id,
                name:s.stop_name,
                lat:+s.stop_lat,
                lon:+s.stop_lon,
                feed:detectFeed(s)
            }));

            set("loaded "+stops.length);
            index();
        }
    });
}

// ---------------- INDEX ----------------
function index(){
    tree.clear();

    stops.forEach(s=>{
        tree.insert({
            minX:s.lon,
            minY:s.lat,
            maxX:s.lon,
            maxY:s.lat,
            data:s
        });
    });

    set("indexed");
}

// ---------------- DIST ----------------
function dist(a,b){
    const R=6371e3;
    const to=x=>x*Math.PI/180;

    let dLat=to(b.lat-a.lat);
    let dLon=to(b.lon-a.lon);

    let A=to(a.lat),B=to(b.lat);

    let x=Math.sin(dLat/2)**2+
          Math.cos(A)*Math.cos(B)*Math.sin(dLon/2)**2;

    return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ---------------- SCORE ----------------
function score(a,b){

    let d=dist(a,b);

    let geo=d<60?1:d<200?0.7:0;

    let na=(a.name||"").toLowerCase();
    let nb=(b.name||"").toLowerCase();

    let name=(na.includes(nb)||nb.includes(na))?0.8:0.4;

    return geo*0.7+name*0.3;
}

// ---------------- GLOBAL ID FIX ----------------
function gid(s){
    return s.feed+":"+s.id;
}

// ---------------- GET NODE ----------------
function get(s){

    // 🔥 HÉV BOOST FIX (Szentendre miatt)
    let range = (s.feed==="HEV") ? 0.02 : 0.01;

    let near=tree.search({
        minX:s.lon-range,
        minY:s.lat-range,
        maxX:s.lon+range,
        maxY:s.lat+range
    });

    let best=null,bestS=0;

    near.forEach(n=>{
        let sc=score(s,n.data);
        if(sc>bestS){
            bestS=sc;
            best=n.data;
        }
    });

    if(best && bestS>0.85){
        let node=nodes.find(n=>n.base===gid(best));

        if(!node){
            node={
                id:"GLOBAL_"+gid(s),
                base:gid(best),
                name:s.name,
                lat:s.lat,
                lon:s.lon,
                sources:[]
            };
            nodes.push(node);
        }

        node.sources.push(s);
        return node;
    }

    let node={
        id:"GLOBAL_"+gid(s),
        base:gid(s),
        name:s.name,
        lat:s.lat,
        lon:s.lon,
        sources:[s]
    };

    nodes.push(node);
    return node;
}

// ---------------- BUILD ----------------
function build(){

    nodes=[];

    stops.forEach(s=>get(s));

    draw();
    set("engine ready: "+nodes.length);
}

// ---------------- DRAW ----------------
function draw(){

    nodes.forEach(n=>{

        let color="cyan";

        let f=n.sources[0].feed;

        if(f==="VOLAN") color="green";
        if(f==="HEV") color="orange";
        if(f==="TOURIST") color="yellow";

        L.circleMarker([n.lat,n.lon],{
            radius:6,
            color:color
        }).addTo(map)
        .bindPopup(`
            <b>${n.name}</b><br>
            ${n.id}<br>
            sources: ${n.sources.length}<br>
            feed: ${f}
        `);
    });
}

// ---------------- DEBUG ----------------
function toggleDebug(){
    debug=!debug;
    alert("DEBUG: "+debug);
}

// ---------------- STATUS ----------------
function set(t){
    document.getElementById("status").innerText=t;
}

</script>

</body>
</html>
