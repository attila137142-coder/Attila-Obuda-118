<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>ATTILA DISPATCHER V8 – REAL CORE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{margin:0;display:flex;font-family:Arial;}
#sidebar{width:360px;border-right:1px solid #ccc;overflow:auto;}
#map{flex:1;height:100vh;}

.matrix{
  background:black;
  color:#00ff66;
  font-family:monospace;
  padding:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #003300;
  padding:5px;
}

.vehicle{
  border-bottom:1px solid #003300;
  padding:6px;
  font-size:13px;
}

.blink{animation:blink 1s infinite;}
@keyframes blink{50%{opacity:0.2;}}
</style>
</head>

<body>

<div id="sidebar">
<h3>🟢 DISPATCH V8</h3>
<input id="search" placeholder="Keresés...">
<div id="list"></div>
<div id="panel">Válassz megállót</div>
</div>

<div id="map"></div>

<script>

// ===== MAP =====
const map = L.map('map').setView([47.6,19.05],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// ===== GPS =====
let userPos=null;
navigator.geolocation.getCurrentPosition(p=>{
  userPos={lat:p.coords.latitude,lon:p.coords.longitude};
});

// ===== DIST =====
function distance(a,b,c,d){
  const R=6371000;
  const toRad=x=>x*Math.PI/180;
  const dLat=toRad(c-a);
  const dLon=toRad(d-b);
  const x=Math.sin(dLat/2)**2+
    Math.cos(toRad(a))*Math.cos(toRad(c))*
    Math.sin(dLon/2)**2;
  return R*(2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)));
}

// ===== STOPS =====
const STOPS=[
 {name:"Békásmegyer",lat:47.598,lon:19.054},
 {name:"Flórián tér",lat:47.542,lon:19.042}
];

// ===== GTFS STATIC =====
let GTFS={stops:[],trips:[],stop_times:[]};

// ===== GTFS-RT =====
let GTFS_RT={
  vehicles:[],   // position
  updates:{}     // trip_id -> delay
};

// ===== CSV =====
function parseCSV(t){
  const r=t.split("\n").map(x=>x.trim()).filter(Boolean);
  const h=r[0].split(",");
  return r.slice(1).map(l=>{
    const c=l.split(",");
    let o={};
    h.forEach((k,i)=>o[k]=c[i]);
    return o;
  });
}

// ===== LOAD STATIC =====
async function loadGTFS(){
  try{
    const [a,b,c]=await Promise.all([
      fetch("stops.txt").then(r=>r.text()),
      fetch("trips.txt").then(r=>r.text()),
      fetch("stop_times.txt").then(r=>r.text())
    ]);
    GTFS.stops=parseCSV(a);
    GTFS.trips=parseCSV(b);
    GTFS.stop_times=parseCSV(c);
  }catch(e){
    console.log("GTFS fail",e);
  }
}

// ===== LOAD REALTIME (PROXY NEEDED) =====
async function loadRT(){
  try{
    const res=await fetch("/api/gtfsrt"); // <-- proxy!
    const data=await res.json();

    GTFS_RT.vehicles=data.vehicles || [];
    GTFS_RT.updates=data.updates || {};

  }catch(e){
    console.log("RT fallback");
  }
}

// ===== FIND STOP =====
function findStopId(stop){
  const s=GTFS.stops.find(x=>
    x.stop_name.toLowerCase().includes(stop.name.toLowerCase())
  );
  return s?.stop_id;
}

// ===== DEPARTURES =====
function getDeps(stop){

  const id=findStopId(stop);
  if(!id) return [];

  return GTFS.stop_times
    .filter(x=>x.stop_id===id)
    .slice(0,30)
    .map(st=>{
      const trip=GTFS.trips.find(t=>t.trip_id===st.trip_id);
      const delay=GTFS_RT.updates[st.trip_id]||0;

      return {
        route:trip?.route_id||"?",
        headsign:trip?.trip_headsign||"?",
        time:st.departure_time,
        delay:delay,
        trip_id:st.trip_id
      };
    })
    .slice(0,15);
}

// ===== VEHICLE BIND =====
function bindVehicles(stop){

  return GTFS_RT.vehicles.map(v=>{

    const d=distance(v.lat,v.lon,stop.lat,stop.lon);

    return {
      ...v,
      dist:d
    };

  }).sort((a,b)=>a.dist-b.dist).slice(0,5);
}

// ===== MATRIX =====
function showMatrix(stop){

 let html=`<div class="matrix">`;
 html+=`<h3>${stop.name}</h3>`;

 const deps=getDeps(stop);

 if(deps.length){

  deps.forEach((d,i)=>{

    html+=`
    <div class="row">
      <div>${d.route}</div>
      <div>${d.headsign}</div>
      <div class="${i<2?'blink':''}">
        ${d.time}
      </div>
      <div>${d.delay>0?`+${d.delay}`:d.delay}</div>
    </div>`;
  });

 }else{
  html+=`⚠️ nincs GTFS adat`;
 }

 html+=`<hr><b>🚍 JÁRMŰVEK</b>`;

 const veh=bindVehicles(stop);

 veh.forEach(v=>{
  html+=`
  <div class="vehicle">
    ${v.line||"?"} | ${v.id||"?"}<br>
    📏 ${Math.round(v.dist)} m
  </div>`;
 });

 html+=`</div>`;
 document.getElementById("panel").innerHTML=html;
}

// ===== INIT =====
loadGTFS();
setInterval(loadRT,5000);

// ===== LIST =====
function render(){
 const c=document.getElementById("list");
 STOPS.forEach(s=>{
  const d=document.createElement("div");
  d.innerHTML="📍 "+s.name;
  d.onclick=()=>showMatrix(s);
  c.appendChild(d);
 });
}
render();

// ===== MAP =====
STOPS.forEach(s=>{
 L.marker([s.lat,s.lon]).addTo(map)
  .on("click",()=>showMatrix(s));
});

</script>

</body>
</html>
