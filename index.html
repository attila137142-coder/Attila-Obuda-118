<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V5 PRO+ MAP</title>

<!-- Leaflet MAP -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#05070d;
  color:#00ffcc;
}

/* HEADER */
header{
  padding:12px;
  text-align:center;
  background:#0b1220;
  border-bottom:2px solid #00ffcc;
  font-weight:bold;
}

/* LAYOUT */
.container{
  display:grid;
  grid-template-columns: 1fr 2fr 1fr;
  height: calc(100vh - 50px);
}

/* PANELS */
.panel{
  padding:10px;
  background:#0b1220;
  border-right:1px solid #00ffcc33;
  overflow:auto;
}

/* MAP */
#map{
  height:100%;
  width:100%;
}

/* INPUT */
input{
  width:100%;
  padding:10px;
  background:#05070d;
  border:1px solid #00ffcc;
  color:#00ffcc;
  margin-bottom:10px;
}

/* BUTTON */
button{
  width:100%;
  padding:10px;
  background:#00ffcc;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

/* TAGS */
.tag{
  padding:2px 6px;
  font-size:11px;
  border-radius:4px;
}

.ok{background:green;color:#fff;}
.warn{background:orange;color:#000;}
.err{background:red;color:#fff;}
</style>
</head>

<body>

<header>🚇 FUTÁR V5 PRO+ MAP SYSTEM (GTFS READY)</header>

<div class="container">

  <!-- LEFT -->
  <div class="panel">
    <h3>🚏 Stop Search</h3>
    <input placeholder="Stop name...">
    <button>SEARCH</button>

    <hr style="border-color:#00ffcc33;">

    <p><b>GTFS Mode:</b> READY</p>
    <p>Dataset: DEMO</p>

    <hr>

    <p>Example stops:</p>
    <ul>
      <li>Deák Ferenc tér</li>
      <li>Kálvin tér</li>
      <li>Nyugati</li>
    </ul>
  </div>

  <!-- MAP -->
  <div id="map"></div>

  <!-- RIGHT -->
  <div class="panel">
    <h3>🚍 Live Vehicles</h3>

    <p>Bus 16 → moving</p>
    <p>Bus 105 → delayed</p>
    <p>Tram 4-6 → normal</p>

    <hr style="border-color:#00ffcc33;">

    <h3>📡 System</h3>
    <p>🟢 Online</p>
    <p>🛰️ Tracking active</p>
    <p>⚙️ GTFS engine ready</p>
  </div>

</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// MAP INIT (Budapest center)
const map = L.map('map').setView([47.4979, 19.0402], 13);

// Tile layer (OSM)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: 'FUTÁR V5 PRO+'
}).addTo(map);

// Demo stops (GTFS-ready structure)
const stops = [
  {name:"Deák Ferenc tér", lat:47.4979, lng:19.0500},
  {name:"Kálvin tér", lat:47.4890, lng:19.0610},
  {name:"Nyugati pályaudvar", lat:47.5050, lng:19.0620}
];

// Add markers
stops.forEach(s=>{
  L.marker([s.lat, s.lng])
    .addTo(map)
    .bindPopup("🚏 " + s.name);
});
</script>

</body>
</html>
