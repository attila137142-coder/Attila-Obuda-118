/* =========================================================

function log(msg){

  const line =
    "[" +
    new Date().toLocaleTimeString("hu-HU") +
    "] " +
    msg;

  console.log(line);

/* =========================================================
   SEGÉDFÜGGVÉNYEK
   ========================================================= */

function text(v){

  if(v === null || v === undefined)
    return "";

  return String(v).trim();
}

function validValue(v){

  if(v === null || v === undefined)
    return false;

  const s = String(v).trim();

  if(!s)
    return false;

  if(
    s === "null" ||
    s === "undefined" ||
    s === "N/A" ||
    s === "NA"
  )
    return false;

  return true;
}

function display(v){

  return validValue(v)
    ? String(v)
    : "NINCS ADAT";
}

function normalizeId(v){

  if(!validValue(v))
    return "";

  return String(v)
    .trim()
    .replace(/^BKK[_:]/i,"")
    .toLowerCase();
}

function numberValue(v){

  const n = Number(v);

  return Number.isFinite(n)
    ? n
    : null;
}

function firstField(obj, fields){

  if(!obj || typeof obj !== "object")
    return null;

  for(const f of fields){

    if(validValue(obj[f]))
      return obj[f];
  }

  return null;
}

function deepFindAll(obj, callback, depth=0, maxDepth=7){

  if(!obj || depth > maxDepth)
    return;

  if(typeof obj !== "object")
    return;

  callback(obj);

  if(Array.isArray(obj)){

    for(const item of obj)
      deepFindAll(item, callback, depth+1, maxDepth);

    return;
  }

  for(const key of Object.keys(obj)){

    const v = obj[key];

    if(v && typeof v === "object")
      deepFindAll(v, callback, depth+1, maxDepth);
  }
}

/* =========================================================
   BKK AUTH URL
   ========================================================= */

function withApiKey(url, key){

  if(!key)
    return url;

  const separator =
    url.includes("?")
      ? "&"
      : "?";

  return (
    url +
    separator +
    "key=" +
    encodeURIComponent(key)
  );
}

/* =========================================================
   BKK FETCH
   FONTOS:
   - először query-paraméteres hitelesítés
   - 401 esetén x-api-key fejléc
   - nincs API kulcs esetén nincs hamis fallback
   ========================================================= */

async function bkkFetch(
  url,
  options={}
){

  const key =
    getApiKey() ||
    localStorage.getItem(
      STORAGE_KEY
    ) ||
    "";

  if(!key){

    throw new Error(
      "NINCS BKK API-KULCS"
    );
  }

  const queryUrl =
    withApiKey(
      url,
      key
    );

  /* -------------------------------------------------------
     1. QUERY PARAMÉTER
     ------------------------------------------------------- */

  try{

    const r =
      await fetch(
        queryUrl,
        {
          ...options,
          headers:{
            ...(options.headers || {}),
            "Accept":
              options.accept ||
              "*/*"
          },
          cache:"no-store"
        }
      );

    if(r.ok){

      log(
        "BKK hitelesítés OK: query ?key=..."
      );

      return r;
    }

    if(r.status !== 401){

      throw new Error(
        "HTTP " +
        r.status
      );
    }

    log(
      "BKK query hitelesítés 401 → x-api-key próba."
    );

  }catch(err){

    if(
      err &&
      err.message &&
      err.message.includes("HTTP")
    ){
      throw err;
    }

    log(
      "BKK query fetch hiba: " +
      err.message
    );

  }

  /* -------------------------------------------------------
     2. X-API-KEY HEADER
     ------------------------------------------------------- */

  const r2 =
    await fetch(
      url,
      {
        ...options,
        headers:{
          ...(options.headers || {}),
          "Accept":
            options.accept ||
            "*/*",
          "x-api-key":
            key,
          "X-API-Key":
            key
        },
        cache:"no-store"
      }
    );

  if(!r2.ok){

    throw new Error(
      "HTTP " +
      r2.status
    );
  }

  log(
    "BKK hitelesítés OK: x-api-key header."
  );

  return r2;
}

/* =========================================================
   PROTO
   ========================================================= */

async function loadProto(){

  if(protoRoot)
    return protoRoot;

  const response =
    await fetch(
      PROTO_URL,
      {
        cache:"force-cache"
      }
    );

  if(!response.ok){

    throw new Error(
      "GTFS-RT proto HTTP " +
      response.status
    );
  }

  const protoText =
    await response.text();

  protoRoot =
    protobuf.parse(
      protoText
    ).root;

  return protoRoot;
}

/* =========================================================
   GTFS-RT DECODE
   ========================================================= */

async function decodeGtfsRt(
  arrayBuffer
){

  const root =
    await loadProto();

  const FeedMessage =
    root.lookupType(
      "transit_realtime.FeedMessage"
    );

  const bytes =
    new Uint8Array(
      arrayBuffer
    );

  return FeedMessage.decode(
    bytes
  );
}

/* =========================================================
   VALUE / OBJECT NORMALIZÁLÁS
   ========================================================= */

function plain(v){

  if(v === null || v === undefined)
    return null;

  if(
    typeof v === "string" ||
    typeof v === "number" ||
    typeof v === "boolean"
  )
    return v;

  if(
    typeof v.toObject === "function"
  ){

    try{

      return v.toObject({
        longs:Number,
        enums:String,
        defaults:false
      });

    }catch(e){}
  }

  if(Array.isArray(v))
    return v.map(plain);

  if(typeof v === "object"){

    const o={};

    for(const k of Object.keys(v))
      o[k]=plain(v[k]);

    return o;
  }

  return v;
}

/* =========================================================
   VEHICLE POSITIONS
   ========================================================= */

function parseVehicleFeed(
  feed
){

  const result=[];

  for(const entity of feed.entity || []){

    const vp =
      entity.vehicle;

    if(!vp)
      continue;

    const vd =
      vp.vehicle || {};

    const trip =
      vp.trip || {};

    const pos =
      vp.position || {};

    const vehicleId =
      text(
        vd.id ||
        vd.label
      );

    const tripId =
      text(
        trip.tripId
      );

    const routeId =
      text(
        trip.routeId
      );

    const stopId =
      text(
        vp.stopId
      );

    const stopSequence =
      numberValue(
        vp.currentStopSequence
      );

    const lat =
      numberValue(
        pos.latitude
      );

    const lon =
      numberValue(
        pos.longitude
      );

    if(
      !Number.isFinite(lat) ||
      !Number.isFinite(lon)
    )
      continue;

    result.push({

      vehicleId,

      vehicleIdNorm:
        normalizeId(vehicleId),

      label:
        text(vd.label),

      licensePlate:
        text(vd.licensePlate),

      routeId,

      routeIdNorm:
        normalizeId(routeId),

      tripId,

      tripIdNorm:
        normalizeId(tripId),

      directionId:
        text(trip.directionId),

      stopId,

      stopSequence,

      lat,

      lon,

      speed:
        numberValue(pos.speed),

      bearing:
        numberValue(pos.bearing),

      timestamp:
        numberValue(vp.timestamp),

      delay:null,

      delaySource:"",

      forgalmi:null,

      forgalmiSource:"",

      vehicleType:null,

      vehicleTypeSource:"",

      block:null,

      blockSource:"",

      source:"BKK VehiclePositions"
    });
  }

  return result;
}

/* =========================================================
   DELAY FORMÁZÁS
   ========================================================= */

function formatDelay(seconds){

  if(
    seconds === null ||
    seconds === undefined ||
    !Number.isFinite(
      Number(seconds)
    )
  ){

    return {
      text:"NINCS ADAT",
      className:"none"
    };
  }

  const s =
    Math.round(
      Number(seconds)
    );

  if(s === 0){

    return {
      text:"🟢 0:00",
      className:"zero"
    };
  }

  const abs =
    Math.abs(s);

  const min =
    Math.floor(
      abs / 60
    );

  const sec =
    abs % 60;

  const time =
    min +
    ":" +
    String(sec).padStart(
      2,
      "0"
    );

  if(s < 0){

    return {
      text:
        "🔴 SIETÉS −" +
        time,
      className:"early"
    };
  }

  return {
    text:
      "🔵 KÉSÉS +" +
      time,
    className:"late"
  };
}

/* =========================================================
   TRIPUPDATE DELAY
   ========================================================= */

function getStopUpdateDelay(
  stopUpdate
){

  if(!stopUpdate)
    return null;

  const rel =
    String(
      stopUpdate.scheduleRelationship ||
      ""
    ).toUpperCase();

  if(
    rel === "SKIPPED" ||
    rel === "NO_DATA"
  )
    return null;

  if(
    stopUpdate.arrival &&
    Number.isFinite(
      Number(
        stopUpdate.arrival.delay
      )
    )
  ){

    return Number(
      stopUpdate.arrival.delay
    );
  }

  if(
    stopUpdate.departure &&
    Number.isFinite(
      Number(
        stopUpdate.departure.delay
      )
    )
  ){

    return Number(
      stopUpdate.departure.delay
    );
  }

  return null;
}

async function fetchTripUpdates(){

  tripDelayMap.clear();
  tripDelaySeqMap.clear();
  tripDelayTripMap.clear();
  vehicleDelayMap.clear();
  tripVehicleMap.clear();
  vehicleTripMap.clear();

  log(
    "BKK TripUpdates lekérés..."
  );

  try{

    const response =
      await bkkFetch(
        TU_URL,
        {
          accept:
            "application/x-protobuf"
        }
      );

    const buffer =
      await response.arrayBuffer();

    const feed =
      await decodeGtfsRt(
        buffer
      );

    let tripCount=0;
    let stopUpdateCount=0;

    for(const entity of feed.entity || []){

      const tu =
        entity.tripUpdate;

      if(!tu)
        continue;

      const trip =
        tu.trip || {};

      const tripId =
        text(
          trip.tripId
        );

      const tripNorm =
        normalizeId(
          tripId
        );

      if(!tripNorm)
        continue;

      tripCount++;

      const vehicle =
        tu.vehicle || {};

      const vehicleId =
        text(
          vehicle.id
        );

      if(vehicleId){

        tripVehicleMap.set(
          tripNorm,
          vehicleId
        );

        vehicleTripMap.set(
          normalizeId(
            vehicleId
          ),
          tripNorm
        );
      }

      const list=[];

      for(
        const su of
        tu.stopTimeUpdate || []
      ){

        const delay =
          getStopUpdateDelay(
            su
          );

        if(delay === null)
          continue;

        const seq =
          numberValue(
            su.stopSequence
          );

        const stopId =
          text(
            su.stopId
          );

        const item={
          seq,
          stopId,
          delay
        };

        list.push(
          item
        );

        stopUpdateCount++;

        if(
          Number.isFinite(seq)
        ){

          if(
            !tripDelaySeqMap.has(
              tripNorm
            )
          ){

            tripDelaySeqMap.set(
              tripNorm,
              []
            );
          }

          tripDelaySeqMap
            .get(tripNorm)
            .push(item);
        }
      }

      if(list.length){

        tripDelayMap.set(
          tripNorm,
          list
        );

        /*
          A TripUpdate-nél a legelső
          értelmes stop-time delay-t
          trip-szintű fallbackként
          megtartjuk.
        */

        tripDelayTripMap.set(
          tripNorm,
          list[0].delay
        );
      }
    }

    lastTripFetchOK=true;

    badge(
      "bkkBadge",
      "BKK: OK",
      true
    );

    log(
      "TripUpdates OK: " +
      tripCount +
      " trip | " +
      stopUpdateCount +
      " stop-update delay."
    );

    return true;

  }catch(err){

    lastTripFetchOK=false;

    log(
      "TripUpdates hiba: " +
      err.message
    );

    return false;
  }
}

/* =========================================================
   DELAY KERESÉS
   ========================================================= */

function chooseRealtimeDelay(
  vehicle
){

  if(!vehicle)
    return null;

  const tripNorm =
    normalizeId(
      vehicle.tripId
    );

  const vehicleNorm =
    normalizeId(
      vehicle.vehicleId
    );

  const seq =
    numberValue(
      vehicle.stopSequence
    );

  const stopId =
    text(
      vehicle.stopId
    );

  /* -------------------------------------------------------
     1. trip + stopSequence
     ------------------------------------------------------- */

  if(
    tripNorm &&
    tripDelaySeqMap.has(
      tripNorm
    )
  ){

    const list =
      tripDelaySeqMap.get(
        tripNorm
      );

    if(
      Number.isFinite(seq)
    ){

      const exact =
        list.find(
          x =>
            Number.isFinite(x.seq) &&
            x.seq === seq
        );

      if(exact){

        return {
          value:exact.delay,
          source:
            "GTFS-RT TripUpdates / stopSequence"
        };
      }

      /*
        Ha nincs pontos sequence,
        a legközelebbi stop sequence.
      */

      let best=null;
      let diff=Infinity;

      for(const x of list){

        if(!Number.isFinite(x.seq))
          continue;

        const d =
          Math.abs(
            x.seq - seq
          );

        if(d < diff){

          diff=d;
          best=x;
        }
      }

      if(
        best &&
        diff <= 1
      ){

        return {
          value:best.delay,
          source:
            "GTFS-RT TripUpdates / közeli stopSequence"
        };
      }
    }

    /* -----------------------------------------------------
       2. trip + stopId
       ----------------------------------------------------- */

    if(stopId){

      const exactStop =
        list.find(
          x =>
            normalizeId(
              x.stopId
            ) ===
            normalizeId(
              stopId
            )
        );

      if(exactStop){

        return {
          value:exactStop.delay,
          source:
            "GTFS-RT TripUpdates / stopId"
        };
      }
    }
  }

  /* -------------------------------------------------------
     3. vehicleId → tripId
     ------------------------------------------------------- */

  if(vehicleNorm){

    const mappedTrip =
      vehicleTripMap.get(
        vehicleNorm
      );

    if(
      mappedTrip &&
      tripDelaySeqMap.has(
        mappedTrip
      )
    ){

      const list =
        tripDelaySeqMap.get(
          mappedTrip
        );

      if(
        Number.isFinite(seq)
      ){

        const exact =
          list.find(
            x =>
              Number.isFinite(x.seq) &&
              x.seq === seq
          );

        if(exact){

          return {
            value:exact.delay,
            source:
              "GTFS-RT TripUpdates / vehicle→trip"
          };
        }
      }
    }
  }

  /* -------------------------------------------------------
     4. trip-level fallback
     ------------------------------------------------------- */

  if(
    tripNorm &&
    tripDelayTripMap.has(
      tripNorm
    )
  ){

    return {
      value:
        tripDelayTripMap.get(
          tripNorm
        ),
      source:
        "GTFS-RT TripUpdates / trip fallback"
    };
  }

  return null;
}

function applyDelays(){

  let count=0;

  for(const v of vehicleData){

    const d =
      chooseRealtimeDelay(
        v
      );

    if(d){

      v.delay =
        d.value;

      v.delaySource =
        d.source;

      vehicleDelayMap.set(
        normalizeId(
          v.vehicleId
        ),
        d.value
      );

      count++;

    }else{

      v.delay=null;
      v.delaySource="";
    }
  }

  log(
    "BKV késés/sietés összekötve: " +
    count +
    " jármű."
  );

  return count;
}

/* =========================================================
   FUTÁR – VALÓDI REKORDOK
   ========================================================= */

function looksLikeVehicleObject(o){

  if(!o || typeof o !== "object")
    return false;

  const hasPosition =
    Number.isFinite(
      Number(
        o.lat ??
        o.latitude ??
        o.y
      )
    ) &&
    Number.isFinite(
      Number(
        o.lon ??
        o.longitude ??
        o.lng ??
        o.x
      )
    );

  const hasVehicleId =
    validValue(
      o.vehicleId ??
      o.vehicle_id ??
      o.id
    );

  const hasTrip =
    validValue(
      o.tripId ??
      o.trip_id
    );

  const hasRoute =
    validValue(
      o.routeId ??
      o.route_id
    );

  return (
    hasPosition &&
    (
      hasVehicleId ||
      hasTrip ||
      hasRoute
    )
  );
}

function findCandidateVehicleArrays(
  data
){

  const arrays=[];

  deepFindAll(
    data,
    o => {

      if(
        Array.isArray(o) &&
        o.length &&
        o.some(
          x =>
            looksLikeVehicleObject(
              x
            )
        )
      ){

        arrays.push(o);
      }
    },
    0,
    6
  );

  return arrays;
}

function normalizeFutarVehicle(
  raw
){

  const vehicleId =
    text(
      raw.vehicleId ??
      raw.vehicle_id ??
      raw.vehicle?.id ??
      raw.id
    );

  const tripId =
    text(
      raw.tripId ??
      raw.trip_id ??
      raw.trip?.id ??
      raw.trip?.tripId
    );

  const routeId =
    text(
      raw.routeId ??
      raw.route_id ??
      raw.route?.id ??
      raw.route?.routeId
    );

  const plate =
    firstField(
      raw,
      LICENSE_FIELDS
    ) ||
    firstField(
      raw.vehicle || {},
      LICENSE_FIELDS
    );

  const forgalmi =
    firstField(
      raw,
      FORGALMI_FIELDS
    ) ||
    firstField(
      raw.vehicle || {},
      FORGALMI_FIELDS
    );

  const vehicleType =
    firstField(
      raw,
      VEHICLE_TYPE_FIELDS
    ) ||
    firstField(
      raw.vehicle || {},
      VEHICLE_TYPE_FIELDS
    );

  const block =
    firstField(
      raw,
      BLOCK_FIELDS
    ) ||
    firstField(
      raw.vehicle || {},
      BLOCK_FIELDS
    );

  const lat =
    numberValue(
      raw.lat ??
      raw.latitude ??
      raw.location?.lat ??
      raw.location?.latitude
    );

  const lon =
    numberValue(
      raw.lon ??
      raw.lng ??
      raw.longitude ??
      raw.location?.lon ??
      raw.location?.lng ??
      raw.location?.longitude
    );

  const speed =
    numberValue(
      raw.speed ??
      raw.location?.speed
    );

  const bearing =
    numberValue(
      raw.bearing ??
      raw.heading ??
      raw.location?.bearing
    );

  const stopId =
    text(
      raw.stopId ??
      raw.stop_id ??
      raw.stop?.id
    );

  const stopSequence =
    numberValue(
      raw.stopSequence ??
      raw.stop_sequence
    );

  return {

    vehicleId,

    vehicleIdNorm:
      normalizeId(
        vehicleId
      ),

    tripId,

    tripIdNorm:
      normalizeId(
        tripId
      ),

    routeId,

    routeIdNorm:
      normalizeId(
        routeId
      ),

    licensePlate:
      text(plate),

    forgalmi:
      validValue(forgalmi)
        ? String(forgalmi)
        : null,

    vehicleType:
      validValue(vehicleType)
        ? String(vehicleType)
        : null,

    block:
      validValue(block)
        ? String(block)
        : null,

    lat,
    lon,
    speed,
    bearing,
    stopId,
    stopSequence,

    raw
  };
}

async function loadFutarVehicles(){

  lastFutarFetchOK=false;

  try{

    let lat =
      myPos?.lat ||
      47.4979;

    let lon =
      myPos?.lon ||
      19.0402;

    const url =
      FUTAR_URL +
      "?lat=" +
      encodeURIComponent(lat) +
      "&lon=" +
      encodeURIComponent(lon) +
      "&latSpan=0.5" +
      "&lonSpan=0.5";

    const response =
      await bkkFetch(
        url,
        {
          accept:
            "application/json"
        }
      );

    const data =
      await response.json();

    const arrays =
      findCandidateVehicleArrays(
        data
      );

    const rawVehicles=[];

    for(const arr of arrays){

      for(const raw of arr){

        if(
          looksLikeVehicleObject(
            raw
          )
        ){

          rawVehicles.push(
            raw
          );
        }
      }
    }

    const seen =
      new Set();

    const normalized=[];

    for(
      const raw of
      rawVehicles
    ){

      const v =
        normalizeFutarVehicle(
          raw
        );

      const key =
        v.vehicleIdNorm ||
        (
          v.tripIdNorm +
          "|" +
          v.routeIdNorm
        );

      if(!key || seen.has(key))
        continue;

      seen.add(key);

      normalized.push(v);
    }

    futarVehicleCache =
      normalized;

    lastFutarFetchOK=true;

    badge(
      "futarBadge",
      "FUTÁR: OK",
      true
    );

    log(
      "FUTÁR valódi rekord: " +
      normalized.length
    );

    return normalized;

  }catch(err){

    futarVehicleCache=[];

    badge(
      "futarBadge",
      "FUTÁR: hiba",
      false
    );

    log(
      "FUTÁR hiba: " +
      err.message
    );

    return [];
  }
}

/* =========================================================
   FUTÁR → VP MERGE
   ========================================================= */

function mergeFutarIntoVehicle(
  target,
  f
){

  let changed=false;

  if(
    !validValue(
      target.licensePlate
    ) &&
    validValue(
      f.licensePlate
    )
  ){

    target.licensePlate =
      f.licensePlate;

    changed=true;
  }

  if(
    !validValue(
      target.forgalmi
    ) &&
    validValue(
      f.forgalmi
    )
  ){

    target.forgalmi =
      f.forgalmi;

    target.forgalmiSource =
      "FUTÁR";

    changed=true;
  }

  if(
    !validValue(
      target.vehicleType
    ) &&
    validValue(
      f.vehicleType
    )
  ){

    target.vehicleType =
      f.vehicleType;

    target.vehicleTypeSource =
      "FUTÁR";

    changed=true;
  }

  if(
    !validValue(
      target.block
    ) &&
    validValue(
      f.block
    )
  ){

    target.block =
      f.block;

    target.blockSource =
      "FUTÁR";

    changed=true;
  }

  if(
    !validValue(
      target.stopId
    ) &&
    validValue(
      f.stopId
    )
  ){

    target.stopId =
      f.stopId;

    changed=true;
  }

  if(
    !Number.isFinite(
      target.stopSequence
    ) &&
    Number.isFinite(
      f.stopSequence
    )
  ){

    target.stopSequence =
      f.stopSequence;

    changed=true;
  }

  return changed;
}

function mergeFutar(){

  let bound=0;

  for(const v of vehicleData){

    let match=null;

    if(v.vehicleIdNorm){

      match =
        futarVehicleCache.find(
          f =>
            f.vehicleIdNorm &&
            f.vehicleIdNorm ===
            v.vehicleIdNorm
        );
    }

    if(
      !match &&
      v.tripIdNorm
    ){

      match =
        futarVehicleCache.find(
          f =>
            f.tripIdNorm &&
            f.tripIdNorm ===
            v.tripIdNorm
        );
    }

    if(
      !match &&
      validValue(
        v.licensePlate
      )
    ){

      const p =
        normalizeId(
          v.licensePlate
        );

      match =
        futarVehicleCache.find(
          f =>
            normalizeId(
              f.licensePlate
            ) === p
        );
    }

    if(match){

      if(
        mergeFutarIntoVehicle(
          v,
          match
        )
      ){

        bound++;
      }
    }
  }

  log(
    "FUTÁR → VP kötés: " +
    bound +
    " jármű."
  );

  return bound;
}

/* =========================================================
   BKK META – CÉLZOTT MATCH
   ========================================================= */

function isPossibleVehicleMeta(
  o
){

  if(!o || typeof o !== "object")
    return false;

  return (
    FORGALMI_FIELDS.some(
      f => validValue(o[f])
    ) ||
    VEHICLE_TYPE_FIELDS.some(
      f => validValue(o[f])
    ) ||
    BLOCK_FIELDS.some(
      f => validValue(o[f])
    ) ||
    LICENSE_FIELDS.some(
      f => validValue(o[f])
    )
  );
}

function metaIdentityScore(
  obj,
  vehicle
){

  let score=0;

  const ids=[];

  for(
    const f of [
      "vehicleId",
      "vehicle_id",
      "id",
      "vehicle"
    ]
  ){

    if(validValue(obj[f]))
      ids.push(
        normalizeId(
          obj[f]
        )
      );
  }

  const plates=[];

  for(
    const f of LICENSE_FIELDS
  ){

    if(validValue(obj[f]))
      plates.push(
        normalizeId(
          obj[f]
        )
      );
  }

  const trips=[];

  for(
    const f of [
      "tripId",
      "trip_id"
    ]
  ){

    if(validValue(obj[f]))
      trips.push(
        normalizeId(
          obj[f]
        )
      );
  }

  if(
    vehicle.vehicleIdNorm &&
    ids.includes(
      vehicle.vehicleIdNorm
    )
  )
    score += 100;

  if(
    vehicle.tripIdNorm &&
    trips.includes(
      vehicle.tripIdNorm
    )
  )
    score += 80;

  if(
    validValue(
      vehicle.licensePlate
    ) &&
    plates.includes(
      normalizeId(
        vehicle.licensePlate
      )
    )
  )
    score += 70;

  return score;
}

function extractBestMeta(
  data,
  vehicle
){

  let best=null;
  let bestScore=0;

  deepFindAll(
    data,
    obj => {

      if(
        !isPossibleVehicleMeta(
          obj
        )
      )
        return;

      const score =
        metaIdentityScore(
          obj,
          vehicle
        );

      if(score > bestScore){

        bestScore=score;
        best=obj;
      }
    },
    0,
    8
  );

  if(
    !best ||
    bestScore <= 0
  )
    return null;

  const forgalmi =
    firstField(
      best,
      FORGALMI_FIELDS
    );

  const type =
    firstField(
      best,
      VEHICLE_TYPE_FIELDS
    );

  const block =
    firstField(
      best,
      BLOCK_FIELDS
    );

  const plate =
    firstField(
      best,
      LICENSE_FIELDS
    );

  return {

    score:bestScore,

    forgalmi:
      validValue(forgalmi)
        ? String(forgalmi)
        : null,

    vehicleType:
      validValue(type)
        ? String(type)
        : null,

    block:
      validValue(block)
        ? String(block)
        : null,

    licensePlate:
      validValue(plate)
        ? String(plate)
        : null,

    raw:best
  };
}

async function fetchMetaEndpoint(
  baseUrl,
  vehicle
){

  const params =
    new URLSearchParams();

  if(validValue(vehicle.tripId))
    params.set(
      "tripId",
      vehicle.tripId
    );

  if(validValue(vehicle.vehicleId))
    params.set(
      "vehicleId",
      vehicle.vehicleId
    );

  params.set(
    "includeReferences",
    "true"
  );

  params.set(
    "key",
    getApiKey()
  );

  const url =
    baseUrl +
    "?" +
    params.toString();

  const response =
    await bkkFetch(
      url,
      {
        accept:
          "application/json"
      }
    );

  return response.json();
}

async function fetchBkkVehicleMeta(
  vehicle
){

  const cacheKey =
    (
      vehicle.vehicleIdNorm ||
      ""
    ) +
    "|" +
    (
      vehicle.tripIdNorm ||
      ""
    );

  if(
    bkkMetaCache.has(
      cacheKey
    )
  ){

    return bkkMetaCache.get(
      cacheKey
    );
  }

  let best=null;

  try{

    const data1 =
      await fetchMetaEndpoint(
        TRIP_DETAILS_URL,
        vehicle
      );

    const m1 =
      extractBestMeta(
        data1,
        vehicle
      );

    if(m1)
      best=m1;

  }catch(err){

    log(
      "trip-details meta hiba " +
      display(
        vehicle.vehicleId
      ) +
      ": " +
      err.message
    );
  }

  try{

    const data2 =
      await fetchMetaEndpoint(
        VEHICLE_FOR_TRIP_URL,
        vehicle
      );

    const m2 =
      extractBestMeta(
        data2,
        vehicle
      );

    if(
      m2 &&
      (
        !best ||
        m2.score > best.score
      )
    ){

      best=m2;
    }

  }catch(err){

    log(
      "vehicle-for-trip meta hiba " +
      display(
        vehicle.vehicleId
      ) +
      ": " +
      err.message
    );
  }

  bkkMetaCache.set(
    cacheKey,
    best
  );

  return best;
}

/* =========================================================
   META MERGE
   ========================================================= */

async function enrichVisibleBkkVehicles(){

  const now =
    Date.now();

  if(
    now - lastMetaEnrich <
    30000
  )
    return;

  lastMetaEnrich=now;

  const targets =
    vehicleData
      .filter(
        v =>
          !validValue(v.forgalmi) ||
          !validValue(v.vehicleType)
      )
      .slice(
        0,
        60
      );

  if(!targets.length){

    log(
      "BKK metadata: nincs hiányzó mező."
    );

    return;
  }

  let forgalmiCount=0;
  let typeCount=0;
  let blockCount=0;
  let plateCount=0;

  for(
    let i=0;
    i<targets.length;
    i+=5
  ){

    const batch =
      targets.slice(
        i,
        i+5
      );

    await Promise.all(
      batch.map(
        async v => {

          const meta =
            await fetchBkkVehicleMeta(
              v
            );

          if(!meta)
            return;

          if(
            !validValue(
              v.forgalmi
            ) &&
            validValue(
              meta.forgalmi
            )
          ){

            v.forgalmi =
              meta.forgalmi;

            v.forgalmiSource =
              "BKK metadata";

            forgalmiCount++;
          }

          if(
            !validValue(
              v.vehicleType
            ) &&
            validValue(
              meta.vehicleType
            )
          ){

            v.vehicleType =
              meta.vehicleType;

            v.vehicleTypeSource =
              "BKK metadata";

            typeCount++;
          }

          if(
            !validValue(
              v.block
            ) &&
            validValue(
              meta.block
            )
          ){

            v.block =
              meta.block;

            v.blockSource =
              "BKK metadata";

            blockCount++;
          }

          if(
            !validValue(
              v.licensePlate
            ) &&
            validValue(
              meta.licensePlate
            )
          ){

            v.licensePlate =
              meta.licensePlate;

            plateCount++;
          }
        }
      )
    );
  }

  log(
    "BKK metadata összefésülés: " +
    "FORGALMI +" +
    forgalmiCount +
    " | TÍPUS +" +
    typeCount +
    " | BLOKK +" +
    blockCount +
    " | RENDSZÁM +" +
    plateCount
  );

  renderVehicles();
}

async function loadGTFS(){

  if(gtfsLoaded)
    return;

  try{

    log(
      "BKK GTFS betöltés..."
    );

    const response =
      await bkkFetch(
        GTFS_URL,
        {
          accept:
            "application/zip"
        }
      );

    const buffer =
      await response.arrayBuffer();

    const zip =
      await JSZip.loadAsync(
        buffer
      );

    /* STOPS */

    if(zip.file("stops.txt")){

      const txt =
        await zip
          .file("stops.txt")
          .async("text");

      gtfsStops =
        parseCSV(
          txt
        );

      gtfsStopsById.clear();

      for(
        const s of gtfsStops
      ){

        gtfsStopsById.set(
          text(s.stop_id),
          s
        );
      }
    }

    /* ROUTES */

    if(zip.file("routes.txt")){

      const txt =
        await zip
          .file("routes.txt")
          .async("text");

      const routes =
        parseCSV(
          txt
        );

      gtfsRoutes.clear();

      for(
        const r of routes
      ){

/* =========================================================
   CSV
   ========================================================= */

function parseCSV(
  textData
){

  const lines =
    textData
      .replace(/^\uFEFF/,"")
      .split(/\r?\n/)
      .filter(
        x => x.trim()
      );

  if(!lines.length)
    return [];

  const header =
    parseCSVLine(
      lines[0]
    );

  const result=[];

  for(
    let i=1;
    i<lines.length;
    i++
  ){

    const row =
      parseCSVLine(
        lines[i]
      );

    const obj={};

    for(
      let j=0;
      j<header.length;
      j++
    ){

      obj[
        header[j]
      ] =
        row[j] ??
        "";
    }

    result.push(obj);
  }

  return result;
}

function parseCSVLine(
  line
){

  const result=[];
  let value="";
  let quoted=false;

  for(
    let i=0;
    i<line.length;
    i++
  ){

    const c =
      line[i];

    if(c === '"'){

      if(
        quoted &&
        line[i+1] === '"'
      ){

        value+='"';
        i++;

      }else{

        quoted=!quoted;
      }

      continue;
    }

    if(
      c === "," &&
      !quoted
    ){

      result.push(
        value
      );

      value="";

      continue;
    }

    value+=c;
  }

  result.push(
    value
  );

  return result;
}

/* =========================================================
   NEAREST STOP
   ========================================================= */

function nearestStop(
  lat,
  lon
){

  if(
    !gtfsStops.length ||
    !Number.isFinite(lat) ||
    !Number.isFinite(lon)
  )
    return null;

  let best=null;
  let bestD=Infinity;

  for(
    const s of gtfsStops
  ){

    const slat =
      Number(
        s.stop_lat
      );

    const slon =
      Number(
        s.stop_lon
      );

    if(
      !Number.isFinite(slat) ||
      !Number.isFinite(slon)
    )
      continue;

    const d =
      haversine(
        lat,
        lon,
        slat,
        slon
      );

    if(d < bestD){

      bestD=d;
      best=s;
    }
  }

  return best
    ? {
        stop:best,
        meters:bestD
      }
    : null;
}

function startGPS(){

  if(
    !navigator.geolocation
  ){

    badge(
      "gpsBadge",
      "GPS: NINCS",
      false
    );

    log(
      "A böngészőben nincs GPS."
    );

    return;
  }

  if(gpsWatchId !== null){

    navigator.geolocation.clearWatch(
      gpsWatchId
    );

    gpsWatchId=null;
  }

  gpsWatchId =
    navigator.geolocation.watchPosition(
      pos => {

        myPos={
          lat:
            pos.coords.latitude,
          lon:
            pos.coords.longitude,
          accuracy:
            pos.coords.accuracy
        };

        badge(
          "gpsBadge",
          "GPS: OK",
          true
        );

        if(myMarker)
          map.removeLayer(
            myMarker
          );

        myMarker =
          L.marker([
            myPos.lat,
            myPos.lon
          ])
          .addTo(map)
          .bindPopup(
            "SAJÁT GPS<br>" +
            myPos.lat.toFixed(6) +
            ", " +
            myPos.lon.toFixed(6)
          );

      },

      err => {

        badge(
          "gpsBadge",
          "GPS: HIBA",
          false
        );

        log(
          "GPS hiba: " +
          err.message
        );
      },

      {
        enableHighAccuracy:true,
        maximumAge:5000,
        timeout:15000
      }
    );

  log(
    "GPS figyelés elindítva."
  );
}

/* =========================================================
   TÁVOLSÁG
   ========================================================= */

function haversine(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R=6371000;

  const p1 =
    lat1 *
    Math.PI / 180;

  const p2 =
    lat2 *
    Math.PI / 180;

  const dp =
    (
      lat2-lat1
    ) *
    Math.PI / 180;

  const dl =
    (
      lon2-lon1
    ) *
    Math.PI / 180;

  const a =
    Math.sin(dp/2)**2 +
    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dl/2)**2;

  return (
    2 *
    R *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    )
  );
}

/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );
}

function renderVehicles(){

  const container =
    document.getElementById(
      "vehicleList"
    );

  if(!container)
    return;

  const universal =
    text(
      document.getElementById(
        "searchUniversal"
      ).value
    ).toLowerCase();

  const route =
    text(
      document.getElementById(
        "routeSearch"
      ).value
    ).toLowerCase();

  const plate =
    text(
      document.getElementById(
        "plateSearch"
      ).value
    ).toLowerCase();

  const filtered =
    vehicleData.filter(
      v => {

        if(
          radiusMode !== Infinity &&
          myPos
        ){

          const d =
            haversine(
              myPos.lat,
              myPos.lon,
              v.lat,
              v.lon
            ) / 1000;

          if(d > radiusMode)
            return false;
        }

        if(
          universal &&
          !vehicleSearchText(
            v
          ).includes(
            universal
          )
        )
          return false;

        if(
          route &&
          !String(
            v.routeId || ""
          )
          .toLowerCase()
          .includes(route)
        )
          return false;

        if(
          plate &&
          !(
            String(
              v.licensePlate || ""
            )
            .toLowerCase()
            .includes(plate) ||

            String(
              v.forgalmi || ""
            )
            .toLowerCase()
            .includes(plate)
          )
        )
          return false;

        return true;
      }
    );

  document.getElementById(
    "count"
  ).textContent =
    filtered.length;

  if(!filtered.length){

    container.innerHTML =
      vehicleData.length
        ? "<div class='small'>A szűrésnek megfelelő valódi jármű nincs.</div>"
        : "<div class='small'>Nincs valódi BKK járműadat.</div>";

  }else{

    container.innerHTML =
      filtered
        .map(
          vehicleCard
        )
        .join("");
  }

  renderMap(
    filtered
  );
}

function setRadius(
  km
){

  radiusMode=km;

  document
    .querySelectorAll(

        b.classList.remove(
          "active"

  const buttons =
    document.querySelectorAll(

  if(km === 2.5)
    buttons[0].classList.add(
      "active"
    );

  if(km === 5)
    buttons[1].classList.add(
      "active"
    );

  if(km === 10)
    buttons[2].classList.add(

  if(km === Infinity)

}

/* =========================================================
   VEHICLEPOSITIONS
   ========================================================= */

async function fetchVehiclePositions(){

  log(
    "BKK VehiclePositions lekérés..."
  );

  try{

    const response =
      await bkkFetch(
        VP_URL,
        {
          accept:
            "application/x-protobuf"
        }
      );

    const buffer =
      await response.arrayBuffer();

    if(!buffer.byteLength){

      throw new Error(
        "0 bájtos VehiclePositions válasz"
      );
    }

    const feed =
      await decodeGtfsRt(
        buffer
      );

    const parsed =
      parseVehicleFeed(
        feed
      );

    if(!parsed.length){

      throw new Error(
        "VehiclePositions: 0 használható valódi járműrekord"
      );
    }

    vehicleData =
      parsed;

    lastVehicleFetchOK=true;

    badge(
      "bkkBadge",
      "BKK: OK",
      true
    );

    log(
      "VehiclePositions OK: " +
      parsed.length +
      " valódi jármű."
    );

    return true;

  }catch(err){

    lastVehicleFetchOK=false;

    badge(
      "bkkBadge",
      "BKK: 401/HIBA",
      false
    );

    log(
      "VehiclePositions hiba: " +
      err.message
    );

    return false;
  }
}
