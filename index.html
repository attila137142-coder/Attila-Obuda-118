<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BKK GTFS CONNECT V1</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#0b1016;
    color:#e6f1ff;
}

header{
    padding:12px;
    background:#121a24;
    text-align:center;
    font-weight:bold;
}

input, button{
    padding:10px;
    margin:8px;
    border-radius:8px;
    border:none;
}

button{
    background:#00c2ff;
    font-weight:bold;
}

.card{
    margin:10px;
    padding:10px;
    background:#141e2b;
    border-radius:10px;
}

.badge{
    background:#00c2ff;
    color:#000;
    padding:2px 6px;
    border-radius:6px;
}
</style>
</head>

<body>

<header>🚦 BKK REAL GTFS CONNECT V1</header>

<input id="stopId" placeholder="STOP ID pl. 01000123">
<button onclick="loadStop()">Lekérdezés</button>

<div id="out"></div>

<script>

const API_BASE = "https://YOUR-VERCEL-API.vercel.app/api/stop?stop_id=";

/*
👉 EZ LESZ A VALÓS BACKEND KAPU
- BKK GTFS-RT fetch
- stop_times parsing
- vehicle positions
*/

async function loadStop(){
    const id = document.getElementById("stopId").value.trim();
    const out = document.getElementById("out");

    out.innerHTML = `<div class="card">⏳ Lekérdezés...</div>`;

    try{
        const res = await fetch(API_BASE + id);
        const data = await res.json();

        if(!data || !data.stop){
            out.innerHTML = `<div class="card">❌ Nincs adat erre: ${id}</div>`;
            return;
        }

        let html = `
        <div class="card">
            <h3>📍 ${data.stop.name}</h3>
            <small>STOP ID: ${id}</small>
        </div>`;

        data.routes.forEach(r=>{
            html += `
            <div class="card">
                <span class="badge">${r.route}</span>
                <div>következő indulások:</div>
                <div>${r.times.join(" - ")}</div>
                <small>késés: ${r.delay ?? "0"} perc</small>
            </div>`;
        });

        out.innerHTML = html;

    } catch(e){
        out.innerHTML = `
        <div class="card">
            ❌ API hiba / nincs backend kapcsolat
            <br><br>
            👉 ${e}
        </div>`;
    }
}

</script>

</body>
</html>
