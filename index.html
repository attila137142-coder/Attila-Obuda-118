<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Budai Gyermekvasút PRO GRID</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
  body { margin:0; font-family: Arial; }
  #map { height: 100vh; width: 100%; }
  .label {
    background: white;
    padding: 2px 5px;
    font-size: 11px;
    border-radius: 4px;
    border: 1px solid #ccc;
  }
</style>
</head>

<body>
<div id="map"></div>

<script>

// 🗺️ MAP INIT (Budai-hegység központ)
var map = L.map('map').setView([47.52, 18.96], 13);

// 🌍 OpenStreetMap base layer
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom: 18
}).addTo(map);

function addLine(coords, name, dist, slope) {
  var line = L.polyline(coords, {color:'green'}).addTo(map);

  line.bindPopup(
    "<b>" + name + "</b><br>" +
    "Távolság: " + dist + "<br>" +
    "Meredekség: " + slope + "%"
  );

  // label középre
  var mid = coords[Math.floor(coords.length/2)];
  L.marker(mid, {
    icon: L.divIcon({className:'label', html:name})
  }).addTo(map);
}

// 🚋 GYERMEKVASÚT GERINC (egyszerűsített geometria)

// Széchenyi-hegy
addLine([
  [47.4938, 19.0097],
  [47.5005, 18.9990]
], "Széchenyi-hegy → Normafa", "0.92 km", "4.1");

// Normafa → Anna-rét
addLine([
  [47.5005, 18.9990],
  [47.5045, 18.9902]
], "Normafa → Anna-rét", "0.64 km", "1.9");

// Anna-rét → Csillebérc
addLine([
  [47.5045, 18.9902],
  [47.5098, 18.9795]
], "Anna-rét → Csillebérc", "1.18 km", "4.7");

// Csillebérc → Szépjuhászné
addLine([
  [47.5098, 18.9795],
  [47.5192, 18.9690]
], "Csillebérc → Szépjuhászné", "1.45 km", "4.3");

// Szépjuhászné → Hárs-hegy
addLine([
  [47.5192, 18.9690],
  [47.5250, 18.9610]
], "Szépjuhászné → Hárs-hegy", "0.82 km", "5.0");

// Hárs-hegy → Hűvösvölgy
addLine([
  [47.5250, 18.9610],
  [47.5338, 18.9535]
], "Hárs-hegy → Hűvösvölgy", "1.20 km", "7.9");

// 🌲 EXTRA NODE (János-hegy kitérő)
addLine([
  [47.5050, 18.9650],
  [47.5180, 18.9580]
], "Normafa → János-hegy", "1.75 km", "12.0");

</script>
</body>
</html>
