<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>ATTILA DISPATCHER V7.1 – AUTO UI FIX</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body{margin:0;font-family:Arial;display:flex;height:100vh;}
#sidebar{width:380px;background:#0b1220;color:#00ff66;overflow:auto;}
#map{flex:1;}

.tabbar{
  display:flex;
  background:#001a00;
}

.tab{
  flex:1;
  padding:8px;
  text-align:center;
  cursor:pointer;
  border-bottom:2px solid transparent;
}

.tab.active{
  border-bottom:2px solid #00ff66;
}

.panel{
  padding:10px;
  font-family:monospace;
}

.matrix{
  background:black;
  color:#00ff66;
  padding:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #003300;
  padding:4px;
}

button{
  padding:6px;
  margin:4px;
  background:#003300;
  color:#00ff66;
  border:none;
}
</style>
</head>

<body>

<div id="sidebar">

<h3>🟢 V7.1 DISPATCH</h3>

<input type="file" id="zip">
<button onclick="loadGTFS()">LOAD GTFS</button>

<div class="tabbar">
  <div class="tab active" onclick="setView('list')">LISTA</div>
  <div class="tab" onclick="setView('board')">INDULÁS</div>
  <div class="tab" onclick="setView('debug')">DEBUG</div>
</div>

<div id="content"></div>

</div>

<div id="map"></div>

<script>

// ================= MAP =================
const map = L.map('map').setView([47.5,19.05],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'OSM'
}).addTo(map);

// ================= STATE =================
let stops = [];
let stopTimes = [];
let departures = {};
let currentView = "list";

// ================= SAFE STATE =================
function safe(v, fallback=[]){
  return v && v.length ? v : fallback;
}

// ================= VIEW SWITCH =================
function setView(v){
  currentView = v;

  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  event.target.classList.add("active");

  renderUI(lastSelectedStop);
}

// ================= GTFS LOAD =================
let lastSelectedStop = null;

async function loadGTFS(){

  const file = document.getElementById("zip").files[0];
  const zip = await JSZip.loadAsync(file);

  stops = [];
  stopTimes = [];
  departures = {};

  for(let path in zip.files){

    let name = path.toLowerCase().split("/").pop();
    let content = await zip.files[path].async("string");

    if(name==="stops.txt"){
      stops = Papa.parse(content,{header:true,skipEmptyLines:true}).data
        .filter(s=>s.stop_lat && s.stop_lon);
    }

    if(name==="stop_times.txt"){
      stopTimes = Papa.parse(content,{header:true,skipEmptyLines:true}).data;
    }
  }

  buildDepartures();
  renderStops();

  console.log("GTFS LOADED ✔", stops.length, stopTimes.length);

  // 🔥 AUTO UI TRIGGER (EZ A LÉNYEG)
  setTimeout(()=>{
    renderUI(stops[0]);
  },100);
}

// ================= BUILD DEPARTURES =================
function buildDepartures(){

  departures = {};

  stopTimes.forEach(st=>{

    if(!departures[st.stop_id]){
      departures[st.stop_id]=[];
    }

    departures[st.stop_id].push({
      trip: st.trip_id,
      time: st.departure_time
    });
  });
}

// ================= STOPS =================
function renderStops(){

  map.eachLayer(l=>{
    if(l instanceof L.CircleMarker) map.removeLayer(l);
  });

  stops.forEach(s=>{

    L.circleMarker([s.stop_lat,s.stop_lon],{
      radius:4,
      color:"cyan"
    }).addTo(map)
    .on("click",()=>{
      lastSelectedStop = s;
      renderUI(s);
    });
  });

  renderList();
}

// ================= LIST =================
function renderList(){

  let html = "<div class='panel'>📍 MEGÁLLÓK<br><br>";

  safe(stops).slice(0,50).forEach(s=>{
    html += `📍 ${s.stop_name}<br>`;
  });

  html += "</div>";

  if(currentView==="list"){
    document.getElementById("content").innerHTML = html;
  }
}

// ================= MATRIX BOARD =================
function renderBoard(stop){

  let list = departures[stop?.stop_id] || [];

  let html = `
  <div class="matrix">
    🟢 INDULÁSOK<br>
    <b>${stop?.stop_name || "–"}</b>
    <hr>
    <div class="row"><b>Trip</b><b>Idő</b></div>
  `;

  list.slice(0,15).forEach(d=>{
    html += `
    <div class="row">
      <div>${d.trip}</div>
      <div>${d.time}</div>
    </div>`;
  });

  html += "</div>";

  if(currentView==="board"){
    document.getElementById("content").innerHTML = html;
  }
}

// ================= DEBUG =================
function renderDebug(){

  let html = `
  <div class="panel">
    🧠 DEBUG<br><br>
    stops: ${stops.length}<br>
    stop_times: ${stopTimes.length}<br>
    departures keys: ${Object.keys(departures).length}<br>
  </div>
  `;

  if(currentView==="debug"){
    document.getElementById("content").innerHTML = html;
  }
}

// ================= UI MASTER =================
function renderUI(stop){

  if(!stops.length){
    document.getElementById("content").innerHTML =
      "❌ NINCS GTFS BETÖLTVE";
    return;
  }

  renderList();
  renderBoard(stop);
  renderDebug();
}

</script>

</body>
</html>
