<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>CONTROL ROOM V4-C</title>

<style>

body{
    margin:0;
    background:#081018;
    color:#00ff9d;
    font-family:Arial;
}

header{
    background:#101b2a;
    padding:12px;
    font-size:20px;
    font-weight:bold;
}

.top{
    padding:10px;
    background:#0d1622;
}

input{
    width:100%;
    padding:12px;
    background:#111c2b;
    border:none;
    color:#00ff9d;
    font-size:16px;
}

.results{
    max-height:200px;
    overflow:auto;
    background:#0d1622;
}

.stop{
    padding:8px;
    border-bottom:1px solid #00ff9d11;
    cursor:pointer;
}

.stop:hover{
    background:#14263d;
}

.panel{
    padding:10px;
}

.row{
    display:grid;
    grid-template-columns:90px 1fr 90px 90px;
    padding:8px;
    border-bottom:1px solid #00ff9d11;
}

.line{
    color:#ffd166;
    font-weight:bold;
}

.live{
    color:#00ff9d;
}

.delay{
    color:#ff5a5a;
}

</style>
</head>

<body>

<header>
🚦 CONTROL ROOM V4-C // GTFS STOP ENGINE
</header>

<div class="top">

<input
id="search"
placeholder="🚏 GTFS megálló keresése..."
oninput="searchStops()"
/>

<div class="results" id="results"></div>

</div>

<div class="panel" id="panel">

<h2>🚏 Válassz megállót</h2>

</div>

<script>

// 🚏 GTFS STOP CACHE
// később stops.txt-ből tölthető

const stops = [

{
id:"F01111",
name:"Nyugati pályaudvar"
},

{
id:"F02222",
name:"Keleti pályaudvar"
},

{
id:"F03333",
name:"Kelenföld vasútállomás"
},

{
id:"F04444",
name:"Deák Ferenc tér"
},

{
id:"F05555",
name:"Újpest-központ"
},

{
id:"F06666",
name:"Móricz Zsigmond körtér"
}

];

// 🚍 DEMO GTFS ENGINE

const departures = {

F01111:[

["4","Széll Kálmán tér",2],
["6","Móricz Zsigmond körtér",4],
["M3","Kőbánya-Kispest",1],
["9","Óbuda",5],
["14","Káposztásmegyer",6]

],

F02222:[

["7","Újpalota",3],
["M2","Déli pályaudvar",1],
["5","Pasaréti tér",8],
["8E","Kelenföld",5],
["133E","Nagytétény",7]

],

F03333:[

["M4","Keleti pályaudvar",2],
["1","Bécsi út",4],
["49","Deák Ferenc tér",6],
["47","Városház tér",3],
["7","Blaha Lujza tér",5]

]

};

// 🔍 SEARCH

function searchStops(){

    const q =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    const results =
        document.getElementById("results");

    results.innerHTML = "";

    if(q.length < 1) return;

    const filtered =
        stops.filter(s =>
            s.name.toLowerCase().includes(q)
        );

    filtered.forEach(stop=>{

        const div =
            document.createElement("div");

        div.className = "stop";

        div.innerHTML =
            `🚏 ${stop.name}`;

        div.onclick =
            ()=>loadStop(stop);

        results.appendChild(div);

    });

}

// 🚍 PANEL LOAD

function loadStop(stop){

    document
    .getElementById("results")
    .innerHTML = "";

    const panel =
        document.getElementById("panel");

    panel.innerHTML =
        `<h2>🚏 ${stop.name}</h2>`;

    const deps =
        departures[stop.id] || [];

    for(let i=0;i<15;i++){

        const d =
            deps[i % deps.length];

        const delay =
            Math.random() > 0.8;

        panel.innerHTML += `

        <div class="row">

            <div class="line">
                ${d[0]}
            </div>

            <div>
                ${d[1]}
            </div>

            <div>
                ${d[2]+i} perc
            </div>

            <div class="${
                delay
                ? 'delay'
                : 'live'
            }">

                ${
                    delay
                    ? 'KÉSIK'
                    : 'LIVE'
                }

            </div>

        </div>

        `;
    }

}

</script>

</body>
</html>
