/* =========================================================
   PROTOBUF
   ========================================================= */

async function initProto(){

    if(
        typeof FeedMessage !== "undefined" &&
        FeedMessage
    ){
        return;
    }

    const protoURL =
        "https://raw.githubusercontent.com/google/transit/master/gtfs-realtime/proto/gtfs-realtime.proto";

    log(
        "GTFS-realtime protobuf definíció betöltése."
    );

    if(
        typeof protobuf === "undefined"
    ){
        throw new Error(
            "A protobuf könyvtár nem érhető el."
        );
    }

    const root =
        await protobuf.load(
            protoURL
        );

    FeedMessage =
        root.lookupType(
            "transit_realtime.FeedMessage"
        );

    if(!FeedMessage){

        throw new Error(
            "FeedMessage protobuf típus nem tölthető be."
        );

    }

}


/* =========================================================
   BKK API-KULCS MENTÉS
   ========================================================= */

function saveBkkKey(){

    const input =
        document.getElementById(
            "bkkKey"
        );

    if(!input){

        setRT(
            "🔴 BKK API-kulcs mező nem található.",
            "err"
        );

        return;
    }

    const key =
        input.value.trim();

    if(!key){

        setRT(
            "🟡 Nincs beírt API-kulcs.",
            "warn"
        );

        return;
    }

    localStorage.setItem(
        "attila_bkk_key",
        key
    );

    input.value = "";

    setRT(
        "🟢 BKK API-kulcs helyben mentve.",
        "ok"
    );

    log(
        "BKK API-kulcs elmentve."
    );

}


/* =========================================================
   BKK API-KULCS BETÖLTÉSE
   ========================================================= */

function getBkkKey(){

    const saved =
        localStorage.getItem(
            "attila_bkk_key"
        );

    if(saved){

        return saved.trim();

    }

    const input =
        document.getElementById(
            "bkkKey"
        );

    if(input){

        return input.value.trim();

    }

    return "";

}


/* =========================================================
   BKK VEHICLE POSITIONS
   ========================================================= */

async function fetchVehicleFeed(){

    const key =
        getBkkKey();

    if(!key){

        throw new Error(
            "Nincs BKK API-kulcs."
        );

    }

    await initProto();


    if(
        typeof BKK_VP === "undefined" ||
        !BKK_VP
    ){

        throw new Error(
            "A BKK_VP végpont nincs meghatározva."
        );

    }


    const separator =
        BKK_VP.includes("?")
        ? "&"
        : "?";


    const url =
        BKK_VP +
        separator +
        "key=" +
        encodeURIComponent(
            key
        );


    log(
        "BKK VehiclePositions.pb lekérése..."
    );


    let response;

    try{

        response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );

    }catch(e){

        throw new Error(
            "Hálózati/CORS hiba: " +
            e.message
        );

    }


    if(!response.ok){

        let detail = "";

        try{

            detail =
                await response.text();

            detail =
                detail
                .replace(
                    /\s+/g,
                    " "
                )
                .slice(
                    0,
                    300
                );

        }catch(_){}


        throw new Error(
            "HTTP " +
            response.status +
            (
                detail
                ? " • " + detail
                : ""
            )
        );

    }


    const buffer =
        await response.arrayBuffer();


    if(
        !buffer ||
        !buffer.byteLength
    ){

        throw new Error(
            "A BKK feed üres választ adott."
        );

    }


    let message;

    try{

        message =
            FeedMessage.decode(
                new Uint8Array(
                    buffer
                )
            );

    }catch(e){

        throw new Error(
            "Protobuf dekódolási hiba: " +
            e.message
        );

    }


    let obj;

    try{

        obj =
            FeedMessage.toObject(
                message,
                {
                    longs:"String",
                    enums:"String",
                    defaults:true
                }
            );

    }catch(e){

        throw new Error(
            "GTFS-realtime feldolgozási hiba: " +
            e.message
        );

    }


    const out = [];


    for(
        const entity
        of (
            obj.entity ||
            []
        )
    ){

        const vp =
            entity.vehicle;


        if(
            !vp ||
            !vp.position
        ){

            continue;

        }


        const trip =
            vp.trip ||
            {};


        const vehicle =
            vp.vehicle ||
            {};


        const position =
            vp.position ||
            {};


        const lat =
            Number(
                position.latitude
            );


        const lon =
            Number(
                position.longitude
            );


        if(
            !validCoord(
                lat,
                lon
            )
        ){

            continue;

        }


        const speed =
            Number(
                position.speed
            );


        const bearing =
            Number(
                position.bearing
            );


        const timestamp =
            Number(
                vp.timestamp
            );


        out.push({

            entityId:
                String(
                    entity.id ||
                    ""
                ),

            routeId:
                String(
                    trip.routeId ||
                    ""
                ),

            tripId:
                String(
                    trip.tripId ||
                    ""
                ),

            directionId:
                String(
                    trip.directionId ||
                    ""
                ),

            startTime:
                String(
                    trip.startTime ||
                    ""
                ),

            startDate:
                String(
                    trip.startDate ||
                    ""
                ),

            vehicleId:
                String(
                    vehicle.id ||
                    ""
                ),

            vehicleLabel:
                String(
                    vehicle.label ||
                    ""
                ),

            licensePlate:
                String(
                    vehicle.licensePlate ||
                    ""
                ),

            lat:
                lat,

            lon:
                lon,

            bearing:
                Number.isFinite(
                    bearing
                )
                ? bearing
                : 0,

            speed:
                Number.isFinite(
                    speed
                )
                ? speed
                : 0,

            stopId:
                String(
                    vp.stopId ||
                    ""
                ),

            stopSequence:
                vp.currentStopSequence,

            currentStatus:
                String(
                    vp.currentStatus ||
                    ""
                ),

            timestamp:
                Number.isFinite(
                    timestamp
                )
                ? timestamp
                : 0

        });

    }


    return out;

}


/* =========================================================
   JÁRMŰ → KIVÁLASZTOTT MEGÁLLÓ
   LÉGVONALAS TÁVOLSÁG
   ========================================================= */

function vehicleStopDistance(v){

    if(
        !v ||
        !selectedStop
    ){

        return null;

    }


    if(
        !validCoord(
            selectedStop.stop_lat,
            selectedStop.stop_lon
        )
    ){

        return null;

    }


    if(
        !validCoord(
            v.lat,
            v.lon
        )
    ){

        return null;

    }


    return distanceKm(

        Number(
            selectedStop.stop_lat
        ),

        Number(
            selectedStop.stop_lon
        ),

        Number(
            v.lat
        ),

        Number(
            v.lon
        )

    );

}


/* =========================================================
   JÁRMŰ ROUTE INFORMÁCIÓ
   ========================================================= */

function routeName(v){

    if(!v){

        return {
            short:"ismeretlen",
            long:""
        };

    }


    const routeId =
        String(
            v.routeId ||
            ""
        );


    let r = null;


    try{

        if(
            typeof maps !== "undefined" &&
            maps &&
            maps.routes &&
            typeof maps.routes.get === "function"
        ){

            r =
                maps.routes.get(
                    routeId
                );

        }

    }catch(_){}


    if(!r){

        return {

            short:
                routeId ||
                "ismeretlen",

            long:""

        };

    }


    return {

        short:
            r.route_short_name ||
            r.original_route_id ||
            r.route_id ||
            routeId ||
            "ismeretlen",

        long:
            r.route_long_name ||
            ""

    };

}


/* =========================================================
   JÁRMŰ SZŰRÉS
   ========================================================= */

function filterVehicle(v,q){

    if(!q){

        return true;

    }


    q =
        String(
            q
        )
        .toLowerCase()
        .trim();


    const r =
        routeName(v);


    return [

        v.entityId,
        v.routeId,
        r.short,
        r.long,
        v.vehicleId,
        v.vehicleLabel,
        v.licensePlate,
        v.tripId,
        v.stopId

    ].some(
        x =>
            String(
                x || ""
            )
            .toLowerCase()
            .includes(q)
    );

}


/* =========================================================
   REALTIME EGYSZERI BETÖLTÉS
   ========================================================= */

async function loadRealtimeOnce(){

    setRT(
        "🟡 BKK Vehicle Positions lekérése...",
        "warn"
    );


    log(
        "BKK realtime járműfeed lekérés indul."
    );


    const diag =
        document.getElementById(
            "feedDiagnostics"
        );


    if(diag){

        diag.textContent =
            "Feed diagnosztika: kapcsolat tesztelése...";

    }


    try{

        const result =
            await fetchVehicleFeed();


        vehicles =
            Array.isArray(
                result
            )
            ? result
            : [];


        const count =
            vehicles.length;


        const nVehicles =
            document.getElementById(
                "nVehicles"
            );


        if(nVehicles){

            nVehicles.textContent =
                count.toLocaleString(
                    "hu-HU"
                );

        }


        core.realtime =
            count > 0;


        updateCore();


        renderVehicles();

        renderMap();


        if(count){

            setRT(
                "🟢 VALÓS JÁRMŰFEED: " +
                count +
                " jármű.",
                "ok"
            );


            if(diag){

                diag.innerHTML =
                    "🟢 VehiclePositions.pb OK • " +
                    count +
                    " járműpozíció feldolgozva.";

            }


            log(
                "Vehicle Positions OK: " +
                count +
                " jármű."
            );

        }else{

            core.realtime =
                false;


            updateCore();


            setRT(
                "🟡 Feed elérhető, de jelenleg nincs járműpozíció.",
                "warn"
            );


            if(diag){

                diag.textContent =
                    "🟡 Feed elérhető, de 0 járműpozíció érkezett.";

            }


            log(
                "BKK feed elérhető, de 0 járműpozíció."
            );

        }


    }catch(e){

        vehicles = [];


        core.realtime =
            false;


        updateCore();

        renderVehicles();

        renderMap();


        setRT(
            "🔴 Realtime hiba: " +
            e.message,
            "err"
        );


        if(diag){

            diag.innerHTML =
                "🔴 VehiclePositions.pb hiba: " +
                escapeHtml(
                    e.message
                ) +
                "<br>" +
                "Ellenőrizd az API-kulcsot és a hálózati hozzáférést.";

        }


        log(
            "JÁRMŰ FEED HIBA: " +
            e.message
        );

    }

}


/* =========================================================
   AUTOMATIKUS REALTIME
   ========================================================= */

function startRealtime(){

    stopRealtime();


    loadRealtimeOnce();


    const input =
        document.getElementById(
            "refreshSec"
        );


    const sec =
        Number(
            input
            ? input.value
            : 15
        ) || 15;


    const safeSec =
        Math.max(
            10,
            sec
        );


    rtTimer =
        setInterval(
            loadRealtimeOnce,
            safeSec * 1000
        );


    log(
        "Automatikus realtime követés: " +
        safeSec +
        " mp."
    );

}


/* =========================================================
   REALTIME LEÁLLÍTÁS
   ========================================================= */

function stopRealtime(){

    if(rtTimer){

        clearInterval(
            rtTimer
        );

        rtTimer = null;


        log(
            "Realtime automatikus frissítés leállítva."
        );

    }

}


/* =========================================================
   JÁRMŰLISTA
   ========================================================= */

function renderVehicles(){

    const box =
        document.getElementById(
            "vehicleList"
        );


    if(!box){

        return;

    }


    const filter =
        document.getElementById(
            "routeFilter"
        );


    const q =
        filter
        ? filter.value.trim()
        : "";


    const source =
        Array.isArray(
            vehicles
        )
        ? vehicles
        : [];


    const list =
        source
        .filter(
            v =>
                filterVehicle(
                    v,
                    q
                )
        )
        .sort(
            (a,b) =>
                routeName(a)
                .short
                .localeCompare(
                    routeName(b).short,
                    "hu"
                )
        );


    if(!list.length){

        box.innerHTML =
            "Nincs valós járműadat.";

        return;

    }


    box.innerHTML =
        list
        .slice(
            0,
            300
        )
        .map(
            v => {

                const r =
                    routeName(v);


                const ms =
                    Number.isFinite(
                        v.speed
                    )
                    ? v.speed
                    : 0;


                const kmh =
                    ms * 3.6;


                const dist =
                    vehicleStopDistance(
                        v
                    );


                return `

<div
    class="vehicleItem"
    data-vehicle-entity="${escapeHtml(
        v.entityId
    )}"
    style="
        cursor:pointer;
        padding:10px;
        margin:5px 0;
        border-radius:10px;
    "
>

    <div class="vehicleTop">

        <span class="routeBig">

            🚌
            ${escapeHtml(
                r.short
            )}

        </span>

        <span class="pill">

            🟢 LIVE

        </span>

    </div>


    <div>

        ${escapeHtml(
            r.long
        )}

    </div>


    <div>

        <span class="pill">

            ID:
            ${escapeHtml(
                v.vehicleId ||
                "nincs adat"
            )}

        </span>


        <span class="pill">

            Forgalmi:
            ${escapeHtml(
                v.vehicleLabel ||
                "nincs adat"
            )}

        </span>


        <span class="pill">

            Rendszám:
            ${escapeHtml(
                v.licensePlate ||
                "nincs adat"
            )}

        </span>

    </div>


    <div>

        <span class="pill">

            📍
            ${Number(
                v.lat
            ).toFixed(8)},
            ${Number(
                v.lon
            ).toFixed(8)}

        </span>


        <span class="pill">

            🚀
            ${kmh.toFixed(1)}
            km/h

        </span>


        <span class="pill">

            ⚙️
            ${ms.toFixed(2)}
            m/s

        </span>


        <span class="pill">

            📐
            ${
                dist !== null
                ? dist.toFixed(2) + " km"
                : "nincs adat"
            }

        </span>

    </div>


    <div class="small">

        Trip:
        ${escapeHtml(
            v.tripId ||
            "nincs adat"
        )}

        •

        Stop:
        ${escapeHtml(
            v.stopId ||
            "nincs adat"
        )}

        •

        Frissítés:
        ${
            v.timestamp
            ? new Date(
                v.timestamp * 1000
              ).toLocaleTimeString(
                "hu-HU"
              )
            : "nincs adat"
        }

    </div>

</div>

`;

            }
        )
        .join("");


    /*
       NEM INDEX ALAPÚ KIVÁLASZTÁS!
       ENTITY ID ALAPÚ.
    */

    box.onclick =
        function(event){

            const item =
                event.target.closest(
                    "[data-vehicle-entity]"
                );


            if(!item){

                return;

            }


            const entityId =
                item.getAttribute(
                    "data-vehicle-entity"
                );


            selectVehicleByEntityId(
                entityId
            );

        };

}


/* =========================================================
   JÁRMŰ KIVÁLASZTÁS
   ========================================================= */

function selectVehicleByEntityId(entityId){

    const id =
        String(
            entityId ||
            ""
        );


    if(!id){

        return;

    }


    const found =
        vehicles.find(
            v =>
                String(
                    v.entityId ||
                    ""
                ) === id
        );


    if(!found){

        setRT(
            "🟡 A jármű már nincs a realtime feedben.",
            "warn"
        );

        return;

    }


    selectedVehicle =
        found;


    const r =
        routeName(
            selectedVehicle
        );


    const name =
        document.getElementById(
            "selVehicleName"
        );


    if(name){

        name.textContent =
            r.short +
            " • " +
            (
                selectedVehicle.vehicleLabel ||
                selectedVehicle.vehicleId ||
                "jármű"
            );

    }


    const air =
        document.getElementById(
            "vehicleAir"
        );


    const dist =
        vehicleStopDistance(
            selectedVehicle
        );


    if(air){

        air.textContent =
            dist !== null
            ? dist.toFixed(2) + " km"
            : "nincs adat";

    }


    const road =
        document.getElementById(
            "vehicleRoad"
        );


    if(road){

        road.textContent =
            "nincs adat";

    }


    log(
        "Jármű kiválasztva: " +
        r.short +
        " • " +
        (
            selectedVehicle.vehicleId ||
            selectedVehicle.entityId
        )
    );


    renderMap(true);

}


/* =========================================================
   RÉGI selectVehicle() KOMPATIBILITÁS
   ========================================================= */

function selectVehicle(index){

    if(
        !Array.isArray(
            vehicles
        )
    ){

        return;

    }


    const v =
        vehicles[index];


    if(!v){

        return;

    }


    selectVehicleByEntityId(
        v.entityId
    );

}


/* =========================================================
   TÉRKÉP
   ========================================================= */

function initMap(){

    if(
        typeof L === "undefined"
    ){

        log(
            "Leaflet nem érhető el."
        );

        return;

    }


    map =
        L.map(
            "map"
        )
        .setView(
            [
                47.5,
                19.04
            ],
            11
        );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:
                "© OpenStreetMap contributors"
        }
    )
    .addTo(map);

}


/* =========================================================
   TÉRKÉP MARKEREK TÖRLÉSE
   ========================================================= */

function clearMapMarkers(){

    if(
        Array.isArray(
            vehicleMarkers
        )
    ){

        vehicleMarkers
        .forEach(
            marker => {

                try{

                    marker.remove();

                }catch(_){}

            }
        );

    }


    vehicleMarkers = [];


    if(userMarker){

        try{

            userMarker.remove();

        }catch(_){}


        userMarker = null;

    }


    if(stopMarker){

        try{

            stopMarker.remove();

        }catch(_){}


        stopMarker = null;

    }

}


/* =========================================================
   TÉRKÉP RENDER
   ========================================================= */

        return;

    }


    clearMapMarkers();


    /* SAJÁT HELYZET */

        userPos &&
        validCoord(
            userPos.lat,
            userPos.lon
        )
    ){

                [

                    userPos.lon
                ],

                    radius:8
                }
            )

            selectedStop.stop_lon

                    Number(
                        selectedStop.stop_lon
                    )
                ]
            )
            .addTo(map);

            )

    }

        document.getElementById(
            "routeFilter"
        );


    const q =

        ? filter.value.trim()

            ? vehicles

        .filter(
            v =>
                validCoord(

                    v.lon
                ) &&
                filterVehicle(
                    v,
                    q

        )
        .slice(
            0,
            500
        );


    for(
        const v
        of list
    ){

        const r =
            routeName(v);


        const ms =
            Number.isFinite(
                v.speed
            )
            ? v.speed
            : 0;


        const kmh =
            ms * 3.6;


        const dist =
            vehicleStopDistance(
                v
            );


        const marker =
            L.circleMarker(
                [
                    v.lat,
                    v.lon
                ],
                {
                    radius:7
                }
            )
            .addTo(map);


        marker.bindPopup(

            "<b>🚌 " +
            escapeHtml(
                r.short
            ) +
            "</b><br>" +

            "Jármű ID: " +
            escapeHtml(
                v.vehicleId ||
                "nincs adat"
            ) +
            "<br>" +

            "Forgalmi: " +
            escapeHtml(
                v.vehicleLabel ||
                "nincs adat"
            ) +
            "<br>" +

            "Rendszám: " +
            escapeHtml(
                v.licensePlate ||
                "nincs adat"
            ) +
            "<br>" +

            "📍 " +
            v.lat.toFixed(8) +
            ", " +
            v.lon.toFixed(8) +
            "<br>" +

            "🚀 " +
            kmh.toFixed(1) +
            " km/h" +
            "<br>" +

            "⚙️ " +
            ms.toFixed(2) +
            " m/s" +
            "<br>" +

            "📐 Megállótól: " +
            (
                dist !== null
                ? dist.toFixed(2) +
                  " km"
                : "nincs adat"
            )

        );


        marker.on(
            "click",
            function(){

                selectVehicleByEntityId(
                    v.entityId
                );

            }
        );


        vehicleMarkers.push(
            marker
        );

    }


    if(
        focus &&
        selectedVehicle &&
        validCoord(
            selectedVehicle.lat,
            selectedVehicle.lon
        )
    ){

        map.setView(
            [
                selectedVehicle.lat,
                selectedVehicle.lon
            ],
            14
        );

    }

}

/* =========================================================
   ÖSSZES JÁRMŰ TÉRKÉPRE ILLÉSZTÉSE
   ========================================================= */

function fitVehicles(){

    if(!map){

        return;

    }


    const points = [];


    const source =
        Array.isArray(
            vehicles
        )
        ? vehicles
        : [];


    source
    .filter(
        v =>
            validCoord(
                v.lat,
                v.lon
            )
    )
    .forEach(
        v => {

            points.push(
                [
                    v.lat,
                    v.lon
                ]
            );

        }
    );


    if(
        userPos &&
        validCoord(
            userPos.lat,
            userPos.lon
        )
    ){

        points.push(
            [
                userPos.lat,
                userPos.lon
            ]
        );

    }


    if(
        selectedStop &&
        validCoord(
            selectedStop.stop_lat,
            selectedStop.stop_lon
        )
    ){

        points.push(
            [
                Number(
                    selectedStop.stop_lat
                ),
                Number(
                    selectedStop.stop_lon
                )
            ]
        );

    }


    if(
        selectedVehicle &&
        validCoord(
            selectedVehicle.lat,
            selectedVehicle.lon
        )
    ){

        points.push(
            [
                selectedVehicle.lat,
                selectedVehicle.lon
            ]
        );

    }


    if(points.length){

        map.fitBounds(
            points,
            {
                padding:[
                    20,
                    20
                ]
            }
        );

    }

}


/* =========================================================
   JÁRMŰLISTA TÖRLÉSE
   ========================================================= */

function clearVehicles(){

    stopRealtime();


    vehicles = [];


    selectedVehicle =
        null;


    core.realtime =
        false;


    updateCore();


    const nVehicles =
        document.getElementById(
            "nVehicles"
        );


    if(nVehicles){

        nVehicles.textContent =
            "0";

    }


    const box =
        document.getElementById(
            "vehicleList"
        );


    if(box){

        box.innerHTML =
            "Nincs valós járműadat.";

    }


    renderMap();


    setRT(
        "⚪ Járműlista törölve."
    );


    log(
        "Valós járműlista törölve."
    );

}


/* =========================================================
   REALTIME ÚJRAINDÍTÁS
   ========================================================= */

function restartRealtime(){

    stopRealtime();

    startRealtime();

}


/* =========================================================
   REALTIME ÁLLAPOT LEKÉRDEZÉSE
   ========================================================= */

function realtimeStatus(){

    const count =
        Array.isArray(
            vehicles
        )
        ? vehicles.length
        : 0;


    return {

        ok:
            count > 0,

        count:
            count,

        text:
            count > 0
            ? "🟢 REALTIME AKTÍV"
            : "🟡 NINCS JÁRMŰADAT"

    };

}
