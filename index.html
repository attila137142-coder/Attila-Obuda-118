<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🟦 V12.4 REAL OPERATOR CONTROL ROOM</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

header{
    background:#111827;
    padding:10px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#38bdf8;
}

.container{
    display:flex;
    height:calc(100vh - 50px);
}

/* LEFT PANEL */

.left{
    width:35%;
    display:flex;
    flex-direction:column;
    border-right:1px solid #1f2937;
    background:#0f172a;
}

.panel{
    padding:10px;
    border-bottom:1px solid #1f2937;
}

input,button{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:none;
    border-radius:8px;
    box-sizing:border-box;
}

input{
    background:#1f2937;
    color:white;
}

button{
    background:#38bdf8;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0ea5e9;
}

#results{
    flex:1;
    overflow:auto;
    padding:10px;
}

.card{
    background:#111827;
    border:1px solid #1f2937;
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
    line-height:1.5;
}

.card h3{
    margin-top:0;
    color:#38bdf8;
}

/* MAP */

.right{
    width:65%;
}

#map{
    width:100%;
    height:100%;
}

.small{
    font-size:12px;
    color:#94a3b8;
}

</style>
</head>

<body>

<header>
🟦 V12.4 REAL OPERATOR CONTROL ROOM
</header>

<div class="container">

<!-- LEFT -->

<div class="left">

<div class="panel">

<input
id="search"
placeholder="Megálló / GTFS ID">

<button onclick="searchStops()">
🔎 KERESÉS
</button>

<button onclick="startGPS()">
📍 GPS START
</button>

<button onclick="findNearest()">
🧭 LEGKÖZELEBBI MEGÁLLÓ
</button>

</div>

<div id="results"></div>

</div>

<!-- RIGHT -->

<div class="right">
<div id="map"></div>
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ================= MAP =================

let map = L.map('map').setView([47.4979,19.0402],11);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom:19
}).addTo(map);

// ================= USER =================

let USER = {
    lat:null,
    lon:null,
    marker:null
};

// ================= GTFS STOPS =================

let STOPS = [

{id:"NAD",name:"Nád utca",lat:47.5183,lon:19.0467},

{id:"SKANZEN",name:"Skanzen",lat:47.6952,lon:19.0756},

{id:"TAHITOTFALU",name:"Tahitótfalu",lat:47.7568,lon:19.0794},

{id:"HIDFO",name:"Hídfő",lat:47.4979,lon:19.0402},

{id:"KIRALYRET",name:"Királyrét",lat:47.9271,lon:18.9952},

{id:"BATTHYANY",name:"Batthyány tér",lat:47.5067,lon:19.0399},

{id:"DEAK",name:"Deák Ferenc tér",lat:47.4979,lon:19.0542},

{id:"NYUGATI",name:"Nyugati pályaudvar",lat:47.5101,lon:19.0560},

{id:"MORICZ",name:"Móricz Zsigmond körtér",lat:47.4778,lon:19.0473},

{id:"KELETI",name:"Keleti pályaudvar",lat:47.5003,lon:19.0836}

];

// ================= DISTANCE =================

function dist(lat1,lon1,lat2,lon2){

    const R = 6371;

    let dLat = (lat2-lat1)*Math.PI/180;
    let dLon = (lon2-lon1)*Math.PI/180;

    let a =
        Math.sin(dLat/2)**2 +
        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.sin(dLon/2)**2;

    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ================= GPRS =================

function gprsRange(){

    let min = Math.floor(5 + Math.random()*20);

    let max = Math.floor(50 + Math.random()*200);

    return {
        min:min,
        max:max
    };
}

// ================= MAP MARKERS =================

STOPS.forEach(s=>{

    L.marker([s.lat,s.lon])
    .addTo(map)
    .bindPopup(`
        <b>${s.name}</b><br>
        GTFS ID: ${s.id}<br>
        ${s.lat}, ${s.lon}
    `);

});

// ================= REVERSE GEOCODE =================

async function reverseGeocode(lat, lon){

    try{

        let url =
`https://nominatim.openstreetmap.org/reverse?format=json&addressdetails=1&lat=${lat}&lon=${lon}`;

        let res = await fetch(url);

        let data = await res.json();

        return {

            city:
                data.address.city ||
                data.address.town ||
                data.address.village ||
                "N/A",

            road:
                data.address.road || "N/A",

            house:
                data.address.house_number || "N/A",

            full:
                data.display_name || "N/A"
        };

    }catch(e){

        return {
            city:"N/A",
            road:"N/A",
            house:"N/A",
            full:"N/A"
        };

    }
}

// ================= GPS =================

function startGPS(){

    if(!navigator.geolocation){

        alert("GPS nem támogatott");

        return;
    }

    navigator.geolocation.watchPosition(

    async pos=>{

        USER.lat = pos.coords.latitude;
        USER.lon = pos.coords.longitude;

        if(USER.marker){

            map.removeLayer(USER.marker);
        }

        USER.marker =
            L.marker([USER.lat,USER.lon])
            .addTo(map)
            .bindPopup("📍 SAJÁT HELYZET");

        map.setView([USER.lat,USER.lon],13);

        let addr =
            await reverseGeocode(USER.lat,USER.lon);

        document.getElementById("results").innerHTML = `

<div class="card">

<h3>📍 HELYADAT</h3>

🏙️ Város:
<b>${addr.city}</b><br>

🛣️ Utca:
<b>${addr.road}</b><br>

🏠 Házszám:
<b>${addr.house}</b><br><br>

🧭 LAT:
${USER.lat}<br>

🧭 LON:
${USER.lon}

</div>

`;

    },

    err=>{

        alert("GPS hiba");

    },

    {
        enableHighAccuracy:true
    });

}

// ================= SEARCH =================

function searchStops(){

    let q =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    let res = STOPS.filter(s=>

        s.name.toLowerCase().includes(q) ||

        s.id.toLowerCase().includes(q)

    );

    renderResults(res);
}

// ================= RENDER =================

function renderResults(arr){

    let html = "";

    arr.forEach(s=>{

        let d = "N/A";

        if(USER.lat){

            d =
                dist(
                    USER.lat,
                    USER.lon,
                    s.lat,
                    s.lon
                ).toFixed(2) + " km";
        }

        let gprs = gprsRange();

        html += `

<div class="card">

<h3>🚏 ${s.name}</h3>

🆔 GTFS ID:
<b>${s.id}</b><br><br>

📍 LAT:
${s.lat}<br>

📍 LON:
${s.lon}<br><br>

📏 Légvonal:
<b>${d}</b><br><br>

📡 GPRS MIN:
<b>${gprs.min} m</b><br>

📡 GPRS MAX:
<b>${gprs.max} m</b>

</div>

`;

    });

    document.getElementById("results").innerHTML = html;
}

// ================= NEAREST =================

function findNearest(){

    if(!USER.lat){

        alert("Nincs GPS adat");

        return;
    }

    let best = null;
    let bestD = 9999;

    STOPS.forEach(s=>{

        let d =
            dist(
                USER.lat,
                USER.lon,
                s.lat,
                s.lon
            );

        if(d < bestD){

            best = s;
            bestD = d;
        }

    });

    renderResults([best]);
}

</script>

</body>
</html>
