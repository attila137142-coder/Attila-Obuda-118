<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>HUNGARY REAL TRANSIT CORE V5</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:#e5e7eb;
}

header{
    background:#111827;
    padding:10px;
    font-weight:bold;
}

.container{
    display:grid;
    grid-template-columns:340px 1fr;
    height:85vh;
}

.left{
    background:#1f2937;
    padding:10px;
    overflow:auto;
}

#map{
    height:100%;
}

.box{
    background:#111827;
    padding:10px;
    margin-bottom:10px;
    border-radius:6px;
}

.item{
    background:#374151;
    padding:6px;
    margin:4px 0;
    border-radius:5px;
    cursor:pointer;
}

.item:hover{
    background:#4b5563;
}

input{
    width:100%;
    padding:8px;
    margin:5px 0;
    border:none;
    border-radius:5px;
}

.log{
    height:15vh;
    overflow:auto;
    background:#0f172a;
    font-size:12px;
    padding:8px;
}
</style>
</head>

<body>

<header>
🇭🇺 HUNGARY REAL TRANSIT CORE V5
</header>

<div class="container">

<!-- LEFT -->
<div class="left">

<div class="box">
<h3>🔍 STOP SEARCH</h3>
<input oninput="search(this.value)">
</div>

<div class="box">
<h3>🚏 STOPS</h3>
<div id="stops"></div>
</div>

<div class="box">
<h3>📍 USER</h3>
<div id="user">loading...</div>
</div>

</div>

<!-- MAP -->
<div id="map"></div>

</div>

<div class="log" id="log"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   MAP
========================= */

let map = L.map("map").setView([47.2,19.5],8);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png")
.addTo(map);

/* =========================
   REGION DATA
========================= */

let STOPS = [

/* BUDAPEST */
{id:1,name:"Deák Ferenc tér",lat:47.4979,lon:19.054},
{id:2,name:"Nád utca",lat:47.52,lon:19.04},

/* PEST MEGYE */
{id:3,name:"Érd központ",lat:47.386,lon:18.912},
{id:4,name:"Dunakeszi",lat:47.631,lon:19.137},

/* ZALA MEGYE */
{id:5,name:"Zalaegerszeg autóbusz",lat:46.84,lon:16.843},
{id:6,name:"Keszthely",lat:46.768,lon:17.244}
];

/* =========================
   NORMALIZE SEARCH
========================= */

function norm(t){
    return (t||"")
    .toLowerCase()
    .normalize("NFD")
    .replace(/\p{Diacritic}/gu,"");
}

/* =========================
   RENDER
========================= */

function render(list){

    document.getElementById("stops").innerHTML =
    list.map(s=>
        `<div class="item" onclick="go(${s.lat},${s.lon},'${s.name}')">
            🚏 ${s.name}
        </div>`
    ).join("");
}

render(STOPS);

/* =========================
   SEARCH
========================= */

function search(q){

    render(STOPS.filter(s=>
        norm(s.name).includes(norm(q))
    ));
}

/* =========================
   MAP ACTION
========================= */

function go(lat,lon,name){

    map.setView([lat,lon],14);

    L.marker([lat,lon])
    .addTo(map)
    .bindPopup(name)
    .openPopup();

    log("SELECT: "+name);
}

/* =========================
   USER LOCATION
========================= */

navigator.geolocation.getCurrentPosition(pos=>{

    let lat = pos.coords.latitude;
    let lon = pos.coords.longitude;

    L.marker([lat,lon])
    .addTo(map)
    .bindPopup("USER");

    map.setView([lat,lon],10);

    document.getElementById("user").innerHTML =
        "GPS: "+lat.toFixed(5)+","+lon.toFixed(5);
});

/* =========================
   LOG
========================= */

function log(m){
    document.getElementById("log").innerHTML += m+"<br>";
}

log("V5 CORE READY");

</script>

</body>
</html>
