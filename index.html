Gtfs Pro (távolság + Iránytű + Legközelebbi Megálló)·html

<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Attila Közlekedés - GTFS Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
body{font-family:Arial;margin:0;background:#0f172a;color:#e2e8f0}
header{padding:10px;background:#111827;position:sticky;top:0}
button{padding:8px 10px;margin:5px;border:0;border-radius:6px;background:#2563eb;color:white}
#map{height:40vh;background:#1f2937;display:flex;align-items:center;justify-content:center}
.panel{padding:10px}
.card{background:#111827;padding:10px;margin:8px 0;border-radius:8px}
small{opacity:.8}
</style>
</head>
<body>
<header>
<b>🚍 Attila GTFS Pro</b>
<button onclick="loadGTFS()">GTFS betöltés</button>
<button onclick="getLocation()">📍 GPS</button>
<button onclick="startCompass()">🧭 Iránytű</button>
</header>

<div id="map">TÉRKÉP HELY (később Leaflet / BKK map)</div>

<div class="panel">
<div class="card">
<b>📏 Távolság & Legközelebbi megálló</b>
<div id="nearest">Nincs adat</div>
</div>

<div class="card">
<b>📡 GPS státusz</b>
<div id="gps">Nincs GPS</div>
</div>

<div class="card">
<b>🧭 Irány</b>
<div id="compass">--</div>
</div>
</div>

<script>
let stops = [];
let userLat = null;
let userLon = null;

function haversine(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = x => x * Math.PI/180;
  const dLat = toRad(lat2-lat1);
  const dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)*Math.sin(dLat/2) +
    Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*
    Math.sin(dLon/2)*Math.sin(dLon/2);
  const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R*c;
}

function loadGTFS(){
  fetch("stops.txt") // ide jön a ZIP-ből kinyert file
    .then(r=>r.text())
    .then(text=>{
      const parsed = Papa.parse(text,{header:true});
      stops = parsed.data.filter(s=>s.stop_lat && s.stop_lon);
      alert("GTFS betöltve: " + stops.length + " megálló");
    });
}

function getLocation(){
  navigator.geolocation.getCurrentPosition(pos=>{
    userLat = pos.coords.latitude;
    userLon = pos.coords.longitude;
    document.getElementById("gps").innerHTML =
      `Lat: ${userLat.toFixed(5)}<br>Lon: ${userLon.toFixed(5)}`;
    findNearest();
  });
}

function findNearest(){
  if(!userLat || !stops.length) return;

  let min = Infinity;
  let best = null;

  stops.forEach(s=>{
    const d = haversine(userLat,userLon,parseFloat(s.stop_lat),parseFloat(s.stop_lon));
    if(d < min){ min = d; best = s; }
  });

  if(best){
    document.getElementById("nearest").innerHTML =
      `🚏 <b>${best.stop_name}</b><br>🆔 ${best.stop_id || "-"}<br>📏 ${Math.round(min)} m`;
  }
}

function startCompass(){
  if(window.DeviceOrientationEvent){
    window.addEventListener("deviceorientation", e=>{
      let dir = e.alpha;
      document.getElementById("compass").innerText =
        "Észak: " + Math.round(dir) + "°";
    });
  } else {
    alert("Nincs iránytű támogatás");
  }
}
</script>
</body>
</html>
