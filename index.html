<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR CORE V1</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Consolas,monospace;
}

/* ================= ÓRA ================= */
#clockPanel{
    background:#000;
    padding:10px;
    text-align:center;
    border-bottom:2px solid #00ff66;
}

#clock{
    font-size:54px;
    font-weight:bold;
    color:#00ff66;
    text-shadow:0 0 20px #00ff66;
}

/* =============== HELYZET =============== */
#locationPanel{
    background:#2d2600;
    color:#ffd000;
    padding:12px;
    font-size:14px;
    border-bottom:2px solid #665500;
}

.distance{
    color:#7dff7d;
    font-weight:bold;
}

.stop{
    padding:6px;
    border-bottom:1px solid #222;
}
</style>
</head>

<body>

<div id="clockPanel">
    <div id="clock">00:00:00</div>
</div>

<div id="locationPanel">
    <div class="title">📍 HELYZETEM</div>
    <div id="address">Pozíció keresése...</div>
</div>

<div id="stops"></div>

<script>
/* ================= ÓRA ================= */
function updateClock(){
    const now = new Date();
    document.getElementById("clock").innerHTML =
        now.toLocaleTimeString('hu-HU', { hour12:false });
}
setInterval(updateClock,1000);
updateClock();

/* ================= GPS ================= */
let myLat = null;
let myLon = null;

async function updateLocation(){
    if(!navigator.geolocation){
        document.getElementById("address").innerHTML = "GPS nem elérhető";
        return;
    }

    navigator.geolocation.getCurrentPosition(async pos=>{
        myLat = pos.coords.latitude;
        myLon = pos.coords.longitude;

        let city="", road="", house="";

        try{
            const url =
`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${myLat}&lon=${myLon}`;

            const res = await fetch(url);
            const data = await res.json();

            city = data.address.city || data.address.town || data.address.village || "";
            road = data.address.road || "";
            house = data.address.house_number || "";
        }catch(e){}

        document.getElementById("address").innerHTML =
        `🏙️ ${city}<br>
         🛣️ ${road} ${house}<br><br>
         🌍 ${myLat.toFixed(6)}<br>
         🌍 ${myLon.toFixed(6)}<br><br>
         🎯 ±${Math.round(pos.coords.accuracy)} m`;

        renderStops();

    }, err=>{
        document.getElementById("address").innerHTML = "GPS nem elérhető";
    },{
        enableHighAccuracy:true
    });
}

updateLocation();
setInterval(updateLocation,30000);

/* ================= TÁVOLSÁG ================= */
function distanceMeters(lat1, lon1, lat2, lon2){
    const R = 6371000; // Föld sugár méterben

    const dLat = (lat2-lat1) * Math.PI/180;
    const dLon = (lon2-lon1) * Math.PI/180;

    const a =
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.sin(dLon/2) * Math.sin(dLon/2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

    return R * c;
}

/* ================= DEMO GTFS STOPOK ================= */
const stops = [
    {stop_name:"Nád utca", stop_id:"BKK-F00457",stop_lat: 47.594072, stop_lon: 19.048469},

    {stop_name:"Florián tér_Vörösvári ut", stop_id:"BKK-F00611", stop_lat: 47.542896, stop_lon: 19.042252},
    {stop_name:"Florián tér_Szentendrei ut", stop_id:"BKK-F00613", stop_lat: 47.541664, stop_lon: 19.040084},
    {stop_name:"Kisinóci turistaház", stop_id:"VOLAN-778186", stop_lat: 47.890600, stop_lon: 18.927580},
    {stop_name:"Verecke lépcsö", stop_id:"BKK-F00265",  stop_lat: 47.529117,  stop_lon: 19.003624},
    {stop_name:"Csobánka tér-243 vá", stop_id:"BKK-F044192", stop_lat: 47.597795,  stop_lon: 19.053787},
    {stop_name:"Csobánka tér-160 vá", stop_id:"BKK-008939", stop_lat: 47.598425,  stop_lon: 19.054240},
    {stop_name:"Szentendre, HÉV végállomás", stop_id:"H5-09142221", stop_lat: 47.661038, stop_lon:19.075607},
    {stop_name:"Szentendre, Autóbusz-állomás", stop_id:"VOLÁN-778806-99",  stop_lat: 47.660403, stop_lon:19.075408},
    {stop_name:"Szentendre, Skanzen 1", stop_id:"VOLÁN-778840-1",  stop_lat: 47.691135, stop_lon:19.046955},
    {stop_name:"Szentendre, Skanzen 2",  stop_id:"VOLÁN-778840-2",  stop_lat: 47.691273, stop_lon:19.045667},
    {stop_name:"Tahitótfalu, hídfő 1",  stop_id:"VOLÁN-779053-1",  stop_lat: 47.751712, stop_lon: 19.078215}, 
    {stop_name:"Tahitótfalu, hídfő 2",  stop_id:"VOLÁN-779053-2",  stop_lat: 47.751648, stop_lon: 19.078091},
    {stop_name:"Szentendre, Dömör-kapu", stop_id:"VOLÁN-778803", stop_lat: 47.694900, stop_lon: 19.000210},
    {stop_name:"Szob, Vasútállomás", stop_id: "VOLAN-779011", stop_lat: 47.821319, stop_lon: 18.862602},
    {stop_name:"Nagybörzsöny, községháza",  stop_id:"VOLAN-778310",stop_lat: 47.936030, stop_lon: 18.827710},
    {stop_name:"Királyrét",  stop_id:"VOLAN-779017",stop_lat: 47.895040,stop_lon: 18.977687},
    {stop_name:"Magastaxi turistaház, Börzsöny", stop_id:"ERDÖ" ,stop_lat:47.92842, stop_lon: 18.92997},
    
    ];
    
    

/* ================= RENDER ================= */
function renderStops(){
    const out = document.getElementById("stops");
    if(!myLat || !myLon){
        out.innerHTML = "";
        return;
    }

    out.innerHTML = stops.map(s=>{
        let dist = "";

        if(s.stop_lat && s.stop_lon){
            const d = distanceMeters(myLat,myLon,s.stop_lat,s.stop_lon);
            dist = d < 1000
                ? Math.round(d) + " m"
                : (d/1000).toFixed(2) + " km";
        }

        return `
        <div class="stop">
            🚏 ${s.stop_name}<br>
            ID: ${s.stop_id}<br>
            📏 <span class="distance">${dist}</span>
        </div>`;
    }).join("");
}
</script>

</body>
</html>
