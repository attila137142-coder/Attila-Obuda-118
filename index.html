<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07110b">
<title>Attila Desktop Weather Clock V2.0 REAL</title>
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;font-family:Arial,Helvetica,sans-serif}.widget{width:320px;max-width:calc(100vw - 8px);padding:18px;background:linear-gradient(145deg,#07110b,#15251a);color:white;border-radius:18px;border:2px solid #19ff77;box-shadow:0 0 20px rgba(0,255,100,.45)}.title{text-align:center;color:#19ff77;font-size:18px;font-weight:bold}.clock{margin-top:10px;text-align:center;font-size:52px;font-weight:bold;color:#00ff66;letter-spacing:3px}.date{text-align:center;margin-top:5px;font-size:22px;color:#ff9d00}.weather{margin-top:20px;padding:12px;background:#101820;border-radius:12px;text-align:center}.condition{font-size:22px;line-height:1.2}.temp{font-size:38px;color:#00d9ff;font-weight:bold;margin-top:5px}.small{font-size:13px;color:#aaa}.stats{margin-top:15px;display:flex;justify-content:space-between;gap:8px}.box{width:50%;padding:10px 5px;background:#0b0f14;border-radius:10px;text-align:center}.min{color:#45aaff;font-size:22px;font-weight:bold}.max{color:#ff5555;font-size:22px;font-weight:bold}.location{margin-top:10px;text-align:center;font-size:13px;color:#bdebcf}.status{margin-top:8px;text-align:center;font-size:11px;color:#aaa;min-height:14px}.actions{display:flex;gap:6px;margin-top:10px}button{flex:1;border:1px solid #19ff77;border-radius:8px;background:#0b1710;color:#19ff77;padding:7px 4px;font-size:11px;cursor:pointer}button:active{transform:scale(.98)}.footer{margin-top:12px;text-align:center;font-size:11px;color:#777}
</style>
</head>
<body>
<div class="widget">
<div class="title">🚦 ATTILA DESKTOP WEATHER CLOCK V2.0</div>
<div id="clock" class="clock">00:00:00</div>
<div id="date" class="date">----</div>
<div class="weather">
<div id="condition" class="condition">🌍 Helymeghatározás...</div>
<div id="temp" class="temp">--.- °C</div>
<div>Kinti hőmérséklet</div>
<div id="location" class="location">Budapest alapértelmezett hely</div>
<div id="weatherStatus" class="status">Időjárási adat betöltése...</div>
</div>
<div class="stats">
<div class="box"><div class="small">24 óra MIN</div><div id="minTemp" class="min">--.- °C</div></div>
<div class="box"><div class="small">24 óra MAX</div><div id="maxTemp" class="max">--.- °C</div></div>
</div>
<div class="actions"><button id="locBtn">📍 HELY FRISSÍTÉSE</button><button id="weatherBtn">🌡️ IDŐJÁRÁS FRISSÍTÉSE</button></div>
<div class="footer">Valós idő + GPS helyi időjárás • Open-Meteo • V2.0 REAL</div>
</div>
<script>
const DEFAULT_LOCATION={lat:47.4979,lon:19.0402,name:"Budapest"};
let currentLocation={...DEFAULT_LOCATION};let locationSource="Budapest alapértelmezett hely";
function $(id){return document.getElementById(id)}
function updateClock(){const now=new Date();$("clock").textContent=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0")+":"+String(now.getSeconds()).padStart(2,"0");$("date").textContent=now.getFullYear()+"."+String(now.getMonth()+1).padStart(2,"0")+"."+String(now.getDate()).padStart(2,"0")+"."}
setInterval(updateClock,250);updateClock();
function weatherText(code){code=Number(code);if(code===0)return"☀️ Derült";if(code===1)return"🌤️ Többnyire derült";if(code===2)return"⛅ Részben felhős";if(code===3)return"☁️ Borult";if([45,48].includes(code))return"🌫️ Köd";if([51,53,55].includes(code))return"🌦️ Szitálás";if([56,57].includes(code))return"🌧️ Ónos szitálás";if([61,63,65].includes(code))return"🌧️ Eső";if([66,67].includes(code))return"🌧️ Ónos eső";if([71,73,75].includes(code))return"🌨️ Havazás";if(code===77)return"❄️ Hódara";if([80,81,82].includes(code))return"🌦️ Zápor";if([85,86].includes(code))return"🌨️ Hózápor";if(code===95)return"⛈️ Zivatar";if([96,99].includes(code))return"⛈️ Zivatar jéggel";return"🌍 Ismeretlen időjárás"}
async function loadWeather(){
$("weatherStatus").textContent="Időjárási adat frissítése...";
const lat=Number(currentLocation.lat).toFixed(5),lon=Number(currentLocation.lon).toFixed(5);
const url="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,weather_code&hourly=temperature_2m&past_days=1&forecast_days=1&timezone=auto";
try{const response=await fetch(url,{cache:"no-store"});if(!response.ok)throw new Error("HTTP "+response.status);const data=await response.json();const currentTemp=data.current&&Number(data.current.temperature_2m);if(Number.isFinite(currentTemp))$("temp").textContent=currentTemp.toFixed(1)+" °C";if(data.current)$("condition").textContent=weatherText(data.current.weather_code);const temps=data.hourly&&Array.isArray(data.hourly.temperature_2m)?data.hourly.temperature_2m:[];const validTemps=temps.map(Number).filter(Number.isFinite);if(validTemps.length){const last24=validTemps.slice(Math.max(0,validTemps.length-24));$("minTemp").textContent=Math.min(...last24).toFixed(1)+" °C";$("maxTemp").textContent=Math.max(...last24).toFixed(1)+" °C"}$("location").textContent=locationSource+" • "+Number(currentLocation.lat).toFixed(5)+", "+Number(currentLocation.lon).toFixed(5);const now=new Date();$("weatherStatus").textContent="Frissítve: "+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0")+":"+String(now.getSeconds()).padStart(2,"0")}catch(error){console.error("Open-Meteo hiba:",error);$("weatherStatus").textContent="NINCS FRISS IDŐJÁRÁSI ADAT • "+(error.message||"kapcsolati hiba")}}
function updateLocation(){if(!navigator.geolocation){currentLocation={...DEFAULT_LOCATION};locationSource="Budapest • GPS nem támogatott";loadWeather();return}$("weatherStatus").textContent="📍 Helymeghatározás folyamatban...";navigator.geolocation.getCurrentPosition(function(position){currentLocation={lat:position.coords.latitude,lon:position.coords.longitude,name:"Aktuális készülékhely"};locationSource="📍 Aktuális készülékhely";loadWeather()},function(error){console.warn("GPS hiba:",error);currentLocation={...DEFAULT_LOCATION};locationSource="Budapest • GPS nem engedélyezett";loadWeather()},{enableHighAccuracy:true,timeout:10000,maximumAge:300000})}
$("locBtn").addEventListener("click",updateLocation);$("weatherBtn").addEventListener("click",loadWeather);updateLocation();setInterval(loadWeather,5*60*1000);
</script>
</body>
</html>
