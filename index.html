<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Attila PDF → Táblázat Engine V0.1
</title>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<style>

body{

font-family:Arial;

background:#111;

color:white;

padding:20px;

}


h1{

color:#00eaff;

}


.panel{

background:#1b1b1b;

border:1px solid #444;

border-radius:12px;

padding:15px;

margin-bottom:15px;

}


button{

padding:10px 18px;

background:#008cff;

color:white;

border:0;

border-radius:8px;

cursor:pointer;

}


button:hover{

background:#00b7ff;

}


table{

border-collapse:collapse;

width:100%;

background:white;

color:black;

}


td,th{

border:1px solid #555;

padding:6px;

text-align:center;

}


pre{

background:#000;

padding:10px;

max-height:400px;

overflow:auto;

}


</style>


</head>


<body>


<h1>
🧪 Attila PDF → Táblázat Engine V0.1
</h1>



<div class="panel">

<h3>
PDF kiválasztás
</h3>


<input 
type="file"
id="pdfFile"
accept=".pdf">


<br><br>


<button onclick="startPDF()">
Feldolgozás indítása
</button>


</div>



<div class="panel">

<h3>
Állapot
</h3>

<div id="status">
Várakozás...
</div>

</div>



<div class="panel">

<h3>
Koordináta adatok
</h3>

<pre id="coords">
---
</pre>


</div>



<div class="panel">

<h3>
Visszaépített táblázat
</h3>


<div id="table">

---

</div>


</div>



<script>


let items=[];



function status(t){

document.getElementById("status").innerHTML=t;

}



async function startPDF(){


const file=
document.getElementById("pdfFile").files[0];


if(!file){

alert("Válassz PDF fájlt!");

return;

}



status(
"PDF betöltése..."
);



const data=
await file.arrayBuffer();



const pdf=
await pdfjsLib.getDocument({
data:data
}).promise;



status(
"Oldal feldolgozása..."
);



const page=
await pdf.getPage(1);



const content=
await page.getTextContent();



items=[];



content.items.forEach(item=>{


items.push({

text:item.str,

x:item.transform[4],

y:item.transform[5]

});


});



status(
"✅ Koordináták kiolvasva"
);



showCoords();



buildTable();


}



function showCoords(){


let out="";


items.forEach(i=>{


out+=
i.text+
"   X:"+
i.x.toFixed(1)+
" Y:"+
i.y.toFixed(1)
+
"\n";


});


document.getElementById("coords").textContent=out;


}



</script>


</body>

</html>
