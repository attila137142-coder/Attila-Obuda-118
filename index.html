<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Börzsöny PRO OFFLINE NAVIGÁTOR V7</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#0a0f14;
    color:#d7e2ea;
}

#topbar{
    background:#101826;
    padding:10px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

button{
    padding:8px 10px;
    border:none;
    border-radius:6px;
    background:#1f6feb;
    color:white;
    cursor:pointer;
}

button:hover{background:#2d7fff;}

#layout{
    display:grid;
    grid-template-columns:340px 1fr;
    height: calc(100vh - 60px);
}

#panel{
    background:#0f1722;
    padding:10px;
    overflow:auto;
    border-right:1px solid #1f2a38;
}

.card{
    background:#111826;
    border:1px solid #1f2a38;
    border-radius:8px;
    padding:10px;
    margin-bottom:10px;
}

.small{font-size:12px; opacity:0.85;}

#map{height:100%; width:100%;}

input{
    width:100%;
    padding:8px;
    margin-top:5px;
    background:#0b1220;
    border:1px solid #1f2a38;
    color:white;
    border-radius:6px;
}
</style>
</head>

<body>

<div id="topbar">
    <button onclick="startGPS()">📍 GPS</button>
    <button onclick="loadGPX()">📁 GPX betöltés</button>
    <button onclick="exportSOS()">🚨 VÉSZ MÓD</button>
    <button onclick="clearTrack()">🧹 Törlés</button>
</div>

<div id="layout">

<div id="panel">

<div class="card">
<b>📡 GPS</b>
<div id="gps" class="small">nincs adat</div>
</div>

<div class="card">
<b>🧭 TRACK</b>
<div id="trackInfo" class="small">OFF</div>
</div>

<div class="card">
<b>📏 TÁVOLSÁG</b>
<div id="dist" class="small">0 m</div>
</div>

<div class="card">
<b>⛰️ SZINT PROFIL</b>
<div id="elev" class="small">nincs adat</div>
</div>

<div class="card">
<b>🚨 VÉSZ ADAT</b>
<div id="sos" class="small">-</div>
</div>

<div class="card">
<b>📁 GPX IMPORT</b>
<input type="file" id="gpxFile" accept=".gpx"/>
</div>

</div>

<div id="map"></div>

</div>

<script>

let map = L.map('map').setView([47.87, 18.98], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
}).addTo(map);

let marker;
let track = [];
let polyline;
let watchId;
let totalDist = 0;
let lastPoint = null;

// GPS
function startGPS(){
    watchId = navigator.geolocation.watchPosition(pos=>{
        let lat = pos.coords.latitude;
        let lon = pos.coords.longitude;

        document.getElementById("gps").innerHTML =
            `Lat: ${lat}<br>Lon: ${lon}<br>Acc: ${pos.coords.accuracy} m`;

        if(!marker){
            marker = L.marker([lat,lon]).addTo(map);
        } else {
            marker.setLatLng([lat,lon]);
        }

        track.push([lat,lon]);

        if(lastPoint){
            totalDist += map.distance(lastPoint, [lat,lon]);
            document.getElementById("dist").innerHTML =
                totalDist.toFixed(0) + " m";
        }

        lastPoint = [lat,lon];

        if(polyline) map.removeLayer(polyline);
        polyline = L.polyline(track,{color:"cyan"}).addTo(map);

        map.setView([lat,lon]);

    },{
        enableHighAccuracy:true
    });
}

// GPX import (basic parser)
function loadGPX(){
    let file = document.getElementById("gpxFile").files[0];
    if(!file) return alert("Nincs GPX");

    let reader = new FileReader();

    reader.onload = function(e){
        let parser = new DOMParser();
        let xml = parser.parseFromString(e.target.result,"text/xml");

        let trkpts = xml.getElementsByTagName("trkpt");

        track = [];

        for(let p of trkpts){
            let lat = parseFloat(p.getAttribute("lat"));
            let lon = parseFloat(p.getAttribute("lon"));
            track.push([lat,lon]);
        }

        if(polyline) map.removeLayer(polyline);

        polyline = L.polyline(track,{color:"lime"}).addTo(map);

        map.fitBounds(polyline.getBounds());
    };

    reader.readAsText(file);
}

// VÉSZ MÓD
function exportSOS(){
    if(!marker) return;

    let p = marker.getLatLng();

    let text =
`🚨 BÖRZSÖNY SOS
Lat: ${p.lat}
Lon: ${p.lng}
Google: https://maps.google.com/?q=${p.lat},${p.lng}`;

    document.getElementById("sos").innerText = text;

    navigator.clipboard.writeText(text);
    alert("SOS kimásolva!");
}

// törlés
function clearTrack(){
    track = [];
    totalDist = 0;
    lastPoint = null;

    if(polyline) map.removeLayer(polyline);

    document.getElementById("dist").innerHTML = "0 m";
}

</script>

</body>
</html>
