<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GTFS PRO V29 SMART ROUTE AI ENGINE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{font-family:Arial;margin:0;background:#0f172a;color:#e2e8f0}
header{padding:10px;background:#111827;position:sticky;top:0;z-index:999}
button,input{padding:6px;margin:5px;border-radius:6px;border:0}
.card{background:#111827;margin:10px;padding:10px;border-radius:8px}
#map{height:420px;margin:10px;border-radius:10px}
</style>
</head>
<body>

<header>
<b>🧠 GTFS PRO V29 SMART ROUTE AI ENGINE</b><br>
<span>AI ROUTE + EVAC + VISUAL SYSTEM</span><br>

<input id="search" placeholder="Pilis / Börzsöny / Skanzen..." />
<button onclick="startGPS()">📍 GPS</button>
<button onclick="tourSearch()">🧭 TOUR</button>
<button onclick="smartRoute()">🧠 SMART ROUTE</button>
</header>

<div id="map"></div>

<div class="card">
<b>📍 GPS</b>
<div id="gps">-</div>
</div>

<div class="card">
<b>🧠 AI ROUTE RESULT</b>
<div id="out">-</div>
</div>

<script>
let map,userMarker;
let userLat=47.4979,userLon=19.0402;
let layers=[];

function initMap(){
  map=L.map('map').setView([userLat,userLon],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  userMarker=L.marker([userLat,userLon]).addTo(map);
}
initMap();

function startGPS(){
  navigator.geolocation.watchPosition(p=>{
    userLat=p.coords.latitude;
    userLon=p.coords.longitude;
    document.getElementById("gps").innerText=`📍 ${userLat.toFixed(5)}, ${userLon.toFixed(5)}`;
    userMarker.setLatLng([userLat,userLon]);
  });
}

function dist(a,b,c,d){
  const R=6371000;
  const x=x=>x*Math.PI/180;
  const dLat=x(c-a);
  const dLon=x(d-b);
  const s=Math.sin(dLat/2)**2+
    Math.cos(x(a))*Math.cos(x(c))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}

function clear(){layers.forEach(l=>map.removeLayer(l));layers=[];}

// ================= SMART AI ROUTE =================
async function smartRoute(){

  clear();
  document.getElementById("out").innerHTML="🧠 AI ROUTE CALCULATING...";

  const bbox="47.2,18.6,47.9,19.6";

  const query=`
[out:json][timeout:12];
(
  node["amenity"="shelter"](${bbox});
  node["place"="village"](${bbox});
  node["highway"="bus_stop"](${bbox});
);
out center;
`;

  let data=null;

  try{
    const res=await fetch("https://overpass-api.de/api/interpreter",{
      method:"POST",
      body:query
    });
    if(res.ok) data=await res.json();
  }catch(e){data=null;}

  if(!data || !data.elements) data={elements:generateFallback()};

  const weighted=data.elements.map(p=>{

    let w=1;

    if(p.tags?.amenity=="shelter") w=0.5;
    if(p.tags?.place=="village") w=0.7;
    if(p.tags?.highway=="bus_stop") w=1.2;

    const d=dist(userLat,userLon,p.lat,p.lon)*w;

    return {...p,score:d};
  });

  weighted.sort((a,b)=>a.score-b.score);

  const best=weighted.slice(0,3);

  best.forEach((p,i)=>{

    const color=i==0?"red":i==1?"orange":"yellow";

    const line=L.polyline([
      [userLat,userLon],
      [p.lat,p.lon]
    ],{color,weight:4-i}).addTo(map);

    layers.push(line);

    L.marker([p.lat,p.lon]).addTo(map)
      .bindPopup("🧠 " + (p.tags?.name||"TARGET"));

  });

  map.fitBounds(L.featureGroup(layers).getBounds());

  document.getElementById("out").innerHTML=
    best.map(p=>`
🧠 <b>${p.tags?.name||"TARGET"}</b><br>
📏 score: ${Math.round(p.score)}<br>
📌 ${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}<hr>
`).join("");
}

// ================= TOUR =================
async function tourSearch(){
  document.getElementById("out").innerHTML="🧭 TOUR...";
  smartRoute();
}

// ================= FALLBACK =================
function generateFallback(){
  return [
    {lat:userLat+0.01,lon:userLon+0.01,tags:{place:"village",name:"Fallback falu"}},
    {lat:userLat-0.01,lon:userLon-0.01,tags:{amenity:"shelter",name:"Fallback shelter"}},
    {lat:userLat+0.005,lon:userLon-0.006,tags:{highway:"bus_stop",name:"Fallback stop"}}
  ];
}
</script>

</body>
</html>
