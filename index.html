<!-- =========================================================
     FIX15 – REALTIME / SEARCH / DEPARTURE DUPLICATE FIX
     ========================================================= -->

<script>
/* ---------------------------------------------------------
   FIX15 ÁLLAPOT
   --------------------------------------------------------- */

const FIX_VERSION = "FIX15";

let realtimeAuthorized = false;
let lastRealVehicles = [];
let lastTripUpdates = new Map();

const REALTIME_ERROR_TEXT =
  "BKK REALTIME: HTTP 401 – API-KULCS / HITELESÍTÉS SZÜKSÉGES";


/* ---------------------------------------------------------
   NINCS ADAT
   --------------------------------------------------------- */

function noData(v){
  if(v === undefined || v === null) return "NINCS ADAT";

  const s = String(v).trim();

  if(
    !s ||
    s === "null" ||
    s === "undefined" ||
    s === "-" ||
    s === "—"
  ){
    return "NINCS ADAT";
  }

  return s;
}


/* ---------------------------------------------------------
   URL – MINDEN GOMB KÜLÖN CÍM
   --------------------------------------------------------- */

const TRANSPORT_URLS = {

  BKK:
    "https://bkk.hu/",

  BKK_INFO:
    "https://bkk.hu/bkk-info",

  BKK_GTFS:
    "https://bkk.hu/bkk-partnerek/egyeb/gtfs-menetrendi-adatok-programozoknak/",

  BUDAPESTGO:
    "https://bkk.hu/getbudapestgo/",

  WINMENETREND:
    "https://online.winmenetrend.hu/",

  BKK_OPENDATA:
    "https://opendata.bkk.hu/"

};


/* ---------------------------------------------------------
   URL GOMB NYITÁS
   --------------------------------------------------------- */

function openTransportUrl(name){

  const url = TRANSPORT_URLS[name];

  if(!url){
    log("URL hiba: nincs külön cím ehhez: " + name);
    return;
  }

  window.open(url, "_blank", "noopener,noreferrer");
}


/* ---------------------------------------------------------
   BKK AUTH – EGY HELYEN
   --------------------------------------------------------- */

function getApiKey(){

  return (
    document.getElementById("apiKey")?.value?.trim() ||
    localStorage.getItem("BKK_API_KEY") ||
    ""
  );

}


function bkkRequestUrl(baseUrl){

  const key = getApiKey();

  if(!key){
    return baseUrl;
  }

  const separator =
    baseUrl.includes("?") ? "&" : "?";

  return baseUrl + separator +
    "key=" + encodeURIComponent(key);

}


function bkkHeaders(){

  const key = getApiKey();

  const h = {
    "Accept": "*/*",
    "Cache-Control": "no-cache"
  };

  if(key){

    h["x-api-key"] = key;
    h["X-API-Key"] = key;

  }

  return h;

}


/* ---------------------------------------------------------
   HTTP 401 KÖZPONTI KEZELÉS
   --------------------------------------------------------- */

async function bkkFetch(url){

  const response = await fetch(
    bkkRequestUrl(url),
    {
      method: "GET",
      headers: bkkHeaders(),
      cache: "no-store"
    }
  );

  if(response.status === 401){

    realtimeAuthorized = false;

    throw new Error("HTTP 401");

  }

  if(!response.ok){

    throw new Error(
      "HTTP " + response.status
    );

  }

  realtimeAuthorized = true;

  return response;

}


/* ---------------------------------------------------------
   VEHICLE POSITIONS
   --------------------------------------------------------- */

async function loadVehiclePositions(){

  try{

    const response =
      await bkkFetch(VP_URL);

    const buffer =
      await response.arrayBuffer();

    const vehicles =
      parseVP(buffer);

    if(
      Array.isArray(vehicles) &&
      vehicles.length
    ){

      lastRealVehicles =
        vehicles.map(v => ({
          ...v,
          source:
            v.source ||
            "BKK GTFS-RT VehiclePositions"
        }));

      vehicleData =
        [...lastRealVehicles];

      log(
        "VehiclePositions: " +
        lastRealVehicles.length +
        " valódi jármű."
      );

    }else{

      vehicleData =
        [...lastRealVehicles];

      log(
        "VehiclePositions: nincs új valódi adat — " +
        "utolsó valódi adatok megtartva."
      );

    }

    realtimeAuthorized = true;

  }catch(err){

    if(String(err.message).includes("401")){

      realtimeAuthorized = false;

      vehicleData =
        [...lastRealVehicles];

      log(
        REALTIME_ERROR_TEXT +
        " — utolsó valódi adatok megtartva."
      );

    }else{

      vehicleData =
        [...lastRealVehicles];

      log(
        "VehiclePositions hiba: " +
        err.message +
        " — utolsó valódi adatok megtartva."
      );

    }

  }

}


/* ---------------------------------------------------------
   TRIP UPDATES
   --------------------------------------------------------- */

async function loadTripUpdates(){

  try{

    const response =
      await bkkFetch(TU_URL);

    const buffer =
      await response.arrayBuffer();

    const updates =
      parseTripUpdates(buffer);

    if(updates instanceof Map){

      lastTripUpdates =
        updates;

    }

    log(
      "TripUpdates: " +
      lastTripUpdates.size +
      " valódi realtime kapcsolat."
    );

    applyTripUpdates();

  }catch(err){

    if(String(err.message).includes("401")){

      log(
        "TripUpdates hiba: HTTP 401 — " +
        "utolsó valódi késésadatok megtartva."
      );

    }else{

      log(
        "TripUpdates hiba: " +
        err.message
      );

    }

  }

}


/* ---------------------------------------------------------
   TRIP UPDATE ALKALMAZÁS
   --------------------------------------------------------- */

function applyTripUpdates(){

  if(!Array.isArray(vehicleData))
    return;

  for(const v of vehicleData){

    let u = null;

    const vehicleId =
      String(v.vehicleId || v.id || "");

    const tripId =
      String(v.tripId || "");

    const stopSequence =
      Number(v.stopSequence);

    /*
      1. vehicleId
    */

    if(vehicleId){

      u =
        lastTripUpdates.get(
          "vehicle:" + vehicleId
        );

    }

    /*
      2. trip + stop sequence
    */

    if(!u && tripId){

      u =
        lastTripUpdates.get(
          "trip:" +
          tripId +
          ":" +
          stopSequence
        );

    }

    /*
      3. trip
    */

    if(!u && tripId){

      u =
        lastTripUpdates.get(
          "trip:" + tripId
        );

    }

    if(u){

      if(
        u.delaySeconds !== undefined &&
        u.delaySeconds !== null
      ){

        v.delaySeconds =
          Number(u.delaySeconds);

      }

    }

  }

}


/* ---------------------------------------------------------
   SIETÉS / KÉSÉS
   --------------------------------------------------------- */

function formatDelay(seconds){

  if(
    seconds === undefined ||
    seconds === null ||
    !Number.isFinite(Number(seconds))
  ){

    return '<span class="nodata">NINCS ADAT</span>';

  }

  const s =
    Math.round(Number(seconds));

  if(s === 0){

    return '<span class="delay-ok">0:00</span>';

  }

  const abs =
    Math.abs(s);

  const m =
    Math.floor(abs / 60);

  const sec =
    String(abs % 60).padStart(2,"0");

  if(s < 0){

    return (
      '<span class="delay-early">' +
      'SIETÉS −' +
      m + ":" + sec +
      '</span>'
    );

  }

  return (
    '<span class="delay-late">' +
    'KÉSÉS +' +
    m + ":" + sec +
    '</span>'
  );

}


/* ---------------------------------------------------------
   DUPLIKÁLT INDULÁSOK KISZŰRÉSE
   --------------------------------------------------------- */

function departureUniqueKey(d){

  return [
    String(d.trip_id || ""),
    String(d.stop_id || ""),
    String(d.stop_sequence || ""),
    String(
      d.departure_time ||
      d.arrival_time ||
      ""
    )
  ].join("|");

}


function uniqueDepartures(list){

  const seen =
    new Set();

  const result = [];

  for(const d of list){

    const key =
      departureUniqueKey(d);

    if(seen.has(key))
      continue;

    seen.add(key);

    result.push(d);

  }

  return result;

}


/* ---------------------------------------------------------
   GTFS IDŐ
   --------------------------------------------------------- */

function gtfsTimeToText(value){

  if(value === undefined || value === null)
    return "NINCS ADAT";

  const s =
    String(value).trim();

  const p =
    s.split(":");

  if(p.length !== 3)
    return s || "NINCS ADAT";

  let h =
    Number(p[0]);

  let m =
    Number(p[1]);

  let sec =
    Number(p[2]);

  if(
    !Number.isFinite(h) ||
    !Number.isFinite(m) ||
    !Number.isFinite(sec)
  ){

    return "NINCS ADAT";

  }

  /*
    GTFS-ben 24:00, 25:00 stb. is megengedett.
    A kijelzésből csak a teljes időtartományt tartjuk meg.
  */

  return (
    String(h).padStart(2,"0") +
    ":" +
    String(m).padStart(2,"0") +
    ":" +
    String(sec).padStart(2,"0")
  );

}


/* ---------------------------------------------------------
   18 MEZŐS MEGÁLLÓ-INDULÁSI PANEL
   --------------------------------------------------------- */

const DEPARTURE_FIELDS = [

  "INDULÁS",
  "JÁRAT GTFS",
  "JÁRAT UTAS",
  "CÉL",
  "LABEL",
  "FORDA",
  "RENDSZÁM",
  "FORGALMI",
  "JÁRMŰTÍPUS",
  "MEGÁLLÓ",
  "GTFS ID",
  "TÁV",
  "SEBESSÉG",
  "SAJÁT GPS",
  "VEHICLE ID",
  "TRIP",
  "STOP SORREND",
  "SIETÉS–KÉSÉS"

];


function departureHeader(){

  return `
    <div class="departure-row departure-header">
      ${DEPARTURE_FIELDS
        .map(x => `<div>${x}</div>`)
        .join("")}
    </div>
  `;

}


function departureRow(d, stop){

  const live =
    findLiveVehicleForDeparture(d);

  const dist =
    live && myPos
      ? distanceMeters(
          myPos.lat,
          myPos.lon,
          Number(live.lat),
          Number(live.lon)
        )
      : null;

  return `
    <div class="departure-row">

      <div>
        ${gtfsTimeToText(
          d.departure_time ||
          d.arrival_time
        )}
      </div>

      <div>
        ${noData(d.route_id)}
      </div>

      <div>
        ${noData(
          d.route_short_name
        )}
      </div>

      <div>
        ${noData(d.trip_headsign)}
      </div>

      <div>
        ${noData(live?.label)}
      </div>

      <div>
        ${noData(live?.forda)}
      </div>

      <div>
        ${noData(live?.licensePlate)}
      </div>

      <div>
        ${noData(live?.forgalmi)}
      </div>

      <div>
        ${noData(live?.vehicleType)}
      </div>

      <div>
        ${noData(stop?.stop_name)}
      </div>

      <div>
        ${noData(stop?.stop_id)}
      </div>

      <div>
        ${
          dist === null
            ? "NINCS ADAT"
            : Math.round(dist) + " m"
        }
      </div>

      <div>
        ${
          live?.speed === undefined ||
          live?.speed === null
            ? "NINCS ADAT"
            : Math.round(
                Number(live.speed) * 3.6
              ) + " km/h"
        }
      </div>

      <div>
        ${
          myPos
            ? (
                live
                  ? Math.round(
                      distanceMeters(
                        myPos.lat,
                        myPos.lon,
                        Number(live.lat),
                        Number(live.lon)
                      )
                    ) + " m"
                  : "NINCS ADAT"
              )
            : "NINCS ADAT"
        }
      </div>

      <div>
        ${noData(live?.vehicleId)}
      </div>

      <div>
        ${noData(d.trip_id)}
      </div>

      <div>
        ${noData(d.stop_sequence)}
      </div>

      <div>
        ${formatDelay(
          live?.delaySeconds
        )}
      </div>

    </div>
  `;

}


/* ---------------------------------------------------------
   REAL JÁRMŰ KERESÉSE INDULÁSHOZ
   --------------------------------------------------------- */

function findLiveVehicleForDeparture(d){

  if(!Array.isArray(vehicleData))
    return null;

  const tripId =
    String(d.trip_id || "");

  const routeId =
    String(d.route_id || "");

  const stopSequence =
    Number(d.stop_sequence);

  /*
    Első: pontos trip
  */

  let found =
    vehicleData.find(v =>
      String(v.tripId || "") === tripId
    );

  if(found)
    return found;

  /*
    Második: route + stop sequence
  */

  found =
    vehicleData.find(v =>

      String(v.routeId || "") ===
      routeId &&

      Number(v.stopSequence) ===
      stopSequence

    );

  if(found)
    return found;

  return null;

}


/* ---------------------------------------------------------
   GPS MIN–MAX
   --------------------------------------------------------- */

function updateGpsMinMax(){

  const el =
    document.getElementById(
      "gpsMinMax"
    );

  if(!el)
    return;

  if(
    !myPos ||
    !Array.isArray(vehicleData) ||
    !vehicleData.length
  ){

    el.textContent =
      "NINCS ADAT";

    return;

  }

  const distances =
    vehicleData
      .filter(v =>
        Number.isFinite(
          Number(v.lat)
        ) &&
        Number.isFinite(
          Number(v.lon)
        )
      )
      .map(v =>
        distanceMeters(
          myPos.lat,
          myPos.lon,
          Number(v.lat),
          Number(v.lon)
        )
      )
      .filter(Number.isFinite);

  if(!distances.length){

    el.textContent =
      "NINCS ADAT";

    return;

  }

  const min =
    Math.round(
      Math.min(...distances)
    );

  const max =
    Math.round(
      Math.max(...distances)
    );

  el.textContent =
    min + "–" + max + " m";

}


/* ---------------------------------------------------------
   KERESŐ – TÉNYLEGES SZŰRÉS
   --------------------------------------------------------- */

function performSearch(){

  const q =
    (
      document.getElementById(
        "universalSearch"
      )?.value || ""
    )
    .trim()
    .toLocaleLowerCase("hu-HU");

  const route =
    (
      document.getElementById(
        "routeSearch"
      )?.value || ""
    )
    .trim()
    .toLocaleLowerCase("hu-HU");

  const plate =
    (
      document.getElementById(
        "plateSearch"
      )?.value || ""
    )
    .trim()
    .toLocaleLowerCase("hu-HU");

  const result =
    vehicleData.filter(v => {

      const haystack = [

        v.id,
        v.vehicleId,
        v.label,
        v.licensePlate,
        v.routeId,
        v.routeShortName,
        v.tripId,
        v.stopId,
        v.forgalmi,
        v.vehicleType

      ]
      .map(x =>
        String(
          x ?? ""
        ).toLocaleLowerCase("hu-HU")
      )
      .join(" ");

      if(
        q &&
        !haystack.includes(q)
      ){

        return false;

      }

      if(
        route &&
        !(
          String(v.routeId || "")
            .toLocaleLowerCase()
            .includes(route) ||

          String(v.routeShortName || "")
            .toLocaleLowerCase()
            .includes(route)
        )
      ){

        return false;

      }

      if(
        plate &&
        !String(
          v.licensePlate || ""
        )
        .toLocaleLowerCase()
        .includes(plate)
      ){

        return false;

      }

      return true;

    });

  renderVehicles(result);

}


/* ---------------------------------------------------------
   RADIUS
   --------------------------------------------------------- */

function radiusLimitKm(){

  const value =
    document.getElementById(
      "radiusSelect"
    )?.value;

  if(value === "1")
    return 1;

  if(value === "2.5")
    return 2.5;

  if(value === "5")
    return 5;

  if(value === "10")
    return 10;

  return Infinity;

}


/* ---------------------------------------------------------
   VEHICLE CARD – NINCS ADAT BIZTONSÁG
   --------------------------------------------------------- */

function safeVehicleValue(value){

  return noData(value);

}

</script>
