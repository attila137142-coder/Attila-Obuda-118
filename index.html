<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Megállós LIVE Menetrend</title>

<style>
body{
    margin:0;
    font-family: -apple-system, Arial;
    background:#0b0f14;
    color:white;
}

header{
    padding:12px;
    background:#111a26;
    font-size:18px;
    font-weight:bold;
    text-align:center;
    border-bottom:2px solid #1f2b3a;
}

.stop{
    padding:10px;
    font-size:16px;
    background:#0f1622;
    border-bottom:1px solid #1d2a3a;
}

.meta{
    font-size:12px;
    opacity:0.7;
}

.list{
    padding:10px;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:12px;
    border-bottom:1px solid #1b2635;
    font-size:18px;
}

.time{
    font-weight:bold;
}

.green{color:#4caf50;}
.gray{opacity:0.6;}
.red{color:#ef5350;}

.badge{
    font-size:11px;
    padding:2px 6px;
    border-radius:4px;
    background:#1e88e5;
    margin-right:6px;
}
</style>
</head>

<body>

<header>
🚏 Megállós LIVE Menetrend
</header>

<div class="stop">
<b>32-es busz</b> → Örs vezér tere M+H<br>
<div class="meta">FKU940 • Volvó 7700A • élő szimuláció</div>
</div>

<div class="list">

<div class="row">
<span><span class="badge">BKK</span>Kassai tér</span>
<span class="time gray">13:48</span>
</div>

<div class="row">
<span><span class="badge">BKK</span>Szögliget / Czobor</span>
<span class="time gray">13:51</span>
</div>

<div class="row">
<span><span class="badge">BKK</span>Bosnyák tér</span>
<span class="time gray">13:52</span>
</div>

<div class="row">
<span><span class="badge">BKK</span>Egressy tér</span>
<span class="time green">13:56</span>
<span class="time green">+2'</span>
</div>

<div class="row">
<span><span class="badge">BKK</span>Jeszenák János utca</span>
<span class="time green">13:58</span>
<span class="time green">+4'</span>
</div>

<div class="row">
<span><span class="badge">BKK</span>Pongrátz Gergely tér</span>
<span class="time green">13:59</span>
<span class="time green">+5'</span>
</div>

<div class="row">
<span><span class="badge">BKK</span>Bánki Donát utca</span>
<span class="time green">14:00</span>
<span class="time green">+6'</span>
</div>

</div>

<script>
// LIVE clock feeling
setInterval(()=>{
    document.title = "LIVE " + new Date().toLocaleTimeString();
},1000);
</script>

</body>
</html>
