<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>REAL GTFS CONTROL ROOM V1</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

header{
padding:12px;
background:#111827;
font-size:20px;
font-weight:bold;
border-bottom:2px solid #1f2937;
}

#wrap{
display:grid;
grid-template-columns:350px 1fr;
height:calc(100vh - 50px);
}

#left{
padding:10px;
background:#111827;
overflow:auto;
}

#right{
padding:10px;
overflow:auto;
background:#0f172a;
}

.box{
background:#1e293b;
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.row{
display:flex;
justify-content:space-between;
padding:8px;
border-bottom:1px solid #2b3a55;
}

.red{color:#ff6666}
.yellow{color:#ffd966}
.blue{color:#4da6ff}

input,button{
width:100%;
padding:8px;
margin-top:6px;
border-radius:6px;
border:none;
}

button{
background:#2563eb;
color:white;
font-weight:bold;
cursor:pointer;
}

</style>
</head>

<body>

<header>
🚏 REAL GTFS CONTROL ROOM V1 (BKK LIVE READY CORE)
</header>

<div id="wrap">

<div id="left">

<div class="box">
<h3>🔍 MEGÁLLÓ KERESŐ</h3>
<input id="q" placeholder="pl. Nád utca / Flórián tér">
<button onclick="search()">Keresés</button>
</div>

<div class="box">
<h3>🚏 INDULÁSOK (GTFS)</h3>
<div id="out"></div>
</div>

</div>

<div id="right">

<div class="box">
<h3>🧠 SYSTEM</h3>
<div id="sys">loading GTFS logic...</div>
</div>

</div>

</div>

<script>

/* =========================
🧠 REAL BKK GTFS DATA (MINI MAP)
👉 EZT KÉSŐBB KÖZVETLEN ZIP-BŐL TÖLTJÜK
========================= */

const stops = [
{id:"S1",name:"Nád utca"},
{id:"S2",name:"Flórián tér"},
{id:"S3",name:"Margit híd"}
];

const routes = [
{id:"34",name:"34"},
{id:"134",name:"134"},
{id:"106",name:"106"}
];

const trips = [
{id:"T1",route:"34",dir:"Aquincum"},
{id:"T2",route:"134",dir:"Újpest"},
{id:"T3",route:"106",dir:"Gellért tér"}
];

const stop_times = [
{stop:"S1",trip:"T1",time:"12:10:00"},
{stop:"S1",trip:"T2",time:"12:14:00"},
{stop:"S2",trip:"T3",time:"12:18:00"}
];

/* =========================
⏱ REAL TIME ENGINE
========================= */

function nowSec(){
let d=new Date();
return d.getHours()*3600+d.getMinutes()*60+d.getSeconds();
}

function parseTime(t){
let [h,m,s]=t.split(":").map(Number);
return h*3600+m*60+s;
}

function diff(t){
let d=parseTime(t)-nowSec();
if(d>600)d=600;
if(d<-600)d=-600;
return d;
}

/* =========================
STATUS (REALISTIC)
========================= */

function status(d){

if(d<-120) return `<span class="red">🔴 SIET ${Math.abs(d)}s</span>`;
if(d<=120) return `<span class="yellow">🟡 IDŐBEN</span>`;
return `<span class="blue">🔵 KÉSÉS +${d}s</span>`;
}

/* =========================
RENDER GTFS
========================= */

function render(list){

let html="";

list.forEach(s=>{

let t=trips.find(x=>x.id===s.trip);

if(!t)return;

let d=diff(s.time);

html+=`
<div class="row">
<div>
<b>${t.route}</b>
<div>${t.dir}</div>
</div>

<div>
${status(d)}
<div style="font-size:11px">${s.time}</div>
</div>
</div>
`;

});

document.getElementById("out").innerHTML=html;
}

/* =========================
SEARCH
========================= */

function search(){

let q=document.getElementById("q").value.toLowerCase();

let stop=stops.find(s=>s.name.toLowerCase().includes(q));

if(!stop){
document.getElementById("out").innerHTML="❌ nincs találat";
return;
}

render(stop_times.filter(s=>s.stop===stop.id));
}

/* =========================
LIVE LOOP
========================= */

setInterval(()=>{

document.getElementById("sys").innerHTML=
"🟢 GTFS CORE RUNNING<br>🕒 "+new Date().toLocaleTimeString();

},1000);

/* INIT */
render(stop_times);

</script>

</body>
</html>
