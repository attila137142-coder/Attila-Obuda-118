<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V7.5 LIVE CONTROL ROOM</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#070b10;
  color:#d7e7ff;
  overflow:hidden;
}

/* TOP */
#topbar{
  height:48px;
  background:#0f1722;
  display:flex;
  align-items:center;
  padding:0 12px;
  border-bottom:2px solid #1e2a3a;
  font-weight:bold;
}

/* LAYOUT */
#wrap{
  display:flex;
  height:calc(100vh - 48px);
}

/* LEFT */
#left{
  width:320px;
  border-right:1px solid #1e2a3a;
  display:flex;
  flex-direction:column;
}

.panel{
  padding:10px;
  border-bottom:1px solid #1e2a3a;
}

input,button{
  width:100%;
  margin-top:6px;
  padding:8px;
  background:#0d1622;
  color:#d7e7ff;
  border:1px solid #24344a;
}

/* CENTER MAP */
#map{
  flex:1;
  position:relative;
  background: radial-gradient(circle at center,#101b2a,#06090d);
  overflow:hidden;
}

/* RIGHT DISPATCH */
#right{
  width:420px;
  border-left:1px solid #1e2a3a;
  display:flex;
  flex-direction:column;
}

.table{
  flex:1;
  overflow:auto;
  font-size:12px;
}

.row{
  display:grid;
  grid-template-columns:70px 80px 80px 1fr;
  padding:6px;
  border-bottom:1px solid #162233;
}

.row.header{
  position:sticky;
  top:0;
  background:#0f1a28;
  font-weight:bold;
}

.ok{color:#39ff9c;}
.bad{color:#ff4d4d;}

/* VEHICLES */
.vehicle{
  position:absolute;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#00ff88;
  box-shadow:0 0 12px #00ff88;
  transition: linear 1s;
}

.vehicle.delayed{
  background:#ff4d4d;
  box-shadow:0 0 12px #ff4d4d;
}

/* BIG CLOCK */
#clock{
  font-size:56px;
  color:#00ff88;
  text-align:center;
  font-weight:bold;
  text-shadow:0 0 20px #00ff88;
}

</style>
</head>

<body>

<div id="topbar">
🚦 FUTÁR V7.5 LIVE MOVING VEHICLE CONTROL ROOM SIMULATOR
</div>

<div id="wrap">

<!-- LEFT -->
<div id="left">

  <div class="panel">
    <b>📦 GTFS LOAD (SIM)</b>
    <input type="file" id="zip">
    <button onclick="loadGTFS()">Load GTFS ZIP</button>
    <div id="status">No feed</div>
  </div>

  <div class="panel">
    <b>🛰️ REALTIME ENGINE</b>
    <button onclick="start()">START LIVE SIM</button>
    <div id="rt">idle</div>
  </div>

  <div class="panel">
    <b>🔍 STOP SEARCH</b>
    <input id="q">
    <button onclick="search()">Search</button>
    <div id="res"></div>
  </div>

</div>

<!-- CENTER MAP -->
<div id="map">
  <div style="position:absolute; top:10px; width:100%;">
    <div id="clock">00:00:00</div>
  </div>
</div>

<!-- RIGHT -->
<div id="right">

  <div class="panel"><b>📊 DISPATCH BOARD</b></div>
  <div class="table" id="table">
    <div class="row header">
      <div>Járat</div>
      <div>Késés</div>
      <div>Stop</div>
      <div>Status</div>
    </div>
  </div>

</div>

</div>

<script>

let GTFS = {stops:[]};
let vehicles = [];
let simInterval;

/* CLOCK */
setInterval(()=>{
  document.getElementById("clock").innerText =
    new Date().toLocaleTimeString();
},1000);

/* LOAD GTFS */
async function loadGTFS(){
  const file = document.getElementById("zip").files[0];
  const zip = await JSZip.loadAsync(file);

  GTFS.stops = parseCSV(await zip.file("stops.txt").async("string"));

  localStorage.setItem("V75_GTFS", JSON.stringify(GTFS));

  document.getElementById("status").innerText =
    "Loaded " + GTFS.stops.length + " stops";

  initVehicles();
  renderBoard();
}

/* CSV */
function parseCSV(t){
  const lines = t.split("\n");
  const h = lines[0].split(",");
  return lines.slice(1).map(l=>{
    let o={};
    l.split(",").forEach((v,i)=>o[h[i]]=v);
    return o;
  });
}

/* INIT VEHICLES (MOCK POSITIONS) */
function initVehicles(){

  vehicles = [];

  for(let i=0;i<12;i++){

    let x = Math.random()*window.innerWidth*0.6 + 200;
    let y = Math.random()*window.innerHeight*0.8;

    let el = document.createElement("div");
    el.className="vehicle";
    el.style.left=x+"px";
    el.style.top=y+"px";

    document.getElementById("map").appendChild(el);

    vehicles.push({
      el,
      x,y,
      vx:(Math.random()-0.5)*4,
      vy:(Math.random()-0.5)*4,
      delay:Math.random()*10
    });
  }
}

/* LIVE SIMULATION ENGINE */
function start(){

  document.getElementById("rt").innerText="LIVE";

  clearInterval(simInterval);

  simInterval = setInterval(()=>{

    vehicles.forEach(v=>{

      // movement
      v.x += v.vx;
      v.y += v.vy;

      // bounce
      if(v.x<200||v.x>window.innerWidth-20) v.vx*=-1;
      if(v.y<0||v.y>window.innerHeight-20) v.vy*=-1;

      // delay simulation drift
      v.delay += (Math.random()-0.5);

      if(v.delay>6) v.el.classList.add("delayed");
      else v.el.classList.remove("delayed");

      v.el.style.left=v.x+"px";
      v.el.style.top=v.y+"px";
    });

    renderBoard();

  },1000);
}

/* DISPATCH BOARD */
function renderBoard(){

  let t = document.getElementById("table");

  t.innerHTML = `
  <div class="row header">
    <div>Járat</div>
    <div>Késés</div>
    <div>Stop</div>
    <div>Status</div>
  </div>`;

  for(let i=0;i<vehicles.length;i++){

    let delay = Math.floor(vehicles[i].delay);

    t.innerHTML += `
      <div class="row">
        <div>B${40+i}</div>
        <div class="${delay>5?'bad':'ok'}">${delay} min</div>
        <div>${GTFS.stops[i]?.stop_name || "N/A"}</div>
        <div>${delay>5?"DELAY":"OK"}</div>
      </div>
    `;
  }
}

/* SEARCH */
function search(){

  let q=document.getElementById("q").value.toLowerCase();

  let res=GTFS.stops.filter(s=>
    (s.stop_name||"").toLowerCase().includes(q)
  ).slice(0,8);

  document.getElementById("res").innerHTML=
    res.map(r=>"🚏 "+r.stop_name).join("<br>");
}

/* CACHE RESTORE */
if(localStorage.getItem("V75_GTFS")){
  GTFS = JSON.parse(localStorage.getItem("V75_GTFS"));
}

</script>

</body>
</html>
