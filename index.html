<!DOCTYPE html>

<head>

<style>
body{margin:0;background:#0b1015;color:#e6edf3;font-family:Arial;}
header{padding:14px;background:#121922;border-bottom:3px solid #1f6feb;}

<body>

<header>
<h1>🚦 FUTÁR V3 LIVE DISPATCH CORE</h1>
<div style="font-size:12px;color:#9aa4af;">LIVE + GTFS READY + API HOOK</div>
</header>

<div class="panel">
<h3>🚍 DISPATCHER (LIVE)</h3>

<table>
<thead>
<tr>
<th>Járat</th>
<th>Irány</th>
<th>Tervezett</th>
<th>Valós késés</th>
<th>Jármű</th>
<th>Status</th>
</tr>
</thead>

<tbody id="tbody"></tbody>
</table>
</div>

<script>

// =======================
// 🚍 BASE GTFS-LIKE DATA
// =======================
const DATA = [
{r:"85",d:"Örs",t:"14:32",v:"MAN"},
{r:"85E",d:"KÖKI",t:"14:35",v:"Citaro"},
{r:"32",d:"Árpád híd",t:"14:41",v:"Solaris"},
{r:"7",d:"Albertfalva",t:"14:45",v:"MAN"},
{r:"9",d:"Újpalota",t:"14:48",v:"Mercedes"},
{r:"14",d:"Kelenföld",t:"14:51",v:"Solaris"},
{r:"20E",d:"Rákospalota",t:"14:55",v:"Volvo"},
{r:"47",d:"Deák tér",t:"14:58",v:"MAN"},
{r:"196",d:"Újpest",t:"15:02",v:"Mercedes"},
{r:"230",d:"Pesterzsébet",t:"15:06",v:"Solaris"}
];

// =======================
// ⏱ TIME PARSER
// =======================
function toTime(t){
let [h,m]=t.split(":").map(Number);
let d=new Date();
d.setHours(h,m,0,0);
return d;
}

// =======================
// 🔴 LIVE ENGINE (API READY)
// =======================
async function getDelay(route){

// 🔥 FUTURE: ide jön BKK / MÁV / VOLÁN API

// DEMO fallback (amíg nincs API kötve)
return Math.floor(Math.random()*7-2); // -2 .. +4
}

// =======================
// 🚍 RENDER LOOP
// =======================
async function render(){

const tbody=document.getElementById("tbody");
tbody.innerHTML="";

for(const item of DATA){

let base=toTime(item.t);
let delay=await getDelay(item.r);

let real=new Date(base.getTime()+delay*60000);

let diff=delay>=0?`+${delay}`:`${delay}`;

let status="neutral";
if(delay<=0) status="good";
if(delay>2) status="bad";

const row=document.createElement("tr");

row.innerHTML=`
<td>${item.r}</td>
<td>${item.d}</td>
<td>${item.t}</td>
<td class="${status}">${diff} min</td>
<td>${item.v}</td>
<td class="${status}">
${delay<=0?"🟢 ON TIME":delay>2?"🔴 DELAY":"🟡 OK"}
</td>
`;

tbody.appendChild(row);
}

}

render();
setInterval(render,10000);

</script>

</body>
</html>
