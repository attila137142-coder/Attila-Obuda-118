<body>



<h1>
📄 Attila PDF Dokumentumkezelő V1.0 STABLE
</h1>

<h3>
📂 PDF betöltés
</h3>

type="file"
id="pdfFile"

Keresés

🖥 PDF nézet
</h3>

◀ Előző

</button>



<button onclick="nextPage()">

Következő ▶

</button>

<button onclick="zoomOut()">

➖

</button>



<button onclick="zoomIn()">

➕

</button>

</div>

<script>


// ======================================
// ATTILA PDF DOKUMENTUMKEZELŐ V1.0 STABLE
// PDF MOTOR
// 2. RÉSZ
// ======================================



let pdfDoc = null;

let currentPage = 1;

let totalPages = 0;

let scale = 1.5;

let currentFileName = "";

let pageTextCache = [];





// PDF.js munkás beállítás

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";







// ======================================
// PDF MEGNYITÁS
// ======================================


async function openPDF(){



let fileInput =
document.getElementById("pdfFile");



if(!fileInput.files.length){

alert("Válassz ki egy PDF fájlt!");

return;

}



let file =
fileInput.files[0];



currentFileName =
file.name;



document.getElementById(
"fileName"
).innerHTML =
currentFileName;



document.getElementById(
"status"
).innerHTML =
"PDF betöltése...";




let arrayBuffer =
await file.arrayBuffer();



pdfDoc =
await pdfjsLib.getDocument(
arrayBuffer
).promise;



totalPages =
pdfDoc.numPages;



document.getElementById(
"pageCount"
).innerHTML =
totalPages;



currentPage = 1;



pageTextCache=[];



await renderPage(currentPage);



document.getElementById(
"status"
).innerHTML =
"✅ PDF betöltve";



}







// ======================================
// OLDAL RAJZOLÁS
// ======================================


async function renderPage(num){



if(!pdfDoc)
return;



let page =
await pdfDoc.getPage(num);



let viewport =
page.getViewport({

scale:scale

});



let canvas =
document.getElementById(
"pdfCanvas"
);



let ctx =
canvas.getContext(
"2d"
);



canvas.width =
viewport.width;



canvas.height =
viewport.height;



let renderContext = {


canvasContext:ctx,


viewport:viewport


};



await page.render(
renderContext
).promise;




document.getElementById(
"currentPage"
).innerHTML =
num;



// szöveg eltárolás kereséshez

await extractPageText(
page,
num
);



}









// ======================================
// OLDAL LAPOZÁS
// ======================================


function nextPage(){



if(!pdfDoc)
return;



if(currentPage < totalPages){


currentPage++;


renderPage(
currentPage
);


}


}





function prevPage(){



if(!pdfDoc)
return;



if(currentPage > 1){


currentPage--;


renderPage(
currentPage
);


}



}








// ======================================
// ZOOM
// ======================================


function zoomIn(){


scale +=0.25;


if(pdfDoc)

renderPage(
currentPage
);


}




function zoomOut(){


if(scale>0.5){


scale -=0.25;


if(pdfDoc)

renderPage(
currentPage
);


}


}








// ======================================
// PDF SZÖVEG KIOLVASÁS
// (KÉSŐBB TÁBLÁZAT MOTOR ALAPJA)
// ======================================


async function extractPageText(page,num){



let content =
await page.getTextContent();



let text =
content.items
.map(
item=>item.str
)
.join(" ");



pageTextCache[num]=text;



console.log(
"Oldal",
num,
text
);



}



</script>
<script>


// ======================================
// ATTILA PDF DOKUMENTUMKEZELŐ V1.0 STABLE
// KERESŐ + INDEX MOTOR
// 3. RÉSZ
// ======================================



let coordinateCache = [];




// ======================================
// KOORDINÁTÁS SZÖVEG KIOLVASÁS
// ======================================


async function extractPageText(page,num){



let content =
await page.getTextContent();



let simpleText =
[];

let coords =
[];




content.items.forEach(item=>{


let txt =
item.str.trim();



if(txt){


simpleText.push(txt);



coords.push({

page:num,

text:txt,

x:item.transform[4],

y:item.transform[5]

});


}


});





pageTextCache[num] =
simpleText.join(" ");



coordinateCache =
coordinateCache.concat(coords);



console.log(
"Index oldal:",
num,
coords.length,
"elem"
);



}









// ======================================
// TELJES PDF INDEXELÉS
// ======================================


async function buildPDFIndex(){



if(!pdfDoc){

alert("Nincs PDF betöltve!");

return;

}



document.getElementById(
"status"
).innerHTML =
"🔎 Index készítése...";



coordinateCache=[];

pageTextCache=[];



for(
let i=1;
i<=totalPages;
i++
){


let page =
await pdfDoc.getPage(i);


await extractPageText(
page,
i
);


}




document.getElementById(
"status"
).innerHTML =
"✅ Keresési index kész";



console.log(
"PDF index:",
coordinateCache
);



}








// ======================================
// PDF KERESÉS
// ======================================


async function searchPDF(){



let query =
document
.getElementById(
"searchBox"
)
.value
.trim()
.toLowerCase();



if(!query){

return;

}




if(pageTextCache.length===0){


await buildPDFIndex();


}





let result="";

let count=0;



pageTextCache.forEach(
(text,page)=>{


if(text && text.toLowerCase().includes(query)){


count++;


result +=

"✅ Oldal: "
+
page
+
"\n\n";


let index =
text.toLowerCase()
.indexOf(query);



let start =
Math.max(
0,
index-60
);



let end =
Math.min(
text.length,
index+100
);



result +=
text.substring(
start,
end
)
+
"\n\n";



}


});





if(count===0){


result =
"Nincs találat.";


}



document.getElementById(
"searchResult"
)
.innerHTML =
result;



}









// ======================================
// PDF → TÁBLÁZAT MOTOR CSATLAKOZÁSI PONT
// ======================================


function getPDFData(){



return {


pages:totalPages,


filename:currentFileName,


text:pageTextCache,


coordinates:coordinateCache



};



}




console.log(
"================================="
);


console.log(
"ATTILA PDF DOKUMENTUMKEZELŐ V1.0 STABLE"
);


console.log(
"PDF kereső és index motor aktív"
);


console.log(
"PDF → Táblázat csatlakozás előkészítve"
);


console.log(
"================================="
);



</script>
