<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>GTFS TAKARÍTÓ PRO V4 CONTROL ROOM</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#070b14;
    color:#d1d5db;
}

header{
    padding:15px;
    background:#0b1220;
    border-bottom:1px solid #1f2937;
}

h1{color:#38bdf8; margin:0}

.container{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
    padding:10px;
}

.panel{
    background:#0f172a;
    border:1px solid #1f2937;
    border-radius:10px;
    padding:10px;
}

button{
    padding:10px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

#log{
    background:black;
    height:200px;
    overflow:auto;
    white-space:pre-wrap;
    font-family:monospace;
}

.badge{
    padding:6px 10px;
    border-radius:6px;
    display:inline-block;
    font-weight:bold;
}

.green{background:#14532d;color:#22c55e}
.yellow{background:#3b2f0b;color:#facc15}
.red{background:#3b0b0b;color:#ef4444}

#map{height:300px;border-radius:10px}
table{
    width:100%;
    font-size:12px;
}
td{padding:3px;border-bottom:1px solid #1f2937}
</style>
</head>

<body>

<header>
<h1>🚍 GTFS TAKARÍTÓ PRO V4 – CONTROL ROOM</h1>
<input type="file" id="zipFile">
<button onclick="loadZip()">📦 ZIP BETÖLTÉS</button>
<button onclick="analyze()">🧠 ANALÍZIS INDÍTÁS</button>
</header>

<div class="container">

<div class="panel">
<h3>📡 DISZPÉCSER ÁLLAPOT</h3>
<div id="status" class="badge yellow">VÁRAKOZÁS</div>
<div id="log"></div>
</div>

<div class="panel">
<h3>📊 GTFS STATISZTIKA</h3>
<div id="stats"></div>
</div>

<div class="panel">
<h3>🧠 SERVICE GRAPH</h3>
<div id="graph"></div>
</div>

<div class="panel">
<h3>🗺️ STOP MAP</h3>
<div id="map"></div>
</div>

</div>

<script>

let zip;
let files = {};
let parsed = {};

function log(msg){
    document.getElementById("log").innerHTML += "\n" + msg;
}

function setStatus(text,color){
    let el=document.getElementById("status");
    el.innerText=text;
    el.className="badge "+color;
}

function loadZip(){
    let f=document.getElementById("zipFile").files[0];
    zip=new JSZip();
    zip.loadAsync(f).then(()=>{
        log("📦 ZIP betöltve");
    });
}

function parseCSV(text){
    return text.split("\n").map(l=>l.split(","));
}

async function analyze(){

files = {};

await Promise.all(
Object.keys(zip.files).map(async k=>{
files[k]=await zip.files[k].async("string");
})
);

log("🧠 ANALÍZIS INDUL...");

// parse core files
let trips = parseCSV(files["trips.txt"] || "");
let stop_times = parseCSV(files["stop_times.txt"] || "");
let routes = parseCSV(files["routes.txt"] || "");

// indexes
let serviceMap = {};
let routeCount = {};
let tripCount = trips.length;

for(let i=1;i<trips.length;i++){
let service = trips[i][1];
let route = trips[i][0];

serviceMap[service]=(serviceMap[service]||0)+1;
routeCount[route]=(routeCount[route]||0)+1;
}

// STATUS MODE
if(files["calendar_dates.txt"] && !files["calendar.txt"]){
setStatus("DATES-ONLY MODE","yellow");
log("🟡 Modern GTFS (calendar_dates alapú)");
}else{
setStatus("CLASSIC MODE","green");
log("🟢 Klasszikus GTFS");
}

// STATS
document.getElementById("stats").innerHTML=`
<table>
<tr><td>Trips</td><td>${tripCount}</td></tr>
<tr><td>Routes</td><td>${Object.keys(routeCount).length}</td></tr>
<tr><td>Service ID-k</td><td>${Object.keys(serviceMap).length}</td></tr>
</table>
`;

// GRAPH
let g="";
Object.keys(serviceMap).slice(0,10).forEach(s=>{
g+=`<div>🧩 ${s} → ${serviceMap[s]} trips</div>`;
});
document.getElementById("graph").innerHTML=g;

log("✔ ANALÍZIS KÉSZ");

initMap();

}

function initMap(){

let map=L.map('map').setView([47.4979,19.0402],11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'OSM'
}).addTo(map);

// try stops
if(files["stops.txt"]){
let lines=parseCSV(files["stops.txt"]);
for(let i=1;i<lines.length;i++){
let lat=parseFloat(lines[i][4]);
let lon=parseFloat(lines[i][5]);
if(!isNaN(lat)&&!isNaN(lon)){
L.circleMarker([lat,lon],{radius:3}).addTo(map);
}
}
}

log("🗺️ MAP betöltve");
}

</script>

</body>
</html>
