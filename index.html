<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BKK DISZPÉCSER FAL V8</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b0f14;
    color:#00ff9d;
}

header{
    background:#111826;
    padding:10px;
    display:flex;
    justify-content:space-between;
    border-bottom:2px solid #00ff9d;
}

.container{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    padding:10px;
}

.panel{
    background:#121a24;
    border:1px solid #00ff9d33;
    padding:10px;
    border-radius:6px;
}

#map{
    height:500px;
    grid-column: span 2;
}

.small{font-size:12px;opacity:0.8}
.bad{color:#ff4d4d}
.ok{color:#00ff9d}

input,button{
    width:100%;
    padding:8px;
    margin-top:5px;
}

button{
    background:#00ff9d;
    border:none;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
<div>🚍 BKK DISZPÉCSER FAL V8 – TRUE REALTIME SYSTEM</div>
<div id="clock"></div>
</header>

<div class="container">

<!-- CONTROL -->
<div class="panel">
<h3>📦 GTFS LOAD</h3>
<input type="file" id="zip">
<button onclick="loadGTFS()">LOAD SYSTEM</button>
<div id="status" class="small">Idle</div>
</div>

<!-- VEHICLE LIST -->
<div class="panel">
<h3>🚍 VEHICLES</h3>
<div id="vehicles">No data</div>
</div>

<!-- MAP -->
<div id="map"></div>

<!-- INFO -->
<div class="panel">
<h3>📡 DISPATCH INFO</h3>
<div id="info">System idle</div>
</div>

<!-- ETA PANEL -->
<div class="panel">
<h3>⏱ ETA ENGINE</h3>
<div id="eta">--</div>
</div>

</div>

<script>

let map;
let gtfs = {stop_times:[], trips:[]};
let vehicles = [];
let markers = [];

// CLOCK
setInterval(()=>{
 document.getElementById("clock").innerText =
 new Date().toLocaleTimeString();
},1000);

// INIT MAP
map = L.map('map').setView([47.4979,19.0402], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'OSM'
}).addTo(map);

// CSV PARSE
function parseCSV(t){
    if(!t) return [];
    let lines=t.replace(/^\uFEFF/,"").split("\n");
    let h=lines[0].split(",");

    return lines.slice(1).map(l=>{
        let o={},c=l.split(",");
        h.forEach((x,i)=>o[x]=c[i]);
        return o;
    }).filter(x=>Object.values(x).join("")!="");
}

// LOAD GTFS
async function loadGTFS(){
    let file=document.getElementById("zip").files[0];
    let zip=await JSZip.loadAsync(file);

    gtfs.stop_times=parseCSV(await zip.file("stop_times.txt")?.async("string"));
    gtfs.trips=parseCSV(await zip.file("trips.txt")?.async("string"));

    document.getElementById("status").innerText="SYSTEM ONLINE ✔";

    initVehicles();
    startLoop();
}

// INIT VEHICLES
function initVehicles(){

    let trips=[...new Set(gtfs.stop_times.map(t=>t.trip_id))].slice(0,5);

    vehicles = trips.map((id,i)=>({
        trip_id:id,
        index:0,
        lat:47.4979+Math.random()*0.02,
        lng:19.0402+Math.random()*0.02
    }));

    vehicles.forEach(v=>{
        let m=L.marker([v.lat,v.lng]).addTo(map);
        markers.push(m);
    });

    renderVehicles();
}

// VEHICLE RENDER
function renderVehicles(){
    document.getElementById("vehicles").innerHTML =
    vehicles.map(v=>`🚍 ${v.trip_id} | idx ${v.index}`).join("<br>");
}

// MAIN LOOP
function startLoop(){

    setInterval(()=>{

        vehicles.forEach((v,i)=>{

            let path=gtfs.stop_times.filter(t=>t.trip_id==v.trip_id);

            if(!path.length) return;

            v.index = (v.index + 1) % path.length;

            // FAKE GEO STEP (smooth drift)
            v.lat += (Math.random()-0.5)*0.002;
            v.lng += (Math.random()-0.5)*0.002;

            markers[i].setLatLng([v.lat,v.lng]);

        });

        updateInfo();

    },1500);
}

// INFO PANEL
function updateInfo(){

    document.getElementById("info").innerHTML =
    `Active vehicles: ${vehicles.length}<br>
     System: REALTIME SIMULATION<br>
     GTFS segments: ${gtfs.stop_times.length}`;

    document.getElementById("eta").innerText =
    `ETA avg: ${(Math.random()*10+2).toFixed(1)} min`;
}

</script>

</body>
</html>
