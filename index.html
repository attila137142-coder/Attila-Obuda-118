<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Atlasz V6.3 – GSM Coverage Layer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; }
#map { height:100vh; }

.legend{
  position:absolute;
  bottom:20px;
  left:20px;
  background:white;
  padding:10px;
  font-size:12px;
  z-index:999;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="legend">
📡 GSM: 🟢 jó | 🟡 közepes | 🟠 gyenge | 🔴 nincs
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([47.95,18.90],12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OSM'
}).addTo(map);

/////////////////////////////////////////////////////
// 📡 GSM MODEL (HEURISZTIKA)
/////////////////////////////////////////////////////

function gsm(lat,lon){

  const dx = Math.abs(lat - 47.95);
  const dy = Math.abs(lon - 18.90);
  const d = Math.sqrt(dx*dx + dy*dy);

  // központ = jobb jel (települések közel)
  if(d < 0.02) return 90;   // 🟢
  if(d < 0.05) return 70;   // 🟡
  if(d < 0.08) return 40;   // 🟠
  return 10;               // 🔴
}

/////////////////////////////////////////////////////
// 🎨 COLOR
/////////////////////////////////////////////////////

function color(v){
  if(v>=80) return "green";
  if(v>=50) return "yellow";
  if(v>=20) return "orange";
  return "red";
}

/////////////////////////////////////////////////////
// 🗺️ GRID RENDER
/////////////////////////////////////////////////////

for(let i=0;i<300;i++){

  const lat = 47.85 + Math.random()*0.25;
  const lon = 18.75 + Math.random()*0.35;

  const s = gsm(lat,lon);

  L.circleMarker([lat,lon],{
    radius:4,
    color:color(s),
    fillOpacity:0.6
  }).addTo(map)
  .bindPopup(`📡 GSM: ${s}%`);

}

</script>

</body>
</html>
