<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOL BUSZOM V1</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
margin:0;
font-family:Arial;
background:#05070d;
color:#00ffcc;
}

header{
padding:12px;
text-align:center;
background:#0b1220;
border-bottom:2px solid #00ffcc;
font-weight:bold;
}

.container{
display:grid;
grid-template-columns:1fr 2fr;
height:calc(100vh - 50px);
}

.left{
padding:10px;
background:#0b1220;
overflow:auto;
}

#map{
height:100%;
width:100%;
}

.badge{
border:1px solid #00ffcc;
padding:2px 6px;
font-size:11px;
}

.card{
padding:8px;
border-bottom:1px solid #00ffcc22;
}

.status{
margin-top:10px;
font-weight:bold;
}
</style>
</head>

<body>

<header>
🚍 HOL BUSZOM V1 // LIVE PROXIMITY ENGINE
</header>

<div class="container">

<div class="left">
<h3>🚏 Megálló</h3>
<div id="stopInfo"></div>

<h3>🚍 Jármű</h3>
<div id="busInfo"></div>

<div class="status" id="status"></div>
</div>

<div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

/*
========================
MAP INIT
========================
*/

const map = L.map('map').setView([47.4979,19.0402], 14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'OSM'
}).addTo(map);

/*
========================
DATA (SIMULATED GTFS-RT)
========================
*/

const stop = {
name:"Deák tér",
lat:47.4979,
lng:19.0540
};

let bus = {
id:"BUS-7E",
route:"7E",
lat:47.4920,
lng:19.0300,
speed:20
};

/*
========================
MARKERS
========================
*/

const stopMarker = L.marker([stop.lat,stop.lng])
.addTo(map)
.bindPopup("🚏 "+stop.name);

let busMarker = L.marker([bus.lat,bus.lng])
.addTo(map)
.bindPopup("🚍 "+bus.route);

/*
========================
HAVERSINE DISTANCE
========================
*/

function distance(lat1,lon1,lat2,lon2){

const R = 6371000;

const toRad = x => x * Math.PI / 180;

const dLat = toRad(lat2-lat1);
const dLon = toRad(lon2-lon1);

const a =
Math.sin(dLat/2) * Math.sin(dLat/2) +
Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
Math.sin(dLon/2) * Math.sin(dLon/2);

const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

return R * c;
}

/*
========================
SIMULATION LOOP
========================
*/

let lastDistance = null;

function update(){

// bus “mozgatás” a megálló felé
bus.lat += (stop.lat - bus.lat) * 0.02;
bus.lng += (stop.lng - bus.lng) * 0.02;

// marker update
busMarker.setLatLng([bus.lat,bus.lng]);

// distance calc
let d = distance(bus.lat,bus.lng,stop.lat,stop.lng);

// direction detection
let status = "";

if(lastDistance !== null){
if(d < lastDistance){
status = "🟢 KÖZELEDIK";
}else{
status = "🔵 TÁVOLODIK";
}
}

if(d < 50){
status = "🚏 MEGÉRKEZETT";
}

lastDistance = d;

// UI
document.getElementById("stopInfo").innerHTML =
"🚏 <b>"+stop.name+"</b>";

document.getElementById("busInfo").innerHTML =
`
🚍 ${bus.route}<br>
<span class="badge">${bus.id}</span><br>
📍 Lat: ${bus.lat.toFixed(5)}<br>
📍 Lng: ${bus.lng.toFixed(5)}<br>
📏 Távolság: <b>${Math.round(d)} m</b>
`;

document.getElementById("status").innerHTML = status;

}

setInterval(update, 2000);
update();

</script>

</body>
</html>
