<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<title>ATTILA DISPATCHER FULL ENGINE V2</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- PapaParse -->
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<!-- RTree -->
<script src="https://unpkg.com/rbush@3.0.1/rbush.min.js"></script>

<style>
body { margin:0; font-family: Arial; background:#0b1220; color:white; }
#map { height:70vh; width:100%; }
.panel { padding:10px; background:#111a2e; }
button, input { padding:8px; margin:5px; }
table { width:100%; border-collapse: collapse; }
td,th { border:1px solid #2a3550; padding:6px; font-size:13px; }
th { background:#1b2740; }
</style>
</head>

<body>

<div class="panel">
<h2>🚆 ATTILA DISPATCHER V2</h2>

<input type="file" id="gtfsFile">
<button onclick="loadGTFS()">GTFS LOAD</button>
<button onclick="buildEngine()">ENGINE BUILD</button>
<span id="status">READY</span>
</div>

<div id="map"></div>

<div class="panel">
<table>
<thead>
<tr>
<th>GLOBAL ID</th>
<th>Név</th>
<th>Lat</th>
<th>Lon</th>
<th>Forrás</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>
</div>

<script>

// ---------------- MAP ----------------
const map = L.map('map').setView([47.4979, 19.0402], 10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: 'OSM'
}).addTo(map);

// ---------------- DATA ----------------
let stops = [];
let tree = new RBush();
let nodes = [];
let id = 1;

// ---------------- LOAD GTFS ----------------
function loadGTFS() {
    const file = document.getElementById("gtfsFile").files[0];
    if (!file) return alert("Nincs GTFS file!");

    Papa.parse(file, {
        header: true,
        complete: (res) => {

            stops = res.data
                .filter(s => s.stop_lat && s.stop_lon)
                .map(s => ({
                    stop_id: s.stop_id,
                    name: s.stop_name,
                    lat: parseFloat(s.stop_lat),
                    lon: parseFloat(s.stop_lon),
                    type: "GTFS"
                }));

            setStatus("GTFS loaded: " + stops.length);
            index();
        }
    });
}

// ---------------- INDEX ----------------
function index() {
    tree.clear();

    stops.forEach(s => {
        tree.insert({
            minX: s.lon,
            minY: s.lat,
            maxX: s.lon,
            maxY: s.lat,
            data: s
        });
    });

    setStatus("Indexed (R-tree ready)");
}

// ---------------- DIST ----------------
function dist(a,b){
    const R=6371e3;
    const toRad=x=>x*Math.PI/180;

    const dLat=toRad(b.lat-a.lat);
    const dLon=toRad(b.lon-a.lon);

    const A=toRad(a.lat), B=toRad(b.lat);

    const x=
        Math.sin(dLat/2)**2 +
        Math.cos(A)*Math.cos(B)*Math.sin(dLon/2)**2;

    return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ---------------- SCORE ----------------
function score(a,b){
    let d = dist(a,b);
    let geo = d<50?1:d<120?0.7:0;

    let na=(a.name||"").toLowerCase();
    let nb=(b.name||"").toLowerCase();

    let name = (na.includes(nb)||nb.includes(na))?0.8:0.4;

    return geo*0.7 + name*0.3;
}

// ---------------- GET NODE ----------------
function getNode(stop){

    let near = tree.search({
        minX: stop.lon-0.002,
        minY: stop.lat-0.002,
        maxX: stop.lon+0.002,
        maxY: stop.lat+0.002
    });

    let best=null;
    let bestScore=0;

    near.forEach(n=>{
        let s=score(stop,n.data);
        if(s>bestScore){
            bestScore=s;
            best=n.data;
        }
    });

    if(best && bestScore>0.85){
        let node = nodes.find(n =>
            n.sources.some(x=>x.stop_id===best.stop_id)
        );

        if(!node){
            node={
                id:"HUN_"+String(id++).padStart(5,"0"),
                name:stop.name,
                lat:stop.lat,
                lon:stop.lon,
                sources:[]
            };
            nodes.push(node);
        }

        node.sources.push(stop);
        return node;
    }

    let node={
        id:"HUN_"+String(id++).padStart(5,"0"),
        name:stop.name,
        lat:stop.lat,
        lon:stop.lon,
        sources:[stop]
    };

    nodes.push(node);
    return node;
}

// ---------------- BUILD ENGINE ----------------
function buildEngine(){

    nodes=[];
    id=1;

    stops.forEach(s=>getNode(s));

    render();
    drawMap();

    setStatus("ENGINE READY: "+nodes.length+" nodes");
}

// ---------------- MAP DRAW ----------------
function drawMap(){

    nodes.forEach(n=>{

        let color = n.sources.length>1 ? "red" : "blue";

        L.circleMarker([n.lat,n.lon],{
            radius:6,
            color:color
        })
        .addTo(map)
        .bindPopup(`
            <b>${n.name}</b><br>
            ${n.id}<br>
            sources: ${n.sources.length}
        `);
    });
}

// ---------------- TABLE ----------------
function render(){
    let out=document.getElementById("list");
    out.innerHTML="";

    nodes.forEach(n=>{
        let tr=document.createElement("tr");

        tr.innerHTML=`
            <td>${n.id}</td>
            <td>${n.name}</td>
            <td>${n.lat.toFixed(5)}</td>
            <td>${n.lon.toFixed(5)}</td>
            <td>${n.sources.length}</td>
        `;

        out.appendChild(tr);
    });
}

// ---------------- STATUS ----------------
function setStatus(t){
    document.getElementById("status").innerText=t;
}

</script>

</body>
</html>
