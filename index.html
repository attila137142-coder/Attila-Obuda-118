<!DOCTYPE html>
<html lang="hu"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUTÁR GTFS UNIVERSAL PARSER V2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{background:#0b0f14;color:#ddd;font-family:Arial;margin:0}
#clock{font-size:52px;color:#00ff66;text-align:center;padding:10px;font-family:monospace;font-weight:bold}
#loc{background:#3a3300;color:#ffd000;padding:10px}
.wrap{padding:10px} input,button{padding:8px;margin:4px}
#search{width:100%;box-sizing:border-box}.row{border-bottom:1px solid #233;padding:8px}
.small{color:#9ab}
</style></head><body>
<div id="clock">00:00:00</div>
<div id="loc">📍 Helyzet keresése...</div>
<div class="wrap">
<input type="file" id="zipFile" accept=".zip">
<button onclick="localStorage.clear();location.reload()">Cache törlése</button><br>
<input id="search" placeholder="Megállónév vagy stop_id keresése">
<div id="status">Nincs GTFS betöltve</div>
<div id="results"></div>
</div>
<script>
let STOPS=[]; let myLat=null,myLon=null;
setInterval(()=>clock.textContent=new Date().toLocaleTimeString('hu-HU',{hour12:false}),1000);

function csvParse(text){
 text=text.replace(/^\uFEFF/,"");
 const rows=[]; let row=[],v="",q=false;
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(c=='"'){q=!q;continue;}
  if(c==','&&!q){row.push(v);v="";continue;}
  if((c=='\n'||c=='\r')&&!q){if(v!==""||row.length){row.push(v);rows.push(row);row=[];v="";}continue;}
  v+=c;
 }
 return rows;
}

if(navigator.geolocation){
 navigator.geolocation.getCurrentPosition(p=>{
  myLat=p.coords.latitude; myLon=p.coords.longitude;
  loc.innerHTML='📍 GPS: '+myLat.toFixed(6)+', '+myLon.toFixed(6)+'<br>🎯 ±'+Math.round(p.coords.accuracy)+' m';
 });
}

zipFile.addEventListener('change',async e=>{
 const zip=await JSZip.loadAsync(e.target.files[0]);
 const name=Object.keys(zip.files).find(x=>x.toLowerCase().endsWith('stops.txt'));
 if(!name){alert('stops.txt nincs');return;}
 const txt=await zip.file(name).async('string');
 const rows=csvParse(txt);
 const h=rows[0], idx={}; h.forEach((x,i)=>idx[x]=i);
 STOPS=[];
 for(let i=1;i<rows.length;i++){
  let r=rows[i];
  STOPS.push({stop_id:r[idx.stop_id]||'',stop_name:r[idx.stop_name]||'',stop_lat:r[idx.stop_lat]||'',stop_lon:r[idx.stop_lon]||''});
 }
 localStorage.setItem('gtfsStops',JSON.stringify(STOPS));
 status.textContent='Betöltve: '+STOPS.length+' megálló';
});

const saved=localStorage.getItem('gtfsStops');
if(saved){STOPS=JSON.parse(saved);status.textContent='Cache: '+STOPS.length+' megálló';}

search.addEventListener('input',()=>{
 const q=search.value.toLowerCase();
 const r=STOPS.filter(s=>(s.stop_name||'').toLowerCase().includes(q)||(s.stop_id||'').toLowerCase().includes(q)).slice(0,200);
 results.innerHTML=r.map(s=>'<div class="row">🚏 <b>'+s.stop_name+'</b><br><span class="small">GTFS: '+s.stop_id+'</span></div>').join('');
});
</script></body></html>
