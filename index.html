<div id="clockPanel">
    <div id="clock">21:47:18</div>
    <div id="date">2026. július 13. • Hétfő</div>
</div>

<style>
#clockPanel{
    width:340px;
    margin:auto;
    padding:16px 20px;
    text-align:center;

    border-radius:18px;

    background:linear-gradient(180deg,#1c1638,#0f1127);

    border:2px solid #8f6cff;

    box-shadow:
        0 0 12px rgba(140,110,255,.45),
        0 0 35px rgba(90,60,255,.25);

    font-family:Arial,Helvetica,sans-serif;
}

#clock{

    font-size:56px;
    font-weight:bold;
    letter-spacing:4px;

    color:#C78BFF;

    text-shadow:
        0 0 8px #b56cff,
        0 0 18px #7d5fff;

    margin-bottom:8px;
}

#date{

    font-size:24px;
    font-weight:bold;

    color:#ff9d00;

    text-shadow:
        0 0 5px #ffb84d,
        0 0 12px #ff7b00;

    letter-spacing:2px;
}
</style>

<script>

function updateClock(){

    const d=new Date();

    document.getElementById("clock").innerHTML=
        d.toLocaleTimeString("hu-HU");

    document.getElementById("date").innerHTML=
        d.toLocaleDateString("hu-HU",{
            year:"numeric",
            month:"long",
            day:"numeric",
            weekday:"long"
        });

}

updateClock();

setInterval(updateClock,1000);

</script>
