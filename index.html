<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FUTÁR V6 TRUE SYSTEM</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: #0b0f14;
color: #d7e1ee;
}

/* TOP BAR */
.topbar {
background: #111826;
padding: 10px;
display: flex;
justify-content: space-between;
align-items: center;
border-bottom: 2px solid #1f2a3a;
}

.clock {
font-size: 18px;
font-weight: bold;
color: #4df0ff;
}

.status {
color: #7CFF6B;
}

/* LAYOUT */
.container {
display: grid;
grid-template-columns: 320px 1fr 360px;
height: calc(100vh - 50px);
}

/* PANELS */
.panel {
border-right: 1px solid #1f2a3a;
padding: 10px;
overflow-y: auto;
}

.panel h3 {
color: #4df0ff;
}

/* INPUT */
input, button {
width: 100%;
padding: 8px;
margin: 5px 0;
background: #111826;
border: 1px solid #2b3a50;
color: white;
}

/* LIST */
.item {
padding: 6px;
border-bottom: 1px solid #1b2635;
cursor: pointer;
}

.item:hover {
background: #152233;
}

/* MAP */
.map {
position: relative;
background: radial-gradient(#111, #05070a);
}

/* RIGHT PANEL */
.right {
border-left: 1px solid #1f2a3a;
}

/* SMALL TAGS */
.tag {
display: inline-block;
padding: 2px 6px;
background: #1d2a3d;
margin: 2px;
font-size: 12px;
border-radius: 4px;
}

</style>
</head>

<body>

<div class="topbar">
<div>🚦 FUTÁR V6 TRUE SYSTEM</div>
<div class="clock" id="clock"></div>
<div class="status" id="status">GTFS READY</div>
</div>

<div class="container">

<!-- LEFT -->
<div class="panel">
<h3>📦 GTFS LOAD</h3>
<input type="file" id="gtfsFile" accept=".zip"/>
<button onclick="saveGTFS()">💾 Mentés rendszerbe</button>
<button onclick="loadSaved()">📂 Betöltött GTFS</button>

<h3>🔎 STOP SEARCH</h3>
<input id="search" placeholder="Stop név / ID..." oninput="searchStops()"/>

<div id="stopList"></div>
</div>

<!-- CENTER MAP -->
<div class="panel map">
<h3>🗺️ DISPATCH MAP CORE</h3>
<div id="mapInfo">
<p>GTFS nincs betöltve</p>
</div>
</div>

<!-- RIGHT -->
<div class="panel right">
<h3>🚍 JÁRAT PANEL</h3>
<div id="routePanel"></div>

<h3>📊 LIVE ENGINE</h3>
<div id="live">
<span class="tag">SIM MODE</span>
<span class="tag">NO GTFS-RT</span>
</div>
</div>

</div>

<script>
let gtfsData = {
stops: [],
routes: [],
trips: []
};

// CLOCK
function updateClock() {
document.getElementById("clock").innerText =
new Date().toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

// LOAD FILE
document.getElementById("gtfsFile").addEventListener("change", async (e) => {
const file = e.target.files[0];
if (!file) return;

document.getElementById("status").innerText = "LOADING GTFS...";

const text = await file.text();

// VERY SIMPLE PARSER (CSV-like GTFS inside zip is NOT extracted here)
parseGTFS(text);

document.getElementById("status").innerText = "GTFS LOADED";
});

function parseGTFS(text) {
const lines = text.split("\n");

gtfsData.stops = [];
gtfsData.routes = [];

for (let line of lines) {
if (line.includes("stop_id") || line.includes("route_id")) continue;

const parts = line.split(",");

if (parts.length > 3) {
gtfsData.stops.push({
id: parts[0],
name: parts[1] || "STOP",
lat: parts[2],
lon: parts[3]
});
}
}

renderStops();
renderRoutes();
}

// SAVE
function saveGTFS() {
localStorage.setItem("gtfs_v6", JSON.stringify(gtfsData));
alert("GTFS elmentve V6 rendszerbe!");
}

function loadSaved() {
const data = localStorage.getItem("gtfs_v6");
if (!data) return alert("Nincs mentett GTFS");

gtfsData = JSON.parse(data);
renderStops();
renderRoutes();
}

// SEARCH
function searchStops() {
const q = document.getElementById("search").value.toLowerCase();

const filtered = gtfsData.stops.filter(s =>
(s.name || "").toLowerCase().includes(q) ||
(s.id || "").toLowerCase().includes(q)
);

renderStopList(filtered);
}

function renderStops() {
renderStopList(gtfsData.stops);
}

function renderStopList(list) {
const el = document.getElementById("stopList");
el.innerHTML = "";

list.slice(0, 50).forEach(s => {
const div = document.createElement("div");
div.className = "item";
div.innerHTML = `
<b>${s.name}</b><br/>
<small>ID: ${s.id}</small>
`;
div.onclick = () => selectStop(s);
el.appendChild(div);
});
}

function selectStop(stop) {
document.getElementById("mapInfo").innerHTML = `
<h3>${stop.name}</h3>
<p>STOP ID: ${stop.id}</p>
<p>LAT: ${stop.lat}</p>
<p>LON: ${stop.lon}</p>
`;
}

// ROUTES MOCK
function renderRoutes() {
const el = document.getElementById("routePanel");
el.innerHTML = "";

const routes = ["BKK 7", "BKK 105", "BKK 133E", "MÁV IC", "VOLÁN 500"];

routes.forEach(r => {
const div = document.createElement("div");
div.className = "item";
div.innerHTML = `<b>${r}</b> <span class="tag">LIVE SIM</span>`;
el.appendChild(div);
});
}
</script>

</body>
</html>
