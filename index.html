<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GTFS PRO V26 LIFESAVER TOUR NAVIGATION</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{font-family:Arial;margin:0;background:#0f172a;color:#e2e8f0}
header{padding:10px;background:#111827;position:sticky;top:0;z-index:999}
button,input,select{padding:6px;margin:5px;border-radius:6px;border:0}
.card{background:#111827;margin:10px;padding:10px;border-radius:8px}
#map{height:380px;margin:10px;border-radius:10px}
.mode{font-weight:bold}
</style>
</head>
<body>

<header>
<b>🆘 GTFS PRO V26 LIFESAVER TOUR NAVIGATION</b><br>
<span class="mode" id="mode">LIFESAVER MODE</span><br>

<select id="poiType">
  <option value="tourism">🏕 tourism</option>
  <option value="peak">⛰ peak</option>
  <option value="safety">🆘 safety</option>
  <option value="village">🏘 exit (settlement)</option>
</select>

<button onclick="startGPS()">📍 GPS</button>
<button onclick="tourSearch()">🧭 TOUR</button>
<button onclick="lifeSaver()">🆘 LIFESAVER ROUTE</button>

<input id="search" placeholder="Pilis / Börzsöny / Skanzen..." />
</header>

<div id="map"></div>

<div class="card">
<b>📍 GPS</b>
<div id="gps">-</div>
</div>

<div class="card">
<b>🆘 LIFESAVER RESULT</b>
<div id="life">-</div>
</div>

<div class="card">
<b>🧭 TOUR RESULT</b>
<div id="tour">-</div>
</div>

<script>
let map,userMarker;
let userLat=47.4979,userLon=19.0402;
let cache=[];

function initMap(){
  map=L.map('map').setView([userLat,userLon],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  userMarker=L.marker([userLat,userLon]).addTo(map).bindPopup("Te");
}
initMap();

// ================= GPS =================
function startGPS(){
  navigator.geolocation.watchPosition(pos=>{
    userLat=pos.coords.latitude;
    userLon=pos.coords.longitude;

    document.getElementById("gps").innerText=`📍 ${userLat.toFixed(5)}, ${userLon.toFixed(5)}`;
    userMarker.setLatLng([userLat,userLon]);
    map.setView([userLat,userLon]);
  });
}

// ================= DIST =================
function dist(a,b,c,d){
  const R=6371000;
  const x=x=>x*Math.PI/180;
  const dLat=x(c-a);
  const dLon=x(d-b);
  const s=Math.sin(dLat/2)**2+
    Math.cos(x(a))*Math.cos(x(c))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}

// ================= OVERPASS SAFE =================
async function overpass(query){
  try{
    const res=await fetch("https://overpass-api.de/api/interpreter",{
      method:"POST",
      body:query
    });
    if(!res.ok) throw new Error("fail");
    return await res.json();
  }catch(e){
    return null;
  }
}

// ================= TOUR =================
async function tourSearch(){
  const q=document.getElementById("search").value;
  const bbox="47.2,18.6,47.9,19.6";

  const query=`
[out:json][timeout:12];
(
  node["name"~"${q}",i](${bbox});
  node["tourism"](${bbox});
  node["natural"="peak"](${bbox});
);
out center;
`;

  document.getElementById("tour").innerHTML="🔄 TOUR keresés...";

  const data=await overpass(query);

  if(!data){
    document.getElementById("tour").innerHTML="⚠️ OFFLINE TOUR MODE";
    return;
  }

  document.getElementById("tour").innerHTML=
    data.elements.slice(0,10).map(p=>{
      const d=dist(userLat,userLon,p.lat,p.lon);
      return `📍 <b>${p.tags?.name||"POI"}</b><br>📏 ${Math.round(d)} m<hr>`;
    }).join("");
}

// ================= LIFESAVER ENGINE =================
async function lifeSaver(){

  document.getElementById("life").innerHTML="🆘 keresés...";

  const query=`
[out:json][timeout:15];
(
  node["amenity"="shelter"](47.2,18.6,47.9,19.6);
  node["emergency"](47.2,18.6,47.9,19.6);
  node["place"="village"](47.2,18.6,47.9,19.6);
);
out center;
`;

  const data=await overpass(query);

  if(!data){
    document.getElementById("life").innerHTML="⚠️ OFFLINE LIFESAVER MODE";
    return;
  }

  const sorted=data.elements
    .map(p=>({...p,d:dist(userLat,userLon,p.lat,p.lon)}))
    .sort((a,b)=>a.d-b.d)
    .slice(0,8);

  document.getElementById("life").innerHTML=
    sorted.map(p=>{
      return `🆘 <b>${p.tags?.name||"SAFE POINT"}</b><br>📏 ${Math.round(p.d)} m<br>📌 ${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}<hr>`;
    }).join("");
}
</script>

</body>
</html>
