<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V4 REALTIME ENGINE</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Consolas,monospace;
}

/* ================= HEADER ================= */
#top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    border-bottom:2px solid #00ff66;
}

#clock{
    font-size:40px;
    color:#00ff66;
    text-shadow:0 0 15px #00ff66;
}

#gps{
    font-size:12px;
    color:#ffd000;
    max-width:50%;
}

/* ================= DROP AREA ================= */
#drop{
    margin:10px;
    padding:20px;
    border:2px dashed #00ff66;
    text-align:center;
    color:#00ff66;
}

/* ================= SEARCH ================= */
#search{
    width:95%;
    margin:10px;
    padding:10px;
    font-size:16px;
    border:none;
}

/* ================= STOPS ================= */
.stop{
    padding:8px;
    border-bottom:1px solid #222;
}

.dist{
    color:#7dff7d;
}
</style>
</head>

<body>

<div id="top">
    <div id="clock">00:00:00</div>
    <div id="gps">GPS inicializálás...</div>
</div>

<div id="drop">📦 GTFS ZIP DROP ZONE (dobd ide a fájlt)</div>

<input id="search" placeholder="🔍 megálló keresése...">

<div id="stops"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
/* ================= CLOCK ================= */
function tick(){
    document.getElementById("clock").innerText =
        new Date().toLocaleTimeString('hu-HU',{hour12:false});
}
setInterval(tick,1000); tick();

/* ================= GPS ================= */
let myLat=null, myLon=null;

navigator.geolocation.getCurrentPosition(pos=>{
    myLat = pos.coords.latitude;
    myLon = pos.coords.longitude;

    document.getElementById("gps").innerHTML =
        `📍 ${myLat.toFixed(5)}, ${myLon.toFixed(5)}`;

    renderStops();
});

/* ================= GTFS STORAGE ================= */
let GTFS = {
    stops:[]
};

/* ================= ZIP LOAD ================= */
document.getElementById("drop").ondragover = e=>{
    e.preventDefault();
};

document.getElementById("drop").ondrop = async e=>{
    e.preventDefault();

    const file = e.dataTransfer.files[0];
    const zip = await JSZip.loadAsync(file);

    const stopsFile = zip.file("stops.txt");
    if(!stopsFile){
        alert("Nincs stops.txt a GTFS-ben!");
        return;
    }

    const text = await stopsFile.async("string");

    parseStops(text);
    renderStops();
};

/* ================= GTFS PARSER ================= */
function parseStops(csv){
    const lines = csv.split("\n");
    const headers = lines[0].split(",");

    const idx = {
        id: headers.indexOf("stop_id"),
        name: headers.indexOf("stop_name"),
        lat: headers.indexOf("stop_lat"),
        lon: headers.indexOf("stop_lon")
    };

    GTFS.stops = [];

    for(let i=1;i<lines.length;i++){
        const c = lines[i].split(",");
        if(c.length < 3) continue;

        GTFS.stops.push({
            stop_id: c[idx.id],
            stop_name: c[idx.name],
            stop_lat: parseFloat(c[idx.lat]),
            stop_lon: parseFloat(c[idx.lon])
        });
    }
}

/* ================= DISTANCE ================= */
function dist(lat1,lon1,lat2,lon2){
    const R = 6371000;
    const dLat = (lat2-lat1)*Math.PI/180;
    const dLon = (lon2-lon1)*Math.PI/180;

    const a =
        Math.sin(dLat/2)**2 +
        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.sin(dLon/2)**2;

    return 2 * R * Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* ================= RENDER ================= */
function renderStops(){
    const q = document.getElementById("search").value.toLowerCase();
    const out = document.getElementById("stops");

    if(!GTFS.stops.length){
        out.innerHTML = "Nincs GTFS betöltve...";
        return;
    }

    out.innerHTML = GTFS.stops
        .filter(s => s.stop_name?.toLowerCase().includes(q))
        .slice(0,200)
        .map(s=>{

            let d = "";
            if(myLat){
                const m = dist(myLat,myLon,s.stop_lat,s.stop_lon);
                d = m < 1000 ? Math.round(m)+" m" : (m/1000).toFixed(2)+" km";
            }

            return `
            <div class="stop">
                🚏 ${s.stop_name}<br>
                <span style="color:#888">${s.stop_id}</span><br>
                📏 <span class="dist">${d}</span>
            </div>`;
        }).join("");
}

document.getElementById("search").oninput = renderStops;
</script>

</body>
</html>
