<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V5 – VERCEL OSM GRAPH</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b0f14;
    color:white;
}

header{
    background:#111827;
    padding:10px;
    font-weight:bold;
}

#map{
    height:90vh;
}

.panel{
    position:absolute;
    top:60px;
    left:10px;
    z-index:999;
    background:#111827;
    padding:10px;
    border-radius:8px;
    width:320px;
}

button{
    width:100%;
    padding:8px;
    cursor:pointer;
}

#status{
    margin-top:8px;
    font-size:12px;
    color:#93c5fd;
    white-space:pre-line;
}
</style>
</head>

<body>

<header>
🧭 FUTÁR V5 – VERCEL BACKEND OSM GRAPH
</header>

<div class="panel">
<button onclick="load()">🚶‍♂️ Betöltés</button>
<div id="status">Idle</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map')
.setView([47.52,19.03],12);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'OSM'
}).addTo(map);

function log(t){
    document.getElementById("status").innerText=t;
}

async function load(){

    try{

        log("Loading from Vercel API...");

        const res = await fetch('/api/osm');

        const data = await res.json();

        log(
            "Elements: " +
            (data.elements?.length || 0)
        );

        let bounds=[];

        data.elements.forEach(el=>{

            if(!el.geometry) return;

            const pts = el.geometry.map(p=>[
                p.lat,
                p.lon
            ]);

            pts.forEach(p=>bounds.push(p));

            L.polyline(pts,{
                color:'#22c55e',
                weight:3
            }).addTo(map);
        });

        if(bounds.length){
            map.fitBounds(bounds);
        }

        log(
`✔ NETWORK LOADED

Elements:
${data.elements.length}`
        );

    }catch(e){

        console.error(e);

        log(
`ERROR ❌

${e.message}`
        );
    }
}

</script>

</body>
</html>
