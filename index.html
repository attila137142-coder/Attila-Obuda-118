-------<!DOCTYPE html> <html lang="hu"> <head> <meta charset="utf-8" /> <title>Attila Közlekedés – térkép</title> <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/> <style> html, body { margin: 0; padding: 0; height: 100%; } #map { width: 100%; height: 100vh; } </style> </head> <body> <div id="map"></div> <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script> <script> // térkép var map = L.map('map').setView([47.4979, 19.0402], 13); // alap térkép (OSM) L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map); // saját ikon (biztos működő CDN) var busIcon = L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/61/61231.png', iconSize: [32, 32], iconAnchor: [16, 32], popupAnchor: [0, -30] }); // marker L.marker([47.4979, 19.0402], { icon: busIcon }) .addTo(map) .bindPopup("Budapest – BKK pont") .openPopup(); </script> </body> </html>
