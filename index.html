<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Atlasz V11 – Survival AI Core</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }
#map { height:85vh; }

.panel { padding:10px; background:#eee; }
button { margin-right:6px; }
</style>
</head>

<body>

<div class="panel">
🌲 Atlasz V11 – Survival AI Core<br>

<button onclick="simulateStorm()">🌧️ Vihar mód</button>
<button onclick="findPOI()">🔍 POI keresés</button>

<div id="info">AI ready</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

/////////////////////////////////////////////////////
// 🗺️ MAP
/////////////////////////////////////////////////////

const map = L.map('map').setView([47.95,18.90],12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OSM'
}).addTo(map);

/////////////////////////////////////////////////////
// 📍 USER
/////////////////////////////////////////////////////

const user={lat:47.93,lon:18.88};

L.marker([user.lat,user.lon]).addTo(map)
  .bindPopup("📍 Te itt vagy");

/////////////////////////////////////////////////////
// 🏕️ POI DATABASE
/////////////////////////////////////////////////////

const pois=[
  {name:"Menedékház A",lat:47.96,lon:18.92,type:"shelter",gsm:80,water:70,risk:30},
  {name:"Forrás",lat:47.95,lon:18.86,type:"water",gsm:40,water:100,risk:20},
  {name:"Falu",lat:47.98,lon:18.94,type:"village",gsm:100,water:50,risk:10},
  {name:"Buszmegálló",lat:47.92,lon:18.89,type:"bus",gsm:90,water:0,risk:10},
];

/////////////////////////////////////////////////////
// 📏 DISTANCE
/////////////////////////////////////////////////////

function dist(a,b,c,d){

  const R=6371;
  const dLat=(c-a)*Math.PI/180;
  const dLon=(d-b)*Math.PI/180;

  const x=Math.sin(dLat/2)**2 +
    Math.cos(a*Math.PI/180) *
    Math.cos(c*Math.PI/180) *
    Math.sin(dLon/2)**2;

  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

/////////////////////////////////////////////////////
// 🧠 SURVIVAL SCORE
/////////////////////////////////////////////////////

function score(p){

  const d=dist(user.lat,user.lon,p.lat,p.lon);

  return (p.gsm + p.water + (100-p.risk)) / (1 + d*10);
}

/////////////////////////////////////////////////////
// 🔍 FIND BEST ROUTE (CHAIN)
/////////////////////////////////////////////////////

function buildChain(){

  let start=user;
  let chain=[];
  let visited=[];

  for(let i=0;i<3;i++){

    let best=null;
    let bestS=0;

    pois.forEach(p=>{

      if(visited.includes(p)) return;

      const s=score(p);

      if(s>bestS){
        bestS=s;
        best=p;
      }

    });

    if(best){
      chain.push(best);
      visited.push(best);
      start=best;
    }

  }

  return chain;
}

/////////////////////////////////////////////////////
// 🌧️ STORM MODE
/////////////////////////////////////////////////////

function simulateStorm(){

  const chain=buildChain();

  let path=[[user.lat,user.lon]];

  chain.forEach(p=>{

    path.push([p.lat,p.lon]);

    L.marker([p.lat,p.lon]).addTo(map)
      .bindPopup(`🏕️ ${p.name}`);

  });

  L.polyline(path,{color:"blue"}).addTo(map);

  document.getElementById("info").innerHTML=
    "🌧️ Evakuációs útvonal kész (menedék lánc A→B→C)";

}

/////////////////////////////////////////////////////
// 🔍 POI SEARCH
/////////////////////////////////////////////////////

function findPOI(){

  pois.forEach(p=>{

    const d=dist(user.lat,user.lon,p.lat,p.lon);

    L.marker([p.lat,p.lon]).addTo(map)
      .bindPopup(
        `${p.name}<br>
        📏 ${(d*1000).toFixed(0)} m`
      );

  });

  document.getElementById("info").innerText=
    "🔍 POI lista betöltve";

}

</script>

</body>
</html>
