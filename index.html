<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
viewport-fit=cover,
user-scalable=yes">

<title>FUTÁR CONTROL ROOM V11 REAL MOBILE</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
background:#070b10;
font-family:Arial,sans-serif;
color:white;
overflow:auto;
}

/* HEADER */

header{
position:sticky;
top:0;
z-index:99999;
height:76px;
background:#101826;
border-bottom:2px solid #00ffaa;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 14px;
}

.logo{
font-size:18px;
font-weight:bold;
color:#00ffaa;
}

.top{
text-align:right;
}

#clock{
font-size:22px;
font-weight:bold;
color:#00ffaa;
}

#date{
font-size:11px;
color:#b8c7da;
}

/* MAIN */

.main{
padding:12px;
display:grid;
gap:18px;
}

/* SECTION */

.section{
background:#101925;
border:1px solid #223246;
border-radius:14px;
padding:14px;
}

.section h2{
margin:0 0 12px 0;
font-size:15px;
color:#00ffaa;
border-bottom:1px solid #233246;
padding-bottom:8px;
}

/* GRID */

.grid{
display:grid;
gap:10px;
}

/* BUTTON */

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:14px;
font-weight:bold;
cursor:pointer;
color:white;
text-align:left;
transition:0.2s;
}

button:hover{transform:scale(1.01);}

/* COLORS */

.live{background:#1f6feb;}
.station{background:#4d2032;}
.map{background:#5b2f7c;}
.mav{background:#24476b;}
.volan{background:#5a3615;}
.aev{background:#2f5d35;}
.gpsbtn{background:#5a3d13;}
.special{background:#234d36;}

/* GPS */

.gpsCard{
background:#132030;
border:1px solid #233246;
border-radius:12px;
padding:12px;
font-size:13px;
line-height:1.7;
}

.gpsCard h3{color:#00ffaa;margin-top:0;}

/* INPUT */

input{
width:100%;
padding:13px;
border:none;
border-radius:10px;
background:#182334;
color:white;
font-size:15px;
}

/* STATUS */

.status{
position:sticky;
bottom:0;
background:#101826;
border-top:1px solid #233246;
padding:10px;
font-size:12px;
color:#00ffaa;
z-index:999;
}

/* RAIL MAP + OVERLAY */

.railWrap{
position:relative;
}

.railmap{
width:100%;
height:650px;
border:none;
border-radius:12px;
background:white;
filter:contrast(1.3) brightness(1.1);
}

/* SZELVÉNY OVERLAY */

.kmLabel{
position:absolute;
left:10px;
color:#00ffaa;
font-size:12px;
font-weight:bold;
background:rgba(0,0,0,0.55);
padding:4px 6px;
border-radius:6px;
border:1px solid #00ffaa;
}

/* MOBILE */

@media(max-width:700px){
.logo{font-size:14px;}
#clock{font-size:16px;}
button{font-size:13px;padding:14px;}
.railmap{height:520px;}
}

</style>

</head>

<body>

<header>
<div class="logo">🚦 FUTÁR CONTROL ROOM V11 REAL</div>

<div class="top">
<div id="clock">00:00:00</div>
<div id="date"></div>
</div>
</header>

<div class="main">

<!-- KASSAI DÁNIEL -->

<div class="section">
<h2>📡 KASSAI DÁNIEL MENETREND</h2>

<div class="grid">

<button class="live" onclick="safeOpen('https://online.winmenetrend.hu/')">
📡 FŐ MENETRENDSZER
</button>

<button class="live" onclick="safeOpen('https://online.winmenetrend.hu/budapest/latest/lines')">
🚍 VALÓS INDULÁSOK
</button>

<button class="live" onclick="safeOpen('https://futar.bkk.hu/')">
🚌 FUTÁR LIVE
</button>

</div>
</div>

<!-- ÚJ: BŐVÍTETT MEGÁLLÓ MENETREND -->

<div class="section">
<h2>📜 KASSAI DÁNIEL MEGÁLLÓ MENETREND (EXPANDED)</h2>

<div class="grid">

<input id="stopSearch"
placeholder="Megálló ID / név (pl: CSF00457)">

<button class="gpsbtn" onclick="openStopExpanded()">
🔎 MEGÁLLÓ KERESÉS
</button>

<button class="station"
onclick="safeOpen('https://realtimenext.hu/embed/bkv/stops/CSF00457/schedule')">
🚏 NÁD UTCA (DEFAULT)
</button>

</div>
</div>

<!-- GYORSKERESŐ -->

<div class="section">
<h2>🔎 GYORSKERESŐ</h2>

<div class="grid">

<input id="bkkInput" placeholder="BKK stop ID">
<button class="gpsbtn" onclick="openBKKStop()">🚏 BKK STOP</button>

<input id="volanInput" placeholder="VOLÁN ID">
<button class="gpsbtn" onclick="openVolanStop()">🚌 VOLÁN STOP</button>

</div>
</div>

<!-- VASÚTI TÉRKÉP + SZELVÉNY -->

<div class="section">
<h2>🛤 VASÚTI TÉRKÉP + SZELVÉNY RENDSZER</h2>

<div class="railWrap">

<div class="kmLabel" style="top:20px;">KM 0+00 Budapest</div>
<div class="kmLabel" style="top:120px;">KM 5+00 Kelenföld</div>
<div class="kmLabel" style="top:220px;">KM 12+00 Budaörs</div>
<div class="kmLabel" style="top:320px;">KM 25+00 Biatorbágy</div>

<iframe
class="railmap"
src="https://www.openrailwaymap.org/mobile.php?style=standard&lat=47.4979&lon=19.0402&zoom=10">
</iframe>

</div>
</div>

</div>

<div class="status" id="statusbar">
🟢 V11 HYBRID READY
</div>

<script>

function updateClock(){
const now = new Date();
document.getElementById("clock").innerHTML = now.toLocaleTimeString('hu-HU');
document.getElementById("date").innerHTML = now.toLocaleDateString('hu-HU');
}
setInterval(updateClock,1000);
updateClock();

function safeOpen(url){
const win = window.open(url,'_blank');
if(!win){ location.href = url; }
document.getElementById("statusbar").innerHTML = "🌐 " + url;
}

function openStopExpanded(){
let id = document.getElementById("stopSearch").value.trim();
if(!id){ alert("Adj meg megálló ID-t"); return; }
safeOpen("https://realtimenext.hu/embed/bkv/stops/" + id + "/schedule");
}

function openBKKStop(){
let id = document.getElementById("bkkInput").value.trim();
if(!id){alert("Adj meg ID-t");return;}
safeOpen("https://realtimenext.hu/embed/bkv/stops/" + id + "/schedule");
}

function openVolanStop(){
let id = document.getElementById("volanInput").value.trim();
if(!id){alert("Adj meg VOLÁN ID-t");return;}
if(!id.includes("_")) id += "_0";
safeOpen("https://utas.hu/stop/hkir_" + id);
}

</script>

</body>
</html>
