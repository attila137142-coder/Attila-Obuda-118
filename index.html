<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Attila Desktop Weather Clock V2.1.1 FIXED
</title>


<style>


*{
box-sizing:border-box;
}


body{

margin:0;

width:100vw;

height:100vh;

overflow:hidden;

background:#050505;

font-family:
"Segoe UI",
Arial,
sans-serif;

color:white;

}




.clockBox{


position:absolute;


top:15px;

right:15px;


width:390px;


min-height:600px;


background:

linear-gradient(
145deg,
#111,
#020202
);



border:

2px solid #00ff55;



border-radius:18px;



padding:18px;



box-shadow:

0 0 25px
rgba(0,255,80,0.4);


}





.title{


text-align:center;


color:#00ff55;


font-size:18px;


font-weight:bold;


letter-spacing:2px;


margin-bottom:10px;


}





.clock{


text-align:center;


color:#00ff55;


font-size:58px;


font-weight:800;


letter-spacing:3px;


text-shadow:

0 0 15px #00ff55;


}





.weekday{


text-align:center;


color:#ffd36a;


font-size:20px;


font-weight:bold;


margin-top:5px;


}





.date{


text-align:center;


color:#ff9d00;


font-size:26px;


font-weight:700;


margin-top:5px;


text-shadow:

0 0 8px
rgba(255,160,0,.7);


}




.line{


height:2px;


background:#333;


margin:15px 0;


}





.panel{


background:

rgba(255,255,255,0.05);



border-radius:12px;


padding:12px;


margin-bottom:10px;


}





.panelTitle{


color:#00ffff;


font-size:17px;


font-weight:bold;


margin-bottom:8px;


}





.data{


font-size:18px;


line-height:1.6;


}





.temperature{


text-align:center;


font-size:38px;


font-weight:bold;


color:#66ff66;


}





.gps{


color:#00ff88;


}




</style>


</head>



<body>

</div>


</div>
