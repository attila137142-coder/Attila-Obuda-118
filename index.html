<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>GTFS FILE ROUTER ENGINE V1</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body { margin:0; font-family:Arial; background:#0b1220; color:white; }
#map { height:70vh; }
.panel { padding:10px; background:#111a2e; }
pre { white-space:pre-wrap; }
button { margin:5px; padding:8px; }
</style>
</head>

<body>

<div class="panel">
<h2>🚆 GTFS FILE ROUTER ENGINE V1</h2>

<input type="file" id="files" multiple>
<button onclick="loadFiles()">LOAD GTFS FILES</button>
<button onclick="build()">BUILD ENGINE</button>

<div id="status">READY</div>
<pre id="debug"></pre>
</div>

<div id="map"></div>

<script>

const map = L.map('map').setView([47.5,19.05],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'OSM'
}).addTo(map);

// ---------------- STORAGE ----------------
let routes = [];
let stops = [];
let stopTimes = [];
let trips = [];

// ---------------- ROUTER ----------------
function routeFile(file){

    let name = file.name.toLowerCase();

    if(name.includes("stops.txt")) return "stops";
    if(name.includes("stop_times.txt")) return "stop_times";
    if(name.includes("trips.txt")) return "trips";
    if(name.includes("routes.txt")) return "routes";

    return "unknown";
}

// ---------------- LOAD FILES ----------------
function loadFiles(){

    let files = document.getElementById("files").files;

    for(let f of files){

        let type = routeFile(f);

        Papa.parse(f,{
            header:true,
            skipEmptyLines:true,
            complete:(r)=>{

                debugLog(`Loaded ${f.name} → ${type} (${r.data.length})`);

                if(type === "stops"){
                    stops = r.data;
                }

                if(type === "stop_times"){
                    stopTimes = r.data;
                }

                if(type === "trips"){
                    trips = r.data;
                }

                if(type === "routes"){
                    routes = r.data;
                }

                if(type === "unknown"){
                    debugLog("⚠ UNKNOWN FILE: " + f.name);
                }
            }
        });
    }
}

// ---------------- BUILD ENGINE ----------------
function build(){

    debugLog("=== BUILD START ===");

    debugLog("STOPS: " + stops.length);
    debugLog("STOP_TIMES: " + stopTimes.length);
    debugLog("TRIPS: " + trips.length);
    debugLog("ROUTES: " + routes.length);

    if(stops.length === 0){
        alert("❌ NINCS stops.txt BETÖLTVE!");
        return;
    }

    let valid = stops
        .map(s=>({

            id: s.stop_id || s.id,
            name: s.stop_name || s.name,

            lat: parseFloat(s.stop_lat || s.lat),
            lon: parseFloat(s.stop_lon || s.lon)

        }))
        .filter(s=>!isNaN(s.lat) && !isNaN(s.lon));

    debugLog("VALID STOPS: " + valid.length);

    render(valid);
}

// ---------------- MAP ----------------
function render(stops){

    map.eachLayer(l=>{
        if(l instanceof L.CircleMarker) map.removeLayer(l);
    });

    stops.forEach(s=>{

        L.circleMarker([s.lat,s.lon],{
            radius:4,
            color:"cyan"
        }).addTo(map)
        .bindPopup(s.name + "<br>" + s.id);

    });
}

// ---------------- DEBUG ----------------
function debugLog(t){
    document.getElementById("debug").innerText += t + "\n";
}

</script>

</body>
</html>
