<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FUTÁR V11 VEZÉRLŐTEREM</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
    margin:0;
    background:#070b10;
    color:#d7e1ea;
    font-family:Arial;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    padding:10px 14px;
    background:#0f1622;
    border-bottom:2px solid #1e2a3a;
}

.title{
    font-weight:bold;
    color:#7fb3ff;
}

.clock{
    font-size:26px;
    color:#00ff88;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns: 1.4fr 1fr 1fr;
    grid-template-rows: auto auto auto;
    gap:10px;
    padding:10px;
}

/* PANELS */
.panel{
    background:#0e1622;
    border:1px solid #243447;
    border-radius:8px;
    padding:10px;
    overflow:auto;
}

h2{
    margin:0 0 8px 0;
    font-size:12px;
    color:#7fb3ff;
}

/* MAP */
#map{
    height:520px;
    border-radius:8px;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
}

td,th{
    border-bottom:1px solid #243447;
    padding:4px;
}

/* STATUS */
.ok{ color:#00ff88; }
.warn{ color:#ffcc00; }
.bad{ color:#ff4d4d; }

/* LOG */
.log{
    font-size:11px;
    color:#9bb3c7;
    height:200px;
    overflow:auto;
}

/* INPUTS */
input,button{
    width:100%;
    padding:7px;
    margin-top:6px;
    border-radius:6px;
    border:none;
}

button{
    background:#00aaff;
    color:white;
    cursor:pointer;
}

/* HEALTH BARS */
.health{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    font-size:11px;
}

.box{
    background:#111c2a;
    padding:6px;
    border-radius:6px;
}

.badge{
    padding:2px 6px;
    background:#1d2a3b;
    border-radius:4px;
}
</style>
</head>

<body>

<div class="header">
    <div class="title">🚍 FUTÁR V11 – VEZÉRLŐTEREM</div>
    <div class="clock" id="clock">--:--:--</div>
</div>

<div class="grid">

<!-- SYSTEM HEALTH -->
<div class="panel">
<h2>🧠 SYSTEM HEALTH</h2>
<div class="health">
    <div class="box">GTFS<br><span class="ok" id="h1">READY</span></div>
    <div class="box">MAP<br><span class="ok">ONLINE</span></div>
    <div class="box">ROUTES<br><span class="warn" id="h2">0</span></div>
    <div class="box">STOPS<br><span class="warn" id="h3">0</span></div>
</div>
</div>

<!-- GTFS -->
<div class="panel">
<h2>📦 GTFS LOADER</h2>
<input type="file" id="zip"/>
<div id="status" style="font-size:11px;">Nincs GTFS</div>
</div>

<!-- ROUTE FILTER -->
<div class="panel">
<h2>🚍 ROUTE FILTER</h2>
<input id="rq"/>
<button onclick="routeSearch()">KERESÉS</button>
<div id="routeOut" style="font-size:11px;"></div>
</div>

<!-- MAP -->
<div class="panel" style="grid-column:span 2;">
<h2>🗺️ LIVE DISPATCH MAP</h2>
<div id="map"></div>
</div>

<!-- DISPATCH -->
<div class="panel">
<h2>📊 DISPATCH BOARD</h2>
<table>
<thead>
<tr><th>Idő</th><th>Járat</th><th>Status</th></tr>
</thead>
<tbody id="board"></tbody>
</table>
</div>

<!-- STOP -->
<div class="panel">
<h2>🚏 STOP SEARCH</h2>
<input id="sq"/>
<button onclick="stopSearch()">KERESÉS</button>
<div id="stopOut" style="font-size:11px;"></div>
</div>

<!-- LOG -->
<div class="panel">
<h2>📡 EVENT LOG</h2>
<div class="log" id="log"></div>
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>

// CLOCK
setInterval(()=>{
    document.getElementById("clock").innerText = new Date().toLocaleTimeString();
},1000);

// MAP
const map = L.map("map").setView([47.4979,19.0402],12);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19
}).addTo(map);

let layer = L.layerGroup().addTo(map);

// DATA CORE
let GTFS = {stops:[],routes:[]};

// LOG
function log(msg){
    const el=document.getElementById("log");
    el.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}<br>` + el.innerHTML;
}

// LOAD GTFS
document.getElementById("zip").addEventListener("change", async (e)=>{
    const zip = await JSZip.loadAsync(e.target.files[0]);

    GTFS.stops = await csv(zip,"stops.txt");
    GTFS.routes = await csv(zip,"routes.txt");

    document.getElementById("status").innerText =
        "GTFS LOADED";

    document.getElementById("h2").innerText = GTFS.routes.length;
    document.getElementById("h3").innerText = GTFS.stops.length;

    draw();
    board();

    log("GTFS loaded");
});

// CSV
async function csv(zip,f){
    const file = zip.file(f);
    if(!file) return [];

    const text = await file.async("string");
    const lines = text.split("\n").filter(Boolean);

    const h = lines[0].split(",");

    return lines.slice(1).map(l=>{
        const v=l.split(",");
        let o={};
        h.forEach((hh,i)=>o[hh]=v[i]);
        return o;
    });
}

// DRAW STOPS
function draw(){
    layer.clearLayers();

    GTFS.stops.forEach(s=>{
        if(!s.stop_lat) return;

        L.circleMarker([s.stop_lat,s.stop_lon],{
            radius:4,
            color:"#00aaff"
        }).addTo(layer);
    });
}

// ROUTE SEARCH
function routeSearch(){
    const q=document.getElementById("rq").value.toLowerCase();

    const res = GTFS.routes
    .filter(r=>(r.route_short_name||"").toLowerCase().includes(q))
    .slice(0,12)
    .map(r=>"🚍 "+r.route_short_name)
    .join("<br>");

    document.getElementById("routeOut").innerHTML=res||"nincs";
    log("Route search: "+q);
}

// STOP SEARCH
function stopSearch(){
    const q=document.getElementById("sq").value.toLowerCase();

    const res = GTFS.stops
    .filter(s=>(s.stop_name||"").toLowerCase().includes(q))
    .slice(0,12)
    .map(s=>"🚏 "+s.stop_name)
    .join("<br>");

    document.getElementById("stopOut").innerHTML=res||"nincs";
    log("Stop search: "+q);
}

// BOARD
function board(){
    const el=document.getElementById("board");
    el.innerHTML="";

    GTFS.routes.slice(0,10).forEach((r,i)=>{
        const row=document.createElement("tr");

        row.innerHTML=`
        <td>${8+i}:00</td>
        <td><span class="badge">${r.route_short_name||r.route_id}</span></td>
        <td class="ok">ON TIME</td>
        `;

        el.appendChild(row);
    });
}

// LIVE STATUS SIM
setInterval(()=>{
    document.querySelectorAll("#board td:last-child").forEach(td=>{
        const s=["ON TIME","DELAY +1","DELAY +2","EARLY -1"];
        td.innerText=s[Math.floor(Math.random()*s.length)];
    });
},3000);

</script>

</body>
</html>
