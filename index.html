<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Börzsöny Atlasz – Water + Wildlife Heatmap</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body { margin:0; font-family: Arial; }
    #map { height: 100vh; }
    .legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: white;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 999;
    }
  </style>
</head>

<body>

<div id="map"></div>

<div class="legend">
  💧 Water Risk / 🐾 Wildlife Heatmap<br>
  🟢 Safe → 🔴 Dangerous<br>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<script>

// 🗺️ Alap térkép (Börzsöny központ)
const map = L.map('map').setView([47.95, 18.90], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

/////////////////////////////////////////////////////
// 💧 WATER RISK DATA (S1–S5 egyszerűsítve 0–1)
/////////////////////////////////////////////////////

const waterPoints = [
  [47.9394, 18.9321, 0.4], // Természetbarát-forrás (S3 környék)
  [47.9500, 18.9000, 0.2],
  [47.9600, 18.8800, 0.7],
  [47.9400, 18.9100, 0.5]
];

/////////////////////////////////////////////////////
// 🐾 WILDLIFE INTENSITY
/////////////////////////////////////////////////////

const wildlifePoints = [
  [47.9394, 18.9321, 0.8],
  [47.9500, 18.9000, 0.6],
  [47.9600, 18.8800, 0.9],
  [47.9450, 18.9150, 0.7]
];

/////////////////////////////////////////////////////
// 🔥 HEATMAP LAYERS
/////////////////////////////////////////////////////

const waterHeat = L.heatLayer(waterPoints, {
  radius: 25,
  blur: 18,
  maxZoom: 17
});

const wildlifeHeat = L.heatLayer(wildlifePoints, {
  radius: 30,
  blur: 20,
  maxZoom: 17
});

waterHeat.addTo(map);
wildlifeHeat.addTo(map);

/////////////////////////////////////////////////////
// 🧭 LAYER CONTROL
/////////////////////////////////////////////////////

L.control.layers(null, {
  "💧 Water Risk": waterHeat,
  "🐾 Wildlife Heat": wildlifeHeat
}).addTo(map);

/////////////////////////////////////////////////////
// 📍 EXTRA MARKER (példa forrás)
/////////////////////////////////////////////////////

L.marker([47.9394, 18.9321])
  .addTo(map)
  .bindPopup("💧 Természetbarát-forrás (Kettős-kút)<br>OSM ID: 2255466515");

</script>

</body>
</html>
