<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V12.2 OPERATOR CONSOLE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:#e5e7eb;
}

header{
    background:#111827;
    padding:10px;
    text-align:center;
    font-weight:bold;
    color:#38bdf8;
}

.container{
    display:flex;
    height:100vh;
}

/* LEFT */
.left{
    width:40%;
    display:flex;
    flex-direction:column;
    border-right:1px solid #1f2937;
}

.panel{
    padding:10px;
    border-bottom:1px solid #1f2937;
}

button{
    width:100%;
    padding:10px;
    margin-top:6px;
    border:none;
    border-radius:8px;
    background:#38bdf8;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0ea5e9;
}

.list{
    flex:1;
    overflow:auto;
    padding:10px;
}

.card{
    background:#0f172a;
    border:1px solid #1f2937;
    padding:10px;
    margin-bottom:8px;
    border-radius:10px;
}

/* RIGHT MAP */
.right{
    width:60%;
}

#map{
    height:100%;
}

/* GPS PANEL */
.gps{
    font-size:12px;
    background:#0a0f1a;
    padding:8px;
    border-top:1px solid #1f2937;
}
</style>
</head>

<body>

<header>
🟦 V12.2 REAL OPERATOR CONSOLE (GPS + GTFS + ROUTE + MAP)
</header>

<div class="container">

<!-- LEFT -->
<div class="left">

<div class="panel">
<button onclick="startGPS()">📍 LIVE GPS START</button>
<button onclick="findNearest()">🧭 LEGKÖZELEBBI MEGÁLLÓ</button>
<button onclick="routeDemo()">🚦 ROUTE DEMO</button>
</div>

<div class="list" id="list"></div>

<div class="gps" id="gps">
📡 GPS: waiting...
</div>

</div>

<!-- MAP -->
<div class="right">
<div id="map"></div>
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ---------------- MAP INIT ----------------
let map = L.map('map').setView([47.4979,19.0402], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19
}).addTo(map);

// ---------------- GTFS STOPS ----------------
let STOPS=[
    {id:"SKANZEN",name:"Skanzen",lat:47.6952,lon:19.0756},
    {id:"KIRALYRET",name:"Királyrét",lat:47.9271,lon:18.9952},
    {id:"TAHITOTFALU",name:"Tahitótfalu",lat:47.7568,lon:19.0794},
    {id:"HIDFO",name:"Hídfő",lat:47.4979,lon:19.0402},
    {id:"NAD",name:"Nád utca",lat:47.5183,lon:19.0467}
];

// ---------------- USER ----------------
let USER={
    lat:null,
    lon:null,
    marker:null
};

// ---------------- DISTANCE ----------------
function dist(lat1,lon1,lat2,lon2){
    const R=6371;
    let dLat=(lat2-lat1)*Math.PI/180;
    let dLon=(lon2-lon1)*Math.PI/180;

    let a=
        Math.sin(dLat/2)**2 +
        Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
        Math.sin(dLon/2)**2;

    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ---------------- GPS ----------------
function startGPS(){

    if(!navigator.geolocation){
        alert("GPS nem támogatott");
        return;
    }

    navigator.geolocation.watchPosition(pos=>{

        USER.lat=pos.coords.latitude;
        USER.lon=pos.coords.longitude;

        document.getElementById("gps").innerHTML=
        `📍 LAT: ${USER.lat}<br>📍 LON: ${USER.lon}`;

        // marker update
        if(USER.marker){
            map.removeLayer(USER.marker);
        }

        USER.marker=L.marker([USER.lat,USER.lon])
        .addTo(map)
        .bindPopup("YOU");

        map.setView([USER.lat,USER.lon],13);

    });
}

// ---------------- STOPS ON MAP ----------------
STOPS.forEach(s=>{
    L.marker([s.lat,s.lon])
    .addTo(map)
    .bindPopup(`${s.name} (${s.id})`);
});

// ---------------- NEAREST STOP ----------------
function findNearest(){

    if(!USER.lat){
        alert("nincs GPS");
        return;
    }

    let best=null;
    let bestD=9999;

    STOPS.forEach(s=>{
        let d=dist(USER.lat,USER.lon,s.lat,s.lon);
        if(d<bestD){
            bestD=d;
            best=s;
        }
    });

    alert(`🧭 Legközelebbi: ${best.name} (${best.id})\n📏 ${bestD.toFixed(2)} km`);
}

// ---------------- ROUTE DEMO ----------------
function routeDemo(){

    let from=STOPS[3];
    let to=STOPS[0];

    let d=dist(from.lat,from.lon,to.lat,to.lon);

    alert(`🚦 ROUTE\n${from.name} → ${to.name}\n📏 ${d.toFixed(2)} km`);
}

</script>

</body>
</html>
