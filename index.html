<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>REAL DATA BRIDGE V1</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1220;
    color: #e5e7eb;
}

header {
    background: #111827;
    padding: 10px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
}

.container {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: 80vh;
}

.left {
    background: #1f2937;
    padding: 10px;
    overflow-y: auto;
}

.right {
    padding: 10px;
}

.box {
    background: #111827;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 6px;
}

input, textarea {
    width: 100%;
    padding: 8px;
    margin: 5px 0;
    border-radius: 5px;
    border: none;
}

button {
    width: 100%;
    padding: 8px;
    background: #2563eb;
    border: none;
    color: white;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background: #1d4ed8;
}

.item {
    background: #374151;
    padding: 6px;
    margin: 5px 0;
    border-radius: 5px;
}

.log {
    height: 20vh;
    background: #0f172a;
    font-size: 12px;
    overflow-y: auto;
    padding: 8px;
    border-top: 1px solid #333;
}
</style>
</head>

<body>

<header>
    <div>🚍 REAL DATA BRIDGE V1</div>
    <div id="status">BRIDGE OFFLINE</div>
</header>

<div class="container">

<!-- LEFT PANEL -->
<div class="left">

<div class="box">
    <h3>🔗 GTFS DATA SOURCE</h3>

    <input id="url" placeholder="GTFS JSON URL (vagy API endpoint)">
    <button onclick="loadData()">LOAD DATA</button>

    <p style="font-size:12px;opacity:0.7;">
        Példa formátum: JSON (stops/routes/trips)
    </p>
</div>

<div class="box">
    <h3>📦 MANUAL PASTE (fallback)</h3>
    <textarea id="manual" rows="6" placeholder='{"stops":[...]} '></textarea>
    <button onclick="loadManual()">PARSE</button>
</div>

</div>

<!-- RIGHT PANEL -->
<div class="right">

<div class="box">
    <h3>📍 STOPS</h3>
    <div id="stops">nincs adat</div>
</div>

<div class="box">
    <h3>🚍 ROUTES</h3>
    <div id="routes">nincs adat</div>
</div>

<div class="box">
    <h3>🧠 BRIDGE STATUS</h3>
    <div id="bridge">waiting...</div>
</div>

<div class="box">
    <h3>📡 DEVICE DATA</h3>
    <div id="device"></div>
</div>

</div>

</div>

<div class="log" id="log"></div>

<script>

/* =========================
   LOG
========================= */
function log(msg){
    document.getElementById("log").innerHTML += msg + "<br>";
}

/* =========================
   BRIDGE STATE
========================= */
let GTFS = null;

/* =========================
   LOAD FROM URL
========================= */
async function loadData(){
    let url = document.getElementById("url").value;

    if(!url){
        alert("Adj meg URL-t");
        return;
    }

    log("Fetching: " + url);

    try {
        let res = await fetch(url);
        let data = await res.json();

        parseGTFS(data);

        document.getElementById("status").innerText = "BRIDGE ONLINE";
        log("Data loaded from URL");

    } catch(e){
        log("ERROR: " + e.message);
    }
}

/* =========================
   MANUAL PASTE
========================= */
function loadManual(){
    try {
        let data = JSON.parse(document.getElementById("manual").value);
        parseGTFS(data);

        document.getElementById("status").innerText = "BRIDGE ONLINE (MANUAL)";
        log("Manual GTFS loaded");

    } catch(e){
        log("PARSE ERROR: " + e.message);
    }
}

/* =========================
   CORE PARSER
========================= */
function parseGTFS(data){
    GTFS = data;

    log("Parsing GTFS...");

    renderStops();
    renderRoutes();
}

/* =========================
   RENDER STOPS
========================= */
function renderStops(){
    if(!GTFS?.stops) return;

    let html = "";
    GTFS.stops.forEach(s=>{
        html += `<div class="item">${s.name} (${s.id})</div>`;
    });

    document.getElementById("stops").innerHTML = html;
}

/* =========================
   RENDER ROUTES
========================= */
function renderRoutes(){
    if(!GTFS?.routes) return;

    let html = "";
    GTFS.routes.forEach(r=>{
        html += `<div class="item">${r.name} (${r.id})</div>`;
    });

    document.getElementById("routes").innerHTML = html;
}

/* =========================
   DEVICE DATA (REAL)
========================= */
function updateDevice(){

    let out = "";

    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(pos=>{
            out += "GPS: " + pos.coords.latitude.toFixed(5) + ", " +
                   pos.coords.longitude.toFixed(5) + "<br>";

            out += "Accuracy: " + Math.round(pos.coords.accuracy) + " m<br>";

            document.getElementById("device").innerHTML = out;
        });
    }

    if(navigator.connection){
        let c = navigator.connection;
        out += "Network: " + c.effectiveType + "<br>";
        out += "Downlink: " + c.downlink + " Mbps<br>";
    }
}

/* =========================
   INIT
========================= */
updateDevice();
setInterval(updateDevice, 10000);

log("REAL DATA BRIDGE V1 initialized");

</script>

</body>
</html>
