<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V5 – TURISTA GRAPH ENGINE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; background:#0b0f14; color:white; }
header { padding:10px; background:#111827; font-weight:bold; }
#map { height:90vh; }

.panel {
    position:absolute;
    top:60px;
    left:10px;
    z-index:999;
    background:#111827;
    padding:10px;
    width:340px;
    border-radius:8px;
}

button {
    width:100%;
    padding:8px;
    margin-top:5px;
    cursor:pointer;
}

#status {
    font-size:12px;
    margin-top:8px;
    color:#93c5fd;
    white-space:pre-line;
}
</style>
</head>

<body>

<header>🧭 FUTÁR V5 – TURISTA GRAPH ENGINE (OSM RELATION BASED)</header>

<div class="panel">
<button onclick="loadGraph()">🚶‍♂️ Graph turista háló betöltése</button>
<div id="status">Idle</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ---------------- MAP ----------------
const map = L.map('map').setView([47.52, 19.03], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:"OSM"
}).addTo(map);

// ---------------- STATUS ----------------
function log(msg){
    document.getElementById("status").innerText = msg;
}

// ---------------- COLOR ----------------
function getColor(len){
    if(len < 500) return "green";
    if(len < 1500) return "yellow";
    if(len < 3000) return "orange";
    return "red";
}

// ---------------- GRAPH STORAGE ----------------
let graphNodes = {};
let graphEdges = [];

// ---------------- DISTANCE ----------------
function dist(a,b){
    const R = 6371000;
    const dLat = (b.lat-a.lat)*Math.PI/180;
    const dLon = (b.lon-a.lon)*Math.PI/180;
    const lat1 = a.lat*Math.PI/180;
    const lat2 = b.lat*Math.PI/180;

    const x =
        Math.sin(dLat/2)**2 +
        Math.sin(dLon/2)**2 * Math.cos(lat1)*Math.cos(lat2);

    return 2*R*Math.asin(Math.sqrt(x));
}

// ---------------- NODE KEY ----------------
function key(p){
    return `${p.lat.toFixed(5)}_${p.lon.toFixed(5)}`;
}

// ---------------- LOAD GRAPH ----------------
async function loadGraph(){

    log("Loading hiking relations...");

    const query = `
    [out:json][timeout:25];
    (
      relation["route"="hiking"](47.45,18.85,47.60,19.20);
      way["highway"~"path|footway|track"](47.45,18.85,47.60,19.20);
    );
    out geom;
    `;

    const url = "https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query);

    try {

        const res = await fetch(url);
        const data = await res.json();

        log("Parsing graph... elements: " + data.elements.length);

        let totalEdges = 0;

        data.elements.forEach(el => {

            if(!el.geometry || el.geometry.length < 2) return;

            const pts = el.geometry;

            for(let i=0;i<pts.length-1;i++){

                const a = pts[i];
                const b = pts[i+1];

                const A = {lat:a.lat, lon:a.lon};
                const B = {lat:b.lat, lon:b.lon};

                const idA = key(A);
                const idB = key(B);

                graphNodes[idA] = A;
                graphNodes[idB] = B;

                const len = dist(A,B);

                graphEdges.push({
                    from:idA,
                    to:idB,
                    len:len
                });

                L.polyline([[A.lat,A.lon],[B.lat,B.lon]],{
                    color:getColor(len),
                    weight:3
                }).addTo(map);

                totalEdges++;
            }
        });

        log(
`GRAPH READY ✔️

Nodes: ${Object.keys(graphNodes).length}
Edges: ${graphEdges.length}
Status: TURISTA NETWORK ACTIVE`
        );

    } catch(e){

        console.error(e);
        log("ERROR ❌ Overpass failed\n" + e.message);
    }
}

</script>

</body>
</html>
