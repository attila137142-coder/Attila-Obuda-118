<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>SLOPE V4 INTELLIGENS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
body { margin:0; font-family:Arial; background:#111; color:#fff;}
#map { height:50vh;}
#panel { padding:10px;}
input,button { padding:10px; margin:5px;}
#results div { padding:6px; border-bottom:1px solid #333; cursor:pointer;}
#results div:hover { background:#333;}
table { width:100%; font-size:12px; border-collapse:collapse;}
td,th { border:1px solid #444; padding:4px;}
</style>
</head>
<body>

<div id="map"></div>

<div id="panel">
<input id="street" placeholder="pl: Hármashatárhegyi út / turista út">
<button onclick="search()">KERESÉS</button>
<button onclick="calc()">MEREDESÉG</button>

<div id="results"></div>

<table id="tbl">
<tr><th>#</th><th>m</th><th>Δh</th><th>%</th></tr>
</table>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map = L.map('map').setView([47.4979,19.0402],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let coords = [];
let line;

// 🔍 KERESÉS
async function search(){
  let q = street.value;

  let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q},Hungary&limit=5`);
  let data = await res.json();

  results.innerHTML="";

  data.forEach(p=>{
    let d=document.createElement("div");
    d.innerText=p.display_name;
    d.onclick=()=>load(p);
    results.appendChild(d);
  });

  await load(data[0]);
}

// 📍 INTELLIGENS ÚT ILLESZTÉS
async function load(p){
  map.setView([p.lat,p.lon],15);

  let q = `
  [out:json];
  (
    way["highway"~"primary|secondary|tertiary|residential|service"](around:1500,${p.lat},${p.lon});
    way["highway"~"path|footway|track"](around:1500,${p.lat},${p.lon});
  );
  out geom;
  `;

  let res = await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:q});
  let data = await res.json();

  if(data.elements.length==0){
    alert("Nincs út!");
    return;
  }

  // 🔥 1. WAY-ek szétbontása
  let ways = data.elements.map(el=>el.geometry);

  // 🔥 2. láncolt összefűzés (intelligens sorrend)
  coords = [];

  let used = new Array(ways.length).fill(false);

  coords.push([ways[0][0].lat, ways[0][0].lon]);
  used[0]=true;

  let changed=true;

  while(changed){
    changed=false;

    for(let i=0;i<ways.length;i++){
      if(used[i]) continue;

      let w = ways[i];

      let last = coords[coords.length-1];

      let start = [w[0].lat,w[0].lon];
      let end = [w[w.length-1].lat,w[w.length-1].lon];

      // ha illeszkedik
      if(distance(last,start)<0.0005){
        w.forEach(p=>coords.push([p.lat,p.lon]));
        used[i]=true;
        changed=true;
      }
      else if(distance(last,end)<0.0005){
        w.reverse().forEach(p=>coords.push([p.lat,p.lon]));
        used[i]=true;
        changed=true;
      }
    }
  }

  if(line) map.removeLayer(line);

  line = L.polyline(coords,{color:"cyan",weight:5}).addTo(map);

  alert(`Út betöltve ✔ (${coords.length} pont)`);
}

// 📏 egyszerű távolság
function distance(a,b){
  return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]);
}

// ⛰️ MEREDESÉG
async function calc(){

  if(coords.length<2){
    alert("Nincs út!");
    return;
  }

  let elev = await getElev(coords);

  tbl.innerHTML="<tr><th>#</th><th>m</th><th>Δh</th><th>%</th></tr>";

  for(let i=0;i<coords.length-1;i++){

    let p1=coords[i];
    let p2=coords[i+1];

    let d = map.distance(p1,p2);
    let dh = elev[i+1]-elev[i];
    let slope = (dh/d)*100;

    let c="green";
    if(slope>5) c="orange";
    if(slope>10) c="red";

    L.polyline([p1,p2],{color:c,weight:4}).addTo(map);

    let r = tbl.insertRow();
    r.innerHTML=`<td>${i}</td><td>${d.toFixed(1)}</td><td>${dh.toFixed(1)}</td><td>${slope.toFixed(2)}</td>`;
  }

  alert("KÉSZ ✔ intelligens út + slope");
}

// ⛰️ magasság
async function getElev(points){

  let res = await fetch("https://api.open-elevation.com/api/v1/lookup",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      locations: points.map(p=>({latitude:p[0],longitude:p[1]}))
    })
  });

  let data = await res.json();
  return data.results.map(r=>r.elevation);
}
</script>

</body>
</html>
