<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FUTÁR V5 REAL ENGINE CORE</title>
</head>
<body style="background:#0b0f14;color:#e6e6e6;font-family:Arial;">

<h2>🚍 FUTÁR V5 REAL ENGINE CORE</h2>
<p>Minimal real-data architecture (GTFS-ready skeleton)</p>

<pre id="log">Engine starting...</pre>

<script>
/**
 * FUTÁR V5 REAL ENGINE CORE
 * Goal: DATA FIRST, UI SECOND
 */

const CONFIG = {
  gtfsStaticUrl: "https://example.com/gtfs/stops.json",   // placeholder
  gtfsRtUrl: "https://example.com/gtfs/realtime.json",    // placeholder
  refreshInterval: 15000
};

const state = {
  stops: [],
  vehicles: [],
  departures: []
};

function log(msg) {
  const el = document.getElementById("log");
  el.innerText += "\n" + msg;
}

/**
 * FETCH LAYER (REAL ENGINE CORE)
 */
async function fetchJSON(url) {
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } catch (err) {
    log("❌ Fetch error: " + err.message);
    return null;
  }
}

/**
 * LOAD STATIC GTFS (stops, routes)
 */
async function loadStatic() {
  log("📦 Loading GTFS static...");

  const data = await fetchJSON(CONFIG.gtfsStaticUrl);
  if (!data) return;

  state.stops = data.stops || [];

  log("✔ Stops loaded: " + state.stops.length);
}

/**
 * LOAD REALTIME GTFS (vehicles, delays)
 */
async function loadRealtime() {
  log("📡 Loading GTFS realtime...");

  const data = await fetchJSON(CONFIG.gtfsRtUrl);
  if (!data) return;

  state.vehicles = data.vehicles || [];
  state.departures = data.departures || [];

  log("✔ Vehicles: " + state.vehicles.length);
  log("✔ Departures: " + state.departures.length);
}

/**
 * DELAY ENGINE (CORE LOGIC)
 */
function calculateDelay(scheduled, actual) {
  if (!scheduled || !actual) return 0;

  const s = new Date(scheduled).getTime();
  const a = new Date(actual).getTime();

  return Math.round((a - s) / 60000); // minutes
}

/**
 * STATUS CLASSIFIER
 */
function getStatusColor(delayMin) {
  if (delayMin <= 1) return "🟢";
  if (delayMin <= 4) return "🟡";
  return "🔴";
}

/**
 * ENGINE LOOP
 */
async function tick() {
  log("🔄 Engine tick...");

  await loadRealtime();

  // Example processing
  state.departures.forEach(d => {
    const delay = calculateDelay(d.scheduled, d.actual);
    const status = getStatusColor(delay);

    log(`${status} ${d.route || "?"} delay=${delay}min`);
  });
}

/**
 * BOOT ENGINE
 */
async function start() {
  log("🚀 Starting FUTÁR V5 REAL ENGINE...");

  await loadStatic();
  await tick();

  setInterval(tick, CONFIG.refreshInterval);
}

start();
</script>

</body>
</html>
