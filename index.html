<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Atlasz V6 – Wildlife Risk Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }
#map { height:100vh; }

.legend{
  position:absolute;
  bottom:20px;
  left:20px;
  background:white;
  padding:10px;
  font-size:12px;
  z-index:999;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="legend">
🟢 low | 🟡 medium | 🟠 high | 🔴 caution
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([47.95,18.90],12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OSM'
}).addTo(map);

/////////////////////////////////////////////////////
// 🧠 SIMULÁLT WILDLIFE RISK GRID
/////////////////////////////////////////////////////

function risk(lat,lon){

  // Börzsöny logika (heurisztikus modell)
  const dx = Math.abs(lat - 47.95);
  const dy = Math.abs(lon - 18.90);
  const d = Math.sqrt(dx*dx + dy*dy);

  if(d < 0.02) return "low";        // lakott / turista zóna
  if(d < 0.05) return "medium";     // vegyes erdő
  if(d < 0.08) return "high";       // vadmozgás sáv
  return "caution";                // mély erdő
}

/////////////////////////////////////////////////////
// 🎨 COLOR MAP
/////////////////////////////////////////////////////

function color(r){
  if(r==="low") return "green";
  if(r==="medium") return "yellow";
  if(r==="high") return "orange";
  return "red";
}

/////////////////////////////////////////////////////
// 🗺️ GRID GENERATION
/////////////////////////////////////////////////////

for(let i=0;i<250;i++){

  const lat = 47.85 + Math.random()*0.25;
  const lon = 18.75 + Math.random()*0.35;

  const r = risk(lat,lon);

  L.circleMarker([lat,lon],{
    radius:4,
    color:color(r),
    fillOpacity:0.6
  }).addTo(map)
  .bindPopup(`🐾 Risk: ${r}`);

}

</script>

</body>
</html>
