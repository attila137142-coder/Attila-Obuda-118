<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V5 LIVE GTFS DISPATCHER MAP</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b1220;
  color:#e2e8f0;
}

#map {
  height: 55vh;
  width: 100%;
}

.container {
  padding:15px;
}

input {
  width:100%;
  padding:12px;
  font-size:16px;
  border:none;
  border-radius:8px;
}

button {
  margin-top:10px;
  padding:10px 15px;
  background:#22c55e;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.card {
  margin-top:10px;
  background:#1e293b;
  padding:10px;
  border-radius:10px;
}

.row {
  border-bottom:1px solid #334155;
  padding:5px 0;
}

.badge {
  display:inline-block;
  padding:3px 6px;
  border-radius:6px;
  font-size:12px;
}

.volan { background:#f59e0b; color:black; }
.mav { background:#a78bfa; color:black; }
.bkk { background:#38bdf8; color:black; }
</style>
</head>

<body>

<div id="map"></div>

<div class="container">

<input id="stop" placeholder="Stop ID (773012 / 005546862 / 049892)" />
<button onclick="loadStop()">MEHET</button>

<div id="panel"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ---------------- MAP ----------------
const map = L.map('map').setView([47.4979, 19.0402], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'OSM'
}).addTo(map);

let marker;

// ---------------- STOP DB ----------------
function getStop(id){
  const base = id.split("_")[0];

  const db = {
    "773012": {
      name:"VOLÁN állomás",
      lat:47.650120,
      lon:19.120300,
      lines:["1010","1012","1020"]
    },
    "005546862": {
      name:"MÁV állomás",
      lat:47.500120,
      lon:19.080900,
      lines:["IC 745","S80","Z70"]
    },
    "049892": {
      name:"Május 9. park",
      lat:47.541231,
      lon:19.047812,
      lines:["226","34","106"]
    }
  };

  return db[base] || {
    name:"Ismeretlen",
    lat:47.4979,
    lon:19.0402,
    lines:["N/A"]
  };
}

// ---------------- DISTANCE ----------------
function dist(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;

  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)**2;

  return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ---------------- FAKE LIVE GTFS ----------------
function live(lines){
  return lines.map(l=>{
    let m=Math.floor(Math.random()*20)+1;
    return {
      line:l,
      min:m,
      status:Math.random()>0.7?"DELAY":"ON TIME"
    };
  }).sort((a,b)=>a.min-b.min);
}

// ---------------- MAIN ----------------
function loadStop(){

  const id=document.getElementById("stop").value.trim();
  if(!id)return;

  const stop=getStop(id);
  const liveData=live(stop.lines);

  const d=dist(47.4979,19.0402,stop.lat,stop.lon);

  // MAP UPDATE
  if(marker) map.removeLayer(marker);

  marker=L.marker([stop.lat,stop.lon])
    .addTo(map)
    .bindPopup(stop.name)
    .openPopup();

  map.setView([stop.lat,stop.lon],13);

  // PANEL
  let html=`
    <div class="card">
      <b>${stop.name}</b><br>
      📍 ${stop.lat.toFixed(6)}, ${stop.lon.toFixed(6)}<br>
      🚶 ${d.toFixed(2)} km tőled
    </div>

    <div class="card">
      <b>🚍 FUTÁR MÁTRIX (LIVE)</b>
  `;

  liveData.forEach(l=>{
    html+=`
      <div class="row">
        ${l.line} → ${l.min}p [${l.status}]
      </div>
    `;
  });

  html+=`</div>`;

  document.getElementById("panel").innerHTML=html;
}

</script>

</body>
</html>
