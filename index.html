<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V5 HYBRID CORE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
 margin:0;
 font-family:Arial;
 background:#0b1220;
 color:#e2e8f0;
}

#map{height:45vh;}

.container{padding:12px;}

input{
 width:100%;
 padding:12px;
 border:none;
 border-radius:8px;
 font-size:16px;
}

button{
 margin-top:10px;
 padding:10px;
 background:#22c55e;
 border:none;
 border-radius:8px;
 font-weight:bold;
 cursor:pointer;
}

.card{
 background:#1e293b;
 padding:10px;
 margin-top:10px;
 border-radius:10px;
}

.row{
 padding:4px 0;
 border-bottom:1px solid #334155;
}

.badge{
 padding:4px 8px;
 border-radius:6px;
 font-size:12px;
}

.city{background:#38bdf8;color:black;}
.region{background:#f59e0b;color:black;}
.nature{background:#22c55e;color:black;}
.live{background:#a78bfa;color:black;}
</style>
</head>

<body>

<div id="map"></div>

<div class="container">

<h2>🚍 FUTÁR V5 HYBRID CORE</h2>

<input id="input" placeholder="keresés (BKK / VOLÁN / MÁV / stop / természet)">
<button onclick="run()">HYBRID DISPATCH</button>

<div id="out"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ---------------- MAP ----------------
const map=L.map('map').setView([47.4979,19.0402],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 attribution:'OSM'
}).addTo(map);

let marker;

// ---------------- USER GPS ----------------
let userLat=47.4979;
let userLon=19.0402;

navigator.geolocation?.getCurrentPosition(p=>{
 userLat=p.coords.latitude;
 userLon=p.coords.longitude;
});

// ---------------- STOP DATABASE ----------------
const STOPS=[
 {name:"Nád utca", type:"BKK", lat:47.594072, lon:19.048469},
 {name:"Flórián tér", type:"BKK", lat:47.542896, lon:19.042252},
 {name:"Batthyány tér", type:"BKK", lat:47.506002, lon:19.039456},

 {name:"Szentendre", type:"VOLÁN", lat:47.660403, lon:19.075408},
 {name:"Vác", type:"VOLÁN", lat:47.781930, lon:19.129643},

 {name:"Szob", type:"MÁV", lat:47.821319, lon:18.862602},

 {name:"Dobogókő", type:"NATURE", lat:47.719118, lon:18.897577}
];

// ---------------- DIST ----------------
function dist(a,b,c,d){
 const R=6371;
 const dLat=(c-a)*Math.PI/180;
 const dLon=(d-b)*Math.PI/180;

 const x=
 Math.sin(dLat/2)**2+
 Math.cos(a*Math.PI/180)*
 Math.cos(c*Math.PI/180)*
 Math.sin(dLon/2)**2;

 return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ---------------- SMART RADIUS ----------------
function radius(n){

 if(n<2) return 10;
 if(n<4) return 25;
 return 40;
}

// ---------------- LIVE SIMULATION ----------------
function live(stops){

 return stops.map((s,i)=>{

  let t = (Date.now()/8000 + i*0.2);

  return {
   ...s,
   lat: s.lat + Math.sin(t)*0.002,
   lon: s.lon + Math.cos(t)*0.002,
   speed: 25 + Math.random()*50,
   mode:"LIVE"
  };

 });

}

// ---------------- MATRIX ----------------
function matrix(data){

 return data.map(s=>{

  let d=dist(userLat,userLon,s.lat,s.lon).toFixed(2);

  return `
  <div class="row">
  🚍 ${s.name}
  | ${s.type}
  | ${d} km
  | ${s.speed.toFixed(0)} km/h
  </div>
  `;

 }).join("");

}

// ---------------- MAIN ----------------
function run(){

 let input=document.getElementById("input").value.toUpperCase();

 let data=live(STOPS);

 if(input){
  data=data.filter(s=>
   s.name.toUpperCase().includes(input) ||
   s.type.toUpperCase().includes(input)
  );
 }

 if(data.length===0) data=live(STOPS);

 let center=data[0];

 if(marker) map.removeLayer(marker);

 marker=L.marker([center.lat,center.lon])
 .addTo(map)
 .bindPopup(center.name)
 .openPopup();

 map.setView([center.lat,center.lon],11);

 let html=`

 <div class="card">
 <span class="badge live">HYBRID LIVE</span>
 <h3>🧠 FUTÁR MATRIX</h3>
 ${matrix(data)}
 </div>

 <div class="card">
 📍 CENTER: ${center.name}<br>
 TYPE: ${center.type}<br>
 MODE: HYBRID CORE (STATIC + LIVE SIM)
 </div>

 <div class="card">
 🚍 ENGINE STATUS:<br>
 SMART RADAR ACTIVE<br>
 LIVE SIMULATION ACTIVE<br>
 GTFS READY STRUCTURE
 </div>

 `;

 document.getElementById("out").innerHTML=html;
}

setInterval(run,5000);

</script>

</body>
</html>
