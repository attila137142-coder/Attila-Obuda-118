<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HUNGARY TRANSPORT DIGITAL TWIN</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body{margin:0;font-family:Arial;background:#0f172a;color:#e2e8f0}
    header{padding:12px;background:#111827;display:flex;justify-content:space-between;align-items:center}
    h1{font-size:14px;margin:0}
    .btn{background:#2563eb;border:none;padding:8px 10px;color:#fff;border-radius:8px;cursor:pointer;margin-left:5px}
    .grid{display:grid;gap:10px;padding:10px}
    .card{background:#1f2937;padding:10px;border-radius:12px}
    input{width:100%;padding:10px;border-radius:8px;border:none;margin-top:5px}
    #map{height:320px;border-radius:12px}
    .resultBox{margin-top:8px;padding:8px;background:#111827;border-radius:8px;cursor:pointer}

    .panel{font-size:12px;white-space:pre-line}
  </style>
</head>
<body>

<header>
  <h1>🌍 HUNGARY TRANSPORT DIGITAL TWIN</h1>
  <div>
    <button class="btn" onclick="mode='gtfs'">GTFS</button>
    <button class="btn" onclick="mode='poi'">POI / CÍM</button>
  </div>
</header>

<div class="grid">

  <div class="card">
    <h3>🔎 KERESŐ</h3>
    <input id="search" placeholder="megálló / cím / POI / földrajzi név" oninput="handleSearch()" />
    <div id="results"></div>
  </div>

  <div class="card">
    <h3>📍 EREDMÉNY PANEL</h3>
    <div id="panel" class="panel">Válassz keresést...</div>
  </div>

  <div class="card">
    <h3>🗺️ TÉRKÉP</h3>
    <div id="map"></div>
  </div>

</div>

<script>

let mode="gtfs";
let map;
let userPos=null;

let GTFS={stops:[]};

function loadGTFS(){
  GTFS.stops=[
    {id:"S1",name:"Deák",lat:47.4975,lon:19.0550},
    {id:"S2",name:"Örs",lat:47.5017,lon:19.1356},
    {id:"S3",name:"Szob",lat:47.8213,lon:18.8626},
    {id:"BKK-F00457",name:"Nád utca",lat:47.594072,lon:19.048469}
  ];
}

function haversine(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
    Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

navigator.geolocation.getCurrentPosition(p=>{
  userPos={lat:p.coords.latitude,lon:p.coords.longitude};
});

async function handleSearch(){
  const q=document.getElementById('search').value.toLowerCase();
  const res=document.getElementById('results');
  res.innerHTML="";

  if(mode==="gtfs"){
    GTFS.stops
      .filter(s=>(s.name||"").toLowerCase().includes(q)||(s.id||"").toLowerCase().includes(q))
      .forEach(s=>{
        const div=document.createElement("div");
        div.className="resultBox";

        let dist="";
        if(userPos){
          const d=haversine(userPos.lat,userPos.lon,s.lat,s.lon);
          dist=` | 📏 ${d.toFixed(2)} km`;
        }

        div.innerHTML=`🚏 ${s.name}${dist}`;
        div.onclick=()=>showStop(s);
        res.appendChild(div);
      });
  }

  if(mode==="poi"){
    const url=`https://nominatim.openstreetmap.org/search?format=json&q=${q}`;
    const data=await fetch(url).then(r=>r.json());

    data.forEach(p=>{
      const div=document.createElement("div");
      div.className="resultBox";

      let dist="";
      if(userPos){
        const d=haversine(userPos.lat,userPos.lon,parseFloat(p.lat),parseFloat(p.lon));
        dist=` | 📏 ${d.toFixed(2)} km`;
      }

      div.innerHTML=`📍 ${p.display_name}${dist}`;
      div.onclick=()=>showPOI(p);
      res.appendChild(div);
    });
  }
}

function showStop(s){
  document.getElementById('panel').innerText=
  `🚏 ${s.name}\nID: ${s.id}\nLAT: ${s.lat}\nLON: ${s.lon}`;
}

function showPOI(p){
  let dist="";
  if(userPos){
    const d=haversine(userPos.lat,userPos.lon,parseFloat(p.lat),parseFloat(p.lon));
    dist=`\n📏 ${d.toFixed(2)} km légvonal`;
  }

  document.getElementById('panel').innerText=
  `📍 ${p.display_name}\nLAT: ${p.lat}\nLON: ${p.lon}${dist}`;
}

window.onload=()=>{
  map=L.map('map').setView([47.5,19.05],10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  loadGTFS();

  GTFS.stops.forEach(s=>{
    L.marker([s.lat,s.lon]).addTo(map)
      .bindPopup(s.name);
  });
};

</script>

</body>
</html>
