<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>GTFS ENGINE V4.1 ROBUST ZIP PARSER</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body { margin:0; font-family:Arial; background:#0b1220; color:white; }
#map { height:70vh; }
.panel { padding:10px; background:#111a2e; }
pre { font-size:12px; white-space:pre-wrap; }
button { padding:8px; margin:5px; }
</style>
</head>

<body>

<div class="panel">
<h2>🚆 V4.1 ROBUST GTFS ZIP PARSER</h2>

<input type="file" id="zip" multiple accept=".zip">
<button onclick="load()">LOAD ZIP(S)</button>
<button onclick="build()">BUILD GLOBAL NETWORK</button>

<div id="status">READY</div>
<pre id="log"></pre>
</div>

<div id="map"></div>

<script>

const map = L.map('map').setView([47.5,19.05],9);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'OSM'
}).addTo(map);

// ---------------- STATE ----------------
let feeds = [];
let stops = [];

// ---------------- LOG ----------------
function log(t){
    document.getElementById("log").innerText += t + "\n";
}

function setStatus(t){
    document.getElementById("status").innerText = t;
}

// ---------------- NORMALIZE FILE NAME ----------------
function cleanFileName(path){

    return path
        .toLowerCase()
        .split("/")
        .pop()
        .trim();
}

// ---------------- GTFS FILE ROUTER ----------------
function routeFile(name){

    name = cleanFileName(name);

    if(name === "stops.txt") return "stops";
    if(name === "routes.txt") return "routes";
    if(name === "trips.txt") return "trips";
    if(name === "stop_times.txt") return "stop_times";

    return "unknown";
}

// ---------------- LOAD ZIP ----------------
async function load(){

    const files = document.getElementById("zip").files;

    feeds = [];

    for(let file of files){

        const zip = await JSZip.loadAsync(file);

        let feed = {
            name: file.name,
            stops: []
        };

        log("📦 ZIP LOADED: " + file.name);

        // scan ALL files safely
        for(let path in zip.files){

            let fileName = cleanFileName(path);

            log("  ↳ FILE FOUND: " + path);

            let content = await zip.files[path].async("string");

            let type = routeFile(path);

            if(type === "stops"){

                let parsed = Papa.parse(content,{
                    header:true,
                    skipEmptyLines:true
                });

                log("    ✔ STOPS PARSED: " + parsed.data.length);

                feed.stops = parsed.data;
            }
        }

        feeds.push(feed);
    }

    setStatus("LOADED ✔");
}

// ---------------- BUILD GLOBAL ENGINE ----------------
function build(){

    log("=== BUILD START ===");

    stops = [];

    for(let f of feeds){

        if(!f.stops || f.stops.length === 0){
            log("⚠ NO STOPS IN FEED: " + f.name);
            continue;
        }

        for(let s of f.stops){

            let stop = {
                name: s.stop_name,
                lat: parseFloat(s.stop_lat),
                lon: parseFloat(s.stop_lon),
                feed: f.name
            };

            if(isNaN(stop.lat) || isNaN(stop.lon)) continue;

            stops.push(stop);
        }
    }

    log("GLOBAL STOPS: " + stops.length);

    render();
    setStatus("ENGINE READY ✔");
}

// ---------------- MAP ----------------
function render(){

    map.eachLayer(l=>{
        if(l instanceof L.CircleMarker) map.removeLayer(l);
    });

    stops.forEach(s=>{

        L.circleMarker([s.lat,s.lon],{
            radius:4,
            color:"cyan"
        }).addTo(map)
        .bindPopup(s.name + "<br>" + s.feed);

    });
}

</script>

</body>
</html>
