<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EMBED ENGINE V2 PRO - FULL HUNGARY CORE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{margin:0;font-family:Arial;display:flex;height:100vh}
#left{width:380px;overflow:auto;padding:10px;border-right:1px solid #ccc}
#map{flex:1}
.box{background:#f4f4f4;padding:8px;margin:6px 0;border-radius:8px}
input,button{width:100%;padding:8px;margin:4px 0}
.stop{padding:6px;border-bottom:1px solid #eee;cursor:pointer}
.stop:hover{background:#eee}
small{color:#666}
</style>
</head>
<body>

<div id="left">
<h3>🚆 EMBED ENGINE V2 PRO</h3>

<input id="search" placeholder="Megálló / GTFS / kisvasút">

<button onclick="locate()">📍 Saját helyzet</button>
<button onclick="restore()">♻ Restore CORE</button>

<div class="box" id="me">📡 Helyzet: nincs</div>
<div class="box" id="dist">📏 Távolság: -</div>

<hr>
<div id="list"></div>
</div>

<div id="map"></div>

<script>

// ================= MAP =================
const map = L.map('map').setView([47.5,19.04],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let db;
let GLOBAL_STOPS = [];
let myPos = null;

// ================= SAMPLE UNIFIED DATA =================
const BASE_STOPS = [
  {name:"Szentendre Skanzen",lat:47.6911,lon:19.0469,id:"778840"},
  {name:"Tahitótfalu hídfő",lat:47.7517,lon:19.0782,id:"779053"},
  {name:"Királyrét",lat:47.9100,lon:18.9730,id:"778310"},
  {name:"Széchenyi-hegy Gyermekvasút",lat:47.5007,lon:18.9653,id:"GYV-1"},
  {name:"Hűvösvölgy Gyermekvasút",lat:47.5412,lon:18.9640,id:"GYV-2"},
  {name:"Nagybörzsöny",lat:47.9360,lon:18.8320,id:"NB-1"}
];

// ================= INIT =================
function init(){
  GLOBAL_STOPS = BASE_STOPS;
  render();
}

// ================= DISTANCE =================
function distance(a,b){
  const R=6371000;
  const toRad=x=>x*Math.PI/180;

  const dLat=toRad(b.lat-a.lat);
  const dLon=toRad(b.lon-a.lon);

  const A=
    Math.sin(dLat/2)**2+
    Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*
    Math.sin(dLon/2)**2;

  return 2*R*Math.atan2(Math.sqrt(A),Math.sqrt(1-A));
}

// ================= GEOLOCATION =================
function locate(){
  navigator.geolocation.getCurrentPosition(async p=>{

    myPos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};

    map.setView([myPos.lat,myPos.lon],13);

    L.marker([myPos.lat,myPos.lon]).addTo(map)
      .bindPopup("📍 Saját pozíció").openPopup();

    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${myPos.lat}&lon=${myPos.lon}`);
    const d=await r.json();

    document.getElementById("me").innerHTML=`
      🌍 Ország: ${d.address.country||"-"}<br>
      🏙 Város: ${d.address.city||d.address.town||"-"}<br>
      🏠 Utca: ${d.address.road||"-"}<br>
      🏠 Házszám: ${d.address.house_number||"-"}<br><br>
      📍 GPS: ${myPos.lat.toFixed(6)}, ${myPos.lon.toFixed(6)}<br>
      🎯 Pontosság: ±${Math.round(myPos.acc)} m
    `;

  });
}

// ================= RENDER =================
let markers=[];
function render(){

  markers.forEach(m=>map.removeLayer(m));
  markers=[];

  document.getElementById("list").innerHTML="";

  GLOBAL_STOPS.forEach(s=>{

    const m=L.marker([s.lat,s.lon]).addTo(map)
      .bindPopup(`<b>${s.name}</b><br>${s.id}`);

    markers.push(m);

    const d=document.createElement("div");
    d.className="stop";
    d.innerHTML=`${s.name}<br><small>${s.id}</small>`;

    d.onclick=()=>openStop(s);
    document.getElementById("list").appendChild(d);
  });
}

// ================= STOP PANEL =================
function openStop(s){

  let html=`<b>${s.name}</b><br>🆔 ${s.id}<br><br>`;

  if(myPos){
    const d=distance(myPos,s);
    html+=`📏 Légi távolság: ${Math.round(d)} m<br>${(d/1000).toFixed(2)} km`;

    document.getElementById("dist").innerHTML=`📏 ${Math.round(d)} m (${(d/1000).toFixed(2)} km)`;
  }

  L.popup().setLatLng([s.lat,s.lon]).setContent(html).openOn(map);
}

// ================= SEARCH =================
search.oninput=e=>{
  const q=e.target.value.toLowerCase();

  const f=GLOBAL_STOPS.filter(s=>
    s.name.toLowerCase().includes(q)||
    s.id.toLowerCase().includes(q)
  );

  document.getElementById("list").innerHTML="";

  f.forEach(s=>{
    const d=document.createElement("div");
    d.className="stop";
    d.innerHTML=`${s.name}<br><small>${s.id}</small>`;
    d.onclick=()=>openStop(s);
    document.getElementById("list").appendChild(d);
  });
});

// ================= START =================
init();

</script>

</body>
</html>
