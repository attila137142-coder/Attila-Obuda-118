<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V5 GTFS PRO MINI</title>

<style>
body{
margin:0;
font-family:Arial;
background:#05070d;
color:#00ffcc;
}

header{
padding:15px;
text-align:center;
background:#0b1220;
border-bottom:2px solid #00ffcc;
font-weight:bold;
}

.container{
display:grid;
grid-template-columns:1fr 2fr;
gap:10px;
padding:10px;
}

.panel{
background:#0b1220;
border:1px solid #00ffcc;
border-radius:6px;
padding:10px;
min-height:420px;
}

input{
width:100%;
padding:10px;
background:#05070d;
border:1px solid #00ffcc;
color:#00ffcc;
}

button{
width:100%;
padding:10px;
margin-top:5px;
background:#00ffcc;
border:none;
font-weight:bold;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td,th{
border-bottom:1px solid #00ffcc33;
padding:6px;
font-size:13px;
text-align:left;
}

.badge{
padding:2px 6px;
border:1px solid #00ffcc;
font-size:11px;
}

.ok{background:green;color:white;padding:2px 6px}
.siet{background:red;color:white;padding:2px 6px}
.keses{background:deepskyblue;color:white;padding:2px 6px}
</style>
</head>

<body>

<header>
🚍 FUTÁR V5 GTFS PRO MINI IMPORT ENGINE
</header>

<div class="container">

<!-- STOP SEARCH -->
<div class="panel">
<h3>🚏 Megálló kereső (GTFS)</h3>

<input id="stop" placeholder="pl. Deák tér">
<button onclick="searchStop()">KERESÉS</button>

<div id="result"></div>
</div>

<!-- TABLE -->
<div class="panel">
<h3>🛰 GTFS indulások (PRO MODEL)</h3>

<table>
<thead>
<tr>
<th>Járat</th>
<th>Megálló</th>
<th>Forda</th>
<th>Indul</th>
<th>Státusz</th>
</tr>
</thead>

<tbody id="table"></tbody>
</table>

</div>

</div>

<script>

/*
=====================================
GTFS PRO MINI DATA MODEL
=====================================
stops.txt + trips.txt + stop_times.txt kombináció
=====================================
*/

const GTFS = {
stops: [
  {id:"S1", name:"Deák tér"},
  {id:"S2", name:"Blaha Lujza tér"},
  {id:"S3", name:"Óbuda"},
  {id:"S4", name:"Kelenföld"},
  {id:"S5", name:"Déli pályaudvar"}
],

trips: [
  {tripId:"T100", route:"7E", vehicle:"F-102 / BPO-778"},
  {tripId:"T101", route:"9", vehicle:"F-205 / BPO-441"},
  {tripId:"T102", route:"47", vehicle:"F-311 / JLN-229"},
  {tripId:"T103", route:"M2", vehicle:"METRO-02"},
  {tripId:"T104", route:"M4", vehicle:"METRO-04"}
],

stop_times: [
  {tripId:"T100", stopId:"S2", min:2, sec:15, status:"SIET"},
  {tripId:"T101", stopId:"S3", min:4, sec:40, status:"OK"},
  {tripId:"T102", stopId:"S1", min:1, sec:10, status:"SIET"},
  {tripId:"T103", stopId:"S5", min:6, sec:55, status:"KESÉS"},
  {tripId:"T104", stopId:"S4", min:3, sec:20, status:"OK"}
]
};

/*
=====================================
RENDER ENGINE
=====================================
*/

function loadTable(filterStop=null){

let t=document.getElementById("table");
t.innerHTML="";

GTFS.stop_times.forEach(st=>{

let stop = GTFS.stops.find(s=>s.id===st.stopId);
let trip = GTFS.trips.find(t=>t.tripId===st.tripId);

if(filterStop && !stop.name.toLowerCase().includes(filterStop.toLowerCase())) return;

let statusClass =
st.status==="SIET"?"siet":
st.status==="KESÉS"?"keses":"ok";

t.innerHTML += `
<tr>
<td><span class="badge">${trip.route}</span></td>
<td>${stop.name}</td>
<td>${trip.vehicle}</td>
<td>${st.min}p ${st.sec}s</td>
<td><span class="${statusClass}">${st.status}</span></td>
</tr>
`;
});
}

/*
=====================================
SEARCH ENGINE
=====================================
*/

function searchStop(){
let v=document.getElementById("stop").value;

if(!v){
document.getElementById("result").innerHTML="❌ nincs megálló";
return;
}

let found = GTFS.stops.filter(s =>
s.name.toLowerCase().includes(v.toLowerCase())
);

if(found.length===0){
document.getElementById("result").innerHTML="❌ nincs találat";
return;
}

document.getElementById("result").innerHTML =
"🚏 Találatok: "+found.map(f=>f.name).join(", ");

loadTable(v);
}

loadTable();

</script>

</body>
</html>
