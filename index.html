<!DOCTYPE html>
<div class="section">
<div class="section-title">🛰️ Járműkövetés</div>
<div class="grid">
<button class="btn" onclick="openUrl('https://map.realtimenext.hu/')">RealtimeNext Map</button>
<button class="btn" onclick="openUrl('https://futar.bkk.hu/?map=14/47.59658/19.04446')">FUTÁR térkép</button>
<button class="btn" onclick="openUrl('https://go.bkk.hu/?map=14/47.59793/19.05094')">BudapestGO térkép</button>
<button class="btn" onclick="openUrl('https://utas.hu/?map=9/47.82045/18.91772')">VOLÁN térkép</button>
<button class="btn" onclick="openUrl('https://utas.hu/?map=10/47.91054/18.93198')">Börzsöny</button>
<button class="btn" onclick="openUrl('https://utas.hu/?map=10/47.70959/18.9351')">Pilis</button>
</div>
</div>

<div class="section">
<div class="section-title">🚆 MÁV / Vasút</div>
<div class="grid">
<button class="btn" onclick="openUrl('https://kozlekedesiklub.hu/vonatinfo/')">Vonatinfó</button>
<button class="btn" onclick="openUrl('https://mavplusz.hu/#/map')">MÁV+ térkép</button>
<button class="btn" onclick="openUrl('https://holavonat.is/')">HolAVonat</button>
<button class="btn" onclick="openUrl('https://megisholavonat.info/hu')">MegisHolAVonat</button>
<button class="btn" onclick="openUrl('https://vonatterkep.hu/')">Vonattérkép</button>
<button class="btn" onclick="openUrl('https://ittavonat.eu/')">IttAVonat</button>
<button class="btn" onclick="openUrl('https://traintrack.hu/')">TrainTrack</button>
<button class="btn" onclick="openUrl('https://iemig.mav-trakcio.hu/')">MÁV Trakció</button>
<button class="btn" onclick="openUrl('https://mav-stat.info/map-lite.html')">MÁV stat</button>
</div>
</div>

<div id="viewer">
<div id="topbar">
<button class="topbtn" onclick="closeViewer()">⬅ Vissza</button>
<button class="topbtn" onclick="openExternal()">🌍 Külső megnyitás</button>
</div>
<iframe id="frame"></iframe>
</div>

<script>
let currentUrl='';

function openUrl(url){
    currentUrl=url;
    document.getElementById('viewer').style.display='flex';
    document.getElementById('frame').src=url;
}

function closeViewer(){
    document.getElementById('viewer').style.display='none';
    document.getElementById('frame').src='';
}

function openExternal(){
    window.open(currentUrl,'_blank');
}
</script>

</body>
</html>
