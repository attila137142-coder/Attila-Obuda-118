<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V6 HYBRID - Börzsöny OFFLINE TÚRA</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#0a0f14;
    color:#d7e2ea;
}

#topbar{
    background:#101826;
    padding:10px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
}

button{
    background:#1f6feb;
    border:none;
    padding:8px 10px;
    border-radius:6px;
    color:white;
}

button:hover{background:#2d7fff;}

#layout{
    display:grid;
    grid-template-columns:320px 1fr;
    height: calc(100vh - 60px);
}

#panel{
    background:#0f1722;
    padding:10px;
    overflow:auto;
    border-right:1px solid #1f2a38;
}

.card{
    background:#111826;
    border:1px solid #1f2a38;
    padding:10px;
    border-radius:8px;
    margin-bottom:10px;
}

.small{font-size:12px; opacity:0.8;}

#map{height:100%; width:100%;}
</style>
</head>

<body>

<div id="topbar">
    <button onclick="startGPS()">📍 GPS indítás</button>
    <button onclick="addPOI()">📌 POI mentés</button>
    <button onclick="clearPOI()">🗑️ POI törlés</button>
    <button onclick="toggleTrack()">🧭 Tracking</button>
</div>

<div id="layout">

<div id="panel">

    <div class="card">
        <b>📡 GPS STATUS</b>
        <div id="gps" class="small">Nincs adat</div>
    </div>

    <div class="card">
        <b>🧭 TÚRA TRACK</b>
        <div id="track" class="small">OFF</div>
    </div>

    <div class="card">
        <b>📍 UTOLSÓ POZÍCIÓ</b>
        <div id="pos" class="small">-</div>
    </div>

    <div class="card">
        <b>🚍 FUTÁR CORE STATUS</b>
        <div class="small">
            V6 HYBRID ACTIVE<br>
            OFFLINE MODE READY<br>
            BÖRZSÖNY PACK LOADED
        </div>
    </div>

    <div class="card">
        <b>📌 MENTETT PONTOK</b>
        <div id="poiList" class="small">Nincs POI</div>
    </div>

</div>

<div id="map"></div>

</div>

<script>

let map = L.map('map').setView([47.87, 18.98], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
}).addTo(map);

let marker;
let watchId;
let tracking = false;
let path = [];
let polyline;

let pois = JSON.parse(localStorage.getItem("pois") || "[]");

// POI betöltés
function renderPOI(){
    document.getElementById("poiList").innerHTML =
        pois.length ? pois.map((p,i)=>
        `${i+1}. ${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}`).join("<br>")
        : "Nincs POI";

    pois.forEach(p=>{
        L.marker([p.lat,p.lon]).addTo(map).bindPopup("POI");
    });
}
renderPOI();

// GPS indítás
function startGPS(){

    if(!navigator.geolocation){
        alert("Nincs GPS támogatás");
        return;
    }

    watchId = navigator.geolocation.watchPosition(pos=>{
        let lat = pos.coords.latitude;
        let lon = pos.coords.longitude;
        let acc = pos.coords.accuracy;

        document.getElementById("gps").innerHTML =
            `Lat: ${lat}<br>Lon: ${lon}<br>Pontosság: ${acc} m`;

        document.getElementById("pos").innerHTML =
            `${lat.toFixed(5)}, ${lon.toFixed(5)}`;

        if(!marker){
            marker = L.marker([lat,lon]).addTo(map);
        } else {
            marker.setLatLng([lat,lon]);
        }

        if(tracking){
            path.push([lat,lon]);

            if(polyline) map.removeLayer(polyline);

            polyline = L.polyline(path,{color:'cyan'}).addTo(map);
        }

        map.setView([lat,lon]);

    }, err=>{
        alert("GPS hiba / engedély hiányzik");
    },{
        enableHighAccuracy:true
    });
}

// Tracking toggle
function toggleTrack(){
    tracking = !tracking;
    document.getElementById("track").innerHTML =
        tracking ? "ON 🟢" : "OFF 🔴";
}

// POI mentés
function addPOI(){
    if(!marker) return;

    let p = marker.getLatLng();
    pois.push({lat:p.lat, lon:p.lng});

    localStorage.setItem("pois", JSON.stringify(pois));
    renderPOI();
}

// POI törlés
function clearPOI(){
    localStorage.removeItem("pois");
    pois = [];
    renderPOI();
}

</script>

</body>
</html>
