<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Control Room V3 FULL</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f0f;
  color: white;
}

header {
  padding: 12px;
  background: #111;
  border-bottom: 1px solid #333;
  font-weight: bold;
}

#container {
  display: flex;
  height: calc(100vh - 50px);
}

/* LEFT */
#left {
  flex: 3;
  padding: 10px;
}

input, button {
  padding: 8px;
  margin-bottom: 10px;
  width: 100%;
}

button {
  cursor: pointer;
}

/* BOARD */
.row {
  display: flex;
  justify-content: space-between;
  padding: 8px;
  margin-bottom: 6px;
  background: #1a1a1a;
  border-left: 5px solid #444;
  font-size: 13px;
}

/* 🔴 SIETÉS */
.row.fast {
  border-left-color: red;
}

/* 🟡 IDŐBEN */
.row.ok {
  border-left-color: yellow;
}

/* 🔵 KÉSÉS */
.row.delay {
  border-left-color: deepskyblue;
}

/* RIGHT DEBUG */
#right {
  flex: 1;
  border-left: 1px solid #333;
  padding: 10px;
  font-size: 12px;
  background: #0b0b0b;
  overflow: auto;
}

small { opacity: 0.7; }
</style>
</head>

<body>

<header>
🚏 CONTROL ROOM V3 FULL — GTFS CORE ENGINE
</header>

<div id="container">

<!-- LEFT -->
<div id="left">

<input id="stopInput" placeholder="Megálló (pl. Nád utca)">
<button onclick="loadStop()">Indítás</button>

<div id="board"></div>

</div>

<!-- RIGHT DEBUG -->
<div id="right">
<b>DEBUG PANEL</b>
<pre id="log"></pre>
</div>

</div>

<script>

// =====================
// LOG
// =====================
function log(msg) {
  document.getElementById("log").innerText += msg + "\n";
}

// =====================
// ERROR SAFE MODE
// =====================
window.onerror = function(msg, src, line) {
  log("❌ ERROR: " + msg + " @ " + line);
  return true;
};

// =====================
// MOCK GTFS CORE
// =====================
const STOPS = [
  { id: "S1", name: "Nád utca" }
];

const STOP_TIMES = [
  { stop_id: "S1", trip_id: "T1", time: "12:10:00" },
  { stop_id: "S1", trip_id: "T2", time: "12:14:30" },
  { stop_id: "S1", trip_id: "T3", time: "12:18:00" }
];

const TRIPS = [
  { id: "T1", route: "34", direction: "Aquincum", vehicle: "BUS-1001" },
  { id: "T2", route: "134", direction: "Újpest", vehicle: "BUS-1002" }
];

// =====================
// STOP FIND
// =====================
function findStop(name) {
  return STOPS.find(s =>
    s.name.toLowerCase().includes(name.toLowerCase())
  );
}

// =====================
// TIME DIFF ENGINE
// =====================
function calcStatus(timeStr) {

  const now = new Date();
  const [h, m, s] = timeStr.split(":").map(Number);

  const target = new Date();
  target.setHours(h, m, s, 0);

  const diffMin = Math.round((target - now) / 60000);

  // 🔴 SIETÉS (korai)
  if (diffMin < -1) {
    return { text: "SIET " + Math.abs(diffMin) + "p", cls: "fast" };
  }

  // 🟡 IDŐBEN
  if (diffMin <= 2) {
    return { text: "IDŐBEN", cls: "ok" };
  }

  // 🔵 KÉSÉS
  return { text: "KÉSÉS +" + diffMin + "p", cls: "delay" };
}

// =====================
// BUILD DEPARTURES
// =====================
function buildDepartures(stopId) {

  log("⚙️ building for " + stopId);

  return STOP_TIMES
    .filter(st => st.stop_id === stopId)
    .map(st => {

      const trip = TRIPS.find(t => t.id === st.trip_id) || {
        route: "??",
        direction: "ISMERETLEN",
        vehicle: "N/A"
      };

      const status = calcStatus(st.time);

      return {
        route: trip.route,
        direction: trip.direction,
        time: st.time,
        vehicle: trip.vehicle,
        statusText: status.text,
        cls: status.cls
      };
    })
    .slice(0, 15);
}

// =====================
// RENDER
// =====================
function renderBoard(data) {

  const board = document.getElementById("board");
  board.innerHTML = "";

  data.forEach(d => {

    const row = document.createElement("div");
    row.className = "row " + d.cls;

    row.innerHTML = `
      <div><b>${d.route}</b></div>
      <div>${d.direction}</div>
      <div>${d.time}</div>
      <div>${d.statusText}</div>
      <div><small>${d.vehicle}</small></div>
    `;

    board.appendChild(row);
  });
}

// =====================
// MAIN
// =====================
function loadStop() {

  const val = document.getElementById("stopInput").value;

  log("🔎 " + val);

  const stop = findStop(val);

  if (!stop) {
    log("❌ stop not found");
    return;
  }

  const data = buildDepartures(stop.id);

  renderBoard(data);
}

// INIT
log("🟢 V3 FULL READY");

</script>

</body>
</html>
