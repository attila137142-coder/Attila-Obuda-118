body{margin:0;font-family:Arial;background:#0b0f14;color:#e6f1ff;}

<body>

<header>
<div>🚇 FUTÁR V5 GTFS PRO SIM CORE</div>

<div class="container">

<div class="sidebar">
<input type="file" id="gtfsFile" />
<button onclick="loadGTFS()">GTFS LOAD</button>
<div id="ops"></div>
</div>

<div>
<div id="map"></div>
<div class="board" id="board"></div>
</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
setInterval(()=>document.getElementById('clock').innerText=new Date().toLocaleTimeString(),1000);

const map=L.map('map').setView([47.4979,19.0402],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let STATE={vehicles:[],routes:{},stops:{}};
let markers={};
let polylines={};

function parseStops(data){
  let stops={};
  data.forEach(s=>{
    if(s.stop_lat){
      stops[s.stop_id]={
        id:s.stop_id,
        name:s.stop_name,
        lat:parseFloat(s.stop_lat),
        lng:parseFloat(s.stop_lon)
      };
    }
  });
  return stops;
}

function buildRoutes(stopTimes,stops){
  let routes={};
  stopTimes.sort((a,b)=>+a.stop_sequence-+b.stop_sequence);
  stopTimes.forEach(st=>{
    if(!routes[st.trip_id]) routes[st.trip_id]=[];
    const s=stops[st.stop_id];
    if(s) routes[st.trip_id].push(s);
  });
