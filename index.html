<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>GTFS CONTROL ROOM V16 REAL NETWORK</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; display:flex; height:100vh; font-family:Arial; }

#panel {
  width:380px;
  background:#041f19;
  color:white;
  display:flex;
  flex-direction:column;
}

#title {
  padding:10px;
  font-weight:bold;
  border-bottom:1px solid rgba(255,255,255,0.2);
}

#list {
  flex:1;
  overflow:auto;
  padding:8px;
}

.row {
  display:flex;
  justify-content:space-between;
  padding:6px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  font-size:13px;
}

.green { color:#7CFF7C; }
.red { color:#ff4d4d; font-weight:bold; }
.blue { color:#4da6ff; font-weight:bold; }

.badge {
  font-size:10px;
  background:#222;
  padding:2px 5px;
  border-radius:4px;
}

#map { flex:1; }
</style>
</head>

<body>

<div id="panel">
  <div id="title">🚏 V16 REAL NETWORK GTFS CORE</div>
  <div id="list"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   🗺️ MAP
========================= */

const map = L.map('map').setView([47.49, 19.05], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'OSM'
}).addTo(map);

/* =========================
   🧭 ZONE MODEL (FIX FOR CSEPEL / BÉKÁS)
========================= */

const zones = {
  north: ["Békásmegyer","Újpest","Szentendre"],
  south: ["Csepel","Pesterzsébet","Soroksár"],
  center: ["Deák tér","Kálvin tér","Blaha","Keleti"],
  west: ["Budaörs","Széll Kálmán","Déli"]
};

/* =========================
   🚏 REAL ROUTE STRUCTURE (ORDERED GTFS STYLE)
========================= */

const routes = {
  "H5": zones.north,
  "7": zones.center,
  "4-6": zones.center,
  "12A": zones.west,
  "179": zones.south,
  "38": zones.south,
  "100E": zones.center,
  "40": zones.west
};

/* =========================
   🚍 VEHICLES (ZONE-LOCKED)
========================= */

let vehicles = Object.keys(routes).map(r=>{

  return {
    route:r,
    zone:Object.keys(zones).find(z=>zones[z].includes(routes[r][0])),
    index:0,
    delay:(Math.random()*80-40),
    lat:47.45 + Math.random()*0.2,
    lon:19.0 + Math.random()*0.2,
    dlat:0.0002,
    dlon:0.0002
  };
});

let markers = {};

/* =========================
   🧠 SAFE FORMAT
========================= */

function format(d){
  const m = Math.floor(Math.abs(d)/60);
  const s = Math.abs(d)%60;

  if(d > 20) return `<span class="blue">+${m}:${s}</span>`;
  if(d < -20) return `<span class="red">-${m}:${s}</span>`;
  return `<span class="green">ON TIME</span>`;
}

/* =========================
   🚏 REAL STOP PANEL (ORDERED FLOW)
========================= */

function buildPanel(){

  let html = "";

  vehicles.forEach(v=>{

    const stopList = routes[v.route];
    const nextStop = stopList[v.index % stopList.length];

    html += `
      <div class="row">
        <div>${v.route}<span class="badge">${v.zone}</span></div>
        <div>${nextStop}</div>
        <div>${format(v.delay)}</div>
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

/* =========================
   🚍 ORDERED MOVEMENT (NO CHAOS)
========================= */

function move(){

  vehicles.forEach(v=>{

    const stops = routes[v.route];

    v.index += 0.02;

    const target = stops[Math.floor(v.index)%stops.length];

    // zone-based drift (no random city jump!)
    if(v.zone === "south"){
      v.lat += 0.0001;
      v.lon -= 0.00005;
    }
    if(v.zone === "north"){
      v.lat += 0.00005;
      v.lon += 0.0001;
    }
    if(v.zone === "center"){
      v.lat += 0.00003;
      v.lon += 0.00003;
    }
    if(v.zone === "west"){
      v.lat += 0.00002;
      v.lon -= 0.00002;
    }

    if(!markers[v.route]){
      markers[v.route] = L.circleMarker([v.lat,v.lon],{
        radius:7,
        color:"green"
      }).addTo(map).bindPopup(v.route);
    } else {
      markers[v.route].setLatLng([v.lat,v.lon]);
    }

    v.delay += (Math.random()*4 - 2);
  });
}

/* =========================
   LOOP
========================= */

function tick(){
  move();
  buildPanel();
}

setInterval(tick, 1000);

tick();

</script>

</body>
</html>
