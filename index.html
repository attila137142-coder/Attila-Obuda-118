<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>V6 Balanced Ops</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; display:flex; height:100vh; font-family:Arial; }

#panel {
  width:380px;
  background:#031c18;
  color:white;
  display:flex;
  flex-direction:column;
}

#header {
  padding:10px;
  font-weight:bold;
  border-bottom:1px solid rgba(255,255,255,0.2);
}

#list {
  flex:1;
  overflow:auto;
  padding:8px;
}

.row {
  display:flex;
  justify-content:space-between;
  padding:6px;
  font-size:13px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.badge {
  font-size:10px;
  background:#222;
  padding:2px 5px;
  border-radius:4px;
}

.green { color:#7CFF7C; }
.red { color:#ff4d4d; }
.blue { color:#4da6ff; }

#map { flex:1; }
</style>
</head>

<body>

<div id="panel">
  <div id="header">🚍 V6 BALANCED LIVE OPS</div>
  <div id="list"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* 🗺️ MAP */
const map = L.map('map').setView([47.52, 19.05], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'OSM'
}).addTo(map);

/* 🚏 EXPANDED DEMO NETWORK (BÉKÁS + NÁD + CORRIDOR) */

const stops = [
  {id:"BKS", name:"Békásmegyer HÉV", lat:47.541, lon:19.045},
  {id:"OBU", name:"Óbuda", lat:47.53, lon:19.035},
  {id:"KAS", name:"Kaszásdűlő", lat:47.535, lon:19.06},
  {id:"NUT", name:"Nád utca", lat:47.41, lon:19.08},
  {id:"SOR", name:"Soroksár", lat:47.37, lon:19.12}
];

/* 🚍 MULTI-INSTANCE ROUTES (NO EMPTY MAP) */

const routes = [
  {id:"243", path:["NUT","SOR"], count:4},
  {id:"H5", path:["BKS","OBU","KAS"], count:3}
];

/* 🚍 VEHICLE INSTANCES (IMPORTANT FIX) */

let vehicles = [];

routes.forEach(r=>{
  for(let i=0;i<r.count;i++){
    vehicles.push({
      route:r.id,
      path:r.path,
      index:Math.random()*r.path.length,
      delay:(Math.random()*40-20)
    });
  }
});

let markers = {};

/* 🧠 FORMAT */

function format(d){
  if(d > 10) return `<span class="blue">+${Math.round(d)}p</span>`;
  if(d < -10) return `<span class="red">${Math.round(d)}p</span>`;
  return `<span class="green">OK</span>`;
}

/* 📋 PANEL */

function panel(){

  let html = "";

  vehicles.forEach(v=>{

    const stop = v.path[Math.floor(v.index)%v.path.length];

    html += `
      <div class="row">
        <div>${v.route}<span class="badge">DEMO</span></div>
        <div>${stop}</div>
        <div>${format(v.delay)}</div>
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

/* 🗺️ MAP UPDATE */

function update(){

  vehicles.forEach(v=>{

    const stopId = v.path[Math.floor(v.index)%v.path.length];
    const stop = stops.find(s=>s.id===stopId);

    if(!stop) return;

    v.index += 0.03;

    if(!markers[v.route+v.index]){
      markers[v.route+v.index] = L.circleMarker([stop.lat,stop.lon],{
        radius:6,
        color:"#ff5555"
      }).addTo(map);
    }

    v.delay += (Math.random()*2 - 1);
  });
}

/* LOOP */

function tick(){
  update();
  panel();
}

setInterval(tick,1000);
tick();

</script>

</body>
</html>
