<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multi Stop GTFS Kereső</title>

<style>

body{
    font-family:Arial, sans-serif;
    background:#eef3f7;
    margin:0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 12px #aaa;
}

h2{
    color:#003366;
}

input{
    width:100%;
    padding:12px;
    font-size:16px;
    box-sizing:border-box;
    border:2px solid #888;
    border-radius:8px;
}

button{
    margin-top:12px;
    padding:12px 20px;
    font-size:16px;
    background:#0066cc;
    color:white;
    border:0;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#004c99;
}


.stop-card{

    background:#f7f7f7;
    margin-top:12px;
    padding:15px;
    border-left:6px solid #0066cc;
    border-radius:8px;

}


.bus{
    color:#008000;
}

.hev{
    color:#aa5500;
}


</style>

</head>


<body>


<div class="container">


<h2>
🚏 Multi-Stop GTFS kereső
</h2>


<p>
Írd be a GTFS megálló azonosítókat:
</p>


<input 
id="multiStopInput"
placeholder="Példa: 008939,044192,09183208">


<button onclick="multiStopSearch()">
🔎 Keresés
</button>



<div id="result"></div>


</div>



<script>


function multiStopSearch(){


let input =
document.getElementById(
"multiStopInput"
).value;



// többféle elválasztó kezelése

let stops =
input
.split(/[,; ]+/)
.map(x=>x.trim())
.filter(x=>x!=="");



let html="";


html += 
`
<h3>
Talált megállók: ${stops.length} db
</h3>
`;



stops.forEach(function(stop){


let tipus="🚏 GTFS megálló";


if(stop==="09183208"){
    tipus="🚆 HÉV megálló";
}

else if(
stop==="008939" ||
stop==="044192"
){
    tipus="🚌 autóbusz megálló";
}



html +=

`

<div class="stop-card">

<b>
${tipus}
</b>

<br><br>

GTFS STOP ID:

<strong>
${stop}
</strong>


<br><br>

⏳ Menetrendi adatok betöltésre várnak...

</div>

`;



});



document.getElementById(
"result"
).innerHTML=html;



}



</script>


</body>
</html>
