<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Budai GeoJSON Trail Engine</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; font-family: Arial; }
#map { height:100vh; width:100%; }

.panel{
  position:absolute;
  top:10px;
  left:10px;
  z-index:9999;
  background:white;
  padding:10px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.3);
  max-width:280px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="panel">
<b>🌲 Budai GeoJSON Engine</b><br><br>

✔ OSM turistaút háló<br>
✔ GeoJSON betöltés<br>
✔ kattintható szakaszok<br>
✔ iPhone kompatibilis<br><br>

📦 Tedd mellé: <br>
<b>budai.geojson</b>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// =====================
// MAP
// =====================

const map = L.map('map').setView([47.52, 18.97], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

// =====================
// GEOJSON BETÖLTÉS
// =====================

// 👉 ide jön az Overpass export fájl
fetch("budai.geojson")
.then(res => res.json())
.then(data => {

  const layer = L.geoJSON(data, {

    style: function(feature){
      return {
        color: "green",
        weight: 4,
        opacity: 0.9
      };
    },

    onEachFeature: function(feature, layer){

      let props = feature.properties || {};

      let name = props.name || "Turistaút";
      let ref = props.ref || "";
      let route = props.route || "";

      layer.bindPopup(
        "<b>🌲 " + name + "</b><br>" +
        "🔖 " + ref + "<br>" +
        "🚶 " + route
      );
    }

  }).addTo(map);

  map.fitBounds(layer.getBounds());

});

</script>

</body>
</html>
