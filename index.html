<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<title>Budapest Dispatcher V2</title>

<!-- Leaflet MAP -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; display:flex; height:100vh; font-family:Arial; }

#panel {
  width:360px;
  background:#0b3d2e;
  color:white;
  overflow:auto;
  padding:10px;
}

.row {
  display:flex;
  justify-content:space-between;
  padding:6px;
  border-bottom:1px solid rgba(255,255,255,0.1);
  font-size:13px;
}

.green { color:#7CFF7C; }
.red { color:#ff4d4d; font-weight:bold; }
.blue { color:#4da6ff; font-weight:bold; }

#map {
  flex:1;
}
</style>
</head>

<body>

<div id="panel">
  <h3>🚏 Indulások (15 sor)</h3>
  <div id="list"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   🗺️ REAL MAP (BUDAPEST)
========================= */

const map = L.map('map').setView([47.4979, 19.0402], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: 'OpenStreetMap'
}).addTo(map);

/* =========================
   🚏 STOPS (REAL BUDAPEST MOCK)
========================= */

const stops = [
  {name:"Deák tér", lat:47.4979, lon:19.0540},
  {name:"Kálvin tér", lat:47.4895, lon:19.0616},
  {name:"Fővám tér", lat:47.4869, lon:19.0570},
  {name:"Széll Kálmán tér", lat:47.5070, lon:19.0243}
];

stops.forEach(s=>{
  L.circleMarker([s.lat,s.lon],{
    radius:6,
    color:"green"
  }).addTo(map).bindPopup(s.name);
});

/* =========================
   🚍 VEHICLES (MULTI LINE)
========================= */

let vehicles = [
  {id:"12A", lat:47.49, lon:19.05, dlat:0.0005, dlon:0.0008, delay:120},
  {id:"4-6", lat:47.51, lon:19.03, dlat:-0.0006, dlon:0.0004, delay:-90},
  {id:"7", lat:47.48, lon:19.06, dlat:0.0004, dlon:-0.0007, delay:0},
  {id:"M2", lat:47.50, lon:19.04, dlat:-0.0003, dlon:0.0006, delay:45}
];

let markers = {};

function renderVehicles(){
  vehicles.forEach(v=>{

    v.lat += v.dlat;
    v.lon += v.dlon;

    if(!markers[v.id]){
      markers[v.id] = L.circleMarker([v.lat,v.lon],{
        radius:8,
        color:"red"
      }).addTo(map).bindPopup(v.id);
    } else {
      markers[v.id].setLatLng([v.lat,v.lon]);
    }

    if(v.delay > 30) markers[v.id].setStyle({color:"blue"});
    else if(v.delay < -30) markers[v.id].setStyle({color:"red"});
    else markers[v.id].setStyle({color:"green"});

    v.delay += (Math.random()*10 - 5);
  });
}

/* =========================
   🚏 REAL DEPARTURE PANEL (FIXED)
========================= */

function format(d){
  const abs = Math.abs(d||0);
  const m = Math.floor(abs/60);
  const s = abs%60;

  if(d > 10) return `<span class="blue">+${m}:${s.toString().padStart(2,'0')}</span>`;
  if(d < -10) return `<span class="red">-${m}:${s.toString().padStart(2,'0')}</span>`;
  return `<span class="green">ON TIME</span>`;
}

function updatePanel(){

  let html = "";

  // STOP BASED GENERATION
  for(let i=0;i<15;i++){

    let v = vehicles[i % vehicles.length];

    html += `
      <div class="row">
        <div>${v.id} → Központ</div>
        <div>${format(v.delay)}</div>
      </div>
    `;
  }

  document.getElementById("list").innerHTML = html;
}

/* =========================
   LOOP ENGINE
========================= */

function tick(){
  renderVehicles();
  updatePanel();
}

setInterval(tick, 1000);

tick();

</script>

</body>
</html>
