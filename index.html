<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attila V3.3 SMART PARSER DISPATCH</title>
<style>
body { font-family: Arial; background:#0f172a; color:#fff; padding:20px }
input, button, textarea { padding:10px; margin:5px; border-radius:8px; border:none; width:100% }
button { background:#22c55e; color:#fff; font-weight:bold; cursor:pointer }
table { width:100%; border-collapse:collapse; margin-top:15px }
th,td { border:1px solid #334155; padding:6px; text-align:center }
.ok { color:#4ade80 }
.err { color:#f87171 }
</style>
</head>
<body>

<h1>🚌 V3.3 SMART PARSER DISPATCH</h1>

<p>Beillesztheted bárhogy: vessző / TAB / pontosvessző / Excel</p>

<textarea id="input" style="height:160px">
Cinkota H	0
Csókakő utca	328
Ostoros út 61.	941
Alsómalom utca	1262
Felsőmalom utca	1563
Állás utca	2151
Timur utca	2659
Péterke utca	2986
Csömöri út	3338
Kisszentmihály, Baross utca	3726
Gusztáv utca	4151
Besztercebányai utca	4442
Szentmihályi út	5393
Újpalota, Szentmihályi út	6510
</textarea>

<button onclick="calc()">SZÁMOLÁS</button>

<div id="log"></div>
<div id="out"></div>

<script>
function smartParseLine(line, idx){
  if(!line.trim()) return null;

  // Split by comma, tab or semicolon
  let parts = line.split(/[,;\t]+/).map(p=>p.trim()).filter(p=>p!=="");

  if(parts.length < 2) return { error:true, raw:line };

  // LAST element must be distance
  let distStr = parts[parts.length-1].replace(',', '.');
  let dist = parseFloat(distStr);

  if(isNaN(dist)) return { error:true, raw:line };

  // Everything else is name (join back)
  let name = parts.slice(0, parts.length-1).join(' ');

  return {
    id: 'MH' + (1000 + idx),
    name,
    dist
  };
}

function calc(){
  let lines = document.getElementById('input').value.split('\n');

  let stops=[];
  let logHTML="";

  lines.forEach((line,i)=>{
    let res = smartParseLine(line,i);

    if(!res) return;

    if(res.error){
      logHTML += `<div class='err'>❌ Hibás sor: ${line}</div>`;
    } else {
      stops.push(res);
      logHTML += `<div class='ok'>✔ ${res.name} (${res.dist})</div>`;
    }
  });

  document.getElementById('log').innerHTML = logHTML;

  if(stops.length < 2){
    document.getElementById('out').innerHTML = '❌ Kevés érvényes adat';
    return;
  }

  // Sort by distance
  stops.sort((a,b)=>a.dist-b.dist);

  let total = stops[stops.length-1].dist;
  let avgDist = total / (stops.length - 1);

  let html = '<table>';
  html += '<tr><th>MH kód</th><th>Megálló neve</th><th>Össz táv (m)</th><th>Köv</th><th>Hátravan</th><th>% megtett</th><th>% hátravan</th><th>MH átlag</th></tr>';

  stops.forEach((s,i)=>{
    let next = stops[i+1] ? stops[i+1].name : '-';
    let remain = total - s.dist;
    let donePerc = total>0 ? (s.dist/total)*100 : 0;
    let remainPerc = 100 - donePerc;

    html += `<tr>
      <td>${s.id}</td>
      <td>${s.name}</td>
      <td>${s.dist.toFixed(0)}</td>
      <td>${next}</td>
      <td>${remain.toFixed(0)}</td>
      <td>${donePerc.toFixed(1)}%</td>
      <td>${remainPerc.toFixed(1)}%</td>
      <td>${avgDist.toFixed(0)}</td>
    </tr>`;
  });

  html += '</table>';

  document.getElementById('out').innerHTML = html;
}
</script>

</body>
</html>
