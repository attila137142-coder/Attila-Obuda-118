<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATTILA PHONE CLEANER</title>

<style>
body { font-family: Arial; background:#0f172a; color:white; margin:0; padding:15px }
h1 { margin-bottom:10px }
button { padding:10px; border:none; border-radius:8px; margin:5px; background:#22c55e; color:white; font-weight:bold }
.card { background:#1e293b; padding:10px; border-radius:10px; margin-top:10px }
img { max-width:80px; border-radius:6px }
.row { display:flex; align-items:center; justify-content:space-between; margin-top:5px }
.small { font-size:12px; opacity:0.7 }
</style>

</head>
<body>

<h1>📱 ATTILA PHONE CLEANER</h1>

<input type="file" id="files" multiple accept="image/*">
<br>
<button onclick="analyze()">📊 Elemzés</button>
<button onclick="findDuplicates()">🧠 Duplikát keresés</button>

<div id="stats"></div>
<div id="results"></div>

<script>

let FILES=[];

// 📥 fájlok betöltése

document.getElementById("files").addEventListener("change", e=>{
  FILES=[...e.target.files];
});

// 📊 statisztika
function analyze(){

  if(FILES.length==0) return alert("Nincs fájl!");

  let totalSize=FILES.reduce((a,f)=>a+f.size,0);

  document.getElementById("stats").innerHTML=`
    <div class="card">
      📊 Fájlok száma: ${FILES.length}<br>
      💾 Össz méret: ${(totalSize/1024/1024).toFixed(2)} MB
    </div>
  `;
}

// 🧠 duplikát keresés (egyszerű név+méret alapján)
function findDuplicates(){

  let map={};

  FILES.forEach(f=>{
    let key=f.name+"_"+f.size;
    if(!map[key]) map[key]=[];
    map[key].push(f);
  });

  let dupGroups=Object.values(map).filter(g=>g.length>1);

  let html="";

  dupGroups.forEach(group=>{

    html+=`<div class="card"><b>Duplikát csoport (${group.length})</b>`;

    group.forEach(f=>{
      let url=URL.createObjectURL(f);

      html+=`
        <div class="row">
          <img src="${url}">
          <div class="small">${f.name}<br>${(f.size/1024).toFixed(1)} KB</div>
        </div>
      `;
    });

    html+="</div>";
  });

  document.getElementById("results").innerHTML=
    html || "❌ Nincs duplikát";
}

</script>

</body>
</html>
