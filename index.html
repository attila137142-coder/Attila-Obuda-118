<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>BKK GTFS MULTI-MODULE ENGINE V4</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#e2e8f0}
header{display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:#111827;align-items:center}
button{padding:10px 12px;border:0;border-radius:8px;background:#22c55e;color:#000;font-weight:bold;cursor:pointer}
button.secondary{background:#38bdf8}
.container{display:grid;grid-template-columns:320px 1fr 1fr;height:calc(100vh - 60px)}
.sidebar{padding:10px;background:#111827;overflow:auto}
.main{padding:10px;overflow:auto}
.map{height:100%}
input{width:100%;padding:8px;margin:6px 0;border-radius:6px;border:1px solid #334155;background:#0b1220;color:white}
.table{width:100%;border-collapse:collapse;margin-top:10px}
.table th,.table td{border:1px solid #334155;padding:6px;text-align:center;font-size:13px}
.table th{background:#1f2937}
.title{font-weight:bold;margin:6px 0}
.badge{background:#1d4ed8;padding:2px 6px;border-radius:6px;font-size:11px}
.panel{background:#0b1220;padding:8px;border-radius:8px;margin-top:8px}
.ok{color:#4ade80}
</style>
</head>
<body>

<header>
<button onclick="loadDemo()">📥 DEMO</button>
<button class="secondary" onclick="exportZip()">📦 EXPORT</button>
<span style="font-size:12px;opacity:.8">V4 MULTI-MODULE GTFS ENGINE</span>
</header>

<div class="container">

<div class="sidebar">

<div class="title">🧠 3 MODUL ARCHITEKTÚRA</div>
<div class="panel">
🟢 BKK CORE (II–III kerület)<br>
🟡 DUNAKANYAR + VOLÁN + MÁV<br>
🔵 KISVASUTAK (Börzsöny)
</div>

<div class="title">🔎 Megálló kereső</div>
<input id="search" oninput="renderStops()" placeholder="pl. Óbuda">
<div id="stopList"></div>

</div>

<div class="main">
<div class="title">🚏 Megállós menetrend (MULTI-MODULE)</div>
<div id="timetable">Válassz megállót</div>
</div>

<div class="map" id="map"></div>

</div>

<script>

let gtfs={stops:[],trips:[],stop_times:[],module:{} };
let map;

window.onload=()=>{
  map=L.map('map').setView([47.5,19.05],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  loadDemo();
};

// MODULE STRUCTURE
function loadDemo(){

  gtfs.module={
    bkk_core:"II-III kerület",
    dunakanyar:"Volán + MÁV",
    kisvasut:"Börzsöny"
  };

  gtfs.stops=[
    {id:"1",name:"Óbuda",lat:47.541},
    {id:"2",name:"Békásmegyer",lat:47.595},
    {id:"3",name:"Szob vasút",lat:47.82}
  ];

  gtfs.trips=[
    {id:"T1",head:"Békásmegyer"},
    {id:"T2",head:"Óbuda"},
    {id:"K1",head:"Kisvasút Királyrét"}
  ];

  gtfs.stop_times=[
    {trip:"T1",stop:"1",time:"08:00"},
    {trip:"T1",stop:"2",time:"08:15"},
    {trip:"T2",stop:"2",time:"09:00"},
    {trip:"K1",stop:"3",time:"10:00"}
  ];

  renderAll();
}

function renderAll(){
  renderStops();
  renderMap();
}

function renderStops(){
  const q=document.getElementById("search").value.toLowerCase();
  const list=document.getElementById("stopList");
  list.innerHTML="";

  gtfs.stops.filter(s=>s.name.toLowerCase().includes(q))
  .forEach(s=>{
    const div=document.createElement("div");
    div.innerHTML=`<span class='badge'>STOP</span> ${s.name}`;
    div.style.cursor="pointer";
    div.style.padding="6px";
    div.onclick=()=>showTimetable(s);
    list.appendChild(div);
  });
}

function showTimetable(stop){

  const rows=gtfs.stop_times
  .filter(x=>x.stop===stop.id)
  .map(x=>{
    const t=gtfs.trips.find(tr=>tr.id===x.trip);
    return `<tr><td>${x.time}</td><td>${t?t.head:"?"}</td><td>${x.trip}</td></tr>`;
  });

  document.getElementById("timetable").innerHTML=`
    <div class='title'>📍 ${stop.name}</div>
    <table class='table'>
    <tr><th>Idő</th><th>Hová</th><th>Járat</th></tr>
    ${rows.join("")}
    </table>
  `;
}

function renderMap(){
  gtfs.stops.forEach(s=>{
    if(s.lat) L.marker([s.lat,19.05]).addTo(map).bindPopup(s.name);
  });
}

function exportZip(){
  const zip=new JSZip();

  zip.file("stops.txt","id,name\n"+gtfs.stops.map(s=>`${s.id},${s.name}`).join("\n"));
  zip.file("trips.txt","id,head\n"+gtfs.trips.map(t=>`${t.id},${t.head}`).join("\n"));
  zip.file("stop_times.txt","trip,stop,time\n"+gtfs.stop_times.map(s=>`${s.trip},${s.stop},${s.time}`).join("\n"));

  zip.generateAsync({type:"blob"}).then(b=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b);
    a.download="gtfs_multi_module.zip";
    a.click();
  });
}

</script>

</body>
</html>
