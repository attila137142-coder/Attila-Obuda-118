<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Budai PRO Trail GeoJSON</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Arial, sans-serif;
}

#map{
    width:100%;
    height:100%;
    background:#dfe7d8;
}

.infoLabel{
    background:white;
    border:1px solid #444;
    border-radius:6px;
    padding:2px 6px;
    font-size:12px;
    font-weight:bold;
    color:#111;
    box-shadow:0 0 4px rgba(0,0,0,0.3);
}

.nodeLabel{
    background:#1976d2;
    color:white;
    border-radius:5px;
    padding:2px 5px;
    font-size:11px;
    font-weight:bold;
}

.topbox{
    position:absolute;
    top:10px;
    left:10px;
    z-index:1000;
    background:white;
    padding:10px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.35);
    max-width:320px;
    font-size:13px;
    line-height:1.4;
}

.topbox b{
    font-size:15px;
}
</style>
</head>

<body>

<div class="topbox">
<b>🌲 Budai PRO Trail GeoJSON</b><br>
Gyermekvasút + Hárs-hegy környék<br><br>

✔ Valódi töréspontos turistaút<br>
✔ Elágazások (NODE)<br>
✔ Távolság + meredekség<br>
✔ Kattintható szakaszok<br>
✔ iPhone XR kompatibilis
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// =========================
// MAP
// =========================

const map = L.map('map').setView([47.521,18.969], 14);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom:19,
    attribution:'© OpenStreetMap'
}).addTo(map);

// =========================
// NODE-OK
// =========================

const nodes = [
{
    name:"Szépjuhászné",
    coord:[47.5192,18.9690]
},
{
    name:"Hárs-hegy elágazás",
    coord:[47.5221,18.9667]
},
{
    name:"Kaán Károly kilátó",
    coord:[47.5243,18.9635]
},
{
    name:"Hárs-hegy csúcs",
    coord:[47.5250,18.9610]
},
{
    name:"Hűvösvölgy irány",
    coord:[47.5288,18.9575]
}
];

// =========================
// NODE RENDER
// =========================

nodes.forEach(n=>{

    L.circleMarker(n.coord,{
        radius:7,
        color:"#0d47a1",
        fillColor:"#2196f3",
        fillOpacity:1,
        weight:2
    })
    .addTo(map)
    .bindPopup(
        "<b>📍 "+n.name+"</b>"
    );

    L.marker(n.coord,{
        icon:L.divIcon({
            className:"nodeLabel",
            html:n.name
        })
    }).addTo(map);

});

// =========================
// VALÓDI TÖRÉSPONTOS
// TURISTAÚT SZAKASZOK
// =========================

const trails = [

{
name:"Szépjuhászné → Hárs-hegy elágazás",

distance:"820 m (0.82 km)",
slope:"5.0 %",
elev:"+41 m",

coords:[
[47.5192,18.9690],
[47.5198,18.9687],
[47.5205,18.9681],
[47.5210,18.9676],
[47.5215,18.9672],
[47.5221,18.9667]
]
},

{
name:"Hárs-hegy elágazás → Kaán Károly kilátó",

distance:"540 m (0.54 km)",
slope:"8.7 %",
elev:"+47 m",

coords:[
[47.5221,18.9667],
[47.5224,18.9661],
[47.5229,18.9653],
[47.5234,18.9646],
[47.5239,18.9640],
[47.5243,18.9635]
]
},

{
name:"Kaán Károly kilátó → Hárs-hegy csúcs",

distance:"620 m (0.62 km)",
slope:"8.4 %",
elev:"+52 m",

coords:[
[47.5243,18.9635],
[47.5245,18.9630],
[47.5247,18.9624],
[47.5249,18.9618],
[47.5250,18.9610]
]
},

{
name:"Hárs-hegy csúcs → Hűvösvölgy",

distance:"1200 m (1.20 km)",
slope:"7.9 %",
elev:"-95 m",

coords:[
[47.5250,18.9610],
[47.5258,18.9605],
[47.5266,18.9598],
[47.5273,18.9591],
[47.5280,18.9582],
[47.5288,18.9575]
]
}

];

// =========================
// TRAIL RENDER
// =========================

trails.forEach(t=>{

    const line = L.polyline(
        t.coords,
        {
            color:"#1b5e20",
            weight:6,
            opacity:0.9
        }
    ).addTo(map);

    // popup

    line.bindPopup(`
        <b>🌲 ${t.name}</b><br><br>

        📏 Távolság: ${t.distance}<br>
        ⛰️ Szint: ${t.elev}<br>
        📈 Meredekség: ${t.slope}
    `);

    // LABEL A VONAL KÖZEPÉRE

    const mid =
    t.coords[
        Math.floor(t.coords.length/2)
    ];

    L.marker(mid,{
        icon:L.divIcon({
            className:"infoLabel",
            html:
            `${t.distance}<br>${t.slope}`
        })
    }).addTo(map);

});

// =========================
// FIT
// =========================

map.fitBounds([
[47.5185,18.9565],
[47.5260,18.9705]
]);

</script>
</body>
</html>
