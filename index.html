<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🟦 REAL GTFS CONTROL ROOM V13</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

header{
    background:#111827;
    padding:12px;
    text-align:center;
    color:#38bdf8;
    font-size:20px;
    font-weight:bold;
}

.container{
    display:flex;
    height:calc(100vh - 52px);
}

/* LEFT */

.left{
    width:36%;
    background:#0f172a;
    border-right:1px solid #1f2937;
    display:flex;
    flex-direction:column;
}

.panel{
    padding:10px;
    border-bottom:1px solid #1f2937;
}

input,button{
    width:100%;
    padding:10px;
    margin-top:6px;
    border:none;
    border-radius:8px;
    box-sizing:border-box;
}

input{
    background:#1f2937;
    color:white;
}

button{
    background:#38bdf8;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0ea5e9;
}

#results{
    flex:1;
    overflow:auto;
    padding:10px;
}

/* CARD */

.card{
    background:#111827;
    border:1px solid #1f2937;
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
    line-height:1.5;
}

.card h3{
    margin-top:0;
    color:#38bdf8;
}

.small{
    font-size:12px;
    color:#94a3b8;
}

/* RIGHT */

.right{
    width:64%;
}

#map{
    width:100%;
    height:100%;
}

.badge{
    display:inline-block;
    padding:3px 7px;
    border-radius:6px;
    background:#1e293b;
    font-size:11px;
}

</style>
</head>

<body>

<header>
🟦 REAL GTFS CONTROL ROOM V13
</header>

<div class="container">

<!-- LEFT -->

<div class="left">

<div class="panel">

<input
id="search"
placeholder="Megálló / GTFS ID">

<button onclick="searchStops()">
🔎 KERESÉS
</button>

<button onclick="startGPS()">
📍 GPS START
</button>

<button onclick="findNearest()">
🧭 LEGKÖZELEBBI MEGÁLLÓ
</button>

<button onclick="showAllStops()">
🚏 ÖSSZES MEGÁLLÓ
</button>

</div>

<div id="results"></div>

</div>

<!-- RIGHT -->

<div class="right">
<div id="map"></div>
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ================= MAP =================

let map =
L.map('map').setView([47.4979,19.0402],11);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom:19
}).addTo(map);

// ================= USER =================

let USER = {
    lat:null,
    lon:null,
    marker:null
};

// ================= STOPS =================

let STOPS = [

{name:"Nád utca",gtfs:"BKK-F00457",lat:47.594072,lon:19.048469},

{name:"Békásmegyer HÉV-állomás",gtfs:"H5-09183",lat:47.598091,lon:19.054599},

{name:"Gulácsy Lajos utca",gtfs:"BKK-00438",lat:47.602562,lon:19.048229},

{name:"Szentendre, Skanzen (1)",gtfs:"VOLÁN-778840-1",lat:47.691135,lon:19.046955},

{name:"Szentendre, Skanzen (2)",gtfs:"VOLÁN-778840-2",lat:47.691273,lon:19.045667},

{name:"Tahitótfalu, hídfő 1",gtfs:"VOLÁN-779053-1",lat:47.751712,lon:19.078215},

{name:"Tahitótfalu, hídfő 2",gtfs:"VOLÁN-779053-2",lat:47.751648,lon:19.078091},

{name:"Kóspallag, templom",gtfs:"VOLÁN-778190",lat:47.877850,lon:18.932580},

{name:"Királyrét",gtfs:"VOLAN-779017",lat:47.895040,lon:18.977687},

{name:"Pomáz, HÉV állomás",gtfs:"HEV5-09134",lat:47.642749,lon:19.032657},

{name:"Dobogókő, hegytető",gtfs:"VOLAN-778561",lat:47.719118,lon:18.897577},

{name:"Vác, Autóbusz-állomás",gtfs:"VOLÁN-779365_99",lat:47.781930,lon:19.129643},

{name:"Lakás (Dino lak)",gtfs:"HOME",lat:47.594304,lon:19.048770}

];

// ================= DIST =================

function dist(lat1,lon1,lat2,lon2){

    const R = 6371;

    let dLat = (lat2-lat1)*Math.PI/180;
    let dLon = (lon2-lon1)*Math.PI/180;

    let a =
        Math.sin(dLat/2)**2 +
        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.sin(dLon/2)**2;

    return R * 2 *
    Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ================= GPRS =================

function gprs(){

    return {
        min:Math.floor(5 + Math.random()*20),
        max:Math.floor(50 + Math.random()*250)
    };
}

// ================= MARKERS =================

let markers = [];

function drawMarkers(){

    markers.forEach(m=>map.removeLayer(m));

    markers = [];

    STOPS.forEach(s=>{

        let m =
        L.marker([s.lat,s.lon])
        .addTo(map)
        .bindPopup(`

<b>${s.name}</b><br>

🆔 ${s.gtfs}<br>

📍 ${s.lat}, ${s.lon}

`);

        markers.push(m);

    });

}

drawMarkers();

// ================= REVERSE GEO =================

async function reverseGeocode(lat, lon){

    try{

        let url =
`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&lat=${lat}&lon=${lon}`;

        let res =
        await fetch(url,{
            headers:{
                "Accept":"application/json"
            }
        });

        let data = await res.json();

        return {

            city:
                data.address.city ||
                data.address.town ||
                data.address.village ||
                "N/A",

            road:
                data.address.road ||
                data.address.pedestrian ||
                "N/A",

            house:
                data.address.house_number ||
                "N/A"

        };

    }catch(e){

        return {
            city:"N/A",
            road:"N/A",
            house:"N/A"
        };
    }
}

// ================= GPS =================

function startGPS(){

    if(!navigator.geolocation){

        alert("GPS nem támogatott");

        return;
    }

    navigator.geolocation.watchPosition(

    async pos=>{

        USER.lat = pos.coords.latitude;
        USER.lon = pos.coords.longitude;

        let addr =
        await reverseGeocode(USER.lat,USER.lon);

        if(USER.marker){

            map.removeLayer(USER.marker);
        }

        USER.marker =
        L.marker([USER.lat,USER.lon])
        .addTo(map)
        .bindPopup("📍 SAJÁT HELYZET");

        map.setView([USER.lat,USER.lon],13);

        document.getElementById("results").innerHTML = `

<div class="card">

<h3>📍 HELYADAT</h3>

🏙️ Város:
<b>${addr.city}</b><br>

🛣️ Utca:
<b>${addr.road}</b><br>

🏠 Házszám:
<b>${addr.house}</b><br><br>

📍 LAT:
${USER.lat}<br>

📍 LON:
${USER.lon}

</div>

`;

    },

    err=>{

        alert("GPS hiba");

    },

    {
        enableHighAccuracy:true,
        maximumAge:1000
    });

}

// ================= SEARCH =================

function searchStops(){

    let q =
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();

    let res =
    STOPS.filter(s=>

        s.name.toLowerCase().includes(q) ||

        s.gtfs.toLowerCase().includes(q)

    );

    renderStops(res);
}

// ================= RENDER =================

function renderStops(arr){

    let html = "";

    arr.forEach(s=>{

        let distance = "N/A";

        if(USER.lat){

            distance =
            dist(
                USER.lat,
                USER.lon,
                s.lat,
                s.lon
            ).toFixed(2) + " km";
        }

        let signal = gprs();

        html += `

<div class="card">

<h3>🚏 ${s.name}</h3>

<span class="badge">
🆔 ${s.gtfs}
</span>

<br><br>

📍 LAT:
${s.lat}<br>

📍 LON:
${s.lon}<br><br>

📏 Légvonal:
<b>${distance}</b><br><br>

📡 GPRS MIN:
<b>${signal.min} m</b><br>

📡 GPRS MAX:
<b>${signal.max} m</b>

</div>

`;

    });

    document.getElementById("results").innerHTML = html;
}

// ================= NEAREST =================

function findNearest(){

    if(!USER.lat){

        alert("Előbb indítsd el a GPS-t");

        return;
    }

    let best = null;
    let bestD = 999999;

    STOPS.forEach(s=>{

        let d =
        dist(
            USER.lat,
            USER.lon,
            s.lat,
            s.lon
        );

        if(d < bestD){

            best = s;
            bestD = d;
        }

    });

    renderStops([best]);
}

// ================= SHOW ALL =================

function showAllStops(){

    renderStops(STOPS);
}

showAllStops();

</script>

</body>
</html>
