<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>FUTÁR V7 – BKK DIGITAL TWIN</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#05070a;
  color:#00ff99;
  overflow:hidden;
}

#topbar {
  position:fixed;
  top:0; left:0; right:0;
  height:60px;
  background:#111;
  display:flex;
  align-items:center;
  gap:15px;
  padding:10px;
  border-bottom:2px solid #0f0;
}

#map {
  position:absolute;
  top:60px;
  left:0;
  right:0;
  bottom:0;
  background:#04080c;
}

.bus {
  width:10px;
  height:10px;
  background:lime;
  border-radius:50%;
  position:absolute;
  box-shadow:0 0 10px lime;
}

.stop {
  width:6px;
  height:6px;
  background:red;
  border-radius:50%;
  position:absolute;
}

#panel {
  position:fixed;
  bottom:10px;
  left:10px;
  background:#111;
  padding:10px;
  width:280px;
  border:1px solid #0f0;
}
</style>
</head>

<body>

<div id="topbar">
  <input type="file" id="gtfs"/>
  <div id="status">GTFS: NOT LOADED</div>
  <button onclick="spawnBus()">ADD VEHICLE</button>
</div>

<div id="map"></div>

<div id="panel">
  <div id="gps">GPS: --</div>
  <div id="ai">AI: --</div>
  <div id="load">Network load: --</div>
</div>

<script>

// ============================
// DIGITAL TWIN STATE
// ============================
let GTFS = {
  stops: []
};

let vehicles = [];

let user = {lat:0, lon:0};

// ============================
// SIMPLE GEO PROJECTION
// ============================
function project(lat, lon){
  return {
    x: (lon + 180) * 2.5,
    y: (90 - lat) * 2.5
  };
}

// ============================
// GTFS LOADER (stops.txt only demo)
// ============================
document.getElementById("gtfs").addEventListener("change", async e=>{
  const text = await e.target.files[0].text();

  GTFS.stops = [];

  const lines = text.split("\n");

  for(let l of lines){
    const c = l.split(",");

    if(c.length > 3 && !isNaN(c[2]) && !isNaN(c[3])){
      GTFS.stops.push({
        id:c[0],
        name:c[1],
        lat:parseFloat(c[2]),
        lon:parseFloat(c[3])
      });
    }
  }

  document.getElementById("status").innerText =
    "GTFS: LOADED ("+GTFS.stops.length+" stops)";

  draw();
});

// ============================
// VEHICLE SPAWN
// ============================
function spawnBus(){
  if(GTFS.stops.length < 2) return;

  vehicles.push({
    i:0,
    t:0,
    speed:1 + Math.random()*1.5,
    delayHistory:[]
  });
}

// ============================
// DISTANCE AI ENGINE
// ============================
function distance(a,b){
  const R = 6371000;
  const dLat = (b.lat-a.lat)*Math.PI/180;
  const dLon = (b.lon-a.lon)*Math.PI/180;

  const x =
    Math.sin(dLat/2)**2 +
    Math.cos(a.lat*Math.PI/180) *
    Math.cos(b.lat*Math.PI/180) *
    Math.sin(dLon/2)**2;

  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ============================
// CONTROL AI (NETWORK LOAD)
// ============================
function computeNetworkLoad(){
  let load = 0;

  for(let v of vehicles){
    load += v.speed * (v.i+1);
  }

  return load / 10;
}

// ============================
// UPDATE ENGINE
// ============================
function update(){

  for(let v of vehicles){

    const a = GTFS.stops[v.i];
    const b = GTFS.stops[v.i+1];
    if(!b) continue;

    v.t += 0.008 * v.speed;

    if(v.t >= 1){
      v.t = 0;
      v.i++;
    }

    // delay model
    const idealSpeed = 1.2;
    const delay = (idealSpeed - v.speed) * 120;

    v.delayHistory.push(delay);
    if(v.delayHistory.length > 25) v.delayHistory.shift();

    const avgDelay =
      v.delayHistory.reduce((a,b)=>a+b,0)/v.delayHistory.length;

    v.ai = avgDelay + (v.speed < 0.8 ? 90 : 0);
  }

  updateAI();
}

// ============================
// AI CONTROL PANEL
// ============================
function updateAI(){

  const load = computeNetworkLoad();

  let aiState = "OK";

  if(load > 50) aiState = "HIGH LOAD";
  if(load > 120) aiState = "CRITICAL CONGESTION";

  document.getElementById("ai").innerText =
    "AI: " + aiState + " (" + Math.round(load) + ")";

  document.getElementById("load").innerText =
    "Network load: " + load.toFixed(2);
}

// ============================
// DRAW ENGINE
// ============================
function draw(){
  const map = document.getElementById("map");
  map.innerHTML = "";

  // stops
  for(let s of GTFS.stops){
    const p = project(s.lat, s.lon);

    const el = document.createElement("div");
    el.className = "stop";
    el.style.left = p.x + "px";
    el.style.top = p.y + "px";

    map.appendChild(el);
  }

  // vehicles
  for(let v of vehicles){

    const a = GTFS.stops[v.i];
    const b = GTFS.stops[v.i+1];
    if(!a||!b) continue;

    const pa = project(a.lat,a.lon);
    const pb = project(b.lat,b.lon);

    const x = pa.x + (pb.x-pa.x)*v.t;
    const y = pa.y + (pb.y-pa.y)*v.t;

    const el = document.createElement("div");
    el.className = "bus";
    el.style.left = x + "px";
    el.style.top = y + "px";

    map.appendChild(el);
  }
}

// ============================
// GPS TRACKING
// ============================
navigator.geolocation.watchPosition(p=>{
  user.lat = p.coords.latitude;
  user.lon = p.coords.longitude;

  document.getElementById("gps").innerText =
    "GPS: "+user.lat.toFixed(5)+", "+user.lon.toFixed(5);
});

// ============================
// MAIN LOOP
// ============================
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
