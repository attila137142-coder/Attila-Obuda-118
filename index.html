<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATTILA ULTRA SMART SEARCH GTFS</title>

<style>
body { font-family: Arial; background:#0b1220; color:white; padding:15px }
h1 { margin-bottom:10px }
button { padding:10px; border:none; border-radius:8px; margin:5px; background:#22c55e; color:white; font-weight:bold }
input { padding:10px; border-radius:8px; width:80% }
.card { background:#1e293b; padding:10px; border-radius:10px; margin-top:10px }
.row { display:flex; justify-content:space-between; margin-top:5px }
.small { font-size:12px; opacity:0.7 }
</style>

</head>
<body>

<h1>🧠 ULTRA SMART SEARCH (Google-szint) + GTFS ENGINE</h1>

<button onclick="getLocation()">📍 Saját helyzet</button>
<button onclick="loadStops()">📦 GTFS betöltés</button>

<br>
<input id="q" placeholder="Keresés (pl: nad utca, hidfo, szechenyi)" />
<button onclick="search()">🔍 KERESÉS</button>

<div id="me"></div>
<div id="out"></div>

<script>

let MY={lat:null,lon:null,acc:null};
let STOPS=[];

// 🌍 GPS
function getLocation(){
  navigator.geolocation.getCurrentPosition(pos=>{
    MY.lat=pos.coords.latitude;
    MY.lon=pos.coords.longitude;
    MY.acc=pos.coords.accuracy;

    document.getElementById("me").innerHTML=
    `<div class='card'>📍 Saját: ${MY.lat.toFixed(6)}, ${MY.lon.toFixed(6)}<br>🎯 ±${Math.round(MY.acc)} m</div>`;
  });
}

// 📦 GTFS (stops.json ajánlott)
async function loadStops(){

  let res=await fetch("stops.json");
  STOPS=await res.json();

  alert("Betöltve: "+STOPS.length+" megálló");
}

// 🧠 NORMALIZÁLÁS (Google-szint alap)
function norm(t){
  return (t||"")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9 ]/g,"");
}

// 📏 HAVERSINE
function dist(a,b,c,d){
  const R=6371000;
  const toRad=x=>x*Math.PI/180;
  let dLat=toRad(c-a);
  let dLon=toRad(d-b);
  let A=Math.sin(dLat/2)**2+
    Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(A),Math.sqrt(1-A));
}

// 🔍 SMART SEARCH
function search(){

  if(!STOPS.length) return alert("Nincs GTFS betöltve!");

  let q=norm(document.getElementById("q").value);

  let res=STOPS.map(s=>{

    let name=norm(s.name||s.stop_name);
    let score=0;

    if(name.includes(q)) score+=2;
    if(name.startsWith(q)) score+=3;

    let d=MY.lat ? dist(MY.lat,MY.lon,s.lat||s.stop_lat,s.lon||s.stop_lon) : null;

    return {
      id:s.id||s.stop_id,
      name:s.name||s.stop_name,
      lat:parseFloat(s.lat||s.stop_lat),
      lon:parseFloat(s.lon||s.stop_lon),
      score,
      dist:d
    };
  })
  .filter(x=>x.score>0)
  .sort((a,b)=>b.score - a.score)
  .slice(0,20);

  document.getElementById("out").innerHTML=
    res.map(s=>`
      <div class='card'>
        <b>${s.name}</b><br>
        🆔 ${s.id}<br>
        📍 ${s.lat.toFixed(6)}, ${s.lon.toFixed(6)}<br>
        📏 Légi: ${s.dist?Math.round(s.dist)+" m":"n/a"}<br>
        🛣️ Út: n/a (nincs routing engine)<br>
      </div>
    `).join("") || "<div class='card'>Nincs találat</div>";
}

</script>

</body>
</html>
