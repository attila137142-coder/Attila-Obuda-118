<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>PRECÍZ UTCA MATCH V2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
  body { margin:0; font-family:Arial; background:#111; color:#fff; }
  #map { height: 50vh; }
  #panel { padding:10px; }
  input, button { padding:10px; margin:5px; font-size:14px; }
  #results div {
    padding:6px;
    border-bottom:1px solid #333;
    cursor:pointer;
  }
  #results div:hover { background:#333; }
</style>
</head>
<body>

<div id="map"></div>

<div id="panel">
  <input id="street" placeholder="Pl: Hármashatárhegyi út">
  <button onclick="searchStreet()">KERESÉS</button>

  <div id="results"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map = L.map('map').setView([47.4979, 19.0402], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

let currentLine = null;

async function searchStreet() {
  let name = document.getElementById("street").value;
  let resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "Keresés...";

  let url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=10&q=${encodeURIComponent(name + ", Budapest")}`;

  let res = await fetch(url);
  let data = await res.json();

  if (data.length === 0) {
    resultsDiv.innerHTML = "Nincs találat 😢";
    return;
  }

  resultsDiv.innerHTML = "";

  data.forEach((place, i) => {
    let div = document.createElement("div");

    div.innerHTML = `
      <b>${place.display_name.split(",")[0]}</b><br>
      <small>${place.display_name}</small>
    `;

    div.onclick = () => loadExactStreet(place);

    resultsDiv.appendChild(div);
  });
}

async function loadExactStreet(place) {

  map.setView([place.lat, place.lon], 16);

  // Overpass – pontos név + fallback
  let name = place.display_name.split(",")[0];

  let queryExact = `
  [out:json];
  way["name"="${name}"]["highway"](around:1000,${place.lat},${place.lon});
  out geom;
  `;

  let res = await fetch("https://overpass-api.de/api/interpreter", {
    method: "POST",
    body: queryExact
  });

  let data = await res.json();

  // fallback ha nincs exact
  if (data.elements.length === 0) {
    let queryFallback = `
    [out:json];
    way["highway"](around:500,${place.lat},${place.lon});
    out geom;
    `;

    let res2 = await fetch("https://overpass-api.de/api/interpreter", {
      method: "POST",
      body: queryFallback
    });

    data = await res2.json();
  }

  if (data.elements.length === 0) {
    alert("Nem találtam utat 😢");
    return;
  }

  let best = data.elements[0];

  let coords = best.geometry.map(p => [p.lat, p.lon]);

  if (currentLine) map.removeLayer(currentLine);

  currentLine = L.polyline(coords, {
    color: "cyan",
    weight: 5
  }).addTo(map);

  window.coords = coords;

  alert("Utca betöltve ✔");
}
</script>

</body>
</html>
