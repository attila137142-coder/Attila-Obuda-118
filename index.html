<!DOCTYPE html><html lang="hu"><head><meta charset="UTF-8"><title>CONTROL ROOM V4-B</title><style>body{    margin:0;    background:#081018;    color:#00ff9d;    font-family:Arial;}header{    background:#101b2a;    padding:12px;    font-size:20px;    font-weight:bold;}.top{    padding:10px;    background:#0d1622;    border-bottom:1px solid #00ff9d33;}input{    width:100%;    padding:12px;    background:#111c2b;    border:none;    color:#00ff9d;    font-size:16px;}.results{    max-height:180px;    overflow:auto;    background:#0d1622;}.stop{    padding:8px;    cursor:pointer;    border-bottom:1px solid #00ff9d11;}.stop:hover{    background:#132337;}.panel{    padding:10px;}.row{    display:grid;    grid-template-columns:80px 1fr 80px 100px;    padding:8px;    border-bottom:1px solid #00ff9d11;    font-size:14px;}.line{    font-weight:bold;    color:#ffd166;}.time{    color:#ffffff;}.live{    color:#00ff9d;}.delay{    color:#ff5a5a;}</style></head><body><header>🚦 CONTROL ROOM V4-B // REALTIME STOP PANEL</header><div class="top"><inputid="search"placeholder="🚏 megálló keresése..."oninput="searchStops()"/><div class="results" id="results"></div></div><div class="panel" id="panel"></div><script>// 🚏 DEMO STOP DATABASE// később GTFS-ből tölthetőconst stops = ["Nyugati pályaudvar","Keleti pályaudvar","Déli pályaudvar","Kelenföld vasútállomás","Újpest-központ","Batthyány tér","Deák Ferenc tér","Blaha Lujza tér","Örs vezér tere","Széll Kálmán tér","Lehel tér","Astoria","Ferenciek tere","Boráros tér","Móricz Zsigmond körtér","Göncz Árpád városközpont","Mexikói út","Kőbánya-Kispest","Határ út","Népliget"];// 🔍 KERESŐfunction searchStops(){    const q =        document        .getElementById("search")        .value        .toLowerCase();    const results =        document.getElementById("results");    results.innerHTML = "";    if(q.length < 1) return;    const filtered =        stops.filter(s =>            s.toLowerCase().includes(q)        );    filtered.slice(0,15).forEach(stop=>{        const div =            document.createElement("div");        div.className = "stop";        div.innerHTML = "🚏 " + stop;        div.onclick = ()=>loadPanel(stop);        results.appendChild(div);    });}// 🚍 PANEL GENERATORfunction loadPanel(stop){    document    .getElementById("results")    .innerHTML = "";    const panel =        document.getElementById("panel");    panel.innerHTML =        `<h2>🚏 ${stop}</h2>`;    const lines = [        "4","6","7","9","14","105",        "M2","M3","M4","5","8E",        "133E","47","49","1"    ];    for(let i=0;i<15;i++){        const mins =            Math.floor(Math.random()*12)+1;        const delay =            Math.random()>0.8;        panel.innerHTML += `        <div class="row">            <div class="line">                ${lines[i]}            </div>            <div>                Irány ${i+1}            </div>            <div class="time">                ${mins} perc            </div>            <div class="${                delay ? 'delay' : 'live'            }">                ${                    delay                    ? 'KÉSÉS'                    : 'LIVE'                }            </div>        </div>        `;    }}</script></body></html>
