<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V5 MAP ENGINE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
margin:0;
font-family:Arial;
background:#05070d;
color:#00ffcc;
}

header{
padding:12px;
text-align:center;
background:#0b1220;
border-bottom:2px solid #00ffcc;
font-weight:bold;
}

.container{
display:grid;
grid-template-columns:1fr 2fr;
height:calc(100vh - 50px);
}

.left{
padding:10px;
background:#0b1220;
border-right:1px solid #00ffcc;
overflow:auto;
}

.right{
}

input{
width:100%;
padding:10px;
background:#05070d;
border:1px solid #00ffcc;
color:#00ffcc;
}

button{
width:100%;
padding:10px;
margin-top:5px;
background:#00ffcc;
border:none;
font-weight:bold;
cursor:pointer;
}

.item{
padding:8px;
border-bottom:1px solid #00ffcc22;
cursor:pointer;
}

.item:hover{
background:#00ffcc11;
}

#map{
width:100%;
height:100%;
}
</style>
</head>

<body>

<header>
🚍 FUTÁR V5 MAP ENGINE // LEAFLET CONTROL ROOM
</header>

<div class="container">

<!-- LEFT PANEL -->
<div class="left">
<h3>🚏 Megálló kereső</h3>

<input id="input" placeholder="pl. Deák tér / Kelenföld">
<button onclick="search()">KERESÉS</button>

<div id="list"></div>

<div id="info"></div>
</div>

<!-- MAP -->
<div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

/*
========================
GTFS STOP + COORDS
========================
*/

const stops = [
{name:"Deák tér", lat:47.4979, lng:19.0540},
{name:"Blaha Lujza tér", lat:47.4970, lng:19.0700},
{name:"Kelenföld", lat:47.4649, lng:19.0227},
{name:"Nád utca", lat:47.5190, lng:19.0780}
];

/*
========================
MAP INIT
========================
*/

const map = L.map('map').setView([47.4979,19.0402], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'OSM'
}).addTo(map);

let marker;

/*
========================
NORMALIZER
========================
*/

function norm(s){
return s.toLowerCase()
.normalize("NFD")
.replace(/\p{Diacritic}/gu,"");
}

/*
========================
SEARCH ENGINE
========================
*/

function search(){

let val=document.getElementById("input").value;

let found = stops.filter(s =>
norm(s.name).includes(norm(val))
);

let list=document.getElementById("list");
list.innerHTML="";

found.forEach(f=>{
let div=document.createElement("div");
div.className="item";
div.innerHTML="🚏 "+f.name;

div.onclick=()=>{
selectStop(f);
};

list.appendChild(div);
});

}

/*
========================
SELECT STOP + MAP
========================
*/

function selectStop(stop){

document.getElementById("info").innerHTML=
"🚏 <b>"+stop.name+"</b>";

map.setView([stop.lat,stop.lng],16);

if(marker) map.removeLayer(marker);

marker = L.marker([stop.lat,stop.lng])
.addTo(map)
.bindPopup("🚏 "+stop.name)
.openPopup();
}

</script>

</body>
</html>
