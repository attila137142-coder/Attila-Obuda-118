
<div class="panel">
<h2>📦 GTFS ZIP</h2>
<input type="file" id="zipFile">
<button onclick="loadGTFS()">GTFS betöltése</button>
<div id="status">Várakozás...</div>
</div>

<div class="panel">
<h2>🔎 Megálló kereső</h2>
<input id="searchBox" placeholder="Szentendre">
<button onclick="searchStops()">Keresés</button>
<div id="results"></div>
</div>

<div class="panel" style="grid-column:span 2">
<h2>🚏 FUTÁR Indulási Tábla</h2>
<div id="board">Válassz megállót.</div>
</div>
</div>

<script>
const gtfs={stops:[],routes:[],trips:[],stop_times:[]};
const tripIndex={},routeIndex={};

setInterval(()=>{
 document.getElementById('clock').textContent=new Date().toLocaleTimeString('hu-HU');
},1000);

function parseLine(line){
 let a=[],c='',q=false;
 for(let ch of line){
  if(ch=='"'){q=!q;continue;}
  if(ch===','&&!q){a.push(c);c='';continue;}
  c+=ch;
 }
 a.push(c); return a;
}

function parseCSV(txt){
 if(!txt) return [];
 txt=txt.replace(/^\uFEFF/,'');
 const lines=txt.split(/\r?\n/).filter(x=>x.trim());
 const h=parseLine(lines[0]);
 return lines.slice(1).map(l=>{
  const c=parseLine(l),o={};
  h.forEach((k,i)=>o[k]=c[i]||'');
  return o;
 });
}

async function loadGTFS(){
 const f=document.getElementById('zipFile').files[0];
 if(!f) return;
 const zip=await JSZip.loadAsync(f);

 async function read(n){
   const z=zip.file(n);
   return z?await z.async('string'):'';
 }

 gtfs.stops=parseCSV(await read('stops.txt'));
 gtfs.routes=parseCSV(await read('routes.txt'));
 gtfs.trips=parseCSV(await read('trips.txt'));
 gtfs.stop_times=parseCSV(await read('stop_times.txt'));

 gtfs.trips.forEach(t=>tripIndex[t.trip_id]=t);
 gtfs.routes.forEach(r=>routeIndex[r.route_id]=r);

 document.getElementById('status').innerHTML=
 `✅ Megállók: ${gtfs.stops.length}<br>
  ✅ Járatok: ${gtfs.routes.length}<br>
  ✅ Menetrendi sorok: ${gtfs.stop_times.length}`;
}

function searchStops(){
 const q=document.getElementById('searchBox').value.toLowerCase();
 const seen=new Set();
 const hits=gtfs.stops.filter(s=>{
   const n=(s.stop_name||'');
   if(!n.toLowerCase().includes(q)) return false;
   if(seen.has(n)) return false;
   seen.add(n);
   return true;
 }).slice(0,50);

 document.getElementById('results').innerHTML=hits.map(s=>
 `<button onclick="showBoard('${s.stop_id}')">${s.stop_name}</button>`
 ).join('');
}

function minsUntil(t){
 const p=t.split(':');
 if(p.length<2) return '';
 let now=new Date();
 let target=Number(p[0])*60+Number(p[1]);
 let cur=now.getHours()*60+now.getMinutes();
 let d=target-cur;
 if(d<0) d+=1440;
 return d+' perc múlva';
}

function showBoard(stopId){
 const rows=gtfs.stop_times.filter(x=>x.stop_id===stopId).slice(0,50);

 const html=rows.map(r=>{
   const trip=tripIndex[r.trip_id]||{};
   const route=routeIndex[trip.route_id]||{};

   return `<div class="dep">
      <div>🕒 ${r.departure_time||r.arrival_time||'--'} (${minsUntil(r.departure_time||'00:00:00')})</div>
      <div class="route">🚍 ${route.route_short_name||'?'}</div>
      <div class="headsign">➡️ ${trip.trip_headsign||'Ismeretlen célállomás'}</div>
      <div>🔄 Forda: ${trip.block_id||'N/A'}</div>
      <div class="small">🧭 Irány: ${trip.direction_id||0} | Trip: ${trip.trip_id||''}</div>
   </div>`;
 }).join('');

 document.getElementById('board').innerHTML=html||'Nincs indulás.';
}
</script>
</body>
</html>
