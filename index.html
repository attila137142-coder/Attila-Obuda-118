<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>🚆 DEPARTURE MAP V1</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
overflow:hidden;
}

header{
background:#111827;
padding:12px;
color:#4ade80;
font-weight:bold;
}

canvas{
display:block;
}

.panel{
position:absolute;
top:60px;
left:10px;
background:#111827;
padding:12px;
border-radius:10px;
font-size:13px;
width:260px;
}

.badge{
display:inline-block;
padding:2px 6px;
border-radius:6px;
margin:2px 0;
}

.green{background:#14532d;color:#4ade80;}
.blue{background:#1e3a8a;color:#38bdf8;}
.yellow{background:#78350f;color:#fbbf24;}
.red{background:#7f1d1d;color:#f87171;}
</style>
</head>

<body>

<header>🚆 DEPARTURE MAP V1 – Budapest • Dunakanyar • Börzsöny</header>

<div class="panel">
🟢 zöld = időben<br>
🟡 sárga = késés<br>
🔴 piros = nagy késés<br><br>

📍 Régiók:
<div class="badge green">Budapest</div>
<div class="badge blue">Dunakanyar</div>
<div class="badge yellow">Börzsöny</div>

<br><br>
⏱️ élő indulás szimuláció
</div>

<canvas id="c"></canvas>

<script>

// ============================
// CANVAS
// ============================

const c=document.getElementById("c");
const ctx=c.getContext("2d");

function resize(){
c.width=window.innerWidth;
c.height=window.innerHeight;
}
window.onresize=resize;
resize();

// ============================
// REGION STOPS
// ============================

const stops=[

{ name:"Budapest-Nyugati", x:200, y:400, region:"BP" },
{ name:"Kőbánya", x:320, y:360, region:"BP" },

{ name:"Vác", x:500, y:300, region:"DK" },
{ name:"Verőce", x:620, y:260, region:"DK" },
{ name:"Nagymaros", x:740, y:230, region:"DK" },

{ name:"Szob", x:860, y:200, region:"BR" },
{ name:"Kismaros", x:700, y:200, region:"BR" },
{ name:"Királyrét", x:820, y:120, region:"BR" }

];

// ============================
// LINES (simplified network)
// ============================

const lines=[
["Budapest-Nyugati","Kőbánya","Vác","Verőce","Nagymaros","Szob"],
["Vác","Kismaros","Királyrét"]
];

// ============================
// DEPARTURES (simulated)
// ============================

function genDelay(){
return Math.floor(Math.random()*15); // 0–15 min
}

let departures=stops.map(s=>{

return{
name:s.name,
time:Math.floor(Math.random()*60),
delay:genDelay()
};

});

// ============================
// DRAW NETWORK
// ============================

function drawLines(){

ctx.strokeStyle="#334155";
ctx.lineWidth=2;

lines.forEach(line=>{

ctx.beginPath();

line.forEach((name,i)=>{

let s=stops.find(x=>x.name===name);
if(!s) return;

if(i===0) ctx.moveTo(s.x,s.y);
else ctx.lineTo(s.x,s.y);

});

ctx.stroke();

});

}

// ============================
// DRAW STOPS
// ============================

function drawStops(){

stops.forEach(s=>{

ctx.beginPath();
ctx.fillStyle="#4ade80";
ctx.arc(s.x,s.y,6,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="white";
ctx.font="11px Arial";
ctx.fillText(s.name,s.x+8,s.y-8);

});

}

// ============================
// DRAW DEPARTURES
// ============================

function drawDepartures(){

let y=80;

ctx.font="12px Arial";

departures.forEach(d=>{

let color="#4ade80";

if(d.delay>10) color="#f87171";
else if(d.delay>5) color="#fbbf24";

ctx.fillStyle=color;

ctx.fillText(
`${d.name} → indulás: ${d.time} perc | késés: +${d.delay} min`,
20,y
);

y+=18;

});

}

// ============================
// LOOP
// ============================

function loop(){

ctx.clearRect(0,0,c.width,c.height);

// background
ctx.fillStyle="#0b1220";
ctx.fillRect(0,0,c.width,c.height);

// map
drawLines();
drawStops();

// departures list
drawDepartures();

// simulate updates
if(Math.random()<0.01){
departures.forEach(d=>{
d.delay=genDelay();
});
}

requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
