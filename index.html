function openPanel(id){

let panelek =
document.querySelectorAll(".panel");


panelek.forEach(
p=>p.classList.remove("active")
);


document
.getElementById(id)
.classList.add("active");

}



<script>


// =====================================
// PDF TÁR + DÁTUM FIGYELŐ MOTOR
// =====================================


const PDF_ADATOK = [


{
nev:"160-as busz menetrend",
jarat:"160",
fajl:"pdf/160.pdf",

tol:"2026-07-01",
ig:"2026-08-31"

},



{
nev:"243-as busz menetrend",
jarat:"243",
fajl:"pdf/243.pdf",

tol:"2026-07-01",
ig:"2026-08-31"

},



{
nev:"917 éjszakai járat menetrend",
jarat:"917",

fajl:"pdf/917.pdf",

tol:"2026-07-01",
ig:"2026-08-31"

}


];





function datumSzamitas(vegDatum){


let ma =
new Date();


let lej =
new Date(vegDatum);



let kulonbseg =
lej-ma;


return Math.ceil(
kulonbseg /
(1000*60*60*24)
);


}







function pdfListaBetoltes(){


let lista =
document.getElementById(
"pdfLista"
);


lista.innerHTML="";



PDF_ADATOK.forEach(pdf=>{


let napok =
datumSzamitas(pdf.ig);



let allapot="";
let osztaly="";



if(napok < 0){


allapot =
"🔴 LEJÁRT";

osztaly="red";


}

else if(napok <=30){


allapot =
"🟡 HAMAROSAN LEJÁR";


osztaly="yellow";


}

else{


allapot =
"🟢 AKTUÁLIS";


osztaly="green";


}





lista.innerHTML += `


<div class="card">


<h3>

${pdf.nev}

</h3>



Járat:
<b>
${pdf.jarat}
</b>


<br><br>


Érvényes:

<br>

${pdf.tol}

-

${pdf.ig}



<br><br>



Állapot:

<span class="${osztaly}">

${allapot}

</span>



<br>


${

napok>=0 ?

"Hátralévő idő: "+napok+" nap"

:

"Friss PDF szükséges!"

}



<br><br>


<button onclick="pdfMegnyitas('${pdf.fajl}')">

📄 PDF MEGNYITÁS

</button>



</div>


`;



});



}





function pdfMegnyitas(fajl){


window.open(
fajl,
"_blank"
);


}





// induláskor

pdfListaBetoltes();


</script>

// ékezet eltávolítás

function ekezetNelkul(szoveg){


return szoveg
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"");


}







function keresMegallo(){


let keres =

document
.getElementById("keresoInput")
.value;



let eredmeny =

document
.getElementById("talalatok");



eredmeny.innerHTML="";



if(keres.length < 2){

return;

}



let tiszta =

ekezetNelkul(keres);




let talalatok =

MEGALLO_ADATOK.filter(
m =>


ekezetNelkul(m.nev)
.includes(tiszta)


);






if(talalatok.length===0){


eredmeny.innerHTML=

`
<div class="card">

❌ Nincs találat

</div>
`;

return;

}






talalatok.forEach(m=>{


let ikon =
m.tipus==="éjszakai"
?
"🌙"
:
"🚌";



eredmeny.innerHTML +=


`

<div class="card">


<h3>

🚏 ${m.nev}

</h3>


GTFS stop_id:

<b>

${m.kod}

</b>


<br><br>


Járat:

${ikon}

<b>

${m.jarat}

</b>


<br><br>


Típus:

${m.tipus}


</div>


`;



});



}





</script>

  <script>

let AKTUALIS_POZICIO = {

lat:null,

lon:null,

pontossag:null

};






function gpsInditas(){



if(!navigator.geolocation){


alert(
"Ez az eszköz nem támogatja a GPS helymeghatározást!"
);


return;


}





navigator.geolocation.watchPosition(



function(poz){



AKTUALIS_POZICIO.lat =

poz.coords.latitude;



AKTUALIS_POZICIO.lon =

poz.coords.longitude;



AKTUALIS_POZICIO.pontossag =

Math.round(
poz.coords.accuracy
);





gpsMegjelenites();



legkozelebbiMegallo();



},




function(hiba){


console.log(
"GPS hiba:",
hiba
);



},



{

enableHighAccuracy:true,

maximumAge:5000,

timeout:10000


}



);



}








function gpsMegjelenites(){



let panel =

document.getElementById(
"gtfs"
);



panel.innerHTML +=


`

<div class="card">


📍 GPS állapot:

<br>


🟢 AKTÍV


<br><br>


Szélesség:

${AKTUALIS_POZICIO.lat}


<br>


Hosszúság:

${AKTUALIS_POZICIO.lon}


<br>


Pontosság:

${AKTUALIS_POZICIO.pontossag}

méter


</div>


`;



}










function tavolsagSzamitas(lat1,lon1,lat2,lon2){



const R=6371000;



let dLat=

(lat2-lat1)

*

Math.PI/180;



let dLon=

(lon2-lon1)

*

Math.PI/180;



let a =

Math.sin(dLat/2)**2 +

Math.cos(lat1*Math.PI/180)

*

Math.cos(lat2*Math.PI/180)

*

Math.sin(dLon/2)**2;



let c=

2*Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);



return Math.round(R*c);



}









// minta koordináták
// később GTFS stops.txt-ből jönnek

{

function legkozelebbiMegallo(){
