<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Attila GTFS ENGINE V2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{font-family:Arial;margin:0;background:#0f172a;color:#e2e8f0}
header{padding:10px;background:#111827;position:sticky;top:0}
button,input{padding:6px;margin:5px;border-radius:6px;border:0}
.card{background:#111827;padding:10px;margin:10px;border-radius:8px}
</style>
</head>
<body>
<header>
<b>🚀 GTFS ENGINE V2</b>
<input type="file" id="zipInput" accept=".zip" />
<button onclick="loadGTFS()">GTFS</button>
<button onclick="startGPS()">GPS + SPEED</button>
</header>

<div class="card">
<b>📍 GPS</b>
<div id="gps">-</div>
<div id="speed">0 km/h (0 m/s)</div>
</div>

<script>
let GTFS = {stops:[], stopTimes:[], trips:[], routes:[]};
let gtfsLoaded=false;

// 🔒 LOAD + CACHE
async function loadGTFS(){
  if(gtfsLoaded){ alert("Már betöltve"); return; }

  const file=document.getElementById("zipInput").files[0];
  if(!file) return alert("ZIP kell");

  const zip=await JSZip.loadAsync(file);

  const parse=async(name)=>{
    const txt=await zip.file(name).async("string");
    return Papa.parse(txt,{header:true}).data;
  }

  GTFS.stops=(await parse("stops.txt")).filter(s=>s.stop_lat);
  GTFS.stopTimes=await parse("stop_times.txt");
  GTFS.trips=await parse("trips.txt");
  GTFS.routes=await parse("routes.txt");

  localStorage.setItem("GTFS", JSON.stringify(GTFS));

  gtfsLoaded=true;
  alert("✔ Stabil GTFS betöltve: "+GTFS.stops.length);
}

// ⚡ SPEED ENGINE V2 (SIMÍTOTT + PONTOSABB)
let history=[];

function startGPS(){
  navigator.geolocation.watchPosition(pos=>{
    const lat=pos.coords.latitude;
    const lon=pos.coords.longitude;
    const t=Date.now();

    document.getElementById("gps").innerHTML=
      `${lat.toFixed(5)}, ${lon.toFixed(5)}`;

    history.push({lat,lon,t});

    // max 5 pont tárolás
    if(history.length>5) history.shift();

    let speedMs=0;

    if(history.length>=2){
      let totalDist=0;
      let totalTime=0;

      for(let i=1;i<history.length;i++){
        const a=history[i-1];
        const b=history[i];

        const d=haversine(a.lat,a.lon,b.lat,b.lon);
        const dt=(b.t-a.t)/1000;

        if(dt>0){
          totalDist+=d;
          totalTime+=dt;
        }
      }

      speedMs = totalTime>0 ? totalDist/totalTime : 0;
    }

    // GPS zaj szűrés
    if(speedMs < 0.5) speedMs = 0;

    const speedKmh = speedMs * 3.6;

    document.getElementById("speed").innerHTML=
      `🚀 ${speedKmh.toFixed(1)} km/h (${speedMs.toFixed(2)} m/s)`;

  }, err=>{
    console.error(err);
  },{
    enableHighAccuracy:true,
    maximumAge:1000,
    timeout:5000
  });
}

function haversine(lat1, lon1, lat2, lon2){
  const R=6371000;
  const toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1);
  const dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// 🛡️ AUTO RESTORE
(function(){
  const saved=localStorage.getItem("GTFS");
  if(saved){
    GTFS=JSON.parse(saved);
    gtfsLoaded=true;
    console.log("GTFS visszatöltve cache-ből");
  }
})();
</script>
</body>
</html>
