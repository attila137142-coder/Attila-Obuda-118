<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>STABLE STOP ENGINE</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body { font-family: Arial; background:#0f172a; color:white; padding:15px }
.card { background:#1e293b; padding:10px; margin:8px; border-radius:10px }
button { padding:10px; margin:5px; border-radius:8px; border:none; background:#22c55e; color:white }
</style>
</head>
<body>

<h2>📍 STABLE STOP DATA ENGINE</h2>

<button onclick="getLocation()">📌 Saját helyzetem</button>
<button onclick="loadStops()">GTFS MEGÁLLÓK BETÖLTÉSE</button>

<div id="me"></div>
<div id="list"></div>

<script>

let MY={lat:null,lon:null};
let STOPS=[];

// 🌍 saját helyzet
function getLocation(){
  navigator.geolocation.getCurrentPosition(pos=>{
    MY.lat=pos.coords.latitude;
    MY.lon=pos.coords.longitude;

    document.getElementById("me").innerHTML=`
      <div class="card">
        📍 Saját pozíció:<br>
        ${MY.lat.toFixed(6)}, ${MY.lon.toFixed(6)}
      </div>
    `;
  });
}

// 📏 távolság
function dist(a,b,c,d){
  const R=6371000;
  const toRad=x=>x*Math.PI/180;
  let dLat=toRad(c-a);
  let dLon=toRad(d-b);
  let A=Math.sin(dLat/2)**2+
    Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(A),Math.sqrt(1-A));
}

// 📦 GTFS betöltés (stops.txt csak!)
async function loadStops(){

  let url="https://gtfs.menetbrand.com/download/volanbusz";

  let res=await fetch(url);
  let blob=await res.blob();

  let zip=await JSZip.loadAsync(blob);

  let text=await zip.file("stops.txt").async("string");

  let data=Papa.parse(text,{header:true}).data;

  STOPS=data.filter(s=>s.stop_lat && s.stop_lon);

  render();
}

// 📌 lista
function render(){

  if(!MY.lat){
    alert("Először add meg a helyzeted!");
    return;
  }

  let sorted=STOPS.map(s=>{

    let d=dist(MY.lat,MY.lon,s.stop_lat,s.stop_lon);

    return {
      name:s.stop_name,
      id:s.stop_id,
      lat:parseFloat(s.stop_lat),
      lon:parseFloat(s.stop_lon),
      dist:d
    };

  }).sort((a,b)=>a.dist-b.dist).slice(0,20);

  document.getElementById("list").innerHTML=
    sorted.map(s=>`
      <div class="card">
        <b>${s.name}</b><br>
        🆔 ${s.id}<br>
        📍 ${s.lat.toFixed(6)}, ${s.lon.toFixed(6)}<br>
        📏 ${(s.dist).toFixed(0)} m
      </div>
    `).join("");

}

</script>

</body>
</html>
