<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FUTÁR V6 HYBRID DISPATCHER ULTIMATE</title>

<style>

body{
    margin:0;
    background:#0b1017;
    color:#e8f1ff;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

/* HEADER */

header{
    height:64px;
    background:#111826;
    border-bottom:2px solid #00ffaa;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 18px;
}

.logo{
    color:#00ffaa;
    font-size:24px;
    font-weight:bold;
}

.topinfo{
    display:flex;
    align-items:center;
    gap:20px;
}

.clock{
    font-size:30px;
    color:#00ffaa;
    font-weight:bold;
}

.date{
    color:#9fb3cc;
    font-size:14px;
}

/* LAYOUT */

.main{
    display:grid;
    grid-template-columns:390px 1fr;
    height:calc(100vh - 64px);
}

/* SIDEBAR */

.sidebar{
    background:#131d2b;
    overflow-y:auto;
    border-right:2px solid #1e2a3a;
    padding:12px;
}

/* SECTION */

.section{
    margin-bottom:24px;
}

.section h2{
    color:#00ffaa;
    font-size:16px;
    border-bottom:1px solid #2f425b;
    padding-bottom:6px;
}

/* INPUTS */

input{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:none;
    border-radius:8px;
    background:#1a2433;
    color:white;
    font-size:15px;
    box-sizing:border-box;
}

/* BUTTONS */

.btn{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    text-align:left;
    color:white;
    font-size:14px;
    transition:0.2s;
}

.btn:hover{
    transform:scale(1.02);
    opacity:0.92;
}

.bkk{ background:#1f3f66; }
.volan{ background:#5c3a1b; }
.mav{ background:#24486f; }
.aev{ background:#31522a; }
.live{ background:#1e4f38; }
.map{ background:#4b2b66; }

/* VIEWER */

.viewer{
    position:relative;
    background:black;
}

iframe{
    width:100%;
    height:100%;
    border:none;
    background:white;
}

/* STATUS */

.statusbar{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:40px;
    background:#111826dd;
    border-top:1px solid #223044;
    display:flex;
    align-items:center;
    padding-left:15px;
    color:#00ffaa;
    font-size:13px;
}

/* MOBILE */

@media(max-width:900px){

.main{
    grid-template-columns:1fr;
}

.sidebar{
    height:48vh;
}

.viewer{
    height:52vh;
}

.clock{
    font-size:20px;
}

.logo{
    font-size:18px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
🚦 FUTÁR V6 ULTIMATE
</div>

<div class="topinfo">
<div class="date" id="date"></div>
<div class="clock" id="clock"></div>
</div>

</header>

<div class="main">

<!-- SIDEBAR -->

<div class="sidebar">

<!-- BKK -->

<div class="section">

<h2>🚇 BKK / FUTÁR KERESŐ</h2>

<input
id="bkkInput"
placeholder="pl: F00457">

<button class="btn bkk"
onclick="openBKKStop()">
🚏 BKK MEGÁLLÓ MEGNYITÁSA
</button>

<button class="btn bkk"
onclick="openExternal('https://futar.bkk.hu/')">
🌐 FUTÁR
</button>

<button class="btn map"
onclick="openExternal('https://go.bkk.hu/')">
🌐 BUDAPESTGO
</button>

<button class="btn live"
onclick="openExternal('https://map.realtimenext.hu/')">
🛰 BKK JÁRMŰKÖVETŐ
</button>

</div>

<!-- VOLÁN -->

<div class="section">

<h2>🚌 VOLÁN / UTAS.HU</h2>

<input
id="volanInput"
placeholder="pl: hkir_778806_0">

<button class="btn volan"
onclick="openVolanStop()">
🚌 VOLÁN MEGÁLLÓ
</button>

<button class="btn volan"
onclick="openExternal('https://utas.hu/search/')">
🔎 VOLÁN KERESŐ
</button>

<button class="btn volan"
onclick="openExternal('https://utas.hu/?map=10/47.91054/18.93198')">
🌲 BÖRZSÖNY TÉRKÉP
</button>

<button class="btn volan"
onclick="openExternal('https://utas.hu/?map=10/47.70959/18.9351')">
⛰ PILIS TÉRKÉP
</button>

</div>

<!-- MÁV -->

<div class="section">

<h2>🚆 MÁV ÁLLOMÁSKERESŐ</h2>

<input
id="mavInput"
placeholder="pl: 0055xxxx">

<button class="btn mav"
onclick="openMAVStation()">
🚆 MÁV ÁLLOMÁS
</button>

<button class="btn mav"
onclick="openExternal('https://kozlekedesiklub.hu/vonatinfo/')">
📡 VONATINFO+
</button>

<button class="btn mav"
onclick="openExternal('https://mavplusz.hu/#/map')">
🛰 MÁV+ MAP
</button>

</div>

<!-- ÁEV -->

<div class="section">

<h2>🌲 ÁEV / ERDEI VASUTAK</h2>

<input
id="aevInput"
placeholder="pl: Királyrét">

<button class="btn aev"
onclick="openAEVSearch()">
🌲 ÁEV KERESÉS
</button>

<button class="btn aev"
onclick="openExternal('https://www.kiralyreti-erdei-vasut.hu/')">
🚂 KIRÁLYRÉT
</button>

<button class="btn aev"
onclick="openExternal('https://kisvasut.hu/')">
🚂 KISVASUT.HU
</button>

</div>

<!-- GYORS GOMBOK -->

<div class="section">

<h2>⚡ GYORS ELÉRÉS</h2>

<button class="btn live"
onclick="loadIframe('https://realtimenext.hu/embed/bkv/stops/F00457/schedule')">
🚏 NÁD UTCA
</button>

<button class="btn live"
onclick="loadIframe('https://realtimenext.hu/embed/bkv/stops/044192/schedule')">
🚏 BÉKÁSMEGYER 243 MH
</button>

<button class="btn live"
onclick="loadIframe('https://realtimenext.hu/embed/bkv/stops/09142223/schedule')">
🚏 SZENTENDRE HÉV
</button>

</div>

</div>

<!-- VIEWER -->

<div class="viewer">

<iframe
id="frame"
src="https://realtimenext.hu/embed/bkv/stops/F00457/schedule">
</iframe>

<div class="statusbar" id="statusbar">
🟢 DISPATCHER SYSTEM READY
</div>

</div>

</div>

<script>

/* CLOCK */

function updateClock(){

    const now = new Date();

    document.getElementById("clock").innerHTML =
        now.toLocaleTimeString('hu-HU');

    document.getElementById("date").innerHTML =
        now.toLocaleDateString('hu-HU',{
            year:'numeric',
            month:'long',
            day:'numeric',
            weekday:'long'
        });
}

setInterval(updateClock,1000);
updateClock();

/* IFRAME */

function loadIframe(url){

    document.getElementById("frame").src = url;

    document.getElementById("statusbar").innerHTML =
    "📡 BETÖLTVE: " + url;
}

/* EXTERNAL */

function openExternal(url){

    window.open(url,'_blank');

    document.getElementById("statusbar").innerHTML =
    "🌐 KÜLSŐ MEGNYITÁS: " + url;
}

/* BKK */

function openBKKStop(){

    let id =
    document.getElementById("bkkInput").value;

    if(!id){
        alert("Adj meg BKK stop ID-t!");
        return;
    }

    let url =
    "https://realtimenext.hu/embed/bkv/stops/"
    + id +
    "/schedule";

    loadIframe(url);
}

/* VOLÁN */

function openVolanStop(){

    let id =
    document.getElementById("volanInput").value;

    if(!id){
        alert("Adj meg VOLÁN stop ID-t!");
        return;
    }

    let url =
    "https://utas.hu/stop/" + id;

    openExternal(url);
}

/* MÁV */

function openMAVStation(){

    let id =
    document.getElementById("mavInput").value;

    if(!id){
        alert("Adj meg MÁV állomáskódot!");
        return;
    }

    openExternal(
    "https://kozlekedesiklub.hu/vonatinfo/");
}

/* ÁEV */

function openAEVSearch(){

    let q =
    document.getElementById("aevInput").value;

    if(!q){
        alert("Adj meg ÁEV keresést!");
        return;
    }

    let url =
    "https://www.google.com/search?q="
    + encodeURIComponent(q + " erdei vasút");

    openExternal(url);
}

</script>

</body>
</html>
