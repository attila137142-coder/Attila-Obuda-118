# 🚍 Budapest Control Room – V2.2 TIME ENGINE FIXED + REAL DELAY LOGIC

## (STABIL GTFS CORE + HELYES IDŐKEZELÉS + VALÓS “DISPATCH” LOGIKA)

```html
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Control Room V2.2 TIME ENGINE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#061b17;color:#dff;overflow:hidden;}
#topbar{height:50px;background:#0a2a24;display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:2px solid #00ffb3;font-weight:bold;}
#layout{display:flex;height:calc(100vh - 50px);}
#panel{width:440px;background:#081f1b;border-right:2px solid #00ffb3;overflow:auto;padding:10px;font-family:monospace;}
#map{flex:1;}
.stopBox{padding:8px;border:1px solid #0d3b33;margin-bottom:10px;border-radius:6px;}
.row{display:grid;grid-template-columns:70px 1fr 90px;font-size:12px;padding:2px 0;border-bottom:1px solid #0d3b33;}
.green{color:#65ff8f;}
.blue{color:#4db7ff;}
.red{color:#ff5b5b;}
.small{font-size:11px;opacity:0.8;}
</style>
</head>

<body>

<div id="topbar">
🚍 V2.2 TIME ENGINE FIXED
<input type="file" id="zip">
<button onclick="resetPanel()">RESET</button>
</div>

<div id="layout">
<div id="panel">GTFS CORE: WAITING FILE...</div>
<div id="map"></div>
</div>

<script>

/* =========================
🧠 STATE
========================= */
let GTFS={stops:[],stop_times:[]};
let INDEX={stop:{}};

let map=L.map('map').setView([47.55,19.05],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let layer=L.layerGroup().addTo(map);

/* =========================
🧠 SAFE CSV PARSER
========================= */
function parseCSVLine(line){
 let res=[],cur="",q=false;
 for(let c of line){
  if(c=='"') q=!q;
  else if(c==','&&!q){res.push(cur);cur="";}
  else cur+=c;
 }
 res.push(cur);
 return res;
}

function safe(v){return v?v:"";}

/* =========================
⏱ TIME ENGINE FIXED
========================= */

function nowSec(){
 const d=new Date();
 return d.getHours()*3600+d.getMinutes()*60+d.getSeconds();
}

function toSec(t){
 if(!t) return 0;
 let p=t.split(':');
 let h=parseInt(p[0],10);
 let m=parseInt(p[1],10);
 let s=parseInt(p[2]||0,10);

 // IMPORTANT: GTFS CAN BE >24h, DO NOT MODULO
 return h*3600 + m*60 + s;
}

/* =========================
📦 LOAD GTFS
========================= */
async function loadGTFS(file){
 const zip=await JSZip.loadAsync(file);

 const stopsTxt=await zip.file('stops.txt').async('string');
 const sLines=stopsTxt.split(/\r?\n/);
 const sH=parseCSVLine(sLines[0]);

 GTFS.stops=[];

 for(let i=1;i<sLines.length;i++){
  if(!sLines[i]) continue;
  let row=parseCSVLine(sLines[i]);
  let obj={};
  sH.forEach((h,j)=>obj[h]=row[j]||"");
  GTFS.stops.push(obj);
 }

 const stTxt=await zip.file('stop_times.txt').async('string');
 const stLines=stTxt.split(/\r?\n/);
 const stH=parseCSVLine(stLines[0]);

 GTFS.stop_times=[];

 for(let i=1;i<stLines.length;i++){
  if(!stLines[i]) continue;
  let row=parseCSVLine(stLines[i]);
  let obj={};
  stH.forEach((h,j)=>obj[h]=row[j]||"");
  GTFS.stop_times.push(obj);
 }

 buildIndex();
 renderMap();
 document.getElementById('panel').innerHTML="CLICK A STOP";
}

/* =========================
🧩 INDEX ENGINE
========================= */
function buildIndex(){
 INDEX.stop={};
 GTFS.stop_times.forEach(st=>{
  if(!st.stop_id) return;
  if(!INDEX.stop[st.stop_id]) INDEX.stop[st.stop_id]=[];
  INDEX.stop[st.stop_id].push(st);
 });
}

/* =========================
🗺 MAP + CLICK
========================= */
function renderMap(){
 layer.clearLayers();

 GTFS.stops.forEach(s=>{

  let lat=parseFloat(s.stop_lat);
  let lon=parseFloat(s.stop_lon);
  if(!lat||!lon) return;

  let marker=L.circleMarker([lat,lon],{
   radius:5,
   color:'#ffee00',
   fillColor:'#00ff88',
   fillOpacity:0.8
  }).addTo(layer);

  marker.on('click',()=>{
   renderPanel(s.stop_id);
  });

  marker.bindPopup(s.stop_name||"STOP");

 });
}

/* =========================
📋 PANEL + REAL TIME LOGIC
========================= */
function renderPanel(stop_id){

 let list=INDEX.stop[stop_id]||[];
 let meta=GTFS.stops.find(s=>s.stop_id==stop_id)||{};
 let now=nowSec();

 let html="<div class='stopBox'>";
 html+="<b>"+safe(meta.stop_name)+"</b><br>";
 html+="GTFS ID: "+safe(stop_id)+"<br>";
 html+="<div class='small'>"+safe(meta.stop_lat)+" , "+safe(meta.stop_lon)+"</div>";

 for(let i=0;i<Math.min(list.length,15);i++){

  let d=list[i];
  let dep=toSec(d.departure_time);

  let diffMin=(dep-now)/60;

  let cls="green";
  let label="on time";

  if(diffMin < -1){
   cls="red";
   label="departed";
  } else if(diffMin > 1){
   cls="blue";
   label="in " + Math.floor(diffMin)+"m";
  } else {
   cls="green";
   label="now";
  }

  html+="<div class='row'>"+
   "<div>"+safe(d.trip_id).slice(0,6)+"</div>"+
   "<div>"+safe(d.departure_time)+"</div>"+
   "<div class='"+cls+"'>"+label+"</div>"+
  "</div>";
 }

 html+="</div>";
 document.getElementById('panel').innerHTML=html;
}

function resetPanel(){
 document.getElementById('panel').innerHTML="CLICK A STOP";
}

/* =========================
📂 INPUT
========================= */

document.getElementById('zip').addEventListener('change',e=>{
 loadGTFS(e.target.files[0]);
});

</script>
</body>
</html>
``
