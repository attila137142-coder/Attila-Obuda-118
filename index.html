<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>ATTILA DISPATCHER V7.5 – LIGHT DB</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{margin:0;display:flex;font-family:Arial;}
#sidebar{width:360px;background:#0b1220;color:#00ff66;overflow:auto;}
#map{flex:1;height:100vh;}

.panel{padding:10px;font-family:monospace;}

.matrix{background:black;color:#00ff66;padding:10px;}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #003300;padding:4px;}

input,button{width:100%;margin:4px 0;padding:6px;background:#003300;color:#00ff66;border:none;}
</style>
</head>

<body>

<div id="sidebar">
<h3>🟢 ATTILA V7.5</h3>

<input id="search" placeholder="Keresés...">
<button onclick="findNearest()">📍 Legközelebbi</button>

<div id="list"></div>
<div id="panel">Válassz megállót</div>
</div>

<div id="map"></div>

<script>

// ===== MAP =====
const map = L.map('map').setView([47.5,19.05],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// ===== FAKE DB =====
const DB = {

stops:[
 {id:"ORS",name:"Örs vezér tere",lat:47.5003,lon:19.1357},
 {id:"BAT",name:"Batthyány tér",lat:47.506,lon:19.039},
 {id:"FLO",name:"Flórián tér",lat:47.542,lon:19.042},
 {id:"SZENT",name:"Szentendre HÉV",lat:47.669,lon:19.075},
 {id:"VAC",name:"Vác, autóbusz-állomás",lat:47.78,lon:19.13}
],

departures:{
 "ORS":[{l:"H8",t:"12:01"},{l:"H9",t:"12:05"},{l:"2",t:"12:07"}],
 "BAT":[{l:"H5",t:"12:02"},{l:"19",t:"12:06"}],
 "FLO":[{l:"34",t:"12:03"},{l:"106",t:"12:09"}],
 "SZENT":[{l:"H5",t:"12:10"}],
 "VAC":[{l:"300",t:"12:15"}]
}

};

// ===== GPS =====
let userPos=null;
navigator.geolocation.getCurrentPosition(p=>{
 userPos={lat:p.coords.latitude,lon:p.coords.longitude};
});

// ===== DIST =====
function dist(a,b){
 const R=6371000;
 const dLat=(b.lat-a.lat)*Math.PI/180;
 const dLon=(b.lon-a.lon)*Math.PI/180;
 const x=Math.sin(dLat/2)**2+
  Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*
  Math.sin(dLon/2)**2;
 return R*(2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)));
}

// ===== LIST =====
function render(list){

 const c=document.getElementById("list");
 c.innerHTML="";

 list.forEach(s=>{
  const d=document.createElement("div");
  d.innerHTML="📍 "+s.name;
  d.style.cursor="pointer";
  d.onclick=()=>showStop(s);
  c.appendChild(d);
 });
}

// ===== SEARCH =====
search.oninput=e=>{
 const q=e.target.value.toLowerCase();
 render(DB.stops.filter(s=>s.name.toLowerCase().includes(q)));
};

// ===== NEAREST =====
function findNearest(){

 if(!userPos){alert("GPS nincs");return;}

 let res=DB.stops.map(s=>({
  ...s,
  d:dist(userPos,{lat:s.lat,lon:s.lon})
 }))
 .sort((a,b)=>a.d-b.d)
 .slice(0,5);

 render(res);
}

// ===== PANEL =====
function showStop(s){

 let list=DB.departures[s.id]||[];

 let html=`
 <div class="matrix">
 <h3>${s.name}</h3>
 <hr>
 `;

 list.forEach(d=>{
  html+=`
  <div class="row">
   <div>${d.l}</div>
   <div>${d.t}</div>
  </div>`;
 });

 html+="</div>";

 document.getElementById("panel").innerHTML=html;
}

// ===== MAP =====
DB.stops.forEach(s=>{
 L.marker([s.lat,s.lon]).addTo(map)
  .on("click",()=>showStop(s));
});

render(DB.stops);

</script>

</body>
</html>
