<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>BKK LIGHT GTFS ZIP GENERATOR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body style="font-family:Arial;padding:20px">

<h2>🚍 BKK LIGHT GTFS ZIP GENERÁTOR</h2>

<button onclick="generateGTFS()">📦 ZIP generálás</button>

<pre id="log"></pre>

<script>

function log(msg){
    document.getElementById("log").innerText += msg + "\n";
}

// --- MINIMÁL GTFS ADATOK ---
const stops = `stop_id,stop_name,stop_lat,stop_lon
1,Központ,47.4979,19.0402
2,Óbuda,47.5410,19.0450
3,Békásmegyer,47.5950,19.0430
`;

const routes = `route_id,route_short_name,route_long_name,route_type
R1,118,Óbuda - Békásmegyer,3
`;

const trips = `route_id,service_id,trip_id,headsign
R1,WEEKDAY,T1,Békásmegyer
R1,WEEKDAY,T2,Óbuda
`;

const stop_times = `trip_id,arrival_time,departure_time,stop_id,stop_sequence
T1,08:00:00,08:00:00,1,1
T1,08:10:00,08:10:00,2,2
T1,08:20:00,08:20:00,3,3
T2,09:00:00,09:00:00,3,1
T2,09:10:00,09:10:00,2,2
T2,09:20:00,09:20:00,1,3
`;

const calendar = `service_id,monday,tuesday,wednesday,thursday,friday,saturday,sunday,start_date,end_date
WEEKDAY,1,1,1,1,1,0,0,20260101,20261231
`;

const agency = `agency_id,agency_name,agency_url,agency_timezone
BKK,BKK,http://bkk.hu,Europe/Budapest
`;

// --- ZIP GENERÁLÁS ---
async function generateGTFS(){

    log("GTFS csomag generálása...");

    const zip = new JSZip();

    zip.file("stops.txt", stops);
    zip.file("routes.txt", routes);
    zip.file("trips.txt", trips);
    zip.file("stop_times.txt", stop_times);
    zip.file("calendar.txt", calendar);
    zip.file("agency.txt", agency);

    const content = await zip.generateAsync({type:"blob"});

    const a = document.createElement("a");
    a.href = URL.createObjectURL(content);
    a.download = "bkk_light.zip";
    a.click();

    log("✔ bkk_light.zip kész!");
}

</script>

</body>
</html>
