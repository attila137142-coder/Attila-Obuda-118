<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Attila Közlekedés Control V10
</title>


<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#111827;
    color:white;
}


header{

    background:#0f766e;
    padding:15px;
    text-align:center;

}


h1{
    margin:0;
    font-size:24px;
}


.menu{

    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));

    gap:12px;
    padding:15px;

}


button{

    padding:15px;
    border:none;
    border-radius:10px;

    background:#2563eb;
    color:white;

    font-size:16px;
    cursor:pointer;

}


button:hover{

    background:#1d4ed8;

}


.panel{

    display:none;

    margin:15px;
    padding:15px;

    background:#1f2937;

    border-radius:12px;

}


.active{

    display:block;

}


input{

    width:90%;

    padding:12px;

    font-size:16px;

    border-radius:8px;

}


.card{

    background:#374151;

    margin-top:10px;

    padding:12px;

    border-radius:10px;

}


.green{

color:#22c55e;

}


.yellow{

color:#eab308;

}


.red{

color:#ef4444;

}


</style>


</head>


<body>


<header>

<h1>
🚍 Attila Közlekedés Control V10
</h1>

<div>
GTFS • PDF • Megálló • Menetrend
</div>

</header>



<div class="menu">


<button onclick="openPanel('pdf')">
🗂 PDF TÁR
</button>


<button onclick="openPanel('kereso')">
🔎 MEGÁLLÓ KERESŐ
</button>


<button onclick="openPanel('gtfs')">
🚌 GTFS ADATOK
</button>


<button onclick="openPanel('kapcsolat')">
🔗 KÖZÖS MEGÁLLÓK
</button>


</div>





<div id="pdf" class="panel">

<h2>
🗂 PDF Menetrend Tár
</h2>


<div id="pdfLista">

Betöltés...

</div>


</div>





<div id="kereso" class="panel">

<h2>
🔎 Megálló kereső
</h2>


<input 
id="keresoInput"
placeholder="Megálló neve..."
onkeyup="keresMegallo()"
>


<div id="talalatok">

</div>


</div>





<div id="gtfs" class="panel">


<h2>
🚌 GTFS adatbázis
</h2>


<div class="card">

Megállók:
<span id="gtfsMegallok">
0
</span>

</div>


<div class="card">

Járatok:
<span id="gtfsJaratszam">
0
</span>

</div>


</div>





<div id="kapcsolat" class="panel">


<h2>
🔗 Fizikai megálló kapcsolatok
</h2>


<div class="card">

🚏 Nád utca

<br><br>

89725 → 🚌 160

<br>
F00457 → 🚌 243

<br>
917 → 🌙 éjszakai

<br><br>

Távolság:
kb. 45 m

</div>



<div class="card">

🚏 Békásmegyer H

<br>

1600 + 2430

</div>


</div>




<script>


function openPanel(id){

let panelek =
document.querySelectorAll(".panel");


panelek.forEach(
p=>p.classList.remove("active")
);


document
.getElementById(id)
.classList.add("active");

}



<script>


// =====================================
// PDF TÁR + DÁTUM FIGYELŐ MOTOR
// =====================================


const PDF_ADATOK = [


{
nev:"160-as busz menetrend",
jarat:"160",
fajl:"pdf/160.pdf",

tol:"2026-07-01",
ig:"2026-08-31"

},



{
nev:"243-as busz menetrend",
jarat:"243",
fajl:"pdf/243.pdf",

tol:"2026-07-01",
ig:"2026-08-31"

},



{
nev:"917 éjszakai járat menetrend",
jarat:"917",

fajl:"pdf/917.pdf",

tol:"2026-07-01",
ig:"2026-08-31"

}


];





function datumSzamitas(vegDatum){


let ma =
new Date();


let lej =
new Date(vegDatum);



let kulonbseg =
lej-ma;


return Math.ceil(
kulonbseg /
(1000*60*60*24)
);


}







function pdfListaBetoltes(){


let lista =
document.getElementById(
"pdfLista"
);


lista.innerHTML="";



PDF_ADATOK.forEach(pdf=>{


let napok =
datumSzamitas(pdf.ig);



let allapot="";
let osztaly="";



if(napok < 0){


allapot =
"🔴 LEJÁRT";

osztaly="red";


}

else if(napok <=30){


allapot =
"🟡 HAMAROSAN LEJÁR";


osztaly="yellow";


}

else{


allapot =
"🟢 AKTUÁLIS";


osztaly="green";


}





lista.innerHTML += `


<div class="card">


<h3>

${pdf.nev}

</h3>



Járat:
<b>
${pdf.jarat}
</b>


<br><br>


Érvényes:

<br>

${pdf.tol}

-

${pdf.ig}



<br><br>



Állapot:

<span class="${osztaly}">

${allapot}

</span>



<br>


${

napok>=0 ?

"Hátralévő idő: "+napok+" nap"

:

"Friss PDF szükséges!"

}



<br><br>


<button onclick="pdfMegnyitas('${pdf.fajl}')">

📄 PDF MEGNYITÁS

</button>



</div>


`;



});



}





function pdfMegnyitas(fajl){


window.open(
fajl,
"_blank"
);


}





// induláskor

pdfListaBetoltes();


</script>


</body>

</html>
