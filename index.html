<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<title>V17 UNIFIED DISPATCH + TIMETABLE ENGINE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{font-family:Arial;background:#0b1220;color:#e2e8f0;padding:20px}
button,input,select{padding:10px;margin:5px}
.box{background:#111827;padding:10px;margin-top:10px;border-radius:10px;overflow:auto}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #334155;padding:6px;font-size:12px}
.ok{color:#4ade80}
.bad{color:#f87171}
.title{font-size:20px;font-weight:bold}
.small{font-size:11px;color:#94a3b8}
</style>
</head>
<body>

<div class="title">🚍🚆🚌 V17 UNIFIED DISPATCH + TIMETABLE ENGINE</div>
<div class="small">👉 BKK + MÁV + VOLÁN | STOP + VISZONYLAT + MENETREND</div>

<input type="file" id="file" multiple />
<button onclick="loadGTFS()">📦 GTFS betöltés</button>
<button onclick="clearDB()">🧹 adatbázis törlés</button>

<input id="search" placeholder="🚏 megálló / viszonylat keresés..." oninput="globalSearch()" />

<select id="datasetSelect" onchange="switchDataset()"></select>

<div class="box" id="status">Várakozás...</div>
<div class="box" id="log"></div>

<h3>🌍 GTFS források</h3>
<div class="box" id="sources"></div>

<h3>🚏 Megálló adatok</h3>
<div class="box" id="stopInfo">Nincs kiválasztva</div>

<h3>📊 Menetrend (Viszonylat + Jármű)</h3>
<table id="timetable"></table>

<script>

let db = JSON.parse(localStorage.getItem("gtfs_db")||"{}");
let active=null;

function save(){localStorage.setItem("gtfs_db",JSON.stringify(db));}
function clearDB(){localStorage.removeItem("gtfs_db");db={};refresh();}
function log(m){document.getElementById('log').innerHTML+=m+"<br>";}
function setStatus(m){document.getElementById('status').innerHTML=m;}

function detectDelimiter(l){return l.includes("\t")?"\t":",";}
function split(l,d){let r=[],c="",q=false;for(let x of l){if(x==='"')q=!q;else if(x===d&&!q){r.push(c);c="";}else c+=x;}r.push(c);return r;}

function parseStops(text){
 const lines=text.split(/\r?\n/).filter(l=>l.trim());
 const d=detectDelimiter(lines[0]);
 const h=split(lines[0],d);
 const i={id:h.indexOf("stop_id"),name:h.indexOf("stop_name"),lat:h.indexOf("stop_lat"),lon:h.indexOf("stop_lon")};
 let out=[];
 for(let k=1;k<lines.length;k++){
  const p=split(lines[k],d);
  out.push({id:p[i.id],name:p[i.name],lat:p[i.lat],lon:p[i.lon]});
 }
 return out;
}

function detectSource(name){name=name.toLowerCase();if(name.includes("bkk"))return"BKK";if(name.includes("mav"))return"MÁV";if(name.includes("volan"))return"VOLÁN";return"UNKNOWN";}

async function loadGTFS(){
 const files=document.getElementById('file').files;
 for(let f of files){

  const key=f.name+"_"+f.size;
  if(db[key])continue;

  const buf=await f.arrayBuffer();
  const zip=await JSZip.loadAsync(buf);

  const stopsFile=Object.keys(zip.files).find(x=>x.includes("stops.txt"));
  const text=await zip.file(stopsFile).async("string");

  const stops=parseStops(text);
  const source=detectSource(f.name);

  db[key]={name:f.name,source,stops};
 }
 save();refresh();
}

function refresh(){
 const sel=document.getElementById('datasetSelect');
 sel.innerHTML="";
 for(let k in db){let o=document.createElement("option");o.value=k;o.text=db[k].source+" - "+db[k].name;sel.appendChild(o);}
 active=Object.keys(db)[0];sel.value=active;
 render();
}

function switchDataset(){active=document.getElementById('datasetSelect').value;render();}

function globalSearch(){
 const q=norm(document.getElementById('search').value);
 if(!q){render();return;}

 let all=Object.values(db).flatMap(d=>d.stops.map(s=>({...s,source:d.source})));
 let res=all.filter(s=>norm(s.name).includes(q)||norm(s.id).includes(q));
 render(res);
}

function norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}

function render(list){
 if(!active)return;
 const data=list||db[active].stops;

 let html=`<tr>
 <th>Viszonylat száma</th>
 <th>Iránya / cél</th>
 <th>Indul</th>
 <th>Eltérés</th>
 <th>Belső azonosító</th>
 <th>Jármű száma</th>
 <th>Jármű típus</th>
</tr>`;

 for(let i=0;i<Math.min(30,data.length);i++){
  const s=data[i];
  html+=`<tr>
   <td>—</td>
   <td>${s.name||"—"}</td>
   <td>—</td>
   <td>—</td>
   <td>${s.id||"—"}</td>
   <td>—</td>
   <td>${db[active].source||"—"}</td>
  </tr>`;
 }

 document.getElementById('timetable').innerHTML=html;

 document.getElementById('sources').innerHTML=
 Object.values(db).map(d=>"• "+d.source+" ("+d.stops.length+")").join("<br>");

 setStatus("🚀 V17 DISPATCH READY");
}

</script>

</body>
</html>
