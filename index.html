<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<title>V15 PERSISTENT DISPATCHER (BKK + MÁV + VOLÁN)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{font-family:Arial;background:#0b1220;color:#e2e8f0;padding:20px}
button,select,input{padding:10px;margin:5px}
.box{background:#111827;padding:10px;margin-top:10px;border-radius:10px;overflow:auto}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #334155;padding:6px;font-size:12px}
.ok{color:#4ade80}
.bad{color:#f87171}
.title{font-size:20px;font-weight:bold}
</style>
</head>
<body>

<div class="title">🚍🚆🚌 V15 PERSISTENT DISPATCHER ENGINE</div>
<div>👉 BKK + MÁV + VOLÁN (MENTETT MEMÓRIA + AUTO RESTORE)</div>

<input type="file" id="file" multiple />
<button onclick="loadAllGTFS()">📦 GTFS betöltés</button>
<button onclick="clearMemory()">🧹 Memória törlés</button>

<input id="search" placeholder="🚏 Megálló keresés..." oninput="searchStops()" />

<select id="datasetSelect" onchange="switchDataset()"></select>

<div class="box" id="status">Várakozás...</div>
<div class="box" id="log"></div>

<h3>🌍 Források (PERSISTENT)</h3>
<div class="box" id="sources"></div>

<h3>🚏 Megállók</h3>
<table id="stopsTable"></table>

<script>

// 🧠 PERSISTENT STORAGE
let datasets = JSON.parse(localStorage.getItem("gtfs_datasets") || "{}");
let active = null;

function log(m){document.getElementById('log').innerHTML+=m+"<br>";}
function setStatus(m,ok=true){document.getElementById('status').innerHTML=ok?"<span class='ok'>"+m+"</span>":"<span class='bad'>"+m+"</span>";}

function saveMemory(){
  localStorage.setItem("gtfs_datasets", JSON.stringify(datasets));
}

function clearMemory(){
  localStorage.removeItem("gtfs_datasets");
  datasets={};
  refresh();
  setStatus("🧹 memória törölve");
}

function detectDelimiter(l){return l.includes("\t")?"\t":",";}

function split(l,d){let r=[],c="",q=false;for(let x of l){if(x==='"')q=!q;else if(x===d&&!q){r.push(c);c="";}else c+=x;}r.push(c);return r;}

function parseStops(text){
 const lines=text.split(/\r?\n/).filter(l=>l.trim());
 const d=detectDelimiter(lines[0]);
 const h=split(lines[0],d);

 const i={
  id:h.indexOf("stop_id"),
  name:h.indexOf("stop_name"),
  lat:h.indexOf("stop_lat"),
  lon:h.indexOf("stop_lon")
 };

 let out=[];
 for(let k=1;k<lines.length;k++){
  const p=split(lines[k],d);
  out.push({id:p[i.id],name:p[i.name],lat:p[i.lat],lon:p[i.lon]});
 }
 return out;
}

function detectSource(name){
 name=name.toLowerCase();
 if(name.includes("bkk"))return "BKK";
 if(name.includes("mav"))return "MÁV";
 if(name.includes("volan"))return "VOLÁN";
 return "UNKNOWN";
}

async function loadAllGTFS(){
 const files=document.getElementById('file').files;
 if(!files.length){alert("Nincs fájl!");return;}

 for(let f of files){

  log("📦 betöltés: "+f.name);

  const buf=await f.arrayBuffer();

  if(buf.byteLength<50000){log("❌ hibás: "+f.name);continue;}

  const zip=await JSZip.loadAsync(buf);

  const stopsFile=Object.keys(zip.files).find(x=>x.toLowerCase().includes("stops.txt"));
  if(!stopsFile){log("❌ nincs stops: "+f.name);continue;}

  const text=await zip.file(stopsFile).async("string");

  const stops=parseStops(text);
  const source=detectSource(f.name);

  const key=source+"_"+Date.now();

  datasets[key]={name:f.name,source,stops};

  log("✅ "+source+" kész ("+stops.length+")");
 }

 saveMemory();
 refresh();
}

function refresh(){
 const sel=document.getElementById('datasetSelect');
 sel.innerHTML="";

 for(let k in datasets){
  let o=document.createElement("option");
  o.value=k;
  o.text=datasets[k].source+" - "+datasets[k].name;
  sel.appendChild(o);
 }

 const keys=Object.keys(datasets);
 if(keys.length){
  active=keys[0];
  sel.value=active;
 }

 render();
}

function switchDataset(){
 active=document.getElementById('datasetSelect').value;
 render();
}

function render(list){
 if(!active)return;
 const data=list || datasets[active].stops;

 let h="<tr><th>ID</th><th>Név</th><th>Lat</th><th>Lon</th></tr>";

 for(let i=0;i<Math.min(50,data.length);i++){
  const s=data[i];
  h+=`<tr>
   <td>${s.id||''}</td>
   <td>${s.name||''}</td>
   <td>${s.lat||''}</td>
   <td>${s.lon||''}</td>
  </tr>`;
 }

 document.getElementById('stopsTable').innerHTML=h;
 setStatus("🚀 V15 PERSISTENT READY (AUTO RESTORE ACTIVE)");

 document.getElementById('sources').innerHTML=
 Object.values(datasets).map(d=>"• "+d.source+" ("+d.stops.length+")").join("<br>");
}

function searchStops(){
 if(!active)return;
 const q=document.getElementById('search').value.toLowerCase();
 const data=datasets[active].stops;

 if(!q){render();return;}

 const filtered=data.filter(s=>
  (s.name||"").toLowerCase().includes(q) ||
  (s.id||"").toLowerCase().includes(q)
 );

 render(filtered);
}

// 🧠 AUTO RESTORE ON LOAD
window.onload=()=>{
 if(Object.keys(datasets).length){
  setStatus("🔄 GTFS visszatöltve memóriából");
 }
 refresh();
};

</script>

</body>
</html>
