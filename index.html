<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V5 LIVE GTFS-RT</title>

<style>
body{
    margin:0;
    font-family:-apple-system, Arial;
    background:#0b0f14;
    color:white;
}

header{
    padding:12px;
    background:#111a26;
    text-align:center;
    font-weight:bold;
    border-bottom:2px solid #1f2b3a;
}

.status{
    font-size:12px;
    opacity:0.7;
    margin-top:4px;
}

.container{
    padding:10px;
}

.card{
    background:#0f1622;
    border:1px solid #1d2a3a;
    border-radius:10px;
    margin-bottom:10px;
    padding:10px;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid #1b2635;
}

.badge{
    font-size:11px;
    padding:2px 6px;
    border-radius:4px;
}

.bkk{background:#1e88e5;}
.mav{background:#43a047;}
.volan{background:#fb8c00;}

.small{font-size:12px; opacity:0.7;}

.good{color:#4caf50;}
.mid{color:#ffb300;}
.bad{color:#ef5350;}

button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#2b7cff;
    color:white;
    font-size:14px;
}
</style>
</head>

<body>

<header>
🚦 FUTÁR V5 LIVE GTFS-RT
<div class="status" id="status">Inicializálás...</div>
</header>

<div class="container">

<button onclick="refresh()">🔄 Live frissítés</button>

<div id="feed"></div>

</div>

<script>

//////////////////////////////////////////////////////
// 🌐 GTFS-RT LIVE ENDPOINT KONFIG
// IDE TESZED A VALÓS ADATFORRÁSOKAT
//////////////////////////////////////////////////////

const GTFS_RT = {
    bkk: "https://YOUR-BKK-GTFS-RT-ENDPOINT",
    mav: "https://YOUR-MAV-GTFS-RT-ENDPOINT",
    volan: "https://YOUR-VOLAN-GTFS-RT-ENDPOINT"
};

//////////////////////////////////////////////////////
// 🧪 DEMO FALLBACK (ha nincs valós feed)
//////////////////////////////////////////////////////

const demoData = [
    {
        agency:"BKK",
        line:"7E",
        dest:"Blaha Lujza tér",
        delay:1
    },
    {
        agency:"MÁV",
        line:"IC 210",
        dest:"Debrecen",
        delay:3
    },
    {
        agency:"Volánbusz",
        line:"105",
        dest:"Érd",
        delay:-1
    }
];

//////////////////////////////////////////////////////
// 📡 SIMULÁLT GTFS-RT FETCH (REAL READY STRUCTURE)
//////////////////////////////////////////////////////

async function fetchGTFS(url){
    try{
        const res = await fetch(url);
        if(!res.ok) throw new Error("no feed");
        const data = await res.json();
        return data;
    }catch(e){
        return null;
    }
}

//////////////////////////////////////////////////////
// 🧠 LIVE MERGE ENGINE
//////////////////////////////////////////////////////

async function loadLive(){

    document.getElementById("status").innerText = "Live adat betöltés...";

    let all = [];

    // 🚍 BKK
    let bkk = await fetchGTFS(GTFS_RT.bkk);
    if(bkk){
        all = all.concat(bkk);
    }

    // 🚆 MÁV
    let mav = await fetchGTFS(GTFS_RT.mav);
    if(mav){
        all = all.concat(mav);
    }

    // 🚌 VOLÁN
    let volan = await fetchGTFS(GTFS_RT.volan);
    if(volan){
        all = all.concat(volan);
    }

    // fallback
    if(all.length === 0){
        all = demoData;
        document.getElementById("status").innerText =
            "DEMO MÓD (nincs GTFS-RT kapcsolat)";
    }else{
        document.getElementById("status").innerText =
            "LIVE GTFS-RT AKTÍV";
    }

    render(all);
}

//////////////////////////////////////////////////////
// 📊 UI RENDER
//////////////////////////////////////////////////////

function render(data){

    const feed = document.getElementById("feed");
    feed.innerHTML = "";

    data.forEach(d=>{

        let cls =
            d.agency==="BKK"?"bkk":
            d.agency==="MÁV"?"mav":"volan";

        let status =
            d.delay<=0?"good":
            d.delay<=2?"mid":"bad";

        feed.innerHTML += `
        <div class="card">
            <div class="row">
                <div>
                    <span class="badge ${cls}">${d.agency}</span>
                    <b> ${d.line}</b>
                    <div class="small">${d.dest}</div>
                </div>
                <div class="${status}">
                    ${d.delay} min
                </div>
            </div>
        </div>`;
    });
}

//////////////////////////////////////////////////////
// 🔄 REFRESH
//////////////////////////////////////////////////////

function refresh(){
    loadLive();
}

loadLive();

// auto refresh
setInterval(loadLive, 10000);

</script>

</body>
</html>
