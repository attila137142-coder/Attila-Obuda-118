<script>

/* ========================================
   REAL GTFS URL
======================================== */

const GTFS_URL =
"https://go.bkk.hu/api/static/v1/public-gtfs/budapest_gtfs.zip";

/* ========================================
   GLOBALS
======================================== */

let stops = [];
let routes = [];
let trips = [];
let stopTimes = [];

/* ========================================
   LOAD GTFS ZIP
======================================== */

async function loadGTFS(){

try{

const res = await fetch(GTFS_URL);

const blob = await res.blob();

const zip = await JSZip.loadAsync(blob);

stops = await parseCSV(zip, "stops.txt");
routes = await parseCSV(zip, "routes.txt");
trips = await parseCSV(zip, "trips.txt");
stopTimes = await parseCSV(zip, "stop_times.txt");

console.log("STOPS", stops.length);
console.log("ROUTES", routes.length);
console.log("TRIPS", trips.length);
console.log("STOP_TIMES", stopTimes.length);

initSearch();

showLoaded();

}
catch(err){

console.error(err);

document.getElementById(
"departures"
).innerHTML = `
<div class="error">
❌ GTFS betöltési hiba<br><br>
Lehetséges okok:<br>
- CORS tiltás<br>
- internet hiba<br>
- GTFS szerver nem elérhető
</div>
`;

}

}

/* ========================================
   CSV PARSER
======================================== */

async function parseCSV(zip, file){

const text =
await zip.file(file).async("string");

return Papa.parse(text, {
header:true,
skipEmptyLines:true
}).data;

}

/* ========================================
   SEARCH INIT
======================================== */

function initSearch(){

const search =
document.getElementById("search");

search.addEventListener("input", e => {

const q =
e.target.value.toLowerCase();

const results =
document.getElementById("results");

results.innerHTML = "";

if(q.length < 2){
return;
}

const filtered =
stops
.filter(stop => {

const name =
(stop.stop_name || "")
.toLowerCase();

const id =
(stop.stop_id || "")
.toLowerCase();

return (
name.includes(q)
||
id.includes(q)
);

})
.slice(0,50);

filtered.forEach(stop => {

const div =
document.createElement("div");

div.className = "result";

div.innerHTML = `
<div class="stopName">
🚏 ${stop.stop_name}
</div>

<div class="stopId">
GTFS: ${stop.stop_id}
</div>
`;

div.onclick = () => {
loadStop(stop);
};

results.appendChild(div);

});

});

}

/* ========================================
   LOAD STOP
======================================== */

function loadStop(stop){

console.log("LOAD STOP", stop);

const departures =
document.getElementById("departures");

const title =
document.getElementById("stopTitle");

const gtfs =
document.getElementById("gtfsId");

title.innerHTML = `🚏 ${stop.stop_name}`;

gtfs.innerHTML = `GTFS: ${stop.stop_id}`;

/* =====================
   REAL STOP TIMES
===================== */

const stopRows =
stopTimes
.filter(st => st.stop_id === stop.stop_id)
.slice(0,15);

if(stopRows.length === 0){

 departures.innerHTML = `
 <div class="row">
 <div>---</div>
 <div>Nincs indulási adat</div>
 <div>---</div>
 <div>---</div>
 <div>---</div>
 <div>---</div>
 </div>
 `;

 return;

}

let html = "";

stopRows.forEach(st => {

const trip =
trips.find(t => t.trip_id === st.trip_id);

const route =
routes.find(r =>
r.route_id === trip?.route_id
);

const line =
route?.route_short_name || "---";

const dir =
trip?.trip_headsign || "Ismeretlen irány";

/* =====================
   DEMO REALTIME STATUS
===================== */

const statuses = [
"early",
"ontime",
"late"
];

const random =
statuses[
Math.floor(Math.random()*3)
];

let realtimeHTML = "";

if(random === "early"){
realtimeHTML = `
<span class="early">
🔴 SIET 0p ${Math.floor(Math.random()*59)}mp
</span>
`;
}
else if(random === "late"){
realtimeHTML = `
<span class="late">
🔵 KÉSIK ${Math.floor(Math.random()*6)}p ${Math.floor(Math.random()*59)}mp
</span>
`;
}
else{
realtimeHTML = `
<span class="ontime">
${Math.floor(Math.random()*8)}p ${Math.floor(Math.random()*59)}mp
</span>
`;
}

html += `

<div class="row">

<div class="line">
${line}
</div>

<div>
${dir}
</div>

<div>
${realtimeHTML}
</div>

<div>
---
</div>

<div>
---
</div>

<div>
---
</div>

</div>

`;

});

 departures.innerHTML = html;

}

/* ========================================
   READY
======================================== */

function showLoaded(){

document.getElementById(
"stopTitle"
).innerHTML =
"🚏 GTFS betöltve";

}

loadGTFS();

</script>
