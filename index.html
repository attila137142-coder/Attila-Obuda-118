<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>SLOPE ULTRA V3.2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
body { margin:0; background:#111; color:#fff; font-family:Arial;}
#map { height:50vh;}
#panel { padding:10px;}
input,button { padding:10px; margin:5px;}
#results div { padding:5px; cursor:pointer; border-bottom:1px solid #333;}
#results div:hover { background:#333;}
table { width:100%; font-size:12px; border-collapse:collapse;}
td,th { border:1px solid #444; padding:4px;}
</style>
</head>
<body>

<div id="map"></div>

<div id="panel">
<input id="street" placeholder="pl: Hármashatárhegyi út / turista út">
<button onclick="search()">KERESÉS</button>
<button onclick="calc()">MEREDESÉG</button>

<div id="results"></div>

<table id="tbl">
<tr><th>#</th><th>Hossz (m)</th><th>Δh (m)</th><th>%</th></tr>
</table>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map = L.map('map').setView([47.4979,19.0402],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let coords = [];
let line;

// 🔍 KERESÉS + AUTO LOAD
async function search(){
  let q = street.value;

  let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q},Hungary&limit=5`);
  let data = await res.json();

  results.innerHTML="";

  if(data.length==0){
    alert("Nincs találat!");
    return;
  }

  data.forEach(p=>{
    let d=document.createElement("div");
    d.innerText=p.display_name;
    d.onclick=()=>load(p);
    results.appendChild(d);
  });

  // AUTO LOAD első
  await load(data[0]);
}

// 📍 ULTRA LOAD (turista utak + fallback)
async function load(p){
  map.setView([p.lat,p.lon],15);

  let q = `
  [out:json];
  (
    way["highway"~"primary|secondary|tertiary|residential|service"](around:1200,${p.lat},${p.lon});
    way["highway"~"path|footway|track"](around:1200,${p.lat},${p.lon});
  );
  out geom;
  `;

  let res = await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:q});
  let data = await res.json();

  if(data.elements.length==0){
    alert("Nincs út a közelben!");
    return;
  }

  // 🔥 leghosszabb út kiválasztása (stabilabb!)
  let best = data.elements.reduce((a,b)=>
    (b.geometry.length > a.geometry.length ? b : a)
  );

  coords = best.geometry.map(p=>[p.lat,p.lon]);

  if(line) map.removeLayer(line);
  line = L.polyline(coords,{color:"cyan"}).addTo(map);

  alert("Út betöltve ✔ (turista + közút)");
}

// ⛰️ MAGASSÁG (stabil mintavétel)
async function getElev(points){

  let step = Math.max(1, Math.floor(points.length/80));

  let sample = points.filter((_,i)=> i%step===0);

  let res = await fetch("https://api.open-elevation.com/api/v1/lookup",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      locations: sample.map(p=>({latitude:p[0],longitude:p[1]}))
    })
  });

  let data = await res.json();

  let elev=[];
  let j=0;

  for(let i=0;i<points.length;i++){
    if(i%step===0){
      elev.push(data.results[j].elevation);
      j++;
    } else {
      elev.push(elev[elev.length-1]);
    }
  }

  return elev;
}

// 📊 MEREDESÉG (BIZTOS KIÍRÁS)
async function calc(){

  if(coords.length<2){
    alert("Nincs út betöltve!");
    return;
  }

  let elev = await getElev(coords);

  tbl.innerHTML="<tr><th>#</th><th>Hossz (m)</th><th>Δh (m)</th><th>%</th></tr>";

  for(let i=0;i<coords.length-1;i++){

    let p1=coords[i];
    let p2=coords[i+1];

    let d = map.distance(p1,p2);
    let dh = elev[i+1]-elev[i];
    let slope = (dh/d)*100;

    let color="green";
    if(slope>5) color="orange";
    if(slope>10) color="red";

    L.polyline([p1,p2],{color:color,weight:5}).addTo(map);

    let row = tbl.insertRow();

    row.innerHTML=`
      <td>${i}</td>
      <td>${d.toFixed(1)}</td>
      <td>${dh.toFixed(1)}</td>
      <td>${slope.toFixed(2)}</td>
    `;
  }

  alert("KÉSZ ✔ Minden szakasz kiszámolva!");
}
</script>

</body>
</html>
