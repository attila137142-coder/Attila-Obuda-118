<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <title>POI ENGINE V3.6 STABLE UI CORE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin:0; font-family: Arial; overflow:hidden; }

    #map {
      height: 100vh;
      width: 100%;
      z-index: 0;
      position: absolute;
    }

    .panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 9999;
      background: white;
      padding: 12px;
      border-radius: 12px;
      width: 340px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
      pointer-events: auto;
    }

    input, button {
      width: 100%;
      margin: 5px 0;
      padding: 8px;
      font-size: 14px;
      pointer-events: auto;
      user-select: text;
    }

    .info { font-size: 12px; margin-top: 6px; }

    .poiBox {
      margin-top: 6px;
      padding: 6px;
      border-bottom: 1px solid #eee;
      font-size: 12px;
    }

    .small {
      font-size: 11px;
      color: #666;
    }
  </style>
</head>
<body>

<div class="panel">
  <h3>🟢 POI ENGINE V3.6 STABLE UI CORE</h3>

  <div id="gps">📍 GPS: betöltés...</div>
  <div id="speed">🚀 Sebesség: 0 km/h (0 m/s)</div>

  <input id="query" placeholder="POI keresés (pl. Drégelyvár, büfé, kilátó)" />

  <button onclick="scanNearbyPOI()">🔎 Környék POI keresés</button>

  <div class="small">📏 Minden POI távolság: m + km (0.01 km pontosság)</div>

  <div id="poiList" class="info"></div>
</div>

<div id="map"></div>

<script>

let map = L.map('map', { zoomControl: true }).setView([47.4979, 19.0402], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

let userMarker;
let lastPos = null;
let lastUpdateTime = null;
let watchFollow = true;

// --- GPS STABLE WATCH (throttled) ---
function haversine(a, b) {
  const R = 6371000;
  const toRad = x => x * Math.PI / 180;

  const dLat = toRad(b.lat - a.lat);
  const dLon = toRad(b.lon - a.lon);

  const x = Math.sin(dLat/2)**2 +
            Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) *
            Math.sin(dLon/2)**2;

  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

navigator.geolocation.watchPosition(pos => {

  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;

  const now = Date.now();

  // SPEED
  let speedMS = pos.coords.speed || 0;
  let speedKMH = speedMS * 3.6;

  document.getElementById("gps").innerHTML =
    `📍 GPS: ${lat.toFixed(6)}, ${lon.toFixed(6)}`;

  document.getElementById("speed").innerHTML =
    `🚀 Sebesség: ${speedKMH.toFixed(2)} km/h (${speedMS.toFixed(2)} m/s)`;

  // marker
  if (!userMarker) {
    userMarker = L.marker([lat, lon]).addTo(map).bindPopup("📍 Te itt vagy");
  } else {
    userMarker.setLatLng([lat, lon]);
  }

  // IMPORTANT: NO forced setView spam
  if (watchFollow) {
    map.setView([lat, lon], map.getZoom());
  }

  lastPos = {lat, lon};
  lastUpdateTime = now;

}, err => console.log(err), { enableHighAccuracy: true });

// --- POI SCAN ---
async function scanNearbyPOI() {
  if (!lastPos) return;

  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=20&extratags=1&addressdetails=1&viewbox=${lastPos.lon-0.02},${lastPos.lat+0.02},${lastPos.lon+0.02},${lastPos.lat-0.02}&bounded=1`;

  const res = await fetch(url);
  const data = await res.json();

  let html = "";

  data.forEach(poi => {
    const lat = parseFloat(poi.lat);
    const lon = parseFloat(poi.lon);

    const distM = haversine(lastPos, {lat, lon});
    const distKM = distM / 1000;

    html += `
      <div class="poiBox">
        📍 ${poi.display_name}<br>
        📏 ${distM.toFixed(0)} m (${distKM.toFixed(2)} km)
      </div>
    `;

    L.circleMarker([lat, lon]).addTo(map);
  });

  document.getElementById("poiList").innerHTML = html;
}

</script>

</body>
</html>
