<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V7 V3 – CONTROL ROOM</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#05080d;
  color:#d7e1ff;
}

header {
  padding:14px;
  background:#0f1722;
  font-weight:bold;
  font-size:18px;
}

.container {
  display:flex;
  height:92vh;
}

/* PANELS */
.panel {
  flex:1;
  padding:10px;
  overflow:auto;
  border-right:1px solid #1a2a3a;
}

/* BIG CLOCK */
.bigClock {
  font-size:48px;
  font-weight:bold;
  color:#00ff99;
  text-align:center;
  margin:10px 0;
}

/* LIVE BADGE */
.live {
  color:#00ff99;
  font-weight:bold;
}

.small {
  font-size:12px;
  opacity:0.7;
}

/* ITEMS */
.item {
  padding:8px;
  border-bottom:1px solid #1b2a3a;
  cursor:pointer;
}
.item:hover { background:#122033; }

.badge {
  background:#1a2a3a;
  padding:3px 6px;
  font-size:11px;
  border-radius:4px;
}
</style>
</head>

<body>

<header>🚦 FUTÁR V7 V3 – TRUE CONTROL ROOM + LIVE VEHICLE TRACKING</header>

<div class="container">

<!-- LEFT -->
<div class="panel">
<h3>📍 LIVE GPS POSITION</h3>

<button onclick="getGPS()">📡 Saját pozíció lekérése</button>

<div id="gps" class="small">Nincs GPS adat</div>

<div id="address" class="small"></div>

<hr>

<h3>🚏 STOP SEARCH</h3>
<input id="search" oninput="fakeSearch()" placeholder="megálló keresés...">

<div id="results"></div>
</div>

<!-- CENTER -->
<div class="panel">
<h3>🟢 CONTROL ROOM CLOCK</h3>

<div class="bigClock" id="clock">--:--:--</div>

<h3>📡 LIVE VEHICLE FEED (SIM / CORE)</h3>
<div id="vehicles"></div>
</div>

<!-- RIGHT -->
<div class="panel">
<h3>📊 DISPATCH STATUS</h3>

<div id="status"></div>
</div>

</div>

<script>

// ---------------- CLOCK ----------------
setInterval(()=>{
  document.getElementById("clock").innerText =
    new Date().toLocaleTimeString();
  simulateVehicles();
},1000);

// ---------------- GPS ----------------
function getGPS(){
  if(!navigator.geolocation){
    alert("Nincs GPS API");
    return;
  }

  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    document.getElementById("gps").innerHTML =
      `📍 LAT: ${lat}<br>📍 LON: ${lon}`;

    // reverse geocoding (OpenStreetMap Nominatim)
    const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`;

    const res = await fetch(url);
    const data = await res.json();

    document.getElementById("address").innerHTML =
      `🏙 ${data.address.city || data.address.town || ""}<br>
       🛣 ${data.address.road || ""} ${data.address.house_number || ""}`;
  });
}

// ---------------- FAKE STOP SEARCH ----------------
function fakeSearch(){
  const q = document.getElementById("search").value;
  const out = document.getElementById("results");
  out.innerHTML = "";

  for(let i=0;i<5;i++){
    const div = document.createElement("div");
    div.className="item";
    div.innerHTML = "🚏 " + q + " STOP " + (i+1);
    out.appendChild(div);
  }
}

// ---------------- VEHICLE SIMULATION ----------------
function simulateVehicles(){
  const out = document.getElementById("vehicles");
  out.innerHTML = "";

  const now = Date.now();

  for(let i=0;i<6;i++){
    const speed = 20 + Math.random()*40;
    const delay = Math.floor(Math.random()*10);

    const status =
      delay < 3 ? "🟢 ON TIME"
      : delay < 7 ? "🟡 DELAYED"
      : "🔴 HEAVY DELAY";

    const lat = 47.49 + Math.random()*0.02;
    const lon = 19.05 + Math.random()*0.02;

    out.innerHTML += `
      <div class="item">
        🚌 VEH-${100+i}
        <span class="badge">${status}</span><br>
        <span class="small">
          📍 ${lat.toFixed(5)}, ${lon.toFixed(5)}<br>
          🚀 ${speed.toFixed(1)} km/h
        </span>
      </div>
    `;
  }

  document.getElementById("status").innerHTML = `
    🟢 Aktív járművek: 6<br>
    ⏱ Frissítés: LIVE (1s tick)<br>
    📡 GPS + SIM FUSION ENGINE
  `;
}

simulateVehicles();

</script>

</body>
</html>
