<script>


// ======================================
// ATTILA DESKTOP WEATHER CLOCK V2.2
// STABLE ENGINE
// ======================================



// ------------------------------
// ÓRA + DÁTUM
// ------------------------------


function updateClock(){


const now = new Date();



let h =
String(now.getHours()).padStart(2,"0");


let m =
String(now.getMinutes()).padStart(2,"0");


let s =
String(now.getSeconds()).padStart(2,"0");



document.getElementById("clock").innerHTML =
h+":"+m+":"+s;




const days = [

"VASÁRNAP",
"HÉTFŐ",
"KEDD",
"SZERDA",
"CSÜTÖRTÖK",
"PÉNTEK",
"SZOMBAT"

];



const months=[

"JANUÁR",
"FEBRUÁR",
"MÁRCIUS",
"ÁPRILIS",
"MÁJUS",
"JÚNIUS",
"JÚLIUS",
"AUGUSZTUS",
"SZEPTEMBER",
"OKTÓBER",
"NOVEMBER",
"DECEMBER"

];



document.getElementById("weekday").innerHTML =
days[now.getDay()];



document.getElementById("date").innerHTML =
now.getFullYear()
+". "
+
months[now.getMonth()]
+
" "
+
now.getDate()
+
".";

}



setInterval(updateClock,1000);

updateClock();





// ------------------------------
// GPS
// ------------------------------


let latitude = 47.750000;

let longitude = 19.079900;




function startGPS(){



if(!navigator.geolocation){


document.getElementById("gpsStatus")
.innerHTML =
"GPS nem elérhető";


loadWeather();

return;

}




navigator.geolocation.getCurrentPosition(


function(position){



latitude =
position.coords.latitude;


longitude =
position.coords.longitude;



document.getElementById("gpsStatus")
.innerHTML =
"🟢 AKTÍV";



document.getElementById("accuracy")
.innerHTML =
Math.round(position.coords.accuracy)
+
" m";



document.getElementById("coordinates")
.innerHTML =

latitude.toFixed(6)
+
", "
+
longitude.toFixed(6);




getAddress();



loadWeather();



},



function(){



document.getElementById("gpsStatus")
.innerHTML =
"⚠️ Tartalék hely";


getAddress();


loadWeather();



},



{


enableHighAccuracy:true,

timeout:10000,

maximumAge:60000


}



);



}







// ------------------------------
// CÍM LEKÉRÉS
// OpenStreetMap
// ------------------------------


async function getAddress(){



try{


let url =

"https://nominatim.openstreetmap.org/reverse?format=json&lat="
+
latitude
+
"&lon="
+
longitude
+
"&zoom=18&addressdetails=1";




let response =
await fetch(url);



let data =
await response.json();



let a =
data.address;




let city =

a.city ||
a.town ||
a.village ||
a.municipality ||
"Ismeretlen";



let road =

a.road ||
"";



let house =

a.house_number ||
"";




document.getElementById("location")
.innerHTML =


city
+
"<br>"
+
road
+
" "
+
house;



}


catch(e){



document.getElementById("location")
.innerHTML =
"Nem elérhető";

}



}






// ------------------------------
// IDŐJÁRÁS
// ------------------------------



async function loadWeather(){



let url =


"https://api.open-meteo.com/v1/forecast?"
+
"latitude="
+
latitude
+
"&longitude="
+
longitude
+
"&current="
+
"temperature_2m,"
+
"relative_humidity_2m,"
+
"apparent_temperature,"
+
"wind_speed_10m,"
+
"weather_code"
+
"&daily="
+
"temperature_2m_min,"
+
"temperature_2m_max,"
+
"sunrise,"
+
"sunset,"
+
"uv_index_max,"
+
"precipitation_sum,"
+
"wind_gusts_10m_max"
+
"&timezone=Europe%2FBudapest";




try{


let response =
await fetch(url);



let data =
await response.json();




// aktuális


document.getElementById("temperature")
.innerHTML =

data.current.temperature_2m.toFixed(1)
+
" °C";



document.getElementById("currentTemp")
.innerHTML =

data.current.temperature_2m.toFixed(1);



document.getElementById("feels")
.innerHTML =

data.current.apparent_temperature.toFixed(1);



document.getElementById("humidity")
.innerHTML =

data.current.relative_humidity_2m;



document.getElementById("wind")
.innerHTML =

data.current.wind_speed_10m.toFixed(1);





// napi


document.getElementById("minTemp")
.innerHTML =

data.daily.temperature_2m_min[0]
.toFixed(1);



document.getElementById("maxTemp")
.innerHTML =

data.daily.temperature_2m_max[0]
.toFixed(1);



document.getElementById("dailyMM")
.innerHTML =

data.daily.temperature_2m_min[0]
.toFixed(1)
+
" °C / "
+
data.daily.temperature_2m_max[0]
.toFixed(1)
+
" °C";





document.getElementById("sunrise")
.innerHTML =

data.daily.sunrise[0]
.split("T")[1];



document.getElementById("sunset")
.innerHTML =

data.daily.sunset[0]
.split("T")[1];



document.getElementById("uv")
.innerHTML =

data.daily.uv_index_max[0];



document.getElementById("rain")
.innerHTML =

data.daily.precipitation_sum[0]
.toFixed(1);



document.getElementById("gust")
.innerHTML =

data.daily.wind_gusts_10m_max[0]
.toFixed(1);



document.getElementById("weatherText")
.innerHTML =

weatherCode(data.current.weather_code);



document.getElementById("update")
.innerHTML =

new Date()
.toLocaleTimeString("hu-HU");



}



catch(error){



console.log(error);



document.getElementById("weatherText")
.innerHTML =
"Részleges adat";

}



}





function weatherCode(code){


if(code===0)
return "☀️ Derült";


if(code<=3)
return "⛅ Felhős";


if(code<=67)
return "🌧 Eső";


if(code<=82)
return "🌦 Zápor";


if(code>=95)
return "⛈ Zivatar";


return "🌤 Ismeretlen";


}





// INDÍTÁS


startGPS();



// frissítés 15 percenként


setInterval(loadWeather,900000);



console.log(
"ATTILA DESKTOP WEATHER CLOCK V2.2 STABLE AKTÍV"
);



</script>
