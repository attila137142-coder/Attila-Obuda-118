<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>GTFS INDEX ENGINE V1</title>
</head>

<body>
<input type="file" id="file">
<pre id="log">INDEX ENGINE READY</pre>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>

/* =========================
   🧠 STORAGE
========================= */

let GTFS = {
  stops: [],
  trips: [],
  stop_times: [],
  routes: []
};

let INDEX = {
  stop: {},
  trip: {},
  route: {}
};

/* =========================
   📦 CSV PARSER
========================= */

function parse(text){

  const lines = text.trim().split("\n");
  const h = lines[0].split(",");

  return lines.slice(1).map(l=>{
    const o = {};
    l.split(",").forEach((v,i)=>o[h[i]]=v);
    return o;
  });
}

/* =========================
   🧠 BUILD STOP INDEX
========================= */

function buildStopIndex(){

  INDEX.stop = {};

  GTFS.stop_times.forEach(st=>{

    if(!INDEX.stop[st.stop_id])
      INDEX.stop[st.stop_id] = [];

    INDEX.stop[st.stop_id].push({
      trip_id: st.trip_id,
      time: st.departure_time
    });
  });

}

/* =========================
   🧠 BUILD TRIP INDEX
========================= */

function buildTripIndex(){

  INDEX.trip = {};

  GTFS.stop_times.forEach(st=>{

    if(!INDEX.trip[st.trip_id])
      INDEX.trip[st.trip_id] = [];

    INDEX.trip[st.trip_id].push({
      stop_id: st.stop_id,
      time: st.departure_time
    });
  });

}

/* =========================
   🧠 TIME ENGINE
========================= */

function toSec(t){
  const p = t.split(":");
  return (+p[0])*3600 + (+p[1])*60 + (+p[2]||0);
}

function nowSec(){
  const d = new Date();
  return d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds();
}

/* =========================
   🚏 QUERY ENGINE
========================= */

function getDepartures(stop_id){

  const list = INDEX.stop[stop_id] || [];
  const now = nowSec();

  return list
    .map(d=>({
      trip:d.trip_id,
      time:d.time,
      diff:toSec(d.time)-now
    }))
    .sort((a,b)=>a.diff-b.diff)
    .slice(0,10);
}

/* =========================
   🧭 VIEW FILTER (ÓBUDA–SZENTENDRE)
========================= */

function applyFilter(){

  const allowedStops = ["BKS","KAS","OBU","AQI","RUF","SZT"];

  let out = "";

  allowedStops.forEach(s=>{

    const dep = getDepartures(s);

    dep.forEach(d=>{
      out += `${s} | ${d.trip} | ${d.time} | ${d.diff}\n`;
    });

  });

  document.getElementById("log").innerText = out;

}

/* =========================
   📦 LOAD GTFS
========================= */

document.getElementById("file").addEventListener("change", async e=>{

  const zip = await JSZip.loadAsync(e.target.files[0]);

  GTFS.stops = parse(await zip.file("stops.txt").async("string"));
  GTFS.trips = parse(await zip.file("trips.txt").async("string"));
  GTFS.stop_times = parse(await zip.file("stop_times.txt").async("string"));

  buildStopIndex();
  buildTripIndex();

  applyFilter();

});

</script>
</body>
</html>
