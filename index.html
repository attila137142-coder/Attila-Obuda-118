<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FAILSAFE CONTROL ROOM V2.1 LIVE</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
overflow:hidden;
}

header{
height:55px;
background:#111827;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
font-size:22px;
font-weight:bold;
border-bottom:2px solid #1f2937;
}

.layout{
display:grid;
grid-template-columns:380px 1fr;
height:calc(100vh - 55px);
}

.left{
background:#111827;
overflow:auto;
padding:10px;
border-right:2px solid #1f2937;
}

.right{
overflow:auto;
padding:10px;
background:#0f172a;
}

.box{
background:#1e293b;
border-radius:10px;
padding:12px;
margin-bottom:12px;
}

.row{
display:flex;
justify-content:space-between;
padding:8px;
border-bottom:1px solid rgba(255,255,255,0.08);
font-size:13px;
}

.green{color:#7CFF7C;font-weight:bold;}
.blue{color:#4da6ff;font-weight:bold;}
.red{color:#ff6666;font-weight:bold;}
.yellow{color:#ffd966;font-weight:bold;}

button{
background:#2563eb;
color:white;
border:none;
padding:8px 10px;
border-radius:6px;
margin:3px;
cursor:pointer;
font-weight:bold;
width:100%;
}

button:hover{background:#3b82f6;}

.small{font-size:11px;opacity:0.8;}

input{
width:100%;
padding:8px;
border:none;
border-radius:6px;
margin-top:6px;
}

</style>
</head>

<body>

<header>
<div>🚍 FAILSAFE CONTROL ROOM V2.1 LIVE</div>
<div id="clock"></div>
</header>

<div class="layout">

<!-- LEFT -->
<div class="left">

<div class="box">
<h3>🔍 MEGÁLLÓ KERESŐ</h3>
<input id="searchBox" placeholder="Pl: Nád utca / Magnólia utca" oninput="search(this.value)">
</div>

<div class="box">
<h3>🚏 INDULÁSOK</h3>
<div id="departures"></div>
</div>

</div>

<!-- RIGHT -->
<div class="right">

<div class="box">
<h3>🧠 STATUS</h3>
<div id="statusBox"></div>
</div>

</div>

</div>

<script>

/* =========================
CLOCK
========================= */
setInterval(()=>{
document.getElementById("clock").innerText =
new Date().toLocaleTimeString();
},1000);

/* =========================
DATA (REALISTIC FIXED CORE)
========================= */

const STOPS = [
{id:"S1",name:"Nád utca"},
{id:"S2",name:"Magnólia utca"},
{id:"S3",name:"Flórián tér"}
];

const TRIPS = [
{id:"T1",route:"34",dir:"Aquincum",veh:"BUS-1001"},
{id:"T2",route:"134",dir:"Újpest",veh:"BUS-1002"},
{id:"T3",route:"106",dir:"Gellért tér",veh:"BUS-1003"}
];

/* scheduled seconds from midnight (REAL BASE) */
const STOP_TIMES = [
{stop:"S1",trip:"T1",sec: (new Date().getHours()*3600 + new Date().getMinutes()*60 + 60)},
{stop:"S1",trip:"T2",sec: (new Date().getHours()*3600 + new Date().getMinutes()*60 + 180)},
{stop:"S2",trip:"T3",sec: (new Date().getHours()*3600 + new Date().getMinutes()*60 + 300)}
];

/* =========================
REAL TIME ENGINE
========================= */

function nowSec(){
const d = new Date();
return d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds();
}

function calcDelay(sec){
let diff = sec - nowSec();

// clamp (NO CHAOS)
if(diff > 600) diff = 600;
if(diff < -600) diff = -600;

return diff;
}

/* =========================
STATUS ENGINE
========================= */

function status(diff){

if(diff < -120)
return {txt:"🔴 SIET "+Math.abs(diff)+"s",cls:"red"};

if(diff <= 120)
return {txt:"🟡 IDŐBEN",cls:"yellow"};

return {txt:"🔵 KÉSÉS +"+diff+"s",cls:"blue"};
}

/* =========================
RENDER
========================= */

function render(list){

let html="";

list.forEach(x=>{

const trip = TRIPS.find(t=>t.id===x.trip);

if(!trip) return;

const diff = calcDelay(x.sec);
const st = status(diff);

html+=`
<div class="row">
<div>
<b>${trip.route}</b>
<div class="small">${trip.dir}</div>
<div class="small">${trip.veh}</div>
</div>

<div>
<div class="${st.cls}">${st.txt}</div>
<div class="small">${new Date(x.sec*1000).toLocaleTimeString()}</div>
</div>
</div>
`;

});

document.getElementById("departures").innerHTML = html;
}

/* =========================
SEARCH
========================= */

function search(q){

q=q.toLowerCase();

const stop = STOPS.find(s=>s.name.toLowerCase().includes(q));

if(!stop){
document.getElementById("departures").innerHTML="❌ nincs találat";
return;
}

render(STOP_TIMES.filter(s=>s.stop===stop.id));
}

/* =========================
AUTO LOOP (LIVE)
========================= */

setInterval(()=>{

render(STOP_TIMES);

document.getElementById("statusBox").innerHTML=
"🟢 LIVE ENGINE OK<br>🕒 "+new Date().toLocaleTimeString();

},2000);

/* INIT */
render(STOP_TIMES);

</script>

</body>
</html>
