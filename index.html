<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATTILA KÖZLEKEDÉS – BKK REALTIME VADÁSZ TESZT</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{box-sizing:border-box}
html,body{
margin:0;
height:100%;
font-family:Arial,Helvetica,sans-serif;
background:#111;
color:#fff;
}

#map{
position:absolute;
top:65px;
bottom:0;
left:0;
right:350px;
}

#side{
position:absolute;
top:65px;
right:0;
bottom:0;
width:350px;
background:#1b1b1b;
overflow:auto;
border-left:2px solid #333;
padding:10px;
}

header{
position:absolute;
top:0;
left:0;
right:0;
height:65px;
background:#202020;
display:flex;
align-items:center;
padding:8px;
gap:8px;
z-index:9999;
flex-wrap:wrap;
}

button{
background:#0b7dda;
color:white;
border:none;
padding:8px 10px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#1993ff;
}

input{
padding:8px;
border-radius:6px;
border:1px solid #666;
background:#2b2b2b;
color:white;
}

.badge{
padding:5px 8px;
border-radius:6px;
font-size:12px;
font-weight:bold;
}

.ok{background:#0c8c3d;}
.err{background:#b71c1c;}
.wait{background:#8a6d00;}

.panel{
background:#242424;
padding:8px;
margin-bottom:10px;
border-radius:10px;
}

.panel h3{
margin:0 0 8px;
}

.row{
display:flex;
justify-content:space-between;
padding:4px 0;
border-bottom:1px solid #333;
font-size:13px;
}

#vehicles{
max-height:260px;
overflow:auto;
}

.vehicle{
padding:7px;
border-bottom:1px solid #333;
cursor:pointer;
}

.vehicle:hover{
background:#333;
}

#log{
font-family:Consolas;
font-size:11px;
white-space:pre-wrap;
color:#9cff9c;
}

@media(max-width:900px){

#map{
right:0;
bottom:40%;
}

#side{
width:100%;
height:40%;
top:auto;
border-left:none;
border-top:2px solid #444;
}

}
</style>

</head>
<body>

<header>

<b>🚍 ATTILA KÖZLEKEDÉS – BKK VADÁSZ TESZT</b>

<span id="feedState" class="badge wait">
FEED NINCS TESZTELVE
</span>

<span id="gpsState" class="badge wait">
GPS NINCS
</span>

<input id="apiKey" type="password" placeholder="BKK API kulcs">

<button onclick="saveKey()">
💾 Mentés
</button>

<button onclick="testFeed()">
📡 FEED TESZT
</button>

<button onclick="startGPS()">
📍 GPS
</button>

<button onclick="toggleAuto()">
🔄 AUTO
</button>

</header>

<div id="map"></div>

<div id="side">

<div class="panel">

<h3>📡 Realtime állapot</h3>

<div class="row">
<span>Forrás</span>
<span>BKK GTFS-RT</span>
</div>

<div class="row">
<span>Feed</span>
<span>VehiclePositions.pb</span>
</div>

<div class="row">
<span>HTTP</span>
<span id="http">-</span>
</div>

<div class="row">
<span>Utolsó lekérés</span>
<span id="lastFetch">-</span>
</div>

<div class="row">
<span>Járművek</span>
<span id="count">0</span>
</div>

</div>

<div class="panel">

<h3>📍 Saját GPS</h3>

<div class="row">
<span>Lat</span>
<span id="lat">-</span>
</div>

<div class="row">
<span>Lon</span>
<span id="lon">-</span>
</div>

<div class="row">
<span>Pontosság</span>
<span id="acc">-</span>
</div>

<div class="row">
<span>Legközelebbi</span>
<span id="near">-</span>
</div>

</div>

<div class="panel">

<h3>🚍 Valódi járművek</h3>

<div id="vehicles">

Még nincs lekérdezés.

</div>

</div>

<div class="panel">

<h3>🧪 Napló</h3>

<div id="log"></div>

</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/protobufjs/dist/protobuf.min.js"></script>

<script>

const VEHICLE_URL=
"https://go.bkk.hu/api/query/v1/ws/gtfs-rt/full/VehiclePositions.pb";

const PROTO_URL=
"https://raw.githubusercontent.com/google/transit/master/gtfs-realtime/proto/gtfs-realtime.proto";

const map=L.map("map").setView([47.4979,19.0402],11);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(map);

const layer=L.layerGroup().addTo(map);

let myMarker=null;
let myPos=null;
let autoTimer=null;
let protoRoot=null;

function log(t){

const box=document.getElementById("log");

box.textContent=
"["+new Date().toLocaleTimeString("hu-HU")+"] "+t+"\n"+box.textContent;

}

function saveKey(){

localStorage.setItem(
"ATTILA_BKK_API_KEY",
document.getElementById("apiKey").value
);

log("API kulcs mentve.");

}

document.getElementById("apiKey").value=
localStorage.getItem("ATTILA_BKK_API_KEY")||"";

function setFeed(txt,cls){

const b=document.getElementById("feedState");

b.textContent=txt;

b.className="badge "+cls;

}

async function loadProto(){

if(protoRoot) return protoRoot;

protoRoot=await protobuf.load(PROTO_URL);

return protoRoot;

}

function startGPS(){

navigator.geolocation.getCurrentPosition(p=>{

myPos={
lat:p.coords.latitude,
lon:p.coords.longitude
};

document.getElementById("lat").textContent=myPos.lat.toFixed(6);
document.getElementById("lon").textContent=myPos.lon.toFixed(6);
document.getElementById("acc").textContent=Math.round(p.coords.accuracy)+" m";

document.getElementById("gpsState").textContent="GPS OK";
document.getElementById("gpsState").className="badge ok";

if(myMarker)
myMarker.setLatLng([myPos.lat,myPos.lon]);
else
myMarker=L.circleMarker(
[myPos.lat,myPos.lon],
{radius:8}
).addTo(map);

map.setView([myPos.lat,myPos.lon],15);

log("GPS OK.");

},e=>{

document.getElementById("gpsState").textContent="GPS HIBA";
document.getElementById("gpsState").className="badge err";

log(e.message);

},
{
enableHighAccuracy:true
});

}

function km(a,b){

const R=6371;

const dLat=(b.lat-a.lat)*Math.PI/180;

const dLon=(b.lon-a.lon)*Math.PI/180;

const x=Math.sin(dLat/2)**2+
Math.cos(a.lat*Math.PI/180)*
Math.cos(b.lat*Math.PI/180)*
Math.sin(dLon/2)**2;

return 2*R*Math.asin(Math.sqrt(x));

}

async function testFeed(){

const key=
document.getElementById("apiKey").value.trim();

if(!key){

setFeed("API KULCS HIÁNYZIK","err");

log("Adj meg BKK API kulcsot.");

return;

}

document.getElementById("lastFetch").textContent=
new Date().toLocaleTimeString("hu-HU");

setFeed("LEKÉRÉS...","wait");

try{

const r=await fetch(
VEHICLE_URL+"?key="+encodeURIComponent(key),
{
cache:"no-store"
}
);

document.getElementById("http").textContent=r.status;

if(!r.ok)
throw new Error("HTTP "+r.status);

const buffer=await r.arrayBuffer();

await loadProto();

const Feed=
protoRoot.lookupType("transit_realtime.FeedMessage");

const feed=Feed.decode(new Uint8Array(buffer));

layer.clearLayers();

const list=document.getElementById("vehicles");

list.innerHTML="";

let db=0;

for(const e of feed.entity){

if(!e.vehicle||!e.vehicle.position) continue;

const v=e.vehicle;
const p=v.position;

db++;

const marker=L.circleMarker(
[p.latitude,p.longitude],
{
radius:6
}
).addTo(layer);

marker.bindPopup(
"<b>Jármű:</b> "+(v.vehicle?.id||"-")+
"<br><b>Trip:</b> "+(v.trip?.tripId||"-")+
"<br><b>Route:</b> "+(v.trip?.routeId||"-")+
"<br><b>GPS:</b> "+
Number(p.latitude).toFixed(6)+
", "+
Number(p.longitude).toFixed(6)
);

const div=document.createElement("div");

div.className="vehicle";

let dist="-";

if(myPos)
dist=km(
myPos,
{
lat:p.latitude,
lon:p.longitude
}
).toFixed(2)+" km";

div.innerHTML=
"<b>🚍 "+
(v.vehicle?.label||
v.trip?.routeId||
v.vehicle?.id||
"Jármű")+
"</b><br>"+
"Távolság: "+dist+
"<br>GPS: "+
Number(p.latitude).toFixed(6)+
", "+
Number(p.longitude).toFixed(6);

div.onclick=()=>{

map.setView([p.latitude,p.longitude],16);

marker.openPopup();

};

list.appendChild(div);

}

document.getElementById("count").textContent=db;

setFeed("FEED OK ("+db+")","ok");

log("Valódi rekordok: "+db);

}catch(e){

setFeed("FEED HIBA","err");

log(e.message);

}

}
/* =========================================================
   ATTILA KÖZLEKEDÉS
   BKK REALTIME VADÁSZ TESZT
   2. RÉSZ
   ========================================================= */

function toggleAuto(){

if(autoTimer){

clearInterval(autoTimer);

autoTimer=null;

log("AUTO frissítés LEÁLLÍTVA.");

return;

}

log("AUTO frissítés ELINDÍTVA – 10 másodperc.");

testFeed();

autoTimer=setInterval(
testFeed,
10000
);

}


/* ---------------------------------------------------------
   GPS folyamatos figyelése
   --------------------------------------------------------- */

function watchGPS(){

if(!navigator.geolocation){

log("A böngésző nem támogatja a GPS-t.");

return;

}

navigator.geolocation.watchPosition(

p=>{

myPos={
lat:p.coords.latitude,
lon:p.coords.longitude
};

document.getElementById("lat").textContent=
p.coords.latitude.toFixed(6);

document.getElementById("lon").textContent=
p.coords.longitude.toFixed(6);

document.getElementById("acc").textContent=
Math.round(p.coords.accuracy)+" m";

document.getElementById("gpsState").textContent=
"GPS OK";

document.getElementById("gpsState").className=
"badge ok";

if(myMarker){

myMarker.setLatLng([
p.coords.latitude,
p.coords.longitude
]);

}else{

myMarker=
L.circleMarker(
[
p.coords.latitude,
p.coords.longitude
],
{
radius:9,
weight:3,
fillOpacity:.6
}
).addTo(map);

}

},

e=>{

document.getElementById("gpsState").textContent=
"GPS HIBA";

document.getElementById("gpsState").className=
"badge err";

log(
"GPS hiba: "+
e.message
);

},

{
enableHighAccuracy:true,
maximumAge:3000,
timeout:15000
}

);

}


/* ---------------------------------------------------------
   A járműlista újrarendezése saját GPS alapján
   --------------------------------------------------------- */

function refreshNearest(){

if(!myPos){

document.getElementById("near").textContent=
"-";

return;

}

const items=
document.querySelectorAll(".vehicle");

let nearest=null;
let nearestDistance=Infinity;

items.forEach(el=>{

const lat=parseFloat(
el.dataset.lat
);

const lon=parseFloat(
el.dataset.lon
);

if(!Number.isFinite(lat)||
!Number.isFinite(lon))
return;

const d=km(
myPos,
{
lat:lat,
lon:lon
}
);

if(d<nearestDistance){

nearestDistance=d;
nearest=el;

}

});

if(nearest){

document.getElementById("near").textContent=
nearestDistance.toFixed(2)+
" km";

}

}


/* ---------------------------------------------------------
   A korábbi testFeed lecserélése részletesebb változatra
   --------------------------------------------------------- */

async function testFeed(){

const key=
document.getElementById("apiKey")
.value
.trim();

if(!key){

setFeed(
"API KULCS HIÁNYZIK",
"err"
);

document.getElementById("http")
.textContent="-";

document.getElementById("count")
.textContent="-";

log(
"NINCS API-KULCS – nincs feed lekérés."
);

return;

}

const start=
performance.now();

document.getElementById("lastFetch")
.textContent=
new Date()
.toLocaleTimeString("hu-HU");

setFeed(
"BKK FEED LEKÉRÉS...",
"wait"
);

log(
"VehiclePositions.pb lekérése..."
);

try{

const url=
VEHICLE_URL+
"?key="+
encodeURIComponent(key);

const response=
await fetch(
url,
{
method:"GET",
cache:"no-store"
}
);

document.getElementById("http")
.textContent=
response.status;

if(!response.ok){

throw new Error(
"HTTP "+
response.status+
" "+
response.statusText
);

}

const buffer=
await response.arrayBuffer();

log(
"HTTP OK – "+
buffer.byteLength+
" byte érkezett."
);

await loadProto();

const Feed=
protoRoot.lookupType(
"transit_realtime.FeedMessage"
);

const feed=
Feed.decode(
new Uint8Array(buffer)
);

layer.clearLayers();

const list=
document.getElementById(
"vehicles"
);

list.innerHTML="";

let vehicleCount=0;

const vehicleObjects=[];


/* ---------------------------------------------------------
   GTFS-RT ENTITY feldolgozás
   --------------------------------------------------------- */

for(
const entity of feed.entity
){

if(
!entity.vehicle ||
!entity.vehicle.position
){

continue;

}

const v=
entity.vehicle;

const p=
v.position;

const lat=
Number(p.latitude);

const lon=
Number(p.longitude);

if(
!Number.isFinite(lat) ||
!Number.isFinite(lon)
){

continue;

}


/* ---------------------------------------------------------
   Járműadatok
   --------------------------------------------------------- */

const vehicleId=
v.vehicle &&
v.vehicle.id
?
v.vehicle.id
:
"";

const vehicleLabel=
v.vehicle &&
v.vehicle.label
?
v.vehicle.label
:
"";

const licensePlate=
v.vehicle &&
v.vehicle.licensePlate
?
v.vehicle.licensePlate
:
"";

const tripId=
v.trip &&
v.trip.tripId
?
v.trip.tripId
:
"";

const routeId=
v.trip &&
v.trip.routeId
?
v.trip.routeId
:
"";

const directionId=
v.trip &&
v.trip.directionId !== undefined
?
v.trip.directionId
:
"";

const stopId=
v.stopId
?
v.stopId
:
"";

const stopSequence=
v.currentStopSequence
?
v.currentStopSequence
:
"";

const bearing=
Number(p.bearing);

const rawSpeed=
Number(p.speed);

let speedKmh=null;

if(
Number.isFinite(rawSpeed)
){

speedKmh=
rawSpeed*3.6;

}


/* ---------------------------------------------------------
   Térképi marker
   --------------------------------------------------------- */

const marker=
L.circleMarker(
[lat,lon],
{
radius:7,
weight:2,
fillOpacity:.9
}
);

marker.addTo(layer);


/* ---------------------------------------------------------
   Távolság saját GPS-től
   --------------------------------------------------------- */

let distanceText="-";

if(myPos){

const distance=
km(
myPos,
{
lat:lat,
lon:lon
}
);

distanceText=
distance.toFixed(2)+
" km";

}


/* ---------------------------------------------------------
   Popup
   --------------------------------------------------------- */

let popup=
"<div style='min-width:220px'>"+
"<b>🚍 BKK VALÓS JÁRMŰ</b><hr>";

popup+=
"<b>Jármű ID:</b> "+
(vehicleId||"-")+
"<br>";

popup+=
"<b>Jármű label:</b> "+
(vehicleLabel||"-")+
"<br>";

popup+=
"<b>Rendszám:</b> "+
(licensePlate||"-")+
"<br>";

popup+=
"<b>route_id:</b> "+
(routeId||"-")+
"<br>";

popup+=
"<b>trip_id:</b> "+
(tripId||"-")+
"<br>";

popup+=
"<b>direction_id:</b> "+
(directionId||"-")+
"<br>";

popup+=
"<b>stop_id:</b> "+
(stopId||"-")+
"<br>";

popup+=
"<b>stop_sequence:</b> "+
(stopSequence||"-")+
"<br>";

popup+=
"<b>GPS:</b> "+
lat.toFixed(6)+
", "+
lon.toFixed(6)+
"<br>";

popup+=
"<b>Sebesség:</b> "+
(
speedKmh===null
?
"-"
:
speedKmh.toFixed(1)+" km/h"
)+
"<br>";

popup+=
"<b>Irány:</b> "+
(
Number.isFinite(bearing)
?
bearing.toFixed(0)+"°"
:
"-"
)+
"<br>";

popup+=
"<b>Saját GPS-től:</b> "+
distanceText;

popup+=
"</div>";

marker.bindPopup(popup);


/* ---------------------------------------------------------
   Listaelem
   --------------------------------------------------------- */

const div=
document.createElement("div");

div.className=
"vehicle";

div.dataset.lat=
lat;

div.dataset.lon=
lon;

let title=
vehicleLabel ||
routeId ||
vehicleId ||
"ISMERETLEN JÁRMŰ";

div.innerHTML=
"<b>🚍 "+
title+
"</b>"+
"<br>"+
"Jármű ID: "+
(vehicleId||"-")+
"<br>"+
"Járat: "+
(routeId||"-")+
"<br>"+
"Sebesség: "+
(
speedKmh===null
?
"-"
:
speedKmh.toFixed(1)+" km/h"
)+
"<br>"+
"Távolság: "+
distanceText+
"<br>"+
"GPS: "+
lat.toFixed(6)+
", "+
lon.toFixed(6);


/* ---------------------------------------------------------
   Lista kattintás
   --------------------------------------------------------- */

div.onclick=
()=>{

map.setView(
[lat,lon],
17
);

marker.openPopup();

};


/* ---------------------------------------------------------
   Lista hozzáadása
   --------------------------------------------------------- */

list.appendChild(div);

vehicleObjects.push({

id:vehicleId,
label:vehicleLabel,
routeId:routeId,
tripId:tripId,
lat:lat,
lon:lon,
speed:speedKmh,
bearing:bearing,
stopId:stopId
});

vehicleCount++;

}


/* ---------------------------------------------------------
   Eredmény
   --------------------------------------------------------- */

document.getElementById("count")
.textContent=
vehicleCount;

if(vehicleCount===0){

setFeed(
"FEED OK – 0 JÁRMŰ",
"ok"
);

log(
"Feed elérhető, de most 0 feldolgozható VehiclePosition rekord érkezett."
);

}else{

setFeed(
"FEED OK – "+
vehicleCount+
" VALÓDI JÁRMŰ",
"ok"
);

log(
"VALÓS VehiclePosition rekordok: "+
vehicleCount
);

}

refreshNearest();

const elapsed=
performance.now()-
start;

log(
"Feldolgozási idő: "+
elapsed.toFixed(0)+
" ms."
);

}
catch(error){

document.getElementById("count")
.textContent="-";

setFeed(
"FEED HIBA",
"err"
);

const message=
String(error && error.message
?
error.message
:
error);

log(
"HIBA: "+
message
);


/* ---------------------------------------------------------
   Hibadiagnosztika
   --------------------------------------------------------- */

if(
message.includes("Failed to fetch")
){

log(
"VALÓSZÍNŰ OK: CORS / hálózati tiltás / böngészőből nem elérhető végpont."
);

}

if(
message.includes("401")
){

log(
"401: az API-kulcs hiányzik vagy nem érvényes."
);

}

if(
message.includes("403")
){

log(
"403: a szerver megtagadta a hozzáférést."
);

}

if(
message.includes("404")
){

log(
"404: a megadott BKK végpont nem található."
);

}

}


/* ---------------------------------------------------------
   Teszt indulás
   --------------------------------------------------------- */

log(
"======================================"
);

log(
"ATTILA KÖZLEKEDÉS – BKK VADÁSZ TESZT"
);

log(
"VehiclePositions.pb tesztprogram."
);

log(
"======================================"
);


/* ---------------------------------------------------------
   Automatikus GPS indítás
   --------------------------------------------------------- */

watchGPS();

</script>

</body>
</html>
