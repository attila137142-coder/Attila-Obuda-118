<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>ATTILA DISPATCHER V5 – REALTIME CORE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:Arial; display:flex; }
#sidebar{ width:360px; border-right:1px solid #ddd; overflow:auto; }
#map{ flex:1; height:100vh; }

.matrix{
  background:black;
  color:#00ff66;
  font-family:monospace;
  padding:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #003300;
  padding:6px 0;
}

.blink{ animation:blink 1s infinite; }
@keyframes blink{50%{opacity:0.2;}}
</style>
</head>

<body>

<div id="sidebar">
<h3>🟢 DISPATCH V5</h3>
<input id="search" placeholder="Keresés...">
<div id="list"></div>
<div id="panel">Válassz megállót</div>
</div>

<div id="map"></div>

<script>

// ===== MAP =====
const map = L.map('map').setView([47.6,19.05],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// ===== GPS =====
let userPos=null;
navigator.geolocation.getCurrentPosition(pos=>{
  userPos={lat:pos.coords.latitude,lon:pos.coords.longitude};
});

// ===== DISTANCE =====
function distance(lat1,lon1,lat2,lon2){
  const R=6371000;
  const toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1);
  const dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+
    Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*
    Math.sin(dLon/2)**2;
  return R*(2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}

// ===== STOPS (rövid) =====
const STOPS=[
 {name:"Békásmegyer HÉV",lat:47.598,lon:19.054},
 {name:"Flórián tér",lat:47.542,lon:19.042},
 {name:"Batthyány tér",lat:47.506,lon:19.039}
];

// ===== LIVE VEHICLES =====
let LIVE_VEHICLES=[];

// ===== MOCK GENERATOR =====
function generateMock(){
  LIVE_VEHICLES=[
    {id:"H5-01",line:"H5",lat:47.60,lon:19.05,speed:40,delay:1},
    {id:"34-1",line:"34",lat:47.58,lon:19.04,speed:30,delay:-1}
  ];
}
generateMock();

// ===== GTFS-RT LOAD (PLACEHOLDER) =====
async function loadGTFS(){
  try{
    // ide jön majd proxy:
    // const res = await fetch("/api/gtfsrt");
    // parse protobuf...
  }catch(e){
    console.log("GTFS fallback → MOCK");
    generateMock();
  }
}

// ===== MOVE ENGINE =====
setInterval(()=>{
  LIVE_VEHICLES.forEach(v=>{
    const d=v.speed*1000/3600*5;
    v.lat+= (Math.random()-0.5)*0.001;
    v.lon+= (Math.random()-0.5)*0.001;
    if(Math.random()<0.3){
      v.delay+=Math.floor(Math.random()*3-1);
    }
  });
  updateMarkers();
},5000);

// ===== MARKERS =====
const markers={};
function updateMarkers(){
  LIVE_VEHICLES.forEach(v=>{
    if(!markers[v.id]){
      markers[v.id]=L.circleMarker([v.lat,v.lon],{radius:6,color:"red"}).addTo(map);
    }else{
      markers[v.id].setLatLng([v.lat,v.lon]);
    }
  });
}

// ===== DIST ENGINE =====
function vehicleDist(v,stop){
  const air=distance(v.lat,v.lon,stop.lat,stop.lon);
  const road=air*1.25;
  const eta=road/(v.speed*1000/3600)/60;
  return {air,road,eta};
}

// ===== MATRIX =====
function showMatrix(stop){

  let html=`<div class="matrix">`;
  html+=`<h3>🚏 ${stop.name}</h3>`;

  html+=`${stop.lat.toFixed(6)}, ${stop.lon.toFixed(6)}<br>`;

  if(userPos){
    const d=distance(userPos.lat,userPos.lon,stop.lat,stop.lon);
    html+=`📍 ${Math.round(d)} m / ${(d/1000).toFixed(2)} km<br>`;
  }

  html+=`<hr>`;

  // 15 indulás
  for(let i=0;i<15;i++){
    const t=(new Date().getMinutes()+i*2)%60;
    html+=`<div class="row">
      <div>${["34","H5","7"][i%3]}</div>
      <div>${["Szentendre","Batthyány"][i%2]}</div>
      <div>${t}</div>
    </div>`;
  }

  html+=`<hr><b>🚍 LIVE járművek</b>`;

  LIVE_VEHICLES
    .map(v=>{
      const d=vehicleDist(v,stop);
      return {...v,...d};
    })
    .sort((a,b)=>a.road-b.road)
    .slice(0,5)
    .forEach(v=>{
      html+=`
      <div style="border-bottom:1px solid #003300;padding:6px;">
        ${v.line} | ${v.id}<br>
        📏 ${Math.round(v.air)} m<br>
        🛣 ${(v.road/1000).toFixed(2)} km<br>
        ⏱ ${v.eta.toFixed(1)} perc<br>
        ${v.delay>0?`🔴 +${v.delay}`:v.delay<0?`🟢 ${v.delay}`:"⚪ 0"}
      </div>`;
    });

  html+=`</div>`;

  document.getElementById("panel").innerHTML=html;
}

// ===== LIST =====
function render(list){
  const c=document.getElementById("list");
  c.innerHTML="";
  list.forEach(s=>{
    const d=document.createElement("div");
    d.innerHTML="📍 "+s.name;
    d.onclick=()=>showMatrix(s);
    c.appendChild(d);
  });
}
render(STOPS);

// ===== SEARCH =====
search.oninput=e=>{
  const q=e.target.value.toLowerCase();
  render(STOPS.filter(s=>s.name.toLowerCase().includes(q)));
};

// ===== MAP MARKERS =====
STOPS.forEach(s=>{
  L.marker([s.lat,s.lon]).addTo(map)
    .on("click",()=>showMatrix(s));
});

updateMarkers();

</script>

</body>
</html>
