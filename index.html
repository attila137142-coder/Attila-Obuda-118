<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Attila PDF Dokumentumkezelő V1.0 STABLE
</title>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<style>

body{

font-family:Arial, sans-serif;
background:#111;
color:white;
margin:0;
padding:20px;

}


h1{

color:#00eaff;
}


.panel{

background:#1b1b1b;
border:1px solid #444;
border-radius:12px;
padding:15px;
margin-bottom:15px;

}


button{

padding:10px 18px;
border:none;
border-radius:8px;
background:#0078ff;
color:white;
cursor:pointer;
margin:3px;

}


button:hover{

background:#00bfff;

}



input{

padding:8px;

}



#viewer{

background:#333;
padding:10px;
text-align:center;
overflow:auto;

}



canvas{

background:white;
max-width:100%;

}



.info{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;

}



.card{

background:#222;
padding:10px;
border-radius:8px;

}



pre{

background:#000;
padding:10px;
max-height:300px;
overflow:auto;

}


</style>


</head>



<body>



<h1>
📄 Attila PDF Dokumentumkezelő V1.0 STABLE
</h1>




<div class="panel">


<h3>
📂 PDF betöltés
</h3>


<input 
type="file"
id="pdfFile"
accept=".pdf">


<button onclick="openPDF()">
PDF megnyitása
</button>


</div>




<div class="panel">


<h3>
📑 Dokumentum adatok
</h3>


<div class="info">


<div class="card">

Oldalak:

<span id="pages">
---

</span>

</div>



<div class="card">

Aktuális oldal:

<span id="currentPage">
---

</span>

</div>



<div class="card">

Fájl:

<span id="filename">
---

</span>

</div>



<div class="card">

Állapot:

<span id="status">
Várakozás
</span>

</div>



</div>

</div>





<div class="panel">


<h3>
🔍 Keresés
</h3>


<input 
id="searchText"
placeholder="Keresett szöveg">


<button onclick="searchPDF()">
Keresés
</button>



<pre id="searchResult">
---
</pre>


</div>





<div class="panel">


<h3>
🖥 PDF nézet
</h3>


<button onclick="prevPage()">
◀ Előző
</button>


<button onclick="nextPage()">
Következő ▶
</button>


<br>


<button onclick="zoomOut()">
➖
</button>


<button onclick="zoomIn()">
➕
</button>



<div id="viewer">

<canvas id="pdfCanvas"></canvas>

</div>


</div>
<div class="panel">

<h3>
📊 PDF → Táblázat Engine V0.2
</h3>


<button onclick="convertCurrentPage()">
Oldal átalakítása táblázattá
</button>


<div id="tableStatus">

Várakozás...

</div>


<br>


<div id="tableResult">

---

</div>


</div>
