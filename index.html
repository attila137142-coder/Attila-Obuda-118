<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>ATTILA DISPATCH V4</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{margin:0;display:flex;font-family:Arial}
#sidebar{width:380px;border-right:1px solid #ccc;overflow:auto}
#map{flex:1;height:100vh}
input{width:100%;padding:10px}

/* MATRIX */
.matrix{background:black;color:#00ff66;font-family:monospace;padding:10px}
.row{display:grid;grid-template-columns:80px 1fr 120px 120px;padding:10px;border-bottom:1px solid #003300}
.line{font-size:22px}
.dest{font-size:18px}
.time{font-size:22px;text-align:right}
.delay{text-align:right}
.blink{animation:blink 1s infinite}
@keyframes blink{50%{opacity:0.2}}
</style>
</head>

<body>

<div id="sidebar">
<input id="search" placeholder="🔍 Megálló / GTFS ID...">
<div id="list"></div>
<div id="panel">Válassz megállót</div>
</div>

<div id="map"></div>

<script>

// ===== MAP =====
const map=L.map('map').setView([47.5,19.05],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// ===== GPS =====
let userPos=null, gpsAccuracy=null;

navigator.geolocation.watchPosition(p=>{
  userPos=[p.coords.latitude,p.coords.longitude];
  gpsAccuracy=p.coords.accuracy;
});

// ===== ADATOK =====
let stops=[], stopTimes=[], trips={}, routes={};

// ===== GTFS LOAD =====
async function loadGTFS(){
  const res=await fetch("stops.txt");
  const txt=await res.text();

  txt.split("\n").slice(1).forEach(l=>{
    const c=l.split(",");
    stops.push({
      id:c[0],
      name:c[2],
      lat:+c[4],
      lon:+c[5]
    });
  });

  render(stops);
}

// ===== TÁVOLSÁG =====
function dist(a,b){
  const R=6371;
  const dLat=(b[0]-a[0])*Math.PI/180;
  const dLon=(b[1]-a[1])*Math.PI/180;
  const x=Math.sin(dLat/2)**2+
  Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*
  Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ===== ROUTE DIST (OSRM) =====
async function routeDist(a,b){
  const url=`https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=false`;
  const r=await fetch(url);
  const j=await r.json();
  return j.routes[0].distance;
}

// ===== REVERSE GEOCODE =====
async function geo(lat,lon){
  const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
  return await r.json();
}

// ===== MATRIX =====
function showMatrix(stop){

  const now=new Date();
  const list=stopTimes.filter(t=>t.stop===stop.id).slice(0,5);

  let html=`<div class="matrix"><h3>${stop.name}</h3>`;

  list.forEach(t=>{
    const sec=t.sec-now.getHours()*3600;
    const m=Math.floor(sec/60);
    const s=sec%60;

    html+=`
      <div class="row">
        <div class="line">${t.route}</div>
        <div class="dest">${t.headsign}</div>
        <div class="time">${m}p ${s}mp</div>
        <div class="delay">-</div>
      </div>
    `;
  });

  html+=`</div>`;

  showDetails(stop);

  document.getElementById("panel").innerHTML=html;
}

// ===== HELYADAT =====
async function showDetails(stop){

  if(!userPos) return;

  const air=dist(userPos,[stop.lat,stop.lon])*1000;
  const road=await routeDist(userPos,[stop.lat,stop.lon]);

  const g=await geo(stop.lat,stop.lon);

  const info=`
  <div>
  🌍 ${g.address.country}<br>
  🏙 ${g.address.city||g.address.town}<br>
  🏠 ${g.address.road||""} ${g.address.house_number||""}<br>
  📍 ${stop.lat.toFixed(6)}, ${stop.lon.toFixed(6)}<br>
  📏 Légvonal: ${Math.round(air)} m<br>
  🚗 Útvonal: ${Math.round(road)} m<br>
  📡 GPS pontosság: ${Math.round(gpsAccuracy)} m
  </div>
  `;

  document.getElementById("panel").innerHTML+=info;
}

// ===== LISTA =====
function render(arr){
  const list=document.getElementById("list");
  list.innerHTML="";

  arr.slice(0,200).forEach(s=>{
    const d=document.createElement("div");
    d.innerText=`${s.name} (${s.id})`;
    d.onclick=()=>showMatrix(s);
    list.appendChild(d);

    if(s.lat) L.marker([s.lat,s.lon]).addTo(map);
  });
}

// ===== SEARCH =====
search.oninput=e=>{
  const q=e.target.value.toLowerCase();

  const f=stops.filter(s=>
    s.name.toLowerCase().includes(q) ||
    s.id.toLowerCase().includes(q)
  );

  render(f);
};

loadGTFS();

</script>
</body>
</html>
