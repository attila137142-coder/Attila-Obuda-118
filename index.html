<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>GTFS V5 LIVE DISPATCHER</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#060a14;
    color:#d1d5db;
}

header{
    background:#0b1220;
    padding:12px;
    border-bottom:1px solid #1f2937;
}

h1{color:#38bdf8;margin:0}

.grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
    padding:10px;
}

.panel{
    background:#0f172a;
    border:1px solid #1f2937;
    border-radius:10px;
    padding:10px;
}

#map{height:320px;border-radius:10px}

#board{
    height:320px;
    overflow:auto;
    font-family:monospace;
    background:black;
    padding:8px;
}

.badge{
    display:inline-block;
    padding:5px 8px;
    border-radius:6px;
    font-weight:bold;
}

.green{background:#14532d;color:#22c55e}
.yellow{background:#3b2f0b;color:#facc15}
.red{background:#3b0b0b;color:#ef4444}

table{width:100%;font-size:12px}
td{padding:4px;border-bottom:1px solid #1f2937}
</style>
</head>

<body>

<header>
<h1>🚍 GTFS V5 LIVE DISPATCHER</h1>
<input type="file" id="zipFile">
<button onclick="load()">📦 LOAD GTFS</button>
<button onclick="start()">🚦 START DISPATCH</button>
</header>

<div class="grid">

<div class="panel">
<h3>📡 DISZPÉCSER BOARD</h3>
<div id="status" class="badge yellow">IDLE</div>
<div id="board"></div>
</div>

<div class="panel">
<h3>📊 LIVE METRICS</h3>
<div id="stats"></div>
</div>

<div class="panel">
<h3>🗺️ LIVE MAP</h3>
<div id="map"></div>
</div>

<div class="panel">
<h3>🚍 TRIP FLOW</h3>
<div id="flow"></div>
</div>

</div>

<script>

let zip;
let stops=[];
let trips=[];
let map;
let markers=[];
let index=0;

function log(msg){
    document.getElementById("board").innerHTML += msg + "<br>";
}

function setStatus(t,c){
    let el=document.getElementById("status");
    el.innerText=t;
    el.className="badge "+c;
}

function load(){
    zip=new JSZip();
    let f=document.getElementById("zipFile").files[0];
    zip.loadAsync(f).then(async ()=>{
        log("📦 GTFS betöltve");

        let stopText=await zip.file("stops.txt").async("string");
        let tripText=await zip.file("trips.txt").async("string");

        stops=parseCSV(stopText);
        trips=parseCSV(tripText);

        initMap();
        log("✔ Adatok feldolgozva");
    });
}

function parseCSV(t){
    return t.split("\n").map(l=>l.split(","));
}

function initMap(){
    map=L.map('map').setView([47.4979,19.0402],12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:"OSM"}).addTo(map);

    for(let i=1;i<stops.length;i++){
        let lat=parseFloat(stops[i][4]);
        let lon=parseFloat(stops[i][5]);
        if(!isNaN(lat)&&!isNaN(lon)){
            let m=L.circleMarker([lat,lon],{radius:3}).addTo(map);
            markers.push(m);
        }
    }

    log("🗺️ MAP READY");
}

function start(){
    setStatus("LIVE RUNNING","green");

    let i=1;

    setInterval(()=>{
        if(i>=trips.length) i=1;

        let trip=trips[i];

        let route=trip[0];
        let service=trip[1];
        let tripId=trip[2];

        let delay=Math.floor(Math.random()*6)-2;

        log(`🚍 TRIP ${tripId} | ROUTE ${route} | SERVICE ${service} | Δ ${delay}min`);

        document.getElementById("stats").innerHTML=`
        <table>
        <tr><td>Active Trip</td><td>${tripId}</td></tr>
        <tr><td>Route</td><td>${route}</td></tr>
        <tr><td>Delay</td><td>${delay} min</td></tr>
        </table>
        `;

        document.getElementById("flow").innerHTML=
        "🟢 ACTIVE TRIP FLOW:<br>" +
        "▶ " + route + " → " + tripId;

        i++;
    },1500);
}

</script>

</body>
</html>
