<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Megálló Menetrend V1</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#0b1016;
    color:#e6f1ff;
}

/* HEADER */
header{
    background:#121a24;
    padding:12px;
    text-align:center;
    font-weight:bold;
    font-size:18px;
    border-bottom:2px solid #1f2d3d;
}

/* SEARCH */
.searchBox{
    padding:10px;
    display:flex;
    gap:8px;
}
input{
    flex:1;
    padding:10px;
    border-radius:8px;
    border:none;
    outline:none;
}
button{
    padding:10px;
    border:none;
    border-radius:8px;
    background:#00c2ff;
    color:#000;
    font-weight:bold;
}

/* STOP LIST */
.container{
    padding:10px;
}

.stop{
    background:#141e2b;
    padding:10px;
    margin-bottom:10px;
    border-radius:10px;
}

.line{
    display:flex;
    justify-content:space-between;
    padding:4px 0;
    border-bottom:1px solid #243447;
}

.badge{
    background:#00c2ff;
    color:#000;
    padding:2px 6px;
    border-radius:6px;
    font-weight:bold;
}
.small{
    font-size:12px;
    opacity:0.7;
}
</style>
</head>

<body>

<header>🚦 Megálló Menetrend V1 (iPhone + Win10 kompatibilis)</header>

<div class="searchBox">
    <input id="search" placeholder="Írd be a megálló nevét... pl. Örs vezér tere">
    <button onclick="searchStop()">Keresés</button>
</div>

<div class="container" id="result">

<!-- DEFAULT DEMO STOP -->
<div class="stop">
    <div><b>📍 Örs vezér tere</b></div>
    <div class="small">GTFS demo menetrend (statikus)</div>

    <div class="line"><span class="badge">32</span> 05:10 - 05:30 - 05:50</div>
    <div class="line"><span class="badge">85</span> 05:12 - 05:32 - 05:52</div>
    <div class="line"><span class="badge">85E</span> 05:15 - 05:35 - 05:55</div>
    <div class="line"><span class="badge">32</span> 06:10 - 06:30 - 06:50</div>

</div>

</div>

<script>
function searchStop(){
    const q = document.getElementById("search").value.toLowerCase();
    const result = document.getElementById("result");

    if(q.includes("örs") || q.includes("ors")){
        result.innerHTML = `
        <div class="stop">
            <div><b>📍 Örs vezér tere</b></div>
            <div class="small">Dinamikus találat (demo)</div>

            <div class="line"><span class="badge">32</span> 05:10 - 05:30 - 05:50</div>
            <div class="line"><span class="badge">85</span> 05:12 - 05:32 - 05:52</div>
            <div class="line"><span class="badge">85E</span> 05:15 - 05:35 - 05:55</div>
        </div>`;
    }
    else if(q.trim() === ""){
        location.reload();
    }
    else{
        result.innerHTML = `
        <div class="stop">
            <b>Nincs találat:</b> ${q}
            <div class="small">Próbáld: Örs, Kőbánya, Deák tér</div>
        </div>`;
    }
}
</script>

</body>
</html>
