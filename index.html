<!-- Csak az ÚJ részeket mutatom, mert a teljes fájl már megvan nálad -->

<script>

// ================= VEHICLES =================
let vehicles = [];

function spawnVehicles(){

  vehicles.forEach(v=>map.removeLayer(v.marker));
  vehicles = [];

  if(!GTFS.stop_times.length) return;

  // 10 random aktív trip
  const activeTrips = GTFS.trips.slice(0,20);

  activeTrips.forEach(trip=>{

    const route = GTFS.routes.find(r=>r.route_id===trip.route_id);

    const color = getColor(route?.route_short_name);

    const marker = L.circleMarker([47.5,19.05],{
      radius:6,
      color:color,
      fillOpacity:1
    }).addTo(map);

    vehicles.push({
      trip_id: trip.trip_id,
      marker,
      index: 0
    });

  });
}

// ================= MOVE =================
function moveVehicles(){

  vehicles.forEach(v=>{

    const stops = GTFS.stop_times
      .filter(st=>st.trip_id===v.trip_id)
      .sort((a,b)=>a.stop_sequence-b.stop_sequence);

    if(stops.length < 2) return;

    const current = stops[v.index % stops.length];
    const next = stops[(v.index+1) % stops.length];

    const s1 = GTFS.stops.find(s=>s.stop_id===current.stop_id);
    const s2 = GTFS.stops.find(s=>s.stop_id===next.stop_id);

    if(!s1 || !s2) return;

    // linear move
    const lat = (parseFloat(s1.stop_lat)+parseFloat(s2.stop_lat))/2;
    const lon = (parseFloat(s1.stop_lon)+parseFloat(s2.stop_lon))/2;

    v.marker.setLatLng([lat,lon]);

    v.index++;
  });
}

// ================= LOOP =================
setInterval(()=>{
  moveVehicles();
},2000);

</script>
