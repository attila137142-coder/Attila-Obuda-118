<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Budai Trail Engine v4</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; font-family: Arial; }
#map { height:100vh; width:100%; }

.panel{
  position:absolute;
  top:10px;
  left:10px;
  z-index:9999;
  background:white;
  padding:10px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.3);
  font-size:13px;
  max-width:300px;
}

.seg{
  background:#f4f4f4;
  margin-top:5px;
  padding:5px;
  border-left:4px solid green;
}
</style>
</head>

<body>

<div class="panel">
<b>🌲 Budai Trail Engine v4</b><br><br>

✔ OSM turistautak<br>
✔ analitika (táv + gráf)<br>
✔ útvonal keresés<br><br>

📦 kell: <b>budai.geojson</b><br><br>

<div id="info">Várakozás…</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// =====================
// MAP
// =====================

const map = L.map('map').setView([47.52, 18.97], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

// =====================
// DISTANCE
// =====================

function dist(a,b){
  return map.distance(a,b);
}

// =====================
// GRAPH BUILD
// =====================

let graph = {};
let allLines = [];

// =====================
// LOAD OSM GEOJSON
// =====================

fetch("budai.geojson")
.then(r => r.json())
.then(data => {

  L.geoJSON(data, {

    style:{
      color:"green",
      weight:4
    },

    onEachFeature:(feature, layer) => {

      let coords = [];

      if(feature.geometry.type === "LineString"){
        coords = feature.geometry.coordinates.map(c => [c[1],c[0]]);
      }

      if(feature.geometry.type === "MultiLineString"){
        feature.geometry.coordinates.forEach(line=>{
          line.forEach(c=>{
            coords.push([c[1],c[0]]);
          });
        });
      }

      // =====================
      // GRAPH BUILDING
      // =====================

      for(let i=1;i<coords.length;i++){

        let a = coords[i-1].toString();
        let b = coords[i].toString();

        let d = dist(coords[i-1],coords[i]);

        if(!graph[a]) graph[a]=[];
        if(!graph[b]) graph[b]=[];

        graph[a].push({node:b, dist:d});
        graph[b].push({node:a, dist:d});
      }

      allLines.push(layer);

      // popup
      layer.on("click", e => {
        L.popup()
        .setLatLng(e.latlng)
        .setContent("🌲 Turistaút szakasz")
        .openOn(map);
      });

    }

  }).addTo(map);

  map.fitBounds(allLines[0].getBounds());

  document.getElementById("info").innerHTML =
    "✔ OSM betöltve<br>✔ gráf építve";

});

</script>

</body>
</html>
