<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attila Multi GTFS V5.3 GTFS Loader</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>


<style>

body{
margin:0;
font-family:Arial;
background:#111;
color:white;
}

.header{

background:#003300;
text-align:center;
padding:10px;

}

.clock{

font-size:34px;
color:#00ff66;
font-weight:bold;

}


.layout{

display:grid;
grid-template-columns:300px 1fr 300px;
height:calc(100vh - 100px);

}


.panel{

background:#1c1c1c;
padding:12px;
overflow:auto;

}


#map{

height:100%;
width:100%;

}


input,button{

width:100%;
padding:10px;
margin-top:8px;
box-sizing:border-box;

}


button{

background:#0066cc;
color:white;
border:0;
border-radius:6px;

}


.card{

background:#222;
padding:10px;
margin-top:10px;
border-radius:8px;

}


.green{

color:#00ff66;

}

.red{

color:red;

}


</style>

</head>


<body>


<div class="header">

<h2>
🚦 Attila Multi GTFS V5.3
</h2>

<div id="clock" class="clock"></div>

</div>



<div class="layout">



<div class="panel">


<h3>
📂 GTFS ZIP betöltés
</h3>


<input 
type="file"
id="gtfsFile"
accept=".zip">


<button onclick="loadGTFS()">
⬇ GTFS betöltése
</button>


<div id="status"
class="card">

Nincs GTFS betöltve

</div>



<h3>
🚏 Megálló kereső
</h3>


<input
id="search"
placeholder="Név vagy GTFS ID">


<button onclick="searchStop()">

🔎 Keresés

</button>



<div id="results"></div>



</div>





<div id="map"></div>





<div class="panel">


<h3>
🚏 Megálló adatok
</h3>


<div id="info"
class="card">

Nincs kiválasztva

</div>


<h3>
🚏 Indulások
</h3>


<div class="card">

GTFS stop_times modul következik

</div>


<h3>
🚍 Jármű

</h3>


<div class="card">

GTFS-RT modul következik

</div>


</div>



</div>




<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>


// ÓRA


function clock(){

let d=new Date();

document.getElementById("clock").innerHTML=
d.toLocaleDateString("hu-HU")
+" "
+
d.toLocaleTimeString("hu-HU");

}


setInterval(clock,1000);

clock();





// TÉRKÉP


let map=L.map("map")
.setView(
[47.55,19.05],
10
);



L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png"

).addTo(map);





let stops=[];

let markers=[];



// GTFS BETÖLTÉS


async function loadGTFS(){


let file=
document.getElementById("gtfsFile")
.files[0];


if(!file){

alert("Válassz GTFS ZIP fájlt!");

return;

}



let zip=
await JSZip.loadAsync(file);



let txt=
await zip.file("stops.txt")
.async("string");



Papa.parse(txt,{

header:true,

complete:function(data){


stops=data.data.filter(

x=>x.stop_id && x.stop_name

);



document.getElementById("status")
.innerHTML=

`
<span class="green">
✅ GTFS betöltve
</span>

<br><br>

Megállók:
${stops.length}

`;



}


});


}





// KERESÉS


function searchStop(){


let q=
document.getElementById("search")
.value
.toLowerCase()
.trim();



let found=
stops.filter(s=>


s.stop_name
.toLowerCase()
.includes(q)

||

s.stop_id
.toLowerCase()
.includes(q)


).slice(0,20);




markers.forEach(m=>
map.removeLayer(m)
);


markers=[];



let html="";



found.forEach(s=>{


let lat=
Number(s.stop_lat);


let lon=
Number(s.stop_lon);



let marker=
L.marker(
[lat,lon]
)
.addTo(map)
.bindPopup(
s.stop_name
);



markers.push(marker);



marker.on(
"click",
()=>showInfo(s)
);



html+=`

<div class="card">


🚏 ${s.stop_name}

<br>

GTFS:
${s.stop_id}

<br>

📍 ${lat.toFixed(6)}

<br>

${lon.toFixed(6)}


</div>

`;



});



if(found.length){

map.setView(
[
Number(found[0].stop_lat),
Number(found[0].stop_lon)
],
14
);

}



document.getElementById("results")
.innerHTML=

html || 
"<div class='card red'>Nincs találat</div>";



}




function showInfo(s){


document.getElementById("info")
.innerHTML=

`

🚏 ${s.stop_name}

<br><br>

GTFS ID:
${s.stop_id}

<br><br>

Koordináta:

<br>

${Number(s.stop_lat).toFixed(6)}

<br>

${Number(s.stop_lon).toFixed(6)}

`;



}


</script>


</body>
</html>
