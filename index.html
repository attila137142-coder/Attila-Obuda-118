<!DOCTYPE html>
<html lang="hu">

<head>

content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

Attila Közlekedés V10 - Dispatcher Core
</title>


<style>

/* ===============================
   ALAP BEÁLLÍTÁSOK
================================ */

    box-sizing:border-box;
}

body {

    margin:0;
    padding:0;

    background:#101820;
    color:white;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

}


/* ===============================
   FEJLÉC
================================ */

.header {

    height:65px;

    background:#162c40;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 15px;

    border-bottom:
    2px solid #00aaff;

}


.title {

    font-size:20px;

    font-weight:bold;

}


.status {

    font-size:14px;

    color:#00ff88;

}



/* ===============================
   FŐ PANEL
================================ */

.container {

    padding:10px;

}



/* ===============================
   MODUL KÁRTYÁK
================================ */

.card {

    background:#1b2b3a;

    border-radius:12px;

    margin-bottom:12px;

    padding:12px;

    box-shadow:
    0 0 8px rgba(0,0,0,0.5);

}


.card-title {

    font-size:17px;

    font-weight:bold;

    color:#00ccff;

    margin-bottom:8px;

}



/* ===============================
   TÉRKÉP HELY
================================ */

.map-box {

    height:300px;

    background:#263746;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:18px;

    color:#aaa;

    border:
    1px solid #3c5568;

}



/* ===============================
   GOMBOK
================================ */

.button-grid {

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:10px;

}


button {

    background:#0066aa;

    color:white;

    border:none;

    border-radius:10px;

    padding:14px;

    font-size:15px;

}


button:active {

    background:#0088dd;

}



/* ===============================
   IPHONE XR OPTIMALIZÁLÁS
================================ */

@media(max-width:430px){

    .title {

        font-size:16px;

    }


    .map-box {

        height:250px;

    }

</style>


</head>



<body>


<!-- FEJLÉC -->

<div class="header">

<div class="title">

🚏 Attila Közlekedés V10

</div>


<div class="status">

🟢 GPS várakozás

</div>


</div>



<div class="container">



<!-- TÉRKÉP -->

<div class="card">


<div class="card-title">

🗺️ Élő térkép

</div>


<div class="map-box">

📍 Térkép modul betöltés alatt

</div>


</div>




<!-- MODUL MENÜ -->


<div class="card">


<div class="card-title">

⚙️ Dispatcher modulok

</div>



<div class="button-grid">


<button>

🚏 Megálló kereső

</button>


<button>

🚌 Jármű kereső

</button>


<button>

📡 Körzet kereső

</button>


<button>

🛣 Vonal kereső

</button>



</div>


</div>





<!-- GPS PANEL -->


<div class="card">


<div class="card-title">

📍 Saját helyzet

</div>


<div>

Latitude:
<span id="lat">

-

</span>

</div>


<div>

Longitude:
<span id="lon">

-

</span>

</div>


<div>

Pontosság:
<span id="accuracy">

-

</span>

</div>


</div>






<!-- RENDSZER INFORMÁCIÓ -->


<div class="card">


<div class="card-title">

ℹ️ Rendszer

</div>


<div>

Verzió:
V10 Dispatcher Core V1.0

</div>


<div>

Adatmotor:
Előkészítés alatt

</div>


<div>

GTFS:
Várakozás

</div>


</div>



</div>


<script>


/* =====================================
   ATTILA KÖZLEKEDÉS V10
   GPS + MEGÁLLÓ MOTOR V1.0
===================================== */



// -------------------------------------
// TESZT MEGÁLLÓ ADATBÁZIS
// Később GTFS-ből töltjük
// -------------------------------------


const stopDatabase = [

{
id:"44192",
name:"Békásmegyer H",
type:"BKK",
operator:"BKK",
lat:47.598900,
lon:19.063500,
routes:["243"]
},


{
id:"89725",
name:"Nád utca",
type:"BKK",
operator:"BKK",
lat:47.602341,
lon:19.054822,
routes:["160","243"]
},


{
id:"10694",
name:"Kismaros",
type:"ERDEI_VASUT",
operator:"Királyréti Erdei Vasút",
lat:47.839500,
lon:19.004300,
routes:["317"]
},


{
id:"MAV123",
name:"Szentendre",
type:"MÁV",
operator:"MÁV",
lat:47.669400,
lon:19.075900,
routes:["HÉV"]
},


{
id:"VOLAN001",
name:"Budakalász",
type:"VOLÁN",
operator:"Volánbusz",
lat:47.616200,
lon:19.046500,
routes:[]
}


];




// -------------------------------------
// GPS VÁLTOZÓK
// -------------------------------------


let myLatitude = null;

let myLongitude = null;

let myAccuracy = null;




// -------------------------------------
// GPS INDÍTÁS
// -------------------------------------


function startGPS(){


if(
navigator.geolocation
){


navigator.geolocation.watchPosition(

function(position){



myLatitude =
position.coords.latitude;


myLongitude =
position.coords.longitude;


myAccuracy =
position.coords.accuracy;



document.getElementById("lat")
.innerHTML =
myLatitude.toFixed(6);



document.getElementById("lon")
.innerHTML =
myLongitude.toFixed(6);



document.getElementById("accuracy")
.innerHTML =
Math.round(myAccuracy)
+" m";



document.querySelector(".status")
.innerHTML =
"🟢 GPS aktív";



},


function(error){


document.querySelector(".status")
.innerHTML =
"🔴 GPS hiba";


},


{


enableHighAccuracy:true,

maximumAge:5000,

timeout:10000


}


);



}

}



// -------------------------------------
// LÉGVONAL TÁVOLSÁG SZÁMÍTÁS
// km-ben
// -------------------------------------


function distanceKm(
lat1,
lon1,
lat2,
lon2
){


const R=6371;


const dLat =
(lat2-lat1)
*Math.PI/180;


const dLon =
(lon2-lon1)
*Math.PI/180;



const a =

Math.sin(dLat/2) *
Math.sin(dLat/2)

+

Math.cos(lat1*Math.PI/180)
*
Math.cos(lat2*Math.PI/180)
*
Math.sin(dLon/2)
*
Math.sin(dLon/2);



const c =
2 *
Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);



return R*c;


}



// -------------------------------------
// MEGÁLLÓ KERESŐ MOTOR
// név vagy GTFS ID alapján
// -------------------------------------


function searchStop(query){


query =
query.toLowerCase();



let result =
stopDatabase.filter(stop =>


stop.name
.toLowerCase()
.includes(query)

||

stop.id
.toLowerCase()
.includes(query)


);



return result;


}




// -------------------------------------
// KÖZELI MEGÁLLÓK
// GPS ALAPJÁN
// -------------------------------------


function nearbyStops(radiusKm=10){


if(
myLatitude===null
)
return [];


return stopDatabase.filter(stop=>{


let d =
distanceKm(

myLatitude,

myLongitude,

stop.lat,

stop.lon

);


return d <= radiusKm;


});


}




// -------------------------------------
// INDÍTÁS
// -------------------------------------


startGPS();



</script>
</body>

</html>
