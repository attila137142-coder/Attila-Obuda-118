<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>REAL GTFS CORE ENGINE V1</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; display:flex; height:100vh; font-family:Arial; }

#panel {
  width:360px;
  background:#041f1b;
  color:white;
  display:flex;
  flex-direction:column;
}

#top {
  padding:10px;
  border-bottom:1px solid rgba(255,255,255,0.2);
}

#upload {
  width:100%;
  margin-top:8px;
}

#list {
  flex:1;
  overflow:auto;
  padding:8px;
}

.row {
  display:flex;
  justify-content:space-between;
  padding:6px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  font-size:13px;
}

.green { color:#7CFF7C; }
.red { color:#ff4d4d; font-weight:bold; }
.blue { color:#4da6ff; font-weight:bold; }

.badge {
  font-size:10px;
  background:#222;
  padding:2px 5px;
  border-radius:4px;
}

#map { flex:1; }
</style>
</head>

<body>

<div id="panel">
  <div id="top">
    🚏 GTFS CORE V1<br>
    <input type="file" id="upload" accept=".zip">
  </div>
  <div id="list"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>

/* =========================
   🗺️ MAP INIT
========================= */

const map = L.map('map').setView([47.4979, 19.0402], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'OSM'
}).addTo(map);

let markers = {};

/* =========================
   💾 INDEXEDDB (CACHE LAYER)
========================= */

function openDB(){
  return new Promise((res,rej)=>{
    const req = indexedDB.open("gtfsDB",1);

    req.onupgradeneeded = e=>{
      const db = e.target.result;
      db.createObjectStore("data");
    };

    req.onsuccess = ()=>res(req.result);
    req.onerror = ()=>rej();
  });
}

async function save(key,value){
  const db = await openDB();
  const tx = db.transaction("data","readwrite");
  tx.objectStore("data").put(value,key);
}

async function load(key){
  const db = await openDB();
  return new Promise(r=>{
    const tx = db.transaction("data","readonly");
    const req = tx.objectStore("data").get(key);
    req.onsuccess = ()=>r(req.result);
  });
}

/* =========================
   🚏 GTFS DATA CONTAINERS
========================= */

let STOPS = [];
let STOP_TIMES = [];
let TRIPS = [];

/* =========================
   🧠 PARSE GTFS ZIP
========================= */

document.getElementById("upload").addEventListener("change", async e=>{

  const file = e.target.files[0];
  const zip = await JSZip.loadAsync(file);

  const stopsTxt = await zip.file("stops.txt").async("string");
  const stopTimesTxt = await zip.file("stop_times.txt").async("string");
  const tripsTxt = await zip.file("trips.txt").async("string");

  STOPS = parseCSV(stopsTxt);
  STOP_TIMES = parseCSV(stopTimesTxt);
  TRIPS = parseCSV(tripsTxt);

  await save("stops",STOPS);
  await save("stop_times",STOP_TIMES);
  await save("trips",TRIPS);

  init();
});

/* =========================
   CSV PARSER (SAFE)
========================= */

function parseCSV(text){

  const lines = text.split("\n");
  const header = lines[0].split(",");

  return lines.slice(1).map(l=>{

    const obj = {};
    const cols = l.split(",");

    header.forEach((h,i)=>{
      obj[h] = cols[i];
    });

    return obj;
  }).filter(x=>Object.keys(x).length>1);
}

/* =========================
   🧭 GRAPH BUILD (STOP → DEPARTURES)
========================= */

function buildGraph(){

  const graph = {};

  STOP_TIMES.forEach(st=>{

    if(!graph[st.stop_id]) graph[st.stop_id] = [];

    graph[st.stop_id].push({
      trip:st.trip_id,
      time:st.departure_time
    });
  });

  return graph;
}

/* =========================
   ⏱ TIME CONVERT
========================= */

function timeToSec(t){

  if(!t) return 0;

  const p = t.split(":");
  return (+p[0])*3600 + (+p[1])*60 + (+p[2]||0);
}

/* =========================
   🚏 15 ROW PANEL (REAL DEPARTURES)
========================= */

let graph = {};

function renderPanel(){

  const now = (new Date().getHours()*3600 + new Date().getMinutes()*60);

  let out = [];

  Object.keys(graph).forEach(stop=>{

    graph[stop].slice(0,3).forEach(d=>{

      const diff = timeToSec(d.time) - now;

      out.push({
        stop,
        trip:d.trip,
        delay:diff
      });
    });
  });

  let html = "";

  for(let i=0;i<15;i++){

    const d = out[i % out.length] || {stop:"-",trip:"-",delay:0};

    let color = d.delay > 20 ? "blue" : d.delay < -20 ? "red" : "green";

    html += `
      <div class="row">
        <div>${d.trip}<span class="badge">GTFS</span></div>
        <div>${d.stop}</div>
        <div class="${color}">${Math.round(d.delay/60)}p</div>
      </div>
    `;
  }

  document.getElementById("list").innerHTML = html;
}

/* =========================
   🗺️ MAP STOPS (NO CHAOS COORDS)
========================= */

function renderStops(){

  STOPS.forEach(s=>{

    if(!s.stop_lat || !s.stop_lon) return;

    if(!markers[s.stop_id]){

      markers[s.stop_id] = L.circleMarker([s.stop_lat,s.stop_lon],{
        radius:5,
        color:"#00ff88"
      }).addTo(map).bindPopup(s.stop_name);
    }
  });
}

/* =========================
   INIT SYSTEM (CACHE FIRST)
========================= */

async function init(){

  const cachedStops = await load("stops");

  if(cachedStops){
    STOPS = cachedStops;
    STOP_TIMES = await load("stop_times") || [];
    TRIPS = await load("trips") || [];
  }

  graph = buildGraph();

  renderStops();
  renderPanel();

  setInterval(renderPanel,1000);
}

</script>

</body>
</html>
