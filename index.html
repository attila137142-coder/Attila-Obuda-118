<script>

// 🚏 STOP CACHE

const stops = [

{ id:"1", name:"Nás utca", type:"BKK" },
{ id:"2", name:"Tahitótfalu, hídfő", type:"VOLÁN" },
{ id:"3", name:"Nyugati pályaudvar", type:"BKK" },
{ id:"4", name:"Batthyány tér", type:"BKK" },
{ id:"5", name:"Szentendre, autóbusz-állomás", type:"VOLÁN" },
{ id:"6", name:"Kelenföld vasútállomás", type:"BKK" }

];

// 🧠 NORMALIZE

function normalize(str){

    return str
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"");

}

// 🔍 SEARCH ENGINE

function searchStops(){

    const input =
        document.getElementById("search");

    const results =
        document.getElementById("results");

    const q =
        normalize(input.value);

    results.innerHTML = "";

    if(q.length < 1){
        return;
    }

    const filtered =
        stops.filter(stop =>

            normalize(stop.name)
            .includes(q)

        );

    filtered.forEach(stop=>{

        const div =
            document.createElement("div");

        div.className = "stop";

        div.innerHTML = `
            🚏 ${stop.name}
            <div class="sub">${stop.type}</div>
        `;

        div.onclick = ()=>loadStop(stop);

        results.appendChild(div);

    });

}

// 🚍 PANEL

function loadStop(stop){

    const panel =
        document.getElementById("panel");

    panel.innerHTML =
        `<h2>🚏 ${stop.name}</h2>`;

    const lines = [

        "4","6","7","8E",
        "M2","M3","M4",
        "105","133E",
        "14","47","49",
        "880","890","895"

    ];

    for(let i=0;i<15;i++){

        const mins =
            Math.floor(Math.random()*12)+1;

        const delayed =
            Math.random() > 0.8;

        panel.innerHTML += `

        <div class="row">

            <div class="line">
                ${lines[i]}
            </div>

            <div>
                Irány ${i+1}
            </div>

            <div class="time">
                ${mins} perc
            </div>

            <div class="${
                delayed
                ? 'delay'
                : 'live'
            }">

                ${
                    delayed
                    ? 'KÉSIK'
                    : 'LIVE'
                }

            </div>

        </div>

        `;
    }

}

// 🚀 EVENT LISTENER FIX

window.onload = ()=>{

    document
        .getElementById("search")
        .addEventListener(
            "input",
            searchStops
        );

};

</script>
