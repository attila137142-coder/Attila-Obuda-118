<script>
"use strict";

/* ============================================================
   ATTILA KÖZLEKEDÉS – BKK VADÁSZ FIX15
   REAL DATA ONLY
   ============================================================ */

const APP_NAME =
  "ATTILA KÖZLEKEDÉS – BKK VADÁSZ FIX15";


/* ------------------------------------------------------------
   BKK URL-EK
   ------------------------------------------------------------ */

const URLS = {

  vehiclePositions:
    "https://go.bkk.hu/api/query/v1/ws/gtfs-rt/full/VehiclePositions.pb",

  tripUpdates:
    "https://go.bkk.hu/api/query/v1/ws/gtfs-rt/full/TripUpdates.pb",

  gtfs:
    "https://go.bkk.hu/api/static/v1/public-gtfs/budapest_gtfs.zip",

  futarVehicles:
    "https://go.bkk.hu/api/query/v1/ws/otp/api/where/vehicles-for-location.json",

  tripDetails:
    "https://go.bkk.hu/api/query/v1/ws/otp/api/where/trip-details.json",

  vehicleForTrip:
    "https://go.bkk.hu/api/query/v1/ws/otp/api/where/vehicle-for-trip.json"
};


const PROTO_URL =
  "https://raw.githubusercontent.com/google/transit/master/gtfs-realtime/proto/gtfs-realtime.proto";


/* ------------------------------------------------------------
   ÁLLAPOT
   ------------------------------------------------------------ */

let map = null;
let vehicleLayer = null;
let myMarker = null;

let protoRoot = null;

let vehicleData = [];

let gtfsStops = [];
let gtfsStopsById = new Map();
let gtfsRoutes = new Map();

let gtfsLoaded = false;

let myPos = null;
let gpsWatchId = null;

let autoTimer = null;
let autoRunning = false;

let radiusMode = "all";

let futarVehicleCache = new Map();

let bkkMetaCache = new Map();
let bkkMetaInFlight = new Map();

let tripDelayMap = new Map();
let tripDelaySeqMap = new Map();
let tripDelayStopMap = new Map();
let vehicleTripMap = new Map();
let tripVehicleMap = new Map();

let lastVehicleFetchOK = false;
let lastFutarFetchOK = false;
let lastTripFetchOK = false;


/* ------------------------------------------------------------
   DOM
   ------------------------------------------------------------ */

const $ = id => document.getElementById(id);

const logBox = $("log");
const statusBox = $("status");


/* ------------------------------------------------------------
   NAPLÓ
   ------------------------------------------------------------ */

function log(msg){

  const now = new Date();

  const t =
    now.toLocaleTimeString("hu-HU", {
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    });

  logBox.textContent +=
    `[${t}] ${msg}\n`;

  logBox.scrollTop =
    logBox.scrollHeight;
}


function setStatus(msg){
  statusBox.textContent = msg;
}


/* ------------------------------------------------------------
   SEGÉDFÜGGVÉNYEK
   ------------------------------------------------------------ */

function esc(v){

  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function val(v){

  if(
    v === undefined ||
    v === null ||
    String(v).trim() === ""
  ){
    return "NINCS ADAT";
  }

  return String(v);
}


function hasValue(v){

  return !(
    v === undefined ||
    v === null ||
    String(v).trim() === ""
  );
}


function normalizeId(v){

  if(!hasValue(v)) return "";

  return String(v)
    .trim()
    .replace(/^BKK_/i,"")
    .toLowerCase();
}


function num(v){

  if(v === undefined || v === null) return null;

  const n = Number(v);

  return Number.isFinite(n) ? n : null;
}


function firstValue(obj, keys){

  if(!obj || typeof obj !== "object")
    return null;

  for(const key of keys){

    if(
      Object.prototype.hasOwnProperty.call(obj,key) &&
      hasValue(obj[key])
    ){
      return obj[key];
    }
  }

  return null;
}


/* ------------------------------------------------------------
   BKK API KEY
   A BKK GTFS-RT hozzáférésnél KEY PARAMÉTER KELL.
   ------------------------------------------------------------ */

function getApiKey(){

  return $("apiKey").value.trim();
}


function saveApiKey(){

  const key = getApiKey();

  if(!key){

    log("Nincs megadva BKK API-kulcs.");

    $("badgeBkk").textContent =
      "BKK: API-KULCS HIÁNYZIK";

    $("badgeBkk").className =
      "badge err";

    return;
  }

  localStorage.setItem(
    "attila_bkk_api_key",
    key
  );

  log("BKK API-kulcs elmentve.");

  $("badgeBkk").textContent =
    "BKK: KULCS OK";

  $("badgeBkk").className =
    "badge ok";
}


function loadApiKey(){

  const key =
    localStorage.getItem(
      "attila_bkk_api_key"
    );

  if(key){

    $("apiKey").value = key;

    $("badgeBkk").textContent =
      "BKK: KULCS OK";

    $("badgeBkk").className =
      "badge ok";
  }
}


/*
   FONTOS:
   A kulcsot URL PARAMÉTERKÉNT adjuk át.
   Nem csak headerben.
*/

function bkkUrl(base, params = {}){

  const url = new URL(base);

  const key = getApiKey();

  if(key){

    url.searchParams.set(
      "key",
      key
    );
  }

  for(const [k,v] of Object.entries(params)){

    if(
      v !== undefined &&
      v !== null &&
      String(v) !== ""
    ){
      url.searchParams.set(k,String(v));
    }
  }

  return url.toString();
}


/* ------------------------------------------------------------
   BKK FETCH
   ------------------------------------------------------------ */

async function bkkFetch(
  base,
  params = {},
  options = {}
){

  const url =
    bkkUrl(base,params);

  const headers = {
    ...(options.headers || {})
  };

  /*
     A key URL-ben megy.
     Authorization fejlécet NEM erőltetünk,
     mert a BKK realtime feed dokumentált
     hozzáférése query_param: key.
  */

  const response =
    await fetch(
      url,
      {
        ...options,
        headers,
        cache:"no-store"
      }
    );

  if(!response.ok){

    if(response.status === 401){

      throw new Error(
        "HTTP 401 – BKK API-kulcs elutasítva vagy hiányzik."
      );
    }

    throw new Error(
      `HTTP ${response.status}`
    );
  }

  return response;
}


/* ------------------------------------------------------------
   MAP
   ------------------------------------------------------------ */

function initMap(){

  map =
    L.map("map",{
      zoomControl:true
    }).setView(
      [47.4979,19.0402],
      11
    );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:"© OpenStreetMap"
    }
  ).addTo(map);

  vehicleLayer =
    L.layerGroup().addTo(map);
}


/* ------------------------------------------------------------
   GPS
   ------------------------------------------------------------ */

function startGPS(){

  if(!navigator.geolocation){

    log("A böngésző nem támogatja a GPS-t.");

    $("badgeGps").textContent =
      "GPS: NINCS";

    $("badgeGps").className =
      "badge err";

    return;
  }

  if(gpsWatchId !== null){

    navigator.geolocation.clearWatch(
      gpsWatchId
    );
  }

  gpsWatchId =
    navigator.geolocation.watchPosition(

      pos => {

        myPos = {
          lat:pos.coords.latitude,
          lon:pos.coords.longitude
        };

        $("badgeGps").textContent =
          "GPS: OK";

        $("badgeGps").className =
          "badge ok";

        if(myMarker){
          myMarker.setLatLng([
            myPos.lat,
            myPos.lon
          ]);
        }
        else{

          myMarker =
            L.marker([
              myPos.lat,
              myPos.lon
            ])
            .addTo(map)
            .bindPopup(
              "SAJÁT GPS"
            );
        }

      },

      err => {

        log(
          "GPS hiba: " +
          err.message
        );

        $("badgeGps").textContent =
          "GPS: HIBA";

        $("badgeGps").className =
          "badge err";
      },

      {
        enableHighAccuracy:true,
        maximumAge:5000,
        timeout:15000
      }
    );
}


/* ------------------------------------------------------------
   PROTOBUF
   ------------------------------------------------------------ */

async function loadProto(){

  if(protoRoot)
    return protoRoot;

  protoRoot =
    await protobuf.load(
      PROTO_URL
    );

  return protoRoot;
}


/* ------------------------------------------------------------
   GTFS
   ------------------------------------------------------------ */

async function loadGTFS(){

  if(gtfsLoaded)
    return;

  try{

    log("BKK GTFS betöltés...");

    const response =
      await fetch(
        URLS.gtfs,
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        `GTFS HTTP ${response.status}`
      );
    }

    const buffer =
      await response.arrayBuffer();

    /*
      JSZip külön töltődik.
    */

    if(!window.JSZip){

      await loadScript(
        "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
      );
    }

    const zip =
      await JSZip.loadAsync(
        buffer
      );


    /* STOPS */

    if(zip.file("stops.txt")){

      const text =
        await zip.file("stops.txt")
          .async("text");

      parseStops(text);
    }


    /* ROUTES */

    if(zip.file("routes.txt")){

      const text =
        await zip.file("routes.txt")
          .async("text");

      parseRoutes(text);
    }


    gtfsLoaded = true;

    $("badgeGtfs").textContent =
      `GTFS: ${gtfsStops.length} megálló / ${gtfsRoutes.size} vonal`;

    $("badgeGtfs").className =
      "badge ok";

    log(
      `BKK GTFS betöltve: ${gtfsStops.length} megálló, ${gtfsRoutes.size} vonal.`
    );

  }
  catch(err){

    $("badgeGtfs").textContent =
      "GTFS: HIBA";

    $("badgeGtfs").className =
      "badge err";

    log(
      "GTFS hiba: " +
      err.message
    );
  }
}


function loadScript(src){

  return new Promise(
    (resolve,reject)=>{

      const s =
        document.createElement("script");

      s.src = src;

      s.onload = resolve;

      s.onerror =
        () => reject(
          new Error(
            "Script betöltési hiba: " + src
          )
        );

      document.head.appendChild(s);
    }
  );
}


function parseCSVLine(line){

  const out = [];

  let cur = "";
  let quoted = false;

  for(let i=0;i<line.length;i++){

    const c = line[i];

    if(c === '"'){

      if(
        quoted &&
        line[i+1] === '"'
      ){
        cur += '"';
        i++;
      }
      else{
        quoted = !quoted;
      }

      continue;
    }

    if(c === "," && !quoted){

      out.push(cur);
      cur = "";

    }
    else{
      cur += c;
    }
  }

  out.push(cur);

  return out;
}


function parseCSV(text){

  const lines =
    text
      .replace(/^\uFEFF/,"")
      .split(/\r?\n/)
      .filter(Boolean);

  if(!lines.length)
    return [];

  const headers =
    parseCSVLine(lines[0]);

  const result = [];

  for(let i=1;i<lines.length;i++){

    const cells =
      parseCSVLine(lines[i]);

    const obj = {};

    headers.forEach(
      (h,index)=>{
        obj[h] =
          cells[index] ?? "";
      }
    );

    result.push(obj);
  }

  return result;
}


function parseStops(text){

  gtfsStops =
    parseCSV(text);

  gtfsStopsById =
    new Map();

  for(const s of gtfsStops){

    const id =
      s.stop_id;

    if(id){

      gtfsStopsById.set(
        normalizeId(id),
        s
      );
    }
  }
}


function parseRoutes(text){

  const rows =
    parseCSV(text);

  gtfsRoutes =
    new Map();

  for(const r of rows){

    if(r.route_id){

      gtfsRoutes.set(
        normalizeId(r.route_id),
        r
      );
    }
  }
}


/* ------------------------------------------------------------
   GTFS-RT VEHICLE POSITIONS
   ------------------------------------------------------------ */

async function fetchVehiclePositions(){

  log(
    "BKK VehiclePositions lekérés..."
  );

  try{

    const response =
      await bkkFetch(
        URLS.vehiclePositions
      );

    const buffer =
      await response.arrayBuffer();

    const root =
      await loadProto();

    const FeedMessage =
      root.lookupType(
        "transit_realtime.FeedMessage"
      );

    const message =
      FeedMessage.decode(
        new Uint8Array(buffer)
      );

    const arr = [];

    for(const entity of message.entity || []){

      const vp =
        entity.vehicle;

      if(!vp)
        continue;

      const trip =
        vp.trip || {};

      const position =
        vp.position || {};

      const vehicle =
        vp.vehicle || {};

      const obj = {

        source:"GTFS-RT VehiclePositions",

        vehicleId:
          vehicle.id ?? null,

        label:
          vehicle.label ?? null,

        licensePlate:
          vehicle.licensePlate ?? null,

        routeId:
          trip.routeId ?? null,

        tripId:
          trip.tripId ?? null,

        directionId:
          trip.directionId ?? null,

        stopId:
          vp.stopId ?? null,

        stopSequence:
          num(
            vp.currentStopSequence
          ),

        lat:
          num(position.latitude),

        lon:
          num(position.longitude),

        speed:
          num(position.speed),

        bearing:
          num(position.bearing),

        timestamp:
          vp.timestamp
            ? Number(vp.timestamp)
            : null,

        currentStatus:
          vp.currentStatus ?? null,

        forgalmi:null,
        vehicleType:null,
        blockId:null,

        delay:null,
        delaySource:null,

        forgalmiSource:null,
        vehicleTypeSource:null

      };

      if(
        obj.lat !== null &&
        obj.lon !== null
      ){
        arr.push(obj);
      }
    }

    vehicleData =
      arr;

    lastVehicleFetchOK = true;

    $("badgeVp").textContent =
      `VP: ${arr.length}`;

    $("badgeVp").className =
      "badge ok";

    log(
      `VehiclePositions OK: ${arr.length} valódi jármű.`
    );

    return arr;

  }
  catch(err){

    lastVehicleFetchOK = false;

    $("badgeVp").textContent =
      "VP: HIBA";

    $("badgeVp").className =
      "badge err";

    log(
      "VehiclePositions hiba: " +
      err.message
    );

    return [];
  }
}


/* ------------------------------------------------------------
   TRIP UPDATES
   ------------------------------------------------------------ */

function getDelayValue(x){

  if(x === undefined || x === null)
    return null;

  if(
    typeof x === "number" &&
    Number.isFinite(x)
  ){
    return x;
  }

  if(
    typeof x === "object" &&
    x.delay !== undefined
  ){

    const n =
      Number(x.delay);

    if(Number.isFinite(n))
      return n;
  }

  return null;
}


function scheduleRelationshipIsNoData(v){

  if(v === undefined || v === null)
    return false;

  const s =
    String(v)
      .toUpperCase();

  return (
    s === "NO_DATA" ||
    s === "2"
  );
}


async function fetchTripUpdates(){

  log(
    "BKK TripUpdates lekérés..."
  );

  try{

    const response =
      await bkkFetch(
        URLS.tripUpdates
      );

    const buffer =
      await response.arrayBuffer();

    const root =
      await loadProto();

    const FeedMessage =
      root.lookupType(
        "transit_realtime.FeedMessage"
      );

    const message =
      FeedMessage.decode(
        new Uint8Array(buffer)
      );


    tripDelayMap = new Map();
    tripDelaySeqMap = new Map();
    tripDelayStopMap = new Map();

    vehicleTripMap = new Map();
    tripVehicleMap = new Map();

    let tripCount = 0;
    let stopUpdateCount = 0;


    for(const entity of message.entity || []){

      const tu =
        entity.tripUpdate;

      if(!tu)
        continue;

      const trip =
        tu.trip || {};

      const tripId =
        trip.tripId;

      if(!hasValue(tripId))
        continue;

      const tripKey =
        normalizeId(tripId);


      tripCount++;


      const vehicle =
        tu.vehicle || {};

      if(hasValue(vehicle.id)){

        const vehicleKey =
          normalizeId(vehicle.id);

        vehicleTripMap.set(
          vehicleKey,
          tripKey
        );

        tripVehicleMap.set(
          tripKey,
          vehicleKey
        );
      }


      let tripLevelDelay = null;

      /*
        Ha nincs stop-szintű érték,
        a trip-level adatot is eltároljuk.
      */

      for(
        const stu of
        tu.stopTimeUpdate || []
      ){

        if(
          scheduleRelationshipIsNoData(
            stu.scheduleRelationship
          )
        ){
          continue;
        }

        const seq =
          num(
            stu.stopSequence
          );

        const stopId =
          stu.stopId ?? null;

        let delay = null;


        if(stu.departure){

          delay =
            getDelayValue(
              stu.departure
            );
        }


        if(delay === null){

          if(stu.arrival){

            delay =
              getDelayValue(
                stu.arrival
              );
          }
        }


        if(delay === null)
          continue;


        stopUpdateCount++;


        if(seq !== null){

          if(
            !tripDelaySeqMap.has(
              tripKey
            )
          ){
            tripDelaySeqMap.set(
              tripKey,
              []
            );
          }

          tripDelaySeqMap
            .get(tripKey)
            .push({
              seq,
              stopId,
              delay
            });
        }


        if(hasValue(stopId)){

          const stopKey =
            normalizeId(stopId);

          if(
            !tripDelayStopMap.has(
              tripKey
            )
          ){
            tripDelayStopMap.set(
              tripKey,
              new Map()
            );
          }

          tripDelayStopMap
            .get(tripKey)
            .set(
              stopKey,
              delay
            );
        }


        /*
          Az első / aktuális értékből
          trip-level tartalék.
        */

        if(
          tripLevelDelay === null
        ){
          tripLevelDelay = delay;
        }
      }


      if(tripLevelDelay !== null){

        tripDelayMap.set(
          tripKey,
          tripLevelDelay
        );
      }
    }


    /*
      Stop sequence szerint rendezzük.
    */

    for(
      const arr of
      tripDelaySeqMap.values()
    ){

      arr.sort(
        (a,b)=>
          a.seq-b.seq
      );
    }


    lastTripFetchOK = true;

    $("badgeTu").textContent =
      `TU: ${tripCount}`;

    $("badgeTu").className =
      "badge ok";

    log(
      `TripUpdates OK: ${tripCount} trip | ${stopUpdateCount} stop-delay adat.`
    );

    applyTripDelays();

    return true;

  }
  catch(err){

    lastTripFetchOK = false;

    $("badgeTu").textContent =
      "TU: HIBA";

    $("badgeTu").className =
      "badge err";

    log(
      "TripUpdates hiba: " +
      err.message
    );

    return false;
  }
}


/* ------------------------------------------------------------
   DELAY ÖSSZEFÉSÜLÉS
   ------------------------------------------------------------ */

function chooseTripDelay(v){

  const tripKey =
    normalizeId(v.tripId);

  const vehicleKey =
    normalizeId(v.vehicleId);


  /*
    1. Saját trip + aktuális stop sequence
  */

  if(tripKey){

    const arr =
      tripDelaySeqMap.get(
        tripKey
      );

    if(
      arr &&
      arr.length
    ){

      if(
        v.stopSequence !== null &&
        v.stopSequence !== undefined
      ){

        const exact =
          arr.find(
            x =>
              x.seq ===
              Number(v.stopSequence)
          );

        if(exact){

          return {
            delay:exact.delay,
            source:"TripUpdates / stopSequence"
          };
        }


        /*
          Ha nincs pontos sequence,
          a legközelebbi következő stop.
        */

        const future =
          arr
            .filter(
              x =>
                x.seq >=
                Number(v.stopSequence)
            )
            .sort(
              (a,b)=>
                a.seq-b.seq
            )[0];

        if(future){

          return {
            delay:future.delay,
            source:"TripUpdates / következő stop"
          };
        }
      }


      /*
        2. Stop ID alapján
      */

      if(hasValue(v.stopId)){

        const mapByStop =
          tripDelayStopMap.get(
            tripKey
          );

        if(mapByStop){

          const d =
            mapByStop.get(
              normalizeId(v.stopId)
            );

          if(d !== undefined){

            return {
              delay:d,
              source:"TripUpdates / stopId"
            };
          }
        }
      }


      /*
        3. Legközelebbi stop update
      */

      if(arr.length){

        const candidate =
          arr
            .slice()
            .sort(
              (a,b)=>{
                const da =
                  Math.abs(
                    a.seq -
                    Number(
                      v.stopSequence ?? 0
                    )
                  );

                const db =
                  Math.abs(
                    b.seq -
                    Number(
                      v.stopSequence ?? 0
                    )
                  );

                return da-db;
              }
            )[0];

        if(candidate){

          return {
            delay:candidate.delay,
            source:"TripUpdates / legközelebbi stop"
          };
        }
      }
    }
  }


  /*
    4. Vehicle ID → Trip ID
  */

  if(vehicleKey){

    const mappedTrip =
      vehicleTripMap.get(
        vehicleKey
      );

    if(mappedTrip){

      const arr =
        tripDelaySeqMap.get(
          mappedTrip
        );

      if(arr && arr.length){

        let candidate =
          null;

        if(
          v.stopSequence !== null &&
          v.stopSequence !== undefined
        ){

          candidate =
            arr.find(
              x =>
                x.seq ===
                Number(v.stopSequence)
            );
        }

        if(!candidate){

          candidate =
            arr[0];
        }

        if(candidate){

          return {
            delay:candidate.delay,
            source:
              "TripUpdates / vehicle→trip"
          };
        }
      }


      const d =
        tripDelayMap.get(
          mappedTrip
        );

      if(d !== undefined){

        return {
          delay:d,
          source:
            "TripUpdates / vehicle→trip"
        };
      }
    }
  }


  /*
    5. Trip-level
  */

  if(tripKey){

    const d =
      tripDelayMap.get(
        tripKey
      );

    if(d !== undefined){

      return {
        delay:d,
        source:
          "TripUpdates / trip"
      };
    }
  }


  return {
    delay:null,
    source:null
  };
}


function applyTripDelays(){

  let bound = 0;

  for(const v of vehicleData){

    const result =
      chooseTripDelay(v);

    v.delay =
      result.delay;

    v.delaySource =
      result.source;

    if(
      result.delay !== null
    ){
      bound++;
    }
  }

  log(
    `KÉSÉS/SIETÉS összefésülve: ${bound}/${vehicleData.length} jármű.`
  );
}


/* ------------------------------------------------------------
   DELAY MEGJELENÍTÉS
   ------------------------------------------------------------ */

function formatDelay(seconds){

  if(
    seconds === null ||
    seconds === undefined ||
    !Number.isFinite(
      Number(seconds)
    )
  ){
    return {
      html:"NINCS ADAT",
      cls:"delay-na"
    };
  }

  const n =
    Math.round(
      Number(seconds)
    );

  if(n === 0){

    return {
      html:"🟢 0:00",
      cls:"delay-zero"
    };
  }

  const abs =
    Math.abs(n);

  const min =
    Math.floor(
      abs / 60
    );

  const sec =
    abs % 60;

  const text =
    `${min}:${String(sec).padStart(2,"0")}`;

  if(n < 0){

    return {
      html:
        `🔴 SIETÉS −${text}`,
      cls:"delay-early"
    };
  }

  return {
    html:
      `🔵 KÉSÉS +${text}`,
    cls:"delay-late"
  };
}


/* ------------------------------------------------------------
   REKURZÍV OBJECT SEGÉDEK
   ------------------------------------------------------------ */

function walkObjects(
  root,
  callback,
  depth = 0,
  maxDepth = 8
){

  if(
    !root ||
    typeof root !== "object" ||
    depth > maxDepth
  ){
    return;
  }

  if(Array.isArray(root)){

    for(const x of root){

      if(
        x &&
        typeof x === "object"
      ){

        callback(x);

        walkObjects(
          x,
          callback,
          depth+1,
          maxDepth
        );
      }
    }

    return;
  }


  callback(root);


  for(const value of Object.values(root)){

    if(
      value &&
      typeof value === "object"
    ){

      walkObjects(
        value,
        callback,
        depth+1,
        maxDepth
      );
    }
  }
}


/* ------------------------------------------------------------
   VALÓDI JÁRMŰREKORD FELISMERÉS
   ------------------------------------------------------------ */

function looksLikeVehicleRecord(o){

  if(
    !o ||
    typeof o !== "object" ||
    Array.isArray(o)
  ){
    return false;
  }

  const keys =
    Object.keys(o)
      .map(
        x =>
          x.toLowerCase()
      );

  const hasVehicle =
    keys.some(
      k =>
        k === "vehicleid" ||
        k === "vehicle_id" ||
        k === "vehicle"
    );

  const hasPosition =
    (
      keys.includes("lat") ||
      keys.includes("latitude")
    ) &&
    (
      keys.includes("lon") ||
      keys.includes("longitude")
    );

  const hasTrip =
    keys.includes("tripid") ||
    keys.includes("trip_id") ||
    keys.includes("trip");

  return (
    hasPosition &&
    (
      hasVehicle ||
      hasTrip
    )
  );
}


/* ------------------------------------------------------------
   FUTÁR NORMALIZÁLÁS
   ------------------------------------------------------------ */

const FORGALMI_FIELDS = [

  "forgalmi",
  "forgalmiSzam",
  "forgalmi_szam",
  "forgalmiNumber",
  "forgalmi_number",

  "fleetNumber",
  "fleetNo",
  "fleet_number",

  "vehicleNumber",
  "vehicle_number",

  "fleetVehicleNumber",

  "fleetVehicleNo",

  "garageNumber",

  "operationalNumber",

  "vehicleNo",

  "vehicle_number"
];


const VEHICLE_TYPE_FIELDS = [

  "vehicleType",
  "vehicle_type",
  "vehicleTypeName",
  "vehicle_type_name",

  "modelName",
  "model_name",

  "vehicleModel",
  "vehicle_model",

  "typeName",
  "type_name",

  "vehicleClass",
  "vehicle_class",

  "model"
];


const BLOCK_FIELDS = [

  "blockId",
  "block_id",
  "block",

  "forda",
  "fordaId",
  "forda_id"
];


function extractDeepExplicit(
  obj,
  fields,
  maxDepth = 6
){

  let found = null;

  function scan(x,depth){

    if(
      found !== null ||
      !x ||
      typeof x !== "object" ||
      depth > maxDepth
    ){
      return;
    }

    if(Array.isArray(x)){

      for(const item of x){

        scan(
          item,
          depth+1
        );

        if(found !== null)
          return;
      }

      return;
    }


    for(const field of fields){

      if(
        Object.prototype.hasOwnProperty.call(
          x,
          field
        ) &&
        hasValue(x[field])
      ){

        found =
          x[field];

        return;
      }
    }


    for(const value of Object.values(x)){

      if(
        value &&
        typeof value === "object"
      ){

        scan(
          value,
          depth+1
        );

        if(found !== null)
          return;
      }
    }
  }

  scan(obj,0);

  return found;
}


function normalizeFutarVehicle(raw){

  if(
    !raw ||
    typeof raw !== "object"
  ){
    return null;
  }


  let vehicleId =
    firstValue(
      raw,
      [
        "vehicleId",
        "vehicle_id"
      ]
    );


  if(!vehicleId && raw.vehicle){

    if(typeof raw.vehicle === "string"){

      vehicleId =
        raw.vehicle;

    }
    else{

      vehicleId =
        firstValue(
          raw.vehicle,
          [
            "id",
            "vehicleId",
            "vehicle_id"
          ]
        );
    }
  }


  let tripId =
    firstValue(
      raw,
      [
        "tripId",
        "trip_id"
      ]
    );


  if(!tripId && raw.trip){

    if(typeof raw.trip === "string"){

      tripId =
        raw.trip;

    }
    else{

      tripId =
        firstValue(
          raw.trip,
          [
            "id",
            "tripId",
            "trip_id"
          ]
        );
    }
  }


  const routeId =
    firstValue(
      raw,
      [
        "routeId",
        "route_id"
      ]
    ) ??
    (
      raw.route &&
      typeof raw.route === "object"
        ? firstValue(
            raw.route,
            [
              "id",
              "routeId",
              "route_id"
            ]
          )
        : raw.route
    );


  const licensePlate =
    firstValue(
      raw,
      [
        "licensePlate",
        "license_plate",
        "plate",
        "registration"
      ]
    );


  const label =
    firstValue(
      raw,
      [
        "label",
        "vehicleLabel",
        "vehicle_label"
      ]
    );


  const forgalmi =
    extractDeepExplicit(
      raw,
      FORGALMI_FIELDS
    );


  const vehicleType =
    extractDeepExplicit(
      raw,
      VEHICLE_TYPE_FIELDS
    );


  const blockId =
    extractDeepExplicit(
      raw,
      BLOCK_FIELDS
    );


  let lat =
    firstValue(
      raw,
      [
        "lat",
        "latitude"
      ]
    );


  let lon =
    firstValue(
      raw,
      [
        "lon",
        "longitude"
      ]
    );


  if(
    (!hasValue(lat) ||
     !hasValue(lon)) &&
    raw.position
  ){

    lat =
      firstValue(
        raw.position,
        [
          "lat",
          "latitude"
        ]
      );

    lon =
      firstValue(
        raw.position,
        [
          "lon",
          "longitude"
        ]
      );
  }


  return {

    raw,

    vehicleId,
    tripId,
    routeId,

    licensePlate,
    label,

    forgalmi:
      hasValue(forgalmi)
        ? forgalmi
        : null,

    vehicleType:
      hasValue(vehicleType)
        ? vehicleType
        : null,

    blockId:
      hasValue(blockId)
        ? blockId
        : null,

    lat:num(lat),
    lon:num(lon),

    speed:
      num(
        firstValue(
          raw,
          [
            "speed"
          ]
        )
      ),

    bearing:
      num(
        firstValue(
          raw,
          [
            "bearing"
          ]
        )
      ),

    stopId:
      firstValue(
        raw,
        [
          "stopId",
          "stop_id"
        ]
      ),

    stopSequence:
      num(
        firstValue(
          raw,
          [
            "stopSequence",
            "stop_sequence"
          ]
        )
      )
  };
}


/* ------------------------------------------------------------
   FUTÁR RESPONSE FELDOLGOZÁS
   ------------------------------------------------------------ */

function collectFutarVehicleCandidates(
  json
){

  const result = [];

  const seen =
    new Set();

  walkObjects(
    json,
    obj => {

      if(
        !looksLikeVehicleRecord(obj)
      ){
        return;
      }

      if(
        seen.has(obj)
      ){
        return;
      }

      seen.add(obj);

      const v =
        normalizeFutarVehicle(
          obj
        );

      if(
        v &&
        v.lat !== null &&
        v.lon !== null
      ){

        result.push(v);
      }
    },
    0,
    7
  );

  return result;
}


/* ------------------------------------------------------------
   FUTÁR KERESÉS
   ------------------------------------------------------------ */

function findFutarMatch(v){

  const vehicleKey =
    normalizeId(
      v.vehicleId
    );

  const tripKey =
    normalizeId(
      v.tripId
    );

  const plate =
    hasValue(v.licensePlate)
      ? String(
          v.licensePlate
        ).toLowerCase()
      : "";


  /*
    1. Vehicle ID
  */

  if(vehicleKey){

    const exact =
      futarVehicleCache.get(
        "vehicle|" +
        vehicleKey
      );

    if(exact)
      return exact;
  }


  /*
    2. Trip ID
  */

  if(tripKey){

    const exact =
      futarVehicleCache.get(
        "trip|" +
        tripKey
      );

    if(exact)
      return exact;
  }


  /*
    3. Rendszám
  */

  if(plate){

    const exact =
      futarVehicleCache.get(
        "plate|" +
        plate
      );

    if(exact)
      return exact;
  }


  return null;
}

   FUTÁR BETÖLTÉS
   ------------------------------------------------------------ */

async function loadFutarVehicles(){

  /*
    GPS nélkül Budapest közepét használjuk.
    Ez csak keresési középpont,
    nem kitalált járműadat.
  */

  const lat =
    myPos?.lat ?? 47.5000;

  const lon =
    myPos?.lon ?? 19.0412;


  try{

    const response =
      await bkkFetch(
        URLS.futarVehicles,
        {
          lat,
          lon,
          latSpan:0.5,
          lonSpan:0.5
        }
      );


    const json =
      await response.json();


    const list =
      collectFutarVehicleCandidates(
        json
      );


    futarVehicleCache =
      new Map();


    for(const v of list){

      if(hasValue(v.vehicleId)){

        futarVehicleCache.set(
          "vehicle|" +
          normalizeId(v.vehicleId),
          v
        );
      }


      if(hasValue(v.tripId)){

        futarVehicleCache.set(
          "trip|" +
          normalizeId(v.tripId),
          v
        );
      }


      if(hasValue(v.licensePlate)){

        futarVehicleCache.set(
          "plate|" +
          String(
            v.licensePlate
          ).toLowerCase(),
          v
        );
      }
    }


    let bound = 0;


    /*
      FUTÁR → GTFS-RT VP
    */

    for(const v of vehicleData){

      const f =
        findFutarMatch(v);

      if(!f)
        continue;


      bound++;


      if(
        !hasValue(v.licensePlate) &&
        hasValue(f.licensePlate)
      ){
        v.licensePlate =
          f.licensePlate;
      }


      if(
        !hasValue(v.label) &&
        hasValue(f.label)
      ){
        v.label =
          f.label;
      }


      if(
        !hasValue(v.forgalmi) &&
        hasValue(f.forgalmi)
      ){

        v.forgalmi =
          f.forgalmi;

        v.forgalmiSource =
          "FUTÁR";
      }


      if(
        !hasValue(v.vehicleType) &&
        hasValue(f.vehicleType)
      ){

        v.vehicleType =
          f.vehicleType;

        v.vehicleTypeSource =
          "FUTÁR";
      }


      if(
        !hasValue(v.blockId) &&
        hasValue(f.blockId)
      ){

        v.blockId =
          f.blockId;
      }
    }


    lastFutarFetchOK = true;


    $("badgeFutar").textContent =
      `FUTÁR: ${list.length}`;

    $("badgeFutar").className =
      "badge ok";


    log(
      `FUTÁR: ${list.length} valódi rekord | VP-hez kötve: ${bound} | új FUTÁR rekord: 0`
    );


    return list;

  }
  catch(err){

    lastFutarFetchOK = false;


    $("badgeFutar").textContent =
      "FUTÁR: HIBA";

    $("badgeFutar").className =
      "badge err";


    log(
      "FUTÁR hiba: " +
      err.message
    );


    return [];
  }
}


/* ------------------------------------------------------------
   BKK META
   ------------------------------------------------------------ */

function findMatchingObjects(
  json,
  vehicleId,
  tripId,
  plate
){

  const result = [];

  const vk =
    normalizeId(vehicleId);

  const tk =
    normalizeId(tripId);

  const pk =
    hasValue(plate)
      ? String(plate).toLowerCase()
      : "";


  walkObjects(
    json,
    obj => {

      if(
        !obj ||
        typeof obj !== "object" ||
        Array.isArray(obj)
      ){
        return;
      }


      const candidateVehicle =
        firstValue(
          obj,
          [
            "vehicleId",
            "vehicle_id"
          ]
        );


      const candidateTrip =
        firstValue(
          obj,
          [
            "tripId",
            "trip_id"
          ]
        );


      const candidatePlate =
        firstValue(
          obj,
          [
            "licensePlate",
            "license_plate",
            "plate",
            "registration"
          ]
        );


      const sameVehicle =
        vk &&
        candidateVehicle &&
        normalizeId(
          candidateVehicle
        ) === vk;


      const sameTrip =
        tk &&
        candidateTrip &&
        normalizeId(
          candidateTrip
        ) === tk;


      const samePlate =
        pk &&
        candidatePlate &&
        String(
          candidatePlate
        ).toLowerCase() === pk;


      if(
        sameVehicle ||
        sameTrip ||
        samePlate
      ){

        result.push({
          obj,
          score:
            sameVehicle ? 100 :
            sameTrip ? 80 :
            samePlate ? 60 :
            0
        });
      }

    },
    0,
    9
  );


  result.sort(
    (a,b)=>
      b.score-a.score
  );


  return result;
}


function extractBkkMeta(
  json,
  v
){

  const candidates =
    findMatchingObjects(
      json,
      v.vehicleId,
      v.tripId,
      v.licensePlate
    );


  for(const c of candidates){

    const obj =
      c.obj;


    const forgalmi =
      extractDeepExplicit(
        obj,
        FORGALMI_FIELDS
      );


    const vehicleType =
      extractDeepExplicit(
        obj,
        VEHICLE_TYPE_FIELDS
      );


    const blockId =
      extractDeepExplicit(
        obj,
        BLOCK_FIELDS
      );


    if(
      hasValue(forgalmi) ||
      hasValue(vehicleType) ||
      hasValue(blockId)
    ){

      return {

        forgalmi:
          hasValue(forgalmi)
            ? forgalmi
            : null,

        vehicleType:
          hasValue(vehicleType)
            ? vehicleType
            : null,

        blockId:
          hasValue(blockId)
            ? blockId
            : null,

        score:c.score
      };
    }
  }


  return null;
}


/* ------------------------------------------------------------
   BKK META LEKÉRÉS
   ------------------------------------------------------------ */

async function fetchBkkVehicleMeta(v){

  const cacheKey =
    [
      normalizeId(v.vehicleId),
      normalizeId(v.tripId),
      String(
        v.licensePlate ?? ""
      ).toLowerCase()
    ].join("|");


  if(
    bkkMetaCache.has(
      cacheKey
    )
  ){

    return bkkMetaCache.get(
      cacheKey
    );
  }


  if(
    bkkMetaInFlight.has(
      cacheKey
    )
  ){

    return bkkMetaInFlight.get(
      cacheKey
    );
  }


  const promise =
    (async()=>{

      let merged = {

        forgalmi:null,
        vehicleType:null,
        blockId:null
      };


      /*
        TRIP DETAILS
      */

      if(hasValue(v.tripId)){

        try{

          const r =
            await bkkFetch(
              URLS.tripDetails,
              {
                tripId:v.tripId
              }
            );


          const j =
            await r.json();


          const meta =
            extractBkkMeta(
              j,
              v
            );


          if(meta){

            if(
              hasValue(meta.forgalmi)
            ){
              merged.forgalmi =
                meta.forgalmi;
            }

            if(
              hasValue(meta.vehicleType)
            ){
              merged.vehicleType =
                meta.vehicleType;
            }

            if(
              hasValue(meta.blockId)
            ){
              merged.blockId =
                meta.blockId;
            }
          }

        }
        catch(err){

          log(
            `BKK trip-details hiba (${v.vehicleId ?? "NINCS ID"}): ${err.message}`
          );
        }
      }


      /*
        VEHICLE FOR TRIP
      */

      try{

        const params = {};

        if(hasValue(v.tripId)){
          params.tripId =
            v.tripId;
        }

        if(hasValue(v.vehicleId)){
          params.vehicleId =
            v.vehicleId;
        }


        const r =
          await bkkFetch(
            URLS.vehicleForTrip,
            params
          );


        const j =
          await r.json();


        const meta =
          extractBkkMeta(
            j,
            v
          );


        if(meta){

          if(
            !hasValue(merged.forgalmi) &&
            hasValue(meta.forgalmi)
          ){
            merged.forgalmi =
              meta.forgalmi;
          }

          if(
            !hasValue(merged.vehicleType) &&
            hasValue(meta.vehicleType)
          ){
            merged.vehicleType =
              meta.vehicleType;
          }

          if(
            !hasValue(merged.blockId) &&
            hasValue(meta.blockId)
          ){
            merged.blockId =
              meta.blockId;
          }
        }

      }
      catch(err){

        log(
          `BKK vehicle-for-trip hiba (${v.vehicleId ?? "NINCS ID"}): ${err.message}`
        );
      }


      bkkMetaCache.set(
        cacheKey,
        merged
      );


      return merged;

    })();


  bkkMetaInFlight.set(
    cacheKey,
    promise
  );


  try{

    return await promise;

  }
  finally{

    bkkMetaInFlight.delete(
      cacheKey
    );
  }
}


/* ------------------------------------------------------------
   BKK META ÖSSZEFÉSÜLÉS
   ------------------------------------------------------------ */

async function enrichBkkVehicles(){

  const list =
    vehicleData
      .filter(
        v =>
          !hasValue(v.forgalmi) ||
          !hasValue(v.vehicleType)
      )
      .slice(0,60);


  if(!list.length){

    log(
      "BKK meta: minden látható járműnél már van explicit forgalmi/típus."
    );

    return;
  }


  log(
    `BKK meta összefésülés indul: ${list.length} jármű.`
  );


  let forgalmiBound = 0;
  let typeBound = 0;


  /*
    Kis batch-ekben,
    hogy ne terheljük feleslegesen az API-t.
  */

  for(
    let i=0;
    i<list.length;
    i+=5
  ){

    const batch =
      list.slice(
        i,
        i+5
      );


    await Promise.all(
      batch.map(
        async v => {

          const meta =
            await fetchBkkVehicleMeta(
              v
            );


          if(
            !hasValue(v.forgalmi) &&
            hasValue(meta.forgalmi)
          ){

            v.forgalmi =
              meta.forgalmi;

            v.forgalmiSource =
              "BKK meta";

            forgalmiBound++;
          }


          if(
            !hasValue(v.vehicleType) &&
            hasValue(meta.vehicleType)
          ){

            v.vehicleType =
              meta.vehicleType;

            v.vehicleTypeSource =
              "BKK meta";

            typeBound++;
          }


          if(
            !hasValue(v.blockId) &&
            hasValue(meta.blockId)
          ){

            v.blockId =
              meta.blockId;
          }

        }
      )
    );

  }


  log(
    `BKV adat-összefésülés: FORGALMI +${forgalmiBound} | JÁRMŰTÍPUS +${typeBound}.`
  );


  renderVehicles();
}


/* ------------------------------------------------------------
   STOP / TÁVOLSÁG
   ------------------------------------------------------------ */

function haversine(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const a =
    Math.sin(
      (lat2-lat1) *
      Math.PI/180 / 2
    ) ** 2
    +
    Math.cos(
      lat1*Math.PI/180
    )
    *
    Math.cos(
      lat2*Math.PI/180
    )
    *
    Math.sin(
      (lon2-lon1) *
      Math.PI/180 / 2
    ) ** 2;

  return (
    2 *
    R *
    Math.asin(
      Math.sqrt(a)
    )
  );
}


function nearestStop(v){

  if(
    v.lat === null ||
    v.lon === null ||
    !gtfsStops.length
  ){
    return null;
  }


  let best = null;
  let bestDist = Infinity;


  for(const s of gtfsStops){

    const lat =
      Number(
        s.stop_lat
      );

    const lon =
      Number(
        s.stop_lon
      );

    if(
      !Number.isFinite(lat) ||
      !Number.isFinite(lon)
    ){
      continue;
    }


    const d =
      haversine(
        v.lat,
        v.lon,
        lat,
        lon
      );


    if(d < bestDist){

      bestDist = d;

      best = {
        stop:s,
        distance:d
      };
    }
  }


  return best;
}


/* ------------------------------------------------------------
   TÁVOLSÁG SAJÁT GPS-TŐL
   ------------------------------------------------------------ */

function gpsDistance(v){

  if(
    !myPos ||
    v.lat === null ||
    v.lon === null
  ){
    return null;
  }

  return haversine(
    myPos.lat,
    myPos.lon,
    v.lat,
    v.lon
  );
}


/* ------------------------------------------------------------
   JÁRMŰ KERESÉS
   ------------------------------------------------------------ */

function vehicleSearchText(v){

  return [

    v.routeId,
    v.label,
    v.vehicleId,
    v.tripId,
    v.licensePlate,
    v.forgalmi,
    v.vehicleType,
    v.blockId

  ]
    .filter(hasValue)
    .join(" ")
    .toLowerCase();
}


function filteredVehicles(){

  const all =
    vehicleData;


  const q =
    $("searchAll")
      .value
      .trim()
      .toLowerCase();


  const route =
    $("searchRoute")
      .value
      .trim()
      .toLowerCase();


  const plate =
    $("searchPlate")
      .value
      .trim()
      .toLowerCase();


  return all.filter(
    v => {

      if(q){

        if(
          !vehicleSearchText(v)
            .includes(q)
        ){
          return false;
        }
      }


      if(route){

        if(
          !String(
            v.routeId ?? ""
          )
          .toLowerCase()
          .includes(route)
        ){
          return false;
        }
      }


      if(plate){

        const txt =
          [
            v.licensePlate,
            v.forgalmi
          ]
            .filter(hasValue)
            .join(" ")
            .toLowerCase();

        if(
          !txt.includes(plate)
        ){
          return false;
        }
      }


      if(
        radiusMode !== "all"
      ){

        const d =
          gpsDistance(v);

        if(
          d === null ||
          d >
            Number(radiusMode) *
            1000
        ){
          return false;
        }
      }


      return true;
    }
  );
}

          v.routeId
        )}

        ${dataRow(
          "RENDSZÁM",
          v.licensePlate
        )}

        ${dataRow(
          "FORGALMI",
          v.forgalmi
        )}

        ${dataRow(
          "JÁRMŰTÍPUS",
          v.vehicleType
        )}

        ${dataRow(
          "FORDA",
          "NINCS ADAT"
        )}

        ${dataRow(
          "MEGÁLLÓ",
          stopText
        )}

        ${dataRow(
          "SEBESSÉG",
          v.speed === null

        )}

          )

/* ------------------------------------------------------------
   TÉRKÉP + LISTA
   ------------------------------------------------------------ */

function renderVehicles(){

  const list =
    filteredVehicles();


  $("vehicleCount").textContent =
    list.length;


  $("vehicles").innerHTML =
    list.length
      ? list.map(
          vehicleCard
        ).join("")
      : `
        <div class="vehicle-card">
          <b>NINCS MEGJELENÍTHETŐ VALÓDI JÁRMŰADAT.</b>
          <br><br>
          Ha a BKK realtime feed HTTP 401-et ad,
          itt szándékosan nem jelenik meg kitalált jármű.
        </div>
      `;


  if(vehicleLayer){

    vehicleLayer.clearLayers();


    for(const v of list){

      if(
        v.lat === null ||
        v.lon === null
      ){
        continue;
      }


      const delay =
        formatDelay(
          v.delay
        );


      const marker =
        L.circleMarker(
          [
            v.lat,
            v.lon
          ],
          {
            radius:8,
            weight:2
          }
        );


      marker.bindPopup(
        buildPopup(v)
      );


      marker.addTo(
        vehicleLayer
      );
    }
  }
}


/* ------------------------------------------------------------

   ------------------------------------------------------------ */

async function testFeed(){

  const key =
    getApiKey();


  if(!key){

    log(
      "FEED TESZT megszakítva: nincs BKK API-kulcs."
    );

    $("badgeBkk").textContent =
      "BKK: KULCS HIÁNYZIK";

    $("badgeBkk").className =
      "badge err";

    return;
  }


  saveApiKey();


  setStatus(
    "BKK realtime adatok lekérése..."
  );


  /*
    GTFS
  */

  await loadGTFS();


  /*
    VehiclePositions
  */

  const vp =
    await fetchVehiclePositions();


  /*
    Fontos:
    ha VP 401,
    FUTÁR is megpróbálható,
    de nem generálunk saját járművet.
  */

  if(vp.length === 0){

    await loadFutarVehicles();

  }
  else{

    /*
      FUTÁR meta merge
    */

    await loadFutarVehicles();

  }


  /*
    TripUpdates
  */

  await fetchTripUpdates();


  /*
    Delay újraalkalmazás,
    mert FUTÁR/VP közben nem
    változtatjuk meg a trip ID-t.
  */

  applyTripDelays();


  /*
    BKK meta
  */

  if(vehicleData.length){

    await enrichBkkVehicles();

  }


  renderVehicles();


  /*
    Végső statisztika
  */

  const forgalmiCount =
    vehicleData.filter(
      v =>
        hasValue(
          v.forgalmi
        )
    ).length;


  const typeCount =
    vehicleData.filter(
      v =>
        hasValue(
          v.vehicleType
        )
    ).length;


  const delayCount =
    vehicleData.filter(
      v =>
        v.delay !== null &&
        v.delay !== undefined
    ).length;


  log(
    `BKV VÉGÖSSZEFÉSÜLÉS: ${vehicleData.length} VP | FORGALMI: ${forgalmiCount} | JÁRMŰTÍPUS: ${typeCount} | SIETÉS/KÉSÉS: ${delayCount}`
  );


  if(
    !lastVehicleFetchOK &&
    !lastTripFetchOK
  ){

    setStatus(
      "BKK realtime: NINCS ADAT – ellenőrizd az API-kulcsot."
    );

  }
  else{

    setStatus(
      `BKK realtime kész: ${vehicleData.length} valódi jármű.`
    );
  }
}


/* ------------------------------------------------------------
   AUTO
   ------------------------------------------------------------ */

function stopAuto(){

  if(autoTimer){

    clearInterval(
      autoTimer
    );

    autoTimer = null;
  }

  autoRunning = false;

  $("autoBtn").textContent =
    "AUTO 10 s";

  $("autoBtn").classList.remove(
    "active"
  );

  log(
    "AUTO: KI"
  );
}


function startAuto(){

  if(autoRunning){

    stopAuto();

    return;
  }


  autoRunning = true;

  $("autoBtn").textContent =
    "AUTO: BE";

  $("autoBtn").classList.add(
    "active"
  );


  log(
    "AUTO 10 másodperc: BE"
  );


  testFeed();


  autoTimer =
    setInterval(
      () => {

        if(
          document.visibilityState ===
          "hidden"
        ){
          return;
        }

        testFeed();

      },
      10000
    );
}
