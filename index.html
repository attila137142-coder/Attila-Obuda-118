<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>NAVI PRO REALTIME</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{margin:0;background:#111;color:#fff;font-family:Arial;}
#map{height:60vh;}
.panel{padding:8px;}
.box{background:#222;padding:8px;border-radius:8px;}
#panel{position:fixed;bottom:0;width:100%;background:#000;max-height:40%;overflow:auto;}
</style>
</head>

<body>

<div class="panel">
<button onclick="loadGTFS()">GTFS betöltés</button>
<div id="info" class="box">Indítás...</div>
</div>

<div id="map"></div>
<div id="panel"></div>

<script>

// MAP
let map=L.map('map').setView([47.49,19.04],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let stopLayer=L.layerGroup().addTo(map);
let vehicleLayer=L.layerGroup().addTo(map);

// GPS
let userLat,userLng,lastT;

navigator.geolocation.watchPosition(p=>{
 let lat=p.coords.latitude;
 let lng=p.coords.longitude;
 let t=Date.now();

 if(userLat){
   let d=dist(userLat,userLng,lat,lng);
   let dt=(t-lastT)/1000;
   let ms=d/dt;
   let kmh=ms*3.6;

   document.getElementById("info").innerHTML=
    `🚀 ${kmh.toFixed(1)} km/h<br>⚡ ${ms.toFixed(2)} m/s`;
 }

 userLat=lat;
 userLng=lng;
 lastT=t;
});

// DIST
function dist(a,b,c,d){
 let R=6371e3;
 let φ1=a*Math.PI/180, φ2=c*Math.PI/180;
 let Δφ=(c-a)*Math.PI/180;
 let Δλ=(d-b)*Math.PI/180;
 let x=Math.sin(Δφ/2)**2+
   Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
 return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// GTFS
let stops=[];

async function loadGTFS(){

 stopLayer.clearLayers();

 let res=await fetch("https://bkk.hu/gtfs/budapest_gtfs.zip");
 let zip=await JSZip.loadAsync(await res.blob());

 let txt=await zip.file("stops.txt").async("string");

 stops = txt.split("\n").slice(1).map(r=>{
   let c=r.split(",");
   return {id:c[0],name:c[2],lat:+c[4],lng:+c[5]};
 });

 drawStops();
 generateVehicles();

}

// STOPS
function drawStops(){

 stops.forEach(s=>{

   let m=L.circleMarker([s.lat,s.lng],{
     radius:4,
     color:"yellow"
   }).addTo(stopLayer);

   m.bindTooltip(s.name);

   m.on("click",()=>showStop(s));
 });
}

// PANEL
function showStop(s){

 let d=dist(userLat,userLng,s.lat,s.lng);

 document.getElementById("panel").innerHTML=
 `<h3>${s.name}</h3>
 ✈️ ${Math.round(d)} m`;
}

// ================= REALTIME =================

// ICONOK
function getIcon(type){
 let emoji = type==="bus"?"🚌":type==="tram"?"🚋":"🚆";

 return L.divIcon({
   html:`<div style="font-size:16px">${emoji}</div>`,
   iconSize:[20,20]
 });
}

// JÁRMŰ LISTA
let vehicles=[];

// GENERÁLÁS
function generateVehicles(){

 vehicles = stops.slice(0,40).map((s,i)=>({
   id:i,
   lat:s.lat,
   lng:s.lng,
   type: i%3===0?"tram":i%2===0?"bus":"train",
   delay: Math.floor(Math.random()*10)
 }));

 updateVehicles();
}

// MOZGÁS
function updateVehicles(){

 vehicleLayer.clearLayers();

 vehicles.forEach(v=>{

   // random mozgás
   v.lat += (Math.random()-0.5)*0.001;
   v.lng += (Math.random()-0.5)*0.001;

   let color = v.delay<3?"lime":v.delay<7?"orange":"red";

   let m=L.marker([v.lat,v.lng],{
     icon:getIcon(v.type)
   }).addTo(vehicleLayer);

   m.bindPopup(`
     ${v.type}<br>
     ⏱️ késés: ${v.delay}p
   `);

 });

}

setInterval(updateVehicles,3000);

</script>

</body>
</html>
