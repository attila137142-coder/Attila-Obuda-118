async function loadPDF(){

document.getElementById("pdfFile").files[0];


if(!file){

alert("Nincs PDF kiválasztva!");

return;

}



log(
"⏳ PDF betöltése..."
);



const buffer=
await file.arrayBuffer();



const pdf=
await pdfjsLib.getDocument({
data:buffer
}).promise;



let text="";



for(
let i=1;
i<=pdf.numPages;
i++
){


log(
"📄 Oldal feldolgozás: "
+i+
"/"+
pdf.numPages
);

await pdf.getPage(i);



const content=
await page.getTextContent();



let pageText=
content.items
.map(
x=>x.str
)
.join(" ");



text+=
"\n\n--- OLDAL "
+i+
" ---\n\n"+
pageText;



}

+

+
