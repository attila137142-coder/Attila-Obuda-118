<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attila Multi GTFS V5.4 Dispatcher</title>


<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>


<style>

body{

margin:0;
font-family:Arial;
background:#111;
color:white;

}


.header{

background:#003300;
text-align:center;
padding:10px;

}


.clock{

font-size:34px;
font-weight:bold;
color:#00ff66;

}


.layout{

display:grid;
grid-template-columns:300px 1fr 340px;
height:calc(100vh - 105px);

}



.panel{

background:#1b1b1b;
padding:12px;
overflow:auto;

}



#map{

height:100%;
width:100%;

}



input,button{

width:100%;
padding:10px;
margin-top:8px;
box-sizing:border-box;

}


button{

background:#0066cc;
color:white;
border:0;
border-radius:6px;
cursor:pointer;

}


.card{

background:#242424;
padding:10px;
margin-top:10px;
border-radius:8px;

}



.green{

color:#00ff66;

}


.yellow{

color:#ffff00;

}


.red{

color:red;

}


.stop{

cursor:pointer;

}


.stop:hover{

background:#333;

}



</style>

</head>


<body>



<div class="header">


<h2>
🚦 Attila Multi GTFS V5.4
</h2>


<div id="clock" class="clock"></div>


</div>





<div class="layout">





<!-- BAL OLDAL -->


<div class="panel">


<h3>
📂 GTFS ZIP
</h3>


<input 
type="file"
id="gtfsFile"
accept=".zip">


<button onclick="loadGTFS()">

⬇ GTFS betöltése

</button>



<div id="status" class="card">

Nincs adat betöltve

</div>




<h3>

🚏 Megálló kereső

</h3>



<input
id="search"
placeholder="Nád utca vagy STOP ID">



<button onclick="searchStop()">

🔎 Keresés

</button>



<div id="results">

</div>




</div>







<!-- TÉRKÉP -->


<div id="map"></div>








<!-- JOBB OLDAL -->


<div class="panel">



<h3>

🚏 Kiválasztott megálló

</h3>



<div id="stopInfo"
class="card">

Nincs kiválasztva

</div>




<h3>

🚍 Indulások

</h3>


<div id="departures"
class="card">


GTFS betöltés után jelenik meg


</div>




<h3>

🚦 Rendszer

</h3>


<div id="engine"
class="card yellow">

GTFS motor várakozik

</div>



</div>



</div>






<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>



<script>


// =======================
// ÓRA
// =======================


function clock(){


let d=new Date();


document.getElementById("clock").innerHTML=

d.toLocaleDateString("hu-HU")
+
" "
+
d.toLocaleTimeString("hu-HU");


}


setInterval(clock,1000);

clock();






// =======================
// TÉRKÉP
// =======================


let map =
L.map("map")
.setView(
[47.55,19.05],
10
);



L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19

}

).addTo(map);





let markers=[];





// =======================
// GTFS ADATTÁR
// =======================



let STOPS=[];

let ROUTES=[];

let TRIPS=[];

let STOP_TIMES=[];


let selectedStop=null;





// =======================
// GTFS BETÖLTÉS
// =======================



async function loadGTFS(){



let file=
document.getElementById("gtfsFile")
.files[0];



if(!file){

alert(
"Válassz GTFS ZIP fájlt!"
);

return;

}



document.getElementById("status").innerHTML=
"⏳ GTFS feldolgozás...";



let zip=
await JSZip.loadAsync(file);




// STOPS


if(zip.file("stops.txt")){


let text=
await zip.file("stops.txt")
.async("string");



Papa.parse(text,{

header:true,

complete:(r)=>{


STOPS=
r.data.filter(
x=>x.stop_id
);



}

});



}





// ROUTES


if(zip.file("routes.txt")){


let text=
await zip.file("routes.txt")
.async("string");



Papa.parse(text,{

header:true,

complete:(r)=>{


ROUTES=
r.data.filter(
x=>x.route_id
);


}

});


}




// TRIPS


if(zip.file("trips.txt")){


let text=
await zip.file("trips.txt")
.async("string");



Papa.parse(text,{

header:true,

complete:(r)=>{


TRIPS=
r.data.filter(
x=>x.trip_id
);


}

});


}






// STOP TIMES


if(zip.file("stop_times.txt")){


let text=
await zip.file("stop_times.txt")
.async("string");



Papa.parse(text,{

header:true,

complete:(r)=>{


STOP_TIMES=
r.data.filter(
x=>x.trip_id
);



}

});


}




document.getElementById("status").innerHTML=

`

<span class="green">

✅ GTFS aktív

</span>

<br><br>

Megállók:
${STOPS.length}

<br>

Járatok:
${TRIPS.length}

<br>

Menetrendi sor:
${STOP_TIMES.length}

`;



document.getElementById("engine").innerHTML=

"🟢 GTFS MOTOR AKTÍV";


}





// =======================
// KERESŐ
// =======================



function searchStop(){


let q=

document.getElementById("search")
.value
.toLowerCase()
.trim();



if(!q) return;



let result=
STOPS.filter(s=>


s.stop_name &&
(

s.stop_name
.toLowerCase()
.includes(q)

||

s.stop_id
.toLowerCase()
includes(q)

)


)
.slice(0,20);



showResults(result);



}


// =======================
// TALÁLATI LISTA
// =======================


function showResults(list){


let html="";


if(list.length===0){


document.getElementById("results").innerHTML=

`
<div class="card red">
❌ Nincs találat
</div>
`;

return;


}



list.forEach(s=>{


html+=`

<div class="card stop"
onclick="selectStop('${s.stop_id}')">


🚏 ${s.stop_name}

<br>

GTFS ID:
<b>${s.stop_id}</b>

<br>

📍 ${Number(s.stop_lat).toFixed(6)}

<br>

${Number(s.stop_lon).toFixed(6)}

</div>

`;


});


document.getElementById("results")
.innerHTML=html;


}




// =======================
// MEGÁLLÓ KIVÁLASZTÁS
// =======================


function selectStop(id){


let stop=
STOPS.find(
s=>s.stop_id===id
);



if(!stop) return;



selectedStop=stop;



let lat=
Number(stop.stop_lat);


let lon=
Number(stop.stop_lon);




markers.forEach(
m=>map.removeLayer(m)
);


markers=[];



let marker=
L.marker(
[lat,lon]
)
.addTo(map)
.bindPopup(
stop.stop_name
)
.openPopup();



markers.push(marker);



map.setView(
[lat,lon],
16
);





document.getElementById("stopInfo")
.innerHTML=

`

🚏 <b>${stop.stop_name}</b>

<br><br>

GTFS STOP ID:

<br>

${stop.stop_id}

<br><br>

📍 Koordináta:

<br>

${lat.toFixed(6)}

<br>

${lon.toFixed(6)}

`;



loadDepartures(stop.stop_id);



}




// =======================
// INDULÁSI MOTOR
// =======================



function loadDepartures(stopId){



let rows=
STOP_TIMES.filter(
x=>x.stop_id===stopId
);




if(rows.length===0){


document.getElementById("departures")
.innerHTML=

`
❌ Nincs indulási adat
`;

return;


}




// idő szerinti rendezés


rows.sort(
(a,b)=>
a.departure_time
.localeCompare(
b.departure_time
)
);





let html="";



rows.slice(0,15)
.forEach(st=>{



let trip=
TRIPS.find(
t=>t.trip_id===st.trip_id
);



if(!trip) return;



let route=
ROUTES.find(
r=>r.route_id===trip.route_id
);



let routeName=
route
?
(
route.route_short_name
||
route.route_long_name
)
:
"-";





let direction=
trip.trip_headsign
||
"";




html+=

`

<div class="card">


🚌 <b>${routeName}</b>

<br>


⏰ ${st.departure_time}

<br>


➡ ${direction}


</div>


`;




});





document.getElementById("departures")
.innerHTML=html;



}



// =======================
// SEBESSÉG ÁTVÁLTÁS
// =======================


function showSpeed(kmh){


let ms=
(kmh/3.6)
.toFixed(2);



console.log(
kmh+" km/h = "+ms+" m/s"
);


}



</script>


</body>

</html>
