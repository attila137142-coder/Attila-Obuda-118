<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>STABLE SLOPE CORE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
body { margin:0; font-family:Arial; background:#111; color:white; }
#map { height:60vh; }
#panel { padding:10px; }
input,button { padding:10px; margin:5px; }
table { width:100%; font-size:12px; }
td,th { border:1px solid #444; padding:4px; }
</style>
</head>
<body>

<div id="map"></div>

<div id="panel">
<input id="q" placeholder="utca / hegy / turista út">
<button onclick="go()">START</button>

<table>
<tr><th>#</th><th>táv</th><th>emelkedés</th><th>%</th></tr>
<tbody id="t"></tbody>
</table>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map = L.map('map').setView([47.5,19.1],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let line;

async function go(){

  let q = document.getElementById("q").value;

  let r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q},Hungary&limit=1`);
  let d = await r.json();

  if(!d.length) return alert("Nincs találat");

  let p = d[0];

  map.setView([p.lat,p.lon],15);

  let o = await fetch("https://overpass-api.de/api/interpreter",{
    method:"POST",
    body:`
    [out:json];
    way["highway"](around:1200,${p.lat},${p.lon});
    out geom;
    `
  });

  let data = await o.json();

  let coords = [];

  data.elements.forEach(e=>{
    if(e.geometry){
      e.geometry.forEach(n=>{
        coords.push([n.lat,n.lon]);
      });
    }
  });

  if(line) map.removeLayer(line);

  line = L.polyline(coords,{color:"cyan"}).addTo(map);

  let elev = await getElev(coords);

  let tbody = document.getElementById("t");
  tbody.innerHTML = "";

  for(let i=0;i<coords.length-1;i++){

    let d = map.distance(coords[i],coords[i+1]);
    let h = elev[i+1]-elev[i];
    let s = (h/d)*100;

    let c = s>10 ? "red" : s>5 ? "orange" : "green";

    L.polyline([coords[i],coords[i+1]],{color:c,weight:4}).addTo(map);

    tbody.innerHTML += `
      <tr>
        <td>${i}</td>
        <td>${d.toFixed(1)}</td>
        <td>${h.toFixed(1)}</td>
        <td>${s.toFixed(2)}</td>
      </tr>
    `;
  }
}

async function getElev(points){

  let r = await fetch("https://api.open-elevation.com/api/v1/lookup",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      locations: points.map(p=>({latitude:p[0],longitude:p[1]}))
    })
  });

  let d = await r.json();
  return d.results.map(x=>x.elevation);
}
</script>

</body>
</html>
