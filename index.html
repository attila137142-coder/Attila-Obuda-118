<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <title>V6 CORE – DISPATCHER ENGINE (ARCHITECTURE)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin:0; font-family: Arial; overflow:hidden; }

    #map { height:100vh; width:100%; position:absolute; z-index:0; }

    .panel {
      position:absolute;
      top:10px;
      left:10px;
      z-index:9999;
      width:380px;
      background:white;
      padding:12px;
      border-radius:12px;
      box-shadow:0 2px 14px rgba(0,0,0,0.25);
    }

    input, button {
      width:100%;
      padding:8px;
      margin:5px 0;
    }

    .box { font-size:12px; padding:6px; border-bottom:1px solid #eee; cursor:pointer; }
    .section { font-weight:bold; font-size:12px; margin-top:8px; }

    .tag { font-size:11px; color:#666; }
  </style>
</head>
<body>

<div class="panel">
  <h3>🟢 V6 CORE DISPATCHER ENGINE</h3>

  <div id="gps">📍 GPS...</div>
  <div id="speed">🚀 Sebesség...</div>

  <input id="query" placeholder="Cél (POI / BKK / turista)" />

  <button onclick="dispatch()">🧠 DISPATCH (AI LOGIKA)</button>
  <button onclick="scanNearby()">📍 POI SCAN</button>

  <div class="section">DISPATCH OUTPUT</div>
  <div id="out"></div>

  <div class="section">DEBUG LAYER</div>
  <div id="debug"></div>
</div>

<div id="map"></div>

<script>

// =========================
// MAP CORE
// =========================

let map = L.map('map').setView([47.4979,19.0402],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© OSM'
}).addTo(map);

let userMarker;
let lastPos;

// =========================
// GPS CORE
// =========================

navigator.geolocation.watchPosition(p=>{
  const lat=p.coords.latitude;
  const lon=p.coords.longitude;
  const sp=p.coords.speed||0;

  document.getElementById("gps").innerHTML=`📍 ${lat.toFixed(6)}, ${lon.toFixed(6)}`;
  document.getElementById("speed").innerHTML=`🚀 ${(sp*3.6).toFixed(2)} km/h`;

  if(!userMarker){
    userMarker=L.marker([lat,lon]).addTo(map).bindPopup("YOU");
  } else userMarker.setLatLng([lat,lon]);

  lastPos={lat,lon};
});

// =========================
// AI DISPATCHER CORE
// =========================

function analyzeQuery(q){
  q=q.toLowerCase();

  if(q.includes("vár")||q.includes("castle")) return "HERITAGE";
  if(q.includes("büfé")||q.includes("étterem")) return "AMENITY";
  if(q.includes("bkk")||q.includes("busz")||q.includes("járat")) return "TRANSIT";
  if(q.includes("kút")||q.includes("forrás")) return "NATURAL";

  return "GENERAL";
}

// =========================
// POI SCORING ENGINE
// =========================

function scorePOI(type, dist){
  let score=50;

  if(type=="HERITAGE") score+=40;
  if(type=="AMENITY") score+=20;
  if(type=="TRANSIT") score+=30;
  if(type=="NATURAL") score+=25;

  score -= dist/1000;

  return Math.max(0,score);
}

// =========================
// DISPATCHER MAIN
// =========================

async function dispatch(){

  const q=document.getElementById("query").value;
  if(!q||!lastPos) return;

  const type=analyzeQuery(q);

  document.getElementById("debug").innerHTML=
    `TYPE: ${type}`;

  // MOCK POI FETCH
  const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=8`);
  const data=await res.json();

  let best=null;
  let bestScore=0;

  let html="";

  data.forEach(p=>{
    const lat=+p.lat;
    const lon=+p.lon;

    const d=distance(lastPos,{lat,lon});
    const sc=scorePOI(type,d);

    if(sc>bestScore){bestScore=sc;best=p;}

    html+=`<div class='box'>📍 ${p.display_name}<br><span class='tag'>score: ${sc.toFixed(1)} | ${d.toFixed(0)} m</span></div>`;

    L.circleMarker([lat,lon]).addTo(map);
  });

  document.getElementById("out").innerHTML=
    `<b>BEST MATCH:</b><br>${best?best.display_name:"NONE"}<br><span class='tag'>score ${bestScore.toFixed(1)}</span>`;
}

// =========================
// DISTANCE
// =========================

function distance(a,b){
  const R=6371000;
  const t=x=>x*Math.PI/180;

  const dLat=t(b.lat-a.lat);
  const dLon=t(b.lon-a.lon);

  const x=Math.sin(dLat/2)**2+
    Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLon/2)**2;

  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// =========================
// POI SCAN
// =========================

async function scanNearby(){

  if(!lastPos) return;

  const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=10&viewbox=${lastPos.lon-0.02},${lastPos.lat+0.02},${lastPos.lon+0.02},${lastPos.lat-0.02}&bounded=1`);

  const data=await res.json();

  document.getElementById("out").innerHTML=
    data.map(p=>`<div class='box'>📍 ${p.display_name}</div>`).join("");
}

</script>

</body>
</html>
