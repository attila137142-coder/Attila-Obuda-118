<!DOCTYPE html><html lang="hu"><head><meta charset="UTF-8"><title>FAILSAFE CONTROL ROOM V2</title><style>body{margin:0;font-family:Arial;background:#0b1220;color:white;overflow:hidden;}header{height:55px;background:#111827;display:flex;align-items:center;justify-content:space-between;padding:0 15px;font-size:22px;font-weight:bold;border-bottom:2px solid #1f2937;}.layout{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 55px);}.left{background:#111827;overflow:auto;padding:10px;border-right:2px solid #1f2937;}.right{overflow:auto;padding:10px;background:#0f172a;}.box{background:#1e293b;border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 0 12px rgba(0,0,0,0.4);}.row{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid rgba(255,255,255,0.08);font-size:13px;}.green{color:#7CFF7C;font-weight:bold;}.blue{color:#4da6ff;font-weight:bold;}.red{color:#ff6666;font-weight:bold;}.yellow{color:#ffd966;font-weight:bold;}.badge{background:#222;padding:2px 6px;border-radius:5px;font-size:11px;margin-left:5px;}.small{font-size:11px;opacity:0.8;}button{background:#2563eb;color:white;border:none;padding:8px 10px;border-radius:6px;margin:3px;cursor:pointer;font-weight:bold;}button:hover{background:#3b82f6;}.hidden{display:none;}.telemetry{font-family:monospace;line-height:1.6;font-size:13px;}.gauge{height:22px;background:#111;border-radius:6px;overflow:hidden;margin-top:5px;}.fill{height:100%;background:#4da6ff;width:50%;transition:0.4s;}.graph{height:140px;background:#111;border-radius:8px;position:relative;overflow:hidden;}.bar{position:absolute;bottom:0;width:8px;background:#4da6ff;}.statusDot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px;}</style></head><body><header><div>🚍 FAILSAFE CONTROL ROOM V2</div><div id="clock"></div></header><div class="layout"><!-- LEFT --><div class="left"><div class="box"><h3>🧠 CONTROL SWITCHES</h3><button onclick="toggleBox('telemetryBox')">📡 TELEMETRIA</button><button onclick="toggleBox('graphBox')">📈 GRAPH</button><button onclick="toggleBox('dashboardBox')">🚍 MŰSZERFAL</button></div><div class="box"><h3>🔍 MEGÁLLÓ KERESŐ</h3><inputtype="text"placeholder="Pl: Békásmegyer"style="width:100%;padding:8px;border:none;border-radius:6px;"oninput="search(this.value)"></div><div class="box"><h3>🚏 ÉLŐ INDULÁSOK</h3><div id="departures"></div></div><div class="box"><h3>🛰 FAILSAFE STATUS</h3><div id="failsafe"></div></div></div><!-- RIGHT --><div class="right"><div class="box" id="dashboardBox"><h3>🚍 MŰSZERFAL</h3><div class="row"><div>⚡ Sebesség</div><div id="speedText">0 km/h</div></div><div class="gauge"><div class="fill" id="speedFill"></div></div><div class="row"><div>📶 GPRS</div><div id="signalText"></div></div><div class="gauge"><div class="fill" id="signalFill"></div></div><div class="row"><div>🎯 GPS Pontosság</div><div id="gpsText"></div></div><div class="gauge"><div class="fill" id="gpsFill"></div></div></div><div class="box" id="telemetryBox"><h3>📡 TELEMETRY CORE</h3><div id="telemetry" class="telemetry"></div></div><div class="box" id="graphBox"><h3>📈 SPEED GRAPH</h3><div class="graph" id="graph"></div></div></div></div><script>/* =========================CLOCK========================= */function updateClock(){document.getElementById("clock").innerText =new Date().toLocaleTimeString();}setInterval(updateClock,1000);updateClock();/* =========================ROUTES========================= */let routes = [{line:"160",stop:"Békásmegyer HÉV",forda:"F12",bus:"MXT-442",delay:35},{line:"243",stop:"Donát utca",forda:"F7",bus:"NZA-188",delay:-18},{line:"134",stop:"Szentlélek tér",forda:"F2",bus:"SGX-921",delay:5},{line:"H5",stop:"Szentendre",forda:"HÉV-3",bus:"MXA-H5",delay:0}];/* =========================STATE FORMAT========================= */function formatDelay(d){if(d > 20)return `<span class="red">🔴 SIET +${d.toFixed(0)}s</span>`;if(d < -20)return `<span class="blue">🔵 KÉSÉS ${d.toFixed(0)}s</span>`;return `<span class="green">🟢 PONTOS</span>`;}/* =========================RENDER========================= */function render(list){let html = "";list.forEach(r=>{let t = new Date();t.setSeconds(t.getSeconds() + r.delay);html += `<div class="row"><div><b>${r.line}</b><div class="small">🚏 ${r.stop}</div><div class="small">🧩 ${r.forda}</div><div class="small">🚍 ${r.bus}</div></div><div>${formatDelay(r.delay)}<div class="small">${t.toLocaleTimeString()}</div></div></div>`;});document.getElementById("departures").innerHTML = html;}render(routes);/* =========================SEARCH========================= */function search(q){q = q.toLowerCase();render(routes.filter(r=>r.stop.toLowerCase().includes(q) ||r.line.toLowerCase().includes(q)));}/* =========================FAILSAFE ENGINE========================= */let sourceModes = ["LIVE","GTFS","SIM"];let currentMode = 0;function failsafe(){let mode = sourceModes[currentMode];let color = "green";if(mode === "GTFS") color = "yellow";if(mode === "SIM") color = "red";document.getElementById("failsafe").innerHTML = `<div class="row"><div><span class="statusDot"style="background:${color};"></span>DATA SOURCE</div><div class="${color}">${mode}</div></div><div class="row"><div>LAST UPDATE</div><div>${new Date().toLocaleTimeString()}</div></div><div class="row"><div>ROXYKA SAFE MODE</div><div class="green">ACTIVE 😄</div></div>`;}/* =========================TELEMETRY========================= */let speed = 34;let graphData = [];function telemetry(){try{speed += (Math.random()*8 - 4);if(speed < 0) speed = 0;if(speed > 70) speed = 70;let signal = -60 - Math.floor(Math.random()*25);let gps = (Math.random()*5 + 2).toFixed(1);let doors = [Math.random() > 0.7 ? "OPEN" : "CLOSED",Math.random() > 0.8 ? "OPEN" : "CLOSED",Math.random() > 0.9 ? "OPEN" : "CLOSED"];document.getElementById("telemetry").innerHTML = `🚍 VEHICLE: MXT-442<br>📍 GPS: 47.5123 , 19.0456<br>📶 SIGNAL: ${signal} dBm<br>🎯 GPS: ${gps}m<br>⚡ SPEED: ${speed.toFixed(0)} km/h<br>🛰 HEARTBEAT: OK<br><br>🚪 D1: ${doors[0]}<br>🚪 D2: ${doors[1]}<br>🚪 D3: ${doors[2]}<br><br>🚏 NEXT STOP:<br>Békásmegyer HÉV`;document.getElementById("speedText").innerText =speed.toFixed(0) + " km/h";document.getElementById("speedFill").style.width =(speed*1.4) + "%";document.getElementById("signalText").innerText =signal + " dBm";document.getElementById("signalFill").style.width =(100 - Math.abs(signal)) + "%";document.getElementById("gpsText").innerText =gps + "m";document.getElementById("gpsFill").style.width =(100 - gps*10) + "%";graphData.push(speed);if(graphData.length > 40)graphData.shift();let ghtml = "";graphData.forEach((v,i)=>{ghtml += `<div class="bar"style="left:${i*9}px;height:${v*1.5}px;"></div>`;});document.getElementById("graph").innerHTML = ghtml;}catch(e){currentMode = 2;}}/* =========================TOGGLE========================= */function toggleBox(id){document.getElementById(id).classList.toggle("hidden");}/* =========================MAIN LOOP========================= */function loop(){routes.forEach(r=>{r.delay += (Math.random()*6 - 3);});telemetry();failsafe();render(routes);/* RANDOM FAILSAFE SWITCH */if(Math.random() > 0.97){currentMode++;if(currentMode > 2)currentMode = 0;}}setInterval(loop,1000);loop();</script></body></html>
