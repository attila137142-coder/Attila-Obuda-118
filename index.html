<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>REAL TIME DEPARTURE PANEL V1</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

header{
padding:10px;
background:#111827;
font-weight:bold;
}

#panel{
padding:10px;
}

.row{
display:flex;
justify-content:space-between;
padding:8px;
border-bottom:1px solid #1f2937;
font-size:14px;
}

.small{
font-size:11px;
opacity:0.8;
}

.badge{
background:#222;
padding:2px 6px;
border-radius:4px;
font-size:11px;
}

.red{color:#ff4d4d;font-weight:bold;}
.blue{color:#4da6ff;font-weight:bold;}
.green{color:#7CFF7C;font-weight:bold;}
.gray{opacity:0.7;}

</style>
</head>

<body>

<header>
🚍 BUDAPEST REAL TIME DEPARTURE PANEL V1
<span id="clock"></span>
</header>

<div id="panel"></div>

<script>

/* =========================
   CLOCK
========================= */

function updateClock(){
const now = new Date();
document.getElementById("clock").innerText =
now.toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

/* =========================
   VEHICLES (SIMULATED REAL DATA CORE)
========================= */

let vehicles = [
{id:"7A-391", route:"7", type:"bus", speed:42, delay:30},
{id:"4-6-882", route:"4-6", type:"tram", speed:28, delay:-90},
{id:"M2-1105", route:"M2", type:"metro", speed:60, delay:140},
{id:"H5-203", route:"H5", type:"HÉV", speed:55, delay:0},
{id:"12A-771", route:"12A", type:"bus", speed:38, delay:12},
{id:"40-912", route:"40", type:"bus", speed:45, delay:65},
{id:"8E-554", route:"8E", type:"bus", speed:52, delay:-40},
{id:"9-301", route:"9", type:"bus", speed:33, delay:18},
{id:"2-118", route:"2", type:"tram", speed:27, delay:95},
{id:"1-442", route:"1", type:"tram", speed:29, delay:-20},
{id:"Buda-55", route:"55", type:"bus", speed:41, delay:5},
{id:"Pest-77", route:"77", type:"tram", speed:31, delay:200},
{id:"23-901", route:"23", type:"bus", speed:36, delay:-10},
{id:"16-812", route:"16", type:"bus", speed:44, delay:60},
{id:"19-501", route:"19", type:"tram", speed:26, delay:0}
];

/* =========================
   FORMAT ENGINE
========================= */

function format(delay){

let d = Math.round(delay);

let mm = Math.floor(Math.abs(d)/60);
let ss = Math.abs(d)%60;

if(d > 20){
return `<span class="red">🔴 SIET ${mm}:${ss.toString().padStart(2,'0')}</span>`;
}

if(d < -20){
return `<span class="blue">🔵 KÉSÉS ${mm}:${ss.toString().padStart(2,'0')}</span>`;
}

return `<span class="green">🟢 PONTOS</span>`;
}

/* =========================
   PANEL RENDER (15 ROWS)
========================= */

function render(){

let html = "";

for(let i=0;i<15;i++){

let v = vehicles[i];

v.delay += (Math.random()*6 - 3);
v.speed += (Math.random()*2 - 1);

let time = new Date();
time.setSeconds(time.getSeconds() + v.delay);

html += `
<div class="row">
<div>
${v.route}
<div class="small">
${v.type} • ID: ${v.id}
</div>
</div>

<div>
${format(v.delay)}
<div class="small gray">
${v.speed.toFixed(1)} km/h • ${time.toLocaleTimeString()}
</div>
</div>
</div>
`;
}

document.getElementById("panel").innerHTML = html;
}

/* =========================
   LOOP
========================= */

setInterval(render,1000);
render();

</script>

</body>
</html>
