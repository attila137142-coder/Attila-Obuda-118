<!DOCTYPE html><html lang="hu"><head><meta charset="UTF-8"><title>ÓBUDA CONTROL ROOM + TELEMETRY CORE V1</title><style>body{margin:0;font-family:Arial;background:#0b1220;color:white;overflow:hidden;}header{height:50px;background:#111827;display:flex;align-items:center;justify-content:space-between;padding:0 15px;font-weight:bold;border-bottom:2px solid #1f2937;}.container{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 50px);}.left{background:#111827;overflow:auto;padding:10px;border-right:2px solid #1f2937;}.right{padding:10px;overflow:auto;background:#0f172a;}.box{background:#1e293b;border-radius:8px;padding:10px;margin-bottom:10px;box-shadow:0 0 10px rgba(0,0,0,0.3);}.row{display:flex;justify-content:space-between;padding:7px;border-bottom:1px solid rgba(255,255,255,0.08);font-size:13px;}.green{color:#7CFF7C;font-weight:bold;}.blue{color:#4da6ff;font-weight:bold;}.red{color:#ff6666;font-weight:bold;}.yellow{color:#ffd966;font-weight:bold;}.badge{background:#222;padding:2px 6px;font-size:11px;border-radius:5px;margin-left:5px;}.small{font-size:11px;opacity:0.8;}.telemetry{font-family:monospace;line-height:1.7;font-size:13px;}.graph{height:120px;background:#111;border-radius:6px;position:relative;overflow:hidden;}.bar{position:absolute;bottom:0;width:8px;background:#4da6ff;}input{width:100%;padding:8px;border:none;border-radius:5px;margin-top:5px;}</style></head><body><header><div>🚍 ÓBUDA CONTROL ROOM + TELEMETRY CORE V1</div><div id="clock"></div></header><div class="container"><!-- LEFT PANEL --><div class="left"><div class="box"><h3>🔍 MEGÁLLÓ KERESŐ</h3><input type="text" placeholder="Pl: Békásmegyer"oninput="searchStops(this.value)"></div><div class="box"><h3>🚏 ÉLŐ INDULÁSI PANEL</h3><div id="departures"></div></div></div><!-- RIGHT PANEL --><div class="right"><div class="box"><h3>📡 TELEMETRY CORE</h3><div id="telemetry" class="telemetry"></div></div><div class="box"><h3>📈 SPEED GRAPH</h3><div class="graph" id="graph"></div></div><div class="box"><h3>🧠 ENGINE STATUS</h3><div id="status"></div></div></div></div><script>/* =========================CLOCK========================= */function updateClock(){document.getElementById("clock").innerText =new Date().toLocaleTimeString();}setInterval(updateClock,1000);updateClock();/* =========================ÓBUDA ROUTE CORE========================= */let routes = [{line:"160",route_id:"1600",stop:"Békásmegyer HÉV",forda:"F12",bus:"MXT-442",delay:35},{line:"243",route_id:"2430",stop:"Donát utca",forda:"F7",bus:"NZA-188",delay:-20},{line:"134",route_id:"1340",stop:"Szentlélek tér",forda:"F2",bus:"SGX-921",delay:5},{line:"H5",route_id:"H5",stop:"Szentendre",forda:"HÉV-3",bus:"MXA-H5",delay:0}];/* =========================STATUS FORMAT========================= */function state(delay){if(delay > 20)return `<span class="red">🔴 SIET +${delay}s</span>`;if(delay < -20)return `<span class="blue">🔵 KÉSÉS ${delay}s</span>`;return `<span class="green">🟢 PONTOS</span>`;}/* =========================DEPARTURE PANEL========================= */function renderDepartures(list){let html = "";list.forEach(r=>{let t = new Date();t.setSeconds(t.getSeconds() + r.delay);html += `<div class="row"><div><b>${r.line}</b><span class="badge">${r.route_id}</span><div class="small">🚏 ${r.stop}</div><div class="small">🧩 FORDA: ${r.forda}</div><div class="small">🚍 ${r.bus}</div></div><div>${state(r.delay)}<div class="small">${t.toLocaleTimeString()}</div></div></div>`;});document.getElementById("departures").innerHTML = html;}renderDepartures(routes);/* =========================SEARCH========================= */function searchStops(q){q = q.toLowerCase();renderDepartures(routes.filter(r =>r.stop.toLowerCase().includes(q) ||r.line.toLowerCase().includes(q)));}/* =========================TELEMETRY ENGINE========================= */let speed = 37;function telemetry(){speed += (Math.random()*8 - 4);if(speed < 0) speed = 0;if(speed > 65) speed = 65;let gps = (Math.random()*5 + 2).toFixed(1);let signal = -60 - Math.floor(Math.random()*20);let doors = [Math.random() > 0.7 ? "OPEN" : "CLOSED",Math.random() > 0.8 ? "OPEN" : "CLOSED",Math.random() > 0.9 ? "OPEN" : "CLOSED"];document.getElementById("telemetry").innerHTML = `🚍 VEHICLE: MXT-442<br>📍 GPS: 47.6123 , 19.0456<br>📶 GPRS: ${signal} dBm<br>🎯 GPS ACCURACY: ${gps}m<br>⚡ SPEED: ${speed.toFixed(0)} km/h<br>🛰 HEARTBEAT: OK<br><br>🚪 DOOR 1: ${doors[0]}<br>🚪 DOOR 2: ${doors[1]}<br>🚪 DOOR 3: ${doors[2]}<br><br>🚏 NEXT STOP:<br>Békásmegyer HÉV<br><br>⏱ DWELL TIME:${Math.floor(Math.random()*25)} sec`;document.getElementById("status").innerHTML = `🟢 GTFS CORE: ACTIVE<br>🟢 TELEMETRY: ACTIVE<br>🟢 GRAPH ENGINE: ONLINE<br>🟢 GPS STREAM: LIVE<br>🟢 DISPATCH MODE: ENABLED`;updateGraph(speed);}/* =========================SPEED GRAPH========================= */let graphData = [];function updateGraph(v){graphData.push(v);if(graphData.length > 40)graphData.shift();let html = "";graphData.forEach((g,i)=>{html += `<div class="bar"style="left:${i*9}px;height:${g*1.5}px;"></div>`;});document.getElementById("graph").innerHTML = html;}/* =========================MAIN LOOP========================= */function loop(){routes.forEach(r=>{r.delay += (Math.random()*6 - 3);});renderDepartures(routes);telemetry();}setInterval(loop,1000);loop();</script></body></html>
