<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR CORE V1</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#0b1016;
    color:#e6f1ff;
}

header{
    padding:12px;
    background:#121a24;
    text-align:center;
    font-weight:bold;
}

input, button{
    padding:10px;
    margin:8px;
    border-radius:8px;
    border:none;
}

button{
    background:#00c2ff;
    font-weight:bold;
}

.card{
    margin:10px;
    padding:10px;
    background:#141e2b;
    border-radius:10px;
}

.badge{
    background:#00c2ff;
    color:#000;
    padding:2px 6px;
    border-radius:6px;
}
</style>
</head>

<body>

<header>🚦 FUTÁR CORE V1 – STOP ID ENGINE</header>

<input id="stopId" placeholder="STOP ID pl. BKK_1234">
<button onclick="loadStop()">Betöltés</button>

<div id="out"></div>

<script>

// 🔥 EZ LESZ KÉSŐBB A GTFS / API HELYE
const STOP_DATABASE = {
    "BKK_1001": {
        name: "Örs vezér tere",
        lines: [
            {route:"32", times:["05:10","05:30","05:50"], delay: "+1"},
            {route:"85", times:["05:12","05:32","05:52"], delay: "-2"},
            {route:"85E", times:["05:15","05:35","05:55"], delay: "0"}
        ]
    },
    "BKK_2002": {
        name: "Deák Ferenc tér",
        lines: [
            {route:"47", times:["05:00","05:20","05:40"], delay: "+0"},
            {route:"49", times:["05:05","05:25","05:45"], delay: "+2"}
        ]
    }
};

function loadStop(){
    const id = document.getElementById("stopId").value.trim();
    const out = document.getElementById("out");

    const stop = STOP_DATABASE[id];

    if(!stop){
        out.innerHTML = `<div class="card">❌ Nincs ilyen STOP ID: ${id}</div>`;
        return;
    }

    let html = `<div class="card">
        <h3>📍 ${stop.name}</h3>
        <small>STOP ID: ${id}</small>
    </div>`;

    stop.lines.forEach(l=>{
        html += `
        <div class="card">
            <span class="badge">${l.route}</span>
            <div>${l.times.join(" - ")}</div>
            <small>Késés: ${l.delay} perc</small>
        </div>`;
    });

    out.innerHTML = html;
}

</script>

</body>
</html>
