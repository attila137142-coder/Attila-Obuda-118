body { margin:0; font-family:Arial; display:flex; }

#sidebar{
  width:360px;
  border-right:1px solid #ddd;
  overflow:auto;
}

#map{ flex:1; height:100vh; }

.stop{
  padding:8px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}
.stop:hover{ background:#f0f0f0; }

#panel{
  padding:0;
}

/* ===== MATRIX ===== */
.matrix{
  width:100%;
  background:black;
  color:#00ff66;
  font-family: "Courier New", monospace;
  padding:10px;
  box-sizing:border-box;
}

.row{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #003300;
  padding:8px 0;
  font-size:18px;
}

.line{ width:80px; font-weight:bold; }
.dest{ flex:1; }
.time{ width:80px; text-align:right; }
.delay{ width:80px; text-align:right; }

.blink{
  animation:blink 1s infinite;
}
@keyframes blink{
  50%{opacity:0.2;}
}
</style>
</head>

// ===== TYPE =====
function getType(s){
  if(s.gtfs?.includes("BKK")) return "bkk";
  if(s.gtfs?.includes("VOLÁN")||s.gtfs?.includes("VOLAN")) return "volan";
  if(s.line==="Gyermekvasút") return "child";
  return "other";
}

// ===== MATRIX ENGINE =====
function showMatrix(stop){

  const now = new Date();
  const baseMin = now.getMinutes();

  // DEMO → később GTFS
  const data = [
    {line:"34", dest:"Békásmegyer", min:2, delay:-1},
    {line:"134", dest:"Szentendre", min:5, delay:+2},
    {line:"H5", dest:"Batthyány tér", min:8, delay:0}
  ];

  let html = `<div class="matrix">`;
  html += `<h3>🚏 ${stop.name}</h3>`;

  data.forEach(d=>{

    let delayTxt="";
    if(d.delay>0) delayTxt=`+${d.delay}p`;
    if(d.delay<0) delayTxt=`-${Math.abs(d.delay)}p`;

    html += `
      <div class="row">
        <div class="line">${d.line}</div>
        <div class="dest">${d.dest}</div>
        <div class="time ${d.min<=2?"blink":""}">
          ${d.min} p
        </div>
        <div class="delay">${delayTxt}</div>
      </div>
    `;
  });

  html += `</div>`;

  // opcionális: BKK embed gomb
  if(getType(stop)==="bkk"){
    const id = stop.gtfs.match(/F\d+/)?.[0];
    if(id){
      html += `
        <button onclick="showEmbed('${id}')">
        🔵 Hivatalos kijelző
        </button>
      `;
    }
  }

  document.getElementById("panel").innerHTML = html;
}

// ===== EMBED =====
function showEmbed(id){
  document.getElementById("panel").innerHTML = `
    <iframe 
      src="https://realtimenext.hu/embed/bkv/stops/${id}/schedule"
      width="100%" height="500" style="border:none;">
    </iframe>
  `;
}

// ===== LISTA =====
function render(list){

  const c=document.getElementById("list");
  c.innerHTML="";

  list.forEach(s=>{
    const d=document.createElement("div");
    d.className="stop";

    let icon="📍";
    if(getType(s)==="bkk") icon="🚍";
    if(getType(s)==="volan") icon="🚌";
    if(getType(s)==="child") icon="🚂";

    d.innerHTML=`${icon} ${s.name}`;
    d.onclick=()=>showMatrix(s);

    c.appendChild(d);
  });
}

// ===== SEARCH =====
search.oninput=e=>{
  const q=e.target.value.toLowerCase();
  render(STOPS.filter(s=>s.name.toLowerCase().includes(q)));
};

// ===== MAP =====
STOPS.forEach(s=>{
  if(s.lat){
    L.marker([s.lat,s.lon])
      .addTo(map)
      .on("click",()=>showMatrix(s));
  }
});

render(STOPS);
