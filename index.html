<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>FUTÁR Dispatcher Core</title>
<style>
body { margin:0; font-family:Arial; background:#0b0f14; color:#0f0; }
.stop-dot {
  width:8px; height:8px;
  background:red;
  position:absolute;
  border-radius:50%;
}
#panel {
  position:fixed; top:10px; left:10px;
  background:#111; padding:10px;
}
</style>
</head>
<body>

<div id="panel">
  <div id="speed">Speed: --</div>
  <div id="delay">Delay: --</div>
</div>

<script>

let user = {lat:0, lon:0, speed:0};

// 📡 GPS
navigator.geolocation.watchPosition(p => {
  user.lat = p.coords.latitude;
  user.lon = p.coords.longitude;
  user.speed = p.coords.speed || 0;

  document.getElementById("speed").innerText =
    "Speed: " + (user.speed*3.6).toFixed(1) + " km/h";
});

// 🧮 STOP sample
const stops = [
  {name:"Stop A", lat:47.4979, lon:19.0402},
  {name:"Stop B", lat:47.5030, lon:19.0450}
];

// 📏 distance
function distance(a,b){
  const R=6371000;
  const dLat=(b.lat-a.lat)*Math.PI/180;
  const dLon=(b.lon-a.lon)*Math.PI/180;
  const x=Math.sin(dLat/2)**2 +
    Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*
    Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ⏱ ETA
function eta(stop){
  const dist = distance(user, stop);
  const speed = user.speed || 10;
  return dist / speed;
}

// 🧠 dispatcher AI v1
function updateDelay(){
  const e = eta(stops[0]);
  const delay = e - 120; // fake schedule baseline
  document.getElementById("delay").innerText =
    "Delay: " + Math.round(delay) + " sec";
}

setInterval(updateDelay, 2000);

</script>
</body>
</html>
