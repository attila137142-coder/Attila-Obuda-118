<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">

<title>
Attila Közlekedés Control
V1.5 Wide Matrix Clock
</title>


<style>


body{

margin:0;

height:100vh;

background:#020303;

display:flex;

align-items:center;

justify-content:center;

font-family:
"Courier New",
monospace;

overflow:hidden;

}



/* FŐ PANEL */

.clock-panel{


width:88vw;

max-width:1600px;


padding:35px 60px;


background:

radial-gradient(
circle,
rgba(0,255,180,0.12),
transparent 70%
),

#050808;



border:4px solid #124d55;


border-radius:30px;


text-align:center;


box-shadow:

0 0 50px rgba(0,255,180,0.25),

inset 0 0 60px rgba(0,255,180,0.15);


}



/* DÁTUM */


.date{


font-size:64px;


font-weight:900;


letter-spacing:8px;


color:#ff2020;


text-shadow:


0 0 10px #ff2020,

0 0 35px rgba(255,0,0,0.6);


margin-bottom:35px;


}



/* IDŐ */


.time{


font-size:170px;


font-weight:900;


letter-spacing:14px;


color:#00eaff;


text-shadow:


0 0 12px #00eaff,

0 0 35px #00ff99,

0 0 70px rgba(0,255,180,0.8);


}



/* NORMAL */

.normal{


border-color:#00ff66;


}



.normal .date{

color:#ff9900;

}



.normal .time{

color:#00ff66;

}



/* MATRIX */


.matrix{

border-color:#124d55;

}



/* ALERT */


.alert{


border-color:#ff2020;


box-shadow:


0 0 40px rgba(255,0,0,0.7),

inset 0 0 50px rgba(255,0,0,0.25);

}



.alert .date{

color:#ff3030;

}


.alert .time{

color:#00eaff;

}



/* GOMBOK */


.controls{


position:absolute;

bottom:25px;

}



button{


font-size:22px;

font-weight:bold;


padding:12px 25px;


margin:5px;


border-radius:10px;


background:#101818;

color:white;


border:2px solid #00eaff;


cursor:pointer;

}



</style>

</head>



<body>


<div id="panel" class="clock-panel matrix">


<div id="date"
class="date">
</div>


<div id="time"
class="time">
</div>


</div>



<div class="controls">

<button onclick="mode('normal')">
🟢 NORMAL
</button>


<button onclick="mode('matrix')">
🌙 MATRIX
</button>


<button onclick="mode('alert')">
🔴 ALERT
</button>


</div>




<script>


let lastSecond=-1;



function clock(){


let now=new Date();



let sec=now.getSeconds();



if(sec!==lastSecond){


lastSecond=sec;



let napok=[

"VASÁRNAP",
"HÉTFŐ",
"KEDD",
"SZERDA",
"CSÜTÖRTÖK",
"PÉNTEK",
"SZOMBAT"

];



document.getElementById("date").innerHTML=

now.getFullYear()
+". "+
String(now.getMonth()+1).padStart(2,"0")
+". "+
String(now.getDate()).padStart(2,"0")
+" "
+napok[now.getDay()];




document.getElementById("time").innerHTML=

String(now.getHours()).padStart(2,"0")
+":"
+
String(now.getMinutes()).padStart(2,"0")
+":"
+
String(sec).padStart(2,"0");



}



requestAnimationFrame(clock);


}



clock();





function mode(x){


let p=document.getElementById("panel");


p.className="clock-panel "+x;



}



</script>



</body>
</html>
