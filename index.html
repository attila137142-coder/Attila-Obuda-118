<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MÁV EMMA – 7-es Gyermekvasút TESZT</title>

<style>
body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#111;
  color:#eee;
}
h1{
  font-size:24px;
  margin-top:0;
}
button{
  padding:12px 16px;
  margin:5px 3px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}
#status{
  margin:15px 0;
  padding:14px;
  border-radius:8px;
  background:#222;
}
pre{
  background:#050505;
  padding:15px;
  border-radius:8px;
  white-space:pre-wrap;
  word-break:break-word;
  max-height:65vh;
  overflow:auto;
}
.ok{color:#66ff66}
.err{color:#ff6666}
.wait{color:#ffd54f}
.info{color:#66ccff}
</style>
</head>

<body>

<h1>🚂 MÁV EMMA – 7-es Gyermekvasút TESZT</h1>

<p>
<strong>Vizsgált terület:</strong><br>
Széchenyi-hegy – János-hegy – Hűvösvölgy
</p>

<button onclick="tesztRail()">
🚆 RAIL TESZT
</button>

<button onclick="tesztMindenMod()">
🔎 ÖSSZES VASÚTI MÓD TESZT
</button>

<div id="status" class="wait">
Indításra kész...
</div>

<pre id="eredmeny">
Nincs még lekérdezés.
</pre>

<script>

const EMMA =
"https://emma.mav.hu/otp2-backend/otp/routers/default/index/graphql";


/* =========================================================
   GYERMEKVASÚT KÖRNYEZET
   ========================================================= */

const SW_LAT = 47.45;
const SW_LON = 18.90;

const NE_LAT = 47.56;
const NE_LON = 19.05;


/* =========================================================
   EMMA GRAPHQL
   ========================================================= */

async function lekerez(modes){

const modeText=modes.join(",");

const query=`
{
  vehiclePositions(
    swLat:${SW_LAT}
    swLon:${SW_LON}
    neLat:${NE_LAT}
    neLon:${NE_LON}
    modes:[${modeText}]
  ){
    vehicleId
    label
    lat
    lon
    heading
    lastUpdated
    speed

    trip{
      gtfsId
      domesticResTrainNumber
    }
  }
}`;


status.className="wait";

status.textContent=
"⏳ EMMA lekérés folyamatban...\n"+
"Terület: Széchenyi-hegy – Hűvösvölgy\n"+
"Mód: "+modeText;


eredmeny.textContent=
"EMMA VÉGPONT:\n"+
EMMA+
"\n\n"+
"LEKÉRDEZÉS:\n"+
query+
"\n\nVálaszra várunk...";


try{

const response=await fetch(
  EMMA,
  {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      query:query,
      variables:{}
    })
  }
);


const text=await response.text();


eredmeny.textContent=
"HTTP státusz: "+
response.status+
" "+
response.statusText+
"\n\n"+
"NYERS VÁLASZ:\n"+
text;


let data;

try{

data=JSON.parse(text);

}catch(e){

status.className="err";

status.textContent=
"❌ A szerver választ adott, de nem JSON formátumban.";

return;

}


if(data.errors){

status.className="err";

status.textContent=
"❌ GRAPHQL HIBA";

eredmeny.textContent=
JSON.stringify(data,null,2);

return;

}


/* =========================================================
   JÁRMŰVEK
   ========================================================= */

const vehicles =
data &&
data.data &&
data.data.vehiclePositions
?
data.data.vehiclePositions
:
[];


if(vehicles.length===0){

status.className="info";

status.textContent=
"ℹ️ 0 jármű érkezett vissza az EMMA-tól.";

eredmeny.textContent=
"🚂 GYERMEKVASÚT TESZT\n\n"+
"Talált járművek: 0\n\n"+
"Ez NEM bizonyítja azt, hogy nincs Gyermekvasút realtime adat.\n"+
"Csak azt jelenti, hogy ezen az EMMA lekérdezésen nem kaptunk járművet.\n\n"+
"NYERS VÁLASZ:\n"+
JSON.stringify(data,null,2);

return;

}


/* =========================================================
   TALÁLAT
   ========================================================= */

status.className="ok";

status.textContent=
"✅ EMMA VÁLASZ MEGÉRKEZETT!\n"+
"Talált járművek: "+
vehicles.length;


let out=
"🚂 MÁV EMMA – GYERMEKVASÚT TESZT\n"+
"====================================\n\n"+
"Talált járművek: "+
vehicles.length+
"\n\n";


vehicles.forEach((v,i)=>{

out+=
"JÁRMŰ #"+(i+1)+"\n"+
"------------------------------------\n"+
"vehicleId: "+
(v.vehicleId ?? "NINCS ADAT")+
"\n"+
"label: "+
(v.label ?? "NINCS ADAT")+
"\n"+
"lat: "+
(v.lat ?? "NINCS ADAT")+
"\n"+
"lon: "+
(v.lon ?? "NINCS ADAT")+
"\n"+
"heading: "+
(v.heading ?? "NINCS ADAT")+
"\n"+
"speed: "+
(v.speed ?? "NINCS ADAT")+
"\n"+
"lastUpdated: "+
(v.lastUpdated ?? "NINCS ADAT")+
"\n"+
"trip.gtfsId: "+
(v.trip?.gtfsId ?? "NINCS ADAT")+
"\n"+
"trainNumber: "+
(v.trip?.domesticResTrainNumber ?? "NINCS ADAT")+
"\n\n";

});


out+=
"====================================\n"+
"NYERS GRAPHQL VÁLASZ\n"+
"====================================\n\n"+
JSON.stringify(data,null,2);


eredmeny.textContent=out;


}catch(error){

status.className="err";

status.textContent=
"❌ FETCH HIBA";

eredmeny.textContent=
"TypeError / hálózati hiba:\n\n"+
error+
"\n\n"+
"Ez lehet például:\n"+
"- CORS tiltás\n"+
"- böngésző tiltás\n"+
"- hálózati tiltás\n"+
"- EMMA ideiglenes korlátozás\n"+
"- Opera Mini köztes proxy korlátozása";

}

}


/* =========================================================
   1. TESZT
   CSAK RAIL
   ========================================================= */

function tesztRail(){

lekerez([
  "RAIL"
]);

}


/* =========================================================
   2. TESZT
   MINDEN EDDIG ISMERT VASÚTI MÓD
   ========================================================= */

function tesztMindenMod(){

lekerez([
  "RAIL",
  "RAIL_REPLACEMENT_BUS",
  "SUBURBAN_RAILWAY",
  "TRAMTRAIN"
]);

}

</script>

</body>
</html>
