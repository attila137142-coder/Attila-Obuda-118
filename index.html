<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>LIVE DISPATCH MAP V4 - REGIONS + USER</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:#e5e7eb;
}

header{
    background:#111827;
    padding:10px;
    font-weight:bold;
    display:flex;
    justify-content:space-between;
}

.container{
    display:grid;
    grid-template-columns:340px 1fr;
    height:85vh;
}

.left{
    background:#1f2937;
    padding:10px;
    overflow:auto;
}

#map{
    height:100%;
}

.box{
    background:#111827;
    padding:10px;
    margin-bottom:10px;
    border-radius:6px;
}

.item{
    background:#374151;
    padding:6px;
    margin:4px 0;
    border-radius:5px;
    cursor:pointer;
}

.item:hover{
    background:#4b5563;
}

input{
    width:100%;
    padding:8px;
    margin:5px 0;
    border:none;
    border-radius:5px;
}

.log{
    height:15vh;
    background:#0f172a;
    font-size:12px;
    padding:8px;
    overflow:auto;
}
</style>
</head>

<body>

<header>
🚍 LIVE DISPATCH MAP V4 (REGIONS + USER LOCATION)
<div id="status">INIT</div>
</header>

<div class="container">

<!-- LEFT -->
<div class="left">

<div class="box">
<h3>📍 SAJÁT HELY (kézi)</h3>

<input id="city" placeholder="város">
<input id="street" placeholder="utca">
<input id="house" placeholder="házszám">

<button onclick="setManualLocation()">SET LOCATION</button>
</div>

<div class="box">
<h3>🔍 STOP SEARCH</h3>
<input oninput="searchStops(this.value)">
</div>

<div class="box">
<h3>🚏 STOPS</h3>
<div id="stops"></div>
</div>

<div class="box">
<h3>📌 USER INFO</h3>
<div id="user">nincs adat</div>
</div>

</div>

<!-- MAP -->
<div id="map"></div>

</div>

<div class="log" id="log"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   MAP
========================= */

let map = L.map('map').setView([47.2,19.5],8);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:"OSM"
}).addTo(map);

/* =========================
   LOG
========================= */

function log(msg){
    document.getElementById("log").innerHTML += "🧠 "+msg+"<br>";
}

/* =========================
   REGION STOP DATABASE
   (BŐVÍTETT, NEM VALÓDI GTFS)
========================= */

let STOPS = [

/* --- BUDAPEST --- */
{id:"bp1", name:"Széll Kálmán tér", lat:47.5079, lon:19.0244, region:"Budapest"},
{id:"bp2", name:"Deák Ferenc tér", lat:47.4979, lon:19.0540, region:"Budapest"},
{id:"bp3", name:"Nád utca", lat:47.5200, lon:19.0400, region:"Budapest"},

/* --- PEST MEGYE --- */
{id:"p1", name:"Érd központ", lat:47.3860, lon:18.9123, region:"Pest"},
{id:"p2", name:"Dunakeszi vasútállomás", lat:47.6310, lon:19.1370, region:"Pest"},
{id:"p3", name:"Szentendre HÉV", lat:47.6690, lon:19.0750, region:"Pest"},

/* --- ZALA MEGYE --- */
{id:"z1", name:"Zalaegerszeg autóbusz-állomás", lat:46.8400, lon:16.8439, region:"Zala"},
{id:"z2", name:"Keszthely vasútállomás", lat:46.7680, lon:17.2440, region:"Zala"},
{id:"z3", name:"Lenti központ", lat:46.6230, lon:16.5380, region:"Zala"}
];

/* =========================
   USER LOCATION
========================= */

let userMarker = null;

/* =========================
   DISTANCE (Haversine)
========================= */

function distance(lat1,lon1,lat2,lon2){

    let R = 6371;

    let dLat = (lat2-lat1)*Math.PI/180;
    let dLon = (lon2-lon1)*Math.PI/180;

    let a =
        Math.sin(dLat/2)*Math.sin(dLat/2)+
        Math.cos(lat1*Math.PI/180)*
        Math.cos(lat2*Math.PI/180)*
        Math.sin(dLon/2)*Math.sin(dLon/2);

    let c = 2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

    return R*c;
}

/* =========================
   RENDER STOPS
========================= */

function renderStops(list){

    let html="";

    list.forEach(s=>{
        html += `
        <div class="item" onclick="goToStop('${s.id}')">
            🚏 ${s.name} <br>
            <small>${s.region}</small>
        </div>`;
    });

    document.getElementById("stops").innerHTML = html;
}

renderStops(STOPS);

/* =========================
   SEARCH
========================= */

function searchStops(q){

    let r = STOPS.filter(s=>
        s.name.toLowerCase().includes(q.toLowerCase())
    );

    renderStops(r);
}

/* =========================
   STOP CLICK
========================= */

function goToStop(id){

    let s = STOPS.find(x=>x.id===id);

    map.setView([s.lat,s.lon],13);

    L.marker([s.lat,s.lon])
        .addTo(map)
        .bindPopup(s.name)
        .openPopup();

    log("STOP: " + s.name);

    if(userMarker){
        let d = distance(
            userMarker.getLatLng().lat,
            userMarker.getLatLng().lng,
            s.lat,s.lon
        );

        log("Distance to user: " + d.toFixed(2) + " km");
    }
}

/* =========================
   USER LOCATION (REAL GPS)
========================= */

navigator.geolocation.getCurrentPosition(pos=>{

    let lat = pos.coords.latitude;
    let lon = pos.coords.longitude;

    userMarker = L.marker([lat,lon])
        .addTo(map)
        .bindPopup("SAJÁT HELY");

    map.setView([lat,lon],12);

    document.getElementById("user").innerHTML =
        "GPS: "+lat.toFixed(5)+", "+lon.toFixed(5)+
        "<br>Accuracy: "+Math.round(pos.coords.accuracy)+"m";

    log("USER GPS LOADED");

});

/* =========================
   MANUAL LOCATION
========================= */

function setManualLocation(){

    let city = document.getElementById("city").value;
    let street = document.getElementById("street").value;
    let house = document.getElementById("house").value;

    let text = city+" "+street+" "+house;

    document.getElementById("user").innerHTML =
        "MANUAL: "+text;

    log("MANUAL LOCATION SET: "+text);
}

/* =========================
   INIT
========================= */

log("V4 REGIONAL DISPATCH MAP READY");

</script>

</body>
</html>
