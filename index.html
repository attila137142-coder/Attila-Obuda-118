<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GTFS PRO V25 OFFLINE TOUR ENGINE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{font-family:Arial;margin:0;background:#0f172a;color:#e2e8f0}
header{padding:10px;background:#111827;position:sticky;top:0;z-index:999}
button,input,select{padding:6px;margin:5px;border-radius:6px;border:0}
.card{background:#111827;margin:10px;padding:10px;border-radius:8px}
#map{height:360px;margin:10px;border-radius:10px}
.mode{font-weight:bold}
small{opacity:.7}
</style>
</head>
<body>

<header>
<b>🚀 GTFS PRO V25 OFFLINE TOUR ENGINE</b><br>
<span class="mode" id="mode">SMART MODE</span><br>

<select id="poiType">
  <option value="tourism">🏕 tourism</option>
  <option value="peak">⛰ peak</option>
  <option value="natural">🌲 natural</option>
  <option value="amenity">🏪 amenity</option>
</select>

<button onclick="startGPS()">📍 GPS</button>
<button onclick="tourSearch()">🧭 TOUR SEARCH</button>

<input id="search" placeholder="Skanzen / Dobogókő / Pilis..." />
</header>

<div id="map"></div>

<div class="card">
<b>📍 GPS</b>
<div id="gps">-</div>
</div>

<div class="card">
<b>🧭 TOUR ENGINE</b>
<div id="tour">-</div>
</div>

<div class="card">
<b>📌 OFFLINE CACHE</b>
<div id="cache">loading...</div>
</div>

<script>
let map,userMarker;
let userLat=47.4979,userLon=19.0402;
let cache=[];

// ================= MAP =================
function initMap(){
  map=L.map('map').setView([userLat,userLon],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  userMarker=L.marker([userLat,userLon]).addTo(map).bindPopup("Te");
}
initMap();

// ================= CACHE INIT =================
function initCache(){
  const stored=localStorage.getItem("tour_cache");
  if(stored) cache=JSON.parse(stored);
  renderCache();
}

function saveCache(){
  localStorage.setItem("tour_cache",JSON.stringify(cache));
}

function renderCache(){
  document.getElementById("cache").innerHTML=
    cache.slice(0,10).map(p=>`📍 ${p.name}<br>📏 ${Math.round(p.dist||0)} m<br>📌 ${p.lat},${p.lon}<hr>`).join("")||"üres cache";
}

initCache();

// ================= GPS =================
function startGPS(){
  navigator.geolocation.watchPosition(pos=>{
    userLat=pos.coords.latitude;
    userLon=pos.coords.longitude;

    document.getElementById("gps").innerText=`📍 ${userLat.toFixed(5)}, ${userLon.toFixed(5)}`;
    userMarker.setLatLng([userLat,userLon]);
    map.setView([userLat,userLon]);
  });
}

// ================= DIST =================
function dist(a,b,c,d){
  const R=6371000;
  const x=x=>x*Math.PI/180;
  const dLat=x(c-a);
  const dLon=x(d-b);
  const s=Math.sin(dLat/2)**2+
    Math.cos(x(a))*Math.cos(x(c))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}

// ================= FIXED OVERPASS =================
async function tourSearch(){
  const q=document.getElementById("search").value;
  const type=document.getElementById("poiType").value;

  if(!q){document.getElementById("tour").innerHTML="adj meg keresést";return;}

  document.getElementById("tour").innerHTML="🔄 OFFLINE/ONLINE TOUR keresés...";

  const bbox="47.2,18.6,47.9,19.6";

  const query=`
[out:json][timeout:12];
(
  node["name"~"${q}",i](${bbox});
  node["tourism"](${bbox});
  node["natural"="peak"](${bbox});
);
out center;
`;

  try{
    let res;

    if(navigator.onLine){
      res=await fetch("https://overpass-api.de/api/interpreter",{
        method:"POST",
        body:query
      });
    }

    let data;

    if(res && res.ok){
      data=await res.json();
    }

    if(!data || !data.elements){throw new Error("no data");}

    const results=data.elements.map(p=>{
      const d=dist(userLat,userLon,p.lat,p.lon);

      const item={
        name:p.tags?.name||"POI",
        lat:p.lat,
        lon:p.lon,
        dist:d
      };

      cache.push(item);

      return `📍 <b>${item.name}</b><br>📏 ${Math.round(d)} m<br>📌 ${item.lat.toFixed(5)}, ${item.lon.toFixed(5)}<hr>`;
    });

    saveCache();
    renderCache();

    document.getElementById("tour").innerHTML=results.slice(0,15).join("");

  }catch(e){

    // ================= OFFLINE FALLBACK =================
    const fallback=[
      {name:"Offline kilátó",lat:userLat+0.01,lon:userLon+0.01},
      {name:"Offline turista pont",lat:userLat-0.01,lon:userLon-0.01},
      {name:"Börzsöny fallback POI",lat:userLat+0.005,lon:userLon-0.005}
    ];

    const out=fallback.map(p=>{
      const d=dist(userLat,userLon,p.lat,p.lon);
      const item={...p,dist:d};
      cache.push(item);
      return `📍 <b>${p.name}</b><br>📏 ${Math.round(d)} m<br>📌 ${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}<hr>`;
    });

    saveCache();
    renderCache();

    document.getElementById("tour").innerHTML=
      "⚠️ OFFLINE MODE (cache fallback)<hr>"+out.join("");
  }
}
</script>

</body>
</html>
