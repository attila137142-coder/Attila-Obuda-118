<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V5 - Valós Indulások</title>
<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0f14;
  color: white;
}

.header {
  padding: 12px;
  background: #111826;
  font-size: 18px;
  font-weight: bold;
}

.search {
  padding: 10px;
  background: #0f1722;
}

input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

.board {
  display: flex;
  flex-direction: column;
}

.row {
  display: grid;
  grid-template-columns: 80px 1fr 140px 90px;
  padding: 10px;
  border-bottom: 1px solid #1f2a3a;
  align-items: center;
}

.line {
  font-weight: bold;
  background: #1f2937;
  padding: 5px 8px;
  border-radius: 6px;
  text-align: center;
}

.time {
  text-align: right;
  font-weight: bold;
}

.status-green { color: #22c55e; }
.status-yellow { color: #facc15; }
.status-red { color: #ef4444; }
</style>
</head>

<body>

<div class="header">
🚏 FUTÁR V5 – Valós Indulások Panel
</div>

<div class="search">
<input placeholder="Megálló neve vagy GTFS kód..." />
</div>

<div class="board">

  <!-- 15 soros minta -->
  <div class="row">
    <div class="line">5</div>
    <div>Békásmegyer H</div>
    <div class="status-green">időben</div>
    <div class="time">3 min</div>
  </div>

  <div class="row">
    <div class="line">134</div>
    <div>Árpád híd</div>
    <div class="status-yellow">késik</div>
    <div class="time">7 min</div>
  </div>

  <div class="row">
    <div class="line">H5</div>
    <div>Batthyány tér</div>
    <div class="status-red">siet</div>
    <div class="time">1 min</div>
  </div>

</div>

</body>
</html>
