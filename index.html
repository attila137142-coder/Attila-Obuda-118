<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ATTILA KÖZLEKEDÉS // FUTÁR ENGINE V3</title>

<style>

body{
    margin:0;
    background:#0b0f14;
    color:white;
    font-family:Arial;
    overflow:hidden;
}

.header{
    height:60px;
    background:#111827;
    border-bottom:2px solid #1f2937;

    display:flex;
    align-items:center;

    padding-left:20px;

    font-size:22px;
    font-weight:bold;
}

.main{
    display:flex;
    height:calc(100vh - 60px);
}

/* LEFT PANEL */

.left{
    width:340px;
    background:#111827;
    border-right:2px solid #1f2937;

    display:flex;
    flex-direction:column;
}

.searchBox{
    padding:15px;
}

#search{
    width:100%;
    box-sizing:border-box;

    padding:12px;

    background:#0b1220;
    border:1px solid #374151;

    color:white;
    font-size:16px;
    border-radius:8px;
}

#results{
    overflow:auto;
    flex:1;
}

.result{
    padding:12px;
    border-bottom:1px solid #1f2937;
    cursor:pointer;
}

.result:hover{
    background:#1f2937;
}

.stopName{
    font-weight:bold;
    font-size:15px;
}

.stopId{
    color:#9ca3af;
    font-size:12px;
}

/* RIGHT PANEL */

.right{
    flex:1;
    display:flex;
    flex-direction:column;
}

.stopHeader{
    background:#111827;
    padding:14px;

    border-bottom:2px solid #1f2937;
}

.stopTitle{
    font-size:22px;
    font-weight:bold;
}

.gtfs{
    margin-top:4px;
    color:#9ca3af;
}

/* TABLE */

.table{
    flex:1;
    overflow:auto;
}

.row{
    display:grid;

    grid-template-columns:
    70px
    1.6fr
    130px
    120px
    110px
    120px;

    gap:10px;

    padding:10px;

    border-bottom:1px solid #1f2937;

    align-items:center;
}

.row:hover{
    background:#101826;
}

.head{
    position:sticky;
    top:0;

    background:#17202c;

    font-weight:bold;
    z-index:5;
}

/* STATUS COLORS */

.early{
    color:#ff4d4d;
    font-weight:bold;
}

.late{
    color:#4da6ff;
    font-weight:bold;
}

.ontime{
    color:#e5e7eb;
}

.line{
    font-weight:bold;
    font-size:18px;
}

/* SCROLLBAR */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#374151;
}

</style>
</head>

<body>

<div class="header">
🚆 ATTILA KÖZLEKEDÉS // FUTÁR ENGINE V3
</div>

<div class="main">

    <!-- LEFT -->
    <div class="left">

        <div class="searchBox">
            <input
                id="search"
                placeholder="Megálló keresése név vagy GTFS alapján..."
            >
        </div>

        <div id="results"></div>

    </div>

    <!-- RIGHT -->
    <div class="right">

        <div class="stopHeader">

            <div class="stopTitle" id="stopTitle">
                🚏 Válassz megállót
            </div>

            <div class="gtfs" id="gtfsId">
                GTFS: ---
            </div>

        </div>

        <div class="table">

            <div class="row head">
                <div>Járat</div>
                <div>Irány</div>
                <div>Realtime</div>
                <div>Rendszám</div>
                <div>Belső</div>
                <div>Forda</div>
            </div>

            <div id="departures"></div>

        </div>

    </div>

</div>

<script>

/* -------------------------
   STOPS
-------------------------- */

const stops = [

{
    stop_id:"F01111",
    stop_name:"Nád utca"
},

{
    stop_id:"F02222",
    stop_name:"Óbuda, Árpád híd"
},

{
    stop_id:"F03333",
    stop_name:"Batthyány tér"
},

{
    stop_id:"F04444",
    stop_name:"Diosjenő vasútállomás"
},

{
    stop_id:"F05555",
    stop_name:"Börzsöny kapu"
}

];

/* -------------------------
   STOP DATA
-------------------------- */

const stopData = {

"Nád utca":[

{
line:"118",
dir:"Batthyány tér",

realtime:{
status:"early",
min:0,
sec:42
},

vehicle:{
fleet:"BPI-742",
internal:"FJ-204",
duty:"12"
}
},

{
line:"9",
dir:"Óbuda",

realtime:{
status:"ontime",
min:2,
sec:11
},

vehicle:{
fleet:"---",
internal:"---",
duty:"---"
}
},

{
line:"17",
dir:"Savoya Park",

realtime:{
status:"late",
min:3,
sec:22
},

vehicle:{
fleet:"SGX-991",
internal:"TR-77",
duty:"5"
}
}

],

"Óbuda, Árpád híd":[

{
line:"1",
dir:"Kelenföld",

realtime:{
status:"ontime",
min:1,
sec:15
},

vehicle:{
fleet:"CAF-001",
internal:"V1",
duty:"2"
}
},

{
line:"17",
dir:"Bécsi út",

realtime:{
status:"early",
min:0,
sec:33
},

vehicle:{
fleet:"TATRA-12",
internal:"T5C5",
duty:"17"
}
}

],

"Batthyány tér":[

{
line:"19",
dir:"Kelenföld",

realtime:{
status:"late",
min:5,
sec:10
},

vehicle:{
fleet:"CAF-221",
internal:"CF-1",
duty:"9"
}
}

]

};

/* -------------------------
   SEARCH
-------------------------- */

const searchInput =
document.getElementById("search");

searchInput.addEventListener(
"input",
function(e){

const q =
e.target.value.toLowerCase();

const results =
document.getElementById("results");

results.innerHTML = "";

if(q.length < 1){
return;
}

const filtered =
stops.filter(stop => {

return(

stop.stop_name
.toLowerCase()
.includes(q)

||

stop.stop_id
.toLowerCase()
.includes(q)

);

});

filtered.forEach(stop => {

const div =
document.createElement("div");

div.className = "result";

div.innerHTML = `
<div class="stopName">
🚏 ${stop.stop_name}
</div>

<div class="stopId">
GTFS: ${stop.stop_id}
</div>
`;

div.onclick = () => {
loadStop(stop);
};

results.appendChild(div);

});

}
);

/* -------------------------
   SAFE
-------------------------- */

function safe(v){
return v || "---";
}

/* -------------------------
   REALTIME
-------------------------- */

function renderRealtime(rt){

if(!rt){
return "---";
}

const txt =
`${rt.min}p ${rt.sec}mp`;

if(rt.status === "early"){
return `
<span class="early">
🔴 SIET ${txt}
</span>
`;
}

if(rt.status === "late"){
return `
<span class="late">
🔵 KÉSIK ${txt}
</span>
`;
}

return `
<span class="ontime">
${txt}
</span>
`;

}

/* -------------------------
   LOAD STOP
-------------------------- */

function loadStop(stop){

document.getElementById(
"stopTitle"
).innerHTML =
`🚏 ${stop.stop_name}`;

document.getElementById(
"gtfsId"
).innerHTML =
`GTFS: ${stop.stop_id}`;

const departures =
document.getElementById(
"departures"
);

departures.innerHTML = "";

const deps =
stopData[stop.stop_name] || [];

if(deps.length === 0){

departures.innerHTML = `
<div class="row">
<div>---</div>
<div>Nincs adat</div>
<div>---</div>
<div>---</div>
<div>---</div>
<div>---</div>
</div>
`;

return;
}

deps.forEach(d => {

const fleet =
safe(d.vehicle?.fleet);

const internal =
safe(d.vehicle?.internal);

const duty =
safe(d.vehicle?.duty);

const row =
document.createElement("div");

row.className = "row";

row.innerHTML = `

<div class="line">
${safe(d.line)}
</div>

<div>
${safe(d.dir)}
</div>

<div>
${renderRealtime(d.realtime)}
</div>

<div>
${fleet}
</div>

<div>
${internal}
</div>

<div>
${duty}
</div>

`;

departures.appendChild(row);

});

}

</script>

</body>
</html>
