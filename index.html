<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🟦 V14 LOCAL GTFS CORE</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

header{
    background:#111827;
    color:#38bdf8;
    text-align:center;
    padding:12px;
    font-size:22px;
    font-weight:bold;
}

.container{
    display:flex;
    height:calc(100vh - 56px);
}

/* LEFT */

.left{
    width:36%;
    background:#0f172a;
    border-right:1px solid #1f2937;
    display:flex;
    flex-direction:column;
}

.panel{
    padding:10px;
    border-bottom:1px solid #1f2937;
}

input,button{
    width:100%;
    padding:10px;
    margin-top:6px;
    border:none;
    border-radius:8px;
    box-sizing:border-box;
}

input{
    background:#1f2937;
    color:white;
}

button{
    background:#38bdf8;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0ea5e9;
}

#results{
    flex:1;
    overflow:auto;
    padding:10px;
}

.card{
    background:#111827;
    border:1px solid #1f2937;
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
    line-height:1.5;
}

.card h3{
    margin-top:0;
    color:#38bdf8;
}

.badge{
    display:inline-block;
    background:#1e293b;
    padding:3px 7px;
    border-radius:6px;
    font-size:12px;
    margin-top:4px;
}

/* RIGHT */

.right{
    width:64%;
}

#map{
    width:100%;
    height:100%;
}

.small{
    font-size:12px;
    color:#94a3b8;
}

</style>
</head>

<body>

<header>
🟦 V14 LOCAL GTFS CORE
</header>

<div class="container">

<!-- LEFT -->

<div class="left">

<div class="panel">

<input type="file"
id="gtfsZip"
accept=".zip">

<input
id="search"
placeholder="Megálló / GTFS ID">

<button onclick="searchStops()">
🔎 KERESÉS
</button>

<button onclick="showAllStops()">
🚏 ÖSSZES STOP
</button>

<button onclick="startGPS()">
📍 GPS START
</button>

<button onclick="findNearest()">
🧭 LEGKÖZELEBBI
</button>

</div>

<div id="results">

<div class="card">

<h3>🚀 V14 READY</h3>

Tölts be egy GTFS ZIP-et.

</div>

</div>

</div>

<!-- RIGHT -->

<div class="right">
<div id="map"></div>
</div>

</div>

<!-- LIBS -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>

// ================= MAP =================

let map =
L.map('map').setView([47.4979,19.0402],11);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom:19
}).addTo(map);

// ================= USER =================

let USER = {
    lat:null,
    lon:null,
    marker:null
};

// ================= GTFS =================

let STOPS = [];

let markers = [];

// ================= DIST =================

function dist(lat1,lon1,lat2,lon2){

    const R = 6371;

    let dLat = (lat2-lat1)*Math.PI/180;
    let dLon = (lon2-lon1)*Math.PI/180;

    let a =
        Math.sin(dLat/2)**2 +
        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.sin(dLon/2)**2;

    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ================= DRAW =================

function drawStops(){

    markers.forEach(m=>map.removeLayer(m));

    markers=[];

    STOPS.forEach(s=>{

        let m =
        L.marker([s.lat,s.lon])
        .addTo(map)
        .bindPopup(`

<b>${s.name}</b><br>

🆔 ${s.id}<br>

📍 ${s.lat}, ${s.lon}

`);

        markers.push(m);

    });

}

// ================= RENDER =================

function renderStops(arr){

    let html="";

    arr.forEach(s=>{

        let d = "N/A";

        if(USER.lat){

            d =
            dist(
                USER.lat,
                USER.lon,
                s.lat,
                s.lon
            ).toFixed(2)+" km";
        }

        html += `

<div class="card">

<h3>🚏 ${s.name}</h3>

<div class="badge">
🆔 ${s.id}
</div>

<br><br>

📍 LAT:
${s.lat}<br>

📍 LON:
${s.lon}<br><br>

📏 Távolság:
<b>${d}</b>

</div>

`;

    });

    document.getElementById("results").innerHTML = html;
}

// ================= SEARCH =================

function searchStops(){

    let q =
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();

    let res =
    STOPS.filter(s=>

        s.name.toLowerCase().includes(q) ||

        s.id.toLowerCase().includes(q)

    );

    renderStops(res);
}

// ================= SHOW ALL =================

function showAllStops(){

    renderStops(STOPS);
}

// ================= GPS =================

function startGPS(){

    navigator.geolocation.watchPosition(pos=>{

        USER.lat = pos.coords.latitude;
        USER.lon = pos.coords.longitude;

        if(USER.marker){

            map.removeLayer(USER.marker);
        }

        USER.marker =
        L.marker([USER.lat,USER.lon])
        .addTo(map)
        .bindPopup("📍 SAJÁT HELYZET");

        map.setView([USER.lat,USER.lon],13);

    });

}

// ================= NEAREST =================

function findNearest(){

    if(!USER.lat){

        alert("Nincs GPS");

        return;
    }

    let best=null;
    let bestD=999999;

    STOPS.forEach(s=>{

        let d =
        dist(
            USER.lat,
            USER.lon,
            s.lat,
            s.lon
        );

        if(d < bestD){

            best=s;
            bestD=d;
        }

    });

    renderStops([best]);
}

// ================= GTFS IMPORT =================

document
.getElementById("gtfsZip")
.addEventListener("change", async e=>{

    let file = e.target.files[0];

    if(!file){

        return;
    }

    document.getElementById("results").innerHTML = `

<div class="card">

<h3>⏳ GTFS IMPORT...</h3>

ZIP feldolgozás...

</div>

`;

    let zip = await JSZip.loadAsync(file);

    // ================= stops.txt =================

    let stopsFile = zip.file("stops.txt");

    if(!stopsFile){

        alert("Nincs stops.txt");

        return;
    }

    let stopsText =
    await stopsFile.async("string");

    let parsed =
    Papa.parse(stopsText,{
        header:true
    });

    STOPS = parsed.data
    .filter(s=>

        s.stop_lat &&
        s.stop_lon &&
        s.stop_name

    )
    .map(s=>({

        id:
            s.stop_id || "N/A",

        name:
            s.stop_name || "N/A",

        lat:
            parseFloat(s.stop_lat),

        lon:
            parseFloat(s.stop_lon)

    }));

    drawStops();

    renderStops(STOPS.slice(0,50));

    document.getElementById("results").innerHTML = `

<div class="card">

<h3>✅ GTFS IMPORT KÉSZ</h3>

🚏 Stopok:
<b>${STOPS.length}</b>

<br><br>

🔎 Keresés már működik.

</div>

`;

});

</script>

</body>
</html>
