<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>TRANSIT GRAPH BUILDER V1</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

header{
background:#111827;
padding:10px;
font-weight:bold;
}

.container{
display:grid;
grid-template-columns:360px 1fr;
height:90vh;
}

.left{
background:#1f2937;
padding:10px;
overflow:auto;
}

.box{
background:#111827;
padding:10px;
margin-bottom:10px;
border-radius:6px;
}

.row{
padding:6px;
border-bottom:1px solid #1f2937;
font-size:13px;
}

.badge{
font-size:11px;
padding:2px 6px;
background:#222;
border-radius:4px;
margin-left:5px;
}

.green{color:#7CFF7C;}
.blue{color:#4da6ff;}
.red{color:#ff4d4d;}

input{
width:100%;
padding:8px;
margin:5px 0;
border:none;
border-radius:5px;
}

.small{font-size:11px;opacity:0.8;}
</style>
</head>

<body>

<header>
🧠 TRANSIT GRAPH BUILDER V1
</header>

<div class="container">

<!-- LEFT -->
<div class="left">

<div class="box">
<h3>🔍 STOP SEARCH</h3>
<input oninput="searchStops(this.value)">
</div>

<div class="box">
<h3>🚏 STOPS</h3>
<div id="stops"></div>
</div>

</div>

<!-- RIGHT -->
<div class="left">

<div class="box">
<h3>🧠 GRAPH VIEW</h3>
<div id="graph"></div>
</div>

</div>

</div>

<script>

/* =========================
GTFS MINIMAL STOP SET
========================= */

let STOPS = [

{name:"Rendelőintézet", id:"1600_A"},
{name:"Békásmegyer HÉV", id:"1600_B"},

{name:"Békásmegyer HÉV", id:"2430_A"},
{name:"Donát utca", id:"2430_B"},

{name:"Szentlélek tér", id:"1340_A"},
{name:"Békásmegyer", id:"1340_B"},

{name:"Örs vezér tere", id:"M2_A"},
{name:"Kálvin tér", id:"M2_B"}
];

/* =========================
ROUTE MODEL (SIMPLIFIED GRAPH EDGES)
========================= */

let EDGES = [
{from:"Rendelőintézet", to:"Békásmegyer HÉV", line:"160"},
{from:"Békásmegyer HÉV", to:"Donát utca", line:"243"},
{from:"Szentlélek tér", to:"Békásmegyer", line:"134"},
{from:"Örs vezér tere", to:"Kálvin tér", line:"M2"}
];

/* =========================
RENDER STOPS
========================= */

function renderStops(list){

let html="";

list.forEach(s=>{
html += `
<div class="row" onclick="showGraph('${s.name}')">
🚏 ${s.name}
<span class="badge">STOP</span>
</div>`;
});

document.getElementById("stops").innerHTML = html;
}

renderStops(STOPS);

/* =========================
SEARCH
========================= */

function searchStops(q){

renderStops(
STOPS.filter(s=>
s.name.toLowerCase().includes(q.toLowerCase())
)
);
}

/* =========================
GRAPH ENGINE (CORE IDEA)
========================= */

function showGraph(stop){

let connections = EDGES.filter(e=>
e.from === stop || e.to === stop
);

let html = `<h3>📍 ${stop}</h3>`;

if(connections.length === 0){
html += `<div class="red">Nincs közvetlen kapcsolat</div>`;
}

connections.forEach(c=>{
html += `
<div class="row">
🟢 ${c.from} → ${c.to}
<span class="badge">${c.line}</span>
</div>`;
});

document.getElementById("graph").innerHTML = html;
}

/* =========================
INIT GRAPH VIEW
========================= */

document.getElementById("graph").innerHTML =
"<div class='small'>Válassz egy megállót a gráfhoz</div>";

</script>

</body>
</html>
