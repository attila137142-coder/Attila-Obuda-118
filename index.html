    th {
      text-align: left;
      color: #90caf9;
    }

    .late { color: #ff5252; }
    .early { color: #69f0ae; }
    .ok { color: #b0bec5; }
  </style>
</head>

<body>

<header>
  <div>🚍 FUTÁR V5 LIVE</div>
  <div class="clock" id="clock">--:--:--</div>
  <button class="btn" onclick="refreshData()">🔄 Frissítés</button>
</header>

<div class="container">

  <!-- LEFT: MAP -->
  <div class="panel map">
    🗺️ LIVE TÉRKÉP HELYE (BKK / MÁV / VOLÁN / HÉV)
  </div>

  <!-- RIGHT: TABLE -->
  <div class="panel">

    <h3>🚏 Élő indulások</h3>

    <table>
      <thead>
        <tr>
          <th>Járat</th>
          <th>Megálló</th>
          <th>Indulás</th>
          <th>Késés</th>
        </tr>
      </thead>
      <tbody id="departures">
        <tr>
          <td>🚌 34</td>
          <td>Békásmegyer H</td>
          <td>12:05</td>
          <td class="ok">0p</td>
        </tr>
        <tr>
          <td>🚍 106</td>
          <td>Flórián tér</td>
          <td>12:08</td>
          <td class="late">+3p</td>
        </tr>
      </tbody>
    </table>

  </div>

</div>

<script>

function updateClock() {
  const now = new Date();
  document.getElementById("clock").innerText = now.toLocaleTimeString();
}

setInterval(updateClock, 1000);
updateClock();

function refreshData() {
  const t = "Frissítés: OK " + new Date().toLocaleTimeString();
  document.getElementById("departures").innerHTML += 
    `<tr>
      <td>🚍 TEST</td>
      <td>Auto Update</td>
      <td>--:--</td>
      <td class='ok'>0p</td>
    </tr>`;

  document.getElementById("status")?.innerText = t;
}

</script>

</body>
</html>
