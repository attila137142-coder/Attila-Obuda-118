<!-- =====================================
     GTFS MEGÁLLÓ - VONAL KERESŐ
===================================== -->


<div class="gtfs-panel">


<div class="gtfs-title">

🔎 GTFS MEGÁLLÓ – VONAL KERESŐ

</div>





<div class="gtfs-inputs">


<input id="gtfsSearch"

placeholder="Megálló név / GTFS ID / vonal kód">


<button onclick="gtfsFind()">

🔍 KERESÉS

</button>


</div>






<div id="gtfsResult"

class="gtfs-result">


Várakozás keresésre...


</div>



</div>







<style>



/* =====================================
   GTFS CSS
===================================== */


.gtfs-panel{


margin-top:15px;


background:#071010;


border:3px solid #197080;


border-radius:20px;


padding:20px;



}



.gtfs-title{


font-size:30px;


font-weight:900;


color:#ffe600;


text-align:center;


margin-bottom:15px;



text-shadow:


0 0 15px #ffe600;


}




.gtfs-inputs{


display:flex;


gap:15px;


justify-content:center;


}




.gtfs-inputs input{


width:60%;


font-size:24px;


padding:12px;


border-radius:12px;


background:#020707;


color:white;


border:3px solid #00eaff;



}




.gtfs-inputs button{


font-size:24px;


}



.gtfs-result{


margin-top:20px;


font-size:24px;


line-height:1.5;


background:#020707;


border-radius:15px;


padding:20px;


}




@media(max-width:600px){


.gtfs-inputs{


display:block;


}


.gtfs-inputs input{


width:100%;


font-size:18px;


margin-bottom:10px;


}



.gtfs-result{


font-size:18px;


}


}






</style>










<script>



// =====================================
// MINTA GTFS ADATOK
// (később ZIP/JSON loaderhez kapcsolható)
// =====================================



const GTFS_DATA=[



{

route:"2430",

line:"243",

name:"Nád utca",

stop:"F00457",

lat:"47.597930",

lon:"19.050940",

provider:"BKK"

},



{

route:"2430",

line:"243",

name:"Békásmegyer",

stop:"008436",

lat:"47.597000",

lon:"19.044000",

provider:"BKK"

},



{

route:"70",

line:"70",

name:"Budapest-Nyugati",

stop:"005540253",

lat:"47.510000",

lon:"19.056000",

provider:"MÁV"

}



];








function gtfsFind(){


let q=document
.getElementById("gtfsSearch")
.value
.toLowerCase()
.trim();




let result=GTFS_DATA.filter(item=>


item.name.toLowerCase().includes(q)

||

item.stop.toLowerCase().includes(q)

||

item.route.toLowerCase().includes(q)

||

item.line.toLowerCase().includes(q)


);






let box=document
.getElementById("gtfsResult");





if(result.length===0){


box.innerHTML=

"❌ Nincs találat";


return;


}





let html="";



result.forEach(r=>{


html+=`

<div>

🚍 <b>${r.provider}</b>

<br>


Vonal:
<b>${r.line}</b>

<br>


Route ID:

<b>${r.route}</b>

<br>


📍 ${r.name}

<br>


GTFS STOP ID:

<b>${r.stop}</b>

<br>


🌍

${r.lat},

${r.lon}


<br>


<button onclick="openURL(
'https://realtimenext.hu/embed/bkv/stops/${r.stop}/schedule'
)">

📡 RealTimeNext

</button>



<hr>


</div>


`;



});




box.innerHTML=html;



}



</script>
