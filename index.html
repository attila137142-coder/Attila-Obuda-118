<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attila TIMETABLE VISUALIZER</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body { font-family: Arial; background:#0b1220; color:#fff; margin:0; }
header { padding:15px; background:#111c33; position:sticky; top:0; }
input, button { padding:10px; margin:5px; border-radius:8px; border:none }
button { background:#22c55e; color:#fff; font-weight:bold; cursor:pointer }

.layout { display:flex; gap:10px; padding:10px }
.left { width:40%; }
.right { width:60%; }

.card { background:#1e293b; padding:12px; border-radius:10px; margin-top:10px; cursor:pointer }
.board { background:#0f172a; border:1px solid #334155; padding:15px; border-radius:12px; }
.big { font-size:26px; font-weight:bold; }
.row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #1f2a44; }
.small { opacity:0.7; font-size:12px }

</style>
</head>
<body>

<header>
<h2>🚍 FULL TIMETABLE VISUALIZER</h2>
<div class="small">BKK-szerű indulási kijelző + GTFS engine</div>
</header>

<div class="layout">

<div class="left">

<input id="q" placeholder="Megálló / állomás">
<button onclick="searchStops()">KERESÉS</button>
<button onclick="loadGTFS()">GTFS BETÖLTÉS</button>

<div id="results"></div>

</div>

<div class="right">

<div class="board">
<div class="big">🕒 INDULÁSI TÁBLA</div>
<div id="boardInfo" class="small">Válassz egy megállót</div>
<div id="departures"></div>
</div>

</div>

</div>

<script>

let STOPS=[];
let TRIPS=[];
let STOP_TIMES=[];
let ROUTES=[];
let SELECTED_STOP=null;

function dist(a,b,c,d){
  const R=6371000;
  const t=x=>x*Math.PI/180;
  let dLat=t(c-a), dLon=t(d-b);
  let A=Math.sin(dLat/2)**2+
    Math.cos(t(a))*Math.cos(t(c))*Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(A),Math.sqrt(1-A));
}

function getLoc(cb){
  navigator.geolocation.getCurrentPosition(p=>cb(p.coords.latitude,p.coords.longitude));
}

async function loadGTFS(){

  let url="https://gtfs.menetbrand.com/download/volanbusz";

  let res=await fetch(url);
  let zip=await JSZip.loadAsync(await res.blob());

  async function read(n){
    let f=zip.file(n);
    return f?await f.async("string"):null;
  }

  let stopsTxt=await read("stops.txt");
  let tripsTxt=await read("trips.txt");
  let timesTxt=await read("stop_times.txt");
  let routesTxt=await read("routes.txt");

  STOPS=Papa.parse(stopsTxt,{header:true,skipEmptyLines:true}).data;
  TRIPS=tripsTxt?Papa.parse(tripsTxt,{header:true,skipEmptyLines:true}).data:[];
  STOP_TIMES=timesTxt?Papa.parse(timesTxt,{header:true,skipEmptyLines:true}).data:[];
  ROUTES=routesTxt?Papa.parse(routesTxt,{header:true,skipEmptyLines:true}).data:[];

  alert("GTFS betöltve: "+STOPS.length);
}

function searchStops(){

  let q=document.getElementById('q').value.toLowerCase();

  let res=STOPS.filter(s=>
    (s.stop_name||"").toLowerCase().includes(q) ||
    (s.stop_id||"").toLowerCase().includes(q)
  );

  getLoc((lat,lon)=>{

    res.sort((a,b)=>dist(lat,lon,a.stop_lat,a.stop_lon)-dist(lat,lon,b.stop_lat,b.stop_lon));

    let html="";

    res.slice(0,20).forEach(s=>{

      html+=`<div class='card' onclick='selectStop("${s.stop_id}","${s.stop_name}")'>
        <b>${s.stop_name}</b><br>
        <span class='small'>${s.stop_id}</span>
      </div>`;

    });

    document.getElementById('results').innerHTML=html;

  });
}

function selectStop(id,name){
  SELECTED_STOP=id;
  document.getElementById('boardInfo').innerHTML="📍 " + name + " ("+id+")";
  renderBoard();
}

function parseTime(t){
  if(!t) return 99999;
  let p=t.split(":");
  return (+p[0])*3600+(+p[1])*60+(+p[2]||0);
}

function nowSec(){
  let d=new Date();
  return d.getHours()*3600+d.getMinutes()*60+d.getSeconds();
}

function renderBoard(){

  if(!SELECTED_STOP) return;

  let now=nowSec();

  let deps=STOP_TIMES
    .filter(x=>x.stop_id==SELECTED_STOP)
    .map(x=>x.departure_time||x.arrival_time)
    .filter(Boolean)
    .map(t=>({t,sec:parseTime(t)}))
    .filter(x=>x.sec>=now)
    .sort((a,b)=>a.sec-b.sec)
    .slice(0,12);

  let html="";

  deps.forEach(d=>{
    let diff=Math.round((d.sec-now)/60);

    html+=`
      <div class='row'>
        <div>${d.t}</div>
        <div>${diff} perc</div>
      </div>
    `;
  });

  document.getElementById('departures').innerHTML=html || "nincs indulás";
}

setInterval(renderBoard,10000);

</script>

</body>
</html>
