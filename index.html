<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V8 MULTI GTFS PERSISTENT ENGINE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0f14;
  color:#e6f1ff;
  display:flex;
  height:100vh;
}

#sidebar{
  width:420px;
  background:#0f172a;
  overflow:auto;
  border-right:1px solid #1f2937;
}

#map{flex:1;}

.header{
  padding:10px;
  background:#111827;
  display:flex;
  justify-content:space-between;
  font-weight:bold;
}

.panel{
  padding:10px;
  border-bottom:1px solid #1f2937;
}

input,button{
  width:100%;
  padding:8px;
  margin-top:6px;
  border-radius:6px;
  border:none;
}

button{background:#1d4ed8;color:white;}

.row{
  display:flex;
  justify-content:space-between;
  padding:4px 0;
  border-bottom:1px solid #1f2937;
}

.ok{color:#00ff99;}
.warn{color:#ffcc00;}
.bad{color:#ff4d4d;}

.tag{
  font-size:12px;
  padding:2px 6px;
  border-radius:4px;
  background:#1f2937;
  margin-left:6px;
}
</style>
</head>

<body>

<div id="sidebar">

<div class="header">
🚍 V8 MULTI GTFS ENGINE
<div id="clock"></div>
</div>

<div class="panel">
<input type="file" id="zip">
<select id="source">
  <option value="bkk">BKK</option>
  <option value="volan">VOLÁN</option>
  <option value="mav">MÁV</option>
</select>
<button onclick="loadGTFS()">LOAD GTFS (ADD TO SYSTEM)</button>
<button onclick="clearAll()">CLEAR ALL</button>
</div>

<div class="panel">
<input id="search" placeholder="Megálló keresés...">
<button onclick="searchStop()">KERESÉS</button>
</div>

<div class="panel">
<h3>🧠 PERSISTENT DISPATCH BOARD</h3>
<div id="board"></div>
</div>

<div class="panel">
<h3>📡 ENGINE STATUS</h3>
<div id="status"></div>
</div>

</div>

<div id="map"></div>

<script>

// ================= MAP =================
const map = L.map('map').setView([47.5,19.05],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'OSM'
}).addTo(map);

// ================= CLOCK =================
setInterval(()=>{
  document.getElementById("clock").innerText =
    new Date().toLocaleTimeString();
},1000);

// ================= MULTI GTFS REGISTRY =================
let GTFS = {
  bkk:{stops:[], departures:{}},
  volan:{stops:[], departures:{}},
  mav:{stops:[], departures:{}}
};

// ================= TIME =================
function timeToSec(t){
  let [h,m,s] = t.split(":").map(Number);

  if(h>=24){
    h = h-24;
    return (24*3600)+(h*3600+m*60+s);
  }

  return h*3600+m*60+s;
}

// ================= SAVE / LOAD =================
function save(){
  localStorage.setItem("gtfs_v8", JSON.stringify(GTFS));
}

function load(){
  let d = localStorage.getItem("gtfs_v8");
  if(d) GTFS = JSON.parse(d);
}
load();

// ================= LOAD GTFS =================
async function loadGTFS(){

  const file = document.getElementById("zip").files[0];
  const src = document.getElementById("source").value;

  const zip = await JSZip.loadAsync(file);

  let stops = {};
  let departures = {};

  for(let p in zip.files){

    let name = p.split("/").pop().toLowerCase();
    let content = await zip.files[p].async("string");

    if(name==="stops.txt"){
      let rows = Papa.parse(content,{header:true}).data;

      rows.forEach(s=>{
        stops[s.stop_id] = s;
      });
    }

    if(name==="stop_times.txt"){
      let rows = Papa.parse(content,{header:true}).data;

      rows.forEach(r=>{
        if(!r.stop_id) return;

        if(!departures[r.stop_id]) departures[r.stop_id]=[];

        departures[r.stop_id].push({
          trip:r.trip_id,
          time:r.departure_time,
          sec:timeToSec(r.departure_time),
          source:src
        });
      });
    }
  }

  GTFS[src] = {
    stops,
    departures
  };

  save();
  render();
  updateStatus();
}

// ================= MERGE ENGINE =================
function getMerged(stop_id){

  let all = [];

  Object.keys(GTFS).forEach(src=>{
    let g = GTFS[src];
    if(!g.departures) return;

    if(g.departures[stop_id]){
      all.push(...g.departures[stop_id]);
    }
  });

  return all.sort((a,b)=>a.sec-b.sec);
}

// ================= RENDER =================
function render(stop_id=null){

  let html = "";

  if(stop_id){

    let list = getMerged(stop_id);

    html += "<b>INDULÁSOK (V8 MERGED)</b><br><br>";

    list.slice(0,15).forEach(d=>{
      html += `
      <div class="row">
        <div>${d.trip}<span class="tag">${d.source}</span></div>
        <div class="ok">${d.time}</div>
      </div>`;
    });
  }

  document.getElementById("board").innerHTML = html;
}

// ================= SEARCH =================
function searchStop(){

  let q = document.getElementById("search").value.toLowerCase();

  let found = null;

  Object.keys(GTFS).forEach(src=>{
    let g = GTFS[src];

    Object.values(g.stops).forEach(s=>{
      if(s.stop_name && s.stop_name.toLowerCase().includes(q)){
        found = s;
      }
    });
  });

  if(found){
    render(found.stop_id);
  }
}

// ================= CLEAR =================
function clearAll(){
  GTFS = {
    bkk:{stops:[], departures:{}},
    volan:{stops:[], departures:{}},
    mav:{stops:[], departures:{}}
  };
  save();
  render();
}

// ================= STATUS =================
function updateStatus(){

  document.getElementById("status").innerHTML = `
  BKK: ${Object.keys(GTFS.bkk.departures||{}).length} stops<br>
  VOLÁN: ${Object.keys(GTFS.volan.departures||{}).length} stops<br>
  MÁV: ${Object.keys(GTFS.mav.departures||{}).length} stops<br>
  MODE: V8 MULTI PERSISTENT ✔<br>
  STORAGE: localStorage ACTIVE<br>
  `;
}

</script>

</body>
</html>
