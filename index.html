<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V5 – REAL BUDAI TURISTA GRAPH</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; background:#0b0f14; color:white; }
header { padding:10px; background:#111827; font-weight:bold; }
#map { height:90vh; }

.panel {
    position:absolute;
    top:60px;
    left:10px;
    z-index:999;
    background:#111827;
    padding:10px;
    width:360px;
    border-radius:8px;
}

button {
    width:100%;
    padding:8px;
    margin-top:5px;
    cursor:pointer;
}

#status {
    font-size:12px;
    margin-top:8px;
    color:#93c5fd;
    white-space:pre-line;
}
</style>
</head>

<body>

<header>🧭 FUTÁR V5 – REAL BUDAI OSM TURISTA GRAPH</header>

<div class="panel">
<button onclick="loadOSM()">🚶‍♂️ Budai turista háló betöltése</button>
<div id="status">Idle</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([47.52, 19.03], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:"© OpenStreetMap"
}).addTo(map);

function log(t){
    document.getElementById("status").innerText = t;
}

// ---------------- GRAPH STORAGE ----------------
let nodeMap = {};
let edges = [];
let bounds = [];

// ---------------- DISTANCE ----------------
function dist(a,b){
    const R = 6371000;
    const dLat = (b.lat-a.lat)*Math.PI/180;
    const dLon = (b.lon-a.lon)*Math.PI/180;
    const lat1 = a.lat*Math.PI/180;
    const lat2 = b.lat*Math.PI/180;

    const x =
        Math.sin(dLat/2)**2 +
        Math.sin(dLon/2)**2 * Math.cos(lat1)*Math.cos(lat2);

    return 2*R*Math.asin(Math.sqrt(x));
}

// ---------------- KEY ----------------
function key(p){
    return `${p.lat.toFixed(5)}_${p.lon.toFixed(5)}`;
}

// ---------------- MAIN LOAD ----------------
async function loadOSM(){

    log("Loading REAL Budai hiking network...");

    const query = `
    [out:json][timeout:25];
    (
      way["highway"~"path|footway|track"](47.45,18.85,47.60,19.20);
      relation["route"="hiking"](47.45,18.85,47.60,19.20);
    );
    out geom;
    `;

    const url = "https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query);

    try {

        const res = await fetch(url);
        const data = await res.json();

        log("Elements: " + data.elements.length + "\nProcessing graph...");

        let edgeCount = 0;

        data.elements.forEach(el => {

            if(!el.geometry || el.geometry.length < 2) return;

            const g = el.geometry;

            for(let i=0;i<g.length-1;i++){

                const A = {lat:g[i].lat, lon:g[i].lon};
                const B = {lat:g[i+1].lat, lon:g[i+1].lon};

                const idA = key(A);
                const idB = key(B);

                nodeMap[idA] = A;
                nodeMap[idB] = B;

                const d = dist(A,B);

                edges.push({a:A,b:B,d});

                bounds.push([A.lat,A.lon]);

                L.polyline([[A.lat,A.lon],[B.lat,B.lon]],{
                    color:"#22c55e",
                    weight:3
                }).addTo(map);

                edgeCount++;
            }
        });

        // nodes render
        Object.values(nodeMap).forEach(n=>{
            L.circleMarker([n.lat,n.lon],{
                radius:4,
                color:"#fff",
                fillColor:"#38bdf8",
                fillOpacity:0.8
            }).addTo(map);
        });

        if(bounds.length > 0){
            map.fitBounds(bounds);
        }

        log(
`✔ REAL BUDAI GRAPH LOADED

Nodes: ${Object.keys(nodeMap).length}
Edges: ${edges.length}
Status: LIVE OSM TURISTA NETWORK`
        );

    } catch(e){

        console.error(e);
        log("ERROR ❌ Overpass failed\n" + e.message);
    }
}

</script>

</body>
</html>
