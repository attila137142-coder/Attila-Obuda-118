<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Megálló Menetrend V1</title>

<style>

body{
    margin:0;
    background:#f0f0f0;
    font-family:Arial,Helvetica,sans-serif;
}

.header{
    background:#ffffff;
    padding:12px;
    font-size:22px;
    font-weight:bold;
    border-bottom:1px solid #ccc;
}

.stopTitle{
    font-size:18px;
    font-weight:bold;
    padding:10px;
    background:white;
}

.departure{
    display:flex;
    background:white;
    border-bottom:1px solid #d0d0d0;
    min-height:92px;
}

.route{
    width:95px;
    min-width:95px;
    background:#1399d6;
    color:white;
    font-size:30px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
}

.center{
    flex:1;
    padding:8px;
}

.destination{
    font-size:20px;
    font-weight:bold;
}

.vehicle{
    font-size:14px;
    margin-top:5px;
}

.nextstop{
    font-size:14px;
    font-weight:bold;
}

.minutes{
    width:90px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:58px;
    color:black;
}

.green{
    color:#13b613;
}

.red{
    color:#d02020;
}

.search{
    padding:10px;
    background:white;
}

input{
    width:100%;
    padding:10px;
    font-size:18px;
    box-sizing:border-box;
}

</style>
</head>
<body>

<div class="header">
🚏 Megállók
</div>

<div class="search">
<input id="searchBox"
placeholder="Megálló keresése...">
</div>

<div class="stopTitle">
Zemplén Győző utca (összesített megálló nézet)
</div>

<div id="list"></div>

<script>

const departures = [

{
route:"160",
dest:"Békásmegyer H",
min:2,
vehicle:"NGC151 - MERCEDES Citaro O530",
next:"Zemplén Győző utca"
},

{
route:"243",
dest:"Donát utca ▶ Békásmegyer H",
min:9
},

{
route:"160",
dest:"Óbudai rendelőintézet",
min:13
},

{
route:"160",
dest:"Békásmegyer H",
min:21,
vehicle:"NGC159 - MERCEDES Citaro O530",
next:"Bécsi út / Vörösvári út"
},

{
route:"243",
dest:"Donát utca ▶ Békásmegyer H",
min:21
},

{
route:"243",
dest:"Donát utca ▶ Békásmegyer H",
min:33
},

{
route:"160",
dest:"Békásmegyer H",
min:36
},

{
route:"160",
dest:"Óbudai rendelőintézet",
min:44
},

{
route:"243",
dest:"Donát utca ▶ Békásmegyer H",
min:45
}

];

function render(){

const list=document.getElementById("list");

list.innerHTML="";

departures.forEach(d=>{

const color =
d.min <=5
? "green"
: "";

list.innerHTML += `

<div class="departure">

<div class="route">
${d.route}
</div>

<div class="center">

<div class="destination">
${d.dest}
</div>

${d.vehicle
? `<div class="vehicle">${d.vehicle}</div>`
: ``}

${d.next
? `<div class="nextstop">Következő megálló: ${d.next}</div>`
: ``}

</div>

<div class="minutes ${color}">
${d.min}'
</div>

</div>

`;

});

}

render();

</script>

</body>
</html>
