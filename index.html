<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V12 CONTROL ROOM CORE</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:#e5e7eb;
}

header{
    background:#111827;
    padding:12px;
    text-align:center;
    font-weight:bold;
    color:#38bdf8;
}

.container{
    display:flex;
    height:100vh;
}

.left{
    width:60%;
    display:flex;
    flex-direction:column;
    border-right:1px solid #1f2937;
}

    padding:10px;
    border-bottom:1px solid #1f2937;
}

button{
    width:100%;
    padding:10px;
    margin-top:6px;
    border:none;
    border-radius:8px;

    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0ea5e9;
}

.list{
    flex:1;
    overflow:auto;
    padding:10px;
}

.card{
    background:#0f172a;

}

.right{
    width:40%;
    display:flex;

}
</style>
</head>

<body>

<header>
🚦 V12 REAL GPS + GTFS + ROUTE ENGINE CONTROL ROOM
</header>

<div class="container">

<div class="left">

<div class="panel">
<button onclick="getGPS()">📍 GPS BEOLVASÁS</button>
<button onclick="findNearest()">🧭 LEGKÖZELEBBI MEGÁLLÓ</button>
<button onclick="routeTest()">🚦 ROUTE TEST (A → B)</button>
</div>

<div class="list" id="list"></div>

</div>

<div class="right">
<div class="log" id="log"></div>
</div>

</div>

<script>

// ---------------- LOG ----------------
function log(m){
    let el=document.getElementById("log");
    el.innerHTML+=m+"<br>";
    el.scrollTop=el.scrollHeight;
}

// ---------------- GTFS STOPS ----------------
let STOPS=[
    {id:"SKANZEN",name:"Skanzen",lat:47.6952,lon:19.0756},
    {id:"KIRALYRET",name:"Királyrét",lat:47.9271,lon:18.9952},
    {id:"TAHITOTFALU",name:"Tahitótfalu",lat:47.7568,lon:19.0794},
    {id:"HIDFO",name:"Hídfő",lat:47.4979,lon:19.0402},
    {id:"NAD",name:"Nád utca",lat:47.5183,lon:19.0467}
];

// ---------------- USER GPS ----------------
let USER={
    lat:null,
    lon:null
};

// ---------------- DISTANCE ----------------
function dist(lat1,lon1,lat2,lon2){
    const R=6371;
    let dLat=(lat2-lat1)*Math.PI/180;
    let dLon=(lon2-lon1)*Math.PI/180;
    let a=
        Math.sin(dLat/2)**2 +
        Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
        Math.sin(dLon/2)**2;

    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ---------------- GPS ----------------
function getGPS(){

    if(!navigator.geolocation){
        log("❌ GPS nem támogatott");
        return;
    }

    navigator.geolocation.getCurrentPosition(pos=>{

        USER.lat=pos.coords.latitude;
        USER.lon=pos.coords.longitude;

        log("📍 GPS OK:");
        log("LAT: "+USER.lat);
        log("LON: "+USER.lon);

    },err=>{
        log("❌ GPS hiba");
    });
}

// ---------------- NEAREST STOP ENGINE ----------------
function findNearest(){

    if(!USER.lat){
        log("❌ nincs GPS adat");
        return;
    }

    let best=null;
    let bestD=9999;

    STOPS.forEach(s=>{
        let d=dist(USER.lat,USER.lon,s.lat,s.lon);
        if(d<bestD){
            bestD=d;
            best=s;
        }
    });

    log("🧭 LEGKÖZELEBBI MEGÁLLÓ:");
    log("➡️ "+best.name+" ("+best.id+")");
    log("📏 "+bestD.toFixed(2)+" km");
}

// ---------------- ROUTE ENGINE (SIMPLE A→B) ----------------
function routeTest(){

    let from=STOPS[0];
    let to=STOPS[3];

    log("🚦 ROUTE ENGINE:");
    log("FROM: "+from.name);
    log("TO: "+to.name);

    let d=dist(from.lat,from.lon,to.lat,to.lon);

    log("📏 TÁVOLSÁG: "+d.toFixed(2)+" km");

    if(d<5){
        log("🟢 WALK / LOCAL ROUTE");
    }else if(d<30){
        log("🟡 BUS / REGIONAL");
    }else{
        log("🔴 LONG DISTANCE ROUTE");
    }
}

log("🚀 V12 CONTROL ROOM CORE LOADED");

</script>

</body>
</html>
