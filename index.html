<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V5 – DEBUG GRAPH</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; background:#0b0f14; color:white; }
header { padding:10px; background:#111827; font-weight:bold; }
#map { height:90vh; }

.panel {
    position:absolute;
    top:60px;
    left:10px;
    z-index:999;
    background:#111827;
    padding:10px;
    width:360px;
    border-radius:8px;
}

button {
    width:100%;
    padding:8px;
    margin-top:5px;
    cursor:pointer;
}

#status {
    font-size:12px;
    margin-top:8px;
    color:#93c5fd;
    white-space:pre-line;
}
</style>
</head>

<body>

<header>🧭 FUTÁR V5 – VISUAL DEBUG GRAPH (FOR REAL CHECK)</header>

<div class="panel">
<button onclick="run()">🚶‍♂️ GRAPH RENDER DEBUG</button>
<div id="status">Idle</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([47.52, 19.03], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:"OSM"
}).addTo(map);

function log(t){
    document.getElementById("status").innerText = t;
}

// ---------------- GRAPH ----------------
const nodes = {
    A:{name:"Csillaghegy",lat:47.569,lon:19.045},
    B:{name:"Hármashatár-hegy",lat:47.539,lon:19.034},
    C:{name:"Árpád-kilátó",lat:47.534,lon:19.028},
    D:{name:"Normafa",lat:47.500,lon:18.966},
    E:{name:"János-hegy",lat:47.525,lon:18.963},
};

const edges = [
    ["A","B"],
    ["B","C"],
    ["B","D"],
    ["D","E"],
    ["E","C"]
];

function run(){

    log("Rendering nodes + edges...");

    let bounds = [];

    // nodes
    Object.keys(nodes).forEach(k=>{
        const n = nodes[k];

        L.circleMarker([n.lat,n.lon],{
            radius:10,
            color:"#fff",
            fillColor:"#38bdf8",
            fillOpacity:1
        }).addTo(map)
        .bindPopup(n.name);

        bounds.push([n.lat,n.lon]);
    });

    // edges
    edges.forEach(e=>{
        const a = nodes[e[0]];
        const b = nodes[e[1]];

        L.polyline(
            [[a.lat,a.lon],[b.lat,b.lon]],
            {color:"lime",weight:6}
        ).addTo(map);
    });

    map.fitBounds(bounds);

    log("DONE ✔ GRAPH VISIBLE\nNodes: "+Object.keys(nodes).length+"\nEdges: "+edges.length);
}

</script>

</body>
</html>
