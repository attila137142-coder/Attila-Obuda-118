FULL COPY-PASTE HTML (V5 MATRIX ENGINE)
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V5 Matrix Engine</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b1220;
  color:#e2e8f0;
}

.container {
  max-width:900px;
  margin:auto;
  padding:20px;
}

h1 { color:#38bdf8; }

input {
  width:100%;
  padding:12px;
  font-size:16px;
  border:none;
  border-radius:8px;
}

button {
  margin-top:10px;
  padding:10px 15px;
  background:#22c55e;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.card {
  margin-top:15px;
  background:#1e293b;
  padding:15px;
  border-radius:10px;
}

.row {
  padding:6px 0;
  border-bottom:1px solid #334155;
}

.badge {
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  margin-right:5px;
  display:inline-block;
}

.volan { background:#f59e0b; color:black; }
.mav { background:#a78bfa; color:black; }
</style>
</head>

<body>

<div class="container">

<h1>🚍 FUTÁR V5 – IDŐRENDEZETT MÁTRIX</h1>

<input id="input" placeholder="Írd be: 773012, 005546862" />
<button onclick="run()">Indítás</button>

<div id="out"></div>

</div>

<script>

// ---------------- STOP DATA (DEMO) ----------------
function getData(id){

  const db = {
    "773012": {
      name: "VOLÁN megálló",
      type: "VOLAN",
      lines: ["1010", "1012", "1020"]
    },
    "005546862": {
      name: "MÁV állomás",
      type: "MAV",
      lines: ["IC 745", "S80", "Z70", "EC 142"]
    }
  };

  return db[id] || {
    name: "Ismeretlen",
    type: "UNKNOWN",
    lines: ["Nincs adat"]
  };
}

// ---------------- TIME GENERATOR ----------------
function genTimes(lines){
  let now = new Date();
  let list = [];

  lines.forEach(l=>{
    let add = Math.floor(Math.random()*60)+1;

    let t = new Date(now.getTime() + add*60000);

    list.push({
      line: l,
      time: t,
      mins: add
    });
  });

  // SORT by time
  list.sort((a,b)=>a.mins - b.mins);

  return list;
}

// ---------------- MAIN ----------------
function run(){

  const id = document.getElementById("input").value.trim();
  if(!id) return;

  const data = getData(id);
  const times = genTimes(data.lines);

  let badge = data.type==="VOLAN"?"volan":"mav";

  let html = `
    <div class="card">
      <span class="badge ${badge}">${data.type}</span>
      <b>${data.name}</b>

      <h3>⏱ FUTÁR MÁTRIX (időrend)</h3>
  `;

  times.forEach(t=>{
    html += `
      <div class="row">
        🚍 ${t.line}
        → ${t.time.toLocaleTimeString().slice(0,5)}
        <b>(${t.mins}p)</b>
      </div>
    `;
  });

  html += `
      <h3>📊 RAW MATRIX VIEW</h3>
      <div class="card">
        LINE | TIME | MIN<br>
  `;

  times.forEach(t=>{
    html += `${t.line} | ${t.time.toLocaleTimeString().slice(0,5)} | ${t.mins}p<br>`;
  });

  html += `
      </div>
    </div>
  `;

  document.getElementById("out").innerHTML = html;
}

</script>

</body>
</html>
