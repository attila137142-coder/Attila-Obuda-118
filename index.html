<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Atlasz – Börzsöny Forrás Index Rendszer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }
#map { height: 80vh; }
.panel {
  padding:10px;
  background:#f5f5f5;
}
input { padding:6px; width:60%; }
button { padding:6px; }
</style>
</head>

<body>

<div class="panel">
  🔍 <input id="search" placeholder="keresés: forrás, Csóványos, Kettős-kút...">
  <button onclick="runSearch()">Keresés</button>

  <label style="margin-left:10px;">
    <input type="checkbox" id="safeOnly"> 💧 csak S1–S2
  </label>

  <div id="info" style="margin-top:8px;"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

/////////////////////////////////////////////////////
// 🗺️ MAP
/////////////////////////////////////////////////////
const map = L.map('map').setView([47.95, 18.90], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OSM'
}).addTo(map);

let markers = [];

/////////////////////////////////////////////////////
// 📦 MOCK OSM DATA (helyettesíthető valódival)
/////////////////////////////////////////////////////

let pois = [
  {id:1,name:"Természetbarát-forrás",lat:47.9394,lon:18.9321,osm:"2255466515",tags:{natural:"spring"}},
  {id:2,name:"Ismeretlen forrás",lat:47.945,lon:18.91,osm:"x1",tags:{natural:"spring"}},
  {id:3,name:"Kéktúra közkút",lat:47.96,lon:18.88,osm:"x2",tags:{amenity:"drinking_water"}}
];

/////////////////////////////////////////////////////
// 🧠 S1–S5 BESOROLÁS MOTOR
/////////////////////////////////////////////////////

function classify(poi){

  if(poi.tags.amenity === "drinking_water") return "S1";

  if(poi.tags.man_made === "water_tap") return "S2";

  if(poi.tags.natural === "spring") return "S3";

  return "S4";
}

/////////////////////////////////////////////////////
// 📏 DISTANCE
/////////////////////////////////////////////////////

function dist(a,b,c,d){
  const R=6371;
  const dLat=(c-a)*Math.PI/180;
  const dLon=(d-b)*Math.PI/180;

  const x=Math.sin(dLat/2)**2 +
    Math.cos(a*Math.PI/180) *
    Math.cos(c*Math.PI/180) *
    Math.sin(dLon/2)**2;

  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

/////////////////////////////////////////////////////
// 🧹 MAP CLEAR
/////////////////////////////////////////////////////

function clearMarkers(){
  markers.forEach(m=>map.removeLayer(m));
  markers=[];
}

/////////////////////////////////////////////////////
// 🗺️ RENDER
/////////////////////////////////////////////////////

function render(list){

  clearMarkers();

  list.forEach(p=>{

    const s = classify(p);

    const color =
      s==="S1"?"green":
      s==="S2"?"blue":
      s==="S3"?"orange":"red";

    const m = L.circleMarker([p.lat,p.lon],{
      radius:8,
      color:color
    }).addTo(map);

    m.bindPopup(`
      💧 ${p.name}<br>
      🆔 ${p.osm}<br>
      ⚠️ ${s}
    `);

    markers.push(m);
  });

}

/////////////////////////////////////////////////////
// 🔍 SEARCH ENGINE
/////////////////////////////////////////////////////

function runSearch(){

  const q=document.getElementById("search").value.toLowerCase();
  const safeOnly=document.getElementById("safeOnly").checked;

  let res=pois.filter(p=>
    p.name.toLowerCase().includes(q)
  );

  res=res.map(p=>({
    ...p,
    s:classify(p)
  }));

  if(safeOnly){
    res=res.filter(p=>p.s==="S1"||p.s==="S2");
  }

  document.getElementById("info").innerHTML=
    `Találatok: ${res.length}`;

  render(res);
}

/////////////////////////////////////////////////////
// INIT
/////////////////////////////////////////////////////

render(pois);

</script>

</body>
</html>
