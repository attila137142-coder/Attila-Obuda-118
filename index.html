<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>ATTILA DISPATCHER V7 – GTFS DEPARTURE ENGINE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<style>
body{margin:0;font-family:Arial;display:flex;height:100vh;}
#sidebar{width:380px;background:#0b1220;color:#00ff66;overflow:auto;}
#map{flex:1;}
.matrix{
background:black;
color:#00ff66;
font-family:monospace;
padding:10px;
}
.row{
display:flex;
justify-content:space-between;
border-bottom:1px solid #003300;
padding:4px;
}
.btn{
padding:6px;
margin:4px;
background:#003300;
color:#00ff66;
border:none;
cursor:pointer;
}
</style>
</head>
<body>
<div id="sidebar">
<h3>🟢 V7 GTFS DISPATCH</h3>
<input type="file" id="zip">
<button class="btn" onclick="loadGTFS()">LOAD GTFS</button>
<div id="list"></div>
<div id="panel">Válassz megállót</div>
</div>
<div id="map"></div>
<script>
// ---------------- MAP ----------------
const map = L.map('map').setView([47.5,19.05],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'OSM'
}).addTo(map);
// ---------------- STATE ----------------
let stops = [];
let stopTimes = [];
let trips = [];
let routes = [];
// stop → departures cache
let departures = {};
// ---------------- LOAD GTFS ----------------
async function loadGTFS(){
const file = document.getElementById("zip").files[0];
const zip = await JSZip.loadAsync(file);
for(let path in zip.files){
let name = path.toLowerCase().split("/").pop();
let content = await zip.files[path].async("string");
if(name==="stops.txt"){
let p = Papa.parse(content,{header:true,skipEmptyLines:true});
stops = p.data.filter(s=>s.stop_lat && s.stop_lon);
}
if(name==="stop_times.txt"){
let p = Papa.parse(content,{header:true,skipEmptyLines:true});
stopTimes = p.data;
}
if(name==="trips.txt"){
let p = Papa.parse(content,{header:true,skipEmptyLines:true});
trips = p.data;
}
if(name==="routes.txt"){
let p = Papa.parse(content,{header:true,skipEmptyLines:true});
routes = p.data;
}
}
buildDepartures();
renderStops();
console.log("V7 READY ✔");
}
// ---------------- BUILD DEPARTURES ----------------
function buildDepartures(){
departures = {};
for(let st of stopTimes){
let sid = st.stop_id;
if(!departures[sid]) departures[sid]=[];
departures[sid].push({
trip: st.trip_id,
time: st.departure_time
});
}
}
// ---------------- FIND ROUTE LABEL ----------------
function getRoute(trip_id){
let trip = trips.find(t=>t.trip_id===trip_id);
if(!trip) return "–";
let route = routes.find(r=>r.route_id===trip.route_id);
return route ? route.route_short_name : "–";
}
// ---------------- RENDER STOPS ----------------
function renderStops(){
stops.forEach(s=>{
L.circleMarker([s.stop_lat,s.stop_lon],{
radius:4,
color:"cyan"
}).addTo(map)
.on("click",()=>showBoard(s));
});
document.getElementById("list").innerHTML =
stops.slice(0,50).map(s=>`📍 ${s.stop_name}`).join("<br>");
}
// ---------------- ZÖLD INDULÁSI TÁBLA ----------------
function showBoard(stop){
let list = departures[stop.stop_id] || [];
let html = `
<div class="matrix">
<h3>🟢 INDULÁSOK</h3>
<b>${stop.stop_name}</b>
<div class="row">
<b>Vonal</b><b>Trip</b><b>Idő</b>
</div>
`;
list.slice(0,15).forEach(d=>{
html += `
<div class="row">
<div>${getRoute(d.trip)}</div>
<div>${d.trip}</div>
<div>${d.time}</div>
</div>`;
});
html += `</div>`;
document.getElementById("panel").innerHTML = html;
}
</script>
</body>
</html>
