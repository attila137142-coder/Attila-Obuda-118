<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attila Közlekedés Control V0.1</title>

<style>

body{
    margin:0;
    background:#101820;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.header{
    background:#063b20;
    padding:18px;
    text-align:center;
    border-bottom:3px solid #00ff88;
}

.header h1{
    margin:0;
    font-size:26px;
}

.clock{
    margin-top:10px;
    font-size:28px;
    color:#00ff88;
    font-weight:bold;
}

.date{
    color:#ffcc00;
    font-size:18px;
}

.container{
    padding:15px;
}

.card{
    background:#182733;
    border-radius:15px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 0 10px #000;
}

button{
    width:100%;
    padding:14px;
    margin:6px 0;
    border:none;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.bkk{
    background:#0099ff;
    color:white;
}

.volan{
    background:#ff9900;
}

.mav{
    background:#cc0000;
}

.emig{
    background:#6600cc;
}

.search{
    width:100%;
    padding:12px;
    border-radius:10px;
    font-size:18px;
}


.item{
    background:#223746;
    padding:10px;
    margin-top:8px;
    border-radius:10px;
}

.small{
    color:#aaa;
    font-size:13px;
}

</style>

</head>


<body>


<div class="header">

<h1>
🚦 ATTILA KÖZLEKEDÉS CONTROL
</h1>

<div>
MULTI SERVICE DISPATCHER V0.1
</div>

<div class="clock" id="clock"></div>

<div class="date" id="date"></div>

</div>



<div class="container">


<div class="card">

<h2>🔍 Megálló kereső</h2>

<input 
class="search"
id="search"
placeholder="Pl.: Békásmegyer, Szentendre, Szob"
onkeyup="keres()">

<div id="result"></div>

</div>




<div class="card">

<h2>🚍 Élő rendszerek</h2>


<button class="bkk"
onclick="openURL('https://realtimenext.hu/embed/bkv/stops/008939/schedule')">

BKK / HÉV - Békásmegyer

</button>



<button class="volan"
onclick="openURL('https://utas.hu/')">

VOLÁN / UTAS kereső

</button>



<button class="mav"
onclick="openURL('https://kozlekedesiklub.hu/vonatinfo/')">

🚆 MÁV Vonatinfó

</button>


<button class="emig"
onclick="openURL('https://iemig.mav-trakcio.hu/')">

🚆 MÁV iEMIG

</button>


</div>




<div class="card">

<h2>📍 Kiemelt állomások</h2>


<div id="lista"></div>


</div>




<div class="card">

<h2>🗺 Térképek</h2>


<button onclick="openURL('https://map.realtimenext.hu/')">
RealTimeNext térkép
</button>


<button onclick="openURL('https://futar.bkk.hu/')">
BKK FUTÁR
</button>


<button onclick="openURL('https://utas.hu/?map=10/47.91054/18.93198')">
Börzsöny VOLÁN térkép
</button>


</div>



</div>





<script>


function openURL(url){

window.open(url,'_blank');

}




function ora(){

let d=new Date();

document.getElementById("clock").innerHTML=
d.toLocaleTimeString("hu-HU");


document.getElementById("date").innerHTML=
d.toLocaleDateString("hu-HU");

}

setInterval(ora,1000);
ora();



let helyek=[

{
nev:"Békásmegyer",
tipus:"BKK / HÉV",
url:"https://realtimenext.hu/embed/bkv/stops/008939/schedule"
},

{
nev:"Szentendre HÉV",
tipus:"BKK",
url:"https://realtimenext.hu/embed/bkv/stops/09183208/schedule"
},

{
nev:"Szentendre Papírgyár",
tipus:"VOLÁN",
url:"https://realtimenext.hu/volan/stops/008436"
},

{
nev:"Gyermekvasút Szépjuhászné",
tipus:"MÁV",
url:"https://jegy.mav.hu/menetrend/allomas?a=005546862"
},

{
nev:"Szob",
tipus:"MÁV",
url:"https://jegy.mav.hu/menetrend/allomas?a=005510504"
}


];




function betolt(){

let div=document.getElementById("lista");

div.innerHTML="";


helyek.forEach(x=>{

div.innerHTML+=`

<div class="item">

<b>${x.nev}</b><br>

<span class="small">
${x.tipus}
</span>

<br>

<button onclick="openURL('${x.url}')">
Megnyitás
</button>

</div>

`;

});


}



function keres(){

let s=document.getElementById("search").value.toLowerCase();

let div=document.getElementById("result");

div.innerHTML="";


helyek
.filter(x=>x.nev.toLowerCase().includes(s))
.forEach(x=>{

div.innerHTML+=`

<div class="item">

${x.nev}
<br>

${x.tipus}

</div>

`;

});


}



betolt();


</script>


</body>
</html>
