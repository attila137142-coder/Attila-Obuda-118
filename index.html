<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTFS → MAP AUTO ENGINE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
margin:0;
font-family:Arial;
background:#05070d;
color:#00ffcc;
}

header{
padding:12px;
text-align:center;
background:#0b1220;
border-bottom:2px solid #00ffcc;
font-weight:bold;
}

.container{
display:grid;
grid-template-columns:1fr 2fr;
height:calc(100vh - 50px);
}

.left{
padding:10px;
background:#0b1220;
overflow:auto;
border-right:1px solid #00ffcc33;
}

#map{
height:100%;
width:100%;
}

input,button{
width:100%;
padding:10px;
margin-top:5px;
background:#05070d;
border:1px solid #00ffcc;
color:#00ffcc;
cursor:pointer;
}

.stop{
padding:6px;
border-bottom:1px solid #00ffcc22;
cursor:pointer;
}

.stop:hover{
background:#00ffcc11;
}

.badge{
border:1px solid #00ffcc;
padding:2px 6px;
font-size:11px;
}
</style>
</head>

<body>

<header>
🚍 GTFS → MAP AUTO ENGINE V1 // ZIP → BUDAPEST MAP
</header>

<div class="container">

<div class="left">
<h3>📦 GTFS IMPORT</h3>

<input type="file" id="file" accept=".zip">
<button onclick="loadGTFS()">IMPORT + MAP GENERATE</button>

<h3>🚏 MEGÁLLÓK</h3>
<div id="list">Nincs adat</div>

</div>

<div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>

let map = L.map('map').setView([47.4979,19.0402], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'OSM'
}).addTo(map);

let GTFS = { stops:[] };
let markers = [];

/*
========================
CSV PARSER
========================
*/

function parseCSV(text){

let lines = text.split("\n").filter(l=>l.trim()!=="");
let headers = lines[0].split(",");

let rows=[];

for(let i=1;i<lines.length;i++){
let obj={};
let cols = lines[i].split(",");

headers.forEach((h,idx)=>{
obj[h.trim()] = cols[idx] ? cols[idx].trim() : "";
});

rows.push(obj);
}

return rows;
}

/*
========================
MAIN IMPORT
========================
*/

async function loadGTFS(){

let file = document.getElementById("file").files[0];

if(!file){
alert("Nincs ZIP!");
return;
}

let zip = await JSZip.loadAsync(file);

/*
========================
STOPS ONLY (MAP CORE)
========================
*/

if(zip.file("stops.txt")){

let txt = await zip.file("stops.txt").async("string");
GTFS.stops = parseCSV(txt);

renderMap();
renderList();

}else{
alert("stops.txt nem található!");
}

}

/*
========================
MAP RENDER
========================
*/

function renderMap(){

// clear old markers
markers.forEach(m=>map.removeLayer(m));
markers=[];

GTFS.stops.forEach(s=>{

if(!s.stop_lat || !s.stop_lon) return;

let lat = parseFloat(s.stop_lat);
let lng = parseFloat(s.stop_lon);

let m = L.marker([lat,lng])
.addTo(map)
.bindPopup("🚏 "+(s.stop_name||"ismeretlen"));

markers.push(m);

});

}

/*
========================
LIST RENDER
========================
*/

function renderList(){

let box=document.getElementById("list");
box.innerHTML="";

GTFS.stops.slice(0,200).forEach(s=>{

let div=document.createElement("div");
div.className="stop";

div.innerHTML="🚏 "+(s.stop_name||"no name");

div.onclick=()=>{

map.setView([
parseFloat(s.stop_lat),
parseFloat(s.stop_lon)
],15);

};

box.appendChild(div);

});

}

</script>

</body>
</html>
