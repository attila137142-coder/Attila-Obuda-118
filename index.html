<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTFS STOP SEARCH CORE V1</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{margin:0;font-family:Arial;background:#0b0f14;color:#00ff9d}
header{padding:12px;background:#111824}
.container{padding:12px}
input,button{padding:8px;margin:4px 0}
#search{width:100%}
.row{padding:8px;border-bottom:1px solid #223;cursor:pointer}
.small{color:#9ab}
</style>
</head>
<body>
<header>🚦 GTFS STOP SEARCH CORE V1</header>
<div class="container">
<input type="file" id="zipFile" accept=".zip">
<button id="clearBtn">Tárolt GTFS törlése</button>
<br>
<input id="search" placeholder="Megállónév vagy stop_id keresése...">
<div class="small" id="status">Nincs GTFS betöltve.</div>
<div id="results"></div>
</div>

<script>
let STOPS=[];

function saveStops(){
 localStorage.setItem("gtfs_stops_v1", JSON.stringify(STOPS));
}

function loadSaved(){
 const s=localStorage.getItem("gtfs_stops_v1");
 if(s){
   STOPS=JSON.parse(s);
   document.getElementById("status").textContent="Betöltve: "+STOPS.length+" megálló (helyi tárhelyről)";
 }
}
loadSaved();

document.getElementById("clearBtn").onclick=()=>{
 localStorage.removeItem("gtfs_stops_v1");
 location.reload();
};

document.getElementById("zipFile").addEventListener("change", async e=>{
 const file=e.target.files[0];
 if(!file) return;

 const zip=await JSZip.loadAsync(file);

 let stopsFile=null;
 Object.keys(zip.files).forEach(name=>{
   if(name.toLowerCase().endsWith("stops.txt")) stopsFile=name;
 });

 if(!stopsFile){
   alert("stops.txt nem található a ZIP-ben.");
   return;
 }

 const text=await zip.file(stopsFile).async("string");
 const lines=text.split(/\r?\n/).filter(Boolean);

 const headers=lines[0].split(",");
 const idx={};
 headers.forEach((h,i)=>idx[h]=i);

 STOPS=[];
 for(let i=1;i<lines.length;i++){
   const c=lines[i].split(",");
   STOPS.push({
     stop_id:c[idx["stop_id"]]||"",
     stop_name:c[idx["stop_name"]]||""
   });
 }

 saveStops();

 document.getElementById("status").textContent=
   "Betöltve: "+STOPS.length+" megálló";
});

document.getElementById("search").addEventListener("input", e=>{
 const q=e.target.value.toLowerCase().trim();
 const out=document.getElementById("results");

 if(!q){ out.innerHTML=""; return; }

 const res=STOPS.filter(s=>
   (s.stop_name||"").toLowerCase().includes(q) ||
   (s.stop_id||"").toLowerCase().includes(q)
 ).slice(0,300);

 out.innerHTML=res.map(s=>
   `<div class="row"><b>${s.stop_name}</b><br><span class="small">${s.stop_id}</span></div>`
 ).join("");
});
</script>
</body>
</html>
