<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>ATTILA NAVI PRO MAX</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{margin:0;background:#111;color:#fff;font-family:Arial;}
#map{height:50vh;}
.panel{padding:8px;}
.box{background:#222;padding:8px;border-radius:8px;}
button{margin:2px;padding:6px;border-radius:6px;}
#departures{position:fixed;bottom:0;width:100%;background:#000;max-height:45%;overflow:auto;}
</style>
</head>

<body>

<div class="panel">

<input id="searchInput" placeholder="Keresés (megálló / utca)">
<button onclick="search()">🔎</button><br>

<button onclick="setBase('street')">UTCAI</button>
<button onclick="setBase('topo')">TOPO</button>
<button onclick="toggleRail()">VASÚT</button>
<button onclick="toggleHike()">TURISTA</button>

<div id="info" class="box"></div>

</div>

<div id="map"></div>
<div id="departures"></div>

<script>

// MAP
let map=L.map('map').setView([47.49,19.04],13);

let base={
 street:L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'),
 topo:L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png')
};

let rail=L.tileLayer('https://{s}.tiles.openrailwaymap.org/{z}/{x}/{y}.png');
let hike=L.tileLayer('https://tile.waymarkedtrails.org/hiking/{z}/{x}/{y}.png');

base.street.addTo(map);

function setBase(b){map.eachLayer(l=>map.removeLayer(l));base[b].addTo(map);}
function toggleRail(){map.hasLayer(rail)?map.removeLayer(rail):rail.addTo(map);}
function toggleHike(){map.hasLayer(hike)?map.removeLayer(hike):hike.addTo(map);}

// GPS + SPEED
let userLat,userLng,lastT;

navigator.geolocation.watchPosition(p=>{
 let lat=p.coords.latitude;
 let lng=p.coords.longitude;
 let t=Date.now();

 if(userLat){
  let d=dist(userLat,userLng,lat,lng);
  let dt=(t-lastT)/1000;
  let ms=d/dt;
  let kmh=ms*3.6;

  document.getElementById("info").innerHTML=
   `🚀 ${kmh.toFixed(1)} km/h<br>⚡ ${ms.toFixed(2)} m/s`;
 }

 userLat=lat; userLng=lng; lastT=t;

 loadRegion(lat,lng);

});

// DIST
function dist(a,b,c,d){
 let R=6371e3;
 let φ1=a*Math.PI/180, φ2=c*Math.PI/180;
 let Δφ=(c-a)*Math.PI/180;
 let Δλ=(d-b)*Math.PI/180;
 let x=Math.sin(Δφ/2)**2+
   Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
 return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// REGION
let currentRegion=null;

function detectRegion(lat,lng){
 if(lat>47.3 && lat<47.7) return "BKK";
 if(lat>47.8) return "BORZSONY";
 if(lat<47.3) return "ZALA";
 return "PEST";
}

// GTFS URLS
const URLS={
 BKK:"bkk_light.zip",
 BORZSONY:"borzsony.zip",
 ZALA:"zala.zip",
 PEST:"pest.zip"
};

// LOAD REGION
async function loadRegion(lat,lng){

 let r=detectRegion(lat,lng);
 if(r===currentRegion) return;

 currentRegion=r;

 let res=await fetch(URLS[r]);
 let zip=await JSZip.loadAsync(await res.blob());

 let stopsTxt=await zip.file("stops.txt").async("string");
 let shapesTxt=await zip.file("shapes.txt").async("string");

 drawStops(stopsTxt);
 drawLines(shapesTxt);
}

// DRAW STOPS
function drawStops(txt){

 txt.split("\n").slice(1).forEach(r=>{
  let c=r.split(",");
  let lat=+c[4], lng=+c[5];

  let m=L.circleMarker([lat,lng],{radius:3,color:"yellow"}).addTo(map);

  m.on("click",()=>showStop(c[2],lat,lng));
 });
}

// DRAW LINES
function drawLines(txt){

 let lines={};

 txt.split("\n").slice(1).forEach(r=>{
  let c=r.split(",");
  if(!lines[c[0]]) lines[c[0]]=[];
  lines[c[0]].push([+c[1],+c[2]]);
 });

 Object.values(lines).forEach(l=>{
  L.polyline(l,{color:"cyan"}).addTo(map);
 });
}

// SEARCH
async function search(){

 let q=document.getElementById("searchInput").value.toLowerCase();

 // GTFS
 let found=[];

 document.querySelectorAll(".leaflet-tooltip").forEach(t=>{
  if(t.innerText.toLowerCase().includes(q)){
    found.push(t);
  }
 });

 if(found[0]){
   let p=found[0]._source._latlng;
   map.setView(p,17);
   return;
 }

 // OSM
 let r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}`);
 let d=await r.json();
 if(d[0]) map.setView([d[0].lat,d[0].lon],15);
}

// STOP PANEL
async function showStop(name,lat,lng){

 let air=dist(userLat,userLng,lat,lng);

 let html=`
 <h3>${name}</h3>
 ✈️ ${Math.round(air)} m
 <br>🛣️ számol...
 `;

 document.getElementById("departures").innerHTML=html;
}

</script>
</body>
</html>
