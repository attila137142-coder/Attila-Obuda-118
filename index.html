<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FUTÁR CONTROL ROOM V2</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

#app{
padding:20px;
max-width:900px;
margin:auto;
}

input,button{
width:100%;
padding:10px;
margin-top:8px;
border-radius:6px;
border:none;
}

button{
background:#2563eb;
color:white;
font-weight:bold;
cursor:pointer;
}

.row{
display:flex;
justify-content:space-between;
padding:8px;
border-bottom:1px solid #2b3a55;
}

.badge{
padding:2px 6px;
border-radius:5px;
background:#222;
font-size:11px;
}
</style>
</head>

<body>

<div id="app">

<h2>🚏 FUTÁR CONTROL ROOM V2 (REAL GTFS)</h2>

<input id="q" placeholder="Megálló keresés (pl. Nád utca)">
<button onclick="search()">Keresés</button>

<h3 id="stop"></h3>
<div id="out"></div>

</div>

<script>

async function search(){

const q = document.getElementById("q").value;

const res = await fetch("http://localhost:3000/api/stop/" + q);

const data = await res.json();

if(data.error){
document.getElementById("out").innerHTML =
"❌ nincs ilyen megálló a GTFS-ben";
return;
}

document.getElementById("stop").innerText = data.stop;

let html = "";

data.departures.forEach(d => {

html += `
<div class="row">
<div><b>${d.route}</b></div>
<div>${d.time}</div>
</div>
`;

});

document.getElementById("out").innerHTML = html;

}

</script>

</body>
</html>
