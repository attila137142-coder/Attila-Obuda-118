<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V5 HYBRID REAL ENGINE v1</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#0b0f14;
    color:#e6f1ff;
}

.header{
    background:#111827;
    padding:12px;
    display:flex;
    justify-content:space-between;
    font-weight:bold;
}

.clock{
    color:#00ff99;
}

.container{
    padding:10px;
    display:grid;
    gap:10px;
}

.panel{
    background:#111827;
    border:1px solid #1f2937;
    border-radius:10px;
    padding:10px;
}

input{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:none;
}

button{
    width:100%;
    padding:10px;
    margin-top:8px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
}

th, td{
    padding:6px;
    border-bottom:1px solid #1f2937;
}

th{
    color:#9ca3af;
}

.ok{color:#00ff99;}
.warn{color:#ffcc00;}
.bad{color:#ff4d4d;}
</style>
</head>

<body>

<div class="header">
🚍 FUTÁR V5 HYBRID REAL ENGINE v1
<div class="clock" id="clock"></div>
</div>

<div class="container">

<div class="panel">
<h3>📍 Megálló kereső (REAL ENGINE)</h3>
<input id="stopInput" placeholder="pl. Blaha, Oktogon, Szeged, MÁV">
<button onclick="searchStop()">Keresés</button>
<div id="result"></div>
</div>

<div class="panel">
<h3>🧠 LIVE INDULÁSOK (DATA ENGINE)</h3>
<table>
<thead>
<tr>
<th>Járat</th>
<th>Megálló</th>
<th>Indulás</th>
<th>Status</th>
</tr>
</thead>
<tbody id="board"></tbody>
</table>
</div>

<div class="panel">
<h3>📡 ENGINE STATUS</h3>
<p>GTFS CORE: <span class="ok">ACTIVE (SIMULATED DATA LAYER)</span></p>
<p>ROUTING: <span class="warn">BASIC MODE</span></p>
<p>REALTIME: <span class="bad">NOT CONNECTED</span></p>
<p>MODE: HYBRID ENGINE v1</p>
</div>

</div>

<script>

/* =========================
   🧠 MINI GTFS-LIKE DATABASE
========================= */

const stops = [
    {id:1, name:"Blaha Lujza tér"},
    {id:2, name:"Oktogon"},
    {id:3, name:"Újbuda-központ"},
    {id:4, name:"Szeged vasútállomás"}
];

const trips = [
    {route:"7E", stop:"Blaha Lujza tér", time:"22:05", delay:0},
    {route:"4-6", stop:"Oktogon", time:"22:07", delay:2},
    {route:"133E", stop:"Újbuda-központ", time:"22:10", delay:0},
    {route:"MÁV IC", stop:"Szeged vasútállomás", time:"22:15", delay:5}
];

/* =========================
   ⏰ CLOCK
========================= */
function updateClock(){
    document.getElementById("clock").innerText =
        new Date().toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

/* =========================
   🔎 SEARCH ENGINE
========================= */
function searchStop(){
    let val = document.getElementById("stopInput").value.toLowerCase();
    let found = stops.filter(s => s.name.toLowerCase().includes(val));

    let out = "";

    if(found.length === 0){
        document.getElementById("result").innerHTML =
            "<p class='bad'>Nincs találat</p>";
        return;
    }

    found.forEach(s=>{
        out += `<p class='ok'>✔ ${s.name}</p>`;
    });

    document.getElementById("result").innerHTML = out;

    renderBoard(val);
}

/* =========================
   📊 LIVE BOARD ENGINE
========================= */
function renderBoard(filter=""){
    let tbody = document.getElementById("board");
    tbody.innerHTML = "";

    let filtered = trips.filter(t =>
        t.stop.toLowerCase().includes(filter)
    );

    filtered.forEach(t=>{
        let status =
            t.delay === 0 ? "<span class='ok'>OK</span>" :
            t.delay <= 3 ? "<span class='warn'>KÉSÉS</span>" :
            "<span class='bad'>NAGY KÉSÉS</span>";

        tbody.innerHTML += `
        <tr>
            <td>${t.route}</td>
            <td>${t.stop}</td>
            <td>${t.time}</td>
            <td>${status}</td>
        </tr>`;
    });
}

/* initial load */
renderBoard();

</script>

</body>
</html>
