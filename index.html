<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Attila GTFS PRO V18 GITHUB</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{font-family:Arial;margin:0;background:#0f172a;color:#e2e8f0}
header{padding:10px;background:#111827;position:sticky;top:0}
button,input,select{padding:6px;margin:5px;border-radius:6px;border:0}
.card{background:#111827;padding:10px;margin:10px;border-radius:8px}
small{opacity:.75}
</style>
</head>
<body>
<header>
<b>🚀 GTFS PRO V18 GITHUB ARCH</b><br>
<select id="source">
  <option value="github">📦 GitHub GTFS</option>
  <option value="manual">📁 Manual ZIP</option>
  <option value="auto">⚡ Auto BKK</option>
</select>
<button onclick="loadGTFS()">LOAD</button>
<button onclick="startGPS()">📍 GPS</button>
<input id="search" placeholder="Megálló kereső..." oninput="searchStops()" />
</header>

<div class="card">
<b>📍 GPS + SPEED</b>
<div id="gps">-</div>
<div id="speed">0 km/h (0 m/s)</div>
</div>

<div class="card">
<b>🚏 NEAREST</b>
<div id="nearest">-</div>
</div>

<div class="card">
<b>🔎 SEARCH</b>
<div id="results"></div>
</div>

<div class="card">
<b>📌 POI</b>
<div id="poi">-</div>
</div>

<script>
let GTFS={stops:[]};
let userLat=null,userLon=null;
let history=[];

// ================= GTFS LOADER =================
async function loadGTFS(){
  const mode=document.getElementById("source").value;

  if(mode==="github") return loadGitHubGTFS();
  if(mode=="auto") return autoGTFS();
  return loadManual();
}

// ================= GITHUB GTFS =================
async function loadGitHubGTFS(){
  try{
    alert("📦 GitHub GTFS betöltés...");

    // 🔥 ide kell saját repo
    const url="https://raw.githubusercontent.com/USER/REPO/main/gtfs/budapest_gtfs.zip";

    const res=await fetch(url);
    if(!res.ok) throw new Error("GitHub nem elérhető");

    const blob=await res.blob();
    const zip=await JSZip.loadAsync(blob);

    const txt=await zip.file("stops.txt").async("string");

    GTFS.stops=Papa.parse(txt,{header:true}).data
      .filter(s=>s.stop_lat && s.stop_lon);

    alert("✔ GitHub GTFS kész: "+GTFS.stops.length);

  }catch(e){
    console.error(e);
    alert("❌ GitHub GTFS hiba");
  }
}

// ================= AUTO BKK =================
async function autoGTFS(){
  try{
    alert("⚡ Auto BKK...");

    const res=await fetch("https://bkk.hu/gtfs/budapest_gtfs.zip");
    const blob=await res.blob();

    const zip=await JSZip.loadAsync(blob);
    const txt=await zip.file("stops.txt").async("string");

    GTFS.stops=Papa.parse(txt,{header:true}).data
      .filter(s=>s.stop_lat && s.stop_lon);

    alert("✔ Auto GTFS: "+GTFS.stops.length);

  }catch{
    alert("❌ Auto nem elérhető");
  }
}

// ================= MANUAL =================
async function loadManual(){
  const file=document.getElementById("zipInput")?.files?.[0];
  if(!file) return alert("ZIP kell");

  const zip=await JSZip.loadAsync(file);
  const txt=await zip.file("stops.txt").async("string");

  GTFS.stops=Papa.parse(txt,{header:true}).data
    .filter(s=>s.stop_lat && s.stop_lon);

  alert("✔ Manual OK");
}

// ================= GPS =================
function startGPS(){
  navigator.geolocation.watchPosition(pos=>{
    const lat=pos.coords.latitude;
    const lon=pos.coords.longitude;
    const t=Date.now();

    userLat=lat; userLon=lon;

    document.getElementById("gps").innerHTML=
      `📍 ${lat.toFixed(5)}, ${lon.toFixed(5)}`;

    history.push({lat,lon,t});
    if(history.length>5) history.shift();

    let speed=0;
    if(history.length>=2){
      let d=0,dt=0;
      for(let i=1;i<history.length;i++){
        const a=history[i-1];
        const b=history[i];
        d+=dist(a.lat,a.lon,b.lat,b.lon);
        dt+=(b.t-a.t)/1000;
      }
      speed=dt>0?d/dt:0;
    }

    document.getElementById("speed").innerHTML=
      `🚀 ${(speed*3.6).toFixed(1)} km/h (${speed.toFixed(2)} m/s)`;

    nearest();
    poi();

  },null,{enableHighAccuracy:true});
}

// ================= DIST =================
function dist(a,b,c,d){
  const R=6371000;
  const x=x=>x*Math.PI/180;
  const dLat=x(c-a);
  const dLon=x(d-b);
  const s=Math.sin(dLat/2)**2+
    Math.cos(x(a))*Math.cos(x(c))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}

// ================= NEAREST =================
function nearest(){
  if(!userLat) return;

  const list=GTFS.stops
    .map(s=>({
      ...s,
      d:dist(userLat,userLon,+s.stop_lat,+s.stop_lon)
    }))
    .filter(s=>s.d<3000)
    .sort((a,b)=>a.d-b.d)
    .slice(0,5);

  document.getElementById("nearest").innerHTML=
    list.map(s=>`🚏 ${s.stop_name}<br>📏 ${Math.round(s.d)} m<br>🆔 ${s.stop_id}<hr>`).join("");
}

// ================= POI =================
async function poi(){
  if(!userLat) return;

  const q=`[out:json];node(around:600,${userLat},${userLon})["amenity"];out;`;

  try{
    const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:q});
    const j=await r.json();

    document.getElementById("poi").innerHTML=
      j.elements.slice(0,8).map(p=>{
        const d=dist(userLat,userLon,p.lat,p.lon);
        return `📍 ${p.tags.name||"POI"}<br>📏 ${Math.round(d)} m<br>📍 ${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}<hr>`;
      }).join("");

  }catch{
    document.getElementById("poi").innerText="POI hiba";
  }
}

// ================= SEARCH =================
function searchStops(){
  const q=document.getElementById("search").value.toLowerCase();
  if(q.length<2) return;

  const res=GTFS.stops
    .map(s=>({
      ...s,
      d:userLat?dist(userLat,userLon,+s.stop_lat,+s.stop_lon):999999
    }))
    .filter(s=>s.stop_name.toLowerCase().includes(q))
    .sort((a,b)=>a.d-b.d)
    .slice(0,20);

  document.getElementById("results").innerHTML=
    res.map(s=>`🚏 ${s.stop_name}<br>🆔 ${s.stop_id}<br>${Math.round(s.d)} m<hr>`).join("");
}
</script>
</body>
</html>
