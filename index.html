<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
ATTILA KÖZLEKEDÉS PRO V2.1 STABIL
</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

body{
margin:0;
background:#050b10;
color:white;
font-family:Arial,Helvetica,sans-serif;
}

.header{

background:
linear-gradient(#064020,#02170c);

padding:15px;
text-align:center;

border-bottom:3px solid #00ff88;

}


h1{

margin:0;
color:#00ff88;
font-size:26px;

}


.subtitle{

color:#ccc;
margin-top:5px;

}


/* ÓRA */

#clock{

font-size:55px;
font-weight:bold;
color:#00ff66;
text-shadow:
0 0 15px #00ff66;

}


#date{

font-size:25px;
color:#ffb300;
font-weight:bold;

}


/* KONTÉNER */

.container{

padding:12px;

}


.card{

background:#13212b;
padding:15px;
margin-bottom:15px;

border-radius:15px;

box-shadow:
0 0 10px black;

}


.card h2{

color:#00d9ff;

}


button{

width:100%;
padding:14px;
margin-top:8px;

font-size:17px;
font-weight:bold;

border:0;
border-radius:12px;

}


.green{

background:#008844;
color:white;

}

.blue{

background:#0066cc;
color:white;

}

.orange{

background:#dd8800;
color:white;

}

.purple{

background:#6611aa;
color:white;

}


#map{

height:500px;

border-radius:15px;

}


.info{

background:#09141c;

padding:12px;

margin-top:8px;

border-radius:10px;

font-size:18px;

}


</style>

</head>


<body>


<div class="header">


<h1>
🚦 ATTILA KÖZLEKEDÉS PRO V2.1
</h1>


<div class="subtitle">

MULTI SERVICE DISPATCHER • OUTDOOR ATLAS

</div>


<div id="clock">
00:00:00
</div>


<div id="date">
Dátum
</div>


</div>




<div class="container">


<div class="card">


<h2>
🏠 FŐMENÜ
</h2>


<button class="green">
🗺 Térképek
</button>


<button class="blue">
🚍 Menetrend
</button>


<button class="orange">
🌦 Időjárás
</button>


<button class="purple">
🌊 Tavak / Víz Atlasz
</button>



</div>





<div class="card">


<h2>
📍 GPS HELYZET
</h2>


<div class="info" id="gps">
Várakozás GPS-re...
</div>


<div class="info" id="address">

Cím keresése...

</div>


</div>





<div class="card">


<h2>
🗺 TÉRKÉP</h2>


<div id="map">

Térkép betöltése...

</div>


</div>



</div>




<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


// ===========================
// ÓRA + DÁTUM
// ===========================


function ora(){


let d=new Date();


let napok=[

"Vasárnap",
"Hétfő",
"Kedd",
"Szerda",
"Csütörtök",
"Péntek",
"Szombat"

];


document.getElementById("clock").innerHTML=
d.toLocaleTimeString("hu-HU");


document.getElementById("date").innerHTML=

d.getFullYear()
+". "
+
(d.getMonth()+1)
+". "
+
d.getDate()
+". "
+
napok[d.getDay()];


}


setInterval(ora,1000);

ora();




// ===========================
// LEAFLET ALAP
// ===========================


let map=L.map("map")
.setView(
[47.5,19.05],
13
);



L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19

}

).addTo(map);



let marker=L.marker(
[47.5,19.05]
)
.addTo(map);



</script>


</body>
</html>
