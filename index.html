<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attila STABLE VOLÁN + MÁV GTFS ENGINE</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body { font-family: Arial; background:#0f172a; color:#fff; padding:20px }
input, button { padding:10px; margin:5px; border-radius:8px; border:none }
button { background:#22c55e; color:#fff; font-weight:bold; cursor:pointer }
.card { background:#1e293b; padding:12px; border-radius:10px; margin-top:10px }
.small { opacity:0.8; font-size:12px }
</style>
</head>
<body>

<h1>🚍 STABLE VOLÁN + MÁV GTFS ENGINE</h1>
<h3>Debug + Menetrend FIX verzió</h3>

<input id="q" placeholder="Megálló / állomás / ID">
<button onclick="searchStops()">KERESÉS</button>
<button onclick="loadGTFS()">GTFS BETÖLTÉS (STABLE)</button>

<div id="results"></div>

<script>

let STOPS=[];
let ROUTES=[];
let TRIPS=[];
let STOP_TIMES=[];

// ===== DIST =====
function dist(a,b,c,d){
  const R=6371000;
  const toRad=x=>x*Math.PI/180;
  let dLat=toRad(c-a);
  let dLon=toRad(d-b);
  let A=Math.sin(dLat/2)**2+
    Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(A),Math.sqrt(1-A));
}

// ===== GPS =====
function getLoc(cb){
  navigator.geolocation.getCurrentPosition(p=>cb(p.coords.latitude,p.coords.longitude));
}

// ===== STABLE GTFS LOADER =====
async function loadGTFS(){

  let url="https://gtfs.menetbrand.com/download/volanbusz";

  try{
    let res=await fetch(url);

    console.log("HTTP:",res.status);

    let blob=await res.blob();

    console.log("SIZE:",blob.size);

    let zip=await JSZip.loadAsync(blob);

    async function read(name){
      let f=zip.file(name);
      if(!f) return null;
      return await f.async("string");
    }

    let stopsTxt=await read("stops.txt");
    let routesTxt=await read("routes.txt");
    let tripsTxt=await read("trips.txt");
    let timesTxt=await read("stop_times.txt");

    if(!stopsTxt){
      alert("❌ nincs stops.txt");
      return;
    }

    console.log("STOPS RAW:",stopsTxt.slice(0,200));

    let stopsParsed=Papa.parse(stopsTxt,{header:true,skipEmptyLines:true});

    STOPS=stopsParsed.data
      .filter(s=>s.stop_id && s.stop_name)
      .map(s=>({
        id:s.stop_id,
        name:s.stop_name,
        lat:parseFloat(s.stop_lat),
        lon:parseFloat(s.stop_lon)
      }));

    ROUTES=routesTxt?Papa.parse(routesTxt,{header:true,skipEmptyLines:true}).data:[];
    TRIPS=tripsTxt?Papa.parse(tripsTxt,{header:true,skipEmptyLines:true}).data:[];
    STOP_TIMES=timesTxt?Papa.parse(timesTxt,{header:true,skipEmptyLines:true}).data:[];

    console.log("STOPS:",STOPS.length);
    console.log("ROUTES:",ROUTES.length);
    console.log("TRIPS:",TRIPS.length);
    console.log("STOP_TIMES:",STOP_TIMES.length);

    alert("GTFS BETÖLTVE:\nStops: "+STOPS.length);

  }catch(e){
    console.error("GTFS ERROR:",e);
    alert("❌ GTFS betöltési hiba (URL / ZIP / CORS)");
  }
}

// ===== ROUTES =====
function getRoutes(stopId){
  let trips=STOP_TIMES.filter(x=>x.stop_id==stopId).map(x=>x.trip_id);
  let routes=[];

  trips.forEach(t=>{
    let tr=TRIPS.find(x=>x.trip_id==t);
    if(tr) routes.push(tr.route_id);
  });

  return [...new Set(routes)];
}

// ===== NEXT DEPARTURES (basic fix) =====
function getDepartures(stopId){

  let times=STOP_TIMES
    .filter(x=>x.stop_id==stopId)
    .map(x=>x.departure_time || x.arrival_time)
    .filter(Boolean);

  return times.slice(0,10);
}

// ===== SEARCH =====
function searchStops(){

  let q=document.getElementById('q').value.toLowerCase();

  let res=STOPS.filter(s=>
    (s.name&&s.name.toLowerCase().includes(q))||
    (s.id&&s.id.toLowerCase().includes(q))
  );

  if(res.length==0){
    document.getElementById('results').innerHTML="❌ nincs találat / nincs betöltött GTFS";
    return;
  }

  getLoc((lat,lon)=>{

    res.sort((a,b)=>dist(lat,lon,a.lat,a.lon)-dist(lat,lon,b.lat,b.lon));

    let html="";

    res.forEach(s=>{

      let d=dist(lat,lon,s.lat,s.lon);
      let r=getRoutes(s.id);
      let dep=getDepartures(s.id);

      html+=`<div class='card'>
        <b>${s.name}</b><br>
        🆔 ${s.id}<br>
        📍 ${s.lat?.toFixed(6)}, ${s.lon?.toFixed(6)}<br>
        📏 ${(d/1000).toFixed(2)} km<br>
        🚌 Vonalak: ${r.join(", ")||"nincs"}<br>
        🕒 Indulások: ${dep.join(" | ")||"nincs adat"}
      </div>`;

    });

    document.getElementById('results').innerHTML=html;

  });
}

</script>

</body>
</html>
