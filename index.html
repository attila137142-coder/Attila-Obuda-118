<script>

function oraFrissites(){


let most=new Date();



let napok=[

"vasárnap",
"hétfő",
"kedd",
"szerda",
"csütörtök",
"péntek",
"szombat"

];



document.getElementById("clock").innerHTML=

most.toLocaleTimeString(
"hu-HU"
);



document.getElementById("date").innerHTML=

most.getFullYear()
+
". "
+
String(
most.getMonth()+1
).padStart(2,"0")
+
". "
+
String(
most.getDate()
).padStart(2,"0")
+
" "
+
napok[
most.getDay()
];



}



setInterval(
oraFrissites,
1000
);


oraFrissites();
