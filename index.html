<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>V3 GTFS-RT MERGE ENGINE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; display:flex; height:100vh; font-family:Arial; }
#sidebar { width:380px; padding:10px; overflow:auto; border-right:1px solid #ccc; }
#map { flex:1; }
.stop { padding:6px; border-bottom:1px solid #eee; cursor:pointer; }
.stop:hover { background:#f2f2f2; }
button { width:100%; padding:8px; margin-top:6px; }
</style>
</head>

<body>

<div id="sidebar">
<h3>🚆 V3 GTFS-RT MERGE</h3>
<button onclick="initSystem()">🔄 LOAD SYSTEM</button>
<div id="list"></div>
</div>

<div id="map"></div>

<script>

const map = L.map('map').setView([47.5,19.05],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// ================= UNIFIED STOPS =================
const STOPS = [
  {id:"F00457", type:"bkk", name:"Nád utca", lat:47.594072, lon:19.048469},
  {id:"779053-1", type:"volan", name:"Tahitótfalu hídfő", lat:47.751712, lon:19.078215},
  {id:"005546862", type:"mav", name:"Szépjuhászné", lat:47.5287, lon:18.9683},
  {id:"778840", type:"volan", name:"Skanzen", lat:47.691135, lon:19.046955}
];

// ================= GTFS STATIC =================
let STOP_TIMES = [];
let TRIPS = {};

// ================= REALTIME LAYER =================
let RT_VEHICLES = {};
let SIM_VEHICLES = [];

// ================= TIME CORE =================
function timeToSec(t){
  const p = t.split(":");
  return (+p[0])*3600 + (+p[1])*60 + (+p[2]);
}

function nowSec(){
  const n = new Date();
  return n.getHours()*3600 + n.getMinutes()*60 + n.getSeconds();
}

// ================= LOAD GTFS (SIMPLIFIED MOCK) =================
function loadGTFS(){

  STOP_TIMES = [
    {trip:"T1", stop:"F00457", time:"08:00:00"},
    {trip:"T1", stop:"779053-1", time:"08:25:00"},
    {trip:"T1", stop:"005546862", time:"08:50:00"}
  ];

  TRIPS = {
    "T1": {route:"BKK-150", head:"Vác felé"}
  };
}

// ================= GTFS-RT FETCH =================
async function loadRT(){

  try {

    // 🔥 ide jöhet valódi RT endpoint
    const res = await fetch("https://example.com/gtfs-rt");

    const data = await res.json();

    RT_VEHICLES = data;

  } catch(e){

    console.log("⚠ RT nincs → SIM fallback");
    buildSimVehicles();
  }
}

// ================= SIM FALLBACK =================
function buildSimVehicles(){

  SIM_VEHICLES = [];

  STOP_TIMES.forEach(t=>{

    const stop = STOPS.find(s=>s.id === t.stop);
    if(!stop) return;

    SIM_VEHICLES.push({
      trip: t.trip,
      stop: t.stop,
      lat: stop.lat,
      lon: stop.lon,
      speed: 20 + Math.random()*40,
      delay: (Math.random()*300)|0
    });

  });
}

// ================= LIVE ENGINE =================
function renderVehicles(){

  const now = Date.now();

  SIM_VEHICLES.forEach(v=>{

    const drift = (Math.sin(now/8000)+1)*0.0007;

    v.lat += (Math.random()-0.5)*drift;
    v.lon += (Math.random()-0.5)*drift;

    const delayMin = Math.round(v.delay/60);

    let color = "green";
    if(delayMin > 2) color = "red";
    if(delayMin < -1) color = "blue";

    L.circleMarker([v.lat,v.lon],{
      radius:6,
      color
    }).addTo(map)
    .bindPopup(`
      🚌 ${v.trip}<br>
      🚏 ${v.stop}<br>
      ⚡ ${v.speed.toFixed(0)} km/h<br>
      ⏱ ${delayMin} perc
    `);
  });
}

// ================= STOP PANEL =================
function openStop(stop){

  const deps = STOP_TIMES.filter(t=>t.stop===stop.id);

  let html = `
    <b>🚏 ${stop.name}</b><br>
    🆔 ${stop.id}<br>
    🌍 ${stop.type}<br><br>

    <b>🚌 Indulások:</b><br><br>
  `;

  deps.forEach(d=>{

    const trip = TRIPS[d.trip];
    const vehicle = SIM_VEHICLES.find(v=>v.stop===stop.id);

    html += `
      🚍 ${trip?.route || "?"}<br>
      ➜ ${trip?.head || ""}<br>
      ⏱ ${d.time}<br>
      ${vehicle ? "🟢 LIVE VEHICLE" : "⚪ no vehicle"}<br><br>
    `;
  });

  L.popup()
    .setLatLng([stop.lat,stop.lon])
    .setContent(html)
    .openOn(map);
}

// ================= UI =================
function renderStops(){

  const list = document.getElementById("list");
  list.innerHTML = "";

  STOPS.forEach(s=>{

    const div = document.createElement("div");
    div.className="stop";
    div.innerHTML = `<b>${s.name}</b><br>${s.type}`;

    div.onclick = ()=>openStop(s);

    list.appendChild(div);
  });
}

// ================= MAIN INIT =================
async function initSystem(){

  loadGTFS();
  await loadRT();
  renderStops();

  setInterval(()=>{

    map.eachLayer(l=>{
      if(l instanceof L.CircleMarker) map.removeLayer(l);
    });

    renderVehicles();

  }, 2000);

}

</script>

</body>
</html>
