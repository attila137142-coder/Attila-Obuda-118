<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attila Discount Engine</title>
<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px }
input, button, select { padding:10px; margin:5px; border-radius:8px; border:none }
button { cursor:pointer; background:#00c853; color:white; font-weight:bold }
.card { background:#1e1e1e; padding:15px; border-radius:12px; margin-top:15px }
.best { border:2px solid #00e676 }
</style>
</head>
<body>

<h1>🔥 Attila Discount Engine</h1>

<p>Add meg az árakat (Ft, vesszővel):</p>
<input id="prices" placeholder="pl: 1000, 2000, 1500">

<br>
<button onclick="calculate()">SZÁMOLÁS</button>

<div id="results"></div>

<script>
function parsePrices() {
  return document.getElementById('prices').value
    .split(',')
    .map(x => parseFloat(x.trim()))
    .filter(x => !isNaN(x))
    .sort((a,b)=>a-b);
}

function sum(arr) {
  return arr.reduce((a,b)=>a+b,0);
}

function dealA(prices) {
  let freeCount = Math.floor(prices.length / 3);
  let freeItems = prices.slice(0, freeCount);
  return sum(prices) - sum(freeItems);
}

function dealB(prices) {
  return sum(prices) * 0.8;
}

function dealC(prices) {
  let discountedCount = Math.floor(prices.length / 2);
  let discountedItems = prices.slice(0, discountedCount);
  return sum(prices) - sum(discountedItems) * 0.33;
}

function calculate() {
  let prices = parsePrices();
  if(prices.length === 0) return;

  let A = dealA(prices);
  let B = dealB(prices);
  let C = dealC(prices);

  let min = Math.min(A,B,C);

  document.getElementById('results').innerHTML = `
    <div class="card ${A===min?'best':''}">🅰️ 3. ingyen: ${A.toFixed(0)} Ft</div>
    <div class="card ${B===min?'best':''}">🅱️ -20%: ${B.toFixed(0)} Ft</div>
    <div class="card ${C===min?'best':''}">🅲 2. -33%: ${C.toFixed(0)} Ft</div>
    <h2>🏆 Legjobb: ${
      A===min?'A (3. ingyen)':
      B===min?'B (-20%)':'C (2. -33%)'
    }</h2>
  `;
}
</script>

</body>
</html>
