<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Atlasz V10 – Shelter Network</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }
#map { height:85vh; }

.panel { padding:10px; background:#eee; }
</style>
</head>

<body>

<div class="panel">
🏕️ Menedék hálózat
<div id="info">V10 ready</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([47.95,18.90],12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OSM'
}).addTo(map);

/////////////////////////////////////////////////////
// 📍 USER
/////////////////////////////////////////////////////

const user={lat:47.93,lon:18.88};

L.marker([user.lat,user.lon]).addTo(map)
  .bindPopup("📍 Te itt vagy");

/////////////////////////////////////////////////////
// 🏕️ SHELTERS (mock + OSM logika alap)
/////////////////////////////////////////////////////

const shelters=[
  {name:"Menedékház A",lat:47.96,lon:18.92,type:"house"},
  {name:"Esőbeálló",lat:47.94,lon:18.90,type:"shelter"},
  {name:"Pihenő",lat:47.92,lon:18.89,type:"bench"},
  {name:"Kilátó",lat:47.95,lon:18.86,type:"view"}
];

/////////////////////////////////////////////////////
// 📏 DISTANCE
/////////////////////////////////////////////////////

function dist(a,b,c,d){

  const R=6371;
  const dLat=(c-a)*Math.PI/180;
  const dLon=(d-b)*Math.PI/180;

  const x=Math.sin(dLat/2)**2 +
    Math.cos(a*Math.PI/180) *
    Math.cos(c*Math.PI/180) *
    Math.sin(dLon/2)**2;

  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

/////////////////////////////////////////////////////
// 🧭 FIND NEAREST SHELTER
/////////////////////////////////////////////////////

let best=null;
let bestD=999;

shelters.forEach(s=>{

  const d=dist(user.lat,user.lon,s.lat,s.lon);

  if(d<bestD){
    bestD=d;
    best=s;
  }

  L.marker([s.lat,s.lon]).addTo(map)
    .bindPopup(`${s.name}`);
});

/////////////////////////////////////////////////////
// ⏱️ TIME ESTIMATE
/////////////////////////////////////////////////////

const hours = bestD / 4;

document.getElementById("info").innerHTML=
`
🏕️ Legközelebbi: ${best.name}<br>
📏 Távolság: ${(bestD*1000).toFixed(0)} m / ${bestD.toFixed(2)} km<br>
⏱️ Idő: ~${hours.toFixed(2)} óra gyalog<br>
`;

</script>

</body>
</html>
