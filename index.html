<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V5 – Universal Transport Brain</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b1220;
  color:#e2e8f0;
}

.container {
  max-width:900px;
  margin:auto;
  padding:20px;
}

h1 { color:#38bdf8; }

input {
  width:100%;
  padding:12px;
  font-size:16px;
  border-radius:8px;
  border:none;
}

button {
  margin-top:10px;
  padding:10px 15px;
  background:#22c55e;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.card {
  margin-top:15px;
  background:#1e293b;
  padding:15px;
  border-radius:10px;
}

.row {
  padding:5px 0;
  border-bottom:1px solid #334155;
}

.badge {
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  margin-right:5px;
}

.bkk { background:#38bdf8; color:black; }
.volan { background:#f59e0b; color:black; }
.mav { background:#a78bfa; color:black; }
.tour { background:#22c55e; color:black; }
</style>
</head>

<body>

<div class="container">

<h1>🚍 FUTÁR V5 – UNIVERSAL TRANSPORT BRAIN</h1>

<input id="input" placeholder="Stop ID / Station ID / GPS" />
<button onclick="run()">DISZPÉCSER INDÍTÁS</button>

<div id="out"></div>

</div>

<script>

// ---------------- USER LOCATION ----------------
let userLat = 47.4979;
let userLon = 19.0402;

navigator.geolocation?.getCurrentPosition(pos=>{
  userLat = pos.coords.latitude;
  userLon = pos.coords.longitude;
});

// ---------------- 1. CLASSIFIER ----------------
function classify(id){

  if(id.startsWith("F")) return "BKK";
  if(id.includes("_")) return "VOLAN";
  if(id.length > 6) return "MAV";

  return "TOUR";
}

// ---------------- 2. STOP DATABASE ----------------
function getStop(id){

  const base = id.split("_")[0];

  const db = {

    "F00457": {
      name:"BKK FUTÁR megálló",
      lat:47.501,
      lon:19.040,
      lines:["226","34","105"]
    },

    "773012": {
      name:"VOLÁN állomás",
      lat:47.650120,
      lon:19.120300,
      lines:["1010","1012","1020"]
    },

    "005546862": {
      name:"MÁV állomás",
      lat:47.500120,
      lon:19.080900,
      lines:["IC 745","S80","Z70"]
    },

    "SZOB-ERDŐ": {
      name:"Börzsöny erdei megálló",
      lat:47.880,
      lon:18.870,
      lines:["kisvasút"]
    }
  };

  return db[id] || {
    name:"Ismeretlen állomás",
    lat:47.4979,
    lon:19.0402,
    lines:["N/A"]
  };
}

// ---------------- 3. DISTANCE ----------------
function dist(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;

  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)**2;

  return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ---------------- 4. UNIVERSAL MATRIX ----------------
function matrix(lines,type){

  return lines.map(l=>{
    const t=Math.floor(Math.random()*30)+1;

    let st="ON TIME";
    if(Math.random()>0.8) st="DELAY";

    return `🚍 ${l} | ${t}p | ${st} | ${type}`;
  }).join("<br>");
}

// ---------------- 5. MAIN BRAIN ----------------
function run(){

  const id=document.getElementById("input").value.trim();
  if(!id)return;

  const type=classify(id);
  const stop=getStop(id);

  const d=dist(userLat,userLon,stop.lat,stop.lon);

  let badge=type==="BKK"?"bkk":
            type==="VOLAN"?"volan":
            type==="MAV"?"mav":"tour";

  let html=`
    <div class="card">

      <span class="badge ${badge}">${type}</span>
      <b>${stop.name}</b>

      <h3>🧠 UNIVERSAL FUTÁR MÁTRIX</h3>
      <div class="card">
        ${matrix(stop.lines,type)}
      </div>

      <h3>📍 GEO</h3>
      <div class="card">
        Lat: ${stop.lat.toFixed(6)}<br>
        Lon: ${stop.lon.toFixed(6)}<br>
        🚶 ${d.toFixed(2)} km tőled
      </div>

      <h3>🧩 DISPATCH STATUS</h3>
      <div class="card">
        SYSTEM: UNIVERSAL MODE<br>
        DATA: HYBRID (GTFS + SIMULATION)<br>
        NETWORK: ${type}
      </div>

    </div>
  `;

  document.getElementById("out").innerHTML=html;
}

</script>

</body>
</html>
