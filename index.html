<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V13 DISPATCHER CORE - SHAPE ENGINE</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin:0; font-family:Arial; display:flex; height:100vh; }
    #map { flex:2; }
    #panel { flex:1; background:#111; color:#fff; display:flex; flex-direction:column; }
    #header { padding:10px; background:#1c1c1c; font-weight:bold; }
    #stops, #departures { flex:1; overflow:auto; padding:10px; border-top:1px solid #333; }
    .stop, .dep { padding:6px; margin:4px 0; background:#222; cursor:pointer; border-radius:4px; }
    .stop:hover, .dep:hover { background:#333; }
    input, button { margin:6px; padding:6px; }
    .small { font-size:12px; opacity:.7; }
  </style>
</head>
<body>

<div id="map"></div>

<div id="panel">
  <div id="header">🚦 V13 TRUE SHAPE-BASED ENGINE</div>

  <input type="file" id="zipInput" />
  <input id="search" placeholder="Search stop..." />
  <button onclick="startSimulation()">Start LIVE VEHICLES</button>

  <div id="stops"></div>
  <div id="departures"></div>
</div>

<script>
const map = L.map('map').setView([47.4979,19.0402],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let stops=[], stopTimes=[], trips=[], routes=[], shapes=[];

let shapeMap = {}; // shape_id -> [{lat,lon,seq}]
let markersLayer=L.layerGroup().addTo(map);
let vehiclesLayer=L.layerGroup().addTo(map);

// ---------------- GTFS ZIP LOAD ----------------
document.getElementById('zipInput').addEventListener('change', async (e)=>{
  const file=e.target.files[0];
  const zip=await JSZip.loadAsync(file);

  const readCSV=async (name)=>{
    const f=zip.file(name);
    if(!f) return [];
    const txt=await f.async('string');
    return Papa.parse(txt,{header:true}).data;
  };

  stops=await readCSV('stops.txt');
  stopTimes=await readCSV('stop_times.txt');
  trips=await readCSV('trips.txt');
  routes=await readCSV('routes.txt');
  shapes=await readCSV('shapes.txt');

  buildShapeMap();
  renderStops(stops);
});

// ---------------- SHAPE ENGINE ----------------
function buildShapeMap(){
  shapeMap = {};

  shapes.forEach(s=>{
    if(!s.shape_id) return;

    if(!shapeMap[s.shape_id]) shapeMap[s.shape_id]=[];

    shapeMap[s.shape_id].push({
      lat: parseFloat(s.shape_pt_lat),
      lon: parseFloat(s.shape_pt_lon),
      seq: parseInt(s.shape_pt_sequence)
    });
  });

  // sort points
  Object.keys(shapeMap).forEach(id=>{
    shapeMap[id].sort((a,b)=>a.seq-b.seq);
  });
}

// ---------------- STOP RENDER ----------------
function renderStops(list){
  const c=document.getElementById('stops');
  c.innerHTML='';
  markersLayer.clearLayers();

  list.forEach(s=>{
    if(!s.stop_lat) return;

    const div=document.createElement('div');
    div.className='stop';
    div.innerText=s.stop_name;
    div.onclick=()=>selectStop(s);
    c.appendChild(div);

    L.marker([s.stop_lat,s.stop_lon]).addTo(markersLayer).bindPopup(s.stop_name);
  });
}

// ---------------- STOP SELECT ----------------
function selectStop(stop){
  map.setView([stop.stop_lat,stop.stop_lon],15);

  const deps=stopTimes
    .filter(t=>t.stop_id===stop.stop_id)
    .slice(0,20)
    .map(t=>{
      const trip=trips.find(x=>x.trip_id===t.trip_id)||{};
      const route=routes.find(r=>r.route_id===trip.route_id)||{};

      return {
        route:route.route_short_name||'?',
        headsign:trip.trip_headsign||'?',
        time:t.departure_time
      };
    });

  const c=document.getElementById('departures');
  c.innerHTML=`<h3>${stop.stop_name}</h3>`;

  deps.forEach(d=>{
    const div=document.createElement('div');
    div.className='dep';
    div.innerHTML=`<b>${d.route}</b> → ${d.headsign}<br>⏱ ${d.time}`;
    c.appendChild(div);
  });
}

// ---------------- SEARCH ----------------
document.getElementById('search').addEventListener('input',e=>{
  const v=e.target.value.toLowerCase();
  renderStops(stops.filter(s=>(s.stop_name||'').toLowerCase().includes(v)));
});

// ---------------- SHAPE MOVEMENT ENGINE ----------------
function interpolate(path, t){
  const idx = Math.floor(t);
  const next = idx+1;
  if(!path[idx] || !path[next]) return path[path.length-1];

  const a = path[idx];
  const b = path[next];

  const f = t - idx;

  return [
    a.lat + (b.lat-a.lat)*f,
    a.lon + (b.lon-a.lon)*f
  ];
}

// ---------------- LIVE VEHICLES ----------------
function startSimulation(){
  vehiclesLayer.clearLayers();

  const sampleTrips = trips.slice(0,10);

  sampleTrips.forEach((t,i)=>{
    const shapeId = t.shape_id;
    const path = shapeMap[shapeId];
    if(!path || path.length<2) return;

    const marker = L.circleMarker([path[0].lat,path[0].lon],{radius:6})
      .addTo(vehiclesLayer);

    let pos = 0;

    setInterval(()=>{
      pos += 0.3;
      if(pos >= path.length-1) pos = 0;

      const p = interpolate(path,pos);
      marker.setLatLng(p);
    }, 800 + i*120);
  });
}
</script>

</body>
</html>
