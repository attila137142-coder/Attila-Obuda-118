// ======================================
// LÉGVONALI TÁVOLSÁG MOTOR
// ======================================


function tavolsagSzamitas(lat1,lon1,lat2,lon2){


const R=6371;


const dLat=
(lat2-lat1)*Math.PI/180;


const dLon=
(lon2-lon1)*Math.PI/180;


const a=
Math.sin(dLat/2)*
Math.sin(dLat/2)+

Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*
Math.sin(dLon/2);



const km=
R*
2*
Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);


return {

km:km.toFixed(2),

meter:
Math.round(km*1000)

};


}

if(ertek>0){

return `

🔵 +${ertek} perc KÉSÉS
</span>
`;

}



return `

🟢 0 perc PONTOS
</span>

`;

}

const GPS_Core={

longitude:0,

};

if(

function(poz){

GPS_Core.latitude=
poz.coords.latitude;


GPS_Core.longitude=
poz.coords.longitude;


GPS_Core.pontossag=
poz.coords.accuracy;



console.log(
"GPS AKTÍV",
GPS_Core
);



},


function(hiba){


console.log(
"GPS hiba:",
hiba.message
);


}


);


}


}

function GTFS_MegalloKereses(szoveg){


let keresett=
szoveg.toLowerCase();



return GTFS_StopDatabase.filter(s=>{


return (

s.nev
.toLowerCase()
.includes(keresett)

||

s.id
.includes(keresett)

);


});


}




// ======================================
// LEGKÖZELEBBI MEGÁLLÓ
// ======================================


function LegkozelebbiMegallo(lat,lon){


let legjobb=null;

let tav=999;



GTFS_StopDatabase.forEach(s=>{


let d=
tavolsagSzamitas(
lat,
lon,
s.lat,
s.lon
);



if(d.km<tav){

tav=d.km;

legjobb={

...s,

tavolsag:d

};

}


});



return legjobb;


}




// ======================================
// GTFS JÁRMŰ KAPCSOLÁS
// ======================================


function JarmuMegalloParositas(jarmu){


let megallo=
LegkozelebbiMegallo(

jarmu.jarmuLat,

jarmu.jarmuLon

);



return {

...jarmu,

kozeliMegallo:megallo


};
