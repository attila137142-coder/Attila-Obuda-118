<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V5 MINI</title>

<style>
body{
margin:0;
font-family:Arial;
background:#05070d;
color:#00ffcc;
}

header{
padding:15px;
text-align:center;
background:#0b1220;
border-bottom:2px solid #00ffcc;
font-weight:bold;
}

.container{
display:flex;
gap:10px;
padding:10px;
}

.panel{
flex:1;
background:#0b1220;
border:1px solid #00ffcc;
border-radius:6px;
padding:10px;
min-height:300px;
}

input{
width:100%;
padding:10px;
background:#05070d;
border:1px solid #00ffcc;
color:#00ffcc;
}

button{
width:100%;
padding:10px;
margin-top:5px;
background:#00ffcc;
border:none;
font-weight:bold;
cursor:pointer;
}

table{
width:100%;
margin-top:10px;
border-collapse:collapse;
}

td,th{
border-bottom:1px solid #00ffcc33;
padding:6px;
font-size:13px;
text-align:left;
}
</style>
</head>

<body>

<header>
🚍 FUTÁR V5 MINI – STABIL MODE
</header>

<div class="container">

<!-- KERESŐ -->
<div class="panel">
<h3>🚏 Megálló kereső</h3>

<input id="stop" placeholder="pl. Deák tér">
<button onclick="search()">KERESÉS</button>

<div id="result" style="margin-top:10px;"></div>
</div>

<!-- TÁBLA -->
<div class="panel">
<h3>🛰 Indulások</h3>

<table>
<tr><th>Járat</th><th>Irány</th><th>Idő</th></tr>

<tr><td>7E</td><td>Blaha</td><td>+2</td></tr>
<tr><td>9</td><td>Óbuda</td><td>+4</td></tr>
<tr><td>47</td><td>Deák</td><td>+1</td></tr>
<tr><td>M2</td><td>Déli</td><td>+6</td></tr>
<tr><td>M4</td><td>Kelenföld</td><td>+3</td></tr>
</table>

</div>

</div>

<script>
function search(){
let v = document.getElementById("stop").value;

if(!v){
document.getElementById("result").innerHTML = "❌ írj be egy megállót";
return;
}

document.getElementById("result").innerHTML =
"🚏 Találat: <b>" + v + "</b><br>🟢 rendszer OK";
}
</script>

</body>
</html>
