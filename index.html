<script>

/* 📦 GTFS STOP DATABASE (mini Budapest slice) */
const GTFS_STOPS = [
  {id:"BKK_001", name:"Nád utca", lat:47.4979, lon:19.0632},
  {id:"BKK_002", name:"Batthyány tér", lat:47.5067, lon:19.0399},
  {id:"BKK_003", name:"Árpád híd", lat:47.5375, lon:19.0550},
  {id:"BKK_004", name:"Bécsi út / Vörösvári út", lat:47.5412, lon:19.0281},
  {id:"BKK_005", name:"Kálvin tér", lat:47.4891, lon:19.0614},
  {id:"BKK_006", name:"Deák Ferenc tér", lat:47.4973, lon:19.0540},
  {id:"BKK_007", name:"Blaha Lujza tér", lat:47.4970, lon:19.0706}
];

/* 🔎 GTFS SEARCH ENGINE */
function searchGTFSStops(query) {

  const q = query.toLowerCase();

  return GTFS_STOPS.filter(s =>
    s.name.toLowerCase().includes(q) ||
    s.id.toLowerCase().includes(q)
  );
}

/* 🚏 SELECT STOP */
function getStopById(id) {
  return GTFS_STOPS.find(s => s.id === id);
}

</script>
