<!DOCTYPE html><html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FUTÁR V3 PRO OPS CORE</title><link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/><style>body{margin:0;font-family:Arial;background:#070b12;color:#e6f1ff;overflow:hidden;}header{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#0f1726;border-bottom:1px solid #1f2a3a;}.container{display:grid;grid-template-columns:330px 1fr 330px;height:calc(100vh - 50px);}.panel{background:#0c1320;padding:10px;overflow:auto;}#map{height:100%;width:100%;}.card{background:#121c2e;padding:10px;margin-bottom:10px;border-radius:10px;font-size:12px;}.big{font-size:18px;font-weight:bold;margin-bottom:8px;}.small{font-size:11px;opacity:0.7;}.row{display:grid;grid-template-columns:90px 70px 90px 90px 70px;padding:6px;border-bottom:1px solid #1f2a3a;font-size:12px;}.ok{color:#2ecc71;}.warn{color:#ffcc00;}.bad{color:#ff4d4d;}button,input{width:100%;padding:10px;margin:5px 0;border:none;border-radius:6px;}button{background:#1f6feb;color:white;cursor:pointer;}button:hover{background:#388bfd;}.leaflet-popup-content{font-size:12px;}</style></head><body><header><div>🚇 FUTÁR V3 PRO OPS CORE</div><div id="clock"></div></header><div class="container"><!-- LEFT --><div class="panel"><div class="card"><div class="big">GTFS IMPORT</div><input type="file" id="gtfsFile"><button onclick="loadGTFS()">📦 GTFS LOAD</button></div><div class="card"><div class="big">INCIDENT SYSTEM</div><button onclick="toggleIncident()">🚨 HÉV INCIDENT</button><div id="incidentState"></div></div><div class="card"><div class="big">DISPATCH BRAIN</div><div id="brain"></div></div><div class="card"><div class="big">OPS STATUS</div><div id="ops"></div></div></div><!-- MAP --><div id="map"></div><!-- RIGHT --><div class="panel"><div class="card"><div class="big">LIVE VEHICLES</div><div id="vehicles"></div></div><div class="card"><div class="big">CRITICAL LINES</div><div id="critical"></div></div></div></div><script src="https://unpkg.com/leaflet/dist/leaflet.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script><script>// ================= CLOCK =================setInterval(()=>{document.getElementById("clock").innerText =new Date().toLocaleTimeString();},1000);// ================= MAP =================const map = L.map("map").setView([47.4979,19.0402],12);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);// ================= STATE =================const STATE = {vehicles:[],routes:{},stops:{},markers:{},incident:false};// ================= DISTANCE =================function distance(a,b){const R=6371000;const dLat=(b.lat-a.lat)*Math.PI/180;const dLon=(b.lng-a.lng)*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}// ================= STOPS =================function parseStops(data){let stops={};data.forEach(s=>{if(s.stop_lat){stops[s.stop_id]={id:s.stop_id,name:s.stop_name,lat:+s.stop_lat,lng:+s.stop_lon};}});return stops;}// ================= ROUTES =================function buildRoutes(stopTimes,stops){let routes={};stopTimes.sort((a,b)=>+a.stop_sequence - +b.stop_sequence);stopTimes.forEach(st=>{if(!routes[st.trip_id])routes[st.trip_id]=[];let s=stops[st.stop_id];if(s) routes[st.trip_id].push(s);});return routes;}// ================= VEHICLES =================function initVehicles(trips){STATE.vehicles = trips.slice(0,14).map((t,i)=>({id:t.trip_id,route:STATE.routes[t.trip_id] || [],i:0,p:Math.random(),speed:0.008 + Math.random()*0.008,delay:Math.round((Math.random()-0.4)*80),type:["BUS","HÉV","TRAM"][i%3],line:"LINE-"+(i%5)}));}// ================= INCIDENT =================function toggleIncident(){STATE.incident=!STATE.incident;document.getElementById("incidentState").innerHTML =STATE.incident? "<span class='bad'>HÉV INCIDENT ACTIVE</span>": "<span class='ok'>NETWORK NORMAL</span>";}// ================= ETA =================function eta(v,a,b){let d = distance(a,b);let speedMs = (v.speed * 5000);let sec = d / speedMs;sec += Math.max(v.delay,0);return Math.round(sec);}// ================= MOVE =================function move(){STATE.vehicles.forEach(v=>{if(!v.route || v.route.length<2)return;let a=v.route[v.i];let b=v.route[v.i+1];if(!a || !b) return;// INCIDENT EFFECTlet speedFactor = STATE.incident ? 0.45 : 1;v.p += v.speed * speedFactor;// delay propagationif(STATE.incident){v.delay += 0.4;}else{v.delay *= 0.98;}if(v.p>=1){v.p=0;v.i=(v.i+1)%(v.route.length-1);}let lat=a.lat+(b.lat-a.lat)*v.p;let lng=a.lng+(b.lng-a.lng)*v.p;v.lat=lat;v.lng=lng;v.nextStop=b.name;v.eta=eta(v,a,b);// MARKERlet popup=`<b>${v.line}</b><br>${v.type}<br>ETA: ${v.eta}s<br>Delay: ${Math.round(v.delay)}s<br>Next: ${v.nextStop}`;if(!STATE.markers[v.id]){STATE.markers[v.id]=L.marker([lat,lng]).addTo(map).bindPopup(popup);}else{STATE.markers[v.id].setLatLng([lat,lng]).setPopupContent(popup);}});}// ================= BRAIN =================function brain(){let critical=[];STATE.vehicles.forEach(v=>{if(v.delay>50)critical.push(v.line);});critical=[...new Set(critical)];return critical;}// ================= RENDER =================function render(){// OPSdocument.getElementById("ops").innerHTML =`Vehicles: ${STATE.vehicles.length}<br>Incident: ${STATE.incident ? "YES":"NO"}`;// BRAINlet crit=brain();document.getElementById("brain").innerHTML =crit.length? "<span class='bad'>Critical lines detected</span>": "<span class='ok'>Network stable</span>";// CRITICALdocument.getElementById("critical").innerHTML =crit.length? crit.join("<br>"): "No critical lines";// VEHICLESlet html="";STATE.vehicles.forEach(v=>{let cls =v.delay>50? "bad": v.delay<-10? "warn": "ok";html+=`<div class="row"><div>${v.line}</div><div>${v.type}</div><div class="${cls}">${Math.round(v.delay)}s</div><div>${v.eta || 0}s</div><div>${v.i}</div></div><div class="small">→ ${v.nextStop || "-"}</div>`;});document.getElementById("vehicles").innerHTML=html;}// ================= LOAD =================async function loadGTFS(){const file =document.getElementById("gtfsFile").files[0];if(!file) return;const zip = await JSZip.loadAsync(file);const read = async f =>Papa.parse(await zip.file(f).async("string"),{header:true}).data;const stops =await read("stops.txt");const trips =await read("trips.txt");const stopTimes =await read("stop_times.txt");STATE.stops=parseStops(stops);STATE.routes=buildRoutes(stopTimes,STATE.stops);initVehicles(trips);render();}// ================= LOOP =================setInterval(()=>{if(STATE.vehicles.length){move();render();}},1200);</script></body></html>
