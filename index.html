<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>V12.3 CONTROL ROOM</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

header{
    background:#111827;
    padding:10px;
    text-align:center;
    color:#38bdf8;
    font-weight:bold;
}

.container{
    display:flex;
    height:100vh;
}

.left{
    width:35%;
    display:flex;
    flex-direction:column;
    border-right:1px solid #1f2937;
}

.panel{
    padding:10px;
    border-bottom:1px solid #1f2937;
}

input,button{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:none;
    border-radius:8px;
}

input{
    background:#1f2937;
    color:white;
}

button{
    background:#38bdf8;
    font-weight:bold;
}

#results{
    flex:1;
    overflow:auto;
    padding:10px;
}

.card{
    background:#111827;
    border:1px solid #1f2937;
    border-radius:10px;
    padding:10px;
    margin-bottom:8px;
}

.right{
    width:65%;
}

#map{
    width:100%;
    height:100%;
}

.small{
    font-size:12px;
    color:#94a3b8;
}

</style>
</head>

<body>

<header>
🟦 V12.3 REAL OPERATOR CONTROL ROOM
</header>

<div class="container">

<!-- LEFT -->
<div class="left">

<div class="panel">

<input id="search"
placeholder="Megálló / GTFS ID">

<button onclick="searchStops()">
🔎 KERESÉS
</button>

<button onclick="startGPS()">
📍 GPS START
</button>

<button onclick="findNearest()">
🧭 LEGKÖZELEBBI
</button>

</div>

<div id="results"></div>

</div>

<!-- MAP -->
<div class="right">
<div id="map"></div>
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ---------------- MAP ----------------

let map=L.map('map').setView([47.4979,19.0402],11);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}).addTo(map);

// ---------------- USER ----------------

let USER={
    lat:null,
    lon:null,
    marker:null
};

// ---------------- GTFS MOCK ----------------

let STOPS=[

{id:"NAD",name:"Nád utca",lat:47.5183,lon:19.0467},
{id:"SKANZEN",name:"Skanzen",lat:47.6952,lon:19.0756},
{id:"TAHITOTFALU",name:"Tahitótfalu",lat:47.7568,lon:19.0794},
{id:"HIDFO",name:"Hídfő",lat:47.4979,lon:19.0402},
{id:"KIRALYRET",name:"Királyrét",lat:47.9271,lon:18.9952},

{id:"BATTHYANY",name:"Batthyány tér",lat:47.5067,lon:19.0399},
{id:"DEAK",name:"Deák Ferenc tér",lat:47.4979,lon:19.0542},
{id:"NYUGATI",name:"Nyugati pályaudvar",lat:47.5101,lon:19.0560},
{id:"MORICZ",name:"Móricz Zsigmond körtér",lat:47.4778,lon:19.0473},
{id:"KELETI",name:"Keleti pályaudvar",lat:47.5003,lon:19.0836}

];

// ---------------- DISTANCE ----------------

function dist(lat1,lon1,lat2,lon2){

const R=6371;

let dLat=(lat2-lat1)*Math.PI/180;
let dLon=(lon2-lon1)*Math.PI/180;

let a=
Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)**2;

return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

}

// ---------------- MARKERS ----------------

STOPS.forEach(s=>{

L.marker([s.lat,s.lon])
.addTo(map)
.bindPopup(`
<b>${s.name}</b><br>
GTFS: ${s.id}<br>
${s.lat}, ${s.lon}
`);

});

// ---------------- GPS ----------------

async function reverseGeocode(lat,lon){

let url=
`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`;

let res=await fetch(url);

let data=await res.json();

return data.display_name;

}

function startGPS(){

navigator.geolocation.watchPosition(async pos=>{

USER.lat=pos.coords.latitude;
USER.lon=pos.coords.longitude;

let addr=await reverseGeocode(USER.lat,USER.lon);

if(USER.marker){
map.removeLayer(USER.marker);
}

USER.marker=L.marker([USER.lat,USER.lon])
.addTo(map)
.bindPopup("📍 TE ITT VAGY");

map.setView([USER.lat,USER.lon],13);

document.getElementById("results").innerHTML=`

<div class="card">

<b>📍 SAJÁT HELYZET</b><br>

🧭 LAT: ${USER.lat}<br>
🧭 LON: ${USER.lon}<br>

🏙️ ${addr}

</div>

`;

});

}

// ---------------- SEARCH ----------------

function searchStops(){

let q=document
.getElementById("search")
.value
.toLowerCase();

let res=STOPS.filter(s=>

s.name.toLowerCase().includes(q) ||
s.id.toLowerCase().includes(q)

);

renderResults(res);

}

// ---------------- RENDER ----------------

function renderResults(arr){

let html="";

arr.forEach(s=>{

let d="N/A";

if(USER.lat){

d=dist(
USER.lat,
USER.lon,
s.lat,
s.lon
).toFixed(2)+" km";

}

html+=`

<div class="card">

<b>${s.name}</b><br>

GTFS ID: ${s.id}<br>

📍 ${s.lat}, ${s.lon}<br>

📏 ${d}

</div>

`;

});

document.getElementById("results").innerHTML=html;

}

// ---------------- NEAREST ----------------

function findNearest(){

if(!USER.lat){

alert("Nincs GPS");

return;

}

let best=null;
let bestD=9999;

STOPS.forEach(s=>{

let d=dist(
USER.lat,
USER.lon,
s.lat,
s.lon
);

if(d<bestD){

best=s;
bestD=d;

}

});

renderResults([best]);

}

</script>

</body>
</html>
