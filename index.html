<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V7.7 TRACKING ENGINE</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b0f14;
    color:#00ff9d;
}

header{
    padding:10px;
    background:#111826;
    border-bottom:2px solid #00ff9d;
    display:flex;
    justify-content:space-between;
}

.container{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:10px;
}

.panel{
    background:#121a24;
    border:1px solid #00ff9d33;
    padding:10px;
    border-radius:6px;
}

input,button{
    width:100%;
    padding:8px;
    margin-top:5px;
}

button{
    background:#00ff9d;
    border:none;
    font-weight:bold;
    cursor:pointer;
}

.small{font-size:12px;opacity:0.8}
.ok{color:#00ff9d}
.bad{color:#ff4d4d}

.map{
    height:220px;
    border:1px dashed #00ff9d55;
    display:flex;
    align-items:center;
    justify-content:center;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

</head>

<body>

<header>
<div>🚍 FUTÁR V7.7 REAL VEHICLE TRACKING ENGINE</div>
<div id="clock"></div>
</header>

<div class="container">

<!-- LOAD -->
<div class="panel">
<h3>📦 GTFS LOAD</h3>
<input type="file" id="zip">
<button onclick="load()">LOAD GTFS</button>
<div id="status" class="small">Idle</div>
</div>

<!-- TRACK -->
<div class="panel">
<h3>🚍 VEHICLE TRACKING</h3>
<input id="tripId" placeholder="trip_id">
<button onclick="startTracking()">TRACK VEHICLE</button>
<div id="trackOut" class="small"></div>
</div>

<!-- MAP -->
<div class="panel" style="grid-column: span 2;">
<h3>🌍 LIVE TRACK MAP (SIMULATED LINEAR PATH)</h3>
<div class="map" id="map">Vehicle path visualization</div>
</div>

<!-- ETA -->
<div class="panel">
<h3>⏱ ETA ENGINE</h3>
<div id="eta">--</div>
</div>

<!-- VEHICLE STATE -->
<div class="panel">
<h3>📡 VEHICLE STATE</h3>
<div id="state">Idle</div>
</div>

</div>

<script>

let gtfs = {
    trips:[],
    stop_times:[]
};

let activeTracking = null;

// CLOCK
setInterval(()=>{
 document.getElementById("clock").innerText =
 new Date().toLocaleTimeString();
},1000);

// LOAD GTFS
async function load(){
    let file=document.getElementById("zip").files[0];
    if(!file) return;

    let zip=await JSZip.loadAsync(file);

    gtfs.trips=parseCSV(await zip.file("trips.txt")?.async("string"));
    gtfs.stop_times=parseCSV(await zip.file("stop_times.txt")?.async("string"));

    document.getElementById("status").innerText="GTFS LOADED ✔";
}

// CSV
function parseCSV(t){
    if(!t) return [];
    let lines=t.replace(/^\uFEFF/,"").split("\n");
    let h=lines[0].split(",");

    return lines.slice(1).map(l=>{
        let o={},c=l.split(",");
        h.forEach((x,i)=>o[x]=c[i]);
        return o;
    }).filter(x=>Object.values(x).join("")!="");
}

// FIND TRIP PATH
function getTripPath(tripId){
    return gtfs.stop_times
        .filter(t=>t.trip_id==tripId)
        .sort((a,b)=>a.stop_sequence-b.stop_sequence);
}

// TRACKING ENGINE
function startTracking(){

    let id=document.getElementById("tripId").value;
    let path=getTripPath(id);

    if(!path.length){
        document.getElementById("trackOut").innerText="No trip found";
        return;
    }

    let i=0;
    activeTracking=setInterval(()=>{

        if(i>=path.length-1){
            clearInterval(activeTracking);
            document.getElementById("state").innerText="ARRIVED";
            return;
        }

        let from=path[i];
        let to=path[i+1];

        // SIMULATED PROGRESS
        let progress=(Date.now()%10000)/10000;

        document.getElementById("map").innerText=
        `🚍 Moving\nStop ${from.stop_id} → ${to.stop_id}\nProgress ${(progress*100).toFixed(0)}%`;

        // ETA MODEL (simple delta time)
        let etaMinutes=(path.length-i)*2;

        document.getElementById("eta").innerText=
        `ETA: ~${etaMinutes} min`;

        document.getElementById("state").innerText=
        `TRIP ${id} | segment ${i}/${path.length}`;

        i++;

    },2000);
}

</script>

</body>
</html>
