<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V5 OSM TURISTA LOADER</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0b0f14;
    color:white;
}

header {
    padding:10px;
    background:#111827;
    font-weight:bold;
}

#map {
    height:90vh;
}

/* UI panel */
.panel {
    position:absolute;
    top:60px;
    left:10px;
    z-index:999;
    background:#111827;
    padding:10px;
    border-radius:8px;
    width:260px;
}
button {
    width:100%;
    padding:8px;
    margin-top:5px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>🗺️ FUTÁR V5 – OSM TURISTAÚT LOADER (Budai / Pilis)</header>

<div class="panel">
<b>Control</b><br>
<button onclick="loadHiking()">🚶‍♂️ Turistaút betöltése (Budai-hegység)</button>
<div id="status">Status: idle</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// -------------------- MAP --------------------
const map = L.map('map').setView([47.52, 19.03], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: "OSM"
}).addTo(map);

// -------------------- COLOR LOGIC --------------------
function getColor(len) {
    if (len < 500) return "green";
    if (len < 1500) return "yellow";
    if (len < 3000) return "orange";
    return "red";
}

// -------------------- OVERPASS QUERY --------------------
async function loadHiking() {

    document.getElementById("status").innerText = "Loading OSM data...";

    // Budai-hegység bounding box
    const query = `
    [out:json];
    (
      way["highway"="path"](47.45,18.90,47.60,19.20);
      way["highway"="footway"](47.45,18.90,47.60,19.20);
      way["highway"="track"](47.45,18.90,47.60,19.20);
    );
    out geom;
    `;

    const url = "https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query);

    const res = await fetch(url);
    const data = await res.json();

    document.getElementById("status").innerText = "Rendering...";

    data.elements.forEach(el => {

        if (!el.geometry) return;

        const latlngs = el.geometry.map(p => [p.lat, p.lon]);

        const color = getColor(latlngs.length * 200); // egyszerű becslés

        L.polyline(latlngs, {
            color: color,
            weight: 3
        }).addTo(map)
        .bindPopup(
            "🚶‍♂️ Turistaút<br>" +
            "Node count: " + latlngs.length
        );
    });

    document.getElementById("status").innerText = "Ready ✔️";
}

</script>

</body>
</html>
