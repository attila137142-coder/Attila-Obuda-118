<script>

const ORS_API_KEY = "IDE_JÖN_A_KULCSOD";

let mode = "foot-hiking";
let map, routeLine;

let points = [];

function initMap() {
  map = L.map('map').setView([47.55, 18.95], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18
  }).addTo(map);

  map.on("click", (e) => {
    addPoint(e.latlng.lat, e.latlng.lng);
  });
}

function setMode(m) {
  if (m === "air") mode = "air";
  if (m === "road") mode = "driving-car";
  if (m === "hike") mode = "foot-hiking";

  updateInfo("⚙️ Mód: " + m.toUpperCase());
}

function addPoint(lat, lon) {
  points.push([lon, lat]);

  L.marker([lat, lon]).addTo(map);

  if (points.length === 2) {
    buildRealRoute();
  }
}

// ---------------- REAL ROUTING ----------------
async function buildRealRoute() {

  const a = points[0];
  const b = points[1];

  if (routeLine) map.removeLayer(routeLine);

  if (mode === "air") {
    drawAirRoute(a, b);
    points = [];
    return;
  }

  const url = `https://api.openrouteservice.org/v2/directions/${mode}/geojson`;

  const res = await fetch(url, {
    method: "POST",
    headers: {
      "Authorization": ORS_API_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      coordinates: [a, b],
      elevation: true
    })
  });

  const data = await res.json();

  const coords = data.features[0].geometry.coordinates;

  const latlngs = coords.map(c => [c[1], c[0]]);

  routeLine = L.polyline(latlngs, { color: "blue" }).addTo(map);

  const summary = data.features[0].properties.summary;

  const distanceKm = (summary.distance / 1000).toFixed(2);
  const ascent = summary.ascent || 0;

  updateInfo(
    `📏 Távolság: ${distanceKm} km<br>` +
    `⛰️ Emelkedés: ~${ascent.toFixed(0)} m<br>` +
    `⚙️ Mód: ${mode}`
  );

  points = [];
}

// ---------------- AIR MODE ----------------
function drawAirRoute(a, b) {
  const latlngs = [
    [a[1], a[0]],
    [b[1], b[0]]
  ];

  routeLine = L.polyline(latlngs, { color: "red" }).addTo(map);

  const dist = haversine(a, b);

  updateInfo(
    `✈️ Légvonal<br>` +
    `📏 Távolság: ${(dist/1000).toFixed(2)} km`
  );
}

// ---------------- DISTANCE ----------------
function haversine(a, b) {
  const R = 6371000;

  const dLat = (b[1]-a[1]) * Math.PI/180;
  const dLon = (b[0]-a[0]) * Math.PI/180;

  const lat1 = a[1]*Math.PI/180;
  const lat2 = b[1]*Math.PI/180;

  const x =
    Math.sin(dLat/2)**2 +
    Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;

  return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

// ---------------- UI ----------------
function updateInfo(t){
  document.getElementById("info").innerHTML = t;
}

// INIT
initMap();

</script>
