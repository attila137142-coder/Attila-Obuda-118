<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">

<title>
Attila Közlekedés Control
V1.5 Wide Matrix Clock FINAL
</title>


<style>

body{

margin:0;

height:100vh;

background:#020303;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

font-family:
"Courier New",
monospace;

}



/* FŐ KIJELZŐ */

.clock-panel{

width:88vw;

max-width:1600px;

padding:35px 60px;

border-radius:30px;

text-align:center;

position:relative;


background:

radial-gradient(
circle,
rgba(0,255,180,0.12),
transparent 70%
),

#050808;


border:4px solid #124d55;


box-shadow:

0 0 50px rgba(0,255,180,0.25),

inset 0 0 60px rgba(0,255,180,0.15);


}



/* DÁTUM */

.date{

font-size:64px;

font-weight:900;

letter-spacing:8px;


margin-bottom:35px;


color:#ff2020;


text-shadow:

0 0 10px #ff2020,

0 0 35px rgba(255,0,0,0.6);

}



/* ÓRA */

.time{

font-size:170px;

font-weight:900;

letter-spacing:14px;


color:#00eaff;


text-shadow:

0 0 12px #00eaff,

0 0 35px #00ff99,

0 0 70px rgba(0,255,180,0.8);

}





/* NORMAL */

.normal{

border-color:#00ff66;

}



.normal .date{

color:#ff9900;

}



.normal .time{

color:#00ff66;


text-shadow:

0 0 15px #00ff66,

0 0 40px rgba(0,255,80,0.8);

}






/* MATRIX */

.matrix{


border-color:#1c6268;

}



.matrix .date{

color:#ff3030;

}



.matrix .time{


color:#ffe600;


text-shadow:

0 0 15px #ffe600,

0 0 40px rgba(255,220,0,0.8),

0 0 80px rgba(255,160,0,0.5);


}







/* ALERT */


.alert{


border-color:#ff0000;


background:


radial-gradient(

circle,

rgba(255,0,0,0.18),

transparent 70%

),


#100000;



box-shadow:


0 0 60px rgba(255,0,0,0.8),

inset 0 0 70px rgba(255,0,0,0.35);


}




.alert .date{

color:#ff3030;


}




.alert .time{


color:#ff0000;



text-shadow:


0 0 15px #ff0000,

0 0 45px rgba(255,0,0,0.9);


}






/* ALERT JOBB FELSŐ SAROK */


.warning{


display:none;


position:absolute;


right:35px;

top:25px;


font-size:24px;


font-weight:900;


letter-spacing:2px;


color:#ff3030;


text-shadow:


0 0 10px red;


}



.alert .warning{

display:block;

}





/* GOMBOK */


.controls{


position:absolute;

bottom:25px;

}



button{


font-size:22px;

font-weight:bold;


padding:12px 25px;


margin:5px;


border-radius:10px;


background:#111;


color:white;


border:2px solid #00eaff;


cursor:pointer;


}



</style>

</head>



<body>




<div id="panel" class="clock-panel matrix">


<div class="warning">

⚠ RENDSZER FIGYELMEZTETÉS

</div>


<div id="date"
class="date">

</div>


<div id="time"
class="time">

</div>


</div>





<div class="controls">


<button onclick="mode('normal')">
🟢 NORMAL
</button>


<button onclick="mode('matrix')">
🌙 MATRIX
</button>


<button onclick="mode('alert')">
🔴 ALERT
</button>


</div>






<script>


let lastSecond=-1;



function clock(){


let now=new Date();


let sec=now.getSeconds();



if(sec!==lastSecond){


lastSecond=sec;



let napok=[

"VASÁRNAP",
"HÉTFŐ",
"KEDD",
"SZERDA",
"CSÜTÖRTÖK",
"PÉNTEK",
"SZOMBAT"

];



document.getElementById("date").innerHTML=

now.getFullYear()
+". "+
String(now.getMonth()+1).padStart(2,"0")
+". "+
String(now.getDate()).padStart(2,"0")
+" "
+
napok[now.getDay()];





document.getElementById("time").innerHTML=

String(now.getHours()).padStart(2,"0")
+":"
+
String(now.getMinutes()).padStart(2,"0")
+":"
+
String(sec).padStart(2,"0");



}



requestAnimationFrame(clock);


}


clock();






function mode(x){


document.getElementById("panel").className=

"clock-panel "+x;


}



</script>


</body>
</html>
