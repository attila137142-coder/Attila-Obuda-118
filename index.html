<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attila MULTI STOP FINDER</title>
<style>
body { font-family: Arial; background:#0f172a; color:#fff; padding:20px }
input, button { padding:10px; margin:5px; border-radius:8px; border:none }
button { background:#22c55e; color:#fff; font-weight:bold; cursor:pointer }
.card { background:#1e293b; padding:12px; border-radius:10px; margin-top:10px }
</style>
</head>
<body>

<h1>🚍 Attila MULTI STOP FINDER</h1>

<input id="q" placeholder="Megálló név vagy ID">
<button onclick="searchAll()">KERESÉS</button>

<div id="results"></div>

<script>
// ====== GYV ======
const gyvStops = [
  {id:"005546847", name:"Hűvösvölgy", lat:47.5256, lon:18.9647, type:"GYV"},
  {id:"005546862", name:"Szépjuhászné", lat:47.5202, lon:18.9776, type:"GYV"},
  {id:"005546896", name:"Csillebérc", lat:47.4868, lon:18.9643, type:"GYV"}
];

// ====== DEMO BKK ======
const bkkStops = [
  {id:"F0457", name:"Nád utca", lat:47.55, lon:19.10, type:"BKK"},
  {id:"F0682", name:"Csobánka tér", lat:47.56, lon:19.11, type:"BKK"}
];

// ====== DEMO MÁV ======
const mavStops = [
  {id:"M001", name:"Vác", lat:47.78, lon:19.13, type:"MÁV"}
];

// ====== DEMO VOLÁN ======
const volanStops = [
  {id:"V001", name:"Vác autóbusz állomás", lat:47.78, lon:19.14, type:"VOLÁN"}
];

// ====== ÖSSZEFŰZÉS ======
const ALL = [...gyvStops, ...bkkStops, ...mavStops, ...volanStops];

// ====== TÁVOLSÁG ======
function dist(a,b,c,d){
  const R=6371000;
  const toRad=x=>x*Math.PI/180;
  let dLat=toRad(c-a);
  let dLon=toRad(d-b);
  let A=Math.sin(dLat/2)**2+
    Math.cos(toRad(a))*Math.cos(toRad(c))*
    Math.sin(dLon/2)**2;
  let C=2*Math.atan2(Math.sqrt(A),Math.sqrt(1-A));
  return R*C;
}

// ====== GPS ======
function getLoc(cb){
  navigator.geolocation.getCurrentPosition(p=>{
    cb(p.coords.latitude,p.coords.longitude);
  });
}

// ====== KERESÉS ======
function searchAll(){
  let q=document.getElementById('q').value.toLowerCase();

  let results=ALL.filter(s=>
    s.name.toLowerCase().includes(q) ||
    s.id.toLowerCase().includes(q)
  );

  if(results.length===0){
    document.getElementById('results').innerHTML="❌ Nincs találat";
    return;
  }

  getLoc((lat,lon)=>{

    results.sort((a,b)=>{
      return dist(lat,lon,a.lat,a.lon) - dist(lat,lon,b.lat,b.lon);
    });

    let html="";

    results.forEach(s=>{
      let d=dist(lat,lon,s.lat,s.lon);
      let road=d*1.3;

      html+=`<div class="card">
        <b>${s.name}</b> (${s.type})<br>
        🆔 ${s.id}<br>
        📍 ${s.lat}, ${s.lon}<br>
        📏 ${d.toFixed(0)} m<br>
        🛣️ ~${road.toFixed(0)} m
      </div>`;
    });

    document.getElementById('results').innerHTML=html;

  });
}
</script>

</body>
</html>
