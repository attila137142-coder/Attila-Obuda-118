<!DOCTYPE html>
    <div id="list"></div>
  </div>

  <div class="content">
    <h2 id="title">Válassz egy helyet</h2>
    <p id="desc">Bal oldalon kereshetsz az offline adatbázisban.</p>
    <pre id="json"></pre>
  </div>

</div>

<script>
// 🌲 OFFLINE BÖRZSÖNY DB (bővíthető)
const DB = [
  {
    id: "borzsony_001",
    name: "Viláti pihenő",
    type: "rom / pihenő",
    location: "Börzsöny",
    status: "eltűnt",
    story: "Régi erdei pihenőhely, amely egy tűzeset után megszűnt.",
    tags: ["rom", "tűzeset", "erdő"]
  },
  {
    id: "borzsony_002",
    name: "Diósjenő erdei kulcsosház",
    type: "kulcsosház",
    location: "Diósjenő",
    status: "ismeretlen / részben romos",
    story: "Helyi túrázók által használt régi kulcsosház a Börzsöny kapujában.",
    tags: ["kulcsosház", "Diósjenő"]
  },
  {
    id: "borzsony_003",
    name: "Királyrét térség",
    type: "turista központ",
    location: "Börzsöny",
    status: "aktív",
    story: "A Börzsöny egyik legfontosabb túraközpontja, kiindulópont több útvonalhoz.",
    tags: ["túra", "központ"]
  }
];

const listEl = document.getElementById("list");
const searchEl = document.getElementById("search");
const titleEl = document.getElementById("title");
const descEl = document.getElementById("desc");
const jsonEl = document.getElementById("json");

function render(list) {
  listEl.innerHTML = "";
  list.forEach(item => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `<b>${item.name}</b><div class='tag'>${item.type} | ${item.status}</div>`;
    div.onclick = () => showItem(item);
    listEl.appendChild(div);
  });
}

function showItem(item) {
  titleEl.textContent = item.name;
  descEl.textContent = item.story;
  jsonEl.textContent = JSON.stringify(item, null, 2);
}

searchEl.addEventListener("input", (e) => {
  const q = e.target.value.toLowerCase();
  render(DB.filter(x =>
    x.name.toLowerCase().includes(q) ||
    x.location.toLowerCase().includes(q) ||
    x.tags.some(t => t.includes(q))
  ));
});

render(DB);
</script>

</body>
</html>
