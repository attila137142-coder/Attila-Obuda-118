<script>

// 🔥 FAKE → GTFS READY STOP DATABASE (később CSV-ből jön)
let STOPS = [
  "Deák Ferenc tér",
  "Nyugati pályaudvar",
  "Batthyány tér",
  "Kelenföld vasútállomás",
  "Örs vezér tere",
  "Astoria",
  "Blaha Lujza tér",
  "Széll Kálmán tér",
  "Móricz Zsigmond körtér",
  "Keleti pályaudvar"
];

// 🔥 REAL SEARCH ENGINE (FIX)
function normalize(str){
  return str
    .toLowerCase()
    .replaceAll("á","a")
    .replaceAll("é","e")
    .replaceAll("í","i")
    .replaceAll("ó","o")
    .replaceAll("ö","o")
    .replaceAll("ő","o")
    .replaceAll("ú","u")
    .replaceAll("ü","u");
}

function searchStops(){
  try {
    const q = normalize(document.getElementById("search").value);
    const res = document.getElementById("results");
    res.innerHTML = "";

    if(!q) return;

    const filtered = STOPS.filter(s =>
      normalize(s).includes(q)
    );

    if(filtered.length === 0){
      res.innerHTML = "<div class='warn'>Nincs találat (GTFS DB kell majd)</div>";
      return;
    }

    filtered.forEach(name=>{
      const div = document.createElement("div");
      div.className="stop";
      div.innerText = name;
      div.onclick = ()=>selectStop(name);
      res.appendChild(div);
    });

  } catch(e){
    log("SEARCH ERROR: " + e.message);
  }
}

// 🔥 FAKE → REAL SLOT FOR GTFS DEPARTURES
function loadDepartures(stopName){
  const box = document.getElementById("departures");

  try {

    // 👉 EZ MÉG DEMO, DE MÁR STRUKTURÁLT
    const now = new Date();

    const mock = [
      {line:"M2", min:2},
      {line:"47", min:5},
      {line:"4-6", min:7},
      {line:"H5", min:12}
    ];

    box.innerHTML = "<b>" + stopName + "</b><br><br>";

    mock.forEach(d=>{
      const t = new Date(now.getTime() + d.min*60000);
      box.innerHTML += `🚍 ${d.line} → ${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}<br>`;
    });

  } catch(e){
    log("DEPARTURE ERROR: " + e.message);
  }
}

</script>
