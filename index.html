<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<title>V2 Import Engine</title>
<style>
body { font-family: Arial; padding: 20px; }
input { padding: 8px; width: 250px; margin: 5px 0; }
button { padding: 8px 12px; cursor: pointer; }
.box { margin-top: 15px; padding: 10px; border: 1px solid #ccc; }
</style>
</head>
<body>

<h2>🚀 V2 Import Engine – KM Universal Parser</h2>

<div class="box">
<h3>✍️ Kézi / copy-paste input</h3>
<input id="kmInput" placeholder="pl. 12,5 km / 12.5 / 12" />
<button onclick="handleInput()">Feldolgozás</button>
<p id="result"></p>
</div>

<div class="box">
<h3>📊 Excel (demo input mező)</h3>
<input id="excelInput" placeholder="Excel cella érték" />
<button onclick="handleExcel()">Excel feldolgozás</button>
</div>

<div class="box">
<h3>📄 PDF (szimulált szöveg)</h3>
<input id="pdfInput" placeholder="PDF szöveg pl. 12 km" />
<button onclick="handlePDF()">PDF feldolgozás</button>
</div>

<script>

// ==============================
// 🔥 V2 KM IMPORT ENGINE CORE
// ==============================

function parseKm(input) {
    if (input === null || input === undefined) return null;

    let str = String(input).trim();

    // km szó eltávolítás
    str = str.replace(/km/i, "").trim();

    // vessző → pont
    str = str.replace(",", ".");

    // spacek törlése
    str = str.replace(/\s+/g, "");

    const num = Number(str);

    if (!isFinite(num)) return null;

    // 2 tizedesre kerekítés
    return Math.round(num * 100) / 100;
}

// ==============================
// ✍️ HTML INPUT
// ==============================
function handleInput() {
    const value = document.getElementById("kmInput").value;
    const km = parseKm(value);

    const out = document.getElementById("result");

    if (km === null) {
        out.innerHTML = "❌ Nem megfelelő formátum";
    } else {
        out.innerHTML = "✅ OK KM: " + km;
    }
}

// ==============================
// 📊 EXCEL SIMULATION
// ==============================
function handleExcel() {
    const value = document.getElementById("excelInput").value;
    const km = parseKm(value);

    alert(km === null ? "Excel: hibás adat" : "Excel KM: " + km);
}

// ==============================
// 📄 PDF SIMULATION
// ==============================
function handlePDF() {
    const value = document.getElementById("pdfInput").value;
    const km = parseKm(value);
