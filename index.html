<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V5 SMART RADAR</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:#e2e8f0;
}

#map{
  height:50vh;
}

.container{
  padding:15px;
}

.card{
  background:#1e293b;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
}

.row{
  padding:5px 0;
  border-bottom:1px solid #334155;
}

input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  font-size:16px;
}

button{
  margin-top:10px;
  padding:10px 15px;
  border:none;
  border-radius:8px;
  background:#22c55e;
  font-weight:bold;
  cursor:pointer;
}

.badge{
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
}

.smart{background:#38bdf8;color:black;}
.pilis{background:#22c55e;color:black;}
.borzsony{background:#f59e0b;color:black;}
</style>
</head>

<body>

<div id="map"></div>

<div class="container">

<h2>🚍 FUTÁR V5 SMART RADAR</h2>

<input id="input" placeholder="Stop ID vagy név (pl. F00457 / 773012)" />
<button onclick="run()">RADAR INDÍTÁS</button>

<div id="out"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ---------------- MAP ----------------
const map=L.map('map').setView([47.4979,19.0402],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 attribution:'OSM'
}).addTo(map);

let marker;

// ---------------- USER GPS ----------------
let userLat=47.4979;
let userLon=19.0402;

navigator.geolocation?.getCurrentPosition(pos=>{
 userLat=pos.coords.latitude;
 userLon=pos.coords.longitude;
});

// ---------------- STOP DB ----------------
function getStop(id){

 const base=id.split("_")[0];

 const db={

  "F00457":{
   name:"BKK megálló",
   lat:47.501,
   lon:19.040,
   lines:["226","34","105"]
  },

  "773012":{
   name:"VOLÁN állomás",
   lat:47.650120,
   lon:19.120300,
   lines:["1010","1012","1020"]
  },

  "005546862":{
   name:"MÁV állomás",
   lat:47.500120,
   lon:19.080900,
   lines:["IC745","S80"]
  },

  "PILIS":{
   name:"Pilis régió",
   lat:47.720,
   lon:18.900,
   lines:["VOLÁN","HÉV"]
  },

  "BÖRZSÖNY":{
   name:"Börzsöny erdei vasút",
   lat:47.900,
   lon:18.870,
   lines:["kisvasút"]
  }

 };

 return db[base] || {
  name:"Ismeretlen",
  lat:47.4979,
  lon:19.0402,
  lines:["N/A"]
 };
}

// ---------------- DIST ----------------
function dist(a,b,c,d){

 const R=6371;

 const dLat=(c-a)*Math.PI/180;
 const dLon=(d-b)*Math.PI/180;

 const x=
 Math.sin(dLat/2)**2+
 Math.cos(a*Math.PI/180)*
 Math.cos(c*Math.PI/180)*
 Math.sin(dLon/2)**2;

 return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ---------------- SMART RADAR ----------------
function getRadius(density){

 if(density<50) return 10;
 if(density<120) return 25;
 return 40;
}

// ---------------- MATRIX ----------------
function matrix(lines,type){

 return lines.map(l=>{
  let t=Math.floor(Math.random()*30)+1;
  let s=Math.random()>0.8?"DELAY":"ON TIME";

  return `🚍 ${l} | ${t}p | ${s} | ${type}`;
 }).join("<br>");
}

// ---------------- MAIN ----------------
function run(){

 const id=document.getElementById("input").value.trim();
 if(!id)return;

 const stop=getStop(id);

 const d=dist(userLat,userLon,stop.lat,stop.lon);

 // SMART RADIUS LOGIC
 let density=stop.lines.length*10 + Math.random()*50;
 let radius=getRadius(density);

 // classify region
 let region="SMART";
 if(radius===10) region="CITY";
 if(radius===25) region="PILIS ZONE";
 if(radius===40) region="BORZSONY / REGION";

 // MAP
 if(marker) map.removeLayer(marker);

 marker=L.marker([stop.lat,stop.lon])
 .addTo(map)
 .bindPopup(stop.name)
 .openPopup();

 map.setView([stop.lat,stop.lon],11);

 let html=`
 <div class="card">

 <span class="badge smart">${region}</span>
 <b>${stop.name}</b>

 <h3>🧠 SMART RADAR MATRIX</h3>
 <div class="card">
 ${matrix(stop.lines,region)}
 </div>

 <h3>📍 GEO</h3>
 <div class="card">
 Lat: ${stop.lat.toFixed(6)}<br>
 Lon: ${stop.lon.toFixed(6)}<br>
 🚶 ${d.toFixed(2)} km tőled<br>
 🎯 Radius: ${radius} km
 </div>

 <h3>🧠 ENGINE</h3>
 <div class="card">
 SMART RADAR ACTIVE<br>
 MODE: HYBRID (GTFS + SIMULATION)<br>
 REGION: ${region}
 </div>

 </div>
 `;

 document.getElementById("out").innerHTML=html;
}

</script>

</body>
</html>
