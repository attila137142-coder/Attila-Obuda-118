<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attila Discount Engine V2 PRO</title>
<style>
body { font-family: Arial; background:#0f172a; color:#fff; padding:20px }
input, button, select { padding:10px; margin:5px; border-radius:8px; border:none }
button { cursor:pointer; background:#22c55e; color:white; font-weight:bold }
.card { background:#1e293b; padding:15px; border-radius:12px; margin-top:10px }
.best { border:2px solid #4ade80 }
h2 { margin-top:25px }
</style>
</head>
<body>

<h1>🔥 Attila Discount Engine V2 PRO</h1>

<h2>🛒 Kosár árak</h2>
<input id="prices" placeholder="pl: 1000, 2500, 1800">
<button onclick="calculateAll()">SZÁMOLÁS</button>

<div id="results"></div>

<h2>📊 Gyors kalkulátor</h2>
<input id="original" placeholder="Eredeti ár (Ft)">
<input id="discounted" placeholder="Akciós ár (Ft)">
<button onclick="calcPercent()">% kiszámolás</button>

<div id="percentResult"></div>

<h2>🔁 Teljes ár visszaszámolás</h2>
<input id="finalPrice" placeholder="Akciós ár (Ft)">
<input id="percent" placeholder="Kedvezmény %">
<button onclick="calcOriginal()">Eredeti ár</button>

<div id="originalResult"></div>

<script>
function parsePrices() {
  return document.getElementById('prices').value
    .split(',')
    .map(x => parseFloat(x.trim()))
    .filter(x => !isNaN(x))
    .sort((a,b)=>a-b);
}

function sum(arr) {
  return arr.reduce((a,b)=>a+b,0);
}

function dealA(p){ let f=Math.floor(p.length/3); return sum(p)-sum(p.slice(0,f)); }
function dealB(p){ return sum(p)*0.8; }
function dealC(p){ let d=Math.floor(p.length/2); return sum(p)-sum(p.slice(0,d))*0.33; }
function dealD(p){ let f=Math.min(Math.floor(p.length/6),1); return sum(p)-sum(p.slice(0,f)); }

function calculateAll(){
  let p=parsePrices(); if(p.length===0) return;
  let base=sum(p);

  let A=dealA(p), B=dealB(p), C=dealC(p), D=dealD(p);
  let min=Math.min(A,B,C,D);

  function save(x){ return (base-x).toFixed(0); }
  function percent(x){ return (((base-x)/base)*100).toFixed(1); }

  document.getElementById('results').innerHTML=`
  <div class="card ${A===min?'best':''}">🅰️ 3. ingyen → ${A.toFixed(0)} Ft | -${percent(A)}% | spórolsz ${save(A)} Ft</div>
  <div class="card ${B===min?'best':''}">🅱️ -20% → ${B.toFixed(0)} Ft | -${percent(B)}% | spórolsz ${save(B)} Ft</div>
  <div class="card ${C===min?'best':''}">🅲 2. -33% → ${C.toFixed(0)} Ft | -${percent(C)}% | spórolsz ${save(C)} Ft</div>
  <div class="card ${D===min?'best':''}">🅳 6-ból 1 ingyen (limit 1) → ${D.toFixed(0)} Ft | -${percent(D)}% | spórolsz ${save(D)} Ft</div>
  <h2>🏆 LEGJOBB: ${A===min?'A':B===min?'B':C===min?'C':'D'}</h2>
  `;
}

function calcPercent(){
  let o=parseFloat(document.getElementById('original').value);
  let d=parseFloat(document.getElementById('discounted').value);
  if(!o||!d) return;
  let diff=o-d;
  let perc=(diff/o)*100;
  document.getElementById('percentResult').innerHTML=
    `Kedvezmény: ${perc.toFixed(2)}% | Megtakarítás: ${diff.toFixed(0)} Ft`;
}

function calcOriginal(){
  let f=parseFloat(document.getElementById('finalPrice').value);
  let p=parseFloat(document.getElementById('percent').value);
  if(!f||!p) return;
  let original=f/(1-p/100);
  document.getElementById('originalResult').innerHTML=
    `Eredeti ár: ${original.toFixed(0)} Ft`;
}
</script>

</body>
</html>
