<script>
// ===== GTFS CORE ENGINE (REAL STRUCTURE) =====

// STOP DATABASE (helyettesíti a stops.txt-t)
const STOPS = [
  { id: "H123", name: "Nád utca" },
  { id: "H124", name: "Flórián tér" }
];

// STOP_TIMES (helyettesíti stop_times.txt)
const STOP_TIMES = [
  { stop_id: "H123", trip_id: "T1", time: "12:10:00" },
  { stop_id: "H123", trip_id: "T2", time: "12:14:30" },
  { stop_id: "H124", trip_id: "T3", time: "12:16:10" }
];

// TRIPS (járatok)
const TRIPS = [
  { id: "T1", route: "34", direction: "Aquincum", vehicle: "BUS-1021" },
  { id: "T2", route: "134", direction: "Újpest", vehicle: "BUS-2201" },
  { id: "T3", route: "106", direction: "Gellért tér", vehicle: "BUS-7781" }
];

// ===== STOP SEARCH =====
function findStop(name) {
  return STOPS.find(s =>
    s.name.toLowerCase().includes(name.toLowerCase())
  );
}

// ===== REAL DEPARTURE BUILD =====
function buildDepartures(stopId) {

  const now = new Date();
  const hhmmss = now.toTimeString().split(" ")[0];

  return STOP_TIMES
    .filter(st => st.stop_id === stopId)
    .map(st => {

      const trip = TRIPS.find(t => t.id === st.trip_id);

      // VERY SIMPLE DELAY SIM (itt jön majd realtime API)
      const delay = Math.floor(Math.random() * 5) - 1;

      return {
        route: trip.route,
        direction: trip.direction,
        time: st.time,
        vehicle: trip.vehicle,
        delay: delay,
        status:
          delay > 0 ? "KÉSÉS +" + delay :
          delay < 0 ? "SIET " + delay :
          "OK"
      };
    })
    .slice(0, 15);
}

// ===== MAIN LOAD =====
function loadStop() {

  const input = document.getElementById("stopInput").value;

  const stop = findStop(input);

  if (!stop) {
    alert("Nincs ilyen megálló a GTFS-ben!");
    return;
  }

  const data = buildDepartures(stop.id);

  renderBoard(data);
}
</script>
