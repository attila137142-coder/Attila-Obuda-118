<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOLÁN CLEAN GTFS ENGINE</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body { font-family: Arial; background:#0f172a; color:#fff; padding:20px }
input, button { padding:10px; margin:5px; border-radius:8px; border:none }
button { background:#22c55e; color:#fff; font-weight:bold; cursor:pointer }
.card { background:#1e293b; padding:12px; border-radius:10px; margin-top:10px }
.small { opacity:0.8; font-size:12px }
</style>
</head>
<body>

<h1>🚍 VOLÁN CLEAN GTFS ENGINE</h1>

<input id="q" placeholder="Megálló név vagy ID">
<button onclick="searchStops()">KERESÉS</button>
<button onclick="loadVolanGTFS()">VOLÁN GTFS BETÖLTÉS</button>

<div id="results"></div>

<script>

let STOPS = [];

// ===== GTFS BETÖLTÉS (VOLÁN) =====
async function loadVolanGTFS(){

  // IDE TEDD A SAJÁT VOLÁN RAW LINKED
  let url = "https://raw.githubusercontent.com/attila137142-coder/Attila-Obuda-118/main/stops.txt";

  let res = await fetch(url);
  let text = await res.text();

  let parsed = Papa.parse(text, {
    header: true,
    skipEmptyLines: true
  });

  STOPS = parsed.data.map(s => ({
    id: s.stop_id,
    name: s.stop_name,
    lat: parseFloat(s.stop_lat),
    lon: parseFloat(s.stop_lon)
  }));

  alert("VOLÁN GTFS betöltve: " + STOPS.length + " megálló");
}

// ===== TÁVOLSÁG =====
function dist(a,b,c,d){
  const R=6371000;
  const toRad=x=>x*Math.PI/180;
  let dLat=toRad(c-a);
  let dLon=toRad(d-b);

  let A=Math.sin(dLat/2)**2 +
    Math.cos(toRad(a))*Math.cos(toRad(c))*
    Math.sin(dLon/2)**2;

  let C=2*Math.atan2(Math.sqrt(A),Math.sqrt(1-A));
  return R*C;
}

// ===== GPS =====
function getLoc(cb){
  navigator.geolocation.getCurrentPosition(p=>{
    cb(p.coords.latitude,p.coords.longitude);
  });
}

// ===== KERESÉS =====
function searchStops(){

  let q=document.getElementById('q').value.toLowerCase();

  let results = STOPS.filter(s=>
    (s.name && s.name.toLowerCase().includes(q)) ||
    (s.id && s.id.toLowerCase().includes(q))
  );

  if(results.length===0){
    document.getElementById('results').innerHTML="❌ Nincs találat (GTFS betöltve?)";
    return;
  }

  getLoc((lat,lon)=>{

    results.sort((a,b)=>dist(lat,lon,a.lat,a.lon)-dist(lat,lon,b.lat,b.lon));

    let html="";

    results.forEach(s=>{

      let d=dist(lat,lon,s.lat,s.lon);

      html += `
        <div class="card">
          <b>${s.name}</b><br>
          🆔 ${s.id}<br>
          📍 ${s.lat?.toFixed(6)}, ${s.lon?.toFixed(6)}<br>
          📏 ${ (d/1000).toFixed(2)} km
        </div>
      `;

    });

    document.getElementById('results').innerHTML=html;

  });
}

</script>

</body>
</html>
