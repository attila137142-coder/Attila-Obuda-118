<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Budai PRO TRAIL GRAPH v3</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
  body { margin:0; font-family: Arial; }
  #map { height:100vh; width:100%; }
</style>
</head>

<body>
<div id="map"></div>

<script>

var map = L.map('map').setView([47.52, 18.98], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:18
}).addTo(map);

/* =========================
   🧠 NODE RENDSZER
   ========================= */

const nodes = {
  "Széchenyi-hegy": [47.4938, 19.0097],
  "Normafa": [47.5005, 18.9990],
  "Anna-rét": [47.5045, 18.9902],
  "Csillebérc": [47.5098, 18.9795],
  "Szépjuhászné": [47.5192, 18.9690],
  "Hárs-hegy": [47.5250, 18.9610],
  "Hűvösvölgy": [47.5338, 18.9535],
  "János-hegy": [47.5050, 18.9650]
};

/* =========================
   📊 EDGE RENDSZER (GRÁF)
   ========================= */

const edges = [
  {
    from:"Széchenyi-hegy",
    to:"Normafa",
    distance:"920 m",
    slope:"4.1%"
  },
  {
    from:"Normafa",
    to:"Anna-rét",
    distance:"640 m",
    slope:"1.9%"
  },
  {
    from:"Anna-rét",
    to:"Csillebérc",
    distance:"1180 m",
    slope:"4.7%"
  },
  {
    from:"Csillebérc",
    to:"Szépjuhászné",
    distance:"1450 m",
    slope:"4.3%"
  },
  {
    from:"Szépjuhászné",
    to:"Hárs-hegy",
    distance:"820 m",
    slope:"5.0%"
  },
  {
    from:"Hárs-hegy",
    to:"Hűvösvölgy",
    distance:"1200 m",
    slope:"7.9%"
  },

  /* 🌲 ELÁGAZÁS – EZ A LÉNYEG */

  {
    from:"Normafa",
    to:"János-hegy",
    distance:"1750 m",
    slope:"12.0%"
  },
  {
    from:"János-hegy",
    to:"Szépjuhászné",
    distance:"2100 m",
    slope:"-10.5%"
  }
];

/* =========================
   🗺️ RENDER
   ========================= */

// NODE-ok kirajzolása
for (let name in nodes) {
  let p = nodes[name];

  L.circleMarker(p, {
    radius:6,
    color:"blue"
  }).addTo(map)
  .bindPopup("📍 NODE: " + name);
}

// EDGE-ek kirajzolása
edges.forEach(e => {

  let a = nodes[e.from];
  let b = nodes[e.to];

  let line = L.polyline([a,b], {color:"green"}).addTo(map);

  line.bindPopup(
    "<b>" + e.from + " → " + e.to + "</b><br><br>" +
    "📏 Távolság: " + e.distance + "<br>" +
    "⛰️ Meredekség: " + e.slope
  );
});

</script>
</body>
</html>
