<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Attila Közlekedés - Unified Search</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f0f;
  color: white;
}

.header {
  padding: 10px;
  background: #1a1a1a;
  font-size: 18px;
  font-weight: bold;
}

.container {
  display: flex;
  height: calc(100vh - 40px);
}

/* LEFT SEARCH */
.left {
  width: 30%;
  padding: 10px;
  border-right: 1px solid #333;
}

input {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  margin-bottom: 10px;
}

.result {
  padding: 6px;
  border-bottom: 1px solid #222;
  cursor: pointer;
}

/* RIGHT PANEL */
.right {
  flex: 1;
  padding: 10px;
}

.panel {
  border: 1px solid #333;
  padding: 10px;
  height: 90%;
  overflow: hidden;
}

.row {
  display: flex;
  justify-content: space-between;
  padding: 4px;
  border-bottom: 1px solid #222;
  font-size: 13px;
}

.siet {
  color: red;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="header">🚆 ATTILA KÖZLEKEDÉS // UNIFIED SEARCH CORE V1</div>

<div class="container">

  <!-- SEARCH -->
  <div class="left">
    <input id="search" placeholder="Megálló neve vagy GTFS ID..." />

    <div id="results"></div>
  </div>

  <!-- REALTIME PANEL -->
  <div class="right">
    <div class="panel">
      <div id="departures"></div>
    </div>
  </div>

</div>

<script>
// -------------------- MOCK GTFS --------------------
const stops = [
  { id: 1, name: "Nád utca" },
  { id: 2, name: "Óbuda, Árpád híd" },
  { id: 3, name: "Diosjenő vasútállomás" },
  { id: 4, name: "Börzsöny kapu" }
];

const departuresMock = [
  { line: "9", dir: "Újpest", min: 2, siet: true },
  { line: "17", dir: "Savoya Park", min: 5, siet: false },
  { line: "19", dir: "Kelenföld", min: 1, siet: true },
  { line: "60", dir: "Széll Kálmán tér", min: 12, siet: false },
  { line: "118", dir: "Batthyány tér", min: 3, siet: true },
  { line: "160", dir: "Rómaifürdő", min: 8, siet: false },
  { line: "260", dir: "Solymár", min: 6, siet: false },
  { line: "260A", dir: "Hűvösvölgy", min: 4, siet: true },
  { line: "219", dir: "Gazdagrét", min: 10, siet: false },
  { line: "1", dir: "Bécsi út", min: 7, siet: false },
  { line: "41", dir: "Kamaraerdő", min: 9, siet: false },
  { line: "47", dir: "Deák tér", min: 3, siet: true },
  { line: "49", dir: "Kelenföld", min: 14, siet: false },
  { line: "56", dir: "Hűvösvölgy", min: 11, siet: false },
  { line: "17", dir: "Bécsi út", min: 15, siet: false }
];

// -------------------- SEARCH FIX --------------------
document.getElementById("search").addEventListener("input", (e) => {
  searchStops(e.target.value);
});

function searchStops(q) {
  const box = document.getElementById("results");
  box.innerHTML = "";

  if (!q) return;

  const res = stops.filter(s =>
    s.name.toLowerCase().includes(q.toLowerCase())
  );

  res.forEach(r => {
    const div = document.createElement("div");
    div.className = "result";
    div.textContent = r.name;

    div.onclick = () => loadDepartures(r.name);

    box.appendChild(div);
  });
}

// -------------------- PANEL RENDER (15 SOR) --------------------
function loadDepartures(stopName) {
  const box = document.getElementById("departures");
  box.innerHTML = `<b>🚏 ${stopName}</b><br><br>`;

  departuresMock.forEach((d, i) => {
    const row = document.createElement("div");
    row.className = "row";

    row.innerHTML = `
      <div>${d.line}</div>
      <div>${d.dir}</div>
      <div class="${d.siet ? 'siet' : ''}">
        ${d.min}p
      </div>
    `;

    box.appendChild(row);
  });
}

// default view
loadDepartures("Válassz megállót");
</script>

</body>
</html>
