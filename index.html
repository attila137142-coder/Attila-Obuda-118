<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V7.6 TIMETABLE ENGINE</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b0f14;
    color:#00ff9d;
}

header{
    padding:10px;
    background:#111826;
    border-bottom:2px solid #00ff9d;
    display:flex;
    justify-content:space-between;
}

.container{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:10px;
}

.panel{
    background:#121a24;
    border:1px solid #00ff9d33;
    padding:10px;
    border-radius:6px;
}

input,button{
    width:100%;
    padding:8px;
    margin-top:5px;
}

button{
    background:#00ff9d;
    border:none;
    font-weight:bold;
    cursor:pointer;
}

.small{font-size:12px;opacity:0.8}
.ok{color:#00ff9d}
.bad{color:#ff4d4d}

table{
    width:100%;
    font-size:12px;
    border-collapse:collapse;
}

td,th{
    border-bottom:1px solid #00ff9d22;
    padding:4px;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

</head>

<body>

<header>
<div>🚍 FUTÁR V7.6 REAL TIMETABLE ENGINE</div>
<div id="clock"></div>
</header>

<div class="container">

<!-- LOAD -->
<div class="panel">
<h3>📦 GTFS LOAD (FIXED ENGINE)</h3>
<input type="file" id="zip">
<button onclick="loadGTFS()">LOAD GTFS</button>
<div id="status" class="small">Waiting...</div>
</div>

<!-- SEARCH -->
<div class="panel">
<h3>🔎 STOP / ROUTE SEARCH</h3>
<input id="q">
<button onclick="search()">SEARCH</button>
<div id="out" class="small"></div>
</div>

<!-- STOP TIMES ETA -->
<div class="panel" style="grid-column: span 2;">
<h3>⏱ REAL TIMETABLE + ETA CORE</h3>
<input id="stopQuery" placeholder="stop_id (pl: 04567)">
<button onclick="getTimetable()">GET TIMETABLE</button>
<div id="timetable" class="small"></div>
</div>

<!-- DATA -->
<div class="panel">
<h3>🚏 STOPS</h3>
<div id="stops">-</div>
</div>

<div class="panel">
<h3>🚍 ROUTES</h3>
<div id="routes">-</div>
</div>

</div>

<script>

let db;
let gtfs = {
    stops:[],
    routes:[],
    trips:[],
    stop_times:[]
};

// CLOCK
setInterval(()=>{
 document.getElementById("clock").innerText =
 new Date().toLocaleTimeString();
},1000);

// SAFE KEY
function safe(v){
    if(v===undefined||v===null) return null;
    v=String(v).trim();
    return v===""?null:v;
}

// CLEAN BOM
function clean(t){
    return (t||"").replace(/^\uFEFF/,"");
}

// INIT DB (FIXED)
function initDB(){
    let req=indexedDB.open("futar_v76",1);

    req.onupgradeneeded=e=>{
        db=e.target.result;

        db.createObjectStore("stops",{keyPath:"stop_id"});
        db.createObjectStore("routes",{keyPath:"route_id"});
        db.createObjectStore("trips",{keyPath:"trip_id"});
        db.createObjectStore("stop_times",{keyPath:"id",autoIncrement:true});
    };

    req.onsuccess=e=>db=e.target.result;
}
initDB();

// PARSE CSV
function parseCSV(t){
    if(!t) return [];
    t=clean(t);

    let lines=t.split("\n");
    let headers=lines[0].split(",");

    return lines.slice(1).map(l=>{
        let o={};
        let c=l.split(",");
        headers.forEach((h,i)=>o[h]=c[i]);
        return o;
    }).filter(x=>Object.values(x).join("")!="");
}

// LOAD GTFS
async function loadGTFS(){
    let file=document.getElementById("zip").files[0];
    if(!file) return;

    let zip=await JSZip.loadAsync(file);
    document.getElementById("status").innerText="Loading...";

    gtfs.stops=parseCSV(await zip.file("stops.txt")?.async("string"));
    gtfs.routes=parseCSV(await zip.file("routes.txt")?.async("string"));
    gtfs.trips=parseCSV(await zip.file("trips.txt")?.async("string"));
    gtfs.stop_times=parseCSV(await zip.file("stop_times.txt")?.async("string"));

    saveAll();

    render();

    document.getElementById("status").innerText="GTFS READY ✔";
}

// SAVE (FIXED SAFE)
function saveAll(){

    let tx1=db.transaction("stops","readwrite");
    let s=tx1.objectStore("stops");
    gtfs.stops.forEach(x=>{
        let k=safe(x.stop_id);
        if(!k) return;
        x.stop_id=k;
        s.put(x);
    });

    let tx2=db.transaction("routes","readwrite");
    let r=tx2.objectStore("routes");
    gtfs.routes.forEach(x=>{
        let k=safe(x.route_id);
        if(!k) return;
        x.route_id=k;
        r.put(x);
    });

    let tx3=db.transaction("trips","readwrite");
    let t=tx3.objectStore("trips");
    gtfs.trips.forEach(x=>{
        let k=safe(x.trip_id);
        if(!k) return;
        x.trip_id=k;
        t.put(x);
    });

    let tx4=db.transaction("stop_times","readwrite");
    let st=tx4.objectStore("stop_times");
    gtfs.stop_times.forEach(x=>{
        st.put(x);
    });
}

// RENDER
function render(){
    document.getElementById("stops").innerHTML =
    gtfs.stops.slice(0,5).map(s=>
    `${s.stop_id} ${s.stop_name}`).join("<br>");

    document.getElementById("routes").innerHTML =
    gtfs.routes.slice(0,5).map(r=>
    `${r.route_id} ${r.route_short_name}`).join("<br>");
}

// SEARCH
function search(){
    let q=document.getElementById("q").value.toLowerCase();

    let stops=gtfs.stops.filter(s=>
        (s.stop_name||"").toLowerCase().includes(q)
    );

    let routes=gtfs.routes.filter(r=>
        (r.route_short_name||"").toLowerCase().includes(q)
    );

    document.getElementById("out").innerHTML=
    `Stops: ${stops.length}<br>Routes: ${routes.length}`;
}

// ⏱ REAL TIMETABLE + ETA CORE
function getTimetable(){
    let stop=document.getElementById("stopQuery").value;

    let times=gtfs.stop_times.filter(t=>t.stop_id==stop);

    // join trips
    let enriched=times.map(t=>{
        let trip=gtfs.trips.find(tr=>tr.trip_id==t.trip_id);
        return {
            time:t.arrival_time,
            trip:t.trip_id,
            route:trip?.route_id || "?"
        };
    }).slice(0,10);

    let now=new Date();
    let currentHour=now.getHours();

    let out=enriched.map(e=>{
        let hour=parseInt((e.time||"0").split(":")[0]);

        // SIMPLE ETA MODEL
        let eta=Math.max(0,hour-currentHour);

        return `
        <div>
        🕒 ${e.time} | 🚍 ${e.route} | ⏳ ETA ~ ${eta}h
        </div>`;
    }).join("");

    document.getElementById("timetable").innerHTML=
    out || "No stop_times found";
}

</script>

</body>
</html>
