<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATTILA FULL STOP PANEL + ROUTES/TRIPS</title>
<style>
body{font-family:Arial;background:#0b1220;color:#fff;padding:15px}
button{padding:10px;border:none;border-radius:8px;margin:5px;background:#22c55e;color:#fff;font-weight:bold}
input{padding:10px;border-radius:8px;width:80%}
.card{background:#1e293b;padding:10px;border-radius:10px;margin-top:10px}
.red{border-left:5px solid red}
.blue{border-left:5px solid cyan}
.white{border-left:5px solid white}
.small{font-size:12px;opacity:.7}
</style>
</head>
<body>

<h1>🚏 FULL STOP PANEL (ROUTES + TRIPS)</h1>

<input type="file" id="zipInput" accept=".zip">
<button onclick="loadZIP()">📦 GTFS</button>
<button onclick="getLocation()">📍 Saját hely</button>

<br><br>
<input id="q" placeholder="Megálló keresés..." />
<button onclick="search()">🔍</button>

<div id="me"></div>
<div id="out"></div>
<div id="panel"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>

let STOPS=[], STOP_TIMES=[], TRIPS=[], ROUTES=[];
let MY={lat:null,lon:null};

// CSV parser (idézőjelek kezelése)
function parseCSV(line){
  let res=[],cur='',q=false;
  for(let i=0;i<line.length;i++){
    let c=line[i];
    if(c==='\"'){q=!q}
    else if(c===','&&!q){res.push(cur);cur=''}
    else{cur+=c}
  }
  res.push(cur);
  return res;
}

// 📍 hely + cím
async function getLocation(){
  navigator.geolocation.getCurrentPosition(async pos=>{
    let lat=pos.coords.latitude, lon=pos.coords.longitude, acc=pos.coords.accuracy;
    let r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
    let d=await r.json(); let a=d.address||{};
    document.getElementById('me').innerHTML=`
      <div class='card'>
      📍 ${lat.toFixed(6)}, ${lon.toFixed(6)}<br>
      🌍 ${a.country||'-'}<br>
      🏙 ${a.city||a.town||a.village||'-'}<br>
      🏠 ${a.road||'-'} ${a.house_number||''}<br>
      🎯 ${Math.round(acc)} m
      </div>`;
    MY.lat=lat; MY.lon=lon;
  });
}

// 📦 GTFS betöltés (stops + stop_times + trips + routes)
async function loadZIP(){
  let f=document.getElementById('zipInput').files[0];
  if(!f) return alert('Nincs ZIP');
  let zip=await JSZip.loadAsync(f);

  // STOPS
  let sf=Object.keys(zip.files).find(x=>x.includes('stops.txt'));
  let sTxt=await zip.file(sf).async('string');
  let sLines=sTxt.split('\n');
  let sh=parseCSV(sLines[0]);
  let si={id:sh.indexOf('stop_id'),name:sh.indexOf('stop_name'),lat:sh.indexOf('stop_lat'),lon:sh.indexOf('stop_lon')};
  STOPS=[];
  for(let i=1;i<sLines.length;i++){
    let r=parseCSV(sLines[i]); if(r.length<4) continue;
    STOPS.push({id:r[si.id]?.trim(),name:r[si.name],lat:parseFloat(r[si.lat]),lon:parseFloat(r[si.lon])});
  }

  // STOP_TIMES
  let stf=Object.keys(zip.files).find(x=>x.includes('stop_times.txt'));
  if(stf){
    let t=await zip.file(stf).async('string');
    let L=t.split('\n'); let h=parseCSV(L[0]);
    let iTrip=h.indexOf('trip_id'), iArr=h.indexOf('arrival_time'), iStop=h.indexOf('stop_id');
    STOP_TIMES=L.slice(1).map(l=>{let r=parseCSV(l); return {trip_id:r[iTrip]?.trim(),arrival:r[iArr],stop_id:r[iStop]?.trim()}});
  }

  // TRIPS
  let tf=Object.keys(zip.files).find(x=>x.includes('trips.txt'));
  if(tf){
    let t=await zip.file(tf).async('string');
    let L=t.split('\n'); let h=parseCSV(L[0]);
    let iTrip=h.indexOf('trip_id'), iRoute=h.indexOf('route_id'), iHead=h.indexOf('trip_headsign');
    TRIPS=L.slice(1).map(l=>{let r=parseCSV(l); return {trip_id:r[iTrip]?.trim(),route_id:r[iRoute],headsign:r[iHead]}});
  }

  // ROUTES
  let rf=Object.keys(zip.files).find(x=>x.includes('routes.txt'));
  if(rf){
    let t=await zip.file(rf).async('string');
    let L=t.split('\n'); let h=parseCSV(L[0]);
    let iRoute=h.indexOf('route_id'), iShort=h.indexOf('route_short_name'), iLong=h.indexOf('route_long_name');
    ROUTES=L.slice(1).map(l=>{let r=parseCSV(l); return {route_id:r[iRoute],short:r[iShort],long:r[iLong]}});
  }

  alert(`✔ STOPS:${STOPS.length} | ST:${STOP_TIMES.length} | TRIPS:${TRIPS.length} | ROUTES:${ROUTES.length}`);
}

// kereső
function norm(t){return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function search(){
  let q=norm(document.getElementById('q').value);
  let res=STOPS.filter(s=>norm(s.name).includes(q)).slice(0,25);
  document.getElementById('out').innerHTML=res.map(s=>`
    <div class='card' onclick="selectStop('${s.id}')">
      <b>${s.name}</b><br>
      🆔 ${s.id}<br>
      📍 ${s.lat.toFixed(6)}, ${s.lon.toFixed(6)}
    </div>`).join('');
}

// STOP PANEL (route + irány + idő + késés)
function selectStop(id){
  let deps=STOP_TIMES.filter(x=>x.stop_id===id).slice(0,20);
  if(!deps.length){
    document.getElementById('panel').innerHTML="<div class='card'>❌ Nincs menetrend adat</div>";
    return;
  }

  document.getElementById('panel').innerHTML=deps.map(d=>{
    let trip=TRIPS.find(t=>t.trip_id===d.trip_id) || {};
    let route=ROUTES.find(r=>r.route_id===trip.route_id) || {};

    let delay=Math.floor(Math.random()*120-30);
    let cls='white', icon='⚪';
    if(delay<0){cls='red';icon='🔴'}
    if(delay>30){cls='blue';icon='🔵'}

    return `
      <div class='card ${cls}'>
        🚌 <b>${route.short||'?'}</b> → ${trip.headsign||'-'}<br>
        🕒 ${d.arrival}<br>
        ⏱ ${delay>0?'+':''}${delay}s ${icon}
      </div>`;
  }).join('');
}

</script>

</body>
</html>
