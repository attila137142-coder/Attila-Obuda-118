<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FUTÁR V5 REAL GTFS CORE</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #e6f1ff;
    }

    header {
      padding: 16px;
      background: #111826;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2a3a;
    }

    header h1 {
      font-size: 18px;
      margin: 0;
      color: #6cc0ff;
    }

    .container {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 60px);
    }

    .sidebar {
      background: #0f1622;
      padding: 12px;
      border-right: 1px solid #1f2a3a;
      overflow-y: auto;
    }

    .main {
      display: flex;
      flex-direction: column;
    }

    .panel {
      padding: 12px;
      border-bottom: 1px solid #1f2a3a;
    }

    input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #1a2433;
      color: white;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #1f6feb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #388bfd;
    }

    .board {
      padding: 12px;
      overflow-y: auto;
      flex: 1;
    }

    .row {
      display: grid;
      grid-template-columns: 70px 140px 70px 120px 80px 80px;
      padding: 10px;
      border-bottom: 1px solid #1f2a3a;
      font-size: 13px;
    }

    .early { color: red; }
    .late { color: #4aa3ff; }
    .ok { color: #2ecc71; }

    .small {
      font-size: 11px;
      opacity: 0.7;
    }

    #clock {
      font-family: monospace;
    }
  </style>
</head>
<body>

<header>
  <h1>🚍 FUTÁR V5 REAL GTFS CORE</h1>
  <div id="clock"></div>
</header>

<div class="container">

  <div class="sidebar">
    <input id="stopInput" placeholder="Megálló (pl. Deák Ferenc tér)" />
    <button onclick="loadDepartures()">Keresés</button>

    <div class="panel small">
      GTFS DEMO MODE ACTIVE (LOGICAL SIMULATION)
    </div>
  </div>

  <div class="main">
    <div class="panel"><b>Indulási tábla</b></div>
    <div class="board" id="board"></div>
  </div>

</div>

<script>

// ---------------- VEHICLES ----------------
const vehicles = [
  { id: "bus_12", plate: "BKK-123", ford: "F12" },
  { id: "m3_01", plate: "MTR-301", ford: "M3-01" },
  { id: "hev_5", plate: "HEV-005", ford: "H5-7" }
];

function randomVehicle() {
  return vehicles[Math.floor(Math.random() * vehicles.length)];
}

// ---------------- GTFS SIM ----------------
function generateDepartures() {
  const routes = ["M1", "M2", "M3", "4-6", "7", "9", "H5"];
  const list = [];

  for (let i = 0; i < 25; i++) {
    const v = randomVehicle();
    const route = routes[Math.floor(Math.random() * routes.length)];

    const now = new Date();
    const sec = now.getSeconds();
    const min = (now.getMinutes() + i) % 60;

    const delaySec = Math.floor(Math.random() * 120 - 40);

    list.push({
      route,
      vehicle: v.plate,
      internal: v.id,
      ford: v.ford,
      time: `${String(now.getHours()).padStart(2,"0")}:${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`,
      delaySec
    });
  }

  return list;
}

let data = [];

function formatDelay(sec) {
  const abs = Math.abs(sec);
  const m = Math.floor(abs / 60);
  const s = abs % 60;
  return `${m}p ${s}mp`;
}

function renderBoard(list) {
  const board = document.getElementById("board");
  board.innerHTML = "";

  list.slice(0, 15).forEach(d => {

    let cls = "ok";
    if (d.delaySec < 0) cls = "early";
    else if (d.delaySec > 60) cls = "late";

    board.innerHTML += `
      <div class="row">
        <div><b>${d.route}</b></div>
        <div>${d.vehicle}<br><span class='small'>${d.internal}</span></div>
        <div>${d.ford}</div>
        <div>${d.time}</div>
        <div class="${cls}">${formatDelay(d.delaySec)}</div>
        <div class="${cls}">${d.delaySec} mp</div>
      </div>
    `;
  });
}

function loadDepartures() {
  data = generateDepartures();
  renderBoard(data);
}

// CLOCK
function updateClock() {
  const now = new Date();
  document.getElementById("clock").innerText = now.toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

setInterval(() => {
  if (data.length) {
    data = generateDepartures();
    renderBoard(data);
  }
}, 7000);

</script>

</body>
</html>
