<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Attila GTFS PRO V16 AUTO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{font-family:Arial;margin:0;background:#0f172a;color:#e2e8f0}
header{padding:10px;background:#111827;position:sticky;top:0}
button,input{padding:6px;margin:5px;border-radius:6px;border:0}
.card{background:#111827;padding:10px;margin:10px;border-radius:8px}
small{opacity:.7}
</style>
</head>
<body>
<header>
<b>🚀 GTFS PRO V16 AUTO</b><br>
<input type="file" id="zipInput" accept=".zip" />
<button onclick="loadGTFS()">📦 Manual GTFS</button>
<button onclick="autoLoadGTFS()">⚡ AUTO GTFS</button>
<button onclick="startGPS()">📍 GPS</button>
<input id="search" placeholder="Megálló kereső..." oninput="searchStops()" />
</header>

<div class="card">
<b>📍 GPS + Sebesség</b>
<div id="gps">-</div>
<div id="speed">0 km/h (0 m/s)</div>
</div>

<div class="card">
<b>🚏 Megállók</b>
<div id="nearest">-</div>
</div>

<div class="card">
<b>🔎 Keresés</b>
<div id="results"></div>
</div>

<div class="card">
<b>📌 Környékbeli POI</b>
<div id="poi">-</div>
</div>

<script>
let GTFS={stops:[]};
let userLat=null,userLon=null;
let history=[];

// ================= AUTO GTFS =================
async function autoLoadGTFS(){
  try{
    alert("⚡ GTFS AUTO letöltés indul...");

    // Alap BKK GTFS (ha nem működik CORS miatt, fallback kell)
    const url="https://bkk.hu/gtfs/budapest_gtfs.zip";

    const res=await fetch(url);
    const blob=await res.blob();

    const zip=await JSZip.loadAsync(blob);

    const txt=await zip.file("stops.txt").async("string");

    GTFS.stops=Papa.parse(txt,{header:true}).data
      .filter(s=>s.stop_lat && s.stop_lon);

    alert("✔ AUTO GTFS kész: "+GTFS.stops.length);

  }catch(e){
    console.error(e);
    alert("❌ AUTO GTFS nem sikerült (CORS vagy hálózat)");
  }
}

// ================= MANUAL =================
async function loadGTFS(){
  const file=document.getElementById("zipInput").files[0];
  if(!file || !file.name.endsWith(".zip")){
    alert("❗ ZIP kell");
    return;
  }

  const zip=await JSZip.loadAsync(file);
  const txt=await zip.file("stops.txt").async("string");

  GTFS.stops=Papa.parse(txt,{header:true}).data
    .filter(s=>s.stop_lat && s.stop_lon);

  alert("✔ Manual GTFS: "+GTFS.stops.length);
}

// ================= GPS =================
function startGPS(){
  navigator.geolocation.watchPosition(async pos=>{
    const lat=pos.coords.latitude;
    const lon=pos.coords.longitude;
    const t=Date.now();

    userLat=lat; userLon=lon;

    document.getElementById("gps").innerHTML=
      `${lat.toFixed(5)}, ${lon.toFixed(5)}`;

    history.push({lat,lon,t});
    if(history.length>5) history.shift();

    let speedMs=0;
    if(history.length>=2){
      let d=0,dt=0;
      for(let i=1;i<history.length;i++){
        const a=history[i-1];
        const b=history[i];
        d+=haversine(a.lat,a.lon,b.lat,b.lon);
        dt+=(b.t-a.t)/1000;
      }
      speedMs=dt>0?d/dt:0;
    }

    if(speedMs<0.5) speedMs=0;

    document.getElementById("speed").innerHTML=
      `🚀 ${(speedMs*3.6).toFixed(1)} km/h (${speedMs.toFixed(2)} m/s)`;

    findNearest();
    loadPOI();

  },null,{enableHighAccuracy:true});
}

// ================= DIST =================
function haversine(lat1,lon1,lat2,lon2){
  const R=6371000;
  const toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1);
  const dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+
    Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ================= NEAREST =================
function findNearest(){
  if(!userLat) return;

  const list=GTFS.stops
    .map(s=>{
      const d=haversine(userLat,userLon,+s.stop_lat,+s.stop_lon);
      return {...s,dist:d};
    })
    .filter(s=>s.dist<2000)
    .sort((a,b)=>a.dist-b.dist)
    .slice(0,6);

  document.getElementById("nearest").innerHTML=
    list.map(s=>`🚏 <b>${s.stop_name}</b><br>🆔 ${s.stop_id}<br>📏 ${Math.round(s.dist)} m<hr>`).join("");
}

// ================= POI =================
async function loadPOI(){
  if(!userLat) return;

  const q=`[out:json];node(around:500,${userLat},${userLon})["amenity"];out;`;

  try{
    const res=await fetch("https://overpass-api.de/api/interpreter",{
      method:"POST",
      body:q
    });

    const data=await res.json();

    document.getElementById("poi").innerHTML=
      data.elements.slice(0,8).map(p=>{
        const d=haversine(userLat,userLon,p.lat,p.lon);
        return `📍 <b>${p.tags.name||"POI"}</b><br>📏 ${Math.round(d)} m<br>📍 ${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}<hr>`;
      }).join("");

  }catch{
    document.getElementById("poi").innerText="POI hiba";
  }
}

// ================= SEARCH =================
function similarity(a,b){
  let c=0;
  for(let i=0;i<b.length;i++) if(a.includes(b[i])) c++;
  return c/a.length;
}

function searchStops(){
  const q=document.getElementById("search").value.toLowerCase();
  if(q.length<2) return;

  const res=GTFS.stops
    .map(s=>{
      const d=userLat?haversine(userLat,userLon,+s.stop_lat,+s.stop_lon):null;
      const sim=similarity(s.stop_name.toLowerCase(),q);
      return {...s,dist:d,sim};
    })
    .filter(s=>s.sim>0.3)
    .sort((a,b)=>(a.dist||999999)-(b.dist||999999))
    .slice(0,20);

  document.getElementById("results").innerHTML=
    res.map(s=>`🚏 <b>${s.stop_name}</b><br>🆔 ${s.stop_id}<br>${s.dist?"📏 "+Math.round(s.dist)+" m":""}<hr>`).join("");
}
</script>
</body>
</html>
