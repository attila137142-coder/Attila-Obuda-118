// =====================================
// GPS MOTOR
// =====================================


let myLatitude=null;

let myLongitude=null;

let myAccuracy=null;




function startGPS(){



if(!navigator.geolocation){


document
.getElementById("gpsStatus")
.innerHTML=
"Nem támogatott";


return;

}




navigator.geolocation.watchPosition(



function(position){



myLatitude =
position.coords.latitude;



myLongitude =
position.coords.longitude;



myAccuracy =
position.coords.accuracy;



document
.getElementById("lat")
.innerHTML =
myLatitude.toFixed(6);



document
.getElementById("lon")
.innerHTML =
myLongitude.toFixed(6);



document
.getElementById("accuracy")
.innerHTML =
Math.round(myAccuracy)
+" m";




let gpsText="🟢 Jó";



if(myAccuracy<15){

gpsText="🟢 Kiváló";

}

else if(myAccuracy<50){

gpsText="🟡 Elfogadható";

}

else{

gpsText="🔴 Gyenge";

}



document
.getElementById("gpsStatus")
.innerHTML =
gpsText;



document
.querySelector(".status")
.innerHTML=
"🟢 GPS aktív";



},



function(){


document
.querySelector(".status")
.innerHTML=
"🔴 GPS hiba";


},



{


enableHighAccuracy:true,

maximumAge:3000,

timeout:10000


}


);



}







// =====================================
// LÉGVONAL TÁVOLSÁG
// =====================================



function distanceKm(

lat1,
lon1,
lat2,
lon2

){



let R=6371;



let dLat =
(lat2-lat1)
*Math.PI/180;



let dLon =
(lon2-lon1)
*Math.PI/180;



let a =

Math.sin(dLat/2)
*
Math.sin(dLat/2)

+

Math.cos(lat1*Math.PI/180)
*
Math.cos(lat2*Math.PI/180)
*
Math.sin(dLon/2)
*
Math.sin(dLon/2);



let c =
2 *
Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);



return R*c;


}







// =====================================
// MEGÁLLÓ KERESŐ MOTOR
// név + GTFS ID
// =====================================



function searchStop(query){



query =
query
.toLowerCase()
.trim();



return AttilaTransitDB.stops.filter(stop=>



stop.name
.toLowerCase()
.includes(query)



||



stop.id
.toLowerCase()
.includes(query)



);


}







// =====================================
// MODUL 09
// MEGÁLLÓ MENETREND MOTOR
// =====================================



function searchStopSchedule(){



let query =
document
.getElementById("stopSearch")
.value;



let result =
searchStop(query);



let box =
document
.getElementById("schedulePanel");



let html="";




if(result.length===0){


box.innerHTML=
"❌ Nincs találat";


return;


}




result.forEach(stop=>{



html+=`

<div class="card">


<b>🚏 ${stop.name}</b><br>


GTFS ID:
${stop.id}


<br>

Üzemeltető:
${stop.operator}


<br><br>

`;



stop.schedule.forEach(item=>{



html+=`

<hr>

🚌 ${item.route}

<br>

➡ ${item.direction}

<br>

Indulások:

<br>

${item.times.join(" | ")}


<br>


`;



});



html+="</div>";



});



box.innerHTML=html;



}
