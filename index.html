<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Budapest Control Room V5 DEMO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; display:flex; height:100vh; font-family:Arial; }

#panel {
  width:380px;
  background:#031814;
  color:white;
  display:flex;
  flex-direction:column;
}

#header {
  padding:10px;
  font-weight:bold;
  border-bottom:1px solid rgba(255,255,255,0.2);
}

#list {
  flex:1;
  overflow:auto;
  padding:8px;
}

.row {
  display:flex;
  justify-content:space-between;
  padding:6px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  font-size:13px;
}

.badge {
  font-size:10px;
  background:#222;
  padding:2px 5px;
  border-radius:4px;
}

.green { color:#7CFF7C; }
.red { color:#ff4d4d; font-weight:bold; }
.blue { color:#4da6ff; font-weight:bold; }

#map { flex:1; }
</style>
</head>

<body>

<div id="panel">
  <div id="header">🚍 V5 DEMO – Nád utca + Békásmegyer HÉV</div>
  <div id="list"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* 🗺️ MAP */
const map = L.map('map').setView([47.53, 19.05], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'OSM'
}).addTo(map);

/* 🚏 DEMO STOPS (CONTROLLED NETWORK) */

const stops = [
  {id:"BKS", name:"Békásmegyer HÉV", lat:47.5410, lon:19.0450, zone:"north"},
  {id:"NUT", name:"Nád utca", lat:47.4100, lon:19.0800, zone:"south"},
  {id:"KAP", name:"Kaszásdűlő", lat:47.5350, lon:19.0600, zone:"corridor"},
  {id:"OBU", name:"Óbuda", lat:47.5300, lon:19.0350, zone:"corridor"}
];

/* 🚍 DEMO ROUTES */

const routes = [
  {
    id:"243",
    name:"243 busz",
    path:["NUT","KAP","OBU","BKS"],
    type:"bus"
  },
  {
    id:"H5",
    name:"HÉV",
    path:["BKS","OBU","KAP"],
    type:"hev"
  }
];

/* 🚍 VEHICLES (TRIP STATE, NOT RANDOM) */

let vehicles = routes.map(r=>({

  id:r.id,
  route:r.name,
  path:r.path,
  index:0,
  delay:(Math.random()*40-20)
}));

let markers = {};

/* 🧠 FORMAT */

function format(d){

  const m = Math.floor(Math.abs(d)/60);

  if(d > 10) return `<span class="blue">+${m}p</span>`;
  if(d < -10) return `<span class="red">-${m}p</span>`;
  return `<span class="green">ON TIME</span>`;
}

/* 📋 PANEL */

function renderPanel(){

  let html = "";

  vehicles.forEach(v=>{

    const nextStop = v.path[v.index % v.path.length];

    html += `
      <div class="row">
        <div>${v.route}<span class="badge">DEMO</span></div>
        <div>${nextStop}</div>
        <div>${format(v.delay)}</div>
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

/* 🗺️ MAP SNAP LOGIC */

function update(){

  vehicles.forEach(v=>{

    const stopId = v.path[v.index % v.path.length];
    const stop = stops.find(s=>s.id===stopId);

    if(!stop) return;

    v.index += 0.02;

    if(!markers[v.id]){
      markers[v.id] = L.circleMarker([stop.lat,stop.lon],{
        radius:7,
        color:"#ff5555"
      }).addTo(map).bindPopup(v.route);
    } else {
      markers[v.id].setLatLng([stop.lat,stop.lon]);
    }

    v.delay += (Math.random()*3 - 1.5);
  });
}

/* LOOP */

function tick(){
  update();
  renderPanel();
}

setInterval(tick,1000);
tick();

</script>

</body>
</html>
