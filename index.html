<script>


// ===============================
// ÓRA + DÁTUM
// ===============================


function ora(){


let d=new Date();



let napok=[

"Vasárnap",
"Hétfő",
"Kedd",
"Szerda",
"Csütörtök",
"Péntek",
"Szombat"

];



document.getElementById("clock").innerHTML=

d.toLocaleTimeString("hu-HU");



document.getElementById("date").innerHTML=

d.getFullYear()
+". "
+
String(d.getMonth()+1).padStart(2,"0")
+". "
+
String(d.getDate()).padStart(2,"0")
+" "
+
napok[d.getDay()];

}



setInterval(ora,1000);

ora();




// későbbi modulhelyek


function mutatTerkepek(){

alert("🗺 Térkép modul következik");

}


function mutatMenetrend(){

alert("🚍 Menetrend modul következik");
