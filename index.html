<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V5 Unified Engine</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b1220;
  color:#e2e8f0;
}

.container {
  max-width:900px;
  margin:auto;
  padding:20px;
}

h1 { color:#38bdf8; }

input {
  width:100%;
  padding:12px;
  font-size:16px;
  border-radius:8px;
  border:none;
  margin-top:10px;
}

button {
  margin-top:10px;
  padding:10px 15px;
  background:#22c55e;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.card {
  margin-top:15px;
  background:#1e293b;
  padding:15px;
  border-radius:10px;
}

.row {
  padding:5px 0;
  border-bottom:1px solid #334155;
}

.badge {
  display:inline-block;
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  margin-right:5px;
}

.volan { background:#f59e0b; color:black; }
.mav { background:#a78bfa; color:black; }
.bkk { background:#38bdf8; color:black; }

.fallback {
  color:#f87171;
}
</style>
</head>

<body>

<div class="container">

<h1>🚍 FUTÁR V5 Unified Engine</h1>

<input id="stopId" placeholder="Stop ID (pl: 773012, 005546862, 049892)" />
<button onclick="run()">Lekérdezés</button>

<div id="out"></div>

</div>

<script>

// ---------------- USER LOCATION ----------------
let userLat = 47.4979;
let userLon = 19.0402;

navigator.geolocation?.getCurrentPosition(pos=>{
  userLat = pos.coords.latitude;
  userLon = pos.coords.longitude;
});

// ---------------- NETWORK DETECTION ----------------
function detectNetwork(id){
  if(id.includes("_")) return "VOLAN";
  if(id.length > 6) return "MAV";
  return "BKK";
}

// ---------------- STOP NAME RESOLVER ----------------
function resolveStopName(id){

  const base = id.split("_")[0];

  const names = {
    "773012": "VOLÁN autóbusz-állomás (demo)",
    "005546862": "MÁV vasútállomás (demo)",
    "049892": "Május 9. park",
    "049898": "Népfürdő utca / Árpád híd"
  };

  return names[base] || "Ismeretlen megálló / állomás";
}

// ---------------- STOP DATABASE ----------------
function getStopData(id){

  const base = id.split("_")[0];

  const db = {
    "773012": {
      lines: ["1010", "1012", "1020"],
      lat: 47.650120,
      lon: 19.120300
    },

    "005546862": {
      lines: ["IC 745", "S80", "Z70"],
      lat: 47.500120,
      lon: 19.080900
    },

    "049892": {
      lines: ["226", "34", "106"],
      lat: 47.541231,
      lon: 19.047812
    }
  };

  return db[base] || {
    lines: ["Nincs adat"],
    lat: 47.4979,
    lon: 19.0402
  };
}

// ---------------- DISTANCE ----------------
function distance(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLon = (lon2-lon1)*Math.PI/180;

  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)**2;

  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ---------------- MATRIX ----------------
function buildMatrix(lines){
  return lines.map(l=>{
    const t = Math.floor(Math.random()*20)+1;
    const st = Math.random()>0.7 ? "DELAY" : "ON TIME";
    return `🚍 ${l} | → | ${t}p | ${st}`;
  }).join("<br>");
}

// ---------------- MAIN ----------------
function run(){

  const id = document.getElementById("stopId").value.trim();
  if(!id) return;

  const net = detectNetwork(id);
  const stop = getStopData(id);

  const name = resolveStopName(id);

  const dist = distance(userLat, userLon, stop.lat, stop.lon);
  const hundredth = Math.round(dist * 100);

  let badge = net==="VOLAN"?"volan":net==="MAV"?"mav":"bkk";

  let html = `
    <div class="card">

      <span class="badge ${badge}">${net}</span>
      <b>${name}</b>

      <h3>📊 FUTÁR MÁTRIX</h3>
      <div class="card">
        ${buildMatrix(stop.lines)}
      </div>

      <h3>📍 Koordináták</h3>
      <div class="card">
        Lat: ${stop.lat.toFixed(6)}<br>
        Lon: ${stop.lon.toFixed(6)}
      </div>

      <h3>📏 Távolság tőled</h3>
      <div class="card">
        🚶 ${dist.toFixed(2)} km<br>
        📐 ${hundredth} század km<br>
        📍 ~${Math.round(dist*1000)} m
      </div>

      <div class="fallback">
        STABLE MODE: fallback engine aktív (GTFS nélkül is működik)
      </div>

    </div>
  `;

  document.getElementById("out").innerHTML = html;
}

</script>

</body>
</html>
