<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATTILA PRO STABLE ENGINE</title>
<style>
body{font-family:Arial;background:#0b1220;color:#fff;padding:15px}
button{padding:10px;border:none;border-radius:8px;margin:5px;background:#22c55e;color:#fff;font-weight:bold}
input{padding:10px;border-radius:8px;width:80%}
.card{background:#1e293b;padding:10px;border-radius:10px;margin-top:10px}
</style>
</head>
<body>

<h1>🚀 ATTILA PRO STABLE ENGINE</h1>

<button onclick="getLocation()">📍 Saját hely</button>
<input id="q" placeholder="Megálló keresés...">
<button onclick="search()">🔍</button>

<div id="zone"></div>
<div id="me"></div>
<div id="out"></div>

<script>

let STOPS=[];
let MY={lat:null,lon:null};

// 🔥 ZÓNA ADAT (LIGHT!)
const ZONES={
  budapest:[
    {id:"F011",name:"Nád utca",lat:47.55,lon:19.10},
    {id:"F012",name:"Cinkota H",lat:47.52,lon:19.22}
  ],
  dunakanyar:[
    {id:"D001",name:"Szentendre",lat:47.66,lon:19.07},
    {id:"D002",name:"Vác",lat:47.78,lon:19.13}
  ]
};

// 📍 HELY
function getLocation(){
  navigator.geolocation.getCurrentPosition(pos=>{
    MY.lat=pos.coords.latitude;
    MY.lon=pos.coords.longitude;

    document.getElementById('me').innerHTML=`
    <div class='card'>📍 ${MY.lat.toFixed(6)}, ${MY.lon.toFixed(6)}</div>`;

    detectZone();
  });
}

// 🧠 ZÓNA FELISMERÉS
function detectZone(){

  if(MY.lat>47.6){
    STOPS=ZONES.dunakanyar;
    document.getElementById('zone').innerHTML="🟡 Dunakanyar mód";
  }else{
    STOPS=ZONES.budapest;
    document.getElementById('zone').innerHTML="🟢 Budapest mód";
  }
}

// 🔍 KERESÉS
function search(){

  let q=document.getElementById('q').value.toLowerCase();

  let res=STOPS.filter(s=>s.name.toLowerCase().includes(q));

  document.getElementById('out').innerHTML=res.map(s=>{

    let d = MY.lat ? distance(MY.lat,MY.lon,s.lat,s.lon) : 0;

    return `
      <div class='card'>
        <b>${s.name}</b><br>
        🆔 ${s.id}<br>
        📏 ${Math.round(d)} m / ${(d/1000).toFixed(2)} km
      </div>`;

  }).join('');
}

// 📏 TÁVOLSÁG
function distance(a,b,c,d){
  const R=6371000;
  const toRad=x=>x*Math.PI/180;
  let dLat=toRad(c-a);
  let dLon=toRad(d-b);
  let A=Math.sin(dLat/2)**2+
    Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(A),Math.sqrt(1-A));
}

</script>

</body>
</html>
