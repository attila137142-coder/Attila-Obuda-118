<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Attila Közlekedés Control V2.1
Responsive Hybrid Dispatch Wall
</title>


<style>


*{
box-sizing:border-box;
}



body{

margin:0;

width:100vw;

min-height:100vh;

background:#020405;


font-family:
"Courier New",
monospace;


display:flex;

align-items:center;

justify-content:center;


color:white;


overflow:hidden;

}




/* =================================
   FŐ FALIKIJELZŐ
================================= */


.dispatch-wall{


width:96vw;

height:92vh;


max-width:1750px;


background:


radial-gradient(
ellipse at center,
rgba(0,255,180,.08),
transparent 70%
),


#050909;



border:5px solid #123b42;


border-radius:35px;


padding:25px;


position:relative;


box-shadow:


0 0 70px rgba(0,255,180,.25),

inset 0 0 80px rgba(0,255,180,.15);


}






/* =================================
   FELSŐ ÁLLAPOT
================================= */


.status-bar{


height:85px;


display:flex;


align-items:center;


justify-content:space-around;


background:#071010;


border:2px solid #164850;


border-radius:18px;



font-size:30px;


font-weight:900;



}



.status-item{

padding:10px;

}



.green{

color:#00ff66;

text-shadow:
0 0 15px #00ff66;

}


.blue{

color:#00c8ff;

text-shadow:
0 0 15px #00c8ff;

}


.yellow{

color:#ffe600;

text-shadow:
0 0 15px #ffe600;

}


.red{

color:#ff3030;

text-shadow:
0 0 15px #ff3030;

}






/* =================================
   ÓRA RÉSZ
================================= */



.clock-area{


height:55%;


display:flex;

align-items:center;

justify-content:center;


}




.clock-panel{


width:90%;


height:85%;


border-radius:30px;



display:flex;

flex-direction:column;


justify-content:center;

align-items:center;


background:

radial-gradient(
circle,
rgba(0,255,180,.12),
transparent 70%
),


#020707;



border:5px solid #174c55;



position:relative;


}






.clock-date{


font-size:70px;


font-weight:900;


letter-spacing:10px;


margin-bottom:30px;


color:#ff9900;


text-shadow:

0 0 15px #ff9900;

}




.clock-time{


font-size:185px;


font-weight:900;


letter-spacing:18px;


color:#00ff66;


text-shadow:

0 0 20px #00ff66,

0 0 60px rgba(0,255,100,.8);


}






/* NORMAL */


.normal{

border-color:#00ff66!important;

}



.normal .clock-time{

color:#00ff66;

}




/* MATRIX */


.matrix{

border-color:#197080!important;

}



.matrix .clock-date{

color:#ff3030;

}



.matrix .clock-time{

color:#ffe600;


text-shadow:

0 0 20px #ffe600,

0 0 60px rgba(255,220,0,.8);


}





/* ALERT */


.alert{


border-color:#ff0000!important;


background:


radial-gradient(
circle,
rgba(255,0,0,.20),
transparent 70%
),


#100000;


}



.alert .clock-date{

color:#ff3030;

}



.alert .clock-time{

color:#ff0000;


}





.warning{


display:none;


position:absolute;


right:35px;


top:25px;


font-size:28px;


font-weight:900;


color:#ff3030;


}



.alert .warning{

display:block;

}

/* =================================
   ALSÓ LIVE DISZPÉCSER SÁV
================================= */


.live-area{


height:170px;


display:flex;


gap:20px;


margin-top:10px;


}




.live-box{


flex:1;


background:#071010;


border:3px solid #164850;


border-radius:18px;


padding:15px;


box-shadow:

inset 0 0 25px rgba(0,255,180,.12);


}



.live-title{


font-size:28px;


font-weight:900;


color:#00eaff;


margin-bottom:10px;


}



.live-data{


font-size:22px;


font-weight:bold;


line-height:1.4;


}





/* =================================
   VEZÉRLŐGOMBOK
================================= */


.controls{


position:absolute;


bottom:15px;


left:50%;


transform:translateX(-50%);


}



button{


font-family:
"Courier New",
monospace;


font-size:24px;


font-weight:900;


padding:12px 30px;


margin:5px;


border-radius:15px;


background:#071010;


color:white;


border:3px solid #00eaff;


}




/* =================================
   IPHONE XR / MOBIL MÓD
================================= */


@media(max-width:600px){



body{


overflow:auto;


align-items:flex-start;


padding:10px;


}




.dispatch-wall{


width:100%;


height:auto;


min-height:100vh;


padding:12px;


border-radius:20px;


}





.status-bar{


height:auto;


display:flex;


flex-wrap:wrap;


font-size:15px;


padding:8px;


}




.status-item{


padding:5px;


}




.clock-area{


height:auto;


padding:15px 0;


}




.clock-panel{


width:100%;


height:auto;


min-height:260px;


padding:20px;


}




.clock-date{


font-size:28px;


letter-spacing:2px;


margin-bottom:15px;


}




.clock-time{


font-size:72px;


letter-spacing:5px;


}






.live-area{


height:auto;


display:block;


}



.live-box{


margin-bottom:12px;


}




.live-title{


font-size:22px;


}



.live-data{


font-size:18px;


}






.warning{


font-size:15px;


right:10px;


top:10px;


}




.controls{


position:relative;


bottom:auto;


left:auto;


transform:none;


text-align:center;


margin-top:15px;


}



button{


font-size:16px;


padding:8px 15px;


}





}

</style>



</head>


<body>



<div class="dispatch-wall">



<!-- FELSŐ ÁLLAPOTSÁV -->


<div class="status-bar">


<div class="status-item green">

🟢 GPS

</div>


<div class="status-item green">

🟢 GTFS

</div>


<div class="status-item blue">

📡 REALTIME

</div>


<div class="status-item yellow">

🚆 MÁV

</div>


<div class="status-item blue">

🚍 VOLÁN

</div>


<div class="status-item green">

🚋 BKK

</div>



</div>






<!-- ÓRA -->


<div class="clock-area">


<div id="clockPanel"
class="clock-panel matrix">



<div class="warning">

⚠ RENDSZER FIGYELMEZTETÉS

</div>



<div id="date"
class="clock-date">

</div>



<div id="time"
class="clock-time">

</div>



</div>


</div>








<!-- LIVE PANELEK -->


<div class="live-area">



<div class="live-box">

<div class="live-title">

🚆 MÁV LIVE

</div>


<div class="live-data">

70-es vonal<br>

Budapest → Szob<br>

<span class="green">

ONLINE

</span>

</div>


</div>







<div class="live-box">

<div class="live-title">

🚍 VOLÁN LIVE

</div>


<div class="live-data">

GTFS:<br>

61921 megálló<br>

<span class="green">

AKTÍV

</span>

</div>


</div>







<div class="live-box">

<div class="live-title">

🚋 BKK LIVE

</div>


<div class="live-data">

FUTÁR<br>

<span class="green">

ONLINE

</span>

</div>


</div>







<div class="live-box">

<div class="live-title">

📡 REALTIME

</div>


<div class="live-data">

GTFS CONNECTOR<br>

<span class="blue">

READY

</span>

</div>


</div>



</div>








<!-- GOMBOK -->


<div class="controls">


<button onclick="setMode('normal')">

🟢 NORMAL

</button>


<button onclick="setMode('matrix')">

🌙 MATRIX

</button>


<button onclick="setMode('alert')">

🔴 ALERT

</button>


</div>



</div>








<script>


// =================================
// STABIL ÓRA MOTOR
// =================================


let lastSecond=-1;



function updateClock(){


let now=new Date();


let sec=now.getSeconds();



if(sec!==lastSecond){


lastSecond=sec;



let napok=[

"VASÁRNAP",
"HÉTFŐ",
"KEDD",
"SZERDA",
"CSÜTÖRTÖK",
"PÉNTEK",
"SZOMBAT"

];



document.getElementById("date").innerHTML=


now.getFullYear()
+". "
+
String(now.getMonth()+1).padStart(2,"0")
+". "
+
String(now.getDate()).padStart(2,"0")
+
" "
+
napok[now.getDay()];




document.getElementById("time").innerHTML=


String(now.getHours()).padStart(2,"0")
+
":"
+
String(now.getMinutes()).padStart(2,"0")
+
":"
+
String(sec).padStart(2,"0");



}



requestAnimationFrame(updateClock);



}


updateClock();






// =================================
// MÓDVÁLTÁS
// =================================


function setMode(mode){


document.getElementById(
"clockPanel"
).className=

"clock-panel "+mode;


}



</script>



</body>

</html>
