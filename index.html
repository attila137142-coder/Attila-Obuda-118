<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FULL HUNGARY CORE ENGINE V4 - LIVE DISPATCH</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{margin:0;font-family:Arial;display:flex;height:100vh}
#sidebar{width:380px;padding:10px;overflow:auto;border-right:1px solid #ccc}
#map{flex:1}
.card{background:#f4f4f4;padding:8px;margin:6px 0;border-radius:8px}
.stop{padding:6px;border-bottom:1px solid #eee;cursor:pointer}
.stop:hover{background:#eee}
input,button{width:100%;padding:8px;margin:4px 0}
#status{font-size:12px;margin-bottom:8px}
</style>
</head>
<body>

<div id="sidebar">
<h3>🚆 V4 LIVE DISPATCH ENGINE</h3>
<div id="status">INIT...</div>

<input type="file" id="zip" multiple />
<button onclick="importAll()">📦 GTFS IMPORT + MERGE</button>
<button onclick="restore()">♻ AUTO RESTORE</button>
<button onclick="clearDB()">🗑 RESET CORE</button>

<input id="search" placeholder="Fuzzy keresés..." />
<div id="list"></div>

<hr>
<div id="panel"></div>
</div>

<div id="map"></div>

<script>

const map = L.map('map').setView([47.5,19.04],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let db;
let GLOBAL_STOPS=[];
let VEHICLES=[];

// ================= DB =================
function initDB(){
  return new Promise(res=>{
    const req=indexedDB.open("HUNGARY_CORE_V4",1);
    req.onupgradeneeded=e=>{
      db=e.target.result;
      db.createObjectStore("gtfs",{keyPath:"id"});
    };
    req.onsuccess=e=>{db=e.target.result;res();};
  });
}

function save(id,data){
  const tx=db.transaction("gtfs","readwrite");
  tx.objectStore("gtfs").put({id,data});
}

function getAll(){
  return new Promise(r=>{
    const tx=db.transaction("gtfs","readonly");
    const req=tx.objectStore("gtfs").getAll();
    req.onsuccess=()=>r(req.result);
  });
}

function clearDB(){
  const tx=db.transaction("gtfs","readwrite");
  tx.objectStore("gtfs").clear();
  location.reload();
}

// ================= FUZZY =================
function norm(t){
  return (t||"")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");
}

function search(q){
  q=norm(q);
  return GLOBAL_STOPS.filter(s=>
    norm(s.name).includes(q) ||
    norm(s.gtfs).includes(q)
  );
}

// ================= MERGE =================
function mergeStops(stops){
  stops.forEach(s=>{
    const exists = GLOBAL_STOPS.find(x=>
      Math.hypot(x.lat-s.lat,x.lon-s.lon)<0.0005
    );
    if(!exists) GLOBAL_STOPS.push(s);
  });
}

// ================= IMPORT =================
async function importZip(file){
  const zip=await JSZip.loadAsync(file);
  const text=await zip.file("stops.txt")?.async("string");
  if(!text) return;

  const lines=text.split(/\n/).slice(1);
  const stops=lines.map(l=>{
    const c=l.split(",");
    return {
      id:c[0],name:c[2],lat:+c[4],lon:+c[5]
    };
  });

  mergeStops(stops);
  save(Date.now(),{stops});
  render();
}

async function importAll(){
  const files=document.getElementById('zip').files;
  for(const f of files) await importZip(f);
}

// ================= RESTORE =================
async function restore(){
  const data=await getAll();
  data.forEach(d=>mergeStops(d.data.stops||[]));
  render();
}

// ================= RENDER =================
let markers=[];
function render(){
  document.getElementById('status').innerText="STOPS: "+GLOBAL_STOPS.length;

  markers.forEach(m=>map.removeLayer(m));
  markers=[];

  GLOBAL_STOPS.forEach(s=>{
    const m=L.circleMarker([s.lat,s.lon],{radius:4}).addTo(map);
    markers.push(m);
  });
}

// ================= SEARCH =================
search.oninput=e=>{
  const res=search(e.target.value).slice(0,50);
  const list=document.getElementById('list');
  list.innerHTML="";

  res.forEach(s=>{
    const d=document.createElement('div');
    d.className="stop";
    d.innerText=s.name;
    d.onclick=()=>openStop(s);
    list.appendChild(d);
  });
};

// ================= STOP PANEL =================
function openStop(s){
  document.getElementById('panel').innerHTML=
  `<div class='card'>
  <b>${s.name}</b><br>
  🆔 ${s.id}<br>
  📍 ${s.lat}, ${s.lon}<br>
  <hr>
  🚌 LIVE DISPATCH: simulating...
  </div>`;
}

// ================= VEHICLE SIM =================
setInterval(()=>{
  VEHICLES.forEach(v=>map.removeLayer(v));
  VEHICLES=[];

  for(let i=0;i<5;i++){
    const s=GLOBAL_STOPS[Math.floor(Math.random()*GLOBAL_STOPS.length)];
    const m=L.circleMarker([s.lat,s.lon],{radius:6,color:'red'}).addTo(map);
    VEHICLES.push(m);
  }
},4000);

// ================= INIT =================
(async()=>{
  await initDB();
  await restore();
})();

</script>

</body>
</html>
