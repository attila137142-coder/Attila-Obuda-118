<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🆘 ESCAPE ROUTE SYSTEM</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b0f14;
  color:#e6e6e6;
}

header {
  padding:10px;
  background:#111826;
  display:flex;
  justify-content:space-between;
}

#map { height:60vh; }

.panel { padding:10px; }

.card {
  background:#111826;
  padding:10px;
  margin-bottom:10px;
  border-left:3px solid #ff5252;
}
button {
  padding:10px;
  background:#ff5252;
  border:none;
  cursor:pointer;
  color:white;
}
</style>
</head>

<body>

<header>
  <div>🆘 ESCAPE ROUTE SYSTEM</div>
  <div id="status">READY</div>
</header>

<div id="map"></div>

<div class="panel">
  <button onclick="escapeRoute()">🧭 Find Escape Route</button>
  <div id="output"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// 🗺 MAP
const map = L.map('map').setView([47.4979, 19.0402], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OSM'
}).addTo(map);

// 🧭 SAFETY POI DATABASE
const safePoints = [
  { name:"Budakeszi", type:"town", coords:[47.510,18.927] },
  { name:"Normafa busz", type:"bus", coords:[47.503,19.012] },
  { name:"Kaán Károly turistaház", type:"hut", coords:[47.518,18.960] },
  { name:"Farkasrét", type:"town", coords:[47.482,19.002] },
  { name:"Hűvösvölgy", type:"hub", coords:[47.541,18.956] }
];

// 📏 DISTANCE
function distance(a,b){
  const R=6371000;
  const dLat=(b[0]-a[0])*Math.PI/180;
  const dLon=(b[1]-a[1])*Math.PI/180;

  const x =
    Math.sin(dLat/2)**2 +
    Math.cos(a[0]*Math.PI/180) *
    Math.cos(b[0]*Math.PI/180) *
    Math.sin(dLon/2)**2;

  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// 🧭 BEARING
function bearing(a,b){
  const dLon=(b[1]-a[1])*Math.PI/180;

  const y=Math.sin(dLon)*Math.cos(b[0]*Math.PI/180);
  const x=
    Math.cos(a[0]*Math.PI/180)*Math.sin(b[0]*Math.PI/180)-
    Math.sin(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.cos(dLon);

  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}

// 📍 USER POSITION
function getUser(){
  return new Promise((resolve,reject)=>{
    navigator.geolocation.getCurrentPosition(pos=>{
      resolve({
        lat:pos.coords.latitude,
        lon:pos.coords.longitude
      });
    },reject);
  });
}

// 🆘 ESCAPE ENGINE
async function escapeRoute(){

  const user = await getUser();

  map.setView([user.lat,user.lon],13);

  L.marker([user.lat,user.lon])
    .addTo(map)
    .bindPopup("📍 YOU");

  // find nearest safe point
  let best = null;
  let bestDist = Infinity;

  safePoints.forEach(p=>{

    const d = distance(
      [user.lat,user.lon],
      p.coords
    );

    if(d < bestDist){
      bestDist = d;
      best = p;
    }
  });

  // draw escape line
  const line = L.polyline([
    [user.lat,user.lon],
    best.coords
  ],{
    color:"#ff5252",
    weight:4
  }).addTo(map);

  map.fitBounds(line.getBounds());

  L.marker(best.coords)
    .addTo(map)
    .bindPopup("🆘 SAFE: " + best.name);

  const dir = bearing(
    [user.lat,user.lon],
    best.coords
  );

  document.getElementById("output").innerHTML = `
    <div class="card">
      🆘 <b>SAFE DESTINATION FOUND</b><br><br>
      📍 ${best.name}<br>
      📏 ${Math.round(bestDist)} m<br>
      🧭 ${Math.round(dir)}°
    </div>
  `;

  console.log("ESCAPE TARGET:", best);
}

</script>

</body>
</html>
