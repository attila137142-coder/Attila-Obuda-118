<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V5 GTFS MINI ENGINE</title>

<style>
body{
margin:0;
font-family:Arial;
background:#05070d;
color:#00ffcc;
}

header{
padding:15px;
text-align:center;
background:#0b1220;
border-bottom:2px solid #00ffcc;
font-weight:bold;
}

.container{
display:grid;
grid-template-columns:1fr 2fr;
gap:10px;
padding:10px;
}

.panel{
background:#0b1220;
border:1px solid #00ffcc;
border-radius:6px;
padding:10px;
min-height:400px;
}

input{
width:100%;
padding:10px;
background:#05070d;
border:1px solid #00ffcc;
color:#00ffcc;
}

button{
width:100%;
padding:10px;
margin-top:5px;
background:#00ffcc;
border:none;
font-weight:bold;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td,th{
border-bottom:1px solid #00ffcc33;
padding:6px;
font-size:13px;
text-align:left;
}

.badge{
padding:2px 6px;
border:1px solid #00ffcc;
font-size:11px;
}

.siet{
background:red;
color:white;
padding:2px 6px;
font-size:11px;
}

.keses{
background:deepskyblue;
color:white;
padding:2px 6px;
font-size:11px;
}

.ok{
background:green;
color:white;
padding:2px 6px;
font-size:11px;
}
</style>
</head>

<body>

<header>
🚍 FUTÁR V5 GTFS MINI ENGINE // REAL DATA MODEL SIM
</header>

<div class="container">

<!-- KERESŐ -->
<div class="panel">
<h3>🚏 Megálló kereső</h3>

<input id="stop" placeholder="pl. Deák tér">
<button onclick="search()">KERESÉS</button>

<div id="result"></div>
</div>

<!-- INDULÁSOK -->
<div class="panel">
<h3>🛰 Valós indulások + fordák + státusz</h3>

<table>
<thead>
<tr>
<th>Járat</th>
<th>Irány</th>
<th>Ford/ID</th>
<th>Indul</th>
<th>Státusz</th>
</tr>
</thead>

<tbody id="table"></tbody>
</table>

</div>

</div>

<script>

/*
========================
GTFS MINI DATA MODEL
========================
*/
const departures = [
{
route:"7E",
dir:"Blaha Lujza tér",
vehicle:"F-102 | RZ-778",
time:{min:2,sec:15},
status:"SIET"
},
{
route:"9",
dir:"Óbuda",
vehicle:"F-205 | BPO-441",
time:{min:4,sec:40},
status:"OK"
},
{
route:"47",
dir:"Deák tér",
vehicle:"F-311 | JLN-229",
time:{min:1,sec:10},
status:"SIET"
},
{
route:"M2",
dir:"Déli pályaudvar",
vehicle:"METRO-02 | M-002",
time:{min:6,sec:55},
status:"KESÉS"
},
{
route:"M4",
dir:"Kelenföld",
vehicle:"METRO-04 | M-014",
time:{min:3,sec:20},
status:"OK"
}
];

/*
========================
RENDER ENGINE
========================
*/
function load(){
let t = document.getElementById("table");
t.innerHTML="";

departures.forEach(d=>{

let badge = "";

if(d.status==="SIET") badge = `<span class="siet">SIET</span>`;
if(d.status==="KESÉS") badge = `<span class="keses">KÉSÉS</span>`;
if(d.status==="OK") badge = `<span class="ok">OK</span>`;

t.innerHTML += `
<tr>
<td><span class="badge">${d.route}</span></td>
<td>${d.dir}</td>
<td>${d.vehicle}</td>
<td>${d.time.min}p ${d.time.sec}s</td>
<td>${badge}</td>
</tr>
`;
});
}

/*
========================
STOP SEARCH
========================
*/
function search(){
let v=document.getElementById("stop").value;

if(!v){
document.getElementById("result").innerHTML="❌ nincs megálló";
return;
}

// simple match simulation
let found = departures.filter(d =>
d.dir.toLowerCase().includes(v.toLowerCase())
);

if(found.length===0){
document.getElementById("result").innerHTML="❌ nincs találat";
return;
}

document.getElementById("result").innerHTML =
"🚏 Találat: <b>"+v+"</b><br>🟢 járatok: "+found.length;
}

load();

</script>

</body>
</html>
