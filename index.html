<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>V8 CLEAN UI + EVENT ENGINE (STABLE)</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:#e2e8f0;
}

header{
  display:flex;
  gap:10px;
  padding:10px;
  background:#111827;
  align-items:center;
}

button{
  padding:10px 12px;
  border:0;
  border-radius:8px;
  background:#22c55e;
  font-weight:bold;
  cursor:pointer;
}

button.secondary{background:#38bdf8}

.container{
  display:grid;
  grid-template-columns:340px 1fr;
  height:calc(100vh - 60px);
}

.sidebar{
  padding:10px;
  background:#111827;
  overflow:auto;
}

.main{
  padding:10px;
  overflow:auto;
}

#map{
  height:100%;
  width:100%;
  border-left:1px solid #1f2937;
}

input{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:6px;
  border:1px solid #334155;
  background:#0b1220;
  color:white;
}

.table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

.table th,.table td{
  border:1px solid #334155;
  padding:6px;
  text-align:center;
  font-size:12px;
}

.table th{
  background:#1f2937;
}

.title{font-weight:bold;margin:8px 0}
.badge{background:#2563eb;padding:2px 6px;border-radius:6px;font-size:11px}
.panel{background:#0b1220;padding:8px;border-radius:8px;margin-top:10px}
.ok{color:#4ade80}
.err{color:#f87171}
.small{font-size:12px;opacity:.8}
</style>
</head>
<body>

<header>
<button onclick="loadDemo()">📥 DEMO</button>
<button class="secondary" onclick="exportZip()">📦 EXPORT</button>
<span class="small">V8 CLEAN EVENT ENGINE</span>
</header>

<div class="container">

<div class="sidebar">

<div class="title">🔎 Megálló kereső</div>
<input id="search" oninput="renderStops()" placeholder="pl. Óbuda">
<div id="stopList"></div>

<div class="panel">
<div class="title">🧠 DEBUG</div>
<div id="debug"></div>
</div>

</div>

<div class="main">
<div class="title">🚏 MEGÁLLÓS MENETREND (FULL DISPATCH TABLE)</div>
<div id="timetable">Válassz megállót</div>
</div>

<div id="map"></div>

</div>

<script>

let gtfs={stops:[],trips:[],stop_times:[]};
let map;

window.onload=()=>{
  map=L.map('map').setView([47.4979,19.0402],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  loadDemo();
  renderAll();
};

function loadDemo(){

  gtfs.stops=[
    {id:"1",name:"Óbuda",lat:47.541,lon:19.045},
    {id:"2",name:"Békásmegyer",lat:47.595,lon:19.043},
    {id:"3",name:"Szob vasút",lat:47.82,lon:18.87}
  ];

  gtfs.trips=[
    {id:"T204",viszonylat:"204",dir:"BM → Újmegyer tér",vehicle:"Ikarus 412",internal:"5-2 DE",vehicle_no:"DPY-256"},
    {id:"T243",viszonylat:"243",dir:"Békásmegyer HÉV",vehicle:"Volvo 512",internal:"8-1 ÁTSZ",vehicle_no:"NKH-852"},
    {id:"T32",viszonylat:"32",dir:"Örs Vezér tér",vehicle:"Van Hool csuklós",internal:"6-4 DU",vehicle_no:"HHH-842"}
  ];

  gtfs.stop_times=[
    {trip:"T204",stop:"1",time:"22:35",delay:"2p18mp SIET"},
    {trip:"T243",stop:"2",time:"22:38",delay:"IDŐBEN"},
    {trip:"T32",stop:"3",time:"22:40",delay:"6p43mp KÉSIK"}
  ];
}

function renderAll(){
  renderStops();
  renderDebug();
  renderMap();
}

function renderStops(){
  const q=document.getElementById("search").value.toLowerCase();
  const list=document.getElementById("stopList");
  list.innerHTML="";

  const filtered=gtfs.stops.filter(s=>s.name.toLowerCase().includes(q));

  if(q && filtered.length===0){
    list.innerHTML="<div class='small'>Nincs találat</div>";
    return;
  }

  filtered.forEach(s=>{
    const d=document.createElement("div");
    d.innerHTML=`🚏 ${s.name}`;
    d.style.padding="6px";
    d.style.cursor="pointer";

    d.onclick=()=>{
      console.log("CLICK STOP",s);
      showTimetable(s);
    };

    list.appendChild(d);
  });
}

function showTimetable(stop){

  const rows=gtfs.stop_times
  .filter(x=>x.stop===stop.id)
  .map(x=>{
    const t=gtfs.trips.find(tr=>tr.id===x.trip);

    return `<tr>
      <td>${t.viszonylat}</td>
      <td>${t.dir}</td>
      <td>${x.time}</td>
      <td>${x.delay}</td>
      <td>${t.internal}</td>
      <td>${t.vehicle_no}</td>
      <td>${t.vehicle}</td>
    </tr>`;
  });

  document.getElementById("timetable").innerHTML=`
  <div class='title'>📍 ${stop.name}</div>
  <table class='table'>
    <tr>
      <th>Viszonylat száma</th>
      <th>Iránya – cél végállomás</th>
      <th>Indul</th>
      <th>Időbeli eltérés</th>
      <th>Belső azonosító</th>
      <th>Jármű száma</th>
      <th>Jármű típusa</th>
    </tr>
    ${rows.join("")}
  </table>`;
}

function renderDebug(){
  let ok=true;
  let msg="";

  if(!gtfs.stops.length){ok=false;msg+="❌ stops hiányzik<br>";}
  if(!gtfs.trips.length){ok=false;msg+="❌ trips hiányzik<br>";}
  if(!gtfs.stop_times.length){ok=false;msg+="❌ stop_times hiányzik<br>";}

  document.getElementById("debug").innerHTML=
    ok?"<div class='ok'>✔ GTFS OK</div>":"<div class='err'>"+msg+"</div>";
}

function renderMap(){
  map.eachLayer(l=>{if(l instanceof L.Marker) map.removeLayer(l);});

  gtfs.stops.forEach(s=>{
    if(s.lat&&s.lon){
      L.marker([s.lat,s.lon]).addTo(map).bindPopup(s.name);
    }
  });
}

function exportZip(){
  const zip=new JSZip();

  zip.file("stops.txt",gtfs.stops.map(s=>`${s.id},${s.name}`).join("\n"));
  zip.file("trips.txt",gtfs.trips.map(t=>`${t.id},${t.viszonylat},${t.dir},${t.vehicle},${t.internal},${t.vehicle_no}`).join("\n"));
  zip.file("stop_times.txt",gtfs.stop_times.map(s=>`${s.trip},${s.stop},${s.time},${s.delay}`).join("\n"));

  zip.generateAsync({type:"blob"}).then(b=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b);
    a.download="gtfs_v8.zip";
    a.click();
  });
}

</script>

</body>
</html>
