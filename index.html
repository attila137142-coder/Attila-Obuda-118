<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attila V3.1 SMART INPUT ENGINE</title>
<style>
body { font-family: Arial; background:#0f172a; color:#fff; padding:20px }
input, button, textarea { padding:10px; margin:5px; border-radius:8px; border:none; width:100% }
button { background:#22c55e; color:#fff; font-weight:bold; cursor:pointer }
.card { background:#1e293b; padding:10px; border-radius:10px; margin-top:10px }
table { width:100%; border-collapse:collapse; margin-top:10px }
th,td { border:1px solid #334155; padding:6px }
</style>
</head>
<body>

<h1>🚌 V3.1 SMART INPUT ENGINE</h1>

<h2>📥 SMART INPUT</h2>
<input id="line" placeholder="Vonal (pl: 243)">
<input id="start" placeholder="Kezdő megálló">
<input id="end" placeholder="Vég megálló">

<button onclick="generateRoute()">GENERÁLÁS</button>

<div id="table"></div>

<script>
// DEMO adatbázis (később GTFS-re cserélhető)
const demoStops = [
  {name:"Nád utca", dist:0},
  {name:"Köztes 1", dist:1200},
  {name:"Köztes 2", dist:2800},
  {name:"Köztes 3", dist:4300},
  {name:"Csobánka tér", dist:6000}
];

function generateRoute(){
  let start=document.getElementById('start').value.toLowerCase();
  let end=document.getElementById('end').value.toLowerCase();

  let filtered=demoStops;

  let total=filtered[filtered.length-1].dist;

  let html='<table><tr><th>#</th><th>Megálló</th><th>Táv (m)</th><th>Táv (km)</th><th>Köv</th><th>Hátravan (m)</th><th>%</th></tr>';

  for(let i=0;i<filtered.length;i++){
    let s=filtered[i];
    let next=filtered[i+1]?filtered[i+1].name:'-';
    let remain=total - s.dist;
    let perc=(s.dist/total)*100;

    html+=`<tr>
    <td>${i+1}</td>
    <td>${s.name}</td>
    <td>${s.dist}</td>
    <td>${(s.dist/1000).toFixed(2)}</td>
    <td>${next}</td>
    <td>${remain}</td>
    <td>${perc.toFixed(1)}%</td>
    </tr>`;
  }

  html+='</table>';

  document.getElementById('table').innerHTML=html;
}
</script>

</body>
</html>
