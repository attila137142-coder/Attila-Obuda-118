<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>REAL GTFS BACKEND CORE - TRANSPORT OS</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body{margin:0;font-family:Arial;background:#0f172a;color:#e2e8f0}
    header{padding:12px;background:#111827;display:flex;justify-content:space-between;align-items:center}
    h1{font-size:14px;margin:0}
    .btn{background:#2563eb;border:none;padding:8px 10px;color:#fff;border-radius:8px;cursor:pointer}
    .grid{display:grid;gap:10px;padding:10px}
    .card{background:#1f2937;padding:10px;border-radius:12px}
    input{width:100%;padding:10px;border-radius:8px;border:none;margin-top:5px}
    #map{height:320px;border-radius:12px}
    .resultBox{margin-top:8px;padding:8px;background:#111827;border-radius:8px;cursor:pointer}

    .late{color:#3b82f6}
    .early{color:#ef4444}
    .onTime{color:#e2e8f0}

    table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
    th,td{border-bottom:1px solid #374151;padding:6px;text-align:left}
    th{color:#93c5fd}
  </style>
</head>
<body>

<header>
  <h1>🚆 FUTÁR-SZINTŰ MENETREND MOTOR</h1>
  <button class="btn" onclick="toggleMenu()">Rendszer státusz</button>
</header>

<div class="grid">

  <div class="card">
    <h3>🔍 Kereső</h3>
    <input id="search" placeholder="megálló / járat / id" oninput="querySystem()" />
    <div id="results"></div>
  </div>

  <div class="card">
    <h3>📊 MENETREND TÁBLÁZAT (FUTÁR MODE)</h3>
    <div id="panel">Válassz megállót...</div>
  </div>

  <div class="card">
    <h3>🗺️ TÉRKÉP</h3>
    <div id="map"></div>
  </div>

</div>

<script>

let GTFS={stops:[],routes:[],trips:[],stopTimes:[]};
let map;

function loadGTFS(){
  GTFS.stops=[
    {id:"S1",name:"Deák",lat:47.4975,lon:19.0550},
    {id:"S2",name:"Örs",lat:47.5017,lon:19.1356},
    {id:"S3",name:"Szob",lat:47.8213,lon:18.8626}
  ];

  GTFS.routes=[
    {id:"R1",name:"BKK 7E"},
    {id:"R2",name:"MÁV IR"}
  ];

  GTFS.trips=[
    {id:"T1",route:"R1",headsign:"Örs felé"},
    {id:"T2",route:"R2",headsign:"Szob felé"}
  ];

  GTFS.stopTimes=[
    {trip:"T1",stop:"S1",time:480,vehicle:{id:"B-120",type:"Volvo 2220"}},
    {trip:"T1",stop:"S2",time:500,vehicle:{id:"B-121",type:"Ikarus"}},
    {trip:"T2",stop:"S3",time:720,vehicle:{id:"M-300",type:"MÁV FLIRT"}}
  ];
}

function querySystem(){
  const q=document.getElementById('search').value.toLowerCase();
  const res=document.getElementById('results');
  res.innerHTML="";

  GTFS.stops.filter(s=>s.name.toLowerCase().includes(q)||s.id.toLowerCase().includes(q))
  .forEach(s=>{
    const div=document.createElement("div");
    div.className="resultBox";
    div.innerHTML=`🚏 ${s.name} (${s.id})`;
    div.onclick=()=>renderTable(s);
    res.appendChild(div);
  });
}

// ===================== FUTÁR TABLE =====================
function renderTable(stop){

  const panel=document.getElementById('panel');
  const rows=GTFS.stopTimes.filter(t=>t.stop===stop.id);

  let html=`<b>${stop.name}</b><br><br>
  <table>
    <tr>
      <th>Viszonylat száma</th>
      <th>Iránya / cél végállomás</th>
      <th>Indul</th>
      <th>Időbeli eltérés</th>
      <th>Belső azonosító</th>
      <th>Jármű száma</th>
      <th>Jármű típusa</th>
    </tr>`;

  rows.forEach(r=>{
    const trip=GTFS.trips.find(t=>t.id===r.trip);
    const route=GTFS.routes.find(x=>x.id===trip.route);

    const diff=r.time-480;

    let status="IDŐBEN";
    if(diff<0) status=`🔵 KÉSIK ${Math.abs(diff)}p`;
    if(diff>10) status=`🔴 SIET ${diff}p`;

    html+=`
    <tr>
      <td>${route.name}</td>
      <td>${trip.headsign}</td>
      <td>${r.time}</td>
      <td>${status}</td>
      <td>${r.vehicle.id}</td>
      <td>${r.vehicle.id}</td>
      <td>${r.vehicle.type}</td>
    </tr>`;
  });

  html+="</table>";
  panel.innerHTML=html;
}

window.onload=()=>{
  map=L.map('map').setView([47.5,19.05],10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  loadGTFS();

  GTFS.stops.forEach(s=>{
    L.marker([s.lat,s.lon]).addTo(map)
      .bindPopup(s.name)
      .on('click',()=>renderTable(s));
  });
};

function toggleMenu(){
  alert("FUTÁR MODE ACTIVE\nGTFS TABLE ENGINE RUNNING");
}

</script>

</body>
</html>
