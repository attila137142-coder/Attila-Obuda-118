<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTFS TAKARÍTÓ PRO V2.0</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f14;
    color: #d7e1ea;
}

header {
    background: #111a24;
    padding: 12px;
    font-size: 18px;
    font-weight: bold;
    border-bottom: 2px solid #1f2d3a;
}

.container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 10px;
}

.panel {
    background: #121b26;
    border: 1px solid #223244;
    border-radius: 8px;
    padding: 10px;
    overflow: auto;
    max-height: 80vh;
}

button {
    background: #1f6feb;
    color: white;
    border: none;
    padding: 10px;
    margin: 5px 0;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #2b7fff;
}

pre {
    white-space: pre-wrap;
    font-size: 12px;
}

.bad {
    color: #ff5c5c;
}

.good {
    color: #4ade80;
}

input {
    width: 100%;
    padding: 8px;
    margin: 5px 0;
    background: #0e1620;
    border: 1px solid #2a3b4d;
    color: white;
}
</style>
</head>

<body>

<header>🚍 GTFS TAKARÍTÓ PRO V2.0 – JSZIP CLEAN ENGINE</header>

<div class="container">

<div class="panel">
<h3>📦 GTFS ZIP betöltés</h3>
<input type="file" id="zipFile" accept=".zip"/>
<button onclick="loadZip()">ZIP betöltése</button>
<button onclick="cleanGTFS()">TAKARÍTÁS INDÍTÁSA</button>
<button onclick="downloadClean()">LETÖLTÉS</button>

<h4>Állapot</h4>
<pre id="status">Várakozás...</pre>
</div>

<div class="panel">
<h3>📄 Fájl lista</h3>
<pre id="fileList"></pre>
</div>

</div>

<script>
let zipData;
let cleanedZip = new JSZip();

function log(msg) {
    document.getElementById("status").innerText += "\\n" + msg;
}

function loadZip() {
    const file = document.getElementById('zipFile').files[0];
    if (!file) return alert("Nincs fájl kiválasztva!");

    JSZip.loadAsync(file).then(zip => {
        zipData = zip;
        document.getElementById("fileList").innerText = "";
        log("ZIP betöltve: " + file.name);

        zip.forEach((relativePath, zipEntry) => {
            document.getElementById("fileList").innerText += relativePath + "\\n";
        });
    });
}

function cleanCSV(text) {
    return text
        .split("\\n")
        .map(l => l.trim())
        .filter(l => l.length > 0)
        .join("\\n");
}

async function cleanGTFS() {
    if (!zipData) return alert("Nincs ZIP!");

    cleanedZip = new JSZip();
    log("Takarítás indul...");

    const entries = Object.keys(zipData.files);

    for (let name of entries) {
        const file = zipData.files[name];

        if (file.dir) continue;

        let content = await file.async("string");

        if (name.endsWith(".txt")) {
            content = cleanCSV(content);
        }

        cleanedZip.file(name, content);
        log("OK: " + name);
    }

    log("Takarítás kész!");
}

function downloadClean() {
    cleanedZip.generateAsync({ type: "blob" }).then(blob => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "gtfs_clean_v2.zip";
        a.click();
    });
}
</script>

</body>
</html>
