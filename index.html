<script>


// ==================================
// ÓRA + DÁTUM
// ==================================


function updateClock(){


let now=new Date();


document.getElementById("clock").innerHTML=
now.toLocaleTimeString("hu-HU");



document.getElementById("date").innerHTML=
now.toLocaleDateString(
"hu-HU",
{
weekday:"long",
year:"numeric",
month:"long",
day:"numeric"
}
);


}


setInterval(updateClock,1000);

updateClock();







// ==================================
// GPS + SEBESSÉG SZŰRŐ
// ==================================


let lastSpeed=0;


function filterSpeed(kmh,acc){


if(acc>1000){
return 0;
}


if(kmh<1){
return 0;
}


if(Math.abs(kmh-lastSpeed)>40){
return lastSpeed;
}


lastSpeed=kmh;


return kmh;

}





function gpsQuality(acc){


if(acc<=20)
return "🟢 KIVÁLÓ";


if(acc<=100)
return "🟡 JÓ";


if(acc<=1000)
return "🟠 GYENGE";


return "🔴 HÁLÓZATI HELYZET";


}





function startGPS(){


if(!navigator.geolocation){

document.getElementById("gpsStatus").innerHTML=
"GPS nem támogatott";

return;

}



navigator.geolocation.watchPosition(



function(pos){


let lat=
pos.coords.latitude;


let lon=
pos.coords.longitude;


let acc=
pos.coords.accuracy;



document.getElementById("gpsStatus").innerHTML=
"🟢 AKTÍV";



document.getElementById("accuracy").innerHTML=
Math.round(acc);



document.getElementById("gpsQuality").innerHTML=
gpsQuality(acc);



document.getElementById("lat").innerHTML=
lat.toFixed(6);



document.getElementById("lon").innerHTML=
lon.toFixed(6);





let speed =
(pos.coords.speed || 0)*3.6;



speed =
filterSpeed(speed,acc);



document.getElementById("kmh").innerHTML=
speed.toFixed(0);



document.getElementById("ms").innerHTML=
(speed/3.6).toFixed(2);



reverseAddress(lat,lon);



},


function(){

document.getElementById("gpsStatus").innerHTML=
"🔴 GPS HIBA";

},


{

enableHighAccuracy:true,

maximumAge:1000,

timeout:10000

}


);



}



startGPS();





// ==================================
// CÍM KERESÉS HELYADATBÓL
// ==================================


function reverseAddress(lat,lon){


fetch(
"https://nominatim.openstreetmap.org/reverse?format=json&lat="
+
lat
+
"&lon="
+
lon
+
"&zoom=18"
)

.then(r=>r.json())

.then(data=>{


if(data.address){


document.getElementById("city").innerHTML=
data.address.city ||
data.address.town ||
data.address.village ||
"-";


document.getElementById("street").innerHTML=
data.address.road || "-";


document.getElementById("house").innerHTML=
data.address.house_number || "-";


}


})

.catch(()=>{});

function prepareSearch(){


let id=
document
.getElementById("stopInput")
.value
.trim();



if(id===""){

document.getElementById("result").innerHTML=
"⚠️ Nincs megadva azonosító";

return;

}



let found =
SMART_DATABASE.find(

x=>
x.id.toUpperCase()
===
id.toUpperCase()

);




// automatikus felismerés


if(!found){



if(
id.startsWith("F") ||
id.startsWith("CSF") ||
/^[0-9]+$/.test(id)

){


found={

id:id,

name:"Automatikus RealTimeNext",

type:"BKK",

url:
"https://realtimenext.hu/embed/bkv/stops/"
+
id
+
"/schedule"

};


}



else if(id.startsWith("hkir_")){


found={

id:id,

name:"Automatikus VOLÁNBUSZ",

"https://utas.hu/stop/"

id

function distanceKm(lat1,lon1,lat2,lon2){


let R=6371;


let dLat=
(lat2-lat1)
*
Math.PI/180;


let dLon=
(lon2-lon1)
*
Math.PI/180;


let a=

Math.sin(dLat/2)*
Math.sin(dLat/2)

+

Math.cos(lat1*Math.PI/180)
*
Math.cos(lat2*Math.PI/180)
*
Math.sin(dLon/2)
*
Math.sin(dLon/2);



return R*
2*
Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);


}





function showNearbyStops(){


let lat=
parseFloat(
document.getElementById("lat").innerHTML
);


let lon=
parseFloat(
document.getElementById("lon").innerHTML
);



if(isNaN(lat)||isNaN(lon))
return;



let arr=[];


TEST_STOPS.forEach(s=>{


arr.push({

name:s.name,

id:s.id,

type:s.type,

distance:
distanceKm(
lat,
lon,
s.lat,
s.lon
)


});


});



arr.sort(
(a,b)=>
a.distance-b.distance
);



let html=
"<h2>📍 Közeli megállók</h2>";



arr.forEach(s=>{


html+=

"<div class='box'>"

+

s.type

+

"<br>"

+

s.name

+

"<br>ID: "

+

s.id

+

"<br>"

+

s.distance
.toFixed(2)
.replace(".",",")

+

" km"

+

"</div>";



});




let old=
document.getElementById("nearby");



if(old){

old.innerHTML=html;

}

else{


let div=
document.createElement("div");


div.className="box";

div.id="nearby";


div.innerHTML=html;


document
.querySelector(".container")
.appendChild(div);


}



}

showNearbyStops,
10000
);

3000
);
