<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V11.5 OPERATOR DASHBOARD</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:#e5e7eb;
}

header{
    background:#111827;
    padding:12px;
    text-align:center;
    font-weight:bold;
    color:#38bdf8;
}

.container{
    display:flex;
    height:100vh;
}

/* LEFT */
.left{
    width:60%;
    display:flex;
    flex-direction:column;
    border-right:1px solid #1f2937;
}

.panel{
    padding:10px;
    border-bottom:1px solid #1f2937;
}

input,button{
    width:100%;
    padding:10px;
    margin-top:6px;
    border:none;
    border-radius:8px;
}

input{
    background:#1f2937;
    color:white;
}

button{
    background:#38bdf8;
    font-weight:bold;
}

/* LIST */
.list{
    flex:1;
    overflow:auto;
    padding:10px;
}

.card{
    background:#0f172a;
    border:1px solid #1f2937;
    padding:10px;
    margin-bottom:8px;
    border-radius:10px;
}

/* RIGHT */
.right{
    width:40%;
    display:flex;
    flex-direction:column;
}

.log{
    flex:1;
    padding:10px;
    font-size:12px;
    overflow:auto;
    background:#0a0f1a;
    border-left:1px solid #1f2937;
}
.badge{
    display:inline-block;
    padding:2px 6px;
    background:#1f2937;
    border-radius:6px;
    font-size:11px;
}
</style>
</head>

<body>

<header>
🚦 V11.5 REAL BKK OPERATOR DASHBOARD
</header>

<div class="container">

<!-- LEFT -->
<div class="left">

<div class="panel">
<input id="q" placeholder="Megálló / GTFS / Skanzen / Királyrét">
<button onclick="searchStops()">KERESÉS</button>
<button onclick="findNearest()">LEGKÖZELEBBI MEGÁLLÓ</button>
</div>

<div class="list" id="list"></div>

</div>

<!-- RIGHT -->
<div class="right">
<div class="log" id="log"></div>
</div>

</div>

<script>

// ---------------- LOG ----------------
function log(m){
    let el=document.getElementById("log");
    el.innerHTML+=m+"<br>";
    el.scrollTop=el.scrollHeight;
}

// ---------------- STOP DB (GTFS + GEO) ----------------
let STOPS=[
    {id:"SKANZEN",name:"Skanzen",lat:47.6952,lon:19.0756},
    {id:"KIRALYRET",name:"Királyrét",lat:47.9271,lon:18.9952},
    {id:"TAHITOTFALU",name:"Tahitótfalu",lat:47.7568,lon:19.0794},
    {id:"HIDFO",name:"Hídfő",lat:47.4979,lon:19.0402},
    {id:"NAD",name:"Nád utca",lat:47.5183,lon:19.0467}
];

// ---------------- USER POSITION ----------------
let USER={
    lat:47.4979,
    lon:19.0402
};

// ---------------- VEHICLES ----------------
let VEHICLES={
    "T1":{type:"Volvo 7900",plate:"ABC-123",fleet:"F12"},
    "T2":{type:"Stadler HÉV",plate:"HEV-045",fleet:"H03"}
};

// ---------------- DISTANCE ----------------
function dist(lat1,lon1,lat2,lon2){
    const R=6371;
    let dLat=(lat2-lat1)*Math.PI/180;
    let dLon=(lon2-lon1)*Math.PI/180;
    let a=
        Math.sin(dLat/2)**2 +
        Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
        Math.sin(dLon/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ---------------- GPRS ----------------
function signal(){
    return Math.floor(40+Math.random()*60);
}

// ---------------- RENDER STOP ----------------
function renderStop(s){

    let d=dist(USER.lat,USER.lon,s.lat,s.lon).toFixed(2);
    let sig=signal();

    let q=
        sig>80?"🟢 EXCELLENT":
        sig>60?"🟡 OK":"🔴 WEAK";

    return `
<div class="card">
<b>${s.name}</b> <span class="badge">${s.id}</span><br>
📍 ${s.lat}, ${s.lon}<br>
📏 Távolság: ${d} km<br>
📡 GPRS: ${sig}% (${q})
</div>`;
}

// ---------------- SEARCH ----------------
function searchStops(){

    let q=document.getElementById("q").value.toLowerCase();

    log("🔎 keresés: "+q);

    let res=STOPS.filter(s=>
        s.name.toLowerCase().includes(q) ||
        s.id.toLowerCase().includes(q)
    );

    let el=document.getElementById("list");
    el.innerHTML="";

    if(res.length===0){
        log("❌ nincs találat");
        return;
    }

    res.forEach(s=>{
        el.innerHTML+=renderStop(s);
        log("✅ "+s.name);
    });
}

// ---------------- NEAREST STOP ENGINE ----------------
function findNearest(){

    let best=null;
    let bestD=9999;

    STOPS.forEach(s=>{
        let d=dist(USER.lat,USER.lon,s.lat,s.lon);
        if(d<bestD){
            bestD=d;
            best=s;
        }
    });

    log("🧭 LEGKÖZELEBBI MEGÁLLÓ:");
    log("➡️ "+best.name+" ("+best.id+")");
    log("📏 "+bestD.toFixed(2)+" km");
}

log("🚀 V11.5 OPERATOR DASHBOARD READY");

</script>

</body>
</html>
