<!-- ======================================
     2. RÉSZ
     CLOCK + DATE + GPS CORE
====================================== -->


<script>


// ======================================
// ATTILA DESKTOP WEATHER CLOCK
// V2.2 STABLE FINAL
// CLOCK ENGINE
// ======================================



// ------------------------------
// ÓRA + DÁTUM MOTOR
// ------------------------------


function updateClock(){


const now = new Date();



let h =
String(now.getHours())
.padStart(2,"0");


let m =
String(now.getMinutes())
.padStart(2,"0");


let s =
String(now.getSeconds())
.padStart(2,"0");



document.getElementById("clock")
.innerHTML =
`${h}:${m}:${s}`;



let days =
[
"Vasárnap",
"Hétfő",
"Kedd",
"Szerda",
"Csütörtök",
"Péntek",
"Szombat"
];



let dayName =
days[now.getDay()];



let dateText =

`${now.getFullYear()}. ${
String(now.getMonth()+1)
.padStart(2,"0")
}. ${
String(now.getDate())
.padStart(2,"0")
}. ${dayName}`;



document.getElementById("date")
.innerHTML =
dateText;



document.getElementById("week")
.innerHTML =
getISOWeek(now);



document.getElementById("dayOfYear")
.innerHTML =
getDayOfYear(now);



}



// ------------------------------
// ISO HÉT SZÁMÍTÁS
// ------------------------------


function getISOWeek(date){


let d =
new Date(
Date.UTC(
date.getFullYear(),
date.getMonth(),
date.getDate()
)
);



let day =
d.getUTCDay() || 7;



d.setUTCDate(
d.getUTCDate()
+
4
-
day
);



let yearStart =
new Date(
Date.UTC(
d.getUTCFullYear(),
0,
1
)
);



return Math.ceil(
(
(
d-yearStart
)
/86400000
+1
)
/7
);



}



// ------------------------------
// ÉV NAPJA
// ------------------------------


function getDayOfYear(date){


let start =
new Date(
date.getFullYear(),
0,
0
);



let diff =
date-start;



return Math.floor(
diff /
86400000
);



}



// ======================================
// GPS MOTOR
// ======================================



let gpsData = {


lat:null,

lon:null,

accuracy:null,


speed:null


};



let lastPosition=null;





function startGPS(){



if(
navigator.geolocation
){


navigator.geolocation.watchPosition(


function(position){



let coords =
position.coords;



gpsData.lat =
coords.latitude;



gpsData.lon =
coords.longitude;



gpsData.accuracy =
coords.accuracy;



// ----------------------
// GPS sebesség
// ----------------------


let speed =
coords.speed;



if(
speed !== null &&
!isNaN(speed)
){


gpsData.speed =
speed;


}
else{


calculateSpeed(position);


}




updateGPSDisplay();



},



function(error){



document.getElementById("gpsStatus")
.innerHTML =
"GPS hiba";



document.getElementById("gpsStatus")
.className =
"info-value error";



},



{


enableHighAccuracy:true,


maximumAge:1000,


timeout:10000


}



);



}



}




// ------------------------------
// SEBESSÉG SZÁMÍTÁS
// ------------------------------


function calculateSpeed(position){



if(
lastPosition
){



let p1 =
lastPosition.coords;



let p2 =
position.coords;



let distance =
calculateDistance(

p1.latitude,
p1.longitude,

p2.latitude,
p2.longitude

);



let time =
(
position.timestamp -
lastPosition.timestamp
)
/1000;



if(time>0){


gpsData.speed =
distance /
time;


}



}



lastPosition =
position;



}





// méter távolság számítás

function calculateDistance(
lat1,
lon1,
lat2,
lon2
){



const R =
6371000;



const a =

Math.sin(
(
lat2-lat1
)
*
Math.PI/180/2
)
*
Math.sin(
(
lat2-lat1
)
*
Math.PI/180/2
)

+

Math.cos(
lat1*Math.PI/180
)
*
Math.cos(
lat2*Math.PI/180
)
*
Math.sin(
(
lon2-lon1
)
*
Math.PI/180/2
)
*
Math.sin(
(
lon2-lon1
)
*
Math.PI/180/2
);



return R *
2 *
Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);



}





// ------------------------------
// GPS KIÍRÁS
// ------------------------------


function updateGPSDisplay(){



let status =
document.getElementById("gpsStatus");



status.innerHTML =
"AKTÍV";


status.className =
"info-value ok";





if(
gpsData.speed !== null
){



let kmh =
(
gpsData.speed *
3.6
)
.toFixed(1);



document.getElementById("speed")
.innerHTML =

`
${kmh} km/h
<br>
<small>
${gpsData.speed.toFixed(2)} m/s
</small>
`;



}



}



// ------------------------------
// INDÍTÁS
// ------------------------------


setInterval(
updateClock,
1000
);


updateClock();


startGPS();



</script>
