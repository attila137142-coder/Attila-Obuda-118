<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V3 FULL DISPATCH FIX CORE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  display:flex;
  height:100vh;
  background:#061b17;
  color:#dff;
}

#panel{
  width:420px;
  background:#081f1b;
  overflow:auto;
  border-right:2px solid #00ffb3;
  padding:10px;
  font-family:monospace;
}

#map{
  flex:1;
}

.header{
  font-weight:bold;
  padding:8px;
  background:#0a2a24;
  border-bottom:1px solid #00ffb3;
}

.stopBox{
  border:1px solid #0d3b33;
  margin-top:10px;
  padding:8px;
  border-radius:6px;
}

.row{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  border-bottom:1px solid #0d3b33;
  padding:2px 0;
}

.ok{color:#00ff99;}
.warn{color:#ffcc00;}
.bad{color:#ff4d4d;}
.small{font-size:11px;opacity:0.8;}

button{
  width:100%;
  padding:8px;
  margin-top:5px;
  background:#004d40;
  color:white;
  border:none;
}
input{
  width:100%;
  padding:6px;
}
</style>
</head>

<body>

<div id="panel">
<div class="header">🚍 V3 DISPATCH CORE FIX</div>

<input type="file" id="zip">
<button onclick="loadGTFS()">GTFS LOAD</button>

<div id="info">WAITING...</div>
</div>

<div id="map"></div>

<script>

// ================= MAP =================
const map = L.map('map').setView([47.5,19.05],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

// ================= STATE =================
let STOPS = [];
let STOP_INDEX = {};
let LAYER;

// ================= TIME =================
function toSec(t){
  if(!t) return 0;
  let p = t.split(':').map(Number);
  let h = p[0], m = p[1], s = p[2] || 0;

  if(h >= 24){
    h -= 24;
    return 86400 + (h*3600 + m*60 + s);
  }

  return h*3600 + m*60 + s;
}

// ================= LOAD GTFS =================
async function loadGTFS(){

  const file = document.getElementById('zip').files[0];
  const zip = await JSZip.loadAsync(file);

  let stopsTxt = await zip.file('stops.txt').async('string');
  let stopTimesTxt = await zip.file('stop_times.txt').async('string');

  let stopsLines = stopsTxt.split('\n');
  let stLines = stopTimesTxt.split('\n');

  let stopHeader = stopsLines[0].split(',');
  let stHeader = stLines[0].split(',');

  STOPS = [];
  STOP_INDEX = {};

  // ================= STOPS =================
  for(let i=1;i<stopsLines.length;i++){
    let row = stopsLines[i].split(',');
    if(row.length < 3) continue;

    let obj = {};
    stopHeader.forEach((h,j)=>obj[h]=row[j]);

    if(!obj.stop_id) continue;

    STOPS.push(obj);
  }

  // ================= STOP TIMES =================
  for(let i=1;i<stLines.length;i++){
    let row = stLines[i].split(',');
    if(row.length < 3) continue;

    let obj = {};
    stHeader.forEach((h,j)=>obj[h]=row[j]);

    if(!obj.stop_id) continue;

    if(!STOP_INDEX[obj.stop_id]){
      STOP_INDEX[obj.stop_id] = [];
    }

    STOP_INDEX[obj.stop_id].push(obj);
  }

  // ================= SORT FIX =================
  Object.keys(STOP_INDEX).forEach(k=>{
    STOP_INDEX[k].sort((a,b)=>
      toSec(a.departure_time)-toSec(b.departure_time)
    );
  });

  renderMap();

  document.getElementById('info').innerHTML =
    `✔ STOPS: ${STOPS.length}<br>✔ INDEX: ${Object.keys(STOP_INDEX).length}`;
}

// ================= MAP RENDER =================
function renderMap(){

  if(LAYER) map.removeLayer(LAYER);

  LAYER = L.layerGroup().addTo(map);

  STOPS.forEach(s=>{

    let lat = parseFloat(s.stop_lat);
    let lon = parseFloat(s.stop_lon);

    if(!lat || !lon) return;

    L.circleMarker([lat,lon],{
      radius:4,
      color:'#00ffcc'
    }).addTo(LAYER)

    // 🔥 FIX: CLICK → PANEL
    .on('click',()=>{
      renderStop(s.stop_id);
    });

  });
}

// ================= STOP PANEL =================
function renderStop(stop_id){

  let list = STOP_INDEX[stop_id] || [];
  let meta = STOPS.find(s=>s.stop_id===stop_id) || {};

  let html = `
  <div class="stopBox">
    <b>${meta.stop_name || 'STOP'}</b><br>
    <div class="small">${stop_id}</div>
  `;

  if(list.length === 0){
    html += "<br><span class='warn'>Nincs menetrend adat</span>";
  }

  for(let i=0;i<Math.min(list.length,15);i++){

    let d = list[i];

    html += `
      <div class="row">
        <div>${d.trip_id || '-'}</div>
        <div class="ok">${d.departure_time}</div>
      </div>
    `;
  }

  html += "</div>";

  document.getElementById('info').innerHTML = html;
}

</script>

</body>
</html>
