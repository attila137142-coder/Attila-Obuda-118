<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR MINI CORE V5</title>

<style>
* { box-sizing:border-box; }

body {
    margin:0;
    font-family: Arial;
    background:#0b0f14;
    color:#d7e6ff;
}

/* 🔥 FIX: ha CSS fail → ez akkor is ad háttért */
html, body {
    min-height:100%;
}

header {
    background:#111a27;
    padding:10px;
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid #223;
}

.grid {
    display:grid;
    grid-template-columns: 1fr 1fr;
    height:calc(100vh - 50px);
}

.panel {
    margin:6px;
    padding:10px;
    background:#0f1724;
    border:1px solid #223;
    overflow:auto;
    min-height:200px;
}

h2 { font-size:13px; color:#7cc4ff; }

input {
    width:100%;
    padding:8px;
    margin:5px 0;
    background:#0b1220;
    border:1px solid #2a3a55;
    color:white;
}

.stop {
    padding:6px;
    border-bottom:1px solid #1f2c40;
    cursor:pointer;
}
.stop:hover { background:#162235; }

.good { color:#7CFF9E; }
.bad { color:#ff6b6b; }
.warn { color:#ffd37c; }

#mapBox {
    height:150px;
    border:1px solid #223;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0c1320;
}

.small { font-size:12px; opacity:0.8; }
</style>
</head>

<body>

<header>
<div>🚦 FUTÁR MINI CORE V5 (SAFE)</div>
<div class="small">NO WHITE SCREEN MODE ACTIVE</div>
</header>

<div class="grid">

<!-- SEARCH -->
<div class="panel">
<h2>🔎 MEGÁLLÓK</h2>
<input id="search" placeholder="Keresés..." oninput="searchStops()">
<div id="results"></div>
</div>

<!-- DEPARTURES -->
<div class="panel">
<h2>🚏 INDULÁSOK</h2>
<div id="departures">Válassz megállót</div>
</div>

<!-- MAP -->
<div class="panel">
<h2>🗺 MAP CORE</h2>
<div id="mapBox">Nincs kiválasztva</div>
</div>

<!-- LOG -->
<div class="panel">
<h2>🧠 LOG</h2>
<div id="log"></div>
</div>

</div>

<script>

let selected = null;

/* 🔥 STABLE GTFS-LIKE STOP DB */
const STOPS = [
 "Deák Ferenc tér",
 "Nyugati pályaudvar",
 "Batthyány tér",
 "Kelenföld vasútállomás",
 "Örs vezér tere",
 "Blaha Lujza tér",
 "Astoria",
 "Széll Kálmán tér"
];

function log(msg){
    const el = document.getElementById("log");
    el.innerText += msg + "\n";
}

/* 🔥 SAFE SEARCH (NO CRASH) */
function searchStops(){
    try {
        const q = document.getElementById("search").value.toLowerCase();
        const res = document.getElementById("results");
        res.innerHTML = "";

        if(!q) return;

        const found = STOPS.filter(s =>
            s.toLowerCase().includes(q)
        );

        if(found.length === 0){
            res.innerHTML = "<div class='warn'>Nincs találat</div>";
            return;
        }

        found.forEach(s=>{
            const div = document.createElement("div");
            div.className="stop";
            div.innerText = s;
            div.onclick = ()=>selectStop(s);
            res.appendChild(div);
        });

    } catch(e){
        log("SEARCH ERROR: " + e.message);
    }
}

/* 🔥 SELECT STOP */
function selectStop(stop){
    selected = stop;
    log("STOP: " + stop);

    renderDepartures(stop);
    renderMap(stop);
}

/* 🔥 FUTÁR-SZERŰ INDULÁS (SIMULÁLT, DE VALÓS LOGIKA) */
function renderDepartures(stop){
    try {
        const box = document.getElementById("departures");
        const now = new Date();

        const lines = [
            {line:"M2", offset:2},
            {line:"4-6", offset:4},
            {line:"47", offset:7},
            {line:"H5", offset:11}
        ];

        box.innerHTML = "<b>" + stop + "</b><br><br>";

        lines.forEach(l=>{
            const t = new Date(now.getTime() + l.offset*60000);

            box.innerHTML += `
                🚍 ${l.line} → ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}<br>
            `;
        });

    } catch(e){
        log("DEPARTURE ERROR: " + e.message);
    }
}

/* 🔥 SAFE MAP (SOHA NEM FEHÉR) */
function renderMap(stop){
    const m = document.getElementById("mapBox");

    try {
        if(!stop){
            m.innerHTML = "Nincs kiválasztva";
            return;
        }

        m.innerHTML = `
            <div>
                📍 <b>${stop}</b><br><br>
                🚌 járművek szimulációja aktív<br>
                <span class="small">SAFE MAP CORE OK</span>
            </div>
        `;

    } catch(e){
        m.innerHTML = "MAP ERROR SAFE MODE";
        log("MAP ERROR: " + e.message);
    }
}

/* 🔥 BOOT SAFETY */
try {
    log("FUTÁR V5 START OK");
} catch(e){}

</script>

</body>
</html>
