<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Retro Tour Map Demo</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    #map { height: 100vh; width: 100%; }
  </style>
</head>

<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// 🗺️ TÉRKÉP ALAP
const map = L.map('map').setView([47.55, 18.95], 12);

// 🧭 OpenStreetMap layer
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18
}).addTo(map);

// 📍 POI
const poi = {
  name: "Csúcs-hegy",
  lat: 47.57321,
  lon: 18.94611
};

// 📍 Boróka
const poi2 = {
  name: "Boróka büfé",
  lat: 47.52211,
  lon: 18.88921
};

// 🔵 MARKEREK
L.marker([poi.lat, poi.lon]).addTo(map)
  .bindPopup(poi.name);

L.marker([poi2.lat, poi2.lon]).addTo(map)
  .bindPopup(poi2.name);

// 🟢 ÚTVONAL (egyenes demo vonal)
const route = [
  [poi.lat, poi.lon],
  [poi2.lat, poi2.lon]
];

const line = L.polyline(route, {
  color: 'blue'
}).addTo(map);

// 📏 távolság (egyszerű)
function distance(lat1, lon1, lat2, lon2) {
  const R = 6371e3;
  const φ1 = lat1 * Math.PI/180;
  const φ2 = lat2 * Math.PI/180;
  const Δφ = (lat2-lat1)*Math.PI/180;
  const Δλ = (lon2-lon1)*Math.PI/180;

  const a = Math.sin(Δφ/2)**2 +
    Math.cos(φ1)*Math.cos(φ2) *
    Math.sin(Δλ/2)**2;

  const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

  return R * c;
}

const dist = distance(poi.lat, poi.lon, poi2.lat, poi2.lon);

L.popup()
  .setLatLng([47.55, 18.93])
  .setContent("Távolság: " + (dist/1000).toFixed(2) + " km légvonal")
  .openOn(map);

</script>
</body>
</html>
