<script>


// ==================================
// ÓRA + DÁTUM
// ==================================


function updateClock(){


let now=new Date();


document.getElementById("clock").innerHTML=
now.toLocaleTimeString("hu-HU");



document.getElementById("date").innerHTML=
now.toLocaleDateString(
"hu-HU",
{
weekday:"long",
year:"numeric",
month:"long",
day:"numeric"
}
);


}


setInterval(updateClock,1000);

updateClock();







// ==================================
// GPS + SEBESSÉG SZŰRŐ
// ==================================


let lastSpeed=0;


function filterSpeed(kmh,acc){


if(acc>1000){
return 0;
}


if(kmh<1){
return 0;
}


if(Math.abs(kmh-lastSpeed)>40){
return lastSpeed;
}


lastSpeed=kmh;


return kmh;

}





function gpsQuality(acc){


if(acc<=20)
return "🟢 KIVÁLÓ";


if(acc<=100)
return "🟡 JÓ";


if(acc<=1000)
return "🟠 GYENGE";


return "🔴 HÁLÓZATI HELYZET";


}





function startGPS(){


if(!navigator.geolocation){

document.getElementById("gpsStatus").innerHTML=
"GPS nem támogatott";

return;

}



navigator.geolocation.watchPosition(



function(pos){


let lat=
pos.coords.latitude;


let lon=
pos.coords.longitude;


let acc=
pos.coords.accuracy;



document.getElementById("gpsStatus").innerHTML=
"🟢 AKTÍV";



document.getElementById("accuracy").innerHTML=
Math.round(acc);



document.getElementById("gpsQuality").innerHTML=
gpsQuality(acc);



document.getElementById("lat").innerHTML=
lat.toFixed(6);



document.getElementById("lon").innerHTML=
lon.toFixed(6);





let speed =
(pos.coords.speed || 0)*3.6;



speed =
filterSpeed(speed,acc);



document.getElementById("kmh").innerHTML=
speed.toFixed(0);



document.getElementById("ms").innerHTML=
(speed/3.6).toFixed(2);



reverseAddress(lat,lon);



},


function(){

document.getElementById("gpsStatus").innerHTML=
"🔴 GPS HIBA";

},


{

enableHighAccuracy:true,

maximumAge:1000,

timeout:10000

}


);



}



startGPS();





// ==================================
// CÍM KERESÉS HELYADATBÓL
// ==================================


function reverseAddress(lat,lon){


fetch(
"https://nominatim.openstreetmap.org/reverse?format=json&lat="
+
lat
+
"&lon="
+
lon
+
"&zoom=18"
)

.then(r=>r.json())

.then(data=>{


if(data.address){


document.getElementById("city").innerHTML=
data.address.city ||
data.address.town ||
data.address.village ||
"-";


document.getElementById("street").innerHTML=
data.address.road || "-";


document.getElementById("house").innerHTML=
data.address.house_number || "-";


}


})

.catch(()=>{});


}
