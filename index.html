<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V5 DISPATCH CORE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
 margin:0;
 font-family:Arial;
 background:#0b1220;
 color:#e2e8f0;
}

#map{height:45vh;}

.container{padding:12px;}

input{
 width:100%;
 padding:12px;
 border:none;
 border-radius:8px;
 font-size:16px;
}

button{
 margin-top:10px;
 padding:10px;
 background:#22c55e;
 border:none;
 border-radius:8px;
 font-weight:bold;
 cursor:pointer;
}

.card{
 background:#1e293b;
 padding:10px;
 margin-top:10px;
 border-radius:10px;
}

.row{
 padding:4px 0;
 border-bottom:1px solid #334155;
}

.badge{
 padding:4px 8px;
 border-radius:6px;
 font-size:12px;
}

.bkk{background:#38bdf8;color:black;}
.volan{background:#f59e0b;color:black;}
.mav{background:#a78bfa;color:black;}
.tour{background:#22c55e;color:black;}
.hev{background:#60a5fa;color:black;}
</style>
</head>

<body>

<div id="map"></div>

<div class="container">

<h2>🚍 FUTÁR V5 DISPATCH CORE</h2>

<input id="input" placeholder="Stop ID (BKK / VOLÁN / MÁV / ERDŐ)">
<button onclick="run()">DISPATCH</button>

<div id="out"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ---------------- MAP ----------------
const map=L.map('map').setView([47.4979,19.0402],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 attribution:'OSM'
}).addTo(map);

let marker;

// ---------------- USER ----------------
let userLat=47.4979;
let userLon=19.0402;

navigator.geolocation?.getCurrentPosition(p=>{
 userLat=p.coords.latitude;
 userLon=p.coords.longitude;
});

// ---------------- RAW DATA ----------------
const RAW=[
 {name:"Nád utca", gtfs:"BKK-F00457", lat:47.594072, lon:19.048469},
 {name:"Flórián tér", gtfs:"BKK-F00611", lat:47.542896, lon:19.042252},
 {name:"Batthyány tér", gtfs:"BKK-F00057", lat:47.506002, lon:19.039456},

 {name:"Szentendre, autóbusz-állomás", gtfs:"VOLÁN-778806-99", lat:47.660403, lon:19.075408},
 {name:"Vác, autóbusz-állomás", gtfs:"VOLÁN-779365_99", lat:47.781930, lon:19.129643},

 {name:"Szob", mav_id:"005546862", lat:47.821319, lon:18.862602},

 {name:"Dobogókő", gtfs:"VOLÁN-778561", lat:47.719118, lon:18.897577},

 {name:"Magas Tax", gtfs:"ERDŐ-001", lat:47.92842, lon:18.92997}
];

// ---------------- NORMALIZER ----------------
function normalize(list){

 return list.map(s=>{

  let id=s.gtfs||s.mav_id||"UNKNOWN";

  let type="UNKNOWN";

  if(id.includes("BKK")) type="BKK";
  else if(id.includes("VOLÁN")||id.includes("VOLAN")) type="VOLÁN";
  else if(id.includes("mav")||id==="005546862") type="MÁV";
  else if(id.includes("ERDŐ")) type="TOUR";
  else if(id.includes("HÉV")||id.includes("HEV")) type="HEV";

  return {
   id,
   name:s.name,
   type,
   lat:Number(s.lat),
   lon:Number(s.lon)
  };

 }).filter(s=>!isNaN(s.lat)&&!isNaN(s.lon));

}

// ---------------- DISTANCE ----------------
function dist(a,b,c,d){

 const R=6371;
 const dLat=(c-a)*Math.PI/180;
 const dLon=(d-b)*Math.PI/180;

 const x=
 Math.sin(dLat/2)**2+
 Math.cos(a*Math.PI/180)*
 Math.cos(c*Math.PI/180)*
 Math.sin(dLon/2)**2;

 return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ---------------- MATRIX ----------------
function matrix(stops){

 return stops.map(s=>{

  let d=dist(userLat,userLon,s.lat,s.lon).toFixed(2);

  return `
  <div class="row">
  🚍 ${s.name}
  | ${s.type}
  | ${d} km
  </div>
  `;

 }).join("");

}

// ---------------- DISPATCH ----------------
function run(){

 const stops=normalize(RAW);

 let input=document.getElementById("input").value.toUpperCase();

 let filtered=stops.filter(s=>
  s.id.toUpperCase().includes(input) ||
  s.name.toUpperCase().includes(input) ||
  s.type.toUpperCase().includes(input)
 );

 if(filtered.length===0) filtered=stops;

 let center=filtered[0];

 if(marker) map.removeLayer(marker);

 marker=L.marker([center.lat,center.lon])
 .addTo(map)
 .bindPopup(center.name)
 .openPopup();

 map.setView([center.lat,center.lon],11);

 let html=`

 <div class="card">
 <h3>🧠 DISPATCH MATRIX</h3>
 ${matrix(filtered)}
 </div>

 <div class="card">
 📍 CENTER: ${center.name}<br>
 TYPE: ${center.type}<br>
 LAT: ${center.lat.toFixed(6)}<br>
 LON: ${center.lon.toFixed(6)}
 </div>

 <div class="card">
 🚍 ENGINE: DISPATCH CORE V5 ACTIVE<br>
 🧠 MODE: NORMALIZED GTFS + SMART RADAR READY
 </div>

 `;

 document.getElementById("out").innerHTML=html;
}

</script>

</body>
</html>
