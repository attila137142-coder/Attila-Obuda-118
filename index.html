<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Budai Trail Navigator v5</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; font-family: Arial; }
#map { height:100vh; width:100%; }

.panel{
  position:absolute;
  top:10px;
  left:10px;
  z-index:9999;
  background:white;
  padding:10px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.3);
  font-size:13px;
  max-width:300px;
}

.btn{
  background:#1976d2;
  color:white;
  padding:5px;
  margin-top:5px;
  border-radius:5px;
  cursor:pointer;
  text-align:center;
}

.route{
  margin-top:6px;
  padding:5px;
  background:#f4f4f4;
  border-left:4px solid green;
}
</style>
</head>

<body>

<div class="panel">
<b>🌲 Budai Navigator v5</b><br><br>

📍 1. katt: START<br>
📍 2. katt: CÉL<br><br>

<div id="info">Nincs kiválasztva</div>
<div class="btn" onclick="reset()">Reset</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// =====================
// MAP
// =====================

const map = L.map('map').setView([47.52, 18.97], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

// =====================
// GRAPH
// =====================

let graph = {};
let nodes = {};
let selected = [];

let routeLayer;

// =====================
// DISTANCE
// =====================

function dist(a,b){
  return map.distance(a,b);
}

// =====================
// BFS PATHFIND
// =====================

function findPath(start, end){

  let queue = [[start]];
  let visited = new Set();

  while(queue.length){

    let path = queue.shift();
    let node = path[path.length-1];

    if(node === end) return path;

    if(visited.has(node)) continue;
    visited.add(node);

    let neighbors = graph[node] || [];

    for(let n of neighbors){
      queue.push([...path, n]);
    }
  }

  return null;
}

// =====================
// RESET
// =====================

function reset(){
  selected = [];
  document.getElementById("info").innerHTML = "Nincs kiválasztva";
  if(routeLayer) map.removeLayer(routeLayer);
}

// =====================
// LOAD OSM GEOJSON
// =====================

fetch("budai.geojson")
.then(r => r.json())
.then(data => {

  L.geoJSON(data, {

    style:{
      color:"green",
      weight:4
    },

    onEachFeature:(feature, layer) => {

      let coords = [];

      if(feature.geometry.type === "LineString"){
        coords = feature.geometry.coordinates.map(c => [c[1],c[0]]);
      }

      if(feature.geometry.type === "MultiLineString"){
        feature.geometry.coordinates.forEach(line=>{
          line.forEach(c=>{
            coords.push([c[1],c[0]]);
          });
        });
      }

      // =====================
      // GRAPH BUILD
      // =====================

      for(let i=1;i<coords.length;i++){

        let a = coords[i-1].toString();
        let b = coords[i].toString();

        if(!graph[a]) graph[a]=[];
        if(!graph[b]) graph[b]=[];

        graph[a].push(b);
        graph[b].push(a);
      }

      // =====================
      // CLICK SELECT
      // =====================

      layer.on("click", e => {

        let key = e.latlng.lat.toFixed(5)+","+e.latlng.lng.toFixed(5);

        nodes[key] = e.latlng;

        selected.push(key);

        document.getElementById("info").innerHTML =
          "📍 " + selected.length + "/2 kiválasztva";

        if(selected.length === 2){
          drawRoute(selected[0], selected[1]);
          selected = [];
        }

      });

    }

  }).addTo(map);

});

// =====================
// DRAW ROUTE
// =====================

function drawRoute(a,b){

  let path = findPath(a,b);

  if(!path){
    alert("Nincs útvonal!");
    return;
  }

  let latlngs = path.map(p => {
    let [lat,lng] = p.split(",");
    return [parseFloat(lat), parseFloat(lng)];
  });

  if(routeLayer) map.removeLayer(routeLayer);

  routeLayer = L.polyline(latlngs,{
    color:"red",
    weight:6
  }).addTo(map);

  map.fitBounds(routeLayer.getBounds());

  document.getElementById("info").innerHTML =
    "<div class='route'>🧭 Útvonal kész<br>" +
    "📏 pontok: " + path.length + "</div>";
}

</script>

</body>
</html>
