<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Stop Arrivals V1</title>

<style>
body {
  font-family: Arial;
  background: #0f0f0f;
  color: #fff;
  margin: 0;
  padding: 20px;
}

h1 {
  font-size: 20px;
  margin-bottom: 10px;
}

.search-box {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

input {
  flex: 1;
  padding: 10px;
  font-size: 14px;
}

button {
  padding: 10px;
  cursor: pointer;
}

#board {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* 15 soros kijelző */
.row {
  display: flex;
  justify-content: space-between;
  padding: 8px;
  background: #1c1c1c;
  border-left: 4px solid #444;
  font-size: 13px;
}

.row.siet {
  border-left: 4px solid red;
}

.row.ok {
  border-left: 4px solid lime;
}

.col {
  width: 20%;
  text-align: left;
}

.small {
  font-size: 11px;
  opacity: 0.8;
}
</style>
</head>

<body>

<h1>🚏 STOP ARRIVALS V1</h1>

<div class="search-box">
  <input id="stopInput" placeholder="Megálló neve / kód (pl. Nád utca)">
  <button onclick="loadStop()">Keresés</button>
</div>

<div id="board"></div>

<script>
// 🔥 MOCK GTFS / REALTIME SIMULATION
function generateMockData() {
  const data = [];

  for (let i = 0; i < 15; i++) {
    const delay = Math.floor(Math.random() * 6) - 2; // -2 to +3 min
    const sec = Math.floor(Math.random() * 60);

    data.push({
      route: "B" + (5 + i),
      direction: i % 2 === 0 ? "Árpád híd" : "Batthyány tér",
      arrival: (10 + i) + ":" + (sec < 10 ? "0"+sec : sec),
      delay: delay,
      vehicleId: "BUS-" + (1000 + i),
      tripId: "TRIP-" + Math.floor(Math.random() * 99999)
    });
  }

  return data;
}

// 🚏 RENDER 15 SOR
function renderBoard(data) {
  const board = document.getElementById("board");
  board.innerHTML = "";

  data.slice(0, 15).forEach(d => {
    const div = document.createElement("div");

    let statusText = "OK";
    let cls = "ok";

    if (d.delay > 0) {
      statusText = "KÉSÉS +" + d.delay + "p";
      cls = "siet";
    } else if (d.delay < 0) {
      statusText = "SIET " + d.delay + "p";
      cls = "siet";
    }

    div.className = "row " + cls;

    div.innerHTML = `
      <div class="col"><b>${d.route}</b></div>
      <div class="col">${d.direction}</div>
      <div class="col">${d.arrival}</div>
      <div class="col">${statusText}</div>
      <div class="col small">${d.vehicleId}</div>
    `;

    board.appendChild(div);
  });
}

// 🔍 STOP LOAD
function loadStop() {
  const val = document.getElementById("stopInput").value;

  if (!val) {
    alert("Adj meg egy megállót!");
    return;
  }

  // itt később GTFS filter lesz
  const data = generateMockData();

  renderBoard(data);
}

// auto start demo
renderBoard(generateMockData());
</script>

</body>
</html>
