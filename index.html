<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR INTELLIGENCE V7</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b0f14;
    color:#d7e6ff;
}

header{
    background:#111a27;
    padding:10px;
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid #223;
}

.grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    height:calc(100vh - 50px);
}

.panel{
    margin:6px;
    padding:10px;
    background:#0f1724;
    border:1px solid #223;
    overflow:auto;
    min-height:200px;
}

h2{ font-size:13px; color:#7cc4ff; }

input{
    width:100%;
    padding:8px;
    margin:6px 0;
    background:#0b1220;
    border:1px solid #2a3a55;
    color:white;
}

.stop{
    padding:6px;
    border-bottom:1px solid #1f2c40;
    cursor:pointer;
}
.stop:hover{ background:#162235; }

.good{ color:#7CFF9E; }
.bad{ color:#ff6b6b; }
.warn{ color:#ffd37c; }

.small{ font-size:12px; opacity:0.8; }
</style>
</head>

<body>

<header>
<div>🚦 FUTÁR INTELLIGENCE V7</div>
<div class="small">GTFS CORE + FUZZY SEARCH + SAFE ENGINE</div>
</header>

<div class="grid">

<!-- SEARCH -->
<div class="panel">
<h2>🔎 MEGÁLLÓ KERESŐ (INTELLIGENS)</h2>
<input id="q" placeholder="pl. deak, nyugati, kelenfold..." oninput="searchStops()">
<div id="results"></div>
</div>

<!-- DEPARTURES -->
<div class="panel">
<h2>🚏 INDULÁSOK (GTFS ENGINE)</h2>
<div id="departures">válassz megállót</div>
</div>

<!-- MAP SIM -->
<div class="panel">
<h2>🗺 LIVE MAP CORE</h2>
<div id="map">nincs kiválasztva</div>
</div>

<!-- DEBUG -->
<div class="panel">
<h2>🧠 DEBUG ENGINE</h2>
<div id="debug"></div>
</div>

</div>

<script>

/* =========================
   🧠 GTFS CORE DATA
========================= */

const stops = [
 {id:"S1", name:"Deák Ferenc tér"},
 {id:"S2", name:"Nyugati pályaudvar"},
 {id:"S3", name:"Batthyány tér"},
 {id:"S4", name:"Kelenföld vasútállomás"},
 {id:"S5", name:"Örs vezér tere"},
 {id:"S6", name:"Blaha Lujza tér"},
 {id:"S7", name:"Astoria"},
 {id:"S8", name:"Széll Kálmán tér"}
];

const trips = [
 {id:"T1", route:"M2"},
 {id:"T2", route:"4-6"},
 {id:"T3", route:"47"},
 {id:"T4", route:"H5"},
];

const stopTimes = [
 {trip:"T1", stop:"S1", min:0},
 {trip:"T1", stop:"S2", min:5},

 {trip:"T2", stop:"S2", min:0},
 {trip:"T2", stop:"S3", min:4},

 {trip:"T3", stop:"S1", min:2},
 {trip:"T3", stop:"S4", min:12},

 {trip:"T4", stop:"S3", min:0},
 {trip:"T4", stop:"S5", min:6},
];

/* =========================
   🧠 ENGINE STATE
========================= */

let selectedStop = null;

/* =========================
   🧠 UTIL: SAFE NORMALIZER
========================= */

function normalize(str){
    return (str || "")
        .toLowerCase()
        .replaceAll("á","a")
        .replaceAll("é","e")
        .replaceAll("í","i")
        .replaceAll("ó","o")
        .replaceAll("ö","o")
        .replaceAll("ő","o")
        .replaceAll("ú","u")
        .replaceAll("ü","u");
}

function nowMin(){
    const d = new Date();
    return d.getHours()*60 + d.getMinutes();
}

function log(msg){
    document.getElementById("debug").innerHTML += msg + "<br>";
}

/* =========================
   🔎 INTELLIGENS SEARCH
========================= */

function searchStops(){
    try {
        const q = normalize(document.getElementById("q").value);
        const box = document.getElementById("results");

        box.innerHTML = "";

        const list = (q.length === 0)
            ? stops
            : stops.filter(s =>
                normalize(s.name).includes(q)
            );

        if(list.length === 0){
            box.innerHTML = "<div class='warn'>Nincs találat</div>";
            return;
        }

        list.forEach(s=>{
            const div = document.createElement("div");
            div.className="stop";
            div.innerText = s.name;
            div.onclick = ()=>selectStop(s);
            box.appendChild(div);
        });

        log("SEARCH OK: " + list.length);

    } catch(e){
        log("SEARCH ERROR: " + e.message);
    }
}

/* =========================
   🚏 SELECT STOP
========================= */

function selectStop(stop){
    selectedStop = stop;
    log("SELECT: " + stop.name);

    renderDepartures(stop.id);
    renderMap(stop.name);
}

/* =========================
   🚦 GTFS ENGINE V7
========================= */

function renderDepartures(stopId){
    try {
        const box = document.getElementById("departures");
        const now = nowMin();

        let hits = stopTimes.filter(st => st.stop === stopId);

        if(hits.length === 0){
            box.innerHTML = "<span class='warn'>nincs GTFS adat</span>";
            return;
        }

        let result = hits.map(h=>{
            let trip = trips.find(t => t.id === h.trip);

            return {
                line: trip.route,
                min: h.min
            };
        });

        result = result.filter(r => r.min >= (now % 60));

        box.innerHTML = "<b>" + selectedStop.name + "</b><br><br>";

        if(result.length === 0){
            box.innerHTML += "<span class='warn'>nincs mai indulás</span>";
            return;
        }

        result.forEach(r=>{
            let t = new Date();
            t.setMinutes(t.getMinutes() + (r.min - (now % 60)));

            box.innerHTML += `
                🚍 ${r.line} → ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}<br>
            `;
        });

        log("DEPARTURES OK");

    } catch(e){
        document.getElementById("departures").innerHTML =
            "<span class='bad'>ENGINE FAILSAFE ACTIVE</span>";
        log("ENGINE ERROR: " + e.message);
    }
}

/* =========================
   🗺 MAP CORE SAFE
========================= */

function renderMap(name){
    try {
        document.getElementById("map").innerHTML = `
            <div class="good">📍 ACTIVE STOP</div>
            <div>${name}</div>
            <br>
            <div class="small">V7 INTELLIGENCE LAYER ACTIVE</div>
        `;
    } catch(e){
        log("MAP ERROR: " + e.message);
    }
}

/* BOOT */
log("FUTÁR INTELLIGENCE V7 READY");

</script>

</body>
</html>
