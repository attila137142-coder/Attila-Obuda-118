<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attila Multi GTFS V5.2.1</title>

<link rel="stylesheet" 
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>

body{
margin:0;
font-family:Arial;
background:#111;
color:white;
}


.header{

background:#003300;
text-align:center;
padding:10px;

}


.clock{

font-size:36px;
font-weight:bold;
color:#00ff66;

}



.layout{

display:grid;
grid-template-columns:280px 1fr 300px;
height:calc(100vh - 100px);

}



.panel{

background:#1d1d1d;
padding:12px;
overflow:auto;

}



#map{

height:100%;
width:100%;

}



input{

width:100%;
padding:10px;
font-size:17px;
box-sizing:border-box;

}



button{

width:100%;
padding:12px;
margin-top:8px;
background:#0066cc;
color:white;
border:0;
border-radius:6px;

}



.card{

background:#222;
padding:10px;
margin-top:10px;
border-radius:8px;

}



.green{
color:#00ff66;
}


.red{
color:red;
}


</style>

</head>


<body>


<div class="header">

<h2>
🚦 Attila Multi GTFS V5.2.1
</h2>

<div id="clock" class="clock"></div>

</div>




<div class="layout">


<div class="panel">


<h3>
🚏 Megálló kereső
</h3>


<input id="search"
placeholder="Nád utca vagy 008939,044192">


<button onclick="keres()">
🔎 Keresés
</button>


<div id="result"></div>



<h3>
🗺 Rétegek
</h3>


<div class="card">

☑ Utca térkép

<br><br>

☐ Vasúti pálya

<br><br>

☐ Topográf

<br><br>

☐ Volán

<br><br>

☐ Vonatkövetés

</div>


</div>




<div id="map"></div>




<div class="panel">


<h3>
🚏 Találatok
</h3>


<div id="departures"
class="card">

Nincs indulási adat

</div>


<h3>
🚍 Jármű

</h3>


<div class="card">

Járat:
-

<br><br>

Jármű:
-

<br><br>

GPS:
-

</div>



<h3>
🚦 Sebesség

</h3>


<div class="card green">

0 km/h

<br>

0 m/s

</div>


</div>



</div>





<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>


// ÓRA

function ora(){

let d=new Date();

document.getElementById("clock").innerHTML=
d.toLocaleDateString("hu-HU")
+" "
+
d.toLocaleTimeString("hu-HU");

}

setInterval(ora,1000);

ora();





// TÉRKÉP


let map;


try{


map=L.map("map")
.setView(
[47.55,19.05],
10
);



L.tileLayer(
"https://tile.openstreetmap.org/{z}/{x}/{y}.png",
{

maxZoom:19,
attribution:"OpenStreetMap"

}

).addTo(map);



}

catch(e){

alert(
"A térkép nem töltődött be!"
);

}





// TESZT GTFS ADAT


let stops={


"008939":
{
name:"160 busz megálló",
lat:47.562000,
lon:19.045000
},


"044192":
{
name:"243 busz megálló",
lat:47.570000,
lon:19.050000
},


"09183208":
{
name:"H8 HÉV",
lat:47.670000,
lon:19.070000
},


"Nád utca":
{
name:"Nád utca",
lat:47.560000,
lon:19.030000
}

};



let markerGroup=[];




function keres(){


let text=
document.getElementById("search")
.value
.trim();


let keresett=[];



if(text.includes(","))
{

keresett=text
.split(",")
.map(x=>x.trim());

}

else
{

keresett=[text];

}




markerGroup.forEach(m=>
map.removeLayer(m)
);

markerGroup=[];



let html="";



keresett.forEach(id=>{


let s=stops[id];



if(s){


let marker=
L.marker(
[s.lat,s.lon]
)
.addTo(map)
.bindPopup(
s.name
);



markerGroup.push(marker);



map.setView(
[s.lat,s.lon],
14
);



html+=`

<div class="card">

🚏 ${s.name}

<br>

ID:
<b>${id}</b>

<br><br>

📍 ${s.lat.toFixed(6)}

<br>

${s.lon.toFixed(6)}

</div>

`;



}

else{


html+=`

<div class="card red">

❌ Nincs találat:

${id}

</div>

`;

}



});



document.getElementById("result")
.innerHTML=html;



}



</script>


</body>
</html>
