<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attila MULTI STOP FINDER PRO</title>
<style>
body { font-family: Arial; background:#0f172a; color:#fff; padding:20px }
input, button { padding:10px; margin:5px; border-radius:8px; border:none }
button { background:#22c55e; color:#fff; font-weight:bold; cursor:pointer }
.card { background:#1e293b; padding:12px; border-radius:10px; margin-top:10px }
</style>
</head>
<body>

<h1>🚍 Attila MULTI STOP FINDER PRO</h1>

<input id="q" placeholder="Megálló név vagy ID">
<button onclick="searchAll()">KERESÉS</button>

<div id="results"></div>

<script>
let REAL_STOPS = [];

// ===== GTFS BETÖLTÉS =====
function loadGTFS(file){
  let reader = new FileReader();

  reader.onload = function(e){
    let lines = e.target.result.split("\n");
    let headers = lines[0].split(",");

    let nameIdx = headers.indexOf("stop_name");
    let idIdx = headers.indexOf("stop_id");
    let latIdx = headers.indexOf("stop_lat");
    let lonIdx = headers.indexOf("stop_lon");

    REAL_STOPS = [];

    for(let i=1;i<lines.length;i++){
      let cols = lines[i].split(",");
      if(cols.length < 5) continue;

      REAL_STOPS.push({
        id: cols[idIdx],
        name: cols[nameIdx],
        lat: parseFloat(cols[latIdx]),
        lon: parseFloat(cols[lonIdx]),
        type: "GTFS"
      });
    }

    alert("GTFS betöltve: " + REAL_STOPS.length + " megálló");
  };

  reader.readAsText(file);
}

// ===== TÁVOLSÁG =====
function dist(a,b,c,d){
  const R=6371000;
  const toRad=x=>x*Math.PI/180;
  let dLat=toRad(c-a);
  let dLon=toRad(d-b);
  let A=Math.sin(dLat/2)**2+
    Math.cos(toRad(a))*Math.cos(toRad(c))*
    Math.sin(dLon/2)**2;
  let C=2*Math.atan2(Math.sqrt(A),Math.sqrt(1-A));
  return R*C;
}

// ===== GPS =====
function getLoc(cb){
  navigator.geolocation.getCurrentPosition(p=>{
    cb(p.coords.latitude,p.coords.longitude);
  });
}

// ===== FORMÁZÁS =====
function kmFormat(m){
  return (m/1000).toFixed(2); // század km
}

function coordFormat(x){
  return x.toFixed(6); // 6 tizedes
}

// ===== KERESÉS =====
function searchAll(){
  let q=document.getElementById('q').value.toLowerCase();

  let results=REAL_STOPS.filter(s=>
    s.name.toLowerCase().includes(q) ||
    s.id.toLowerCase().includes(q)
  );

  if(results.length===0){
    document.getElementById('results').innerHTML="❌ Nincs találat (nincs betöltve GTFS?)";
    return;
  }

  getLoc((lat,lon)=>{

    results.sort((a,b)=>{
      return dist(lat,lon,a.lat,a.lon) - dist(lat,lon,b.lat,b.lon);
    });

    let html="";

    results.forEach(s=>{
      let d=dist(lat,lon,s.lat,s.lon);
      let road=d*1.3;

      html+=`<div class="card">
        <b>${s.name}</b><br>
        🆔 ${s.id}<br>
        📍 ${coordFormat(s.lat)}, ${coordFormat(s.lon)}<br>
        📏 Légvonal: ${kmFormat(d)} km<br>
        🛣️ Úton: ${kmFormat(road)} km
      </div>`;
    });

    document.getElementById('results').innerHTML=html;

  });
}
</script>

</body>
</html>
