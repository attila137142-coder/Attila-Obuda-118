/* =========================================================

   ========================================================= */

const VEHICLE_URL =
"https://go.bkk.hu/api/query/v1/ws/gtfs-rt/full/VehiclePositions.pb";


/* Google GTFS-RT protobuf */

const PROTO_URL =
"https://raw.githubusercontent.com/google/transit/master/gtfs-realtime/proto/gtfs-realtime.proto";


/* =========================================================
   GLOBÁLIS VÁLTOZÓK
   ========================================================= */

let map;

let vehicleLayer;

let myMarker = null;

let myPos = null;

let gpsWatchId = null;

let autoTimer = null;

let autoRunning = false;

let protoRoot = null;

let vehicleData = [];


/* =========================================================
   INDÍTÁS
   ========================================================= */

document.addEventListener(
"DOMContentLoaded",
function(){

  logLine("======================================");

  logLine(
    "ATTILA KÖZLEKEDÉS – BKK VADÁSZ"
  );

  logLine(
    "JavaScript: OK"
  );

  logLine(
    "HTML inicializálva."
  );

  initMap();

  loadSavedKey();

  bindButtons();

  logLine(
    "Gombok bekötve."
  );

  logLine(

  );

}
);


/* =========================================================
   TÉRKÉP
   ========================================================= */

function initMap(){

  map =
    L.map("map")
     .setView(
       [47.4979,19.0402],
       11
     );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

      maxZoom:19,
      attribution:

  ).addTo(map);


  vehicleLayer =
    L.layerGroup()
              .addTo(map);


  logLine(

}


/* =========================================================
   GOMBOK
   ========================================================= */

function bindButtons(){

  document
    .getElementById("saveBtn")
    .addEventListener(
      "click",
      saveKey
    );


  document
    .getElementById("feedBtn")

/* =========================================================
   API KULCS BETÖLTÉSE
   ========================================================= */

function loadSavedKey(){

  try{

    const key =
      localStorage.getItem(
        "ATTILA_BKK_API_KEY"
      ) || "";


    document
      .getElementById("apiKey")
      .value =
      key;


    if(key){

      logLine(
        "Mentett BKK API-kulcs betöltve."
      );

    }else{

      logLine(
        "Nincs mentett API-kulcs."
      );

    }

  }
  catch(e){

    logLine(
      "LocalStorage hiba: "+
      e.message
    );

  }

}


/* =========================================================
   API KULCS MENTÉSE
   ========================================================= */

function saveKey(){

  const key =
    document
      .getElementById("apiKey")
      .value
      .trim();


  if(!key){

    logLine(
      "FIGYELEM: üres API-kulcs."
    );

    setFeed(
      "API KULCS ÜRES",
      "err"
    );

    return;

  }


  try{

    localStorage.setItem(
      "ATTILA_BKK_API_KEY",
      key
    );


    logLine(
      "API-kulcs elmentve."
    );


    setFeed(
      "KULCS ELMENTVE",
      "ok"
    );

  }
  catch(e){

    logLine(
      "Mentési hiba: "+
      e.message
    );

  }

}


/* =========================================================
   FEED ÁLLAPOT
   ========================================================= */

function setFeed(text,cls){

  const el =
    document.getElementById(
      "feedState"
    );


  el.textContent = text;

  el.className =
    "badge "+
    cls;

}


/* =========================================================
   GPS ÁLLAPOT
   ========================================================= */

function setGPS(text,cls){

  const el =
    document.getElementById(
      "gpsState"
    );


  el.textContent = text;

  el.className =
    "badge "+
    cls;

}


/* =========================================================
   PROTOBUF BETÖLTÉS
   ========================================================= */

async function loadProto(){

  if(protoRoot){

    return protoRoot;

  }


  logLine(
    "GTFS-RT protobuf betöltése..."
  );


  protoRoot =
    await protobuf.load(
      PROTO_URL
    );


  logLine(
    "GTFS-RT protobuf: OK"
  );


  return protoRoot;

}


/* =========================================================
   HAVERSINE TÁVOLSÁG
   ========================================================= */

function distanceKm(a,b){

  const R = 6371;


  const dLat =
    (b.lat-a.lat) *
    Math.PI/180;


  const dLon =
    (b.lon-a.lon) *
    Math.PI/180;


  const x =
    Math.sin(dLat/2) *
    Math.sin(dLat/2) +

    Math.cos(
      a.lat*Math.PI/180
    ) *

    Math.cos(
      b.lat*Math.PI/180
    ) *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);


  return (
    2*R*
    Math.asin(
      Math.sqrt(x)
    )
  );

}


/* =========================================================
   GPS INDÍTÁSA
   ========================================================= */

function startGPS(){

  logLine(
    "GPS gomb megnyomva."
  );


  if(!navigator.geolocation){

    setGPS(
      "GPS NEM TÁMOGATOTT",
      "err"
    );


    logLine(
      "A böngésző nem támogatja a geolocation API-t."
    );

    return;

  }


  setGPS(
    "GPS KERESÉS...",
    "wait"
  );


  if(gpsWatchId !== null){

    navigator.geolocation.clearWatch(
      gpsWatchId
    );

  }


  gpsWatchId =
    navigator.geolocation.watchPosition(

      function(position){

        updateGPS(
          position
        );

      },


      function(error){

        setGPS(
          "GPS HIBA",
          "err"
        );


        let text =
          "GPS hiba: "+
          error.message;


        if(error.code===1){

          text +=
          " – a helymeghatározás engedélyezése szükséges.";

        }


        if(error.code===2){

          text +=
          " – a pozíció nem határozható meg.";

        }


        if(error.code===3){

          text +=
          " – GPS időtúllépés.";

        }


        logLine(text);

      },


      {
        enableHighAccuracy:true,
        maximumAge:3000,
        timeout:15000
      }

    );


  logLine(
    "GPS figyelés elindítva."
  );

}


/* =========================================================
   GPS FRISSÍTÉS
   ========================================================= */

function updateGPS(position){

  const lat =
    Number(
      position.coords.latitude
    );


  const lon =
    Number(
      position.coords.longitude
    );


  const accuracy =
    Number(
      position.coords.accuracy
    );


  myPos = {
    lat:lat,
    lon:lon
  };


  document
    .getElementById("lat")
    .textContent =
    lat.toFixed(6);


  document
    .getElementById("lon")
    .textContent =
    lon.toFixed(6);


  document
    .getElementById("acc")
    .textContent =
    Number.isFinite(accuracy)
    ?
    Math.round(accuracy)+" m"
    :
    "-";


  setGPS(
    "GPS OK",
    "ok"
  );


  if(!myMarker){

    myMarker =
      L.circleMarker(
        [lat,lon],
        {
          radius:9,
          weight:3,
          fillOpacity:.65
        }
      ).addTo(map);


    map.setView(
      [lat,lon],
      15
    );

  }
  else{

    myMarker.setLatLng(
      [lat,lon]
    );

  }


  logLine(
    "GPS OK: "+
    lat.toFixed(6)+
    ", "+
    lon.toFixed(6)+
    " ±"+
    Math.round(accuracy)+
    " m"
  );


  updateVehicleDistances();

}


/* =========================================================
   FEED TESZT
   ========================================================= */

async function testFeed(){

  logLine(
    "--------------------------------------"
  );


  logLine(
    "FEED TESZT GOMB MEGNYOMVA."
  );


  const key =
    document
      .getElementById("apiKey")
      .value
      .trim();


  if(!key){

    setFeed(
      "API KULCS HIÁNYZIK",
      "err"
    );


    document
      .getElementById("http")
      .textContent =
      "-";


    document
      .getElementById("count")
      .textContent =
      "0";


    logLine(
      "NINCS API-kulcs."
    );


    logLine(
      "Írd be a BKK API-kulcsot, majd Mentés."
    );


    return;

  }


  setFeed(
    "FEED LEKÉRÉS...",
    "wait"
  );


  document
    .getElementById("lastFetch")
    .textContent =
    new Date()
    .toLocaleTimeString(
      "hu-HU"
    );


  document
    .getElementById("http")
    .textContent =
    "...";


  document
    .getElementById("bytes")
    .textContent =
    "...";


  logLine(
    "VehiclePositions.pb lekérése..."
  );


  const start =
    performance.now();


  try{

    const url =
      VEHICLE_URL+
      "?key="+
      encodeURIComponent(key);


    logLine(
      "BKK URL összeállítva."
    );


    const response =
      await fetch(
        url,
        {
          method:"GET",
          cache:"no-store"
        }
      );


    document
      .getElementById("http")
      .textContent =
      response.status;


    logLine(
      "HTTP válasz: "+
      response.status+
      " "+
      response.statusText
    );


    if(!response.ok){

      throw new Error(
        "HTTP "+
        response.status+
        " "+
        response.statusText
      );

    }


    const buffer =
      await response.arrayBuffer();


    document
      .getElementById("bytes")
      .textContent =
      buffer.byteLength+
      " byte";


    logLine(
      "Érkezett: "+
      buffer.byteLength+
      " byte."
    );


    if(buffer.byteLength===0){

      throw new Error(
        "A BKK szerver 0 byte adatot küldött."
      );

    }


    await loadProto();


    logLine(
      "Protobuf dekódolás..."
    );


    const FeedMessage =
      protoRoot.lookupType(
        "transit_realtime.FeedMessage"
      );


    const feed =
      FeedMessage.decode(
        new Uint8Array(buffer)
      );


    logLine(
      "Protobuf dekódolás: OK"
    );


    const entities =
      feed.entity || [];


    logLine(
      "Feed entity-k: "+
      entities.length
    );


    vehicleLayer.clearLayers();


    const list =
      document.getElementById(
        "vehicles"
      );


    list.innerHTML="";


    vehicleData=[];


    let count=0;


    for(
      const entity
      of entities
    ){

      if(
        !entity.vehicle ||
        !entity.vehicle.position
      ){

        continue;

      }


      const v =
        entity.vehicle;


      const p =
        v.position;


      const lat =
        Number(p.latitude);


      const lon =
        Number(p.longitude);


      if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
      ){

        continue;

      }


      /* ===============================================
         JÁRMŰAZONOSÍTÓK
         =============================================== */

      const vehicleId =
        v.vehicle &&
        v.vehicle.id
        ?
        v.vehicle.id
        :
        "";


      const label =
        v.vehicle &&
        v.vehicle.label
        ?
        v.vehicle.label
        :
        "";


      const licensePlate =
        v.vehicle &&
        v.vehicle.licensePlate
        ?
        v.vehicle.licensePlate
        :
        "";


      const tripId =
        v.trip &&
        v.trip.tripId
        ?
        v.trip.tripId
        :
        "";


      const routeId =
        v.trip &&
        v.trip.routeId
        ?
        v.trip.routeId
        :
        "";


      const directionId =
        v.trip &&
        v.trip.directionId !== undefined
        ?
        v.trip.directionId
        :
        "";


      const stopId =
        v.stopId
        ?
        v.stopId
        :
        "";


      const stopSequence =
        v.currentStopSequence !== undefined
        ?
        v.currentStopSequence
        :
        "";


      /* ===============================================
         SEBESSÉG
         GTFS-RT: m/s
         =============================================== */

      const rawSpeed =
        Number(p.speed);


      let speedKmh = null;


      if(
        Number.isFinite(rawSpeed)
      ){

        speedKmh =
          rawSpeed*3.6;

      }


      /* ===============================================
         IRÁNY
         =============================================== */

      const bearing =
        Number(p.bearing);


      /* ===============================================
         TÁVOLSÁG
         =============================================== */

      let distance = null;


      if(myPos){

        distance =
          distanceKm(
            myPos,
            {
              lat:lat,
              lon:lon
            }
          );

      }


      /* ===============================================
         MARKER
         =============================================== */

      const marker =
        L.circleMarker(
          [lat,lon],
          {
            radius:7,
            weight:2,
            fillOpacity:.9
          }
        ).addTo(
          vehicleLayer
        );


      /* ===============================================
         POPUP
         =============================================== */

      let popup = "";

      popup +=
        "<div style='min-width:230px;color:#111'>";

      popup +=
        "<b>🚍 BKK VALÓS JÁRMŰ</b>";

      popup +=
        "<hr>";


      popup +=
        "<b>Jármű ID:</b> "+
        escapeHtml(
          vehicleId || "-"
        )+
        "<br>";


      popup +=
        "<b>Label:</b> "+
        escapeHtml(
          label || "-"
        )+
        "<br>";


      popup +=
        "<b>Rendszám:</b> "+
        escapeHtml(
          licensePlate || "-"
        )+
        "<br>";


      popup +=
        "<b>Járat:</b> "+
        escapeHtml(
          routeId || "-"
        )+
        "<br>";


      popup +=
        "<b>Trip:</b> "+
        escapeHtml(
          tripId || "-"
        )+
        "<br>";


      popup +=
        "<b>Direction:</b> "+
        escapeHtml(
          String(
            directionId || "-"
          )
        )+
        "<br>";


      popup +=
        "<b>Stop ID:</b> "+
        escapeHtml(
          stopId || "-"
        )+
        "<br>";


      popup +=
        "<b>Stop sequence:</b> "+
        escapeHtml(
          String(
            stopSequence || "-"
          )
        )+
        "<br>";


      popup +=
        "<b>GPS:</b> "+
        lat.toFixed(6)+
        ", "+
        lon.toFixed(6)+
        "<br>";


      popup +=
        "<b>Sebesség:</b> "+
        (
          speedKmh===null
          ?
          "-"
          :
          speedKmh.toFixed(1)+
          " km/h"
        )+
        "<br>";


      popup +=
        "<b>Irány:</b> "+
        (
          Number.isFinite(bearing)
          ?
          bearing.toFixed(0)+"°"
          :
          "-"
        )+
        "<br>";


      popup +=
        "<b>Saját GPS:</b> "+
        (
          distance===null
          ?
          "-"
          :
          distance.toFixed(2)+
          " km"
        );


      popup +=
        "</div>";


      marker.bindPopup(
        popup
      );


      /* ===============================================
         LISTAELEM
         =============================================== */

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "vehicle";


      div.dataset.lat =
        String(lat);


      div.dataset.lon =
        String(lon);


      const title =
        label ||
        routeId ||
        vehicleId ||
        "ISMERETLEN JÁRMŰ";


      let html = "";


      html +=
        "<div class='vehicleTitle'>"+
        "🚍 "+
        escapeHtml(title)+
        "</div>";


      html +=
        "Jármű ID: "+
        escapeHtml(
          vehicleId || "-"
        )+
        "<br>";


      html +=
        "Járat: "+
        escapeHtml(
          routeId || "-"
        )+
        "<br>";


      html +=
        "Rendszám: "+
        escapeHtml(
          licensePlate || "-"
        )+
        "<br>";


      html +=
        "Sebesség: "+
        (
          speedKmh===null
          ?
          "-"
          :
          speedKmh.toFixed(1)+
          " km/h"
        )+
        "<br>";


      html +=
        "Távolság: "+
        (
          distance===null
          ?
          "-"
          :
          distance.toFixed(2)+
          " km"
        )+
        "<br>";


      html +=
        "GPS: "+
        lat.toFixed(6)+
        ", "+
        lon.toFixed(6);


      div.innerHTML =
        html;


      div.addEventListener(
        "click",
        function(){

          map.setView(
            [lat,lon],
            17
          );


          marker.openPopup();

        }
      );


      list.appendChild(
        div
      );


      vehicleData.push({

        element:div,

        marker:marker,

        lat:lat,

        lon:lon,

        vehicleId:vehicleId,

        label:label,

        routeId:routeId,

        tripId:tripId,

        licensePlate:licensePlate,

        speed:speedKmh

      });


      count++;

    }


    document
      .getElementById("count")
      .textContent =
      count;


    if(count===0){

      setFeed(
        "FEED OK – 0 JÁRMŰ",
        "ok"
      );


      list.innerHTML =
        "A feed elérhető, de most nincs feldolgozható VehiclePosition.";

      logLine(
        "FIGYELEM: 0 feldolgozható jármű."
      );

    }
    else{

      setFeed(
        "FEED OK – "+
        count+
        " JÁRMŰ",
        "ok"
      );


      logLine(
        "VALÓDI VehiclePosition rekordok: "+
        count
      );

    }


    updateVehicleDistances();


    const elapsed =
      performance.now()-
      start;


    logLine(
      "Feldolgozási idő: "+
      elapsed.toFixed(0)+
      " ms"
    );


  }
  catch(error){

    const message =
      error &&
      error.message
      ?
      error.message
      :
      String(error);


    setFeed(
      "FEED HIBA",
      "err"
    );


    logLine(
      "HIBA: "+
      message
    );


    document
      .getElementById("count")
      .textContent =
      "0";


    /* ===============================================
       HIBADIAGNOSZTIKA
       =============================================== */

    if(
      message.includes(
        "Failed to fetch"
      )
    ){

      logLine(
        "VALÓSZÍNŰ OK: CORS / hálózati tiltás / böngészőből nem elérhető végpont."
      );

    }


    if(
      message.includes("401")
    ){

      logLine(
        "401 – API-kulcs probléma."
      );

    }


    if(
      message.includes("403")
    ){

      logLine(
        "403 – hozzáférés megtagadva."
      );

    }


    if(
      message.includes("404")
    ){

      logLine(
        "404 – a feed végpont nem található."
      );

    }


    if(
      message.toLowerCase()
      .includes("protobuf")
    ){

      logLine(
        "Protobuf feldolgozási hiba."
      );

    }

  }

}


/* =========================================================
   GPS ALAPÚ TÁVOLSÁG FRISSÍTÉS
   ========================================================= */

function updateVehicleDistances(){

  if(!myPos){

    document
      .getElementById("near")
      .textContent =
      "-";

    return;

  }


  let nearest =
    Infinity;


  for(
    const item
    of vehicleData
  ){

    const distance =
      distanceKm(
        myPos,
        {
          lat:item.lat,
          lon:item.lon
        }
      );


    if(
      distance<
      nearest
    ){

      nearest =
        distance;

    }


    const distText =
      distance.toFixed(2)+
      " km";


    const div =
      item.element;


    if(div){

      /* A teljes szöveget nem írjuk újra,
         csak a távolság sort keressük. */

      const rows =
        div.innerHTML
        .split("<br>");


      for(
        let i=0;
        i<rows.length;
        i++
      ){

        if(
          rows[i]
          .startsWith(
            "Távolság:"
          )
        ){

          rows[i] =
            "Távolság: "+
            distText;

        }

      }


      div.innerHTML =
        rows.join("<br>");

    }

  }


  if(
    Number.isFinite(nearest)
  ){

    document
      .getElementById("near")
      .textContent =
      nearest.toFixed(2)+
      " km";

  }

}


/* =========================================================
   AUTO
   ========================================================= */

function toggleAuto(){

  if(autoRunning){

    clearInterval(
      autoTimer
    );


    autoTimer=null;

    autoRunning=false;


    document
      .getElementById("autoState")
      .textContent =
      "KIKAPCSOLVA";


    document
      .getElementById("autoBtn")
      .textContent =
      "🔄 AUTO";


    document
      .getElementById("autoBtn")
      .classList
      .remove("stop");


    logLine(
      "AUTO frissítés LEÁLLÍTVA."
    );


    return;

  }


  const key =
    document
      .getElementById("apiKey")
      .value
      .trim();


  if(!key){

    logLine(
      "AUTO nem indul: nincs API-kulcs."
    );


    setFeed(
      "API KULCS HIÁNYZIK",
      "err"
    );


    return;

  }


  autoRunning=true;


  document
    .getElementById("autoState")
    .textContent =
    "10 MP";


  document
    .getElementById("autoBtn")
    .textContent =
    "⛔ AUTO LEÁLLÍTÁS";


  document
    .getElementById("autoBtn")
    .classList
    .add("stop");


  logLine(
    "AUTO ELINDÍTVA – 10 másodperces frissítés."
  );


  testFeed();


  autoTimer =
    setInterval(
      testFeed,
      10000
    );

}


/* =========================================================
   HTML BIZTONSÁG
   ========================================================= */

function escapeHtml(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
