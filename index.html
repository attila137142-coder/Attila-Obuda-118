<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>SLOPE ENGINE V1</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
  body { margin:0; font-family:Arial; background:#111; color:#fff; }
  #map { height: 60vh; }
  #panel { padding:10px; }
  button { padding:10px; margin:5px; }
  table { width:100%; font-size:12px; border-collapse: collapse; }
  td, th { border:1px solid #444; padding:4px; }
</style>
</head>
<body>

<div id="map"></div>

<div id="panel">
  <button onclick="loadOSM()">UTAK BETÖLTÉSE</button>
  <button onclick="calcSlope()">MEREDESÉG SZÁMÍTÁS</button>
  <button onclick="exportPDF()">PDF EXPORT</button>

  <table id="table">
    <tr>
      <th>Szakasz</th>
      <th>Hossz (m)</th>
      <th>Δh (m)</th>
      <th>Meredekség (%)</th>
    </tr>
  </table>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
let map = L.map('map').setView([47.4979, 19.0402], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

let segments = [];

function loadOSM() {
  fetch("roads.geojson") // saját export!
  .then(res => res.json())
  .then(data => {
    window.roads = data.features;
    alert("UTAK BETÖLTVE!");
  });
}

function getElevation(lat, lon) {
  // DEM helyett demo random (cseréld API-ra!)
  return 100 + Math.sin(lat*10)*20 + Math.cos(lon*10)*20;
}

function calcSlope() {
  segments = [];

  roads.forEach(road => {
    let coords = road.geometry.coordinates;

    for (let i=0; i<coords.length-1; i++) {

      let [lon1, lat1] = coords[i];
      let [lon2, lat2] = coords[i+1];

      let h1 = getElevation(lat1, lon1);
      let h2 = getElevation(lat2, lon2);

      let dist = map.distance([lat1, lon1], [lat2, lon2]);

      let slope = ((h2 - h1) / dist) * 100;

      segments.push({
        dist: dist.toFixed(1),
        dh: (h2-h1).toFixed(1),
        slope: slope.toFixed(2),
        coords: [[lat1, lon1],[lat2, lon2]]
      });

      drawSegment(lat1, lon1, lat2, lon2, slope);
      addRow(dist, h2-h1, slope);
    }
  });

  alert("KÉSZ!");
}

function drawSegment(lat1, lon1, lat2, lon2, slope) {
  let color = "green";
  if (slope > 5) color = "orange";
  if (slope > 10) color = "red";

  L.polyline([[lat1,lon1],[lat2,lon2]], {
    color: color,
    weight: 4
  }).addTo(map);
}

function addRow(dist, dh, slope) {
  let table = document.getElementById("table");
  let row = table.insertRow();

  row.innerHTML = `
    <td>Szakasz</td>
    <td>${dist.toFixed(1)}</td>
    <td>${dh.toFixed(1)}</td>
    <td>${slope.toFixed(2)}</td>
  `;
}

function exportPDF() {
  const { jsPDF } = window.jspdf;
  let doc = new jsPDF();

  let y = 10;
  segments.forEach((s,i) => {
    doc.text(
      `#${i} | ${s.dist}m | Δh:${s.dh}m | ${s.slope}%`,
      10, y
    );
    y+=6;
  });

  doc.save("budapest_slope.pdf");
}
</script>

</body>
</html>
