<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FUTÁR V12 IRÁNYÍTÓKÖZPONT</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
    margin:0;
    background:#060a10;
    color:#d7e1ea;
    font-family:Arial;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    padding:10px 14px;
    background:#0d1420;
    border-bottom:2px solid #1e2a3a;
}

.title{
    font-weight:bold;
    color:#7fb3ff;
}

.clock{
    font-size:26px;
    color:#00ff88;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns: 1.5fr 1fr 1fr;
    grid-template-rows:auto auto auto;
    gap:10px;
    padding:10px;
}

/* PANEL */
.panel{
    background:#0e1622;
    border:1px solid #243447;
    border-radius:8px;
    padding:10px;
    overflow:auto;
}

h2{
    margin:0 0 8px 0;
    font-size:12px;
    color:#7fb3ff;
}

/* MAP */
#map{
    height:560px;
    border-radius:8px;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
}

td,th{
    border-bottom:1px solid #243447;
    padding:4px;
}

/* STATUS */
.ok{color:#00ff88;}
.warn{color:#ffcc00;}
.bad{color:#ff4d4d;}

/* LOG */
.log{
    height:220px;
    overflow:auto;
    font-size:11px;
    color:#9bb3c7;
}

/* INPUT */
input,button{
    width:100%;
    padding:7px;
    margin-top:6px;
    border-radius:6px;
    border:none;
}

button{
    background:#00aaff;
    color:white;
    cursor:pointer;
}

/* MINI CARDS */
.cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    font-size:11px;
}

.card{
    background:#111c2a;
    padding:6px;
    border-radius:6px;
}
</style>
</head>

<body>

<div class="header">
    <div class="title">🚍 FUTÁR V12 – BKK IRÁNYÍTÓKÖZPONT</div>
    <div class="clock" id="clock">--:--:--</div>
</div>

<div class="grid">

<!-- SYSTEM CORE -->
<div class="panel">
<h2>🧠 CONTROL CORE</h2>
<div class="cards">
    <div class="card">GTFS<br><span class="ok" id="gtfsState">READY</span></div>
    <div class="card">MAP<br><span class="ok">LIVE</span></div>
    <div class="card">ROUTES<br><span class="warn" id="routesCount">0</span></div>
    <div class="card">STOPS<br><span class="warn" id="stopsCount">0</span></div>
</div>
</div>

<!-- GTFS -->
<div class="panel">
<h2>📦 GTFS INPUT</h2>
<input type="file" id="zip"/>
<div style="font-size:11px;" id="status">Nincs adat</div>
</div>

<!-- ROUTE SEARCH -->
<div class="panel">
<h2>🚍 ROUTE CONTROL</h2>
<input id="rq"/>
<button onclick="routeSearch()">FILTER</button>
<div id="routeOut" style="font-size:11px;"></div>
</div>

<!-- MAP -->
<div class="panel" style="grid-column:span 2;">
<h2>🗺️ LIVE CONTROL MAP</h2>
<div id="map"></div>
</div>

<!-- DISPATCH -->
<div class="panel">
<h2>📊 DISPATCH WALL</h2>
<table>
<thead>
<tr><th>Time</th><th>Route</th><th>Status</th></tr>
</thead>
<tbody id="board"></tbody>
</table>
</div>

<!-- STOP -->
<div class="panel">
<h2>🚏 STOP CONTROL</h2>
<input id="sq"/>
<button onclick="stopSearch()">SEARCH</button>
<div id="stopOut" style="font-size:11px;"></div>
</div>

<!-- LOG -->
<div class="panel">
<h2>📡 EVENT STREAM</h2>
<div class="log" id="log"></div>
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>

// CLOCK
setInterval(()=>{
    document.getElementById("clock").innerText = new Date().toLocaleTimeString();
},1000);

// MAP
const map = L.map("map").setView([47.4979,19.0402],12);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19
}).addTo(map);

let layer = L.layerGroup().addTo(map);

// DATA
let GTFS = {stops:[],routes:[]};

// LOG
function log(m){
    const el=document.getElementById("log");
    el.innerHTML=`[${new Date().toLocaleTimeString()}] ${m}<br>`+el.innerHTML;
}

// LOAD GTFS
document.getElementById("zip").addEventListener("change", async (e)=>{
    const zip = await JSZip.loadAsync(e.target.files[0]);

    GTFS.stops = await csv(zip,"stops.txt");
    GTFS.routes = await csv(zip,"routes.txt");

    document.getElementById("status").innerText="GTFS LOADED";
    document.getElementById("routesCount").innerText=GTFS.routes.length;
    document.getElementById("stopsCount").innerText=GTFS.stops.length;

    draw();
    board();

    log("GTFS loaded into control system");
});

// CSV
async function csv(zip,f){
    const file=zip.file(f);
    if(!file) return [];

    const text=await file.async("string");
    const lines=text.split("\n").filter(Boolean);

    const h=lines[0].split(",");

    return lines.slice(1).map(l=>{
        const v=l.split(",");
        let o={};
        h.forEach((hh,i)=>o[hh]=v[i]);
        return o;
    });
}

// DRAW MAP
function draw(){
    layer.clearLayers();

    GTFS.stops.forEach(s=>{
        if(!s.stop_lat) return;

        L.circleMarker([s.stop_lat,s.stop_lon],{
            radius:3,
            color:"#00aaff"
        }).addTo(layer);
    });

    log("Map layer refreshed");
}

// ROUTE SEARCH
function routeSearch(){
    const q=document.getElementById("rq").value.toLowerCase();

    const res=GTFS.routes
    .filter(r=>(r.route_short_name||"").toLowerCase().includes(q))
    .slice(0,10)
    .map(r=>"🚍 "+r.route_short_name)
    .join("<br>");

    document.getElementById("routeOut").innerHTML=res||"no match";

    log("Route filter executed: "+q);
}

// STOP SEARCH
function stopSearch(){
    const q=document.getElementById("sq").value.toLowerCase();

    const res=GTFS.stops
    .filter(s=>(s.stop_name||"").toLowerCase().includes(q))
    .slice(0,10)
    .map(s=>"🚏 "+s.stop_name)
    .join("<br>");

    document.getElementById("stopOut").innerHTML=res||"no match";

    log("Stop search executed: "+q);
}

// BOARD
function board(){
    const el=document.getElementById("board");
    el.innerHTML="";

    GTFS.routes.slice(0,12).forEach((r,i)=>{
        const row=document.createElement("tr");

        row.innerHTML=`
        <td>${6+i}:00</td>
        <td>${r.route_short_name||r.route_id}</td>
        <td class="ok">ACTIVE</td>
        `;

        el.appendChild(row);
    });
}

// LIVE SIM
setInterval(()=>{
    document.querySelectorAll("#board td:last-child").forEach(td=>{
        const s=["ACTIVE","DELAY +1","DELAY +2","EARLY -1"];
        td.innerText=s[Math.floor(Math.random()*s.length)];
    });
},2500);

</script>

</body>
</html>
