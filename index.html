<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>🚦 FUTÁR V7 MOBILE DISPATCHER</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<!-- PWA -->

<meta name="theme-color" content="#00ffb3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#071813;
color:#dff;
overflow:hidden;
}

/* HEADER */

#topbar{
height:60px;
background:#0b2822;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 10px;
border-bottom:2px solid #00ffb3;
box-sizing:border-box;
}

#logo{
font-weight:bold;
font-size:20px;
color:#00ffb3;
}

#clock{
font-size:24px;
font-weight:bold;
color:#00ffb3;
}

/* LAYOUT */

#layout{
display:flex;
height:calc(100vh - 60px);
}

/* PANEL */

#panel{
width:420px;
background:#081f1b;
border-right:2px solid #00ffb3;
overflow:auto;
padding:10px;
box-sizing:border-box;
}

/* MAP */

#map{
flex:1;
}

/* INPUTS */

input{
width:100%;
padding:10px;
margin-bottom:8px;
border:none;
border-radius:10px;
background:#112822;
color:white;
font-size:15px;
box-sizing:border-box;
}

/* BUTTON */

button{
width:100%;
padding:12px;
margin-bottom:8px;
border:none;
border-radius:10px;
font-size:14px;
cursor:pointer;
color:white;
font-weight:bold;
transition:0.2s;
}

button:hover{
transform:scale(1.02);
opacity:0.92;
}

/* COLORS */

.bkk{background:#204867;}
.volan{background:#5b371a;}
.mav{background:#24476b;}
.kassai{background:#5b1d33;}
.mapbtn{background:#3b295c;}
.aev{background:#30502f;}
.live{background:#1f4630;}

/* ROW */

.row{
display:grid;
grid-template-columns:70px 1fr 80px;
font-size:12px;
padding:6px 0;
border-bottom:1px solid #114038;
}

.badge{
color:#ffe66d;
font-weight:bold;
}

.green{
color:#65ff8f;
}

.red{
color:#ff6666;
}

.small{
font-size:11px;
opacity:0.8;
}

/* STATUS */

#status{
position:fixed;
bottom:0;
left:0;
right:0;
height:38px;
background:#0a1d1acc;
display:flex;
align-items:center;
padding-left:12px;
border-top:1px solid #00ffb3;
font-size:13px;
color:#00ffb3;
z-index:9999;
}

/* MOBILE */

@media(max-width:900px){

#layout{
flex-direction:column;
}

#panel{
width:100%;
height:45vh;
border-right:none;
border-bottom:2px solid #00ffb3;
}

#map{
height:55vh;
}

.row{
font-size:14px;
}

button{
font-size:16px;
padding:13px;
}

#clock{
font-size:18px;
}

}

</style>

</head>

<body>

<!-- HEADER -->

<div id="topbar">

<div id="logo">
🚦 FUTÁR V7 MOBILE
</div>

<div id="clock">
00:00:00
</div>

</div>

<!-- LAYOUT -->

<div id="layout">

<!-- PANEL -->

<div id="panel">

<!-- GTFS -->

<input type="file" id="zip">

<button class="live"
onclick="resetPanel()">
RESET PANEL
</button>

<!-- BKK -->

<h3>🚇 BKK / REALTIME</h3>

<input id="bkkInput"
placeholder="F00457 / CSF00065">

<button class="bkk"
onclick="openRealtime()">
🚦 REALTIME MENETREND
</button>

<button class="kassai"
onclick="openKassai()">
🚍 KASSAI DÁNIEL
</button>

<button class="mapbtn"
onclick="openBusMap()">
🛰 HOL A BUSZOM?
</button>

<button class="mapbtn"
onclick="openBKKMap()">
🚇 BKK FUTÁR MAP
</button>

<button class="mapbtn"
onclick="openGO()">
📱 BUDAPESTGO
</button>

<!-- VOLAN -->

<h3>🚌 VOLÁN</h3>

<input id="volanInput"
placeholder="561442_0">

<button class="volan"
onclick="openVolan()">
🚌 VOLÁN STOP
</button>

<button class="volan"
onclick="openVolanMap()">
🛰 VOLÁN MAP
</button>

<button class="volan"
onclick="openBorzsony()">
🌲 BÖRZSÖNY MAP
</button>

<button class="volan"
onclick="openPilis()">
⛰ PILIS MAP
</button>

<!-- MAV -->

<h3>🚆 MÁV / GYSEV</h3>

<input id="mavInput"
placeholder="0055 / állomáskód">

<button class="mav"
onclick="openVonatinfo()">
🚆 VONATINFO+
</button>

<button class="mav"
onclick="openMAVMap()">
🛰 MÁV+ MAP
</button>

<button class="mav"
onclick="openGYSEV()">
🚆 GYSEV
</button>

<!-- AEV -->

<h3>🌲 ÁEV / KISVASÚT</h3>

<input id="aevInput"
placeholder="Királyrét">

<button class="aev"
onclick="openAEV()">
🌲 ÁEV KERESÉS
</button>

<!-- GPS -->

<h3>📍 HOL A BUSZOM</h3>

<button class="live"
onclick="getLocation()">
📡 GPS FRISSÍTÉS
</button>

<div id="gpsBox">

🚍 243 BUSZ — 1.2 km<br>
🚍 160 BUSZ — 2.4 km<br>
🚆 H5 HÉV — 4.1 km

</div>

<hr>

<div id="panelContent">
GTFS ZIP BETÖLTÉS UTÁN:
KATTINTS A TÉRKÉPEN EGY MEGÁLLÓRA
</div>

</div>

<!-- MAP -->

<div id="map"></div>

</div>

<!-- STATUS -->

<div id="status">
🟢 FUTÁR V7 MOBILE READY
</div>

<script>

/* =========================
🕒 CLOCK
========================= */

function updateClock(){

let d = new Date();

document.getElementById("clock").innerHTML =
d.toLocaleTimeString('hu-HU');

}

setInterval(updateClock,1000);
updateClock();

/* =========================
🗺 MAP
========================= */

let map = L.map('map').setView([47.55,19.05],11);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

map.touchZoom.enable();
map.doubleClickZoom.enable();
map.scrollWheelZoom.disable();

let layer = L.layerGroup().addTo(map);

/* =========================
🧠 STATE
========================= */

let GTFS={
stops:[],
stop_times:[],
trips:[],
routes:[]
};

let INDEX={
stop:{},
trip:{},
route:{}
};

/* =========================
🕒 TIME
========================= */

function nowSec(){

let d = new Date();

return d.getHours()*3600 +
d.getMinutes()*60 +
d.getSeconds();

}

function toSec(t){

if(!t) return 0;

let p=t.split(':');

return (+p[0])*3600 +
(+p[1])*60 +
(+p[2]||0);

}

/* =========================
📦 CSV
========================= */

function parseCSVLine(line){

let r=[];
let c="";
let q=false;

for(let x of line){

if(x=='"') q=!q;

else if(x==','&&!q){

r.push(c);
c="";

}else c+=x;

}

r.push(c);

return r;

}

/* =========================
🚀 GTFS LOAD
========================= */

async function loadGTFS(file){

const zip = await JSZip.loadAsync(file);

function table(txt){

let l=txt.split(/\r?\n/);

let h=parseCSVLine(l[0]);

let o=[];

for(let i=1;i<l.length;i++){

if(!l[i]) continue;

let r=parseCSVLine(l[i]);

let obj={};

h.forEach((x,j)=>obj[x]=r[j]||"");

o.push(obj);

}

return o;

}

GTFS.stops =
table(await zip.file('stops.txt')
.async('string'));

GTFS.stop_times =
table(await zip.file('stop_times.txt')
.async('string'));

GTFS.trips =
table(await zip.file('trips.txt')
.async('string'));

GTFS.routes =
table(await zip.file('routes.txt')
.async('string'));

buildIndex();

renderMap();

document.getElementById('status').innerHTML =
"✅ GTFS BETÖLTVE";

}

/* =========================
🧩 INDEX
========================= */

function buildIndex(){

INDEX.stop={};
INDEX.trip={};
INDEX.route={};

GTFS.trips.forEach(t=>
INDEX.trip[t.trip_id]=t
);

GTFS.routes.forEach(r=>
INDEX.route[r.route_id]=r
);

GTFS.stop_times.forEach(st=>{

if(!INDEX.stop[st.stop_id])
INDEX.stop[st.stop_id]=[];

INDEX.stop[st.stop_id].push(st);

});

}

/* =========================
🗺 MAP RENDER
========================= */

function renderMap(){

layer.clearLayers();

if(map.getZoom()<12){
return;
}

GTFS.stops.forEach(s=>{

let lat=parseFloat(s.stop_lat);
let lon=parseFloat(s.stop_lon);

if(!lat||!lon) return;

let m=L.circleMarker([lat,lon],{

radius:5,
color:'#ffee00',
fillColor:'#00ff88',
fillOpacity:0.8

}).addTo(layer);

m.on('click',()=>renderPanel(s.stop_id));

});

}

/* =========================
⏱ NEXT
========================= */

function getNext(list){

let now=nowSec();

return list
.map(d=>({...d,sec:toSec(d.departure_time)}))
.filter(d=>d.sec>=now-300)
.sort((a,b)=>a.sec-b.sec);

}

function countdown(sec){

let now=nowSec();

let diff=Math.floor((sec-now)/60);

if(diff<0) return "ELMENT";
if(diff===0) return "MOST";

return diff+" perc";

}

/* =========================
📋 PANEL
========================= */

function renderPanel(stop_id){

let list=INDEX.stop[stop_id]||[];

let meta=
GTFS.stops.find(s=>s.stop_id==stop_id)||{};

list=getNext(list);

let html="";

html+="<b>"+meta.stop_name+"</b><br>";
html+="GTFS: "+stop_id+"<br><br>";

let seen=new Set();

list=list.filter(x=>{

if(seen.has(x.trip_id)) return false;

seen.add(x.trip_id);

return true;

});

for(let i=0;i<Math.min(list.length,25);i++){

let d=list[i];

let trip=INDEX.trip[d.trip_id]||{};
let route=INDEX.route[trip.route_id]||{};

let cls="green";

if(countdown(d.sec)==="MOST")
cls="red";

html+=

"<div class='row'>"+

"<div class='badge'>"+
(route.route_short_name||"?")+
"</div>"+

"<div>"+
(trip.trip_headsign||"route")+
"</div>"+

"<div class='"+cls+"'>"+
d.departure_time+
"<br><span class='small'>"+
countdown(d.sec)+
"</span></div>"+

"</div>";

}

document.getElementById('panelContent')
.innerHTML=html;

}

/* =========================
🔄 RESET
========================= */

function resetPanel(){

document.getElementById('panelContent')
.innerHTML=
"RESET OK";

}

/* =========================
🚦 REALTIME
========================= */

function openRealtime(){

let id =
document.getElementById('bkkInput')
.value
.trim();

if(!id){

alert("Adj meg stop ID-t!");

return;

}

window.open(
'https://realtimenext.hu/embed/bkv/stops/'
+ id +
'/schedule',
'_blank'
);

}

/* =========================
🚍 KASSAI
========================= */

function openKassai(){

window.open(
'https://online.winmenetrend.hu/futar/history/vehicles',
'_blank'
);

}

/* =========================
🛰 MAP
========================= */

function openBusMap(){

window.open(
'https://megállomenetrend.hu/',
'_blank'
);

}

function openBKKMap(){

window.open(
'https://futar.bkk.hu/',
'_blank'
);

}

function openGO(){

window.open(
'https://go.bkk.hu/',
'_blank'
);

}

/* =========================
🚌 VOLÁN
========================= */

function openVolan(){

let id =
document.getElementById('volanInput')
.value
.trim();

if(!id){

alert("Adj meg VOLÁN stop ID-t!");

return;

}

window.open(
'https://utas.hu/stop/hkir_' + id,
'_blank'
);

}

function openVolanMap(){

window.open(
'https://utas.hu/?map=9/47.82045/18.91772',
'_blank'
);

}

function openBorzsony(){

window.open(
'https://utas.hu/?map=10/47.91054/18.93198',
'_blank'
);

}

function openPilis(){

window.open(
'https://utas.hu/?map=10/47.70959/18.9351',
'_blank'
);

}

/* =========================
🚆 MÁV
========================= */

function openVonatinfo(){

window.open(
'https://kozlekedesiklub.hu/vonatinfo/',
'_blank'
);

}

function openMAVMap(){

window.open(
'https://mavplusz.hu/#/map',
'_blank'
);

}

function openGYSEV(){

window.open(
'https://www.gysev.hu/app/allomasi_ut.html?p_all_kod=5538-55&p_m=1',
'_blank'
);

}

/* =========================
🌲 ÁEV
========================= */

function openAEV(){

let q =
document.getElementById('aevInput')
.value
.trim();

window.open(
'https://www.google.com/search?q=' +
encodeURIComponent(q + ' erdei vasút'),
'_blank'
);

}

/* =========================
📍 GPS
========================= */

function getLocation(){

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(pos=>{

document.getElementById('status')
.innerHTML =
'📍 GPS AKTÍV';

});

}else{

alert("GPS nem támogatott");

}

}

/* =========================
📦 GTFS FILE
========================= */

document.getElementById('zip')
.addEventListener('change',e=>{

loadGTFS(e.target.files[0]);

});

/* =========================
🗺 ZOOM UPDATE
========================= */

map.on('zoomend',()=>{

renderMap();

});

</script>

</body>
</html>
