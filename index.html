<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>GTFS ZIP LOADER ENGINE V2</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- ZIP UNPACKER -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body { margin:0; font-family:Arial; background:#0b1220; color:white; }
#map { height:70vh; }
.panel { padding:10px; background:#111a2e; }
pre { white-space:pre-wrap; }
button { padding:8px; margin:5px; }
</style>
</head>

<body>

<div class="panel">
<h2>🚆 GTFS ZIP LOADER ENGINE V2</h2>

<input type="file" id="zipfile" accept=".zip">
<button onclick="loadZip()">LOAD GTFS ZIP</button>
<button onclick="build()">BUILD NETWORK</button>

<div id="status">READY</div>
<pre id="debug"></pre>
</div>

<div id="map"></div>

<script>

const map = L.map('map').setView([47.5,19.05],9);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'OSM'
}).addTo(map);

// ---------------- STORAGE ----------------
let files = {};
let stops = [];
let trips = [];
let routes = [];
let stopTimes = [];

// ---------------- ZIP LOADER ----------------
async function loadZip(){

    const file = document.getElementById("zipfile").files[0];
    if(!file) return alert("Nincs ZIP!");

    debug("📦 ZIP loading...");

    const zip = await JSZip.loadAsync(file);

    files = {};

    const keys = Object.keys(zip.files);

    for(let k of keys){

        let content = await zip.files[k].async("string");

        files[k] = content;

        debug("Loaded file: " + k);
    }

    parseFiles();
}

// ---------------- FILE ROUTER ----------------
function route(name){

    name = name.toLowerCase();

    if(name.includes("stops")) return "stops";
    if(name.includes("stop_times")) return "stop_times";
    if(name.includes("trips")) return "trips";
    if(name.includes("routes")) return "routes";

    return "unknown";
}

// ---------------- PARSE ALL ----------------
function parseFiles(){

    stops = [];
    trips = [];
    routes = [];
    stopTimes = [];

    let count = 0;

    for(let name in files){

        let type = route(name);

        Papa.parse(files[name],{
            header:true,
            skipEmptyLines:true,
            complete:(res)=>{

                count++;

                debug(`Parsed: ${name} → ${type} (${res.data.length})`);

                if(type === "stops") stops = res.data;
                if(type === "trips") trips = res.data;
                if(type === "routes") routes = res.data;
                if(type === "stop_times") stopTimes = res.data;

                if(count === Object.keys(files).length){
                    setStatus("READY TO BUILD ✔");
                }
            }
        });
    }
}

// ---------------- BUILD NETWORK ----------------
function build(){

    debug("=== BUILD START ===");

    debug("STOPS: " + stops.length);
    debug("TRIPS: " + trips.length);
    debug("ROUTES: " + routes.length);
    debug("STOP_TIMES: " + stopTimes.length);

    if(stops.length === 0){
        alert("❌ NINCS stops.txt a ZIP-ben!");
        return;
    }

    let valid = stops
        .map(s=>({

            id: s.stop_id,
            name: s.stop_name,
            lat: parseFloat(s.stop_lat),
            lon: parseFloat(s.stop_lon)

        }))
        .filter(s=>!isNaN(s.lat) && !isNaN(s.lon));

    debug("VALID STOPS: " + valid.length);

    render(valid);
}

// ---------------- MAP ----------------
function render(data){

    map.eachLayer(l=>{
        if(l instanceof L.CircleMarker) map.removeLayer(l);
    });

    data.forEach(s=>{

        L.circleMarker([s.lat,s.lon],{
            radius:4,
            color:"cyan"
        }).addTo(map)
        .bindPopup(s.name);

    });
}

// ---------------- UI ----------------
function debug(t){
    document.getElementById("debug").innerText += t + "\n";
}

function setStatus(t){
    document.getElementById("status").innerText = t;
}

</script>

</body>
</html>
