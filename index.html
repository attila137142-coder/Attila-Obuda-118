<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attila Multi GTFS V4 RealTime</title>

<style>

body{
font-family:Arial,sans-serif;
background:#e8eef3;
margin:0;
padding:15px;
}

.container{
max-width:1100px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 3px 12px #999;
}

h1,h2{
color:#003366;
}

input{
width:100%;
padding:12px;
font-size:18px;
border-radius:8px;
border:2px solid #555;
box-sizing:border-box;
}


button{

margin-top:10px;
padding:12px 25px;
font-size:18px;
background:#0066cc;
color:white;
border:0;
border-radius:8px;
cursor:pointer;

}


.status{

padding:10px;
margin-top:15px;
background:#eef;
border-radius:8px;

}


table{

width:100%;
border-collapse:collapse;
margin-top:15px;

}


th,td{

border:1px solid #ccc;
padding:10px;
text-align:center;

}


th{

background:#003366;
color:white;

}


.green{
color:green;
font-weight:bold;
}


.yellow{
color:#aa7700;
font-weight:bold;
}


.red{
color:red;
font-weight:bold;
}


.card{

margin-top:15px;
background:#f7f7f7;
padding:15px;
border-radius:10px;
border-left:7px solid #0066cc;

}


.vehicle{

border-left-color:#009900;

}


</style>

</head>


<body>


<div class="container">


<h1>
🚦 Attila Multi GTFS V4
</h1>

<h2>
BKK GTFS-RT RealTime Engine
</h2>


<input id="stopInput"
placeholder="GTFS ID: 008939,044192,09183208">


<button onclick="searchStops()">
🔎 Multi Stop keresés
</button>


<div class="status" id="connection">

🟡 Kapcsolat ellenőrzése...

</div>



<h2>
🚏 Élő indulási tábla
</h2>


<table>

<thead>

<tr>

<th>Idő</th>
<th>Járat</th>
<th>Irány</th>
<th>Állapot</th>

</tr>

</thead>


<tbody id="departures">

<tr>
<td colspan="4">
Nincs adat
</td>
</tr>

</tbody>


</table>




<h2>
🚍 Jármű információ
</h2>


<div id="vehicles">


<div class="card vehicle">

Várakozás élő jármű adatra...

<br><br>

Jármű azonosító:
-

<br>

Rendszám:
-

<br>

Típus:
-

<br>

Forda:
-

<br>

Sebesség:
-

<br>

GPS:
-

</div>


</div>



</div>




<script>


// =================================
// BKK REALTIME KAPCSOLAT HELYE
// =================================


const BKK_API_KEY="IDE_JÖN_A_KULCS";


// későbbi GTFS-RT URL

const BKK_REALTIME_URL=
"IDE_JÖN_A_GTFS_RT_FEED";




// =================================
// MULTI STOP KERESŐ
// =================================


function searchStops(){


let text=
document.getElementById(
"stopInput"
).value;



let stops=
text
.split(/[,; ]+/)
.map(x=>x.trim())
.filter(x=>x);



console.log(
"Keresett stopok:",
stops
);



document.getElementById(
"connection"
).innerHTML=

"🟢 Keresés indítva: "
+
stops.length
+
" megálló";



// itt indul majd a GTFS-RT lekérés


loadRealtime(stops);



}



// =================================
// REALTIME MOTOR
// =================================


async function loadRealtime(stops){



/*

Ide kerül:

1. TripUpdates
2. VehiclePositions
3. Alert


BKK GTFS-RT feldolgozás

*/


// TESZT KIJELZÉS


let tbody=
document.getElementById(
"departures"
);


tbody.innerHTML="";


stops.forEach((s)=>{


let row=
document.createElement("tr");


row.innerHTML=

`

<td>
--:--
</td>

<td>
${s}
</td>

<td>
-
</td>

<td class="yellow">
Adat várakozás
</td>

`;


tbody.appendChild(row);



});


}




// =================================
// INTERNET ELLENŐRZÉS
// =================================


if(navigator.onLine){


document.getElementById(
"connection"
).innerHTML=

"🟢 Internet kapcsolat aktív";


}

else{


document.getElementById(
"connection"
).innerHTML=

"🔴 Offline mód";


}



</script>


</body>
</html>
