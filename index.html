<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V7 CORE – REAL GTFS ENGINE</title>
<style>
body { font-family: Arial; background:#0b0f14; color:#d7e1ff; margin:0; }
header { padding:12px; background:#111a26; font-size:18px; font-weight:bold; }
.container { display:flex; height:90vh; }
.panel { flex:1; padding:10px; overflow:auto; border-right:1px solid #1f2a3a; }
input, button { padding:8px; margin:5px; width:95%; background:#101826; color:white; border:1px solid #2a3a55; }
button { cursor:pointer; }
.item { padding:6px; border-bottom:1px solid #1c2a3a; cursor:pointer; }
.item:hover { background:#162235; }
.small { font-size:12px; opacity:0.8; }
</style>
</head>

<body>

<header>🚦 FUTÁR V7 CORE – REAL GTFS ENGINE (LIVE / OFFLINE)</header>

<div class="container">

<!-- LEFT -->
<div class="panel">
<h3>📦 GTFS Loader</h3>
<input type="file" id="zipFile" />
<button onclick="loadGTFS()">GTFS ZIP betöltése</button>
<div id="status" class="small">Nincs adat betöltve</div>

<hr>

<h3>🔍 Keresés</h3>
<input id="search" placeholder="Megálló / járat keresés..." oninput="searchAll()" />

<div id="results"></div>
</div>

<!-- RIGHT -->
<div class="panel">
<h3>🚏 Részletek</h3>
<div id="details">Válassz egy elemet</div>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
let db;

// -------------------- DB INIT --------------------
function initDB(){
  let req = indexedDB.open("futar_v7_real",1);
  req.onupgradeneeded = e=>{
    let db = e.target.result;
    db.createObjectStore("stops",{keyPath:"stop_id"});
    db.createObjectStore("routes",{keyPath:"route_id"});
    db.createObjectStore("trips",{keyPath:"trip_id"});
    db.createObjectStore("stop_times",{keyPath:"id",autoIncrement:true});
  };
  req.onsuccess = e=>{ db = e.target.result; };
}
initDB();

// -------------------- GTFS LOADER --------------------
async function loadGTFS(){
  const file = document.getElementById("zipFile").files[0];
  if(!file) return alert("Nincs fájl!");

  const zip = await JSZip.loadAsync(file);
  document.getElementById("status").innerText = "Betöltés...";

  const files = ["stops.txt","routes.txt","trips.txt","stop_times.txt"];

  for(let f of files){
    if(zip.file(f)){
      const text = await zip.file(f).async("string");
      parseGTFS(f,text);
    }
  }

  document.getElementById("status").innerText = "GTFS betöltve ✔";
}

// -------------------- PARSER --------------------
function parseGTFS(name,text){
  const lines = text.split("\n").map(l=>l.trim()).filter(Boolean);
  const headers = lines[0].split(",");

  const tx = db.transaction(getStore(name),"readwrite");
  const store = tx.objectStore(getStore(name));

  for(let i=1;i<lines.length;i++){
    const obj = {};
    const cols = lines[i].split(",");
    headers.forEach((h,idx)=> obj[h]=cols[idx]);
    store.put(obj);
  }
}

function getStore(name){
  if(name==="stops.txt") return "stops";
  if(name==="routes.txt") return "routes";
  if(name==="trips.txt") return "trips";
  return "stop_times";
}

// -------------------- SEARCH --------------------
function searchAll(){
  const q = document.getElementById("search").value.toLowerCase();
  const out = document.getElementById("results");
  out.innerHTML = "";

  if(!db) return;

  const tx = db.transaction(["stops","routes","trips"]);
  const stops = tx.objectStore("stops").getAll();
  const routes = tx.objectStore("routes").getAll();

  stops.onsuccess = ()=>{
    stops.result
      .filter(s=> (s.stop_name||"").toLowerCase().includes(q))
      .slice(0,20)
      .forEach(s=>{
        let div = document.createElement("div");
        div.className="item";
        div.innerHTML="🚏 "+s.stop_name+" <div class='small'>"+s.stop_id+"</div>";
        div.onclick=()=>showStop(s);
        out.appendChild(div);
      });
  };
}

// -------------------- STOP VIEW --------------------
function showStop(stop){
  const d = document.getElementById("details");
  d.innerHTML = `<h3>🚏 ${stop.stop_name}</h3><div class='small'>ID: ${stop.stop_id}</div>`;

  const tx = db.transaction("stop_times");
  const store = tx.objectStore("stop_times");
  const req = store.getAll();

  req.onsuccess = ()=>{
    const times = req.result.filter(t=>t.stop_id===stop.stop_id).slice(0,20);

    d.innerHTML += "<h4>🕒 Járatok:</h4>";
    times.forEach(t=>{
      d.innerHTML += `<div class='item'>Trip: ${t.trip_id} | ${t.arrival_time||""}</div>`;
    });
  };
}
</script>

</body>
</html>
