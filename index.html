<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V3 CONTROL ROOM</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#0a0f14;
    color:#e6f1ff;
}

header{
    padding:10px;
    background:#111a24;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns: 1fr 2fr;
    height:90vh;
}

.panel{
    padding:10px;
    border-right:1px solid #1f2d3d;
}

.main{
    padding:10px;
}

input, button{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border-radius:6px;
    border:none;
}

button{
    background:#00c2ff;
    font-weight:bold;
}

.card{
    background:#141e2b;
    padding:8px;
    margin-bottom:8px;
    border-radius:8px;
}

.badge{
    background:#00c2ff;
    color:#000;
    padding:2px 6px;
    border-radius:5px;
}
</style>
</head>

<body>

<header>🚦 FUTÁR V3 CONTROL ROOM – LIVE DISPATCH</header>

<div class="grid">

<!-- LEFT PANEL -->
<div class="panel">
    <input id="stop" placeholder="STOP ID (pl. 01000123)">
    <button onclick="load()">LEKÉRDEZÉS</button>

    <div id="info"></div>
</div>

<!-- MAIN -->
<div class="main">
    <h3>📡 LIVE JÁRAT PANEL</h3>
    <div id="departures"></div>
</div>

</div>

<script>

async function load(){

    const id = document.getElementById("stop").value;
    const info = document.getElementById("info");
    const dep = document.getElementById("departures");

    info.innerHTML = "⏳ betöltés...";

    const res = await fetch("/api/stop?stop_id=" + id);
    const data = await res.json();

    info.innerHTML = `
        <div class="card">
            📍 <b>${data.stop.name}</b><br>
            STOP ID: ${id}
        </div>
    `;

    dep.innerHTML = "";

    data.routes.forEach(r=>{
        dep.innerHTML += `
        <div class="card">
            <span class="badge">${r.route}</span><br>
            ${r.times ? r.times.join(" - ") : "n/a"}<br>
            <small>delay: ${r.delay}</small>
        </div>
        `;
    });
}

</script>

</body>
</html>
