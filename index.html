<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V5 AUTOCOMPLETE</title>

<style>
body{
margin:0;
font-family:Arial;
background:#05070d;
color:#00ffcc;
}

header{
padding:15px;
text-align:center;
background:#0b1220;
border-bottom:2px solid #00ffcc;
font-weight:bold;
}

.container{
display:grid;
grid-template-columns:1fr 2fr;
gap:10px;
padding:10px;
}

.panel{
background:#0b1220;
border:1px solid #00ffcc;
border-radius:6px;
padding:10px;
min-height:420px;
}

input{
width:100%;
padding:12px;
background:#05070d;
border:1px solid #00ffcc;
color:#00ffcc;
font-size:14px;
}

.suggestions{
margin-top:10px;
border-top:1px solid #00ffcc33;
max-height:250px;
overflow:auto;
}

.item{
padding:8px;
border-bottom:1px solid #00ffcc22;
cursor:pointer;
}

.item:hover{
background:#00ffcc11;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td,th{
border-bottom:1px solid #00ffcc33;
padding:6px;
font-size:13px;
text-align:left;
}

.badge{
padding:2px 6px;
border:1px solid #00ffcc;
font-size:11px;
}
</style>
</head>

<body>

<header>
🚍 FUTÁR V5 AUTOCOMPLETE STOP SEARCH ENGINE
</header>

<div class="container">

<!-- LEFT -->
<div class="panel">
<h3>🚏 Megálló kereső</h3>

<input id="input" placeholder="Írj be pl. Deák / Nád / Keleti">

<div class="suggestions" id="suggestions"></div>

</div>

<!-- RIGHT -->
<div class="panel">
<h3>🛰 Indulások</h3>

<div id="selected"></div>

<table>
<thead>
<tr>
<th>Járat</th>
<th>Irány</th>
<th>Idő</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>

</div>

<script>

/*
========================
GTFS STOP DATABASE
========================
*/

const stops = [
"Deák tér",
"Blaha Lujza tér",
"Nád utca",
"Óbuda",
"Kelenföld",
"Déli pályaudvar",
"Keleti pályaudvar",
"Batthyány tér"
];

/*
========================
STOP → TRIPS MAP (GTFS MINI)
========================
*/

const GTFS = {
"Deák tér":[
{route:"47", dir:"Kelenföld", time:"+1"},
{route:"M2", dir:"Déli", time:"+6"}
],
"Nád utca":[
{route:"7E", dir:"Blaha", time:"+2"},
{route:"9", dir:"Óbuda", time:"+4"}
],
"Kelenföld":[
{route:"M4", dir:"Keleti", time:"+3"}
]
};

/*
========================
NORMALIZER (GTFS STYLE)
========================
*/

function norm(str){
return str
.toLowerCase()
.normalize("NFD")
.replace(/\p{Diacritic}/gu,"");
}

/*
========================
AUTOCOMPLETE ENGINE
========================
*/

const input = document.getElementById("input");
const box = document.getElementById("suggestions");

input.addEventListener("input", ()=>{

let val = input.value;

box.innerHTML = "";

if(!val) return;

let results = stops.filter(s =>
norm(s).includes(norm(val))
);

results.forEach(r=>{
let div = document.createElement("div");
div.className = "item";
div.innerHTML = "🚏 " + r;

div.onclick = ()=>selectStop(r);

box.appendChild(div);
});

});

/*
========================
SELECT STOP
========================
*/

function selectStop(stop){

input.value = stop;
box.innerHTML = "";

document.getElementById("selected").innerHTML =
"🚏 Kiválasztva: <b>"+stop+"</b>";

let data = GTFS[stop];

let table = document.getElementById("table");
table.innerHTML = "";

if(!data){
table.innerHTML = "<tr><td colspan='3'>❌ nincs GTFS adat</td></tr>";
return;
}

data.forEach(d=>{
table.innerHTML += `
<tr>
<td><span class="badge">${d.route}</span></td>
<td>${d.dir}</td>
<td>${d.time}</td>
</tr>
`;
});
}

/*
========================
ENTER SUPPORT
========================
*/

input.addEventListener("keydown", (e)=>{
if(e.key === "Enter"){
let first = document.querySelector(".item");
if(first) first.click();
}
});

</script>

</body>
</html>
