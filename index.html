<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>GTFS TAKARÍTÓ PRO V2.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{
    font-family: Arial;
    background:#0f172a;
    color:#e2e8f0;
    padding:20px;
}
h1{color:#38bdf8}
.box{
    border:1px solid #334155;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    background:#111827;
}
button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}
#log{
    white-space:pre-wrap;
    background:#000;
    padding:10px;
    height:200px;
    overflow:auto;
}
.ok{color:#22c55e}
.warn{color:#facc15}
.err{color:#ef4444}
</style>
</head>
<body>

<h1>🚍 GTFS TAKARÍTÓ PRO V2.0</h1>

<div class="box">
<input type="file" id="zipFile" accept=".zip">
<button onclick="loadZip()">📦 ZIP betöltés</button>
<button onclick="cleanGtfs()">🧹 TAKARÍTÁS INDÍTÁSA</button>
<button onclick="downloadZip()">⬇ LETÖLTÉS</button>
</div>

<div class="box">
<h3>📄 Állapot</h3>
<div id="log">Várakozás...</div>
</div>

<div class="box">
<h3>📁 Fájl lista</h3>
<ul id="fileList"></ul>
</div>

<script>
let zip = new JSZip();
let loadedZipName = "";
let cleanedZip = new JSZip();

const requiredFiles = [
"agency.txt","stops.txt","routes.txt","trips.txt",
"stop_times.txt","calendar.txt","calendar_dates.txt",
"shapes.txt","feed_info.txt"
];

function log(msg, cls=""){
    const el = document.getElementById("log");
    el.innerHTML += "\n" + msg;
}

function loadZip(){
    const file = document.getElementById("zipFile").files[0];
    if(!file) return alert("Válassz ZIP-et!");

    loadedZipName = file.name;
    zip = new JSZip();
    document.getElementById("log").innerHTML = "ZIP betöltve: " + file.name;

    zip.loadAsync(file).then(function(){
        log("OK: ZIP feldolgozva");
        listFiles();
    });
}

function listFiles(){
    const list = document.getElementById("fileList");
    list.innerHTML = "";

    zip.forEach(function(path){
        let li = document.createElement("li");
        li.textContent = path;
        list.appendChild(li);
    });
}

function cleanGtfs(){
    cleanedZip = new JSZip();

    document.getElementById("log").innerHTML += "\nTakarítás indul...";

    let found = [];

    zip.forEach(function(path, file){
        found.push(path);
        cleanedZip.file(path, file.async("string"));
    });

    // ellenőrzés
    requiredFiles.forEach(f=>{
        if(found.includes(f)){
            log("OK: " + f, "ok");
        } else {
            log("HIÁNYZIK: " + f, "err");
        }
    });

    log("Takarítás kész!");
}

function downloadZip(){
    cleanedZip.generateAsync({type:"blob"}).then(function(content){
        const a = document.createElement("a");
        a.href = URL.createObjectURL(content);
        a.download = "GTFS_CLEAN_" + loadedZipName;
        a.click();
    });
}
</script>

</body>
</html>
