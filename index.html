 <div id="panel">BOOTING...</div>

</div>

<script>

/* =========================
🧠 STATE
========================= */

let GTFS={
 stops:[],
 stop_times:[],
 trips:[],
 routes:[]
};

let INDEX={
 stop:{},
 trip:{},
 route:{}
};

let CURRENT_MODULE='stops';

/* =========================
🗺 MAP
========================= */

let map=L.map('map').setView([47.55,19.05],11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let layer=L.layerGroup().addTo(map);

/* =========================
💾 CACHE
========================= */

const DB_NAME='GTFS_DB';
const STORE='gtfs_store';

function openDB(){
 return new Promise(res=>{
  let req=indexedDB.open(DB_NAME,1);

  req.onupgradeneeded=e=>{
   e.target.result.createObjectStore(STORE);
  };

  req.onsuccess=e=>res(e.target.result);
 });
}

async function saveGTFS(zip){
 try{
  const db=await openDB();
  let tx=db.transaction(STORE,'readwrite');
  let store=tx.objectStore(STORE);

  let data={};

  for(let f of Object.keys(zip.files)){
   if(!f.includes('.txt')) continue;
   data[f]=await zip.file(f).async('string');
  }

  store.put(data,'gtfs');
 }catch(e){
  console.log('CACHE SAVE ERROR',e);
 }
}

async function loadCachedGTFS(){
 try{
  const db=await openDB();

  return new Promise(res=>{
   let tx=db.transaction(STORE,'readonly');
   let store=tx.objectStore(STORE);
   let req=store.get('gtfs');

   req.onsuccess=()=>res(req.result||null);
  });
 }catch(e){
  console.log('CACHE LOAD ERROR',e);
  return null;
 }
}

/* =========================
🧠 UTILS
========================= */

function safe(v){return v?v:'';}

function parseCSVLine(line){
 let r=[],c='',q=false;

 for(let x of line){
  if(x=='"') q=!q;
  else if(x==','&&!q){
   r.push(c);
   c='';
  }
  else c+=x;
 }

 r.push(c);
 return r;
}

function table(txt){
 if(!txt) return [];

 let l=txt.split(/\r?\n/);
 let h=parseCSVLine(l[0]);
 let o=[];

 for(let i=1;i<l.length;i++){
  if(!l[i]) continue;

  let r=parseCSVLine(l[i]);
  let obj={};

  h.forEach((x,j)=>obj[x]=r[j]||'');
  o.push(obj);
 }

 return o;
}

function nowSec(){
 let d=new Date();
 return d.getHours()*3600+d.getMinutes()*60+d.getSeconds();
}

function toSec(t){
 if(!t) return 0;
 let p=t.split(':');
 return (+p[0])*3600+(+p[1])*60+(+p[2]||0);
}

/* =========================
📦 LOAD GTFS
========================= */

async function loadGTFS(file){
 try{

  document.getElementById('panel').innerHTML='LOADING GTFS...';

  const zip=await JSZip.loadAsync(file);

  await saveGTFS(zip);

  GTFS.stops=table(await zip.file('stops.txt')?.async('string'));
  GTFS.stop_times=table(await zip.file('stop_times.txt')?.async('string'));
  GTFS.trips=table(await zip.file('trips.txt')?.async('string'));
  GTFS.routes=table(await zip.file('routes.txt')?.async('string'));

  buildIndex();
  renderMap();

  document.getElementById('panel').innerHTML='GTFS READY';

 }catch(e){
  console.log('GTFS LOAD ERROR',e);
  document.getElementById('panel').innerHTML='GTFS LOAD FAILED';
 }
}

/* =========================
🧩 INDEX
========================= */

function buildIndex(){

 try{

  INDEX.stop={};
  INDEX.trip={};
  INDEX.route={};

  GTFS.trips.forEach(t=>INDEX.trip[t.trip_id]=t);
  GTFS.routes.forEach(r=>INDEX.route[r.route_id]=r);

  GTFS.stop_times.forEach(st=>{

   if(!st.stop_id) return;

   if(!INDEX.stop[st.stop_id]){
    INDEX.stop[st.stop_id]=[];
   }

   INDEX.stop[st.stop_id].push(st);

  });

 }catch(e){
  console.log('INDEX ERROR',e);
 }
}

/* =========================
🗺 MAP RENDER
========================= */

function renderMap(){

 try{

  layer.clearLayers();

  GTFS.stops.forEach(s=>{

   let lat=parseFloat(s.stop_lat);
   let lon=parseFloat(s.stop_lon);

   if(!lat||!lon) return;

   let m=L.circleMarker([lat,lon],{
    radius:5,
    color:'#ffee00',
    fillColor:'#00ff88',
    fillOpacity:0.8
   }).addTo(layer);

   m.on('click',()=>renderStopPanel(s.stop_id));

  });

 }catch(e){
  console.log('MAP ERROR',e);
 }
}

/* =========================
🚏 MODULE 1 – STOP PANEL
========================= */

function renderStopPanel(stop_id){

 try{

  CURRENT_MODULE='stops';

  let list=INDEX.stop[stop_id]||[];
  let meta=GTFS.stops.find(s=>s.stop_id==stop_id)||{};

  list.sort((a,b)=>toSec(a.departure_time)-toSec(b.departure_time));

  let seen=new Set();

  list=list.filter(x=>{
   if(seen.has(x.trip_id)) return false;
   seen.add(x.trip_id);
   return true;
  });

  let html='';

  html+="<div class='card'>";
  html+='<b>'+safe(meta.stop_name)+'</b><br>';
  html+='GTFS: '+stop_id+'<br>';
  html+="<div class='small'>"+safe(meta.stop_lat)+' , '+safe(meta.stop_lon)+"</div>";
  html+='</div>';

  for(let i=0;i<Math.min(list.length,15);i++){

   let d=list[i];
   let trip=INDEX.trip[d.trip_id]||{};
   let route=INDEX.route[trip.route_id]||{};

   html+="<div class='row'>"+
    "<div class='badge'>"+(route.route_short_name||'-')+"</div>"+
    "<div>→ "+safe(trip.trip_headsign||route.route_long_name||'?')+"</div>"+
    "<div class='blue'>"+safe(d.departure_time)+"</div>"+
   "</div>";
  }

  document.getElementById('panel').innerHTML=html;

 }catch(e){
  console.log('STOP PANEL ERROR',e);
 }
}

/* =========================
🚌 MODULE 2 – VEHICLES
========================= */

function renderVehicleModule(){

 try{

  let html='';

  html+="<div class='card'>";
  html+='<b>🚌 JÁRMŰVEK</b><br><br>';

  html+='Rendszám: ---<br>';
  html+='Típus: ---<br>';
  html+='Belső szám: ---<br>';
  html+='Státusz: FUTURE LIVE MODULE<br>';

  html+='</div>';

  document.getElementById('panel').innerHTML=html;

 }catch(e){
  console.log('VEHICLE ERROR',e);
 }
}

/* =========================
🔄 MODULE 3 – FORDA
========================= */

function renderFordaModule(){

 try{

  let html='';

  html+="<div class='card'>";
  html+='<b>🔄 FORDÁK / BELSŐK</b><br><br>';

  html+='BKV: ---<br>';
  html+='VOLÁN: ---<br>';
  html+='MÁV: ---<br>';
  html+='Forda: ---<br>';

  html+='</div>';

  document.getElementById('panel').innerHTML=html;

 }catch(e){
  console.log('FORDA ERROR',e);
 }
}

/* =========================
🗺 MODULE 4 – MAP
========================= */

function renderMapModule(){

 try{

  let html='';

  html+="<div class='card'>";
  html+='<b>🗺 TÉRKÉP RÉTEGEK</b><br><br>';

  html+='✔ Megállók aktívak<br>';
  html+='✔ GTFS render aktív<br>';
  html+='✔ Mobil cache aktív<br>';

  html+='</div>';

  document.getElementById('panel').innerHTML=html;

 }catch(e){
  console.log('MAP MODULE ERROR',e);
 }
}

/* =========================
🌲 MODULE 5 – KISVASUTAK
========================= */

function renderForestModule(){

 try{

  let html='';

  html+="<div class='card'>";
  html+='<b>🌲 KISVASÚT OPS</b><br><br>';

  html+='🚂 Gyermekvasút<br>';
  html+='🚂 Királyréti<br>';
  html+='🚂 Szobi<br>';
  html+='🚂 Nagybörzsöny<br>';
  html+='🚂 Kemencei<br>';
  html+='🚂 Balatonfenyvesi ÁEV<br>';
  html+='🚂 39B vonal<br>';

  html+='</div>';

  document.getElementById('panel').innerHTML=html;

 }catch(e){
  console.log('FOREST ERROR',e);
 }
}

/* =========================
🧭 MODULE SWITCHER
========================= */

function openModule(name){

 try{

  CURRENT_MODULE=name;

  if(name==='vehicles') renderVehicleModule();
  if(name==='forda') renderFordaModule();
  if(name==='map') renderMapModule();
  if(name==='forest') renderForestModule();

 }catch(e){
  console.log('MODULE ERROR',e);
 }
}

/* =========================
🔎 SEARCH
========================= */

document.getElementById('search').addEventListener('input',e=>{

 try{

  let q=e.target.value.toLowerCase();

  if(q.length<2) return;

  let found=GTFS.stops.find(s=>
   (s.stop_name||'').toLowerCase().includes(q)||
   (s.stop_id||'').toLowerCase().includes(q)
  );

  if(found){
   renderStopPanel(found.stop_id);

   let lat=parseFloat(found.stop_lat);
   let lon=parseFloat(found.stop_lon);

   if(lat&&lon){
    map.setView([lat,lon],15);
   }
  }

 }catch(err){
  console.log('SEARCH ERROR',err);
 }
});

/* =========================
🚀 BOOT
========================= */

async function boot(){

 try{

  let cached=await loadCachedGTFS();

  if(cached){

   GTFS.stops=table(cached['stops.txt']);
   GTFS.stop_times=table(cached['stop_times.txt']);
   GTFS.trips=table(cached['trips.txt']);
   GTFS.routes=table(cached['routes.txt']);

   buildIndex();
   renderMap();

   document.getElementById('panel').innerHTML='GTFS LOADED FROM CACHE';

  }else{

   document.getElementById('panel').innerHTML='WAITING GTFS FILE...';

  }

 }catch(e){
  console.log('BOOT ERROR',e);
  document.getElementById('panel').innerHTML='BOOT FAILED';
 }
}

boot();

/* =========================
📦 FILE LOAD
========================= */

document.getElementById('zip').addEventListener('change',e=>{

 try{

  loadGTFS(e.target.files[0]);

 }catch(err){
  console.log('FILE ERROR',err);
 }

});

</script>
