<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FULL BUDAPEST STOP ENGINE V2</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1220;
    color: #e5e7eb;
}

header {
    background: #111827;
    padding: 10px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
}

.container {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: 80vh;
}

.left {
    background: #1f2937;
    padding: 10px;
    overflow-y: auto;
}

.right {
    padding: 10px;
}

.box {
    background: #111827;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 6px;
}

input, textarea {
    width: 100%;
    padding: 8px;
    margin: 5px 0;
    border-radius: 5px;
    border: none;
}

.item {
    background: #374151;
    padding: 6px;
    margin: 5px 0;
    border-radius: 5px;
    cursor: pointer;
}

.item:hover {
    background: #4b5563;
}

.log {
    height: 20vh;
    background: #0f172a;
    font-size: 12px;
    overflow-y: auto;
    padding: 8px;
    border-top: 1px solid #333;
}
</style>
</head>

<body>

<header>
    <div>🚏 FULL BUDAPEST STOP ENGINE V2</div>
    <div id="status">READY</div>
</header>

<div class="container">

<!-- LEFT -->
<div class="left">

<div class="box">
    <h3>🔍 STOP SEARCH</h3>
    <input id="search" placeholder="pl: Nád utca..." oninput="searchStopsLive(this.value)">
</div>

<div class="box">
    <h3>🚏 STOPS</h3>
    <div id="stops"></div>
</div>

</div>

<!-- RIGHT -->
<div class="right">

<div class="box">
    <h3>📍 SELECTED STOP</h3>
    <div id="selected">nincs</div>
</div>

<div class="box">
    <h3>🧠 STOP ENGINE STATUS</h3>
    <div id="engine">idle</div>
</div>

<div class="box">
    <h3>📡 DEVICE DATA</h3>
    <div id="device"></div>
</div>

</div>

</div>

<div class="log" id="log"></div>

<script>

/* =========================
   LOG
========================= */
function log(msg){
    document.getElementById("log").innerHTML += msg + "<br>";
}

/* =========================
   FULL BUDAPEST STOP DATA (EXPANDABLE CORE)
   (valós rendszerben ezt GTFS-ből töltöd)
========================= */

let GTFS = {
    stops: [
        {id:"S1", name:"Széll Kálmán tér"},
        {id:"S2", name:"Batthyány tér"},
        {id:"S3", name:"Hűvösvölgy"},
        {id:"S4", name:"Szentendre HÉV"},
        {id:"S5", name:"Nád utca"},
        {id:"S6", name:"Nyugati pályaudvar"},
        {id:"S7", name:"Deák Ferenc tér"},
        {id:"S8", name:"Astoria"},
        {id:"S9", name:"Blaha Lujza tér"}
    ]
};

/* =========================
   STOP ENGINE V2 CORE INDEX
========================= */

let STOP_INDEX = {};

function normalize(t){
    return t.toLowerCase()
        .normalize("NFD")
        .replace(/\p{Diacritic}/gu, "");
}

function buildIndex(){
    STOP_INDEX = {};
    GTFS.stops.forEach(s=>{
        STOP_INDEX[normalize(s.name)] = s;
    });
    log("STOP INDEX built: " + GTFS.stops.length);
}

/* =========================
   STOP ENGINE V2 SEARCH
========================= */

function searchStopsLive(q){

    let query = normalize(q);

    let results = GTFS.stops.filter(s=>{
        return normalize(s.name).includes(query);
    });

    renderStops(results);

    document.getElementById("engine").innerText =
        "searching: " + q + " (" + results.length + ")";
}

/* =========================
   RENDER STOPS
========================= */

function renderStops(list){

    let html = "";

    list.forEach(s=>{
        html += `<div class="item" onclick="selectStop('${s.id}')">
                    🚏 ${s.name}
                 </div>`;
    });

    document.getElementById("stops").innerHTML = html;
}

renderStops(GTFS.stops);

/* =========================
   STOP SELECT
========================= */

function selectStop(id){

    let s = GTFS.stops.find(x=>x.id===id);

    document.getElementById("selected").innerText = s.name;

    log("STOP SELECTED: " + s.name);

    document.getElementById("engine").innerText =
        "selected stop: " + s.name;
}

/* =========================
   DEVICE DATA (REAL)
========================= */

function updateDevice(){

    let out = "";

    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(pos=>{
            out += "GPS: " + pos.coords.latitude.toFixed(5) +
                   ", " + pos.coords.longitude.toFixed(5) + "<br>";

            out += "Accuracy: " + Math.round(pos.coords.accuracy) + " m<br>";

            document.getElementById("device").innerHTML = out;
        });
    }

    if(navigator.connection){
        let c = navigator.connection;
        out += "Network: " + c.effectiveType + "<br>";
        out += "Downlink: " + c.downlink + " Mbps<br>";
    }
}

/* =========================
   INIT ENGINE
========================= */

buildIndex();
updateDevice();
setInterval(updateDevice, 10000);

log("FULL BUDAPEST STOP ENGINE V2 READY");

</script>

</body>
</html>
