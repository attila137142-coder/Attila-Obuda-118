<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUTÁR V9 GTFS MENETRENDI MOTOR</title>
<style>
body{margin:0;background:#0b0f14;color:#00ff9d;font-family:Arial}
header{padding:12px;background:#111826;display:flex;justify-content:space-between;border-bottom:2px solid #00ff9d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.panel{background:#121a24;padding:10px;border:1px solid #1f3b35;border-radius:6px}
input,button{width:100%;padding:8px;margin-top:6px}
button{font-weight:bold}
#results,#departures{max-height:300px;overflow:auto}
.bigclock{font-size:28px;font-weight:bold}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<header>
<div>🚍 FUTÁR V9 GTFS MENETRENDI MOTOR</div>
<div class="bigclock" id="clock"></div>
</header>

<div class="grid">
<div class="panel">
<h3>📦 GTFS ZIP</h3>
<input type="file" id="zipFile" accept=".zip">
<button onclick="loadGTFS()">GTFS betöltése</button>
<div id="status">Várakozás...</div>
</div>

<div class="panel">
<h3>🔎 Megálló kereső</h3>
<input id="searchBox" placeholder="pl. Szentendre">
<button onclick="searchStops()">Keresés</button>
<div id="results"></div>
</div>

<div class="panel" style="grid-column:span 2">
<h3>🚏 Indulási tábla</h3>
<div id="departures">Nincs kiválasztott megálló.</div>
</div>
</div>

<script>
let gtfs={stops:[],routes:[],trips:[],stop_times:[],calendar:[]};

function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('hu-HU');}
setInterval(tick,1000); tick();

function parseCSV(text){
 if(!text) return [];
 text=text.replace(/^\uFEFF/,"");
 const lines=text.split(/\r?\n/).filter(x=>x.trim());
 const headers=parseLine(lines[0]);
 return lines.slice(1).map(line=>{
   const cols=parseLine(line);
   const obj={};
   headers.forEach((h,i)=>obj[h]=cols[i]||"");
   return obj;
 });
}

function parseLine(line){
 const out=[]; let cur=""; let q=false;
 for(let i=0;i<line.length;i++){
   const c=line[i];
   if(c=='"'){ q=!q; continue; }
   if(c==',' && !q){ out.push(cur); cur=""; continue; }
   cur+=c;
 }
 out.push(cur);
 return out;
}

async function loadGTFS(){
 const file=document.getElementById('zipFile').files[0];
 if(!file) return;
 document.getElementById('status').textContent='Betöltés...';

 const zip=await JSZip.loadAsync(file);

 async function read(name){
   const f=zip.file(name);
   return f ? await f.async('string') : "";
 }

 gtfs.stops=parseCSV(await read('stops.txt'));
 gtfs.routes=parseCSV(await read('routes.txt'));
 gtfs.trips=parseCSV(await read('trips.txt'));
 gtfs.stop_times=parseCSV(await read('stop_times.txt'));
 gtfs.calendar=parseCSV(await read('calendar.txt'));

 document.getElementById('status').innerHTML=
 `✔ Megállók: ${gtfs.stops.length} |
  ✔ Járatok: ${gtfs.routes.length} |
  ✔ Menetrendi sorok: ${gtfs.stop_times.length}`;
}

function searchStops(){
 const q=document.getElementById('searchBox').value.toLowerCase();
 const hits=gtfs.stops.filter(s=>(s.stop_name||"").toLowerCase().includes(q)).slice(0,50);

 document.getElementById('results').innerHTML=hits.map(s=>
   `<div><button onclick="showDepartures('${s.stop_id}')">${s.stop_name} (${s.stop_id})</button></div>`
 ).join('') || "Nincs találat";
}

function showDepartures(stopId){
 const rows=gtfs.stop_times.filter(x=>x.stop_id===stopId).slice(0,100);

 const enriched=rows.map(r=>{
   const trip=gtfs.trips.find(t=>t.trip_id===r.trip_id) || {};
   const route=gtfs.routes.find(ro=>ro.route_id===trip.route_id) || {};
   return {
      time:r.departure_time || r.arrival_time || "--",
      route:route.route_short_name || trip.route_id || "?",
      trip:r.trip_id
   };
 });

 enriched.sort((a,b)=>a.time.localeCompare(b.time));

 document.getElementById('departures').innerHTML=
 enriched.slice(0,30).map(e=>
  `🕒 ${e.time} | 🚍 ${e.route} | Trip: ${e.trip}`
 ).join("<br>") || "Ehhez a megállóhoz nincs adat.";
}
</script>
</body>
</html>
