<!-- ================================================= -->
<!-- 🚏 VONAL / MEGÁLLÓKÖZ ELEMZŐ -->
<!-- ================================================= -->

<h2>🚏 Megállóköz / útvonal elemző</h2>

<p>
Formátum:<br>
MHKÓD;MEGÁLLÓNÉV;KÖV_TÁV_KM
</p>

<textarea id="mhData">001;Békásmegyer;1.2
002;Csillaghegy;0.9
003;Rómaifürdő;1.5
004;Aquincum;2.1</textarea>

<button onclick="analyzeLine()">
🚆 VONAL ELEMZÉS
</button>

<div id="lineResult"></div>

<!-- ================================================= -->
<!-- ⛰️ EMELKEDŐ / LEJTŐ -->
<!-- ================================================= -->

<h2>⛰️ Emelkedő / lejtő kalkulátor</h2>

<input id="roadDist"
placeholder="Út hossza méterben (pl 200)">

<input id="heightDiff"
placeholder="Szintkülönbség méterben (pl 45)">

<button onclick="calcSlope()">
📈 Emelkedés számolás
</button>

<div id="slopeResult"></div>

<!-- ================================================= -->
<!-- SCRIPT -->
<!-- ================================================= -->

<script>

// =================================================
// 🚏 VONAL ELEMZŐ
// =================================================

function analyzeLine(){

    let raw =
    document.getElementById("mhData")
    .value
    .trim();

    if(!raw){

        alert("Nincs adat");

        return;
    }

    let rows = raw.split("\n");

    let data = [];

    rows.forEach(r=>{

        let p = r.split(";");

        if(p.length >= 3){

            data.push({

                code:p[0].trim(),
                name:p[1].trim(),
                dist:parseFloat(p[2])

            });

        }

    });

    if(data.length===0){

        alert("Hibás formátum");

        return;
    }

    // ================= ÖSSZES =================

    let total = 0;

    data.forEach(d=>{

        total += d.dist;

    });

    // ================= TÁBLA =================

    let html = `

<table>

<tr>

<th>MH kód</th>
<th>Megálló</th>
<th>Köv MH</th>
<th>Össz táv</th>
<th>Megtett</th>
<th>Hátra</th>
<th>% megtett</th>
<th>% hátra</th>

</tr>

`;

    let cumulative = 0;

    data.forEach(d=>{

        cumulative += d.dist;

        let remain =
        total - cumulative;

        let doneP =
        (cumulative / total) * 100;

        let remainP =
        (remain / total) * 100;

        html += `

<tr>

<td>${d.code}</td>

<td>${d.name}</td>

<td>${d.dist.toFixed(2)} km</td>

<td>${total.toFixed(2)} km</td>

<td>${cumulative.toFixed(2)} km</td>

<td>${remain.toFixed(2)} km</td>

<td style="color:#4ade80">
${doneP.toFixed(1)}%
</td>

<td style="color:#f87171">
${remainP.toFixed(1)}%
</td>

</tr>

`;

    });

    html += `</table>`;

    // ================= ÁTLAG =================

    let avg =
    total / data.length;

    html += `

<div class="card">

🚆 Teljes vonal:
<b>${total.toFixed(2)} km</b>

<br><br>

📏 Átlag MH távolság:
<b>${avg.toFixed(2)} km</b>

<br><br>

🚏 Megállók száma:
<b>${data.length}</b>

</div>

`;

    document.getElementById("lineResult").innerHTML = html;

}

// =================================================
// ⛰️ EMELKEDŐ
// =================================================

function calcSlope(){

    let road =
    parseFloat(
        document.getElementById("roadDist").value
    );

    let height =
    parseFloat(
        document.getElementById("heightDiff").value
    );

    if(!road || !height){

        alert("Adj meg adatokat");

        return;
    }

    // ================= %

    let percent =
    (height / road) * 100;

    // ================= EZRELÉK

    let permille =
    (height / road) * 1000;

    // ================= SZÖG

    let angle =
    Math.atan(height / road) *
    180 / Math.PI;

    document.getElementById("slopeResult").innerHTML = `

<div class="card">

📏 Út hossza:
<b>${road.toFixed(1)} m</b>

<br><br>

⛰️ Szintkülönbség:
<b>${height.toFixed(1)} m</b>

<br><br>

📈 Emelkedés:
<b style="color:#4ade80">
${percent.toFixed(2)}%
</b>

<br><br>

🚆 Vasúti ezrelék:
<b style="color:#38bdf8">
${permille.toFixed(1)}‰
</b>

<br><br>

🧭 Emelkedési szög:
<b>
${angle.toFixed(2)}°
</b>

</div>

`;

}

</script>
