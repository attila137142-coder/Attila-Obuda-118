<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V5 LIVE GTFS STREAM</title>

<style>
body{
margin:0;
font-family:Arial;
background:#05070d;
color:#00ffcc;
}

header{
padding:15px;
text-align:center;
background:#0b1220;
border-bottom:2px solid #00ffcc;
font-weight:bold;
}

.container{
display:grid;
grid-template-columns:1fr 2fr;
gap:10px;
padding:10px;
}

.panel{
background:#0b1220;
border:1px solid #00ffcc;
border-radius:6px;
padding:10px;
min-height:400px;
}

input{
width:100%;
padding:10px;
background:#05070d;
border:1px solid #00ffcc;
color:#00ffcc;
}

button{
width:100%;
padding:10px;
margin-top:5px;
background:#00ffcc;
border:none;
font-weight:bold;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td,th{
border-bottom:1px solid #00ffcc33;
padding:6px;
font-size:13px;
text-align:left;
}

.badge{padding:2px 6px;border:1px solid #00ffcc}

.siet{background:red;color:white;padding:2px 6px}
.keses{background:deepskyblue;color:white;padding:2px 6px}
.ok{background:green;color:white;padding:2px 6px}
</style>
</head>

<body>

<header>
🚍 FUTÁR V5 LIVE GTFS STREAM ENGINE // REALTIME SIM
</header>

<div class="container">

<!-- LEFT -->
<div class="panel">
<h3>🚏 Megálló (LIVE)</h3>

<input id="stop" placeholder="pl. Deák tér">
<button onclick="selectStop()">KIVÁLASZTÁS</button>

<div id="info"></div>
</div>

<!-- RIGHT -->
<div class="panel">
<h3>🛰 LIVE INDULÁSOK STREAM</h3>

<table>
<thead>
<tr>
<th>Járat</th>
<th>Irány</th>
<th>Forda</th>
<th>Indul</th>
<th>Status</th>
</tr>
</thead>

<tbody id="table"></tbody>
</table>

</div>

</div>

<script>

/*
========================
LIVE GTFS STREAM (SIMULÁLT)
========================
*/

let currentStop = "Deák tér";

/*
GTFS LIVE FEED (mock stream backend replacement)
*/
function getLiveFeed(stop){

const base = {
"Deák tér":[
{route:"47", dir:"Kelenföld", vehicle:"F-311", min:1, sec:10},
{route:"M2", dir:"Déli", vehicle:"METRO-02", min:5, sec:40}
],
"Nád utca":[
{route:"7E", dir:"Blaha", vehicle:"F-102", min:2, sec:30},
{route:"9", dir:"Óbuda", vehicle:"F-205", min:4, sec:10}
]
};

let data = base[stop] || [];

/*
LIVE SIMULATION:
random delay shift every refresh
*/
return data.map(d=>{

let drift = Math.floor(Math.random()*3)-1; // -1,0,+1

let newMin = Math.max(0, d.min + drift);

let status =
drift < 0 ? "SIET" :
drift > 0 ? "KESÉS" : "OK";

return {
...d,
min:newMin,
status
};
});
}

/*
========================
RENDER STREAM
========================
*/

function render(){
let table = document.getElementById("table");
table.innerHTML="";

let feed = getLiveFeed(currentStop);

feed.forEach(d=>{

let status =
d.status==="SIET" ? "🔴 SIET" :
d.status==="KESÉS" ? "🔵 KÉSÉS" :
"🟢 OK";

table.innerHTML += `
<tr>
<td>${d.route}</td>
<td>${d.dir}</td>
<td>${d.vehicle}</td>
<td>${d.min}p ${d.sec}s</td>
<td>${status}</td>
</tr>
`;
});
}

/*
========================
STOP SELECT
========================
*/

function selectStop(){
let v = document.getElementById("stop").value;
if(v) currentStop = v;

document.getElementById("info").innerHTML =
"🚏 Aktív megálló: <b>"+currentStop+"</b>";
}

/*
========================
LIVE STREAM LOOP
========================
*/

setInterval(()=>{
render();
}, 2000);

render();

</script>

</body>
</html>
