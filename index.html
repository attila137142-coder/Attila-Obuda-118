<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V5 DISPATCH TABLE</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b0f14;
  color:#e6e6e6;
}

header {
  padding:10px;
  background:#111826;
  display:flex;
  justify-content:space-between;
}

.clock { color:#4dd0e1; font-weight:bold; }

table {
  width:100%;
  border-collapse:collapse;
}

th, td {
  padding:10px;
  border-bottom:1px solid #1f2a3a;
  font-size:13px;
}

th { color:#90caf9; text-align:left; }

.ok { color:#b0bec5; }
.late { color:#ff5252; }
.early { color:#69f0ae; }

.container {
  padding:10px;
}

.map {
  height:150px;
  background:#0f1722;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#666;
  margin-bottom:10px;
}
</style>
</head>

<body>

<header>
  <div>🚍 FUTÁR V5 DISPATCH</div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<div class="container">

  <div class="map">🗺️ LIVE MAP PLACEHOLDER</div>

  <table>
    <thead>
      <tr>
        <th>Járat</th>
        <th>Megálló</th>
        <th>Indulás</th>
        <th>Késés</th>
      </tr>
    </thead>

    <tbody id="table"></tbody>
  </table>

</div>

<script>

const API = "https://YOUR-BRIDGE-URL/api/departures";

function setClock(){
  document.getElementById("clock").innerText =
    new Date().toLocaleTimeString();
}

async function load(){
  try {
    const res = await fetch(API);
    const data = await res.json();

    const table = document.getElementById("table");
    table.innerHTML = "";

    (data.departures || []).forEach(d => {

      let delay = d.delay || 0;
      let cls = "ok";

      if(delay > 3) cls = "late";
      if(delay < 0) cls = "early";

      const row = document.createElement("tr");

      row.innerHTML = `
        <td>${d.routeId || "?"}</td>
        <td>${d.stopName || d.stopId || "?"}</td>
        <td>${d.time || "--"}</td>
        <td class="${cls}">${delay}p</td>
      `;

      table.appendChild(row);
    });

  } catch(e){
    console.log("API error", e);
  }
}

setInterval(load, 15000);
setInterval(setClock, 1000);

load();
setClock();

</script>

</body>
</html>
