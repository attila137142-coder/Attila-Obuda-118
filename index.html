<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>FUTÁR V5 MOBILE CORE</title>

<style>

:root{
--bg:#050b16;
--panel:#0b1220;
--line:#1d2a44;
--blue:#38bdf8;
--green:#22c55e;
--red:#ef4444;
--yellow:#facc15;
--text:#e5eefc;
}

*{
box-sizing:border-box;
}

body{
margin:0;
background:linear-gradient(to bottom,#050b16,#08101d);
font-family:Arial,Helvetica,sans-serif;
color:var(--text);
}

#app{
max-width:700px;
margin:auto;
padding:12px;
}

/* HEADER */

.header{
background:#09111f;
border:1px solid #18304d;
border-radius:14px;
padding:14px;
margin-bottom:12px;
box-shadow:0 0 18px rgba(56,189,248,0.15);
}

.title{
font-size:28px;
font-weight:bold;
color:white;
}

.live{
color:var(--blue);
font-size:15px;
font-weight:bold;
}

.clock{
margin-top:8px;
font-size:22px;
color:var(--green);
font-weight:bold;
}

/* SEARCH */

.panel{
background:var(--panel);
border:1px solid var(--line);
border-radius:14px;
padding:14px;
margin-bottom:12px;
box-shadow:0 0 14px rgba(0,0,0,0.3);
}

.searchWrap{
display:flex;
gap:8px;
}

input{
flex:1;
padding:14px;
border:none;
border-radius:10px;
background:#101b2f;
color:white;
font-size:16px;
outline:none;
}

button{
padding:14px 18px;
border:none;
border-radius:10px;
background:linear-gradient(to right,#2563eb,#0ea5e9);
color:white;
font-weight:bold;
cursor:pointer;
font-size:15px;
}

button:hover{
opacity:0.9;
}

/* STATUS CARDS */

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

.card{
background:#0f1728;
border:1px solid #22314f;
border-radius:12px;
padding:12px;
text-align:center;
}

.card .num{
font-size:26px;
font-weight:bold;
margin-top:5px;
}

.green{color:var(--green);}
.red{color:var(--red);}
.blue{color:var(--blue);}
.yellow{color:var(--yellow);}

/* STOP */

.stopTitle{
font-size:24px;
font-weight:bold;
margin-bottom:12px;
}

/* ROWS */

.row{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
margin-bottom:8px;
background:#0e1727;
border-radius:10px;
border:1px solid #1d2a44;
}

.left{
display:flex;
flex-direction:column;
gap:4px;
}

.route{
font-size:22px;
font-weight:bold;
color:var(--blue);
}

.dir{
font-size:14px;
opacity:0.9;
}

.right{
text-align:right;
}

.time{
font-size:22px;
font-weight:bold;
}

.liveTag{
margin-top:4px;
font-size:12px;
font-weight:bold;
}

.liveOn{
color:var(--green);
}

.liveOff{
color:#94a3b8;
}

/* ALERT */

.alert{
background:rgba(239,68,68,0.12);
border:1px solid rgba(239,68,68,0.4);
border-radius:12px;
padding:14px;
color:#fecaca;
margin-top:12px;
}

/* FOOTER */

.footer{
text-align:center;
padding:20px;
opacity:0.6;
font-size:13px;
}

/* MOBILE */

@media(max-width:600px){

.title{
font-size:22px;
}

.route{
font-size:20px;
}

.time{
font-size:20px;
}

button{
padding:14px;
}

}

</style>
</head>

<body>

<div id="app">

<!-- HEADER -->

<div class="header">

<div class="title">
🚏 FUTÁR V5
<span class="live">LIVE TRACKING</span>
</div>

<div class="clock" id="clock">
--:--:--
</div>

</div>

<!-- SEARCH -->

<div class="panel">

<div class="searchWrap">

<input
id="q"
placeholder="Megálló keresése..."
/>

<button onclick="search()">
KERES
</button>

</div>

<div class="stats">

<div class="card">
Rendszer
<div class="num green">ONLINE</div>
</div>

<div class="card">
Frissítés
<div class="num blue" id="refreshStat">0 mp</div>
</div>

</div>

</div>

<!-- STOP -->

<div class="panel">

<div class="stopTitle" id="stop">
Nincs kiválasztott megálló
</div>

<div id="out">

<div class="row">
<div class="left">
<div class="route">M4</div>
<div class="dir">Kelenföld vasútállomás</div>
</div>

<div class="right">
<div class="time green">2 perc</div>
<div class="liveTag liveOn">🟢 LIVE</div>
</div>
</div>

</div>

</div>

<!-- ALERT -->

<div class="alert">
⚠️ SIET FIGYELMEZTETÉS:
Nagy késés esetén a rendszer piros jelzést ad.
</div>

<!-- FOOTER -->

<div class="footer">
FUTÁR V5 MOBILE CORE • ATTILA KÖZLEKEDÉS
</div>

</div>

<script>

/* CLOCK */

function updateClock(){

const now=new Date();

document.getElementById("clock").innerText=
now.toLocaleTimeString("hu-HU");

}

setInterval(updateClock,1000);
updateClock();

/* REFRESH TIMER */

let refreshSeconds=0;

setInterval(()=>{

refreshSeconds++;

document.getElementById("refreshStat").innerText=
refreshSeconds+" mp";

},1000);

/* SEARCH */

async function search(){

const q=document.getElementById("q").value;

if(!q){
return;
}

document.getElementById("out").innerHTML=
"⏳ betöltés...";

try{

const res=await fetch(
"/api/stop/" + encodeURIComponent(q)
);

const data=await res.json();

refreshSeconds=0;

if(data.error){

document.getElementById("out").innerHTML=
"❌ nincs találat";

return;
}

document.getElementById("stop").innerText=
data.stop;

let html="";

data.departures.forEach(d=>{

const mins=d.mins || "?";

const delayClass=
mins <= 2
? "green"
: mins <= 5
? "yellow"
: "red";

html += `

<div class="row">

<div class="left">

<div class="route">
${d.route}
</div>

<div class="dir">
${d.headsign || "ismeretlen irány"}
</div>

</div>

<div class="right">

<div class="time ${delayClass}">
${mins} perc
</div>

<div class="liveTag ${
d.live ? "liveOn" : "liveOff"
}">
${d.live ? "🟢 LIVE" : "⚪ STATIC"}
</div>

</div>

</div>

`;

});

document.getElementById("out").innerHTML=
html;

}catch(e){

console.error(e);

document.getElementById("out").innerHTML=`
<div class="alert">
❌ API / szerver hiba
</div>
`;

}

}

/* AUTO REFRESH */

setInterval(()=>{

const q=document.getElementById("q").value;

if(q){
search();
}

},30000);

</script>

</body>
</html>
