
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V5.4 PRO+ DISPATCHER</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#0b0f14;
    color:#00ff9d;
}

/* TOP BAR */
.topbar{
    background:#111827;
    padding:10px;
    display:flex;
    justify-content:space-between;
    font-weight:bold;
}

.clock{
    font-size:22px;
    color:#00ff9d;
}

/* LOCATION PANEL */
.location{
    background:#0f172a;
    padding:10px;
    color:#ffd700;
}

/* SEARCH */
.searchbox{
    width:100%;
    padding:12px;
    font-size:16px;
    background:#111827;
    border:none;
    color:white;
    outline:none;
}

/* RESULTS */
.result{
    padding:10px;
    border-bottom:1px solid #1f2937;
}

.route{
    color:#00ff9d;
    font-weight:bold;
}

.error{
    color:red;
}

/* STATUS */
.status{
    color:#38bdf8;
}
</style>
</head>

<body>

<div class="topbar">
    <div>🚍 FUTÁR V5.4 PRO+</div>
    <div class="clock" id="clock"></div>
</div>

<div class="location" id="location">
📍 Helyzet: betöltés...
</div>

<input class="searchbox" id="search" placeholder="Megálló / járat keresés..." oninput="searchGTFS()">

<div id="results"></div>

<script>

/* =========================
   CLOCK
========================= */
function updateClock(){
    const now = new Date();
    document.getElementById("clock").innerText =
    now.toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

/* =========================
   LOCATION (FIXED – KRISZ KRASZ BUG ELTÁVOLÍTVA)
========================= */
function loadLocation(){
    if(!navigator.geolocation){
        document.getElementById("location").innerText="📍 Helyzet nem elérhető";
        return;
    }

    navigator.geolocation.getCurrentPosition(pos=>{
        const lat = pos.coords.latitude.toFixed(5);
        const lon = pos.coords.longitude.toFixed(5);

        // Reverse placeholder (offline-safe)
        document.getElementById("location").innerHTML =
        "📍 GPS: " + lat + ", " + lon + " | Város: Budapest (becsült)";
    },
    err=>{
        document.getElementById("location").innerText =
        "📍 Helyzet: nincs engedély";
    });
}
loadLocation();

/* =========================
   GTFS MINI ENGINE (PRO FIXED)
   - nincs újratöltési bug
   - cache memory
========================= */

let GTFS_CACHE = {
    stops:[
        {name:"Deák Ferenc tér", routes:["47","49","9"]},
        {name:"Örs vezér tere", routes:["2","3","80"]},
        {name:"Kelenföld vasútállomás", routes:["4","19","7"]},
        {name:"Blaha Lujza tér", routes:["4-6","7","99"]}
    ]
};

/* =========================
   SEARCH ENGINE (FIXED LOGIC)
========================= */
function searchGTFS(){
    let q = document.getElementById("search").value.toLowerCase();
    let out = "";

    if(q.length < 1){
        document.getElementById("results").innerHTML="";
        return;
    }

    let found = GTFS_CACHE.stops.filter(s =>
        s.name.toLowerCase().includes(q)
    );

    if(found.length === 0){
        out = "<div class='error'>❌ Nincs találat</div>";
    } else {
        found.forEach(s=>{
            out += `
            <div class="result">
                <div class="route">📍 ${s.name}</div>
                <div class="status">Járatok: ${s.routes.join(", ")}</div>
            </div>`;
        });
    }

    document.getElementById("results").innerHTML = out;
}

</script>

</body>
</html>
