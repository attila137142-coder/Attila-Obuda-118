<style>


/* ==============================
   ALAP KIJELZŐ
================================ */


*{
box-sizing:border-box;
}


body{


margin:0;


width:100vw;

height:100vh;


overflow:hidden;


background:#020405;


font-family:
"Courier New",
monospace;


color:white;


display:flex;

align-items:center;

justify-content:center;


}





/* ==============================
   FŐ FALIKIJELZŐ
================================ */


.dispatch-wall{


width:96vw;

height:92vh;


max-width:1750px;


background:


radial-gradient(
ellipse at center,
rgba(0,255,180,0.08),
transparent 70%
),


#050909;



border:5px solid #123b42;


border-radius:35px;


box-shadow:


0 0 70px rgba(0,255,180,0.25),


inset 0 0 80px rgba(0,255,180,0.15);



position:relative;


padding:25px;



}







/* ==============================
   FELSŐ ÁLLAPOTSÁV
================================ */



.status-bar{


height:85px;


display:flex;


align-items:center;


justify-content:space-between;



background:#071010;



border:2px solid #164850;


border-radius:18px;


padding:0 35px;



font-size:30px;


font-weight:900;



}





.status-item{


padding:10px 20px;


}




.green{


color:#00ff66;


text-shadow:

0 0 15px #00ff66;

}



.blue{


color:#00c8ff;


text-shadow:

0 0 15px #00c8ff;

}



.yellow{


color:#ffe600;


text-shadow:

0 0 15px #ffe600;

}



.red{


color:#ff3030;


text-shadow:

0 0 15px #ff3030;

}








/* ==============================
   KÖZPONTI ÓRA PANEL
================================ */



.clock-area{


height:55%;


display:flex;


align-items:center;


justify-content:center;



position:relative;



}





.clock-panel{


width:90%;


height:85%;


border-radius:30px;



display:flex;


flex-direction:column;


align-items:center;


justify-content:center;



background:


radial-gradient(
circle,
rgba(0,255,180,0.12),
transparent 70%
),


#020707;



border:5px solid #174c55;



transition:.4s;



}




/* DÁTUM */


.clock-date{


font-size:70px;


font-weight:900;


letter-spacing:10px;


margin-bottom:30px;


color:#ff9900;



text-shadow:


0 0 15px #ff9900,

0 0 45px rgba(255,150,0,.7);



}





/* IDŐ */



.clock-time{


font-size:185px;


font-weight:900;


letter-spacing:18px;


color:#00ff66;



text-shadow:


0 0 20px #00ff66,

0 0 60px rgba(0,255,100,.8);



}








/* ==============================
 NORMAL MODE
================================ */


.normal{


border-color:#00ff66!important;


}



.normal .clock-date{


color:#ff9900;


}



.normal .clock-time{


color:#00ff66;


}







/* ==============================
 MATRIX MODE
================================ */



.matrix{


border-color:#197080!important;


}



.matrix .clock-date{


color:#ff3030;


}



.matrix .clock-time{


color:#ffe600;



text-shadow:


0 0 20px #ffe600,

0 0 60px rgba(255,220,0,.8);



}







/* ==============================
 ALERT MODE
================================ */



.alert{


border-color:#ff0000!important;



background:


radial-gradient(

circle,

rgba(255,0,0,.20),

transparent 70%

),


#100000;



box-shadow:


0 0 70px rgba(255,0,0,.8),

inset 0 0 80px rgba(255,0,0,.35);



}




.alert .clock-date{


color:#ff3030;


}



.alert .clock-time{


color:#ff0000;



text-shadow:


0 0 20px red,

0 0 70px red;


}




/* ALERT JELZÉS */


.warning{


display:none;


position:absolute;


right:40px;


top:35px;



font-size:28px;


font-weight:900;



color:#ff3030;


text-shadow:

0 0 15px red;


}




.alert .warning{


display:block;


}






</style>


</head>

<style>



/* ALSÓ PANEL */


.live-area{

.live-box{

"Courier New",

}

</style>






<script>



// =============================
// STABIL ÓRAMOTOR
// =============================


let lastSecond=-1;



function updateClock(){


let now=new Date();



let sec=now.getSeconds();



if(sec!==lastSecond){


lastSecond=sec;



let days=[

"VASÁRNAP",
"HÉTFŐ",
"KEDD",
"SZERDA",
"CSÜTÖRTÖK",
"PÉNTEK",
"SZOMBAT"

];



document.getElementById("date").innerHTML=


now.getFullYear()

+". "

+

String(now.getMonth()+1).padStart(2,"0")

+". "

+

String(now.getDate()).padStart(2,"0")

+" "

+

days[now.getDay()];





document.getElementById("time").innerHTML=



String(now.getHours()).padStart(2,"0")

+":"

+

String(now.getMinutes()).padStart(2,"0")

+":"

+

String(sec).padStart(2,"0");



}




requestAnimationFrame(updateClock);



}




updateClock();







// =============================
// MÓDVÁLTÁS
// =============================



function setMode(mode){



let panel=document.getElementById(
"clockPanel"
);



panel.className=
"clock-panel "
+
mode;



}



</script>
