<!DOCTYPE html>
<html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATTILA KÖZLEKEDÉS PRO V3.0 STABLE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;background:#081018;color:#fff;font-family:Arial}
header{padding:14px;text-align:center;background:#063b20}
#clock{font-size:48px;color:#00ff66;font-weight:bold}
#date{font-size:24px;color:#ffb300}
.card{margin:10px;padding:12px;background:#13212b;border-radius:10px}
#map{height:420px}
button{padding:10px 16px}
</style></head><body>
<header><h2>🚦 ATTILA KÖZLEKEDÉS PRO V3.0 STABLE</h2><div id="clock"></div><div id="date"></div></header>
<div class="card">
<button onclick="loadWeather()">📍 GPS időjárás</button>
<div>Hely: <span id="place">-</span></div>
<div>🌡 <span id="temp">--</span> °C</div>
<div>🌬 <span id="wind">--</span> km/h</div>
<div>💧 <span id="hum">--</span> %</div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
function tick(){
 const d=new Date();
 const days=["Vasárnap","Hétfő","Kedd","Szerda","Csütörtök","Péntek","Szombat"];
 clock.textContent=d.toLocaleTimeString("hu-HU");
 date.textContent=`${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,"0")}. ${String(d.getDate()).padStart(2,"0")} ${days[d.getDay()]}`;
}
setInterval(tick,1000);tick();
const map=L.map('map').setView([47.4979,19.0402],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
let marker=L.marker([47.4979,19.0402]).addTo(map);
async function loadWeather(){
 navigator.geolocation.getCurrentPosition(async p=>{
  const lat=p.coords.latitude,lon=p.coords.longitude;
  marker.setLatLng([lat,lon]); map.setView([lat,lon],14);
  const g=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
  const gj=await g.json(); place.textContent=gj.display_name||"GPS";
  const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m`);
  const j=await w.json();
  temp.textContent=j.current.temperature_2m;
  wind.textContent=j.current.wind_speed_10m;
  hum.textContent=j.current.relative_humidity_2m;
 },e=>alert("GPS hiba: "+e.message),{enableHighAccuracy:true});
}
</script></body></html>
