<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MÁV TESZT – EMMA REALTIME</title>
<style>
body{font-family:Arial;background:#111;color:#eee;margin:0;padding:20px}
h1{font-size:24px}
button{padding:12px 18px;margin:5px;background:#1976d2;color:white;border:0;border-radius:8px;cursor:pointer}
button:hover{background:#2196f3}
#status{margin:15px 0;padding:12px;background:#222;border-radius:8px}
pre{white-space:pre-wrap;word-break:break-word;background:#050505;padding:15px;border-radius:8px;max-height:70vh;overflow:auto}
.ok{color:#66ff66}.err{color:#ff6666}.wait{color:#ffd54f}
</style>
</head>

<body>

<h1>🚆 MÁV TESZT – EMMA REALTIME</h1>

<button onclick="teszt()">▶ MÁV REALTIME LEKÉRÉS</button>
<button onclick="teszt70()">🚆 70-ES VONAL TESZT</button>
<button onclick="teszt2()">🚆 2-ES VONAL TESZT</button>

<div id="status" class="wait">Indításra kész...</div>

<pre id="eredmeny">Nincs még lekérdezés.</pre>

<script>

const EMMA =
"https://emma.mav.hu/otp2-backend/otp/routers/default/index/graphql";

/* =========================================================
   ALAP LEKÉRDEZÉS
   Budapest + Pest + környéke
   ========================================================= */

async function emmaQuery(swLat,swLon,neLat,neLon){

const query=`
{
  vehiclePositions(
    swLat:${swLat}
    swLon:${swLon}
    neLat:${neLat}
    neLon:${neLon}
    modes:[RAIL]
  ){
    vehicleId
    label
    lat
    lon
    heading
    lastUpdated
    speed

    trip{
      gtfsId
      domesticResTrainNumber
    }
  }
}`;

status.className="wait";
status.textContent="⏳ EMMA lekérés folyamatban...";
eredmeny.textContent="Kapcsolódás:\n"+EMMA+"\n\nLekérdezés:\n"+query;

try{

const response=await fetch(EMMA,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
query:query,
variables:{}
})
});

const text=await response.text();

let data;

try{
data=JSON.parse(text);
}catch(e){
status.className="err";
status.textContent="❌ A szerver nem JSON választ adott.";
eredmeny.textContent=text;
return;
}

if(data.errors){

status.className="err";
status.textContent="❌ EMMA GRAPHQL HIBA";

eredmeny.textContent=
JSON.stringify(data,null,2);

return;
}

status.className="ok";
status.textContent="✅ EMMA VÁLASZ MEGÉRKEZETT";

eredmeny.textContent=
JSON.stringify(data,null,2);

}catch(error){

status.className="err";

status.textContent=
"❌ HIBA – valószínűleg CORS / hálózati tiltás";

eredmeny.textContent=
error+"\n\n"+
"Ha itt CORS hiba jelenik meg, az fontos eredmény:\n"+
"az EMMA végpont létezik, de a böngészőből közvetlenül nem engedi a lekérést.";

}

}


/* =========================================================
   ÁLTALÁNOS TESZT
   ========================================================= */

function teszt(){

emmaQuery(
47.20,
18.80,
48.30,
19.20
);

}


/* =========================================================
   70-ES VONAL KÖRZETE
   Budapest – Vác – Szob
   ========================================================= */

function teszt70(){

emmaQuery(
47.30,
18.80,
48.20,
19.20
);

}


/* =========================================================
   2-ES VONAL KÖRZETE
   Budapest – Pilis – Esztergom
   ========================================================= */

function teszt2(){

emmaQuery(
47.45,
18.70,
48.00,
19.10
);

}

</script>

</body>
</html>
