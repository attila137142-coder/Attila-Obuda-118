<script>
"use strict";

/* =========================================================
   ATTILA KÖZLEKEDÉS – BKK VADÁSZ FIX12
   ========================================================= */

const VP_URL =
  "https://go.bkk.hu/api/query/v1/ws/gtfs-rt/full/VehiclePositions.pb";

const TU_URL =
  "https://go.bkk.hu/api/query/v1/ws/gtfs-rt/full/TripUpdates.pb";

const GTFS_URL =
  "https://go.bkk.hu/api/static/v1/public-gtfs/budapest_gtfs.zip";

const FUTAR_URL =
  "https://go.bkk.hu/api/query/v1/ws/otp/api/where/vehicles-for-location.json";

const TRIP_DETAILS_URL =
  "https://go.bkk.hu/api/query/v1/ws/otp/api/where/trip-details.json";

const VEHICLE_FOR_TRIP_URL =
  "https://go.bkk.hu/api/query/v1/ws/otp/api/where/vehicle-for-trip.json";

const PROTO_URL =
  "https://raw.githubusercontent.com/google/transit/master/gtfs-realtime/proto/gtfs-realtime.proto";

const WIN_TRIP =
  "https://online.winmenetrend.hu/futar/trip/";

const WIN_BLOCK =
  "https://online.winmenetrend.hu/budapest/latest/block/";

let map = null;
let bigMap = null;

let vehicleLayer = null;
let bigVehicleLayer = null;

let markerCache = new Map();
let bigMarkerCache = new Map();

let vehicleData = [];
let futarData = [];

let gtfsReady = false;
let protoReady = false;
let autoTimer = null;
let feedInFlight = false;

let myGPS = null;

let gtfsStopsById = new Map();
let gtfsRoutesById = new Map();

let stopGrid = new Map();
const STOP_CELL = 0.01;

let metaCache = new Map();
let metaTime = new Map();

let tripDelayMap = new Map();

let lastFutarCount = 0;
let lastTripCount = 0;

let logLines = [];


/* =========================================================
   SEGÉDFÜGGVÉNYEK
   ========================================================= */

function $(id){
  return document.getElementById(id);
}

function log(msg, cls=""){
  const t = new Date().toLocaleTimeString("hu-HU");
  logLines.push("[" + t + "] " + msg);
  if(logLines.length > 250){
    logLines = logLines.slice(-250);
  }

  $("status").innerHTML =
    logLines.map(x => escapeHtml(x)).join("\n");

  $("status").scrollTop = $("status").scrollHeight;
}

function escapeHtml(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function setBadge(id,text,ok=null){
  const el=$(id);
  el.textContent=text;
  el.classList.remove("ok","bad");

  if(ok===true) el.classList.add("ok");
  if(ok===false) el.classList.add("bad");
}

function nd(v){
  return v === null ||
         v === undefined ||
         v === "" ||
         String(v).trim() === ""
    ? "NINCS ADAT"
    : String(v);
}

function num(v){
  const n=Number(v);
  return Number.isFinite(n) ? n : null;
}

function norm(v){
  if(v===null || v===undefined) return "";
  return String(v).trim();
}

function normalizeId(v){
  return norm(v)
    .replace(/^BKK_/i,"")
    .replace(/^VEHICLE_/i,"")
    .toUpperCase();
}

function cleanText(v){
  if(v===null || v===undefined) return "";
  if(typeof v==="string") return v.trim();
  if(typeof v==="number") return String(v);
  return "";
}

function authUrl(url,params={}){
  const p = new URLSearchParams();

  const key = getApiKey();

  if(key){
    p.set("key",key);
  }

  for(const [k,v] of Object.entries(params)){
    if(v !== undefined &&
       v !== null &&
       String(v) !== ""){
      p.set(k,String(v));
    }
  }

  const q=p.toString();

  if(!q) return url;

  return url + (url.includes("?") ? "&" : "?") + q;
}

function getApiKey(){
  return norm(localStorage.getItem("ATTILA_BKK_API_KEY"));
}

function saveApiKey(){
  localStorage.setItem(
    "ATTILA_BKK_API_KEY",
    norm($("apiKey").value)
  );
  log("BKK API-kulcs elmentve.");
}

function loadApiKey(){
  $("apiKey").value = getApiKey();
}

function headers(){
  const key=getApiKey();

  const h={
    "Accept":"application/json,application/octet-stream"
  };

  if(key){
    h["X-API-Key"]=key;
    h["Authorization"]="Bearer "+key;
  }

  return h;
}

async function fetchArrayBuffer(url,options={}){
  const r=await fetch(url,{
    ...options,
    headers:{
      ...headers(),
      ...(options.headers||{})
    },
    cache:"no-store"
  });

  if(!r.ok){
    throw new Error(
      "HTTP "+r.status+" – "+r.statusText
    );
  }

  return await r.arrayBuffer();
}

async function fetchJson(url){
  const r=await fetch(url,{
    headers:headers(),
    cache:"no-store"
  });

  if(!r.ok){
    throw new Error(
      "HTTP "+r.status+" – "+r.statusText
    );
  }

  return await r.json();
}


/* =========================================================
   TÁVOLSÁG
   ========================================================= */

function distanceMeters(lat1,lon1,lat2,lon2){
  const a=6371000;

  const p1=lat1*Math.PI/180;
  const p2=lat2*Math.PI/180;

  const dp=(lat2-lat1)*Math.PI/180;
  const dl=(lon2-lon1)*Math.PI/180;

  const x=Math.sin(dp/2)**2 +
    Math.cos(p1)*Math.cos(p2)*
    Math.sin(dl/2)**2;

  return 2*a*Math.atan2(
    Math.sqrt(x),
    Math.sqrt(1-x)
  );
}

function distanceKm(lat1,lon1,lat2,lon2){
  return distanceMeters(lat1,lon1,lat2,lon2)/1000;
}


/* =========================================================
   1. JÁRMŰ → VALÓDI STOP ID → MEGÁLLÓ + MÉTER
   ========================================================= */

/*
  FONTOS:
  A realtime stopId-t soha nem cseréljük le.

  A távolság mindig:
  jármű aktuális koordinátája
       ->
  gtfsStopsById.get(realtime stopId)
*/

function getRealtimeStop(v){
  if(!v) return null;

  const sid=norm(v.stopId);

  if(!sid) return null;

  return gtfsStopsById.get(sid) || null;
}

function getVehicleStopDistanceMeters(v){
  const stop=getRealtimeStop(v);

  if(!stop) return null;

  if(!Number.isFinite(v.lat) ||
     !Number.isFinite(v.lon) ||
     !Number.isFinite(stop.lat) ||
     !Number.isFinite(stop.lon)){
    return null;
  }

  return distanceMeters(
    v.lat,
    v.lon,
    stop.lat,
    stop.lon
  );
}

function stopDisplay(v){
  const stop=getRealtimeStop(v);

  if(!stop){
    return {
      name:"NINCS ADAT",
      id:norm(v.stopId) || "NINCS ADAT",
      meters:null
    };
  }

  const meters=getVehicleStopDistanceMeters(v);

  return {
    name:stop.name || "NINCS ADAT",
    id:stop.id || v.stopId,
    meters
  };
}


/* =========================================================
   STOP GRID
   csak akkor kell, ha a realtime STOP ID hiányzik
   ========================================================= */

function stopCell(lat,lon){
  return (
    Math.floor(lat/STOP_CELL) +
    "|" +
    Math.floor(lon/STOP_CELL)
  );
}

function buildStopGrid(){
  stopGrid.clear();

  for(const stop of gtfsStopsById.values()){
    if(!Number.isFinite(stop.lat) ||
       !Number.isFinite(stop.lon)){
      continue;
    }

    const c=stopCell(stop.lat,stop.lon);

    if(!stopGrid.has(c)){
      stopGrid.set(c,[]);
    }

    stopGrid.get(c).push(stop);
  }
}

function nearestStop(lat,lon){
  if(!Number.isFinite(lat) ||
     !Number.isFinite(lon)){
    return null;
  }

  let best=null;
  let bestM=Infinity;

  const cx=Math.floor(lat/STOP_CELL);
  const cy=Math.floor(lon/STOP_CELL);

  for(let dx=-1;dx<=1;dx++){
    for(let dy=-1;dy<=1;dy++){

      const list=
        stopGrid.get(
          (cx+dx)+"|"+(cy+dy)
        ) || [];

      for(const s of list){

        const d=distanceMeters(
          lat,lon,
          s.lat,s.lon
        );

        if(d<bestM){
          bestM=d;
          best=s;
        }
      }
    }
  }

  return best ? {
    stop:best,
    meters:bestM
  } : null;
}


/* =========================================================
   GTFS
   ========================================================= */

function parseCsvLine(line){
  const out=[];
  let cur="";
  let quote=false;

  for(let i=0;i<line.length;i++){
    const c=line[i];

    if(c==='"'){
      if(quote && line[i+1]==='"'){
        cur+='"';
        i++;
      }else{
        quote=!quote;
      }
      continue;
    }

    if(c==="," && !quote){
      out.push(cur);
      cur="";
    }else{
      cur+=c;
    }
  }

  out.push(cur);
  return out;
}

function parseCsv(text){
  const lines=text
    .replace(/^\uFEFF/,"")
    .split(/\r?\n/)
    .filter(x=>x.length);

  if(!lines.length) return [];

  const head=parseCsvLine(lines[0]);

  const rows=[];

  for(let i=1;i<lines.length;i++){
    const a=parseCsvLine(lines[i]);
    const o={};

    for(let j=0;j<head.length;j++){
      o[head[j]]=a[j] ?? "";
    }

    rows.push(o);
  }

  return rows;
}

async function loadGTFS(){
  setBadge(
    "badgeGtfs",
    "GTFS: betöltés…",
    null
  );

  log("GTFS letöltése indul.");

  const buf=await fetchArrayBuffer(GTFS_URL);

  const zip=await JSZip.loadAsync(buf);

  const stopsFile=zip.file("stops.txt");
  const routesFile=zip.file("routes.txt");

  if(!stopsFile){
    throw new Error("GTFS stops.txt nem található.");
  }

  if(!routesFile){
    throw new Error("GTFS routes.txt nem található.");
  }

  const stopsText=
    await stopsFile.async("text");

  const routesText=
    await routesFile.async("text");

  gtfsStopsById.clear();
  gtfsRoutesById.clear();

  for(const s of parseCsv(stopsText)){

    const id=norm(
      s.stop_id ||
      s.stopId
    );

    const lat=num(
      s.stop_lat ||
      s.stopLat
    );

    const lon=num(
      s.stop_lon ||
      s.stopLon
    );

    if(!id) continue;

    gtfsStopsById.set(id,{
      id,
      name:
        cleanText(
          s.stop_name ||
          s.stopName
        ),
      lat,
      lon
    });
  }

  for(const r of parseCsv(routesText)){

    const id=norm(
      r.route_id ||
      r.routeId
    );

    if(!id) continue;

    gtfsRoutesById.set(id,{
      id,
      shortName:
        cleanText(
          r.route_short_name ||
          r.routeShortName
        ),
      longName:
        cleanText(
          r.route_long_name ||
          r.routeLongName
        ),
      type:
        cleanText(
          r.route_type ||
          r.routeType
        )
    });
  }

  buildStopGrid();

  gtfsReady=true;

  setBadge(
    "badgeGtfs",
    "GTFS: "+
    gtfsStopsById.size+
    " megálló / "+
    gtfsRoutesById.size+
    " járat",
    true
  );

  log(
    "GTFS OK: "+
    gtfsStopsById.size+
    " megálló, "+
    gtfsRoutesById.size+
    " route."
  );
}

let FeedMessage=null;

async function loadProto(){
  if(protoReady) return;

  log("GTFS-RT protobuf definíció betöltése.");

  const protoText =
    await fetch(
      PROTO_URL,
      {cache:"no-store"}
    ).then(r=>{
      if(!r.ok){
        throw new Error(
          "proto HTTP "+r.status
        );
      }
      return r.text();
    });

  const root =
    protobuf.parse(protoText).root;

  FeedMessage =
    root.lookupType(
      "transit_realtime.FeedMessage"
    );

  protoReady=true;

  log("GTFS-RT protobuf OK.");
}

async function decodeFeed(buffer){
  await loadProto();

  const bytes=
    new Uint8Array(buffer);

  return FeedMessage.decode(bytes);
}

function objectify(v){
  if(v===null ||
     v===undefined){
    return null;
  }

  if(typeof v.toJSON==="function"){
    return v.toJSON({
      longs:Number,
      enums:String,
      defaults:false
    });
  }

  return v;
}

function formatDelay(sec){
  if(sec===null ||
     sec===undefined ||
     !Number.isFinite(Number(sec))){
    return {
      text:"NINCS ADAT",
      cls:"no-data"
    };
  }

  sec=Math.round(Number(sec));

  if(sec===0){
    return {
      text:"0:00",
      cls:"delay-zero"
    };
  }

  const sign=sec<0 ? "−" : "+";
  const abs=Math.abs(sec);

  const min=Math.floor(abs/60);
  const s=String(abs%60).padStart(2,"0");

  return {
    text:
      (sec<0 ? "SIETÉS " : "KÉSÉS ") +
      sign+
      min+":"+s,
    cls:
      sec<0
        ? "delay-early"
        : "delay-late"
  };
}

function delayFromStopTimeUpdate(stu){
  if(!stu ||
     typeof stu!=="object"){
    return null;
  }

  const candidates=[
    stu.departure &&
      stu.departure.delay,
    stu.arrival &&
      stu.arrival.delay,
    stu.delay
  ];

  for(const x of candidates){
    const n=num(x);

    if(n!==null){
      return n;
    }
  }

  return null;
}

function processTripUpdates(feed){
  tripDelayMap.clear();

  let count=0;

  for(const entity of feed.entity || []){

    const tu=
      entity.tripUpdate ||
      entity.trip_update ||
      null;

    if(!tu) continue;

    const trip=tu.trip || {};

    const tripId=
      norm(
        trip.tripId ||
        trip.trip_id
      );

    if(!tripId) continue;

    const vehicle=
      tu.vehicle || {};

    const vehicleId=
      explicitVehicleId(vehicle);

    const stopUpdates=
      tu.stopTimeUpdate ||
      tu.stop_time_update ||
      [];

    const bySeq=new Map();
    const byStop=new Map();

    let tripDelay=null;

    for(const stu of stopUpdates){

      const d=
        delayFromStopTimeUpdate(stu);

      if(d===null) continue;

      tripDelay=d;

      const seq=num(
        stu.stopSequence ||
        stu.stop_sequence
      );

      const stopId=
        norm(
          stu.stopId ||
          stu.stop_id
        );

      if(seq!==null){
        bySeq.set(seq,d);
      }

      if(stopId){
        byStop.set(stopId,d);
      }

      count++;
    }

    tripDelayMap.set(
      tripId,
      {
        tripId,
        vehicleId,
        bySeq,
        byStop,
        tripDelay
      }
    );
  }

  lastTripCount=count;

  setBadge(
    "badgeTrip",
    "TripUpdates: "+count,
    count>0
  );

  log(
    "TripUpdates: "+
    count+
    " valódi késési adat feldolgozva."
  );

  applyTripDelays();
}

function applyTripDelays(){

  for(const v of vehicleData){

    v.delaySeconds=null;

    const d=
      tripDelayMap.get(
        norm(v.tripId)
      );

    if(!d) continue;

    let delay=null;

    if(v.stopId &&
       d.byStop.has(v.stopId)){
      delay=d.byStop.get(v.stopId);
    }

    if(delay===null &&
       v.stopSequence!==null &&
       d.bySeq.has(v.stopSequence)){
      delay=d.bySeq.get(
        v.stopSequence
      );
    }

    if(delay===null){
      delay=d.tripDelay;
    }

    if(delay!==null){
      v.delaySeconds=delay;
    }
  }
}

/*
  FONTOS:
  általános "id" NINCS járműazonosítóként használva.

  Elfogadott:
    vehicleId
    vehicle_id
    vehicle.id
    vehicle.vehicleId
    vehicle.vehicle_id
*/

function explicitVehicleId(x){

  if(!x ||
     typeof x!=="object"){
    return "";
  }

  const direct=
    cleanText(
      x.vehicleId ||
      x.vehicle_id
    );

  if(direct){
    return direct;
  }

  if(x.vehicle &&
     typeof x.vehicle==="object"){

    const nested=
      cleanText(
        x.vehicle.vehicleId ||
        x.vehicle.vehicle_id ||
        x.vehicle.id
      );

    if(nested){
      return nested;
    }
  }

  return "";
}

function explicitDeepField(obj,names){

  const wanted=
    new Set(names);

  const seen=
    new Set();

  function walk(x,depth){

    if(!x ||
       typeof x!=="object" ||
       depth>7){
      return "";
    }

    if(seen.has(x)){
      return "";
    }

    seen.add(x);

    for(const n of names){

      if(
        Object.prototype.hasOwnProperty.call(
          x,n
        )
      ){

        const v=
          cleanText(x[n]);

        if(v){
          return v;
        }
      }
    }

    for(const [k,v] of Object.entries(x)){

      if(
        k==="references" ||
        k==="alerts"
      ){
        continue;
      }

      if(v &&
         typeof v==="object"){

        const r=walk(v,depth+1);

        if(r) return r;
      }
    }

    return "";
  }

  return walk(obj,0);
}

function normalizeBkkMetaObject(x){

  if(!x ||
     typeof x!=="object"){
    return null;
  }

  const vehicleId=
    explicitVehicleId(x);

  const plate=
    explicitDeepField(
      x,
      [
        "licensePlate",
        "license_plate",
        "licencePlate",
        "plate",
        "registration"
      ]
    );

  const forgalmi=
    explicitDeepField(

    );

    explicitDeepField(
      x,
      TYPE_FIELDS
    );

  const direction=
    explicitDeepField(

    );

    explicitDeepField(

      BLOCK_FIELDS
    );

    explicitDeepField(

    );

  const tripId=
    explicitDeepField(

      [
        "tripId",

      ]
    );

  if(
    !vehicleId &&
    !plate &&
    !forgalmi &&
    !vehicleType &&
    !direction &&
    !block &&
    !vehicleNumber &&
    !tripId
  ){

  }

  return {
    vehicleId,

    forgalmi,

}

function collectObjects(obj,out=[],seen=new Set(),depth=0){

  if(!obj ||
     typeof obj!=="object" ||
     depth>9){
    return out;
  }

  if(seen.has(obj)){
    return out;
  }

  seen.add(obj);

  const meta=
    normalizeBkkMetaObject(obj);

  if(meta){
    out.push(meta);
  }

  for(const [k,v] of Object.entries(obj)){

    if(
      k==="references" ||
      k==="alerts"
    ){
      continue;
    }

    if(v &&
       typeof v==="object"){

      collectObjects(
        v,
        out,
        seen,
        depth+1
      );
    }
  }

  return out;
}

function scoreMeta(meta,v){

  let score=0;

  const vid=normalizeId(v.vehicleId);
  const mid=normalizeId(meta.vehicleId);

  const plate=normalizeId(v.licensePlate);
  const mplate=normalizeId(meta.plate);

  const trip=norm(v.tripId);
  const mtrip=norm(meta.tripId);

  if(vid && mid && vid===mid){
    score+=100;
  }

  if(plate && mplate && plate===mplate){
    score+=80;
  }

  if(trip && mtrip && trip===mtrip){
    score+=50;
  }

  if(meta.forgalmi) score+=5;
  if(meta.vehicleType) score+=5;
  if(meta.direction) score+=3;
  if(meta.block) score+=3;
  if(meta.vehicleNumber) score+=2;

  return score;
}

function mergeMeta(target,meta){

  if(!meta) return target;

  if(meta.vehicleId)
    target.vehicleId=meta.vehicleId;

  if(meta.plate)
    target.licensePlate=meta.plate;

  if(meta.forgalmi)
    target.forgalmi=meta.forgalmi;

  if(meta.vehicleType)
    target.vehicleType=meta.vehicleType;

  if(meta.direction)
    target.direction=meta.direction;

  if(meta.block)
    target.blockId=meta.block;

  if(meta.vehicleNumber)
    target.blockVehicleNumber=
      meta.vehicleNumber;

  return target;
}

function extractBestMeta(json,v){

  const all=
    collectObjects(json,[]);

  let best=null;
  let bestScore=0;

  for(const meta of all){

    const s=
      scoreMeta(meta,v);

    if(s>bestScore){
      bestScore=s;
      best=meta;
    }
  }

  return best;
}

async function fetchVehicleMeta(v,force=false){

  const cacheKey=
    normalizeId(v.vehicleId) ||
    normalizeId(v.licensePlate) ||
    norm(v.tripId);

  if(!cacheKey){
    return;
  }

  const now=Date.now();

  if(
    !force &&
    metaTime.has(cacheKey) &&
    now-metaTime.get(cacheKey)<30000
  ){
    return;
  }

  const urls=[];

  const baseParams={
    version:"3",
    appVersion:"1"
  };

  if(v.tripId){

    urls.push(
      authUrl(
        TRIP_DETAILS_URL,
        {
          ...baseParams,
          tripId:v.tripId
        }
      )
    );

    urls.push(
      authUrl(
        VEHICLE_FOR_TRIP_URL,
        {
          ...baseParams,
          tripId:v.tripId
        }
      )
    );
  }

  if(v.vehicleId){

    urls.push(
      authUrl(
        VEHICLE_FOR_TRIP_URL,
        {
          ...baseParams,
          vehicleId:v.vehicleId
        }
      )
    );
  }

  if(!urls.length){
    return;
  }

  const results=
    await Promise.allSettled(
      urls.map(u=>fetchJson(u))
    );

  let merged={};

  for(const r of results){

    if(r.status!=="fulfilled"){
      continue;
    }

    const meta=
      extractBestMeta(
        r.value,
        v
      );

    if(meta){
      merged={
        ...merged,
        ...Object.fromEntries(
          Object.entries(meta)
            .filter(([,value])=>value)
        )
      };
    }
  }

  const m={
    vehicleId:merged.vehicleId || "",
    licensePlate:merged.plate || "",
    forgalmi:merged.forgalmi || "",
    vehicleType:merged.vehicleType || "",
    direction:merged.direction || "",
    blockId:merged.block || "",
    blockVehicleNumber:
      merged.vehicleNumber || ""
  };

  metaCache.set(cacheKey,m);
  metaTime.set(cacheKey,now);

  mergeMeta(v,m);
}

async function enrichVisibleVehicles(force=false){

  if(!vehicleData.length) return;

  const filtered=
    getFilteredVehicles();

  const source=
    filtered.length
      ? filtered
      : vehicleData;

  /*
    Szűrésnél a találatok kapnak elsőbbséget.
    Szűrés nélkül csak kis köteg indul,
    hogy 900+ járműnél ne legyen 60×3 API-kérés.
  */
  const limit=
    filtered.length
      ? Math.min(filtered.length,30)
      : 20;

  const batch=
    source
      .filter(v=>
        v.provider==="BKK" ||
        v.source==="BKK GTFS-RT"
      )
      .slice(0,limit);

  if(!batch.length) return;

  await Promise.allSettled(
    batch.map(v=>
      fetchVehicleMeta(v,force)
    )
  );

  renderVehicles();
}

function looksLikeFutarVehicle(o){

  if(!o ||
     typeof o!=="object"){
    return false;
  }

  const vehicleId=
    explicitVehicleId(o);

  const plate=
    explicitDeepField(
      o,
      [
        "licensePlate",
        "license_plate",
        "plate",
        "registration"
      ]
    );

  const tripId=
    explicitDeepField(
      o,
      [
        "tripId",
        "trip_id"
      ]
    );

  const routeId=
    explicitDeepField(
      o,
      [
        "routeId",
        "route_id"
      ]
    );

  const lat=
    num(
      o.lat ??
      o.latitude
    );

  const lon=
    num(
      o.lon ??
      o.longitude
    );

  /*
    Általános "id" itt szándékosan NEM számít.
  */

  if(vehicleId){
    return true;
  }

  if(
    plate &&
    (tripId || routeId) &&
    lat!==null &&
    lon!==null
  ){
    return true;
  }

  return false;
}

function collectFutarVehicles(
  obj,
  out=[],
  seen=new Set(),
  depth=0
){

  if(!obj ||
     typeof obj!=="object" ||
     depth>10){
    return out;
  }

  if(seen.has(obj)){
    return out;
  }

  seen.add(obj);

  if(looksLikeFutarVehicle(obj)){
    out.push(obj);
  }

  for(const [k,v] of Object.entries(obj)){

    if(k==="references"){
      /*
        A references alatt is lehetnek explicit
        vehicleId-s rekordok, ezért nem dobjuk ki.
      */
    }

    if(v &&
       typeof v==="object"){

      collectFutarVehicles(
        v,
        out,
        seen,
        depth+1
      );
    }
  }

  return out;
}

function normalizeFutarVehicle(x){

  const vehicleId=
    explicitVehicleId(x);

  const plate=
    explicitDeepField(
      x,
      [
        "licensePlate",
        "license_plate",
        "plate",
        "registration"
      ]
    );

  const routeId=
    explicitDeepField(
      x,
      [
        "routeId",
        "route_id"
      ]
    );

  const tripId=
    explicitDeepField(
      x,
      [
        "tripId",
        "trip_id"
      ]
    );

  const lat=
    num(
      x.lat ??
      x.latitude
    );

  const lon=
    num(
      x.lon ??
      x.longitude
    );

  const bearing=
    num(
      x.bearing ??
      x.heading
    );

  const speed=
    num(
      x.speed
    );

  return {
    vehicleId,
    licensePlate:plate,
    routeId,
    tripId,
    lat,
    lon,
    bearing,
    speed,
    raw:x
  };
}

function matchFutarToVehicle(v,f){

  if(
    v.vehicleId &&
    f.vehicleId &&
    normalizeId(v.vehicleId)===
    normalizeId(f.vehicleId)
  ){
    return 100;
  }

  if(
    v.licensePlate &&
    f.licensePlate &&
    normalizeId(v.licensePlate)===
    normalizeId(f.licensePlate)
  ){
    return 90;
  }

  if(
    v.tripId &&
    f.tripId &&
    norm(v.tripId)===norm(f.tripId)
  ){
    return 80;
  }

  if(
    v.routeId &&
    f.routeId &&
    norm(v.routeId)===norm(f.routeId) &&
    Number.isFinite(v.lat) &&
    Number.isFinite(v.lon) &&
    Number.isFinite(f.lat) &&
    Number.isFinite(f.lon)
  ){

    const d=
      distanceKm(
        v.lat,
        v.lon,
        f.lat,
        f.lon
      );

    if(d<0.5){
      return 40;
    }
  }

  return 0;
}

function mergeFutar(v,f){

  if(f.licensePlate &&
     !v.licensePlate){
    v.licensePlate=f.licensePlate;
  }

  if(f.bearing!==null &&
     v.bearing===null){
    v.bearing=f.bearing;
  }

  if(
    f.speed!==null &&
    v.speed===null
  ){
    v.speed=f.speed;
  }

  v.futarMatched=true;
  v.futarVehicleId=
    f.vehicleId || "";

  /*
    FUTÁR generic id NEM kerül ide.
  */
}

function parseVehicleFeed(feed){

  const out=[];

  for(const entity of feed.entity || []){

    const vp=
      entity.vehicle ||
      entity.vehiclePosition ||
      entity.vehicle_position;

    if(!vp) continue;

    const trip=
      vp.trip || {};

    const veh=
      vp.vehicle || {};

    const vehicleId=
      cleanText(
        veh.id ||
        veh.vehicleId ||
        veh.vehicle_id
      );

    const label=
      cleanText(
        veh.label
      );

    const plate=
      cleanText(
        veh.licensePlate ||
        veh.license_plate
      );

    const routeId=
      cleanText(
        trip.routeId ||
        trip.route_id
      );

    const tripId=
      cleanText(
        trip.tripId ||
        trip.trip_id
      );

    const directionId=
      trip.directionId ??
      trip.direction_id ??
      null;

    const stopId=
      cleanText(
        vp.stopId ||
        vp.stop_id
      );

    const stopSequence=
      num(
        vp.currentStopSequence ??
        vp.current_stop_sequence
      );

    const lat=
      num(vp.position &&
          vp.position.latitude);

    const lon=
      num(vp.position &&
          vp.position.longitude);

    if(
      lat===null ||
      lon===null
    ){
      continue;
    }

    const speed=
      num(
        vp.position &&
        vp.position.speed
      );

    const bearing=
      num(
        vp.position &&
        vp.position.bearing
      );

    const timestamp=
      num(vp.timestamp);

    const route=
      gtfsRoutesById.get(routeId);

    out.push({

      /*
        entity.id-t NEM használjuk jármű-ID-ként.
      */
      id:vehicleId || null,

      vehicleId:
        vehicleId || null,

      label:
        label || null,

      licensePlate:
        plate || null,

      routeId:
        routeId || null,

      routeShortName:
        route &&
        route.shortName
          ? route.shortName
          : null,

      routeLongName:
        route &&
        route.longName
          ? route.longName
          : null,

      tripId:
        tripId || null,

      directionId,

      direction:null,

      stopId:
        stopId || null,

      stopSequence,

      lat,
      lon,

      speed,
      bearing,
      timestamp,

      delaySeconds:null,

      forgalmi:null,
      forda:null,
      vehicleType:null,

      blockId:null,
      blockVehicleNumber:null,

      futarMatched:false,
      futarVehicleId:null,

      gpsDistanceKm:null,

      provider:"BKK",
      source:"BKK GTFS-RT"
    });
  }

  return out;
}

        lon:centerLon,

        /*
          nagy terület, hogy ne csak egy kis
          környék járművei legyenek kérve
        */
        latSpan:1.2,
        lonSpan:1.6,

        version:"3",
        appVersion:"1"
      }
    );

  try{

    const json=
      await fetchJson(url);

    const raw=
      collectFutarVehicles(json);

    const normalized=
      raw
        .map(normalizeFutarVehicle)
        .filter(x=>
          x.vehicleId ||
          (
            x.licensePlate &&
            (
              x.tripId ||
              x.routeId
            )
          )
        );

    const unique=new Map();

    for(const f of normalized){

      const key=
        normalizeId(f.vehicleId) ||
        (
          normalizeId(f.licensePlate)+
          "|" +
          norm(f.tripId)
        );

      if(!key) continue;

      if(!unique.has(key)){
        unique.set(key,f);
      }
    }

    futarData=
      [...unique.values()];

    lastFutarCount=
      futarData.length;

    setBadge(
      "badgeFutar",
      "FUTÁR: "+
      lastFutarCount,
      lastFutarCount>0
    );

    log(
      "FUTÁR: "+
      lastFutarCount+
      " valódi, explicit azonosítású rekord."
    );

    /*
      FUTÁR -> BKK VP párosítás.
    */
    for(const v of vehicleData){

      let best=null;
      let bestScore=0;

      for(const f of futarData){

        const s=
          matchFutarToVehicle(
            v,
            f
          );

        if(s>bestScore){
          bestScore=s;
          best=f;
        }
      }

      if(best &&
         bestScore>=40){

        mergeFutar(
          v,
          best
        );
      }
    }

    /*
      Ha a BKK VP üres lenne, csak explicit
      FUTÁR rekordokból készítünk járművet.
      Általános id-t nem használunk.
    */
    if(!vehicleData.length){

      for(const f of futarData){

        if(
          !Number.isFinite(f.lat) ||
          !Number.isFinite(f.lon)
        ){
          continue;
        }

        const route=
          gtfsRoutesById.get(
            f.routeId
          );

        vehicleData.push({

          id:
            f.vehicleId || null,

          vehicleId:
            f.vehicleId || null,

          label:null,

          licensePlate:
            f.licensePlate || null,

          routeId:
            f.routeId || null,

          routeShortName:
            route &&
            route.shortName
              ? route.shortName
              : null,

          routeLongName:
            route &&
            route.longName
              ? route.longName
              : null,

          tripId:
            f.tripId || null,

          directionId:null,
          direction:null,

          stopId:null,
          stopSequence:null,

          lat:f.lat,
          lon:f.lon,

          speed:f.speed,
          bearing:f.bearing,
          timestamp:null,

          delaySeconds:null,

          forgalmi:null,
          forda:null,
          vehicleType:null,

          blockId:null,
          blockVehicleNumber:null,

          futarMatched:true,
          futarVehicleId:
            f.vehicleId || null,

          gpsDistanceKm:null,

          provider:"BKK",
          source:"BKK FUTÁR"
        });
      }
    }

  }catch(err){

    lastFutarCount=0;

    setBadge(
      "badgeFutar",
      "FUTÁR: HIBA",
      false
    );

    log(
      "FUTÁR hiba: "+
      err.message
    );
  }
}


/* =========================================================
   GPS
   ========================================================= */

function requestGPS(){

  return new Promise(
    (resolve,reject)=>{

      if(!navigator.geolocation){
        reject(
          new Error(
            "A böngésző nem támogatja a GPS-t."
          )
        );
        return;
      }

      navigator.geolocation.getCurrentPosition(
        pos=>{

          myGPS={
            lat:pos.coords.latitude,
            lon:pos.coords.longitude,
            accuracy:
              pos.coords.accuracy
          };

          setBadge(
            "badgeGps",
            "GPS: OK",
            true
          );

          log(
            "GPS OK: "+
            myGPS.lat.toFixed(6)+
            ", "+
            myGPS.lon.toFixed(6)+
            " ±"+
            Math.round(myGPS.accuracy)+
            " m"
          );

          updateGpsDistances();
          updateMarkers();
          renderVehicles();

          resolve(myGPS);
        },

        err=>{

          setBadge(
            "badgeGps",
            "GPS: HIBA",
            false
          );

          log(
            "GPS hiba: "+
            err.message
          );

          reject(err);
        },

        {
          enableHighAccuracy:true,
          timeout:15000,
          maximumAge:10000
        }
      );
    }
  );
}

function updateGpsDistances(){

  for(const v of vehicleData){

    if(
      !myGPS ||
      !Number.isFinite(v.lat) ||
      !Number.isFinite(v.lon)
    ){
      v.gpsDistanceKm=null;
      continue;
    }

    v.gpsDistanceKm=
      distanceKm(
        myGPS.lat,
        myGPS.lon,
        v.lat,
        v.lon
      );
  }
}

   SZŰRÉS
   ========================================================= */

function textMatch(value,q){
  return norm(value)
    .toLowerCase()
    .includes(
      q.toLowerCase()
    );
}

function vehicleStopName(v){
  const s=getRealtimeStop(v);
  return s ? s.name : "";
}

function vehicleSearchText(v){

  const stop=
    getRealtimeStop(v);

  return [
    v.routeId,
    v.routeShortName,
    v.routeLongName,
    v.licensePlate,
    v.vehicleId,
    v.tripId,
    v.stopId,
    stop && stop.name,
    v.label,
    v.direction,
    v.forgalmi,
    v.vehicleType,
    v.blockId,
    v.blockVehicleNumber
  ]
  .filter(Boolean)
  .join(" ")
  .toLowerCase();
}

function getFilteredVehicles(){

  const uq=
    norm($("universal").value);

  const rq=
    norm($("routeSearch").value);

  const pq=
    norm($("plateSearch").value);

  const line=
    norm($("lineAll").value);

  const radius=
    Number($("radius").value);

  return vehicleData.filter(v=>{

    if(uq &&
       !vehicleSearchText(v)
          .includes(uq.toLowerCase())){
      return false;
    }

    if(rq){

      const q=rq.toLowerCase();

      if(
        !norm(v.routeId)
          .toLowerCase()
          .includes(q) &&
        !norm(v.routeShortName)
          .toLowerCase()
          .includes(q)
      ){
        return false;
      }
    }

    if(pq &&
       !norm(v.licensePlate)
         .toLowerCase()
         .includes(pq.toLowerCase())){
      return false;
    }

    if(line){

      const q=line.toLowerCase();

      if(
        !norm(v.routeId)
          .toLowerCase()
          .includes(q) &&
        !norm(v.routeShortName)
          .toLowerCase()
          .includes(q)
      ){
        return false;
      }
    }

    if(
      myGPS &&
      radius<999999
    ){

      if(
        !Number.isFinite(v.gpsDistanceKm) ||
        v.gpsDistanceKm>radius
      ){
        return false;
      }
    }

    return true;
  });
}


/* =========================================================
   JÁRMŰ ADATOK
   ========================================================= */

function routeName(v){
  return (
    v.routeShortName ||
    v.routeId ||
    "NINCS ADAT"
  );
}

function routeProviderClass(v){

  const rid=
    (
      v.routeId ||
      ""
    ).toUpperCase();

  if(
    rid.includes("H") ||
    rid.includes("HEV")
  ){
    return "hev";
  }

  if(
    v.provider==="VOLAN"
  ){
    return "volan";
  }

  if(
    v.provider==="MAV"
  ){
    return "mav";
  }

  if(
    v.provider==="BKK"
  ){
    return "bkv";
  }

  return "unknown";
}

function delayClass(v){
  const d=
    formatDelay(
      v.delaySeconds
    );

  if(d.cls==="delay-late")
    return "delay-late";

  if(d.cls==="delay-early")
    return "delay-early";

  if(d.cls==="delay-zero")
    return "delay-zero";

  return "";
}

function field(name,value,extraClass=""){

  const valueText=
    nd(value);

  const cls=
    valueText==="NINCS ADAT"
      ? "field-value no-data "
      : "field-value ";

  return `
    <div class="field">
      <div class="field-name">
        ${escapeHtml(name)}
      </div>
      <div class="${cls}${extraClass}">
        ${escapeHtml(valueText)}
      </div>
    </div>
  `;
}

function stopField(v){

  const s=
    stopDisplay(v);

  let value=
    s.name+
    " | GTFS: "+
    s.id;

  if(
    s.meters!==null &&
    Number.isFinite(s.meters)
  ){

    const m=
      Math.round(s.meters);

    value+=
      " | "+
      m+
      " m";
  }

  return field(
    "MEGÁLLÓ",
    value
  );
}

function directionDisplay(v){

  /*
    A valódi metadata irány élvez elsőbbséget.
    A directionId önmagában csak akkor jelenik meg,
    ha ténylegesen a GTFS-RT adta.
  */

  if(v.direction){
    return v.direction;
  }

  if(
    v.directionId!==null &&
    v.directionId!==undefined
  ){
    return "GTFS direction_id: "+
      v.directionId;
  }

  return "NINCS ADAT";
}

function delayField(v){

  const d=
    formatDelay(
      v.delaySeconds
    );

  return `
    <div class="field">
      <div class="field-name">
        SIETÉS–KÉSÉS
      </div>
      <div class="field-value ${d.cls}">
        ${escapeHtml(d.text)}
      </div>
    </div>
  `;
}

function gpsField(v){

  let value=
    "NINCS ADAT";

  if(
    Number.isFinite(v.gpsDistanceKm)
  ){

    value=
      v.gpsDistanceKm
        .toFixed(2)+
      " km";
  }

  return field(
    "SAJÁT GPS",
    value,
    "gps-distance"
  );
}

  return `

       rel="noopener">
      MENET TÁBLA

function blockLink(v){

  const url=

      .slice(0,10);

  return `

      BLOKK

}

function renderVehicles(){

  const filtered=
    getFilteredVehicles();

  $("count").textContent=
    "Járművek: "+
    filtered.length+
    " / összesen "+
    vehicleData.length;

  /*

    Szűrésnél viszont a találatok megjelennek.

  const hasFilter=

    norm($("routeSearch").value) ||

function markerColorClass(v){
  return routeProviderClass(v);
}

function markerIcon(v){

  const route=
    routeName(v);

  const d=
    formatDelay(
      v.delaySeconds
    );

  const delay=
    d.cls==="delay-late"
      ? " delay-late"
      : d.cls==="delay-early"
        ? " delay-early"
        : d.cls==="delay-zero"
          ? " delay-zero"
          : "";

  return L.divIcon({

    className:"",

    html:
      `<div class="route-marker `+
      markerColorClass(v)+
      delay+
      `">`+
      escapeHtml(route)+
      `</div>`,

    iconSize:[34,34],
    iconAnchor:[17,17],
    popupAnchor:[0,-17]
  });
}

function popupHtml(v){

  const s=
    stopDisplay(v);

  const d=
    formatDelay(
      v.delaySeconds
    );

  let stopText=
    s.name;

  if(s.id){
    stopText+=
      " | GTFS: "+
      s.id;
  }

  if(s.meters!==null){
    stopText+=
      " | "+
      Math.round(s.meters)+
      " m";
  }

  return `
    <b>${escapeHtml(routeName(v))}</b><br>
    Rendszám:
      ${escapeHtml(nd(v.licensePlate))}<br>
    Jármű ID:
      ${escapeHtml(nd(v.vehicleId))}<br>
    Megálló:
      ${escapeHtml(stopText)}<br>
    Sietés-késés:
      ${escapeHtml(d.text)}<br>
    Sebesség:
      ${escapeHtml(
        v.speed===null
          ? "NINCS ADAT"
          : Math.round(
              v.speed*3.6
            )+" km/h"
      )}
  `;
}

function updateMarkerLayer(
  layer,
  cache
){

  const filtered=
    getFilteredVehicles();

  const alive=
    new Set();

  for(const v of filtered){

    if(
      !Number.isFinite(v.lat) ||
      !Number.isFinite(v.lon)
    ){
      continue;
    }

    const key=
      (
        v.vehicleId ||
        v.licensePlate ||
        v.tripId ||
        (v.lat+"|"+v.lon)
      );

    alive.add(key);

    let marker=
      cache.get(key);

    if(!marker){

      marker=
        L.marker(
          [v.lat,v.lon],
          {
            icon:markerIcon(v)
          }
        );

      marker.bindPopup(
        popupHtml(v)
      );

      marker.addTo(layer);

      cache.set(
        key,
        marker
      );

    }else{

      marker.setLatLng(
        [v.lat,v.lon]
      );

      marker.setIcon(
        markerIcon(v)
      );

      marker.setPopupContent(
        popupHtml(v)
      );
    }
  }

  for(const [key,marker] of cache){

    if(!alive.has(key)){

      layer.removeLayer(
        marker
      );

      cache.delete(key);
    }
  }
}

function updateMarkers(){

  if(!map ||
     !vehicleLayer){
    return;
  }

  updateMarkerLayer(
    vehicleLayer,
    markerCache
  );

  if(
    bigMap &&
    bigVehicleLayer
  ){

    updateMarkerLayer(
      bigVehicleLayer,
      bigMarkerCache
    );
  }
}

function focusVehicles(){

  const filtered=
    getFilteredVehicles();

  const points=
    filtered
      .filter(v=>
        Number.isFinite(v.lat) &&
        Number.isFinite(v.lon)
      )
      .map(v=>[
        v.lat,
        v.lon
      ]);

  if(!points.length){
    return;
  }

  map.fitBounds(
    L.latLngBounds(points),
    {
      padding:[30,30],
      maxZoom:15
    }
  );
}

function focusGPS(targetMap=map){

  if(!myGPS){
    log("Nincs GPS-pozíció.");
    return;
  }

  targetMap.setView(
    [
      myGPS.lat,
      myGPS.lon
    ],
    14
  );
}

function initMap(){

  map=
    L.map("map",{
      zoomControl:true
    }).setView(
      [47.4979,19.0402],
      12
    );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:
        "&copy; OpenStreetMap"
    }
  ).addTo(map);

  vehicleLayer=
    L.layerGroup().addTo(map);

  log("Térkép OK.");
}


/* =========================================================
   NAGY TÉRKÉP
   ========================================================= */

function openBigMap(){

  $("mapFullscreen")
    .classList.add("show");

  if(!bigMap){

    bigMap=
      L.map("bigMap").setView(
        [47.4979,19.0402],
        12
      );

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom:19,
        attribution:
          "&copy; OpenStreetMap"
      }
    ).addTo(bigMap);

    bigVehicleLayer=
      L.layerGroup().addTo(bigMap);
  }

  setTimeout(()=>{
    bigMap.invalidateSize();
    updateMarkerLayer(
      bigVehicleLayer,
      bigMarkerCache
    );
  },100);

  if(myGPS){
    focusGPS(bigMap);
  }
}

function closeBigMap(){

  $("mapFullscreen")
    .classList.remove("show");

  if(bigMap){
    setTimeout(
      ()=>bigMap.invalidateSize(),
      100
    );
  }
}

   FŐ FEED
   ========================================================= */

async function fetchVehiclePositions(){

  setBadge(
    "badgeBkk",
    "BKK: VP…",
    null
  );

  const buf=
    await fetchArrayBuffer(
      authUrl(
        VP_URL,
        {
          version:"3",
          appVersion:"1"
        }
      )
    );

  const feed=
    await decodeFeed(buf);

  const arr=
    parseVehicleFeed(feed);

  vehicleData=arr;

  setBadge(
    "badgeBkk",
    "BKK: "+
    vehicleData.length,
    vehicleData.length>0
  );

  log(
    "VehiclePositions: "+
    vehicleData.length+
    " valódi jármű."
  );

  updateGpsDistances();
}

async function fetchTripUpdates(){

  const buf=
    await fetchArrayBuffer(
      authUrl(
        TU_URL,
        {
          version:"3",
          appVersion:"1"
        }
      )
    );

  const feed=
    await decodeFeed(buf);

  processTripUpdates(feed);
}

async function testFeed(){

  if(feedInFlight){
    log(
      "A korábbi feed-frissítés még fut – "
      +"új kérés kihagyva."
    );
    return;
  }

  feedInFlight=true;

  try{

    log(
      "FIX12 FEED TESZT indul."
    );

    /*
      GTFS csak egyszer.
    */
    if(!gtfsReady){
      await loadGTFS();
    }

    if(!protoReady){
      await loadProto();
    }

    /*
      1. BKK VehiclePositions
    */
    try{

      await fetchVehiclePositions();

    }catch(err){

      setBadge(
        "badgeBkk",
        "BKK: HIBA",
        false
      );

      log(
        "VehiclePositions hiba: "+
        err.message
      );

      vehicleData=[];
    }

    /*
      2. FUTÁR és TripUpdates párhuzamosan
    */
    const results=
      await Promise.allSettled([
        loadFutarVehicles(),
        fetchTripUpdates()
      ]);

    for(const r of results){

      if(r.status==="rejected"){

        log(
          "Párhuzamos feed hiba: "+
          r.reason?.message
        );
      }
    }

    applyTripDelays();

    updateGpsDistances();

    /*
      A metadata célzottan a szűrt /
      látható járművekre megy.
    */
    await enrichVisibleVehicles(false);

    updateMarkers();
    renderVehicles();

    log(
      "FIX12 FEED TESZT kész. "+
      "Jármű: "+
      vehicleData.length+
      " | FUTÁR: "+
      lastFutarCount+
      " | TripUpdates: "+
      lastTripCount
    );

  }finally{

    feedInFlight=false;
  }
}


/* =========================================================
   AUTO
   ========================================================= */

function toggleAuto(){

  if(autoTimer){

    clearInterval(autoTimer);
    autoTimer=null;

    $("autoBtn").textContent=
      "AUTO 10 s";

    log(
      "AUTO 10 s kikapcsolva."
    );

    return;
  }

  autoTimer=
    setInterval(
      ()=>{
        testFeed().catch(
          e=>log(
            "AUTO hiba: "+
            e.message
          )
        );
      },
      10000
    );

  $("autoBtn").textContent=
    "AUTO 10 s: BE";

  log(
    "AUTO 10 s bekapcsolva."
  );

  testFeed();
}


/* =========================================================
   SZŰRŐK
   ========================================================= */

function filtersChanged(){

  updateGpsDistances();

  updateMarkers();

  renderVehicles();

  /*
    Ha szűrtünk, célzottan megpróbáljuk
    a hiányzó 4 metadata mezőt is betölteni.
  */
  if(
    norm($("routeSearch").value) ||
    norm($("plateSearch").value) ||
    norm($("universal").value) ||
    norm($("lineAll").value)
  ){

    enrichVisibleVehicles(false)
      .catch(
        e=>log(
          "Metadata hiba: "+
          e.message
        )
      );
  }
}

function clearFilters(){

  $("universal").value="";
  $("routeSearch").value="";
  $("plateSearch").value="";
  $("lineAll").value="";
  $("radius").value="2.5";

  filtersChanged();

  log(
    "Szűrések törölve."
  );
}


/* =========================================================
   ESEMÉNYEK
   ========================================================= */

$("saveKey").addEventListener(
  "click",
  saveApiKey
);

$("feedTest").addEventListener(
  "click",
  ()=>{
    testFeed().catch(
      e=>log(
        "FEED TESZT hiba: "+
        e.message
      )
    );
  }
);

$("gpsBtn").addEventListener(
  "click",
  ()=>{
    requestGPS().catch(()=>{});
  }
);

$("autoBtn").addEventListener(
  "click",
  toggleAuto
);

$("clearFilters").addEventListener(
  "click",
  clearFilters
);

$("vehiclesView").addEventListener(
  "click",
  focusVehicles
);

$("mapVehicles").addEventListener(
  "click",
  focusVehicles
);

$("mapGps").addEventListener(
  "click",
  ()=>focusGPS(map)
);

$("mapBig").addEventListener(
  "click",
  openBigMap
);

$("mapFullscreen").addEventListener(
  "click",
  openBigMap
);

$("backMap").addEventListener(
  "click",
  closeBigMap
);

[
  "universal",
  "routeSearch",
  "plateSearch",
  "lineAll",
  "radius"
].forEach(id=>{

  $(id).addEventListener(
    "input",
    filtersChanged
  );

  $(id).addEventListener(
    "change",
    filtersChanged
  );
});


/* =========================================================
   INDULÁS
   ========================================================= */

async function start(){

  loadApiKey();

  initMap();

  log(
    "ATTILA KÖZLEKEDÉS – BKK VADÁSZ FIX12 indul."
  );

  log(
    "Csak valódi BKK/FUTÁR/GTFS/GTFS-RT adat."
  );

  log(
    "Az általános FUTÁR 'id' nem használható "
    +"járműazonosítóként."
  );

  log(
    "FIX12 – 5 javítandó kapcsolat: "
    +"megálló-távolság, késés, forgalmi, "
    +"járműtípus, irány."
  );

  try{

    await loadGTFS();

  }catch(err){

    setBadge(
      "badgeGtfs",
      "GTFS: HIBA",
      false
    );

    log(
      "GTFS hiba: "+
      err.message
    );
  }

  try{

    await loadProto();

  }catch(err){

    log(
      "Protobuf hiba: "+
      err.message
    );
  }

  /*
    Induláskor egyszer lekérjük a valós feedet.
  */
  testFeed().catch(
    e=>log(
      "Indulási feed hiba: "+
      e.message
    )
  );
}

start();

</script>
