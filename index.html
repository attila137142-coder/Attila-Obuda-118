<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🟩 V3 ANALYTICS CORE PRO MAX</title>

<style>

body{
    font-family:Arial;
    background:#0f172a;
    color:white;
    padding:20px;
}

h1{
    color:#4ade80;
}

h2{
    margin-top:35px;
    color:#38bdf8;
}

input,textarea,button{
    width:100%;
    padding:10px;
    margin-top:6px;
    border:none;
    border-radius:8px;
    box-sizing:border-box;
}

input,textarea{
    background:#1e293b;
    color:white;
}

textarea{
    min-height:220px;
    resize:vertical;
}

button{
    background:#22c55e;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#16a34a;
}

.card{
    background:#1e293b;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
    line-height:1.6;
}

.best{
    border:2px solid #4ade80;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
    font-size:14px;
}

th,td{
    border:1px solid #334155;
    padding:8px;
    text-align:left;
}

th{
    background:#111827;
    color:#38bdf8;
}

.green{
    color:#4ade80;
}

.red{
    color:#f87171;
}

.blue{
    color:#38bdf8;
}

</style>
</head>

<body>

<h1>🟩 V3 ANALYTICS CORE PRO MAX</h1>

<!-- ================================================= -->
<!-- KEDVEZMÉNY -->
<!-- ================================================= -->

<h2>🛒 Kedvezmény kalkulátor</h2>

<input id="prices"
placeholder="pl: 1000,2500,1800">

<button onclick="calculateAll()">
SZÁMOLÁS
</button>

<div id="results"></div>

<!-- ================================================= -->
<!-- GYORS % -->
<!-- ================================================= -->

<h2>📊 Gyors százalék kalkulátor</h2>

<input id="original"
placeholder="Eredeti ár">

<input id="discounted"
placeholder="Akciós ár">

<button onclick="calcPercent()">
% SZÁMOLÁS
</button>

<div id="percentResult"></div>

<!-- ================================================= -->
<!-- EREDETI ÁR -->
<!-- ================================================= -->

<h2>🔁 Teljes ár visszaszámolás</h2>

<input id="finalPrice"
placeholder="Akciós ár">

<input id="percent"
placeholder="Kedvezmény %">

<button onclick="calcOriginal()">
EREDTI ÁR
</button>

<div id="originalResult"></div>

<!-- ================================================= -->
<!-- KIMARADT ÁRU -->
<!-- ================================================= -->

<h2>📦 Kimaradt áru kalkulátor</h2>

<input id="paidAmount"
placeholder="Kifizetett összeg">

<input id="hiddenAmount"
placeholder="Kimaradt áru értéke">

<button onclick="calcUnpaidStats()">
KISZÁMOLÁS
</button>

<div id="unpaidResult"></div>

<!-- ================================================= -->
<!-- RAKTÁR -->
<!-- ================================================= -->

<h2>📦 Százalékos megosztás</h2>

<input id="totalWeight"
placeholder="Teljes súly">

<input id="p1"
placeholder="% 1">

<input id="p2"
placeholder="% 2">

<input id="p3"
placeholder="% 3">

<input id="p4"
placeholder="% 4">

<button onclick="calcDistribution()">
MEGOSZTÁS
</button>

<div id="distResult"></div>

<!-- ================================================= -->
<!-- % VISSZA -->
<!-- ================================================= -->

<h2>🔁 % visszaszámolás</h2>

<input id="partWeight"
placeholder="Rész">

<input id="totalWeight2"
placeholder="Teljes">

<button onclick="calcBackPercent()">
SZÁMOLÁS
</button>

<div id="backResult"></div>

<!-- ================================================= -->
<!-- MEGÁLLÓKÖZ -->
<!-- ================================================= -->

<h2>🚏 Megállóköz / útvonal elemző</h2>

<p>
Excelből közvetlenül bemásolható:<br>
Megálló TAB Távolság
</p>

<textarea id="mhData">Jászai Mari tér	0
Országház, látogatóközpont	458
Kossuth Lajos tér M	919
Széchenyi István tér	1585
Eötvös tér	1922
Vigadó tér	2205
Március 15. tér	2811
Fővám tér M	3385</textarea>

<button onclick="analyzeLine()">
🚆 VONAL ELEMZÉS
</button>

<div id="lineResult"></div>

<!-- ================================================= -->
<!-- EMELKEDŐ -->
<!-- ================================================= -->

<h2>⛰️ Emelkedő / lejtő kalkulátor</h2>

<input id="roadDist"
placeholder="Út hossza méterben">

<input id="heightDiff"
placeholder="Szintkülönbség méterben">

<button onclick="calcSlope()">
📈 EMELKEDÉS SZÁMOLÁS
</button>

<div id="slopeResult"></div>

<script>

// =================================================
// SEGÉD
// =================================================

function sum(arr){

    return arr.reduce((a,b)=>a+b,0);

}

function parsePrices(){

    return document
    .getElementById('prices')
    .value
    .split(',')
    .map(x=>parseFloat(x.trim()))
    .filter(x=>!isNaN(x))
    .sort((a,b)=>a-b);

}

// =================================================
// DEALS
// =================================================

function dealA(p){

    let f=Math.floor(p.length/3);

    return sum(p)-sum(p.slice(0,f));

}

function dealB(p){

    return sum(p)*0.8;

}

function dealC(p){

    let d=Math.floor(p.length/2);

    return sum(p)-sum(p.slice(0,d))*0.33;

}

function dealD(p){

    let f=Math.min(Math.floor(p.length/6),1);

    return sum(p)-sum(p.slice(0,f));

}

// =================================================
// KEDVEZMÉNY
// =================================================

function calculateAll(){

    let p=parsePrices();

    if(p.length===0) return;

    let base=sum(p);

    let A=dealA(p);
    let B=dealB(p);
    let C=dealC(p);
    let D=dealD(p);

    let min=Math.min(A,B,C,D);

    function save(x){

        return (base-x).toFixed(0);

    }

    function percent(x){

        return (((base-x)/base)*100).toFixed(1);

    }

    document.getElementById('results').innerHTML=`

<div class="card ${A===min?'best':''}">
🅰️ 3. ingyen →
${A.toFixed(0)} Ft |
-${percent(A)}% |
spórolsz ${save(A)} Ft
</div>

<div class="card ${B===min?'best':''}">
🅱️ -20% →
${B.toFixed(0)} Ft |
-${percent(B)}% |
spórolsz ${save(B)} Ft
</div>

<div class="card ${C===min?'best':''}">
🅲 2. -33% →
${C.toFixed(0)} Ft |
-${percent(C)}% |
spórolsz ${save(C)} Ft
</div>

<div class="card ${D===min?'best':''}">
🅳 6-ból 1 ingyen →
${D.toFixed(0)} Ft |
-${percent(D)}% |
spórolsz ${save(D)} Ft
</div>

<h2>
🏆 LEGJOBB:
${A===min?'A':B===min?'B':C===min?'C':'D'}
</h2>

`;

}

// =================================================
// GYORS %
// =================================================

function calcPercent(){

    let o=parseFloat(
        document.getElementById('original').value
    );

    let d=parseFloat(
        document.getElementById('discounted').value
    );

    if(!o||!d) return;

    let diff=o-d;

    let perc=(diff/o)*100;

    document.getElementById('percentResult').innerHTML=`

<div class="card">

📉 Kedvezmény:
<b>${perc.toFixed(2)}%</b>

<br><br>

💰 Megtakarítás:
<b>${diff.toFixed(0)} Ft</b>

</div>

`;

}

// =================================================
// EREDETI
// =================================================

function calcOriginal(){

    let f=parseFloat(
        document.getElementById('finalPrice').value
    );

    let p=parseFloat(
        document.getElementById('percent').value
    );

    if(!f||!p) return;

    let original=f/(1-p/100);

    document.getElementById('originalResult').innerHTML=`

<div class="card">

💰 Eredeti ár:
<b>${original.toFixed(0)} Ft</b>

</div>

`;

}

// =================================================
// KIMARADT
// =================================================

function calcUnpaidStats(){

    let paid=parseFloat(
        document.getElementById('paidAmount').value
    );

    let hidden=parseFloat(
        document.getElementById('hiddenAmount').value
    );

    if(!paid||!hidden) return;

    let total=paid+hidden;

    let saved=(hidden/total)*100;

    let paidPercent=(paid/total)*100;

    document.getElementById('unpaidResult').innerHTML=`

<div class="card">

💰 Teljes érték:
<b>${total.toFixed(0)} Ft</b>

<br><br>

📦 Kimaradt:
<b>${hidden.toFixed(0)} Ft</b>

<br><br>

📉 „Megtakarítás”:
<b class="green">
${saved.toFixed(2)}%
</b>

<br><br>

💳 Kifizetett:
<b class="red">
${paidPercent.toFixed(2)}%
</b>

</div>

`;

}

// =================================================
// RAKTÁR
// =================================================

function calcDistribution(){

    let total=parseFloat(
        document.getElementById('totalWeight').value
    );

    let p=[

        parseFloat(document.getElementById('p1').value)||0,
        parseFloat(document.getElementById('p2').value)||0,
        parseFloat(document.getElementById('p3').value)||0,
        parseFloat(document.getElementById('p4').value)||0

    ];

    if(!total) return;

    let names=[
        "Ellopták",
        "Megromlott",
        "Kolléga elvitte",
        "Vevők megvették"
    ];

    let html="";
    let used=0;

    for(let i=0;i<p.length;i++){

        let weight=total*(p[i]/100);

        used+=weight;

        html+=`

<div class="card">

${names[i]}:
<b>${p[i]}%</b>
→
${weight.toFixed(1)}

</div>

`;

    }

    let remain=total-used;

    html+=`

<div class="card">

📦 Maradék:
<b>${remain.toFixed(1)}</b>

</div>

`;

    document.getElementById('distResult').innerHTML=html;

}

// =================================================
// % VISSZA
// =================================================

function calcBackPercent(){

    let part=parseFloat(
        document.getElementById('partWeight').value
    );

    let total=parseFloat(
        document.getElementById('totalWeight2').value
    );

    if(!part||!total) return;

    let percent=(part/total)*100;

    document.getElementById('backResult').innerHTML=`

<div class="card">

📊 Ez:
<b>${percent.toFixed(2)}%</b>

</div>

`;

}

// =================================================
// VONAL ELEMZŐ
// =================================================

function analyzeLine(){

    let raw =
    document.getElementById("mhData")
    .value
    .trim();

    if(!raw){

        alert("Nincs adat");

        return;
    }

    let rows = raw.split("\n");

    let data = [];

    rows.forEach((r,index)=>{

        let p = r.split(/\t|;/);

        if(p.length >= 2){

            let name =
            p[0].trim();

            let totalDist =
            parseFloat(
                p[1]
                .replace(",",".")
                .trim()
            );

            data.push({

                code:index+1,

                name:name,

                total:totalDist

            });

        }

    });

    if(data.length < 2){

        alert("Kevés adat");

        return;
    }

    let full =
    data[data.length-1].total;

    let html = `

<table>

<tr>

<th>#</th>
<th>Megálló</th>
<th>Össz táv</th>
<th>Köv MH</th>
<th>Még hátra</th>
<th>% megtett</th>
<th>% hátra</th>

</tr>

`;

    for(let i=0;i<data.length;i++){

        let curr = data[i];

        let nextDist = 0;

        if(i < data.length-1){

            nextDist =
            data[i+1].total -
            curr.total;

        }

        let remain =
        full - curr.total;

        let doneP =
        (curr.total/full)*100;

        let remainP =
        (remain/full)*100;

        html += `

<tr>

<td>${curr.code}</td>

<td>${curr.name}</td>

<td>${curr.total.toFixed(0)} m</td>

<td>${nextDist.toFixed(0)} m</td>

<td>${remain.toFixed(0)} m</td>

<td class="green">
${doneP.toFixed(1)}%
</td>

<td class="red">
${remainP.toFixed(1)}%
</td>

</tr>

`;

    }

    html += `</table>`;

    let avg =
    full / (data.length-1);

    html += `

<div class="card">

🚆 Teljes vonal:
<b>${full.toFixed(0)} m</b>

<br><br>

📏 Átlag MH:
<b>${avg.toFixed(0)} m</b>

<br><br>

🚏 Megállók:
<b>${data.length}</b>

</div>

`;

    document.getElementById("lineResult").innerHTML =
    html;

}

// =================================================
// EMELKEDŐ
// =================================================

function calcSlope(){

    let road =
    parseFloat(
        document.getElementById("roadDist").value
    );

    let height =
    parseFloat(
        document.getElementById("heightDiff").value
    );

    if(!road || !height){

        alert("Adj meg adatokat");

        return;
    }

    let percent =
    (height / road) * 100;

    let permille =
    (height / road) * 1000;

    let angle =
    Math.atan(height / road) *
    180 / Math.PI;

    document.getElementById("slopeResult").innerHTML = `

<div class="card">

📏 Út hossza:
<b>${road.toFixed(1)} m</b>

<br><br>

⛰️ Szintkülönbség:
<b>${height.toFixed(1)} m</b>

<br><br>

📈 Emelkedés:
<b class="green">
${percent.toFixed(2)}%
</b>

<br><br>

🚆 Vasúti ezrelék:
<b class="blue">
${permille.toFixed(1)}‰
</b>

<br><br>

🧭 Emelkedési szög:
<b>
${angle.toFixed(2)}°
</b>

</div>

`;

}
