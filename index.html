<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>ATTILA DISPATCH V4.5</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{margin:0;display:flex;font-family:Arial}
#sidebar{width:360px;overflow:auto;border-right:1px solid #ccc}
#map{flex:1;height:100vh}
input{width:100%;padding:10px}

/* MATRIX */
.matrix{background:black;color:#00ff66;font-family:monospace;padding:10px}
.row{display:grid;grid-template-columns:70px 1fr 100px;padding:10px;border-bottom:1px solid #003300}
</style>
</head>

<body>

<div id="sidebar">
<input id="search" placeholder="🔍 Név / GTFS ID">
<div id="status">Indítás...</div>
<div id="list"></div>
<div id="panel"></div>
</div>

<div id="map"></div>

<script>

// ===== MAP =====
const map=L.map('map').setView([47.5,19.05],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// ===== DB =====
let db;
const DB_NAME="GTFS_CACHE";

function initDB(){
  return new Promise(res=>{
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=e=>{
      db=e.target.result;
      db.createObjectStore("files",{keyPath:"name"});
    };
    req.onsuccess=e=>{
      db=e.target.result;
      res();
    };
  });
}

function saveFile(name,data){
  const tx=db.transaction("files","readwrite");
  tx.objectStore("files").put({name,data});
}

function getFiles(){
  return new Promise(r=>{
    const tx=db.transaction("files","readonly");
    const req=tx.objectStore("files").getAll();
    req.onsuccess=()=>r(req.result);
  });
}

// ===== ADAT =====
let stops=[], stopTimes=[], trips={}, routes={};

// ===== AUTO LOAD URL =====
const SOURCES=[
  "https://bkk.hu/gtfs/budapest_gtfs.zip"
];

// ===== LOAD ZIP =====
async function loadZip(arrayBuffer){

  const zip=await JSZip.loadAsync(arrayBuffer);

  const parse=(txt)=>txt.split("\n");

  // STOPS
  const s=parse(await zip.file("stops.txt").async("string"));
  const h=s[0].split(",");

  const idI=h.indexOf("stop_id");
  const nameI=h.indexOf("stop_name");
  const latI=h.indexOf("stop_lat");
  const lonI=h.indexOf("stop_lon");

  s.slice(1).forEach(l=>{
    const c=l.split(",");
    stops.push({
      id:c[idI],
      name:c[nameI],
      lat:+c[latI],
      lon:+c[lonI]
    });
  });

  // ROUTES
  const r=parse(await zip.file("routes.txt").async("string"));
  const hr=r[0].split(",");

  r.slice(1).forEach(l=>{
    const c=l.split(",");
    routes[c[0]]=c[2];
  });

  // TRIPS
  const t=parse(await zip.file("trips.txt").async("string"));
  const ht=t[0].split(",");

  const tid=ht.indexOf("trip_id");
  const rid=ht.indexOf("route_id");
  const head=ht.indexOf("trip_headsign");

  t.slice(1).forEach(l=>{
    const c=l.split(",");
    trips[c[tid]]={
      route:routes[c[rid]],
      headsign:c[head]
    };
  });

  // STOP TIMES
  const st=parse(await zip.file("stop_times.txt").async("string"));
  const hs=st[0].split(",");

  const stopI=hs.indexOf("stop_id");
  const timeI=hs.indexOf("departure_time");
  const tripI=hs.indexOf("trip_id");

  st.slice(1).forEach(l=>{
    const c=l.split(",");
    const p=c[timeI]?.split(":")||[0,0];

    stopTimes.push({
      stop:c[stopI],
      trip:c[tripI],
      sec:+p[0]*3600 + +p[1]*60
    });
  });

}

// ===== AUTO FETCH =====
async function autoLoad(){

  const cached=await getFiles();

  if(cached.length){
    document.getElementById("status").innerText="♻ CACHE BETÖLTÉS";
    for(const f of cached){
      await loadZip(f.data);
    }
    render();
    return;
  }

  document.getElementById("status").innerText="🌐 LETÖLTÉS...";

  for(const url of SOURCES){
    const res=await fetch(url);
    const buf=await res.arrayBuffer();

    saveFile(url,buf);
    await loadZip(buf);
  }

  render();
}

// ===== LISTA =====
function render(){
  const list=document.getElementById("list");
  list.innerHTML="";

  stops.slice(0,300).forEach(s=>{
    const d=document.createElement("div");
    d.innerText=`${s.name} (${s.id})`;
    d.onclick=()=>showStop(s);
    list.appendChild(d);

    if(s.lat) L.marker([s.lat,s.lon]).addTo(map);
  });

  document.getElementById("status").innerText=`✔ ${stops.length} megálló`;
}

// ===== STOP PANEL =====
function showStop(stop){

  const now=new Date();
  const cur=now.getHours()*3600 + now.getMinutes()*60;

  const list=stopTimes
    .filter(t=>t.stop===stop.id && t.sec>=cur)
    .sort((a,b)=>a.sec-b.sec)
    .slice(0,6);

  let html=`<div class="matrix"><h3>${stop.name}</h3>`;

  list.forEach(t=>{
    const trip=trips[t.trip];
    if(!trip) return;

    const diff=t.sec-cur;
    const m=Math.floor(diff/60);

    html+=`
      <div class="row">
        <div>${trip.route}</div>
        <div>${trip.headsign}</div>
        <div>${m}p</div>
      </div>
    `;
  });

  html+=`</div>`;
  panel.innerHTML=html;
}

// ===== SEARCH =====
search.oninput=e=>{
  const q=e.target.value.toLowerCase();
  const f=stops.filter(s=>
    s.name.toLowerCase().includes(q) ||
    s.id.toLowerCase().includes(q)
  );
  renderFiltered(f);
};

function renderFiltered(arr){
  const list=document.getElementById("list");
  list.innerHTML="";

  arr.slice(0,200).forEach(s=>{
    const d=document.createElement("div");
    d.innerText=`${s.name} (${s.id})`;
    d.onclick=()=>showStop(s);
    list.appendChild(d);
  });
}

// ===== INIT =====
(async()=>{
  await initDB();
  await autoLoad();
})();

</script>
</body>
</html>
