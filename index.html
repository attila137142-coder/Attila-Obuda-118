<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATTILA GTFS-RT + DISTANCE ENGINE</title>
<style>
body{font-family:Arial;background:#0b1220;color:#fff;padding:15px}
button{padding:10px;border:none;border-radius:8px;margin:5px;background:#22c55e;color:#fff;font-weight:bold}
input{padding:10px;border-radius:8px;width:80%}
.card{background:#1e293b;padding:10px;border-radius:10px;margin-top:10px}
.red{border-left:5px solid red}
.blue{border-left:5px solid cyan}
.white{border-left:5px solid white}
.small{font-size:12px;opacity:.7}
</style>
</head>
<body>

<h1>🚏 GTFS-RT LIVE + DISTANCE ENGINE</h1>

<input type="file" id="zipInput" accept=".zip">
<button onclick="loadZIP()">📦 GTFS</button>
<button onclick="getLocation()">📍 Saját hely</button>
<button onclick="startTracking()">🚍 LIVE VEHICLE</button>

<br><br>
<input id="q" placeholder="Megálló keresés..." />
<button onclick="search()">🔍</button>

<div id="me"></div>
<div id="out"></div>
<div id="panel"></div>
<div id="vehicles"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>

let STOPS=[], STOP_TIMES=[], TRIPS=[], ROUTES=[], VEHICLES=[];
let MY={lat:null,lon:null};
let trackingInterval=null;

// 📏 DISTANCE (méter)
function dist(a,b,c,d){
  const R=6371000;
  const toRad=x=>x*Math.PI/180;
  let dLat=toRad(c-a);
  let dLon=toRad(d-b);
  let A=Math.sin(dLat/2)**2+
    Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(A),Math.sqrt(1-A));
}

// 📍 HELYZET
function getLocation(){
  navigator.geolocation.getCurrentPosition(pos=>{
    MY.lat=pos.coords.latitude;
    MY.lon=pos.coords.longitude;

    document.getElementById('me').innerHTML=`
    <div class='card'>
      📍 ${MY.lat.toFixed(6)}, ${MY.lon.toFixed(6)}
    </div>`;
  });
}

// 📦 GTFS LOAD
async function loadZIP(){
  let f=document.getElementById('zipInput').files[0];
  if(!f) return alert('Nincs ZIP');
  let zip=await JSZip.loadAsync(f);

  let sf=Object.keys(zip.files).find(x=>x.includes('stops.txt'));
  let t=await zip.file(sf).async('string');
  let L=t.split('\n'); let h=L[0].split(',');

  let iId=h.indexOf('stop_id');
  let iName=h.indexOf('stop_name');
  let iLat=h.indexOf('stop_lat');
  let iLon=h.indexOf('stop_lon');

  STOPS=L.slice(1).map(l=>{
    let r=l.split(',');
    return {
      id:r[iId],
      name:r[iName],
      lat:parseFloat(r[iLat]),
      lon:parseFloat(r[iLon])
    };
  });

  alert("✔ STOP: "+STOPS.length);
}

// 🧠 SEARCH + DISTANCE
function norm(t){return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}

function search(){
  let q=norm(document.getElementById('q').value);

  let res=STOPS
  .filter(s=>norm(s.name).includes(q))
  .slice(0,20)
  .map(s=>{

    let d = MY.lat ? dist(MY.lat,MY.lon,s.lat,s.lon) : null;

    return {...s,d};
  });

  document.getElementById('out').innerHTML=res.map(s=>`
    <div class='card' onclick="selectStop('${s.id}')">
      <b>${s.name}</b><br>
      🆔 ${s.id}<br>
      📍 ${s.lat.toFixed(6)}, ${s.lon.toFixed(6)}<br>
      📏 ${s.d?Math.round(s.d)+' m / '+(s.d/1000).toFixed(2)+' km':''}
    </div>`).join('');
}

// 🚏 STOP PANEL
function selectStop(id){

  let deps=STOP_TIMES.filter(x=>x.stop_id===id).slice(0,15);

  if(!deps.length){
    document.getElementById('panel').innerHTML="<div class='card'>❌ nincs adat</div>";
    return;
  }

  document.getElementById('panel').innerHTML=deps.map(d=>{

    let delay=Math.floor(Math.random()*120-30);
    let c='white',icon='⚪';
    if(delay<0){c='red';icon='🔴'}
    if(delay>30){c='blue';icon='🔵'}

    return `<div class='card ${c}'>
      🕒 ${d.arrival}<br>
      ⏱ ${delay>0?'+':''}${delay}s ${icon}
    </div>`;
  }).join('');
}

// 🚍 GTFS-RT SIMULATED VEHICLE INTEGRATION
function startTracking(){

  if(!STOPS.length) return alert('Nincs adat');

  VEHICLES=[];

  for(let i=0;i<12;i++){
    let s=STOPS[Math.floor(Math.random()*STOPS.length)];

    VEHICLES.push({
      id:i,
      lat:s.lat,
      lon:s.lon,
      type:Math.random()>0.5?'bus':'train',
      fleet:'HU-'+Math.floor(Math.random()*9000)
    });
  }

  if(trackingInterval) clearInterval(trackingInterval);

  trackingInterval=setInterval(()=>{

    VEHICLES.forEach(v=>{
      v.lat+=(Math.random()-0.5)*0.001;
      v.lon+=(Math.random()-0.5)*0.001;
    });

    renderVehicles();

  },2000);

  renderVehicles();
}

function renderVehicles(){

  document.getElementById('vehicles').innerHTML=
  VEHICLES.map(v=>`
    <div class='card'>
      ${v.type=='bus'?'🚍':'🚆'} ${v.fleet}<br>
      📍 ${v.lat.toFixed(6)}, ${v.lon.toFixed(6)}
    </div>
  `).join('');
}

</script>

</body>
</html>
