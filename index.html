<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🥾 SURVIVAL PRO MODE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b0f14;
  color:#e6e6e6;
}

header {
  padding:10px;
  background:#111826;
  display:flex;
  justify-content:space-between;
}

#map {
  height: 60vh;
  width: 100%;
}

.panel {
  padding:10px;
}

.card {
  background:#111826;
  padding:10px;
  margin-bottom:10px;
  border-left:3px solid #4dd0e1;
}
.small { font-size:12px; color:#aaa; }
button {
  padding:8px;
  background:#4dd0e1;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <div>🥾 SURVIVAL PRO MODE</div>
  <div id="status">READY</div>
</header>

<div id="map"></div>

<div class="panel">
  <button onclick="runSurvival()">📍 Saját helyzet + POI scan</button>
  <div id="output"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// 🗺 MAP
const map = L.map('map').setView([47.4979, 19.0402], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OSM'
}).addTo(map);

// 🧭 POI DATABASE
const pois = [
  { name:"Budakeszi", type:"town", coords:[47.510,18.927] },
  { name:"Normafa buszmegálló", type:"bus", coords:[47.503,19.012] },
  { name:"Kaán Károly turistaház", type:"hut", coords:[47.518,18.960] },
  { name:"János-hegy kilátó", type:"view", coords:[47.514,18.956] },
  { name:"Anna-forrás", type:"water", coords:[47.520,18.940] }
];

// 📏 DISTANCE (meter)
function distance(a,b){
  const R=6371000;
  const dLat=(b[0]-a[0])*Math.PI/180;
  const dLon=(b[1]-a[1])*Math.PI/180;

  const x =
    Math.sin(dLat/2)**2 +
    Math.cos(a[0]*Math.PI/180) *
    Math.cos(b[0]*Math.PI/180) *
    Math.sin(dLon/2)**2;

  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// 🧭 BEARING
function bearing(a,b){
  const dLon=(b[1]-a[1])*Math.PI/180;

  const y=Math.sin(dLon)*Math.cos(b[0]*Math.PI/180);
  const x=
    Math.cos(a[0]*Math.PI/180)*Math.sin(b[0]*Math.PI/180)-
    Math.sin(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.cos(dLon);

  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}

// 📍 GET LOCATION
function getUser(){
  return new Promise((resolve,reject)=>{
    navigator.geolocation.getCurrentPosition(pos=>{
      resolve({
        lat:pos.coords.latitude,
        lon:pos.coords.longitude,
        acc:pos.coords.accuracy
      });
    },reject);
  });
}

// 🧠 SURVIVAL SCAN
function scan(user){

  return pois.map(p=>{

    const dist = distance([user.lat,user.lon], p.coords);
    const dir = bearing([user.lat,user.lon], p.coords);

    return {...p, distance:dist, direction:dir};
  }).sort((a,b)=>a.distance-b.distance);
}

// 🗺 MAIN ENGINE
async function runSurvival(){

  const user = await getUser();

  map.setView([user.lat,user.lon],13);

  L.marker([user.lat,user.lon])
    .addTo(map)
    .bindPopup("📍 TE VAGY ITT");

  const results = scan(user).slice(0,5);

  document.getElementById("output").innerHTML = "";

  results.forEach(p=>{

    const icon =
      p.type==="water" ? "💧" :
      p.type==="town" ? "🏘" :
      p.type==="bus" ? "🚌" :
      p.type==="hut" ? "🏡" :
      p.type==="view" ? "👀" : "📍";

    L.marker(p.coords)
      .addTo(map)
      .bindPopup(
        `${icon} ${p.name}<br>
        📏 ${Math.round(p.distance)} m<br>
        🧭 ${Math.round(p.direction)}°`
      );

    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      ${icon} <b>${p.name}</b><br>
      📏 ${Math.round(p.distance)} m<br>
      🧭 ${Math.round(p.direction)}°
    `;

    document.getElementById("output").appendChild(div);
  });

  console.log("SURVIVAL DATA:", results);
}

</script>

</body>
</html>
