<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ATTILA KÖZLEKEDÉS – GYERMEKVASÚT JÁRMŰ FED TESZT</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#071018;
 color:#eef7ff;
 font-family:Arial,sans-serif;
}

header{
 padding:12px 14px;
 background:#0d1d29;
 border-bottom:2px solid #1d4358;
}

h1{
 font-size:20px;
 margin:0 0 5px;
}

.sub{
 font-size:13px;
 color:#9fc1d5;
}

#status{
 padding:10px 14px;
 background:#102431;
 font-weight:bold;
}

.ok{
 color:#72e6a4;
}

.bad{
 color:#ff8585;
}

.wait{
 color:#ffd66b;
}

main{
 display:grid;
 grid-template-columns:430px 1fr;
 gap:10px;
 padding:10px;
}

.panel{
 background:#0d1d29;
 border:1px solid #23475b;
 border-radius:10px;
 padding:12px;
}

button{
 border:0;
 border-radius:8px;
 padding:11px 14px;
 background:#1d6fa5;
 color:white;
 font-weight:bold;
 cursor:pointer;
 margin:3px;
}

button:hover{
 filter:brightness(1.15);
}

#map{
 height:620px;
 border-radius:9px;
 overflow:hidden;
}

#fed{
 min-height:230px;
}

.card{
 background:#102733;
 border:1px solid #285268;
 border-radius:9px;
 padding:12px;
 margin-bottom:9px;
}

.big{
 font-size:24px;
 font-weight:bold;
}

.row{
 display:grid;
 grid-template-columns:145px 1fr;
 gap:6px;
 padding:4px 0;
 border-bottom:1px solid #1d3c4a;
}

.k{
 color:#8fb4c8;
}

.v{
 font-weight:bold;
 overflow-wrap:anywhere;
}

.station{
 font-size:12px;
 line-height:1.5;
 color:#b7d2df;
}

pre{
 white-space:pre-wrap;
 word-break:break-word;
 font-size:11px;
 max-height:230px;
 overflow:auto;
 background:#071018;
 padding:8px;
 border-radius:7px;
}

@media(max-width:850px){

 main{
  grid-template-columns:1fr;
 }

 #map{
  height:430px;
 }

}
</style>
</head>

<body>

<header>

<h1>
🚂 ATTILA KÖZLEKEDÉS – GYERMEKVASÚT JÁRMŰ FED
</h1>

<div class="sub">
VALÓS ADAT TESZT • MÁVPlusz / GraphQL • nincs kitalált járműadat
</div>

</header>

<div id="status" class="wait">
Indítás...
</div>

<main>

<section>

<div class="panel">

<button onclick="loadVehicles()">
🔄 FRISSÍTÉS
</button>

<button onclick="startAuto()">
▶ AUTO 15 mp
</button>

<button onclick="stopAuto()">
■ STOP
</button>

<button onclick="clearLog()">
LOG TÖRLÉS
</button>

<div id="fed"></div>

</div>


<div class="panel" style="margin-top:10px">

<b>
GYERMEKVASÚT GTFS MEGÁLLÓK
</b>

<div id="stations" class="station"></div>

</div>


<div class="panel" style="margin-top:10px">

<b>
TECHNIKAI NAPLÓ
</b>

<pre id="log"></pre>

</div>

</section>


<section class="panel">

<div id="map"></div>

</section>

</main>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

'use strict';


/*
==========================================================
ATTILA KÖZLEKEDÉS
GYERMEKVASÚT JÁRMŰ FED TESZT
==========================================================

A régi:

https://emma.mav.hu/otp2-backend/otp/routers/default/index/graphql

cím átirányít a MÁVPlusz rendszerhez.

Ezért itt közvetlenül a MÁVPlusz hostot próbáljuk:

https://mavplusz.hu/otp2-backend/otp/routers/default/index/graphql

FONTOS:

Ha a böngésző CORS miatt ezt sem engedi,
az alkalmazás NINCS ADAT / HIBA állapotot jelez.

NEM gyártunk hamis járművet.
==========================================================
*/


const GRAPHQL_URL =
'https://mavplusz.hu/otp2-backend/otp/routers/default/index/graphql';



/* ========================================================
   GYERMEKVASÚT MEGÁLLÓK
======================================================== */

const GYV=[

 {
  name:'Hűvösvölgy',
  id:'005546847',
  code:'0055--46847',
  lat:47.541864,
  lon:18.966050
 },

 {
  name:'Hárs-hegy',
  id:'005546854',
  code:'0055--46854',
  lat:47.542750,
  lon:18.957100
 },

 {
  name:'Szépjuhászné',
  id:'005546862',
  code:'0055--46862',
  lat:47.541850,
  lon:18.949300
 },

 {
  name:'Jánoshegy',
  id:'005546870',
  code:'0055--46870',
  lat:47.538250,
  lon:18.952700
 },

 {
  name:'Virágvölgy',
  id:'005546888',
  code:'0055--46888',
  lat:47.527900,
  lon:18.961900
 },

 {
  name:'Csillebérc',
  id:'005546896',
  code:'0055--46896',
  lat:47.505900,
  lon:18.967500
 },

 {
  name:'Normafa',
  id:'005546904',
  code:'0055--46904',
  lat:47.504800,
  lon:18.966000
 },

 {
  name:'Széchenyi-hegy',
  id:'005546912',
  code:'0055--46912',
  lat:47.491700,
  lon:18.983900
 }

];



/* ========================================================
   GRAPHQL LEKÉRDEZÉS
======================================================== */

const query=`

{

 vehiclePositions(

   swLat:45.7,

   swLon:16.1,

   neLat:48.6,

   neLon:22.9,

   modes:[
     RAIL,
     RAIL_REPLACEMENT_BUS,
     SUBURBAN_RAILWAY,
     TRAMTRAIN
   ]

 ){

   vehicleId

   lat

   lon

   heading

   label

   lastUpdated

   speed

   trip{

     domesticResTrainNumber

     tripHeadsign

     routeShortName

   }

 }

}

`;



/* ========================================================
   ÁLLAPOT
======================================================== */

let map;

let markers=[];

let timer=null;

let lastRaw=null;



/* ========================================================
   SEGÉDFÜGGVÉNYEK
======================================================== */

function $(id){

 return document.getElementById(id);

}



function log(text){

 const t=
 new Date().toLocaleTimeString('hu-HU');

 $('log').textContent=
 '['+t+'] '+text+'\n'+
 $('log').textContent;

}



function clearLog(){

 $('log').textContent='';

}



function hav(a,b,c,d){

 const R=6371000;

 const p=Math.PI/180;

 const x=(c-a)*p;

 const y=(d-b)*p;

 const z=
 Math.sin(x/2)**2+
 Math.cos(a*p)*
 Math.cos(c*p)*
 Math.sin(y/2)**2;

 return 2*R*Math.asin(Math.sqrt(z));

}



function nearestStation(lat,lon){

 let best=null;

 for(const s of GYV){

  const distance=
  hav(
   lat,
   lon,
   s.lat,
   s.lon
  );

  if(
   !best ||
   distance<best.distance
  ){

   best={
    ...s,
    distance
   };

  }

 }

 return best;

}



/* ========================================================
   KÉSÉS
======================================================== */

function fmtDelay(value){

 if(
  value===null ||
  value===undefined ||
  value===''

 ){

  return 'NINCS ADAT';

 }

 const n=Number(value);

 if(!Number.isFinite(n)){

  return 'NINCS ADAT';

 }

 const sec=Math.round(n);

 const sign=
 sec>0 ? '+' :
 sec<0 ? '−' :
 '';

 const abs=Math.abs(sec);

 const m=Math.floor(abs/60);

 const s=
 String(abs%60)
 .padStart(2,'0');

 if(sec===0){

  return '0:00 MENETREND SZERINT';

 }

 if(sec>0){

  return sign+m+':'+s+
  ' KÉSÉS';

 }

 return sign+m+':'+s+
 ' SIETÉS';

}



/* ========================================================
   IDŐ
======================================================== */

function fmtTime(value){

 if(
  value===null ||
  value===undefined ||
  value===''

 ){

  return 'NINCS ADAT';

 }

 let d;

 if(Number(value)<100000000000){

  d=new Date(
   Number(value)*1000
  );

 }else{

  d=new Date(value);

 }

 if(Number.isNaN(d.getTime())){

  return String(value);

 }

 return d.toLocaleString('hu-HU');

}



/* ========================================================
   MARKEREK
======================================================== */

function clearMarkers(){

 markers.forEach(
  marker=>{
   map.removeLayer(marker);
  }
 );

 markers=[];

}



function drawStations(){

 const el=$('stations');

 el.innerHTML=
 GYV.map(

  s=>

  '<b>'+
  s.name+
  '</b> — GTFS: '+
  s.id+
  ' — kód: '+
  s.code

 ).join('<br>');


 GYV.forEach(

  s=>{

   const marker=
   L.circleMarker(

    [
     s.lat,
     s.lon
    ],

    {
     radius:5
    }

   )
   .addTo(map)

   .bindTooltip(

    s.name+
    '<br>GTFS: '+
    s.id

   );

   markers.push(marker);

  }

 );

}



/* ========================================================
   GYERMEKVASÚT FELISMERÉS
======================================================== */

function isLikelyGYV(v){

 if(
  v===null ||
  v===undefined ||
  v.lat===null ||
  v.lon===null
 ){

  return false;

 }

 const station=
 nearestStation(
  Number(v.lat),
  Number(v.lon)
 );

 if(!station){

  return false;

 }


 const text=[

  v.vehicleId,

  v.label,

  v.trip?.domesticResTrainNumber,

  v.trip?.tripHeadsign,

  v.trip?.routeShortName

 ]
 .filter(Boolean)
 .join(' ')
 .toLowerCase();


 const explicit=
 /gyermek|
   gyv|
   child|
   hűvösvölgy|
   hárs|
   szépjuhász|
   jánoshegy|
   virágvölgy|
   csillebérc|
   normafa|
   széchenyi-hegy/x.test(text);


 /*
   Ha a jármű közvetlenül a GYV nyomvonalán
   van, 2 km-es környezetben elfogadjuk.

   Ez továbbra is csak a MÁVPlusz által
   ténylegesen visszaadott rekord.
 */

 return explicit ||
        station.distance<=2000;

}



/* ========================================================
   JÁRMŰ MARKER
======================================================== */

function markerFor(v){

 const station=
 nearestStation(
  Number(v.lat),
  Number(v.lon)
 );

 const title=
 v.trip?.domesticResTrainNumber ||
 v.label ||
 v.vehicleId ||
 'GYV JÁRMŰ';


 const marker=
 L.marker(
  [
   v.lat,
   v.lon
  ]
 )
 .addTo(map);


 marker.bindPopup(

  '<b>🚂 '+
  title+
  '</b><br>'+

  'Jármű: '+
  (v.vehicleId || 'NINCS ADAT')+

  '<br>Legközelebbi GYV állomás: '+
  station.name+

  '<br>GTFS stop ID: '+
  station.id+

  '<br>Távolság: '+
  Math.round(station.distance)+
  ' m'

 );


 markers.push(marker);

}



/* ========================================================
   JÁRMŰ FED KÁRTYA
======================================================== */

function card(v){

 const station=
 nearestStation(
  Number(v.lat),
  Number(v.lon)
 );


 const id=
 v.vehicleId ||
 'NINCS ADAT';


 const train=
 v.trip?.domesticResTrainNumber ||
 'NINCS ADAT';


 const label=
 v.label ||
 'NINCS ADAT';


 /*
   Járműtípust nem találjuk ki.
 */

 const type=
 'NINCS ADAT';


 const speed=

 v.speed===null ||
 v.speed===undefined

 ? 'NINCS ADAT'

 : (
    Number(v.speed)*3.6
   ).toFixed(1)+
   ' km/h';


 const heading=

 v.heading===null ||
 v.heading===undefined

 ? 'NINCS ADAT'

 : Number(v.heading)
   .toFixed(1)+
   '°';


 return `

 <div class="card">

 <div class="big">
 🚂 GYERMEKVASÚT
 </div>


 <div class="row">
 <div class="k">
 Járműazonosító
 </div>
 <div class="v">
 ${id}
 </div>
 </div>


 <div class="row">
 <div class="k">
 Vonat/járatszám
 </div>
 <div class="v">
 ${train}
 </div>
 </div>


 <div class="row">
 <div class="k">
 Label
 </div>
 <div class="v">
 ${label}
 </div>
 </div>


 <div class="row">
 <div class="k">
 Járműtípus
 </div>
 <div class="v">
 ${type}
 </div>
 </div>


 <div class="row">
 <div class="k">
 GPS
 </div>
 <div class="v">
 ${Number(v.lat).toFixed(6)},
 ${Number(v.lon).toFixed(6)}
 </div>
 </div>


 <div class="row">
 <div class="k">
 Sebesség
 </div>
 <div class="v">
 ${speed}
 </div>
 </div>


 <div class="row">
 <div class="k">
 Irány
 </div>
 <div class="v">
 ${heading}
 </div>
 </div>


 <div class="row">
 <div class="k">
 Késés
 </div>
 <div class="v">
 ${fmtDelay(v.delay)}
 </div>
 </div>


 <div class="row">
 <div class="k">
 Legközelebbi GYV állomás
 </div>
 <div class="v">
 ${station.name}
 </div>
 </div>


 <div class="row">
 <div class="k">
 GTFS stop ID
 </div>
 <div class="v">
 ${station.id}
 </div>
 </div>


 <div class="row">
 <div class="k">
 Távolság
 </div>
 <div class="v">
 ${Math.round(station.distance)} m
 </div>
 </div>


 <div class="row">
 <div class="k">
 Forrás frissítés
 </div>
 <div class="v">
 ${fmtTime(v.lastUpdated)}
 </div>
 </div>


 </div>

 `;

}



/* ========================================================
   FŐ LEKÉRDEZÉS
======================================================== */

async function loadVehicles(){

 $('status').className='wait';

 $('status').textContent=
 '⏳ MÁVPlusz járműadat lekérése...';


 log(
  '▶ Közvetlen MÁVPlusz GraphQL lekérdezés indul.'
 );


 log(
  'URL: '+
  GRAPHQL_URL
 );


 try{

  const response=
  await fetch(

   GRAPHQL_URL,

   {
    method:'POST',

    headers:{
     'Content-Type':
     'application/json',

     'Accept':
     'application/json'
    },

    body:
    JSON.stringify(
     {
      query:query,
      variables:{}
     }
    )

   }

  );


  log(
   'HTTP '+
   response.status+
   ' '+
   response.statusText
  );


  const text=
  await response.text();


  if(!response.ok){

   throw new Error(
    'HTTP '+response.status
   );

  }


  let data;

  try{

   data=
   JSON.parse(text);

  }catch(e){

   throw new Error(
    'A válasz nem JSON.'
   );

  }


  lastRaw=data;


  if(data.errors?.length){

   log(
    'GraphQL hiba: '+
    JSON.stringify(
     data.errors
    )
   );

  }


  const all=
  data.data?.vehiclePositions ||
  [];


  const gyv=
  all
  .filter(isLikelyGYV)
  .map(

   v=>({
    ...v,
    delay:null
   })

  );


  clearMarkers();

  drawStations();


  /* ======================================================
     NINCS GYV
  ====================================================== */

  if(!gyv.length){

   $('fed').innerHTML=

   `

   <div class="card">

   <div class="big">
   🚂 GYERMEKVASÚT
   </div>

   <div class="bad">
   NINCS ADAT
   </div>

   <p>
   A MÁVPlusz válaszában most nem találtunk
   olyan valós járműpozíciót, amely a
   Gyermekvasút 2 km-es környezetébe esne
   vagy egyértelműen GYV-ként azonosítható.
   </p>

   <p>
   Visszakapott összes járműpozíció:
   <b>
   ${all.length}
   </b>
   </p>

   </div>

   `;


   $('status').className='bad';

   $('status').textContent=
   '❌ GYV JÁRMŰ: NINCS ADAT';


   log(
    'Nem találtunk GYV pozíciót. '+
    'Összes MÁVPlusz vehiclePositions: '+
    all.length
   );


   return;

  }



  /* ======================================================
     GYV TALÁLAT
  ====================================================== */

  $('fed').innerHTML=
  gyv.map(card).join('');


  gyv.forEach(markerFor);


  if(gyv[0]){

   map.setView(
    [
     gyv[0].lat,
     gyv[0].lon
    ],
    14
   );

  }


  $('status').className='ok';

  $('status').textContent=
  '🟢 GYV JÁRMŰADAT ÉRKEZETT: '+
  gyv.length+
  ' db';


  log(
   '✓ Valós GYV-jelölt rekord: '+
   gyv.length
  );


 }catch(error){

  clearMarkers();

  drawStations();


  $('fed').innerHTML=

  `

  <div class="card">

  <div class="big">
  🚂 GYERMEKVASÚT
  </div>

  <div class="bad">
  ADATLEKÉRÉSI HIBA
  </div>

  <p>
  ${String(
   error.message || error
  )}
  </p>

  <p>
  <b>
  Nem állítunk elő helyette
  kitalált járművet.
  </b>
  </p>

  </div>

  `;


  $('status').className='bad';

  $('status').textContent=
  '❌ MÁVPlusz lekérés sikertelen';


  log(
   '❌ '+
   String(
    error.message || error
   )
  );

 }

}



/* ========================================================
   AUTO
======================================================== */

function startAuto(){

 stopAuto();

 loadVehicles();

 timer=
 setInterval(
  loadVehicles,
  15000
 );

 log(
  'AUTO FRISSÍTÉS: 15 mp'
 );

}



function stopAuto(){

 if(timer){

  clearInterval(timer);

  timer=null;

  log(
   'AUTO leállítva.'
  );

 }

}



/* ========================================================
   MAP
======================================================== */

map=
L.map('map')
 .setView(
  [
   47.525,
   18.965
  ],
  13
 );


L.tileLayer(

 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

 {
  maxZoom:19,

  attribution:
  '© OpenStreetMap'
 }

).addTo(map);



/* ========================================================
   INDÍTÁS
======================================================== */

drawStations();


log(
 'GYERMEKVASÚT FED TESZT indul.'
);


log(
 '8 ismert GYV GTFS megálló betöltve.'
);


log(
 'Elsődleges adatforrás: közvetlen MÁVPlusz GraphQL.'
);


log(
 'Régi emma.mav.hu URL NINCS használva.'
);


loadVehicles();

</script>

</body>
</html>
