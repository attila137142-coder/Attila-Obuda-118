<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTFS LIGHT DB EXPORTER</title>
  <style>
    body { font-family: Arial, sans-serif; background:#0f172a; color:#e2e8f0; margin:0; padding:0; }
    header { padding:16px; background:#111827; font-size:18px; font-weight:bold; }
    .container { padding:16px; }
    .row { display:flex; gap:12px; flex-wrap:wrap; }
    .card { background:#1f2937; padding:12px; border-radius:12px; flex:1; min-width:280px; }
    button { padding:10px 12px; border:none; border-radius:10px; cursor:pointer; background:#22c55e; color:black; font-weight:bold; }
    button.secondary { background:#38bdf8; }
    button.danger { background:#ef4444; color:white; }
    pre { background:#0b1220; padding:10px; border-radius:10px; overflow:auto; max-height:300px; }
    input { width:100%; padding:10px; border-radius:8px; border:none; margin-top:6px; }
    .small { font-size:12px; opacity:0.8; }
    .stopCard { padding:6px; margin-top:6px; background:#0b1220; border-radius:8px; }
  </style>
</head>
<body>

<header>🚆 GTFS → LIGHT DB EXPORTER (V2 PRECISION + SCHEDULE FIX)</header>

<div class="container">

  <div class="row">

    <div class="card">
      <h3>📦 GTFS Loader (FIXED)</h3>
      <input type="file" id="gtfsFile" />
      <p class="small">Valódi GTFS import helye (CSV / ZIP később)</p>
      <button onclick="loadGTFS()">Betöltés</button>
    </div>

    <div class="card">
      <h3>⚙️ Export Engine</h3>
      <button class="secondary" onclick="exportLightDB()">EXPORT → LIGHT DB</button>
      <button class="danger" onclick="clearDB()">RESET DB</button>
      <p class="small">Stop + járat + indulási index</p>
    </div>

    <div class="card">
      <h3>🔎 Megálló kereső (FIXED)</h3>
      <input id="search" placeholder="Név vagy GTFS ID" oninput="searchStop()" />
      <div id="searchResult"></div>
    </div>

  </div>

  <div class="card" style="margin-top:12px;">
    <h3>🧠 LIGHT DB OUTPUT</h3>
    <pre id="dbOut">Üres...</pre>
  </div>

</div>

<script>

let LIGHT_DB = {
  stops: [],
  trips: [],
  departures: []
};

function loadGTFS() {
  const file = document.getElementById('gtfsFile').files[0];
  if (!file) return alert("Nincs fájl kiválasztva");

  // FIXED DEMO DATA (GTFS-hez közelebb)
  LIGHT_DB.stops = [
    { id:"F00456", name:"Nád utca", lat:47.500123, lon:19.040456 },
    { id:"S00123", name:"Szentendre Skanzen", lat:47.685912, lon:19.083214 },
    { id:"T00999", name:"Tahitótfalu Hídfő", lat:47.751234, lon:19.095678 }
  ];

  LIGHT_DB.trips = [
    { id:"H5-001", route:"H5" },
    { id:"H5-002", route:"H5" }
  ];

  // FIXED: STOP ↔ TRIP ↔ TIME kapcsolat
  LIGHT_DB.departures = [
    { stop:"F00456", time:"08:15", trip:"H5-001", vehicle:"HÉV" },
    { stop:"F00456", time:"08:45", trip:"H5-002", vehicle:"HÉV" },
    { stop:"S00123", time:"09:10", trip:"H5-001", vehicle:"HÉV" }
  ];

  updateDB();
}

function exportLightDB() {
  const blob = new Blob([JSON.stringify(LIGHT_DB, null, 2)], {type:"application/json"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "light_gtfs_db.json";
  a.click();
}

function clearDB() {
  LIGHT_DB = { stops:[], trips:[], departures:[] };
  updateDB();
  document.getElementById("searchResult").innerHTML = "";
}

function updateDB() {
  document.getElementById("dbOut").textContent = JSON.stringify(LIGHT_DB, null, 2);
}

// FIXED SEARCH (GTFS ID + name + partial match)
function searchStop() {
  const q = document.getElementById("search").value.toLowerCase();

  const res = LIGHT_DB.stops.filter(s =>
    s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q)
  );

  document.getElementById("searchResult").innerHTML = res.map(r => {

    const deps = LIGHT_DB.departures.filter(d => d.stop === r.id);

    return `
      <div class="stopCard">
        🚏 <b>${r.name}</b> (${r.id})<br>
        📍 ${r.lat.toFixed(6)}, ${r.lon.toFixed(6)}<br>
        <small>Indulások:</small><br>
        ${deps.map(d => `🕒 ${d.time} - ${d.trip} (${d.vehicle})`).join("<br>")}
      </div>
    `;
  }).join("");
}

updateDB();

</script>

</body>
</html>
