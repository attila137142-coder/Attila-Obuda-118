<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>V9 GTFS IMPORT ENGINE</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body {
  font-family: Arial;
  background:#0f172a;
  color:white;
  padding:20px;
}

button {
  padding:10px;
  margin:5px;
  cursor:pointer;
}

.panel {
  background:#1e293b;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  max-height:300px;
  overflow:auto;
  font-size:12px;
}
</style>
</head>

<body>

<h2>🚍 V9 – REAL GTFS IMPORT (BKK ZIP)</h2>

<input type="file" id="zipFile" accept=".zip">
<button onclick="loadGTFS()">GTFS betöltés</button>

<div class="panel" id="status">Várakozás GTFS ZIP-re...</div>

<div class="panel" id="output"></div>

<script>
let GTFS = {
  stops: [],
  routes: [],
  trips: [],
  stop_times: []
};

function log(msg){
  document.getElementById("status").innerText = msg;
}

function parseCSV(text){
  const lines = text.split("\n").filter(l => l.trim().length>0);
  const headers = lines[0].split(",");

  return lines.slice(1).map(line => {
    const values = line.split(",");
    let obj = {};
    headers.forEach((h,i)=> obj[h.trim()] = values[i]);
    return obj;
  });
}

async function loadGTFS(){
  const file = document.getElementById("zipFile").files[0];
  if(!file){
    log("❌ Nincs ZIP kiválasztva!");
    return;
  }

  log("📦 ZIP betöltése...");

  const zip = await JSZip.loadAsync(file);

  // STOPS
  if(zip.file("stops.txt")){
    const stopsText = await zip.file("stops.txt").async("string");
    GTFS.stops = parseCSV(stopsText);
  }

  // ROUTES
  if(zip.file("routes.txt")){
    const routesText = await zip.file("routes.txt").async("string");
    GTFS.routes = parseCSV(routesText);
  }

  // TRIPS
  if(zip.file("trips.txt")){
    const tripsText = await zip.file("trips.txt").async("string");
    GTFS.trips = parseCSV(tripsText);
  }

  // STOP TIMES
  if(zip.file("stop_times.txt")){
    const stText = await zip.file("stop_times.txt").async("string");
    GTFS.stop_times = parseCSV(stText);
  }

  log("✅ GTFS betöltve!");

  renderPreview();
}

function renderPreview(){
  let out = "";

  out += `<b>🚏 Megállók:</b> ${GTFS.stops.length}<br>`;
  out += `<b>🚌 Járatok (routes):</b> ${GTFS.routes.length}<br>`;
  out += `<b>🚍 Trips:</b> ${GTFS.trips.length}<br>`;
  out += `<b>⏱ Stop times:</b> ${GTFS.stop_times.length}<br><br>`;

  out += "<b>Első 5 megálló:</b><br>";
  GTFS.stops.slice(0,5).forEach(s=>{
    out += `• ${s.stop_name} (${s.stop_id})<br>`;
  });

  out += "<br><b>Első 5 route:</b><br>";
  GTFS.routes.slice(0,5).forEach(r=>{
    out += `• ${r.route_short_name || ""} ${r.route_long_name || ""}<br>`;
  });

  document.getElementById("output").innerHTML = out;
}
</script>

</body>
</html>
