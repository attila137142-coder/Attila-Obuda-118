<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Attila Dispatcher UI V1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { margin:0; font-family:Arial; }
.page { display:none; height:calc(100vh - 60px); overflow:auto; }
#map { height:100%; }

/* bottom nav */
#nav {
  position:fixed;
  bottom:0;
  width:100%;
  height:60px;
  background:#111;
  display:flex;
}
#nav button {
  flex:1;
  border:none;
  background:#111;
  color:white;
  font-size:18px;
}

/* list */
.stop {
  padding:10px;
  border-bottom:1px solid #ddd;
}
</style>
</head>

<body>

<!-- ===== PAGES ===== -->

<div id="home" class="page">
  <h2>🚆 Attila Dispatcher</h2>
  <p>✔ Unified rendszer</p>
  <p>✔ Live dispatch ready</p>
</div>

<div id="mapPage" class="page">
  <div id="map"></div>
</div>

<div id="stopsPage" class="page">
  <input id="search" placeholder="Keresés..." style="width:100%;padding:10px;">
  <div id="list"></div>
</div>

<div id="livePage" class="page">
  <h3>🚍 LIVE DISPATCH</h3>
  <p>Járművek mozognak a térképen</p>
</div>

<!-- ===== NAV ===== -->

<div id="nav">
  <button onclick="show('home')">🏠</button>
  <button onclick="show('mapPage')">🗺</button>
  <button onclick="show('stopsPage')">🚏</button>
  <button onclick="show('livePage')">🚍</button>
</div>

<script>

// ===== PAGE SWITCH =====
function show(id){
  document.querySelectorAll('.page').forEach(p=>p.style.display='none');
  document.getElementById(id).style.display='block';

  if(id === "mapPage"){
    setTimeout(()=>map.invalidateSize(),200);
  }
}

// ===== MAP =====
const map = L.map('map').setView([47.5,19.05],11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// ===== STOPS =====
const STOPS = [
  {name:"Nád utca", id:"F00457", lat:47.594072, lon:19.048469},
  {name:"Szentendre", id:"F04687", lat:47.661056, lon:19.075675},
  {name:"Tahitótfalu hídfő", id:"779053-1", lat:47.751712, lon:19.078215}
];

// ===== RENDER STOPS =====
function renderStops(list){

  const container = document.getElementById("list");
  container.innerHTML = "";

  list.forEach(s=>{
    const div = document.createElement("div");
    div.className="stop";
    div.innerHTML = `<b>${s.name}</b><br>${s.id}`;

    div.onclick = ()=>{
      show('mapPage');
      map.setView([s.lat,s.lon],14);

      L.marker([s.lat,s.lon]).addTo(map)
        .bindPopup(`<b>${s.name}</b><br>${s.id}`)
        .openPopup();
    };

    container.appendChild(div);
  });
}

renderStops(STOPS);

// ===== SEARCH =====
document.getElementById("search").oninput = e=>{
  const q = e.target.value.toLowerCase();

  const filtered = STOPS.filter(s =>
    s.name.toLowerCase().includes(q) ||
    s.id.toLowerCase().includes(q)
  );

  renderStops(filtered);
};

// ===== LIVE VEHICLES (SIM) =====
let vehicles = [];

function initVehicles(){
  vehicles = STOPS.map(s=>({
    lat:s.lat,
    lon:s.lon,
    speed:20+Math.random()*30
  }));
}

function moveVehicles(){

  vehicles.forEach(v=>{

    v.lat += (Math.random()-0.5)*0.002;
    v.lon += (Math.random()-0.5)*0.002;

    L.circleMarker([v.lat,v.lon],{
      radius:6,
      color:"red"
    }).addTo(map);
  });
}

setInterval(()=>{
  map.eachLayer(l=>{
    if(l instanceof L.CircleMarker) map.removeLayer(l);
  });

  moveVehicles();

},2000);

initVehicles();

// ===== INIT =====
show('home');

</script>

</body>
</html>
