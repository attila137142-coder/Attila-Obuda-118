<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>GTFS CORE ENGINE V1</title>
</head>

<body>
<input type="file" id="file" accept=".zip">
<pre id="out">GTFS CORE ENGINE READY</pre>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>

/* =========================
   🧠 CORE STORAGE
========================= */

let GTFS = {
  stops: [],
  trips: [],
  stop_times: []
};

let INDEX = {}; // stop_id → departures

/* =========================
   📦 CSV PARSER
========================= */

function parseCSV(text){

  const lines = text.trim().split("\n");
  const headers = lines[0].split(",");

  return lines.slice(1).map(line=>{
    const obj = {};
    const cols = line.split(",");

    headers.forEach((h,i)=>{
      obj[h] = cols[i];
    });

    return obj;
  });
}

/* =========================
   🧠 INDEX BUILDER (CORE LOGIC)
========================= */

function buildIndex(){

  INDEX = {};

  GTFS.stop_times.forEach(st=>{

    if(!INDEX[st.stop_id]) INDEX[st.stop_id] = [];

    INDEX[st.stop_id].push({
      trip: st.trip_id,
      time: st.departure_time
    });
  });

  console.log("INDEX READY", INDEX);
}

/* =========================
   ⏱ TIME ENGINE
========================= */

function toSec(t){

  if(!t) return 0;

  const p = t.split(":");
  return (+p[0])*3600 + (+p[1])*60 + (+p[2]||0);
}

function nowSec(){

  const d = new Date();
  return d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds();
}

/* =========================
   🚏 CORE API (THIS IS THE POINT)
========================= */

function getDepartures(stop_id){

  const list = INDEX[stop_id] || [];
  const now = nowSec();

  return list.map(d=>({

    trip: d.trip,
    time: d.time,
    diff: toSec(d.time) - now

  })).sort((a,b)=>a.diff-b.diff);
}

/* =========================
   📦 GTFS LOADER (ZIP)
========================= */

document.getElementById("file").addEventListener("change", async e=>{

  const zip = await JSZip.loadAsync(e.target.files[0]);

  const stops = await zip.file("stops.txt").async("string");
  const trips = await zip.file("trips.txt").async("string");
  const stop_times = await zip.file("stop_times.txt").async("string");

  GTFS.stops = parseCSV(stops);
  GTFS.trips = parseCSV(trips);
  GTFS.stop_times = parseCSV(stop_times);

  buildIndex();

  document.getElementById("out").innerText =
    "GTFS LOADED\nSTOPS: "+GTFS.stops.length+
    "\nTRIPS: "+GTFS.trips.length+
    "\nSTOP_TIMES: "+GTFS.stop_times.length;

  /* DEMO CALL (NO UI YET) */
  console.log(getDepartures(GTFS.stop_times[0].stop_id));

});

</script>
</body>
</html>
