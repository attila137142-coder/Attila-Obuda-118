<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V5 – TURISTA ENGINE (B VERZIÓ)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0b0f14;
    color:white;
}

header {
    padding:10px;
    background:#111827;
    font-weight:bold;
}

#map {
    height:90vh;
}

.panel {
    position:absolute;
    top:60px;
    left:10px;
    z-index:999;
    background:#111827;
    padding:10px;
    border-radius:8px;
    width:280px;
}

button {
    width:100%;
    padding:8px;
    margin-top:5px;
    cursor:pointer;
}

.status {
    margin-top:8px;
    font-size:12px;
    color:#93c5fd;
}
</style>
</head>

<body>

<header>🧭 FUTÁR V5 – TURISTA ENGINE B (OSM ROUTE FILTER)</header>

<div class="panel">
<b>Control Panel</b>
<button onclick="loadRoutes()">🚶‍♂️ Turista háló betöltése</button>
<div class="status" id="status">Idle</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ---------------- MAP ----------------
const map = L.map('map').setView([47.52, 19.03], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: "OSM"
}).addTo(map);

// ---------------- COLOR ----------------
function colorByNetwork(tags) {
    if (tags["route"] === "hiking") return "green";
    if (tags["network"] === "lwn") return "yellow";
    if (tags["network"] === "rwn") return "orange";
    return "red";
}

// ---------------- LOAD ----------------
async function loadRoutes() {

    document.getElementById("status").innerText = "Loading hiking routes...";

    const query = `
    [out:json];
    (
      relation["route"="hiking"](47.45,18.90,47.60,19.20);
      way["osmc:symbol"](47.45,18.90,47.60,19.20);
    );
    out geom tags;
    `;

    const url = "https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query);

    const res = await fetch(url);
    const data = await res.json();

    document.getElementById("status").innerText = "Rendering routes...";

    data.elements.forEach(el => {

        if (!el.geometry) return;

        const latlngs = el.geometry.map(p => [p.lat, p.lon]);

        const color = colorByNetwork(el.tags || {});

        L.polyline(latlngs, {
            color: color,
            weight: 4
        }).addTo(map)
        .bindPopup(
            "🚶‍♂️ Turistaút<br>" +
            "Route: " + (el.tags?.route || "unknown") + "<br>" +
            "Network: " + (el.tags?.network || "n/a")
        );
    });

    document.getElementById("status").innerText = "READY ✔️ (Turista háló betöltve)";
}

</script>

</body>
</html>
