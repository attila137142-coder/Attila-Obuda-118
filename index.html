<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V5 Real Layout</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#05070d;
  color:#00ffcc;
}

/* HEADER */
header{
  padding:15px;
  text-align:center;
  background:#0b1220;
  border-bottom:2px solid #00ffcc;
  font-weight:bold;
  font-size:18px;
}

/* STATUS BAR */
.status-bar{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
}

.status-item{
  padding:6px 12px;
  border-radius:6px;
  font-size:12px;
  font-weight:bold;
}

.green{background:#00ffcc;color:#000;}
.yellow{background:orange;color:#000;}
.red{background:red;color:#fff;}

/* 3 OSZLOP */
.container{
  display:grid;
  grid-template-columns: 1fr 2fr 1fr;
  gap:10px;
  padding:10px;
}

/* PANELS */
.panel{
  background:#0b1220;
  border:1px solid #00ffcc;
  border-radius:6px;
  padding:10px;
  min-height:400px;
}

/* INPUT */
input{
  width:100%;
  padding:10px;
  background:#05070d;
  border:1px solid #00ffcc;
  color:#00ffcc;
  margin-bottom:10px;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
}

td,th{
  border-bottom:1px solid #00ffcc33;
  padding:6px;
  font-size:12px;
  text-align:left;
}

/* BADGES */
.badge{
  padding:2px 6px;
  border:1px solid #00ffcc;
  font-size:11px;
}

.siet{background:red;color:white;}
.keses{background:deepskyblue;color:white;}
.ok{background:green;color:white;}
</style>
</head>

<body>

<header>🚇 FUTÁR V5 REAL LAYOUT</header>

<!-- STATUS -->
<div class="status-bar">
  <div class="status-item green">All systems OK</div>
  <div class="status-item yellow">Delays: 2 routes</div>
  <div class="status-item red">Alerts: 0</div>
</div>

<!-- MAIN 3 OSZLOP -->
<div class="container">

  <!-- BAL -->
  <div class="panel">
    <h3>🚏 Megálló kereső</h3>
    <input placeholder="Írd be a megállót...">

    <button style="width:100%;padding:10px;background:#00ffcc;border:none;font-weight:bold;">
      Keresés
    </button>
  </div>

  <!-- KÖZÉP -->
  <div class="panel">
    <h3>🚍 Indulások</h3>

    <table>
      <tr><th>Járat</th><th>Irány</th><th>Állapot</th></tr>

      <tr>
        <td>16</td>
        <td>Deák tér</td>
        <td><span class="badge ok">ON TIME</span></td>
      </tr>

      <tr>
        <td>105</td>
        <td>Hősök tere</td>
        <td><span class="badge keses">+3 min</span></td>
      </tr>

      <tr>
        <td>7</td>
        <td>Albertfalva</td>
        <td><span class="badge siet">DELAY</span></td>
      </tr>

    </table>
  </div>

  <!-- JOBB -->
  <div class="panel">
    <h3>📡 Rendszer státusz</h3>

    <p>🟢 Járművek: 124</p>
    <p>🟡 Késések: 2</p>
    <p>🔴 Hibák: 0</p>

    <hr style="border-color:#00ffcc33;">

    <p>📍 GTFS: ACTIVE</p>
    <p>🛰️ Tracking: LIVE</p>
  </div>

</div>

</body>
</html>
