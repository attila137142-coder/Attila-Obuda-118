<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FUTÁR V12 FIXED GTFS ENGINE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
    margin:0;
    background:#060a10;
    color:#d7e1ea;
    font-family:Arial;
}

.header{
    display:flex;
    justify-content:space-between;
    padding:10px 14px;
    background:#0d1420;
    border-bottom:2px solid #1e2a3a;
}

.title{color:#7fb3ff;font-weight:bold;}
.clock{color:#00ff88;font-size:26px;}

.grid{
    display:grid;
    grid-template-columns:1.4fr 1fr 1fr;
    gap:10px;
    padding:10px;
}

.panel{
    background:#0e1622;
    border:1px solid #243447;
    border-radius:8px;
    padding:10px;
    overflow:auto;
}

h2{
    font-size:12px;
    margin:0 0 8px 0;
    color:#7fb3ff;
}

#map{height:520px;border-radius:8px;}

table{
    width:100%;
    font-size:12px;
    border-collapse:collapse;
}

td,th{
    border-bottom:1px solid #243447;
    padding:4px;
}

.ok{color:#00ff88;}
.warn{color:#ffcc00;}

input,button{
    width:100%;
    padding:7px;
    margin-top:6px;
    border-radius:6px;
    border:none;
}

button{background:#00aaff;color:white;cursor:pointer;}

.small{font-size:11px;color:#9bb3c7;}

.log{
    font-size:11px;
    height:180px;
    overflow:auto;
    color:#9bb3c7;
}
</style>
</head>

<body>

<div class="header">
<div class="title">🚍 FUTÁR V12 FIXED – GTFS ENGINE CORE</div>
<div class="clock" id="clock">--:--:--</div>
</div>

<div class="grid">

<!-- CORE -->
<div class="panel">
<h2>🧠 GTFS CORE STATUS</h2>
<div class="small" id="status">No GTFS loaded</div>
<div class="small">
Routes: <span id="rc">0</span><br>
Trips: <span id="tc">0</span><br>
Stops: <span id="sc">0</span>
</div>
</div>

<!-- LOAD -->
<div class="panel">
<h2>📦 GTFS LOADER</h2>
<input type="file" id="zip"/>
</div>

<!-- TRIP SEARCH -->
<div class="panel">
<h2>🚍 ROUTE → TRIPS</h2>
<input id="rq" placeholder="route_id / szám"/>
<button onclick="routeTrips()">SEARCH</button>
<div id="routeOut" class="small"></div>
</div>

<!-- MAP -->
<div class="panel" style="grid-column:span 2;">
<h2>🗺️ LIVE TRIP MAP</h2>
<div id="map"></div>
</div>

<!-- DISPATCH -->
<div class="panel">
<h2>📊 DISPATCH BOARD</h2>
<table>
<thead>
<tr><th>Trip</th><th>Route</th><th>Status</th></tr>
</thead>
<tbody id="board"></tbody>
</table>
</div>

<!-- STOP SEARCH -->
<div class="panel">
<h2>🚏 STOP SEARCH</h2>
<input id="sq"/>
<button onclick="stopSearch()">SEARCH</button>
<div id="stopOut" class="small"></div>
</div>

<!-- LOG -->
<div class="panel">
<h2>📡 EVENT LOG</h2>
<div class="log" id="log"></div>
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>

// CLOCK
setInterval(()=>document.getElementById("clock").innerText=new Date().toLocaleTimeString(),1000);

// MAP
const map=L.map("map").setView([47.4979,19.0402],12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
let layer=L.layerGroup().addTo(map);

// ---------------- GTFS ENGINE ----------------
let GTFS={
    stops:[],
    routes:[],
    trips:[],
    stopTimes:[],
    stopMap:new Map(),
    routeMap:new Map(),
    tripMap:new Map()
};

// LOG
function log(m){
    document.getElementById("log").innerHTML=
    `[${new Date().toLocaleTimeString()}] ${m}<br>`+
    document.getElementById("log").innerHTML;
}

// LOAD ZIP
document.getElementById("zip").addEventListener("change",async(e)=>{
    const zip=await JSZip.loadAsync(e.target.files[0]);

    GTFS.stops=await csv(zip,"stops.txt");
    GTFS.routes=await csv(zip,"routes.txt");
    GTFS.trips=await csv(zip,"trips.txt");
    GTFS.stopTimes=await csv(zip,"stop_times.txt");

    // INDEXING
    GTFS.stops.forEach(s=>GTFS.stopMap.set(s.stop_id,s));
    GTFS.routes.forEach(r=>GTFS.routeMap.set(r.route_id,r));

    GTFS.trips.forEach(t=>{
        if(!GTFS.tripMap.has(t.trip_id)) GTFS.tripMap.set(t.trip_id,t);
    });

    updateStats();
    buildBoard();
    drawStops();

    log("GTFS fully loaded (FIXED ENGINE)");
});

// CSV
async function csv(zip,file){
    const f=zip.file(file);
    if(!f) return [];

    const t=await f.async("string");
    const lines=t.split("\n").filter(Boolean);
    const h=lines[0].split(",");

    return lines.slice(1).map(l=>{
        const v=l.split(",");
        let o={};
        h.forEach((hh,i)=>o[hh]=v[i]);
        return o;
    });
}

// STATS
function updateStats(){
    document.getElementById("rc").innerText=GTFS.routes.length;
    document.getElementById("tc").innerText=GTFS.trips.length;
    document.getElementById("sc").innerText=GTFS.stops.length;

    document.getElementById("status").innerText="READY (FULL GTFS ENGINE)";
}

// DRAW STOPS
function drawStops(){
    layer.clearLayers();

    GTFS.stops.forEach(s=>{
        if(!s.stop_lat) return;

        L.circleMarker([s.stop_lat,s.stop_lon],{
            radius:3,
            color:"#00aaff"
        }).addTo(layer);
    });

    log("Stops rendered");
}

// ---------------- ROUTE → TRIPS (FIXED LOGIC) ----------------
function routeTrips(){
    const q=document.getElementById("rq").value;

    const trips=GTFS.trips.filter(t=>t.route_id===q);

    let out="";

    trips.slice(0,15).forEach(t=>{
        out+=`🚍 Trip: ${t.trip_id} | ${t.trip_headsign||""}<br>`;
    });

    document.getElementById("routeOut").innerHTML=out||"no trips";

    log("Trip search for route "+q);
}

// ---------------- STOP SEARCH ----------------
function stopSearch(){
    const q=document.getElementById("sq").value.toLowerCase();

    const res=GTFS.stops
    .filter(s=>(s.stop_name||"").toLowerCase().includes(q))
    .slice(0,12)
    .map(s=>"🚏 "+s.stop_name)
    .join("<br>");

    document.getElementById("stopOut").innerHTML=res||"no match";

    log("Stop search: "+q);
}

// ---------------- DISPATCH BOARD (REAL GTFS TRIPS) ----------------
function buildBoard(){
    const el=document.getElementById("board");
    el.innerHTML="";

    GTFS.trips.slice(0,15).forEach((t,i)=>{

        const route=GTFS.routeMap.get(t.route_id);

        const row=document.createElement("tr");

        row.innerHTML=`
        <td>${t.trip_id}</td>
        <td>${route?.route_short_name || t.route_id}</td>
        <td class="ok">ACTIVE</td>
        `;

        el.appendChild(row);
    });
}

// LIVE SIM
setInterval(()=>{
    document.querySelectorAll("#board td:last-child").forEach(td=>{
        const s=["ACTIVE","DELAY +1","DELAY +2","EARLY -1"];
        td.innerText=s[Math.floor(Math.random()*s.length)];
    });
},2500);

</script>

</body>
</html>
