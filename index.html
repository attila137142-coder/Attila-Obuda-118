<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<title>V5 GTFS Normalizer (VOLÁN + BKK)</title>

<style>
body {
  font-family: Arial, sans-serif;
  background:#0f172a;
  color:#e2e8f0;
  margin:0;
  padding:20px;
}

h1 {
  color:#38bdf8;
}

.container {
  max-width:900px;
  margin:auto;
}

input {
  width:100%;
  padding:12px;
  font-size:16px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}

button {
  margin-top:10px;
  padding:10px 15px;
  background:#22c55e;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.card {
  margin-top:20px;
  background:#1e293b;
  padding:15px;
  border-radius:10px;
}

.badge {
  display:inline-block;
  padding:4px 8px;
  border-radius:6px;
  background:#334155;
  margin-right:5px;
  font-size:12px;
}

.volan { background:#f59e0b; color:black; }
.bkk { background:#38bdf8; color:black; }

pre {
  background:#0b1220;
  padding:10px;
  border-radius:8px;
  overflow:auto;
}
</style>
</head>

<body>

<div class="container">

<h1>🚍 V5 GTFS Normalizer (VOLÁN + BKK)</h1>

<p>Írj be egy stop ID-t (pl: <b>773012_4</b> vagy <b>049892</b>)</p>

<input id="stopInput" placeholder="Stop ID..." />
<button onclick="normalize()">Normalizálás</button>

<div id="output" class="card" style="display:none;"></div>

</div>

<script>

function parseStopId(id) {
  if (id.includes("_")) {
    const parts = id.split("_");
    return {
      base: parts[0],
      variant: parts[1],
      network: "VOLAN"
    };
  } else {
    return {
      base: id,
      variant: null,
      network: "BKK"
    };
  }
}

function normalize() {
  const id = document.getElementById("stopInput").value.trim();
  if (!id) return;

  const parsed = parseStopId(id);

  const normalized = {
    stop_id_raw: id,
    stop_id_base: parsed.base,
    sub_id: parsed.variant,
    network: parsed.network,
    normalized_id: parsed.network + "_" + parsed.base + (parsed.variant ? "_" + parsed.variant : ""),
    dispatcher_key: parsed.variant ? parsed.base + "|" + parsed.variant : parsed.base,
    type: parsed.variant ? "platform_variant" : "single_stop"
  };

  let html = `
    <h2>🧠 Normalizált GTFS adat</h2>

    <div>
      <span class="badge ${parsed.network === 'VOLAN' ? 'volan' : 'bkk'}">
        ${parsed.network}
      </span>
      <span class="badge">TYPE: ${normalized.type}</span>
    </div>

    <div class="card">
      <b>Raw ID:</b> ${normalized.stop_id_raw}<br>
      <b>Base ID:</b> ${normalized.stop_id_base}<br>
      <b>Sub ID:</b> ${normalized.sub_id || "-"}<br>
      <b>Normalized ID:</b> ${normalized.normalized_id}<br>
      <b>Dispatcher Key:</b> ${normalized.dispatcher_key}
    </div>

    <h3>📦 JSON output</h3>
    <pre>${JSON.stringify(normalized, null, 2)}</pre>
  `;

  const out = document.getElementById("output");
  out.innerHTML = html;
  out.style.display = "block";
}

</script>

</body>
</html>
