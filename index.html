<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attila V3.2 DISPATCH TABLE</title>
<style>
body { font-family: Arial; background:#0f172a; color:#fff; padding:20px }
input, button { padding:10px; margin:5px; border-radius:8px; border:none }
button { background:#22c55e; color:#fff; font-weight:bold; cursor:pointer }
table { width:100%; border-collapse:collapse; margin-top:15px }
th,td { border:1px solid #334155; padding:6px; text-align:center }
</style>
</head>
<body>

<h1>🚌 V3.2 DISPATCH TABLE (FIXED)</h1>

<p>Add meg így (név, méter):</p>
<textarea id="input" style="width:100%;height:120px">
Nád utca,0
Köztes 1,1200
Köztes 2,2800
Köztes 3,4300
Csobánka tér,6000
</textarea>
<br>
<button onclick="calc()">SZÁMOLÁS</button>

<div id="out"></div>

<script>
function calc(){
  let rawLines=document.getElementById('input').value.split('
');

  let stops=[];

  rawLines.forEach((line,i)=>{
    if(!line.trim()) return;

    let parts=line.split(',');
    if(parts.length<2) return;

    let name=parts[0].trim();
    let distStr=parts[1].trim().replace(',', '.'); // biztos ami biztos
    let dist=parseFloat(distStr);

    if(!isNaN(dist)){
      stops.push({
        id:'MH'+(1000+i),
        name:name,
        dist:dist
      });
    }
  });

  if(stops.length<2){
    document.getElementById('out').innerHTML='❌ Legalább 2 érvényes sor kell (név, szám)!';
    return;
  }

  // rendezés távolság szerint (biztos legyen jó sorrend)
  stops.sort((a,b)=>a.dist-b.dist);

  let total=stops[stops.length-1].dist;
  let avgDist=total/(stops.length-1);

  let html='<table>';
  html+='<tr><th>MH kód</th><th>Megálló neve</th><th>Össz táv (m)</th><th>Köv. MH</th><th>Hátravan (m)</th><th>% megtett</th><th>% hátravan</th><th>MH átlag (m)</th></tr>';

  stops.forEach((s,i)=>{
    let next=stops[i+1]?stops[i+1].name:'-';
    let remain=total - s.dist;
    let donePerc = total>0 ? (s.dist/total)*100 : 0;
    let remainPerc = 100 - donePerc;

    html+=`<tr>
      <td>${s.id}</td>
      <td>${s.name}</td>
      <td>${s.dist.toFixed(0)}</td>
      <td>${next}</td>
      <td>${remain.toFixed(0)}</td>
      <td>${donePerc.toFixed(1)}%</td>
      <td>${remainPerc.toFixed(1)}%</td>
      <td>${avgDist.toFixed(0)}</td>
    </tr>`;
  });

  html+='</table>';

  document.getElementById('out').innerHTML=html;
}

  let total=stops[stops.length-1].dist;
  let avgDist=total/(stops.length-1);

  let html='<table>';
  html+='<tr><th>MH kód</th><th>Megálló neve</th><th>Össz táv (m)</th><th>Köv. MH</th><th>Hátravan (m)</th><th>% megtett</th><th>% hátravan</th><th>MH átlag (m)</th></tr>';

  for(let i=0;i<stops.length;i++){
    let s=stops[i];
    let next=stops[i+1]?stops[i+1].name:'-';
    let remain=total - s.dist;
    let donePerc=(s.dist/total)*100;
    let remainPerc=100-donePerc;

    html+=`<tr>
      <td>${s.id}</td>
      <td>${s.name}</td>
      <td>${s.dist}</td>
      <td>${next}</td>
      <td>${remain}</td>
      <td>${donePerc.toFixed(1)}%</td>
      <td>${remainPerc.toFixed(1)}%</td>
      <td>${avgDist.toFixed(0)}</td>
    </tr>`;
  }

  html+='</table>';

  document.getElementById('out').innerHTML=html;
}
</script>

</body>
</html>
