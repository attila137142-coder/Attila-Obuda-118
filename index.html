<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attila Közlekedés V3.0 ULTIMATE</title>
<style>
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#07111f;color:#fff}
header{background:#123b63;padding:20px}
main{max-width:1200px;margin:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.card{background:#10253d;border-radius:12px;padding:16px}
h1,h2{margin:0 0 10px}
.small{color:#9fdcff}
</style>
</head>
<body>
<header>
<h1>🚦 Attila Közlekedés V3.0 ULTIMATE</h1>
<div class="small">Projekt alapváz – további modulok fokozatosan kerülnek be.</div>
</header>
<main>
<div class="card"><h2>🕒 Óra</h2><div id="clock"></div></div>
<div class="card"><h2>📡 GPS</h2><div id="gps">Várakozás...</div></div>
<div class="card"><h2>🌦 Időjárás</h2><div>Előkészítve</div></div>
<div class="card"><h2>🚌 GTFS</h2><div>Connector előkészítve</div></div>
</main>
<script>
function tick(){
 const n=new Date();
 document.getElementById('clock').textContent=n.toLocaleString('hu-HU');
}
setInterval(tick,1000);tick();
if(navigator.geolocation){
 navigator.geolocation.watchPosition(p=>{
  document.getElementById('gps').innerHTML=
   "Lat: "+p.coords.latitude.toFixed(8)+"<br>Lon: "+p.coords.longitude.toFixed(8)+
   "<br>Pontosság: ±"+Math.round(p.coords.accuracy)+" m";
 },e=>{
  document.getElementById('gps').textContent="GPS hiba: "+e.message;
 },{enableHighAccuracy:true});
}
</script>
</body>
</html>
