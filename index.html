<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>🚦 GTFS LIVE DISPATCHER CORE</title>

<style>
body{
    margin:0;
    background:#0b0f14;
    color:#e0e6ed;
    font-family:Arial;
}

.header{
    background:#111827;
    padding:10px;
    font-size:18px;
    font-weight:bold;
}

.table{
    width:100%;
    border-collapse:collapse;
}

td,th{
    padding:10px;
    border-bottom:1px solid #1f2937;
    text-align:left;
}

.status-green{color:#22c55e;}
.status-yellow{color:#eab308;}
.status-red{color:#ef4444;}
.status-purple{color:#a855f7;}

.badge{
    padding:4px 8px;
    border-radius:6px;
    font-size:12px;
    background:#1f2937;
}
</style>
</head>

<body>

<div class="header">🚦 VALÓS GTFS DISPATCHER PANEL (BKK / MÁV / VOLÁN)</div>

<table class="table">
<thead>
<tr>
<th>Járat</th>
<th>Megálló</th>
<th>Tervezett</th>
<th>Valós</th>
<th>Késés</th>
<th>Státusz</th>
</tr>
</thead>

<tbody id="rows"></tbody>
</table>

<script>
// DEMO → ezt később GTFS-RT API váltja ki

const data = [
{
route:"85",
stop:"Örs vezér tere",
scheduled:"12:00",
realtime:"12:03"
},
{
route:"MÁV IC 745",
stop:"Kelenföld",
scheduled:"12:10",
realtime:"12:18"
},
{
route:"Volán 100E",
stop:"Deák Ferenc tér",
scheduled:"12:05",
realtime:"12:04"
}
];

function diffMin(a,b){
const [h1,m1]=a.split(":").map(Number);
const [h2,m2]=b.split(":").map(Number);
return (h2*60+m2)-(h1*60+m1);
}

function statusClass(d){
if(d<0) return "status-purple";
if(d<=2) return "status-green";
if(d<=5) return "status-yellow";
return "status-red";
}

function render(){
const tbody=document.getElementById("rows");
tbody.innerHTML="";

data.forEach(d=>{
const delay = diffMin(d.scheduled,d.realtime);
const cls = statusClass(delay);

tbody.innerHTML += `
<tr>
<td><span class="badge">${d.route}</span></td>
<td>${d.stop}</td>
<td>${d.scheduled}</td>
<td>${d.realtime}</td>
<td>${delay} perc</td>
<td class="${cls}">
${delay<0?"KORAI":delay<=2?"PONTOS":delay<=5?"KÉSIK":"NAGY KÉSÉS"}
</td>
</tr>
`;
});
}

render();
</script>

</body>
</html>
