<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FUTÁR V6 DISPATCHER HUB</title>

<style>

body{
    margin:0;
    background:#0a0f16;
    color:#e8f1ff;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

/* HEADER */

header{
    height:60px;
    background:#111826;
    border-bottom:2px solid #00ffaa;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#00ffaa;
}

.clockbox{
    display:flex;
    gap:20px;
    align-items:center;
}

.clock{
    font-size:28px;
    color:#00ffaa;
    font-weight:bold;
}

.date{
    font-size:14px;
    color:#9cb3d1;
}

/* MAIN */

.main{
    display:grid;
    grid-template-columns:360px 1fr;
    height:calc(100vh - 60px);
}

/* LEFT */

.sidebar{
    background:#111826;
    overflow-y:auto;
    border-right:2px solid #1f2b3d;
    padding:12px;
}

/* SEARCH */

.search{
    margin-bottom:15px;
}

.search input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#1a2433;
    color:white;
    font-size:15px;
}

/* SECTION */

.section{
    margin-bottom:22px;
}

.section h2{
    color:#00ffaa;
    font-size:16px;
    border-bottom:1px solid #2a394f;
    padding-bottom:6px;
}

/* BUTTONS */

.btn{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
    text-align:left;
    transition:0.2s;
    font-size:14px;
}

.btn:hover{
    transform:scale(1.02);
    opacity:0.9;
}

.bkk{ background:#1c3552; }
.live{ background:#1f4a33; }
.volan{ background:#52371c; }
.mav{ background:#263d66; }
.map{ background:#3d235c; }

/* RIGHT */

.viewer{
    position:relative;
    background:#05080d;
}

iframe{
    width:100%;
    height:100%;
    border:none;
    background:white;
}

/* STATUS BAR */

.statusbar{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:38px;
    background:#111826dd;
    display:flex;
    align-items:center;
    padding:0 15px;
    color:#00ffaa;
    font-size:13px;
    border-top:1px solid #233044;
}

/* MOBILE */

@media(max-width:900px){

.main{
    grid-template-columns:1fr;
}

.sidebar{
    height:45vh;
}

.viewer{
    height:55vh;
}

.clock{
    font-size:20px;
}

.logo{
    font-size:18px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
🚦 FUTÁR V6 DISPATCHER HUB
</div>

<div class="clockbox">
<div class="date" id="date"></div>
<div class="clock" id="clock">00:00:00</div>
</div>

</header>

<div class="main">

<!-- LEFT -->

<div class="sidebar">

<div class="search">
<input type="text" placeholder="🔎 keresés: 243, Nád utca, Szentendre...">
</div>

<!-- FUTÁR -->

<div class="section">
<h2>📡 FUTÁR / BKK</h2>

<button class="btn bkk"
onclick="loadIframe('https://online.winmenetrend.hu/futar/history/lines')">
FUTÁR HISTORY LINES
</button>

<button class="btn bkk"
onclick="loadIframe('https://online.winmenetrend.hu/futar/history/vehicles')">
FUTÁR VEHICLES
</button>

<button class="btn bkk"
onclick="loadIframe('https://online.winmenetrend.hu/futar/history/vehicles-map')">
FUTÁR VEHICLE MAP
</button>

<button class="btn bkk"
onclick="loadIframe('https://futar.bkk.hu/route/BKK_2430')">
243-AS JÁRAT
</button>

<button class="btn map"
onclick="openExternal('https://go.bkk.hu/?map=14/47.59793/19.05094')">
BUDAPESTGO MAP (ÚJ FÜL)
</button>

<button class="btn map"
onclick="openExternal('https://futar.bkk.hu/?map=14/47.59658/19.04446')">
FUTÁR MAP (ÚJ FÜL)
</button>

</div>

<!-- REALTIME -->

<div class="section">
<h2>🟢 REALTIMENEXT</h2>

<button class="btn live"
onclick="loadIframe('https://realtimenext.hu/embed/bkv/stops/CSF00457/schedule')">
NÁD UTCA
</button>

<button class="btn live"
onclick="loadIframe('https://realtimenext.hu/embed/bkv/stops/CSF00678/schedule')">
BUSZGARÁZS 
</button>

<button class="btn live"
onclick="loadIframe('https://realtimenext.hu/embed/bkv/stops/F00679/schedule')">
BUSZGARÁZS BEFELÉ
</button>

<button class="btn live"
onclick="loadIframe('https://realtimenext.hu/embed/bkv/stops/044192/schedule')">
BÉKÁSMEGYER 243 MH
</button>

    

<button class="btn live"
onclick="loadIframe('https://realtimenext.hu/embed/bkv/stops/09142223/schedule')">
SZENTENDRE-röl HÉV indul
</button>

</div>

<!-- VOLÁN -->

<div class="section">
<h2>🚌 VOLÁN</h2>

<button class="btn volan"
onclick="loadIframe('https://utas.hu/search/')">
VOLÁN KERESŐ
</button>

<button class="btn volan"
onclick="loadIframe('https://utas.hu/?map=10/47.91054/18.93198')">
BÖRZSÖNY MAP
</button>

<button class="btn volan"
onclick="loadIframe('https://utas.hu/?map=10/47.70959/18.9351')">

</div>

<!-- MÁV -->

<div class="section">
<h2>🚆 MÁV / GYSEV</h2>

<button class="btn mav"

</button>

<button class="btn mav"
onclick="openExternal('https://mavplusz.hu/#/map')">

</button>

<button class="btn mav"
onclick="openExternal('https://www.gysev.hu/app/allomasi_ut.html?p_all_kod=5538-55&p_m=1')">
GYSEV (ÚJ FÜL)
</button>

</div>

</div>

<!-- RIGHT -->

<div class="viewer">

<iframe id="frame"
src="https://realtimenext.hu/embed/bkv/stops/F00457/schedule">
</iframe>

<div class="statusbar" id="statusbar">
🟢 DISPATCH SYSTEM READY
</div>

</div>

</div>

<script>

/* CLOCK */

function updateClock(){

    const now = new Date();

    const time =
        now.toLocaleTimeString('hu-HU');

    const date =
        now.toLocaleDateString('hu-HU',{
            year:'numeric',
            month:'long',
            day:'numeric',
            weekday:'long'
        });

    document.getElementById("clock").innerText = time;
    document.getElementById("date").innerText = date;
}

setInterval(updateClock,1000);
updateClock();

/* IFRAME */

function loadIframe(url){

    document.getElementById("frame").src = url;

    document.getElementById("statusbar").innerHTML =
    "📡 BETÖLTVE: " + url;
}

/* EXTERNAL */

function openExternal(url){

    window.open(url,'_blank');

    document.getElementById("statusbar").innerHTML =
    "🌐 KÜLSŐ MEGNYITÁS: " + url;
}

</script>

</body>
</html>
