<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FUTÁR V5 – TURISTA GRAPH (STABLE)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; background:#0b0f14; color:white; }
header { padding:10px; background:#111827; font-weight:bold; }
#map { height:90vh; }

.panel {
    position:absolute;
    top:60px;
    left:10px;
    z-index:999;
    background:#111827;
    padding:10px;
    width:340px;
    border-radius:8px;
}

button {
    width:100%;
    padding:8px;
    margin-top:5px;
    cursor:pointer;
}

#status {
    font-size:12px;
    margin-top:8px;
    color:#93c5fd;
    white-space:pre-line;
}
</style>
</head>

<body>

<header>🧭 FUTÁR V5 – TURISTA GRAPH (STABLE PRELOAD BUDAI)</header>

<div class="panel">
<button onclick="renderGraph()">🚶‍♂️ Turista háló betöltése</button>
<div id="status">Idle</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ---------------- MAP ----------------
const map = L.map('map').setView([47.52, 19.03], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:"OSM"
}).addTo(map);

function log(msg){
    document.getElementById("status").innerText = msg;
}

// ---------------- FIXED GRAPH DATA ----------------
// (Budai-hegység realista mintaháló – stabil demo core)

const nodes = {
    "CS": {name:"Csillaghegy", lat:47.569, lon:19.045, elev:140},
    "HHH": {name:"Hármashatár-hegy", lat:47.539, lon:19.034, elev:495},
    "AK": {name:"Árpád-kilátó", lat:47.534, lon:19.028, elev:380},
    "NF": {name:"Normafa", lat:47.500, lon:18.966, elev:477},
    "EKT": {name:"Erzsébet-kilátó", lat:47.518, lon:18.962, elev:527},
    "JH": {name:"János-hegy", lat:47.525, lon:18.963, elev:527}
};

// edges = TURISTA SÉTA/ÖSVÉNY SZAKASZOK
const edges = [
    {from:"CS", to:"HHH", dist:0.85, gain:120},
    {from:"HHH", to:"AK", dist:2.1, gain:80},
    {from:"NF", to:"EKT", dist:1.2, gain:150},
    {from:"NF", to:"JH", dist:1.4, gain:90},
    {from:"JH", to:"EKT", dist:0.9, gain:60},
    {from:"HHH", to:"NF", dist:8.5, gain:300}
];

// ---------------- COLOR SYSTEM (YOUR RULE) ----------------
function gradeColor(g){
    if(g <= 4) return "#22c55e";      // zöld
    if(g <= 9) return "#eab308";      // sárga
    if(g <= 15) return "#f97316";     // narancs
    if(g <= 20) return "#b91c1c";     // bordó
    if(g <= 30) return "#ef4444";     // piros
    if(g <= 50) return "linear-gradient";
    return "#000";
}

// ---------------- RENDER ----------------
function renderGraph(){

    log("Rendering stable FUTÁR graph...");

    // nodes
    Object.keys(nodes).forEach(id=>{
        const n = nodes[id];

        L.circleMarker([n.lat,n.lon],{
            radius:6,
            color:"#fff",
            fillColor:"#38bdf8",
            fillOpacity:0.9
        }).addTo(map)
        .bindPopup(`<b>${n.name}</b><br>⛰️ ${n.elev} m`);
    });

    // edges
    edges.forEach(e=>{

        const A = nodes[e.from];
        const B = nodes[e.to];

        const grade = (e.gain / (e.dist*1000))*100;

        let color = "#22c55e";
        if(grade > 4) color = "#eab308";
        if(grade > 9) color = "#f97316";
        if(grade > 15) color = "#b91c1c";
        if(grade > 20) color = "#ef4444";

        L.polyline(
            [[A.lat,A.lon],[B.lat,B.lon]],
            {color:color, weight:5}
        ).addTo(map)
        .bindPopup(
            `<b>${A.name} → ${B.name}</b><br>
            📏 ${e.dist} km<br>
            ⛰️ +${e.gain} m<br>
            📊 ${(grade).toFixed(1)} %`
        );
    });

    log(
`✔ FUTÁR V5 STABLE GRAPH LOADED

Nodes: ${Object.keys(nodes).length}
Edges: ${edges.length}
Status: NO API – FULL OFFLINE`
    );
}

</script>

</body>
</html>
