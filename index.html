<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<title>V10.1 GTFS Stable Engine FIX</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{font-family:Arial;background:#0f172a;color:#e2e8f0;padding:20px}
button{padding:10px;margin:5px;cursor:pointer}
.box{background:#111827;padding:10px;margin-top:10px;border-radius:10px;overflow:auto}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #334155;padding:6px;font-size:12px}
.ok{color:#4ade80}
.bad{color:#f87171}
</style>
</head>
<body>

<h2>🚀 V10.1 GTFS STABLE ENGINE (FIXED PARSER)</h2>

<input type="file" id="file" />
<button onclick="loadGTFS()">GTFS betöltés</button>

<div class="box" id="status">Várakozás...</div>
<div class="box" id="log"></div>

<h3>📦 ZIP tartalom</h3>
<div class="box" id="files"></div>

<h3>🚏 Megállók táblázat</h3>
<table id="stopsTable"></table>

<script>
let zipData;

function log(msg){
  document.getElementById('log').innerHTML += msg + "<br>";
}

function setStatus(msg, ok=true){
  document.getElementById('status').innerHTML = ok ? 
  "<span class='ok'>"+msg+"</span>" : 
  "<span class='bad'>"+msg+"</span>";
}

// 🧠 CSV SAFE PARSER (kezeli az idézőjeleket is)
function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  const headers = splitCSV(lines[0]);

  return lines.slice(1).map(line => {
    const values = splitCSV(line);
    let obj = {};
    headers.forEach((h,i)=>obj[h]=values[i]);
    return obj;
  });
}

// 🧠 GTFS-safe split (idézőjelek miatt)
function splitCSV(line){
  let result = [];
  let current = "";
  let inQuotes = false;

  for(let char of line){
    if(char === '"') inQuotes = !inQuotes;
    else if(char === ',' && !inQuotes){
      result.push(current);
      current = "";
    } else {
      current += char;
    }
  }
  result.push(current);
  return result;
}

async function loadGTFS(){

  const file = document.getElementById('file').files[0];
  if(!file){alert("Nincs fájl!");return;}

  log("📦 ZIP betöltés...");

  const buffer = await file.arrayBuffer();
  log("ZIP méret: " + buffer.byteLength);

  if(buffer.byteLength < 50000){
    setStatus("❌ Gyanús ZIP",false);
    return;
  }

  const zip = await JSZip.loadAsync(buffer);
  zipData = zip;

  const files = Object.keys(zip.files);
  document.getElementById('files').innerHTML = files.map(f=>"• "+f).join("<br>");

  log("📂 fájlok: " + files.length);

  const stopsFile = files.find(f=>f.toLowerCase().includes("stops.txt"));

  if(!stopsFile){
    setStatus("❌ stops.txt nincs",false);
    return;
  }

  const text = await zip.file(stopsFile).async("string");
  const data = parseCSV(text);

  log("🚏 stops: " + data.length);

  // TABLE BUILD
  let html = "<tr><th>ID</th><th>Név</th><th>Lat</th><th>Lon</th></tr>";

  for(let i=0;i<Math.min(30,data.length);i++){
    const s = data[i];

    html += `<tr>
      <td>${s.stop_id || ''}</td>
      <td>${s.stop_name || ''}</td>
      <td>${s.stop_lat || ''}</td>
      <td>${s.stop_lon || ''}</td>
    </tr>`;
  }

  document.getElementById('stopsTable').innerHTML = html;

  setStatus("✅ V10.1 GTFS OK (FIXED PARSER)");

}
</script>

</body>
</html>
