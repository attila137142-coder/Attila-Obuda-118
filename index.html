<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V8.1 FULL GTFS DISPATCH FIX</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  display:flex;
  height:100vh;
  background:#0b0f14;
  color:#e6f1ff;
}

#sidebar{
  width:420px;
  background:#0f172a;
  overflow:auto;
  border-right:1px solid #1f2937;
}

#map{
  flex:1;
}

.header{
  padding:10px;
  background:#111827;
  display:flex;
  justify-content:space-between;
  font-weight:bold;
}

.panel{
  padding:10px;
  border-bottom:1px solid #1f2937;
}

input,button{
  width:100%;
  padding:8px;
  margin-top:6px;
  border-radius:6px;
  border:none;
}

button{
  background:#1d4ed8;
  color:white;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:4px 0;
  border-bottom:1px solid #1f2937;
}

.ok{color:#00ff99;}
</style>
</head>

<body>

<div id="sidebar">

<div class="header">
🚍 V8.1 DISPATCH FIX
<div id="clock"></div>
</div>

<div class="panel">
<input type="file" id="zip">
<select id="source">
  <option value="bkk">BKK</option>
  <option value="volan">VOLÁN</option>
  <option value="mav">MÁV</option>
</select>
<button onclick="loadGTFS()">GTFS BETÖLTÉS</button>
</div>

<div class="panel">
<input id="search" placeholder="Megálló keresés...">
<button onclick="searchStop()">KERESÉS</button>
</div>

<div class="panel">
<h3>🧠 INDULÁSOK</h3>
<div id="board"></div>
</div>

<div class="panel">
<h3>📡 STATUS</h3>
<div id="status"></div>
</div>

</div>

<div id="map"></div>

<script>

// ================= MAP =================
const map = L.map('map').setView([47.5,19.05],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'OSM'
}).addTo(map);

// ================= CLOCK =================
setInterval(()=>{
  document.getElementById("clock").innerText =
    new Date().toLocaleTimeString();
},1000);

// ================= DATA =================
let GTFS = {
  bkk:{stops:{}, departures:{}},
  volan:{stops:{}, departures:{}},
  mav:{stops:{}, departures:{}}
};

let STOP_INDEX = [];

// ================= TIME FIX =================
function timeToSec(t){

  if(!t) return 0;

  let [h,m,s] = t.split(":").map(Number);

  if(h>=24){
    h = h-24;
    return (24*3600)+(h*3600+m*60+s);
  }

  return h*3600+m*60+s;
}

// ================= SAVE =================
function save(){
  localStorage.setItem("v81_gtfs", JSON.stringify(GTFS));
}

// ================= LOAD =================
function load(){
  let d = localStorage.getItem("v81_gtfs");
  if(d) GTFS = JSON.parse(d);
}
load();

// ================= LOAD GTFS =================
async function loadGTFS(){

  const file = document.getElementById("zip").files[0];
  const src = document.getElementById("source").value;

  const zip = await JSZip.loadAsync(file);

  let stops = {};
  let departures = {};

  for(let p in zip.files){

    let name = p.split("/").pop().toLowerCase();
    let content = await zip.files[p].async("string");

    if(name==="stops.txt"){

      let rows = Papa.parse(content,{header:true}).data;

      rows.forEach(s=>{
        stops[s.stop_id] = s;

        STOP_INDEX.push({
          id:s.stop_id,
          name:s.stop_name,
          lat:s.stop_lat,
          lon:s.stop_lon,
          source:src
        });
      });
    }

    if(name==="stop_times.txt"){

      let rows = Papa.parse(content,{header:true}).data;

      rows.forEach(r=>{

        if(!r.stop_id || !r.departure_time) return;

        if(!departures[r.stop_id]) departures[r.stop_id]=[];

        departures[r.stop_id].push({
          trip:r.trip_id,
          time:r.departure_time,
          sec:timeToSec(r.departure_time),
          source:src
        });
      });
    }
  }

  GTFS[src] = {stops, departures};

  save();
  renderMap();
  updateStatus();
}

// ================= MAP RENDER FIX =================
function renderMap(){

  map.eachLayer(l=>{
    if(l instanceof L.CircleMarker) map.removeLayer(l);
  });

  STOP_INDEX.forEach(s=>{

    if(!s.lat || !s.lon) return;

    L.circleMarker([s.lat,s.lon],{
      radius:4,
      color:"#00ffff"
    }).addTo(map)
    .bindPopup(s.name)
    .on("click",()=>{
      renderBoard(s.id);
    });
  });
}

// ================= MERGE ENGINE =================
function getMerged(stop_id){

  let all = [];

  Object.keys(GTFS).forEach(src=>{

    let g = GTFS[src];

    if(g.departures && g.departures[stop_id]){
      all.push(...g.departures[stop_id]);
    }
  });

  return all.sort((a,b)=>a.sec-b.sec);
}

// ================= BOARD =================
function renderBoard(stop_id){

  let list = getMerged(stop_id);

  let html = "<b>INDULÁSOK</b><br><br>";

  if(list.length===0){
    html += "Nincs adat";
  }

  list.slice(0,15).forEach(d=>{
    html += `
      <div class="row">
        <div>${d.trip} <small>[${d.source}]</small></div>
        <div class="ok">${d.time}</div>
      </div>`;
  });

  document.getElementById("board").innerHTML = html;
}

// ================= SEARCH FIX =================
function searchStop(){

  let q = document.getElementById("search").value.toLowerCase();

  let found = STOP_INDEX.find(s =>
    s.name && s.name.toLowerCase().includes(q)
  );

  if(found){
    map.setView([found.lat,found.lon],14);
    renderBoard(found.id);
  }
}

// ================= STATUS =================
function updateStatus(){

  document.getElementById("status").innerHTML = `
  BKK stops: ${Object.keys(GTFS.bkk.stops).length}<br>
  VOLÁN stops: ${Object.keys(GTFS.volan.stops).length}<br>
  MÁV stops: ${Object.keys(GTFS.mav.stops).length}<br>
  INDEX: ${STOP_INDEX.length}<br>
  MODE: V8.1 FIXED UI ENGINE<br>
  `;
}

</script>

</body>
</html>
