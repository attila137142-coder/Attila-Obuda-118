<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>ATTILA NAVI PRO MAX FUTÁR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body { margin:0; background:#111; color:#fff; font-family:Arial; }
#map { height:50vh; }
.panel { padding:8px; }
button { margin:3px; padding:8px; border-radius:6px; border:0; font-weight:bold; }
.box { background:#1e1e1e; padding:8px; border-radius:8px; font-size:12px; }
input { width:95%; padding:6px; border-radius:6px; border:0; }
#departuresPanel{
position:fixed;
bottom:0;
left:0;
right:0;
background:#000;
max-height:45%;
overflow:auto;
padding:10px;
display:none;
}
</style>
</head>

<body>

<div class="panel">

<input id="searchInput" placeholder="Keresés..." />
<button onclick="searchPlace()">🔎</button><br>

<button onclick="setLayer('street')">UTCAI</button>
<button onclick="setLayer('topo')">TOPO</button>
<button onclick="toggleRail()">VASÚTI</button>
<button onclick="toggleHike()">TURISTA</button>

<div id="info" class="box">Indítás...</div>

</div>

<div id="map"></div>
<div id="departuresPanel"></div>

<script>

// ---------- MAP
let map = L.map('map').setView([47.49,19.04],13);

let baseLayers = {
 street: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'),
 topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png')
};

let railLayer = L.tileLayer('https://{s}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png',{opacity:0.8});
let hikeLayer = L.tileLayer('https://tile.waymarkedtrails.org/hiking/{z}/{x}/{y}.png',{opacity:0.9});

let currentBase = baseLayers.street;
currentBase.addTo(map);

function setLayer(t){
 map.removeLayer(currentBase);
 currentBase = baseLayers[t];
 map.addLayer(currentBase);
}
function toggleRail(){ map.hasLayer(railLayer)?map.removeLayer(railLayer):map.addLayer(railLayer);}
function toggleHike(){ map.hasLayer(hikeLayer)?map.removeLayer(hikeLayer):map.addLayer(hikeLayer);}

// ---------- GPS + SPEED
let userLat,userLng,lastTime=null,speedKmh=0,speedMs=0;

navigator.geolocation.watchPosition(pos=>{
 let lat=pos.coords.latitude;
 let lng=pos.coords.longitude;
 let now=Date.now();

 if(userLat){
   let d=dist(userLat,userLng,lat,lng);
   let dt=(now-lastTime)/1000;
   if(dt>0.5){
     speedMs=d/dt;
     speedKmh=speedMs*3.6;
   }
 }

 userLat=lat;
 userLng=lng;
 lastTime=now;

 document.getElementById("info").innerHTML=
 `🚀 ${speedKmh.toFixed(1)} km/h<br>⚡ ${speedMs.toFixed(2)} m/s`;
});

// ---------- DIST
function dist(a,b,c,d){
 let R=6371e3;
 let φ1=a*Math.PI/180, φ2=c*Math.PI/180;
 let Δφ=(c-a)*Math.PI/180;
 let Δλ=(d-b)*Math.PI/180;
 let x=Math.sin(Δφ/2)**2+
   Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
 return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ---------- ROUTE DIST
async function getRouteDistance(lat,lng){
 try{
   let r=await fetch(`https://router.project-osrm.org/route/v1/foot/${userLng},${userLat};${lng},${lat}?overview=false`);
   let d=await r.json();
   return d.routes[0].distance;
 }catch(e){return null;}
}

// ---------- SEARCH
async function searchPlace(){
 let q=document.getElementById("searchInput").value;
 let r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}`);
 let d=await r.json();
 if(d[0]) map.setView([d[0].lat,d[0].lon],15);
}

// ---------- GTFS
let gtfsStops=[];

async function loadGTFS(url){

 let res=await fetch(url);
 let zip=await JSZip.loadAsync(await res.blob());

 let stopsTxt=await zip.file("stops.txt").async("string");

 gtfsStops = stopsTxt.split("\n").slice(1).map(r=>{
   let c=r.split(",");
   return {id:c[0],name:c[2],lat:+c[4],lng:+c[5]};
 });

 drawStops();
}

// ---------- STOPS
function drawStops(){

 gtfsStops.forEach(s=>{

   let m=L.circleMarker([s.lat,s.lng],{radius:5,color:"yellow"})
     .addTo(map);

   m.on("click",()=>showDepartures(s));
 });
}

// ---------- LIVE DEPS (BACKEND)
async function showDepartures(stop){

 let air = dist(userLat,userLng,stop.lat,stop.lng);
 let road = await getRouteDistance(stop.lat,stop.lng);

 let html = `
 <h3>${stop.name}</h3>
 ✈️ ${Math.round(air)} m |
 🛣️ ${road?Math.round(road)+" m":"..."}<br><br>

 <table width="100%">
 <tr><th>Visz</th><th>Indul</th><th>Késés</th></tr>
 `;

 try{
   let res = await fetch("http://localhost:3000/liveDepartures/"+stop.id);
   let data = await res.json();

   data.forEach(d=>{
     let col = d.delay==0?"lime":d.delay<5?"orange":"red";
     html += `<tr>
       <td>${d.route}</td>
       <td>${d.time}</td>
       <td style="color:${col}">${d.delay}p</td>
     </tr>`;
   });

 }catch(e){
   html += `<tr><td colspan=3>Nincs backend</td></tr>`;
 }

 html += "</table>";

 let panel=document.getElementById("departuresPanel");
 panel.innerHTML=html;
 panel.style.display="block";
}

// ---------- LOAD BKK
loadGTFS("https://bkk.hu/gtfs/budapest_gtfs.zip");

</script>
</body>
</html>
