<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Attila PDF → Táblázat Engine V0.2
</title>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<style>

body{
font-family:Arial, sans-serif;
background:#111;
color:white;
padding:20px;
}


h1{
color:#00eaff;
}


.panel{

background:#1c1c1c;
border:1px solid #444;
border-radius:12px;
padding:15px;
margin-bottom:15px;

}


button{

padding:10px 20px;
border:0;
border-radius:8px;
background:#008cff;
color:white;
cursor:pointer;

}


button:hover{

background:#00c3ff;

}


table{

border-collapse:collapse;
background:white;
color:black;
width:100%;

}


td,th{

border:1px solid #555;
padding:6px;
text-align:center;

}


pre{

background:#000;
padding:10px;
max-height:350px;
overflow:auto;

}


</style>


</head>


<body>


<h1>
🧪 Attila PDF → Táblázat Engine V0.2
</h1>



<div class="panel">


<h3>
PDF betöltés
</h3>


<input 
type="file"
id="pdfFile"
accept=".pdf">


<br><br>


<button onclick="loadPDF()">
PDF feldolgozás
</button>


</div>



<div class="panel">

<h3>
Állapot
</h3>

<div id="status">
Várakozás...
</div>

</div>



<div class="panel">

<h3>
Felismert elemek
</h3>

<pre id="debug">
---
</pre>

</div>



<div class="panel">

<h3>
Táblázat előnézet
</h3>


<div id="result">

---

</div>


</div>



<script>


let pdfItems=[];

let rows=[];



function setStatus(t){

document.getElementById("status").innerHTML=t;

}





async function loadPDF(){


let file=
document.getElementById("pdfFile").files[0];


if(!file){

alert("Válassz PDF fájlt!");

return;

}



setStatus(
"PDF betöltése..."
);



let buffer=
await file.arrayBuffer();



let pdf=
await pdfjsLib.getDocument({
data:buffer
}).promise;



let page=
await pdf.getPage(1);



let content=
await page.getTextContent();



pdfItems=[];



content.items.forEach(item=>{


pdfItems.push({

text:item.str.trim(),

x:item.transform[4],

y:item.transform[5]

});


});



setStatus(
"✅ Koordináták feldolgozva"
);



showDebug();


createRows();


createTable();


}






function showDebug(){


let out="";


pdfItems.forEach(e=>{


if(e.text){

out +=

e.text+
" | X:"+
e.x.toFixed(1)+
" Y:"+
e.y.toFixed(1)
+
"\n";


}


});



document.getElementById("debug").textContent=out;


}





// ===============================
// SOR FELISMERÉS
// ===============================


function createRows(){


rows=[];


let tolerance=2;



pdfItems.forEach(item=>{


if(!item.text)
return;



let found=
rows.find(r=>
Math.abs(r.y-item.y)<tolerance
);



if(found){

found.items.push(item);

}

else{

rows.push({

y:item.y,

items:[item]

});

}


});



// PDF koordináta miatt fordított sorrend

rows.sort((a,b)=>b.y-a.y);



rows.forEach(r=>{


r.items.sort((a,b)=>a.x-b.x);


});


}




// ======================================
// V0.2 / 2. RÉSZ
// FEJLÉC + OSZLOP FELISMERÉS
// ======================================


let columns = {
    forgszam:null,
    be:null,
    erk:null,
    ind:null,
    ki:null
};




// -------------------------------
// Fejléc keresése
// -------------------------------


function detectHeader(){


rows.forEach(row=>{


let texts =
row.items.map(x=>x.text);



let joined =
texts.join(" ");



if(
joined.includes("Forg. szám") &&
joined.includes("Be") &&
joined.includes("Érk.") &&
joined.includes("Ind.") &&
joined.includes("Ki")
){


row.items.forEach(item=>{


switch(item.text){


case "Forg. szám":
columns.forgszam=item.x;
break;


case "Be":
columns.be=item.x;
break;


case "Érk.":
columns.erk=item.x;
break;


case "Ind.":
columns.ind=item.x;
break;


case "Ki":
columns.ki=item.x;
break;


}


});


}


});


console.log(
"Felismert oszlopok:",
columns
);


}




// -------------------------------
// Legközelebbi oszlop keresése
// -------------------------------


function findColumn(x){


let best=null;

let distance=999;



let list=[


{
name:"forgszam",
x:columns.forgszam
},


{
name:"be",
x:columns.be
},


{
name:"erk",
x:columns.erk
},


{
name:"ind",
x:columns.ind
},


{
name:"ki",
x:columns.ki
}


];



list.forEach(c=>{


if(c.x!==null){


let d=
Math.abs(x-c.x);



if(d<distance){

distance=d;

best=c.name;

}


}


});



return best;


}






// -------------------------------
// Táblázat sorok építése
// -------------------------------


function buildGrid(){



let tableRows=[];



rows.forEach(row=>{


let obj={

forgszam:"",
be:"",
erk:"",
ind:"",
ki:""

};



row.items.forEach(item=>{


let col=
findColumn(item.x);



if(col){

obj[col]+=item.text;

}



});



if(
obj.forgszam ||
obj.be ||
obj.erk ||
obj.ind ||
obj.ki
){

tableRows.push(obj);

}


});



return tableRows;


}


</script>


</body>

</html>
