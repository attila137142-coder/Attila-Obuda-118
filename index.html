<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>V6 GTFS MAP CLUSTER CORE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body { font-family: Arial; margin: 0; padding: 10px; }
#map { height: 500px; width: 100%; margin-top: 10px; border: 1px solid #ccc; }
.box { margin-bottom: 10px; }
input, button { padding: 8px; }
#results div { padding: 6px; border-bottom: 1px solid #eee; cursor: pointer; }
#results div:hover { background: #f2f2f2; }
</style>
</head>
<body>

<h2>🚉 V6 GTFS MAP CLUSTER CORE (ALL STOPS)</h2>

<div class="box">
<input type="file" id="zipFile" accept=".zip" />
<button onclick="loadGTFSZip()">GTFS betöltés</button>
<p id="status">Nincs GTFS</p>
</div>

<div class="box">
<input id="search" placeholder="Megálló keresés..." />
<button onclick="searchStops()">Keresés</button>
<div id="results"></div>
</div>

<div id="map"></div>

<script>

let STOPS = [];
let map;
let cluster;

function distanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2-lat1)*Math.PI/180;
    const dLon = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return Math.round((2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)))*100)/100;
}

function initMap(){
    map = L.map('map').setView([47.4979,19.0402],11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'OSM'}).addTo(map);

    cluster = L.markerClusterGroup();
    map.addLayer(cluster);
}

initMap();

function parseCSV(text){
    const lines = text.trim().split(/\r?\n/);
    const h = lines[0].split(',');

    return lines.slice(1).map(l=>{
        const c = l.split(',');
        let o={};
        h.forEach((x,i)=>o[x]=c[i]);
        return o;
    });
}

function loadGTFSZip(){
    const file=document.getElementById('zipFile').files[0];
    if(!file) return alert('Nincs ZIP');

    JSZip.loadAsync(file).then(zip=>{
        let stopsFile;
        zip.forEach((p,e)=>{if(p.includes('stops.txt'))stopsFile=e;});

        if(!stopsFile) return alert('Nincs stops.txt');

        stopsFile.async('string').then(text=>{
            const data=parseCSV(text);

            STOPS=data.map(s=>({
                id:s.stop_id,
                name:s.stop_name,
                lat:parseFloat(s.stop_lat),
                lon:parseFloat(s.stop_lon)
            })).filter(s=>s.lat&&s.lon);

            document.getElementById('status').innerText='GTFS: '+STOPS.length+' megálló';

            renderStops();
        });
    });
}

function renderStops(){
    cluster.clearLayers();

    STOPS.forEach(s=>{
        const m=L.marker([s.lat,s.lon]);
        m.bindPopup(`<b>${s.name}</b><br>ID: ${s.id}`);
        cluster.addLayer(m);
    });
}

function searchStops(){
    const q=document.getElementById('search').value.toLowerCase();

    const res=STOPS.filter(s=>(s.name||'').toLowerCase().includes(q));

    const box=document.getElementById('results');
    box.innerHTML='';

    res.slice(0,20).forEach(s=>{
        const d=document.createElement('div');
        d.innerHTML=`🚏 ${s.name} <small>(${s.id})</small>`;
        d.onclick=()=>map.setView([s.lat,s.lon],15);
        box.appendChild(d);
    });
}

</script>

</body>
</html>
