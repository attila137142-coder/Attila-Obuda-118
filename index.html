TELJES 1-FILE GTFS ENGINE V1
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>GTFS REAL DATA ENGINE V1</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1220;
    color: #e5e7eb;
}

header {
    background: #111827;
    padding: 10px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
}

.container {
    display: grid;
    grid-template-columns: 300px 1fr;
    height: 80vh;
}

.left {
    background: #1f2937;
    padding: 10px;
    overflow-y: auto;
}

.right {
    padding: 10px;
}

.box {
    background: #111827;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 6px;
}

.item {
    background: #374151;
    padding: 8px;
    margin: 6px 0;
    border-radius: 6px;
    cursor: pointer;
}

.item:hover {
    background: #4b5563;
}

input {
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;
    border: none;
    border-radius: 5px;
}

.log {
    height: 20vh;
    background: #0f172a;
    overflow-y: auto;
    font-size: 12px;
    padding: 8px;
    border-top: 1px solid #333;
}
</style>
</head>

<body>

<header>
    <div>🚍 GTFS REAL DATA ENGINE V1</div>
    <div id="status">ENGINE READY</div>
</header>

<div class="container">

<!-- LEFT -->
<div class="left">

<h3>GTFS Control</h3>

<input id="search" placeholder="Megálló keresés..." oninput="searchStops()">

<div id="stops"></div>

</div>

<!-- RIGHT -->
<div class="right">

<div class="box">
    <h3>Kiválasztott megálló</h3>
    <div id="selectedStop">nincs</div>
</div>

<div class="box">
    <h3>Következő indulások (ENGINE)</h3>
    <div id="departures">-</div>
</div>

<div class="box">
    <h3>Járat logika</h3>
    <div id="engine">GTFS engine idle</div>
</div>

</div>

</div>

<div class="log" id="log"></div>

<script>

/* =========================
   GTFS MOCK DATA (ENGINE)
========================= */

const GTFS = {
    stops: [
        {id:"S1", name:"Széll Kálmán tér"},
        {id:"S2", name:"Batthyány tér"},
        {id:"S3", name:"Hűvösvölgy"},
        {id:"S4", name:"Szentendre HÉV"},
    ],

    trips: {
        "118": {
            name: "118-as busz",
            stops: ["S1","S2","S3"],
            stop_times: ["08:00","08:10","08:25","08:40","09:00"]
        },
        "H5": {
            name: "HÉV H5",
            stops: ["S2","S4"],
            stop_times: ["08:05","08:15","08:25","08:35","08:45"]
        }
    }
};

/* =========================
   ENGINE LOG
========================= */

function log(msg){
    document.getElementById("log").innerHTML += msg + "<br>";
}

/* =========================
   STOP LIST RENDER
========================= */

function renderStops(list){
    let html = "";
    list.forEach(s=>{
        html += `<div class="item" onclick="selectStop('${s.id}')">${s.name}</div>`;
    });
    document.getElementById("stops").innerHTML = html;
}

renderStops(GTFS.stops);

/* =========================
   STOP SEARCH
========================= */

function searchStops(){
    let q = document.getElementById("search").value.toLowerCase();

    let filtered = GTFS.stops.filter(s =>
        s.name.toLowerCase().includes(q)
    );

    renderStops(filtered);
}

/* =========================
   STOP SELECT
========================= */

let currentStop = null;

function selectStop(id){
    currentStop = id;

    let stop = GTFS.stops.find(s=>s.id===id);
    document.getElementById("selectedStop").innerText = stop.name;

    log("Stop selected: " + stop.name);

    calculateDepartures();
}

/* =========================
   GTFS ENGINE CORE
========================= */

function calculateDepartures(){

    if(!currentStop) return;

    let now = new Date();
    let currentTime =
        now.getHours().toString().padStart(2,'0') + ":" +
        now.getMinutes().toString().padStart(2,'0');

    let output = "";

    Object.keys(GTFS.trips).forEach(tripId=>{
        let trip = GTFS.trips[tripId];

        if(trip.stops.includes(currentStop)){
            output += `<b>${trip.name}</b><br>`;
            output += "következő indulások:<br>";

            trip.stop_times.forEach(t=>{
                if(t > currentTime){
                    output += "🟢 " + t + "<br>";
                }
            });

            output += "<hr>";
        }
    });

    document.getElementById("departures").innerHTML = output || "nincs adat";

    document.getElementById("engine").innerText =
        "GTFS engine calculated at " + currentTime;

    log("Departures recalculated");
}

/* =========================
   AUTO ENGINE TICK
========================= */

setInterval(()=>{
    if(currentStop){
        calculateDepartures();
    }
}, 30000);

log("GTFS ENGINE V1 initialized");

</script>

</body>
</html>
