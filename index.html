<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTÁR V5 GTFS IMPORT ENGINE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
margin:0;
font-family:Arial;
background:#05070d;
color:#00ffcc;
}

header{
padding:12px;
text-align:center;
background:#0b1220;
border-bottom:2px solid #00ffcc;
font-weight:bold;
}

.container{
display:grid;
grid-template-columns:1fr 2fr;
height:calc(100vh - 50px);
}

.left{
padding:10px;
background:#0b1220;
overflow:auto;
}

#map{
height:100%;
width:100%;
}

input{
width:100%;
padding:10px;
background:#05070d;
border:1px solid #00ffcc;
color:#00ffcc;
}

.item{
padding:8px;
border-bottom:1px solid #00ffcc22;
cursor:pointer;
}

.item:hover{
background:#00ffcc11;
}

.badge{
border:1px solid #00ffcc;
padding:2px 6px;
font-size:11px;
}
</style>
</head>

<body>

<header>
🚍 FUTÁR V5 GTFS IMPORT ENGINE // JSON → MAP → UI
</header>

<div class="container">

<div class="left">
<h3>📦 GTFS Loader</h3>

<button onclick="loadGTFS()">GTFS BETÖLTÉS</button>

<h3>🔍 Megállók</h3>
<input id="search" placeholder="keresés...">
<div id="list"></div>

<h3>🛰 Indulások</h3>
<div id="info"></div>
</div>

<div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

/*
========================
MAP INIT
========================
*/

const map = L.map('map').setView([47.4979,19.0402], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'OSM'
}).addTo(map);

let markers = {};

/*
========================
EMPTY DATASET
========================
*/

let GTFS = null;

/*
========================
LOAD GTFS JSON (SIMULATED)
========================
*/

function loadGTFS(){

GTFS = {
stops:[
{ id:"S1", name:"Deák tér", lat:47.4979, lng:19.0540 },
{ id:"S2", name:"Blaha Lujza tér", lat:47.4970, lng:19.0700 },
{ id:"S3", name:"Kelenföld", lat:47.4649, lng:19.0227 }
],
trips:[
{ route:"7E", stopId:"S2", dir:"Blaha", time:"+2" },
{ route:"9", stopId:"S3", dir:"Óbuda", time:"+4" },
{ route:"M4", stopId:"S3", dir:"Keleti", time:"+6" }
]
};

renderStops();
alert("GTFS betöltve 🚍");
}

/*
========================
RENDER STOPS + MAP
========================
*/

function renderStops(){

GTFS.stops.forEach(s=>{

// map marker
let m = L.marker([s.lat,s.lng])
.addTo(map)
.bindPopup("🚏 "+s.name);

markers[s.id]=m;

});

renderList(GTFS.stops);
}

/*
========================
LIST + SEARCH
========================
*/

function renderList(stops){

let box=document.getElementById("list");
box.innerHTML="";

stops.forEach(s=>{

let div=document.createElement("div");
div.className="item";
div.innerHTML="🚏 "+s.name;

div.onclick=()=>selectStop(s);

box.appendChild(div);

});

}

/*
========================
SELECT STOP
========================
*/

function selectStop(stop){

map.setView([stop.lat,stop.lng],15);

let trips = GTFS.trips.filter(t=>t.stopId===stop.id);

let html = "<h4>🚏 "+stop.name+"</h4>";

if(trips.length===0){
html += "❌ nincs indulás";
}

trips.forEach(t=>{
html += `
<div>
🚍 <span class="badge">${t.route}</span>
→ ${t.dir}
<strong>${t.time}</strong>
</div>
`;
});

document.getElementById("info").innerHTML = html;

}

/*
========================
SEARCH FILTER
========================
*/

document.getElementById("search").addEventListener("input",(e)=>{

if(!GTFS) return;

let val=e.target.value.toLowerCase();

let filtered = GTFS.stops.filter(s=>
s.name.toLowerCase().includes(val)
);

renderList(filtered);

});

</script>

</body>
</html>
