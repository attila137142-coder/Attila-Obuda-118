<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Transport Digital Twin OFFLINE CORE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#e2e8f0}
header{padding:10px;background:#111827;display:flex;flex-wrap:wrap;gap:6px}
.btn{background:#2563eb;border:none;padding:6px 10px;color:#fff;border-radius:8px;cursor:pointer}
.grid{display:grid;gap:10px;padding:10px}
.card{background:#1f2937;padding:10px;border-radius:12px}
#map{height:380px;border-radius:12px}
.status{position:fixed;bottom:10px;left:10px;background:rgba(0,0,0,0.7);padding:6px 10px;border-radius:10px;font-size:12px}
</style>
</head>
<body>

<header>
<button class="btn" onclick="saveTrack()">TRACK SAVE</button>
<button class="btn" onclick="exportGPX()">GPX EXPORT</button>
<button class="btn" onclick="startNav()">NAV</button>
<button class="btn" onclick="clearCache()">CACHE RESET</button>
</header>

<div class="grid">
<div class="card">
<div id="speed"></div>
<div id="info"></div>
</div>
<div class="card"><div id="map"></div></div>
</div>

<div class="status" id="status">INITIALIZING OFFLINE ENGINE...</div>

<script>

// ===================== MAP =====================
let map;
let track=[];
let savedTrack=[];
let trackLine;
let userPos=null;
let navTarget=null;

function initMap(){
 map=L.map('map').setView([47.5,19.05],11);

 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
   maxZoom:19,
   crossOrigin:true
 }).addTo(map);

 document.getElementById('status').innerText="ONLINE + OFFLINE CACHE READY";
}

// ===================== GPS =====================
function haversine(a,b,c,d){
 const R=6371;
 const dLat=(c-a)*Math.PI/180;
 const dLon=(d-b)*Math.PI/180;
 const x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;
 return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

navigator.geolocation.watchPosition(p=>{
 userPos={lat:p.coords.latitude,lon:p.coords.longitude};
 track.push([userPos.lat,userPos.lon]);

 if(trackLine) map.removeLayer(trackLine);
 trackLine=L.polyline(track,{color:'lime'}).addTo(map);

 document.getElementById('speed').innerText=
 "GPS ACTIVE";

 if(p.coords.heading!=null){
   document.getElementById('info').innerText="Heading: "+p.coords.heading.toFixed(0)+"°";
 }
});

// ===================== TRACK =====================
function saveTrack(){
 savedTrack=[...track];
 alert("TRACK SAVED (OFFLINE)");
}

function exportGPX(){
 let gpx='<?xml version="1.0"?><gpx><trk><trkseg>';
 savedTrack.forEach(p=>gpx+=`<trkpt lat="${p[0]}" lon="${p[1]}"></trkpt>`);
 gpx+='</trkseg></trk></gpx>';
 const blob=new Blob([gpx],{type:'application/gpx+xml'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='track.gpx';
 a.click();
}

function startNav(){
 if(savedTrack.length){
  navTarget=savedTrack[savedTrack.length-1];
  document.getElementById('status').innerText="NAV MODE ACTIVE";
 }
}

// ===================== SERVICE WORKER (FULL OFFLINE ENGINE) =====================
if('serviceWorker' in navigator){

 const swCode = `
const CACHE_NAME='offline-map-v1';

self.addEventListener('install',e=>{
 self.skipWaiting();
});

self.addEventListener('activate',e=>{
 clients.claim();
});

self.addEventListener('fetch',event=>{
 const url=new URL(event.request.url);

 if(url.hostname.includes('tile.openstreetmap.org')){

  event.respondWith(
   caches.open(CACHE_NAME).then(cache=>{
    return cache.match(event.request).then(res=>{
     if(res) return res;

     return fetch(event.request).then(net=>{
      cache.put(event.request,net.clone());
      return net;
     });

    });
   })
  );
 }
});
`;

 const blob=new Blob([swCode],{type:'application/javascript'});
 const swURL=URL.createObjectURL(blob);

 navigator.serviceWorker.register(swURL).then(()=>{
   document.getElementById('status').innerText="TRUE OFFLINE MAP ENGINE ACTIVE";
 });
}

window.onload=initMap;

// ===================== CACHE RESET =====================
function clearCache(){
 caches.keys().then(keys=>keys.forEach(k=>caches.delete(k)));
 alert("CACHE CLEARED");
}

</script>

</body>
</html>
