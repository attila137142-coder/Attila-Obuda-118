<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>PRO OPS LIVE SYSTEM – REAL ENGINE V1</title>

<style>
body { margin:0; font-family:Arial; background:#061a16; color:white; }
#panel { padding:10px; white-space:pre; font-family:monospace; }
</style>
</head>

<body>

<h3 style="padding:10px;">🚍 REAL ENGINE V1 – CONTROL CORE</h3>
<input type="file" id="file">
<div id="panel">GTFS ENGINE READY</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>

/* =========================
   🧠 STORAGE
========================= */

let GTFS = {
  stops:[],
  trips:[],
  stop_times:[]
};

let INDEX = {
  stop:{},
  trip:{}
};

/* =========================
   📦 PARSER
========================= */

function parse(text){
  const lines=text.trim().split("\n");
  const h=lines[0].split(",");

  return lines.slice(1).map(l=>{
    const o={};
    l.split(",").forEach((v,i)=>o[h[i]]=v);
    return o;
  });
}

/* =========================
   🧠 INDEX BUILD
========================= */

function buildIndex(){

  INDEX.stop={};
  INDEX.trip={};

  GTFS.stop_times.forEach(st=>{

    if(!INDEX.stop[st.stop_id])
      INDEX.stop[st.stop_id]=[];

    INDEX.stop[st.stop_id].push({
      trip:st.trip_id,
      time:st.departure_time
    });

    if(!INDEX.trip[st.trip_id])
      INDEX.trip[st.trip_id]=[];

    INDEX.trip[st.trip_id].push({
      stop:st.stop_id,
      time:st.departure_time
    });

  });

}

/* =========================
   ⏱ TIME ENGINE
========================= */

function nowSec(){
  const d=new Date();
  return d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds();
}

function toSec(t){
  const p=t.split(":");
  return (+p[0])*3600 + (+p[1])*60 + (+p[2]||0);
}

/* =========================
   🚏 CORE API
========================= */

function getDepartures(stop_id){

  const list=INDEX.stop[stop_id]||[];
  const now=nowSec();

  return list.map(d=>({
    trip:d.trip,
    time:d.time,
    diff:toSec(d.time)-now
  }))
  .sort((a,b)=>a.diff-b.diff)
  .slice(0,8);
}

/* =========================
   🧭 VIEW FILTER (ÓBUDA–SZENTENDRE)
========================= */

const VIEW_STOPS = ["BKS","KAS","OBU","AQI","RUF","SZT"];

function render(){

  let out="";

  VIEW_STOPS.forEach(s=>{

    const dep=getDepartures(s);

    dep.forEach(d=>{
      out+=`${s} | ${d.trip} | ${d.time} | ${d.diff}\n`;
    });

  });

  document.getElementById("panel").innerText=out;

}

/* =========================
   📦 LOAD GTFS
========================= */

document.getElementById("file").onchange=async e=>{

  const zip=await JSZip.loadAsync(e.target.files[0]);

  GTFS.stops=parse(await zip.file("stops.txt").async("string"));
  GTFS.trips=parse(await zip.file("trips.txt").async("string"));
  GTFS.stop_times=parse(await zip.file("stop_times.txt").async("string"));

  buildIndex();
  render();

};

setInterval(render,1000);

</script>

</body>
</html>
