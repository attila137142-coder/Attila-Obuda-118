<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Budai OSM Layer v1</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; font-family: Arial; }
#map { height:100vh; width:100%; }

.panel{
  position:absolute;
  top:10px;
  left:10px;
  z-index:9999;
  background:white;
  padding:10px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.3);
  font-size:13px;
  max-width:280px;
}

.item{
  margin-top:6px;
  padding:5px;
  background:#f4f4f4;
  border-left:4px solid green;
}
</style>
</head>

<body>

<div class="panel">
<b>🌲 Budai OSM Layer v1</b><br><br>

✔ turistaút háló<br>
✔ kattintható szakaszok<br>
✔ stabil render<br><br>

📦 kell: <b>budai.geojson</b><br><br>

<div id="info">Betöltés…</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// =========================
// STABIL MAP CORE
// =========================

const map = L.map('map').setView([47.52, 18.97], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

// =========================
// SIMPLE INFO
// =========================

let totalSegments = 0;

// =========================
// LOAD GEOJSON (OSM EXPORT)
// =========================

fetch("budai.geojson")
.then(r => r.json())
.then(data => {

  const layer = L.geoJSON(data, {

    style: function(){
      return {
        color: "green",
        weight: 4,
        opacity: 0.85
      };
    },

    onEachFeature: function(feature, layer){

      totalSegments++;

      let name =
        feature.properties?.name ||
        feature.properties?.ref ||
        "Turistaút";

      layer.bindPopup(
        "🌲 " + name
      );

      layer.on("click", function(e){
        L.popup()
        .setLatLng(e.latlng)
        .setContent(
          "🌲 Szakasz<br>" +
          "🧭 " + name
        )
        .openOn(map);
      });

    }

  }).addTo(map);

  map.fitBounds(layer.getBounds());

  document.getElementById("info").innerHTML =
    "✔ Betöltve<br>📊 szakaszok: " + totalSegments;

});

</script>

</body>
</html>
