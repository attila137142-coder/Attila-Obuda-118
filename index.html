<script>


console.log(
"GPS CORE kész"

// ==================================================
// ATTILA HYBRID WEATHER ENGINE V1.0 STABLE FIX
// MODUL 02
// REVERSE GEOCODING ENGINE
// GPS -> CÍM
// ==================================================


console.log(
"GEOCODING ENGINE indul..."
);



// utolsó lekért pont

let lastGeoLat = null;

let lastGeoLon = null;



let geoTimer = null;



// ------------------------------
// CÍM LEKÉRÉS
// OPENSTREETMAP NOMINATIM
// ------------------------------


async function getAddress(

lat,

lon

){



// túl gyakori lekérés ellen védelem


if(

lastGeoLat !== null

&&

Math.abs(lastGeoLat-lat)<0.00005

&&

Math.abs(lastGeoLon-lon)<0.00005

){

return;

}



lastGeoLat = lat;

lastGeoLon = lon;




try{



let url =


"https://nominatim.openstreetmap.org/reverse?format=json&lat="

+

lat

+

"&lon="

+

lon

+

"&zoom=18&addressdetails=1&accept-language=hu";





let response =

await fetch(url);




let data =

await response.json();




if(!data.address){

return;

}



let address =

data.address;





// ------------------------------
// CÍM MEZŐK
// ------------------------------



let country =

address.country

||

"--";




let postcode =

address.postcode

||

"--";




let city =


address.city

||

address.town

||

address.village

||

address.municipality

||

"--";




let street =


address.road

||

address.pedestrian

||

address.cycleway

||

"--";




let house =


address.house_number

||

"--";







// ------------------------------
// KIÍRÁS
// ------------------------------


document.getElementById(
"country"
).innerHTML =

country;



document.getElementById(
"zip"
).innerHTML =

postcode;



document.getElementById(
"city"
).innerHTML =

city;



document.getElementById(
"street"
).innerHTML =

street;



document.getElementById(
"houseNumber"
).innerHTML =

house;




console.log(

"Cím:",

country,

postcode,

city,

street,

house

);



}

catch(error){



console.log(

"Reverse geocoding hiba:",

error

);



}



}






// ------------------------------
// GPS KAPCSOLÁS
// ------------------------------
// A processGPS már létezik
// ezért kibővítjük


let oldProcessGPS =

processGPS;



processGPS =

function(position){



oldProcessGPS(position);




clearTimeout(
geoTimer
);



geoTimer =

setTimeout(

()=>{


getAddress(

position.coords.latitude,

position.coords.longitude

);


},

1500

);



};







// ------------------------------
// RENDSZER INDÍTÁS
// ------------------------------


console.log(

"GEOCODING ENGINE kész"

);

 <script>

// ==================================================
// ATTILA HYBRID WEATHER ENGINE V1.0 STABLE FIX
// MODUL 01
// GPS CORE + SMART SPEED ENGINE
// ==================================================

"GPS CORE indul..."
);


// ------------------------------
// GPS ADATTÁROLÓ
// ------------------------------


let gpsData = {

lat:0,

lon:0,

accuracy:0,

altitude:null,

speed:0,

heading:null,

timestamp:0

};



let lastPosition = null;


let gpsMarker = null;


let mapCentered = false;



// ------------------------------
// LEAFLET TÉRKÉP
// ------------------------------


let map =

L.map("map")

.setView(

[47.4979,19.0402],

10

);



L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19,

attribution:
"© OpenStreetMap"

}

).addTo(map);





// ------------------------------
// GPS INDÍTÁS
// ------------------------------


function startGPS(){


if(!navigator.geolocation){


document.getElementById(
"gpsStatus"
).innerHTML =
"🔴 GPS nem támogatott";


return;


}



navigator.geolocation.watchPosition(


position=>{


processGPS(position);


},


error=>{


console.log(
"GPS hiba:",
error.message
);


document.getElementById(
"gpsStatus"
).innerHTML =
"🔴 GPS hiba";


},


{


enableHighAccuracy:true,

maximumAge:1000,

timeout:10000


}


);



}





// ------------------------------
// GPS FELDOLGOZÁS
// ------------------------------


function processGPS(position){


let lat =
position.coords.latitude;


let lon =
position.coords.longitude;



let accuracy =
position.coords.accuracy;



let altitude =
position.coords.altitude;



let heading =
position.coords.heading;



let time =
Date.now();




// sebesség

let speed =

calculateSpeed(

lat,

lon,

time

);




// adatok mentése


gpsData.lat = lat;

gpsData.lon = lon;

gpsData.accuracy = accuracy;


gpsData.altitude =

(
altitude !== null &&
altitude !== undefined
)

?

altitude

:

null;



gpsData.speed = speed;


gpsData.heading = heading;


gpsData.timestamp = time;




updateGPSDisplay();


updateMap();



}





// ------------------------------
// KOORDINÁTA FORMÁZÁS
// 7 TIZEDES
// ------------------------------


function formatCoordinate(value){


return Number(value)

.toFixed(7);


}





// ------------------------------
// SMART SPEED ENGINE
// ------------------------------


function calculateSpeed(

lat,

lon,

time

){



if(!lastPosition){


lastPosition={

lat,

lon,

time

};


return 0;


}




let distance =

distanceMeters(

lastPosition.lat,

lastPosition.lon,

lat,

lon

);



let seconds =

(time-lastPosition.time)

/1000;



lastPosition={

lat,

lon,

time

};



if(seconds<=0){

return 0;

}



let speedMS =

distance / seconds;



// GPS ugrás szűrés


if(

gpsData.accuracy > 40

&&

speedMS > 5

){

return 0;

}




// irreális sebesség

if(speedMS > 60){


return 0;


}



return speedMS;



}







// ------------------------------
// HAVERSINE TÁVOLSÁG
// ------------------------------


function distanceMeters(

lat1,

lon1,

lat2,

lon2

){


const R=6371000;



let p1 =
lat1*Math.PI/180;


let p2 =
lat2*Math.PI/180;


let dp =
(lat2-lat1)

*Math.PI/180;



let dl =
(lon2-lon1)

*Math.PI/180;



let a =

Math.sin(dp/2)

*

Math.sin(dp/2)

+

Math.cos(p1)

*

Math.cos(p2)

*

Math.sin(dl/2)

*

Math.sin(dl/2);



let c =

2 *

Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);



return R*c;


}







// ------------------------------
// GPS KIJELZÉS
// ------------------------------


function updateGPSDisplay(){



document.getElementById(
"gpsStatus"
).innerHTML =
"🟢 AKTÍV";




document.getElementById(
"gpsAcc"
).innerHTML =

"±"

+

gpsData.accuracy.toFixed(1)

+

" m";





document.getElementById(
"coords"
).innerHTML =

formatCoordinate(
gpsData.lat
)

+

"<br>"

+

formatCoordinate(
gpsData.lon
);





// magasság


document.getElementById(
"elevation"
).innerHTML =


gpsData.altitude !== null

?

gpsData.altitude.toFixed(1)

+
" m"

:

"GPS adat nincs";






// irány


if(

gpsData.heading !== null

&&

!isNaN(gpsData.heading)

){


document.getElementById(
"heading"
).innerHTML =

gpsData.heading.toFixed(0)

+

"°";


}

else{


document.getElementById(
"heading"
).innerHTML =

"--";


}





// sebesség


let kmh =

gpsData.speed *

3.6;




document.getElementById(
"speed"
).innerHTML =


kmh.toFixed(2)

+

" km/h"

+

"<br>"

+

gpsData.speed.toFixed(3)

+

" m/s";



}







// ------------------------------
// TÉRKÉP FRISSÍTÉS
// ------------------------------


function updateMap(){



let pos = [

gpsData.lat,

gpsData.lon

];




if(!mapCentered){


map.setView(

pos,

16

);


mapCentered=true;


}




if(!gpsMarker){



gpsMarker =

L.marker(pos)

.addTo(map);



}

else{


gpsMarker.setLatLng(pos);


}




}

// ------------------------------

document.getElementById(

document.getElementById(

document.getElementById(

document.getElementById(

// ------------------------------

processGPS =

oldProcessGPS(position);




clearTimeout(
