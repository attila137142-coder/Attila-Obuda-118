<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>FUTÁR CONTROL ROOM V8 MOBILE LIVE</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
background:#070b10;
font-family:Arial,sans-serif;
color:#e8eefc;
overflow:hidden;
}

/* HEADER */

header{
height:68px;
background:#101826;
border-bottom:2px solid #00ffaa;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 12px;
}

.logo{
font-size:18px;
font-weight:bold;
color:#00ffaa;
}

.clockbox{
text-align:right;
}

#clock{
font-size:24px;
font-weight:bold;
color:#00ffaa;
}

#date{
font-size:11px;
color:#9db3d1;
}

/* MAIN */

.main{
display:grid;
grid-template-columns:320px 1fr;
height:calc(100vh - 68px);
}

/* SIDEBAR */

.sidebar{
background:#111c2b;
border-right:2px solid #1d2b3d;
overflow-y:auto;
padding:10px;
}

/* VIEWER */

.viewer{
position:relative;
background:black;
}

iframe{
width:100%;
height:100%;
border:none;
background:white;
}

/* SECTION */

.section{
margin-bottom:20px;
}

.section h2{
margin:0 0 10px 0;
font-size:14px;
color:#00ffaa;
border-bottom:1px solid #233246;
padding-bottom:6px;
}

/* GRID */

.grid{
display:grid;
gap:8px;
}

/* BUTTONS */

button{
width:100%;
padding:13px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:14px;
font-weight:bold;
color:white;
text-align:left;
transition:0.2s;
}

button:hover{
transform:scale(1.02);
opacity:0.95;
}

/* COLORS */

.bkk{background:#1d3d63;}
.volan{background:#5d3b16;}
.mav{background:#264f7d;}
.aev{background:#2f5d2f;}
.live{background:#204937;}
.map{background:#4d2d75;}
.search{background:#58390d;}
.station{background:#4d2032;}

/* INPUT */

input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#182334;
color:white;
font-size:15px;
}

/* STATUSBAR */

.statusbar{
position:absolute;
left:0;
right:0;
bottom:0;
height:42px;
background:#101826ee;
border-top:1px solid #233246;
display:flex;
align-items:center;
padding:0 12px;
font-size:12px;
color:#00ffaa;
overflow:hidden;
white-space:nowrap;
}

/* GPS PANEL */

.gpspanel{
background:#101925;
padding:12px;
border-radius:10px;
border:1px solid #233246;
}

.card{
margin-top:8px;
background:#162332;
padding:10px;
border-radius:8px;
font-size:13px;
line-height:1.5;
}

/* MOBILE */

@media(max-width:900px){

body{
overflow:auto;
}

.main{
grid-template-columns:1fr;
grid-template-rows:auto 1fr;
height:auto;
}

.sidebar{
height:auto;
border-right:none;
border-bottom:2px solid #1d2b3d;
}

.viewer{
height:65vh;
min-height:500px;
}

.logo{
font-size:15px;
}

#clock{
font-size:18px;
}

button{
font-size:13px;
padding:12px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
🚦 FUTÁR CONTROL ROOM V8
</div>

<div class="clockbox">
<div id="clock">00:00:00</div>
<div id="date"></div>
</div>

</header>

<div class="main">

<!-- SIDEBAR -->

<div class="sidebar">

<!-- SEARCH -->

<div class="section">

<h2>🔎 LIVE KERESŐK</h2>

<div class="grid">

<input id="bkkInput"
placeholder="BKK stop ID pl: CSF00457">

<button class="bkk"
onclick="openBKKStop()">
🚍 BKK / FUTÁR
</button>

<input id="volanInput"
placeholder="VOLÁN stop pl: 561442_0">

<button class="volan"
onclick="openVolanStop()">
🚌 VOLÁN
</button>

<input id="mavInput"
placeholder="MÁV állomás">

<button class="mav"
onclick="openMAV()">
🚆 MÁV
</button>

</div>

</div>

<!-- CSOPORTOS FORGALMIK -->

<div class="section">

<h2>🚏 CSOPORTOS FORGALMIK</h2>

<div class="grid">

<button class="station"
onclick="openPage('https://realtimenext.hu/embed/bkv/stops/CSF00065/schedule')">

<button class="station"
onclick="openPage('https://realtimenext.hu/embed/bkv/stops/CSF00438/schedule')">

</button>

<button class="station"
onclick="openPage('https://realtimenext.hu/embed/bkv/stops/CSF00667/schedule')">

</button>

<button class="station"
onclick="openPage('https://realtimenext.hu/embed/bkv/stops/CSF00611/schedule')">

</button>

<button class="station"
onclick="openPage('https://realtimenext.hu/embed/bkv/stops/CSF00137/schedule')">
🚏 Kolosy tér
</button>

<button class="station"
onclick="openPage('https://realtimenext.hu/embed/bkv/stops/CSF00234/schedule')">
🚏 Margit híd budai hídfő
</button>

<button class="station"
onclick="openPage('https://realtimenext.hu/embed/bkv/stops/CSF00457/schedule')">
🚏 Nád utca
</button>

<button class="station"
onclick="openPage('https://realtimenext.hu/embed/bkv/stops/CS008434/schedule')">

<button class="station"

<button class="station"
onclick="openPage('https://realtimenext.hu/embed/bkv/stops/CSF00621/schedule')">

<!-- MAV -->

<div class="section">

<h2>🚆 MÁV / PÁLYAUDVAROK</h2>

<div class="grid">

<button class="mav"
onclick="openPage('https://realtimenext.hu/embed/bkv/stops/005501016/schedule')">

</button>

<button class="mav"
onclick="openPage('https://realtimenext.hu/embed/bkv/stops/005510017/schedule')">

</button>

<button class="mav"
onclick="openPage('https://realtimenext.hu/embed/bkv/stops/005510033/schedule')">

<button class="mav"

🚆 Óbuda vasútállomás
</button>

</div>

</div>

<!-- MAP -->

<div class="section">

<h2>🛰 TÉRKÉPEK</h2>

<div class="grid">

<button class="map"
onclick="openExternal('https://map.realtimenext.hu/')">
🛰 BKK JÁRMŰKÖVETŐ
</button>

<button class="map"
onclick="openExternal('https://go.bkk.hu/')">
🌐 BudapestGO
</button>

<button class="map"
onclick="openExternal('https://futar.bkk.hu/')">

</button>

<button class="volan"
onclick="openExternal('https://utas.hu/')">

<button class="mav"
onclick="openExternal('https://mavplusz.hu/#/map')">

</div>

<!-- HOL A BUSZOM -->

<div class="section">

<h2>📍 HOL A BUSZOM?</h2>

<div class="gpspanel">

<div class="card">
🚍 243 BUSZ<br>
📍 kb. 1.2 km<br>
🕒 kb. 4 perc
</div>

<div class="card">
🚍 160 BUSZ<br>
📍 kb. 2.1 km<br>
🕒 kb. 7 perc
</div>

<div class="card">
🚋 H5 HÉV<br>
📍 kb. 3.8 km<br>
🕒 kb. 8 perc
</div>

<button class="search"
style="margin-top:10px;"
onclick="getLocation()">
📡 HELYZET FRISSÍTÉS
</button>

</div>

</div>

</div>

<!-- VIEWER -->

<div class="viewer">

<iframe id="frame"
src="https://realtimenext.hu/embed/bkv/stops/CSF00457/schedule">
</iframe>

<div class="statusbar"
id="statusbar">
🟢 FUTÁR CONTROL ROOM READY
</div>

</div>

</div>

<script>

/* CLOCK */

function updateClock(){

const now = new Date();

document.getElementById("clock").innerHTML =
now.toLocaleTimeString('hu-HU');

document.getElementById("date").innerHTML =
now.toLocaleDateString('hu-HU',{
year:'numeric',
month:'long',
day:'numeric',
weekday:'short'
});

}

setInterval(updateClock,1000);
updateClock();

/* OPEN PAGE */

function openPage(url){

const frame =
document.getElementById("frame");

frame.src = url;

document.getElementById("statusbar").innerHTML =
"📡 BETÖLTVE: " + url;

}

/* EXTERNAL */

function openExternal(url){

window.open(url,'_blank');

document.getElementById("statusbar").innerHTML =
"🌐 KÜLSŐ OLDAL: " + url;

}

/* BKK */

function openBKKStop(){

let id =
document.getElementById("bkkInput").value.trim();

if(!id){
alert("Adj meg BKK stop ID-t!");
return;
}

let url =
"https://realtimenext.hu/embed/bkv/stops/"
+ id +
"/schedule";

openPage(url);

}

/* VOLÁN */

function openVolanStop(){

let id =
document.getElementById("volanInput").value.trim();

if(!id){
alert("Adj meg VOLÁN stop ID-t!");
return;
}

if(!id.includes("_")){
id = id + "_0";
}

window.open(
"https://utas.hu/stop/hkir_" + id,
'_blank'
);

}

/* MAV */

function openMAV(){

let q =
document.getElementById("mavInput").value.trim();

if(!q){
alert("Adj meg MÁV állomást!");
return;
}

window.open(
"https://www.google.com/search?q="
+ encodeURIComponent(q + " MÁV"),
'_blank'
);

}

/* ENTER SUPPORT */

document.getElementById("bkkInput")
.addEventListener("keypress",function(e){

if(e.key==="Enter"){
openBKKStop();
}

});

document.getElementById("volanInput")
.addEventListener("keypress",function(e){

if(e.key==="Enter"){
openVolanStop();
}

});

document.getElementById("mavInput")
.addEventListener("keypress",function(e){

if(e.key==="Enter"){
openMAV();
}

});

/* GPS */

function getLocation(){

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(
function(position){

document.getElementById("statusbar").innerHTML =
"📍 GPS AKTÍV | "
+ position.coords.latitude.toFixed(5)
+ " , "
+ position.coords.longitude.toFixed(5);

},
function(){

alert("GPS hozzáférés elutasítva");

}
);

}else{

alert("GPS nem támogatott");

}

}

</script>

</body>
</html>
