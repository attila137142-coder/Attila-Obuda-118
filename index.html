<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>STABLE DISPATCHER CORE V2</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }
#map { height:100vh; width:100%; }

#panel{
  position:absolute;
  top:10px;
  left:10px;
  z-index:9999;
  background:white;
  padding:10px;
  border-radius:10px;
  width:260px;
  box-shadow:0 0 10px rgba(0,0,0,0.3);
}
.stop { cursor:pointer; padding:4px; }
.stop:hover { background:#eee; }
</style>
</head>

<body>

<div id="panel">
  <b>🟢 STABLE CORE V2</b><br><br>
  <input id="search" placeholder="keresés..." style="width:100%"><br><br>
  <div id="list">loading...</div>
  <hr>
  <div id="info">init...</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map;
let STOPS = [];
let markers = [];

function initMap(){
  try {
    map = L.map('map').setView([47.55,18.95],12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:18
    }).addTo(map);

    updateInfo("🟢 Map ready");
  } catch(e){
    console.error(e);
    document.body.innerHTML = "MAP ERROR";
  }
}

// ---------------- SAFE GTFS LOAD ----------------
async function loadGTFS(){
  try {
    updateInfo("⏳ GTFS loading...");

    const res = await fetch("gtfs.json");
    if(!res.ok) throw new Error("GTFS fetch failed");

    const data = await res.json();

    STOPS = data.stops || [];

    render(STOPS);
    drawMarkers(STOPS);

    updateInfo("🟢 GTFS loaded: " + STOPS.length);

  } catch(e){
    console.error(e);
    STOPS = [];

    updateInfo("❌ GTFS load failed (fallback mode)");
    render([]);
  }
}

// ---------------- RENDER LIST ----------------
function render(list=[]){
  const el = document.getElementById("list");
  el.innerHTML = "";

  if(list.length === 0){
    el.innerHTML = "no data";
    return;
  }

  list.forEach(s=>{
    const d = document.createElement("div");
    d.className = "stop";
    d.innerHTML = "📍 " + (s.name || "unknown");

    d.onclick = () => {
      if(s.lat && s.lon){
        map.setView([s.lat,s.lon],15);
      }
    };

    el.appendChild(d);
  });
}

// ---------------- MAP MARKERS ----------------
function drawMarkers(list=[]){

  markers.forEach(m=>map.removeLayer(m));
  markers = [];

  list.forEach(s=>{
    if(!s.lat || !s.lon) return;

    const m = L.marker([s.lat,s.lon]).addTo(map)
      .on("click", ()=>showStop(s));

    markers.push(m);
  });
}

// ---------------- STOP INFO ----------------
function showStop(s){
  updateInfo("📍 " + s.name);
}

// ---------------- SEARCH SAFE ----------------
document.getElementById("search").oninput = (e)=>{
  const q = e.target.value.toLowerCase();

  const filtered = STOPS.filter(s =>
    (s.name || "").toLowerCase().includes(q)
  );

  render(filtered);
};

// ---------------- UI ----------------
function updateInfo(t){
  document.getElementById("info").innerHTML = t;
}

// ---------------- INIT ----------------
initMap();
loadGTFS();

</script>

</body>
</html>
