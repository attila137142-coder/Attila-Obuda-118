<!DOCTYPE html>
</div>

<div id="map"></div>

<script>

let map = L.map('map').setView([47.4979, 19.0402], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

let userMarker;
let lastPos = null;
let lastTime = null;

// GPS tracking
navigator.geolocation.watchPosition(pos => {
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;
  const speed = pos.coords.speed || 0;

  if (!userMarker) {
    userMarker = L.marker([lat, lon]).addTo(map).bindPopup("📍 Te itt vagy");
  } else {
    userMarker.setLatLng([lat, lon]);
  }

  map.setView([lat, lon], 15);

  // speed m/s → km/h
  const kmh = speed * 3.6;

  document.getElementById("gps").innerHTML =
    `📍 GPS: ${lat.toFixed(6)}, ${lon.toFixed(6)}`;

  document.getElementById("speed").innerHTML =
    `🚀 Sebesség: ${kmh.toFixed(2)} km/h (${speed.toFixed(2)} m/s)`;

  lastPos = {lat, lon};
  lastTime = Date.now();

});

// Haversine
function distance(a, b) {
  const R = 6371000;
  const toRad = x => x * Math.PI / 180;

  const dLat = toRad(b.lat - a.lat);
  const dLon = toRad(b.lon - a.lon);

  const x = Math.sin(dLat/2)**2 +
            Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLon/2)**2;

  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

// POI scan (OSM)
async function scanNearbyPOI() {
  if (!lastPos) return;

  const query = `https://nominatim.openstreetmap.org/search?format=json&limit=20&extratags=1&addressdetails=1&viewbox=${lastPos.lon-0.02},${lastPos.lat+0.02},${lastPos.lon+0.02},${lastPos.lat-0.02}&bounded=1`;

  const res = await fetch(query);
  const data = await res.json();

  let html = "";

  data.forEach(poi => {
    const lat = parseFloat(poi.lat);
    const lon = parseFloat(poi.lon);

    const distM = distance(lastPos, {lat, lon});
    const distKm = distM / 1000;

    const label = poi.display_name;

    html += `
      <div class="poiBox">
        📍 ${label}<br>
        📏 ${distM.toFixed(0)} m (${distKm.toFixed(2)} km)<br>
      </div>
    `;

    L.circleMarker([lat, lon]).addTo(map);
  });

  document.getElementById("poiList").innerHTML = html;
}

</script>

</body>
