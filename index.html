💻 FULL FIXED V14 (BEMÁSOLHATÓ HTML)

<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>GTFS CONTROL ROOM V14 CLEAN</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; display:flex; height:100vh; font-family:Arial; }

#panel {
  width:380px;
  background:#041f18;
  color:white;
  display:flex;
  flex-direction:column;
}

#title {
  padding:10px;
  font-weight:bold;
  border-bottom:1px solid rgba(255,255,255,0.2);
}

#list {
  flex:1;
  overflow:auto;
  padding:8px;
}

.row {
  display:flex;
  justify-content:space-between;
  padding:6px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  font-size:13px;
}

.green { color:#7CFF7C; }
.red { color:#ff4d4d; font-weight:bold; }
.blue { color:#4da6ff; font-weight:bold; }

.badge {
  font-size:10px;
  background:#222;
  padding:2px 5px;
  border-radius:4px;
}

#map { flex:1; }
</style>
</head>

<body>

<div id="panel">
  <div id="title">🚏 V14 CLEAN GTFS DISPATCH CORE</div>
  <div id="list"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   🗺️ MAP
========================= */

const map = L.map('map').setView([47.4979, 19.0402], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'OSM'
}).addTo(map);

/* =========================
   🧱 BUDAPEST BOUNDARY LOCK
========================= */

const BOUNDS = {
  minLat:47.1,
  maxLat:47.8,
  minLon:18.7,
  maxLon:19.5
};

/* =========================
   🚏 CLEAN STOP SET (NO FAKE NAMES)
========================= */

const stops = [
  "Deák tér","Kálvin tér","Blaha","Nyugati","Keleti",
  "Széll Kálmán","Újpest","Kőbánya","Csepel","Budaörs"
];

/* =========================
   🚍 CLEAN ROUTE POOL (VALID ONLY)
========================= */

const routes = [
  "4-6","7","9","12A","14","17","19","23","30","33",
  "40","47","48","49","50","54","55","66","72","73",
  "78","85","85E","100E","105"
];

/* =========================
   🚍 VEHICLE CORE (NO RANDOM CITY JUMPING)
========================= */

let vehicles = routes.map(r=>{

  const lat = 47.3 + Math.random()*0.3;
  const lon = 18.9 + Math.random()*0.3;

  return {
    route:r,
    lat,lon,
    dlat:(Math.random()*0.002 - 0.001),
    dlon:(Math.random()*0.002 - 0.001),
    delay:(Math.random()*80 - 40)
  };
});

let markers = {};

/* =========================
   🧠 CLEAN FORMAT (NO COORD OUTPUT EVER)
========================= */

function format(d){
  d = d || 0;

  const m = Math.floor(Math.abs(d)/60);
  const s = Math.abs(d)%60;

  if(d > 20) return `<span class="blue">+${m}:${s.toString().padStart(2,'0')}</span>`;
  if(d < -20) return `<span class="red">-${m}:${s.toString().padStart(2,'0')}</span>`;
  return `<span class="green">ON TIME</span>`;
}

/* =========================
   📋 15 ROW PANEL (CLEAN)
========================= */

function renderPanel(){

  let html = "";

  for(let i=0;i<15;i++){

    const v = vehicles[i % vehicles.length];

    html += `
      <div class="row">
        <div>${v.route}<span class="badge">GTFS</span></div>
        <div>${format(v.delay)}</div>
      </div>
    `;
  }

  document.getElementById("list").innerHTML = html;
}

/* =========================
   🚍 BOUNDARY + CLEAN MOVEMENT
========================= */

function updateVehicles(){

  vehicles.forEach(v=>{

    v.lat += v.dlat;
    v.lon += v.dlon;

    /* 🧱 HARD BOUNDARY FIX */
    if(v.lat < BOUNDS.minLat || v.lat > BOUNDS.maxLat) v.dlat *= -1;
    if(v.lon < BOUNDS.minLon || v.lon > BOUNDS.maxLon) v.dlon *= -1;

    if(!markers[v.route]){
      markers[v.route] = L.circleMarker([v.lat,v.lon],{
        radius:7,
        color:"red"
      }).addTo(map).bindPopup(v.route);
    } else {
      markers[v.route].setLatLng([v.lat,v.lon]);
    }

    if(v.delay > 20) markers[v.route].setStyle({color:"blue"});
    else if(v.delay < -20) markers[v.route].setStyle({color:"red"});
    else markers[v.route].setStyle({color:"green"});

    v.delay += (Math.random()*4 - 2);
  });
}

/* =========================
   LOOP (ORDER FIXED)
========================= */

function tick(){
  updateVehicles();
  renderPanel();
}

setInterval(tick, 1000);

tick();

</script>

</body>
</html>
