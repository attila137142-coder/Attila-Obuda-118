<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>ATTILA GLOBAL FEED ENGINE V4</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body { margin:0; font-family:Arial; background:#0b1220; color:white; }
#map { height:70vh; }
.panel { padding:10px; background:#111a2e; }
pre { white-space:pre-wrap; font-size:12px; }
button { padding:8px; margin:5px; }
</style>
</head>

<body>

<div class="panel">
<h2>🚆 GLOBAL FEED MERGE ENGINE V4</h2>

<input type="file" id="zip" multiple accept=".zip">
<button onclick="loadZips()">LOAD GTFS ZIPS</button>
<button onclick="build()">BUILD GLOBAL NETWORK</button>

<div id="status">READY</div>
<pre id="log"></pre>
</div>

<div id="map"></div>

<script>

const map = L.map('map').setView([47.5,19.05],9);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'OSM'
}).addTo(map);

// ---------------- GLOBAL STATE ----------------
let rawFeeds = [];
let globalStops = [];

// ---------------- UTIL ----------------
function log(t){
    document.getElementById("log").innerText += t + "\n";
}

function setStatus(t){
    document.getElementById("status").innerText = t;
}

// ---------------- NORMALIZE ----------------
function norm(n){
    return (n||"")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/[^a-z0-9]/g,"");
}

// ---------------- DISTANCE ----------------
function dist(a,b){
    const dx = a.lat - b.lat;
    const dy = a.lon - b.lon;
    return Math.sqrt(dx*dx+dy*dy)*111000;
}

// ---------------- MERGE LOGIC ----------------
function shouldMerge(a,b){
    return dist(a,b) < 70 &&
           norm(a.name) === norm(b.name);
}

// ---------------- LOAD ZIP ----------------
async function loadZips(){

    const files = document.getElementById("zip").files;

    rawFeeds = [];

    for(let file of files){

        const zip = await JSZip.loadAsync(file);

        let feed = [];

        for(let name in zip.files){

            let text = await zip.files[name].async("string");

            if(name.includes("stops")){

                let parsed = Papa.parse(text,{
                    header:true,
                    skipEmptyLines:true
                });

                feed.push({
                    type:"stops",
                    data:parsed.data
                });
            }
        }

        rawFeeds.push(feed);

        log("Loaded ZIP: " + file.name);
    }

    setStatus("LOADED ✔");
}

// ---------------- BUILD ----------------
function build(){

    globalStops = [];

    log("=== BUILD START ===");

    for(let feed of rawFeeds){

        for(let part of feed){

            if(part.type !== "stops") continue;

            for(let s of part.data){

                let stop = {
                    name: s.stop_name,
                    lat: parseFloat(s.stop_lat),
                    lon: parseFloat(s.stop_lon),
                    feeds:1
                };

                if(isNaN(stop.lat) || isNaN(stop.lon)) continue;

                addGlobal(stop);
            }
        }
    }

    log("GLOBAL STOPS: " + globalStops.length);

    render();

    setStatus("ENGINE READY ✔");
}

// ---------------- GLOBAL MERGE ----------------
function addGlobal(stop){

    for(let g of globalStops){
        if(shouldMerge(g, stop)){
            g.feeds++;
            return;
        }
    }

    globalStops.push({
        ...stop,
        id:"G"+globalStops.length
    });
}

// ---------------- RENDER ----------------
function render(){

    map.eachLayer(l=>{
        if(l instanceof L.CircleMarker) map.removeLayer(l);
    });

    globalStops.forEach(s=>{

        let r = 3 + Math.min(s.feeds,5);

        L.circleMarker([s.lat,s.lon],{
            radius:r,
            color:"cyan"
        }).addTo(map)
        .bindPopup(
            `<b>${s.name}</b><br>feeds: ${s.feeds}<br>${s.id}`
        );
    });
}

</script>

</body>
</html>
