<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>REAL GTFS BACKEND CORE - TRANSPORT OS</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body{margin:0;font-family:Arial;background:#0f172a;color:#e2e8f0}
    header{padding:12px;background:#111827;display:flex;justify-content:space-between;align-items:center}
    h1{font-size:14px;margin:0}
    .btn{background:#2563eb;border:none;padding:8px 10px;color:#fff;border-radius:8px;cursor:pointer}
    .grid{display:grid;gap:10px;padding:10px}
    .card{background:#1f2937;padding:10px;border-radius:12px}
    input{width:100%;padding:10px;border-radius:8px;border:none;margin-top:5px}
    #map{height:320px;border-radius:12px}
    .resultBox{margin-top:8px;padding:8px;background:#111827;border-radius:8px;cursor:pointer}
    .tag{font-size:11px;padding:2px 6px;border-radius:6px;background:#374151;margin-left:5px}

    .late{color:#3b82f6}
    .early{color:#ef4444}
    .onTime{color:#e2e8f0}

    /* STATUS PANEL */
    #status{
      font-size:12px;
      line-height:1.6;
      white-space:pre-line;
      background:#0b1220;
      padding:10px;
      border-radius:8px;
      border:1px solid #374151;
    }
  </style>
</head>
<body>

<header>
  <h1>🚆 REAL GTFS TRANSPORT OS</h1>
  <button class="btn" onclick="toggleMenu()">Rendszer státusz</button>
</header>

<div class="grid">

  <div class="card">
    <h3>📦 GTFS KERESŐ</h3>
    <input id="search" placeholder="megálló / járat / id" oninput="querySystem()" />
    <div id="results"></div>
  </div>

  <div class="card">
    <h3>🗺️ TÉRKÉP</h3>
    <div id="map"></div>
  </div>

  <div class="card">
    <h3>📡 LIVE RENDSZER ÁLLAPOT</h3>
    <div id="status">Rendszer inicializálása...</div>
  </div>

</div>

<script>

// ===================== CORE MODEL =====================
let GTFS={stops:[],routes:[],trips:[],stopTimes:[]};
let map;

// ===================== LOAD =====================
function loadGTFS(){
  GTFS.stops=[
    {id:"S1",name:"Deák",lat:47.4975,lon:19.0550},
    {id:"S2",name:"Örs",lat:47.5017,lon:19.1356},
    {id:"S3",name:"Szob",lat:47.8213,lon:18.8626}
  ];

  GTFS.routes=[
    {id:"R1",name:"BKK 7E"},
    {id:"R2",name:"MÁV IR"}
  ];

  GTFS.trips=[
    {id:"T1",route:"R1",headsign:"Örs felé"},
    {id:"T2",route:"R2",headsign:"Szob felé"}
  ];

  GTFS.stopTimes=[
    {trip:"T1",stop:"S1",time:480},
    {trip:"T1",stop:"S2",time:500},
    {trip:"T2",stop:"S2",time:600},
    {trip:"T2",stop:"S3",time:720}
  ];

  setStatus("🟢 RENDSZER AKTÍV\nGTFS CORE BETÖLTVE\nSTOP: " + GTFS.stops.length + "\nROUTE: " + GTFS.routes.length);
}

// ===================== STATUS ENGINE =====================
function setStatus(txt){
  document.getElementById('status').innerText=txt;
}

// ===================== SEARCH =====================
function querySystem(){
  const q=document.getElementById('search').value.toLowerCase();
  const res=document.getElementById('results');
  res.innerHTML="";

  GTFS.stops
    .filter(s=>s.name.toLowerCase().includes(q)||s.id.toLowerCase().includes(q))
    .forEach(s=>{
      const div=document.createElement("div");
      div.className="resultBox";

      const trips=GTFS.stopTimes.filter(t=>t.stop===s.id);

      div.innerHTML=`🚏 ${s.name}<br>🆔 ${s.id}<br>🚆 ${trips.length} indulás`;

      div.onclick=()=>showStop(s);
      res.appendChild(div);
    });
}

// ===================== STOP VIEW =====================
function showStop(stop){
  const status=document.getElementById('status');

  const trips=GTFS.stopTimes.filter(t=>t.stop===stop.id);

  let out=`🚏 ${stop.name}\n🆔 ${stop.id}\n\nINDULÁSOK:\n`;

  trips.forEach(t=>{
    const trip=GTFS.trips.find(x=>x.id===t.trip);
    const route=GTFS.routes.find(r=>r.id===trip.route);

    const diff=t.time-480;
    let st="IDŐBEN";

    if(diff<0) st="🔵 KÉSIK " + Math.abs(diff) + "p";
    if(diff>10) st="🔴 SIET " + diff + "p";

    out+=`${route.name} | ${trip.headsign} | ${st}\n`;
  });

  setStatus(out);
}

// ===================== MAP =====================
window.onload=()=>{
  map=L.map('map').setView([47.5,19.05],10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  loadGTFS();

  GTFS.stops.forEach(s=>{
    L.marker([s.lat,s.lon]).addTo(map)
      .bindPopup(s.name)
      .on('click',()=>showStop(s));
  });
};

// ===================== MENU =====================
function toggleMenu(){
  setStatus("🟢 RENDSZER FUT\nLIVE GTFS CORE AKTÍV\nKERESÉS + TÉRKÉP + DISZPÉCSER OK");
}

</script>

</body>
</html>
