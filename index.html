<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATTILA TOP FILE SCANNER</title>

<style>
body { font-family: Arial; background:#0f172a; color:white; padding:15px }
h1 { margin-bottom:10px }
button { padding:10px; border:none; border-radius:8px; margin:5px; background:#22c55e; color:white; font-weight:bold }
.card { background:#1e293b; padding:10px; border-radius:10px; margin-top:10px }
.row { display:flex; justify-content:space-between; align-items:center; margin-top:6px }
img, video { max-width:80px; border-radius:6px }
.small { font-size:12px; opacity:0.7 }
</style>

</head>
<body>

<h1>💥 ATTILA TOP FILE SCANNER</h1>

<input type="file" id="files" multiple>
<br>
<button onclick="scan()">🔍 TOP FÁJLOK KERESÉSE</button>

<div id="output"></div>

<script>

let FILES=[];

document.getElementById("files").addEventListener("change", e=>{
  FILES=[...e.target.files];
});

function scan(){

  if(FILES.length===0){
    alert("Nincs fájl kiválasztva!");
    return;
  }

  let sorted=FILES.sort((a,b)=>b.size-a.size).slice(0,20);

  let html=`<div class="card"><b>Top ${sorted.length} legnagyobb fájl</b></div>`;

  sorted.forEach(f=>{

    let url=URL.createObjectURL(f);

    let preview="";

    if(f.type.startsWith("image")){
      preview=`<img src="${url}">`;
    } else if(f.type.startsWith("video")){
      preview=`<video src="${url}" controls></video>`;
    } else {
      preview=`📄`;
    }

    html+=`
      <div class="card">
        <div class="row">
          ${preview}
          <div>
            <b>${f.name}</b><br>
            <span class="small">${(f.size/1024/1024).toFixed(2)} MB</span>
          </div>
        </div>
      </div>
    `;
  });

  document.getElementById("output").innerHTML=html;
}

</script>

</body>
</html>
