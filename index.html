<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>TRANSIT FUSION CORE V6</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

header{
background:#111827;
padding:10px;
font-weight:bold;
display:flex;
justify-content:space-between;
}

.container{
display:grid;
grid-template-columns:360px 1fr;
height:90vh;
}

.left{
background:#1f2937;
padding:10px;
overflow:auto;
}

.box{
background:#111827;
padding:10px;
margin-bottom:10px;
border-radius:6px;
}

.row{
display:flex;
justify-content:space-between;
padding:8px;
border-bottom:1px solid #1f2937;
font-size:13px;
}

.badge{
font-size:11px;
padding:2px 6px;
background:#222;
border-radius:4px;
margin-left:5px;
}

.red{color:#ff4d4d;font-weight:bold;}
.blue{color:#4da6ff;font-weight:bold;}
.green{color:#7CFF7C;font-weight:bold;}

.small{font-size:11px;opacity:0.8;}
</style>
</head>

<body>

<header>
🚍 TRANSIT FUSION CORE V6
<div id="clock"></div>
</header>

<div class="container">

<!-- LEFT PANEL -->
<div class="left">

<div class="box">
<h3>🧠 REGION FILTER</h3>
<div>2-3 kerület + Szentendre + Agglo</div>
</div>

<div class="box">
<h3>🚏 CONTROL PANEL (15 sor)</h3>
<div id="panel"></div>
</div>

</div>

<!-- RIGHT (INFO ONLY) -->
<div class="left">

<div class="box">
<h3>📡 ENGINE STATUS</h3>
<div id="status">INIT</div>
</div>

<div class="box">
<h3>🚍 ROUTE CORE</h3>
<div class="small">
160 / 243 / 134 / H5 / VOLÁN SZENTENDRE
</div>
</div>

</div>

</div>

<script>

/* =========================
CLOCK
========================= */

function clock(){
document.getElementById("clock").innerText =
new Date().toLocaleTimeString();
}
setInterval(clock,1000);
clock();

/* =========================
ROUTE MODEL (FUSION CORE)
========================= */

const routes = [
{route:"160", id:"1600", type:"bus", region:"buda", baseDelay:30},
{route:"243", id:"2430", type:"bus", region:"buda", baseDelay:-40},
{route:"134", id:"1340", type:"bus", region:"buda", baseDelay:10},
{route:"H5", id:"H5", type:"HÉV", region:"corridor", baseDelay:0},
{route:"VOLÁN", id:"SZENT", type:"bus", region:"agglo", baseDelay:50},
{route:"7", id:"7007", type:"tram", region:"bp", baseDelay:-20},
{route:"4-6", id:"4600", type:"tram", region:"bp", baseDelay:80},
{route:"M2", id:"M2", type:"metro", region:"bp", baseDelay:120},
{route:"9", id:"9009", type:"bus", region:"bp", baseDelay:15},
{route:"12A", id:"120A", type:"bus", region:"bp", baseDelay:5},
{route:"8E", id:"8E00", type:"bus", region:"bp", baseDelay:-30},
{route:"23", id:"2300", type:"bus", region:"bp", baseDelay:40},
{route:"19", id:"1900", type:"tram", region:"bp", baseDelay:0},
{route:"1", id:"1001", type:"tram", region:"bp", baseDelay:60},
{route:"2", id:"2002", type:"tram", region:"bp", baseDelay:-10}
];

/* =========================
STATUS ENGINE
========================= */

function state(delay){

delay = Math.round(delay);

if(delay > 30)
return `<span class="red">🔴 SIET ${delay}s</span>`;

if(delay < -30)
return `<span class="blue">🔵 KÉSÉS ${Math.abs(delay)}s</span>`;

return `<span class="green">🟢 PONTOS</span>`;
}

/* =========================
CORE SIM ENGINE
========================= */

function update(){

let html = "";

for(let i=0;i<15;i++){

let v = routes[i];

v.baseDelay += (Math.random()*6 - 3);

let time = new Date();
time.setSeconds(time.getSeconds() + v.baseDelay);

html += `
<div class="row">
<div>
${v.route}
<span class="badge">${v.type}</span>
<div class="small">${v.id} • ${v.region}</div>
</div>

<div>
${state(v.baseDelay)}
<div class="small">${time.toLocaleTimeString()}</div>
</div>
</div>
`;
}

document.getElementById("panel").innerHTML = html;

document.getElementById("status").innerText =
"FUSION ACTIVE ✔";
}

/* =========================
LOOP
========================= */

setInterval(update,1000);
update();

</script>

</body>
</html>
