<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FUTÁR V5 FULL OPS + VEHICLE INTELLIGENCE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{margin:0;font-family:Arial;background:#0b0f14;color:#e6f1ff;}
header{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#111826;border-bottom:1px solid #1f2a3a;}
.container{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 50px);}
.sidebar{padding:10px;background:#0f1622;overflow:auto;border-right:1px solid #1f2a3a;}
.main{display:flex;flex-direction:column;}
#map{height:55%;}
.board{height:45%;overflow:auto;padding:10px;border-top:1px solid #1f2a3a;}

input,button{width:100%;padding:10px;margin:5px 0;border-radius:6px;border:none;}
button{background:#1f6feb;color:white;cursor:pointer;}
button:hover{background:#388bfd;}

.card{background:#1a2433;padding:10px;margin-top:10px;border-radius:8px;font-size:12px;}

.row{
display:grid;
grid-template-columns:110px 90px 80px 120px 100px;
padding:8px;
border-bottom:1px solid #1f2a3a;
font-size:12px;
}

.ok{color:#2ecc71;}
.warn{color:#ffcc00;}
.bad{color:#ff4d4d;}
.small{opacity:0.7;font-size:11px;}
</style>
</head>

<body>

<header>
<div>🚇 FUTÁR V5 FULL OPS + VEHICLE INTELLIGENCE</div>
<div id="clock"></div>
</header>

<div class="container">

<div class="sidebar">

<input type="file" id="gtfsFile"/>
<button onclick="loadGTFS()">📦 GTFS LOAD</button>

<div class="card" id="brain"></div>
<div class="card" id="ops"></div>

</div>

<div class="main">
<div id="map"></div>
<div class="board" id="board"></div>
</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>

// ================= CLOCK =================
setInterval(()=>{
document.getElementById("clock").innerText = new Date().toLocaleTimeString();
},1000);

// ================= MAP =================
const map = L.map("map").setView([47.4979,19.0402],12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

let markers = {};

// ================= STATE =================
const STATE = {
gtfs:null,
vehicles:[],
stops:[],
incidents:[]
};

// ================= DIST =================
function dist(a,b){
const R=6371000;
const dLat=(b.lat-a.lat)*Math.PI/180;
const dLon=(b.lng-a.lng)*Math.PI/180;
const x=Math.sin(dLat/2)**2+
Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ================= VEHICLE ENRICH =================
function enrich(v,i){

const types = ["BUS","HÉV","TRAM"];
const type = types[i % types.length];

const fleetId = type + "-" + (1000 + i);

// delay model
const delay = Math.round((Math.random()-0.4)*120);

// speed model
const speed = 20 + Math.random()*40;

return {
...v,
type,
fleetId,
delay,
speed
};
}

// ================= COLOR =================
function color(d){
if(d > 40) return "bad";
if(d < -20) return "warn";
return "ok";
}

// ================= LOAD GTFS =================
async function loadGTFS(){

const file = document.getElementById("gtfsFile").files[0];
if(!file) return alert("No GTFS ZIP");

const zip = await JSZip.loadAsync(file);

const read = async f =>
Papa.parse(await zip.file(f).async("string"),{header:true}).data;

const trips = await read("trips.txt");

STATE.vehicles = trips.slice(0,12).map((t,i)=>({

id: t.trip_id,
lat: 47.5 + Math.random()*0.1,
lng: 19 + Math.random()*0.1,
angle: Math.random()*Math.PI*2

}));

render();
}

// ================= MOVE =================
function move(){

STATE.vehicles.forEach(v=>{

v.lat += (Math.random()-0.5)*0.002;
v.lng += (Math.random()-0.5)*0.002;

if(!markers[v.id]){
markers[v.id] = L.marker([v.lat,v.lng]).addTo(map);
}else{
markers[v.id].setLatLng([v.lat,v.lng]);
}

});

}

// ================= BRAIN =================
function brain(){
return {
mode:"OPS ACTIVE",
msg:"Vehicle intelligence layer running"
};
}

// ================= RENDER =================
function render(){

document.getElementById("brain").innerHTML =
"<b>AI BRAIN</b><br>"+brain().msg;

document.getElementById("ops").innerHTML =
"VEHICLES: "+STATE.vehicles.length;

let board = document.getElementById("board");
board.innerHTML = "";

STATE.vehicles.forEach((v,i)=>{

const ev = enrich(v,i);
const cls = color(ev.delay);

board.innerHTML += `
<div class="row">
<div>${ev.fleetId}</div>
<div>${ev.type}</div>
<div>${Math.round(ev.speed)} km/h</div>
<div class="${cls}">
${ev.delay > 0 ? "+" : ""}${ev.delay}s
</div>
<div>LIVE</div>
</div>
`;
});

}

// ================= LOOP =================
setInterval(()=>{
if(STATE.vehicles.length){
move();
render();
}
},1500);

</script>

</body>
</html>
