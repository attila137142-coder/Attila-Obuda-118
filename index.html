<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GTFS PRO V24 TOUR ENGINE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{font-family:Arial;margin:0;background:#0f172a;color:#e2e8f0}
header{padding:10px;background:#111827;position:sticky;top:0;z-index:999}
button,input,select{padding:6px;margin:5px;border-radius:6px;border:0}
.card{background:#111827;margin:10px;padding:10px;border-radius:8px}
#map{height:360px;margin:10px;border-radius:10px}
.mode{font-weight:bold}
small{opacity:.7}
</style>
</head>
<body>

<header>
<b>🚀 GTFS PRO V24 TOUR ENGINE (Börzsöny / Pilis / Budai)</b><br>
<span class="mode" id="mode">SMART MODE</span><br>

<select id="source">
  <option value="github">📦 GTFS</option>
</select>

<select id="poiType">
  <option value="tourism">🏕 tourism</option>
  <option value="peak">⛰ peak</option>
  <option value="natural">🌲 natural</option>
  <option value="amenity">🏪 amenity</option>
</select>

<button onclick="loadGTFS()">GTFS LOAD</button>
<button onclick="startGPS()">📍 GPS</button>
<button onclick="tourSearch()">🧭 TOUR SEARCH</button>

<input id="search" placeholder="POI / hely / skanzen / Dobogókő..." oninput="searchStops()" />
</header>

<div id="map"></div>

<div class="card">
<b>📍 GPS</b>
<div id="gps">-</div>
</div>

<div class="card">
<b>🧭 TOUR RESULT</b>
<div id="tour">-</div>
</div>

<div class="card">
<b>📏 DISTANCE MODES</b><br>
<button onclick="mode='air'">Légvonal</button>
<button onclick="mode='road'">Út (OSRM)</button>
<button onclick="mode='hike'">Turista (fallback)</button>
<div id="dist">air</div>
</div>

<script>
let map,userMarker;
let userLat=47.4979,userLon=19.0402;
let mode="air";

function initMap(){
  map=L.map('map').setView([userLat,userLon],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  userMarker=L.marker([userLat,userLon]).addTo(map).bindPopup("Te");
}
initMap();

// ================= GPS =================
function startGPS(){
  navigator.geolocation.watchPosition(pos=>{
    userLat=pos.coords.latitude;
    userLon=pos.coords.longitude;

    document.getElementById("gps").innerText=`📍 ${userLat.toFixed(5)}, ${userLon.toFixed(5)}`;
    userMarker.setLatLng([userLat,userLon]);
    map.setView([userLat,userLon]);
  });
}

// ================= DIST =================
function dist(a,b,c,d){
  const R=6371000;
  const x=x=>x*Math.PI/180;
  const dLat=x(c-a);
  const dLon=x(d-b);
  const s=Math.sin(dLat/2)**2+
    Math.cos(x(a))*Math.cos(x(c))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}

// ================= TOUR SEARCH =================
async function tourSearch(){
  const q=document.getElementById("search").value;
  const type=document.getElementById("poiType").value;

  if(!q) return;

  document.getElementById("tour").innerHTML="🔄 keresés...";

  const bbox="47.2,18.6,47.9,19.6";

  const query=`[out:json];(
    node["name"~"${q}",i];
    node["tourism"](${bbox});
    node["natural"="peak"](${bbox});
  );out body;`;

  try{
    const r=await fetch("https://overpass-api.de/api/interpreter",{
      method:"POST",
      body:query
    });

    const j=await r.json();

    document.getElementById("tour").innerHTML=
      j.elements.slice(0,15).map(p=>{
        const d=dist(userLat,userLon,p.lat,p.lon);

        let routeInfo="";

        if(mode=="road") routeInfo="🚗 útvonal (OSRM)";
        if(mode=="hike") routeInfo="🥾 turista (becsült)";
        if(mode=="air") routeInfo="✈️ légvonal";

        return `📍 <b>${p.tags.name||"POI"}</b><br>
        📏 ${Math.round(d)} m (${routeInfo})<br>
        📌 ${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}<hr>`;
      }).join("");

  }catch(e){
    document.getElementById("tour").innerHTML="❌ TOUR ERROR (Overpass)";
  }
}

// ================= SIMPLE SEARCH =================
function searchStops(){
  const q=document.getElementById("search").value.toLowerCase();
  if(q.length<2) return;

  document.getElementById("tour").innerHTML=`🔎 keresés: ${q}`;
}
</script>

</body>
</html>
