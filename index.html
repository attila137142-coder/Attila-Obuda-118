<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Attila Közlekedés - GTFS PRO V11</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{font-family:Arial;margin:0;background:#0f172a;color:#e2e8f0}
header{padding:10px;background:#111827;position:sticky;top:0}
button{padding:8px 10px;margin:5px;border:0;border-radius:6px;background:#2563eb;color:white}
input{padding:6px;border-radius:6px;border:0;margin:5px}
.panel{padding:10px}
.card{background:#111827;padding:10px;margin:8px 0;border-radius:8px}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{border-bottom:1px solid #334155;padding:6px;text-align:left}
tr:hover{background:#1e293b;cursor:pointer}
</style>
</head>
<body>
<header>
<b>🚍 GTFS PRO V11</b>
<input type="file" id="zipInput" accept=".zip" />
<button onclick="loadGTFS()">GTFS betöltés</button>
<button onclick="getLocation()">📍 GPS</button>
<input id="search" placeholder="Megálló kereső..." oninput="searchStops()" />
</header>

<div class="panel">
<div class="card">
<b>📡 Részletes helyadat</b>
<div id="address">Nincs adat</div>
</div>

<div class="card">
<b>🚏 Legközelebbi megállók (TOP 5)</b>
<div id="nearest">Nincs adat</div>
</div>

<div class="card">
<b>📊 Indulási tábla</b>
<table id="departures">
<thead><tr><th>Idő</th><th>Járat</th><th>Irány</th></tr></thead>
<tbody></tbody>
</table>
</div>

<div class="card">
<b>🔎 Keresési találatok</b>
<div id="results"></div>
</div>
</div>

<script>
let stops=[], stopTimes=[], trips=[], routes=[];
let userLat=null,userLon=null;

function haversine(lat1, lon1, lat2, lon2){
  const R=6371000;
  const toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1);
  const dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

async function loadGTFS(){
  const file=document.getElementById("zipInput").files[0];
  if(!file) return alert("Válassz ZIP-et");

  const zip=await JSZip.loadAsync(file);

  const parse=async(name)=>{
    const txt=await zip.file(name).async("string");
    return Papa.parse(txt,{header:true}).data;
  }

  stops=await parse("stops.txt");
  stopTimes=await parse("stop_times.txt");
  trips=await parse("trips.txt");
  routes=await parse("routes.txt");

  alert("GTFS betöltve: "+stops.length);
}

function getLocation(){
  navigator.geolocation.getCurrentPosition(async pos=>{
    userLat=pos.coords.latitude;
    userLon=pos.coords.longitude;

    reverseGeocode();
    findNearest();
  });
}

// 🌍 cím lekérdezés
async function reverseGeocode(){
  try{
    const res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${userLat}&lon=${userLon}`);
    const data=await res.json();
    document.getElementById("address").innerHTML=
      `${data.address.country || ""}, ${data.address.city || data.address.town || ""}<br>${data.display_name}`;
  }catch(e){
    document.getElementById("address").innerText="Cím nem elérhető";
  }
}

function findNearest(){
  if(!stops.length) return;

  const list=stops
    .map(s=>{
      const d=haversine(userLat,userLon,parseFloat(s.stop_lat),parseFloat(s.stop_lon));
      return {...s,dist:d};
    })
    .sort((a,b)=>a.dist-b.dist)
    .slice(0,5);

  let html="";

  list.forEach(s=>{
    html+=`<div onclick="loadDepartures('${s.stop_id}')">
      🚏 <b>${s.stop_name}</b><br>
      ${Math.round(s.dist)} m
    </div><hr>`;
  });

  document.getElementById("nearest").innerHTML=html;
}

function loadDepartures(stopId){
  const tbody=document.querySelector("#departures tbody");
  tbody.innerHTML="";

  const list=stopTimes
    .filter(s=>s.stop_id===stopId)
    .slice(0,20);

  list.forEach(st=>{
    const trip=trips.find(t=>t.trip_id===st.trip_id);
    const route=routes.find(r=>r.route_id===trip.route_id);

    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${st.departure_time}</td>
      <td>${route?.route_short_name||"?"}</td>
      <td>${trip?.trip_headsign||"-"}</td>`;

    tbody.appendChild(tr);
  });
}

// 🔎 kereső
function searchStops(){
  const q=document.getElementById("search").value.toLowerCase();
  if(q.length<2) return;

  const res=stops
    .filter(s=>s.stop_name.toLowerCase().includes(q))
    .slice(0,20);

  let html="";

  res.forEach(s=>{
    html+=`<div onclick="loadDepartures('${s.stop_id}')">
      🚏 ${s.stop_name}
    </div>`;
  });

  document.getElementById("results").innerHTML=html;
}
</script>
</body>
</html>
