<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🚦 FUTÁR LIVE ENGINE V2</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#070b10;
  color:#d7e1ea;
}

header {
  padding:10px;
  background:#0f1621;
  border-bottom:2px solid #1f2a3a;
  display:flex;
  justify-content:space-between;
}

.clock {
  color:#4dd0e1;
  font-weight:bold;
}

.container {
  display:grid;
  grid-template-columns: 380px 1fr;
  height: calc(100vh - 50px);
}

.panel {
  background:#0f1621;
  padding:10px;
  overflow:auto;
  border-right:1px solid #1f2a3a;
}

.main {
  padding:10px;
  overflow:auto;
}

input, button {
  width:100%;
  margin-top:6px;
  padding:8px;
  background:#111826;
  color:#fff;
  border:1px solid #2b3b52;
}

button {
  background:#1e88e5;
  font-weight:bold;
  cursor:pointer;
}

table {
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

td, th {
  border:1px solid #2b3b52;
  padding:6px;
  font-size:12px;
}

th {
  background:#111826;
  color:#4dd0e1;
}

.badge {
  background:#1e88e5;
  padding:2px 6px;
  border-radius:4px;
}

.live {
  color:#00e676;
  font-weight:bold;
}
.warn {
  color:#ff5252;
}
</style>
</head>

<body>

<header>
<div>🚦 FUTÁR LIVE ENGINE V2</div>
<div class="clock" id="clock"></div>
</header>

<div class="container">

<!-- LEFT PANEL -->
<div class="panel">

<h3>📦 GTFS LOAD</h3>
<input type="file" id="zip"/>

<button onclick="loadGTFS()">⚡ LOAD GTFS ZIP</button>

<hr/>

<h3>🔍 STOP SEARCH</h3>
<input id="search" oninput="searchStops()"/>

<div id="results"></div>

<hr/>

<h3>📡 REALTIME LAYER</h3>
<button onclick="toggleRealtime()">LIVE MODE: OFF</button>

<div id="rtStatus" class="warn">REALTIME: DISCONNECTED</div>

</div>

<!-- MAIN -->
<div class="main">

<h2>🚏 STOP VIEW</h2>
<div id="stopInfo">No stop selected</div>

<table>
<thead>
<tr>
<th>Trip</th>
<th>Time</th>
<th>Status</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>

</div>

<script>

let GTFS = {stops:[], stopTimes:[]};
let RT_ENABLED = false;

// CLOCK
setInterval(()=>{
  document.getElementById("clock").innerText =
    new Date().toLocaleTimeString();
},1000);

// LOAD GTFS ZIP
async function loadGTFS(){
  const file = document.getElementById("zip").files[0];
  if(!file) return alert("Nincs ZIP!");

  const zip = await JSZip.loadAsync(file);

  GTFS.stops = parseCSV(await zip.file("stops.txt").async("string"));
  GTFS.stopTimes = parseCSV(await zip.file("stop_times.txt").async("string"));

  localStorage.setItem("futar_v2", JSON.stringify(GTFS));

  alert("GTFS betöltve!");
}

// CSV
function parseCSV(text){
  const lines = text.split("\n").filter(l=>l.trim());
  const headers = lines[0].split(",");

  return lines.slice(1).map(l=>{
    const obj={};
    const vals=l.split(",");
    headers.forEach((h,i)=>obj[h]=vals[i]);
    return obj;
  });
}

// SEARCH
function searchStops(){
  const q = document.getElementById("search").value.toLowerCase();

  const res = GTFS.stops.filter(s =>
    (s.stop_name||"").toLowerCase().includes(q)
  );

  document.getElementById("results").innerHTML =
    res.slice(0,40).map(r=>`
      <div onclick="selectStop('${r.stop_id}','${r.stop_name}')"
           style="padding:6px;border-bottom:1px solid #1f2a3a;cursor:pointer">
        🚏 ${r.stop_name}
      </div>
    `).join("");
}

// STOP SELECT
function selectStop(id,name){

  document.getElementById("stopInfo").innerHTML =
    `<h3>🚏 ${name}</h3><span class="badge">${id}</span>`;

  const trips = GTFS.stopTimes.filter(t=>t.stop_id===id);

  renderTrips(trips);
}

// RENDER TRIPS + REALTIME LAYER
function renderTrips(trips){

  document.getElementById("table").innerHTML =
    trips.slice(0,50).map(t=>{

      let status = "STATIC";

      if(RT_ENABLED){
        const delay = Math.floor(Math.random()*6-2); // sim realtime
        status = delay>2 ? "🟡 DELAYED" :
                 delay<0 ? "🔵 EARLY" :
                 "🟢 ON TIME";
      }

      return `
        <tr>
          <td>${t.trip_id}</td>
          <td>${t.arrival_time||"-"}</td>
          <td class="${RT_ENABLED?'live':''}">${status}</td>
        </tr>
      `;
    }).join("");
}

// REALTIME TOGGLE (HOOK POINT)
function toggleRealtime(){
  RT_ENABLED = !RT_ENABLED;

  document.getElementById("rtStatus").innerText =
    RT_ENABLED ? "REALTIME: SIMULATION ACTIVE" : "REALTIME: OFFLINE";

  document.getElementById("rtStatus").className =
    RT_ENABLED ? "live" : "warn";
}

// INIT CACHE
(function(){
  const saved = localStorage.getItem("futar_v2");
  if(saved){
    GTFS = JSON.parse(saved);
  }
})();

</script>

</body>
</html>
