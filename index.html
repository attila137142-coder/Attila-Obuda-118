<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Attila Közlekedés Control V_FIX Weather Engine V1.1
</title>


<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
background:#101820;
color:white;
font-family:Arial,Helvetica,sans-serif;

overflow:hidden;

}


/* FEJLÉC */

.header{

height:90px;

background:#07110b;

display:flex;

align-items:center;

justify-content:space-between;

padding:10px 25px;

border-bottom:3px solid #00ff66;

}


.title{

font-size:28px;
font-weight:bold;
color:#00ff66;

}


.version{

color:#ffcc00;
font-size:16px;

}


/* ÓRA */

.clock{

font-size:48px;

font-weight:bold;

color:#39ff14;

text-shadow:
0 0 10px #00ff66;

}


.date{

font-size:22px;

color:#ff9900;

font-weight:bold;

}



.clockbox{

text-align:center;

}



/* FŐ TERÜLET */

.main{

display:flex;

height:calc(100vh - 90px);

}



/* BAL MENÜ */

.sidebar{

width:280px;

background:#111;

padding:15px;

border-right:2px solid #333;

}



.menuTitle{

font-size:20px;

color:#00ffff;

margin-bottom:15px;

}



button{

width:100%;

padding:12px;

margin:5px 0;

background:#17202a;

border:1px solid #00ff66;

border-radius:8px;

color:white;

font-size:16px;

cursor:pointer;

}



button:hover{

background:#004d26;

}


.back{

border-color:#ff9900;

background:#442200;

}



/* TÉRKÉP */


.mapArea{

flex:1;

height:100%;

background:#202b33;

}



#map{

height:100%;

width:100%;

}




/* JOBB PANEL */

.rightPanel{

width:330px;

background:#0b0f12;

padding:15px;

overflow:auto;

border-left:2px solid #333;

}



.panel{

background:#141c22;

border:1px solid #00ff66;

border-radius:12px;

padding:15px;

margin-bottom:15px;

}



.panel h2{

margin-top:0;

color:#00ffff;

}



.weatherValue{

font-size:30px;

color:#39ff14;

font-weight:bold;

}



.info{

line-height:1.7;

}



.status{

background:#003300;

padding:10px;

border-radius:8px;

color:#00ff66;

}




#message{

background:#222;

padding:10px;

border-radius:8px;

color:#ffcc00;

margin-top:10px;

}


</style>

</head>


<body>



<div class="header">


<div class="title">

🚦 Attila Közlekedés Control

</div>


<div class="version">

V_FIX + Weather Engine V1.1

</div>


<div class="clockbox">


<div id="clock" class="clock">

00:00:00

</div>


<div id="date" class="date">

---

</div>


</div>


</div>




<div class="main">



<div class="sidebar">


<div class="menuTitle">

🛰️ VEZÉRLŐ MENÜ

</div>



<button onclick="showSearch()">

🔍 Megálló kereső

</button>


<button onclick="showTransport()">

🚆 MÁV / BKK / VOLÁN

</button>


<button onclick="showRealtime()">

📡 RealTimeNext

</button>


<button onclick="focusMap()">

🗺️ Térkép

</button>


<button onclick="showWeather()">

🌦️ Időjárás

</button>



<button class="back"
onclick="mainMenu()">

⬅ FŐMENÜ VISSZA

</button>



<div id="message">

Rendszer indul...

</div>



</div>





<div class="mapArea">


<div id="map">

</div>


</div>





<div class="rightPanel">



<div class="panel">


<h2>
🌦️ IDŐJÁRÁS
</h2>


<div class="weatherValue"
id="temp">

--.- °C

</div>


<div class="info">


📍 Hely:

<span id="place">
Betöltés...
</span>


<br>


🚉 Állomás:

<span id="station">
---</span>


<br>


📏 Távolság:

<span id="distance">
---</span>


<br><br>


📊 Aktuális MIN-MAX:

<span id="currentMM">
---</span>


<br>


☀️ Napi MIN-MAX:

<span id="dailyMM">
---</span>


</div>


</div>
