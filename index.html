<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FUTÁR V6.1 CORE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; background:#0b0f14; color:#fff; }

#map { height:72vh; }

#panel {
  height:28vh;
  background:#0f1722;
  padding:10px;
  overflow:auto;
}

.input {
  width:100%;
  padding:10px;
  background:#1b2636;
  border:none;
  color:white;
  margin-bottom:8px;
}

.card {
  background:#182233;
  padding:8px;
  margin:6px 0;
  border-radius:6px;
}
.btnrow button{
  margin-right:5px;
  background:#243447;
  color:white;
  border:none;
  padding:6px;
  border-radius:5px;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="panel">

  <div class="btnrow">
    <button onclick="setLayer('osm')">🗺 OSM</button>
    <button onclick="setLayer('dark')">🌙 Dark</button>
    <button onclick="setLayer('sat')">🛰 Sat</button>
  </div>

  <input id="search" class="input" placeholder="🔎 Megálló / járat keresés..." />
  <div id="results"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// ================= MAP LAYERS =================
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
const dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png');
const sat  = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');

const map = L.map('map', {
  center:[47.4979,19.0402],
  zoom:13,
  layers:[dark]
});

const layers = { osm, dark, sat };

function setLayer(name){
  Object.values(layers).forEach(l=>map.removeLayer(l));
  layers[name].addTo(map);
}

// ================= CLEAN GTFS DATA =================
const stops = [
  {name:"Deák Ferenc tér", lat:47.4975, lon:19.0540},
  {name:"Kálvin tér", lat:47.4893, lon:19.0619},
  {name:"Blaha Lujza tér", lat:47.4970, lon:19.0707},
  {name:"Nyugati pályaudvar", lat:47.5100, lon:19.0560}
];

let markers = stops.map(s=>{
  return L.marker([s.lat,s.lon]).addTo(map).bindPopup(s.name);
});

// ================= SEARCH ENGINE =================
const search = document.getElementById("search");
const results = document.getElementById("results");

search.addEventListener("input", (e)=>{
  const q = e.target.value.toLowerCase();

  const res = stops.filter(s=>s.name.toLowerCase().includes(q));

  if(q.length === 0){
    results.innerHTML = "🔵 Készen áll a keresés";
    return;
  }

  results.innerHTML = res.length
    ? res.map(r=>`
      <div class="card" onclick="goto(${r.lat},${r.lon})">
        🚏 ${r.name}
      </div>
    `).join("")
    : "❌ Nincs találat";
});

function goto(lat,lon){
  map.setView([lat,lon],16);
}

results.innerHTML = "🔵 FUTÁR V6.1 READY";
</script>

</body>
</html>
