<!-- ===== ATTILA CONTROL - GLASS CLOCK V2.0 ===== -->

<div id="akClockBox">

    <div id="akClock">
        00:00:00
    </div>

    <div id="akDate">
        2026.07.13. • HÉTFŐ
    </div>

</div>

<style>

#akClockBox{

    width:380px;
    margin:auto;

    padding:18px 24px;

    border-radius:22px;

    background:
        linear-gradient(
        180deg,
        rgba(42,35,92,.96),
        rgba(16,18,45,.96)
        );

    border:2px solid #8E72FF;

    backdrop-filter:blur(12px);

    box-shadow:

        inset 0 1px 0 rgba(255,255,255,.15),

        0 0 12px rgba(120,90,255,.45),

        0 0 35px rgba(70,90,255,.22),

        0 12px 30px rgba(0,0,0,.45);

    text-align:center;

    font-family:
    "Segoe UI",
    Arial,
    sans-serif;

}


/* Üveg csillanás */

#akClockBox::before{

    content:"";

    position:absolute;

    margin-left:-24px;

    margin-top:-18px;

    width:380px;

    height:42px;

    border-radius:22px 22px 0 0;

    background:

    linear-gradient(

    rgba(255,255,255,.18),

    rgba(255,255,255,0)

    );

    pointer-events:none;

}


/* Óra */

#akClock{

    font-size:60px;

    font-weight:700;

    letter-spacing:5px;

    color:#C890FF;

    text-shadow:

        0 0 8px #C890FF,

        0 0 18px #7A5BFF,

        0 0 28px #4D5BFF;

}


/* Vékony fénycsík */

#akClock::after{

    content:"";

    display:block;

    width:78%;

    height:2px;

    margin:12px auto;

    border-radius:3px;

    background:

    linear-gradient(
    to right,

    transparent,

    #8B6BFF,

    #58C9FF,

    #8B6BFF,

    transparent
    );

}


/* Dátum */

#akDate{

    font-size:22px;

    font-weight:700;

    letter-spacing:2px;

    color:#FFA726;

    text-shadow:

        0 0 6px #FFB347,

        0 0 14px rgba(255,170,0,.45);

}



</style>

<script>

function updateAKClock(){

    const d=new Date();

    document.getElementById("akClock").innerHTML=
        d.toLocaleTimeString("hu-HU");

    const date=d.toLocaleDateString("hu-HU",{

        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        weekday:"long"

    });

    document.getElementById("akDate").innerHTML=
        date.toUpperCase().replace(","," •");

}

updateAKClock();

setInterval(updateAKClock,1000);

</script>
