<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FAILSAFE CONTROL ROOM V2</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0b0f14;
    color:#d0e6ff;
}

header {
    padding:12px;
    background:#111826;
    border-bottom:1px solid #223;
    display:flex;
    justify-content:space-between;
}

.grid {
    display:grid;
    grid-template-columns: 1fr 1fr;
    height:calc(100vh - 50px);
}

.panel {
    border:1px solid #1f2a3a;
    margin:6px;
    padding:10px;
    background:#0f1622;
    overflow:auto;
}

h2 { font-size:14px; color:#7cc4ff; }

.bad { color:#ff6b6b; }
.good { color:#7CFF9E; }
.warn { color:#ffd37c; }

button {
    background:#1d2a3f;
    color:white;
    border:1px solid #2c3e55;
    padding:6px;
    margin:2px;
    cursor:pointer;
}

button:hover { background:#26364f; }

#log {
    font-size:12px;
    white-space:pre-wrap;
}
</style>
</head>

<body>

<header>
    <div>🧠 FAILSAFE CONTROL ROOM V2</div>
    <div>
        <button onclick="toggleSafe()">ROXY SAFE MODE</button>
        <button onclick="runAll()">RUN SYSTEM CHECK</button>
    </div>
</header>

<div class="grid">

    <div class="panel">
        <h2>DASHBOARD CORE</h2>
        <div id="status"></div>
    </div>

    <div class="panel">
        <h2>MAP / SIMULATION MODULE</h2>
        <div id="map">
            <button onclick="loadMap()">LOAD MAP MODULE</button>
        </div>
    </div>

    <div class="panel">
        <h2>FAILSAFE LOG</h2>
        <div id="log"></div>
    </div>

    <div class="panel">
        <h2>SYSTEM HEALTH</h2>
        <div id="health"></div>
    </div>

</div>

<script>

let safeMode = false;

function log(msg, type="info"){
    const el = document.getElementById("log");
    const color = type==="bad" ? "❌ " : type==="good" ? "✅ " : "ℹ️ ";
    el.innerText += color + msg + "\n";
}

// SAFE WRAPPER
function safeRun(name, fn){
    try {
        fn();
        log(name + " OK", "good");
    } catch(e){
        log(name + " FAILED: " + e.message, "bad");
        if(!safeMode){
            log("Failsafe activated for " + name, "warn");
        }
    }
}

function updateStatus(){
    const el = document.getElementById("status");
    el.innerHTML = `
        <div>MODE: ${safeMode ? "<span class='good'>SAFE</span>" : "<span class='warn'>NORMAL</span>"}</div>
        <div>MODULES: CORE / MAP / LOG / HEALTH</div>
    `;
}

function toggleSafe(){
    safeMode = !safeMode;
    log("Safe Mode: " + safeMode);
    updateStatus();
}

function loadMap(){
    safeRun("MAP MODULE", () => {
        const el = document.getElementById("map");

        // szimulált hiba lehetőség
        if(Math.random() < 0.3){
            throw new Error("Map API unreachable");
        }

        el.innerHTML = "<div class='good'>MAP LOADED (SIMULATION)</div>";
    });
}

function runHealth(){
    safeRun("HEALTH CHECK", () => {
        const el = document.getElementById("health");

        let cpu = Math.floor(Math.random()*100);
        let mem = Math.floor(Math.random()*100);

        el.innerHTML = `
            CPU: ${cpu}%<br>
            MEM: ${mem}%<br>
            STATUS: ${cpu>80 ? "<span class='bad'>OVERLOAD</span>" : "<span class='good'>OK</span>"}
        `;
    });
}

function runAll(){
    log("SYSTEM CHECK START");

    safeRun("DASHBOARD", updateStatus);
    safeRun("MAP", loadMap);
    safeRun("HEALTH", runHealth);

    log("SYSTEM CHECK END");
}

// auto boot
runAll();

</script>

</body>
</html>
