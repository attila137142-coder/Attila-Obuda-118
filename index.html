<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FUTÁR V5 Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #e6f1ff;
    }

    header {
      padding: 16px;
      background: #111826;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2a3a;
    }

    header h1 {
      font-size: 18px;
      margin: 0;
      color: #6cc0ff;
    }

    .container {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 60px);
    }

    .sidebar {
      background: #0f1622;
      padding: 12px;
      border-right: 1px solid #1f2a3a;
      overflow-y: auto;
    }

    .main {
      display: flex;
      flex-direction: column;
    }

    .panel {
      padding: 12px;
      border-bottom: 1px solid #1f2a3a;
    }

    input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #1a2433;
      color: white;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #1f6feb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #388bfd;
    }

    .board {
      padding: 12px;
      overflow-y: auto;
      flex: 1;
    }

    .row {
      display: grid;
      grid-template-columns: 80px 1fr 120px 120px;
      padding: 10px;
      border-bottom: 1px solid #1f2a3a;
      font-size: 14px;
    }

    .status-green { color: #2ecc71; }
    .status-red { color: #ff4d4d; }
    .status-gray { color: #aaa; }

    .small {
      font-size: 12px;
      opacity: 0.8;
    }

    .title {
      font-size: 14px;
      margin-bottom: 8px;
      color: #6cc0ff;
    }
  </style>
</head>
<body>

<header>
  <h1>🚍 FUTÁR V5 LIVE DASHBOARD</h1>
  <div id="clock"></div>
</header>

<div class="container">

  <div class="sidebar">
    <div class="title">Megálló kereső</div>
    <input id="stopInput" placeholder="Pl: Deák Ferenc tér" />
    <button onclick="loadDepartures()">Keresés</button>

    <div class="panel small">
      GTFS DEMO MODE ACTIVE<br/>
      (szimulált adatok)
    </div>
  </div>

  <div class="main">
    <div class="panel">
      <b>Valós indulási tábla (15 sor)</b>
    </div>
    <div class="board" id="board"></div>
  </div>

</div>

<script>

// ------------------------------
// DEMO GTFS ADATOK (SZIMULÁLT)
// ------------------------------

const stops = {
  "deak": "Deák Ferenc tér",
  "batthyany": "Batthyány tér",
  "bikas": "Bikás park"
};

function generateDepartures() {
  const routes = ["M1", "M2", "M3", "4-6", "7", "9", "17"];
  const list = [];

  for (let i = 0; i < 30; i++) {
    const route = routes[Math.floor(Math.random() * routes.length)];
    const min = Math.floor(Math.random() * 60);
    const hour = new Date().getHours();

    const delay = Math.floor(Math.random() * 20 - 5);

    list.push({
      route,
      headsign: "Központ felé",
      time: `${hour}:${String(min).padStart(2, "0")}`,
      delay
    });
  }

  return list.sort((a, b) => a.delay - b.delay);
}

let currentData = [];

function renderBoard(data) {
  const board = document.getElementById("board");
  board.innerHTML = "";

  data.slice(0, 15).forEach(d => {
    let cls = "status-gray";
    if (d.delay <= 0) cls = "status-red";
    else if (d.delay < 5) cls = "status-green";

    board.innerHTML += `
      <div class="row">
        <div><b>${d.route}</b></div>
        <div>${d.headsign}</div>
        <div>${d.time}</div>
        <div class="${cls}">${d.delay} perc</div>
      </div>
    `;
  });
}

function loadDepartures() {
  const stop = document.getElementById("stopInput").value;
  if (!stop) return;

  currentData = generateDepartures();
  renderBoard(currentData);
}

// clock
function updateClock() {
  const now = new Date();
  document.getElementById("clock").innerText = now.toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

// auto refresh demo
setInterval(() => {
  if (currentData.length > 0) {
    currentData = generateDepartures();
    renderBoard(currentData);
  }
}, 8000);

</script>

</body>
</html>
