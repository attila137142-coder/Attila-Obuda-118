<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>ATTILA KÖZLEKEDÉS V4-E</title>

<style>

body{
    margin:0;
    background:#071018;
    color:#00ff9d;
    font-family:Arial;
}

header{
    background:#0f1a2a;
    padding:14px;
    font-size:22px;
    font-weight:bold;
    border-bottom:1px solid #00ff9d33;
}

.top{
    padding:10px;
    background:#0c1522;
}

input{
    width:100%;
    padding:14px;
    background:#101d2d;
    border:none;
    color:#00ff9d;
    font-size:18px;
}

.results{
    max-height:240px;
    overflow:auto;
    background:#0b1622;
}

.stop{
    padding:10px;
    border-bottom:1px solid #00ff9d11;
    cursor:pointer;
}

.stop:hover{
    background:#13253b;
}

.panel{
    padding:10px;
}

.row{
    display:grid;
    grid-template-columns:90px 1fr 80px 90px;
    padding:10px;
    border-bottom:1px solid #00ff9d11;
    font-size:15px;
}

.line{
    color:#ffd166;
    font-weight:bold;
}

.time{
    color:white;
}

.live{
    color:#00ff9d;
}

.delay{
    color:#ff5a5a;
}

.sub{
    color:#9ecfff;
    font-size:12px;
}

</style>
</head>

<body>

<header>
🚦 ATTILA KÖZLEKEDÉS // UNIFIED SEARCH ENGINE V4-E
</header>

<div class="top">

<input
id="search"
placeholder="🚏 Megálló keresése... (pl: Nás utca / Tahitótfalu)"
oninput="searchStops()"
/>

<div class="results" id="results"></div>

</div>

<div class="panel" id="panel">

<h2>🚏 Válassz megállót</h2>

</div>

<script>

// 🚏 UNIFIED STOP CACHE
// BKK + VOLÁN DEMO STRUCTURE

const stops = [

{
id:"BKK_001",
name:"Nás utca",
type:"BKK"
},

{
id:"VOLAN_002",
name:"Tahitótfalu, hídfő",
type:"VOLÁN"
},

{
id:"BKK_003",
name:"Nyugati pályaudvar",
type:"BKK"
},

{
id:"BKK_004",
name:"Kelenföld vasútállomás",
type:"BKK"
},

{
id:"VOLAN_005",
name:"Szentendre, autóbusz-állomás",
type:"VOLÁN"
},

{
id:"VOLAN_006",
name:"Vác, autóbusz-állomás",
type:"VOLÁN"
},

{
id:"BKK_007",
name:"Batthyány tér",
type:"BKK"
},

{
id:"BKK_008",
name:"Újpest-központ",
type:"BKK"
}

];

// 🧠 ÉKEZETFÜGGETLEN MOTOR

function normalize(str){

    return str
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"");

}

// 🔍 KERESŐ

function searchStops(){

    const q =
        normalize(
            document
            .getElementById("search")
            .value
        );

    const results =
        document.getElementById("results");

    results.innerHTML = "";

    if(q.length < 2) return;

    const filtered =
        stops.filter(s=>

            normalize(s.name)
            .includes(q)

        );

    filtered
        .slice(0,30)
        .forEach(stop=>{

        const div =
            document.createElement("div");

        div.className = "stop";

        div.innerHTML = `

            🚏 ${stop.name}
            <div class="sub">
                ${stop.type}
            </div>

        `;

        div.onclick =
            ()=>loadStop(stop);

        results.appendChild(div);

    });

}

// 🚍 REALTIME STYLE PANEL

function loadStop(stop){

    document
    .getElementById("results")
    .innerHTML = "";

    const panel =
        document.getElementById("panel");

    panel.innerHTML =
        `<h2>🚏 ${stop.name}</h2>`;

    const lines = [

        "4","6","7","8E",
        "M2","M3","M4",
        "105","133E",
        "14","47","49",
        "880","890","895"

    ];

    for(let i=0;i<15;i++){

        const mins =
            Math.floor(Math.random()*15)+1;

        const delayed =
            Math.random() > 0.82;

        panel.innerHTML += `

        <div class="row">

            <div class="line">
                ${lines[i]}
            </div>

            <div>
                Irány ${i+1}
            </div>

            <div class="time">
                ${mins} perc
            </div>

            <div class="${
                delayed
                ? 'delay'
                : 'live'
            }">

                ${
                    delayed
                    ? 'KÉSIK'
                    : 'LIVE'
                }

            </div>

        </div>

        `;
    }

}

</script>

</body>
</html>
