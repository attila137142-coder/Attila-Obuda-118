<script>

// GTFS STORAGE
let GTFS_STOPS = [];

/* =========================
   GTFS LOADER (CSV PARSER)
========================= */

function parseCSV(text){
const lines = text.trim().split("\n");
const headers = lines[0].split(",");

return lines.slice(1).map(line=>{
const cols = line.split(",");
let obj = {};
headers.forEach((h,i)=> obj[h] = cols[i]);
return obj;
});
}

/* =========================
   LOAD GTFS STOPS.TXT
========================= */

async function loadGTFSStops(url){
const res = await fetch(url);
const text = await res.text();

const data = parseCSV(text);

GTFS_STOPS = data.map(s=>({
id: s.stop_id,
name: s.stop_name,
lat: parseFloat(s.stop_lat),
lon: parseFloat(s.stop_lon)
}));

console.log("GTFS STOPS LOADED:", GTFS_STOPS.length);
initStopsOnMap();
}

/* =========================
   MAP INIT FROM REAL DATA
========================= */

let stopMarkers = [];

function initStopsOnMap(){

stopMarkers.forEach(m=>map.removeLayer(m));
stopMarkers = [];

GTFS_STOPS.forEach(s=>{
if(!s.lat || !s.lon) return;

const marker = L.marker([s.lat,s.lon])
.addTo(map)
.bindPopup(`<b>${s.name}</b><br>${s.id}`);

stopMarkers.push(marker);
});
}

/* =========================
   SEARCH SWITCH
========================= */

function searchStops(q){
return GTFS_STOPS.filter(s=>
(s.name || "").toLowerCase().includes(q) ||
(s.id || "").toLowerCase().includes(q)
);
}

</script>
