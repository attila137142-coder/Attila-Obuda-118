<script>
let DB = { stops: [] };

function loadAllSources(){

  const bkkStops = [
    {id:"BKK_001", name:"Deák Ferenc tér", provider:"BKK"},
    {id:"BKK_002", name:"Kálvin tér", provider:"BKK"}
  ];

  const mavStops = [
    {id:"MAV_101", name:"Budapest-Keleti", provider:"MÁV"}
  ];

  const volanStops = [
    {id:"VOL_201", name:"Népliget autóbusz-pályaudvar", provider:"VOLÁN"}
  ];

  DB.stops = [...bkkStops, ...mavStops, ...volanStops];

  console.log("✅ BETÖLTVE:", DB.stops.length, DB.stops);
}

/* 🔍 DEBUG KERESÉS */
function searchAll(){

  console.log("🔎 SEARCH CLICKED");

  const input = document.getElementById("q");
  const q = input.value.toLowerCase().trim();

  console.log("QUERY:", q);
  console.log("DB SIZE:", DB.stops.length);

  const results = DB.stops.filter(s =>
    s.name.toLowerCase().includes(q) ||
    s.id.toLowerCase().includes(q)
  );

  console.log("RESULTS:", results);

  const box = document.getElementById("results");
  box.innerHTML = "";

  if(results.length === 0){
    box.innerHTML = "<b>❌ Nincs találat</b>";
    return;
  }

  results.forEach(s=>{
    const div = document.createElement("div");
    div.style.padding="10px";
    div.style.borderBottom="1px solid #333";

    div.innerHTML = `
      <b>${s.name}</b><br>
      ${s.provider} | ${s.id}
    `;

    box.appendChild(div);
  });
}

/* 🚀 FONTOS: kötelező init */
window.onload = function(){
  loadAllSources();
};
</script>
