html <!DOCTYPE html> <html lang="hu"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>V11 MINI BKK CONTROL ROOM</title> <style> body{ margin:0; font-family:Arial; background:#0b1220; color:#e5e7eb; } header{ background:#111827; padding:14px; text-align:center; font-size:18px; color:#38bdf8; font-weight:bold; } .container{ display:flex; flex-direction:column; height:100vh; } .panel{ padding:10px; border-bottom:1px solid #1f2937; } input,button{ width:100%; padding:10px; margin-top:6px; border-radius:8px; border:none; } input{ background:#1f2937; color:white; } button{ background:#38bdf8; font-weight:bold; cursor:pointer; } button:hover{ background:#0ea5e9; } #map{ flex:1; display:flex; align-items:center; justify-content:center; color:#64748b; font-size:16px; } .log{ height:180px; overflow:auto; font-size:12px; background:#0a0f1a; padding:8px; border-top:1px solid #1f2937; } </style> </head> <body> <header> 🚦 MINI BKK CONTROL ROOM V11.2 </header> <div class="container"> <div class="panel"> <input id="q" placeholder="Megálló keresés (pl: Skanzen, Királyrét, Tahitótfalu)"> <button onclick="search()">KERESÉS</button> <button onclick="dispatch()">DISPATCH</button> </div> <div id="map"> 🗺️ CONTROL MAP (GTFS + REALTIME LAYER PLACEHOLDER) </div> <div class="log" id="log"></div> </div> <script> // ---------------- CORE ---------------- let LOCK = false; let LAST = ""; // ---------------- GTFS MOCK ---------------- let STOPS = [ {id:"SKANZEN", name:"Skanzen"}, {id:"KIRALYRET", name:"Királyrét"}, {id:"TAHITOTFALU", name:"Tahitótfalu"}, {id:"HIDFO", name:"Hídfő"}, {id:"NAD", name:"Nád utca"} ]; // ---------------- ALIAS SYSTEM (EZ A LÉNYEG) ---------------- const ALIASES = { "skanzen": ["skanzen", "szentendre skanzen", "skanzen muzeum"], "kiralyret": ["királyrét", "kiralyret", "király rét", "királyrét völgy"], "tahitotfalu": ["tahitótfalu", "tahi", "tahitotfalu"], "hidfo": ["hídfő", "hidfo", "híd fő"], "nád utca": ["nád utca", "nad utca", "nád", "nad"] }; // ---------------- LOG ---------------- function log(m){ let el=document.getElementById("log"); el.innerHTML+=m+"<br>"; el.scrollTop=el.scrollHeight; } // ---------------- NORMALIZE ---------------- function normalize(s){ return s.toLowerCase() .replaceAll("á","a") .replaceAll("é","e") .replaceAll("í","i") .replaceAll("ó","o") .replaceAll("ö","o") .replaceAll("ő","o") .replaceAll("ú","u") .replaceAll("ü","u"); } // ---------------- SEARCH ENGINE ---------------- function search(){ let q=document.getElementById("q").value.trim(); let nq=normalize(q); if(LOCK){ log("⛔ LOCK ACTIVE"); return; } if(q===LAST){ log("🔁 DUPLIKÁLT KÉRÉS BLOKKOLVA"); return; } LAST=q; LOCK=true; setTimeout(()=>LOCK=false,300); log("🔎 Keresés: "+q); // 1. alias check (EZ FIXEZI A SKANZENT + KIRÁLYRÉT + stb) let aliasMatch=null; for(let key in ALIASES){ if(ALIASES[key].some(a=> normalize(a).includes(nq))){ aliasMatch=key; break; } } let results=[]; if(aliasMatch){ results=STOPS.filter(s=> normalize(s.id).includes(aliasMatch)); } else { results=STOPS.filter(s=> normalize(s.name).includes(nq) || normalize(s.id).includes(nq) ); } if(results.length===0){ log("❌ Nincs találat → fallback AI mód"); log("🧠 manuális dispatcher routing aktiv"); return; } results.forEach(r=>{ log("✅ TALÁLAT: "+r.name+" ("+r.id+")"); }); } // ---------------- DISPATCH ---------------- let DISPATCH=false; function dispatch(){ if(DISPATCH){ log("⛔ DISPATCH már fut"); return; } DISPATCH=true; log("🚦 CONTROL ROOM DISPATCH START"); setTimeout(()=>{ log("🧠 route: AUTO CONTROL ENGINE"); log("⚡ status: OPTIMIZING NETWORK"); log("📊 confidence: 0.91"); log("✔️ VEZÉRLŐTEREM KÉSZ"); DISPATCH=false; },400); } log("🚀 MINI BKK VEZÉRLŐTEREM BETÖLTVE"); </script> </body> </html> ``` --- # 🚨
