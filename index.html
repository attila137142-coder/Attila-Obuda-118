<script>

/* ============================================================
   EXPLICIT MEZŐKERESÉS
   ============================================================ */

function explicitField(
  obj,
  names
){

  if(
    !obj ||
    typeof obj !== "object"
  ){
    return null;
  }

  for(
    const name of names
  ){

    if(
      Object.prototype.hasOwnProperty.call(
        obj,
        name
      )
    ){

      const value =
        obj[name];

      if(
        value !== null &&
        value !== undefined &&
        String(value).trim() !== ""
      ){

        return value;

      }

    }

  }

  /*
    Néhány FUTÁR válaszban a járműadat
    külön vehicle objektumban található.
  */

  if(
    obj.vehicle &&
    typeof obj.vehicle === "object"
  ){

    for(
      const name of names
    ){

      if(
        Object.prototype.hasOwnProperty.call(
          obj.vehicle,
          name
        )
      ){

        const value =
          obj.vehicle[name];

        if(
          value !== null &&
          value !== undefined &&
          String(value).trim() !== ""
        ){

          return value;

        }

      }

    }

  }

  return null;

}


/* ============================================================
   EXPLICIT MÉLY MEZŐKERESÉS
   ============================================================ */

function explicitDeepField(
  obj,
  names,
  depth=0
){

  if(
    !obj ||
    typeof obj !== "object" ||
    depth > 6
  ){

    return null;

  }

  const direct =
    explicitField(
      obj,
      names
    );

  if(
    direct !== null
  ){

    return direct;

  }

  for(
    const key of Object.keys(obj)
  ){

    /*
      references alatt rengeteg olyan objektum
      lehet, amely nem maga a jármű.
    */

    if(
      key === "references"
    ){

      continue;

    }

    const child =
      obj[key];

    if(
      child &&
      typeof child === "object"
    ){

      const found =
        explicitDeepField(
          child,
          names,
          depth + 1
        );

      if(
        found !== null
      ){

        return found;

      }

    }

  }

  return null;

}


/* ============================================================
   FUTÁR NORMALIZÁLÁS
   ============================================================ */

function normalizeFutarVehicle(
  obj
){

  const loc =
    obj.location ??
    obj.position ??
    obj.vehicle?.location ??
    obj.vehicle?.position ??
    {};

  const lat =
    num(
      loc.lat ??
      loc.latitude
    );

  const lon =
    num(
      loc.lon ??
      loc.longitude
    );


  const routeIdRaw =
    explicitDeepField(
      obj,
      [
        "routeId"
      ]
    );

  const routeId =
    routeIdRaw === null
      ?
      String(
        obj.trip?.routeId ??
        ""
      )
      :
      String(
        routeIdRaw
      );


  const tripIdRaw =
    explicitDeepField(
      obj,
      [
        "tripId"
      ]
    );

  const tripId =
    tripIdRaw === null
      ?
      String(
        obj.trip?.tripId ??
        ""
      )
      :
      String(
        tripIdRaw
      );


  const vehicleIdRaw =
    explicitDeepField(
      obj,
      [
        "vehicleId"
      ]
    );

  const vehicleId =
    vehicleIdRaw === null
      ?
      String(
        obj.id ??
        ""
      )
      :
      String(
        vehicleIdRaw
      );


  const licensePlate =
    explicitDeepField(
      obj,
      [
        "licensePlate",
        "licencePlate",
        "plate"
      ]
    );


  const label =
    explicitDeepField(
      obj,
      [
        "label"
      ]
    );


  /*
    ==========================================================
    FORGALMI

    FONTOS:

    NEM:
      LABEL
      vehicleId
      rendszám

    Csak valódi, explicit forgalmi mezőt fogadunk el.
    ==========================================================
  */

  const forgalmi =
    explicitDeepField(
      obj,
      [
        "forgalmi",
        "forgalmiSzam",
        "forgalmi_szam",
        "forgalmiNumber",
        "forgalmi_number",
        "fleetNumber",
        "fleetNo",
        "fleet_number",
        "vehicleNumber",
        "vehicle_number",
        "internalNumber",
        "internal_number",
        "fleetId",
        "fleet_id"
      ]
    );


  /*
    ==========================================================
    FORDA

    BKK/FUTÁR forrásból nem gyártunk FORDÁT.
    ==========================================================
  */

  const forda =
    null;


  /*
    ==========================================================
    JÁRMŰTÍPUS

    Az általános "type" SZÁNDÉKOSAN NINCS itt.
    ==========================================================
  */

  const vehicleType =
    explicitDeepField(
      obj,
      [
        "vehicleType",
        "vehicle_type",
        "vehicleTypeName",
        "vehicle_type_name",
        "vehicleModel",
        "vehicle_model",
        "vehicleModelName",
        "vehicle_model_name",
        "modelName",
        "model_name",
        "model"
      ]
    );


  /*
    ==========================================================
    BLOKK
    ==========================================================
  */

  const blockId =
    explicitDeepField(
      obj,
      [
        "blockId",
        "block_id",
        "blockIdentifier",
        "block_identifier",
        "blockNumber",
        "block_number",
        "blokkAzonosito",
        "blokk_azonosito",
        "blokkId",
        "blokk_id"
      ]
    );


  const blockVehicleNumber =
    explicitDeepField(
      obj,
      [
        "blockVehicleNumber",
        "block_vehicle_number",
        "vehicleNumberInBlock",
        "vehicle_number_in_block",
        "jarmuNumber",
        "jarmu_number",
        "jarmuNo",
        "jarmu_no"
      ]
    );


  const lowFloor =
    explicitDeepField(
      obj,
      [
        "lowFloor",
        "low_floor",
        "lowfloor",
        "alacsonypadlos"
      ]
    );


  /*
    ==========================================================
    SEBESSÉG
    ==========================================================
  */

  let speedKmh =
    null;


  /*
    Explicit km/h mező előnyben.
  */

  const explicitSpeedKmh =
    explicitDeepField(
      obj,
      [
        "speedKmh",
        "speed_kmh",
        "speedKmH",
        "speed_km_h"
      ]
    );


  if(
    explicitSpeedKmh !== null
  ){

    const n =
      Number(
        explicitSpeedKmh
      );

    if(
      Number.isFinite(n)
    ){

      speedKmh =
        n;

    }

  }


  /*
    Ha nincs explicit km/h,
    a position.speed GTFS-RT/FUTÁR szerint m/s.
  */

  if(
    !Number.isFinite(speedKmh)
  ){

    const nestedSpeed =
      num(
        obj.position?.speed ??
        obj.vehicle?.position?.speed ??
        obj.vehicle?.speed
      );

    if(
      Number.isFinite(
        nestedSpeed
      )
    ){

      speedKmh =
        nestedSpeed * 3.6;

    }

  }


  const bearing =
    num(
      obj.bearing ??
      obj.position?.bearing ??
      obj.vehicle?.bearing ??
      obj.vehicle?.position?.bearing
    );


  const stopId =
    String(
      obj.stopId ??
      obj.vehicle?.stopId ??
      ""
    );


  const rawSequence =
    obj.stopSequence ??
    obj.vehicle?.stopSequence ??
    null;


  const stopSequence =
    rawSequence !== null &&
    rawSequence !== undefined &&
    rawSequence !== ""
      ?
      Number(
        rawSequence
      )
      :
      null;


  return {

    vehicleId,

    label:
      label === null
        ?
        ""
        :
        String(
          label
        ),

    licensePlate:
      licensePlate === null
        ?
        ""
        :
        String(
          licensePlate
        ),

    forgalmi:
      forgalmi === null
        ?
        null
        :
        String(
          forgalmi
        ).trim(),

    forda,

    vehicleType:
      vehicleType === null
        ?
        null
        :
        String(
          vehicleType
        ).trim(),

    blockId:
      blockId === null
        ?
        null
        :
        String(
          blockId
        ).trim(),

    blockVehicleNumber:
      blockVehicleNumber === null
        ?
        null
        :
        String(
          blockVehicleNumber
        ).trim(),

    lowFloor:
      lowFloor === null
        ?
        null
        :
        lowFloor,

    routeId,

    tripId,

    lat,

    lon,

    speedKmh,

    bearing,

    stopId,

    stopSequence

  };

}


/* ============================================================
   FUTÁR → BKK ILLESZTÉS
   ============================================================ */

function matchFutarToVehicle(
  fv
){

  let best =
    null;


  /*
    1. vehicleId
  */

  if(
    fv.vehicleId
  ){

    best =
      vehicleData.find(
        v =>
        sameId(
          v.vehicleId,
          fv.vehicleId
        )
      );

  }


  /*
    2. tripId
  */

  if(
    !best &&
    fv.tripId
  ){

    best =
      vehicleData.find(
        v =>
        sameId(
          v.tripId,
          fv.tripId
        )
      );

  }


  /*
    3. valódi rendszám
  */

  if(
    !best &&
    fv.licensePlate
  ){

    best =
      vehicleData.find(
        v =>
        v.licensePlate &&
        sameId(
          v.licensePlate,
          fv.licensePlate
        )
      );

  }


  return best || null;

}


/* ============================================================
   FUTÁR LEKÉRÉS
   ============================================================ */

async function loadFutarVehicles(
  fallbackMode=false
){

  if(
    !getKey()
  ){

    $("futarHttp").textContent =
      "API-KULCS KELL";

    return false;

  }


  try{

    const center =
      getGpsQueryCenter();


    const url =
      FUTAR_URL +
      "?key=" +
      encodeURIComponent(
        getKey()
      ) +
      "&version=3" +
      "&appVersion=" +
      encodeURIComponent(
        "AttilaKozlekedes-Vadasz"
      ) +
      "&lat=" +
      encodeURIComponent(
        center.lat
      ) +
      "&lon=" +
      encodeURIComponent(
        center.lon
      ) +
      "&latSpan=" +
      encodeURIComponent(
        center.latSpan
      ) +
      "&lonSpan=" +
      encodeURIComponent(
        center.lonSpan
      ) +
      "&includeReferences=true";


    setBadge(
      "futarBadge",
      "FUTÁR: LEKÉRÉS...",
      "warn"
    );


    const res =
      await fetch(
        url,
        {
          cache:
            "no-store"
        }
      );


    const text =
      await res.text();


    $("futarHttp").textContent =
      res.status;


    $("futarTime").textContent =
      nowText();


    if(
      !res.ok
    ){

      throw new Error(
        "HTTP " +
        res.status +
        " " +
        text.slice(
          0,
          180
        )
      );

    }


    let json;

    try{

      json =
        JSON.parse(
          text
        );

    }catch(e){

      throw new Error(
        "nem JSON válasz"
      );

    }


    const rawVehicles =
      extractFutarVehicles(
        json
      );


    const normalized =
      rawVehicles
        .map(
          normalizeFutarVehicle
        )
        .filter(
          v =>
            v.vehicleId ||
            (
              Number.isFinite(
                v.lat
              ) &&
              Number.isFinite(
                v.lon
              )
            )
        );


    futarVehicleCache =
      new Map();


    for(
      const fv of normalized
    ){

      const key =
        fv.vehicleId ||
        (
          fv.tripId +
          "|" +
          fv.routeId
        );


      if(
        key
      ){

        futarVehicleCache.set(
          key,
          fv
        );

      }

    }


    let matched =
      0;


    for(
      const fv of normalized
    ){

      const target =
        matchFutarToVehicle(
          fv
        );


      if(
        !target
      ){

        continue;

      }


      target.futarMatched =
        true;


      target.futarLabel =
        fv.label ||
        null;


      if(
        fv.licensePlate
      ){

        target.licensePlate =
          fv.licensePlate;

      }


      /*
        ======================================================
        FORGALMI
        ======================================================

        Csak explicit FUTÁR mezőből írjuk be.
        ======================================================
      */

      if(
        fv.forgalmi
      ){

        target.forgalmi =
          fv.forgalmi;

      }


      /*
        BKK-nál nincs kitalált FORDA.
      */

      target.forda =
        null;


      /*
        JÁRMŰTÍPUS csak valódi explicit mezőből.
      */

      if(
        fv.vehicleType
      ){

        target.vehicleType =
          fv.vehicleType;

      }


      if(
        fv.blockId
      ){

        target.blockId =
          fv.blockId;

      }


      if(
        fv.blockVehicleNumber
      ){

        target.blockVehicleNumber =
          fv.blockVehicleNumber;

      }


      if(
        fv.lowFloor !== null &&
        fv.lowFloor !== undefined
      ){

        target.lowFloor =
          fv.lowFloor;

      }


      if(
        !Number.isFinite(
          target.lat
        ) &&
        Number.isFinite(
          fv.lat
        ) &&
        Number.isFinite(
          fv.lon
        )
      ){

        target.lat =
          fv.lat;

        target.lon =
          fv.lon;

      }


      if(
        !Number.isFinite(
          target.speedKmh
        ) &&
        Number.isFinite(
          fv.speedKmh
        )
      ){

        target.speedKmh =
          fv.speedKmh;

      }


      if(
        !Number.isFinite(
          target.bearing
        ) &&
        Number.isFinite(
          fv.bearing
        )
      ){

        target.bearing =
          fv.bearing;

      }


      if(
        !target.stopId &&
        fv.stopId
      ){

        target.stopId =
          fv.stopId;

      }


      if(
        !Number.isFinite(
          target.stopSequence
        ) &&
        Number.isFinite(
          fv.stopSequence
        )
      ){

        target.stopSequence =
          fv.stopSequence;

      }


      if(
        target.routeId
      ){

        target.routeShortName =
          gtfsRoutes.get(
            String(
              target.routeId
            )
          ) ||
          target.routeShortName ||
          "";

      }


      matched++;

    }


    $("futarCount").textContent =
      normalized.length.toLocaleString(
        "hu-HU"
      );


    $("futarMatched").textContent =
      matched.toLocaleString(
        "hu-HU"
      );


    setBadge(
      "futarBadge",
      "FUTÁR: OK (" +
      normalized.length +
      ")",
      "ok"
    );


    lastFutarFetchOK =
      true;


    /*
      FUTÁR fallback:

      csak akkor veszünk fel új járművet,
      ha a GTFS-RT valóban nem működik.
    */

    if(
      fallbackMode &&
      !lastVehicleFetchOK
    ){

      const known =
        new Set(
          vehicleData.map(
            v =>
            normalizeId(
              v.vehicleId
            )
          )
        );


      for(
        const fv of normalized
      ){

        if(
          !Number.isFinite(
            fv.lat
          ) ||
          !Number.isFinite(
            fv.lon
          )
        ){

          continue;

        }


        if(
          fv.vehicleId &&
          known.has(
            normalizeId(
              fv.vehicleId
            )
          )
        ){

          continue;

        }


        const item = {

          source:
            "BKK FUTÁR",

          provider:
            "BKK",

          vehicleId:
            fv.vehicleId,

          label:
            fv.label,

          licensePlate:
            fv.licensePlate,

          routeId:
            fv.routeId,

          routeShortName:
            gtfsRoutes.get(
              String(
                fv.routeId
              )
            ) || "",

          tripId:
            fv.tripId,

          directionId:
            "",

          stopId:
            fv.stopId,

          stopSequence:
            fv.stopSequence,

          lat:
            fv.lat,

          lon:
            fv.lon,

          speedKmh:
            fv.speedKmh,

          bearing:
            fv.bearing,

          /*
            FONTOS:
            FUTÁR fallbackből nem találunk ki késést.
          */

          delaySeconds:
            null,

          forgalmi:
            fv.forgalmi,

          forda:
            null,

          vehicleType:
            fv.vehicleType,

          blockId:
            fv.blockId,

          blockVehicleNumber:
            fv.blockVehicleNumber,

          lowFloor:
            fv.lowFloor,

          futarMatched:
            true,

          futarLabel:
            fv.label ||
            null,

          nearestStop:
            null,

          gpsDistanceKm:
            null,

          marker:
            null

        };


        item.nearestStop =
          findStopById(
            item.stopId
          ) ||
          findNearestStop(
            item.lat,
            item.lon
          );


        item.gpsDistanceKm =
          myPos
            ?
            distanceKm(
              myPos,
              item
            )
            :
            null;


        vehicleData.push(
          item
        );


        if(
          item.vehicleId
        ){

          known.add(
            normalizeId(
              item.vehicleId
            )
          );

        }

      }


      $("vehicleCount").textContent =
        vehicleData.length.toLocaleString(
          "hu-HU"
        );

    }


    logLine(
      "FUTÁR jármű API OK: " +
      normalized.length.toLocaleString(
        "hu-HU"
      ) +
      " rekord, " +
      matched.toLocaleString(
        "hu-HU"
      ) +
      " illesztés."
    );


    /*
      ========================================================
      STATIKUS / KIEGÉSZÍTŐ MEZŐK
      ========================================================
    */

    refreshStaticVehicleFields();


    updateVehicleDistances();

    renderVehicles();

    refreshMarkers();


    return true;


  }catch(err){

    lastFutarFetchOK =
      false;


    setBadge(
      "futarBadge",
      "FUTÁR: HIBA",
      "err"
    );


    $("futarHttp").textContent =
      "HIBA";


    logLine(
      "FUTÁR API HIBA: " +
      (
        err?.message ||
        err
      )
    );


    return false;

  }

}


/* ============================================================
   STATIKUS JÁRMŰMEZŐK FRISSÍTÉSE
   ============================================================ */

/*
  FONTOS:

  Ez a függvény NEM talál ki semmilyen adatot.

  Ha a FUTÁR már adott explicit FORGALMI /
  JÁRMŰTÍPUS / BLOKK adatot, azt megtartjuk.

  Ha nincs adat, NINCS ADAT marad.

  A GTFS-RT alapadatokat nem írjuk felül.
*/

function refreshStaticVehicleFields(){

  for(
    const item of vehicleData
  ){

    /*
      FORDA:

      BKK esetén mindig null.
      HÉV/MÁV későbbi integrációnál
      a meglévő valódi adat megmarad.
    */

    if(
      item.provider === "BKK" ||
      item.source === "BKK GTFS-RT" ||
      item.source === "BKK FUTÁR"
    ){

      item.forda =
        null;

    }


    /*
      Ha nincs routeShortName,
      de routeId alapján van GTFS route,
      használjuk a valódi GTFS adatot.
    */

    if(
      (
        !item.routeShortName ||
        item.routeShortName === ""
      ) &&
      item.routeId
    ){

      const routeName =
        gtfsRoutes.get(
          String(
            item.routeId
          )
        );


      if(
        routeName
      ){

        item.routeShortName =
          routeName;

      }

    }


    /*
      Megálló:

      először az explicit stopId,
      csak utána földrajzi keresés.
    */

    if(
      !item.nearestStop
    ){

      if(
        item.stopId
      ){

        item.nearestStop =
          findStopById(
            item.stopId
          );

      }


      if(
        !item.nearestStop &&
        Number.isFinite(item.lat) &&
        Number.isFinite(item.lon)
      ){

        item.nearestStop =
          findNearestStop(
            item.lat,
            item.lon
          );

      }

    }

  }

}


/* ============================================================
   GPS
   ============================================================ */

function startGPS(){

  if(
    !navigator.geolocation
  ){

    setBadge(
      "gpsBadge",
      "GPS: NEM TÁMOGATOTT",
      "err"
    );


    logLine(
      "A böngésző nem támogat geolocationt."
    );


    return;

  }


  if(
    gpsWatchId !== null
  ){

    navigator.geolocation.clearWatch(
      gpsWatchId
    );

  }


  setBadge(
    "gpsBadge",
    "GPS: KERESÉS...",
    "warn"
  );


  gpsWatchId =
    navigator.geolocation.watchPosition(

      updateGPS,

      err=>{

        setBadge(
          "gpsBadge",
          "GPS: HIBA",
          "err"
        );


        logLine(
          "GPS HIBA: " +
          (
            err?.message ||
            "ismeretlen"
          )
        );

      },

      {

        enableHighAccuracy:
          true,

        maximumAge:
          5000,

        timeout:
          15000

      }

    );


  logLine(
    "GPS figyelés elindítva."
  );

}


function updateGPS(
  position
){

  const c =
    position.coords;


  myPos = {

    lat:
      Number(
        c.latitude
      ),

    lon:
      Number(
        c.longitude
      ),

    accuracy:
      Number(
        c.accuracy
      )

  };


  $("gpsLat").textContent =
    myPos.lat.toFixed(8);


  $("gpsLon").textContent =
    myPos.lon.toFixed(8);


  $("gpsAcc").textContent =
    Number.isFinite(
      myPos.accuracy
    )
      ?
      Math.round(
        myPos.accuracy
      ) + " m"
      :
      "NINCS ADAT";


  setBadge(
    "gpsBadge",
    "GPS: OK",
    "ok"
  );


  if(
    !myMarker
  ){

    myMarker =
      L.circleMarker(
        [
          myPos.lat,
          myPos.lon
        ],
        {

          radius:
            8,

          color:
            "#ffffff",

          weight:
            2,

          fillColor:
            "#00d4ff",

          fillOpacity:
            0.95

        }
      )
      .addTo(
        map
      );


    myMarker.bindPopup(
      "SAJÁT GPS"
    );


  }else{

    myMarker.setLatLng(
      [
        myPos.lat,
        myPos.lon
      ]
    );

  }


  const nearest =
    findNearestStop(
      myPos.lat,
      myPos.lon
    );


  $("gpsNearest").textContent =
    nearest
      ?
      nearest.name +
      " (" +
      mText(
        nearest.distanceM
      ) +
      ")"
      :
      "NINCS ADAT";


  updateVehicleDistances();

  renderVehicles();

  refreshMarkers();

}


/* ============================================================
   JÁRMŰ TÁVOLSÁGOK
   ============================================================ */

function updateVehicleDistances(){

  for(
    const item of vehicleData
  ){

    item.gpsDistanceKm =
      myPos
        ?
        distanceKm(
          myPos,
          item
        )
        :
        null;


    /*
      A jármű saját pozíciójához
      tartozó megállótávot újraszámoljuk.
    */

    if(
      item.nearestStop &&
      Number.isFinite(item.lat) &&
      Number.isFinite(item.lon)
    ){

      item.nearestStop.distanceM =
        distanceKm(
          {
            lat:
              item.lat,

            lon:
              item.lon
          },
          item.nearestStop
        ) * 1000;

    }

  }

}


/* ============================================================
   SZŰRÉS
   ============================================================ */

function vehicleSearchText(
  item
){

  return [

    item.routeId,

    item.routeShortName,

    item.label,

    item.forda,

    item.licensePlate,

    item.forgalmi,

    item.vehicleType,

    item.vehicleId,

    item.tripId,

    item.stopId,

    item.nearestStop?.name,

    item.source,

    item.provider,

    item.futarLabel

  ]
  .filter(
    x =>
      x !== null &&
      x !== undefined
  )
  .join(" ")
  .toLowerCase();

}


function matchesFilters(
  item
){

  const universal =
    normalize(
      $("universalSearch").value
    );


  const route =
    normalize(
      $("routeSearch").value
    );


  const plate =
    normalize(
      $("plateSearch").value
    );


  if(
    universal &&
    !vehicleSearchText(item).includes(
      universal
    )
  ){

    return false;

  }


  if(
    route
  ){

    const r1 =
      normalize(
        item.routeId
      );

    const r2 =
      normalize(
        item.routeShortName
      );

    if(
      !r1.includes(route) &&
      !r2.includes(route)
    ){

      return false;

    }

  }


  if(
    plate
  ){

    const p1 =
      normalize(
        item.licensePlate
      );

    const p2 =
      normalize(
        item.forgalmi
      );

    if(
      !p1.includes(plate) &&
      !p2.includes(plate)
    ){

      return false;

    }

  }


  if(
    Number.isFinite(
      radiusMode
    )
  ){

    if(
      !Number.isFinite(
        item.gpsDistanceKm
      )
    ){

      return false;

    }


    if(
      item.gpsDistanceKm >
      radiusMode
    ){

      return false;

    }

  }


  return true;

}


function applyFilters(){

  for(
    const item of vehicleData
  ){

    item._visible =
      matchesFilters(
        item
      );

  }


  renderVehicles();

  refreshMarkers();

}


function setRadius(
  mode
){

  radiusMode =
    mode;


  document
    .querySelectorAll(
      ".radiusGrid button"
    )
    .forEach(
      btn=>{

        const v =
          btn.dataset.radius;


        const active =
          (
            v === "all" &&
            mode === Infinity
          ) ||
          Number(v) === mode;


        btn.classList.toggle(
          "active",
          active
        );

      }
    );


  if(
    Number.isFinite(mode) &&
    !myPos
  ){

    logLine(
      "A " +
      mode +
      " km-es GPS-szűréshez előbb GPS-helyzet szükséges."
    );

  }


  applyFilters();

}

/* ============================================================
   FONTOS: KÉSÉS / SIETÉS
   ============================================================ */

function delayHTML(
  delay
){

  /*
    NULL / UNDEFINED = nincs adat.

    0 = VALÓDI ADAT!
  */

  if(
    delay === null ||
    delay === undefined ||
    !Number.isFinite(
      Number(delay)
    )
  ){

    return "NINCS ADAT";

  }


  delay =
    Number(
      delay
    );


  const sec =
    Math.abs(
      Math.round(
        delay
      )
    );


  const min =
    Math.floor(
      sec / 60
    );


  const s =
    String(
      sec % 60
    ).padStart(
      2,
      "0"
    );


  if(
    delay < 0
  ){

    return (
      '<span class="delay-red">' +
      '🔴 SIETÉS −' +
      min +
      ":" +
      s +
      "</span>"
    );

  }


  if(
    delay > 0
  ){

    return (
      '<span class="delay-blue">' +
      '🔵 KÉSÉS +' +
      min +
      ":" +
      s +
      "</span>"
    );

  }


  return (
    '<span class="delay-green">' +
    "🟢 0:00" +
    "</span>"
  );

}


/* ============================================================
   FONTOS KÉSÉS-VÉDELEM
   ============================================================ */

/*
  Ha egy frissítésből nincs delay,
  NEM írunk automatikusan nullát.

  Így:
      valódi 0  -> zöld 0:00
      null      -> NINCS ADAT
      -12       -> SIETÉS -0:12
      +45       -> KÉSÉS +0:45
*/

function preserveRealDelay(
  oldValue,
  newValue
){

  if(
    newValue !== null &&
    newValue !== undefined &&
    Number.isFinite(
      Number(newValue)
    )
  ){

    return Number(
      newValue
    );

  }


  if(
    oldValue !== null &&
    oldValue !== undefined &&
    Number.isFinite(
      Number(oldValue)
    )
  ){

    return Number(
      oldValue
    );

  }


  return null;

}

/* ============================================================
   LISTA
   ============================================================ */

function renderVehicles(){

  const list =
    $("vehicleList");


  list.innerHTML =
    "";


  let shown =
    0;


  for(
    let i=0;
    i<vehicleData.length;
    i++
  ){

    const item =
      vehicleData[i];


    item._visible =
      matchesFilters(
        item
      );


    if(
      !item._visible
    ){

      continue;

    }


    list.appendChild(
      vehicleCard(
        item
      )
    );


    shown++;

  }


  $("shownCount").textContent =
    shown.toLocaleString(
      "hu-HU"
    );


  $("vehicleCount").textContent =
    vehicleData.length.toLocaleString(
      "hu-HU"
    );

}

function routeAllVehicles(){

    !route

    logLine(
      "VONAL ÖSSZES: előbb írj be egy járat- vagy routeId-értéket."
    );


    $("routeSearch").focus();

    return;

  }


  $("universalSearch")
    .value = "";


  $("plateSearch")
    .value = "";


  radiusMode =
    Infinity;


  document
    .querySelectorAll(
      ".radiusGrid button"
    )
    .forEach(
      btn=>{

        btn.classList.toggle(
          "active",
          btn.dataset.radius === "all"
        );

      }
    );


  applyFilters();


  const count =
    vehicleData.filter(
      v =>
        matchesFilters(v)

  logLine(
    "VONAL ÖSSZES: " +

        autoTimer
      );

      autoTimer =
        null;

    }


    $("autoBtn")
      .textContent =
      "AUTO";


    logLine(
      "AUTO frissítés leállítva."
    );


    return;

  }


  if(
    !getKey()

    logLine(
      "AUTO nem indul: nincs API-kulcs."
    );


    return;

  }


  autoRunning =
    true;


  $("autoBtn")
    .textContent =
    "AUTO STOP";


  logLine(
    "AUTO frissítés: 10 másodperc."

  testFeed();
