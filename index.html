<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FUTÁR V5 FULL GTFS ENGINE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; background:#0b0f14; color:#e6f1ff; }
header { padding:12px; background:#111826; display:flex; justify-content:space-between; }
.container { display:grid; grid-template-columns:340px 1fr; height:calc(100vh - 50px); }

.sidebar { padding:10px; background:#0f1622; overflow:auto; border-right:1px solid #1f2a3a; }
.main { display:flex; flex-direction:column; }

input, button {
  width:100%; padding:10px; margin:5px 0;
  border-radius:6px; border:none;
}

button { background:#1f6feb; color:white; cursor:pointer; }

.board { flex:1; overflow:auto; padding:10px; }

.row {
  display:grid;
  grid-template-columns:60px 1fr 80px 120px 120px;
  padding:8px;
  border-bottom:1px solid #1f2a3a;
  font-size:13px;
}

.small { font-size:11px; opacity:0.6; }

#map { height:100%; }

.ok { color:#2ecc71; }
.early { color:red; }
.late { color:#4aa3ff; }
</style>
</head>

<body>

<header>
  <div>🚍 FUTÁR V5 FULL GTFS ENGINE</div>
  <div id="clock"></div>
</header>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

  <input type="file" id="gtfsFile"/>
  <button onclick="loadGTFS()">GTFS ZIP BETÖLTÉS</button>

  <input id="stopSearch" placeholder="Megálló keresés..." oninput="filterStops()"/>

  <div id="stopList"></div>

</div>

<!-- MAIN -->
<div class="main">
  <div id="map"></div>
  <div class="board" id="board"></div>
</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>

// ---------------- MAP ----------------
const map = L.map("map").setView([47.4979,19.0402], 12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

// ---------------- DATA ----------------
let GTFS = {stops:[], trips:[], stopTimes:[]};
let vehicles = [];
let markers = {};
let selectedStop = null;

// ---------------- CLOCK ----------------
setInterval(()=>{
  document.getElementById("clock").innerText = new Date().toLocaleTimeString();
},1000);

// ---------------- DISTANCE ----------------
function distanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLon = (lon2-lon1)*Math.PI/180;

  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)**2;

  return R * (2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}

// ---------------- GTFS LOAD ----------------
async function loadGTFS(){
  const file = document.getElementById("gtfsFile").files[0];
  if(!file) return alert("Nincs ZIP");

  const zip = await JSZip.loadAsync(file);

  const stopsTxt = await zip.file("stops.txt").async("string");
  const tripsTxt = await zip.file("trips.txt").async("string");
  const stopTimesTxt = await zip.file("stop_times.txt").async("string");

  GTFS.stops = Papa.parse(stopsTxt,{header:true}).data;
  GTFS.trips = Papa.parse(tripsTxt,{header:true}).data;
  GTFS.stopTimes = Papa.parse(stopTimesTxt,{header:true}).data;

  renderStops();
  initVehicles();
}

// ---------------- STOPS ----------------
function renderStops(){
  const div = document.getElementById("stopList");
  div.innerHTML = "";

  GTFS.stops.slice(0,50).forEach(s=>{
    if(!s.stop_name) return;

    const el = document.createElement("div");
    el.style.padding="6px";
    el.style.borderBottom="1px solid #1f2a3a";
    el.style.cursor="pointer";

    el.innerHTML = `
      <b>${s.stop_name}</b><br>
      <span class="small">${s.stop_id} | ${s.stop_lat}, ${s.stop_lon}</span>
    `;

    el.onclick = ()=>selectStop(s);
    div.appendChild(el);
  });
}

// ---------------- STOP SELECT ----------------
function selectStop(stop){
  selectedStop = stop;

  map.setView([stop.stop_lat, stop.stop_lon], 14);

  L.marker([stop.stop_lat, stop.stop_lon]).addTo(map);

  renderBoard();
}

// ---------------- VEHICLES ----------------
function initVehicles(){
  vehicles = GTFS.trips.slice(0,10).map((t,i)=>({
    id: t.trip_id,
    lat: 47.49 + Math.random()*0.1,
    lng: 19.04 + Math.random()*0.1,
    speed: 20 + Math.random()*40
  }));
}

// ---------------- LIVE UPDATE ----------------
setInterval(()=>{

  vehicles.forEach(v=>{
    v.lat += (Math.random()-0.5)*0.002;
    v.lng += (Math.random()-0.5)*0.002;

    if(!markers[v.id]){
      markers[v.id] = L.marker([v.lat,v.lng]).addTo(map);
    } else {
      markers[v.id].setLatLng([v.lat,v.lng]);
    }
  });

  renderBoard();

},2000);

// ---------------- ETA ----------------
function ETA(stop, vehicle){
  const d = distanceMeters(stop.stop_lat, stop.stop_lon, vehicle.lat, vehicle.lng);
  return {
    meters: Math.round(d),
    sec: Math.round(d / 8) // ~30 km/h
  };
}

// ---------------- BOARD ----------------
function renderBoard(){
  if(!selectedStop) return;

  const board = document.getElementById("board");
  board.innerHTML = "";

  vehicles.forEach(v=>{

    const eta = ETA(selectedStop, v);

    let cls = "ok";
    if(eta.sec < 60) cls="early";
    if(eta.sec > 300) cls="late";

    board.innerHTML += `
      <div class="row">
        <div>${v.id}</div>
        <div>LIVE VEHICLE</div>
        <div>${Math.round(v.speed)} km/h</div>
        <div class="${cls}">${eta.meters} m</div>
        <div class="${cls}">${eta.sec} mp</div>
      </div>
    `;
  });
}

// ---------------- SEARCH ----------------
function filterStops(){
  const q = document.getElementById("stopSearch").value.toLowerCase();

  document.querySelectorAll("#stopList div").forEach(el=>{
    el.style.display = el.innerText.toLowerCase().includes(q) ? "block":"none";
  });
}

</script>

</body>
</html>
