<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FUTÁR V3 LIVE TRACKING</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

#app{
padding:20px;
max-width:900px;
margin:auto;
}

input,button{
width:100%;
padding:10px;
margin-top:8px;
border-radius:6px;
border:none;
}

button{
background:#2563eb;
color:white;
font-weight:bold;
cursor:pointer;
}

.row{
display:flex;
justify-content:space-between;
padding:8px;
border-bottom:1px solid #2b3a55;
}

small{opacity:0.7}
</style>
</head>

<body>

<div id="app">

<h2>🚏 FUTÁR V3 LIVE TRACKING</h2>

<input id="q" placeholder="Megálló keresés">
<button onclick="search()">Keresés</button>

<h3 id="stop"></h3>
<div id="out"></div>

</div>

<script>

async function search(){

const q=document.getElementById("q").value;

const res=await fetch("http://localhost:3000/api/stop/"+q);
const data=await res.json();

if(data.error){
document.getElementById("out").innerHTML="❌ nincs találat";
return;
}

document.getElementById("stop").innerText=data.stop;

let html="";

data.departures.forEach(d=>{

html+=`
<div class="row">
<div>
<b>${d.route}</b><br>
<small>${d.time}</small>
</div>

<div>
${d.live ? "🟢 LIVE" : "⚪ STATIC"}
<br>
<small>lat: ${d.live?.lat?.toFixed(4) || "-"}</small>
</div>
</div>
`;

});

document.getElementById("out").innerHTML=html;

}

</script>

</body>
</html>
