<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>GTFS REAL DATA CORE V2</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:#e5e7eb;
}

header{
    background:#111827;
    padding:10px;
    font-weight:bold;
}

.container{
    display:grid;
    grid-template-columns:320px 1fr;
    height:80vh;
}

.left{
    background:#1f2937;
    padding:10px;
    overflow:auto;
}

.right{
    padding:10px;
}

.box{
    background:#111827;
    padding:10px;
    margin-bottom:10px;
    border-radius:6px;
}

.item{
    background:#374151;
    padding:6px;
    margin:4px 0;
    border-radius:5px;
    cursor:pointer;
}

.item:hover{
    background:#4b5563;
}

input{
    width:100%;
    padding:8px;
    margin-bottom:10px;
    border:none;
    border-radius:5px;
}

.log{
    height:20vh;
    overflow:auto;
    background:#0f172a;
    padding:8px;
    font-size:12px;
}
</style>
</head>

<body>

<header>
🚍 GTFS REAL DATA CORE V2
</header>

<div class="container">

<!-- LEFT -->
<div class="left">

<div class="box">
<h3>📂 GTFS FILES</h3>

<label>stops.txt</label>
<input type="file" id="stopsFile">

<label>stop_times.txt</label>
<input type="file" id="timesFile">

<button onclick="loadGTFS()">LOAD GTFS</button>
</div>

<div class="box">
<h3>🔍 STOP SEARCH</h3>
<input id="search"
placeholder="pl: Nád utca"
oninput="searchStops(this.value)">
</div>

<div class="box">
<h3>🚏 STOPS</h3>
<div id="stops"></div>
</div>

</div>

<!-- RIGHT -->
<div class="right">

<div class="box">
<h3>📍 SELECTED STOP</h3>
<div id="selected">nincs</div>
</div>

<div class="box">
<h3>⏱ VALÓS INDULÁSOK</h3>
<div id="departures">nincs adat</div>
</div>

<div class="box">
<h3>🧠 ENGINE STATUS</h3>
<div id="engine">idle</div>
</div>

</div>

</div>

<div class="log" id="log"></div>

<script>

/* =========================
   STATE
========================= */

let GTFS = {
    stops: [],
    stop_times: []
};

/* =========================
   LOG
========================= */

function log(msg){
    document.getElementById("log").innerHTML += msg + "<br>";
}

/* =========================
   NORMALIZE
========================= */

function norm(t){
    return t.toLowerCase()
        .normalize("NFD")
        .replace(/\p{Diacritic}/gu, "");
}

/* =========================
   CSV PARSER
========================= */

function parseCSV(text){

    let lines = text.split("\n");

    let headers = lines[0].split(",");

    let rows = [];

    for(let i=1;i<lines.length;i++){

        let row = lines[i].split(",");

        if(row.length < headers.length) continue;

        let obj = {};

        headers.forEach((h,index)=>{
            obj[h.trim()] = row[index]?.trim();
        });

        rows.push(obj);
    }

    return rows;
}

/* =========================
   LOAD FILE
========================= */

function readFile(file){

    return new Promise((resolve)=>{

        let reader = new FileReader();

        reader.onload = e => resolve(e.target.result);

        reader.readAsText(file);
    });
}

/* =========================
   LOAD GTFS
========================= */

async function loadGTFS(){

    let stopsFile =
        document.getElementById("stopsFile").files[0];

    let timesFile =
        document.getElementById("timesFile").files[0];

    if(!stopsFile || !timesFile){
        alert("Töltsd be a GTFS fájlokat");
        return;
    }

    log("Loading GTFS...");

    let stopsText = await readFile(stopsFile);
    let timesText = await readFile(timesFile);

    GTFS.stops = parseCSV(stopsText);
    GTFS.stop_times = parseCSV(timesText);

    log("Stops loaded: " + GTFS.stops.length);
    log("Stop times loaded: " + GTFS.stop_times.length);

    renderStops(GTFS.stops);

    document.getElementById("engine").innerText =
        "GTFS loaded";
}

/* =========================
   RENDER STOPS
========================= */

function renderStops(list){

    let html = "";

    list.slice(0,300).forEach(s=>{

        html += `
        <div class="item"
             onclick="selectStop('${s.stop_id}')">

            🚏 ${s.stop_name}

        </div>`;
    });

    document.getElementById("stops").innerHTML = html;
}

/* =========================
   SEARCH
========================= */

function searchStops(q){

    let query = norm(q);

    let results = GTFS.stops.filter(s=>{

        return norm(s.stop_name || "")
            .includes(query);

    });

    renderStops(results);

    document.getElementById("engine").innerText =
        "Search results: " + results.length;
}

/* =========================
   SELECT STOP
========================= */

function selectStop(stopId){

    let stop =
        GTFS.stops.find(s=>s.stop_id===stopId);

    if(!stop) return;

    document.getElementById("selected").innerText =
        stop.stop_name;

    log("Selected stop: " + stop.stop_name);

    renderDepartures(stopId);
}

/* =========================
   REAL DEPARTURES
========================= */

function renderDepartures(stopId){

    let deps =
        GTFS.stop_times.filter(t=>t.stop_id===stopId);

    deps.sort((a,b)=>
        (a.departure_time || "")
        .localeCompare(b.departure_time || "")
    );

    let html = "";

    deps.slice(0,20).forEach(d=>{

        html += `
        <div class="item">
            🕒 ${d.departure_time}
            <br>
            Trip: ${d.trip_id}
        </div>`;
    });

    document.getElementById("departures").innerHTML =
        html || "nincs indulás";

    document.getElementById("engine").innerText =
        "Departures calculated";
}

/* =========================
   INIT
========================= */

log("GTFS REAL DATA CORE V2 READY");

</script>

</body>
</html>
