<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATTILA FULL TRANSPORT ENGINE (TRACKING)</title>

<style>
body { font-family: Arial; background:#0b1220; color:white; padding:15px }
h1 { margin-bottom:10px }
button { padding:10px; border:none; border-radius:8px; margin:5px; background:#22c55e; color:white; font-weight:bold }
input { padding:10px; border-radius:8px; width:80% }
.card { background:#1e293b; padding:10px; border-radius:10px; margin-top:10px }
.bus { color:#22c55e }
.train { color:#60a5fa }
.warn { color:red }
</style>

</head>
<body>

<h1>🚍 ATTILA REALTIME VEHICLE TRACKING</h1>

<input type="file" id="zipInput" accept=".zip">
<button onclick="loadZIP()">📦 GTFS ZIP</button>
<button onclick="getLocation()">📍 Saját hely</button>
<button onclick="startTracking()">🚀 TRACKING START</button>

<br><br>
<input id="q" placeholder="Megálló keresés..." />
<button onclick="search()">🔍</button>

<div id="me"></div>
<div id="out"></div>
<div id="vehicles"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>

let STOPS=[];
let VEHICLES=[];
let MY={lat:null,lon:null};

// 📍 HELYZET
function getLocation(){
  navigator.geolocation.getCurrentPosition(pos=>{
    MY.lat=pos.coords.latitude;
    MY.lon=pos.coords.longitude;

    document.getElementById("me").innerHTML=
      `<div class='card'>📍 ${MY.lat.toFixed(6)}, ${MY.lon.toFixed(6)}</div>`;
  });
}

// 📦 ZIP LOAD
async function loadZIP(){
  let file=document.getElementById("zipInput").files[0];
  if(!file) return alert("Nincs ZIP!");

  let zip=await JSZip.loadAsync(file);
  let stopsFile=Object.keys(zip.files).find(f=>f.includes("stops.txt"));

  let txt=await zip.file(stopsFile).async("string");

  let lines=txt.split("\n");
  let h=lines[0].split(",");

  let iId=h.indexOf("stop_id");
  let iName=h.indexOf("stop_name");
  let iLat=h.indexOf("stop_lat");
  let iLon=h.indexOf("stop_lon");

  for(let i=1;i<lines.length;i++){
    let r=lines[i].split(",");
    if(r.length<4) continue;

    STOPS.push({
      id:r[iId],
      name:r[iName],
      lat:parseFloat(r[iLat]),
      lon:parseFloat(r[iLon])
    });
  }

  localStorage.setItem("STOPS",JSON.stringify(STOPS));
  alert("✔ "+STOPS.length+" megálló");
}

// AUTO LOAD
(function(){
  let s=localStorage.getItem("STOPS");
  if(s) STOPS=JSON.parse(s);
})();

// 🧠 SEARCH
function norm(t){
  return (t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function search(){
  let q=norm(document.getElementById("q").value);

  let res=STOPS.filter(s=>norm(s.name).includes(q)).slice(0,20);

  document.getElementById("out").innerHTML=
    res.map(s=>`
      <div class='card'>
        <b>${s.name}</b><br>
        🆔 ${s.id}<br>
        📍 ${s.lat.toFixed(6)}, ${s.lon.toFixed(6)}
      </div>
    `).join("");
}

// 🚀 VEHICLE TRACKING (SIMULÁLT)
function startTracking(){

  if(STOPS.length===0) return alert("Nincs adat!");

  VEHICLES=[];

  // random járművek generálása
  for(let i=0;i<10;i++){
    let s=STOPS[Math.floor(Math.random()*STOPS.length)];

    VEHICLES.push({
      id:i,
      lat:s.lat,
      lon:s.lon,
      type: Math.random()>0.5?"bus":"train"
    });
  }

  setInterval(updateVehicles,2000);
}

function updateVehicles(){

  VEHICLES.forEach(v=>{
    v.lat += (Math.random()-0.5)*0.001;
    v.lon += (Math.random()-0.5)*0.001;
  });

  renderVehicles();
}

function renderVehicles(){

  document.getElementById("vehicles").innerHTML = VEHICLES.map(v=>{

    let icon = v.type==="bus" ? "🚍" : "🚆";
    let cls = v.type==="bus" ? "bus" : "train";

    return `
      <div class='card'>
        <span class='${cls}'>${icon} Jármű ${v.id}</span><br>
        📍 ${v.lat.toFixed(6)}, ${v.lon.toFixed(6)}
      </div>
    `;

  }).join("");
}

</script>

</body>
</html>
