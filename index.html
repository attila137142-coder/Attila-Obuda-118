<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🚦 ATTILA DISPATCH CORE V1 OFFLINE</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#0b0f14;
  color:#d7e1ea;
}

header {
  padding:10px;
  background:#111826;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:2px solid #1f2a3a;
}

h1 { font-size:16px; margin:0; }

.clock {
  font-weight:bold;
  color:#4dd0e1;
}

.container {
  display:grid;
  grid-template-columns: 320px 1fr;
  height: calc(100vh - 50px);
}

.panel {
  background:#0f1621;
  border-right:1px solid #1f2a3a;
  padding:10px;
  overflow:auto;
}

.main {
  padding:10px;
  overflow:auto;
}

input, button, textarea {
  width:100%;
  margin-top:6px;
  padding:8px;
  background:#111826;
  color:#fff;
  border:1px solid #2b3b52;
}

button {
  cursor:pointer;
  background:#1e88e5;
  font-weight:bold;
}

table {
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

td, th {
  border:1px solid #2b3b52;
  padding:6px;
  font-size:12px;
}

th {
  background:#111826;
  color:#4dd0e1;
}

.badge {
  padding:2px 6px;
  border-radius:4px;
  background:#1e88e5;
}

.small {
  font-size:11px;
  opacity:0.8;
}
</style>
</head>

<body>

<header>
  <h1>🚦 ATTILA DISPATCH CORE V1 (OFFLINE GTFS + BEÉGETETT ADAT)</h1>
  <div class="clock" id="clock"></div>
</header>

<div class="container">

<!-- LEFT PANEL -->
<div class="panel">

<h3>📦 GTFS BETÖLTÉS</h3>

<button onclick="loadDemo()">🟢 DEMO GTFS BETÖLTÉS</button>

<textarea id="gtfsInput" placeholder="GTFS CSV (stops.txt / routes.txt / stop_times.txt)..."></textarea>
<button onclick="saveGTFS()">💾 GTFS MENTÉS LOCALSTORAGE</button>
<button onclick="clearGTFS()">🗑 TÖRLÉS</button>

<hr/>

<h3>🔍 MEGÁLLÓ KERESŐ</h3>
<input id="search" placeholder="pl: Örs vezér tér" oninput="searchStops()"/>

<div id="results"></div>

</div>

<!-- MAIN -->
<div class="main">

<h2>🚏 DISPATCH VIEW</h2>
<div id="stopInfo">Nincs kiválasztott megálló</div>

<table>
<thead>
<tr>
<th>Járat</th>
<th>Indulás</th>
<th>Úticél</th>
<th>Státusz</th>
</tr>
</thead>
<tbody id="departures"></tbody>
</table>

</div>

</div>

<script>

// ===== CLOCK =====
setInterval(()=>{
  document.getElementById("clock").innerText =
    new Date().toLocaleTimeString();
},1000);

// ===== DEMO GTFS (BEÉGETETT) =====
const DEMO_GTFS = `
stops:
1,Örs vezér tere
2,Deák Ferenc tér
3,Kelenföld
4,Moszkva tér

routes:
100,Busz 100E
200,Metro M2

stop_times:
100,1,08:10,Deák Ferenc tér
100,1,08:25,Kelenföld
100,2,08:40,Örs vezér tere
200,2,09:00,Kelenföld
`;

// ===== STORAGE =====
let GTFS = loadGTFS();

function loadGTFS(){
  return JSON.parse(localStorage.getItem("gtfs") || "null");
}

// ===== SAVE =====
function saveGTFS(){
  const txt = document.getElementById("gtfsInput").value;
  localStorage.setItem("gtfs", JSON.stringify(txt));
  GTFS = txt;
  alert("GTFS elmentve!");
}

// ===== CLEAR =====
function clearGTFS(){
  localStorage.removeItem("gtfs");
  GTFS = null;
  alert("Törölve!");
}

// ===== DEMO LOAD =====
function loadDemo(){
  document.getElementById("gtfsInput").value = DEMO_GTFS;
  saveGTFS();
}

// ===== PARSER =====
function parseGTFS(text){
  if(!text) return null;

  const lines = text.split("\n").map(l=>l.trim()).filter(Boolean);

  let stops=[], routes=[], stopTimes=[];

  let mode="";

  for(let l of lines){
    if(l.startsWith("stops:")) {mode="stops"; continue;}
    if(l.startsWith("routes:")) {mode="routes"; continue;}
    if(l.startsWith("stop_times:")) {mode="stop_times"; continue;}

    const parts = l.split(",");

    if(mode==="stops"){
      stops.push({id:parts[0], name:parts[1]});
    }

    if(mode==="routes"){
      routes.push({id:parts[0], name:parts[1]});
    }

    if(mode==="stop_times"){
      stopTimes.push({
        route:parts[0],
        stop:parts[1],
        time:parts[2],
        dest:parts[3]
      });
    }
  }

  return {stops,routes,stopTimes};
}

// ===== SEARCH =====
function searchStops(){
  const q = document.getElementById("search").value.toLowerCase();
  const data = parseGTFS(GTFS || DEMO_GTFS);

  const res = data.stops.filter(s=>s.name.toLowerCase().includes(q));

  document.getElementById("results").innerHTML =
    res.map(r=>
      `<div onclick="selectStop('${r.id}','${r.name}')"
            style="cursor:pointer;padding:5px;border-bottom:1px solid #1f2a3a">
        🚏 ${r.name}
      </div>`
    ).join("");
}

// ===== SELECT STOP =====
function selectStop(id,name){
  const data = parseGTFS(GTFS || DEMO_GTFS);

  document.getElementById("stopInfo").innerHTML =
    `<h3>🚏 ${name}</h3><span class="small">stop_id: ${id}</span>`;

  const dep = data.stopTimes.filter(s=>s.stop==id);

  document.getElementById("departures").innerHTML =
    dep.map(d=>`
      <tr>
        <td><span class="badge">${d.route}</span></td>
        <td>${d.time}</td>
        <td>${d.dest}</td>
        <td>🟢 ON TIME (demo)</td>
      </tr>
    `).join("");
}

// ===== INIT =====
if(!GTFS){
  GTFS = DEMO_GTFS;
}

</script>

</body>
</html>
