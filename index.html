FUTÁR V5 LIVE CONTROL ROOM (HTML – FULL SINGLE FILE)
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FUTÁR V5 LIVE CONTROL ROOM</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f14;
    color: #d7e1ea;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 15px;
    background: #111826;
    border-bottom: 2px solid #1f2a3a;
}

.title {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
}

.clock {
    font-size: 16px;
    color: #4dd0e1;
}

.container {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    height: calc(100vh - 50px);
}

#map {
    height: 100%;
    width: 100%;
}

.panel {
    display: flex;
    flex-direction: column;
    border-left: 2px solid #1f2a3a;
    overflow: hidden;
}

.controls {
    padding: 10px;
    background: #0f1622;
    border-bottom: 1px solid #1f2a3a;
}

input, button {
    padding: 8px;
    margin: 4px;
    border: none;
    border-radius: 6px;
}

input {
    width: 95%;
    background: #1a2332;
    color: white;
}

button {
    background: #2b7cff;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #1f66d1;
}

.table {
    flex: 1;
    overflow-y: auto;
}

.row {
    padding: 8px;
    border-bottom: 1px solid #1f2a3a;
    display: flex;
    justify-content: space-between;
    font-size: 13px;
}

.badge {
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
}

.bkk { background: #1e88e5; }
.mav { background: #43a047; }
.volan { background: #fb8c00; }

.small {
    opacity: 0.7;
    font-size: 11px;
}
</style>
</head>

<body>

<header>
    <div class="title">🚦 FUTÁR V5 LIVE CONTROL ROOM</div>
    <div class="clock" id="clock">--:--:--</div>
</header>

<div class="container">
    <div id="map"></div>

    <div class="panel">
        <div class="controls">
            <input id="search" placeholder="Keresés: megálló / járat / GTFS ID..." />
            <button onclick="refresh()">🔄 Frissítés</button>
        </div>

        <div class="table" id="table"></div>
    </div>
</div>

<script>

// ---------------- MAP ----------------
const map = L.map('map').setView([47.4979, 19.0402], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: 'FUTÁR V5'
}).addTo(map);

// demo markers
const stops = [
    {name:"Deák Ferenc tér", lat:47.4975, lng:19.0540},
    {name:"Blaha Lujza tér", lat:47.4963, lng:19.0706},
    {name:"Kelenföld", lat:47.4641, lng:19.0227}
];

stops.forEach(s=>{
    L.marker([s.lat, s.lng]).addTo(map).bindPopup(s.name);
});

// ---------------- CLOCK ----------------
function updateClock(){
    const now = new Date();
    document.getElementById("clock").innerText = now.toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

// ---------------- DATA (SIMULATED GTFS) ----------------
const data = [
    {line:"7E", agency:"BKK", dest:"Blaha Lujza tér", eta:2},
    {line:"133E", agency:"BKK", dest:"Kelenföld", eta:6},
    {line:"M4", agency:"MÁV", dest:"Keleti pályaudvar", eta:4},
    {line:"Volán 105", agency:"Volánbusz", dest:"Érd", eta:9},
    {line:"BKK 9", agency:"BKK", dest:"Óbuda", eta:1},
];

// ---------------- RENDER ----------------
function render(filter=""){
    const table = document.getElementById("table");
    table.innerHTML = "";

    data
    .filter(d => d.line.toLowerCase().includes(filter.toLowerCase()) || d.dest.toLowerCase().includes(filter.toLowerCase()))
    .forEach(d=>{
        const div = document.createElement("div");
        div.className = "row";

        let badgeClass = d.agency==="BKK"?"bkk":d.agency==="MÁV"?"mav":"volan";

        div.innerHTML = `
            <div>
                <span class="badge ${badgeClass}">${d.agency}</span>
                <b> ${d.line}</b>
                <div class="small">${d.dest}</div>
            </div>
            <div>⏱ ${d.eta} min</div>
        `;
        table.appendChild(div);
    });
}

// ---------------- SEARCH ----------------
document.getElementById("search").addEventListener("input",(e)=>{
    render(e.target.value);
});

// ---------------- REFRESH ----------------
function refresh(){
    data.forEach(d=>{
        d.eta = Math.max(1, d.eta + Math.floor(Math.random()*3-1));
    });
    render(document.getElementById("search").value);
}

render();

</script>

</body>
</html>
